        role: both
        description: 任务阻塞与 Finding↔任务卡（MOD-MASTER-001 §2.2）
      - contract_id: CT-ORC-CE-001
        role: consumer
        description: 上下文构建请求
      - contract_id: CT-ORC-VMS-001
        role: consumer
        description: 任务输出写入向量库
      - contract_id: CT-ORC-GATE-001
        role: consumer
        description: 任务执行前/后门禁判定
      - contract_id: EXT-ORC-SANDBOX-001
