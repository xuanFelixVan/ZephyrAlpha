# ══════════════════════════════════════════════════════════
# P2: 模型岗位匹配矩阵
# ══════════════════════════════════════════════════════════
# 真源: data/brain/job_matrix.yaml
# 消费: src/zephyr/intelligence/model_profiling/job_matcher.py
#
# 设计原则:
#   1. 能力分级 A/B/C/D/F (compute_grade_simple)
#      A>=0.75 精通 | B>=0.60 熟练 | C>=0.45 合格 | D>=0.30 初级 | F<0.30 不胜任
#   2. required: 必须达到的最低分级, 任一不满足 = 不合格
#   3. bonus: 加分项, 达到则提升 match_score
#   4. max_hallucination: 岗位期望的幻觉率上限 (正常评分, 非硬门)
#      任何模型都有幻觉, Claude 也不例外; 此值仅作岗位匹配参考
#      未来岗位匹配时幻觉率权重较高, 但当前不做一票否决
#
# 能力名真源: CASES_BY_CAPABILITY (exam_test_cases.py) — 29 项
#
# 当前状态: 骨架 (6 示例岗位), 未来扩展
# ══════════════════════════════════════════════════════════

version: "1.0.0"
last_updated: "2026-06-27"

# 幻觉率九维 (参考 ChatGPT 建议 + 业界实践)
# JobMatcher 用这些维度做岗位匹配时的幻觉权重计算
# 权重总和 = 1.00, fabrication 仍为最重要维度
hallucination_dimensions:
  fabrication:
    description: "事实编造 — 编造不存在的 API/函数/文件/事实"
    weight: 0.20
  inconsistency:
    description: "输出不一致 — 同题两次回答差异大"
    weight: 0.15
  refusal:
    description: "过度拒绝 — 能答的拒答"
    weight: 0.08
  overclaim:
    description: "过度声称 — 声称做了没做的事"
    weight: 0.12
  context_drift:
    description: "上下文漂移 — 两次输出键集不同 (忘记指令结构)"
    weight: 0.12
  source_confusion:
    description: "来源混淆 — 把 A 文件内容归给 B"
    weight: 0.12
  instruction_drift:
    description: "指令偏离 — 输出结构不符合 expected_structure_keys"
    weight: 0.10
  format_hallucination:
    description: "格式幻觉 — 字段值类型异常 (如 list 字段给了 stringified JSON)"
    weight: 0.06
  quantity_hallucination:
    description: "数量幻觉 — 输出集合异常膨胀 (list/dict 长度超阈值)"
    weight: 0.05

# 成本维度 (D-MCE-07: 成本是维度非硬门; claude 贵但必要时仍可用)
# JobMatcher 用此配置计算 cost_score, 在 match_score 中占 10% 权重
# 本地模型成本≈0; 云端按 provider_data.py 定价估算
cost_dimension:
  weight: 0.10
  description: "成本是维度非硬门; 本地模型≈0, 云端按 API 定价"
  free_threshold: 0.01      # cost <= 0.01 USD → cost_score=1.0 (近似免费, 如 zhipu)
  expensive_threshold: 1.0  # cost >= 1.0 USD  → cost_score=0.0 (昂贵)

jobs:
  # ── 初级岗位 ──────────────────────────────────

  junior_code_worker:
    title: "初级代码工"
    description: "修简单 bug、做小重构, 幻觉率可容忍中等"
    required:
      code_edit_precision: "C"
      refactor: "D"
    bonus:
      dead_code_removal: "C"
      code_generate: "D"
      naming_suggest: "C"
    max_hallucination: 0.40
    max_cost: 0.05
    category: "entry"

  doc_organizer:
    title: "文档整理员"
    description: "摘要提取、命名建议、标签补全, 需要一定准确性"
    required:
      summary_extraction: "C"
      naming_suggest: "C"
      tag_completion: "C"
    bonus:
      task_classification: "C"
      long_context_recall: "C"
    max_hallucination: 0.30
    max_cost: 0.05
    category: "entry"

  # ── 中级岗位 ──────────────────────────────────

  refactor_specialist:
    title: "重构专家"
    description: "中大型重构、跨文件改造、死代码清理"
    required:
      refactor: "B"
      code_edit_precision: "B"
    bonus:
      impact_analysis: "C"
      dead_code_removal: "C"
      cross_file_refactor: "C"
      dependency_trace: "C"
    max_hallucination: 0.25
    max_cost: 0.20
    category: "mid"

  code_generator:
    title: "代码生成手"
    description: "代码生成、自审自纠、错误恢复"
    required:
      code_generate: "B"
    bonus:
      code_edit_precision: "C"
      self_review: "C"
      error_recovery: "C"
      incremental_execution: "C"
    max_hallucination: 0.30
    max_cost: 0.20
    category: "mid"

  # ── 高级岗位 (要求低幻觉) ─────────────────────

  rule_gatekeeper:
    title: "规则守门员"
    description: "规则合规检查、幻觉检测、异常分诊 — 要求低幻觉"
    required:
      rule_comprehension: "C"
      hallucination_detect: "B"
    bonus:
      anomaly_triage: "C"
      safety_judgment: "C"
      self_review: "C"
    max_hallucination: 0.15
    category: "senior"
    note: "岗位性质要求低幻觉, 但非硬门 — 正常评分, 权重较高"

  architecture_reviewer:
    title: "架构审查员"
    description: "架构设计评审、依赖分析、影响评估 — 要求低幻觉"
    required:
      architecture_design: "B"
      impact_analysis: "B"
    bonus:
      circular_dependency_detect: "C"
      dependency_trace: "C"
      hallucination_detect: "B"
      rollback_boundary_design: "C"
    max_hallucination: 0.15
    max_cost: 1.00
    category: "senior"
    note: "岗位性质要求低幻觉, 但非硬门 — 正常评分, 权重较高"

# ══════════════════════════════════════════════════════════
