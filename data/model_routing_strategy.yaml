  recommended_reason: "6项安全能力最多，费用仅¥0.056/次，P50=4.6s可接受"

  # 本地备选（网络不可用时）
  local_fallback: "qwen2.5-coder:14b"
  local_fallback_reason: "本地最佳模型，4项安全能力，P50=3s，免费"

  # 不可路由的大脑任务
  blocked_tasks:
