# ============================================================
# 全局策略
# ============================================================
global_strategy:
  # 优先级链：本地安全模型 > API flash模型 > API pro模型 > Claude/人类
  priority_chain:
    - "local_safe_model"
    - "api_flash_model"
    - "api_pro_model"
    - "claude_or_human"

  # 本地模型优先原则
  local_first: true
  local_reason: "本地模型免费、无网络延迟、数据不出域"

  # API模型选择原则
  api_prefer_flash: true
  api_reason: "flash费用低（¥0.013-0.056 vs pro ¥0.041-0.200），安全能力更多或相当"

  # 不可路由能力（所有模型都不安全）
  unroutable_capabilities:
    - "task_classification"
    - "anomaly_triage"
    - "code_fix"
  unroutable_action: "交给Claude Opus或人类处理"
  unroutable_reason: "8个模型全部F级，无模型能胜任"

# ============================================================
# 大脑系统推理后端选择
