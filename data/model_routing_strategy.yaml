# 模型路由策略 — 基于能力护照（CapabilityPassport）
# 真源：data/brain/passports/*.json（8份护照）
# 生成时间：2026-06-24
# 生成依据：1份新版护照（V4 Pro non-thinking, 33项能力）+ 7份旧版护照（9项能力）
# 策略原则：分两阶段——建设期速度优先，维护期成本优先
# 注意：仅 deepseek-v4-pro-non-thinking 完成了33项能力考试；其余7个模型仍是旧版9项能力数据，待补跑

version: "3.0.0"
generated_at: "2026-06-24"
passport_source: "data/brain/passports/"
data_coverage:
  full_33_capability: ["deepseek-v4-pro-non-thinking"]
  legacy_9_capability: ["deepseek-v4-flash-non-thinking", "deepseek-v4-flash-thinking", "deepseek-v4-pro-thinking", "qwen3:8b", "deepseek-r1:8b", "deepseek-r1:14b", "qwen2.5-coder:14b"]
  note: "其余7个模型待p7补跑33项能力考试后更新"

# ============================================================
# 两阶段策略
# ============================================================
phases:
  # --- 阶段1：建设期（当前）—— 速度优先 ---
  phase_1_construction:
    name: "建设期"
    principle: "速度优先 + 能力覆盖优先"
    description: "系统建设阶段，优先选择最快且能力覆盖最全的模型"
    active: true
    
    # 模型选择规则：选最快的安全模型，能力覆盖优先于费用
    selection_rule: "for each capability, pick the model with lowest P50 latency among safe models; V4 Pro non-thinking is primary due to 26/33 safe capabilities"
    
    # 模型职责分配
    model_assignments:
      deepseek-v4-pro-non-thinking:
        role: "全能主力（33项能力考试 grade=A）"
        capabilities: "26项safe（详见capability_routing）"
        p50_latency_ms: 2177
        overall_grade: "A"
        overall_score: 0.897
        reason: "33项能力考试最优；26项safe；breadth 33/33全通过"
      
      deepseek-v4-flash-non-thinking:
        role: "快速轻量任务备选（仅9项能力数据）"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 1867
        reason: "最快（1.9s）+ 4项安全能力；但仅9项能力数据"
      
      deepseek-v4-flash-thinking:
        role: "深度推理专用（仅9项能力数据）"
        capabilities: ["tag_completion", "naming_suggest"]
        p50_latency_ms: 4568
        reason: "tag_completion唯一安全模型；naming_suggest最快安全模型"
      
      qwen2.5-coder:14b:
        role: "本地降级备选（网络不可用时）"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 2985
        reason: "本地最佳，网络断时降级使用"
      
      claude_or_human:
        role: "不可路由任务处理"
        capabilities: ["task_classification", "anomaly_triage", "cross_file_analysis", "cross_file_refactor", "dependency_trace"]
        reason: "V4 Pro unsafe + 其余模型无数据，必须交给Claude Opus或人类"
    
    # 不使用的模型（建设期淘汰）
    retired_models:
      - model: "deepseek-v4-pro-thinking"
        reason: "P50=7.8s慢于flash-thinking(4.6s)，费用高4倍，安全能力少2项；且仅9项能力数据"
      - model: "qwen3:8b"
        reason: "P50=9.3s过慢，仅2项安全能力"
      - model: "deepseek-r1:8b"
        reason: "P50=11.1s最慢，仅3项安全能力"
      - model: "deepseek-r1:14b"
        reason: "P50=10.9s过慢，仅2项安全能力"

  # --- 阶段2：维护期 —— 成本优先 ---
  phase_2_maintenance:
    name: "维护期"
    principle: "成本优先"
    description: "系统稳定运行后，优先使用免费本地模型，API模型仅用于本地不安全的能力"
    active: false
    
    # 模型选择规则：本地优先 → API flash → V4 Pro → Claude
    selection_rule: "local_safe_model → api_flash_model → v4_pro_non_thinking → claude_or_human"
    
    # 模型职责分配
    model_assignments:
      qwen2.5-coder:14b:
        role: "本地主力（仅9项能力数据，待补跑33项）"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 2985
        cost_per_call: 0.0
        reason: "本地免费+4项安全能力+P50=3s可接受"
      
      qwen3:8b:
        role: "本地补充"
        capabilities: ["naming_suggest", "dead_code_removal"]
        p50_latency_ms: 9309
        cost_per_call: 0.0
        reason: "本地免费，覆盖qwen2.5-coder不安全的能力"
      
      deepseek-v4-flash-thinking:
        role: "API补充（本地不安全的能力）"
        capabilities: ["tag_completion"]
        p50_latency_ms: 4568
        cost_per_call: 0.056
        reason: "tag_completion唯一安全模型，无法本地替代"
      
      deepseek-v4-pro-non-thinking:
        role: "API全能备选（33项能力26项safe）"
        capabilities: "26项safe（详见capability_routing）"
        p50_latency_ms: 2177
        cost_per_call: 0.041
        reason: "本地不安全的能力降级到V4 Pro；33项能力覆盖最全"
      
      claude_or_human:
        role: "不可路由任务处理"
        capabilities: ["task_classification", "anomaly_triage", "cross_file_analysis", "cross_file_refactor", "dependency_trace"]
        reason: "V4 Pro unsafe + 其余模型无数据"

  # --- 门闸：阶段1 → 阶段2 切换条件 ---
  phase_gate:
    gate_name: "CONSTRUCTION_TO_MAINTENANCE_GATE"
    description: "建设期→维护期切换门闸"
    
    # 唯一硬条件：Owner 批准
    condition: "owner_approval"
    condition_description: "Owner 确认系统全部搭建完成 + 实盘测试已开始，批准切换到维护期"
    
    # 触发前提（Owner 批准前应已满足的状态，非机械硬条件）
    prerequisites:
      - "业务域全部搭建完成并正常运行"
      - "实盘测试已开始（标志系统全部搭建完成）"
      - "8个模型全部完成33项能力考试（当前仅1/8完成）"
    
    # 日常监控指标（非门闸条件，仅作健康参考）
    health_indicators:
      - id: "H1"
        name: "大脑系统18步启动"
        command: "python scripts/construction/start_brain.py --status"
      - id: "H2"
        name: "AutoPilot 自动驾驶稳定性"
        command: "检查 autopilot 日志"
      - id: "H3"
        name: "门控检查通过率"
        command: "python scripts/governance/phase_manager.py --status"
      - id: "H4"
        name: "系统级故障频率"
        command: "检查 incident_log"
    
    switch_action: "Owner 批准后，将 phase_1_construction.active 设为 false，phase_2_maintenance.active 设为 true"

