# 模型路由策略 — 基于能力护照（CapabilityPassport）
# 真源：data/brain/passports/*.json（8份护照）
# 生成时间：2026-06-23
# 生成依据：4本地模型 + 4 API模型入职考试结果
# 策略原则：分两阶段——建设期速度优先，维护期成本优先

version: "2.0.0"
generated_at: "2026-06-23"
passport_source: "data/brain/passports/"

# ============================================================
# 两阶段策略
# ============================================================
phases:
  # --- 阶段1：建设期（当前）—— 速度优先 ---
  phase_1_construction:
    name: "建设期"
    principle: "速度优先"
    description: "系统建设阶段，优先选择最快的模型，不考虑成本"
    active: true
    
    # 模型选择规则：选最快的安全模型
    selection_rule: "for each capability, pick the model with lowest P50 latency among safe models"
    
    # 模型职责分配
    model_assignments:
      deepseek-v4-flash-non-thinking:
        role: "通用快速推理主力"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 1867
        reason: "最快（1.9s）+ 4项安全能力"
      
      deepseek-v4-flash-thinking:
        role: "深度推理专用"
        capabilities: ["tag_completion", "naming_suggest"]
        p50_latency_ms: 4568
        reason: "tag_completion唯一安全模型；naming_suggest最快安全模型"
      
      qwen2.5-coder:14b:
        role: "本地降级备选（网络不可用时）"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 2985
        reason: "本地最佳，网络断时降级使用"
      
      claude_or_human:
        role: "不可路由任务处理"
        capabilities: ["task_classification", "anomaly_triage", "code_fix"]
        reason: "8个模型全部F级，必须交给Claude Opus或人类"
    
    # 不使用的模型（建设期淘汰）
    retired_models:
      - model: "deepseek-v4-pro-thinking"
        reason: "P50=7.8s慢于flash-thinking(4.6s)，费用高4倍，安全能力少2项"
      - model: "deepseek-v4-pro-non-thinking"
        reason: "P50=2.0s略慢于flash-non-thinking(1.9s)，费用高3倍，安全能力少1项"
      - model: "qwen3:8b"
        reason: "P50=9.3s过慢，仅2项安全能力"
      - model: "deepseek-r1:8b"
        reason: "P50=11.1s最慢，仅3项安全能力"
      - model: "deepseek-r1:14b"
        reason: "P50=10.9s过慢，仅2项安全能力"

  # --- 阶段2：维护期 —— 成本优先 ---
  phase_2_maintenance:
    name: "维护期"
    principle: "成本优先"
    description: "系统稳定运行后，优先使用免费本地模型，API模型仅用于本地不安全的能力"
    active: false
    
    # 模型选择规则：本地优先 → API flash → Claude
    selection_rule: "local_safe_model → api_flash_model → claude_or_human"
    
    # 模型职责分配
    model_assignments:
      qwen2.5-coder:14b:
        role: "本地主力"
        capabilities: ["summary_extraction", "refactor", "code_generate", "dead_code_removal"]
        p50_latency_ms: 2985
        cost_per_call: 0.0
        reason: "本地免费+4项安全能力+P50=3s可接受"
      
      qwen3:8b:
        role: "本地补充"
        capabilities: ["naming_suggest", "dead_code_removal"]
        p50_latency_ms: 9309
        cost_per_call: 0.0
        reason: "本地免费，覆盖qwen2.5-coder不安全的能力"
      
      deepseek-v4-flash-thinking:
        role: "API补充（本地不安全的能力）"
        capabilities: ["tag_completion"]
        p50_latency_ms: 4568
        cost_per_call: 0.056
        reason: "tag_completion唯一安全模型，无法本地替代"
      
      claude_or_human:
        role: "不可路由任务处理"
        capabilities: ["task_classification", "anomaly_triage", "code_fix"]
        reason: "8个模型全部F级"

  # --- 门闸：阶段1 → 阶段2 切换条件 ---
  phase_gate:
    gate_name: "CONSTRUCTION_TO_MAINTENANCE_GATE"
    description: "当以下条件全部满足时，从建设期切换到维护期"
    conditions:
      - id: "G1"
        check: "大脑系统18步启动全部通过"
        command: "python scripts/construction/start_brain.py --status"
        expected: "all 18 steps OK"
      
      - id: "G2"
        check: "AutoPilot 自动驾驶稳定运行24小时"
        command: "检查 autopilot 日志无 ERROR"
        expected: "0 errors in 24h"
      
      - id: "G3"
        check: "无 P0/P1 级别未完成任务卡"
        command: "查询 task_repository WHERE priority IN ('P0','P1') AND status != 'COMPLETED'"
        expected: "0 rows"
      
      - id: "G4"
        check: "46个门控检查全部通过"
        command: "python scripts/governance/phase_manager.py --status"
        expected: "all gates passed"
      
      - id: "G5"
        check: "连续7天无系统级故障"
        command: "检查 incident_log WHERE severity = 'system' AND timestamp > 7 days ago"
        expected: "0 rows"
    
    switch_action: "将 phase_1_construction.active 设为 false，phase_2_maintenance.active 设为 true"

