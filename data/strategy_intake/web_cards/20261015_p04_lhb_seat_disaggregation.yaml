caliber_pitfall_zh: >-
  (1) seat_type 值域英文（broker/institution/connect），中文文案谓词得伪零（本班踩过并已更正，原文进台账）；
  (2) 该表 data_source 只有 akshare，**无 live/replay 口径面** ⇒ 在册「replay 8596 行/live 73 行禁混」判据在此不可复用（本席派卷在 9 张表上实测 live=replay=0）；
  (3) buy_rank/sell_rank 是 Nullable(UInt8)：同一席位可同侧多次上榜，聚合金额前须决定是否按 rank 去重（本卡未去重，读数含多次上榜）；
  (4) symbol 是裸 6 位＋另有 symbol_canonical（在册 JOIN 键纪律适用）；主表 dragon_tiger 的标的列同为 symbol，北向表则只有 ts_code（无 symbol）⇒ 跨表 JOIN 键不统一，须 ① 席对表。
