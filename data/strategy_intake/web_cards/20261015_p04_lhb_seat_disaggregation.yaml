# ── 必备③ 逻辑描述
logic_zh: >-
  动机=⑨席 09 班在册空白轴「资金面分户」。**分户（by participant type）是本卡的本体**，
  不是"资金净流入"：本库已有的资金面卡 SIC-20261015-P04-06「smart_money_ratio」走的是
  逐笔/大单口径的主力-散户拆分（tick 级），而本卡走**披露级席位身份**拆分（谁在龙虎榜上买），
  两者原料、频率、可解释性都不同（互相关未测，已挂 self_flag 请 ⑥ 排闸）。
  三臂分考、禁合并报数：
  臂1 institution（机构专用席位）＝净买额 / 该臂买卖均额；
  臂2 broker（营业部，含游资与量化分仓）＝同式；
  臂3 connect（陆股通专用席位）＝同式＝北向在龙虎榜上的显性脚印。
  份额臂＝各臂买卖均额占全表买卖均额之比（业内把"谁在买"读作主信息的口径，见 gankinterview 命中）。
  为什么用比率而不是绝对净额（这条是本卡与直觉相反处，必须写明）：
  本班实测 net_amount 的**全表均值是负数**（avg=-11,865,915.00 元／近端月 avg=-4,486,914.98）⇒
  上榜席位整体结构性净卖出（减持与兑现为主），所以"净额>0"是稀缺事件而非可线性化的强度，
  绝对净额会被当日上榜家数与成交额直接放大 ⇒ 一律除以该臂自身买卖均额作相对化，
  份额臂则再除以全表，消除"今天上榜 63 只 vs 71 只"的规模差（本班实测近端中位 63 只／日）。
  方向先验（两派并存，禁本席择一，须由考试判）：
  一派读"机构席位净买＝知情买盘→正超额"（futunn 命中把机构席位活跃度上升与抢筹并列）；
  另一派读"游资/散户席位聚集＝筹码松动→负超额"（gankinterview 命中的拉萨团叙述）＋
  净额结构性为负这一实测事实暗示上榜本身即减持事件。两派在同一列上给相反符号 ⇒ 双臂并列呈 ⑥。
  ⚠ 本卡只主张"该轴原料存在且与池内 32 员正交"，**不主张**其有可交易 alpha。

# ── 必备④ 伪代码（本席自拟，禁按外部仓转录）
pseudocode: |
  # 输入：c1_market.dragon_tiger_seat（DESCRIBE 实测 14 列：trade_date Date, symbol String, seat_name String,
  #        buy_amount Dec(18,2), sell_amount Dec(18,2), net_amount Dec(18,2), buy_rank Nullable(UInt8),
  #        sell_rank Nullable(UInt8), seat_type LowCardinality(String), reason String, data_source LC(String), ingest_ts,
  #        exchange LC(String), symbol_canonical String）
  # ⚠⚠ 值域坑（本班自证）：seat_type 实际取值 = 'broker' / 'institution' / 'connect'（英文），
  #     **不是**中文「机构专用」。本席首版用 sumIf(net_amount, seat_type='机构专用') 得到全 0＝**伪零**，
  #     已重跑更正；凡按席位身份筛选一律先 GROUP BY seat_type 读值域，禁照抄披露文案的中文标签。
  SEAT = {'inst':'institution', 'brk':'broker', 'conn':'connect'}
  for d in 交易日:
      g_arm  = sumIf(buy_amount+sell_amount, seat_type=arm) / 2      # 该臂买卖均额（作分母）
      net_arm= sumIf(net_amount,            seat_type=arm)
      r[arm, d] = net_arm / g_arm                                   # 净买率∈[-1, +1]
      share[arm, d] = (2*g_arm) / sumIf(buy_amount+sell_amount, 全部臂)   # 份额臂
      # 缺测谓词（禁 0 填充）：g_arm==0 ⇒ r[arm,d] := NA
      #   本班实测：connect 臂 g_arm=0 的交易日 **11 天**（1155 天中）；institution 臂 g_arm=0 天数 **0**
      #   不写该谓词时，0/0 会被实现层写成 0 ⇒ 把"当日无该臂"伪装成"当日中性"，且 r_conn 实测会撞到 ±1 边界
      n_sym = countDistinct(symbol)          # 规模协变量：近端中位 63 只/日（须随因子一并上报，勿静默丢）
  # 面板→横截面（本班**未物化**，只登记构造，臂1–3 均为市场级日频序列）：
  #   sig_i[d] = net_amount 按 symbol 聚合（同票多席位先求和）/ 该股当日成交额  ⇒ 个股层须与市值/行业正交化后再考
  # 事件腿（业内叙述的主要用法，须另立）：
  #   上榜次日/次5日收益，条件 = 机构席位是否净买 且 营业部席位是否净卖（两臂符号相反＝分歧最大处）
  # 停牌与右端：本表为盘后披露 ⇒ 信号可用时点 = d 日收盘后（禁与 d 日盘中价配对，前视风险）

