# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝⑨席连续五班在册空白轴「流动性与冲击成本」在本库零出分。本班先按最直读的做法造了两枚市场级
  水平序列（全体个股 |r|/成交额 的截面均值、截面中位），**正交闸实测双双被拒**（0.6003 撞
  ti_ew_rmi_14_v1、0.6271 撞 ti_ew_ppo_v1，两者都是价格振荡类指标），这个结果本身就是读数：
  **日频"流动性水平"在池内分母上被"价格动了多少"吸走了**，因为 Amihud 的分子 |r| 就是价格变动，
  市场级取均值后主要剩下"当天大家跌/涨多少"，与 RMI／PPO 高度共线（本班自算
  amihud_level ↔ amihud_disp = 0.5431 ＞ 0.3，两形同轴）。
  本卡的本体因此**不是流动性松紧的水平，而是流动性的分层形状**：
  同日截面上 p90(illiq) 与 p10(illiq) 之差除以 p5(illiq) 中位（记 disp=(P90−P10)/P50），
  读的是"这个市场里最差的一档股票相对中位档，把一块钱成交打成多大价格"的**倍数**。
  经济命题（待 ⑥ 预注册冻结方向，本席不代裁）＝ 流动性分层扩散（disp 走高）＝
  同质性破裂、弱势票开始靠自身极薄的成交额定价 ⇒ 对后续市场级收益是**负向**（脆弱期），
  而 disp 收敛＝流动性结构齐整 ⇒ 中性偏正。方向之所以只作申报不作结论：本班**未做前向收益检验**，
  只做了轴合法性（正交）与可复现性（供数面）两段。
  与相邻卡的边界＝楼1 卡族（ofi_l1／queue_imbalance／imbalance_microprice）用的是盘口挂单侧信息，
  本卡只用日线 OHLC＋成交额（无需盘口）；本席 03 班 unlanded 卡 cs_spread 走"价差"、
  turnover_premium 走"换手"，与本卡"非流动性截面的离散度"是不同构造对象——
  但**该两条同席旧卡从未物化进池，正交闸对它们失明**，故相邻性只能由 ⑨/⑥ 并员评估，本席不自证清白。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 DESCRIBE 实测名）
pseudocode: |
  # 本体：Amihud 非流动性的"截面离散度"，市场级日频序列（date, sig）
  # 关键坑：query_rows 会跑 inject_final_strict，把 CTE 别名当表去探引擎 ⇒ 崩
  #         （实测 engine_probe: 空返回）；正解＝ch_writer.query_strict + 自加显式 FINAL
  START = '2021-01-01'          # 算力窗：与池内 n_common_dates=1472 同量级，不整档拉 2019 起
  sql = """
    WITH b AS (
      SELECT trade_date, symbol, close, amount,
             lagInFrame(close, 1) OVER w AS c1
      FROM c1_market.kline_daily FINAL            -- ReplacingMergeTree，FINAL 必显式
      WHERE trade_date >= {START} AND amount > 0 AND close > 0
      WINDOW w AS (PARTITION BY symbol ORDER BY trade_date)
    ), x AS (                                     -- 逐票日非流动性（成交额单位=元，故乘 1e-8 定标）
      SELECT trade_date, abs(ln(close / c1)) / (amount * 1e-8) AS illiq
      FROM b
      WHERE c1 > 0 AND isFinite(abs(ln(close / c1)) / (amount * 1e-8)) = 1
    )
    SELECT trade_date AS date,
           quantile(0.9)(illiq) AS p90, quantile(0.5)(illiq) AS p50,
           quantile(0.1)(illiq) AS p10, count() AS n
    FROM x GROUP BY trade_date HAVING n >= 500 ORDER BY trade_date
  """
  d = query_strict(sql)
  sig = (p90 - p10) / p50                          # 本体＝离散度（倍数），非水平
  # 派生形（同轴，计产不另计）：z250 标准分、mom20 动量、med 水平中位
  # 前向检验不在本席写域：交给 ⑤ 实现＋⑥ 制卡冻结＋⑦ 考工；本席只交 (date, sig)
  # 纪律：禁用 pct_change 现成列替代 ln(close/c1)（在册 修⑪／①席死列单在案），
  #       禁用 amount 的聚合口径（在册 RULE-DATA-OPS：判重与分母用逐票面，不聚合先）

