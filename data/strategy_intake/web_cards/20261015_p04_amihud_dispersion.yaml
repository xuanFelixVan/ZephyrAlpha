    quality_flag, ingest_ts, exchange, symbol_canonical；get_table_engine_strict=**ReplacingMergeTree**
    ⇒ 读数必带 FINAL。同批对照 c1_market.kline_daily_hfq → 10,128,069 行／5919 票（本卡未用，
    因离散度是截面比值，复权口径不改变截面排序，故走未复权原表面，代价见 caliber_pitfall 第(2)条）。
    离散度序列本班物化 n=1398（2021-01-05..2026-10-15）；disp 分位 p10=3.7654 p50=4.5114 p90=5.4216
    ⇒ 分布**很窄**（p90/p10=1.44），与水平形的极端重尾形成对照（下表）。
    对照读数（同一段 CH 聚合，同一 HAVING n>=500）：
    截面均值形 mean p10=0.0169／p50=0.0714／p90=20.0849 ⇒ p90/p50=**281 倍**＝离群主导，
    该形即使过闸也是"少数极薄成交额票的乘积"，本班据此**主动弃用均值形**（在册
    「边际均值构成不平衡伪影」同族红旗）；截面中位形 med p10=0.00804／p50=0.01542／p90=0.02989
    ⇒ p90/p50=1.94，稳健但被闸拒（0.6003）。
  face_gap_zh: >-
    代理落差三处：(1) 命题原义是"流动性"，本卡用的是 Amihud 的**价格冲击截面离散度**，
    属"实测冲击"代理，不含订单簿深度／价差的直接信息（楼1 三卡才碰那些面）；
    (2) 本卡是**市场级聚合**，而 Amihud 的原始用法是个股横截面排序选股——本卡只声明该轴在
    市场级可算、闸可过，个股面板档（panel）需 ⑤/⑥ 另物化，禁把市场级读数当截面证据引用；
    (3) 未复权 close 在有分红／送股的除权日会产生一根假 |r| 跳（amount 同步跳），
    该噪声进入 illiq 的分母与分子，方向未知，须由 ⑤ 实现时换 hfq 面做一次同底对照。
