    均值形 p90/p50=281 倍是本班自算面，弃用理由写在面里而非闸里；若下一班要复活均值形，须先解离群（如 winsorize）再闸
  - >-
    GitHub 三筛本轮无一枚过 star 筛（全员 ≤3 星）⇒ 本卡无外部参考实现可对照，伪代码正确性只由本班的 CH 读数自证

caliber_pitfall_zh: >-
  (1) **CTE 别名会被 FINAL 注入器当表探测**：query_rows 内部 inject_final_strict 对 FROM 后每个
  token 调 get_table_engine_strict，本班 WITH ... AS (b/s/e/sp/x/i) 直接崩
  『engine_probe: 空返回（未知引擎）』（GATE-P0-ENGINE-PROBE 亦打警"空返回与'表不存在'不可分"）。
  正解＝zephyr.data.ch_writer.query_strict(自写 FINAL)，本卡伪代码已按该形写死；
  (2) kline_daily 是 ReplacingMergeTree ⇒ 不带 FINAL 的 count/分位数会虚高（在册判据），
  但带 FINAL 后聚合代价上升，本班把窗口收到 2021-01-01 起以换算力；
  (3) amount 单位＝元，illiq 原始量级 1e-9 ⇒ 定标乘 1e8/1e-8 只影响可读性不影响 Spearman 闸；
  (4) abs(ln(close/c1)) 自算收益**不可**换成现成 pct_change 列（在册 修⑪／①席死列单）；
  (5) HAVING n>=500 是本班自选的最小截面门，改该门＝改截面宇宙＝改读数，⑤实现须把该门写进卡面参数；
  (6) 未复权 close 的除权跳与 amount 同步跳会进 illiq 两头，方向未量，换 hfq 面的同底对照属本班遗留欠账。
