    institution 在 623,661 行里只占 39,386 行（6.3%，本班实测）＝分子极稀疏，
    分母含全部 broker 行；该结构使市场级日度读数天然偏小（本班样本读数在 -0.02…+0.01 量级），
    横截面/时序分位化时应避免把它当"占比 0＝无信息"处理。

caliber_pitfall_zh: >-
  五条硬口径坑（全部本班实测或在册）：
  ①seat_type 是**英文枚举**（broker/institution/connect），与本卡情报原文的中文「机构专用/陆股通/营业部」不逐字对应；
  首跑按「机构」子串判定得到全零序列＝在册 silent-degradation-looks-like-not-triggered 与
  zero-hit-ruler-needs-known-positive-control 两条的现场复现，本席以「zero_value_days」这一行自检把它抓出来。
  ②connect＝沪深股通席位，与在册「北向信披改制必 exchange 分层」同族风险；本卡主体不含 connect，
  若要加北向腿必须按 exchange 分层，禁全市场合并。
  ③ReplacingMergeTree 不 FINAL＝同一席位行重复计入分母（本表 623,661 行是 FINAL 后读数）。
  ④buy_rank/sell_rank 是 Nullable(UInt8)＝存在空值行，按排名筛「买一买五」时禁把 NULL 当 0 处理。
  ⑤主表 dragon_tiger 与 block_trade 跨度仅 2026-08-07 起（本班实测 n=2,785／1,794）＝
  任何用 reason（上榜原因）子信号的构造都被这 46 个交易日卡住；
  席位级构造必须走 dragon_tiger_seat（2022 起 623,661 行），本班实测两表跨度差 4 年是**当前可复算性的分水岭**。
