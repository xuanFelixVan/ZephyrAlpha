logic_zh: >-
  经济直觉＝交易所强制披露的席位身份标签把「成交」拆成可归因的资金类型。
  机构专用席位净买入占比高＝具备研究资源与持仓约束的资金在**该票当日异动后**主动接货，
  信息含量来自「谁」而非「多少」；占比转负＝机构在出货。市场级聚合读数的含义＝
  全市场机构席位在当日所有上榜股票上的合力方向，是资金面情绪的结构侧（区别于涨跌停家数这种价格侧）。
  构造（本班实跑口径）＝逐 trade_date 汇总 dragon_tiger_seat（FINAL）的
  inst_net = Σ net_amount where seat_type='institution'，tot = Σ (buy_amount + sell_amount) 全席位，
  信号 = inst_net / tot；分母用「上榜席位双边成交额」而非市场成交额＝受前五披露截断约束（在册局限 ②）。
  方向＝**不预注册**：基座文给机构 +1.7%（正向），而东财随笔给 V 字型（非单调），百科给净卖出腿更可靠（符号不对称），
  三源互斥＝本席不选边。

pseudocode: |-
  # 市场级代理腿（本班实跑物化＝正交闸采信序列，1157 日）
  # 真源表：c1_market.dragon_tiger_seat（ReplacingMergeTree，读侧必带 FINAL）
  rows = ch.query_strict("""
      SELECT trade_date, seat_type,
             sum(net_amount), sum(buy_amount), sum(sell_amount)
      FROM c1_market.dragon_tiger_seat FINAL
      WHERE trade_date >= '2022-01-01'
      GROUP BY trade_date, seat_type
  """)

  # ⚠ 域值陷阱（本班首跑就踩，处方写死在卡里）：
  # seat_type 的本库实测域值 = ('broker','institution','connect')，
  # **不是**中文「机构专用」；用 "机构" in seat_type 判据会 100% 零命中，
  # 得到一条恒 0 的序列并让正交闸"看起来通过"＝在册 silent-degradation 同型假绿。
  agg = defaultdict(lambda: {"inst_net": 0.0, "tot": 0.0})
  for td, stype, net, buy, sell in rows:
      tot = float(buy or 0) + float(sell or 0)
      agg[td]["tot"] += tot
      if str(stype) == "institution":                 # 英文域值等值判定，禁 LIKE 禁中文
          agg[td]["inst_net"] += float(net or 0)

  out = [(d, v["inst_net"] / v["tot"])                # csv 列名固定 date,sig
         for d, v in sorted(agg.items()) if v["tot"] > 0]
  # 自检（本班实跑）：days=1157, zero_value_days=0  ← 必须打这一行，0 值天数即污染天数

  # 面板原形腿（本席未物化，交 ⑤ 判定）：
  #   per (trade_date, symbol): inst_net_symbol = Σ net_amount where seat_type='institution'
  #                             denom_symbol    = buy_amount + sell_amount（同票当日全部席位）
  #   横截面排序前须处理「同日多 reason 重复上榜」＝同一票可能因多条上榜原因各占一行，
  #   直接 sum 会把同一笔成交计两遍（本卡市场级腿同样受此影响，本班未去重，如实申报）。

