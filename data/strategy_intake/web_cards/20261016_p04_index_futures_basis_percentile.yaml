logic_zh: >-
  股指期货长期贴水的根因＝中性/套利盘的**空头套保需求**集中在期货端，贴水深度＝该拥挤度的价格表现。
  中金 2026-10-16 报告给的可复验形制＝把「当季合约相对现货指数的年化基差率」在滚动窗口内取分位，
  分位≥0.8（贴水异常深／升水异常高）与 ≤0.2 作为多空两侧阈值，在中证1000 上呈双向有效，
  在沪深300 与上证50 上无统计意义＝**跨品种不对称本身是该轴的信息内容**。
  对本库的可施工形态必须降级＝本库无历史合约月份与到期日面（实测见 data_binding），
  故只能先做「主力连续即时基差率的滚动分位」代理，年化与分红矫正留待①席补史后进 C3。

pseudocode: |-
  # 市场级日频代理（本库现成面可算；符号约定＝期货/现货-1，正=升水 负=贴水）
  # 输入：c1_market.kline_futures(symbol IN ('IF0','IH0','IC0','IM0'), trade_date, close)
  #       c1_market.kline_index(symbol IN ('000300','000016','000905','000852'), trade_date, close)
  pair = {IF0:000300, IH0:000016, IC0:000905, IM0:000852}   # 本班实测四对均可 INNER JOIN 上
  b[t, prod]     = fut_close[t, prod] / idx_close[t, prod] - 1.0     # 即时基差率（非年化）
  # 滚动分位＝中金用 60 日窗口 + 5 日持有；本库代理先做 250 日（1 年）与 500 日（2 年）两档
  pct[t, prod]   = rank_{w}( b[·, prod] ) / w                        # w ∈ {250, 500}，右端禁含未来
  sig[t, prod]   = +1 if pct >= 0.8 ; -1 if pct <= 0.2 ; else 0      # 方向不预注册，见 self_flag
  # 待①席补史后可升级的真口径：
  #   annual_basis[t] = (S - F)/S * 365/days_to_expiry   (或 252 交易日版)
  #   corrected_basis = annual_basis - 合约期内成分股分红点位占比
  # 自检（本班踩过的坑已写死）：zero_value_days 必须打印；四对里任一对 n<500 则该品种禁入池

data_binding:
  primary_source: c1_market.kline_futures + c1_market.kline_index
  sl_ref: 数据源映射读 docs/04_research_records/data/chain_piling_campaign/02_source_line_registry.md（④席不自建源，缺源走本席台账转单①）
  measured_face_zh: >-
    本班两条只读普查实测（非游标记忆）：①符号密度＝kline_futures 全表按品种前缀
    IF/IH/IC 各 2,409 行（6 个 symbol）2017-01-17..2026-10-12、IM 1,071 行 2022-07-22..2026-10-12；
    主力连续 IF0/IH0/IC0 各 2,359 行、IM0 1,021 行；**逐月合约（IF2609/IC2612/IM2703 等）每合约仅
    10 行，跨度全部落在 2026-08-26..2026-09-16**＝历史"当季合约年化基差"在本库不可回算；
    另有 IF00/IC00/IH00/IM00 四枚各 10 行（同窗）。②期现可 JOIN 面＝IF0/000300、IH0/000016、
    IC0/000905 各 n=2,359（span 2017-01-17..2026-10-12），IM0/000852 n=1,021（2022-07-22..）；
    即时基差率区间（百分数）＝IF -3.81/-0.18/3.55、IH -3.01/-0.05/3.74、IC -3.52/-0.41/4.39、
    IM -4.13/-0.60/4.40（min/中位/max）＝中小盘深贴水与研报叙述同向。
    ③拼接前视定量＝|Δlog(F/S)| 的 6σ 以上跳变天数＝IF 10／IH 11／IC 12／IM 11（占各自 n 的 0.4-1.1%），
    且 top5 跳变日全落在公开极端行情日（2024-10-08、2025-04-07、2020-02-03/04、2026-06-11 等）
    ＝**无法把换月伪影与真实跳变分开**，故本卡代理面自带 0.4-1.1% 的未知污染。
  missing_face_zh: >-
    缺①合约到期日/剩余自然日列（表内无 expiry 面）⇒ 年化不可算；缺②成分股分红点位预估
    ⇒ 分红季节（6-8 月）贴水会被系统性误读；缺③逐月合约历史（仅 10 个交易日）⇒
    中金原口径「当季合约」无法复刻。三件均按台账转单①席，本席不自建源。

self_flag:
  - 方向未预注册＝中金给的是**中证1000 双向有效、沪深300/上证50 无统计意义**的不对称结论，
    且其符号约定（现货-期货 还是 期货-现货）在该页未明示；本席不替⑥席拍方向，
    方向与阈值一律由 C3 预注册时定（沿 1016-02 游标第⑦条「卡面方向仍待⑥，本席不翻号」）。
  - 本卡代理面＝主力连续即时基差率，与研报本体「当季合约年化基差率」**不是同一个量**；
    连续合约换月跳变实测 0.4-1.1% 天数无法与真实跳变区分＝引用者须按「形制验证」而非「复刻验证」消费。
  - 正交闸面＝本班池面实测缺席（见本席台账 §本班池读数），闸未实跑⇒本卡只过许可证闸＋册内去重闸，
    **禁止把「grep 零命中」读成「正交已证」**。
  - 跨品种不对称结论若被直接当作「IM 单品种信号」使用，会与⑥席的品种选择自由度混淆＝
    该结论属**研报自述绩效**，非本库复验结果。

caliber_pitfall_zh: >-
  ①符号约定冲突（本班实测到两处相反口径）＝中金页只写『相对现货指数的年化基差率』未给符号方向，
  而 daxiapi 搜索摘要给『基差 = 现货指数 − 期货合约价』（贴水为正）；本卡伪代码用的是
  **期货/现货-1（贴水为负）**＝与 daxiapi 反号。引用者必须先锁符号，否则 0.8/0.2 阈值的含义整体翻转，
  多空两侧对调＝一个反向信号。②「分位」的窗口长度在研报里是 60 日网格最优，
  而本库代理面因换月污染更宜用长窗（250/500 日）＝两套窗口不可互替，
  短窗会把换月跳变直接读成拥挤度极值。③"吃贴水"类叙述（本班搜索命中的 10jqka 页给
  IC/IF/IH/IM 当季分红处理后年化基差 -9.81%/-5.96%/-4.48%/-12.61%，截至 2026-07-03，
  来源 Wind）属**点位级贴水**，与指数级即时基差率量纲不同，禁混用同一序列。
