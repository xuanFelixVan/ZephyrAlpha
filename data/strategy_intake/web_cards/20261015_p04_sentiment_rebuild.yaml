# ── 必备③ 逻辑描述
logic_zh: >-
  【一句话】把「市场情绪」当成一个**必须由多成分拼装、且必须先剔掉宽度/量能共因**的状态变量来重建：
  长史只用两臂（涨跌宽度＋量能）并按可得成分数分层，短史才允许加入杠杆与文本腿；进闸前先对宽度臂做正交化。

  【本班实测的三枚现成件，以及为什么它们都不等于「情绪轴已被挖过」】
  (1) emotion_index（市场级，8622 行 close_final，1991-06-10 至 2026-10-15）——本班按 components 里
      「status": "ok」出现次数逐日统计达标成分数，得四层口径：
      n_ok=1 共 119 日（2005-01-05 至 2005-07-06）；n_ok=2 共 **8133 日**（1991-06-10 至 2025-04-02）；
      n_ok=3 共 325 日（2025-04-03 至 2026-09-22）；n_ok=4 共 **45 日**（2026-07-14 至 2026-10-14）。
      权重字段随层变化（早期 C3/C4 各 0.5，现期四臂各 0.25，C1/C2 长期 weight=0.0 且 status=insufficient、obs=24），
      ⇒ **94.3% 的历史是「宽度＋量能」两臂指数**，四臂完整面只有 45 天。
      本班另验 stage 谓词不可省：close_final 8622／pre_open 30／auction 17，且 17 个交易日一天出 3 行、9 天出 2 行。
      version/source 面：v0.1.0 replay 8596 行、live 73 行（live 只 30 个日期）⇒ 该列绝大部分是**回放产物**。
  (2) news_sentiment_window（22262 行、2627 日、4858 只）——本班按 scope×window_type 分组实测出三段，且三段互不连续：
      market/1d 2421 行（2019-01-04 至 **2025-09-09 止**）；market/night 206 行（2026-02-24 至 2026-10-14）；
      symbol/night 19635 行、4857 只，但只覆盖 **2026-02-24 至 2026-08-20**（右端滞后 55 天）。
      ⇒ 市场级文本情绪可用长段 2421 日＋续段 206 日，**中间空 5.5 个月**；个股级不足 7 个月，截面情绪无法回测。
      sentiment_index 分布（1/50/99 分位）＝-0.22／0.00／0.48，total_count 均值 213.75、最大 7982。
  (3) sentiment_panel（仅 59 行）——两个 metric：cb_conversion_premium_median 15 行（2026-09-16 至 10-14）与
      fear_greed_index 44 行（2026-09-01 至 10-14，source=**alternative.me**）。
      ⇒ 后者是美股口径的情绪指数，本班**明确反对外推**：把它当 A 股情绪绑定会产生「跨市场情绪」的伪信号；
      且 6 周长度对任何门槛都不够。
  【第四闸实跑给出的关键判决】把 (1)(2) 落成 date,sig 单列喂闸（池=夜挖序列面剔标签后 32 员，门柱 0.3 未动）：
      emotion_index（close_final 全 8622 日）verdict=**reject max|corr|=0.8087，most_similar=net_breadth**；
      news 市场级合并序列 verdict=**reject max|corr|=0.4583，most_similar=ti_ew_adosc_v1**。
      ⇒ 现成情绪面与既有池**不是新轴**：前者几乎就是净宽度（0.81），后者与等权 ADOSC（量能摆动）0.46。
      这正是本班主张「非宽度成分」的原因：如果照抄现成列去建卡，等于给库里的宽度族再记一员（重复计量）。
  【因此本卡主张的构造（三条腿，按本库可达性排序）】
      腿 A（长史可用，但必须声明它是宽度/量能两臂而非完整情绪）：直接以 emotion_index 的 n_ok=2 段作**状态变量**用，
        并按本班实测的分层结果把 2025-04-03 与 2026-07-14 两个断点写进卡面，禁止跨层拼接成一个数；
        该腿过闸预期为 reject，用途只能是**门控条件**（与卡12 门控同层），不得计为新信号员。
      腿 B（真正可能出新的臂）＝「剔掉宽度与量能之后的情绪残差」：把候选成分先对 net_breadth 与量能摆动序列回归取残差再进闸；
        候选成分按本库实测优先级＝①换手率横截面离散度（stock_daily_basic.turnover_rate，2017-01-03 起 2372 日、5904 只，
        本班近端实测 turnover_rate=0 计数 0/144389＝该列干净）；②昨涨停/次新股相对强弱（可自算，依赖 kline_daily 涨停判定）；
        ③文本情绪（2421 日长段＋206 日续段）；④两融杠杆（在册 margin_trading 507 日＝门槛⑤不可达）；
        ⑤ETF 份额/净申购（market_etf_share_snapshot 表存在，本班**未测**跨度与口径）；⑥期货基差与期权 PCR（本班未测，只登记为待测腿）。
      腿 C（口径治理，不是信号）＝把库内三处「情绪」命名与能力册对齐：本班按「情绪」「情绪周期」「market_sentiment」三词反查
        均只回 news_sentiment_analyzer 一条（maturity=design），而代码面 zephyr/signal_ashare/sentiment/market_sentiment_analyzer.py
        确实存在（被 tests/trade/plan_engine/ 两处导入）——该缺口与在册 L02-C09（docs/_working/master_backlog/_raw/04_数据供给链.md:5362
        「capability_lookup sentiment 族索引重建」）同题，本班读数只证明**该单至今未生效**，不另开新单。
  【与卡10/卡12 的分工】卡10=波动率（价格离散性本体）、卡12=估值赔率（跨资产比价本体）、本卡=情绪（参与者行为强度本体）。
      本班实测：三者两两并非天然正交（情绪 vs 宽度 0.81、情绪 vs 量能摆动 0.46、ERP 分位 vs 涨跌停热度 0.30 贴柱），
      所以三张卡**禁按三员计产**，须⑥在闸面上定「谁占哪一员」。

# ── 必备④ 伪代码（全自拟，禁外部逐行搬运）
pseudocode: |
  # 层 0：情绪成分的原子度量（全部由本库列自算；涨停判定三条硬规则来自外部施工级情报）
  limit_price = round(prev_close * (1 + board_limit(board)), 2)   # 主板 0.10／创业板·科创板 0.20／北交所 0.30
  is_limit_up = abs(close - limit_price) <= 0.001                 # 必须带容差；必须用**前收盘**基准（除权日尤甚）
  streak      = backtrack_consecutive(is_limit_up)                # 从当日向前回溯到断板为止
  炸板率       = 炸板家数 / (涨停家数 + 炸板家数)                    # 分母=当日曾涨停的全部票（外部口径定义）

  # 层 1：成分 → 打分（照机构侧构造骨架自拟，窗长与分档由⑥冻结）
  comp_raw   = {breadth: 上涨家数占比, volume: 等权量能, turnover_disp: 截面换手离散度(横截面std),
                hot: 涨停家数 + 最高连板高度, blast: 炸板率, text: 市场级新闻 sentiment_index,
                lev: 两融余额变化}
  comp_score = {k: pct_within_window(v, WINDOW) for k, v in comp_raw.items()}   # 分位窗禁全样本（卡12 本班实测同型教训）
  missing_component_rule = drop_and_renormalize_weights(...)   # 危险点：动态重归一会让同一列名跨期变成不同量

  # 层 2：本卡的核心处方——先剔共因，再谈情绪
  X = [net_breadth_series, adosc_or_volume_sweep_series]        # 池内已被占位的两列（本班实测 most_similar）
  for c in comp_score:
      resid_c = c - OLS_fit(c ~ X).predict(X)                   # 残差化＝把宽度/量能买走的信息扣掉
  sentiment_orth = weighted_mean(resid_c on 达标成分)            # 只在 n_ok 同层内加权

  # 层 3：口径分层谓词（本班实测断点，禁跨层）
  regime_layer = where(date < 2025-04-03, '2臂', where(date < 2026-07-14, '3臂', '4臂'))
  # 断点证据＝n_ok 分布 (1:119 日, 2:8133 日, 3:325 日, 4:45 日)；C1/C2 长期 status=insufficient、weight=0
  assert stage == 'close_final'          # 否则同日出 2-3 行
  assert source_layer 同质               # replay 8596 行 vs live 73 行禁混作「同一口径现算」

  # 层 4：进闸（本席实跑过的单位＝市场级单列 date,sig）
  #   直接喂 emotion_index → reject 0.8087（net_breadth）；直接喂 news → reject 0.4583（ti_ew_adosc_v1）
  #   ⇒ 下游只准喂「残差面」，且报数必须写明是残差面还是原始面；两面禁同池计员

  # 层 5：文本腿的 PIT 与断供处理
  news_mask = (scope=='market' & window_type=='1d') | (scope=='market' & window_type=='night')
  gap_flag  = dates_in_gap(2025-09-10, 2026-02-23)              # 本班实测空档 5.5 个月：该段禁插值、禁跨段滚动统计
  # 个股文本面（scope=='symbol'）只 2026-02-24 至 08-20 ⇒ 截面情绪回测在现库不可开工

  # 层 6：命题形态（留给⑥预注册，本席不定方向判据）
  #   文献承认两件事：方向可为负（高情绪→低未来收益，反转臂）也可为正（趋势臂），且预测 horizon 随标的特征异质
  #   ⇒ 双臂并列预注册＋Granger 式方向检验优先于单臂点估计

# ── 必备⑤ 数据源映射（对齐源线谱 SL-*，真源=docs/04_research_records/data/chain_piling_campaign/02_source_line_registry.md）
data_source_mapping:
  source_line: SL-A09 财经快讯情绪线（A 档；源线谱第 32 行，锚 DS-CLS/DS-EASTMONEY_NEWS/DS-RSS，§SL-A09 U1 原句即「快讯流密度与情感极性能否量化市场情绪并预测次日」，U5 更自认是「L3 情绪变量（纪要§8.1 定桩『情绪』变量的正源）」）＋SL-A01 日线行情线（宽度/换手/涨停成分腿）＋SL-A06 资金流线（ETF/陆股通腿候选）
  primary_table: c1_market.emotion_index（市场级现算列，components 为 JSON 字符串）；c1_market.news_sentiment_window
  secondary_table: c1_market.stock_daily_basic（换手率真源，在册卡面已定源，本班补跨度）；c1_market.kline_daily（涨停/连板/炸板成分）；c1_market.sentiment_panel（本班判不可用）；c1_market.margin_trading／market_etf_share_snapshot／hk_connect_flow（候选腿，前二者本班未测跨度）
  measured_reachability:
    - emotion_index：8669 行、uniqExact(trade_date)=8626、1991-06-10 至 2026-10-15（右端含当日 pre_open 行）；stage 分布 close_final 8622／pre_open 30／auction 17；同日出 3 行 17 天、2 行 9 天；emotion_index 分位（1/50/99）=0.079／0.5356／0.965，countIf(=0)=0
    - emotion_index 成分达标分层（本班 countMatches 实跑）：n_ok=1 119 日（2005-01-05 至 2005-07-06）／n_ok=2 8133 日（1991-06-10 至 2025-04-02）／n_ok=3 325 日（2025-04-03 至 2026-09-22）／n_ok=4 45 日（2026-07-14 至 2026-10-14）；首个 n_ok≥3 日＝2025-04-03
    - news_sentiment_window：22262 行、2627 日、4858 只；三段＝market/1d 2421 行（2019-01-04 至 2025-09-09）、market/night 206 行（2026-02-24 至 2026-10-14）、symbol/night 19635 行/4857 只（2026-02-24 至 2026-08-20）
    - sentiment_panel：59 行＝cb_conversion_premium_median 15 行（2026-09-16 至 10-14，source=akshare_alt.bond_cb_jsl）＋fear_greed_index 44 行（2026-09-01 至 10-14，source=**alternative.me**）＋其 Extreme Greed/Neutral 分类行；本班判不可用
    - stock_daily_basic：2017-01-03 至 2026-10-14、2372 交易日、5904 只、10517539 行；近端（trade_date≥2026-09-01）countIf(turnover_rate=0)＝0/144389 ⇒ 该列无零值污染（对在册「换手真源=SDB.turnover_rate」的跨度与质量补测）
    - IPO 热度腿：ipo_calendar 的 list_date 只 2023-08-21 至 2026-10-15、421 只 ⇒ 情绪代理里的 IPO/新发热度**不可长史重建**（本班实测负结论）
    - 分红溢价腿：dividend_tax_node 的 ex_date 1991-04-03 至 2026-07-10、5402 只 ⇒ 长史存在但右端滞后约 3 个月；本班未测 node_type 口径
    - 闸实跑面：emotion 全序列与 news 合并序列各 1 次 gate；五枚本班候选（含卡12 两枚）pool-report n_members=5、n_common_dates=1776、PR=2.2664
  caliber_pitfall_zh: >-
    ① 现成 emotion_index 不是「一个量」而是「四个量」：达标成分数从 2 变 3 再变 4，权重同时被重归一（0.5/0.5 → 0.25×4）。
      把 8622 行当一个口径序列送进任何长史回测，等于让定义漂移穿过被测对象。本班只登记分层证据，不判该件对错（属①写域）。
    ② C1_limitup_temp／C2_promotion 长期 weight=0.0 且 status=insufficient、obs=24 ⇒ 打板族情绪在现件里**从未真正参与过打分**；
      若下游以为「情绪指数已含涨停热度」，那是错的（本班实测 components 右端逐条读数）。
    ③ 分位窗：外部构造用「历史上所占百分位数」，与本卡 pitfall 同源风险——若实现成全样本排名即前视（卡12 本班已实测出一例）。
    ④ 两枚现成件撞同一根柱子：宽度与量能。残差化是本卡的必要条件而非可选项；不残差化就直接建卡＝给既有池重复计员。
    ⑤ 文本腿的两段之间空 5.5 个月，且个股段只 6 个月 ⇒ 「A 档文本情绪已可用」这句在册表述（SL-A09 标称分钟级/已运营）
      在**历史连续性**上与本库面不符，本班只登记读数供①判。
    ⑥ fear_greed_index 是跨市场件（source=alternative.me），6 周长度＋错误市场＝双重不可用；本卡不开该腿。
    ⑦ 本卡单位＝市场级单列序列；「情绪高→下周低配」这类截面主张不在本卡范围内，须由⑤另出截面卡并先解决降维列口径（卡10 在册问题）。

