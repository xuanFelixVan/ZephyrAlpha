# ── 必备③ 逻辑描述
logic_zh: >-
  与失衡"量"版本相对：QI 用最优买档与最优卖档上的**委托笔数**（队列长度 NQ）构造
  QI = (NQ_bid − NQ_ask) / (NQ_bid + NQ_ask)，预测下一跳 mid 的位移方向。
  机理差异=同样 100 手的买一可能由 1 笔大单或 50 笔小单构成，前者的撤单/成交动力学与
  后者截然不同（小单队列更易被连续吃掉⇒同款"量失衡"下真实剩余供给不同），
  故笔数版与量版在信息内容上不可互推。文献宣称其在计入成本后仍有预测力，
  但同一批文献警告预测力随市场状态漂移，不可当利润保证。

# ── 必备④ 伪代码（本席自拟）
pseudocode: |
  # 需要的原始字段：best bid / best ask 两个价格档上的"当前挂单笔数" nq_bid, nq_ask
  nq_bid[t], nq_ask[t] = snapshot.order_counts[level=1]      # ← 本仓无此列，见 blocked_on
  qi[t] = (nq_bid[t] - nq_ask[t]) / (nq_bid[t] + nq_ask[t] + eps)
  # 事件驱动版（更贴原论文）：仅在 (P_b,P_a) 不变而队列变化时采样，跳档时重置队列计数
  signal[t] = sign(qi[t]) * 1{|qi[t]| >= theta}              # theta 由⑥预注册冻结，本席不拍数值
  label[t..t+H] = mid[t+H] - mid[t]                          # 一阶检验=跳下一跳方向命中率/AUC
  # 禁用代理：用"量/均价"反推笔数在 A 股快照口径下会把大单拆单污染成笔数噪声，须显式标注为弱代理并单列一臂，不得顶替真值

