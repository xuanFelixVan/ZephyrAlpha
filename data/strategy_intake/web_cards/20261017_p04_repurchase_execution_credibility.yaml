  orthogonal_gate_zh: >-
    正交闸【本班缺席，如实申报，未编数】。本班实跑复量池面三面（.runtime/tmp/p04_06_pool、.runtime/tmp/st-qoder-p09-1015-04/pool_datesig、.../pool6）
    ＝**目录在而 is_file() 计数全为 0**＝第四次退化（04 班『目录在件没了』→05 班『目录整体不存在』→1017-01 班『目录重建但空壳』→本班『同形复现』）；
    04 班留存候选 mkt_basis_pctile250.csv 本班复量仍在（属卡22 基差候选，对象不同，本席未代其喂闸）。
    在册假绿红线续用＝⑨ 席 1017 已记该闸『打 ERROR 却 rc=0』形态于 10-17 修复为 rc=2，但 --out 件仍不生成 ⇒ 无论 rc 几，**空池一律不构成通过**。
    ⇒ 交 ⑤/下班：物化 repurchase_exec_market.csv(date,sig) 后跑
      `python scripts/backtest/fexam/signal_orthogonality.py gate --candidate <该csv> --pool <复活后池目录> --gate 0.3`；reject(rc=5) 记重复、pass(rc=0) 记过，
      且须核对回显非『未命中任何 CSV』；并与卡26 asset_growth（同笔现金流出的另一面）做两两对测。本席不自造 corr 数值。
  dedupe_gate_zh: >-
    去重闸（本班实跑，谓词均窄＋逐条读上下文，遵 1016-05『读正文不只看卡名』在册令）：
    ① 存量册 strategy_registry.yaml 五谓词『repurchase|回购|buyback|margin_balance|融资融券』= **0 命中**；
    ② exam_cards 全树（609 枚 yaml）『repurchase』=0 枚命中；『回购』=3 枚命中，**逐条读上下文后判不撞**＝
      TDM-E-L1-S0__calibration__03『DR007/逆回购』、TDM-F-C1__comparison__03『GC001 逆回购利率』、TDM-F-C2-02『现金 sleeve 逆回购』＝三枚全是**央行/交易所逆回购（资金融出）**，与公司股份回购不同物（此即本席需要的负对照：谓词能命中就说明谓词有效，命中内容不对就不算占轴）；
    ③ 相邻概念复量＝在册 FCT-LIQ-036『股东增持信号』alpha_source 自述『①回购 vs 增持 …71.8% 远优于 36%』＝该卡把回购当**对照物**而非本体 ⇒ 未占本轴；
    ④ web_cards 名面 grep(repurch|buyback)=空、正文面四枚命中经逐条读＝全部是 margin_trading/两融/『两融杠杆』旁证（holder_concentration/sentiment_rebuild/institutional_seat_netbuy/erp_valuation），无一枚以回购为本体；
    ⑤ 附带排雷＝本席原拟第二候选『两融余额变化』本班**主动放弃**：institutional_seat_netbuy 卡面在册句『与 1016-01 ghost 班已判重的 margin_bal_chg／margin_repay_pressure 不同物（那两枚＝两融余额时序）』
      ⇒ 两融余额时序轴已被前班判重占过，重挖＝同义卡，故本班改取指数调样轴（见同批卡29）。
  pool_face_note_zh: 池为市场级成员（在册历史 n_members=32）；本卡是**个股横截面事件/行为**因子，其市场级代理只能是多空/分层收益时序，与池内价量波动成员应天然低相关，但与卡26(资产增长)存在同源现金流量的构造性负相关，须物化后测

self_flag:
  - >-
    方向未预注册＝本卡最大约束：研报给正（兑现高/比例高⇒未来强）、百科给落空⇒负（≥10% 级），本席遵 ⑨ 令不选边不翻号；须 ⑥ 带独立外部先验另立 card_id 方可开考。
  - >-
    正交闸缺席本班未编数：已给池面第四次退化 is_file() 复量＋在册 rc 修复续证＋下班可直接执行的 gate 命令；勿把『列存在』读成『本卡已过闸』。
  - >-
    证据等级低于学术期刊基座＝本班本轴命中的最强读数面是**卖方金工专题**（源达 2025-03-27）与门户/百科转述，未读到同行评议原文与样本口径（区间、中性化、剔 ST 与否均未对表）；
    ⑤ 实现前宜由 ⑦/⑧ 或 ⑥ 找一手学术（Ikenberry-Lakonishok-Vermaelen 1995 JFE／Peyer-Vermaelen 2005 JB 型）做基座替换或补强，本席未搜到该基座的干净许可实现源（GitHub 三筛结论）。
  - >-
    用途腿与路径腿均无源（注销 vs 激励、逐月进展）＝本卡读数与研报读数**不同物**，引用者勿把本卡的 exec_ratio 当成研报里的『注销式回购』分层；已转 ①/② 补列。
  - >-
    exec_ratio 的 T_obs 是本席自定（12 个月，依据＝外部所述『回购周期 12 个月之内』，非表内列）⇒ 该参数改动即改读数，⑥ 冻结时须把它写进卡面参数而非留作隐含；
    若 ⑤ 发现表内 start_date 缺值率高，本卡须降级为『仅用 announce_date＋固定 12 月』的近似版，并另记 start_date 缺值率实测数（本班未量该列缺值率＝残余待办，见台账）。
  - >-
    与卡26(资产增长异象)存在构造性负相关（同一笔回购现金流出在 AG 里压低 total_assets）＝跨卡共线一手风险已申报，池缺席无法测，交 ⑥/⑨ 并员评估，本席不自并、不改他卡、不翻号。

caliber_pitfall_zh: >-
  (1) **快照态命门**＝progress/done_amount 随采集被后续版本覆盖且无进展公告日列 ⇒ 在事件日 T 直接用＝前视；本卡 pseudocode 已写死『只在 start_date＋OBS_MONTHS 之后进入特征面』，T 之前记缺测；
  (2) **零值语义陷阱**＝done_amount=0 与『该方案尚未开始』同形，plan_amount_max 缺与『承诺零金额』同形 ⇒ 禁以 0 代缺，一律 NaN＋单独计数上报覆盖率；
  (3) **单位未对表**＝plan_amount/done_amount 是元还是万元本班未验（本库在册先例＝大宗两表同物异单位 10^4）⇒ exec_ratio 是同表同列相除，单位在分子分母相消**不受影响**，但若 ⑤ 想加绝对金额门槛（如『≥1 亿元』）必须先对表单位；
  (4) **progress 的 'nan' 值**＝81 行字面 'nan'（本班实测七值守恒）⇒ 字符串谓词 `progress IS NULL` 查不到它们，须按等值 'nan' 或建枚举映射，否则『状态缺失』会被静默读成第八种状态；
  (5) **剔 ST/停牌**＝本库在册 is_st 与停牌面另表（c1_market.suspend 本班实测存在但未验跨度），回购期内停牌会拉长实际执行窗 ⇒ ⑤ 须与 suspend 联立决定 OBS_MONTHS 是否顺延；
  (6) announce_date 末值＝2026-10-17（本班当日）⇒ 该表日更，但『当日公告』的行在 T_obs 之前不可进特征面，勿因『数据新』误以为『信号可用』。
