# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝本库『公司行为』一维只占了『解禁宽度』(供给冲击)与『股东集中度/增持』，而『管理层公开承诺买回自家股份之后**是否真的买、买多少、为何停**』这条兑现强度轴从未占；
  它不是解禁/增持的同义改写——解禁是被动供给、增持是买方身份、回购兑现度是『承诺与执行的缺口』，三者事件主体与可观测变量各异（本班去重三面实跑，见 dedupe_gate_zh）。
  一手读数（源达 2025-03-27）＝『完成公告』后 1 年相对收益 6.42%、2 年 11.32%，远大于『预案公告』后 30/90 日的 1.17%/1.94%，且按回购比例分档单调（>5% 档 90 日超额 4.48% vs 其他档不足 1.5%）
  ⇒ 信息含量集中在**执行与规模**，不在『宣布』这一动作本身；反向（百科面）＝宣告停止回购公告后股价均跌超 10% ⇒ 承诺落空的左尾比预案的正尾更陡。
  本卡本体＝对每一枚回购方案，算两个横截面可算量：
    (1) 承诺规模强度 plan_pct_mid = (plan_pct_min + plan_pct_max)/2（表内既有『占股本比例』两列，无需外部市值即可归一，且研报的分档正相关结论正好以比例为条件变量）；
    (2) 执行兑现率 exec_ratio = done_amount / plan_amount_max（plan_amount_max 缺则退回 plan_amount_min；两者皆缺⇒记缺测禁以 0 代，0 会被静默读成『完全没买』）。
  ⚠ 本卡最大约束不是方向而是**时间可用性**：本班实测本表 progress 与 done_amount 是**快照态**（同一行随后续采集被覆盖），表内**没有『进展公告日』列**、
  也没有『方案截止日/回购期限』列 ⇒ 在事件日 T 直接用 done_amount 即前视；可证的只有『方案启动日 start_date 之后的一段确定滞后』之后的读数，
  ⇒ 故本卡的诚实形态＝『用 start_date＋固定观察期（如 12 个月，即研报所称回购周期）读到的 exec_ratio，去预测该观察期**结束以后**的收益』，属『历史兑现信誉』型低频横截面因子，不是事件日抢跑型信号。
  方向本席**不预注册**：研报给『正』（兑现高/比例高⇒未来强），百科给『落空⇒负』，两者实为同一变量的两侧，但符号与门柱须由 ⑥ 预注册定；本席遵 ⑨ 席在册令不选边不翻号。
  与相邻对象边界＝(1) unlock_breadth＝限售解禁供给冲击（被动卖压，主体是限售股持有人），本卡＝公司主动买入承诺（资金流入），方向相反且事件主体不同；
  (2) holder_concentration／在册 FCT-LIQ-036『股东增持信号』＝股东/高管**增持**，该卡 alpha_source 明写『①回购 vs 增持（2026 年 A 股 712 家样本：回购上涨比例 71.8% 远优于增持整体 36%）』＝**它自己已声明回购是不同物**，本卡不是它换名；
  (3) asset_growth_anomaly(卡26)＝总资产增速（投资强度），回购减资会机械压低 total_assets ⇒ 与本卡存在**负向构造性相关**（同一笔现金流出，在 AG 里表现为资产减少、在本卡里表现为承诺执行），须物化后测 |corr|，本席主动申报不臆断；
  (4) erp_valuation/市值因子＝本卡是**事件/行为**类，非估值水平类。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 CH 只读探针实测名，见 data_binding.measured_face_zh）
pseudocode: |
  # 本体：逐枚回购方案的「承诺规模强度」与「执行兑现率」，横截面排序键（供 ⑤ 物化成 panel）
  # 输入 c3_fundamental.repurchase(symbol 裸6位, announce_date, start_date, progress,
  #        plan_pct_min, plan_pct_max, plan_amount_min, plan_amount_max, done_amount, done_qty, data_source, exchange)
  # 标签 c1_market.kline_daily_hfq.pct_change（后复权，沿本席在册口径；禁取 kline_daily.adj_factor＝恒1死列）
  方案归组（本表无方案号列⇒须自造键）：
    scheme_key_i = (symbol, announce_date, start_date, plan_amount_min, plan_amount_max)
    同键多行＝ReplacingMergeTree 快照版本⇒按 ingest_ts 取**最新一版**作为该方案的终态读数（禁跨版本相加＝会双计金额）
  可读窗闸（PIT 纪律，本卡命门）：
    T_obs = start_date + OBS_MONTHS 个月（OBS_MONTHS=12，依据＝研报/百科所述『回购周期 12 个月之内』）
    ⇒ exec_ratio 只允许在 T_obs 当日及以后进入特征面；T < T_obs 的样本该特征记缺测（禁把「尚未执行完」读成「零执行」）
    ⇒ 若 start_date 为空/为哨兵⇒该方案整枚剔除，禁以 announce_date 顶替 start_date（两列语义不同：预案公告 vs 首次买入）
  算子：
    plan_pct_mid = (plan_pct_min + plan_pct_max) / 2          # 承诺规模强度（占股本比，表内自带分母）
    denom = plan_amount_max if plan_amount_max>0 else (plan_amount_min if plan_amount_min>0 else NaN)
    exec_ratio = done_amount / denom                          # denom 缺⇒NaN 禁填 0
    state_flag = progress ∈ {完成实施, 实施中, 董事会预案, 股东大会通过, 股东大会否决, 停止实施, 'nan'}   # 本班实测七值
  截面键：横截面对 (exec_ratio, plan_pct_mid) 排序；『停止实施/股东大会否决』单列为负向事件腿（研报与百科两面都给 ≥10% 级负反应）
  剔除腿：停牌/退市前 N 日、ST（沿本席在册 st_stock_list 与 is_st 铁律）、金融股是否剔＝本卡不像 AG 那样必须剔（回购对金融股语义成立），但须与 ⑥ 冻结口径一致
  禁则：禁取表内任何现成『分位/pct』列（在册 *_pct 前视坑）；禁把 progress 当公告时点状态用；禁 exec_ratio>1 时截断为 1（超额回购真实存在，见东财进展公告面）

