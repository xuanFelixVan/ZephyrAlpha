# ── 必备③ 逻辑描述
logic_zh: >-
  对相邻两次盘口快照，只在"报价档位未劣化"的前提下计入量变化，得到单边净供给变化 e_n：
  买一档价格不降则当前买量全额视为新增供给、前态买档价格不升则前态买量全额视为撤出（卖一镜像反向）。
  OFI_t = Σ_{n=t-W+1..t} e_n（W 为聚合窗）。经济含义=最优买卖档的瞬时供需失衡，
  短时窗内价格变化主要由 OFI 驱动且近似线性，斜率≈1/市场深度，故信号构造应为 OFI×(1/depth)
  或与价差/深度交互，而非裸 OFI 水平值。方向用法=OFI 归正押注 mid 上移（顺势），
  与做市成交概率反向的证据见同批改良情报卡（to_impl.md 20261015-p04-01 第 1 条）。

# ── 必备④ 伪代码（本席自拟，零外部代码复制）
pseudocode: |
  # 输入：某 symbol 单一交易日内按 timestamp 升序的 L1 序列 (P_b, Q_b, P_a, Q_a)
  for n in 2..T:
      e_bid = Q_b[n]  if P_b[n] >= P_b[n-1] else -Q_b[n-1]  if P_b[n] <  P_b[n-1] else 0
      e_ask = -Q_a[n] if P_a[n] <= P_a[n-1] else  Q_a[n-1]  if P_a[n] >  P_a[n-1] else 0
      # 注：档位价格不变时"量增部分"与"量减部分"不可同时取，上式即标准 L1 定义（同价档取差项）
      ofi[n] = ofi[n-1] + e_bid + e_ask        # 或直接滚动窗求和 Σ_{n-W+1..n}
  depth[n]  = Q_b[n] + Q_a[n]
  signal[n] = zscore( ofi_window[n] / (depth[n] + eps) )   # 深度归一，防流动性分层污染
  # PIT：signal[n] 仅用 t<=n 信息；标签用 n+1..n+H 的 mid 变化，禁未来函数
  # 缺测处理：bid/ask 任一非正 ⇒ 该笔丢弃并计数上报覆盖率，禁前向填充冒充事件

