    根因=百度云回填与 QMT 增量走 3 秒快照（get_full_tick），快照口径本就无成交 aggressor。
    ⇒ 本卡**刻意不依赖 direction**，OFI 只用 L1 价格-量两对列，属口径无关构造；
    任何依赖 direction 的族（主买净额/成交签名/毒性）在 2026-06 后不可算，须走 to_datasource.md 分段登记。

