  caliber_pitfall_zh: >-
    致命口径坑（本席实测，实现前必读）：本表在 2026-06 前后是两种采集口径——
    2026-01..2026-05 有主动方向标注（词表六值：买盘/卖盘/买入/卖出/中性盘/空串，且"买盘 vs 买入"同义未归一），
    2026-06 起 direction 腿退化（2026-08-03=14,063,495 笔全为"中性盘"；2026-09-15=21,669,608"中性盘"+56,187"none"；
