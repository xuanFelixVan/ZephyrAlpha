    本卡为横截面选股因子，其市场级代理是构造出来的派生序列（拉锯差分），非命题原形；面板档与代理档两条腿，勿混用。
  - >-
    GitHub star 面本班未取精确数（WebSearch 不给）⇒ 三筛里 star 筛本班未证伪亦未证实，如实留白，未凭记忆填。

caliber_pitfall_zh: >-
  (1) 隔夜收益定义依赖 close_{t-1}（票级 lag），停牌/退市使 c1 缺失或跨多日 ⇒ 须限定相邻交易日或声明 gap-fill 口径，⑤ 写死；
  (2) kline_daily_hfq 引擎本班未实测（在册纪律：判 FINAL 前先 get_table_engine_strict）；kline_daily=ReplacingMergeTree 不自动迁移到 hfq 面；
  (3) query_rows 会把 CTE 别名当表探引擎崩（07 班在册 engine_probe 空返回），⑤ 取数走 ch_writer.query_strict＋自加显式 FINAL；
  (4) 除权除息假跳是时段拆分特有污染，close-to-close 卡（residual_momentum）不暴露此坑 ⇒ 本卡与旧动量卡即便高相关也可能是不同噪声；
  (5) W（滚动窗）与『累计用 sum 还是 Π』两处口径任一改动即改读数，须写进卡面参数、不可在实现里默认。
