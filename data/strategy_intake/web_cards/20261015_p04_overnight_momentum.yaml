# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝把『动量』这一维从『日线 close-to-close 累计收益』升级为『按交易时段分解后的动量』。
  Lou-Polk-Skouras (2019) 与 Bogousslavsky (2021) 在美股把月频动量/value 的 alpha 拆到隔夜段与日内段，发现两段符号相反（『tug of war』）且滞后 60 月仍持续。
  本库既有卡族里，residual_momentum 走『残差动量』（剔除市场的 close-to-close 动量）、drift_gated_reversal 走『漂移门控反转』，
  两者都用整段 close-to-close 收益；本卡本体的不同＝先把日收益切成 隔夜=close_{t-1}→open_t 与 日内=open_t→close_t 两条子序列，
  再对『隔夜子序列』做滚动窗口累计（默认 126 交易日≈半年）形成个股截面排序键 ⇒ 这是时段结构轴，不是把同一 close-to-close 动量换个名字（构造对象不同：输入是拆分后的两段之一）。
  ⚠ 方向本席不代裁：美股文献给『隔夜反转』，但本库检索到的 A股一手证据互相打架——清华 2025 论文称 A股『隔夜负收益/日内正收益』、
  而 CSDN 实测笔记称 A股『隔夜累计收益正向（隔夜动量）』。二者符号相反，且都属他方读数而非本席检验。
  因此本卡只交构造与时段拆分口径，方向留给 ⑥ 预注册（新 card_id、带独立外部先验），严格遵 ⑨ 席在册令『现禁据此反号重挖、禁在原卡上翻符号复跑』。
  与相邻卡边界＝(1) residual_momentum：close-to-close 残差动量，本卡：拆分后的隔夜段累计，输入序列不同；
  (2) 博彩型 max-ret 族：max-ret 用单期极端日收益，本卡用时段收益的滚动累计，非极端值排序；
  (3) 楼1 盘口卡（ofi_l1/queue_imbalance/imbalance_microprice）用 tick 侧信息，本卡只用日线 OHLC。相邻性归 ⑥/⑨ 并员评估。
  闸面缺席说明见 data_binding.orthogonal_gate_zh——本卡是横截面选股因子，其『可闸的市场级代理』是时段动量之差（overnight 段动量指数 − 日内段动量指数，拉锯形），
  但本班高水位未物化，故只交构造不报 corr。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 DESCRIBE 实测名）
pseudocode: |
  # 本体：隔夜收益的滚动累计动量，个股横截面排序键（供 ⑤ 物化成 panel；市场级拉锯形另出）
  # 时段会计口径（Lou-Polk-Skouras 2019）：
  #   r_overnight_t = open_t / close_{t-1} - 1     （隔夜：前收 → 今开）
  #   r_intraday_t  = close_t / open_t  - 1         （日内：今开 → 今收）
  #   r_total_t ≈ (1+r_overnight_t)(1+r_intraday_t) - 1
  # ★复权硬约束：必须用后复权价面 c1_market.kline_daily_hfq（本班实测该表有 open/close/high/low/pct_change/lineage_version），
  #   不可用 c1_market.kline_daily 裸 open/close——除权除息日会在隔夜段产生一根假跳；
  #   kline_daily.adj_factor 系恒 1 死列（在册），不能用它自行复权。
  START = '2019-01-01'          # 与池 common_dates≈1472 同量级起算；深史段宇宙稀疏（在册 stk_limit pre-2019 ~237 票）
  W   = 126                      # 滚动窗≈半年，对齐文献月频累计；⑤实现须把 W 写进卡面参数（改 W=改读数）
  sql = """
    SELECT trade_date, symbol, open, close,
           lagInFrame(close, 1) OVER w AS c1
    FROM c1_market.kline_daily_hfq    -- 后复权面；引擎本班未实测，⑤ 前须 get_table_engine_strict 核并决定 FINAL
    WHERE trade_date >= {START} AND open > 0 AND close > 0
    WINDOW w AS (PARTITION BY symbol ORDER BY trade_date)
  """
  # 逐票：r_on = open/c1 - 1；滚动窗内累计 (Π(1+r_on))^(1) - 1（或 sum，⑤ 二选一并写死口径）→ on_mom_i
  #        r_id = close/open - 1；同窗累计 → id_mom_i
  # 截面键：横截面对 on_mom 排序（多头高 on_mom / 空头低，或反之，方向待 ⑥ 预注册）
  # 市场级可闸代理（本席未物化）：market_on_id_spread_t = mean_i(on_mom_i) - mean_i(id_mom_i)  ——拉锯『差分形』
  #   （依 07 班游标①：水平/均值形易被池内价格振荡成员吸收，差分/离散度形更可能过 |corr|≤0.3；本卡选差分形作闸面候选）
  # 纪律：不自算的收益列禁换成现成 pct_change（在册 修⑪）；pct_change 是 close-to-close，不含时段拆分，不可作本卡输入直接替代

