      本班 WebSearch 命中的 Jones (1996, The Accounting Review) PDF 片段逐字：「data are also collected on the frequency of late earnings
      announcements. This information is relevant because Chambers and Penman (1984) report that "bad news" earnings announcements are
      more likely to be delayed, causing their stock price effects to be preempted」。
      ⇒ 本条给出两件事：(1) "late announcement" 是可单独计量的频率量（＝本卡广度腿的原型）；(2) 延迟公告的价格效应会**被提前反映**（preempted）
      ＝本卡伪代码写死"事件日只允许用 actual_announce_date 次一交易日，禁把延迟本身当 T+0 可成交信息"。⚠ 大学讲义站转载 PDF＝无许可声明，只学思想不入码。
  - role: 及时性度量的正向可用版本（本卡第二腿"按期/提前披露占比"的出处）
    url: https://economy.alljournals.cn/relate_search.aspx?aid=718C5653299B31E448AEF43FCD3DF355&cid=E842965A0B2E2676&ctl=0&etl=0&language=&pcid=4182BDE6AAE91C51
    what_verified: >-
      本班 WebSearch 命中该期刊聚合页，其下挂摘要逐字（Brooks/Cheng/Liu/Yu, Journal of Corporate Accounting & Finance 2024, 35(1):277-307）：
      「firms with better earnings news are more likely to file their 10-Ks early … firms filing 10-Ks early in the current year are more
      likely to have better earnings and higher stock returns in future years … robust to different measures of timeliness」。
      ⇒ 本条＝"及时性"存在**双向**外部证据（早披露＝好消息 vs 晚披露＝坏消息），故本卡两腿（拖延广度、按期广度）并列而不合并、不自拍符号。
