title_zh: 财报披露拖延广度（利润表「计划披露日 vs 实际公告日」偏差＞0 的事件流占比）——披露及时性/time-to-metric 轴首条，含「本库三张表的 announce_date 语义＝计划日而非观测日、d<0 恒为 0＝单向钳制」两条硬证伪
mining_tower: 信息披露行为（何时披露，而非披露了什么）。本席 web_cards 已占『非标准审计意见广度』(nonstandard_audit_opinion_breadth＝审计人对报表的裁定内容)、『商誉高悬停广度』『资产增长异象』(＝报表数字自身的构造)，本轴对象＝**公司把报表推给市场的时间相对其自己申报的计划晚多久**，与上述三条的内容面正交；在册卡名面（docs/03_modules/_domain_backtest/exam_cards/entry_flow/ 全目录 grep「披露及时|timeliness|拖延|time-to-metric|预告」）**零命中同义卡**；L9-A05 盈余惊喜卡用的是 SUE（利润数值面）而**把披露时间只当 PIT 锚**，未把"延迟本身"做成信号＝对象不同。
