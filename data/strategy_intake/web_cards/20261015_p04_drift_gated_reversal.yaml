  primary_table: c1_market.kline_daily_hfq（反转腿/状态腿收益基准，实测 1990-12-19..2026-10-14、8741 日、5919 票）
  attempted_table: c1_market.daily_valuation（pe_ttm/pb_mrq/ps_ttm/pcf_ncf_ttm/is_st 列**存在**）
  measured_reachability:
    - "★本班新发硬发现（价值腿判据）：daily_valuation 全表实测 min=2026-08-03 max=2026-10-14 uniqExact(trade_date)=**47** rows=255,431 uniqExact(symbol)=5579；逐日行数 2026-08-03=5535／08-04=5536／10-09=5208／10-14=**1553**（前一日 10-13 为 5574）⇒ 短史 47 日直接撞门槛⑤（≥120 日）不可达，且末日采集塌陷"
    - "★同表 is_st 列全表 sum(is_st)=**0**（255,431 行、47 日，同期 A 股存在 ST 板块）⇒ ST 标记列无信息，ST 剔除不得声称由该列完成；本席另见同表 pe_ttm>0 占比仅约七成（10-14 日 1553 行中 pe_ttm>0=959）"
    - "反转腿/状态腿可达：kline_daily.pct_change 存在（列清单实测），日线密集宇宙自 2017-01-03（2016 年仅 234 票）；近端未断供（2026-09-25..10-14 逐日 5562..5568 行）⇒ 63 日窗与 k 日反转窗均足够长，右端可用 2026-10-14"
    - "规模替代腿（**仅供对照，禁偷顶价值**）：c1_market.stock_daily_basic 实测 2017-01-03..2026-10-14、2372 日、5904 票、10,517,539 行，turnover_rate>0 占比 116,588/116,588（2026-09 全月）⇒ 换手/流通市值腿健康"
  caliber_pitfall_zh: >-
    ①**价值腿禁止用规模或流动性顶替**：本库 PB/PE 只有 47 日，若实现方为凑齐三腿改用 circ_mv 或 turnover_rate 充当"价值"，
      卡面语义即被篡改（⑨席空白轴地图会把"估值"记成已出分＝账面造假）。本班交付形态明确为**半构造**（反转×个股状态门）。
    ②日线两张表的 turnover 列是死列：本席实测 kline_daily 与 kline_daily_hfq 在 2026-09 全月 sum(turnover>0)=0
      （116,749 行与 116,763 行，同表正对照 amount>0=116,641 行），换手真源只在 stock_daily_basic.turnover_rate⇒ 任何换手腿必须换表。
    ③"正收益日占比"对 0 收益日的归属敏感（涨停一字/停牌日 pct_change=0 计入分子与否会变阈值读数）⇒ ⑥须在卡面登记 0 收益日归属规则。
    ④suspend 表在册不可用（本席复核：全表 36 行、2026-09-04..09-23、来源标 derived_kline_gap，考试窗内 0 行，与⑤席在案件同源）⇒ 停牌剔除只能用日线缺行反推。

