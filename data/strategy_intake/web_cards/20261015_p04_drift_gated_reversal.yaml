# ── 必备③ 逻辑描述
logic_zh: >-
  短期反转（近期跌者未来反弹）在全样本上常常被两类票稀释：一是**仍在单边推进**的票（下跌由持续信息流驱动，
  反转只会接飞刀），二是随机噪声主导的横盘票。该文的处理是给反转加一根"个股状态门"：
  只用过去 63 日"正收益日占比"刻画该票处于缓涨漂移（>60%）还是非漂移状态，
  然后**只在门开的那些票-日**上对"价值＋短期反转"打分并构建组合，其余样本置为不持仓/无信号。
  与本库在册反转存量的根本差别=对象与层次：①存量 4 条反转族（STR-VREV-004 超短尾盘套利买点、STR-E-TIMING-001 恐慌反弹分布预测、
  STR-VREV-025 恐慌反弹/危机 alpha、STR-MULTIFACTOR-040 老题材反抽不追）都是**事件/择时型**（何时买入的触发），
  本卡是**横截面打分×个股自身状态过滤**（买谁的截面排序）；②在册两条状态类条目（STR-VREV-021 市场状态-策略-仓位动态映射、
  STR-MULTIFACTOR-086 波动率体制转换预警）的 regime 定义在**市场/板块层面**，本卡 regime 定义在**单只票自身序列**上，
  二者不可互推。方向先验：⑨席已把"正向动量溢价"判为反向先验（rows[73]/[74] 两次独立物化同判负号），
  而"缓涨漂移"这根门与动量高度同源⇒本卡存在"门本身是动量换皮"的实质风险，必须让⑥把"门开/门关"做成**分档对照柱**，
  否则等于给已判负的动量轴再交一张卡。本席不预设该门有效。

# ── 必备④ 伪代码（本席自拟）
pseudocode: |
  # 输入：个股日收益 r_{i,t}（后复权 close 计算）；可选价值列 V_{i,t}（本班判不可达，见 data_source_mapping）
  up_ratio[i,t] = mean_{s=t-D+1..t}( 1{ r[i,s] > 0 } )        # D=漂移回看窗（原文 63 日；值留⑥冻结，本席不代裁）
  drift_regime[i,t] = 1 if up_ratio[i,t] > theta else 0        # theta=原文 60%，同属判据自由度，留⑥
  rev[i,t]  = − rank_cs( cum_ret(i, t-k+1 .. t) )              # 短期反转腿：k 日累计收益取反再截面 rank
  # 原文组合腿（价值）在本库暂不可得，登记为 val[i,t] = rank_cs(1/PB 或 E/P)——本班实测不可达
  score[i,t] = rev[i,t]  (半构造交付：价值腿缺席时**不得**用规模或换手偷顶)
  signal[i,t] = score[i,t] * drift_regime[i,t]                 # 门不开⇒该票该日无信号（缺失，不是 0 分）
  # PIT：up_ratio/rev 只用 ≤t 信息；标签 t+1..t+H；禁"先按全样本筛出高绩效子集再回填历史"（该文自报 OOS 极端值正是此类风险的红旗）
  # 缺失处理：up_ratio 需 D 日全量，不足则整行缺失；停牌日（本库 suspend 表不可用，见供数单）须用日线缺行反推并计数上报覆盖率

