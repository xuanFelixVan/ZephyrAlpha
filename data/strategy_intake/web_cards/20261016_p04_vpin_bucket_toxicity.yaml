logic_zh: >-
  把一日成交按**固定成交量**切成 n 个桶（而非按固定时间切），每桶用买卖方向分类后取
  |V_B - V_S|，对 n 个桶求均值再除以桶容量 V＝VPIN。VPIN 高＝该时段成交里"方向单边"的成分高
  ＝知情交易者比例高的可观测代理；用于①横截面排序（谁的流水毒性强）②时序上的毒性突增预警。
  本库可落地形态＝先用**分钟 K 线**做 BVC（Bulk Volume Classification：分钟收盘≥上一分钟收盘
  记为买量，否则记为卖量；相等按 0.5/0.5 分摊），再用日频 OHLCV 做退化版（当日成交量整体归类）
  ＝退化版信息量显著低于原方法，须按"下限形制"消费。

pseudocode: |-
  # BVC（Bulk Volume Classification，日频/分钟频退化口径）
  # 输入 A：c1_market.kline_daily(symbol_canonical, trade_date, close, volume)   # 退化版
  # 输入 B：分钟 K 线（SL-A01 分钟腿，①席在册跨度确认后启用）                    # 正版
  dir[t]        = +1 if close[t] > close[t-1] else (-1 if close[t] < close[t-1] else 0)
  V_B[t]        = volume[t] if dir[t]==+1 else (0.5*volume[t] if dir[t]==0 else 0)
  V_S[t]        = volume[t] - V_B[t]
  # 量桶切分（按累计成交量凑满 bucket_size 即封桶，跨日允许）
  buckets       = split_by_cumulative_volume( (V_B[t], V_S[t]), bucket_size )
  imbalance_i   = | sum(V_B in bucket i) - sum(V_S in bucket i) |
  VPIN          = mean(imbalance_i over last n buckets) / bucket_size       # n 常取 50（Easley 等原文形制）
  signal[t]     = z250( VPIN[t] )        # 或 rank_cs(VPIN[t]) 做横截面排序，两条腿禁混报
  # 自检（写死，防本班踩过的恒零假绿）：
  #   zero_value_days == 0 且 nonzero_bucket_ratio > 0.9，否则该序列禁入闸
  #   bucket_size 取全样本日成交量的分位数时**禁**用未来分位（在册 *_pct 前视坑）

