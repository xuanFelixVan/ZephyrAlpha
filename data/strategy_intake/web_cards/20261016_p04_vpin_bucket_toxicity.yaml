caliber_pitfall_zh: >-
  ①桶容量 bucket_size 的选取直接决定 VPIN 水平值，文献用"按股票定容"，跨标的比较时**禁**用同一绝对容量
  （否则大票桶数多、小票桶数少，均值口径不可比）；②时间桶 vs 量桶混用＝VPIN 定义失守，
  量桶的"同步"指成交量同步而非时钟同步；③BVC 的价格相等分支（dir=0）如何分摊会改变不平衡量，
  必须写进冻结口径（本卡取 0.5/0.5，属**本席自定**而非外部源给定，⑥ 席可改判但须留痕）；
  ④"n=50 桶／日频 8 桶"两类外部读数不可互替（本班搜索命中的中文数据售卖页称"n=8 桶、1 分钟间隔、
  静态估计"，属**付费数据册自述**，非论文口径，禁当权威参数引用）。
