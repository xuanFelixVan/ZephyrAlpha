caliber_pitfall_zh: >-
  (1) 偏度对窗内 N 与 sigma 极敏感：sigma→0 会炸偏度，须加 sigma 下限与截面票数门（本卡建议 ≥500），否则静默出极端值；
  (2) kline_daily_hfq 引擎本班未实测（在册纪律：定 FINAL 前先 get_table_engine_strict）；pct_change 若已含复权，close/close_{t-1} 自算须与之一致，两种收益口径不可混；
  (3) query_rows 把 CTE 别名当表探引擎崩（07 班在册），⑤ 走 ch_writer.query_strict＋显式 FINAL；
  (4) 横截面偏度的『市场级离散度』是派生代理，非命题原形（命题原形是个股偏度排序选股），勿把代理档读数当选股证据；
  (5) 深史 pre-2019 宇宙稀疏（~237 票），60 日窗在早期票少的日子截面代表性差 ⇒ 与池 common_dates 对齐前先 HAVING 票数门。
