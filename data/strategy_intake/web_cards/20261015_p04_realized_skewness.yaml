# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝本库截面卡族集中在『一阶（收益方向：动量/反转）』与『二阶（波动：histvol/parkinson/garman_klass/rogers_satchell、idiosyncratic_vol、avg_abs_ret）』，
  三阶矩『偏度』是一条未占的分布形状轴。Amaya et al.(2015) 在美股用个股日收益算已实现偏度做横截面排序，得显著负向预测（高偏度票未来收益低，
  与『彩票型偏好』一致：散户追逐正偏长尾→价格被高估→未来收益低）。
  本卡本体＝对每只票取滚动窗（默认 60 交易日）日收益的『样本偏度』（三阶中心矩除以二阶中心矩的 3/2 次方），横截面排序。
  与既有二阶矩卡的构造差异＝输入用的是同一列日收益，但统计量是三阶矩而非二阶矩：波动读『离散幅度』，偏度读『不对称方向』，
  两者可同日同票取不同值；正因如此本卡不是 idiosyncratic_vol 换名，但 ⑤ 物化后须过正交闸确认（见 data_binding，本班高水位未物化）。
  ⚠ 方向本席不代裁：美股负向，但本库检索到的 A股一手（VIP《已实现波动、偏度和峰度…中国A股》摘要）明说 A股偏度关系『与美国显著负不同』。
  ⇒ 遵 ⑨ 席在册令，方向留 ⑥ 预注册（新 card_id＋独立外部先验），本卡只交构造与『三阶矩 vs 二阶矩』的轴合法性诉求。
  与相邻对象边界＝(1) idiosyncratic_vol/各实现波动＝二阶矩，本卡＝三阶矩，同输入不同统计量；
  (2) 峰度(博彩/彩票 max-ret 族)＝四阶矩，与偏度同属高阶但不同阶，VIP 文里『负相关峰度』是另一条腿，本卡不自称覆盖峰度；
  (3) 『市场偏度择时』(NJUST/EMFT 文)＝市场级总偏度时序，本卡＝个股偏度横截面，两对象不同面，勿混读。相邻性归 ⑥/⑨ 并员评估。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 DESCRIBE 实测名）
pseudocode: |
  # 本体：个股滚动窗已实现偏度，横截面排序键（供 ⑤ 物化成 panel；市场级可闸代理另出）
  # 日收益口径：r_i,t = close_t/close_{t-1} - 1（用后复权面），或直接用 c1_market.kline_daily_hfq.pct_change/100
  #   —— 注意：本卡用『日收益序列』本身，不涉及时段拆分，故 pct_change 复权口径正确即可用；
  #     但 kline_daily（未复权）的 pct_change 在除权日仍失真 ⇒ 统一取 kline_daily_hfq
  START = '2019-01-01'
  WIN = 60                        # 滚动窗（交易日），≈一季度；⑤ 须把 WIN 写进卡面参数（改窗=改读数）
  # 逐票：取过去 WIN 日 r_i 序列 → 样本偏度 skew_i = (1/N)Σ((r-mu)/sigma)^3（Amaya 用日收益的已实现偏度标准化式）
  #        mu, sigma 为该 WIN 窗内均值/标准差；sigma=0 或 N<WIN*0.6 记缺失（截面完整性门）
  # 截面键：横截面对 skew_i 排序（多头低偏度/空头高偏度 或反之，方向待 ⑥ 预注册）
  # 市场级可闸代理（本席未物化）：market_skew_disp_t = quantile_90(skew_i) - quantile_10(skew_i)（截面离散度形，
  #   依 07 班游标①：水平/均值形易被池内波动成员吸收，离散度形更可能过 |corr|≤0.3）
  # 纪律：本卡统计量是三阶矩，禁与二阶矩波动卡互换输入实现；sigma 估计与 skew 是否去均值两种口径须写死其一

