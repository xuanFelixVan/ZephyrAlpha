logic_zh: >-
  经济直觉＝隐含方差的期限方向刻画市场对「近期风险 vs 远期风险」的相对定价。
  近月 IV 高于远月（backwardation／倒挂斜率）＝恐慌集中在眼前，通常对应已发生的冲击与短期超额收益；
  远月高于近月（contango／正向斜率）＝风险被定价在未来，对应平静期或对未来不确定性的预防性定价。
  与本库既有波动率成员的关键差别＝既有成员只量「波动多大」，本卡量「波动多久」＝一个序列的水平，一个序列的导数方向。
  构造（本班实跑口径）＝逐 (trade_date, underlying) 取 |delta-0.5|≤0.1 且 iv>0 的期权作 ATM 档，
  按到期日升序取剩余期限 ≥5 天的最近两档（近月 n、远月 f），各档对 call/put 混合取 IV 算术均值，
  信号＝iv_f/iv_n − 1；同日多标的（510050.SH/510300.SH/510500.SH）取均值，当日不足 2 个标的则弃该日。
  方向＝**不预注册**（见 self_flag）。

pseudocode: |-
  # 市场级代理腿（本席本班实跑＝正交闸采信的序列即此腿，非个股面板腿）
  # 真源表：c1_market.option_iv_surface（ReplacingMergeTree，读侧必带 FINAL）
  rows = ch.query_strict("""
      SELECT trade_date, underlying, expiry, option_type, delta, iv
      FROM c1_market.option_iv_surface FINAL
      WHERE underlying IN ('510050.SH','510300.SH','510500.SH')
        AND option_type IN ('call','put')          -- 实测 option_type='' 有 24811 行，必须排除
        AND abs(delta - 0.5) <= 0.1                -- ATM 档按 delta 选（该表无标的现价列，不能用 strike 距 ATM）
        AND iv > 0
        AND trade_date >= '2019-01-01'
  """)                                             # 本班实测返回 19113 行

  by = defaultdict(lambda: defaultdict(list))      # (date, underlying) -> expiry -> [iv]
  for td, und, exp, _ot, _dl, iv in rows:
      by[(td, und)][exp].append(float(iv))

  sig = defaultdict(list)                          # date -> [slope]
  for (td, und), emap in by.items():
      exps = sorted(e for e in emap if (e - td).days >= 5)   # 剔到期日<5天的档（到期跳变污染）
      if len(exps) < 2:
          continue
      iv_n = mean(emap[exps[0]])                   # 近月 ATM 均值 IV
      iv_f = mean(emap[exps[1]])                   # 次近月 ATM 均值 IV
      if iv_n <= 0:
          continue
      sig[td].append(iv_f / iv_n - 1.0)            # 斜率：远月相对近月的 IV 比

  # 日频序列 = 同日跨标的均值；标的覆盖 <2 的日子弃（本班实测＝右删失，见 caliber_pitfall 第 3 条）
  out = [(d, mean(v)) for d in sorted(sig) if len(sig[d]) >= 2]   # csv 列名固定 date,sig

  # 备考第二形（本席未物化，交 ⑤/⑥ 判定是否另立 card_id）：
  #   水平腿 iv_n 与斜率腿 slope 是两列，1015-02 班在册「市场级水平值已 fail」只判了水平腿，
  #   本卡主张的是斜率腿；若 ⑥ 要同楼双臂并考，须另立卡禁在本卡翻构造。

