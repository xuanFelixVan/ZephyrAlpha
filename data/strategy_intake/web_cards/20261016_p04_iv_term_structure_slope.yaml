caliber_pitfall_zh: >-
  五条硬口径坑（全部本班实测或在册，禁凭记忆引用本卡）：
  ①ReplacingMergeTree 不 FINAL 会吃重复档→斜率分母被旧版本污染（在册 ch-query-fails-soft-trap：
  ch_writer.query 出错返回空串而非抛，query_strict 才自带显式 FINAL，本席全程用 query_strict）。
  ②option_type 空串 24,811 行＝若不过滤会把同一 (date,expiry) 混进未知方向期权，均值 IV 口径漂移。
  ③到期日 <5 天的档必须剔（本卡用 (expiry-date).days>=5 谓词）：到期当档 IV 常被置 0 或缺失，
  会让 iv_n 塌到极小、斜率爆表——这类极值若留下会伪装成「深度倒挂」信号。
  ④期限结构斜率与「已实现波动期限结构」（如 RV5/RV60）不是同一物：后者属本库已判边际零的
  avg_abs_ret 族（⑨ 1015-04 班在册），引用者禁把两者混为一轴。
  ⑤万方那条摘要的命题是斜率→跨式期权策略收益（期权端），与本卡斜率→标的未来收益（股票/指数端）
  不同对象，禁跨面当同一证据。
