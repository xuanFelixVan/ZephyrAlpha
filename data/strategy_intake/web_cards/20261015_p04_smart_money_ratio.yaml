  primary_table: c1_market.money_flow（main/super_large/large/medium/small 五档净流入额与占比各一列，另有 close、pct_change）
  secondary_table: c1_market.stock_daily_basic（circ_mv 作归一分母）
  label_table: c1_market.kline_daily.pct_change（涨幅腿）
  measured_reachability:   # 本班 2026-10-15 CH 只读实跑（zephyr.data.ch_reader.query_rows）
    - "money_flow 跨度=2021-01-04..2026-10-14，uniqExact(trade_date)=1228，uniqExact(symbol)=5783，data_source 单值=tushare（2026-09 起窗口 144513 行全量）"
    - "近端单日：10-08=5572 行 / 10-09=5573 / 10-12=5573 / 10-13=5574 / 10-14=5574，其中 main_net_inflow!=0 分别 5496/5508/5489/5492/5479"
    - "历史单日覆盖：2021-01-04=4120 只，2022-06-15=4716 行/4716 只，2023-01-04=4901 只 ⇒ 宇宙逐年扩张，早期截面薄"
    - "占比腿分布：main_net_inflow_pct 中位=-5.2215，P90=18.302；边界读数 min=-100 max=+100 恰为满量程，countIf(abs>=99.999)=1384 正＋1409 负（2026-09 窗内 144513 行，约 1.93%），全表 68256/5998905=1.14%"
    - "金额腿量级：main_net_inflow 中位=-104.78，P90=1086.62（单位与 circ_mv 对表前禁直除）"
    - "stock_daily_basic circ_mv 于 2026-10-14：5563/5563 行 >0，中位 493741.644"
    - "JOIN 实测：money_flow 裸 symbol × stock_daily_basic 裸 symbol 于 2026-10-14 = 5563 行；× kline_daily 裸 symbol = 5563 行；改用车间后缀键 symbol_canonical 对 stock_daily_basic.symbol = 0 行"
  caliber_pitfall_zh: >-
    四条致命口径（本班实测＋③席在册实测合并，实现前必读）：
    ① money_flow.close 与 money_flow.pct_change 在 2026-09 窗内 144513/144513 全为 0，与③席五年全段读数一致——
      标签腿必须外接 kline_daily.pct_change（同表名列名相同而一表有值一表恒 0，是本族最易踩的静默坑：
      用它做残差化的话就是对常数回归的空操作，报错都不会报）。
    ② main_net_inflow 不等于 super_large＋large：③席在册读数仅 909479/1233202 行成立（占比版仅 343818）——
      故 main 与超大＋大是两个信号，本卡伪代码按两臂分写，禁当同物两形。
    ③ 在册先例更正（另起留旧案）：strategy_registry.yaml 第 2508 行自陈"money_flow 每 symbol 每日 2 行去重、剔除周末幻影行"，
      本班逐年实测 rows 与 uniq(symbol,trade_date) 全等（2021=1058846、2022=1146266、2023=1209660、2024=1233202、2025=861547、2026=489384）
      且 toDayOfWeek in (6,7) 行数=0 ⇒ 该去重条款在现盘面上是空操作。⑤实现禁把它当"已处理"依赖，另须防历史批次口径变更。
    ④ 占比腿存在满量程堆积（±100 恰为边界，约 1.14% 全表）——分位化或 winsorize 必须显式声明边界归属，
      否则极端组会被截断噪声主导。

