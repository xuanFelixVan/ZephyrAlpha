# ── 必备③ 逻辑描述
logic_zh: >-
  动机=大单净流入是最便宜的"知情交易"代理，但绝对金额被市值污染，跨市值不可比。
  构造=先取个股当日大单（或超大单＋大单，两档须分臂，理由见 caliber_pitfall_zh）净流入额，
  除以当日流通市值得到无量纲强度，再按交易日做截面去均值（③席已实测五档占比之和为非零和，
  中位约负6至负11个点，不去均值＝把市场整体流出误读成个股信号），最后对窗内 W 日求均值或累计。
  用法上禁线性全域排序——外部两组独立回测均报"全域不单调、中段分组稳定超额、两端对称陷阱"，
  且短期（5 日）显著而中长期失效，故本卡定位为**短窗分组过滤候选**而非全域打分因子。
  方向性存在两派证据未收敛：资金流入顺势派（强度越高越好）与短期反转派（大额净流入次日跑输0.3%），
  本席不代裁，要求⑥预注册时分"顺势臂"与"反转臂"两臂同考，两臂不得合并报数。

# ── 必备④ 伪代码（本席自拟，零外部代码复制）
pseudocode: |
  # 输入：c1_market.money_flow（裸6位 symbol）＋ c1_market.stock_daily_basic（裸6位 symbol，取 circ_mv）
  # 跨表 JOIN 只用裸 symbol——本班实测 money_flow.symbol_canonical 对 stock_daily_basic.symbol 得 0 行（静默空 JOIN）
  for d in 交易日:
      s = Σ( 当日大单净流入 )  或分臂取 s_xl = 超大单净流入, s_l = 大单净流入   # 两臂分开，勿默认 main = super + large
      mv = circ_mv[d]                       # 单位对表：本库 circ_mv 中位读数 493741.644，须与净流入额单位核对后再定标度
      raw[d] = s / (mv + eps)
      cs[d]  = raw[d] - median_cs(raw[d])   # 按日截面去中位数（非零和校正；⑤实现时中位数与前两章的均值臂分考）
      sig[d] = mean( cs[d-W+1 .. d] )        # W 留⑥冻结；外部证据只支持短窗，长窗须单独证
      # 归一化后一律取截面 rank 或分组，禁裸阈值
      # 标签：forward return 用 c1_market.kline_daily.pct_change（money_flow.pct_change 全段恒 0，禁作标签腿）
      # PIT：sig[d] 为盘后统计口径，最早可用时刻=d 收盘，禁与 d 日盘中决策混用
      # 覆盖率：净流入腿非零率约 98.6%（本班实测 5479/5574 于 2026-10-14），缺口须计数上报，禁前向填充

