# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝楼5 在分数册是「本体空白、条件占位」（⑨席在册读数：波动率名只作事件触发条件出现在
  TDM-E-L1-S2/calibration/*_ind_vol*_high_event，34 行占位，零「以波动率为信号本体」的出分行），
  而 avg_abs_ret 本体 4 卡全 fail、level 面禁再加卡（⑨席 04 班方向单第 2 条）。
  本班不干「换一个新估计量再赌一次」的事，而是先把 ⑨席那句「换构造且不与其共线」当**可测命题测一遍**，
  再决定这张卡的主腿放哪。测完的结论与直觉相反，所以把结论写在最前面。

  测得结论一（极差族不是六个信号，是一个）：把已物化的 6 枚波动率序列
  （Parkinson／Garman-Klass／Rogers-Satchell／Yang-Zhang／histvol／natr，等权市场级，20 或 14 日窗）喂 pool-report，
  得 n_members=6、共同日 1504、**有效独立信号数 PR=1.0529**，两两相关全在 0.9438（histvol↔natr）至
  0.9981（parkinson↔garman_klass）之间。⇒ 沿「多找几个极差变体」这条线加 6 张卡＝同一轴重复计量 6 次，
  按 SOP v1.4.0 正交挖矿制只能计 1.05 员。

  测得结论二（真正交不是「换估计量」买来的，是「标准化」买来的，而且只买到贴柱）：
  以 parkinson 为候选喂准入闸——**水平面 vs avg_abs_ret＝0.3881，判 reject**；换成 20 日 z 面后
  parkinson_z20＝0.2977、garman_klass_z20＝0.2763、**而收盘族的 histvol_z20＝0.2999**，三者同判 pass。
  关键在 histvol：它与 avg_abs_ret 同属收盘-收盘家族，却在 z 面一样降到 0.2999，
  说明把相关压到 0.3 以下的功劳在 z 化（减自身滚动均值、除滚动标准差），不在极差构造本身；
  且三根读数全部紧贴 0.3 这根柱，最小余量只有 0.0001（histvol_z20）。
  ⇒ 本卡禁止把「极差构造」登记为正交性来源，只允许登记为「同一波动率轴上的更低噪声测量」。

  因此主腿改走**信息源分解**：按上列两篇 A 股实证（知网《低波动率异象实质》、万方《低风险异象之「谜」》）
  的同向结论，低波动溢价的载体是**特质波动率**（对市场回归取残差波动），而**系统波动率符号相反（正相关）**；
  总波动率之所以看起来呈「低波动溢价」，是两股符号相反的力叠加后的净余。据此立**双臂＋一审计列**，
  三列分别喂闸、禁折叠成一列只测一次：
  臂A（特质波动，方向先验＝低特质波动押正超额）＝个股收益对市场收益回归的残差波动；
    极差估计量在此只作残差/波动的低噪声前置，不作新信息；
  臂B（系统波动＝beta × 市场波动那一成分，方向先验＝正）＝与臂A 做双变量排序互控。
    依万方文结论「控制波动率后 Beta 异象消失」，beta 面应作**对照**而不是第三个成员；
  审计列（总波动 ≈ 系统项＋特质项的方差分解）只用于核对分解是否算错，禁当信号进卡考。

  与在册存量的两条关系（防重复计量）：其一，「RV_5d/RV_20d 压缩→变盘预警」这条**波动率期限结构**腿已在
  strategy_registry 第 10919-10926 行『波动率体制转换预警』量化在册，本卡**不含**该腿，下游若想加须先过那条存量卡的去重；
  其二，第 11480 行起『Barra 风格因子 A 股适配』把 VOL=252 日收益波动率倒数当作十大风格因子之一并「依次正交化」，
  本卡与它的差别是截面单变量双臂＋日频 PIT＋符号由分解层决定而非取倒数。该差异是否足以构成新轴由⑥排闸判，本席不代裁。

# ── 必备④ 伪代码（本席自拟，零外部代码转写）
pseudocode: |
  # 输入 c1_market.kline_daily(trade_date, symbol, open, high, low, close, pct_change, symbol_canonical)
  # 市场基准收益 r_mkt[d] 的三条候选通道见 data_source_mapping，本席不代选
  for d in 交易日:
      r = 个股对数收益 或 pct_change[d]            # 与标签同源；两种口径须择一写死进卡面假设

      # ── 测量精度层（极差族；本班实测＝同一轴，禁按 6 员计）
      pk = 0.5 * ln(high/low)^2                    # Parkinson；high=low 时恒为 0（见 pitfall ①）
      gk = 0.5*ln(high/low)^2 - (2*ln2-1)*ln(close/open)^2    # Garman-Klass（假定无隔夜跳空）
      yz = 加权组合(开盘跳空项, 收盘项, rogers_satchell项)     # 权重与漂移假设留⑥冻结
      rs = ln(high/close)*ln(close/open) + ln(low/close)*ln(close/open)   # 漂移无关项

      # ── 滚动窗总波动（窗长 W0/W1 留⑥预注册，本席不拍数值）
      s_range = sqrt( rolling_mean_20( pk 或 gk 或 yz ) )
      s_cc    = rolling_std_20( r )                # 与在册被判负的 avg_abs_ret 同族，须单独喂闸

      # ── 主腿：系统/特质分解（本卡的信息源所在）
      beta_i, alpha_i = rolling_OLS_60( r_i ~ r_mkt )     # 估计窗/winsorize/停牌日处理 = ⑥须声明
      sys_i  = beta_i * r_mkt[d]
      resid_i = r_i - (alpha_i + sys_i)                  # alpha 是否一并吸收须声明（影响残差方差水平）
      s_idio = rolling_std_20(resid_i)                   # 臂A：特质波动（先验负向）
      s_sys  = rolling_std_20(sys_i)                     # 臂B：系统波动（先验正向）
      s_total_check = rolling_var_20(r_i) - (s_sys^2 + s_idio^2)   # 审计列，禁进卡考

      # ── 进信号前的强制一步（本班实测：省掉这步会被闸拒）
      z_idio = (s_idio - rolling_mean_20(s_idio)) / rolling_std_20(s_idio)
      z_sys  = (s_sys  - rolling_mean_20(s_sys )) / rolling_std_20(s_sys )
      # 注：水平面 vs avg_abs_ret = 0.3881 判 reject；z 面 0.2977 判 pass 且余量 0.0023。
      #     两问两答，故 z 化是「必需项」而非「可选项」，且过闸结论不稳健（贴柱）。

      sig_A = rank_cs( z_idio ) 按行业×市值分组去规模    # 分组数与降维列口径留⑥
      sig_B = rank_cs( z_sys )

      # ── 宇宙
      剔除 金融（银行/券商/保险）——理由见 pitfall ④，与卡11 共用证据链
      剔除 ST、停牌、上市龄 < 估计窗
      一字板日 high=low ⇒ 极差项 = 0 属缺测而非零波动，按 pitfall ① 的方案处理

      # ── 标签
      y = 未来 n 日累计收益（kline_daily.pct_change 口径）；n、折叠方式、多空对称性全留⑥预注册

# ── 必备⑤ 数据源映射
data_source_mapping:
  source_line: SL-A01 日线行情线（kline_daily 族）。本卡只用行情线；SL-A04 估值面被在册「daily_valuation 47 日」整体阻塞，不取。
  primary_table: c1_market.kline_daily
  secondary_table: c1_market.kline_index 与 c1_market.index_quote 与 c1_market.index_constituent（市场基准收益三候选，择一权在⑤）
  measured_reachability:
    - kline_daily 跨度 1990-12-19 至 2026-10-14；uniqExact(trade_date)=8741；uniqExact(symbol)=5922
    - OHLC 四列满值率（2026-09-01 起窗 144576 行）：countIf(high>0)=countIf(low>0)=countIf(open>0)=countIf(close>0)=144576/144576，即 100%
    - 同窗 countIf(high>low)=144305/144576＝99.81%；high=low（一字/无波动日）占比实测 0.0042313（2025-01-01 起全样本）＝极差族约 0.42% 样本天生塌零
    - 本班 pool-report 实跑面：6 枚波动率序列共同日 1504（序列面 2019-01/02 起、2025-09-09 止），PR=1.0529
    - 本班 gate 实跑面：候选 parkinson 水平面与三枚 20 日 z 面（parkinson/garman_klass/histvol）对池 {avg_abs_ret, avg_abs_ret_z20}，n_overlap 1485 至 1507
    - 市场基准三通道只验存在未验口径：system.tables 命中 kline_index、kline_index_calc、index_quote、index_constituent、index_weight、market_index_meta；其收益列非零率与指数形态归一本班未测（在册已知 kline_index 双形态分裂、000300 全程单裸形态）
  caliber_pitfall_zh: >-
    ① 一字板与无波动日 high=low ⇒ Parkinson/GK 的极差项恒等于 0。这个 0 是缺测不是低波动，
      直接进滚动均值会把 0.42% 样本变成向下偏置（且涨跌停日往往正是高波动日，偏置方向与直觉相反）。
      处理三选一（剔除／前值替代／与收盘项取大）须由⑥冻结并写进卡面假设。
    ② 极差估计量的经典效率优势（约 5×/7.4×/14×）指的是**同期波动率估计的方差**更小，
      不等于对**未来收益**预测力更强。本班 arXiv 三条命中全是「预测下一期波动」或「监测压力」用途，
      无一条支持「极差水平预测下一期横截面收益」。下游禁把「估计更准」转写成「信号更强」。
    ③ 本卡所有闸读数是在**市场级（等权指数）单列序列**之间测的，而本卡主张的是**个股截面**因子。
      单位不同：聚合序列相关只证「市场层波动率水平信息」重复，不证截面特质波动与既有池正交。
      这是本班对闸面的一条观测（不是判据改动）：现契约 --candidate/--pool 只吃 date,sig 单列，
      截面候选须先约定一个降维列（例如多空价差序列或截面均值序列）才能进闸，否则「过闸」的含义不明。降维口径归⑥。
    ④ 特质波动的估计窗与停牌/涨跌停处理直接改变符号读数（残差被截断即压低特质面）。
      在册已有的 34 行 *_ind_vol*_high_event 用的是事件触发口径，与本卡的截面排序口径禁互相引用为同一量。
    ⑤ 跨表 JOIN 用裸 6 位 symbol（在册卡07 实测：money_flow.symbol_canonical ↔ stock_daily_basic.symbol＝0 行静默空集）；
