    - "2026 年单年 uniqExact(trade_date)=186 ⇒ 交易日历全覆盖"
    - "turnover_rate 非零率=144389/144389（2026-09-01 起窗口，100%），中位 1.7877，P90 6.3214"
    - "逐年覆盖（uniqExact(symbol)）：2017=3468／2019=3768／2021=4702／2023=5381／2025=5500／2026=5594"
    - "circ_mv 于 2026-10-14：5563/5563 >0，中位 493741.644（本表列集=trade_date,symbol,turnover_rate,float_share,circ_mv,total_mv,data_source,ingest_ts，无 PE/PB 列）"
    - "对照（在册未修，本班复证）：kline_daily countIf(turnover>0)=0/144576 而 countIf(amount>0)=144438；kline_daily_hfq 同形 0/144590 与 144452 ⇒ kline 侧 turnover 是死列，正对照同表 amount 有值"
    - "标签腿正对照：kline_daily.pct_change countIf(!=0)=141155/144576（2026-09-01 起），max(trade_date)=2026-10-14"
  caliber_pitfall_zh: >-
    ① 同名两表两套命：换手率真源在 stock_daily_basic.turnover_rate（有值），kline_daily.turnover 恒 0（死列）——
      绑错表会得到全零因子且不报错。
    ② turnover_rate 的百分数与小数口径未在本库任何注释中声明（本班读数中位 1.7877、P90 6.3214，
      若为百分数则中位换手 1.79% 合理；若为小数则中位 178% 换手不合理⇒判定为百分数口径）；
      ⑤实现仍须以 float_share 与 kline_daily.volume 反算一日样本互证后才可写死标度。
    ③ 逐年覆盖从 3468 只（2017）涨到 5594 只（2026），横截面分位与分组阈值禁跨宇宙直接对齐（在册密度先例：日线密集宇宙起点 2017-01-03）。

