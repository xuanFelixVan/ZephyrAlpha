# ── 必备③ 逻辑描述
logic_zh: >-
  动机=楼6 在本库是空白轴（⑨席正交地图：无一条以流动性度量为信号本体出分），
  而本库唯一健康的换手率腿在 stock_daily_basic.turnover_rate（本班实测 2017-01-03 起 2372 个交易日、
  2026-09 窗内 144389/144389 行全为正值、中位 1.7877、P90 6.3214）——同域的 kline_daily.turnover 与
  kline_daily_hfq.turnover 两列恒 0（在册未修，本班复证），故本卡明确绑 turnover_rate 而非 kline 侧 turnover。
  两臂分考、禁合并报数：
  臂A（流动性溢价）=低换手押正超额，水平值按行业与市值分组取截面分位；依据是 Haugen-Baker/Hu/Datar-Naik-Radcliffe 一脉的负相关证据。
  臂B（不确定度）=换手**异动**（对自身滚动分布的 z 或相对行业中位）押反向，依据是"Turnover: Liquidity or Uncertainty"的竞争性解释——
  高换手可能对应高不确定度因而高要求收益，也可能是情绪过热因而后续回落，两派在同一列上给出相反符号，必须由考试判定而非由本席择一。
  与卡04（Corwin-Schultz 高低价隐含价差，同属楼6 但本体不同）关系：价差腿测的是价格成本，本腿测的是交易活跃度，
  二者在 A 股日线上相关性未测——已挂 self_flag 请⑥排闸。

# ── 必备④ 伪代码（本席自拟）
pseudocode: |
  # 输入：c1_market.stock_daily_basic(turnover_rate, circ_mv, symbol 裸6位)
  #       c1_market.kline_daily(amount, pct_change) 仅用于对照臂与标签，勿用其 turnover 列（恒 0）
  for d in 交易日:
      tr  = turnover_rate[d]                      # 已是比率口径（百分数），单位对表见 caliber_pitfall_zh
      # 臂A：水平值截面分位（先按行业×市值分组去规模）
      lvl[d] = zscore_within(industry, size_bucket)(log(1 + tr))
      # 臂B：异动度（对自身滚动窗的偏离，窗长与是否取绝对值留⑥冻结）
      mov[d] = (tr - median(tr[d-W0+1 .. d])) / (mad(tr[d-W0+1 .. d]) + eps)
      # 交叉验证构造（可选第三臂，须单独考）：Amihud 非流动性 = mean(|pct_change| / amount)
      #   ——注意其分子与被⑨席判负的 avg_abs_ret 本体同源，禁与 avg_abs_ret 混读为两轴（在册：4 卡全 fail）
      # 停牌与零成交日：tr=0 或该日无行 ⇒ 记缺测，禁填充；覆盖率须随因子一并上报
      # 标签：kline_daily.pct_change 的 n 日前瞻累加，宇宙过滤口径（ST/上市龄/涨跌停）留⑥预注册
      # PIT：turnover_rate 为当日收盘后统计，仅可用于 d+1 起决策

