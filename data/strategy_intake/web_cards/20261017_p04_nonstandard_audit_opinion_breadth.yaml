logic_zh: >-
  机制：年度审计报告是外部独立审计人对财报整体可采信度的**唯一正式裁定**，意见类型分五档（标准无保留／带强调事项段的无保留／保留／无法表示／否定），
  后四档合计即"非标"。非标意味着或报表存在重大错报风险、或审计人拿不到充分证据（范围受限）、或持续经营存疑。
  已验证的市场行为形态＝**反应缓慢**（事件日后约 10 日才走出显著负收益，前窗反而可能已有泄露型异动）＋**年报季末周披露的负超额更显著**＋**类型可分（持续经营型 vs 非持续经营型）**＋
  **分档回避是实务主流动作**（"非标必须无条件回避"）。本卡因此不做单一二元事件，而是把三件事分开构造：
  (a) 存量广度＝截至今日"最近一次年报意见为非标"的票占比（横截面风险敞口的市场级度量）；
  (b) 新增事件流＝当日/近窗首次落入非标的家数（信息到达速率，去共趋势的变化腿）；
  (c) 档位强度＝按四档加权（强调事项段 < 保留 < 无法表示/否定），不做合并 0/1。
  ⚑ 本班**不预注册方向**：外部六路里五路给负向（回避/负超额），但 CSDN 实务稿自述『15 年之前这类股票表现良好、17 年后完全逆转』＝存在制度断点；
  且存量广度与"小市值/ST 集中"强绑定（该稿读数：127 只里 79 只<50 亿、46 只 ST）⇒ 本轴很可能在市值/ST 轴上被吸收。方向与断点处理权全部交 ⑥。

pseudocode: |
  # 本班自写，零外部代码；列名全部来自本班 system.columns 实测（见 data_binding）
  NS_TYPES = ("带强调事项段的无保留意见", "保留意见", "无法表示意见", "否定意见")   # 本班实测四档字面枚举
  SEV = {"带强调事项段的无保留意见": 1, "保留意见": 2, "无法表示意见": 3, "否定意见": 4}  # 档位权重＝本席自定，未冻结，交⑥立法
  SQL_EVENTS = """
    SELECT symbol_canonical, announce_date, audit_result
    FROM c3_fundamental.audit_opinion FINAL
    WHERE announce_date > toDate('1990-01-01')          -- 本班实测 150 行 1970 哨兵必须剔
      AND audit_result IS NOT NULL                       -- 实测 3 行 \N
  """
  # 关键 PIT 规则（本班实测得出，不得反过来写）：
  #   announce_date 与 report_period 的年差分桶实测 = +1年 81,206 / >1年 9,991 / 同年 4,663 / 负 150
  #   ⇒ announce_date 只可作"可得日"下界使用；同年/负值两桶（4,813 行）不得当事件日直接喂信号
  def build_signal(cal_dates, universe_size):
      ev = read(SQL_EVENTS)                        # (symbol, announce_date, audit_result)
      latest = {}                                  # symbol -> 最近一次意见（按 announce_date 单调推进）
      level, new_ns = [], []
      for t in cal_dates:
          todays = ev[ev.announce_date == t]
          for r in todays: latest[r.symbol] = r.audit_result
          n_stock   = sum(1 for v in latest.values() if v in NS_TYPES)          # 存量广度分子
          n_new     = sum(1 for r in todays if r.audit_result in NS_TYPES)      # 新增家数
          sev_w     = sum(SEV.get(r.audit_result, 0) for r in todays)           # 档位强度
          level.append(n_stock / universe_size)
          new_ns.append((n_new, sev_w))
      breadth = zscore_rolling(level, 250)          # ⚑ 分位/z分一律自算滚动窗，禁取表内现成分位列（在册前视坑）
      churn   = log1p(new_ns) - log1p(new_ns).shift(TRAIL)   # 变化腿：本班实测 76% 交易日为 0，须如实披露弱证据
      return DataFrame(date=cal_dates, sig_breadth=breadth, sig_churn=churn)

