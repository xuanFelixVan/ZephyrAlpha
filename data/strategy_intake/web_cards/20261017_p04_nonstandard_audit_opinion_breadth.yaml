    成因文本列零命中（本班未见任何 cause/reason 列，system.columns 全列面见上）⇒ 外部证据里"持续经营型 vs 非持续经营型可分"这一层**本库今天不可复刻**，
    本卡只能做到"档位可分、成因不可分"。次缺口＝**未经审计**这一档在 CSDN 口径里与保留/无法出具同记 3，而本表五档枚举里无"未经审计"字面值⇒分档映射存在一处**外部枚举与本库枚举不等价**，交 ⑥ 对齐。
    第三缺口＝audit_fee 覆盖仅 43.8% ⇒ "审计费用异常/议价能力"这条姊妹腿**不可全窗使用**（本班不建该卡，只登记为待源）。
  source_line_mapping: SL-A05 财务（DS-TUSHARE/BAOSTOCK・季频）＋ 鉴证类公告段（源线谱无独立"审计意见"线，本班按财务线挂靠并在台账转单请 ① 议增设）
  pit_anchor_zh: 只用 announce_date（剔 1970 哨兵与负年差桶）；report_period 仅用于同期比较，禁当可得日

orthogonal_gate:
  status_zh: 已实跑・当前判 reject（水平腿）／pass（变化腿）・判据面不合格（非在册永久池）
  pool_face_zh: >-
    本班池＝`.runtime/tmp/p03_1017_04`（③席今日新池），is_file 谓词复量 n=20 枚合法 date,sig CSV、公共日 106、窗 2024-02-23..2024-12-31；
    本班另复量 `.runtime/tmp/p03_1016_03` 仍在（43 件、其中 20 枚池 CSV）⇒ **1017-03 班四读可复现**（首查①结案）。
    ⚑ 在册 32 员永久池面本班未复量到（⑨席 pool_datesig/pool6 上次实测目录整体消失＝第六次退化面继续有效）⇒ 本池属他席 24h-TTL 临时面，非准入终审。
  runs_zh: >-
    命令原文（本班实跑，rc 不经管道直取）＝
    `python scripts/backtest/fexam/signal_orthogonality.py gate --candidate .runtime/tmp/p04_1017_04/<件>.csv --pool .runtime/tmp/p03_1017_04 --gate 0.3`
    ①c32_nonga_breadth365.csv（存量广度水平腿，rows=313・sd=0.003147・min=0.023148・max=0.054259・zero_days=0）
      ⇒ verdict=**reject** max|corr|=**0.4114** most_similar=gate_f_flipmom16.csv **rc=5**
    ②c32_nonga_breadth_chg5.csv（5 日差分变化腿，rows=308・sd=0.003177・min=−0.025185・max=0.03037・**zero_days=237/308**）
      ⇒ verdict=**pass** max|corr|=**0.1943** most_similar=gate_f_halfselfq16.csv **rc=0**
    ⚑ 判读纪律：水平腿 reject 属"窄窗共趋势＋慢变量"形态（与 1017-03 班三枚 reject 同型），**禁读成准入终审**；
    变化腿虽 pass，但其 76.6% 交易日为 0（年报事件高度集中于 4 月）＝公共日上有效样本极薄，本班判为**弱证据 pass**，不作"真交"证明。
    两卡状态一律记「已实跑・水平腿 reject・变化腿 pass(弱)・判据面不合格」。

self_flag:
  - 方向未预注册（外部五路负向＋一条实务稿自述"17 年后逆转"的制度断点告警），本席不翻号、交 ⑥
  - 档位权重 SEV 1/2/3/4＝本席自定，未冻结，须在制卡时被 ⑥ 显式写进参数面或删除
  - TRAIL/窗口 365 日与 250 日 z-score＝本席自定参数，非既有冻结值
  - 存量广度与"小市值/ST 集中"存在被吸收风险（外部读数：127 只里 79 只<50 亿、46 只 ST）＝本班如实申报可能非独立
  - 本班候选腿为市场级聚合（非横截面 panel），池成员同为市场级⇒同形可测，但**不等价于横截面选股信号的独立性**

caliber_pitfall_zh: >-
  ①本表 announce_date 有 150 行 1970-01-01 哨兵＋150 行"公告早于报告期末"，另有 4,663 行与报告期同年、9,991 行年差>1；
    未经过滤直接按公告日起算＝把不可信行喂进事件研究（与卡29 announcement_date 语义证伪同族，但本表是"部分脏"不是"整列错义"）。
  ②data_source 单值 'bd'＝无第二源交叉，凡"两源对拍"式验证在本轴不可做，只能靠年差分桶这类内部一致性尺。
  ③非标是**低频高截面**事件：本班实测日频水平腿 sd 仅 0.0031（breadth 在 2.31%–5.43% 间缓变）＝近常数慢变量，
    与任何共趋势序列都相关，这类腿的 reject 只能读成"形状问题"不能读成"重复开采"。
  ④audit_result 字面值必须**逐字等值**匹配（'带强调事项段的无保留意见' 全称 13 字）；LIKE/子串谓词会把"标准无保留意见"里的"无保留意见"计成非标＝假扩面（本卡伪代码用 IN 元组，禁改 LIKE）。
  ⑤"未经审计"在外部口径里属非标档、本库五档枚举无该值＝分档映射不可假定等价。
