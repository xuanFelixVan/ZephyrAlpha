# ── 必备③ 逻辑描述
logic_zh: >-
  动机=⑨席 09 班在册空白轴「波动率期限结构」在本库零出分，而楼5 上一张卡（SIC-20261015-P04-10 特质波动）
  走的是**个股横截面波动水平**；本卡的本体不是波动水平，是**波动期限曲线的形状**——
  短档对数波动除以长档对数波动的符号与幅度，读的是"市场对近期风险 vs 远期风险的相对定价/相对实测"。
  业界口径（thetrading.tools／eco3min／TradingView 三独立命中）一致用**比率**（VIX/VIX3M，正常 1.04–1.08 升水带，
  上穿 1.00 即进 backwardation=近期压力/对冲需求），中文综述（optbbs／jtqh 两独立命中）一致强调
  **「斜率」比「水平」更有信息**——两脉合起来才构成本卡本体选择，任一条单独都不足。

  两臂分考、禁合并报数：
  臂A（市场级门控）=sig_t = log(RV_short,t / RV_long,t)，RV_h 为标的指数对数收益的 h 日滚动标准差；
  sig 上穿（短档高于长档）=压力/事件期，下穿=平静期。jtqh 命中把这一类明确归为「时间序列策略」，
  用途是给横截面信号开门，而不是自己当 alpha。
  臂B（横截面波动敏感性配对）=按固定周期（月度）算个股收益对指数变动的 β 或对波动变动的敏感性，
  多空配对高/低敏感腿（jtqh 原文口径）＝本卡只登记该臂存在与原料要求，本班**未造该序列**，须 ⑤/⑥ 另物化后单独考。

  ⚠ 本班自限（这是本卡最重要的一段，禁在读卡时略过）：**臂A 绑的是已实现方差，不是隐含方差**。
  原因是本班实测本库隐含腿原料面不够（读数为 ⑨/①席案卷级，非推断）——
  c1_market.option_iv_surface 全表仅 2026-01-29→2026-10-14 共 159 个不同日期、31427 行，
  option_type 空字符串 ''=24811 行（占 79.0%）、iv=0 有 4127 行、delta=0 与 gamma=0 各 30090 行（95.7%）；
  姊妹表 c1_market.option_greeks 更短（2026-08-03→2026-10-14，46 日，5939 行）。
  ⇒ 期限结构若要用**隐含**口径（业界原义），须先补期权链的方向/期限字段与近端史，本库现给不出跨 1M/3M 的稳定 IV 曲线；
  本卡因此只以已实现方差作**代理**，代理与命题之间的落差已在 data_binding.face_gap_zh 写明，⑥ 制卡时禁把代理读成隐含。

  与存量册的关系（去重闸判决，本班实跑，非自评）：
  strategy_registry.yaml 关键词计数（本班 python 全文 count，非 grep 抽样）＝
  期限结构 0／方差斜率 0／隐含波动 0，但 **已实现波动 1 处＝line 10926，属 STR-MULTIFACTOR-086「波动率体制转换预警」**，
  其 entry_logic 原文＝「RV_5d/RV_20d<0.5=显著压缩；HMM 体制转换后验概率>0.6=高概率转换；GARCH 预测波动率/当前已实现波动率>1.5=变盘预警」。
  ⇒ 该存量条与本卡**同族**（都是短/长已实现波动之比），差别在：窗对（它 5/20，本卡 5/60 与 20/120）、
  取值方式（它是水平阈值开关 0.5，本卡是对数斜率连续值）、以及它把比率与 HMM/GARCH 混在一个配料表里、无可复现构造（algorithm_status 面须 ⑥ 复看）。
  ⇒ 去重闸判「**相邻同族、待并员评估**」而非「全新轴」。⚠ 关键纪律：本班正交闸 pass 只证明本卡序列与**池内 32 枚已物化序列**正交，
  STR-MULTIFACTOR-086 从未物化 ⇒ 它不在池里，正交闸**看不见它**；两闸结论不可互替，此点必须随卡一起交给 ⑥（见 self_flag）。

# ── 必备④ 伪代码（本席自拟，禁按外部仓转录）
pseudocode: |
  # 输入：c1_market.kline_index（列实测 DESCRIBE：trade_date Date, symbol String, name, open/high/low/close
  #        Decimal(18,4), volume UInt64, amount, advance_count, decline_count, data_source, quality_flag UInt8, ingest_ts）
  #        ⚠ 该表**无 pct_change 列**（本班实打到 Code 47 Unknown expression identifier，原文已入台账）⇒ 收益须自算
  idx  = kline_index WHERE symbol = '000300' ORDER BY trade_date      # 本班实测 5287 行，2005-01-04→2026-10-14
  lr   = log(idx.close / lag(idx.close))                               # 首行缺 lag ⇒ 丢
  # 臂A：两档斜率（窗对留 ⑥ 冻结，本班已把两档都算出来并分别过闸，禁只交一档当"已验"）
  rv_h = lambda h: lr.rolling(h).std(ddof=1)
  slope_5_60   = log(rv_h(5)  / rv_h(60))     # 本班过闸面：max|corr|=0.2771 vs avg_abs_ret（贴柱，余量 0.0229）
  slope_20_120 = log(rv_h(20) / rv_h(120))    # 本班 reject 面：max|corr|=0.4416 vs ti_ew_natr_14_v1 ⇒ 该窗对判重复
  vol_level_20 = rv_h(20) * sqrt(252)         # 对照臂（波动水平）：max|corr|=0.6465 vs ti_ew_garman_klass_20_v1 ⇒ 已占轴，禁与斜率混计
  # 门控腿（臂A 的用法＝开关，不是排序）：
  gate_long[d]  = 1 if slope_5_60[d] <  median_ext(slope_5_60) else 0   # 平静=放行横截面多头
  #   ⚠ 中位数/分位取扩展窗或滚动窗属冻结项，禁在本卡拍定；业界给的是"比率>1.0 即反转"的绝对阈，
  #     但那是**隐含**口径的数，代理臂不得直接沿用其数值
  # 事件腿（TradingView 命中给的时序条件，须另立、禁并进水平值）：
  #   deep_backlog 后须等斜率**回落**（diff(slope) 变号）才翻转状态——本班未造该腿，登记为待验
  # 臂B（横截面敏感性，本班**未物化**，只写原料要求）：
  #   对每只票、每个固定周期：beta_i = cov(stock_ret_i, idx_lr)/var(idx_lr)，多空配对高/低 beta
  #   原料=c1_market.stock_daily_basic 或 kline_daily 的个股收益（在册：kline_daily.turnover 恒 0，勿用该列）
  # 接缝与缺测（本卡最大的坑，见 data_binding）：多源拼接日与"前值复制桩"日须显式标缺测，禁把 0 收益当真
  skip: 停牌/无行/该日 close<=0 或跨源接缝日 ⇒ sig 记缺测，禁填充；覆盖率须随因子一并上报

