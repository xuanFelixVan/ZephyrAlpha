caliber_pitfall_zh: >-
  (1) kline_index 无 pct_change 列（Code 47 原文已记），自算收益须从 close 取 log 差分，禁照抄个股表列名；
  (2) 滚动 std 的 ddof 与年化系数（sqrt(252)）在比值里相消，故斜率对年化不敏感——但**对窗长敏感**，0.380 的同族互校就是窗长差异的代价；
  (3) data_source 值域是供应商名（bdpan/ifind/miniqmt/akshare/tushare），不是 live/replay ⇒
      在册「replay 面远大于 live」判据在本表**不可用 data_source 复现**（本班派卷在 9 张表上实测 live=0/replay=0 全部如此）；
  (4) quality_flag 全为 1 ⇒ 零区分度，勿当质量筛。
