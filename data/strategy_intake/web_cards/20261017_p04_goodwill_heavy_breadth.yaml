          其 U4 逐字『中高——财务快报修正改写估值分母，须按公告日 PIT 取数』＝与本卡 PIT_ANCHOR=announce_date 一致；
          其 U1 已占『基本面改善（ROE/营收增速及加速度）』命题＝与本卡『资产构成质量』不同物，故不冲突）
  measured_face_zh: >-
    本班只读探针（正对照 SELECT 1→[(1,)] 先行）实测：balance_sheet 339,746 行／139 个 report_period；
    goodwill 非空 132,054、>0 为 129,245 行／5,878 票；脏哨兵 report_period='1970-01-01' 恰 8 行；
    2024 公告窗内 goodwill>0 有 10,410 行／2,677 票（announce_date 2024-01-05→2024-12-26）；
    权益列两名并存（equity_excl_minority／equity_incl_minority）⇒ 分母选择须写死（本卡取 excl，外部『净资产』通常亦指归母）；
    市场级腿已实跑物化＝.runtime/tmp/p04_1017_03/cand_goodwill_highrisk_breadth.csv（52 行含表头，51 个网格日）。
  face_gap_zh: >-
    (1) **减值额零源**＝全库 system.columns 对 '%impair%' 返回 0 行，income_statement 无 imp/loss 列 ⇒ 外部模型的『商誉减值测试安全边际』『本期是否计提』两因子**不可复现**；
    (2) **收购承诺期/标的业绩表未见**（本席只按 kw 勘探过 balance/income/cashflow/goodwill/financ 族，未逐一查 commitment/performance/target 类表名＝禁据此断言"无表"，只说本席未查）；
    (3) 商誉**构成**（哪次并购形成、标的、评估参数）无表 ⇒ 治理瑕疵维只能靠问询函/年报文本；
    (4) 交易所问询函与立案表未勘探过 ⇒ 外部高危三类的第一类可算性未知；
    (5) 分母两种口径（净资产/总资产）都能算但结论不同（外部两条都出现过：403 家占净资产>30%、83 家占总资产>30%）⇒ ⑥ 必须二选一并写死，本卡选 excl 净资产。
  orthogonal_gate_zh: >-
    ⚑ 本班**首次实跑出数**（同卡30 一批次命令）：`gate --candidate .runtime/tmp/p04_1017_03/cand_goodwill_highrisk_breadth.csv --pool .runtime/tmp/p03_1016_03 --gate 0.3`
    ⇒ verdict=**reject** max|corr|=**0.4490**，most_similar=gate_r_lag5.csv，**rc=5**。
    与同班姊妹卡30 的广度腿互测＝verdict=**pass** max|corr|=**0.1623**（rc=0）⇒ 两卡不同物（本席唯一可用的正面结论）。
    ⚑ 在册红线的官方形态复证＝在册池面本窗仍为 0 件（`.runtime/tmp/p04_06_pool` is_file=0；`.runtime/sessions/st-qoder-p09-1015-04/pool_datesig` 与 `pool6` 两面**目录已消失**），
      即『空池＝rc=2 ERROR「--pool 未命中任何信号 CSV」』那条（③席 1017-04 在册）；本班因此改用 ③席 1016-03 遗留的 20 员临时面（24h TTL，非官方面）才拿到读数。
    判读纪律＝本 reject **不得**当准入终审：公共日窗仅约 44（本腿 51 个周频点 ∩ 池内 2024-02-20→2024-12-31 日频），且本腿是**季披驱动的近常数慢变量**（range 0.0569–0.0648），
    与日频收益滞后族的相关由共趋势支配；在册『43 公共日窗上 PR 判别力低』同型。⇒ 结论形态『已实跑、当前判 reject、判据面不合格』，随 [BLOCKER] 请 ⑨ 在永久池＋同频对齐网格上复测。
  dedupe_gate_zh: >-
    内容级窄谓词（本班实跑）：①`grep -cE "质押|pledge|商誉|goodwill" docs/01_policies_and_standards/_registry/catalogs/strategy_registry.yaml`＝**0**；
    ②entry_flow 全树对 `商誉|goodwill`＝3 件命中，逐条读＝全部在 TDM-E-L3-04（否决器族）里作为**七检之一的科目枚举**（『减持/商誉/立案三检缺数据永不进对照』），
      不是把商誉占比当信号的独立轴 ⇒ 不构成轴占用，但**其"商誉无表"的断言需按本卡实测改判**（见 pool_face_note 与 self_flag 第 2 条）；
    ③web_cards 文件名面 pledge|goodwill＝**0 件**；④与 ③席 L9 族（应计/盈余惊喜/研报评级）不同对象，L9-A05『盈余惊喜事件研究』与本卡同为『披露后漂移』家族但变量不同（EPS 惊喜 vs 资产负债表悬停），
      已在『跨轴机制连接』申报而非自称独立——同族性须 ⑥/⑨ 判。
  pool_face_note_zh: >-
    ⚑⚑ 本卡对**在册 L3-04 否决器卡面有一条改判情报**：那张卡逐字写『七检中三检数据永不可得（减持/商誉/立案无表）』『missing_segment: 减持公告/商誉减值/立案调查三项：全窗无对应采集表』。
    本班实测＝该断言**一半错**：账面商誉存量列有源（balance_sheet.goodwill，129,245 行>0／5,878 票），而**商誉减值额**确实无源（全库 %impair% 零列）。
    ⇒ 正确读法＝『商誉**减值**无表』成立、『商誉**无表**』不成立；否决器 V4 若要开『高商誉』这一检，用存量比例**今天就可做**，不必等补源。
    本席不改那张卡（非本席写域，且卡面状态属 ⑥/⑦⑧），只把它登记为本席台账「转单」段＋[BLOCKER]，请 ⑥ 判是否据此重开该检。

self_flag:
  - 本卡方向（高商誉＝负向）外部证据同向，但**本席不预注册方向**＝⑥ 的权力；本席只如实记『外部同向』与『卡30 轴反向』两处证据状态。
  - 30%/50% 两档阈值全部来自外部（新浪・东财周报与百家号稿），本库无裁定值＝未冻结，⑥ 冻结前禁当门柱；与姊妹卡30 同一处置。
  - 外部计数（403 家、27.4%、83 家、1658.6 亿、1.4 万亿）**一律未进本卡判据**，只作量级形制——因本席无一手源可核且许可不明。
  - 『业绩承诺期满首年』『微利未计提』两腿本席明知本库不可算（前者未勘探承诺期表、后者零列），仍写进伪代码 C 段但逐条标『不可复现/未查』，禁下班误读成已具备。
  - 高管持股调节腿（基座一的进一步结论）本席**未查本库是否有高管持股表**＝未实现亦未申报缺口，只登记为『若做交互须先验可得性』。
  - 市场级腿的 51 点靠 ③席卡30 的周频快照日做网格（借用姊妹卡的 end_date 序列当时间轴）＝两腿共享同一网格 ⇒ 互测 0.1623 的 pass 只证『变量不同』，不证『与日频池正交』。
  - 本班两腿物化都在 `.runtime/tmp`（24h TTL）＝无永久面，下班复量前须先判存；本席不自建永久池（池物化归 ⑨/⑤）。

caliber_pitfall_zh: >-
  (1) **脏哨兵必剔**：report_period 最小值 = 1970-01-01（实测 8 行），任何 `GROUP BY report_period` 或按期对齐的代码会得到一个 1970 期＝假象早期史（在册『查空伪装成查无』同族）。
  (2) **净资产非正**：eq<=0 时比值失真且可能为负（商誉/负净资产＝正比），必须按伪代码规则单独处理，禁把该票排进低危组。
  (3) **两个权益列**：equity_excl_minority vs equity_incl_minority 结果不同（商誉属合并口径含少数股东部分），分母选择未写死就会两班读不同值＝在册『同名不同物』同族。
  (4) **Decimal(18,2) 与 Nullable**：goodwill 是 Decimal 且可空，NULL≠0；『无商誉』与『商誉 0』在排序里应同组还是异组须 ⑥ 明写（本卡默认：无/NULL 票不进该排序，避免分母的样本集漂移）。
  (5) **PIT 用 announce_date 不用 report_period**：本表两列都有，按报告期起算＝前视（外部三因子预警模型的隐含时点是披露/风险暴露而非期末）。
  (6) 分母口径（净资产 vs 总资产）在两派外部读数里都出现＝403 家与 83 家其实不同物，禁混引（本卡只用净资产）。
  (7) 收益口径统一 kline_daily_hfq 后复权面；事件窗（年报季）若接入，须与 ⑧ 考工 CH 窗（01:00–04:00 在册覆盖）错开，本席不代排。
