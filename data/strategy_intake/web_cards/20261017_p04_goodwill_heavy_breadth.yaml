# ── 必备③ 逻辑描述
logic_zh: >-
  商誉＝并购时支付对价超过标的可辨认净资产公允价值的部分，本质是**对未来的资本化**。它不摊销、只做减值测试，于是形成一条独特的悬停风险：
  (1) 成因腿：2015–2017 并购潮高溢价收购（外部：业绩承诺期结束后压力持续释放）→ 商誉挂账；承诺期内标的靠会计安排达标，承诺期后业绩变脸 → 一次性大额减值。
  (2) 触发腿：减值测试的核心参数（折现率、永续增长率、盈利预测）由管理层主观给定 → 『参数较前期显著放松』本身就是治理信号（外部周报把『减值测试节点混乱』直接归为治理瑕疵）。
  (3) 定价腿：减值＝确认『当年利润被高估』且『过去股价按虚高并购溢价定价』→ 双重下调，机构出逃形成戴维斯双杀；文献层面＝商誉减值在 1% 水平显著正向影响崩盘风险（基座一）。
  (4) 时点腿：计提集中在**年报季**（外部：2018 年 871 家 1658.6 亿、2019 年 1456.58 亿，且『商誉爆雷潮多集中在年报季，半年报中的减值测试同样可能引爆』）→ 高悬停标的在披露季前有可预期的负向漂移/风险溢价。
  (5) 截面腿（本卡主信号）：商誉/净资产比的分档（>30% 高危档，>50% 极端档）＝横截面负向排序；分母用**净资产**（外部主力口径），且只在 goodwill>0 的子集内排序（外部周报的分母＝『全部带商誉企业』）。
  (6) 调节腿（外部依据，非本卡默认实现）：管理层持股可缓冲（基座一『管理层持股可以抑制商誉减值对股价崩盘风险的正向影响』）→ 若 ⑥ 要做交互，须与本库高管持股数据面是否可得同时定（本席未查该表，禁臆造）。
  ⚑ 方向：外部五路一致指向『高商誉＝负向/风险』，故本卡方向比姊妹卡30 明确得多；但**本席仍不预注册**（预注册权在 ⑥），本席只如实记『外部证据在本轴同向，在卡30 轴反向』。

# ── 必备④ 伪代码（列名全部来自本班 2026-10-17 CH 只读探针实测，非记忆）
pseudocode: |
  # 真源面（本班实测）：c3_fundamental.balance_sheet
  #   列（节选，实测存在）= symbol, announce_date, report_period, company_type, total_shares,
  #     monetary_capital, accounts_receivable, inventory, total_current_assets, fixed_assets,
  #     intangible_assets, **goodwill Nullable(Decimal(18,2))**, total_non_current_assets, total_assets,
  #     short_term_loan, long_term_assets…, **equity_excl_minority**, **equity_incl_minority**, capital_reserve
  #   实测面：n=339,746／uniq(report_period)=139／min(report_period)=1970-01-01（⚠ 脏哨兵，实测 countIf(report_period=1970-01-01)=8 行）
  #           goodwill IS NOT NULL 132,054／goodwill>0 129,245／uniq(symbol)=5,878
  #           2024 披露窗（announce_date∈[2024-01-01,2024-12-31] 且 goodwill>0）：10,410 行／2,677 票／announce 2024-01-05→2024-12-26
  #   ⚑ 全库**无任何** %impair% 列（system.columns 全库 LIKE '%impair%' 返回 0 行），income_statement 亦无 imp/loss 列
  #     ⇒ 存量腿（账面商誉）可算；**流量腿（本期减值计提额）在本库不可算**
  TH_HIGH  = 0.30   # 外部商誉/净资产『高风险』档（注意：本式用小数比，外部口径的 30% 即 0.30）
  TH_EXTRE = 0.50   # 外部『部分中小市值公司超过50%』的极端档
  PIT_ANCHOR = announce_date   # 本表有公告日列 ⇒ 天然 PIT（与卡30 无公告日形成对照）

  # A. 个股截面腿
  rpt_i(t) = 最新一期 WHERE announce_date <= t AND report_period > '1990-01-01'   # 剔脏哨兵
  gw_i(t)  = rpt_i(t).goodwill；eq_i(t) = rpt_i(t).equity_excl_minority
  规则：eq_i(t) <= 0 ⇒ 该票本期**直接标为最高危并排除比值排序**（净资产非正时比值符号/量级失真，禁当 0 处理）
  ratio_i(t) = gw_i(t) / eq_i(t)
  bucket_i(t) = { gw_i==0 或 IS NULL → '无商誉（不可与本组同排序）';
                  ratio<=TH_HIGH → '正常'; TH_HIGH<ratio<=TH_EXTRE → '高危'; ratio>TH_EXTRE → '极端' }
  signal_i(t) = 截面排序取 bucket 序（分位/排序须自算滚动窗，禁取表内现成 *_pct 列——本表无此类列，防后续派生表前视）

  # B. 市场级广度腿（本班实跑物化面）
  breadth(t) = share_{i: ratio_i(t) > TH_HIGH}，样本＝当刻**已有可得报表且 goodwill>0** 的票（对齐外部『带商誉企业』分母）
             实测 2024（51 个周频网格日，PIT by announce_date，tolerance<=400 日）：51 点，
             range=(0.0569, 0.0648)，median=0.0589，当刻可得票池规模中位数 n=3,526
             ⚠ 与外部周报『403 家＝27.4%』**不同物**（外部是某一季末的静态家数占比，本腿是周频存量占比且用本公司自身公告日 PIT），禁拿 0.0589 去对 27.4%
  # 事件窗腿（外部『年报季集中计提』形制，本席不自定起止）：
  #   exposure_window = 年报披露季（须 ⑥ 定月窗，本卡留空＝缺参数非缺实现）

  # C. 治理/交互腿（外部高危三类，本库可算性逐条标）
  #   c1 已被交易所点名问询但未回复 → 需问询函表（本席未查，禁臆造可得性）
  #   c2 商誉占比极高且本期微利未计提减值 → **流量腿不可算**（全库无 impairment 列）⇒ 退化为『高占比 × 当期净利润>0 且低于某阈值』，阈值须 ⑥ 定
  #   c3 并购标的业绩承诺期满后首年营收骤降 → 需承诺期表（本席未查）＋income_statement 营收列
  #   ⇒ 本卡能落地的只有『存量比例分档』＋『净资产非正规则』＋『公告日 PIT』三件，其余三类须转 ①/② 补源

