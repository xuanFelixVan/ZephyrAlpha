# ── 必备③ 逻辑描述
logic_zh: >-
  动机=户数是本库唯一能追到 1992 年的持股结构变量，直接刻画"筹码在多少人手里"。
  流传教条（户数减少＝筹码集中＝看涨）被三处独立页面同时反证：真正有区分度的是
  **户数变化与同期价格方向的交互**——涨着集中多为吸筹，跌着集中多为割肉离场；
  同时分档证据显示极端减少档（前一年 -29%）未来收益反而最好、而中位小幅减少档最差，
  即关系非线性、单调排序大概率高估其效。
  构造=以公告日为事件时点（PIT 硬约束），取本期末户数除以上期末户数减一，
  与"披露间隔内已实现收益符号"做交互，产出三分类或两列（环比变化、变化×收益符号交互项），
  并在截面上剔除上市不满一年次新与期间发生增发/解禁/转债转股的机械变更样本（这三类会让户数机械变化而与筹码意愿无关）。
  本席不预设符号方向——顺势臂与反向臂须分考。

# ── 必备④ 伪代码（本席自拟）
pseudocode: |
  # 输入：c3_fundamental.shareholder_count(symbol 裸6位, end_date, announce_date, holder_count)
  #       c1_market.kline_daily.pct_change（区间收益腿，裸 symbol JOIN）
  for r in 按 (symbol, announce_date) 升序的披露记录:
      prev = 同一 symbol 上一条 end_date < r.end_date 的记录
      if prev is None or 上市龄 < 365天: skip 并计数          # 次新必剔，外部证据：不剔会把结论做反
      if 区间内发生 增发/解禁/转债转股: skip 并计数             # 机械变更，非意愿集中
      hc_chg = r.holder_count / prev.holder_count - 1
      ret_window = Σ pct_change over (prev.announce_date, r.announce_date]   # 用公告日窗，禁报告期末窗
      # 两列分别入池，禁折叠成一列后只测一次
      sig_chg   = zscore_cs(hc_chg)                                   # 环比变化本身
      sig_inter = sign_of(ret_window) * zscore_cs(hc_chg)             # 变化×价格方向交互
      # PIT：信号可用时刻 = announce_date（不是 end_date）；同日公告的样本只能用于 announce_date+1 起
      # 缺测/稀疏：最新报告期覆盖不足时须整体右移到上一完整期，禁把"当期未披露"当 0
      # 非单调：默认走分档（十档或五档，档数留⑥冻结），禁全域线性排序

# ── 必备⑤ 数据源映射
data_source_mapping:
  source_line: SL-C02 基本面与股东结构线（楼8 楼内要点=两融余额/股东户数/限售解禁/大宗折溢价/龙虎榜）
  primary_table: c3_fundamental.shareholder_count
  secondary_table: c1_market.kline_daily（区间收益与解禁事件剔除腿用 c3_fundamental.share_unlock）
  measured_reachability:
    - "shareholder_count 跨度=1992-12-31..2026-10-13(end_date)，announce_date 跨度=1993-01-12..2026-10-14，uniqExact(end_date)=3260，uniqExact(symbol)=5907"
    - "年报季面板厚度（uniqExact(symbol)）：2025-03-31=5412／2025-06-30=5433／2025-09-30=5441／2025-12-31=5485／2026-03-31=5503／2026-06-30=5406／**2026-09-30 仅 640**"
    - "逐年：2023=231 个 end_date/5495 只/44266 行；2024=190/5485/49439；2025=231/5528/52467；2026=175/5584/35491"
    - "PIT 实测：countIf(announce_date>end_date)=509418、=(end_date)=1911、<(end_date)=3904（总 515280）⇒ 98.86% 方向正确，0.76% 异常行必剔"
    - "披露滞后分布：dateDiff('day', end_date, announce_date) 中位=25，P95=113（与外部页面自陈'平均晚27天'互证）"
    - "quality_flag 全表恒为 1（515280/515280）⇒ 该列无判别力，禁把它当过滤条件用（尺子自检：同尺正对照同表 symbol 非零）"
    - "邻表可达性：share_unlock 的 unlock_date 跨度=2010-01-04..**2027-10-13**（含未来排期），uniqExact(symbol)=5533，逐年行数 2024=2627/2025=1784/2026=1697/2027=1046；margin_trading=2024-09-02..2026-10-12 共 507 个日期、4933 只；sector_fund_flow 仅 30 个日期（2026-09-15 起）；dragon_tiger 仅 43 个日期（2026-08-07 起）"
    - "JOIN：shareholder_count.symbol 为裸 6 位，与 kline_daily.symbol（裸）同形，与 stock_daily_basic.symbol 同形；money_flow/stock_daily_basic 裸对裸于 2026-10-14 实测 5563 行"
  caliber_pitfall_zh: >-
    ① 事件时点必须是 announce_date：中位滞后 25 天、P95 达 113 天，用 end_date 对齐未来收益＝直接引入 25 至 113 天的未来信息，
      这是本轴唯一能致命造假的地方（外部页面独立给出"平均晚 27 天"并有"用报告期末等于用未来数据"的自陈）。
    ② 最新一期（2026-09-30）仅 640 只披露，与年报季 5400 至 5500 只的量级差 8 倍——把"未披露"当缺失值 0 或当无变化，
      会把右端样本窗造成系统性幸存者偏置；本卡评估窗右端建议停在**最后一个披露率高于阈值的期末**，阈值由⑥定。
    ③ 户数机械变化：增发/限售解禁/可转债转股都会改变户数，与本卡想测的"意愿集中"无关（外部页面自陈此点，本班实测 share_unlock 有前瞻排期可用作剔除腿）。
    ④ quality_flag 恒 1＝死列（本班实测），任何"按质量位过滤"的实现条款都会退化成全通过，须改用 0.76% 的 announce<end 异常谓词做剔除。

