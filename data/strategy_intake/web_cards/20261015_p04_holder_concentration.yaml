  gate5_signal_days: 部分可达——历史深度充足（1992 年起 3260 个期末），但**信号节拍是披露驱动而非日频**，按事件日计的独立观测数远小于日历日数；窗右端须停在披露率达标期末
  gate6_sample_size: 风险项——年报季单期约 5400 至 5500 只、稀疏期仅数百只（本班实测 2026-09-30=640），门槛⑥ 的笔数口径能否达标取决于⑥选"全期池"还是"季末池"，本席不代裁
