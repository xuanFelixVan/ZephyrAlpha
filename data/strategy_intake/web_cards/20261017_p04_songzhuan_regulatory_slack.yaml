    capitalized_shares(Nullable(Float64)), dividend_pre_tax(Nullable(Float64)), status(String), ex_date(Nullable(Date)), record_date(Nullable(Date)),
    listing_date(Nullable(Date)), type(String), rights_ratio(Nullable(Float64)), rights_price(Nullable(Float64)), base_capital(Nullable(Float64)),
