  primary_table: c3_fundamental.rights_issue
  secondary_tables: [c3_fundamental.income_statement, c3_fundamental.balance_sheet, c3_fundamental.share_unlock, c1_market.kline_daily_hfq]
  columns_verified_this_shift_zh: >-
