orthogonal_gate:
  status_zh: 已实跑・两腿均当前判 reject・判据面不合格（非在册永久池）
  pool_face_zh: 同卡32＝`.runtime/tmp/p03_1017_04`（③席今日新池 20 员・106 公共日・2024-02-23..2024-12-31），他席 24h-TTL 临时面非终审
  runs_zh: >-
    命令原文＝`python scripts/backtest/fexam/signal_orthogonality.py gate --candidate .runtime/tmp/p04_1017_04/<件>.csv --pool .runtime/tmp/p03_1017_04 --gate 0.3`
    ①c33_hisz_breadth90.csv（≥5 高送转 90 日滚动广度，rows=313・sd=0.000741・min=0.0・max=0.002778・zero_days=36）
      ⇒ verdict=**reject** max|corr|=**0.3190** most_similar=gate_f_flipmom16.csv **rc=5**（仅越线 0.019＝边界档）
    ②c33_any_sz_breadth90.csv（任意送转 90 日滚动广度，rows=313・sd=0.025319・min=0.000185・max=0.069444）
      ⇒ verdict=**reject** max|corr|=**0.6806** most_similar=gate_f_flipmom16.csv **rc=5**
    ⚑ 两枚 reject 都与同一路 `gate_f_flipmom16` 相撞且都属"季节性广度"形态（送转集中于 4-6 月年报实施季⇒与任何季节/动量型市场级序列共趋势）＝
      本班判为**形状性吸收**而非"该轴已被开采"（本轴在 641 册去重面上零命中，见下），但**绝不得据此声称通过**；
      合规裕度腿（slack/vio）本班**未物化**（须 join 三表并做同期净利复合增长率，属 panel 写面，轻档令下本班未做）⇒ 本卡最核心的那条腿的正交性**未测**。

self_flag:
  - 方向未预注册（外部同时存在"潜在超额收益"与"利好兑现贴权/滥送转回撤"相反断言），本席不翻号、交 ⑥
  - 本卡真正的增量＝合规裕度腿与违例窗腿，二者本班**未物化未测正交**＝"已实跑"仅覆盖两条季节性广度腿
  - THRESH 5/8/10 取自监管规则原文但**板块映射未验**；±90 日窗宽与 EPS_FLOOR、TRAIL 等参数＝本席自定，未冻结
  - 共线申报：与卡30（质押广度）、unlock_breadth（解禁广度）经中国日报稿的"28/30 只有股价上涨诉求＝解禁/减持/质押并存"机制连接，非实测数
  - 极值申报：重整式转增（小数转增比、max 83.94）与常规高送转不同物，若并入强度腿会造成单票主导

caliber_pitfall_zh: >-
  ①**量纲禁互换**：本库 bonus_shares/capitalized_shares＝每10股口径（实测 p50 4.888/p90 10），
    Tushare 官方 dividend 接口＝每股口径（stk_div/stk_bo_rate，本班 WebFetch 亲验『每股送转』），同花顺平台字段亦『每股红股/每股转增股本』；
    规则文本用的也是"每股送转比例"⇒ 任何直接拿本库数值当"每股比例"或与外部接口混算的写法都把结果放大 10 倍。
  ②**announce_date 语义＝实施公告日**（本班 12,289/12,291 行 announce≤ex・中位 7 日的反推）＝外部接口里的 imp_ann_date，不是 ann_date；
    按外部文献的"预案公告事件窗"口径直接套本库 announce_date＝把信号起点整体后移数月，且会把"预期段"误记成"抢权段"。
  ③ex_rights_date 对送转行 100% 为空（12,528/12,528）＝该列属配股专用；拿它当"除权日"会让送转样本整体空集（在册"恒真空操作"型坑）。
  ④status='不分配' 在本库可与 bonus+capitalized>0 并存（实测 3 行）＝脏标；分档过滤须同时看金额列不能只看 status。
  ⑤本表 type 只有"分红/配股"两值、无"送转"独立类型⇒送转必须从 bonus_shares+capitalized_shares 的数值面构造，任何按 type='送转' 的谓词恒 0（在册英文/中文枚举同型坑）。
