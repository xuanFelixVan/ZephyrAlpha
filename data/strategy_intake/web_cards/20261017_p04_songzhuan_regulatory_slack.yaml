logic_zh: >-
  机制（两层）：
  (1) **名义价格与流动性层**——送转不改股东权益、只把 1 股拆成 (1+送转比例/10) 股，降低名义股价；
      A 股散户对低价股的偏好＋除权缺口可被"填权"叙事利用，使该事件在**实施公告→除权日**的短窗与**除权日后**的填权窗都产生可交易的行为性需求；
      外部阶段划分（预期/抢权/填权）与"牛市多填权、熊市多贴权"的市况依赖都由链接面给出。
  (2) **合规裕度层（本卡真正的新颖腿，直接由监管规则生成）**——2018-11-23 起沪深交易所把"每股送转比例"与
      "最近两年同期净利润复合增长率"硬挂钩：送转比例 ÷ 净利复合增长率 > 1 即越线，须走"再融资/并购致净资产大变"例外（上限＝净资产期初→期末增长率）
      或"近三年 EPS≥1 元＋送转后 EPS≥0.5 元"豁免分支；另有负面清单（净利为负／同比下降 50% 以上／送转后 EPS<0.2 元）
      与窗口禁披（解禁前后 3 个月、股东前 3 个月减持或后 3 个月减持计划）。
      ⇒ 于是"合规裕度"＝实际送转比例 ÷ 允许上限，以及"违例风险"＝公告日是否落在他股解禁 ±90 日窗内，
      是两个**由规则文本定义、可用本库两表自算**的可检验量；其经济含义＝越线/违例的送转更可能是配合减持或市值管理的"滥送转"，
      其后续回撤（外部逐字：『等除权后再买入可能会面临很大的回撤风险』）应更强。
  ⚑ 本班**不预注册方向**：外部既有"高送转具潜在超额收益"（多因子稿）又有"利好兑现易贴权"（填权稿）与"滥送转后续回撤"（监管与预测稿）三种相反断言；
  本库预案腿无源使最要紧的"预期段"无法检验。方向、断点与窗长全部交 ⑥。

pseudocode: |
  # 本班自写，零外部代码；列名全部来自本班 system.columns 实测（见 data_binding）
  SZ = "coalesce(bonus_shares,0) + coalesce(capitalized_shares,0)"    # 本库口径＝每10股送转X股（本班实测 p50 4.888/p90 10）
  # 分交易所高送转门槛（逐字来自深交所指引；上交所统一 5）——阈值交 ⑥ 冻结，本席不拍
  THRESH = {"SZ_MAIN": 5.0, "SZ_SME": 8.0, "SZ_GEM": 10.0, "SH": 5.0}
  SQL_EVENTS = f"""
    SELECT symbol_canonical, announce_date, ex_date, record_date, exchange, status, type,
           {SZ} AS sz_ratio, coalesce(dividend_pre_tax,0) AS cash_ps, coalesce(base_capital,0) AS base_cap
    FROM c3_fundamental.rights_issue FINAL
    WHERE type = '分红' AND ({SZ}) > 0
      AND announce_date > toDate('1990-01-01')      -- 实测 31 行 1970 哨兵
      AND status IN ('实施','预案')                  -- 实测 送转子面：实施 12,417／预案 108／不分配 3
  """
  SQL_PROFIT = """  -- 合规裕度的分母：同期净利润（income_statement，本班未见列面异常，但 PIT 列语义须 ⑤ 复验）
    SELECT symbol_canonical, report_period, net_profit_incl_minority
    FROM c3_fundamental.income_statement FINAL
  """
  SQL_UNLOCK = "SELECT symbol_canonical, unlock_date FROM c3_fundamental.share_unlock FINAL"  # 违例窗口腿
  def build(ev, profit, unlock, t):
      yoy = cagr_same_period(profit, ev.end_period)     # 最近两年同期净利润复合增长率（规则原文口径）
      cap_ratio = ev.sz_ratio / 10.0                    # 转成每股送转比例（规则用的是"每股"口径！本库是每10股）
      slack     = cap_ratio / max(yoy, EPS_FLOOR)       # 合规裕度：>1＝越线（须例外/豁免分支）
      net_asset_exception = na_growth(profit)           # 例外分支上限＝报告期末/期初净资产增长率（本库须用 balance_sheet，本班未建此腿）
      violation_unlock = in_window(ev.announce_date, unlock, +/-90)   # 解禁前后3个月禁披 → 违例标记
      violation_eps    = eps_after_split(ev, cap) < 0.5               # 送转后 EPS 下限（豁免分支要求）/ <0.2 属负面清单
      high_flag        = ev.sz_ratio >= THRESH[map_board(ev.exchange, ev.symbol_canonical)]
      lead_days        = dateDiff('day', ev.announce_date, ev.ex_date)  # 本班实测中位 7 日、p90 9 日
      return {"breadth_hi": mean(high_flag among active),      # 市场级高送转广度（本班实测 max 0.002778＝极稀）
              "churn":  count(high_flag & announce==t) / universe,     # 新增事件流
              "slack":  zscore_rolling(mean(slack of events in TRAIL), 250),   # 合规裕度（自算窗，禁取表内现成分位）
              "vio":    zscore_rolling(mean(violation_unlock of events in TRAIL), 250)}

