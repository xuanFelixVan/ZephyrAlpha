    total_funds_raised(Nullable(Float64)), data_source(String), quality_flag(UInt8), ingest_ts(DateTime64(3,'UTC')),
    exchange(LowCardinality(String)), symbol_canonical(String)。
  measured_face_zh: >-
    本班只读探针实测（正对照 SELECT 1 → 1 先行，零写库零 panel 物化）：
    ①总量＝80,803 行（FINAL 与非 FINAL 同值）・uniqExact(symbol_canonical) 5,823 票・announce_date 跨度 1970-01-01..2026-06-30；
    ②type 分布＝分红 79,618／配股 1,185；status 分布＝实施 57,023／不分配 21,472／空串 1,185（＝配股行）／预案 1,123；
    ③腿计数＝送转(bonus+capitalized)>0 **12,528 行**／送转≥3 10,273 行／配股 rights_ratio>0 1,185 行／现金 dividend_pre_tax>0 53,834 行；
    ④**送转子面内 status 分布＝实施 12,417／预案 108／不分配 3**⇒ 预案公告腿在本表几乎无源（108/12,528＝0.86%）；
    ⑤日期可得性（送转子面 n=12,528）＝announce_date 空 0・ex_date 空 235・record_date 空 113・**listing_date 空 9,467（75.6%）**・**ex_rights_date 空 12,528（100%，该列仅配股行可用）**；
      在 ex_date 非空且 announce>1990 的 12,291 行里 announce_date ≤ ex_date 共 **12,289 行（99.98%）**，
      dateDiff(announce→ex) 中位 **7 日**・p90 **9 日** ⇒ 本库 announce_date 语义＝**实施公告日**（不是 Tushare 的 ann_date 预案公告日）；
    ⑥量纲＝送转比例 p50 **4.888**・p90 **10**・max **83.94** ⇒ 本库为**每10股**口径；极端值逐张抽样实读＝002309 2024-12-18 转增 24.5・002251 2024-07-30 转增 22・600136 2023-12-15 转增 25・
      000620 2023-12-20 转增 20.9582・002321 2021-12-28 转增 29.92・000564 2021-12-27 转增 22.0357 ⇒ **带小数的转增比＝破产重整式资本公积转增**（与常规"10转5/10送10"不同物），
      本卡必须把它当独立子档处理或设上界截尾，否则单只票可把市场级强度推到 8 倍标准差之外；
    ⑦重复＝GROUP BY (symbol_canonical, announce_date) HAVING count>1 实测 **0 键**；1970 哨兵 31 行、announce<1990 亦 31 行＝同一批；
    ⑧exchange 拆分（送转子面・announce>1990・ex_date 非空）＝SZ 7,411／SH 4,671／**BJ 209**⇒ 北交所存在但规则链接里未给北交所门槛＝该 209 行的分档阈值**无外部真源**；
    ⑨年度送转家数＝2015 753／2016 605／2017 494／2018 623／2019 477／2020 399／2021 436／2022 516／2023 560／2024 409／2025 375／2026 414（⇒ 2017 年后中枢下移，与新规 2018-11 生效的方向一致但滞后）；
    ⑩可成交性＝送转子面 distinct symbol_canonical **4,374 只**与 c1_market.kline_daily_hfq 的 distinct INNER JOIN 实测命中 **4,374/4,374（100%）**；
    ⑪2015+ 子面＝事件 5,647 行／3,247 票／送转≥5 的 2,638 行・该子面 r_p50 4.5・r_max 30（⇒ 极值 83.94 属 2015 前老股，本班候选腿窗内不会撞上）。
  missing_face_zh: >-
    ⚑缺口一＝**预案/预披露/股东大会通过三类公告日在本表全部无列**（外部对照面有 7 个时点，见链接"口径对照反例"）⇒
      外部共识里最强的"预期段"信号（10 月至次年 4 月的潜力股埋伏、预案公告次日涨停）今天不可复刻；本卡只能做实施公告→除权→填权三段。
    缺口二＝**"是否高送转"无标记列**且板块（主板/中小板/创业板）不在本表 ⇒ 分交易所的 5/8/10 三档阈值须外部板级映射（本班未见 industry_class_suppl 是否含板块标识，未验证＝不自称可用）。
    缺口三＝**减持事件列不存在**（在册 L3-04 已判"减持公告无表"）⇒ 规则里的"前3个月减持/后3个月减持计划"这一条违例判据不可算，只能退化为解禁窗（share_unlock）。
