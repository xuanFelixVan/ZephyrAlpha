# ── 必备③ 逻辑描述
logic_zh: >-
  不用 mid=(P_b+P_a)/2，而用一个由最优档买卖量不平衡决定的公允价 P*：
  买量占优时 P* 上移、卖量占优时下移（最大熵/微观价格族都是这条直觉的不同参数化）。
  两类可用信号，须分开考、不可混为一卡：
  (a) 偏离方向=以 P* 为锚对 last/mid 做均值回归押注（last 显著低于 P* 则买入），
      与"高失衡追势"是相反用法，二者谁在 A 股五档口径下成立必须由考试判，本席不预设；
  (b) 漂移强度=|P* − mid| 作为即时位移幅度预测/波动代理（论文明确称漂移与波动皆由失衡驱动）。
  该族的工程价值还在于给做T/执行类策略一个比 mid 更诚实的成交基准价（滑点归因用）。

# ── 必备④ 伪代码（本席自拟，非论文代码移植）
pseudocode: |
  # 输入 L1 四列：P_b, Q_b, P_a, Q_a（本仓 tick_data / tick_depth_5 均有）
  w[t]      = Q_b[t] / (Q_b[t] + Q_a[t] + eps)           # 买侧权重∈(0,1)
  micro[t]  = P_a[t] * w[t] + P_b[t] * (1 - w[t])        # 微观价格（失衡加权，先取文献通用形，参数族交⑥扫）
  mid[t]    = (P_b[t] + P_a[t]) / 2
  spread[t] = P_a[t] - P_b[t]
  dev[t]    = (micro[t] - last_or_mid[t]) / (spread[t] + eps)   # 归一偏离，防不同流动性票横向不可比
  signal_a[t] = -sign(dev[t]) * 1{|dev[t]| >= delta}     # 用法(a)：均值回归臂
  signal_b[t] = abs(dev[t])                              # 用法(b)：位移/波动代理臂
  # 参数 delta 与窗 H 一律由⑥制卡席预注册冻结；涨跌停/集合竞价时段 spread=0 或单边无对手⇒该笔剔除并计数
  # PIT：只用 t 及之前快照；标签用 t+H 的 mid/last 变化

