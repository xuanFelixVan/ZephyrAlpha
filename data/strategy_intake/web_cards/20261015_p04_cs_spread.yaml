  measured_readings:   # 本班 07:2x（Asia/Shanghai）CH 只读实跑，zephyr.data.ch_reader.query_rows
    - "kline_daily 覆盖：min=1990-12-19 max=2026-10-14 uniqExact(trade_date)=8741 uniqExact(symbol)=5922 rows=11,695,555"
    - "宇宙密度（uniqExact(symbol)/年）：2016=234／2017=3475／2018=3575／2019=3771／2020=4366／2022=5183／2024=5436／2025=5500／2026=5600（截至 186 个已采日）⇒ 密集宇宙自 2017-01-03 起，2016 及以前是 ~234 只的稀疏遗留面"
    - "日线近端未断供：kline_daily 2026-09-25..10-14 逐日 5562..5568 行（对照 tick 族 10-13=0 行／10-14=8,027 行）⇒ 本卡评估窗右端=2026-10-14"
    - "退化日（不复权表 2026-09 全月）：rows=116,749；high=low 共 228 日票（0.20%）；high<=0 或 low<=0=0；负对照 high<low=0 行；avg ln(H/L)=0.0380"
    - "合成正对照（本席自造，日内 48 步布朗、日波动 1.2%、2000 日、W=21）：s_true=0/30/60/150bps ⇒ meanS=5.2/20.7/44.2/127.1bps，α>0 占比=0.306/0.729/0.961/1.000 ⇒ 估计量单调可用但**零价差就有 5.2bps 底噪**，且读数向上有衰减/向下有地板"
    - "本库真实读数（10 只票、2025-06-01..2026-09-30、W=21、不复权）：n=3060，α>0 占比=0.277，S 中位数=0.0bps、均值=7.9bps、P90=25.0bps ⇒ **均值只比合成零价差底噪高 2.7bps**，水平值不可当刻度用"
    - "相关性实测（同上面 10 票合并面）：corr(S, 21 日 Parkinson 波动)=0.167；corr(S, ln 成交额)=-0.131"
    - "口径对照（同 10 票同窗，不复权 vs 后复权）：meanS 7.9bps vs 8.2bps，pearson=0.986、spearman=0.965 ⇒ 本样本两口径高度一致，但差异机制集中在除权除息日，本席**未逐日隔离除权日**，不得据 0.986 判'复权无所谓'"
  caliber_pitfall_zh: >-
    四条必读口径坑（本班实测／源码语义，非转述）：
    ① **括号归属决定生死**：α=(√(2β)−√β)/（3−2√2）−√γ/√(3−2√2)＝K(√β−√γ)；若误写成 (√(2β)−√β−√γ)/(3−2√2)（把 γ 也除 0.1716），
      数学上恒负（因 γ≥β/2>0.1716β）⇒ 输出**全零**且门面无告警。本席先踩后校：错版在真实 A 股 10 票上 α>0 占比=0.000，
      在合成"真价差 150bps"上也=0.000（＝尺子无判别力），改版才复原单调性。
    ② **水平值不可比**：零价差合成底噪 5.2bps vs 本库均值 7.9bps ⇒ 只能用横截面 rank／α>0 占比这类无量纲统计量，禁裸 bps 阈值进卡面。
    ③ **矩必须先平滑**：不先对 β/γ 做窗均值而"逐日算 S 再平均"，本席实测零价差情形 meanS 虚高到 41.6bps（α>0 占比 0.557）＝噪声冒充价差。
    ④ **复权与 HL 法不相容**：γ 取两日 max/min，跨除权日会把两套价格尺度混进一个比率；源实现（MIT 仓）明确要求用不复权极值。
      本库若无"除权除息日标记"列可用，须按 pct_change 与 preclose 反查跳变日并剔除（⑥须登记该处理是否可算）。
    ⑤ 附带在册冲突提示：⑨席空白轴地图把"流动性"列为零出分轴，但同一 to_miners 单把 23 行"情绪/量能/动量高事件开关族"判全线 fail；
      本卡构造对象是**横截面价差刻度**（非事件开关），非同一族——此判断由本席作出，须⑥配对＋⑨正交复判，本席不自证有效。

