# ── 必备③ 逻辑描述
logic_zh: >-
  日内最高价几乎总由买方成交、最低价几乎总由卖方成交，故单日对数高低价差=基本面波动＋价差；
  双日（相邻两日合并）高低价差里的波动成分随时长增长，而价差只被支付一次、不随时长累积。
  用"两单日高低价差平方和 β"与"双日高低价差平方 γ"联立，即可把价差从波动里解出来：
  价差随 β−γ 单调增，β≤γ 时无价差证据（估计置 0）。
  经济含义=低频数据下的交易成本/流动性刻度，属⑨席在册空白轴"流动性"与楼1"spread"子方向，
  与本库已挖的失衡/OFI/微观价格族构造对象不同，且**完全不依赖 tick 表**，
  因此不受本班实测的 tick 近端断供（SIC-...-01/03 被迫把评估窗右端停在 2026-10-07）影响，日线腿可一直用到 2026-10-14。
  方向用法有两条**须分考**的臂：(a) 流动性溢价臂——高隐含价差票押注未来超额收益（学界主流方向）；
  (b) 成本/拥挤反指臂——高隐含价差作为可交易性惩罚项进选股打分。本席不预设谁成立；
  且本班实测给出更硬的约束：本库日线面上该估计量的**水平值几乎不可信**（见 measured_readings），
   usable 面是"横截面相对排序"或"α>0 占比"这类无量纲统计量，而非 bps 刻度。

# ── 必备④ 伪代码（本席自拟，零外部代码复制；括号归属=本班合成实测校正过的版本）
pseudocode: |
  # 输入：单只票按交易日升序的**不复权** high/low（禁用后复权序列做双日 max/min，见 caliber_pitfall_zh）
  hl[t]   = ln(high[t] / low[t])                          # 单日对数极差
  beta[t] = hl[t]^2 + hl[t-1]^2                           # 两单日平方和（t=1 起，首行缺测置 NaN）
  H2[t]   = max(high[t], high[t-1]); L2[t] = min(low[t], low[t-1])
  gamma[t]= ln(H2[t] / L2[t])^2                           # 双日平方极差
  # ——平滑必须先作用在矩上，再解 α（本席实测：不先平滑时正负号噪声主导）——
  B[t] = rolling_mean(beta,  W)   G[t] = rolling_mean(gamma, W)      # W=聚合窗，值留⑥冻结
  K  = 1/(sqrt(2)-1)                                                  # = 1/sqrt(3-2*sqrt(2)) = 2.41421356
  alpha[t] = K * ( sqrt(max(B[t],0)) - sqrt(max(G[t],0)) )           # 关键：γ 项分母是 sqrt(3-2√2)
  alpha[t] = max(alpha[t], 0)                                       # α<0 ⇒ 无价差证据，置 0（不是负数）
  S[t]     = 2*(exp(alpha[t]) - 1) / (1 + exp(alpha[t]))             # 有效价差（价格百分比）
  # 因子面（无量纲优先）：f_raw = 横截面 rank(S)；f_alt = 横截面 rank( mean_{t in W}( 1{alpha_t>0} ) )
  # PIT：S[t] 只用 ≤t 的 high/low；标签用 t+1..t+H 的收益；禁未来窗
  # 退化日处置（A 股特有，必做）：high=low（一字板/全天无波动，本班实测占比 0.2%）与停牌日 ⇒ 该日 hl 置 NaN，
  #   并要求"β/γ 窗内有效样本数≥W_min"，否则该行输出缺失而非 0（缺失≠零价差，见 measured_readings 的底噪证据）
  # 自检（本席踩过、必须让实现方复现）：造合成序列（日内 48 步布朗＋已知半点差 s_true），
  #   正对照＝复原单调性；若整式同除 (3-2*sqrt(2)) 则 α 恒负、输出全零＝静默退化

