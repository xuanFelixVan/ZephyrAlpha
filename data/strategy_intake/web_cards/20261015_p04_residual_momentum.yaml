# ── 必备③ 逻辑描述
logic_zh: >-
  传统总收益动量的收益里混着对市场/规模/价值等因子的**时变敞口**（这正是动量崩溃与因子暴露的来路）。
  残差动量的做法：先用一段历史把每只票的收益率对因子集做时序回归（主刊用 FF3，窗口 36 个月），
  取逐期残差 ε_{i,t}＝"因子解释不了的部分"，再把最近若干期（主刊 T−12..T−2，跳过最近 1 月以避短期反转）的残差**累加**，
  最后除以同一段残差的波动率做标准化（＝风险调整后的残差动量），按该值横截面排序做多高组做空低组。
  为什么可能与本库已判负的"20 日正向动量横截面溢价"不同：⑨席实测两卡（rows[73] ic_mean=−0.0277／rows[74] ic_mean=−0.0406）
  否的是**总收益动量**的溢价方向；本族把因子敞口从动量里剥掉后再排序，构造对象不是同一个量。
  本席**不预设**残差动量在 A 股为正——⑨席的反向先验对"总收益动量"仍生效，且 CSDN 质疑文指出该构造在 A 股月频版"好得可疑"。
  因此本卡交付形态＝带三处口径自由度声明的候选，须⑥预注册冻结＋⑨按"与既有动量卡是否同轴"复判。

# ── 必备④ 伪代码（本席自拟，零外部代码复制）
pseudocode: |
  # 输入：个股日/月收益 r_{i,t}（用后复权 close 计算）＋因子集 F_t（候选见 data_source_mapping，须⑥择一冻结）
  # 主刊口径（日频本库可照搬结构，窗长按⑥）
  for i in universe:
      W = 最近 L 个观测的 (r_i, F)                    # L：主刊 36 个月；日频版须⑥重定标，本席不给数
      (alpha_i, beta_i), resid = OLS(r_i = alpha_i + beta_i' F + eps)   # 含截距；alpha_i **不计入**信号（主刊口径）
      S1 = sum(resid[j] for j in window_skip_recent_1)                 # 残差累计（跳过最近 1 期以避短期反转）
      S2 = std(resid[ same window ])                                   # 残差波动（分母系数差异不改排序，见 source_links 质疑③）
      signal_i = S1 / (S2 + eps)
  signal_t = cross_sectional_rank(signal)              # 截面标准化，禁裸值跨票比
  # PIT：回归窗与求和窗都只到 t；标签取 t+1..t+H；严禁用未来收益重估 beta 后再回填历史
  # 可选对照臂（非要求）：改进残差动量＝求和前把"窗内日波动最高子期"的残差乘 −1（卖方口径，非同行评议）
  # 退化处理：因子里某列当期缺失 ⇒ 整行残差不出（禁前向填充冒充回归）；上市不足 L 期 ⇒ 缺失而非 0

# ── 必备⑤ 数据源映射
data_source_mapping:
  source_line: SL-A01 日线行情线 ＋ SL-A03 指数/行业线（因子腿）
  primary_table: c1_market.kline_daily_hfq（收益基准：后复权 close；本班实测 1990-12-19..2026-10-14、8741 日、5919 票、10,126,612 行，lineage_version 分布=100:10,123,764 行／1:2,848 行(2015-01-05..2026-09-18)⇒ 混合血统窗须由⑥按 lineage_version 切）
  secondary_table: c1_market.kline_index（市场因子腿）；行业因子腿=c1_market.kline_sector／kline_sector_880
  measured_reachability:
    - "kline_index 覆盖：min=1990-12-19 max=2026-10-14 uniqExact(symbol)=1097 rows=3,105,945 ⇒ 市场因子长史存在"
    - "★本班新发硬发现：宽基指数 symbol **双形态分裂**且 canonical 未归一——'000985.CSI' 4619 行（2005-01-04..2026-07-03，symbol_canonical='000985.CSI'）／'000985' 61 行（2026-07-06..2026-10-14，symbol_canonical='000985.SH'）；两形态在 kline_index 内**互不为同一键**⇒ 任何把指数当因子腿的构造必须显式拼接两种形态，且 2026-07-06 起 kline_index 单日行数由 953 骤降到 595（同日面少 358 只指数）"
    - "衔接性核实：2026-07-03=周五、07-04=周六、07-05=周日、07-06=周一（python date 实测）⇒ 07-03→07-06 之间无缺失交易日，分裂是**形态切换＋覆盖收缩**，不是断日"
    - "日线密集宇宙自 2017-01-03（uniqExact(symbol)/年：2016=234→2017=3475，见同批卡 04）⇒ 回归窗左端不得早于 2017-01-03，否则因子腿与个股宇宙断层"
  caliber_pitfall_zh: >-
    ① "残差"两字在本库已有假朋友：strategy_registry 里 STR-MULTIFACTOR-097 的公式是
      rank_cs((ret_20d − ts_zscore_20(ret_20d)) × (turnover/vol_20d))——那是**自身标准化的总收益**，不是因子模型残差；
      实现者若照抄该式当残差动量，等于把⑨席已判负的总收益动量换个名字重投（本席点名防_this 混淆）。
    ② 因子集选择（CAPM/FF3/FF5/行业/PCA）＝不同信号，不是参数；华泰改进版另含"回归不带常数项＋用 PCA 主成分作因子"两处与主刊相左的口径，
      择一即换对象，须⑥逐条冻结并写明"本卡这一臂来自哪个口径"。
    ③ 月频窗不能直接当日频窗用：主刊 L=36 月、求和窗 11 月；日频重标定时"跳过最近 1 期"对应几天是**判据自由度**，本席不给数（留⑥）。
    ④ lineage_version 混合血统（100 vs 1）意味着后复权基准本身有两代，跨代拼接的收益序列可能不自洽；⑤实现前须按 lineage_version 分层验一次收益序列连续性。

