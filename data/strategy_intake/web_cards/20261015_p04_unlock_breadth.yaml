    p50=0.03752／p90=0.05241 ⇒ 常态约 2–5% 在册票在未来 30 日有解禁排期，分布很窄；
    金额形 overhang 分位 p50=0.2646／p90=0.4467／p99=0.8999（单位＝"未来 30 日解禁市值 ÷ 一个日均成交额"）；
