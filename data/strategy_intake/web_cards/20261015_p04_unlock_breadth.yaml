# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝⑨席在册空白轴「资金面分户未占段」，而 06 班游标⑨点名 share_unlock 是"原料齐备但无人做卡"
  的三枚之一（当时卡在"右端 1442 行未来解禁"的 as-of 口径上）。本班开工前读到 ①席 12 班实测
  （记忆面：akshare 三腿未来窗 summary=66／detail=460／queue=4 行 ⇒ 那 1442 行是**正常前瞻排期面**，
  非一次性导入；且 PIT 雷在源侧 stock_restricted_release_queue_em 的"解禁后 20 日涨跌幅"列，入库须剔列、
  消费须按 解禁时间≤as-of 截断）。本班据此先在本库物化面复测该风险：DESCRIBE
  c3_fundamental.share_unlock 共 9 列（symbol, unlock_date, shares, ratio, amount, data_source,
  ingest_ts, exchange, symbol_canonical）⇒ **后视列在本库不存在**，该雷在消费面已不存在，
  只剩 as-of 截断义务（本卡伪代码以"未来窗"直接表达该截断）。
  本体＝未来 30 个自然日内有解禁排期的票数（重复计数）÷ 当日在册票数。
  为什么用**广度**而不是**金额**：本班把两形都造了并各自过闸——金额形（未来 30 日解禁市值 ÷
  20 日均市场成交额）max|corr|=0.3501，撞的是波动成员 **ti_ew_garman_klass_20_v1** ⇒ 被拒；
  其 250 日标准分形仍 0.3284 被拒、
  对一年中位的意外项形 0.3347 被拒；而票数形 0.1687 过闸（撞 lu_count）。
  本班进一步自算两形 Spearman＝**0.6803 ＞ 0.3** ⇒ "解禁金额"与"解禁票数"在本库日频上是
  **同一条轴的两种写法**（大市值票解禁时金额与票数同时抬升，聚合后共线），
  所以本卡**只按 1 轴计产**，并把票数形选为本体（闸余量 0.1313，远大于金额形）。
  经济命题（待 ⑥ 预注册冻结方向，本席不代裁）＝解禁广度抬升＝未来一段流通盘扩容的**确定性供给**
  抬升 ⇒ 对后续市场级收益负向；且该负向应集中在广度**边际抬升**（5 日差分形）而非水平，
  理由＝水平值含制度性季节（每年 1/4/7/10 月的周年峰），市场可提前定价，而增量不可。
  方向只作申报：本班**未做前向收益检验**，5 日差分形虽过闸（0.1093）但与水平形同族同对象，
  计产不另计。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 DESCRIBE 实测名）
pseudocode: |
  # 本体：解禁前瞻广度 = 未来 30 自然日"有解禁排期的票数（重复计数）" ÷ 当日在册票数
  # 坑1：本库表无 trade_date，日期列名是 unlock_date（首版误按 trade_date 查 ⇒ Code 47 原文已记）
  # 坑2：CTE 别名会被 inject_final_strict 当表探引擎 ⇒ 走 ch_writer.query_strict + 自加显式 FINAL
  START = '2021-01-01'
  u = query_strict("""
    SELECT unlock_date AS d, uniqExact(symbol) AS ns, sum(amount) AS amt, sum(shares) AS sh
    FROM c3_fundamental.share_unlock FINAL GROUP BY d ORDER BY d""")
  t = query_strict("""
    SELECT trade_date AS d, uniqExact(symbol) AS n, sum(amount) AS amt
    FROM c1_market.kline_daily FINAL WHERE trade_date >= {START} GROUP BY d ORDER BY d""")
  full = date_range(min(u.date.min(), t.date.min()), u.date.max(), freq='D')   # 关键：日历必须铺到
  #   max(unlock_date)=2027-10-13，否则右端未来排期被交易日历（只到今天）截掉＝供给面被静默清零
  ua  = u.set_index(date)[['ns','amt']].groupby(level=0).sum().reindex(full, fill_value=0)
  f_ns  = ua['ns'].rolling(30).sum().shift(-30)     # 未来 30 自然日涉及票数（重复计数＝广度代理）
  f_amt = ua['amt'].rolling(30).sum().shift(-30)    # 姊妹形：未来 30 日解禁市值（本班实测与之共线 0.68）
  mkt20 = t.set_index(date)['amt'].rolling(20).mean()
  sig_breadth  = reindex(f_ns,  by=t.date) / t.n              # 本体（过闸 0.1687）
  sig_overhang = reindex(f_amt, by=t.date) / mkt20            # 金额形（被拒 0.3501，留作同轴对照）
  sig_breadth_d = sig_breadth.diff(5)                          # 边际形（过闸 0.1093，同对象不另计）
  sig_surp      = sig_overhang - sig_overhang.rolling(250).median()   # 意外项（被拒 0.3347）
  # PIT 纪律：as-of 日只允许用 unlock_date 已在当日以前披露的排期；上式 shift(-30) 表达"前瞻窗"，
  #           ⑤实现须另加"披露时点 ≤ as-of"的截断腿（本库无披露时点列 ⇒ 该腿当前不可验，见 face_gap）
  # 前向收益/IC 检验不在本席写域：本席只交 (date, sig)

