caliber_pitfall_zh: >-
  (1) 本表日期列＝**unlock_date**（Date），无 trade_date；按文件/表名猜列必崩 Code 47；
  (2) ReplacingMergeTree ⇒ 必 FINAL，本班 countIf/uniqExact 全部带 FINAL 跑；
  (3) **CTE 别名会被 inject_final_strict 当表探引擎**（实测 engine_probe 空返回崩）⇒
      走 ch_writer.query_strict 自加 FINAL，与卡16 同处方；
  (4) 前瞻窗计算必须把自然日历铺到 max(unlock_date)，否则 shift(-30) 的右端不是 NaN 而是被截断的
      真数值零（最危险形态＝看起来有数）；
  (5) 分母"当日在册票数"用 kline_daily 的 uniqExact(symbol)（非流通股本口径），
      改该分母＝改广度定义＝改读数，⑤实现须写进卡面参数；
  (6) amount/ratio 各有约 465／1,465 行的零或缺面（30,304−29,839／30,304−30,133），
      金额形受其影响、票数形不受；两形共线 0.6803 的这一半解释（缺面方向）未分离，⑤须查。
