  face_gap_zh: >-
    代理落差四处：(1) 命题原义是"解禁带来的**减持**供给"，本卡用的是"**解禁排期**广度"，
    排期≠减持（sina 那条反方证据正是此点），中间隔着股东减持意愿这一不可观测混杂；
    (2) **披露时点无列**：本库 share_unlock 只有 unlock_date，没有"该排期何时被披露/入库"，
    ingest_ts 是入库时间而非公告时间 ⇒ 严格 PIT（as-of 只见已披露者）在本表**不可自证**，
    须 ① 席补 disclosure_date 腿或 ⑤ 实现时以 ingest_ts 下界近似并如实声明；
    (3) "涉及票数（重复计数）"是广度近似：同一票在 30 日窗内多次解禁会被计多次，
    真广度应为 uniqExact(symbol in window)（CH 侧窗口去重代价高，本班未做，⑤须定夺）；
    (4) 制度时变：EY 2026-06 报告明示锁定期约束与减持披露规则正在收紧 ⇒ 该轴的系数不该跨期恒定，
    ⑥/⑦ 考工若做 regime 腿须按披露规则改期分段。
  orthogonal_gate_zh: >-
    正交闸实跑（本班，门柱 0.3 为在册冻结值，本席未动；尺＝signal_orthogonality.py gate，
    池＝.runtime/tmp/p04_06_pool 32 枚；闸可用性对照见卡16 同段：pool-report 复现 PR=5.3328、
    负对照自撞 max|corr|=1.0000）：
    unlock_ovh（金额形）→ verdict=reject max|corr|=0.3501（ti_ew_garman_klass_20_v1）；
    unlock_z（金额形 250 日标准分）→ verdict=reject max|corr|=0.3284（ti_ew_rogers_satchell_20_v1）；
    unlock_surp（金额形对一年中位的意外项）→ verdict=reject max|corr|=0.3347（ti_ew_rogers_satchell_20_v1）；
    **unlock_breadth（票数广度形）→ verdict=pass max|corr|=0.1687（lu_count）rc=0**；
    **unlock_breadth_d（广度 5 日差分形）→ verdict=pass max|corr|=0.1093（ti_ew_wt1_v1）rc=0**。
    三枚金额系全部被**波动成员**吸走（garman_klass／rogers_satchell）＝本班对该轴的实质读数：
    解禁市值日频序列在本库与"当天波动多大"高度共线，金额形不宜作本体的市场级代理。
    本班自算 Spearman 互校（1131 共同日）：unlock_ovh ↔ unlock_breadth = **0.6803 ＞ 0.3** ⇒
    金额与票数两形同轴；unlock_breadth ↔ unlock_breadth_d = 0.1501（同一对象的差分，非新对象）；
    unlock_breadth ↔ unlock_surp = 0.1804。跨卡：amihud_disp ↔ unlock_breadth = **0.2740 ＜ 0.3**
    ⇒ 卡16 与卡17 是**两条不同轴**，本班计产 2 轴（候选序列共 9 枚）。
  dedupe_gate_zh: >-
    去重闸（strategy_registry.yaml，387,739 字节／161 条目，本班逐词全册扫）：
    「解禁」0 命中／「限售」0／「unlock」0／「restricted」0 ⇒ **存量册零同本体**（这是本班
    对"空白轴"判定的最强命中面证据：三个词在全册正文/标签里都不出现）。
    相邻面申报：06 班游标⑨在册的 share_unlock 是"原料齐备未做卡"，非"已有卡"；
    本席 03 班 unlanded 卡 holder_concentration（股东户数集中度）与 top10 系列用的是
