    - pead_earnings_event＝**不可用作面板**：2824 行全部 trade_date=2026-10-14，uniqExact(toDate(produced_at))=1（单一时刻 03:59:31）；sue_band 分布 negative 2428／neutral 288／strong_negative 78／positive 24／strong_positive 6；actual_eps 与 consensus_eps 同为正时 consensus>actual 占 2332/2364；sue 极值 −60 与 +74.81；actual_eps<0 计 458 行、consensus_eps<0 计 25 行 ⇒ 口径疑病，已单列移交①②与⑤（见 caliber_pitfall ②）
    - analyst_forecast＝**深度不可达**：report_date 仅 2026-07-22 至 2026-10-14（131081 行、2817 只）⇒ 预期修正动量（ERM/离散度）轴现阶段无法过门槛⑤，本卡不开该腿
    - express_report＝28708 行、4395 只，report_period 2004-12-31 至 2026-03-31，announce_date 2005-01-08 至 2026-07-02 ⇒ 快报是介于预告与正式报告之间的更早一层
    - earnings_forecast＝125582 行、5707 只，report_period 1998-12-31 至 2027-12-31（其中晚于 2026-06-30 者仅 6 行：2026-12-31 五行、2027-12-31 一行），announce_date 1999-01-08 至 2026-07-03
  caliber_pitfall_zh: >-
    ① 本库基本面有三层披露（预告 earnings_forecast → 快报 express_report → 正式 financial_derived/indicator），
      越早在前的层数值是区间或估计。**混层即前视**：把正式报告的精确值填进预告日，等于用未来信息。
      本卡只绑 financial_derived 的 announce_date 一层，其余两层列为下游可选扩展且须另立卡另测 PIT。
    ② pead_earnings_event.sue 疑为「半年度实际 ÷ 年度一致预期」之类的跨期错配（符号面 96% 为负、|sue| 达 60 至 75），
      且只有 2026-10-14 一个生产时刻。本席判其**既非面板也不可信**，禁下游把它当 SUE 因子现成物化使用；
      若要用 SUE 思路，用 financial_indicator 的 eps_yoy 序列自算「相对自身滚动分布的意外」，或等①②把口径修清。
    ③ 财务列的**单位与量纲本席未对表**（本行读到的 ocf_q/total_assets 为元级大数，非万元），
      比值口径成立但禁裸阈值；截面 rank 面可用，绝对值面禁用（与卡07 同类瑕疵同型，勿重复申请）。
    ④ 银行/券商/保险的 ocf_q 由存贷款与同业往来主导：000001 实测单季 ocf_q 从 −73822000000 摆到 +244075000000，
      同期 np_q 4294000000 至 14523000000 ⇒ 应计列对金融股是被噪声主导的伪量。剔金融＝硬约束（外部 BigQuant 同向）。
    ⑤ 跨年可比性：2024-12-31 之后 financial_indicator 的 (symbol,report_period) 覆盖从 ~5700 涨到 10000+ 行/期，
      说明出现大量同票多行（修正/重述）。本卡主表 FD 无此现象（240 组），但一旦⑤改绑 FI 必须重做 step1。

# ── 四闸判定
gates:
  dedup_gate:
    registry: docs/01_policies_and_standards/_registry/catalogs/strategy_registry.yaml
    strategy_id_count: 163（本班 grep -c 实测，与卡10 同批读数）
    ruler_readings: >-
      应计=0／accrual=0／盈余=0／意外=0／公告=0（本卡本体在注册表**零存量**）；
      邻近非零＝财报=3（其中第 12202 行 tags 属第 12126 行 STR-EVENT-001 事件驱动 sleeve；第 12379 行是 POE 卡的 PIT 表述）、
      ROE=4、基本面=1（第 3949 行的主观打分权重「目标价空间 40%+基本面质量 30%…」）、加速=11（全为「启动前不加速」一类形态散文噪声，非因子）；
      质量族在册有一条 DS-230 三正质量门（第 12299 行：PB>0、ROE>0、经营现金流/营收>0）——它是**布尔门槛**不是连续应计因子。
    positive_controls: 盘口=7／动量=14／换手=12／资金流=11（同尺同文件，尺有判别力）
    nearest_existing:
      - 第 12126 行 STR-EVENT-001『事件驱动 sleeve 组装策略』——其业绩类评分自述含 SUE＋EAR＋ORJ，短持有期（2-3 天收敛）且依赖 event_score=design 态、事件链 NLP 管道未闭环；本卡为截面慢因子，同源不同物
      - 第 12370 行起『低 PB 与高 ROE（POE）双因子交叉选股』——已立「财报按 announce_date 严格 PIT」纪律，但本体是估值×盈利水平；本卡本体是盈余构成（应计 vs 现金流）
      - 第 12299 行 DS-230 三正质量门——现金流/营收作布尔过滤条件，非连续因子，不可与本卡折叠计员
    verdict: 非重复（基本面本体轴首次入册）
    differentiation_zh: 存量把财务数据当**门槛条件**或**水平估值打分**，从未把「盈余的现金支撑比例」做成截面连续因子；本卡的可执行差异是 (np_q−ocf_q)/total_assets 这条列级构造＋首披行 PIT 规则，二者均不可由存量条目调参派生。
  license_gate: 通过（百科/学位论文摘要/社区研报/arXiv 条目＝思想级；GitHub 本公司零命中；GPL 命中 0；零代码复制）
  orthogonality_gate:
    verdict: 闸**已开但本候选未测**（判「未测」非「已过」）
    measured: >-
      本班已把闸跑通（方法、序列面与四条读数见卡10 的 orthogonality_gate.measured，同批同工具，不重复复跑）。
      但应计是**个股截面**因子，docs/04_research_records/mining/ledgers/nightmine_20261010/series/ 的 34 枚可喂序列全是
      市场级单列（涨跌停数、情绪聚合、等权技术指标），**没有任何一枚是应计或财务度量**
      （本班逐档列名核过：agg8 族 9 枚＋mkt_fwd 2 枚＋streak_distribution 1 枚（列集不合契约）＋ti_ew 技术指标 22 枚）。
      ⇒ 本席不自造截面序列喂闸（造序列属⑤实现写域），只登记「闸可用、本候选待⑤物化降维列后再过」。
    self_flag_zh: 三条共线先验须优先排闸。①应计与「经营现金流/营收」质量门（第 12299 行）同用 ocf 列，符号层须对齐；②应计与本批卡07 净流入强度、卡08 换手率同被 ⑨席判为空白轴，若三者在截面 rank 面上共线则只算一员；③「盈余加速」（eps_yoy 的二阶差分）与应计是同一份财报的两种读法，⑥禁当两轴——本卡**不含**加速腿，正是为此。
    handoff: 请⑤先物化一条截面降维列（建议＝最高应计十分位减最低十分位的日度多空价差序列，或应计截面 rank 均值），再喂 gate；口径与命名由⑥预注册，本席不代定。
