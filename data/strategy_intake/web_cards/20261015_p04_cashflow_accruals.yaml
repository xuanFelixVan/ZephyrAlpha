# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝楼2 基本面是 ⑨席在册空白轴（分数册 75 行无一条以基本面度量为信号本体出分），
  而本库基本面库 c3_fundamental 有 10 余张表、其中一张（financial_derived）是本席实测到的**唯一干净 PIT 面板**。
  本卡选「现金流应计」作为该轴的第一个本体，理由三条，全部来自本班实测而非文献：
  (a) 它是**慢因子**——季度更新、公告日生效，与现有全部日频量价候选的时间尺度错开，天然不容易共线；
  (b) 它的原材料在本库齐备：np_q、ocf_q、total_assets 三列 2024 年起窗内可用组合数实测 54392 行，
      total_assets 零缺值、np_q 缺 8.89%、ocf_q 缺 9.34%；
  (c) 它在本库注册表**零存量**（应计=0、accrual=0），不像估值/质量族已经有人在做。

  构造主腿＝ 应计_i,t = ( np_q − ocf_q ) / total_assets，其中 q 为单季增量口径（本班对 000001 逐期核验
  np_q／ocf_q 与 *_cum 的差分关系成立，见 data_source_mapping 第 5 项）。方向先验＝**负**：高应计押未来低超额收益。
  外部证据强度登记清楚：原刊效应量约 10%（三处独立命中互证）、A 股社区研报 2016-2022 多空 6.76%、
  但**中国学术结论不统一**（学位摘要原文承认），故本卡只交假说不交结论。

  本卡另立一条**对照腿**（禁与主腿合并报数）＝资产负债表法应计＝ 营运资本变动（应收账款变动＋存货变动）
  与 total_assets 之比——financial_derived 备有 accounts_receivable、inventory、goodwill 列，两法可比。
  Sloan 原文即用两法互证；BigQuant 页面亦称三种标准化「展示相似的分组收益特征」，
  故本库若两法读数背离，第一嫌疑是实现口径而非市场结构。

  三条硬约束写进卡面假设，缺一条读数即失真：
  ① **必须剔金融**。本席对 000001（银行）实测：单季 ocf_q 在 −738 亿至 +2441 亿之间摆动，
     同期 np_q 只有 43-149 亿——银行的「经营现金流」由存贷款流向主导，应计列对它无意义。
     这与 BigQuant「除金融外 27 个行业有效」同向，两证齐，故写成硬约束。
  ② **必须挑首次披露行，且把修正行当新事件**。financial_derived 的 (symbol, report_period) 重复极少
     （2 行仅 240 组），但同族 financial_indicator 重复 32623 组（约 9.2%）——若⑤实现改绑 FI，
     取「最新行」会把未来修正值回填进历史，构成前视污染；取「最早 announce_date 行」才是 PIT 正解。
  ③ **必须处理披露节拍不等长**。本因子只在公告日刷新，一年四个报告期加修正，
     非公告日靠上一次披露延续（前向填充）。填充规则（自然日延续到下期／固定 N 日失效）归⑥冻结，
     本席不拍。卡09（股东户数）在册同类瑕疵即此，勿重犯。

  与在册存量的两条关系：其一，第 12370 行起『低 PB 与高 ROE（POE）双因子交叉选股』已明确
  「财报按 announce_date 严格 PIT」——本卡继承这条 PIT 纪律但本体不同（它测水平估值，本卡测盈余构成质量）；
  其二，第 12126 行起 STR-EVENT-001『事件驱动 sleeve 组装策略』的 entry_logic 自述已包含
  「业绩类 SUE＋EAR＋ORJ 三/双因子」评分，且自述依赖 event_score=design 态、事件链 NLP 管道未闭环。
  ⇒ 本卡与它的边界＝它是**公告事件的短持有期 sleeve**（2-3 天收敛、urgency=next_open），
  本卡是**截面慢因子**（季度刷新、以月计持有）。二者可同源不可同卡，⑥配对时禁合并计员。

# ── 必备④ 伪代码（本席自拟，零外部代码转写）
pseudocode: |
  # 输入 c3_fundamental.financial_derived(symbol 裸6位, report_period, announce_date,
  #       np_q, ocf_q, total_assets, accounts_receivable, inventory, goodwill, quality_flag, ingest_ts)
  # 标签 c1_market.kline_daily.pct_change（在册：kline_daily.pct_change 非零率 141155/144576，右端 2026-10-14）

  step1 首披行:
      for (symbol, report_period) in financial_derived:
          取 announce_date 最小且 announce_date > toDate('1990-01-01') 的那一行   # 本表实测无 1970 哨兵，仍加此谓词防他表复用
          修正行（同 (symbol,report_period) 的后续 announce_date 行）不覆盖历史值，另记为「新事件」时间戳
          # 对照（勿照抄到 financial_indicator）：该表 1970-01-01 哨兵 32908/386559＝8.51%，
          #   且 (symbol,report_period) 重复 32623 组；用FI 必须显式剔哨兵并选首披行，否则静默错
  step2 主腿:
      accrual_cf = (np_q - ocf_q) / total_assets            # total_assets<=0 记缺测，禁填充
  step3 对照腿:
      d_ar  = 本期 accounts_receivable - 上年同期 accounts_receivable   # 同比还是环比、缺失年如何处理 = ⑥须声明
      d_inv = 本期 inventory           - 上年同期 inventory
      accrual_bs = (d_ar + d_inv) / total_assets            # 与主腿分列分别喂闸，禁平均成一个因子
  step4 宇宙与截面:
      剔除 金融（银行/证券/保险，行业口径归⑤定表）——理由见 caliber_pitfall ④，两证齐
      剔除 亏损（BigQuant 报「剔除亏损公司后分组超额更单调」；本卡另立含亏损的对照臂，两臂分考）
      剔除 ST／停牌／上市龄 < 1 个完整报告期
      截面分位 rank_cs(accrual_cf) 按行业×市值分组去规模（分组数留⑥）
  step5 时间对齐（PIT 核心，做错即前视）:
      as_of(d) = 在 d 日已披露（announce_date <= d）且仍未被下一期披露覆盖的最新 report_period 值
      生效延迟 d_shift >= 1 交易日（公告多为盘后披露，当日不可得；具体档留⑥）
      前向填充上限（自然延续 or 固定 N 日失效）＝⑥冻结项
  step6 标签:
      y = 未来 n 日累计收益（n 与折叠口径留⑥；建议同时考 20/60/120 日三档，
          因外部证据显示漂移在 30-60 交易日量级＝社区页面口径，非判据）

