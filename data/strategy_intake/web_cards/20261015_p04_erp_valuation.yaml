# ── 必备③ 逻辑描述
logic_zh: >-
  【一句话】把「股票相对债券的赔率」做成一个市场级慢变量门控：用沪深300（及中证500）的时变股权风险溢价
  及其**过去窗内**分位，决定权益风险预算的高/低两档（或三档），而不是用来给个股排序选股。

  【为什么本卡现在可开工，而三班前的在册结论说估值轴不可达】本席实测两条相反面：
  (1) 个股截面面**确实被阻塞**——daily_valuation 全表只有 255431 行、47 个交易日（2026-08-03 至 2026-10-14），
      且最后一日只 1553 只（其余日 5208-5574 只）＝右端未跑完；stock_valuation 表存在但**行数 0**（空壳）。
      所以「用 PE/PB 做横截面价值因子」在现库无法回测，这条在册判据本班予以复证。
  (2) 市场级面**未被阻塞**——index_valuation_daily 8142 行＝4071 个交易日 × 2 个指数（000300、000905），
      跨度 2010-01-04 至 2026-10-13（≈16.7 年，覆盖 2010-2014 熊、2015 牛熊转换、2018 熊、2021-2024 熊、2024/2025 反弹多段体制）。
      其中 erp 列在 000300 上有 3647 个非空日（缺 424 日），pe_ttm 满值，cape_5y_pct 有 2898 日。
      ⇒ 游标在册「楼3 估值仍被 daily_valuation 47 日阻塞」应改判为：**只有截面腿阻塞，市场级腿可达**。
      本卡只主张市场级腿。

  【本班最硬的一条实测：现成的「分位」列不能直接用】schema 注释（真源
  schemas/categories/market/market_index_valuation_daily.py 第 49-50 行）自述 cape_5y_pct/pe_pct/pb_pct
  「为全历史扩展窗分位（expanding percentile）」，erp_pct 为「其全历史分位」。本班对 000300 的 erp 与 erp_pct 两列做了三问：
  (a) 把 erp 水平按 4 位小数分组，只留组内≥10 个观测的组（共 124 组）：组内 erp_pct 的中位标准差＝**0.000887**，
      最大组内极差＝**0.0055**。例：erp=0.0596 这一水平在样本里出现 22 个不同交易日，其存储分位全落在 0.6848-0.6900。
      ⇒ 存储分位几乎是「水平的函数」，与日期/窗无关。
  (b) 与「全样本 rank(pct=True)」相关：Pearson＝Spearman＝**0.999996**；与扩展窗假设相反的直接反例：
      2012-07-30 存储 erp_pct=0.6823，而按截至当日扩展窗重算＝**1.0000**（2024-02-02 存储 0.8916 vs 重算 0.9943）。
      ⇒ 「扩展窗（只用 t 及以前样本）」这一假设被证伪。
  (c) 全样本分位与存储值仍非逐点相等（最大绝对偏差 0.1042，集中在早年）⇒ 本班只判「**实面是全样本/固定窗排名，非扩展窗**」，
      不指认生产器具体实现；差异可能来自其分母基数或早期样本处理，须⑤/①读生产码定性。
  ⇒ 结论与后果：**若把 erp_pct（或同族 cape_5y_pct/pe_pct）直接当作 t 日特征送进考试，就等价于把全样本分布信息放进当日，属前视泄漏**；
  且该泄漏不会报错——列名、类型、范围（0~1）都正常。本卡因此把可用面限定为「erp 水平面＋⑤自算扩展窗分位」，并把现成 pct 列列为禁项。

  【门控形态的要点（思想级，具体阈值一律不由本席定）】外部三处独立文本共同指向同一构造骨架：
  先取 E/P（或股息率）与 10 年期国债收益率之差，再取该差值在**过去窗**内的排名分位，分位极高＝权益赔率高→加仓档，分位极低→减仓档；
  同时反复警告「绝对值不可跨利率时代比较」（低利率时代 ERP 被动抬高）。本库右端读数与之一致：
  2026-10-13 000300 erp=0.0596／erp_pct=0.689，000905 erp=0.0249／erp_pct=0.6597——同一日两只指数的水平差 3.5 个百分点而分位接近，
  这正是「水平不可比、分位可比」的实例，也说明**分位必须按指数各算各的**（本库两指数各 4071 日，天然分层）。

  【为什么这是「改良」而非「新造」】本班实测本库已有两处在用该表：
  src/zephyr/regime/features/regime_data_loader.py 第 605 行起直读该 8 列并声明消费语义；
  src/zephyr/regime/overlay_signals_builder.py 第 573-594 行已把 cape_5y_pct 与 erp_pct 组装进体制层特征。
  ⇒ 本卡不与它们竞争「谁先想到用估值」，而是把两件事交给下游：一是**门控信号本体**（赔率→风险预算档位）尚未作为战法卡在册；
  二是**现成分位列的前视问题落在这两处存量上**（属①/维护写域，本席不代修，见 verification 与 to_datasource 移交）。

# ── 必备④ 伪代码（全自拟，禁外部逐行搬运）
pseudocode: |
  # 层 0：取数（严格读通道，两指数分开取，禁 concat 后混算分位）
  for idx in [000300, 000905]:
      raw = CH_read(
          "SELECT trade_date, erp, pe_ttm FROM index_valuation_daily "
          "WHERE symbol = idx AND trade_date <= asof",            # PIT：只用 asof 及以前
          db="c1_market")
      # 禁则：不 SELECT erp_pct / cape_5y_pct / pe_pct / pb_pct 作为特征列

  # 层 1：缺测处理（本班实测 erp 有 848/8142 空值，000300 侧 424 日）
  s = raw.erp.dropna_or_flag_asof_carry()      # 剔 or 前值替代：由⑥冻结，两种处理禁混用
  assert not all_values_zero(s)                # 空值若被填 0，会把「极贵」伪装成「极高溢价」方向反

  # 层 2：分位＝过去窗内排名（扩展 or 滚动由⑥选一，禁全样本）
  pct_expanding = s.expanding(min_periods=W0).apply(lambda w: (w <= w[-1]).mean())
  pct_rolling   = s.rolling(LOOKBACK, min_periods=W1).apply(lambda w: (w <= w[-1]).mean())
  # 自检（本班实跑过的同一条，⑤必须跑通才算对齐现成列）：
  #   把现成 erp_pct 按 erp 水平分组，组内标准差若≈0 ⇒ 证实它是水平的固定函数，禁当扩展窗用

  # 层 3：门控（档位数量与阈值全部留⑥预注册，本卡不写数值）
  state = bucket(pct, edges=B)                 # B=2 或 3；edges 与是否含「中性持平」带由⑥定
  target_risk_budget = map(state -> [low, mid, high])

  # 层 4：双臂并列（同一变量的水平面与分位面禁各计一员）
  candidate_level  = zscore(s, ROLLING_MEAN_WINDOW)     # 水平面：跨利率时代不可比，只作参照
  candidate_pct    = pct_expanding                       # 分位面：主候选
  # 本班实测：Spearman(level, pct) = 0.999996 ⇒ 二者信息同物，进闸只准进一根

  # 层 5：正交与计量（本席已跑的面与单位）
  #   候选喂闸＝市场级单列 date,sig；池＝夜挖序列面剔标签后 32 员
  #   读数：level pass 0.2693；pct 单独对池 pass 0.2692，但对「池+level」reject 1.0000
  #   ⇒ 池谓词禁同时收 level 与 pct（同物两形），只计一员

  # 层 6：回测卫生
  #   慢变量 ⇒ 换仓节拍与交易成本假设须与「日频分位」脱钩（外部多源称「每月看一次」）
  #   右端滞后：本表 max(trade_date)=2026-10-13（同日 000905/000300 均有值），禁假设当日可得

