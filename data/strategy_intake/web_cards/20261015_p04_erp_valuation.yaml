    - daily_valuation（截面面，判不可用）：255431 行、47 日（2026-08-03 至 2026-10-14）、5579 只；pe_ttm=0 1697 行、pb_mrq=0 1752 行、close=0 1626 行、pct_change=0 7581 行、turnover=0 **249392/255431＝97.63%**；2026-10-14 仅 1553 只（其余日 5208-5574）
    - stock_valuation：列集含 pe/ps/pcf/dividend_yield 六列，但 **count()=0**＝空壳表，不可绑
    - 本班闸实跑面：候选=erp（3647 日）与 erp_pct（4071 日）与 cape_5y_pct（2898 日）；池=夜挖序列面剔 mkt_fwd5/mkt_fwd10 两枚标签后 32 员；五枚候选自身 pool-report n_members=5、n_common_dates=1776、PR=2.2664
  caliber_pitfall_zh: >-
    ① 现成 *_pct 列＝前视（本班实测，判据见 logic_zh 第三段三条）。这是本卡最该被下游读到的一句：
      用列名前缀看不出问题，用范围（0~1）看不出问题，只有按水平分组才能看出来。
    ② erp 的单位与符号：表内 000300 右端 0.0596、000905 右端 0.0249，schema 自述「百分数口径」但值域像小数（0.02-0.09），
      与外部文本写的「5.96%」是同一数不同单位。**⑤实现前必须先定单位**，否则阈值（如「>6%」）会被当成 0.06 或 6 两种读法。
    ③ 缺测不是随机的：erp 空值 424 日在 000300 侧，若用前值替代会平滑掉利率停更期；若剔则样本集变化，
      两指数侧不可再用同一掩码（本班实测两列非空日不同：erp 3647 vs erp_pct 4071）。
    ④ 慢变量与日频分位冲突：外部三处都写「每月/低频」，但表是日更且分位逐日变。
      若⑤按日频喂进 IC 检验，会制造「有读数但无换手经济意义」的伪信号；节拍与成本假设须由⑥写进卡面假设并让⑦⑧按该节拍考。
    ⑤ 本表在源线谱里的归属本班不指认：SL-A04 的 DS 锚写的是 daily_valuation（akshare），而 index_valuation_daily
      更像指数侧独立供给线；源线谱另有 SL-A03 板块/概念指数与 SL-A10 国际宏观（锚 DS-FRED 含美债 10Y，未列中债曲线）。
      ⇒ 请⑩/源线班定一行归属，本卡只写「用表＋实测」，不替源线谱发明编号。
    ⑥ 在册卡面的源线编号有一处笔误需更正（另起留旧案卷，不改他班原文）：本班之前的一张卡把估值腿写作
      「SL-A05 每日估值线」，而源线谱第 27-28 行为 SL-A04=估值线、SL-A05=财务线。请⑥制卡冻结时按真源改标。
    ⑦ 截面腿与本体腿禁混报：本卡的一切读数单位是**市场级单列序列**（每个交易日一个数），
      与卡10/卡11 主张的个股截面因子不同单位；过闸结论不可跨面引用。

