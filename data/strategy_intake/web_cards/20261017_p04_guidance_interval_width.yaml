title_zh: 业绩预告区间宽度与精度（下限-上限相对宽度＝管理层信息精度的直接可测量）——盈余指引精度轴首条，含「区间宽度 p50 恰＝20.0pp＝疑似规则填值而非公司自选」与「本库预告类型十档枚举齐备而『预告更正』零列」两条申报
mining_tower: 管理层披露**内容质量**（说得多确定，而非说了什么方向）。本席在册相邻三卡分别是『高送转强度与合规裕度』(songzhuan_regulatory_slack＝送转比例距监管上限的裕度)、『非标准审计意见广度』(审计人裁定)、『盈余惊喜』(L9-A05＝数值 vs 预期)。本轴对象＝**公司在预告里给出的净利润变动上下限之间的距离相对于中值的比例**＝指引精度/imprecision，与"方向/幅度/是否超预期"三个对象都不同。⚠ 与卡33 的**形状同源**（都是"实测值 vs 监管线"的裕度思路），本班如实登记：对象不同（送转比例 vs 预告区间）、监管线不同（10送10 vs 20%/50% 区间），去冗余交 ⑥/⑨ 判，本席不自判正交。
