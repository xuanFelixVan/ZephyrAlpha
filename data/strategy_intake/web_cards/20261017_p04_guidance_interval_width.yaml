    report_period <= 当前可用期裁剪）；分析窗 2018-01-01..2024-12-31＝48,575 行／5,299 票；
    forecast_type 十档枚举与行数逐字＝预增 14,229／略增 6,521／首亏 6,233／预减 6,128／续亏 5,609／扭亏 4,601／略减 3,121／续盈 1,394／
    不确定 723／其他 16（⇒ "不确定/其他"两档＝宽度语义不适用，须单独档而非并入负方向）。
    profit_change_min 非空 46,031、max 非空 46,005、两者皆非空 **45,978（占窗内 94.7%）**；(sym,announce_date,forecast_type) 重复 45 行。
  calibers_measured_zh: >-
    量纲本班实测＝**百分数（pp）**：pmin p50 13.82／pmax p50 32.00／width_pp p50 **20.00**／p90 77.54／max 38,315.35（＝异常大值须截尾，
    疑为上年利润近零导致的百分比爆炸）；pmin<0 的行 18,859（41.0%）。中值归一宽度 width_rel_mid p50 **0.238**、p90 1.333、有效 45,656。
    ⚑⚑ 本班自证伪一条：width_pp 的 p50 **恰＝20.00**，与监管问答"20%为宜"线逐字相同 ⇒ 存在两种解释（公司贴规则线取值 vs ETL/上游按规则填默认区间），
