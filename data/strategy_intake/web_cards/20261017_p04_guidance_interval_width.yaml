caliber_pitfall_zh: >-
  (1) 三套宽度分母不可混：监管「(上-下)/下」、学术「abs(上-下)/abs((上+下)/2)」、券商「相对真实值的偏离宽度」＝三个不同量，
  本卡两腿各用一式并列，禁止有人把它们当同一列对拍；(2) profit_change_* 是百分数、net_profit_* 是元；
  (3) forecast_type「不确定/其他」两档（723＋16 行）不适用宽度语义，须单独档；(4) report_period 有 2027-12-31 等未来值，
  裁剪谓词必须显式写；(5) 区间跨零（pmin<0<pmax）的行，相对宽度会爆炸＝必须单列档而非纳入主腿。
