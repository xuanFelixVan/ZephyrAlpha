logic_zh: >-
  业绩预告给的是区间（下限/上限），区间宽度相对于中值就是管理层承认的不确定程度。监管线把它压到"20%为宜、50%为限"，因此宽度天然被截在
  制度附近；学术构造把 WIDTH 定义为 abs(upper-low)/abs((upper+low)/2) 并直接称其为"精度"（宽度越大精度越低）。机制上有两向：
  (a) 信息环境差／重大事项未定 → 公司诚实放宽区间（宽度＝真实不确定性，未来应更低质量）；
  (b) 策略性披露 → 公司故意放宽以便事后"落在区间内"（李小朔等 2021 的"策略性披露"路径）。
  券商实测给出的形态事实是：真实值更靠近**下限**、上限偏离是下限偏离的 1.5~2 倍 ⇒ 区间不对称本身（(上限−中值)/(中值−下限) 或
  上下限偏离真实值的比）可能是比宽度更强的一列。本卡把主腿定为宽度、把不对称度与"是否发预告"备用腿并列，全部**不预注册方向**。

pseudocode: |
  -- 主腿：区间相对宽度（中值归一，学术构造）＋ 下限归一（监管构造）两式并列，禁合并成一个数
  WITH g AS (
    SELECT symbol_canonical AS sym, report_period, announce_date, first_announce_date,
           forecast_type, profit_change_min, profit_change_max, net_profit_min, net_profit_max, last_year_profit
    FROM c3_fundamental.earnings_forecast FINAL
    WHERE profit_change_min IS NOT NULL AND profit_change_max IS NOT NULL
      AND announce_date > DATE'1990-01-01'
  )
  SELECT sym, report_period, announce_date, forecast_type,
         (profit_change_max - profit_change_min)                                     AS width_pp,      -- 百分点，量纲本班实测
         (profit_change_max - profit_change_min)
           / abs((profit_change_max + profit_change_min) / 2.)                        AS width_rel_mid, -- 学术 WIDTH 口径
         (profit_change_max - profit_change_min) / abs(profit_change_min)             AS width_rel_low, -- 监管问答口径（分母=下限）
         (profit_change_max + profit_change_min) / 2.                                 AS change_mid,
         if(profit_change_min < 0 AND profit_change_max > 0, 1, 0)                    AS cross_zero     -- 区间跨零＝幅度不可比，须单独档
  FROM g;

  市场级序列（本卡本班实跑两腿）：
    腿1 宽指引广度 = 滚动 365 日内 width_pp >= 100 的预告条数 / 窗口内预告条数；
    腿2 相对宽度中位数 = 滚动 365 日 width_rel_mid 的中位数。

  禁则一：分母 abs((max+min)/2) 在 max+min≈0 时爆炸＝本班实测须把 |mid| < 1（个百分点）的行剔除并单独记档，禁当 0 宽度。
  禁则二：profit_change_* 与 net_profit_* 单位不同（前者为 %、后者为元），禁在同一式里混算；跨表禁与本库 dividend/rights_issue 混算。
  禁则三：first_announce_date 与 announce_date 两列语义未确证（本班未验＝不自称确证），做"多次预告/更正"腿前必须先反推确证（同 1017-04 班 announce_date 反推法）。
  禁则四：本库无「预告更正」事件列（见 data_binding 缺口腿），禁把"更正"当可构造腿。

