    ④ 关键红旗实跑＝dateDiff(day, announcement_date, effective_date) 均值 −18.758、min −30、max 0；
      分组复量『announce 晚于 effective』＝**14,758 行 / 5 行相等 / 0 行早于**；data_source 唯一值＝snapshot_diff(14,763)；样本 4 行 000300.SH 2026-06-15 批全部 announce=2026-06-30（晚 15 日）；
    ⑤ 可消化度腿四面试可行＝msci_adjustment count()=**0 行**（外资调样彻底无源）；etf_list 2,194 行但 index_code 空值率 **2,194/2,194=100%**⇒ETF↔指数映射断链；
      etf_nav 105,334 行 span 2021-07-29..2026-10-15 但 total_assets=**0 的行 103,773（98.5%）**⇒被动规模腿不可用；index_weight 5,550 行（列 trade_date/index_code/symbol/weight/valid_from/valid_to）＝有权重但相对 3,534 票×96 批**极稀**。
  face_gap_zh: >-
    四处断链，本卡一律不假装可得：
    (1) **真实公告日无源**＝announcement_date 被实测证伪为 snapshot_diff 落库日（99.97% 晚于生效），本库无『中证指数公司公告日/审核截止日』列
      ⇒ 外部文献里最强的『公告→生效』抢跑窗（本卡 5 日腿）**无法按公告锚复刻**，只能按 effective_date 反推 T−5；这在事前可得性上**弱于**真实公告锚（因为 T_eff 本身也是公开日历，故仍可用，但『公告当日』的信息增量拿不到）；
    (2) **被动跟踪规模无源**＝etf_list.index_code 100% 空＋etf_nav.total_assets 98.5% 为 0 ⇒ g_i,d 的比例常数 IndexSize 缺，本卡退化版只剩 w_delta/ADV 相对序；
      转 ①/② 席：补 ETF↔标的指数映射列与份额/AUM 面（在册另有 sentiment_rebuild 卡面已记 market_etf_share_snapshot 为候选面）；
    3) **调出侧权重无源**＝exclusion 行 weight 100% NULL ⇒ 调出腿只剩方向无规模，调入/调出两侧**不可对称构造**（本卡因此不许写『对称多空』读数）；
    (4) **批次稀＋外资腿空**＝96 批×5 指数、中证全指仅 5 行、msci 0 行 ⇒ 横截面自由度低且『富时/MSCI 外资调样』这一 A 股重要流源完全缺失；
      ⇒ 市场级序列的事件数上限≈96 批，日频 IC 与事件研究分母都偏小，须 ⑥ 按在册『30 对/日 IC 地板』与『事件族 OOS 地板 48.8% 密度不可达』两判据先算可行性再谈开考。
  orthogonal_gate_zh: >-
    正交闸【本班缺席，如实申报，未编数】。本班复量池面三面（.runtime/tmp/p04_06_pool、.runtime/tmp/st-qoder-p09-1015-04/pool_datesig、.../pool6）＝**目录在而 is_file() 全为 0**＝第四次退化；
    在册假绿红线续用＝⑨ 席 1017 记该闸『打 ERROR 却 rc=0』已修 rc=2 但 --out 件仍不生成 ⇒ 空池任何 rc 都不构成通过。
    ⇒ 交 ⑤/下班：物化 index_rebalance_market.csv(date,sig) 后跑
      `python scripts/backtest/fexam/signal_orthogonality.py gate --candidate <该csv> --pool <复活后池目录> --gate 0.3`；
      并**必须与本席同批卡28 及既有卡22(期指基差) 两两对测**——东Spring/百家号两面均给『股指期货基差提前反映调整冲击预期』⇒ 卡29 与卡22 存在同源机制连接，|corr| 很可能越 0.3。本席不自造 corr 数值。
  dedupe_gate_zh: >-
    去重闸（本班实跑，谓词窄＋逐条读上下文）：
    ① strategy_registry.yaml『index_adjustment|指数调整|调样|成分股调整|rebalance|被动资金』= **0 命中**；
    ② exam_cards 全树 609 枚『index_adjustment』=0、『指数调整』=0、『成分股调整』=0、『MSCI』=0、『reconstitution』=0、『被动资金』=0；
      『inclusion』=3 枚命中经逐条读＝全部是 `band_edge_inclusion`（日内时段端点归属，L9-A01__06/A02__10/A02__11），与本轴不同物（此即本席要的负对照：谓词有效但内容不对）；
      『exclusion』=13 枚、『effective_date』=1 枚亦经读上下文判为『剔除/生效』通用词面，非指数调样构造；
    ③ web_cards 名面 grep(index_adj|recons|调样)=空；正文面『被动资金』=0；
    ④ factor_registry 命中两条经逐条读＝『子板块成分股等权指数构造』(formula 面，属板块因子非调样事件)、『沪深300成分股大单资金流降权 50%』(算法拆单致大单因子失效，属主动大单非被动流) ⇒ 判不占本轴。
  pool_face_note_zh: 池为市场级成员（在册历史 n_members=32）；本卡的市场级折叠是**事件批次序列**（96 批），与池内日频价量成员的时间聚合粒度不同，引用者勿把『日频 vs 批次频』的低相关误读为正交性证明

self_flag:
  - >-
    方向与量级均未预注册＝本卡最大约束：外部给前 5 日调入正/调出负，同面亦给『拥挤度上升、超额已衰减至低个位数甚至为负』，本库快照伪影再降一档可信度；须 ⑥ 另立 card_id 预注册，本席不选边不翻号。
  - >-
    **本班实测证伪了一列在册可用字段**＝index_adjustment.announcement_date 不是公告日而是 snapshot_diff 落库日（99.97% 晚于 effective、0 行早于）
    ⇒ 任何先前把该列当公告日的用法都需重查；本席已按此重写事件锚并在 caliber_pitfall ① 写死禁则，同时把它作为 [BLOCKER] 数据问题呈 ①/②/⑤。
  - >-
    本卡是**退化版构造**：IndexSize 常数缺（etf 面 100%/98.5% 无源）＋调出侧权重全 NULL ⇒ 只能给『相对可消化度序』而非真实冲击规模；引用者勿把本卡 g 值当成『被动买入金额/成交额』的绝对倍数。
  - >-
    样本自由度偏低＝96 批、5 指数、中证全指 5 行、MSCI 0 行、临时调整面本库无法区分（表内无『定期/临时』标记列）⇒ 外部研报的『7 次临时调整』分组读数本库不可复刻。
  - >-
    正交闸缺席本班未编数；且本卡与卡22(期指基差)、卡28(回购执行率) 均有机制连接点（基差提前反映／回购注销减资影响指数加权与成分），三卡若同入池须两两对测，本席不自并、不改他卡、不翻号。
  - >-
    本卡基座许可＝arXiv nonexclusive-distrib/1.0（本班 WebFetch 亲验），属『可引用不可取码』级；其余五面为机构研报/媒体，证据等级低于同行评议，⑤ 实现前宜补一手 A 股学术调样研究。

caliber_pitfall_zh: >-
  (1) **事件锚唯一性**＝只准 effective_date；用 announcement_date 即把起点放到事件后 18 日（均值），用『announce 是否已落库』做 PIT 筛则是前视（落库标记本身是未来信息）。
  ⑤ 若需要『事前可得』的硬证据，须等 ①/② 补真实公告日历列，本卡不自造。
  (2) **FINAL 与快照双计**＝本表 ReplacingMergeTree，本班实跑已带 FINAL；不加 FINAL 时同一 (symbol,batch) 可能多版本共存⇒事件数虚高（在册 CTE 显式 FINAL 铁律同样适用本卡）。
  (3) **T_eff 当日收盘是被污染的价格**＝被动流集中在收盘集合竞价（EastSpring/中财网两面），日线收盘收益同时含信号与自身冲击 ⇒ 读 T_eff 当日『超额』不可当可实现收益，本卡已把 T_eff 排除在信号腿外并单列冲击腿。
  (4) **调出侧 weight=NULL 禁补 0**＝补 0 会把 7,384 枚调出事件静默读成『零冲击』，与『冲击可忽略』同形⇒截面均值被拉向调入侧，制造假的单边正效应（本席在册『零行与确无货同形』族的直接对应物）。
  (5) **ADV20=0/停牌**＝amount 为 0 时 1/ADV 炸开；停牌票事件窗内日历天数不足须整枚剔除（前瞻窗右端须铺满日历＝在册铁律），禁右截断。
  (6) **基准未钉**＝000300 vs 880001 之争在册未裁；本卡超额收益对基准选择敏感（调样面集中在宽基），⑥ 冻结时须显式写基准 id，否则同一事件集两套读数。
  (7) **成分全集误用**＝本表只含变化行（action 非空），禁当『该指数该日全部成分』用；取全集须走 index_constituent／sector_constituent（在册：sector_constituent 是三处采集宇宙唯一读取源，裸扩即造回归）。
