# ── 必备③ 逻辑描述
logic_zh: >-
  动机＝被动指数基金为控跟踪误差必须在**生效日前夕**完成强制调仓，这笔流不以基金经理判断为转移（界面/中财网/东Spring 三面一致），
  于是『被调入/调出』在 T_eff 前形成一段方向确定、规模可估的**与基本面无关**的价格压力；学术基座（arXiv 2506.21775）把它叫 anticipatory buying and front-running，
  并明说『a portion of the price impact tends to persist』＝不是纯流动性幻觉。本库这条轴在 web_cards 里完全空白＝新轴。
  本卡本体（两腿，均只用本班实测可得的列）＝
    事件腿 event_dir ∈ {+1 调入, −1 调出}，事件时间锚 T_eff = index_adjustment.effective_date（**唯一可用锚**，理由见下）；
    信号 s_i,d = event_dir × f(距 T_eff 交易日数) × 可消化度代理 g_i,d，其中 g 用『本次 weight 变动额 ÷ 该股 T−1 前 20 日日均成交额』＝把强制流折算成『占该股正常成交的倍数』，
    市场级折叠＝按批次对所有事件票取 event_dir 加权的 g 均值或调入−调出组的 CAR 差（供正交闸喂闸用）。
  ⚠ 本卡**最硬的一条实测结论**（本班 CH 探针跑出来的，不是抄的）＝本库 index_adjustment 的 announcement_date **不可当公告日用**：
    14,763 行里 dateDiff(day, announcement_date, effective_date) 均值 −18.76 日、min −30、max 0，且 `announcement_date > effective_date` 的行数＝**14,758 / 14,763（99.97%）**、相等 5 行、**没有任何一行是『公告早于生效』**；
    再配 data_source 单一值＝`snapshot_diff` 14,763/14,763 ⇒ 该列是**本库成分快照差异化的落库日**（事后推断），不是交易所/中证指数公司的真实公告日。
    ⇒ 后果：若 ⑤ 按『announcement_date 起算』构造，会把信号起点放在**事件已发生之后 18 天**＝读到的是历史而非预测；若按 effective_date 起算并用 announcement_date 做 PIT 过滤，则是**前视**（用未来才知道的落库标记筛过去）。
    本卡因此只准 `effective_date` 单锚＋显式滞后腿，并声明：**真实公告日/审核截止日本库无源**（中财网那种『审核截止 7-31→生效 9-14』的制度时距本库拿不到）＝本卡最强的合法性缺口，见 face_gap_zh 第 (1) 条。
  方向本席**不预注册**：外部三面给『调入前正/调出前负』，但同文亦给『拥挤度上升，超额已衰减至低个位数甚至为负』；本库 99.97% 行为事后快照更使量级不可信 ⇒ 符号与量级须 ⑥ 带独立先验另立 card_id 预注册，本席遵 ⑨ 席在册令不选边不翻号。
  与相邻对象边界＝(1) 本席已占的 Amihud/VPIN/OFI/队列不平衡＝**主动单**微观结构（流的方向由交易者选择），本卡流由**规则强制**、与个股信息无关，二者机制正相反（这是本卡主张独立成轴的理由，非结论，须闸测）；
  (2) index_weight／index_constituent 是**状态面**（谁在池内、权重多少），本卡是**变化事件面**（谁被加入/移除）＝在册『指数宇宙读取源＝sector_constituent，裸扩即造回归』警告同样适用本卡：禁把本表当成分全集用，只准取 action 非空的事件行；
  (3) smart_money_ratio／institutional_seat_netbuy／龙虎榜族＝主动资金身份面；本卡被动流是**不同主体**，且 institutional_seat_netbuy 卡面已自述其窗仅 2026-08-07 起＝本卡与其样本窗不同物；
  (4) 华安『季度再平衡需求』＝主动组合均值回归，与本卡强制流不同物，本席只在 source_links 第 6 条作方法旁证，**不并入构造**；
  (5) hk_kline／kline_global／msci_adjustment＝外资/跨市场调样腿，本卡本班实测 msci_adjustment **count=0 行**⇒该腿直接无源，不自欺。

# ── 必备④ 伪代码（本席自拟，零外部转录；列名均为本班 CH 只读探针实测名，见 data_binding.measured_face_zh）
pseudocode: |
  # 本体：指数调样事件的『距生效交易日数 × 可消化度』信号，供 ⑤ 物化为 panel 与市场级 csv
  # 输入 c1_market.index_adjustment(symbol 裸6位, index_code, action, effective_date, weight, data_source, exchange)
  # 输入 c1_market.kline_daily_hfq(symbol, trade_date, pct_change, amount)  ← 后复权与成交额（在册：禁取 kline_daily.adj_factor 恒1死列）
  # 标签 c1_market.kline_daily_hfq.pct_change（前向收益）；基准 CSI300 指数面（在册：基准 000300 vs 880001 之争未裁 ⇒ ⑥ 必须钉一个）
  事件集（只用变化，禁当成分全集）：
    ev = SELECT symbol, index_code, action, effective_date, weight FROM index_adjustment FINAL
         WHERE action IN ('inclusion','exclusion')
    dir = +1 if action=='inclusion' else -1
    ⚠ 禁以任何方式使用 announcement_date 作事件起点或 PIT 筛（本班实测 99.97% 晚于 effective_date 且 data_source=snapshot_diff ⇒ 它是落库日）
  日历与窗：
    n_i = 该股在 [T_eff, T_eff+n] 的**交易日**数（前瞻/滚动窗右端须铺满日历＝在册 1015-08 铁律；不足则整枚记缺测禁右截断）
    CAR_i(a,b) = Π_{d=a..b}(1 + r_i,d − r_bmk,d) − 1     # 超额用基准差，基准由 ⑥ 钉
  可消化度代理（本库唯一可算的一腿）：
    w_delta_i = weight_i(inclusion 行)                 # 本班实测：exclusion 行 weight **全为 NULL**（7384/7384）⇒ 调出侧 w_delta 不可得
    ADV20_i,d = mean(amount_i over 前 20 个交易日, 截至 d-1)   # 自算滚动窗，禁取表内现成分位/均值列
    g_i,d = w_delta_i × IndexSize_proxy / ADV20_i,d     # IndexSize_proxy＝被动跟踪规模，本班实测无源 ⇒ 本卡退化版只能取 g ∝ w_delta_i/ADV20（缺比例常数）
  信号：s_i,d = dir × 1{d ≤ T_eff} × g_i,d             # 生效日当天及以后禁入信号腿（外部读数：纳入股 T_eff 当日已由 +0.9% 转 −0.5%）
  反转腿（与信号腿独立存数，禁混成一个读数）：CAR_i(1,5) 与 CAR_i(1,20) 分列，对应原文『about 4% reversing in the following month』
  市场级折叠（喂正交闸用）：sig_date = Σ_i dir_i × g_i,d 或 mean(CAR_incl)−mean(CAR_excl) 按批次聚合 ⇒ (date, sig) 两列 csv
  纪律：同 (symbol, effective_date, index_code) 多枚 action 行须先定优先级（一同一日既入又出的情形若存在⇒记冲突禁相加）；
        一票被多指数同日调整⇒各指数独立算 g 再按 dir 聚合，禁先合并 weight；
        涨跌停/停牌日 amount=0 或不可成交⇒该股当日 g 记缺测（否则 1/0 会炸出无穷大并静默主导截面）
  禁则：禁把本表当成分全集；禁用 snapshot_diff 的 announcement_date；禁调出侧用 NULL 权重补 0；禁 T_eff 后进场读『前 5 日超额』当可实现收益

