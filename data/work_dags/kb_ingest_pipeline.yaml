dag_id: kb_ingest_pipeline
default_layer: local
default_priority: P1
description: Triage-Extract-Analyze-Ingest-Activate
edges:
- condition: success
  from_node: triage
  to_node: extract
- condition: success
  from_node: extract
  to_node: analyze
- condition: success
  from_node: analyze
  to_node: ingest
- condition: success
  from_node: ingest
  to_node: activate
max_parallelism: 3
name: KB Ingest Pipeline
nodes:
- capability_id: ollama-chat
  layer_override: null
  node_id: triage
  params: {}
  priority_override: null
  work_type: task_classification
- capability_id: ollama-chat
  layer_override: null
  node_id: extract
  params: {}
  priority_override: null
  work_type: summary_extraction
- capability_id: ollama-chat
  layer_override: null
  node_id: analyze
  params: {}
  priority_override: null
  work_type: anomaly_triage
- capability_id: embedding-router
  layer_override: null
  node_id: ingest
  params: {}
  priority_override: null
  work_type: vector_embedding
- capability_id: kb-activate
  layer_override: null
  node_id: activate
  params: {}
  priority_override: null
  work_type: activate
retry_on_failure: 2
timeout_minutes: 60
