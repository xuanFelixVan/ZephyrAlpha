dag_id: daily_health_check
default_layer: local
default_priority: P0
description: Probe-Reconcile-Report
edges:
- condition: success
  from_node: probe
  to_node: reconcile
- condition: success
  from_node: reconcile
  to_node: report
max_parallelism: 3
name: Daily Health Check
nodes:
- capability_id: health-monitor
  layer_override: null
  node_id: probe
  params: {}
  priority_override: null
  work_type: probe_all
- capability_id: health-monitor
  layer_override: null
  node_id: reconcile
  params: {}
  priority_override: null
  work_type: reconcile
- capability_id: status-dashboard
  layer_override: null
  node_id: report
  params: {}
  priority_override: null
  work_type: report
retry_on_failure: 2
timeout_minutes: 60
