# ---- §15 设计决策记录 ------------------------------------------------------
design_decisions:
  - date: "2026-05-17"
    decision: |
      统一入口方案：新增 ProcessLifecycleGateway 作为所有进程创建的唯一入口。
      Gateway 内部组合 MCPProcessPool + DaemonRegistry。
      新增 Gate 门禁扫描 AST 防止裸 Popen/Process。
    rationale: |
      根因: 进程创建路径分散，绕过生命周期框架 → 进程泄漏。
      量化系统标准做法: 集中式 Process Supervisor (Erlang OTP)。
      Vibe coding 标准做法: MCP Server 生命周期 = 会话生命周期。
      方案优势: 一次设计，永久覆盖。新入口不走 Gateway = CI 阻断。
    status: "active"

  - date: "2026-05-17"
    decision: |
      start_all.py 废弃，合并到 launcher.py。
    rationale: |
      多启动脚本 = 多绕过框架的入口。
      SSoT 原则: 启动逻辑的真源在 launcher.py 的 DAG 编排中。
    status: "active"

  - date: "2026-05-17"
    decision: |
      ProcessPool 增加 idle_timeout_s 参数，默认 600s (10分钟)。
      idle = 自上次 get_or_create 调用后无复用。
    rationale: |
      10min 是 MCP Server 的合理 Idle TTL:
      - AI 对话轮次 < 5min
      - 两轮间隔 < 5min
      - 10min 覆盖一次完整对话 + 缓冲
      - 超过 = 当前 session 不再需要此 Server
    status: "active"

  - date: "2026-05-17"
    decision: |
      Phase 1 (本次) 只处理项目代码内的进程泄漏 (ollama + MCP Server)。
      Phase 2 (后续) 处理 IDE MCP 配置 (.trae/mcp.json) 的按需生成。
    rationale: |
      IDE MCP 生命周期由 IDE 控制，项目无法直接管理。
      需要 generate_ide_config.py 改为按当前 session 需求生成而非全量生成。
    status: "active"

