# 规则文件关键事实清单 — SSoT 基准
# 用途：check_rule_coverage.py 读取此文件，验证 .trae/rules/*.md 和 AGENTS.md 是否与项目实际状态对齐
# 维护原则：事实变更时先改此文件 → 再改规则文件 → 最后跑 check_rule_coverage.py 验证
# 判定：must_appear_in 中的文件必须包含 fact 字符串；must_not_appear_as 中的文件不得包含 pattern

version: "1.0.0"
last_updated: "2026-06-19"
description: "规则文件漂移检测基准——模拟 AI 冷启动时必须看到的一致事实"

# ============================================================
# 数字类事实
# ============================================================
numeric_facts:
  - id: python_version
    fact: ">=3.11"
    description: "Python 版本要求（pyproject.toml SSoT）"
    ssot_source: "pyproject.toml requires-python"
    must_appear_in:
      - ".trae/rules/project_rules.md"
      - "AGENTS.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "3.12+"
        reason: "project_rules.md 错误声明 3.12+，实际 SSoT 是 >=3.11"

  - id: mcp_server_count
    fact: "10 个"
    description: "MCP server 数量（config/mcp.json servers section 实际计数：task_manager/knowledge_base/gate_engine/session_handoff/intent_router/blueprint_search/sandbox/governance/vector_memory/red_blue_validator）"
    ssot_source: "config/mcp.json servers section"
    must_appear_in:
      - "AGENTS.md"
    must_not_appear_as:
      - file: "AGENTS.md"
        pattern: "9 个"
        reason: "AGENTS.md 错误声明 9 个 MCP，实际 10 个"
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "7 MCP"
        reason: "onboarding_detail.md RULE-EIGHT 后果量化段过时数字，实际 10 个"

  - id: module_count
    fact: "4,639"
    description: "模块数量（depgraph total_modules，extract_depgraph.py --summary 输出）"
    ssot_source: "depgraph (PostgreSQL) via extract_depgraph.py --summary"
    must_appear_in:
      - ".trae/rules/project_rules.md"
      - ".trae/rules/onboarding_detail.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "1,623 模块"
        reason: "project_rules.md 过时数字，实际 4,639 模块"
      - file: ".trae/rules/project_rules.md"
        pattern: "| 模块 | 1,623"
        reason: "project_rules.md 资产表过时数字，实际 4,639"
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "1,623 模块"
        reason: "onboarding_detail.md 过时数字，实际 4,639 模块"

  - id: domain_count
    fact: "39 域"
    description: "功能域数量（depgraph 实际计数，extract_depgraph.py --summary 输出 39 个域）"
    ssot_source: "depgraph (PostgreSQL) via extract_depgraph.py --summary"
    must_appear_in:
      - ".trae/rules/project_rules.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "35 域"
        reason: "project_rules.md 域归属铁律过时数字，实际 39 域"
      - file: ".trae/rules/project_rules.md"
        pattern: "30域"
        reason: "project_rules.md RULE-SIXTEEN 过时数字，实际 39 域"
      - file: ".trae/rules/project_rules.md"
        pattern: "30 个域文件"
        reason: "project_rules.md RULE-SIXTEEN 过时数字，实际 39 域"

  - id: script_count
    fact: "483"
    description: "脚本数量（script_manifest.yaml total_scripts: 483）"
    ssot_source: "scripts/script_manifest.yaml total_scripts"
    must_appear_in:
      - ".trae/rules/project_rules.md"
      - ".trae/rules/onboarding_detail.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "388 脚本"
        reason: "project_rules.md 过时数字，实际 483 脚本"
      - file: ".trae/rules/project_rules.md"
        pattern: "| 脚本 | 388"
        reason: "project_rules.md 资产表过时数字，实际 483"
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "388 脚本"
        reason: "onboarding_detail.md 过时数字，实际 483 脚本"
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "388 个脚本"
        reason: "onboarding_detail.md 过时数字，实际 483 脚本"

  - id: gate_count
    fact: "43"
    description: "门禁数量（_registry.yaml gate_id: 计数 43）"
    ssot_source: "src/zephyr/gov_enforcement/rule_enforcement/_registry.yaml gate_id count"
    must_appear_in:
      - ".trae/rules/project_rules.md"
      - ".trae/rules/onboarding_detail.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "| 门禁 | 20"
        reason: "project_rules.md 资产表过时数字，实际 43"
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "20 门禁"
        reason: "onboarding_detail.md 过时数字，实际 43 门禁"

  - id: blueprint_count
    fact: "60"
    description: "蓝图数量（blueprint_registry.yaml total_blueprints: 60）"
    ssot_source: "docs/03_modules/blueprint_registry.yaml total_blueprints"
    must_appear_in:
      - ".trae/rules/project_rules.md"
    must_not_appear_as:
      - file: ".trae/rules/project_rules.md"
        pattern: "| 蓝图 | 41"
        reason: "project_rules.md 资产表过时数字，实际 60"

  - id: registry_count
    fact: "48 个注册表"
    description: "注册表数量（registry_of_registries.yaml registry_id: REG- 计数 48）"
    ssot_source: "docs/registry_of_registries.yaml registry_id count"
    must_appear_in:
      - ".trae/rules/onboarding_detail.md"
    must_not_appear_as:
      - file: ".trae/rules/onboarding_detail.md"
        pattern: "29 个注册表"
        reason: "onboarding_detail.md 过时数字，实际 48 个注册表"

