pit_policy:
  why_pit_needed: 产品→图谱锚点时变（公司退市/节点合并退役/成员边到期），无生效时点即不可复考；而词汇同一性链接本身时间不变，只需观测日期。
  dual_axis: 双时间轴分离（施工侧自采设计，与 WO-005/WO-006 同构；PIT 基准归属待 Owner 裁）：valid_from=源数据业务期（source_as_of 轴，取主营构成/ig_fact 的 as_of），registered_as_of=载体入册期（库内观测轴，取源行
    created_at）。两读法全量并报（metrics.primary_metric.pit_reading_dual），避免只报一个好看的基准。
  fields:
    valid_from: = 支撑该 surface form 的最早观测 as_of（ig_product_revenue.as_of / ig_fact.as_of）：断言自首次观测起成立；空值=该词项只来自图谱词表（ig_node
      名/别名无 as_of 列），语义为'时间不变的词汇身份'（其锚点有效期仍由 valid_to 表达）
    valid_to: 仅在被否证时闭合：锚点节点退役（ig_node.valid_to→pit_note=anchor_node_retired）或全部支撑成员边到期（ig_node_company.valid_to 取最大到期日→pit_note=membership_expired）
    pit_note: 闭合原因，供审计回溯
    dropped_by_design: 不存 canonical_label / norm_key（均可由 surface_form+归一规则重算，双写只会漂移并撑爆册体量）；不存 per-anchor 归属历史（见 attribution_change_rule）
  attribution_change_rule: 同名产品在不同时期归属不同公司 → **不改写本册链接行**：公司↔节点归属的时变真源是 ig_node_company(valid_from, valid_to, pit_strength)，本册经
    node_id/symbol 外派 join 即得历史，双写必漂移（RULE-SSOT）。册内规则：同一 canonical 簇允许多锚点候选并存（anchor_candidates>1 即多解留痕），主锚点按 (-路由置信, route
    rank, node_id 升) 择一，落败候选不丢（按路由可重算）。
  as_of_query_contract: as-of 取数谓词：valid_from <= :D and (valid_to is null or valid_to > :D)；复考默认 :D=闭卷切点，快照口径另出。
  closed_book_cutoff: '2025-09-09'
  forbidden: 生成器内禁 datetime.now()；时间戳一律 zephyr.shared.utils.time_utils.now_iso()（RULE-SCHEMA-TZ），且不入 content_hash 域。
upgrade_contract:
  purpose: Owner 裁定⑤明写'留同义词册升级口'：将来引入人工/LLM 别名扩充或 WO-007 部门映射接线。
  injection_port:
    flag: --extra-anchor-register <path>
    formats:
    - .csv（表头行）
    - .yaml（anchors/rows/links 任一键下的映射列表）
    required_columns:
    - surface_form|product|name
    - node_id|target_node（或 symbol）
    optional_columns:
    - as_of
    - valid_to
    - confidence
    - source
    - evidence
    route: R4_external（rank=5, granularity=external, 默认 confidence=0.8）
    wo007_wiring: 总包合批时把部门映射册转成 surface_form=部门/产品名、node_id=图谱节点、as_of=映射生效期 的行注入即可；本器不读 wo007/metaq_io_edge 目录（并发隔离）。
  backward_compatibility: v1 冻结承诺：①CSV 只增列且新列一律追加尾部、YAML 头只增键；②match_basis 现有四态语义不变，新证据等级须新增枚举（manual/llm）且**默认不计入** primary_metric
    分子；③canonical_product_id=sha1(norm_key) 内容派生前缀稳定，但归一规则升级会拆簇，故下游引用必须带 schema 版本号；④判据脚本只读 coverage/primary_metric 两键，新增口径不破坏既有消费。
  back_to_30pct_preconditions:
  - ①外部别名册净新增锚定端点 ≥11732 个（=未命中池的 25.6%）
  - ②分层抽样 ≥400 条人工核验 precision ≥95%，并按 match_basis 给出各档假阳率
  - ③is-a 粒度是否承认须 Owner 单独裁定（量化见 ceiling_analysis.isa_grain_uplift_if_admitted）
  - ④同快照复跑两遍 content_hash 相等（确定性不破）+ 判据与册版本同批落地
determinism:
  policy: 行序=canonical_product_id 升序、簇内 surface 升序；主锚点/标签 tie-break 全显式；content_hash=sha256(json(metrics, sort_keys))，排除 generated_at（同快照必同
    hash）。
