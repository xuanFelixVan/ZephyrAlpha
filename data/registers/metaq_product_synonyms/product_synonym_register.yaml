  identity_definition: 同一性=归一化后同一 norm_key 簇；is-a（ig_fact subtype_of 上下位）与名称包含关系不构成同一性，故不传播锚点（ceiling_analysis.isa_ruling）
  match_basis_tiers:
    exact: surface form 逐字命中机械锚点源（R1/R2a/R2b/R3/R4），置信=路由置信原值
    alias: 经 k1 基础归一（NFKC/casefold/去标点）或 k2 括注剥离与锚定成员同键，置信×0.95
    rule: 经 k3 数字锚定单位/规格剥离同键，置信×0.85
    unmatched: 簇内无任何机械锚点，置信=0（match_basis=unmatched）
