pq_0065_criterion_restatement:
  original_criterion: CKG 产品-产品边与研报线抽取边一致率 ≥70%（低于则 CKG 降级为结构先验）
  restated_criterion: 先验可用性三判据 a/b/c（机械跑法见下）
  a_endpoint_align_rate:
    value: 1.0
    threshold: 0.95
    meaning: CKG 行业对双端可归一到在用标准行业码（申万一级）的比例
    threshold_provenance: 借 PQ-0078 题面阈值（同族量：映射载体补齐后的可对齐率）
  b_independent_side_evidence_rate:
    value: 0.7971
    threshold: 0.6
    meaning: 归一后的 CKG 行业对中能在异源官方 IO 系数矩阵（件 2 旁挂册）找到同向行业对的比例
    threshold_provenance: 借 PQ-0067 题面阈值原值（b 即该量的先验化版本）
  c_consumer_compliance_rate:
    value: 0.7619
    threshold: 1.0
    meaning: 扫描出的 CKG 消费点中已按先验档处理（或本不需要先验化）的比例
    formula: (points_total − 需先验化且未合规) / points_total，未裁定点自动计不合规
  verdict: CONDITIONAL（a/b 已达标=1.0/0.7971，c=0.7619 未达 1.0——降级补丁未落地，先验暂不可入生产合成）
  mechanical_check: python scripts/governance/meta_question/wo007/wo007_reexam.py && python scripts/governance/meta_question/wo007/build_ckg_prior_tier.py
    --self-check
  why_the_original_criterion_no_longer_applies: 一致率是「把 CKG 当硬事实源」时的取证判据：它要求两侧**产品名精确同指**。实测两侧词表不同本体（CKG 产品名 vs 研报抽取环节名；ig_node
    aliases 仅 46 行、ig_entity_code_map 仅 88 行），分母侧当期图谱跨行业对曾为空集（PQ-0067：ig_edge 1,726 条中跨链仅 2 条），且不剔除自并入边会得 71.6% 假达标——该比值对「CKG
    说法是否为真」几乎不含信息。降级为结构先验后，题面自洽的读法是把同一批数据改问三件有信息的事：能不能对齐到在用行业码（a）、有没有异源侧证（b）、下游是否只当先验用（c）。原判据的数字（1.23%）与结论（降级）均不变，只把「判 fail
    的度量」换成「判可用的度量」。
