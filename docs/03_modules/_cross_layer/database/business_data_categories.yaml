  name: "采集性能记录"
  engine: clickhouse
  database: c0_meta
  table: fetch_perf
  schema_file: null
  data_type: 元数据
  lifecycle: hot_90d
  sla_level: L3
  enabled: true
  hard_constraint: null
  calc_mode: none
  frequency: 按采集
  data_source: [internal]
  blueprint: null

