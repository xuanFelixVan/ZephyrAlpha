# --- 指数数据 ---
# 注意："index"一词在此有多义：
#   kline_index = 指数日K线（开高低收），1990-2026完整
#   tick_data(market_type='index') = 指数3秒Tick（每3秒价位成交额），202201-至今
#   index_list = 指数列表（732个指数代码），base_date=1970-01-01表示基准日期缺失
#   index_constituent = 指数成分股
#   index_weight = 指数权重
#   index_quote = 指数行情快照（3秒频率）
#   market_index_meta = 市场宏观指数元数据（总市值/流通市值/平均股价等，50个）
#   us_index = 美股指数

- category_id: market_index_kline
  name: "指数日K线（开高低收成交量，区别于tick_data的指数3秒Tick）"
  engine: clickhouse
  database: c1_market
  table: kline_index
  schema_file: null
  data_type: 成品
  lifecycle: permanent
  sla_level: L1
  enabled: true
  hard_constraint: null
  calc_mode: preload
  frequency: 日频
  data_source: [miniqmt, akshare]
  blueprint: null

# --- 自算衍生指数 ---
# kline_index_calc 是本地自算衍生指数专用表（EQW_* 系列），与官方指数真源 kline_index
# 分表隔离（真源唯一/责任唯一：外部官方指数 vs 内部衍生计算，口径可演进、防互相污染）
- category_id: market_kline_index_calc
  name: "自算衍生指数日K（首条 EQW_ALLA 全A等权：复权收益等权平均链乘，基期 2019-01-03=1000）"
  engine: clickhouse
  database: c1_market
  table: kline_index_calc
  schema_file: schemas/categories/kline/market_kline_index_calc.py
