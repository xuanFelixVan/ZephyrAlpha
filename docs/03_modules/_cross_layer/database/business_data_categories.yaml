# business_data_categories.yaml
# 业务数据品类注册表（唯一真源）
# 母蓝图: docs/03_modules/_cross_layer/database/business_data_architecture.md §6.2 第1层
# 每个品类一条记录: category_id / name / engine / table / schema_file / data_type / lifecycle / sla_level / enabled / calc_mode
# 新增品类 = 加一条YAML记录（不改代码）
#
# 当前覆盖范围（2026-08-15 实测校正，AI-NORTH-001）:
#   C0 meta: 1条
#   C1 market_clickhouse: 90条（全量表）
#   C3 fundamental: 23条（全量表）
#   合计 114 条 category_id 全唯一
#
# 注意：
#   - "index"一词在数据库中有多义，见各表 name 字段的精确描述
#   - 功能重叠表(hk_kline/kline_hk_daily, kline_futures/futures_kline_qmt)已在注释中标注关系
#   - 1970-01-01 在元数据表中表示"未发生/未退市"的语义空值，非脏数据

