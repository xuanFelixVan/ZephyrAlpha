# business_data_categories.yaml
# 业务数据品类注册表（唯一真源）
# 母蓝图: docs/03_modules/_cross_layer/database/business_data_architecture.md §6.2 第1层
# 每个品类一条记录: category_id / name / engine / table / schema_file / data_type / lifecycle / sla_level / enabled / calc_mode
# 新增品类 = 加一条YAML记录（不改代码）
#
# 当前覆盖范围:
#   C1 market_clickhouse: 8条（本文件）
#   C2 indicator_clickhouse: 待建
#   C3 news_clickhouse: 待建
#   C4 backtest_clickhouse: 待建

# ========== C1 market_clickhouse（行情仓库，8张表）==========

- category_id: market_tick
  name: "A股3秒Tick行情"
  engine: clickhouse
  database: c1_market
  table: tick_data
  schema_file: schemas/categories/market_tick.py
  data_type: 原料
  lifecycle: hot_90d
  sla_level: L1
  enabled: true
  hard_constraint: null
  calc_mode: replay
  frequency: 3秒
  data_source: [miniqmt]
  blueprint: "docs/03_modules/_cross_layer/database/sub_blueprints/c1_market_clickhouse.md §4.1"

- category_id: market_daily_kline
