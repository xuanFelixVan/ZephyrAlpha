# --- 指数数据 ---
# 注意："index"一词在此有多义：
#   kline_index = 指数日K线（开高低收），1990-2026完整
#   tick_data(market_type='index') = 指数分笔成交（每3秒价位成交额），201610+202201-202606
#   index_list = 指数列表（732个指数代码），base_date=1970-01-01表示基准日期缺失
#   index_constituent = 指数成分股
#   index_weight = 指数权重
#   index_quote = 指数行情快照（3秒频率）
#   market_index_meta = 市场宏观指数元数据（总市值/流通市值/平均股价等，50个）
#   us_index = 美股指数

- category_id: market_index_kline
  name: "指数日K线（开高低收成交量，区别于tick_data的指数分笔成交）"
