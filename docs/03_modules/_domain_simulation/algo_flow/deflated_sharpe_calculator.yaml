    #   intro: 收益率分布的不对称程度（Fisher-Pearson有偏估计）
    #   formula: γ=m3/m2^1.5，mk=(1/n)Σ(xi-mean)^k；n<3返回0
    #   code: deflated_sharpe_calculator.py L131
