    #   name_zh: 多重测试期望最大值
    #   name_en: expected_max
    #   intro: 试N次取最好时Sharpe的期望虚高幅度（Euler-Maclaurin近似）
    #   formula: E[max(Z_N)]≈√(2lnN)-(lnπ+lnlnN)/(2√(2lnN))；N≤1返回0
    #   code: deflated_sharpe_calculator.py L164
    #   registry: factor_registry: 无FCT条目
    #   is_break: true
