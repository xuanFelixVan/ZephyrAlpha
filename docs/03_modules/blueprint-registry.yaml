# ============================================================================
# ZephyrAlpha 蓝图登记表 — 唯一真源（Blueprint Registry SSoT）
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-02 | owner: ZephyrAlpha-Owner
#
# 对标: ITIL SACM CMDB（每个 CI 一条记录）
#       + ISO 42001 §8 AI 系统影响评估（蓝图变更前必须评估影响）
#
# 用途: 登记 03_modules/ 下所有蓝图的完整状态——
#       施工进度 / 完整度 / 版本代际 / 功能域 / 层级 / 用途 / 依赖。
#       一张表看清"哪些蓝图写完了、哪些还没动工、哪些写到一半"。
#
# AI 使用方式:
#   1. 先读 _schema → 了解合法字段和枚举值
#   2. 再查 blueprints → 按 layer / domain / construction_progress 过滤
#   3. 定位到具体 blueprint → 读对应目录下的 blueprint.md
#
# 与 module-registry.yaml 的关系:
#   - module-registry.yaml：模块生命周期（蓝图→施工→交付三阶段，一条记录跟到底）
#   - 本文件 blueprint-registry.yaml：蓝图维度的深度评估（施工进度% / 完整度% / 代际）
#   两者互补，不重复。冲突时以 module-registry.yaml 的 status 为准。
# ============================================================================

registry:
  version: "2.1.0"
  created: "2026-05-02"
  last_updated: "2026-05-04"
  total_blueprints: 19
  scope: "03_modules/"
  note: "登记所有 doc_type=blueprint 的蓝图——含 approved + draft。retired 蓝图保留为历史追溯。"

metadata:
  generated_at: "2026-05-03"
  generated_by: "manual + agent"
  canonical_source: "module-registry.yaml + 03_modules/**/blueprint.md"

# ============================================================================
# 字段 Schema（零歧义，AI 可直接使用）
# ============================================================================
_schema:
  description: "蓝图登记表的字段定义和受控词表"

  # ---- 层级（当前仅 L01 有内容）----
  layers:
    - id: "L01"
      name: "infrastructure"
      dir: "l01_infrastructure"
      description: "基础设施层——AI 开发骨架、运行时代码、任务系统、质量保障"

  # ---- 功能域 ----
  functional_domains:
    - id: "infra"
      name: "基础设施"
      description: "跨层横切能力——事件总线、配置中心、模块生命周期、错误处理"
    - id: "observability"
      name: "可观测性"
      description: "容量监控、SLI/SLO、AI 审计守卫、ContractBus 校验"

  # ---- 蓝图状态 ----
  blueprint_status_values:
    - drafting
    - review
    - approved
    - revision
    - retired

  # ---- 施工进度 ----
  construction_progress_values:
    - not_started        # 未动工（代码一行没写）
    - merged             # 施工内容已合并进蓝图（原 construction-plan.md 被废除，内容迁入）
    - partial_<N>        # 部分完工，<N>=已完成的 Phase 百分比（如 partial_30）
    - completed          # 全部完工
    - phase_0_completed  # Phase 0 完成——设计/架构/概念验证落地，代码骨架建立
    - phase_1_complete   # Phase 1 完成——核心功能实现、生产可用

  # ---- 完整度评估维度 ----
  completeness_dimensions:
    - id: "sections"
      weight: 0.3
      description: "章节覆盖度——核心章节是否齐全（核心概念/边界/架构决策/架构视图/风险/关联）"
    - id: "detail"
      weight: 0.3
      description: "细节深度——关键节是否有代码骨架/Schema 定义/具体数字"
    - id: "code_artifact"
      weight: 0.25
      description: "代码产出——是否有对应的代码片段/Schema/脚本骨架"
    - id: "delivery"
      weight: 0.15
      description: "交付记录——delivery/ 目录下是否有版本记录"

  # ---- 优先级 ----
  priority_values: ["P0", "P1", "P2", "P3"]

  # ---- 代际 ----
  generation_rule: |
    第 1 代 = 初版（从原始设计文档升格）
    第 2 代 = 大改（合并施工内容、架构重整、Wave 终审后重写）
    第 3 代+ = 后续大版本重写

# ============================================================================
# 蓝图登记
# ============================================================================
# 字段说明:
#   module_id               唯一标识符，格式 MOD-INF-NNN
#   name                    模块名（全小写 kebab-case，与目录名一致）
#   title                   中文标题
#   layer                   所属层级
#   functional_domain       所属功能域
#   blueprint_status        蓝图审批状态
#   blueprint_level         蓝图层级（PS-STD-005：system / domain / module）
#   version                 蓝图版本号
#   generation              第几代重写（1=初版，2=大改合并）
#   last_updated            最近更新日期
#   file_path               相对路径（从 docs/ 根）
#   file_lines              文件行数
#   purpose                 一句话：这个蓝图是干嘛的
#   construction_progress   施工进度
#   construction_detail     施工进度补充说明
#   completeness_pct        完整度百分比（0-100）
#   completeness_breakdown  完整度分解（分项评分）
#   completeness_note       完整度补充说明
#   dependencies[]           依赖的其他模块
#   priority                优先级
#   tags[]                   自由标签
# ============================================================================

