    # [ALGO_FLOW]
    # I1: ScalingOutPositionView(quantity/entry_price/risk_reward) + ScalingOutState(first_tranche_sold/stop_at_breakeven) + atr_value + highest_close_fn(回看N日最高收盘价回调)
