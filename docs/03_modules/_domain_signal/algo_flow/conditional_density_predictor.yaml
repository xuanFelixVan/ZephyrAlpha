    # A2: 矩估计——均值/标准差/偏度/超额峰度（Fisher）+ 经验分位数网格 P1/P5/P25/P50/P75/P95/P99
    # A3: 尾部派生——VaR95（5% 分位）/CVaR95（≤VaR 的均值）/前瞻VaR%/负偏度/超额峰度摘要
    # O1: DensityForecast（矩+分位数+尾部+样本数+degraded）；crps_empirical 评估件
    # [/ALGO_FLOW]
