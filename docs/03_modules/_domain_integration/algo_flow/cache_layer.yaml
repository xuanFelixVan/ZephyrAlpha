    # I1 --> A1
    # I3 --> A1
    # I2 --> A2
    # A1 --> A2
    # I2 --> A3
    # A1 --> A3
    # A2 --> A4
    # A3 --> A4
    # I3 --> A5
    # I3 --> A6
