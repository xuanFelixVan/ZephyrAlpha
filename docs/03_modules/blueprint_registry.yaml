  - id: observability
    name: 可观测性
    description: 容量监控、SLI/SLO、AI 审计守卫、ContractBus 校验
  blueprint_status_values:
  - Draft
  - Active
  - Superseded
  - Deprecated
  - Retired
  blueprint_status_description: '对齐 SSOT Authority Map 文档生命周期枚举（v2.4.0 修正）。 Draft=正在编写/审查中；Active=已批准并生效；Superseded=被新版本替代；
    Deprecated=已废弃但保留参考；Retired=完全退役。当前前matter使用 Active(4份)/Draft(34份)。

    '
  construction_progress_values:
  - not_started
  - design_only
  - scaffold
  - partially_implemented
  - completed
  construction_progress_description: '受控词表 (v4.0.0). not_started=蓝图存在但未开工; design_only=仅有设计文档无代码;
    scaffold=脚手架已创建(scaffold.py); partially_implemented=部分实现; completed=全部施工完成. 废弃值:
    phase_1_partial/phase_1_complete/phase_2_complete/blocked_by_infrastructure/phase_27_planned,
    phase_2_blueprint_audit_357_blind_spots_closed 等非标准写法 统一为上述受控词表中最近似项. 所有蓝图必须在
    2026-05-15 前完成归一化 (Phase 3 截止).

    '
  completeness_dimensions:
  - id: sections
    weight: 0.3
    description: 章节覆盖度——核心章节是否齐全（核心概念/边界/架构决策/架构视图/风险/关联）
  - id: detail
    weight: 0.3
    description: 细节深度——关键节是否有代码骨架/Schema 定义/具体数字
  - id: code_artifact
    weight: 0.25
    description: 代码产出——是否有对应的代码片段/Schema/脚本骨架
  - id: delivery
    weight: 0.15
    description: 交付记录——delivery/ 目录下是否有版本记录
  priority_values:
  - P0
  - P1
  - P2
  - P3
