    # [ALGO_FLOW]
    # I1: SourceSentiment 序列（source/polarity∈[-1,1]/publish_date/symbol）
    # F1: vote_cross_source（按源求均 polarity→源方向；≥2 源同向=strong tanh 软投票；单源=weak ×0.5；冲突/全中性=0）
