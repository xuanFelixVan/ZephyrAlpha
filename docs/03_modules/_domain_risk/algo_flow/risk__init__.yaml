# ALGO_FLOW 外部真源——__init__（_domain_risk 域，真源 src/zephyr/risk/__init__.py）
# 2026-09-15 P2-1 契约头减负批量出仓：docstring 内联块逐字节副本，extractor 经
# external 锚加载走同一 parse_algo_flow 管线；算法公共面变化时同步更新本块。
doc_type: architecture_view
ttl: permanent
module: src.zephyr.risk.__init__
source_of_truth: src/zephyr/risk/__init__.py
algo_flow: |
    # [ALGO_FLOW]
    # 层: 输入
    # - id: I1
    #   name: 子模块属性访问请求 字符串
    #   fields: 属性名 name（如 "cross_asset"）
    #   code: __getattr__(name) L69
    # 层: 算法
    # - id: A1
    #   name_zh: ① 子模块导出清单
    #   name_en: __all__
    #   intro: 声明本包对外暴露的 6 个风险子模块名
    #   desc: __all__ = [cross_asset, risk_limits, risk_manager, risk_manager_base, risk_validator, stop_loss]，仅做符号声明不触发导入
    #   inputs: I1
    #   outputs: 可导入子模块名单
    # - id: A2
    #   name_zh: ② 懒加载导入
    #   name_en: __getattr__
    #   intro: 只有访问 cross_asset 时才真正 import，其他属性名直接报错
    #   desc: name=="cross_asset" → importlib.import_module(".cross_asset")；否则 raise AttributeError
    #   inputs: I1
    #   outputs: 子模块对象
    # 层: 输出
    # - id: O1
    #   name_zh: zephyr.risk 包命名空间
    #   name_en: package namespace
    #   intro: 风控域包入口，提供止损/风险限额/风险校验等子模块访问
    #   downstream: 无下游/内部使用（[CONSUMERS] 头为空，子模块被 D_PORTFOLIO_CORE 等业务域直接 import）
    # [/ALGO_FLOW]
    #
    # 边:
    # I1 --> A1
    # I1 --> A2
    # A1 --> O1
    # A2 --> O1
