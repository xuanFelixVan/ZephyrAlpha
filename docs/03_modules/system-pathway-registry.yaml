# ============================================================================
# ZephyrAlpha 全系统路径地图 — 唯一真源（System Pathway Registry SSoT）
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-04 | owner: ZephyrAlpha-Owner
#
# 对标: Google Monorepo 自动索引（Piper/CitC 文件级可见性）
#       + ITIL SACM CMDB（每个 CI 一条记录，含路径/依赖/状态）
#
# 用途: 全系统所有模块的文件路径汇总表。
#       一张表看清每个 module 的源码/蓝图/测试/配置文件的磁盘位置。
#
# 生成策略:
#   - 手工种子（本文件的第一版）
#   - 后续由 scripts/generate_pathway_registry.py 扫描各模块蓝图的 §路径索引 章节自动生成
#   - CI pipeline 在每次 push 时校验本文件与自动生成结果的一致性
#
# 容量: 每模块一行，1500 模块 = 1500 行 ≈ 50KB。脚本 1 秒可生成。
#
# AI 使用方式:
#   1. 按 layer 过滤 → 找到目标层级的所有模块路径
#   2. 按 module_id 定位 → 找到指定模块的全部文件路径
#   3. 交叉引用 → 结合 module-registry.yaml 和 blueprint-registry.yaml 获取完整模块信息
# ============================================================================

