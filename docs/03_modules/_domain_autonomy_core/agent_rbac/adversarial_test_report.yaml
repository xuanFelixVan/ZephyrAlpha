      resolution: "升级为 import+PermissionGuard.check()+identity 完整性验证"
      verified: true
      fix_commit: "src/zephyr/governance/phase_check_registry.py (2026-05-08)"

  five_whys:
    why_rbac_not_active:
      q1: "为什么 agent-rbac 未激活？→ rbac_roles.yaml 缺失触发冷启动锁。"
      q2: "为什么 rbac_roles.yaml 缺失？→ 没有人执行 derive_rbac_roles.py 生成种子。"
      q3: "为什么没有人执行？→ 没有自动化 CI/gate 检查 rbac_roles.yaml 是否存在。"
      q4: "为什么没有自动检查？→ check_agent_rbac 只检查目录存在性，未检查配置完整性。"
      q5: "为什么目录检查如此薄弱？→ 门禁开发时没有考虑到配置完整性验证。"
      root_cause: "测试和门禁的颗粒度不够——只验证代码存在，不验证功能可用。"
      permanent_fix: "check_agent_rbac 升级为全链路 smoke test + immutable_core 自检机制已内置于 PermissionGuard.check()"

