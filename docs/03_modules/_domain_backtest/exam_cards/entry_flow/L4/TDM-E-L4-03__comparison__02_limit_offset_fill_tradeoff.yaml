schema_version: '1.0'
card_id: TDM-E-L4-03/comparison/02_limit_offset_fill_tradeoff
node_id: TDM-E-L4-03
family: comparison
title_zh: 限价锚偏移三档（卖一+1tick / 突破价上方0.5% / 市价）成交概率-成本权衡对照卡
origin: tdm_algo_note_l4_03
hypothesis: 限价挂单相对对手一档的偏移量决定"成交概率×成交均价"的权衡曲线：+1 tick 档成交率高、追价成本低；0.5% 突破挂单档在突破日成交率低但错过涨幅的机会成本高；市价档成交率≈1 但冲击+价差成本最高——三档在 5 档实测盘口上可判，且权衡曲线应随流动性分层单调移动（cost_model_calibration.liquidity_tier 口径）。
window:
  in_sample:
  - '2026-07-24'
  - '2026-09-15'
  oos: &id001
  - '2026-09-16'
  - '2026-09-30'
  regimes:
    seg1: 2026-07-24..2026-08-20（前段，牛熊标签=开考前以 000300 该段累计收益符号机械赋值，本卡不预断言方向）
    seg2: 2026-08-21..2026-09-15（后段，同上规则）
  frozen_note: 本卡窗口由 tick_depth_5 实测覆盖窗（2026-07-24..2026-09-30）唯一决定，非挑数——数据只活到这里；IS/OOS 切点与牛熊分段边界在开考前冻结，事后挪=作废（G4-5）。诚实标注：窗长 35+11 交易日，统计功效弱，判据以"排序稳定"而非"绝对值显著"为主
arms:
  A_ask1_plus_1tick: 买入限价 = 卖一价 + 1 个最小变动价位（0.01 元，主板 / 0.01 双创同）
  B_breakout_plus_50bp: 限价 = 突破参考价 × 1.005（algo_note 口径"突破价上方 0.5% 挂单等着成交"）
  C_market: 市价（按 tick_depth_5 一档可成交量逐档吃单，不足即部分成交）
buckets:
  type: arm_x_liquidity_tier
  'on': 三臂 × cost_model_calibration.liquidity_tier（按日成交额分层，n_tiers() 由分层边界唯一决定，禁手写魔数）
  min_obs_per_bucket: 60
pillars:
  fill_rate_ordering: 成交率排序须为 C >= A >= B（市价最全、+1tick 次之、突破挂单最挑），排序翻转=撮合口径实现有 bug
  cost_ordering: 平均带符号滑点（bps，正=不利，口径=execution_report._signed_slippage_bps）排序须为 B >= A >= C 或 C >= B >= A 之一并在分数册说明权衡曲线形态，禁事后选形态
  missed_trade_opportunity: 未成交腿按"若未成交则该票当日收盘价-决策价"记机会成本，成交概率×期望收益两腿必须同时出数（本卡主判据=净期望，非单看成交率）
  liquidity_monotonicity: 沿流动性层（不流动→流动）三臂的成交率差与成本差须单调收敛（低流动性档 A/B 臂代价更高=预期机理）
target:
  primary: net_expected_gain_bps（成交率×成交收益 - 冲击/价差成本 - 未成交机会成本）
  secondary: fill_rate
  note: 无 NAV 概念（单笔执行考题），主目标用 bps 期望而非 Sharpe
status: preregistered
