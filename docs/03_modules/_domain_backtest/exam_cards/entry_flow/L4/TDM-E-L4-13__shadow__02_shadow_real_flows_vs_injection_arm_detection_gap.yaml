hypothesis: 图面 dq＝「我以为发出的、券商说发出的、实际成交的三方对上账了吗（断线重连/对账/RTO<5min）」。兄弟卡在册现实原样引用＝三方对账需要三份账，实测只有本地成交终态可用（委托回报侧与成交确认侧实测无表），故该族只能以「故障注入仿真」形态落地：以 sim_trade_log 为真值基座，按冻结比例扰动生成伪造的委托侧与成交侧账，再验对账件检出能力；实现件=src/zephyr/trading/three_way_reconciliation.py（该卡实测存在）。本卡对照题设＝把对账件在真实运行面上以影子方式并行运行（不参与下单，只逐笔比对真实可得流水与本地账），得「真实面检出率」与「注入臂检出率」之差＝注入面测得出而真实面测不出的盲区量，用作注入臂假绿风险的上界。判读＝若影子腿因两腿无表而比对分母=0，则注入臂检出率属无对账基座的自证，本节点结论只能挂
