    溢出面按 A 股交易日右齐
  target_source: c1_market.kline_us_daily（symbol=中概 ADR）close→next_day_return；
    A 股侧 v_kline_sector_880_named（period='1d'）；控制变量 c1_market.us_index（实测 1993-01-29..2026-10-08
    /22645 行，可用）与 macro_data 的 FRED_VIX（实测 2021-08-16 起，1318 行）
