schema_version: '1.0'
card_id: TDM-E-L9-B06/calibration/02_海外散户情绪领先中概
node_id: TDM-E-L9-B06
family: calibration
title_zh: 源线·社媒舆情 X/Reddit·海外散户情绪领先中概与联动板块校准卡（渠道未接）
hypothesis: Reddit/X 上对中概股与相关主题的讨论量与情绪极性，对**下一交易日美股中概 ADR 收益**
  有正预测力（海外散户协调交易），并进一步隔日传导到 A 股对应联动板块；
  判据形态=情绪/密度分位对 t+1 ADR 收益的 IC，以及对 t+2 A 股板块的溢出 IC。事件研究用于
  异常讨论峰值（meme 事件）单独检验。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；A 股适配闸特别条款：社媒情绪在 A 股的作用面主要是**联动板块**而非
    大盘，故大盘 IC 只作辅读数；meme 事件白名单（事前定）与常规噪声分开计
buckets:
  type: quantile_quintile
  'on': 标的级讨论量 z-score（60 日）与情绪极性
  min_obs_per_bucket: 40
pillars:
  response_monotonicity: 讨论量分位与 t+1 ADR 收益 Spearman 单调 rho >= 0.6
  ic_floor: 横截面 RankIC 均值 >= 0.02 且 IC_IR >= 0.3
  lag_profile: 时滞曲线核心=t+1（当日海外情绪→当日 ADR）与 t+2（→A 股板块）两档分别登记，
    溢出档 IC 应 < 本地档（衰减方向正确才算传导而非共因）
  spillover_test: A 股板块面 IC 必须在**控制美股隔夜收益**后仍 >= 0.015，
    否则判"只是美股影子"（本卡最重要防伪门柱，与 A15 卡 us_decoupling 同型）
  event_extremes: 讨论量 >99 分位的峰值日（meme 事件）后 1-5 日收益应呈反转（拥挤后回落）
  regime_stability: bull/bear 两段同号
target:
  primary: adr_next_day_return（中概 ADR 次日收益）
  secondary: a_share_linkage_sector_next_2day_return（A 股联动板块 t+2 收益，溢出面）
  note: B06 决策问题=「海外散户情绪能否领先中概与联动板块」
status: blocked_on_data
