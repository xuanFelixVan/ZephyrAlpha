hypothesis: 跨日分钟路径形延续与日内相邻步路径记忆测的不是同一件事：同轴的 lag-1／lag-2（在册 A01/08 与 A02/12）量的是当日相邻 bar 的符号继承与隔步记忆，本卡量相邻两个交易日之间同一条日内路径向量的同位对齐复制（今日十六档向量对上一交易日十六档向量的十六点皮尔逊相关），归一掉波动量级、只测形状在日期间是否被重播。本卡检验该个股×交易日 panel 面对次日个股收益是否构成在册五键可判的关系。符号方向③席在册行未声明、本席不预设（example 读数 +0.008369 系③席过闸投影面的市场日均值，非卡面预期）。 ③席在册定义原文逐字（禁改写）：跨日分钟路径形延续＝按 symbol×trade_date 把当日分钟收益 r_i=ln(C_i/O_i)（trade_time 升序、nb 根）等分 16 档（档界=intDiv(k·nb,16)，档内和由 arrayCumSum 差分取，本班行内闭合实测 max|sum(b16)−arraySum(r)|=1.4e-17），再取同一 symbol「今日 16 档向量 b_t 与上一交易日 b_{t−1}」的 16 点皮尔逊相关；断日（新上市/停牌/跨月首两日）不出值。交付形态=横截面 panel（每股每日一值），本行 example 读数=全市场日均投影（仅供过闸，非交付口径）。与 033/039 的区别＝那两条量日内相邻步记忆（lag-1/lag-2），本列量相邻两日的同位对齐复制。TDM 归属＝载体 kline_1min→TDM-E-L9-A01 源线·日线/分钟行情（config/trading_decision_map.yaml:6042 dq＝价量趋势与动量能否预测N日收益？）／信息本体＝日内路径形→TDM-E-L9-A02 源线·Tick分笔（同件 :6077 dq＝日内微观结构能否预测次日方向与冲击成本？）；本班按 ⑥ 席 1015-10 归口请认对六条一律记「载体 A01／本体 A02」双标注（lag-3 起同轴不再分叉），归口待 ⑩ 认一次后由 ⑥ 席搬键，本席不改卡不自裁
