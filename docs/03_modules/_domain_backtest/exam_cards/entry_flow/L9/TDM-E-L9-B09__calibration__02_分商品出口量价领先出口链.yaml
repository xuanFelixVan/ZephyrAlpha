family: calibration
title_zh: 源线·进出口贸易·分商品出口量价领先出口链与航运需求校准卡（渠道未接）
hypothesis: 海关分商品（HS 码级）出口金额的量价分解中，**数量项**领先价格项、价格项领先企业报表；
  高出口依赖行业（纺织/家电/机械）的板块收益应与对应 HS 分组出口动能同向且滞后于后者 1-4 周。
  判据形态=HS 分组动能分位对板块后续收益的 IC + 领先阶（cross-correlation 峰值所在 lag）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；HS 分组→板块映射表事前冻结（映射改一层就等于换因子）；
    海关数据修订与"累计值 vs 当月值"口径混用是两大前视/失真来源，卡内固定用当月值 + 不修订快照
buckets:
  type: quantile_quintile
  'on': HS 分组出口数量动能（同比去季调）
  min_obs_per_bucket: 40
pillars:
  response_monotonicity: 数量动能五分位与板块 20 日收益 Spearman 单调 rho >= 0.6
  ic_floor: 板块横截面 RankIC 均值 >= 0.02
  lag_profile: 时滞曲线是本卡主判据=互相关函数峰值所在 lag 应在 [5,20] 交易日之间；
    若峰值在 lag=0/1 判"同步非领先"（对决策问题"能否领先"给出的是负结论，属有效产出）
  quantity_vs_price: 数量项 IC 应 >= 价格项 IC（假设的机制内核；若相反则本源线的信息其实在价格，
    应改接价格源而非继续挖数量）
  regime_stability: bull/bear 两段同号
  existing_data_check: 与既有可用面做增量检验——c1_market.macro_data（实测 1993-03-31..2026-10-09/
    51623 行，indicator_name 含'非制造业-指数'/'制造业-指数'等 PMI 类）加入 HS 分组后
    解释力增量 >= 0.01，否则判"PMI 已够，不需要新源线"（本卡防重复建设门柱）
target:
  primary: next_20day_export_sector_return（出口依赖板块 20 日前向收益）
  secondary: cross_correlation_peak_lag（峰值领先阶，单位交易日，直接回答"领先多久"）
  note: B09 决策问题=「分商品出口量价能否领先出口链与航运需求」；航运需求面与 A08 BDI 卡交叉，
    两卡各自单跑不合并（不同源线，合并会糊掉归因）
