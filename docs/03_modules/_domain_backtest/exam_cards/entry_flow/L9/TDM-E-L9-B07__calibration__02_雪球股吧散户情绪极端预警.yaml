schema_version: '1.0'
card_id: TDM-E-L9-B07/calibration/02_雪球股吧散户情绪极端预警
node_id: TDM-E-L9-B07
family: calibration
title_zh: 源线·雪球/股吧散户情绪·讨论热度极端预警校准卡（渠道未接）
hypothesis: A 股散户讨论热度（个股帖子数/阅读数 z-score）与情绪极性对次日收益呈**非单调**：
  中低热度段正向（关注度提升=信息扩散），极端热度档反向（过热=散户追高接近尾声）；
  热度极端预警的价值高于线性 IC——本卡因此把"极端档反转"设为主判据之一而非辅读数。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；"极端档"定义（热度 z-score > 2.0 或横截面前 1%）事前写死，
    禁按结果回挑分位线
buckets:
  type: quantile_decile_plus_extreme
  'on': 个股讨论热度 z-score（60 日）
  min_obs_per_bucket: 60
pillars:
  response_shape: 响应曲线应呈倒 U（中段正、极端档负），单调性判据改为"分段单调"：
    1-7 档 Spearman rho >= 0.6 且 9-10 档中位前向收益 <= 0（两段各自成立才算通过）
  extreme_reversal: 热度 z>2 组次日收益均值 <= 全体中位且 t <= -2.0（主判据，非辅读数）
  ic_floor: 横截面 RankIC 均值 >= 0.02（预期偏低，因非单调关系会被线性 IC 低估——
    卡内明写"IC 低但形状成立"是可接受结论，禁为过 IC 而改形状判据）
  lag_profile: 时滞=t+1 达峰、半衰期 <= 2 日（散户情绪定价快）；登记峰值档
  regime_stability: bull/bear 两段的**极端档反转**应同号（热度→负收益的机制在熊市更强）
  breadth_link: 与 A 股既有情绪面（c1_market.emotion_index 实测 1991-06-10..2026-10-09/8661 行、
    market_breadth_snapshot 26 日）做增量检验：加入热度后对次日情绪的预测 R² 增量 >= 0.01，
    否则判"与既有情绪指数同义反复"（本卡防重复建设门柱）
target:
  primary: next_day_stock_return（个股次日 hfq 收益）
  secondary: next_day_emotion_state_transition（次日情绪六段态转移，辅轴，接 emotion_index.stage）
  note: B07 决策问题=「A股散户讨论热度能否量化情绪并预警极端」
status: blocked_on_data
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L9-B07.confidence
preregistered_by: st-nightmine-20261010-L7
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
  extreme_t_stat_max: -2.0
oos_window_ref: *id001
