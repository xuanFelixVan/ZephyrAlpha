title_zh: 币圈镜像·山寨季广度（跑赢 BTC 占比）对 ETH/BTC 与 BTC 前瞻校准卡（market=crypto）
hypothesis: 镜像 A 股"广度/情绪线"（L1-S2 涨停家数、L1-AGG 情绪六段）到币圈口径：
  用 is_universe_eligible=1 的 139 个币对，构造 90 日跑赢 BTC 的占比（山寨季广度），
  该广度上升段应正向预示 BTC 自身后续收益（增量资金入场）与 ETH/BTC 汇率上升（风险偏好扩散）；
  广度极端高位（>80%）应反向（拥挤）。A 股广度卡用涨跌停计数，币圈无涨跌停 ⇒
  广度代理必须换成相对强弱占比，这是镜像链的核心改造点（不是照搬指标）。
market: crypto
mirror_of: TDM-E-L1-S2__calibration__02_涨停家数（广度面镜像，非同口径）
window:
  in_sample:
  - '2025-11-06'
  - '2026-05-05'
  oos: &id001
  - '2026-05-06'
  - '2026-09-30'
  regimes:
    unavailable: 币圈行情仅 2025-08-08 起 431 日，无独立牛/熊两段可分 ⇒ regime_same_sign 置 false，
      结论级别=短窗预演
  frozen_note: 看数前冻结；90 日回看窗与"跑赢占比"阈值（>=0）一次写死；
    IS 起点因 90 日回看需要延迟到 2025-11-06（避免暖启动段混入样本）
buckets:
  type: quantile_quintile
  'on': 90 日跑赢 BTC 的合格币占比
  min_obs_per_bucket: 40
pillars:
  response_monotonicity: 广度分位与 BTC 次日收益 Spearman 单调 rho>=0.6（预期低-中档正、极端档负）
  ic_floor: 日频 IC 均值 |IC|>=0.02（series 面 ic_ir 执行器置 None，如实 n/a）
  lag_profile: 时滞判据=广度是慢变量，|IC| 峰值预期落 t+3 或更晚；若只落 t+1 且迅速归零=
    判"广度已被价格吃掉、无领先力"（有效负结论，禁按样本不足草率归档）
  extreme_overheat: 广度 >80% 分位组其后 5 日 BTC 收益均值应 <= 中位组（过热反向，辅读数）
  eth_btc_channel: 同一广度对 **ETH/BTC 汇率**前向变化的 IC 应高于对 BTC 自身收益的 IC
    （风险偏好扩散的机制读数；若相反则"山寨季"叙事在本数据上不成立）
  universe_stability: 139 个 is_universe_eligible=1 币在样本期内的成分变动须 ≤10%/季，
    否则广度是"清单变更"而非"市场行为"伪结论（本卡最重要防假阳门柱）
target:
  primary: btc_next_5day_return（BTCUSDT 5 日前向收益，UTC 日界）
  secondary: eth_btc_ratio_next_5day_change（ETHUSDT/BTCUSDT 相对汇率 5 日变化）
  note: 与 A 股广度卡（涨停家数）分列——两套 target、两套制度、禁共用结论
