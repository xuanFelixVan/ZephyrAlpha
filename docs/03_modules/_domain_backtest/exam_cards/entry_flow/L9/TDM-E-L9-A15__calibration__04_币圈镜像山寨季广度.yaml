data_binding:
  signal_table: c1_market.crypto_kline_daily
  signal_column: close
  signal_derivation: 广度_t = count(symbol where close_t/close_{t-90}-1 > BTCUSDT 同期收益
    且 is_universe_eligible=1) / count(is_universe_eligible=1)；7×24 自然日即交易日（无休市日历）
  target_source: c1_market.crypto_kline_daily symbol='BTCUSDT' close→next_5day_return；
    辅 target 用 symbol='ETHUSDT' 与 BTCUSDT 的比值变化
  data_window_evidence: |
    命令原文：
      python -c "
      import sys; sys.path.insert(0,'scripts/backtest')
      from fexam.ch_data import ch_query_df
      print(ch_query_df(\"SELECT uniq(symbol),uniq(trade_date),min(toString(trade_date)),max(toString(trade_date)),count() FROM c1_market.crypto_kline_daily\").values)
      print(ch_query_df(\"SELECT uniq(symbol) FROM c1_market.crypto_kline_daily WHERE is_universe_eligible=1\").values)
      print(ch_query_df(\"SELECT trade_date,btc_close,ma200,altseason_ratio,shadow_tier,fng_value FROM c1_market.crypto_shadow_gate ORDER BY trade_date DESC LIMIT 3\").values)"
    实测：
      crypto_kline_daily uniq(symbol)=141 uniq(trade_date)=427 2025-08-08..2026-10-08 rows=19801
      is_universe_eligible=1 的币数=139（足够做占比广度）
      crypto_shadow_gate 已直接落 altseason_ratio（实测 2026-10-08=0.5714、10-07=0.647、10-04=0.6785）
        ⇒ **既有 altseason_ratio 可作交叉校验面**，但其口径（MVP §7：90 日跑赢占比≥75% 且
        有效样本≥40/50，Top-50 清单）与本卡的 139 币全宇宙口径**不同**，
        两口径差异本身是本卡要登记的第二读数（清单口径 vs 全宇宙口径的广度分歧）
    缺哪张表哪一段（阻断点，写死）：
      1) **无 is_universe_eligible 的历史版本轴**——币的"合格宇宙"归属只有当前值，无法还原
         2025-08 起每期真实成分；广度分母因此不可 PIT ⇒ universe_stability 门柱现不可判；
      2) crypto_kline_daily 仅 427 日（2025-08-08 起），无 2019-2024 的牛熊段 ⇒ 无法建立
         "条件稳定性"（牛/熊同号）判据，也无法做 ≥500 日的分布性结论；
      3) 影子 MVP 文档 §5 记 OKX 端点环境级阻断，现库内数据来自替代通道（键格式 BTCUSDT 而非
         BTC-USDT 亦印证换源），但**该换源未见 Owner 裁定登记**（MVP 明言"换源属 Owner 决策"）
         ⇒ 数据溯源链有断点，考前须先补口径来源确认。
    解锁条件：①落一版 universe 成分历史轴（或按季快照表）；②行情累计 ≥500 日且含一段明确趋势段；
      ③换源溯源在 data_asset_registry/裁定层留痕。三者齐备后把 status 改回 preregistered 重冻。
  readiness: BLOCKED——宇宙成分不可 PIT + target 史仅 427 日 + 换源溯源未留痕
