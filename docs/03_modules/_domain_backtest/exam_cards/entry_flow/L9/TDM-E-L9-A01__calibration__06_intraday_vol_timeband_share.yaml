title_zh: 楼1分钟微结构·CAND-P0-MIVOLSHAPE-024 日内波动率时段占比 U 型指数（全市场日频序列）
origin: P0-楼1/楼10（③席 20261015-p03-04 具名候选 CAND-P0-MIVOLSHAPE-024）|20261015-p03-04
hypothesis: 首尾时段（09:30-10:00 ∪ 14:30-15:00）在当日已实现方差中的占比是日内波动的时段构成，归一掉波动量级只留分布形状（③席在册定义自陈『纯方差维时段构成，量纲自消』）；本卡检验该日频序列对次日指数收益是否构成在册五键可判的关系。符号方向③席在册行未声明、本席不预设（见
  gaps_no_source.sign_claim_absent）。 ③席在册定义原文逐字（禁改写）：日内波动率时段占比（U 型指数）＝按 symbol×trade_date 聚合 sumIf(r_i^2, 09:30-10:00 ∪
  14:30-15:00)/sum(r_i^2)，r_i=log(C_i/O_i)，再取全市场日均值；纯方差维时段构成，量纲自消
window:
