    example_value: 非因子值行。实测读数（242 共日）：corr(1min,60min) f_volshape=-0.0120／f_gkeff=-0.1002／f_jump=+0.2511；均值 1min→60min：0.438997→0.358500／0.832054→1.242800／0.129021→0.674900；n_sym
      均值 4822（1min，HAVING nb≥200）vs 5049（60min，HAVING nb≥3）；60min 档三构造各自过闸=f_volshape pass 0.0962(lu_count_z20)／f_gkeff
      reject 0.5103(avg_abs_ret_z20)／f_jump pass 0.0818(avg_abs_ret_z20)
    downstream_meaning: 非信号行无闸（本行自身不入过闸账）。结论三条（本席只登记读数，不改他人判据）：①同名构造在两档表上的日频时间序列相关近零（-0.01~-0.10，最大 0.25）＝**改绑 kline_60min
      不等于复算分钟腿**，卡面 data_binding 换档必须重新过闸并显式标档位；②60min 档成本极低（0.6s/全 FY）但不可当 1min 代理；③两档 n_sym 差 227 只＝档位宇宙不同（1min 受 nb≥200
      门），跨档对拍分母须先对齐
  example_value_from_candidate: FY2024 日频截面均值 mean=0.4389972116／min=0.3146861040／max=0.5626999135（n=242）；2024-01-02 全市场日均值=0.4291241828（n_sym=4888）；中性基准=60/241=0.2489626557
