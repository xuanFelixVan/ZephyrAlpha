  signal_column: （待接）sku_price
  signal_derivation: SKU→类目映射后取类目中位数价格（抗促销离群）；周度动能 = 中位价环比
  target_source: v_kline_sector_880_named（period='1d'）；辅 c1_market.macro_data（CPI 类序列）
  data_window_evidence: |
