schema_version: '1.0'
card_id: TDM-E-L9-A09/calibration/02_快讯情感日均值
node_id: TDM-E-L9-A09
family: calibration
title_zh: 源线·财经快讯情绪·全市场日度情感极性与密度校准卡
hypothesis: 由已落库的 820 万条快讯与 795 万条打分构造的日度情感均值（avg polarity）与负面密度 对次日指数收益有预测力：情感转负→次日折价；且**密度（条数）本身**是注意力读数，高密度+低极性 组合的预测力应高于单看极性。快讯时戳不可回填（pit_proof），故聚合窗必须右闭。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结（裁定#501 纪律）；情感口径版本列 caliber_version 在表， 跨版本拼接=口径漂移，本卡只允许单版本内比较（多版本共存则登记为长尾并只取最新段）
buckets:
  type: quantile_decile
  'on': 当日全市场 polarity 均值
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分桶中位前向收益 Spearman 单调 rho>=0.6（预期正向：极性越高次日越好）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（series 面 ic_ir 执行器置 None，如实 n/a）
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日；情绪类信号预期半衰期短（<=3 日）
  regime_stability: 牛/熊两段 IC 同号
  density_increment: 情感×密度四象限里"低极性+高密度"档的次日收益应显著低于"低极性+低密度"档 （注意力放大情绪冲击，辅读数不否决主判）
  caliber_honesty: 同一天 news_data 与 news_sentiment_score 的行数差（约 27 万条未打分）须登记， 打分覆盖率<100% 时以覆盖率作控制变量
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: next_day_breadth_change（次日涨跌家数差变化，情绪→广度的传导辅轴）
  note: A09 决策问题=「快讯流密度与情感能否量化情绪并预测次日」
status: examined
lineage:
  card: null
  run_id: mineloop-route-audit-02_快讯情感日均值
  score_row: exam_scores_v1.yaml#rows[40]
  confidence_writeback: TDM.nodes.TDM-E-L9-A09.confidence
preregistered_by: st-nightmine-20261010-L7
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c3_fundamental.news_sentiment_score
  signal_column: polarity
  signal_derivation: 按 toDate(publish_time, 'Asia/Shanghai') 聚合 AVG(polarity) 与 COUNT(*)（密度）、SUM(n_neg)/COUNT(*)（负面率）；join
    c3_fundamental.news_data 取 related_symbols/related_tags 可做个股级面板（另卡，长尾）
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: "命令原文：\n  python -c \"\n  import sys; sys.path.insert(0,'scripts/backtest')\n  from fexam.ch_data\
    \ import ch_query_df\n  for t,c in [('c3_fundamental.news_data','publish_time'),('c3_fundamental.news_sentiment_score','publish_time'),\n\
    \              ('c1_market.news_sentiment_window','window_ts'),('c1_market.sentiment_panel','trade_date')]:\n    r=ch_query_df(f'SELECT\
    \ min(toString({c})),max(toString({c})),count(),uniq({c}) FROM {t}');print(t,r.values)\"\n实测：\n  c3_fundamental.news_data\
    \            publish_time 2010-01-02..2026-10-10 rows=8219134 d=149090（分钟级）\n  c3_fundamental.news_sentiment_score publish_time\
    \ 2010-01-02..2026-10-04 rows=7947739 d=146659\n    —— 打分覆盖 7947739/8219134 = **96.7%**，缺 271,395 条未打分（pillars.caliber_honesty\
    \ 来源）\n    —— 表带 caliber_version 列 ⇒ 跨版本口径须分段（已写进 frozen_note）\n  c1_market.news_sentiment_window     window_ts 2026-02-24..2026-10-08\
    \ rows=19836 days=200\n    —— 既有预聚合窗表**仅 200 日**，不可承担 IS 窗 ⇒ 本卡改为直接从明细表现算日度聚合\n  c1_market.sentiment_panel           trade_date\
    \ 2026-09-01..2026-10-09 rows=52 days=39\n    —— 长表（metric/value）仅 39 日，弃为读数面\n⇒ A09 的\"数据可得性\"结论与直觉相反：**明细层极富（16 年、820\
    \ 万条），聚合层极贫（200 日）**，\n  因此本车道对 A09 的干挖矿结论=应把 news_sentiment_window 的回填列为工程缺口，而非判该源线不可考。\n"
