family: calibration
title_zh: 源线·美国官方天气/海洋·极端事件预警对能源与航运链的校准卡（渠道未接）
hypothesis: NWS/NOAA 官方极端事件（寒潮/飓风/冻结/港口关闭）预警相对市场有信息优势：
  预警发布（非灾害实际发生）当日次一交易日起，能源与航运相关板块异常收益应显著为正（供给中断预期），
  且灾害实际落地日不应再有增量（预警已定价）。与 A12（中国天气/台风）的区别=
  本节点是**海外官方预警**，传导对象是全球大宗与航运，不是国内用电负荷。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；"预警"与"实际事件"两类锚点分列，禁混池（混池=因果方向不可辨）
buckets:
  type: event_binary_group
  'on': 预警事件（严重警告及以上）× 影响区域港口/炼能暴露
  min_obs_per_bucket: 30
pillars:
  abnormal_return_floor: 预警组 CAR[0,+5]（国内能源/航运板块）>= 20 bp 且 |t| >= 2.0
  warning_vs_impact: 实际事件日 CAR[0,+5] 应不显著大于预警日 CAR（"预警已定价"的检验形态）
  ic_floor: 暴露度横截面 RankIC 均值 >= 0.02
  lag_profile: 时滞曲线=海外预警在北京时间次日开盘前后落地（时区跨度决定 t+1 档最强），
    半衰期预期 <=3 日（事件型冲击定价快）；登记峰值档
  regime_stability: bull/bear 两段同号
  timezone_gate: 海外发布时间必须换算到 Asia/Shanghai 后再对齐 A 股交易日（RULE-SCHEMA-TZ 同纪律），
    错一日即前视——本卡最硬的技术门柱
target:
  primary: car_0_to_5_energy_shipping_sector（880471 类能源/航运板块相对 000300 的 5 日 CAR）
  secondary: car_0_to_5_brent_companion（EIA_BRENT_SPOT 次日变化，检验全球定价是否同步）
  note: B02 决策问题=「极端事件能否预警能源中断与减产」
