    区域港口吞吐/炼能在板块成分中的权重
  target_source: v_kline_sector_880_named（period='1d'）；辅 c1_market.macro_data
    （indicator_name='EIA_BRENT_SPOT'，该表实测可用：1289 行 2021-08-16..2026-10-06）
