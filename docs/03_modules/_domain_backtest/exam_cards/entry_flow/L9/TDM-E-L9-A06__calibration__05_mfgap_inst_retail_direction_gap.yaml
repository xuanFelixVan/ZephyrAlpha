title_zh: 楼1资金流·CAND-P0-MFGAP-008 机构-散户方向差（超大单净占比−小单净占比·个股横截面）
origin: P0-楼1-money_flow替代腿（⑩第三单 §6 指路）|20261015-p03-02
hypothesis: 机构-散户方向差是"档位间相对取向"而非"档位水平"：在册母卡 A06/02 的水平截面只量主力净流入占比本身，本卡量超大单与小单净占比之差（去均值后），假设=机构与散户方向背离越大，次月……不，次日方向越偏向机构一侧。③席在册定义原文逐字（禁改写）：『机构-散户方向差（超大单净占比
  − 小单净占比）：money_flow 逐股逐日 super_large_net_inflow_pct − small_net_inflow_pct，先按 trade_date 截面去均值再排序；须显式声明非零和修正（见 CAND-P0-MFCAL-011
  (b)）』。本卡答节点决策问题『主力/大单净流向能否预测短期方向』（A06 决策问题，逐字取母卡 target.note）。非零和修正与恒 0 列两处前置事实见 data_binding。
window:
  in_sample:
  - '2021-01-04'
  - '2023-12-29'
  oos: &id001
  - '2024-01-02'
  - '2025-09-09'
  regimes:
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊，IS 内熊段）
    recovery: 2024-02-01..2025-09-09（修复段，OOS 内对侧 regime）
    bull_note: 2019-2021H1 牛段 money_flow 无数据（起 2021-01-04）⇒ 本卡 regime 用熊/修复两段替代， 已如实声明不冒用统一牛熊串
  frozen_note: 看数前冻结（裁定#501 纪律）；IS 起点因数据起点内缩至 2021-01-04
buckets:
  type: quantile_decile
  'on': 当日机构-散户方向差（super_large_net_inflow_pct − small_net_inflow_pct，先按 trade_date 截面去均值再排序，横截面残差）
  min_obs_per_bucket: 60
signal_kind: panel
pillars:
  orthogonalization: 信号必须先对当日 pct_change 与 20 日动量做横截面回归取残差； 主判据只在残差序列上算（否则与本车道 A01 动量卡重复计分）
  response_monotonicity: 残差分桶中位前向收益 Spearman 单调 rho>=0.6
  raw_vs_resid_gap: 原始信号 IC 与残差信号 IC 之差登记入台账（差值大=资金流口径污染动量，是数据质量结论）
  resid_pillar_inherited_from: 残差化三柱逐字抄同节点 preregistered 母卡 TDM-E-L9-A06/calibration/02 （orthogonalization/response_monotonicity/raw_vs_resid_gap）；五键与窗/target/buckets
    地板同源
  cross_section_first: ③席在册定义前置腿逐字：『先按 trade_date 截面去均值再排序』——去均值是定义的一部分，不是可选预处理（其理由见 data_binding.nonzero_sum_correction）
  orthogonal_gate_face: 闸在册读数逐字见 data_binding.orthogonal_gate_verdict；本席未跑闸、未复算相关性
target:
  primary: next_day_stock_return（个股次日 hfq 收益）
  secondary: next_day_limit_up_probability（次日涨停概率，情绪极端面）
  note: A06 决策问题=「主力/大单净流向能否预测短期方向」
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
status: blocked_on_impl
status_reason: 判据面已按在册冻结值填齐，两处不可开考且皆不属本席裁量：①信号物化腿缺位——money_flow 两列差分＋按 trade_date 截面去均值尚未由⑤实现（⑤在册出口=码面+测试绿→卡翻转 unblocked→移交⑥）；②正交准入闸对"个股横截面"对象无在册折叠口径——③席在册行原文『个股横截面版未被计量（闸契约只吃
  date,sig 单列，横截面候选无在册折叠口径＝呈批第 1 条）』，而其已计量的市场级折叠版 verdict=reject；准入与物化一裁/一落地即翻 preregistered。本席不自裁准入、不代⑤出题。
