hypothesis: 日内分钟收益的一阶自相关是路径时序记忆维（正=同向延续／负=均值回复），归一掉波动量级、只测相邻 bar 之间的符号继承强度；本卡检验该个股×交易日 panel 面对次日个股收益是否构成在册五键可判的关系。符号方向③席在册行未声明、本席不预设（example
  读数 −0.035894 系③席过闸投影面的市场日均值，非卡面预期）。 ③席在册定义原文逐字（禁改写）：日内分钟收益一阶自相关＝按 symbol×trade_date 取分钟 r_i=ln(C_i/O_i) 按 trade_time 升序排成数组，对相邻对
  a=r[1..n-1]、b=r[2..n] 手算皮尔逊闭式 rho=(m*Σab−Σa·Σb)/sqrt((m·Σa²−(Σa)²)(m·Σb²−(Σb)²))，m=n−1；交付形态=横截面 panel（每股每日一值，路径记忆维），本行
  example 读数=全市场日均（仅供过闸投影，非交付口径）
