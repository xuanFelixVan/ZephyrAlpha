  orthogonal_gate_verdict: 池面=⑨席 pool6 绕行面（6 序列／3 独立轴，非 ibt_runner MEMBERS 15 员面；本班实测该面仍在 .runtime/tmp 会话私面 24h TTL）。gate
    实投 verdict=pass max|corr|=0.1297 most_similar=avg_abs_ret_z20.csv rc=0。册内自家同窗共线自查：vs 034 位差 0.0934／vs 036 峰度 0.1129／vs
    在册 026 跳跃占比 0.1165／vs 035 收位 0.0177 ⇒ 全部≤0.12＝与楼1 已挖面亦不共线，判新轴
