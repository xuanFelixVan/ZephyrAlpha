    后零接触
  band_caliber_precedent_037:
    definition_zh: 60min 档第二批对照行（非信号）＝承 031 行体例，把本班新出的 034/035/036 三构造在 kline_60min 上同式重算（守卫同、HAVING nb>=3），量“同名构造换采样档是否仍是同一对象”的第二批读数
    example_value: corr(1min,60min)＝hpos +0.9955／lpos +0.8587／hlpos +0.2926／stoch(035) +0.9998／kurt(036) +0.2678；60min 均值＝0.256017／0.509106／−0.253089／+0.475819／2.258169（对应
      1min 0.268720／0.306475／−0.037755／0.475192／10.682670）
    downstream_meaning: 非信号行，供 ⑤⑥⑦ 席 data_binding 判档用。结论＝**区间位置型（hpos/stoch）档不变、时序差与高阶矩型（hlpos/kurt）换档即换对象**，与上班 031 行（volshape/gkeff/jump
      三构造 corr −0.0120/−0.1002/+0.2511）合并后可升为“档位敏感性两族”规律；改绑 kline_60min 一律须重新过闸并显式标档位（本班实测 60min 面 hlpos reject 0.3677／stoch
      reject 0.5969，池=同一 pool6 绕行面）。本班另测 60min 档 f_autocorr 不可产：该表每股每日仅 4 根，nb>=3 下自相关自由度不足＝该轴在 60min 档无源，禁写“等价复算”
  dialect_cost_precedent_038:
    definition_zh: 楼1 分钟腿方言与成本口径画像行（非信号，体例承 022/032 行）＝本班在 kline_1min/kline_60min＋CH 26.6.1.1193 上实测的六处口径面：(a) corr/ correlation
      在本方言是**聚合函数**，传两个 Array(Float64) 报 Code 43 ILLEGAL_TYPE_OF_ARGUMENT ⇒ 皮尔逊须手写 dotProduct+arraySum 闭式；(b) 同一 SELECT
      层的别名不可被该层 WHERE 引用（Code 47 Unknown expression identifier 'mb'）⇒ 须下沉一层，与在册“窗口函数不可嵌套/不可在 WHERE 引用”同族；(c) ch_reader 会给查询**自动注入
      FINAL**（错误回显实证 “FROM c1_market.kline_1min FINAL WHERE”）⇒ 分钟大表查询成本与语义面须由 ⑤⑥⑦ 席知悉，非本席所写；(d) 数组聚合成本可达：groupArray((toUnixTimestamp(trade_time),
      r))（约 4900 只×240 根）单月 2.2s，与标量聚合同量级 ⇒ 分钟腿“横截面数组型构造”不是禁区，上班“数组腿成本未知”之虑解除；(e) 日内极值位置分量 hpos×lpos 日频相关 +0.9941（分量 sd
      0.181/0.198，差值 sd 仅 0.0269）⇒ 位置信息高度同涨同落，可分信息只在差维；(f) 同一守卫与 HAVING 下，标量腿与数组腿逐日 n_sym 一致（2024-06-03 均 4894／2024-06-04
      均 4848）⇒ 数组腿无静默丢样（负对照本席未做“故意改守卫”变体，此条仅证两腿一致，不证守卫正确）
    example_value: 见 definition_zh 逐条（(d) 单月 2.2s、(e) +0.9941、(f) 4894/4848 逐位相同）
    downstream_meaning: 非信号行；池面不适用（本行不过闸）。请 ⑤⑥⑦ 席在 data_binding／SQL 写法层消费后回收本行
  readiness: 数据腿可达（承③席在册 20261015-p03-05 行：FY2024 全段 242 交易日、日截面 n_sym≈4850、数组聚合单月 2.2s 与标量聚合同量级＝横截面数组型构造非禁区，本班未重扫全表）；缺⑤物化算子、过闸投影折叠口径裁定，且
