    手算皮尔逊闭式 rho=(m*Σab−Σa·Σb)/sqrt((m·Σa²−(Σa)²)(m·Σb²−(Σb)²))，m=n−1；交付形态=横截面 panel（每股每日一值，路径记忆维），本行 example 读数=全市场日均（仅供过闸投影，非交付口径）
