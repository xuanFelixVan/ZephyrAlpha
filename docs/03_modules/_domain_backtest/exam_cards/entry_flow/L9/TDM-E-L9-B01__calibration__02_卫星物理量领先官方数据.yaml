family: calibration
title_zh: 源线·卫星影像·物理量领先官方统计的校准卡（渠道未接）
hypothesis: 卫星可测物理量（厂房/堆场热异常、露天矿与港口在库量、作物 NDVI）相对官方月度统计
  有 2-6 周领先，故"物理量意外 → 相关板块后续收益"应先在物理量档显现；官方数据发布后信号消失
  （被定价完毕）。判据=物理量读数对**发布前**收益有 IC、对发布后无 IC（领先性双档检验）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；本卡假设与门柱在渠道未接时即写死，接入后禁按已有结果改定义（G4-5）
buckets:
  type: quantile_tercile
  'on': 物理量读数相对过去 8 期均值的意外度
  min_obs_per_bucket: 40
pillars:
  response_monotonicity: 意外度三分位与事件后 20 日板块收益 Spearman 单调 |rho| >= 0.6
  ic_floor: 相关个股横截面 RankIC 均值 >= 0.02（发布前窗口）
  lag_profile: 时滞曲线要求 |IC| 峰值落在官方发布前 [-30,-1] 交易日档，且发布后 [0,+10] 档
    IC 归零（"领先并已定价"的双向证据，这是本卡唯一有意义的判据形态）
  regime_stability: bull/bear 两段同号
  event_study: 以官方月度统计发布日为事件锚，估计窗 [-210,-11]，事件窗 [-30,+10]，
    报告事件前累计异常收益 CAR_pre 与事件后 CAR_post
target:
  primary: car_pre_official_release（官方数据发布前 30 交易日累计异常收益，板块层）
  secondary: car_post_official_release（发布后 10 交易日，应归零=领先性确认）
  note: B01 决策问题=「物理量能否领先官方数据」
status: blocked_on_data
