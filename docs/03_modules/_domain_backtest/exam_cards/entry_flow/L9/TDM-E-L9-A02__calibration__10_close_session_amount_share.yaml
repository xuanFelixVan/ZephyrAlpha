oos_window_ref: *id001
data_binding:
  signal_table: >-
    kline_1min (CH c1_market)
  signal_column: amount（列名逐字取③席在册定义行的求和列，本席未新增列名）
  signal_derivation: >-
    尾盘成交额占比＝symbol×trade_date 聚合 sumIf(amount,14:30-15:00)/sum(amount) 后取全市场日均值；kline_1min 单扫一趟聚合（r_i=close_i/open_i-1 仅用于同表其它列，本列纯量维）
  target_source: kline_index 000300 close→next_day_return
  universe_guard: 前缀白名单（③席 CAND-P0-MINFPORTRAIT-022 在册改判行逐字见 kline_1min_caliber_precedent）
  kline_1min_caliber_precedent:
    definition_zh: >-
      kline_1min 口径画像行（非信号，⑤⑥⑦席 data_binding 与查询写法的门柱前置）：(a) volume 单位实为手而列注释自陈股；(b) 分区键=toYYYYMM(trade_time)，按 trade_date 过滤不剪枝；(c) 本表无 market_type 列，宇宙守卫须用前缀白名单；(d) kline_5min 无 trade_date 列；(e) 日内根数无年度退化；(f) 附带 trade_calendar.exchange 唯一值='SSE'
    example_value: >-
      非因子值行。实测读数：(a) amount/(volume×100) 落当日 low-high 内且与 kline_daily 同日均价一致——000001=10.9753∈[10.91,11.12]、300750=200.7786∈[195.8,203.57]、600519=1640.9329∈[1635.11,1650.88]，而原始 amount/volume=1097.53/20077.86/164093.29 恒为价的 100 倍；(b) 同一 10 日窗按 trade_date 过滤时 system.processes 实测 elapsed=310.7s 且 read_rows=1496519175（未剪枝、未跑完），改 trade_time 区间后单月 17.2s（冷缓存）／2.2-7.0s（热缓存）；(c) 2024-06-03..07 前缀分布=0 段 1478 只／3 段 1336 只／6 段 2248 只 共 5062 只，无 5/1 基金段；(d) kline_1min/15min/30min/60min 同时有 trade_date+trade_time 而 kline_5min 仅 trade_time；(e) 600519/000001/300750 在 2021-10、2022-06、2023-06、2024-06 各月 min=max=avg=241 根/日；(f) trade_calendar GROUP BY exchange 只返回 'SSE'（13809 行）
    downstream_meaning: >-
      非信号行无闸（判据面行）。含义五条供下游：①任何用 kline_1min volume×price 与 amount 互证的卡面都会错 100 倍（与 2026-09-22 kline_daily 量纲治本同源但本表未被那批修覆盖）；②矿规'覆盖窗按股内查询'在本表应写成 trade_time 区间，否则全表扫；③本表无 market_type 列 ⇒ 矿规'symbol 无后缀须配 market_type=stock'对本表改判为前缀白名单{0,3,6}（同 20261015-p03-02 对 money_flow 的改判形）；④卡面 data_binding 若照抄 trade_date 到 5min 表会直接 UNKNOWN_IDENTIFIER；⑤按 exchange='SH' 过滤 trade_calendar 得 count=0＝假无源，本班因此改走表内 uniqExact(trade_date) 直读
  example_value_from_candidate: >-
    2024-06-03 全市场日均值=0.101881（n_sym=5045）；逐股额占比：000001=0.10222697、600519=0.10208488、300750=0.08215048；FY2024 日频截面均值 min=0.080969/max=0.191381/mean=0.123714/std=0.017630
  orthogonal_gate_verdict: >-
    过闸（入过闸账）verdict=pass max|corr|=0.2007（most_similar=lu_ratio）rc=0；池=⑨席 pool6（6 序列／3 独立轴／共同日 1855）；尺双对照同批实测：池成员 avg_abs_ret 自投=reject 1.0000、同日轴随机高斯=pass 0.0655；折叠口径=本席临时全市场日均值（在册横截面折叠口径仍未裁＝呈批第1条承 20261015-p03-02）；查重差异面：TDM-E-L9-A02/02 竞价失衡与尾盘冲击 的尾盘腿绑 tick_data direction='B'（本班实测 auction_book/auction_snapshot 切点前 0 行＋上班实测 direction 全中性盘）⇒ 本候选系同一假设的可达替代口径且方向无关；与 TDM-P-P3-04/02 尾盘强势（收益方向＋当日 H-L 区间位置）不同对象
  data_window_evidence: >-
    ③席登记面逐字（sample_window 列）：闸测窗 2024-01-02..2024-12-31（242 交易日 全在切点前）；表内切点前全段实测=1145777646 行／974 交易日（2021-09-01..2025-09-08）
  readiness: 数据腿可达（本班实测 partition 202109..202610・两时段带全覆盖）；缺⑤物化算子与两处端点/折叠口径裁定
