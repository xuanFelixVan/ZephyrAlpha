schema_version: '1.0'
card_id: TDM-E-L9-A02/calibration/10_close_session_amount_share
node_id: TDM-E-L9-A02
family: calibration
title_zh: 楼1分钟微结构·CAND-P0-MITAILV-013 尾盘成交额时段占比（全市场日频序列）
origin: P0-楼1-分钟微结构腿（③席 20261015-p03-03 具名候选 CAND-P0-MITAILV-013）|20261015-p03-03
hypothesis: >-
    尾盘成交额时段占比是日内量能在收盘前半小时的聚集度，方向无关（③席在册定义自陈『本列纯量维』）；本卡检验该日频序列对次日指数收益是否构成在册五键可判的关系。符号方向③席在册行未声明、本席不预设（见 gaps_no_source.sign_claim_absent），判据只在在册五键面上判。 ③席在册定义原文逐字（禁改写）：尾盘成交额占比＝symbol×trade_date 聚合 sumIf(amount,14:30-15:00)/sum(amount) 后取全市场日均值；kline_1min 单扫一趟聚合（r_i=close_i/open_i-1 仅用于同表其它列，本列纯量维）
window:
  in_sample:
  - '2022-01-04'
  - '2023-12-29'
  oos: &id001
  - '2024-01-02'
  - '2025-09-09'
  regimes:
    bull: 2022-01-04..2022-06-30→无（数据起 2021-09，牛段样本不足，本卡 regime 仅用熊/震荡两段）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊，本卡 IS 全落此段）
    recovery: 2024-02-01..2025-09-09（修复段，作 regime 对侧）
  frozen_note: 看数前冻结；右端截 2026-09-30 前先确认 1min 覆盖（实测至 2026-10-09）
buckets:
  type: quantile_decile
  'on': 当日全市场尾盘成交额占比均值（symbol×trade_date 聚合后取日均值，序列面）
  min_obs_per_bucket: 60
signal_kind: series
pillars:
  inherited_numeric_face: 五键数值面整块逐字抄同 flow 同层同 family 的在册冻结卡 git show HEAD:docs/03_modules/_domain_backtest/exam_cards/entry_flow/L9/TDM-E-L9-A01__calibration__03_分钟已实现波动.yaml
    -> pillars_numeric（mono_spearman_min/ic_mean_min/ic_ir_min/regime_same_sign/oos_same_sign）；
    该五键与同层市场级序列先例 git show HEAD:docs/03_modules/_domain_backtest/exam_cards/entry_flow/L9/TDM-E-L9-A04__calibration__02_估值ERP分位日增量.yaml・git show HEAD:docs/03_modules/_domain_backtest/exam_cards/entry_flow/L9/TDM-E-L9-A09__calibration__02_快讯情感日均值.yaml 的 pillars_numeric 同值（本班 parsed 对拍全等），
    故数值面无择一问题；择一问题只在 window（见 gaps_no_source.kline_1min_window_caliber）
  pillars_text_face: 文字面＝指针式继承（不改一柱、不删一柱、不加柱＝禁挪门柱），沿在册先例
    TDM-E-L9-A02/calibration/09 的 inherited_family_pillars 同法；本席不自拟柱文字
  candidate_face: ③席在册定义即本卡信号对象（原文见 hypothesis 与 data_binding.signal_derivation）
  orthogonal_gate_face: 闸在册读数逐字见 data_binding.orthogonal_gate_verdict；本席未跑闸、未复算相关性
target:
  primary: next_day_index_return（CSI300 次日收益，G0-4 主轴）
  secondary: next_20day_index_return（慢变量真目标口径，登记为辅轴，series 执行器不自动判）
  note: A02 决策问题逐字（取母骨架 tdm.decision_question）＝『日内微观结构能否预测次日方向与冲击成本』；
    本卡只答"次日方向"半问的序列面；冲击成本半问的对象非本卡信号，故不搬母卡 A02/02 的 impact_curve target 列名
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
status: blocked_on_impl
status_reason: 判据面（window/pillars_numeric/buckets/target/signal_kind/discipline）已按在册冻结值整块填齐，
  本班 CH 只读实测证明可算性；唯一缺腿＝⑤实现面的物化算子（本班实测 scripts/backtest/fexam/card_binding.py
  的 op_* 配方面含 op_daily_agg/op_sector_top_n_amount_share/op_index_amount_sum_pctile 等，
  无"日内时段聚合÷全日聚合"占比算子）；另时段端点归属与市场级折叠口径两处在册未裁（见 gaps_no_source）。
  按 SOP ⑤出口『码面+测试绿→卡翻转 unblocked→移交⑥』翻转，本席不自宣可考。
gaps_no_source:
  kline_1min_window_caliber: 本班实测 data_binding.signal_table 含 kline_1min 的在册卡=11 张（含本班这 2 张；全文提及该表者=15 件），
    其 window 去重后并存 5 套＝IS 2022-01-04..2023-12-29／OOS 2024-01-02..2025-09-09（3 张＝在册源
    TDM-E-L9-A01/calibration/03＋本班 10・11 号卡）、IS 2021-09-01..2023-12-29／OOS 2024-01-02..2025-09-09（1 张
    TDM-X-S1-04/comparison/05）、IS 2021-09-01..2025-09-30／OOS 2025-10-09..2026-09-30（1 张 TDM-X-S2-04/comparison/02）、
    IS 2026-06-01..2026-08-31／OOS 2026-09-01..2026-10-09（4 张＝P2 做T族）、IS 2021-09-01..2024-12-31／OOS
    2025-01-01..2026-09-30（2 张＝TDM-P-P3-04）；而本 node 唯一在册冻结面 A02/02 的窗是 tick 短窗预演
    （IS 2026-01-05..2026-06-30／OOS 2026-07-01..2026-09-30，其 frozen_note 自陈"不作分布性结论"）。本席按"同 flow
    同层同 family＋同表＋status=preregistered＋OOS 末端对齐③席在册切点 2025-09-09"择 A01/03 整块逐字继承，
    不擅改任一日期；多口径并存一律呈批＝OD-22
  band_edge_inclusion: ③席定义写 14:30-15:00／09:30-10:00 未写端点归属（首根 14:30 与 15:00 那根含否会变占比读数）；
    卡池与判据册零该常数 ⇒ 一个数不编；本班探针用 [14:30,15:01) 仅作可达性证明，不作口径声明
  sign_claim_absent: ③席在册行 definition_zh 只给构造（sumIf/sum 占比）、orthogonal_gate_note 自陈『本列纯量维』『与 TDM-P-P3-04/02 尾盘强势（收益方向＋当日 H-L 区间位置）不同对象』＝有意不带收益方向 ⇒ 卡面正向/负向预期无在册来源，本席不代设；另须防与母卡 A02/02 的同假设两口径并计（母卡盘口深史若补齐则两卡同池，'同物两形禁各计一员'在册令属⑨席对拍）
  nonzero_sum_and_folding: ③席在册行自陈『折叠口径=本席临时全市场日均值（在册横截面折叠口径仍未裁＝呈批第1条承
    20261015-p03-02）』；本卡对象即"市场级日频序列"（定义本体），故 OD-19 那条"个股横截面折叠口径零源"不阻断本卡，
    但若 Owner 判本族应改做个股横截面＝换题面，须另立候选
