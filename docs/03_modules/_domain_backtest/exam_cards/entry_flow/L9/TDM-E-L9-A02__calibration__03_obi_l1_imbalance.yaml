  TDM-E-L9-A02/calibration/02 区分＝母卡对象是 9:15-9:25 集合竞价失衡＋尾盘主动买入占比，本卡对象是连续竞价全日一档量失衡；与 CAND-P0-CLOSEBAND-007 区分＝本卡用全日均值、后者用时段差（14:30-15:00
  − 全日）；与 CAND-P0-SLOPE-003 区分＝本卡仅第 1 档、后者全 5 档加权（③席在册禁双计声明）。条款：④席改良情报 3 在册约束两条写入假设：①OFI-价格关系线性斜率与市场深度成反比⇒失衡须除以深度再进信号，裸水平值在流动性分层的全
