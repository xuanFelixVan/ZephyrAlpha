  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: false
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.hl_funding_history
  signal_column: funding_rate
  signal_derivation: coin='BTC'（实测 coin 键为裸 ticker 'BTC'/'SOL'/'DOGE'，非 'BTC-USDT'）；
    每个 UTC 日取 3 期（00/08/16）均值；signal=该日均值的 30 日滚动分位
  target_source: c1_market.crypto_kline_daily symbol='BTCUSDT'（实测键格式带 USDT 且**无连字符**）
    close→next_day_return，trade_date 为 UTC 日界（沿用影子 MVP §7 固定口径）
  data_window_evidence: |
    命令原文：
      python -c "
      import sys; sys.path.insert(0,'scripts/backtest')
      from fexam.ch_data import ch_query_df
      print(ch_query_df(\"SELECT min(toString(trade_date)),max(toString(trade_date)),count() FROM c1_market.crypto_kline_daily WHERE symbol='BTCUSDT'\").values)
      print(ch_query_df(\"SELECT count() FROM c1_market.crypto_kline_daily WHERE symbol='BTC-USDT'\").values)
      print(ch_query_df(\"SELECT coin,count() FROM c1_market.hl_funding_history WHERE coin='BTC' GROUP BY coin\").values)
      print(ch_query_df(\"SELECT uniq(symbol),uniq(trade_date) FROM c1_market.crypto_kline_daily\").values)
      print(ch_query_df(\"SELECT shadow_tier,count() FROM c1_market.crypto_shadow_gate GROUP BY shadow_tier\").values)"
    实测：
      crypto_kline_daily symbol='BTCUSDT' 2025-08-08..2026-10-08 rows=431
      symbol='BTC-USDT'（影子 MVP 文档 §6 用的 OKX instId 写法）→ **rows=0**：
        落库键格式已换为无连字符（Binance 风格），文档与库不一致 ⇒ 本卡以库为准并登记该漂移
      hl_funding_history coin='BTC' 29392 期（与全表 uniq(funding_time)=29335 同量级，连续无大缺口）
      crypto_kline_daily 全表 uniq(symbol)=141、uniq(trade_date)=427（is_universe_eligible=1 者 139）
      crypto_shadow_gate shadow_tier 分组=**{'trend': 20}**（20 行全为同一档）
    关键负面读数（如实登记，不掩饰）：影子判定器设计为 off/normal/tightened 三态
      （MVP §7），但落库 20 日**只出现 'trend' 一档** ⇒ 三态判别力在现势数据上不可考
      （无组间差异可比），该结论挂给 TDM-C-L1 考试车道，本车道不代判。
    样本诚实声明：431 日、IS/OOS 各约 145 日、无牛熊两段 ⇒ 本卡结论级别=短窗预演，
      不足以支撑 confidence 升至 validated（建议回传 kept_watch）。
  readiness: PARTIAL——费率侧充分（2.9 万期），target 侧仅 431 日且无 regime 分段
