family: calibration
title_zh: 币圈镜像·资金费率拥挤对 BTC 次日收益校准卡（market=crypto，链单列）
hypothesis: 镜像 A15 同一算法面到币圈自身口径：BTC 永续资金费率的 30 日分位越高=多头杠杆越拥挤，
  其后 1-3 日 BTC 收益越低（拥挤反转）；横截面极端档（费率>90% 分位）的反转幅度应大于时序分位读数。
  与 02 卡的差别=**target 与交易制度完全不同**：本卡 target 是 BTCUSDT 自身收益，UTC 日界、7×24 无休市、
  无 T+1、无涨跌停，故 02 卡的 T+1 起算与一字板剔除门柱在本卡一律不适用（禁照搬）。
market: crypto
mirror_of: TDM-E-L9-A15/calibration/02_资金费率拥挤跨市场预警
window:
  in_sample:
  - '2025-08-11'
  - '2026-02-27'
  oos: &id001
  - '2026-03-02'
  - '2026-09-30'
  regimes:
    unavailable: 币圈行情实测仅 2025-08-08 起（431 日），无牛/熊两段可分 ⇒
      regime_same_sign 本卡置 false 并声明"未验证"，禁以震荡市冒充两段
  frozen_note: 看数前冻结；IS/OOS 按现有 431 日对半分（各约 145 日），属短窗预演，
    正式分布性结论须待 ≥500 日且含明确趋势段后重冻
buckets:
  type: quantile_quintile
  'on': BTC 资金费率 30 日分位（8h 期聚合到 UTC 日）
  min_obs_per_bucket: 40
pillars:
  response_monotonicity: 费率分位与 BTC 次日收益 Spearman 单调 rho>=0.6（预期负向，判绝对值）
  ic_floor: 日频 IC 均值 |IC|>=0.02（series 面 ic_ir 执行器置 None，如实 n/a）
  lag_profile: t+1..t+3 |IC| 峰值档与半衰期；7×24 市场无隔夜跳空缓冲，预期半衰期 <=2 日
  extreme_reversal: 费率 >90% 分位日的后 1-3 日 BTC 收益均值应 <= 0（拥挤反转核心读数）
  funding_period_alignment: 8 小时结算锚定（UTC 00/08/16），日聚合须右闭，禁把当日未结算费率当已落定
  no_t1_gate: 本卡无 T+1/涨跌停门柱（币圈制度不同）；02 卡的两条 A 股适配门柱不得继承
target:
  primary: btc_next_day_return（crypto_kline_daily symbol='BTCUSDT' close→次日收益，UTC 日界）
  secondary: btc_next_3day_return（3 日累计）
  note: 与 02 卡（target=沪深300 次日收益）严格分离；两卡结论不得互相代填
