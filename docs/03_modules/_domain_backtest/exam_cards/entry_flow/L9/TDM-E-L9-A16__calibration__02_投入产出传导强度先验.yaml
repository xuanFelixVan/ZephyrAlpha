preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
  incremental_r2_min: 0.01
oos_window_ref: *id001
data_binding:
  signal_table: PG:ig_io_edge（非 CH，depgraph 图谱域）
  signal_column: coefficient（直接消耗系数）
  signal_derivation: 153 部门直接消耗系数矩阵 → 映射到申万/同花顺行业 → 上游景气冲击×系数=下游强度
  target_source: v_kline_sector_880_named（period='1d'）板块 20 日前向收益
  data_window_evidence: |
    命令原文（两路正查）：
      python -m zephyr.library.lookup "投入产出" --limit 6
      python -c "
      import sys; sys.path.insert(0,'scripts/backtest')
      from fexam.ch_data import ch_query_df
      print(ch_query_df(\"SELECT database,table FROM system.tables WHERE lower(table) LIKE '%io_edge%' OR lower(table) LIKE '%input_output%'\").values)"
    实测：
      CH 侧筛 %io_edge%/%input_output% = **(none)** ⇒ IO 系数不在 ClickHouse（在 PG depgraph 图谱域，
        与 A 档其余源线不同载体，本卡 target 与 signal 分属两套存储=接线前置工程）
      TDM-E-L9-A16 algo_note_zh 在册事实：DS 锚=IO_TABLE（国家统计局），U3=static，
        pit_proof=统计口径年份锚定（2020 版 153 部门）
      TDM-E-L9-G5（同源图谱面）在册头号缺口：**"部门码与 ig_node 两套 id 体系，边 100% 挂零
        （altdata_line WP-0.5）"** ⇒ 系数矩阵存在但无法挂到公司/板块节点
    缺什么（写死，blocked_on_impl 的"缺"）：
      缺部门码↔ig_node/880 板块的映射桥（一张对照表 + 消歧规则）；桥未建 ⇒ 强度信号无法落到
      可交易横截面单元，考试取数接线不可完成。真源=scripts/industry_graph/apply_industry_graph_ddl.py
      （G1 注在册）。
    解锁条件：WP-0.5 部门 id 桥建成并有 ≥100 个部门成功挂接（挂接率读数入台账），随后改
      status=preregistered 重冻窗口。
  readiness: BLOCKED——结构先验无法挂到横截面单元（impl 缺，非数据缺）
