hypothesis: 日内分钟收益的二阶自相关（跨两步的路径记忆维）与一阶自相关测的不是同一件事：一阶看相邻 bar 的符号继承，本卡看隔一步的记忆（同向延续／均值回复在滞后 2 上的强度），归一掉波动量级、只测时序排布。本卡检验该个股×交易日 panel 面对次日个股收益是否构成在册五键可判的关系。符号方向③席在册行未声明、本席不预设（example 读数 −0.003690 系③席过闸投影面的市场日均值，非卡面预期）。 ③席在册定义原文逐字（禁改写）：日内分钟收益二阶自相关（跨两步的路径记忆维）＝按 symbol×trade_date 取分钟 r_i=ln(C_i/O_i) 按 trade_time 升序排数组，a=r[1..n-2]、b=r[3..n]，手写皮尔逊闭式 rho=(m·Σab−Σa·Σb)/sqrt((m·Σa²−(Σa)²)(m·Σb²−(Σb)²))，m=n−2；交付形态=横截面 panel（每股每日一值），本行 example 读数=全市场日均（仅供过闸投影，非交付口径）。TDM 归属＝TDM-E-L9-A02 源线·Tick分笔（节点 dq＝日内微观结构能否预测次日方向与冲击成本）；非 TDM-E-L4-02 买入时序（该节点 dq＝今天什么窗口下单，属执行选型面不属预测子面）
