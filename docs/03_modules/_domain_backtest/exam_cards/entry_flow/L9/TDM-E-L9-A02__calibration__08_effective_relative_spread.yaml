schema_version: '1.0'
card_id: TDM-E-L9-A02/calibration/08_effective_relative_spread
node_id: TDM-E-L9-A02
family: calibration
title_zh: 楼1盘口微结构·CAND-P0-SPREAD-005 有效相对价差＋一档深度联合档（tick_depth_5 定义级具名子题卡·数据面 blocked_on_data）
origin: P0-楼1-楼内要点"spread"补全|20261015-p03-01
hypothesis: 有效相对价差=（ask_price1−bid_price1）/（（ask_price1+bid_price1）/2）取日中位数；配深度联合档=（bid_volume1+ask_volume1）/当日成交额；用途=盘口流动性状态预测次日冲击成本与反转（③席
  CAND-P0-SPREAD-005 定义原文逐字引，真源=data/strategy_intake/lane_p0_obi_candidates.csv，birth_batch=20261015-p03-01）。本卡答节点决策问题「日内微观结构能否预测次日方向与冲击成本？」——价差与深度联合档对应其中『冲击成本』一问。跨楼共线声明逐字承接③席在册行：『与
  6 楼流动性族 Amihud 属不同对象（逐笔盘口 vs 日线额量）入池须双楼对拍』。④席改良情报 3 频率登记：本卡所考频率＝tick_depth_5 表原生 3 秒快照取日中位数，禁拿分钟级读数冒充 tick 级预测力。
window:
  in_sample:
  - '2026-01-05'
  - '2026-06-30'
  oos: &id001
  - '2026-07-01'
  - '2026-09-30'
  regimes:
    unavailable: 牛/熊两段均无 tick 历史（数据起 2026-01-05），regime_stability 本卡无法执行—— 解锁前该支柱视为未验证而非通过
  frozen_note: 看数前冻结；窗口按现有 tick 覆盖切，属"短窗预演"不作分布性结论，正式考试须待历史补齐后重冻
buckets:
  type: quantile_decile
  'on': 当日有效相对价差与一档深度联合档（横截面）
  min_obs_per_bucket: 60
signal_kind: panel
pillars:
  orthogonalization: 信号必须先对当日 pct_change 与 20 日动量做横截面回归取残差； 主判据只在残差序列上算（否则与本车道 A01 动量卡重复计分）
  response_monotonicity: 残差分桶中位前向收益 Spearman 单调 rho>=0.6
  raw_vs_resid_gap: 原始信号 IC 与残差信号 IC 之差登记入台账（差值大=资金流口径污染动量，是数据质量结论）
  resid_pillar_inherited_from: 逐字抄自 TDM-E-L9-A06/calibration/02（preregistered 同族残差化柱三件），本席不改一柱文字
  sample_window_from_candidate: 同楼 24 交易日；切点前 0 行 ⇒ blocked_on_data；l2_tick 实测 count()=0（min/max 返回 1970-01-01 哨兵）⇒
    更细逐笔委托价差不可得
  orthogonal_gate: 闸未开（退出码=2）；跨楼共线声明：与 6 楼流动性族 Amihud 属不同对象（逐笔盘口 vs 日线额量）入池须双楼对拍
  degradation_clause: 降级条款两条逐字取③席在册行：①『l2_tick 实测 count()=0（min/max 返回 1970-01-01 哨兵）⇒ 更细逐笔委托价差不可得』；②『本表无 quality_flag
    判别信息（恒 1）』⇒ quality_flag=1 过滤为空操作，禁当质量门引用
target:
  primary: next_day_stock_return（个股次日 hfq 收益）
  secondary: next_day_limit_up_probability（次日涨停概率，情绪极端面）
  note: target 三面逐字继承同域在册 preregistered 件 TDM-E-L9-A06/calibration/02 的 target 块；本席不自拟列名与常数
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
status: blocked_on_data
status_reason: 信号表 tick_depth_5 在闭卷切点前零行（本班自测（zephyr.data.ch_reader.query_rows，2026-10-15 08:0x）：tick_depth_5 覆盖
  2026-07-24..2026-10-14／130,283,635 行／24 交易日／8,763 符号；trade_date<'2025-09-09' 命中 0 行（与③席 20261015-p03-01 台账读数逐项同值＝双证）），而本卡机判窗继承同族母卡
  L9-A02/02（IS 2026-01-05..2026-06-30 在本表亦零行）⇒ 结构不可考，非判据问题；⑩席第三单 §6 派给本卡的『残差化与降级条款门柱』本班已落面（残差三柱逐字抄 A06/02、降级两条款逐字抄③席行），残余无源项＝价差档的截面分位阈值（③席自陈分档阈值禁自拟）→
  见⑥席 1015-04 班台账 OD-16。
gaps_no_source:
  spread_bucket_threshold: 有效相对价差的档位阈值在卡池与判据册零源（③席在册原文『分档阈值禁自拟』）⇒ OD-16
  oos_subsegment_caliber: 同 OD-15（⑨席对照申请的 OOS 分段口径全池零机读源）
  regime_fivekey_applicability: 同 OD-17（盘口族是否适用 IC 五键＝③席在册待裁项）
