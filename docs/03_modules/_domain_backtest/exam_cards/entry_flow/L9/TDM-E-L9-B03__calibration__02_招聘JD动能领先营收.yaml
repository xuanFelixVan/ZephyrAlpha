    合规注：抓取型渠道（智联）涉对外发布/爬取合规，属 Owner 法律合规门位（宪法 §5 二类），
      本车道只立判据不做接入决策。
  readiness: BLOCKED——渠道未接 + 主体归并桥未建（双缺）
