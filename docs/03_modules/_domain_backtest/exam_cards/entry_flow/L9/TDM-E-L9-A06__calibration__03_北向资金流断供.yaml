family: calibration
title_zh: 源线·资金流·北向/陆股通净买入校准卡（2024-08-16 断供）
hypothesis: 陆股通北向净买入（及其占成交额比）分桶对次日指数/大盘蓝筹收益有正预测力，且情绪极端
  （大幅净流出档）后一日有均值回复。信号定义冻结完好，但 CH 侧该表于 2024-08-16 停止更新 ⇒
  blocked_on_data 不弃，且缺段写死。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2024-08-16'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
    oos_note: OOS 段被断供截断为 2024-01-01..2024-08-16（仅 158 个交易日）——解锁前 OOS 判据视为未成立
  frozen_note: 看数前冻结；断供日之后禁以估算/插值补数（数据驻留公理+防伪造）
buckets:
  type: quantile_decile
  'on': 当日北向净买入占两市成交额比
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分桶中位前向指数收益 Spearman 单调 rho>=0.6
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日
  regime_stability: 牛/熊两段 IC 同号
  extreme_reversal: 最低两档（大幅净流出）次日收益均值应 >= 0（恐慌外溢的均值回复，辅读数）
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: next_day_bluechip_spread（沪深300 对中证2000 次日收益差，北向偏蓝筹的结构检验）
  note: A06 决策问题的"外资"支线；主线见 02 卡（money_flow）
status: blocked_on_data
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L9-A06.confidence
