discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.hk_connect_flow
  signal_column: net_buy_amount
  signal_derivation: signal_t = net_buy_amount / (c1_market.kline_daily 全市场 amount) 当日比；
    channel 维度（沪股通/深股通）分别构造后再加总，禁跨 channel 直接 mean
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: |
    命令原文：
      python -c "
      import sys; sys.path.insert(0,'scripts/backtest')
      from fexam.ch_data import ch_query_df
      for t in ['c1_market.hk_connect_flow','c1_market.northbound_hold_snapshot']:
        r=ch_query_df(f'SELECT min(toString(trade_date)),max(toString(trade_date)),count(),uniq(trade_date) FROM {t}');print(t,r.values)"
    实测：
      c1_market.hk_connect_flow          trade_date 2014-11-17..2024-08-16 rows=4052 days=2264
      c1_market.northbound_hold_snapshot trade_date 2024-09-30..2026-06-30 rows=57458 days=8
    缺哪张表哪一段：hk_connect_flow 缺 2024-08-19 至今（约 270+ 交易日零行）；
      持股快照表虽有到 2026-06-30 的名称但**独立日期仅 8 个**（每季末快照级，无日频）⇒
      无法构造日频信号。战役统一 IS 窗（2019-01-04..2023-12-31）在 hk_connect_flow 上其实是覆盖的，
      因此本卡的阻断点是 **OOS 段断供**，即"IS 可算、现势不可得"——按作业簿 §3⑥ 标 blocked_on_data
      而非弃卡，因为无 OOS 的卡不可运行判据（oos_same_sign 恒 nan→judge 判 fail 无意义）。
    同型在册先例：c1_market.limit_up_down 仅 2026-07-20 起 5397 行（广度面冻结窗无数据）。
    解锁条件：接入交易所披露口径变更后的替代高频北向代理（如 hk 侧成交回填），属数据源立项非本车道权限。
  readiness: BLOCKED——OOS 段零覆盖，仅有 IS 段不可单跑
