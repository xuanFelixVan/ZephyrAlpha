data_binding:
  signal_table: c1_market.hl_funding_history
  signal_column: funding_rate
  signal_derivation: 每 8h 结算一行；crowding_t = 主要币（BTC/ETH/SOL/XRP 等流动性前档）
    funding_rate 的横截面 60 日分位加权均值，按 UTC 日聚合；funding_rate 为 Nullable(Decimal(28,14))
    ⇒ NULL 必须显式剔除（否则加权均值静默偏）；premium 列为备援读数
  target_source: kline_index 000300 close→next_day_return（A 股侧）
  data_window_evidence: |
    命令原文：
      python -c "
      import sys; sys.path.insert(0,'scripts/backtest')
      from fexam.ch_data import ch_query_df
      print(ch_query_df(\"SELECT min(toString(funding_time)),max(toString(funding_time)),count(),uniq(funding_time) FROM c1_market.hl_funding_history\").values)
      print(ch_query_df(\"SELECT DISTINCT coin FROM c1_market.hl_funding_history LIMIT 15\").values)
      for t in ['c1_market.hl_perp_snapshot_daily','c1_market.hl_oi_snapshot_daily','c1_market.hl_liquidation_raw']:
        r=ch_query_df(f'SELECT count() FROM {t}');print(t,int(r.iloc[0,0]))"
    实测：
      c1_market.hl_funding_history funding_time 2023-05-12..2026-10-09 rows=4785877 期数=29335
        （8h 期数自 2023-05-12 起算 ⇒ 折算日频约 1240 天，样本充分）
      coin 面为多币种（含 ADA/ALEX/ALGO/ALT 等长尾小币），构造拥挤度须先按流动性定档，
        禁把长尾小币与 BTC 等权（本卡门柱之一）
      c1_market.hl_perp_snapshot_daily rows=4212（snapshot_date 2026-09-18..2026-10-09，**仅 18 日**）
      c1_market.hl_oi_snapshot_daily   rows=4212（同上 18 日）
      c1_market.hl_liquidation_raw     rows=**17**（近乎空表）
    ⇒ OI/清算两条读数路径均断供，本卡只能用 funding_rate 单腿；"费率+OI"双因子版登记为长尾，
      解锁条件=perp/OI 快照持续采集 ≥250 日。
  readiness: IS 约 390 交易日 + OOS 约 165 日，可算；牛段不可考已声明
