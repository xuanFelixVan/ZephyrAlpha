title_zh: 源线·加密永续/费率·全球杠杆拥挤对 A 股风险偏好跨市场预警校准卡（market=cn_a）
hypothesis: Hyperliquid 永续资金费率的横截面拥挤度（BTC/ETH 等主要币费率的分位数加权，
  8 小时结算锚定）度量全球杠杆多头拥挤；极端拥挤后回落对**次日 A 股指数收益为负**
  （风险偏好跨市场传导）。本卡口径=A 股消费面（节点 market=cn_a），币圈自身收益面另立镜像卡，
  两卡 target 严格分离禁共用。
window:
  in_sample:
  - '2023-05-15'
  - '2024-12-31'
  oos: &id001
  - '2025-01-02'
  - '2025-09-09'
  regimes:
    bear_tail: 2023-05-15..2024-02-05（贴现率熊末+微盘出清，IS 内熊段）
    recovery: 2024-02-06..2024-12-31（修复段，IS 内对侧）
    bull_note: 资金费率实测起 2023-05-12 ⇒ 战役统一牛段（2019-2021H1）不可考，已声明不冒充；
      本卡 regime 用数据内可分的熊末/修复两段替代
  frozen_note: 看数前冻结；8 小时锚定与"右闭聚合"（pit_proof：资金费率 8 小时周期锚定）写死
buckets:
  type: quantile_decile
  'on': 当日拥挤度读数（费率横截面加权分位）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 拥挤度分桶与次日指数收益 Spearman 单调 rho>=0.6（预期高拥挤档负向）
  ic_floor: 日频 IC 均值 |IC|>=0.02（series 面 ic_ir 执行器置 None，如实 n/a）
  lag_profile: t+1..t+3 |IC| 峰值档与半衰期（跨市场风险传导预期 <=2 日，长于此=与美股共线须正交化）
  regime_stability: bear_tail/recovery 两段同号
  extreme_crowding_reversal: 拥挤度分位 >90% 的当日组，其后 1-3 日指数收益均值应 <= 0
    （预警价值集中在极端档，这是本节点最有决策意义的读数）
  us_decoupling: 对 FRED_VIX 与美股隔夜收益（c1_market.us_index）正交化后 IC 仍 >= 0.015
    —— 否则判"只是美股影子，无独立信息"（跨市场卡的核心防伪结论门柱）
target:
  primary: next_day_index_return（CSI300 次日收益，**A 股口径，禁与镜像卡共用**）
  secondary: next_3day_index_return（3 日累计，读传导持续性）
  note: A15 决策问题=「全球杠杆拥挤能否跨市场预警A股情绪」
