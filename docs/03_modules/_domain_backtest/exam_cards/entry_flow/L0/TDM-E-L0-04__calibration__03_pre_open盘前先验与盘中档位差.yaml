discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: -0.6
  ic_mean_min: -0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
numeric_face_mapping_note: >-
  机判映射先验冻结：mono_spearman=(档位差十分位秩 [1=最乐观 ... 10=最悲观],
  该桶中位次日收益秩) <=-0.6；
  ic_mean/ic_ir 读"当日 14:30 档位差"对"次日 CSI300 close-to-close 收益"的日频 Spearman；
  两段同号（都 <=0）、OOS 同号；n 不足判 nan=fail。
oos_window_ref: *id001
data_binding:
  signal_table: >-
    c1_market.emotion_index（stage='pre_open' 严格过滤，§3 在册 10 月唯一可得腿） +
    c1_market.kline_etf_1min（510300 分钟代理盘面） +
    c1_market.kline_index（000300 目标 + 指数核对）
  signal_column: >-
    emotion_index.emotion_index（pre_open 段档，映射 8 态悲观序的先验档）；
    kline_etf_1min.close @ 10:00/11:00/13:30/14:30（对当日 open 的比值 = 盘中观测）；
    kline_index.close（000300，T+1 目标）。
  signal_derivation: >-
    先验档 = 每日盘前 emotion_index@stage='pre_open' 的 emotion_index 分量映射至 8 态悲观全序（蓝图 §2 序数）；
    盘中修正 = intraday_tomorrow_forecast.py 组合器（src/zephyr/plan_engine/intraday_tomorrow_forecast.py,
    MOD-PLAN-025，实测存在，纯函数核零 IO）
    以 510300 分钟盘面截至 t 时点为输入 + 相似日检索（src/zephyr/signal_ashare/ml_forecast/similar_day_inference.py,
    MOD-SIG-063，实测存在） + Brier 降权（src/zephyr/plan_engine/brier_calibration.py, 实测存在），
    融合出 t 时点的 8 态最可能档；
    档位差 = 14:30 融合档序 − 先验档序（>=1 即预警候选，本卡不用二值而用连续差值做十分位响应曲线）；
    **本卡全链禁读 emotion_index WHERE stage='close_final'**（§3 在册 0 行）。
  target_source: "kline_index 000300 close→shift(-1) next_day_return（现执行器 _series_metrics 硬编码 shift(-1) 兼容）"
  data_window_evidence: >-
    §3 在册事实直引（禁自创数字，本 21:00–22:30 窗禁 CH 重查询）：
    `c1_market.emotion_index` 10 月**仅 pre_open 腿**、`stage='close_final'` 行数=0（候 QMT 终端复元）；
    pre_open 具体覆盖窗/总行数/逐年分布 = **待总包 22:30 后实测**
    （建议复核 SQL 原文：
    `SELECT min(trade_date), max(trade_date), count() FROM c1_market.emotion_index WHERE stage='pre_open'`；
    `SELECT toYear(trade_date), uniqExact(trade_date) FROM c1_market.emotion_index WHERE stage='pre_open' GROUP BY toYear(trade_date) ORDER BY y`）；
    盘中代理面与夜矿 L3 卡同引用 kline_etf_1min=2021-07-01..2026-10-09 / 292,584,491 行 / 1,699 symbols
    （在册实测，见 TDM-E-L0-04__comparison__02 data_window_evidence 与本车道台账 §1）；
    kline_index=1990-12-19..2026-10-09 / 3,104,162 行 / 1,097 symbols（在册）；
    实现件实测存在（本车 ls 核实）：src/zephyr/plan_engine/intraday_tomorrow_forecast.py、
    src/zephyr/plan_engine/brier_calibration.py、
    src/zephyr/signal_ashare/ml_forecast/next_day_8state_forecast.py（TDM algo_note_zh 记名 next_day_8state_forecast 真实路径，非 plan_engine）、
    src/zephyr/signal_ashare/ml_forecast/similar_day_inference.py（同上）；
    emotion_index stage 常量 STAGE_PRE_OPEN/STAGE_CLOSE_FINAL 实测于 src/zephyr/alt_data/emotion_index_builder.py:69 __all__ 行。
  pre_open_leg_binding: >-
    本卡 preregistered 的合法性前提=pre_open 段覆盖 IS/OOS 全窗；若 22:30 后实测显示
    pre_open 也仅在 2026-10 起有段（历史段=close_final 或另有 stage 命名），
    本卡须由总包另建 blocked_on_data 姊妹卡（不改本件，因禁改已存在文件），
    窗口与判据不动。此风险本车道如实登记，交 T4 监听车道与总包处置。
