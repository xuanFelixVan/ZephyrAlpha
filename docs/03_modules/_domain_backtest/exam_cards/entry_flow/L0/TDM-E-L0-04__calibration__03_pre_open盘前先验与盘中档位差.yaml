schema_version: '1.0'
card_id: TDM-E-L0-04/calibration/03_pre_open盘前先验与盘中档位差
node_id: TDM-E-L0-04
family: calibration
title_zh: 盘前先验档 vs 盘中 8 态融合档·档位差响应曲线校准卡（仅绑 pre_open 腿，QMT 断供期不依赖 close_final）
origin: tdm_algo_note_l0_04
hypothesis: >-
  以 c1_market.emotion_index@stage='pre_open'（任务书 §3 在册 10 月唯一可得腿）为盘前先验档，
  与 intraday_tomorrow_forecast 组合器在 10:00/11:00/13:30/14:30 四时点用最新盘面（ETF 510300
  分钟代理 + L1-S5 盘中水温读数）修正后的 8 态融合最可能档做序数差；
  "融合档比先验档悲观 >=1 档"的档位差越大，次日（shift(-1)）CSI300 指数收益越低——
  十分位分桶上响应曲线单调，且高悲观差桶的次日收益均值显著为负。
  本卡只绑 pre_open 段与盘中盘面，**不依赖 close_final**（§3 在册 close_final=0，本卡与 QMT 断供正交）。
window:
  in_sample:
  - '2021-07-01'
  - '2025-09-30'
  oos: &id001
  - '2025-10-09'
  - '2026-06-30'
  regimes:
    bull: 2021-07-01..2021-12-31（暖机后首段，标签按沪深300 区间收益符号开考前机械复核）
    bear: 2022-01-01..2022-12-31（同规则）
  frozen_note: >-
    窗口与夜矿 L3 车道 comparison__02 同钉（kline_etf_1min 实测起点 2021-07-01 与
    ch_data.WINDOW_HOLDOUT 2025-10-09..2026-09-30），本卡 OOS 终点 2026-06-30；
    8 态悲观档位序（蓝图 §2）与">=1 档即预警"阈值逐字取 algo_note_zh，卡内禁改；
    盘中价代理=510300 ETF 分钟收盘对当日开盘的比值（代理误差先验声明 <0.2%/日量级，开考前实测复核）；
    事后挪门柱=作废（G4-5）
buckets:
  type: quantile_decile
  'on': 每日 14:30 时点档位差（融合最可能悲观档序 − 先验档序；序数差非概率差）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 十分位分桶上（1=最乐观差 ... 10=最悲观差）中位次日收益 Spearman 单调 rho<=-0.6（悲观差越大次日越弱，方向已定）
  ic_floor: 日频 IC（档位差 vs 次日收益）均值 <=-0.02 且 IC_IR >=0.3（绝对值口径，同号判同）
  lag_profile: t+1（次日）为峰值；t+2/t+3 半衰期 >=1 交易日（Lou-Poli-Gao 隔夜延续先验的仓内复核）
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor（响应曲线不因 regime 反号）
  pre_open_only_purity: 全链 signal 只读 emotion_index WHERE stage='pre_open'，
    禁触 stage='close_final'（§3 在册 close_final=0；违例=整卡作废）
target:
  primary: next_day_csi300_return（shift(-1) 兼容现执行器 _series_metrics 硬编码）
  secondary: 四时点档位差的响应曲线单调差（10:00 vs 14:30 的 IC 差=盘中信息增量）
  note: 与夜矿 L3 comparison 族不同轴——本卡只校"先验差→次日收益"的响应曲线，不构造反事实三臂
status: blocked_on_data
status_correction_note: |
  2026-10-10 22:0x 总包实测（命令原文：SELECT stage, count(), min(toDate(trade_date)), max(toDate(trade_date))
  FROM c1_market.emotion_index GROUP BY stage）：pre_open=27 行（2026-09-01..2026-10-09）、
  auction=17 行、close_final=8,617 行但止于 2026-09-30。
  ⇒ 本卡立卡前提"pre_open 为 10 月唯一可得腿"字面成立但**样本量 27 日撑不起 IS/OOS 与每桶 ≥60 观测**，
  按红线"断供面禁硬考"改判 blocked_on_data。判据四键（window/buckets/pillars/pillars_numeric/target）
  零改动，本行仅改 status 并留取证（挪门柱=作废纪律不受触碰）。
  解锁判据：pre_open 段累计 ≥ 500 个交易日且 IS 窗覆盖完整（QMT 复元后由数据解锁监听车道复测）。
