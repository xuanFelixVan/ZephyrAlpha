schema_version: '1.0'
card_id: TDM-E-L3-03-1/calibration/02_涨停基因
node_id: TDM-E-L3-03-1
family: calibration
title_zh: "短线池·涨停基因（历史涨停频次）校准卡"
hypothesis: "过去 60 个交易日的涨停次数（涨停基因）越浓，次日 T+1 可成交前向收益越高，涨停次数截面分位对次日收益单调正向；但极浓档（>=6 次）反向（老妖股透支）。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "60 日滚动涨停次数（0/1/2/3/4-5/6+ 六档 + 截面十分位双轨）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "十分位中位前向收益单调（rho>=0.6），且六档版出现 6+ 档拐点（记为倒 U，需单独留痕不算违约）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+1 峰值、t+2/t+3 半衰期>=1 交易日（涨停基因的溢价兑现极快，衰减慢=判据不成立）"
  regime_stability: "牛/熊两段同号且均过 ic_floor；冰点段（情绪冰点日）单独报出 IC 是否翻负"
  one_word_exclusion: "一字板涨停（open=high=low=close 且收盘=涨停价）次日不可成交，基因计数保留但前向收益样本须剔除（否则高估溢价）"
  min_limit_events: "窗内涨停事件 symbol-day 总数 >=20,000（实测单日截面 5,199 符号可判，涨停日均 74-893 家）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "5 日同口径前向收益（检验基因是否只是隔日噪声）"
  note: "短线池 5 分制第一分（涨停基因 1 分）的可判数值面"
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L3-03-1.confidence
preregistered_by: st-nightmine-20261010-L2
preregistered_at: '2026-10-10'
discipline: "冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger"
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.stk_limit × c1_market.kline_daily"
  signal_column: "limit_up（不复权 close 对比阈值）"
  signal_derivation: "涨停判定=kline_daily.close >= stk_limit.limit_up − 0.011（同日同符号 argMax(ingest_ts) 去重，两表同日 P1T 对齐）；signal=该符号过去 60 个交易日的涨停日数（一字板计入基因、剔除其收益样本）；截面分位在宇宙内做，ST/退市风险票按 universe_rule 剔出"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sl：stk_limit 2015-01-05..2026-10-09/9,254,772 行/5,831 符号/2,857 日，2023-06-05 单日 5,199 符号唯一；封板实证 74/893 家；量纲陷阱：limit_up 为不复权价，配 kline_daily_hfq 会把同日照出 3,882 家涨停的荒谬值（实测已记录）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov5.py C1-C3 / l2_backend.py）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.stk_limit → 2015-01-05 / 2026-10-09 / 9,254,772 行 / 5,831 符号 / 2,857 日；2023-06-05 单日 5,199 行=5,199 唯一符号（PIT 无重复）；判据实证：封板家数 close>=limit_up-0.011 → 2023-06-05=74、2024-10-08=893；炸板家数 high>=limit_up-0.011 且 close<limit_up-0.011 → 2023-06-05=23、2024-10-08=2,268；一字板 open=high=low=close 且 close>=limit_up-0.011 → 2024-10-08=41/5,355。量纲陷阱：limit_up 为不复权价，必须配 c1_market.kline_daily（不复权），若配 kline_daily_hfq 则同日误判 3,882 家涨停。"
