data_binding:
  signal_table: "c1_market.dragon_tiger_seat"
  signal_column: "net_amount,seat_type,seat_name,reason"
  signal_derivation: "席位组=seat_type='institution' 直接判机构；游资/拉萨由 seat_name 文本匹配白名单（写死清单）；signal=该组净买额（同 symbol-day 同组求和）截面分位；样本=窗内上榜 symbol-day（实测 2022=14,589/2023=12,908/2024=18,111 symbol-day）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@dts：dragon_tiger_seat 实测 2022-01-04..2026-10-09/622,365 行/5,998 符号/1,152 日；seat_type 枚举实测=broker 562,116/institution 39,250/connect 20,999（无游资专用枚举→必须走 seat_name 文本）。资产状态另行查核：python -m zephyr.library.lookup state 龙虎榜席位 输出已在既有台账/§5 摘录。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt / l2_ch_cov5.py H1/H2）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.dragon_tiger_seat → 2022-01-04 / 2026-10-09 / 622,365 行 / 5,998 符号 / 1,152 日；按年上榜 symbol-day：2022=14,589、2023=12,908、2024=18,111、2025=16,352；seat_type 枚举实测=broker 562,116 / institution 39,250 / connect 20,999（游资一线与拉萨系需由 seat_name 文本判定）→ 缺段=2019-01-04..2021-12-31。"
