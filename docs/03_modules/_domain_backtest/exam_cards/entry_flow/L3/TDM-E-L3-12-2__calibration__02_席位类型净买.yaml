missing_segment: "2019-01-04..2021-12-31 无 dragon_tiger_seat 行（0 行）"
unlock_condition: "席位历史回填至 2019-01-04 + seat_name 白名单落册（SEAT-* 六个在册机构需与文本清单对齐）后转 preregistered"
