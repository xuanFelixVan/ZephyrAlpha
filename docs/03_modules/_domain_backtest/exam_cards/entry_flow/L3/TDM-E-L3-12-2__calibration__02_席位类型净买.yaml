node_id: TDM-E-L3-12-2
family: calibration
title_zh: "龙虎榜席位·席位风格与次日溢价校准卡"
hypothesis: "上榜标的按席位风格分组：知名游资（一线席位）净买=次日接力溢价高、机构专用席位净买=中线收益好、拉萨系（散户大本营席位）净买=次日溢价差，席位类型净买分位对次日收益单调正向。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "席位组（一线游资/机构专用/拉萨系/其他）×净买额分位双轴"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "组内净买分位单调（rho>=0.6）；组间排序须为 一线游资>机构>其他>拉萨（次日口径）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "次日（接力）与 5 日（中线）两期分别建 IC，两期峰值席位应不同"
  regime_stability: "牛/熊两段同号且均过 ic_floor"
  seat_name_rule: "一线游资与拉萨系无枚举列，需 seat_name 文本白名单（如 东方财富证券拉萨 系列）——白名单须在卡内写死并可复核，禁运行时自由裁量"
  reason_field: "reason 列（上榜原因）须分组，涨停上榜与非涨停上榜不可混样"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "5 日前向收益（机构组主判）"
  note: "席位维（四维验证子 2）；seat_refs 在册六个 SEAT-INST/YOUZI 机构"
