  regime_stability: "牛/熊两段同号且均过 ic_floor"
  time_slot_split: "节点原文的黄金窗口 9:30-10:00 与 10:00-10:30 须分档判，合并即丢失该环判据"
  tail_quality: "14:30 后拉升单独成档（在册结论=尾盘偷袭板质量差）"
