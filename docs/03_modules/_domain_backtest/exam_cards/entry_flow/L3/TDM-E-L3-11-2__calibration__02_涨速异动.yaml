  signal_column: "close,volume,trade_time"
  signal_derivation: "涨速=5 分钟 close/前一根 close−1；量比=该 5 分钟 volume/同期过去 20 个交易日同 5 分钟均量；signal=涨速×量比联合分位（涨速>2% AND 量比>3 为命中）；须按 trade_time 精确分档"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@m5：SELECT min(trade_time),max(trade_time),count() FROM c1_market.kline_5min → 2021-09-01 09:35:00/2026-10-09 15:00:00/296,122,159 行（列实测=[open/high/low/close/volume/amount/trade_time/exchange/symbol/symbol_canonical/data_source/ingest_ts]）→ 缺 2019-01-04..2021-08-31，即 IS 前 2/3。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov4.py）：c1_market.kline_5min 列=[open/high/low/close/volume/amount/trade_time/exchange/symbol/symbol_canonical/data_source/ingest_ts]；SELECT min(trade_time),max(trade_time),count() → 2021-09-01 09:35:00 / 2026-10-09 15:00:00 / 296,122,159 行 → 缺段=2019-01-04..2021-08-31（IS 前 2/3）。"
