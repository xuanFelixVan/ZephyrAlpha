  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@ti：technical_indicator 筹码相关列实测=chips_avg_cost/chips_cost_5/15/85/95/chips_winner/conc_70/conc_90（无分布直方图列）；@sdb：流通股本 float_share 实测 2021-01-04 起（IS 前两年缺）。资产状态另行查核：python -m zephyr.library.lookup state 单峰密集 / 获利盘 输出摘录见台账 §5（含命中的 strategy_intake 件与 chips 族 commit 7963211f1ad）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.py / l2_ch_cov5.py B1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.technical_indicator → 2019-01-02 / 2026-09-30 / 404,675,630 行 / 14,357 符号 / 1,880 日；去重后 symbol-day 2019=647,746、2020=749,678、2021=823,409、2022=868,408、2023=901,509、2024=910,208、2025(至09-09)=632,574；chips_winner>0 的 symbol-day 与 symbol-day 几乎相等（2019=627,292/2023=901,502/2024=910,203）——原始行含多版本（2024 raw 29,787,404 行），不去重会把 IC 样本放大 30 倍，读数必须 argMax(ingest_ts) 或 FINAL。 ‖ 实测（l2_ch_cov.txt）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.stock_daily_basic → 2021-01-04 / 2026-10-09 / 7,118,522 行 / 5,785 符号 / 1,395 日；分窗 countIf：IS 段（<=2023-12-31）=3,492,273、OOS 段=2,200,180 → 缺段=2019-01-04..2020-12-31（整整两年 IS 无市值/流通股本/换手率）。"
