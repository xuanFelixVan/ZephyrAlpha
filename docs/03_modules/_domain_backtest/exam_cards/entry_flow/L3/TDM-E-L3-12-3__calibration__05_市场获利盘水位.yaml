hypothesis: 市场获利盘水位 M_t=全市场 chips_winner 截面中位数（存量供给读数）：M_t 高位=止盈供给积聚→次日 指数收益承压；M_t 低位=深套出清、抛压枯竭→次日收益偏强。即 M_t 与 000300 次日收益负相关；
  反向读数 −M_t 分桶单调（−M_t 越高档次日收益越高）。与 02 卡（panel 逐票二维联合）同列不同问： 02 问个股截面上获利盘×集中度的选股面，本卡问市场级水位对指数次日收益的择时面（挖矿册 1_A_structure §3.1
  首卡走 series 通道设计）。
window:
  in_sample:
