  五键
criteria_provenance: 判据预冻结推导链（看任何前向结果前定稿）：①量级照抄仓内冻结惯例——全卡册 pillars_numeric 实测分布 ic_mean_min=0.02（220 张）／mono_spearman_min=0.6（217
  张）／ic_ir_min=0.3（219 张），即'机构对标地板'（月频 |IC|>=0.02 起评档文献口径同量级，日频在册惯例 0.02），本卡五键与两融 07 卡（同域资金面 series 先例）同集同值；②方向同构处理——本卡假设为负向（M_t
  高→次日承压）而执行器校准判官的门柱是单侧下限（calibration_exam._judge_calibration_face 只判 ic/mono < min 记败），负阈值在 series 路必成方向倒置（仓内 4 张负阈值卡全为 panel/class
  B 未开考），故绑定交付反向读数 −M_t 使负向假设与正向门柱在机判面同构（绑定算子 invert 声明＋卡面 derivation 双处留痕）；③min_obs_per_bucket=60 取长窗惯例（07 卡降至 40 系 505 交易日短窗的结构限制并已声明，本卡对齐样本
  1,870+ 无此约束）；④窗口见 frozen_note。
data_binding:
  signal_table: c1_market.technical_indicator
  signal_column: chips_winner（全市场截面中位数）→ M_t → 反向读数 −M_t
  signal_derivation: 全市场 chips_winner 截面中位数：先 (日,标的) argMax(ingest_ts) 去版本再按日 medianExact；市场获利盘水位 M_t=该中位数，绑定交付反向读数 −M_t（执行器门柱为单侧下限，负向假设经
    −M_t 与正向门柱同构；分桶单调读 −M_t 分位，M_t 越高档次日收益越低）；period='daily' 过滤（该表 9 种 period 值混存，漏 WHERE 即污染）；chips_winner 值域 [0,1] 实测（2026-10-08
    截面 min≈0/max=1/均值 0.299/中位 0.23）；原始 M_t 序列实测 1,883 个交易日（2019-01-02..2026-10-12）日中位数域 [0.0023,0.9751] 均值 0.3755
  target_source: kline_index symbol='000300' close → next_day_return
  data_window_evidence: 命令原文与实测（2026-10-13 20:4x，CH 只读）：`SELECT min(trade_date),max(trade_date),count(),countIf(isNotNull(chips_winner))
    FROM c1_market.technical_indicator WHERE period='daily'` → 2019-01-02..2026-10-12 / 19,754,690 行 / 19,706,276 非空（99.75%）；去重实证：`SELECT
    count(), uniqExact((symbol,trade_date)) ... WHERE period='daily' AND trade_date='2026-10-08'` → 15,895/5,562（≈2.86 倍）；同式
    2024-06-03 → 12,799/5,366（≈2.38 倍）——一切读数必须 argMax 去重；period 值域实测 9 种（1min/5min/15min/30min/60min/120min/daily/weekly/monthly，daily=19,754,690
    行）；目标面：`SELECT min(trade_date),max(trade_date),count(),uniqExact(trade_date) FROM c1_market.kline_index WHERE symbol='000300'`
    → 2005-01-04..2026-10-13 / 5,286 行（信号窗全覆盖）；regime 机械复核：`SELECT first_value(close), last_value(close) FROM (SELECT close
    FROM c1_market.kline_index WHERE symbol='000300' AND trade_date>=.. <=.. ORDER BY trade_date)` 段累计——bull 段 +72.08%、bear
    段 -38.52%（标签成立）；M_t 原型序列（去重后 medianExact，绑定算子同式）：1,883 日 / 域 [0.0023,0.9751] / 均值 0.3755 / 首日 2019-01-02=0.335 / 末日 2026-10-12=0.275
