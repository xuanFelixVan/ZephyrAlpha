  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛；开考前机械复核：000300 段内累计 +72.08%）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊；开考前机械复核：000300 段内累计 -38.52%）
  frozen_note: 窗口与判据看数前冻结（2026-10-13）；窗口由 c1_market.technical_indicator period='daily' 实测覆盖（2019-01-02..2026-10-12）唯一决定，IS/OOS/regime
    段对齐 L3 车道既有冻结卡同窗 （02 获利盘 panel 卡与 P1-03 卡 IS 同界 2019-01-04..2023-12-31，OOS 端取最新在册惯例 2026-09-30）； regime 标签按 000300 段内累计收益符号机械判定（命令见
    data_window_evidence），非预断言；事后挪门柱=作废（G4-5）
buckets:
  type: quantile_decile
  'on': −M_t（市场获利盘水位反向读数）十分位
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 反向读数 −M_t 十分位分桶，桶中位次日收益 Spearman 单调 rho>=0.6（等价于 M_t 越高档次日收益越低；IS 窗内）
  ic_floor: 日频 IC（−M_t 对 000300 次日收益，时序 Spearman）均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径；series 路执行器 ic_ir 恒 None=未判柱如实披露，见
    unjudged 面）
  lag_profile: t+1..t+3 前向档位 IC 峰值与半衰期建档（筹码是慢变量；执行器现役为次日单面，多日前向面属另卡 target_forward_face 申报，不在本卡）
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor
  oos_stability: OOS 窗 IC 与 IS 同号（oos_same_sign 机判）
  winner_source: '获利盘由 CYQ 迭代衰减口径供给（chips.py production 内核，2026-10-04 SW14 处方① 落地，chips_winner 列）；本卡=chip_distribution_engine（MOD-REGIME-005
    trial）消费端证据面（裁定 #257④ 转正唯一通道）；#257④ 纪律：trial 期该维不进决策，本卡过考与否均只回写 confidence 读数面'
  dedup_critical: technical_indicator 原始行多版本（实测 2026-10-08 行 15,895 vs uniq (日,标的) 5,562≈2.86 倍），读数必须 (日,标的) argMax(ingest_ts)
    去重（与 02 卡冻结口径一致）
  known_defect_FA1: 在册缺陷（正查命中 docs/_working/archive/2026-09/deep_review_full/p1_decision_chain/rpt_d06.md L29 F-A1）：一字板/停牌单日退化注入全网格均匀分布，单票
    chips_winner 被摊薄失真——本卡为全市场截面中位数（日均 ~5.3-5.6k 标的），单票退化对中位数稳健；凭据面留截面宽度记录
