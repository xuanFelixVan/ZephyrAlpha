  signal_derivation: "纯正度代理=个股当日涨幅在其题材板块当日成员涨幅中的截面分位（需 PIT 成员表）；板块热度=板块成交额/涨幅分位；冻结窗内成员表不可得即本判据不可算"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sec：sector_constituent 的 update_date 实测仅 2026-07-22..2026-10-01（6 个更新日、323,175 行，窗内 0 行）；concept_board_constituent valid_from 仅 2026-08-10..2026-10-09（37,891 行）；sector_constituent_sw_history 的 fetched_at 全表=2026-09-24 单批（虽有 in_date/out_date 历史字段，抓取批次单一）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov2 / cov3 / cov6）：SELECT min(update_date),max(update_date),count() FROM c1_market.sector_constituent → 2026-07-22 / 2026-10-01 / 323,175 行（仅 6 个更新日快照，窗内 0）；concept_board_constituent valid_from → 2026-08-10 / 2026-10-09 / 37,891 行；sector_constituent_sw_history fetched_at → 2026-09-24（46,133 行，虽含 in_date/out_date 历史字段但抓取于 2026-09-24 单批）；kline_sector_880 → 2020-03-17 / 2026-10-08 / 785,204 行 / 729 板块，窗内 IS=289,365 / OOS=288,254 → 板块行情 2019 全年缺，板块归属历史不可 PIT 重建。"
