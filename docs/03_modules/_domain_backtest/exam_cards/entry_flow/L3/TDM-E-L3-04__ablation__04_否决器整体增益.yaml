schema_version: '1.0'
card_id: TDM-E-L3-04/ablation/04_否决器整体增益
node_id: TDM-E-L3-04
family: ablation
title_zh: "负面否决器·七检整体消融卡"
hypothesis: "负面否决器（业绩暴雷/立案调查/减持/解禁/商誉减值/配股/高应计七检）整体使留池前向收益高于未否决池，且每一检的边际增益>=0（零增益检退役）。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "命检数（0/1/2+ 三档）与逐检边际增益"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "命检数越多前向收益越低（取负构造后单调正向，rho>=0.6）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "逐检各自的 t+1/t+5/t+20 衰减曲线建档（解禁/减持偏事件前后，暴雷偏财报窗口）"
  regime_stability: "牛/熊两段同号且均过 ic_floor"
  per_check_ablation: "七检逐一去一检重跑，报边际增益表；三处（IS/OOS/两段 regime）均零增益的检标退役候选（§4 净零）"
  veto_not_remove: "TDM 在册裁决=否决只标记不剔除（candidate_pool_aggregator 语义），故本卡判标记组的收益差而非剔除后的组合收益"
ablation_variants:
- "V0 无否决器"
- "V1 去解禁检"
- "V2 去业绩暴雷检"
- "V3 去高应计检"
- "V4 可判四检全开（减持/商誉/立案三检缺数据永不进对照）"
- "V5 七检全开（仅当三检数据补齐后可跑）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "留池 5/20 日前向收益"
  note: "一票否决优先级高于加分项——本卡判该优先级是否真有收益支撑"
status: blocked_on_data
blocked_reason: "七检中三检数据永不可得（减持/商誉/立案无表），整体消融会系统性低估否决器价值"
missing_segment: "减持公告/商誉减值/立案调查三项：全窗无对应采集表（非缺段，是缺表）"
unlock_condition: "新增三项采集表后转 preregistered；或把卡面判据改为可判四检并在卡内留残缺声明（需 Owner 裁是否降格）"
