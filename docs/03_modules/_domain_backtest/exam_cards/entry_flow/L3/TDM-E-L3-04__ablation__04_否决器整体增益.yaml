data_binding:
  signal_table: "c3_fundamental.share_unlock（解禁）+ 三检无表（减持/商誉/立案）+ c3_fundamental.income_statement（业绩暴雷代理）"
  signal_column: "命检并集标记"
  signal_derivation: "可判检=解禁（share_unlock）、业绩暴雷（income_statement 净利同比转负或预告亏损代理）、高应计（见 03 卡）；不可判检=大股东减持公告、商誉减值、立案调查、配股——CH 全库枚举无对应表（实测 %reduc%/%goodwill%/%announce%/%disclosure% 仅 disclosure_plan 不含减持与商誉）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@fin：无 balance_sheet；@shu：解禁面全窗可用（15,668 事件）；库内枚举命令原文 SELECT database,name FROM system.tables WHERE lower(name) LIKE '%reduc%' / '%goodwill%' / '%announce%' → 命中 0 行（l2_ch_cov3.py），'%disclosure%' 仅命中 c3_fundamental.disclosure_plan。资产状态断言另行查核：python -m zephyr.library.lookup state 减持 / 商誉 / 立案调查 输出见台账 §5。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_backend.py）：table_columns('c3_fundamental.income_statement') 含 net_profit_incl_minority/net_profit_excl_minority/operating_revenue/operating_cost/report_period/announce_date/actual_announce_date/quality_flag；cashflow_statement 含 ocf_net/icf_net/fcf_net/report_period；system.tables 里 LIKE '%statement%' 仅命中此二表（无资产负债表）→ Sloan 应计只能取（净利−经营现金流）代理，且缩放分母需用 circ_mv（2021-01-04 起）。 ‖ 实测（l2_ch_cov4.py I1）：SELECT min(unlock_date),max(unlock_date),count(),uniqExact(symbol) FROM c3_fundamental.share_unlock → 2010-01-04 / 2027-09-29 / 30,264 行；countIf(unlock_date BETWEEN 2019-01-04 AND 2025-09-09)=15,668 条，涉及 5,531 符号；列含 amount/shares/ratio。"
