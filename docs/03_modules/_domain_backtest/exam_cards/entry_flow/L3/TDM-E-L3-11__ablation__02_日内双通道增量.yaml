schema_version: '1.0'
card_id: TDM-E-L3-11/ablation/02_日内双通道增量
node_id: TDM-E-L3-11
family: ablation
title_zh: "日内动态选股·竞价+涨速双通道增量消融卡"
hypothesis: "盘中双通道（竞价选股+涨速异动扫描）在盘前计划池之外新增的候选，其当日/次日实现收益显著为正（增量价值），去掉双通道后组合收益不降则本层退役。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "候选来源档（仅盘前/仅日内/两者皆有）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "日内新增组收益须 >= 盘前组（否则盘中追高=负贡献）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "日内信号半衰期极短：t+0（当日收盘）与 t+1 为主，须报 t+0 收益"
  regime_stability: "牛/熊两段增量符号一致"
  overlap: "日内新增与盘前池重叠率须报出（重叠>50%=双通道无独立价值）"
ablation_variants:
- "V0 仅盘前计划池"
- "V1 仅竞价通道"
- "V2 仅涨速通道"
- "V3 盘前∪竞价"
- "V4 盘前∪涨速"
- "V5 盘前∪竞价∪涨速（在册双通道全开）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "日内新增候选的日内浮盈与隔夜溢价"
  note: "组骨架层；两子环节各有一张读数卡（11-1/11-2）"
status: blocked_on_data
blocked_reason: "两条日内通道的数据起点全部晚于冻结窗（竞价全窗缺、5 分钟缺 IS 前 2/3），组合级增量无法在同一窗内对齐"
missing_segment: "竞价面 2019-01-04..2026-05-31 全缺；5 分钟面 2019-01-04..2021-08-31 全缺"
unlock_condition: "补齐竞价历史与 5 分钟历史至 2019-01-04 后转 preregistered（或另立近期窗专项卡，需 Owner 批窗口例外）"
lineage:
  card: null
