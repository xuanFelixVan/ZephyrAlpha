pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.auction_snapshot + c1_market.kline_5min + c1_market.kline_daily_hfq"
  signal_column: "auction_volume,auction_price,5min close/volume"
  signal_derivation: "竞价通道=9:25 竞价量比与竞价涨幅规则（11-1 卡口径）；涨速通道=5 分钟涨幅>2% 且 5 分钟量比>3（11-2 卡口径）；与盘前池取差集得日内新增"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@auc：auction_snapshot 实测 2026-06-01..2026-09-30（288,909 行/56 日）、auction_book 2026-07-21..2026-09-30（3,690,473 行/30 日）→ 冻结窗内 0 行；@m5：kline_5min 实测 2021-09-01 09:35 起（296,122,159 行）→ IS 前段缺。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.auction_snapshot → 2026-06-01 / 2026-09-30 / 288,909 行 / 6,590 符号 / 56 日；auction_book → 2026-07-21 / 2026-09-30 / 3,690,473 行 / 6,071 符号 / 30 日 → 冻结窗（IS+OOS）内 0 行。 ‖ 实测（l2_ch_cov4.py）：c1_market.kline_5min 列=[open/high/low/close/volume/amount/trade_time/exchange/symbol/symbol_canonical/data_source/ingest_ts]；SELECT min(trade_time),max(trade_time),count() → 2021-09-01 09:35:00 / 2026-10-09 15:00:00 / 296,122,159 行 → 缺段=2019-01-04..2021-08-31（IS 前 2/3）。"
