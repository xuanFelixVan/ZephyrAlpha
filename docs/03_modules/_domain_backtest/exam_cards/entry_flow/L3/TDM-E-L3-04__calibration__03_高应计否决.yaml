schema_version: '1.0'
card_id: TDM-E-L3-04/calibration/03_高应计否决
node_id: TDM-E-L3-04
family: calibration
title_zh: "负面否决器·高应计（盈余质量）校准卡"
hypothesis: "应计比例（净利−经营现金流，按规模归一）越高的个股后续 20 日收益越差（Sloan 盈余质量效应在 A 股成立），取负构造后分位对前向收益单调正向。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "−应计分位 截面十分位"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "十桶中位前向收益单调（rho>=0.6）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "应计是慢变量，主判 t+20 半衰期>=10 交易日；t+1 IC 记 n/a 不判"
  regime_stability: "牛/熊两段同号且均过 ic_floor"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "20 日前向收益与财报公告日前后分组差"
  note: "2026-09-14 裁定#231 增补的第七检（high_accrual）在个股层的判据面"
status: blocked_on_data
blocked_reason: "分母口径缺历史 + 无资产负债表：精确 Sloan（ΔWC/total_assets）不可算，代理口径的规模分母在 IS 前段不可得"
missing_segment: "2019-01-04..2020-12-31 无 circ_mv；全窗无资产负债表（total_assets/ΔWC 永不可得，需另批采集）"
unlock_condition: "回填 stock_daily_basic 至 2019-01-04（或改用 total_mv 同源同段的既有替代并留痕）后转 preregistered"
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L3-04.confidence
