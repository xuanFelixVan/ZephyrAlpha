discipline: "冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger"
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c3_fundamental.income_statement × c3_fundamental.cashflow_statement × c1_market.stock_daily_basic"
  signal_column: "net_profit_incl_minority − ocf_net，/circ_mv"
  signal_derivation: "accrual=(net_profit_incl_minority − ocf_net)/circ_mv，按 report_period 最近已公告值 PIT（announce_date<=T 才可用，actual_announce_date 优先）；scale 分母用 circ_mv（无资产负债表故 total_assets 不可得）；signal=−accrual 截面分位"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@fin：income_statement 列实测含 net_profit_incl_minority/report_period/announce_date/actual_announce_date/quality_flag，cashflow_statement 含 ocf_net/report_period；system.tables 里 LIKE statement 仅命中此二表（无 balance_sheet）。@sdb：缩放分母 circ_mv 实测 2021-01-04 起（IS 前两年 0 行）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_backend.py）：table_columns('c3_fundamental.income_statement') 含 net_profit_incl_minority/net_profit_excl_minority/operating_revenue/operating_cost/report_period/announce_date/actual_announce_date/quality_flag；cashflow_statement 含 ocf_net/icf_net/fcf_net/report_period；system.tables 里 LIKE '%statement%' 仅命中此二表（无资产负债表）→ Sloan 应计只能取（净利−经营现金流）代理，且缩放分母需用 circ_mv（2021-01-04 起）。 ‖ 实测（l2_ch_cov.txt）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.stock_daily_basic → 2021-01-04 / 2026-10-09 / 7,118,522 行 / 5,785 符号 / 1,395 日；分窗 countIf：IS 段（<=2023-12-31）=3,492,273、OOS 段=2,200,180 → 缺段=2019-01-04..2020-12-31（整整两年 IS 无市值/流通股本/换手率）。"
