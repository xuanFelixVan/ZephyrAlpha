data_binding:
  signal_table: "c1_market.kline_sector_880 × c1_market.stock_basic（行业归属）× c1_market.kline_daily_hfq"
  signal_column: "kline_sector_880 板块涨幅 − 个股涨幅"
  signal_derivation: "超额强度 = 个股 20 日涨幅 − 所属行业 20 日涨幅；行业归属窗内只能取 stock_basic.industry 的非 PIT 快照（或 880 板块静态映射），归属不可 PIT 回溯即本判据口径不稳定"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sec：kline_sector_880 实测 2020-03-17 起（窗内 IS=289,365/OOS=288,254）→ 2019 全年无板块行情；@sb：stock_basic 的 industry 列窗内仅覆盖沪/深主板+科创板（创业板 2026-08-14 起、北交所 2026-09-15 起），板块成员表（sector_constituent）窗内 0 行。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov2 / cov3 / cov6）：SELECT min(update_date),max(update_date),count() FROM c1_market.sector_constituent → 2026-07-22 / 2026-10-01 / 323,175 行（仅 6 个更新日快照，窗内 0）；concept_board_constituent valid_from → 2026-08-10 / 2026-10-09 / 37,891 行；sector_constituent_sw_history fetched_at → 2026-09-24（46,133 行，虽含 in_date/out_date 历史字段但抓取于 2026-09-24 单批）；kline_sector_880 → 2020-03-17 / 2026-10-08 / 785,204 行 / 729 板块，窗内 IS=289,365 / OOS=288,254 → 板块行情 2019 全年缺，板块归属历史不可 PIT 重建。 ‖ 实测（l2_ch_cov6.py L1/L2/L3）：SELECT board,uniqExact(symbol),min(trade_date),max(trade_date) FROM c1_market.stock_basic GROUP BY board → 沪主板 1,803（2015-01-05 起）/深主板 1,604（2015-01-05 起）/科创板 621（2019-07-22 起）/创业板 1,409（仅 2026-08-14 起）/北交所 348（仅 2026-09-15 起）；2024-12-31 快照仅 3,756 符号且前缀分布无 300/301；同日 name 含 ST=169、含 退=22。"
