hypothesis: "9:25 竞价量比>5 且竞价涨幅 2-5% 的个股当日与次日收益高于无竞价异动组，且竞价涨幅过高（>7%）档反向（易炸），竞价量比分位对当日实现收益单调正向。"
window:
