  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+0 当日实现收益（日内信号），半衰期>=1 交易日；9:25 前假象密集区（节点 invalidation）必须剔除"
  regime_stability: "牛/熊两段同号且均过 ic_floor"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "当日收盘封板率与次日溢价"
  note: "全天第一个情绪确认窗口（节点原文）"
