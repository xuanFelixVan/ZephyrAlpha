data_binding:
  signal_table: "c1_market.auction_snapshot × c1_market.auction_book × c1_market.kline_daily"
  signal_column: "auction_volume,auction_price,匹配量/前 5 日均量"
  signal_derivation: "竞价量比=auction_volume/(前 5 日日均量)；竞价涨幅=auction_price/prev_close−1（prev_close 取 auction_book.pre_close 或 kline_daily 昨收）；大单主导需 auction_book 五档（bid/ask 1-5）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@auc：auction_snapshot 实测 2026-06-01..2026-09-30/288,909 行/6,590 符号/56 日；auction_book 实测 2026-07-21..2026-09-30/3,690,473 行/6,071 符号/30 日 → 冻结窗（2019-01-04..2025-09-09）内两表均 0 行。资产状态另行查核：python -m zephyr.library.lookup state 竞价 输出见台账 §5。 竞价面另有在册完整性事故：data/failures/20260716_auction_book_snapshot_033741.json、20260728_auction_book_snapshot_011553.json、20260803/20260804_integrity_check_c1_market.auction_snapshot_*.json（lookup state 竞价 命中）；边界登记：T3 系列 L-1 tick 级做T考卷（含竞价段新语义）已按裁定#486 出立项卡（commit ad6b9d683d5），本卡不越界重复立考 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.auction_snapshot → 2026-06-01 / 2026-09-30 / 288,909 行 / 6,590 符号 / 56 日；auction_book → 2026-07-21 / 2026-09-30 / 3,690,473 行 / 6,071 符号 / 30 日 → 冻结窗（IS+OOS）内 0 行。"
