  data_window_evidence: "@mf：money_flow 实测 2021-01-04..2026-10-09/5,993,328 行/5,782 符号；按年 symbol-day 2021=1,058,846/2022=1,146,266/2023=1,209,660/2024=1,233,202/2025(至09)=861,547；列含 small/medium/large/super_large/main 五档净额与占比。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt / l2_ch_cov5.py G1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.money_flow → 2021-01-04 / 2026-10-09 / 5,993,328 行 / 5,782 符号；按年 symbol-day：2021=1,058,846、2022=1,146,266、2023=1,209,660、2024=1,233,202、2025(至09)=861,547 → 缺段=2019-01-04..2020-12-31。"
