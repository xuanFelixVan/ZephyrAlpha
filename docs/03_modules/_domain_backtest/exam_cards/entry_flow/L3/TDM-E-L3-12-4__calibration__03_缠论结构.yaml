  data_window_evidence: "@impl：SELECT database,name FROM system.tables WHERE lower(name) LIKE '%chan%' → 仅命中 c1_backtest.alloc_budget_change_log 与 c3_fundamental.share_change（无缠论表）；'%pattern%' 命中三表（market_pattern_certification/event/win_rate）均为 K线形态族；chanlun_structure.py 件存在但零持久产物。资产状态另行查核：python -m zephyr.library.lookup state 缠论 输出摘录见台账 §5。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_backend.py 存在性枚举）：本层 21 个 module_ref 指向件全部存在（selection_funnel/fine_scoring_engine/quant_short_term_strength_engine/negative_veto/signal_conflict_resolver/pool_tier_maintenance/candidate_pool_aggregator/tradability_preflight/auction_microstructure_analyzer/intraday_volume_orderflow/capital_flow_pattern_analyzer/seat_pattern_analyzer/chip_distribution_engine/chanlun_structure/environment_switch/instrument_master/multifactor_synthesis/chips/selection_confidence/daban_sleeve_strategy/event_driven_sleeve_strategy）；但 system.tables 里 LIKE '%funnel%'/'%tier%'/'%score%'/'%veto%'/'%preflight%'/'%chip%'/'%chanlun%'/'%sleeve%' 命中=空（唯一 score 命中=news_sentiment_window 无关）→ 引擎在、逐环节产物不落库，环节级消融需由考试车道按 raw 数据重放。"
