  'on': "停牌状态（停牌中/复牌日/正常）三分组"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "分组不判单调，判停牌组与正常组收益差显著性"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "复牌后 t+1/t+3 收益曲线（复牌溢价/折价须建档）"
  regime_stability: "牛/熊两段分组差符号一致"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "停牌持续天数分布"
  note: "预检第一查；本卡价值在于把停牌口径从散文变成可判数值面"
status: blocked_on_data
