pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.suspend（在册）/ c1_market.kline_daily 日历缺口（代理）"
  signal_column: "suspend_date,resume_date,reason"
  signal_derivation: "在册口径=suspend 表按 symbol 的 suspend_date/resume_date 区间标记；代理口径=交易日历有该日而该符号无 kline_daily 行（代理会把退市/数据断供误标为停牌，须用 valid_to/序列终止剔除）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sus：SELECT min(suspend_date),max(suspend_date),count(),uniqExact(symbol) FROM c1_market.suspend → 2026-09-04/2026-09-23/36 行/11 符号（冻结窗内 0 行）。资产状态另行查核：python -m zephyr.library.lookup state 停牌 输出见台账 §5。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov6.py P1）：SELECT min(suspend_date),max(suspend_date),count(),uniqExact(symbol) FROM c1_market.suspend → 2026-09-04 / 2026-09-23 / 36 行 / 11 符号 → 冻结窗内 0 行，停牌旗标全窗不可得（只能走 universe_rule 里的日历缺口代理）。"
