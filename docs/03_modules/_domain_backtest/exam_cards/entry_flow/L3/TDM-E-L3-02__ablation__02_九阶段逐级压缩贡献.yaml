  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@impl：selection_funnel.py 件存在（MOD-SIG-086）但 system.tables 无 funnel 类产物表（枚举实测零命中）→ 逐段无留痕，重放需考试车道自建；@pat：形态段依赖表起点 2021-09-01，缺 2019-01-04..2021-08-31。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_backend.py 存在性枚举）：本层 21 个 module_ref 指向件全部存在（selection_funnel/fine_scoring_engine/quant_short_term_strength_engine/negative_veto/signal_conflict_resolver/pool_tier_maintenance/candidate_pool_aggregator/tradability_preflight/auction_microstructure_analyzer/intraday_volume_orderflow/capital_flow_pattern_analyzer/seat_pattern_analyzer/chip_distribution_engine/chanlun_structure/environment_switch/instrument_master/multifactor_synthesis/chips/selection_confidence/daban_sleeve_strategy/event_driven_sleeve_strategy）；但 system.tables 里 LIKE '%funnel%'/'%tier%'/'%score%'/'%veto%'/'%preflight%'/'%chip%'/'%chanlun%'/'%sleeve%' 命中=空（唯一 score 命中=news_sentiment_window 无关）→ 引擎在、逐环节产物不落库，环节级消融需由考试车道按 raw 数据重放。 ‖ 实测（l2_ch_cov4.py E1 / l2_backend.py）：SELECT min(anchor_trade_date),max(anchor_trade_date),count(),uniqExact(symbol),countIf(isNull(confirmed_at)) FROM c1_market.market_pattern_event → 2021-09-01 / 2026-09-30 / 28,587,647 行 / 5,715 符号 / 0；pattern_id 实测头名：X-短线 2,335,308、X-关键反转日 1,628,168、CDLSPINNINGTOP 1,516,729、CDLLONGLINE 1,424,171、CDLENGULFING 831,253、X-镊子底 818,451 → 缺段=2019-01-04..2021-08-31；且枚举内无缠论笔/买点类 pattern_id。"
