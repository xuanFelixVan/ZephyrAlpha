title_zh: 六因子 IC 加权·半衰加权腿 vs 等额均值加权腿的合成分歧对照卡
hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册口径原样引用＝各因子=列截面 zscore（winsorize 1%）；IC 加权=过去 60 个交易日（严格 <T）日频截面 IC 的**半衰加权**均值×因子符号；等权=六因子分位算术均值；随机权重=固定 seed 十组均匀权重（留 seed 号）；全部读取按 argMax(ingest_ts) GROUP BY symbol,trade_date
  去重。该卡的对战是「IC 加权 vs 等权 vs 随机」三变体，考 IC 加权这一步可否退役；本卡补的是 IC 加权**内部**的时点加权形制这一格＝同一 60 日 IC 序列，把半衰加权换成等额均值（各日权重 1/60），两合成分在同一截面同一日的排序翻转集，重点看翻转是否集中于 IC 近端突变段（半衰给近期 IC 高权，等额把近端突变稀释成 1/60）。判读＝若两形制合成分截面秩相关恒高、翻转不改变四件套（IC
  均值/分位单调/ICIR/换手）的判读方向，则半衰属可派生的参数选择、该卡「IC 加权不可退役」结论不受加权形制影响（按 §4 并，只须留一个形制并在册声明）；若半衰腿在 IC 结构突变段（如风格切换日）给出与等额腿相反的分档单调性，则半衰本身承载了近端适应性这一独立信息，该卡三变体未覆盖此格、结论须补此对照才可外推。在册限定＝本卡不改 60 日窗、不改半衰系数、不改 winsorize 1%、不自立因子列（六因子=ma_20/ma_60
  相对位置, ret_20, vol_ratio, ret_5 反转, atr_14/close 低波, chips_winner 筹码，逐字承该卡 signal_column）；随机权重臂与 seed 号处理承该卡，本卡不新增第四变体；宇宙与去重谓词逐字承该卡 universe_rule/deriv，禁在 2025-09-09 后取判据值。
