  signal_derivation: "动量=close_t/close_{t-7}−1 截面分位；流动性=日 amount 截面分位；宇宙=窗内该表出现的 symbol 全集（实测规模远小于 A 股，且仅 2025-08 起）；regime 代理=BTC 的 200 日均线位置（需先确认 BTC 在 symbol 枚举内）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@cry：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.crypto_kline_daily → 2025-08-08/2026-10-08/19,801 行；与冻结窗仅重叠 2025-08-08..2025-09-09（约 17 交易日），IS 段 0 行；表 17 列（实测 table_columns 无市值/流通量列）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov3.py）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.crypto_kline_daily → 2025-08-08 / 2026-10-08 / 19,801 行；与冻结窗仅 2025-08-08..2025-09-09 重叠（≈17 交易日），IS 段 0 行。"
