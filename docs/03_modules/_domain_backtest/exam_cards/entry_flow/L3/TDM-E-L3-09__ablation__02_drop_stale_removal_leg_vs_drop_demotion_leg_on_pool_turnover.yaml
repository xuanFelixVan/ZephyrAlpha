title_zh: Tier 状态机·删 10 日陈旧剔除腿 vs 删 5 日降级腿的池周转对照消融卡
hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册口径原样引用＝状态机重放=按 L3-03 双池代理分逐日达标判定，连 2 日升/5 日降/10 日剔，产出逐日 Tier；需持久化 Tier 历史方可核对重放一致性；col=tier_slot × c1_market.kline_daily_hfq，目标=stock_fwd_ret_t1o_to_t2c。该卡把三条时间规则合成一台状态机；本卡做消融＝在其余规则不变的前提下各删一腿成两臂：臂
  A 删「10 日剔」（不合格票永不离开池，只降级），臂 B 删「5 日降」（降级跳失，只剩升与剔），同窗测两臂相对在册全机的池规模、逐日周转率与池内前向收益分档。判读＝若 A、B 给出的池几乎相同（降级本来就是通向剔除的路径），则升降与剔除两腿同真源可派生→§4 必并，状态机可缩为「达标/不达标＋N 日计数」两态并删掉 Tier 层级措辞；若臂 A 池显著膨胀且膨胀部分的前向收益拖低池均值，则剔除腿是承重腿、不可由降级替代，兄弟卡的「持续性」读数须注明剔除腿单独贡献；若臂
  B 使票长期占位阻塞新票，则降级腿承担的是配额释放功能，与统计有效性无关。在册限定＝本卡不改连 2 日升、5 日降、10 日剔三常数（只做整腿删失，禁改阈值、禁调顺序替换）、不改 L3-03 双池代理分来源、不改 tier_slot 字段；实现缺陷原样同框＝该卡所指 Tier 历史未持久化即维持 blocked_on_impl、不出数、不判状态机无效（缺件路由 ①②⑤）；禁在 2025-09-09
  后取判据值。
