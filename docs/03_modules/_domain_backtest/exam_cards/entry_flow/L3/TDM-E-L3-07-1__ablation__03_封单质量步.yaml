family: ablation
title_zh: "打板选股链·封单质量（封单/流通盘>2%）消融卡"
hypothesis: "封单额占流通市值比例>2% 的涨停股次日溢价高于低封单组，封单质量分位对次日收益单调正向，该步在漏斗中不可去。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
