  'on': "封单/流通市值比 分档（<1%/1-2%/2-5%/>5%）+ 十分位双轨"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "十桶中位前向收益单调（rho>=0.6）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+1 峰值、半衰期>=1 交易日"
  regime_stability: "牛/熊两段同号且均过 ic_floor"
ablation_variants:
- "V0 五步漏斗全开（含封单质量步）"
- "V1 去封单质量步（第4步）"
- "V2 封单/流通盘阈值 1%"
- "V3 阈值 2%（在册线）"
- "V4 阈值 5%"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "次日一字/开盘溢价与封板持续性（次日是否仍涨停）"
  note: "漏斗第 4 步，判据依赖盘口封单额"
