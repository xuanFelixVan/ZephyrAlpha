data_binding:
  signal_table: "c1_market.limit_up_pool × c1_market.stock_daily_basic"
  signal_column: "seal_amount / float_market_cap"
  signal_derivation: "封单比=seal_amount/float_market_cap（原表已带 float_market_cap 列，避免跨表口径漂移）；signal=封单比截面分位；>2% 线做二值对照"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@lup：limit_up_pool 实测 2026-09-01..2026-10-09/1,426 行/789 符号/23 日（seal_amount/seal_ratio/sealed_seconds 列存在）；limit_up_down 仅 2026-07-20 起/5,397 行/54 日；@del：daban_engine_load 的 seal_amount 仅 2026-09-01..2026-09-28/19 日。封单额在冻结窗（2019-01-04..2025-09-09）内 0 行。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.limit_up_pool → 2026-09-01 / 2026-10-09 / 1,426 行 / 789 符号 / 23 日；limit_up_down → 2026-07-20 / 2026-10-09 / 5,397 行 / 1,841 符号 / 54 日；列含 seal_amount/seal_ratio/sealed_seconds/first_seal_time/last_seal_time/open_board_count/consec_limit/limit_stat → 封单质量与连板统计的历史全缺，须由 kline_daily×stk_limit 重建可重建部分（封板/炸板/一字可重建，封单额/首封时刻不可重建）。 ‖ 实测（l2_ch_cov.txt / l2_ch_cov4.py）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.daban_engine_load → 2026-09-01 / 2026-09-28 / 1,701 行 / 922 符号 / 19 日；daban_board_event → 2026-09-01 / 2026-10-09 / 1,767 行 / 975 符号 / 21 日 → 冻结窗内 0 行（引擎 PIT 负载表按 internal 批只滚动近期）。"
