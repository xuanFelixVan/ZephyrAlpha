schema_version: '1.0'
card_id: TDM-E-L3-07-2/ablation/02_IC加权对等权
node_id: TDM-E-L3-07-2
family: ablation
title_zh: "多因子打分链·IC 加权 vs 等权合成消融卡"
hypothesis: "六因子（趋势/动量/量能/反转/低波/筹码）按近 60 日 IC 衰减加权合成，在冻结窗内截面 IC 与分位单调均优于等权合成与随机权重对照，即 IC 加权这一步不可退役。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "合成得分截面十分位（三变体各判一整套四件套）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "加权合成十桶中位前向收益单调（rho>=0.6）且不劣于等权合成"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "合成 IC 的 t+1/t+3/t+5 曲线；权重月度重估（60 日窗）与日度重估的 IC 差须报出（判 C3-04 校准频率是否过密）"
  regime_stability: "牛/熊两段加权合成 IC 同号且均过 ic_floor"
  variant_table: "三变体=IC 衰减加权 / 等权 / 随机权重（10 次抽样分布），加权需 >= 等权 且 >= 随机分布 95 分位"
  dedup_required: "technical_indicator 原始行含多版本（2024 raw 29,787,404 行 vs 去重 910,208 symbol-day），不去重=IC 被复制样本放大 30 倍，判据无效"
  no_lookahead_weights: "权重仅用 T 日之前的 IC（rolling 60 日，右端严格 <T）"
ablation_variants:
- "V0 六因子 IC 衰减加权（在册）"
- "V1 六因子等权"
- "V2 随机权重 10 组（固定 seed，留 seed 号）"
- "V3 去筹码因子五因子加权"
- "V4 去低波因子五因子加权"
- "V5 权重日度重估 vs 月度重估对照"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "合成 Top20 池的 5 日前向收益"
  note: "多因子链是全池打分主干，本卡是该环唯一可机判的合成对照"
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L3-07-2.confidence
