preregistered_at: '2026-10-10'
discipline: "冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger"
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.technical_indicator"
  signal_column: "ma_20/ma_60 相对位置,ret_20,vol_ratio,ret_5(反转),atr_14/close(低波),chips_winner(筹码)"
  signal_derivation: "各因子=列截面 zscore（winsorize 1%）；IC 加权=过去 60 个交易日（严格 <T）日频截面 IC 的半衰加权均值×因子符号；等权=六因子分位算术均值；随机权重=固定 seed 十组均匀权重（留 seed 号）；全部读取按 argMax(ingest_ts) GROUP BY symbol,trade_date 去重"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@ti：technical_indicator 实测 2019-01-02..2026-09-30/404,675,630 行/14,357 符号/1,880 日；去重 symbol-day 2019=647,746…2025(至09-09)=632,574；chips_winner>0 symbol-day≈全 symbol-day；列名实测含 ma_5/10/20/60、macd_*、rsi_6/12/24、atr_14、obv、mfi_14、sar、kdj_*、chips_winner、conc_70/conc_90、continuation_40，且无 rps/rank 现成列（相对强度需截面自建）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.py / l2_ch_cov5.py B1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.technical_indicator → 2019-01-02 / 2026-09-30 / 404,675,630 行 / 14,357 符号 / 1,880 日；去重后 symbol-day 2019=647,746、2020=749,678、2021=823,409、2022=868,408、2023=901,509、2024=910,208、2025(至09-09)=632,574；chips_winner>0 的 symbol-day 与 symbol-day 几乎相等（2019=627,292/2023=901,502/2024=910,203）——原始行含多版本（2024 raw 29,787,404 行），不去重会把 IC 样本放大 30 倍，读数必须 argMax(ingest_ts) 或 FINAL。"
