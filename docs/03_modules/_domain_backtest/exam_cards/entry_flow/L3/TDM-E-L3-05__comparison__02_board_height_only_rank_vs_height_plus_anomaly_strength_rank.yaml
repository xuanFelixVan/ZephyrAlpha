hypothesis: 图面 dq＝「活下来的候选按全市场顺位谁排最前（妖>龙>中军>核心>趋势>跟风+加分项）」。兄弟卡在册定义原样引用＝连板高度=同符号连续收盘涨停日数（涨停判定 close>=limit_up−0.011，argMax 去重，断板清零不跨板）；异常强势=当日涨幅截面分位>=0.99 加 1 档；顺位分=连板高度档+异常强势档后在宇宙内做截面分位；并登记「在册 limit_up_pool.consec_limit
  仅 2026-09 起可用故本卡一律自建」。本卡对照题设＝同一全局交易日两条排序序列——只用高度档（并列不打破）vs 合成顺位——的秩相关，以及合成腿真正起作用的那批标的（高度并列、由异常强势决定先后）相对同高度未加档标的在 stock_fwd_ret_t1o_to_t2c 上的截面差。若合成腿的增益全部来自并列打破（等价于一条上移规则）则「加分项」一词属可派生冗余→必并；若合成腿在未连板/低高度标的上单独产生排序力则跨维不可并。在册限定＝宇宙口径逐字承该卡
  universe_rule 写死面（窗内 stock_basic 无创业板与北交所行⇒由 kline_daily 的 exchange+symbol 前缀重建，禁裸扩）；0.011、0.99 与自建 consec 的理由三处原样引用，本席不新立阈值、不改判定式。
