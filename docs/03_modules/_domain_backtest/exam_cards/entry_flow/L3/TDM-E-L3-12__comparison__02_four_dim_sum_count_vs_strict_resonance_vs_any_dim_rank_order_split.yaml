hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册口径原样引用＝资金维=main_net_inflow_pct>0 连 3 日；席位维=机构专用净买为正或一线游资（seat_name 文本判定）净买为正；筹码维=chips_winner 分位处于集中低位档；形态维=看多 pattern_id 命中；正面维数=四布尔求和，col=main_net_inflow_pct / net_amount(seat_type)
  / chips_winner / pattern_id，目标=stock_fwd_ret_t1o_to_t2c。该卡以「和」代表共振；本卡在同一 symbol-day 集合上对照三种写法＝(A) 0-4 计数（在册）、(B) 全共振=4 二值、(C) 任一维>=1 二值，比三者的截面排序与分档单调性，并报出 (A) 中「4 维」与「2 维但含资金＋席位」两子集的收益差。判读＝若三者排序同序（计数与全共振只差缩放），则共振措辞可派生→§4
  必并，兄弟卡的 ablation 结论只需保留计数一形；若 (A) 把「资金＋席位」与「筹码＋形态」两类 2 维样本混在同一档而两者收益不同，则求和掩盖了维度互补结构，图面「四维验证结论」应改为成对维描述；(C) 若已给出大部分 (A) 的分离力，则四维里存在冗余维，须由邻域单维消融确认。在册限定＝本卡不改四布尔式（含连 3 日、机构/一线游资文本判定、chips_winner 集中低位档、看多
  pattern_id）、不新增第五维、不改求和范围；起点缺陷原样同框＝四表任一缺源即维持 blocked_on_data、不出数、不判共振无效（缺源路由 ①②）；禁在 2025-09-09 后取判据值。
