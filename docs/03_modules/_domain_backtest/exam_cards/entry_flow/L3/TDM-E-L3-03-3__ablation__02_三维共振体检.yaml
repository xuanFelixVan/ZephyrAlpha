  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+1/t+3/t+5 三档期收益差（体检增益应体现在久期而非隔日）"
  regime_stability: "牛/熊两段单调结构一致（档序翻转=体检表不可信）"
  at_least_two: "主判据：2 维通过组收益 >= 3 维通过组（若 3 维显著更高则 TDM 的至少两维门槛过松，需收紧并留痕）"
  single_factor_hallucination: "单维通过组与全不通过组差须为正，否则该维无信息量→按 §4 净零标退役候选"
ablation_variants:
- "V0 不做体检（双池合流全留）"
- "V1 仅趋势维通过"
- "V2 仅资金维通过"
