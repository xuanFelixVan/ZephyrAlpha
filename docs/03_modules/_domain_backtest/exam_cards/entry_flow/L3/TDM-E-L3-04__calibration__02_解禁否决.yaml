family: calibration
title_zh: "负面否决器·解禁>5% 流通盘校准卡"
hypothesis: "未来 20 个交易日内有限售解禁且解禁比例（占流通市值/股本）越高的个股，次日与前向收益越差（负 alpha 可判），把解禁比例取负构造后信号分位对前向收益单调正向——即解禁一票否决线有实证收益支撑。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "−解禁比例分位 截面十分位（另按 5% 线做二值对照）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "十桶中位前向收益单调（rho>=0.6）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "解禁前 5 日（预期效应）与解禁日后 5 日分别建 IC 曲线，半衰期>=1 交易日"
  regime_stability: "牛/熊两段同号且均过 ic_floor（牛市解禁惩罚应更弱但仍同号）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "解禁日后 10 日前向收益"
  note: "负向假说按本车道立法§2.1 反向构造（执行器带符号地板无 abs 语义）"
