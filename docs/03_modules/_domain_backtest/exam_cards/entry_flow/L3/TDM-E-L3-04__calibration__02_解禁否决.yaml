data_binding:
  signal_table: "c3_fundamental.share_unlock"
  signal_column: "ratio,shares,amount"
  signal_derivation: "signal=−1×（未来 20 个交易日内最近一次解禁的 ratio 截面分位；无解禁=0 档）；解禁比例口径=ratio（原表列，若 ratio 与 shares/流通股本冲突以 ratio 为准并留痕）；事件窗用 unlock_date 与前向收益日历严格对齐，禁把未解禁样本插 0 以外的值"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@shu：SELECT min(unlock_date),max(unlock_date),count(),uniqExact(symbol) FROM c3_fundamental.share_unlock → 2010-01-04/2027-09-29/30,264 行；窗内解禁事件 15,668 条、5,531 符号（全窗可用，含未来排期故 OOS 完整）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov4.py I1）：SELECT min(unlock_date),max(unlock_date),count(),uniqExact(symbol) FROM c3_fundamental.share_unlock → 2010-01-04 / 2027-09-29 / 30,264 行；countIf(unlock_date BETWEEN 2019-01-04 AND 2025-09-09)=15,668 条，涉及 5,531 符号；列含 amount/shares/ratio。"
