  lag_profile: "IC 峰值预期在 t+3/t+5（波段属性），半衰期>=3 交易日；t+1 IC 若显著更高则该判据实为短线噪声"
  regime_stability: "牛/熊两段同号且均过 ic_floor（熊市趋势分应衰减但不翻号）"
  horizon_match: "判据必须同时报 1/3/5/10 日四期 IC 曲线，否则无法证明趋势是波段而非短线因子"
  ma_source: "technical_indicator 的 ma_5/ma_10/ma_20/ma_60 为已算列，禁在考试车道重算（重算=第二真源）"
