family: ablation
title_zh: "个股选择枢纽·消融卡（压缩率与信息保留）"
hypothesis: "从全市场宇宙压缩到 10-20 只精选的这条漏斗，在冻结窗内保留的次日截面收益信息显著高于同规模随机池与仅按分数不压缩的对照——即压缩本身有正 alpha，而非只是丢票。"
window:
