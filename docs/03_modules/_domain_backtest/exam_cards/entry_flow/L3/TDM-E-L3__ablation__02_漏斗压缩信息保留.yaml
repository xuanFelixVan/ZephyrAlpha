  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "个股当日合成得分截面分位（十桶）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "十桶中位前向收益随桶序单调（rho>=0.6），且最高桶（Top10-20 精选）中位收益显著高于宇宙等权"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+1 开盘可成交至 t+2/t+3/t+5 的 IC 半衰期建档（压缩池的 alpha 应在 1-3 日内兑现，超半衰=压缩在选慢票）"
  regime_stability: "牛/熊两段同号且均过 ic_floor（熊市压缩增益更应显著，否则压缩=砍掉反弹弹性）"
  compression_rate: "每日池规模实测：宇宙/入选比≈300-500:10（TDM 假设的业界 3000→10 漏斗需实测核对），池规模日波动<=30% 方判稳定"
  random_pool_control: "同规模（10-20 只）随机池 100 次抽样的前向收益分布，精选池需优于其 95 分位"
ablation_variants:
- "V0 全宇宙等权（不压缩）"
- "V1 仅按合成得分 Top30"
- "V2 Top20"
- "V3 Top10（TDM 精选假设位）"
- "V4 同规模随机池 100 次抽样分布"
- "V5 去压缩=全量留池但保留否决标记"
