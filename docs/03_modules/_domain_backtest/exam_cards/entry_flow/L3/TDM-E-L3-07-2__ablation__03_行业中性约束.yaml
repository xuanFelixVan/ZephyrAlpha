schema_version: '1.0'
card_id: TDM-E-L3-07-2/ablation/03_行业中性约束
node_id: TDM-E-L3-07-2
family: ablation
title_zh: "多因子打分链·行业中性化（单行业<=4 只）消融卡"
hypothesis: "多因子 Top20 加行业中性约束（单行业<=4 只）后，组合前向收益的 regime 稳定性提升且集中度风险下降，去掉该约束的对照组牛熊段 IC 差异更大。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "约束组 vs 无约束组二分组（另按行业 HHI 分位双轨）"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "不判单调，判两组的 regime 间 IC 差（约束组差值须更小）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "t+1/t+5/t+20 三档收益（中性化增益应体现在慢变量）"
  regime_stability: "牛/熊两组各自同号，且约束组两段 IC 之比的绝对值更接近 1"
  cap_check: "单行业<=4 只的实际命中日占比须报出（约束从未生效=伪约束）"
  industry_source: "行业归属真源=stock_basic.industry（窗内覆盖不全，见下）"
ablation_variants:
- "V0 无行业约束 Top20"
- "V1 单行业<=4 只（在册约束）"
- "V2 单行业<=2 只"
- "V3 行业等权（每行业配额相同）"
- "V4 行业中性化（组内 zscore 后再合成）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "行业 HHI 与最大行业权重"
  note: "合成约束面的可考性判定（不是单指标读数）"
status: blocked_on_data
blocked_reason: "行业归属 PIT 覆盖不足窗内全宇宙（创业板整段缺失），中性化约束在缺失样本上不可判"
missing_segment: "2019-01-04..2026-08-13 创业板无 industry/成员归属；北交所全窗无归属；板块成员表（sector_constituent）窗内 0 行"
unlock_condition: "补齐 stock_basic 创业板/北交所历史 PIT 或提供板块成员历史后转 preregistered"
