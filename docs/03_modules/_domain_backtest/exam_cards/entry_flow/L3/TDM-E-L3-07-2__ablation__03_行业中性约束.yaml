discipline: "冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger"
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.stock_basic（industry 列）× c1_market.technical_indicator"
  signal_column: "industry"
  signal_derivation: "行业归属=stock_basic 按 trade_date 的 PIT 快照 industry；组合层按行业聚合权重与计数；归属缺失符号不得默认并入单一桶（须剔除并报缺失率）"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sb：stock_basic 的 board/industry 窗内实测仅沪主板（1,803，2015-01-05 起）/深主板（1,604）/科创板（621，2019-07-22 起）；创业板 1,409 符号仅自 2026-08-14、北交所 348 仅自 2026-09-15 → 冻结窗内创业板全段无行业归属（约占全部 A 股 1/4）。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov6.py L1/L2/L3）：SELECT board,uniqExact(symbol),min(trade_date),max(trade_date) FROM c1_market.stock_basic GROUP BY board → 沪主板 1,803（2015-01-05 起）/深主板 1,604（2015-01-05 起）/科创板 621（2019-07-22 起）/创业板 1,409（仅 2026-08-14 起）/北交所 348（仅 2026-09-15 起）；2024-12-31 快照仅 3,756 符号且前缀分布无 300/301；同日 name 含 ST=169、含 退=22。"
