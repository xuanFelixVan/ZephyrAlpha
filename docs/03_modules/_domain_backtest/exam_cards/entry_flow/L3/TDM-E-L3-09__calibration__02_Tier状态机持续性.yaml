schema_version: '1.0'
card_id: TDM-E-L3-09/calibration/02_Tier状态机持续性
node_id: TDM-E-L3-09
family: calibration
title_zh: "股票池分层维护·Tier 升降级状态机校准卡"
hypothesis: "连续 2 日达标升 Tier、5 日不达标降级、10 日陈旧剔除的三层状态机，其 Tier1 组前向收益高于 Tier2 高于 Tier3（层级即信息），且状态机相对每日重扫的换手成本降低>=30% 而不牺牲收益。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "Tier 档（1/2/3）与连击天数分档"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "Tier1>Tier2>Tier3 收益均值须单调（rho>=0.6 以 Tier 编码计）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "各 Tier 的 t+1/t+3/t+5 收益曲线（Tier3 应更慢更弱）"
  regime_stability: "牛/熊两段 Tier 序一致（熊市区分度消失=陈旧剔除过慢）"
  turnover_cost: "状态机池 vs 每日重扫池的日换手率差须报出并 >=30%（该环的存在理由=防每天从零重扫）"
  stale_rule_hit: "10 日陈旧剔除的日均命中数须报出（长期为 0=规则未生效）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "Tier 迁移矩阵（升/降/剔比例）"
  note: "有状态日频维护环，考试卷面无状态=结构性缺口（矩阵册在册判定）"
status: blocked_on_impl
blocked_reason: "池与 Tier 状态无历史（写腿件在、注入源未注册、在册 empty_table 缺账 open），有状态环无可复核历史"
missing_segment: "2019-01-04..2025-09-09 全段无 Tier 状态历史（非缺数据表，是缺状态持久化实现）"
unlock_condition: "MOD-SIG-139 补 Tier 状态落库（新 DS 登记）+ 重放回填后转 preregistered"
lineage:
  card: null
  run_id: null
