schema_version: '1.0'
card_id: TDM-E-L3-03/ablation/02_双池代理合成
node_id: TDM-E-L3-03
family: ablation
title_zh: "双池评分·短线池与波段池合流消融卡"
hypothesis: "短线代理分（涨停基因+情绪热度）与波段代理分（趋势多排+温和量能）的合成（signal_additive）在冻结窗内的截面 IC 高于任一单池分数，且两池分数截面相关性<0.5（真有双池而非同一因子换名）。"
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: "看数前冻结（作业簿 §二，与既有 20 卡同窗）；窗口禁改，数据不足即 blocked_on_data"
buckets:
  type: "quantile_decile"
  'on': "合成分截面十分位"
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: "合成分十桶中位前向收益单调（rho>=0.6）"
  ic_floor: "日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与既有 20 卡同口径）"
  lag_profile: "合成分 IC 峰值在 t+1（短线主导）或 t+3/t+5（波段主导）需报出且半衰期>=1 交易日"
  regime_stability: "牛/熊两段合成分 IC 同号且均过 ic_floor；另判波段分在熊市单独更强（双池分工的机械证据）"
  pool_correlation: "短线分与波段分截面 Spearman 相关中位 <0.5，否则判双池伪命题（同真源可派生→必并，§4 内收判据）"
  single_vs_double: "合成 IC 需 >= max(单池 IC)×1.05，否则双池不成立"
ablation_variants:
- "V0 仅短线池分"
- "V1 仅波段池分"
- "V2 signal_additive 等权合流（在册 F 维）"
- "V3 equal_capital 合流近似（分位取小）"
- "V4 随机分池对照（同规模）"
target:
  primary: "stock_fwd_ret_t1o_to_t2c（个股 T+1 开盘可成交→T+2 收盘，后复权）"
  secondary: "分持仓期（1-3 日 vs 5-20 日）前向收益双列"
  note: "合成环节走消融（作业簿本车道特别条款）；引擎产物零落库故以 raw 代理分重放，代理口径写死在下"
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L3-03.confidence
preregistered_by: st-nightmine-20261010-L2
preregistered_at: '2026-10-10'
discipline: "冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger"
signal_kind: panel
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: "c1_market.kline_daily_hfq + c1_market.stk_limit + c1_market.technical_indicator"
  signal_column: "prox_short_score / prox_swing_score"
  signal_derivation: "短线代理分=0.5×60 日涨停次数截面分位（stk_limit×kline_daily 判涨停，收盘=涨停价-0.011 内）+0.5×当日涨幅截面分位；波段代理分=0.4×均线多排强度（ma_5>ma_10>ma_20>ma_60 计数/4）+0.3×温和量能带命中（1.2<=vol/MA20vol<=2.5）+0.3×回撤质量（距 60 日高点的相对位置）；合成分=两池分位等权相加（signal_additive，对应 schema F_merge_policy）；全部截面内 rank 归一，禁跨日标准化"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@sl：封板判定实证 2023-06-05=74/2024-10-08=893，量纲须配不复权 kline_daily；@ti：去重 symbol-day 2019=647,746…2024=910,208，ma_*/atr_14 列实测存在（列名枚举实测含 ma_5/ma_10/ma_20/ma_60）；@kd：窗内 5,583,635 唯一(symbol,trade_date)、1,622 交易日 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov5.py C1-C3 / l2_backend.py）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.stk_limit → 2015-01-05 / 2026-10-09 / 9,254,772 行 / 5,831 符号 / 2,857 日；2023-06-05 单日 5,199 行=5,199 唯一符号（PIT 无重复）；判据实证：封板家数 close>=limit_up-0.011 → 2023-06-05=74、2024-10-08=893；炸板家数 high>=limit_up-0.011 且 close<limit_up-0.011 → 2023-06-05=23、2024-10-08=2,268；一字板 open=high=low=close 且 close>=limit_up-0.011 → 2024-10-08=41/5,355。量纲陷阱：limit_up 为不复权价，必须配 c1_market.kline_daily（不复权），若配 kline_daily_hfq 则同日误判 3,882 家涨停。 ‖ 实测（l2_ch_cov.py / l2_ch_cov5.py B1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.technical_indicator → 2019-01-02 / 2026-09-30 / 404,675,630 行 / 14,357 符号 / 1,880 日；去重后 symbol-day 2019=647,746、2020=749,678、2021=823,409、2022=868,408、2023=901,509、2024=910,208、2025(至09-09)=632,574；chips_winner>0 的 symbol-day 与 symbol-day 几乎相等（2019=627,292/2023=901,502/2024=910,203）——原始行含多版本（2024 raw 29,787,404 行），不去重会把 IC 样本放大 30 倍，读数必须 argMax(ingest_ts) 或 FINAL。 ‖ 实测（本轮命令，l2_ch_cov5.py A1/A2）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.kline_daily_hfq → 1990-12-19 / 2026-09-30 / 10,098,785 行 / 5,916 符号 / 8,736 日；冻结窗内（symbol∈stock_basic 窗内符号集）5,583,635 行=5,583,635 个唯一(symbol,trade_date)（零重复）、1,622 交易日、3,944 符号；data_source 分解：tushare 1,622 行（每日一行，指数面）+ recalc_raw_x_adjfactor 7,589,306 行。"
