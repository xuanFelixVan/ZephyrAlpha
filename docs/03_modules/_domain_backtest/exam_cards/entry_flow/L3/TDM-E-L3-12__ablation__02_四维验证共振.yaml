  regime_stability: "牛/熊两段档序一致"
  dim_independence: "四维两两截面相关须报出（相关>0.7 的两维=同真源可派生，按 §4 内收判据必并）"
  three_of_four: "主判据=3 维通过组 vs 2 维通过组收益差符号"
ablation_variants:
- "V0 无多维验证"
- "V1 仅资金维正面"
