  signal_column: "main_net_inflow_pct / net_amount(seat_type) / chips_winner / pattern_id"
  signal_derivation: "资金维=main_net_inflow_pct>0 连 3 日；席位维=机构专用净买为正或一线游资（seat_name 文本判定）净买为正；筹码维=chips_winner 分位处于集中低位档；形态维=看多 pattern_id 命中；正面维数=四布尔求和"
  target_source: "kline_daily_hfq：close_t→close_{t+1}/close_{t+2} 按 T+1 可成交口径取 open_{t+1}→close_{t+2}，全面板按 argMax(ingest_ts) 去重后按 symbol×trade_date 对齐"
  universe_rule: "宇宙口径写死（禁裸扩）：窗内 stock_basic 无创业板（仅自 2026-08-14）与北交所（仅自 2026-09-15）行，故宇宙由 c1_market.kline_daily 的 exchange+symbol 前缀重建（60/00 沪深主板、30 创业板、68 科创板；8/4 开头北交所整段不入窗并显式排除）；ST/*ST 判定用 stk_limit.st_flag 而非 stock_basic.name；上市满 60 交易日=该符号在 kline_daily 的首条行情日往后 60 个日历交易日；停牌代理=交易日历有该日而该符号无行情行；退市判定=该符号行情序列终止于窗内且 stock_basic.valid_to 已到。"
  data_window_evidence: "@mf：money_flow 2021-01-04 起（IS 缺 2019-01-04..2020-12-31）；@dts：dragon_tiger_seat 2022-01-04 起（IS 缺至 2021-12-31）；@pat：market_pattern_event 2021-09-01 起（IS 缺至 2021-08-31）；@ti：chips_winner 全窗可用（去重 symbol-day 覆盖≈100%）→ 四维中仅一维全窗可用。 ｜命令原文与实测数字（本轮 l2_ch_* 探针，读库通道 scripts/backtest/fexam/ch_data.py）：实测（l2_ch_cov.txt / l2_ch_cov5.py G1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.money_flow → 2021-01-04 / 2026-10-09 / 5,993,328 行 / 5,782 符号；按年 symbol-day：2021=1,058,846、2022=1,146,266、2023=1,209,660、2024=1,233,202、2025(至09)=861,547 → 缺段=2019-01-04..2020-12-31。 ‖ 实测（l2_ch_cov.txt / l2_ch_cov5.py H1/H2）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.dragon_tiger_seat → 2022-01-04 / 2026-10-09 / 622,365 行 / 5,998 符号 / 1,152 日；按年上榜 symbol-day：2022=14,589、2023=12,908、2024=18,111、2025=16,352；seat_type 枚举实测=broker 562,116 / institution 39,250 / connect 20,999（游资一线与拉萨系需由 seat_name 文本判定）→ 缺段=2019-01-04..2021-12-31。 ‖ 实测（l2_ch_cov4.py E1 / l2_backend.py）：SELECT min(anchor_trade_date),max(anchor_trade_date),count(),uniqExact(symbol),countIf(isNull(confirmed_at)) FROM c1_market.market_pattern_event → 2021-09-01 / 2026-09-30 / 28,587,647 行 / 5,715 符号 / 0；pattern_id 实测头名：X-短线 2,335,308、X-关键反转日 1,628,168、CDLSPINNINGTOP 1,516,729、CDLLONGLINE 1,424,171、CDLENGULFING 831,253、X-镊子底 818,451 → 缺段=2019-01-04..2021-08-31；且枚举内无缠论笔/买点类 pattern_id。 ‖ 实测（l2_ch_cov.py / l2_ch_cov5.py B1）：SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol),uniqExact(trade_date) FROM c1_market.technical_indicator → 2019-01-02 / 2026-09-30 / 404,675,630 行 / 14,357 符号 / 1,880 日；去重后 symbol-day 2019=647,746、2020=749,678、2021=823,409、2022=868,408、2023=901,509、2024=910,208、2025(至09-09)=632,574；chips_winner>0 的 symbol-day 与 symbol-day 几乎相等（2019=627,292/2023=901,502/2024=910,203）——原始行含多版本（2024 raw 29,787,404 行），不去重会把 IC 样本放大 30 倍，读数必须 argMax(ingest_ts) 或 FINAL。"
