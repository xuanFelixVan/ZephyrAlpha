schema_version: '1.0'
card_id: TDM-E-L1-S1/calibration/02_指数趋势位置
node_id: TDM-E-L1-S1
family: calibration
title_zh: 指数趋势位置分档·指数校准卡
hypothesis: 指数相对 MA20/MA60 位置分档（上/中/下）对次日收益的条件分布有区分力：下档反弹弹性与上档回落风险不对称。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结（裁定#501 纪律）；窗口取自方案 §8 与 condition_package 同期口径
buckets:
  type: ordinal
  'on': close/MA20 与 close/MA60 复合分档
  labels:
  - 双上
  - 上中
  - 双下
pillars:
  response_monotonicity: 分桶中位前向收益 Spearman 单调 rho>=0.6（IS 窗内）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，方案 §7 三件套）
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日（时滞曲线建档）
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor（条件稳定性）
target:
  primary: next_day_index_return（CSI300 次日收益，G0-4 主轴）
  secondary: emotion_six_state_transition（情绪六段态转移概率，辅轴）
  note: 趋势位置是条件变量非信号（校准其条件分布）
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L1-S1.confidence
