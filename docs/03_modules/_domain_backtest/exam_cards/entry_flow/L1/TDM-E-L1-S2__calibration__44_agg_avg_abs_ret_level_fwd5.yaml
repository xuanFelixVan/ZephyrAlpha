hypothesis: 面板平均绝对日收益处于自身高位的日子，其后 5 个交易日面板等权收益高于其余日子（筛级时序 Spearman IC=0.1015，
  t=4.24，n=1733，均为正 ⇒ 本卡复述"热度延续"方向；母命题方向与在册 02 卡的次日反向先验**不同 horizon 不同目标面**，
  非重述亦非反号）。母结果=挖矿班 2026-10-12 聚合筛级在册读数（如实复述，非事后加冕）。
mother_card_relation: 本班不重判母读数。母面=聚合筛级 45 读数中过 agg_daily 闸（abs_ts_ic_min 0.08 / t_stat_min
  3.0 / min_days 400，预登记 sha256=89652c3b… 本班盘面复算全等）的 8 格之一；族级多重比较折减与最终判定权归
  E2/E4，本卡不预折减、不自加门槛（SOP v1.9.1 总则：闭卷考试＝最终考试，折减不替代考试）。
one_round_limit: 一轮为限：本卡只允许一次开考与一次对账；若一轮后仍未确认，本命题挂族归档
  （族=agg8_minedig2_20261013），禁反复改阈值再考（多重比较防线）。
known_weakness: |
  一、母读数=筛级时序 IC（序列 vs 第 5 日面板等权前向收益的秩相关），非考级分位响应曲线；两形态未对拍。
  二、母读数分母=1733 交易日（2019-02-11..2026-04-02 全程 1860 交易日窗内，扣留段未参与筛选）；
      序列前 20 日暖机与 5 日右端无值行天然缺席，故各卡 n 不等（1729-1734），禁当同一样本集对拍。
  三、宇宙=窗内日均成交额 top800 ⇒ 大票偏置（预登记册 panel.universe_bias_disclosure 原文，本卡如实携带）。
  四、r 位=面板等权均值（_proxy，非指数）⇒ 与在册 02/09 母卡的"次日指数收益"目标面不可直接比较。
  五、绝对收益同时吃波动与分歧两因，未做分解 ⇒ 机制命名保持机械描述；与在册波动率族（如 vol_20d 相关卡）的正交性未实测，残差增量面只在筛级 g4 对 10 列特征族算过，未对卡池全族算
