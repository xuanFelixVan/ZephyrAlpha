title_zh: 沪深300池宽top100与top50对照
origin: exploration_digest_23_20261011
hypothesis: >-
  在 hs300 宇宙内把持仓宽度从 top50 拉到 top100，扫描面均值 sharpe 由 0.2835 升到 0.3393，
  且 top100 是已扫格点的**最大档（边界）**。机制两说，本卡就是把两者分开的判据：
  若加宽后"不更差且换手不失控"，说明 hs300 内信号分数递减缓慢、分散收益盖过信号衰减（宽度是免费的）；
  若加宽后显著变差，说明原 top50 的收益来自"信号集中"而非分散，则边界应往内收（top50→top30 方向）。
arm_protocol:
  arm_open: B_top_n=top100
  arm_base: B_top_n=top50
  paired: 同宇宙 hs300、同因子底座、同 λ 档（lambda_5bp）、同成本档 frozen_l0，只换池宽一档
