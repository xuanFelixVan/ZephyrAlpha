family: calibration
title_zh: 锚定四档状态轴·前向收益单调校准卡
origin: tdm_algo_note_l1_agg
hypothesis: >-
  AGG 的宏观状态输入轴（锚定四档 r3/r2/r1/r4，由 vol_pct 固定结构阈值 0.30/0.60/0.80
  定义，零拟合）按风险序对次日指数收益单调非增，且牛/熊两段与 OOS 同号——实现件头注释的在册
  自述"四特征×双段探针唯一双段稳定轴=波动率风险轴（vol_pct 高→fwd20 收益更差）"若不可复核，
  则本环的状态轴=噪声，双轨判定的宏观腿作废。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结（G4-5）；四档阈值 0.30/0.60/0.80 逐字取 src/zephyr/regime/core/anchored_state_machine.py:36-39 与 classify_state()（结构阈值零拟合，非本卡拟合产物），卡内禁改；窗口与本战役 L1 族母卡同批（IS 2019-01-04..2023-12-31 / OOS 2024-01-01..2025-09-09）；风险序 r3<r2<r1<r4 先验钉死，事后禁按实测重排
buckets:
  type: ordinal_bucket
  'on': dominant 四档（序 r3→r2→r1→r4）
  min_obs_per_bucket: 60
pillars:
  tier_monotonicity: 四档桶中位次日收益 Spearman 单调 rho>=0.6（IS 窗内，风险序方向固定）
  ic_floor: 日频 IC（档序 vs 次日收益）均值 <= -0.02 且 |IC_IR| >= 0.3（高警戒档应预示更差次日）
  extreme_tier_gap: r4 档次日收益中位 − r3 档次日收益中位 <= -0.30pct（两端可分才谈得上分档）
  regime_stability: 牛/熊两段档序与次日均值关系同号且均过 ic_floor
  oos_hold: OOS 段同号不过拟合（在册自述的"双段稳定"由此卡独立复核，非沿用其结论）
target:
  primary: next_day_index_return（000300 T+1 收益，执行器 _series_metrics 现器 shift(-1) 口径可用）
  secondary: null
  note: fwd5/fwd20 多日前向收益面本卡不作机判门柱（在册执行器缺口①：_series_metrics 硬编码 shift(-1)），仅在产物中披露不参与过线
