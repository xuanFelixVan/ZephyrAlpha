  符号须为负（风险序越高收益越低）；ic_mean/ic_ir 读同一配对的日频秩相关（ic_mean_min 按执行器
  地板 0.02 口径登记，本卡预期符号为负，负结果如实入册即支持"状态轴作废"分支）；两段同号、OOS 同号。
