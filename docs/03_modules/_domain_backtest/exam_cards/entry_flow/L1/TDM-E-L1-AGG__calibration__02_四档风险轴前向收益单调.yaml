    → 1990-12-19..2026-10-09 / 3,104,162 行 / 1,097 symbols，000300 实测 1,843 行覆盖 2018-06-01..2025-12-31
    ——同上出处 ⇒ IS 起点 2019-01-04 在覆盖内，OOS 终点 2025-09-09 在覆盖内；
