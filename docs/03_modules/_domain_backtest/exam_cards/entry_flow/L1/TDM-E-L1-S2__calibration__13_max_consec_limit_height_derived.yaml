schema_version: '1.0'
card_id: TDM-E-L1-S2/calibration/13_max_consec_limit_height_derived
node_id: TDM-E-L1-S2
family: calibration
title_zh: 连板最高高度（日线导生连板串口径）·广度校准平行卡
origin: tdm_algo_note_l1_s2
parallel_of: TDM-E-L1-S2/calibration/06_连板最高高度
hypothesis: 当日全市场连板最高高度（连续涨停串长度）分桶对次日沪深300收益呈倒 U：中高档（经验分位 60-90%）最强、极高档（>90% 分位，母卡口径的>7 板亢奋区）增益衰减转负；高度断崖（较前一日降>=2 板）日为退潮领先信号。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 窗口继承母卡 06，门柱同数值；母卡假设"高度>7 板=亢奋区衰减最快"在本卡改为经验分位>90% 档（导生口径的绝对板数分布与事件表口径不同尺度，绝对阈值不可直接移植——此为卡内先验设定，看数前冻结）
buckets:
  type: quantile_decile
  'on': 当日连板最高高度
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分桶中位前向收益 Spearman 单调 rho>=0.6（IS 窗内；倒 U 命题预期此项 fail，属如实负结果，禁事后改判据凑过）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor
  cliff_event: 高度较前一日降>=2 板的事件日集合（n>=30 才判）其次日收益中位数须低于全样本中位数（退潮领先面，建档入分数册附注，不作一票否决门柱）
target:
  primary: next_day_index_return（CSI300 000300 次日收益）
  secondary: next_day_emotion_index_delta（c1_market.emotion_index stage='close_final' 次日差分）
  note: 倒 U 与单调门柱冲突是本卡的设计性张力（母卡假设本身含"过热反向"），门柱按执行器冻结面硬判，负结果即负结果
status: examined
lineage:
  card: null
  run_id: nightmine-13_max_consec_limit_heig
  score_row: exam_scores_v1.yaml#rows[14]
  confidence_writeback: TDM.nodes.TDM-E-L1-S2.confidence
preregistered_by: st-nightmine-20261010-L3
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.kline_daily_hfq + c1_market.stk_limit
  signal_column: max_consec_limit_height_derived
  signal_derivation: 先按卡 09 口径得逐 symbol-day 的 is_limit_up 布尔串（r >= lim-0.002）； 连板串长度 streak_t = if(is_limit_up_t, streak_{t-1}+1,
    0)，按 symbol 时间序 arrayFold/groupArray-then-scan 实现， streak 链须从 IS 起点前 60 个交易日暖机（串长<=5 板的历史足以覆盖实测高度）； 当日信号 = max(streak_t)
    over symbols。一字板计入串（日线口径无法区分一字/T 字板，限制见 evidence）。
  target_source: kline_index symbol='000300' close -> next_day_return = close(t+1)/close(t)-1
  data_window_evidence: 命令原文 `SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.stk_limit` →
    2015-01-05..2026-10-09 / 9,254,772 / 5,831（导生链自 2015 起可用， IS 暖机段 2018-10..2018-12 充分）； `... FROM c1_market.limit_up_down`
    → 2026-07-20..2026-10-09 / 5,397 行（母卡绑表冻结窗零行）； 事件表替身实测：`SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol)
    FROM c1_market.daban_board_event` → 2026-09-01..2026-10-09 / 1,767 / 975（含 consec_limit 列，可作导生串长的短窗交叉验证集， 但完全落在冻结窗之外）；`...
    FROM c1_market.limit_up_pool` → 2026-09-01..2026-10-09 / 1,426 / 789（consec_limit 同）； 已知口径限制（如实记）：日线导生无法区分"盘中打开后回封"（该情形仍计为连续板），
    事件表 close_sealed/is_one_word 口径可区分但无长窗数据； 目标面 kline_index 000300 → 2018-06-01..2025-12-31 / 1,843 行。
