  ic_mean/ic_ir 读"合成分 t 日"对"000300 t+1 收益"的日频秩相关；两段同号、OOS 同号。
oos_window_ref: *id001
data_binding:
  composite_join_rules:
    registered_by: st-examunlock-20261013
    registered_at: '2026-10-13'
    basis_casefile: docs/_working/examunlock_campaign/19_composite_join_probe.yaml
    executor_note: 执行器当下无复合配方入口（card_binding.classify_card 多表一律 U:multi_table_needs_composite_recipe）；本块＝共键与对齐规则冻结，待横截面回放面（CW-MINELOOP-001，矿考二班域）落地即零二次讨论可跑
    card_face_declared_join_key_before: true
    pairs:
    - left: c1_backtest.regime_state_anchored
      right: c1_market.emotion_index
      tables:
      - c1_backtest.regime_state_anchored
      - c1_market.emotion_index
      keys:
      - trade_date
      alignment: 同日对齐（两侧共享键同名同频，1:1 行对齐；不做前向填充）
      pit_rule: 信号侧取 t 日行，目标侧取 t+1 日收益，禁未来信息（卡面 signal_derivation 原文冻结）
      key_evidence_a: DDL 真源 schemas/categories/backtest/backtest_regime_state_anchored.py 的 ORDER_BY=trade_date
      key_evidence_b: DDL 真源 schemas/categories/market/market_emotion_index.py 的 ORDER_BY=(trade_date, stage)
      joinable_now: true
  signal_table: c1_backtest.regime_state_anchored（趋势腿列 ma20/ma60/close 实测在册）+ c1_market.emotion_index（stage='close_final'，components 内含 C1_limitup_temp/C2_promotion，实测在册）
  signal_column: 趋势腿=close/ma60−1 与 ma20/ma60−1；涨停温度腿=components.C1_limitup_temp；晋级腿=components.C2_promotion
  signal_derivation: >-
    三腿各取 250 日滚动窗标准化 z 分（窗内均值/标准差，PIT 仅用 t 及以前）；
    合成分 = (z_trend + z_limitup_temp + z_promotion)/3（等权 1/3，禁加权拟合）；
    传导终点 = regime_state_anchored.dominant 的档序（r3=1/r2=2/r1=3/r4=4，阈值 0.30/0.60/0.80 取自源码，本卡不重算）；
    components 的键解析由总包按实测列型固化为单一取数表达式（禁双口径混算，本卡只认 C1_limitup_temp/C2_promotion 两键名，实测出处见 data_window_evidence）。
  target_source: "kline_index symbol='000300' close -> next_day_return = close(t+1)/close(t)-1（口径抄自 TDM-E-L1-S3__calibration__06_promotion_rate_derived.yaml:60）"
  data_window_evidence: >-
    在册引用（本车道未新查 CH，21:00-22:30 禁重查询）：
    （1）`SELECT min(trade_date),max(trade_date),count() FROM c1_backtest.regime_state_anchored`
    → 2017-07-11..2026-10-09 / 4,488 行，列实测 close/ma20/ma60/ma120/vol_pct/dominant/data_source/ingest_ts
    ——出处 docs/03_modules/_domain_backtest/exam_cards/entry_flow/L1/TDM-E-L1__comparison__02_anchored_cap_curve_on_off.yaml:69-77；
    （2）`SELECT toYear(trade_date),uniqExact(trade_date) FROM c1_market.emotion_index WHERE stage='close_final' AND trade_date>='2019-01-01' GROUP BY y`
    → 2019..2025 = 244/243/243/242/242/242/243 天逐年完整，列实测 components/source/stage/version，
    components 内含 C1_limitup_temp/C2_promotion 分量且 source 记 'daban_board_event'
    ——出处 TDM-E-L1-AGG__ablation__02_state_input_replacement.yaml:74-76 与 TDM-E-L1-S3__calibration__06_promotion_rate_derived.yaml:67；
    （3）000300 价：kline_index 实测 1990-12-19..2026-10-09 / 3,104,162 行 / 1,097 symbols，000300 各 1,843 行覆盖 2018-06-01..2025-12-31（同上（1）出处）；
    （4）传导边的在册出处=config/trading_decision_map.yaml:6164-6167（S1/S2/S3/S4→AGG feed daily lag 0d）、
    6183（S5→AGG）、6187（S0→AGG），pit_proof 全标 'legacy-unaudited' ⇒ 本卡正是对该未审计边的机检。
