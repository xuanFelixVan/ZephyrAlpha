schema_version: '1.0'
card_id: TDM-E-L1-AGG/calibration/03_子信号族到状态轴传导保真度
node_id: TDM-E-L1-AGG
family: calibration
title_zh: 子信号族→总闸状态轴传导保真度·校准卡（在册 feed 边真伪）
origin: tdm_edge_registry
hypothesis: >-
  决策图在册 6 条 feed 边（TDM-E-L1-S1/S2/S3/S4/S0/S5 → TDM-E-L1-AGG，
  config/trading_decision_map.yaml:6164-6167,6183,6187）宣称总闸状态轴消费六路传感器；本卡把
  "去波动腿"的三路子信号（趋势/涨停温度/晋级）按冻结等权合成一个合成分，判该分与当日 AGG
  状态档序的秩相关是否 >=0.6——若 |rho|<0.2，则六路消费在状态轴上零传导（除波动腿外的传感器族
  对总闸档位=装饰件，进治理"零触发零消费→退役"候选账）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结（G4-5）；三腿方向先验钉死（趋势↑=偏进攻、涨停温度↑=偏进攻、晋级↑=偏进攻），等权 1/3 合成零拟合，禁事后按实测符号重排；"去波动腿"是本卡的核心设计约束（波动腿与 dominant 同源自 vol_pct，纳入即同义反复，源码实测 anchored_state_machine.py:151），禁以补腿翻案
buckets:
  type: quantile_decile
  'on': 三腿等权合成 z 分（滚动 250 日标准化）
  min_obs_per_bucket: 60
pillars:
  transmission_fidelity: 合成分十分位 × AGG 状态档序（r3=1…r4=4）Spearman 单调 rho>=0.6 —— 传导成立的定义
  zero_transmission_alarm: 若 IS 窗 |rho|<0.2 ⇒ 触发"在册 feed 边名不副实"结论，如实入册并逐腿单列 rho（禁以合成分掩盖单腿方向抵消）
  leg_disaggregation: 三腿各自与档序的 rho 全部建档（n>=60/腿），冗余与抵消面披露
  downstream_increment: 合成分对次日指数收益的日频 IC 均值 >=0.02 且 IC_IR >=0.3（传导若成立须带增量信息，否则即便相关成立也只是共线）
  regime_stability: 牛/熊两段与 OOS 同号
target:
  primary: next_day_index_return（000300 T+1，执行器 shift(-1) 现器口径可用）
  secondary: agg_tier_ordinal（AGG 状态档序，本卡传导终点，机判对象之一）
  note: 传导面卡，终点=状态档序；收益面只作增量旁证，不替代主柱
