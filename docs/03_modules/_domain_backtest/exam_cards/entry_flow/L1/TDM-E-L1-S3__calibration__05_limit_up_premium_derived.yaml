schema_version: '1.0'
card_id: TDM-E-L1-S3/calibration/05_limit_up_premium_derived
node_id: TDM-E-L1-S3
family: calibration
title_zh: 昨日涨停溢价（日线导生截面均值口径）·结果面校准平行卡
origin: tdm_algo_note_l1_s3
parallel_of: TDM-E-L1-S3/calibration/02_昨日涨停溢价
hypothesis: 昨日涨停股集合今日的截面平均溢价（收盘口径与开盘口径两式）分桶对次日沪深300收益单调正相关；开盘溢价>0 而收盘溢价<0 的"高开走低"档是退潮确认的领先信号（打板资金赚不赚钱决定次日接力意愿）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 窗口继承母卡 02，门柱同数值；母卡"平均溢价>2%"绝对阈在导生口径下改为经验分位>80% 档（绝对阈受年度涨停家数漂移影响，卡内先验设定非事后挪柱）
buckets:
  type: quantile_decile
  'on': 当日昨日涨停收盘溢价（截面均值）
  min_obs_per_bucket: 60
  min_set_size: 昨日涨停集合 >= 20 只（不足则该日置 NaN 并剔除，防小截面伪溢价）
pillars:
  response_monotonicity: 分桶中位前向收益 Spearman 单调 rho>=0.6（IS 窗内）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor
  two_form_spread: 开盘溢价与收盘溢价两式分开建档；"开盘溢价>0 且收盘溢价<0"日的次日收益中位数须显著低于全样本（高开走低面，不作一票否决门柱）
target:
  primary: next_day_index_return（CSI300 000300 次日收益）
  secondary: next_day_emotion_index_delta（c1_market.emotion_index stage='close_final' 次日差分）
  note: 溢价是截面均值（series 形），非逐符号面板，故 signal_kind=series
status: examined
lineage:
  card: null
  run_id: mineloop-route-audit-05_limit_up_premium_
  score_row: exam_scores_v1.yaml#rows[33]
  confidence_writeback: TDM.nodes.TDM-E-L1-S3.confidence
preregistered_by: st-nightmine-20261010-L3
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.kline_daily_hfq + c1_market.stk_limit
  signal_column: limit_up_premium_close_derived
  signal_derivation: 先按卡 09 口径标出 t-1 日的涨停集合 S_{t-1}（r_{t-1} >= lim_{t-1}-0.002， r = close/lag(close)-1）；当日溢价 close 口径 = mean
    over i∈S_{t-1} of (close_{i,t}/close_{i,t-1}-1)， 开盘口径 = mean over i∈S_{t-1} of (open_{i,t}/close_{i,t-1}-1)； 全部比值在后复权空间内计算（同一
    symbol 相邻两日复权因子一致，比值免污染）； |S_{t-1}|<20 的日置 NaN。停牌股（t 日无行）不入截面均值并在 run 附注计缺失数。
  target_source: kline_index symbol='000300' close -> next_day_return = close(t+1)/close(t)-1
  data_window_evidence: 命令原文 `SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.kline_daily_hfq`
    → 1990-12-19..2026-09-30 / 10,098,785 / 5,916； `... FROM c1_market.stk_limit` → 2015-01-05..2026-10-09 / 9,254,772 / 5,831；
    join 完备性（2019-01-04..2025-09-09）实测 0 unmatched / 7,590,928 symbol-days； 母卡原绑表 `c1_market.limit_up_down` → 2026-07-20..2026-10-09
    / 5,397 行（冻结窗零行）； 截面规模实测锚（同口径链）：涨停家数年均 44-89 家（2019..2025 = 65.4/81.9/87.9/77.0/44.1/89.2/77.0）， 远大于 min_set_size=20 门槛
    ⇒ 剔除日预计集中在极端冰点日（首跑须把剔除天数写进分数册附注，未测不预填）； 溢价序列数值本卡不预填（禁凭记忆），由考试车道首跑建档。
