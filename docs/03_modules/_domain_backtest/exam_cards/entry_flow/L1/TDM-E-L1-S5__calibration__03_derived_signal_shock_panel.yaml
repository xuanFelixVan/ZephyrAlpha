schema_version: '1.0'
card_id: TDM-E-L1-S5/calibration/03_derived_signal_shock_panel
node_id: TDM-E-L1-S5
family: calibration
title_zh: 日级水温可导生子集（涨跌停比/成交额环比/振幅）·校准平行卡
origin: tdm_algo_note_l1_s5
parallel_of: TDM-E-L1-S5/calibration/02_11信号环比
hypothesis: 11 信号环比中可由日线+涨跌停幅度导生的子集（涨停家数环比、跌停家数环比、涨停/跌停比、成交额环比、指数振幅、创新高家数比、跌破 MA20 家数比）合成 z 分数骤变（|z|>2）事件对次日沪深300收益与情绪段转移有预测力：骤变=状态切换领先；母卡 02 依赖盘中 9:35 首算的 11 信号全集（含炸板走向等盘中量），长窗不可考，本卡取其中 7 项日线可导生子集落地长窗版。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 窗口继承母卡 02；子集 7 项清单与合成方式（等权 z 均值）先验冻结；|z|>2 阈值取母卡同值不放宽；事后挪门柱=作废（G4-5）
buckets:
  type: quantile_decile
  'on': 当日合成 z 分数（7 项等权）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分桶中位前向收益 Spearman 单调 rho>=0.6（IS 窗内）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  lag_profile: t+1..t+3 至少一档 |IC| 达峰值且半衰期 >= 1 交易日
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor
  subset_coverage: 7/11 子集覆盖度须逐年在分数册披露（缺项当年不计入合成，禁补零冒充）
  shock_event_count: "abs(z)>2 事件数年频计数与事件后 3 日收益分布须单列（母卡'骤变=切换领先'的直接可判面）"
target:
  primary: next_day_index_return（CSI300 000300 次日收益）
  secondary: next_day_emotion_index_delta（c1_market.emotion_index stage='close_final' 次日差分）
  note: 本卡只考"环比骤变"这一机制，不考 S0-S4 五档水温映射（映射口径依赖 L1-AGG，归消融卡）
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L1-S5.confidence
preregistered_by: st-nightmine-20261010-L3
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  composite_join_rules:
