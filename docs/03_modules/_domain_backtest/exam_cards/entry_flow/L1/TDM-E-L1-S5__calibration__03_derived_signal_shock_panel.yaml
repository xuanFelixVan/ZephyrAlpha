      right: c1_market.stk_limit
      tables:
      - c1_market.kline_daily_hfq
      - c1_market.stk_limit
      keys: []
      alignment: 同日对齐（两侧共享键同名同频，1:1 行对齐；不做前向填充）
      pit_rule: 信号侧取 t 日行，目标侧取 t+1 日收益，禁未来信息（卡面 signal_derivation 原文冻结）
      key_evidence_a: 查无键面证据（本班不猜）
