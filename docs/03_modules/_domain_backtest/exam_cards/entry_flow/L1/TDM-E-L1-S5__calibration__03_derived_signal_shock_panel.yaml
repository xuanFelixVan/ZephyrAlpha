      alignment: 同日对齐（两侧共享键同名同频，1:1 行对齐；不做前向填充）
      pit_rule: 信号侧取 t 日行，目标侧取 t+1 日收益，禁未来信息（卡面 signal_derivation 原文冻结）
      key_evidence_a: 在册配方表 SQL：symbol 维＋toDate(trade_date) 分组＋anyLast 去重（证据 scripts/backtest/fexam/card_binding.py）
      key_evidence_b: DDL 真源 schemas/categories/market/market_stk_limit.py 的 ORDER_BY=trade_date, symbol
      joinable_now: true
  signal_table: c1_market.kline_daily_hfq + c1_market.stk_limit + c1_market.kline_index
  signal_column: derived_shock_z（7 项环比 z 分数等权合成）
  signal_derivation: >-
    ①涨停家数环比、②跌停家数环比、③涨停/跌停比（L1-S2 卡 09/10 同导生口径，跨卡可比）；
    ④全市场成交额环比 sum(amount)/sum(amount_{-1})-1；⑤指数振幅 (high-low)/close（000300）；
    ⑥创新高家数比 countIf(close >= max(close,60 回看))；⑦跌破 MA20 家数比；
    每项取 60 日滚动均值/标准差标准化为 z，合成 z = mean(z_i)（缺项不补零，直接少项取均值并记覆盖率）；
    实现锚=src/zephyr/signal_ashare/core/daily_condition_sensor.py（TDM module_ref，实测存在）。
  target_source: "kline_index symbol='000300' close → next_day_return；辅轴 emotion_index 次日差分"
  data_window_evidence: >-
    命令原文 `SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.kline_daily_hfq`
    → 1990-12-19..2026-09-30 / 10,098,785 / 5,916（amount/volume/high/low/close 列实测在案，④⑤⑥⑦ 全可算）；
    `... c1_market.stk_limit` → 2015-01-05..2026-10-09 / 9,254,772 / 5,831（①②③ 的 limit_pct 轴，join 实测 0 unmatched）；
    母卡盘中口径的实测约束：个股分钟线无长窗（kline_etf_1min 仅 ETF，2021-07-01 起；tick_data 2026-01-05 起）
    ⇒ 母卡 02 的"9:35 首算盘中环比"在 2019-01-04..2025-09-09 冻结窗内不可复现（blocked_on_data，缺个股盘中历史），
    本卡因此只考日频可导生子集并显式声明 7/11 覆盖；
    导生实测锚（台账 §1.2）：2019..2025 年均涨停 65.4/81.9/87.9/77.0/44.1/89.2/77.0 家、
    年均跌停 26.9/40.3/26.7/29.7/14.7/44.8/31.0 家、炸板率 0.36/0.34/0.33/0.36/0.36/0.38/0.34。
