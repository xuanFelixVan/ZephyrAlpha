origin: reverse_triage_T1_20261011
parallel_of: TDM-E-L1-S2/calibration/06_连板最高高度
hypothesis: 全市场连板最高高度处于自身历史高分位的日子=情绪亢奋顶部区；此类日次日指数收益低于其余交易日，机制是高度依赖少数龙头的梯队结构在高位断裂最快（母卡『高度越高越热→次日接力』先验的反向）。
mother_card_relation: 本卡是母卡 TDM-E-L1-S2/calibration/06_连板最高高度 先验的**反向复述**，来源=在册分数册的负结果（如实复述，非事后加冕）；母卡先验认为该读数对次日指数收益正向，实测样本内与样本外同负，故本卡把『反向』写成可机判的事件开关命题。母卡原行保留在册，不改写不重判（G4-5）。
one_round_limit: 一轮为限：本卡只允许一次开考与一次对账；若一轮后仍未确认，则本命题挂族归档（族=reverse_triage_T1_20261011），禁反复改阈值再考（多重比较防线）。
known_weakness: 母卡在册两段牛熊反号（bull -0.063 / bear +0.016）：event_regime_gap_same_sign 为硬柱，分段反号即 fail，禁只报全样本
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos:
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 窗口逐字继承母卡（未改一日）；事件阈值见 data_binding.signal_derivation。
buckets:
  type: event_flag_two_state_contrast
  'on': 事件日=基序列过去 250 日滚动分位 > 0.80 的交易日
  min_obs_per_bucket: 200
  note: 本卡机判面对象是两组对比（事件日 vs 非事件日）而非分位响应曲线，故不产 mono_spearman；样本门槛由 event_days_min 承担。
pillars:
  event_gap_direction: 事件日次日指数收益必须低于非事件日（is_gap_bp ≤ 0）
  event_gap_significance: Welch t ≤ -2.0（双侧 5% 渐近临界，统计学惯例，非本数据调出）
  event_days_floor: 事件日 n ≥ 200（族内下限 200，卡面往松不采）
  oos_confirmation: OOS 窗 gap 与 IS 窗 gap 同号（单窗不算确认）
  regime_split: 两段行情 regime 的 gap 同号；分段读数逐段入册，禁只报全样本
target:
  primary: next_day_index_return（CSI300 000300 次日收益，执行器 shift(-1) 原生口径）
status: examined
signal_kind: series
pillars_numeric:
  event_gap_max_bp: 0.0
  event_t_stat_max: -2.0
  event_days_min: 200
  event_oos_gap_same_sign: true
  event_regime_gap_same_sign: true
oos_window_ref:
