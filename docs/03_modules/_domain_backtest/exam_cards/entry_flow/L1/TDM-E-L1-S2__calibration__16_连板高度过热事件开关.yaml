preregistered_at: '2026-10-11'
data_binding:
  signal_table: docs/_working/nightmine_campaign/series/max_streak_height.csv（本仓已入库派生序列，零 CH）
  signal_column: max_streak_high_event_v2_event_flag
  signal_derivation: 基序列=max_streak_height（连板最高高度日频序列，与母卡 06 同一底序列）；事件日=基序列过去 250 日**滚动**分位 > 0.80 的交易日（分位一律用历史滚动窗，含当日，暖机段无读数不冒充事件；禁全样本分位＝用未来定过去门槛）；非事件日=同窗内其余交易日；次日收益由执行器
    shift(-1) 对齐，禁在此处换对齐。母卡在册样本窗长（分数册实测 n）扣掉 250 日滚动暖机后可用日数≈D；族内事件日下限 200 ⇒ 事件频率须 ≥ 200/D；本卡取频率 20%（分位>0.80）留一倍余量，此推导只用窗长与门槛，未观察任何收益读数（碰数前冻）。
  target_source: kline_index symbol='000300' close -> next_day_return = close(t+1)/close(t)-1
  data_window_evidence: 在册：广度七序列 CSV 已入 HEAD（max_streak_height.csv 首行 2019-01-04）；母卡 06 在册样本 n=1622 日；可用日≈1622-250=1372，频率
    20% ⇒ 预期事件日≈274 > 200。
