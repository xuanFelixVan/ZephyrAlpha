data_binding:
  signal_table: c1_market.kline_sector_880（close/high/low） + c1_market.kline_index（symbol='000300' close）
  signal_column: kline_sector_880.close, kline_sector_880.high, kline_sector_880.low, kline_sector_880.code,
    kline_sector_880.trade_date, kline_index.close
  signal_derivation: 板块宇宙=industry_l1(61) ∪ industry_ths(128)=189 codes 冻结族（防宇宙 376→729 扩张冒充信号）；
    swing_high/swing_low=滚动 60 交易日 high/low 极值（60 日预热段剔除）；
    fib_ratio=(swing_high-close)/(swing_high-swing_low)，swing_high<=swing_low 记 nan 不补零；
    Fib 分档 fib_score：fib_ratio<=0.382→1.00；(0.382,0.500]→0.85；(0.500,0.618]→0.65；
    (0.618,0.786]→0.35；>0.786→0.00；
    时间分档 day_score（pullback_days=close 距上一次创 60 日新高的交易日数）：3<=d<=10→1.00；
    2<=d<3→0.60；10<d<=15→0.40；d 不属于闭区间 [2,15]→nan（不入级，另按 washed_out_bucket 单独出数时用原始成员）；
    S=0.5×fib_score+0.5×day_score（两腿任一为 nan 则该板块×日 S 记 nan，不做单腿顶替）。
  target_source: kline_index(symbol='000300').close → next_day_return（主轴）；
    辅轴=kline_sector_880.close 的 5 日 forward return 减同期 000300 5 日收益，按三桶分组
  data_window_evidence: 全部引用在册实测（本车道 21:00-22:30 未自取新数）：
