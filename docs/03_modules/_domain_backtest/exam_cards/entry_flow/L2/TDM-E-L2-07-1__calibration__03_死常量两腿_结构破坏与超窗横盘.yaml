family: calibration
title_zh: 回踩结构破坏腿（0.786）与超窗横盘腿（11-15 日）·校准卡
hypothesis: >-
  在码 sector_pullback.py 定义了两个从未接入 grade_pullback 的判据常量——
  FIB_STRUCTURE_BREAK=0.786（">78.6% 趋势结构破坏，回踩转反转"）与
  PULLBACK_HEALTHY_MAX_DAYS=10（"3-10 交易日健康窗"）——而本节点 invalidation 字段原文写死
  "回踩>15 交易日转横盘失效；<2 日属盘中洗盘不入级；>78.6% 趋势结构破坏"。
  前役 L1 台账只登记了"三维 vs 四维"的口径矛盾，既未发现这两个常量是死的，也没有为 invalidation
  三条边界立过任何可判卡。本卡假设：这两腿确有信息——板块×日的"结构完整度分"（Fib 五档×回踩天数四档
  合成，刻意不含量能与强度两维）对次日收益单调（rho>=0.6），且 fib_ratio>0.786 桶与 11-15 日桶的
  板块 5 日超额均 <= 0（若两桶不劣化，则地图 invalidation 文字与死常量应删除而非留档）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: 看数前冻结；Fib 五档边界 0.382/0.500/0.618/0.786 取自在码常量
    （FIB_SHALLOW_MAX=0.50、FIB_DEEP_MAX=0.618、FIB_STRUCTURE_BREAK=0.786）与地图 38.2% 主张的并集，
    时间四档边界 2/3/10/15 取自在码常量（PULLBACK_MIN_DAYS=2、PULLBACK_HEALTHY_MAX_DAYS=10、
    PULLBACK_STALE_DAYS=15）；两维权重固定 0.5/0.5（不估权重，估权是另一张卡的事）；
    与 L2-07-1/calibration/02 的分工=02 考四因子合成分（含量能/强度）的响应曲线，本卡只考地图 invalidation
    对应的两腿，两卡对象不同不得互替
buckets:
  type: quantile_quintile
  'on': 板块×日的结构完整度分 S（0-1， Fib 五档分×0.5 + 时间四档分×0.5）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分桶中位次日收益 Spearman 单调 rho>=0.6（IS 窗内，S 越高分越高越好）
  ic_floor: 日频截面 IC 均值 >= 0.02 且 IC_IR >= 0.3
  deep_break_bucket: fib_ratio>0.786 档子集（S 的低分腿单独出数）的板块 5 日超额 <= 0，
    且必须劣于 0.618-0.786 档（两档并列报数，缺一即判据不成立）
  stale_days_bucket: pullback_days∈(10,15] 子集的板块 5 日超额 <= 0，且劣于 3-10 日档
    （PULLBACK_HEALTHY_MAX_DAYS=10 的直接检验）
  washed_out_bucket: pullback_days<2 子集单独出数（地图主张"属盘中洗盘不入级"，若不劣化则该句应改）
  lag_profile: S 的效应峰值落在 t+1..t+3、半衰期 >= 1 交易日（结构破坏是慢变量，若峰值在 t+5 之后
    则说明读到的是别的东西）
  regime_stability: bear/rebound 两段同号（结构破坏腿在熊段更该显形）
target:
  primary: next_day_index_return（CSI300 次日收益，series 面，执行器 shift(-1) 现器可考）
  secondary: sector_next5d_excess（板块 5 日超额，panel 主对象，三桶并列判据在此读出；辅轴不作为过考门柱）
  note: 出分只裁定"两腿是否有信息"，不裁定四因子权重（那是 02 卡的题）；
    若两腿均不显著，建议动作=删地图 invalidation 里的 78.6% 句并在码删除死常量（施工侧提案，本卡不代改）
