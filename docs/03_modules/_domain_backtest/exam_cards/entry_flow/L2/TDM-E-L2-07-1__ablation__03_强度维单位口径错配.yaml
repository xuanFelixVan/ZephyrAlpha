schema_version: '1.0'
card_id: TDM-E-L2-07-1/ablation/03_强度维单位口径错配
node_id: TDM-E-L2-07-1
family: ablation
title_zh: 回踩强度维单位口径（地图 >7 vs 在码 70/40）·消融卡
hypothesis: >-
  同一节点里"板块强度"存在三套单位：TDM-E-L2-07-1 文字写"板块强度（>7）"（10 分制语感）、
  在码 sector_pullback.py 用 STRENGTH_STRONG=70.0/STRENGTH_MEDIUM=40.0 且 docstring 注明"板块强度分 0-100"、
  接线模块 sector_strength_wiring 注明"结构强度=strength_score（0-100 直用）"、
  同战役 L2-06-3 两张卡则按"板块强度 10 分制"取数。三套单位不可能同时为真。
  本卡假设：强度维的实际信息量取决于单位口径——在码 0-100 口径（70/40）下强度维有区分度；
  若按地图字面 ">7" 接到 10 分制读数上则恒为 A，强度维退化为常数（零信息），
  此时"摘掉强度维（恒 A）"臂与"保留强度维"臂的判别面差异≈0。
  两臂差异若落在噪声内，则本节点的强度维从未真正参与定级（构成地图口径修订与维退役的裁定材料）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: 看数前冻结；两臂唯一差异=强度维取值（arm_open 用 0-100 截面分位分接 70/40 阈值，
    arm_base 令强度维恒为 A 档）；Fib/量能两维与三维取 min 的规则两臂完全相同；
    本卡不复用 L2-07-1/calibration/02 的"强度分=两路合成分/100、>7 为节点门槛"口径（那是一张响应曲线卡，
    本卡考单位错配的后果），三卡不得互相顶替
buckets:
  type: ablation_arm
  'on': 'arm 集合 {arm_open_strength_live=强度维按 0-100 阈值 70/40 生效, arm_base_strength_always_A=强度维恒 A(地图 ">7" 遇 10 分制的必然退化态)}'
  min_obs_per_bucket: 60
pillars:
  ablation_marginal: 保留强度维臂相对恒 A 臂 MaxDD 改善 >= 3pp 且 Sharpe 差 >= 0.1（有边际=强度维在 0-100 口径下确实带信息）
  grade_distribution_collapse: 恒 A 臂下三维取 min 的定级分布须单独出数——若 A+B 档合计占比与在码臂相差 <5pp，
    则判定强度维对本节点定级近乎无影响（单位错配=死维的机判证据）
  ic_floor: 强度维单维标量（0-100 归一）与次日收益的截面 IC 均值 >= 0.02、IC_IR >= 0.3（单维下限，低于合成分判据）
  regime_stability: bear/rebound 两段同号（熊段强度维更该有保护价值）
  caliber_audit_disclosure: 开考前须实测定格 sector_report_builder（MOD-L00-009）日频报告 JSON 的
    strength_score 取值域（0-10 还是 0-100）并把结论写进 run 记录；本卡两臂不因此实测改判据面（G4-5）
target:
  primary: next_day_index_return（CSI300 次日收益，双臂共用同一目标序列，执行器 shift(-1) 口径）
  secondary: sector_next5d_excess_by_grade（各等级板块 5 日超额，辅轴=两臂定级分布的收益分层是否错位）
  note: 与 L2-07/ablation/02（离散化 vs 连续 vs 不门控）、L2-07/ablation/03（不评级样本归属）、
    L2-07-1/calibration/02（四因子合成分响应曲线）四卡对象互不重叠；本卡只摘强度维一臂
