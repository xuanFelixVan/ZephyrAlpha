data_binding:
  signal_table: c1_market.kline_sector_880（close/high/low/amount） + c1_market.kline_index（symbol='000300' close）
  signal_column: kline_sector_880.close, kline_sector_880.high, kline_sector_880.low, kline_sector_880.amount,
    kline_sector_880.code, kline_sector_880.trade_date, kline_index.close
  signal_derivation: 板块宇宙=industry_l1(61) ∪ industry_ths(128)=189 codes 冻结族；
    Fib 维=fib_ratio=(swing_high-close)/(swing_high-swing_low)（滚动 60 日极值，60 日预热段两臂同步丢弃），
    按在码阈值定档（<=0.50=A、<=0.618=B、else=C）；
    量能维=vol_ratio 序列按 classify_volume_pattern 复算定档（SHRINKING=A、EXPANDING=C、MIXED=B）；
    强度维（arm_open）=sector_strength_100=该板块 20 日收益在 189 codes 冻结宇宙内的截面百分位×100，
    定档 >=70=A、<40=C、其余=B；
    强度维（arm_base）=恒 A（等价于把 ">7" 解释为 10 分制读数时的必然结果，也等价于摘除该维）；
    定级=三维取最弱档（max of _GRADE_ORDER），两臂同一函数；
    时间门（pullback_days 不属于闭区间 [2,15] → 不评级）两臂同规则且不评级样本两臂权重均置 0
    （归属问题由 L2-07/ablation/03 专卡考，本卡不涉及）。
  target_source: kline_index(symbol='000300').close → next_day_return（主轴，双臂共用）；
    辅轴=kline_sector_880.close 5 日 forward return 减同期 000300 5 日收益，按等级分组
  data_window_evidence: 全部引用在册实测（本车道 21:00-22:30 未自取新数）：
    ①kline_sector_880 industry_l1=2021-08-02..2026-10-08/78263 行、industry_ths=同窗/163038 行（前役 L1 台账 §3-P4）；
    ②kline_index 000300=2005-01-04..2026-10-09/5284 行（§3-P10）；
    ③sector_state.strength 2022..2025 全 0、2026 才 25317/89029 ⇒ 强度读数必须重算、禁直读（§3-P9/A6）；
    ④板块 codes 宇宙 376→729 在扩 ⇒ 截面分位分母族冻结为 189 codes（§3-P9）。
    口径矛盾凭据（本车道直读源码所获，非 CH 取数）：
    sector_pullback.py 第 48-49 行 STRENGTH_STRONG=70.0/STRENGTH_MEDIUM=40.0、第 141-146 行按该两值定档、
    sector_pullback.py 第 141-146 行按该两值定档、docstring 注明"sector_strength=§3.1① 板块强度分 0-100"；
    src/zephyr/signal_ashare/core/sector_strength_wiring.py 第 27 行"结构强度=strength_score（0-100 直用）"；
    config/trading_decision_map.yaml 第 1484 行节点文字"板块强度（>7）"。三处单位不一致=本卡考点。
  impl_ref: src/zephyr/signal_ashare/sector/sector_pullback.py（MOD-SIG-026）+ MOD-SIG-116；
    前役 L1 台账 §1 L2-07-1 行记"在码三维 vs 地图四维（缺时间窗）口径不一致已登记"——本车道复挖实测该表述不准确：
