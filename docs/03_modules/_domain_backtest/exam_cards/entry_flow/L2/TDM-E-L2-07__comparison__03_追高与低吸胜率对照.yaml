  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L2-07.confidence
preregistered_by: st-mineloop-20261010-L12
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: panel
pillars_numeric:
  maxdd_improvement_min: 5.0
  sharpe_delta_min: 0.2
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.kline_sector_880（close/high/low/amount） + c1_market.kline_index（symbol='000300' 的 close）
    + c1_market.stk_limit（涨停剔除面，不复权 kline_daily 配套口径）
  signal_column: kline_sector_880.close, kline_sector_880.high, kline_sector_880.low, kline_sector_880.amount,
    kline_sector_880.code, kline_sector_880.trade_date, kline_index.close, stk_limit.up_limit
  signal_derivation: 板块宇宙=industry_l1(61 codes) ∪ industry_ths(128 codes) 冻结族（=189 codes，防板块宇宙
    376→729 扩张冒充信号，凭据=前役台账 §3-P4/P9）；swing_high=滚动 60 交易日 high 最大值、
    swing_low=滚动 60 交易日 low 最小值（各含 60 日预热，预热段两臂同步丢弃）；
    fib_ratio=(swing_high-close)/(swing_high-swing_low)（swing_high<=swing_low 的样本记 nan 不补零）；
    pullback_days=close 距上一次创 60 日新高的交易日计数；
    vol_ratio5=roll_mean(amount,5)/max(amount,60)；
    臂 A（低吸）成员=fib_ratio∈[0.382,0.618] 且 vol_ratio5<=0.50 且 pullback_days∈[2,15]；
    臂 B（追高）成员=close>=swing_high（即 fib_ratio=0.0，创 60 日新高）且 pullback_days 无约束；
    两臂权重矩阵=成员日取 1、非成员日取 nan（不做全市场归一，保证同一行集配对）；
    涨停剔除=当日板块内 close>=stk_limit.up_limit 的 symbol-day 不计入胜率分子分母（板块层用触及家数占比>50%
    判整板块不可成交并剔除该板块×日）。
  target_source: kline_index(symbol='000300').close → next_day_return（主轴，双臂共用）；
    辅轴=kline_sector_880.close 的 5 日 forward return 减同期 000300 5 日收益 → 按臂取 win_rate
  data_window_evidence: 全部引用在册实测（21:00-22:30 禁 CH 重查询，本车道未自取新数）：
    ①kline_sector_880 行业族 industry_l1=2021-08-02..2026-10-08/78263 行、industry_ths=同窗/163038 行，
    close/high/low/amount 满配（前役 L1 台账 §3-P4）；②kline_index 000300=2005-01-04..2026-10-09/5284 行
    （§3-P10）；③涨停判定 MUST 用不复权 c1_market.kline_daily 配 c1_market.stk_limit，
    stk_limit=2015-01-05..2026-10-09/9254772 行（§3-P7），用 kline_daily_hfq 会得 3882 家涨停荒谬值
    （任务书 §3"涨停判定口径"行）；④sector_state.strength 2022..2025 全 0 ⇒ 本卡不直读该列（§3-P9/A6）；
    ⑤60 日预热使 IS 有效起点约 2021-11，约 515 交易日×189 板块（§3-P4 同批推算）。
    本卡未新增实测项；若总包 22:30 后实测发现 amount/high/low 分年缺口，按 blocked 处理不改判据面。
  impl_ref: src/zephyr/signal_ashare/sector/sector_pullback.py（module_ref=MOD-SIG-026，module_mounts=MOD-SIG-116）；
    fib_retrace_ratio 与 PULLBACK_MIN_DAYS=2/PULLBACK_STALE_DAYS=15 为在码既有常量，本卡臂 A 的入组条件与之对齐
  blocked_scope: 无（板块指数面自 2021-08-02 可考；个股层追高/低吸对照属 L3 对象，本卡不越界）
sources:
- 族级矿脉 S6 回踩/Fibonacci 买点（学术证据薄=待验证），URL+发布方+年份见前役 L1 台账 §2-S6；
