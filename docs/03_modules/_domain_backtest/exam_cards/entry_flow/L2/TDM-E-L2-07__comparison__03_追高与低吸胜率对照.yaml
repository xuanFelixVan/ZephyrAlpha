schema_version: '1.0'
card_id: TDM-E-L2-07/comparison/03_追高与低吸胜率对照
node_id: TDM-E-L2-07
family: comparison
title_zh: 回踩低吸 vs 追高突破·胜率对照卡
hypothesis: >-
  TDM 本节点 algo_note_zh 原文写死"回踩是买点质量的核心判据——追高和低吸的胜负率差一倍"，
  这是一句可判数值主张（胜率比≈2.0），前役 L1 车道在本节点只立了一张消融卡（考离散化与门控），
  该"差一倍"主张从未被任何卡冻结过。本卡假设：在同一板块×日样本上，低吸臂
  （板块处于 fib_ratio∈[0.382,0.618] 回踩带且缩量）相对追高臂（板块 close 创 60 日新高）
  的次日判别面满足 日胜率比 >= 2.0；若实测胜率比 < 1.5，则节点措辞"差一倍"应改写（地图文字裁定材料）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: 看数前冻结；两臂共用同一行集（paired_arm_protocol：仅入组条件异，零行循环差异）；
    fib_ratio 与新高判定全部用本卡 signal_derivation 自算口径，禁直读 sector_state 列（该列 2022..2025
    实测 strength 全 0，在册前役台账 §3-P9）；臂 A 的带宽 [0.382,0.618] 与臂 B 的 60 日新高窗一经冻结不得回改
buckets:
  type: dim_pair
  'on': 'arm 对 {arm_A_pullback_buy=低吸, arm_B_breakout_chase=追高}（板块×日二值成员，同一目标行集）'
  min_obs_per_bucket: 60
pillars:
  win_rate_ratio: 低吸臂日胜率 / 追高臂日胜率 >= 2.0（IS 窗内，"差一倍"的字面判据）
  paired_edge: OOS 段配对 Sharpe 差 >= 0.2 且 MaxDD 改善 >= 5pp（低吸臂为开臂）
  regime_stability: bear/rebound 两段同号（回踩买点理应在熊段更占优，反向即主张失效）
  tradability_guard: 追高臂在 close 触涨停（c1_market.stk_limit 不复权口径）的样本按不可成交剔除，
    两臂套同一剔除规则后再计胜率（防把买不到的板算成赢）
  null_leg_disclosure: 时间窗外（pullback_days 不属于闭区间 [2,15]）的样本两臂同步剔除，不得只喂一臂
target:
  primary: next_day_index_return（CSI300 次日收益，双臂共用同一目标序列，执行器 shift(-1) 口径）
  secondary: sector_next5d_win_rate_by_arm（板块 5 日超额>0 的占比，两臂各算；胜率比在此读出）
  note: 本卡考"追高/低吸"两买点类型的相对质量，与 L2-07/ablation/02（离散化与门控边际）、
    L2-07-1/calibration/02（四因子合成分响应曲线）三卡对象互不重叠；出分不得外推到个股层（对象=板块）
status: preregistered
