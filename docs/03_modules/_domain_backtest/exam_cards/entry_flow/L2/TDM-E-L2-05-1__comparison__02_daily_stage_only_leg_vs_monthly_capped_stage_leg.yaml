hypothesis: 图面 dq＝「日级温度计（S5 当日读数主判）落在哪档+月/周封顶后最终档位」。兄弟卡在册合成式原样引用＝日级档=emotion_index 按在册六段阈值分档（S0..S5）；月级态=自然月聚合 000300 月收盘的 7 态（月收盘 vs 月 MA3 上下 × 月涨跌三档 × 连续两月同向修正，其中「月级熊市反弹」判定=月收盘<月 MA3 且当月涨幅>0）；最终档=min(日级档,
  月级允许上限)。本卡对照题设＝把交易日按两腿是否同档分成「同档日／改档日」两集，只在改档日上分账月级封顶的独占贡献＝该日集合上纯日级档对 next_day_index_return 的错配方向与幅度，相对全体差异日的占比。若改档日极少则月级腿属低频冗余（可派生→并）；若改档日集中于「月级熊市反弹」态且这些日子纯日级档系统性偏高，则月级腿覆盖的是另一对象（月级结构），跨维不并。在册限定＝六段词表与
  7 态定义逐字承兄弟卡（六段词表已裁定在册，勿重裁），本卡不重算日级档、不改 min 语义、禁在 2025-09-09 后取判据值。
