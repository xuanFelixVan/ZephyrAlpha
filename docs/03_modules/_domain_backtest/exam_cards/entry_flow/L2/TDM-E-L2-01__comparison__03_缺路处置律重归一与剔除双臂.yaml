data_binding:
  signal_table: c1_market.kline_sector_880（两臂共用底座，period='1d'）
  signal_column: kline_sector_880.close、kline_sector_880.amount
  signal_derivation: >-
    截面族冻结=industry_l1 ∪ industry_ths（承同车道统一分母族，剔除 880001-880011 市场统计指数），
    分位/占比按日在数 code 计算；
    路A/路B 子分逐字承 comparison/02 的 signal_derivation；
    屏蔽集=固定种子 20261010 下对 (板块,交易日) 二维抽 20% 置路B 为缺失，双臂共用同一屏蔽集；
    arm_A：composite=mean(可用路)×100（两路齐⇒(A+B)/2；仅余路A⇒路A×100），随后 clamp [0,100]；
    arm_B：被屏蔽板块当日整体退出截面（不进 rank、不进分母、不入池，等价 MOD-SIG-144 现行为）；
    两臂各自加市场级调节 ±10（承 ablation/02 的水温档查表口径）后取 Top-15% 池；
    组合收益=池内 880 行业族指数次日等权收益均值。
  target_source: kline_index 000300 close→次日收益（Sharpe/MaxDD 基准与市场级超额）
  data_window_evidence: >-
    引用在册实测，本车道未跑 CH 重查询（21:00–22:30 禁令）：
    ①c1_market.kline_sector_880 行业族=2021-08-02..2026-10-08（industry_l1 78263 行/61 codes、
    industry_ths 163038 行/128 codes，L1 台账 §3-P3/P4）；
    ②缺失工况的现实性=结构路（板块内涨停占比）与资金流路（板块主力净流入）在 2026-07-22 前不可算
    （sector_constituent 仅 6 个刷新日、快照表仅 19 个交易日，L1 台账 §3-P6/P7），
    故"缺路处置"不是假想工况而是全窗常态；
    ③在码三套口径的正查凭据=trading_decision_map.yaml:772（fallback 重归一+置信衰减）、
    sector_strength_aggregator.py:46-48/76-82/111-121（fail-closed raise，无置信衰减字段）、
    sector_strength_wiring.py:8（缺维板块剔除不入池）；本车道实读三件原文行号如左，未凭记忆。
  impl_ref: src/zephyr/signal_ashare/core/sector_strength_aggregator.py（MOD-SIG-142）
    + src/zephyr/signal_ashare/core/sector_strength_wiring.py（MOD-SIG-144，在产缺失语义）
    + scripts/backtest/fexam/calibration_exam.py:run_card（双臂机判正门）
executor: >-
  考卷侧需 ≤60 行 arm driver（两路子分→固定种子屏蔽→两种处置→各自 Top-15% 池→两条组合日收益序列），
  被测件与取数件均在岗，缺的是组装而非实现 ⇒ 标 preregistered 非 blocked_on_impl。
