schema_version: '1.0'
card_id: TDM-E-L2-01/comparison/03_缺路处置律重归一与剔除双臂
node_id: TDM-E-L2-01
family: comparison
title_zh: 子分缺失处置律·重归一（地图）vs 整条剔除（在产接线）双臂对照卡
hypothesis: >-
  本节点的缺失维度处置律存在三套并存口径且从未被考：地图 TDM-E-L2-01 的 fallback 字段原文
  "任一维度缺失时按剩余维度归一化输出并标注置信衰减"（config/trading_decision_map.yaml:772）；
  被测核 MOD-SIG-142 对缺失/负值/非有限子分是 fail-closed 抛 SectorStrengthInputError
  （sector_strength_aggregator.py:46-48、76-82、111-121，且 SectorStrength 字段面无任何置信衰减字段，
  件内注释第 8 行明写"输入越界/缺失维度/NaN → fail-closed"）；
  在产接线 MOD-SIG-144 则执行第三条路——"缺任一维度的板块剔除并记 note（保守不入池）"
  （sector_strength_wiring.py:8 INVARIANTS）。前役 L1 只在 ablation/02 写了一条
  pillar "degraded_flag_honesty：缺席必须标 degraded、禁静默补零"，从未把"重归一 vs 剔除"作为可判对象。
  本卡一句话：在四路中两路长期缺席的现实工况下，处置律取"重归一（可用路均值×100，保留在截面竞争中）"
  相对"整条剔除（当日退出排名分母）"，其候选池组合的 OOS Sharpe 差 >= 0.10 或 MaxDD 改善 >= 1.5pp，
  则地图口径占优、接线层须改；两臂均不达标则剔除口径（在产）不失据，地图 fallback 应改写为剔除语义。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: >-
    看数前冻结（G4-5）。窗与子分口径逐字承同车道 ablation/02 与本车道 comparison/02（两路可算面：
    路A amount rank-pct+5 日环比、路B 0.2q3+0.3q5+0.5q20 rank-pct），不重造不改系数。
    缺失工况的构造方式在开考前钉死一种=**逐板块随机屏蔽路B 的 20% 板块-日**（固定伪随机种子 20261010，
    同种子双臂同屏蔽集，双臂唯一差别=被屏蔽板块的处置方式）；
    事后换屏蔽率或换屏蔽规则=作废。市场级调节 ±10 在两臂同样施加（承 ablation/02 的 full2+market_adj 语义），
    本卡不重考调节臂。
buckets:
  type: dim_pair
  'on': 处置律双臂 {arm_A_renormalize=可用路均值×100 并保留参与排名, arm_B_exclude=该板块当日退出排名分母且不入池}
  pairing: 同一子分底座、同一屏蔽集、同一 Top-15% 池规则，双臂逐日配对（仅缺失处置方式不同）
  min_obs_per_bucket: 60
pillars:
  sharpe_delta: arm_A 相对 arm_B 的 OOS 年化 Sharpe 差 >= 0.10（IS 同向须成立）
  maxdd_delta: arm_A 的 OOS MaxDD 相对 arm_B 改善 >= 1.5pp；单项达标判 partial 并如实入册
  pool_denominator_effect: 双臂逐日池规模 N 与 ceil(N×0.15) 之差须计数披露——剔除臂的分母系统性缩小，
    若池规模差 >= 1 个 code 则"前 15%"在两臂下不是同一件事，本条必须写进出分材料（防分位漂移冒充信号）
  adjustment_leverage: 重归一臂的合成分基数不变，剔除臂等价于把缺席路的信息清零退出；
    须报告两臂的 ±10 市场调节相对影响面（池成员在调节翻转日的占比差），若 arm_A 的调节翻转率显著高于 arm_B，
    则重归一放大了调节杠杆（本卡登记的机制性副产品，独立于通过判据）
  confidence_decay_field: 地图要求"标注置信衰减"，被测件无该字段 ⇒ 本卡出分不依赖该标注；
    但该缺项登记为待施工裁决材料（不改码、不改地图，只入台账）
  regime_split: bear/rebound 两段 arm_A−arm_B 利差同号；反号⇒限定结论适用范围
target:
  primary: 双臂池等权组合的 OOS 年化 Sharpe 差与 MaxDD 改善（底座=c1_market.kline_sector_880 行业族指数次日收益）
  secondary: 双臂池成员逐日重合率（arm_pool_overlap_ratio，纯诊断，>= 0.95 判 DEVICE_INCONCLUSIVE）
  note: 本卡考"缺路怎么处置"，不考"哪一路重要"（后者=ablation/02）与"权重怎么定"（后者=本车道 comparison/02）
