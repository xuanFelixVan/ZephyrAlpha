data_binding:
  signal_table: c3_fundamental.research_report（industry, rating, publish_date, org_name, symbol） +
    c3_fundamental.earnings_forecast（symbol, first_announce_date, forecast_type, profit_change） +
    c1_market.kline_daily（不复权，涨停可买性判定） + c1_market.kline_index（symbol='000300' close）
  signal_column: research_report.industry, research_report.publish_date, research_report.symbol,
    earnings_forecast.symbol, earnings_forecast.first_announce_date, earnings_forecast.forecast_type,
    earnings_forecast.profit_change, kline_daily.close, stk_limit.up_limit, kline_index.close
  signal_derivation: 行集=symbol×交易日（宇宙=symbol→industry 可解析的票，映射口径=同一 symbol 在 ≤T 最近一次
    research_report 里出现的 industry，取不到则该票该日记 nan 不补零）；
    臂 A（恒定 +20%）：industry 催化剂态=该 industry 过去 5 个交易日研报条数的截面 z 分，z>0 记"有当下催化剂"，
    该 industry 内全部 symbol×日 weight=1.2，其余 weight=1.0；
    臂 B（指数衰减）：事件源=earnings_forecast 按 first_announce_date 归集（PIT 纪律=只用 first_announce_date≤T
    的行，同一 (symbol, report_period) 只取首次披露，修订稿不回溯覆盖）；
    direction=forecast_type∈{预增,扭亏}→+1、∈{预减,首亏}→−1、其余类型→0（十类取值以开考前实测枚举核对，
    本卡只声明映射规则）；strength=|profit_change 的 (min+max)/2| 经 1%–99% 截尾后除以 100 并 clip 到 [0,1]；
    age_days=自 first_announce_date 起算的交易日数；weight=1+direction×strength×2^(−age_days/4.0)，
    age_days>20 的 weight 记 nan（衰减尾部不入组）；
    两臂权重矩阵行对齐（同一 symbol×日同时有两值才入配对，缺一侧则该日剔两臂）。
  target_source: kline_index(symbol='000300').close → next_day_return（主轴，双臂共用）；
    辅轴=kline_daily（不复权）close 的 5 日 forward return 减同期 000300 5 日收益，按臂权重加权
  data_window_evidence: 全部引用在册实测（本车道 21:00-22:30 未自取新数）：
