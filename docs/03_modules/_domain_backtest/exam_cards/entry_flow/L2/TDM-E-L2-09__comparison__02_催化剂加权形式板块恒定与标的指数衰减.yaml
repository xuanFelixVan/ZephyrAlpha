schema_version: '1.0'
card_id: TDM-E-L2-09/comparison/02_催化剂加权形式板块恒定与标的指数衰减
node_id: TDM-E-L2-09
family: comparison
title_zh: 催化剂加权形式（地图板块恒定 +20% vs 在码标的指数衰减）·对照卡
hypothesis: >-
  本节点存在两种互不相容的催化剂加权形式，且都从未出过分：
  ①地图 algo_note_zh 写死"有当下催化剂的板块加权 20%"（板块级、恒定、无时效）；
  ②在码 event_driven_screener.py 第 27/124-129 行实现的是标的级指数衰减
  weight = 1 + direction×strength×2^(−age/半衰期)，其中 EARNINGS 半衰期=4.0 交易日（第 66 行 _EVENT_HALFLIFE），
  代码里根本没有"20%"这个常数（config 侧 EventScreenConfig 四个字段=None min_confidence 0.7、
  extreme_reaction_pct 3.0、conduction_risk_max 0.7、capacity_target 30）。
  前役三卡（02 密度/03 上调占比/04 业绩净占比）考的都是"催化剂读数本身有没有预测力"，
  没有一张考"该按哪种形式将催化剂注入排序"。本卡假设：在 symbol×日同一行集上，
  在码指数衰减形式的次日判别面优于地图恒定 +20% 形式（Sharpe 差 >= 0.1、MaxDD 改善 >= 3pp）；
  若不优于，则地图"加权 20%"应改写成衰减口径（文字裁定材料）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；两臂共用同一 symbol×日行集与同一目标序列（paired_arm_protocol：仅权重形式异）；
    衰减形式与半衰期常数取在码既有值（2^(−age/4.0)，EARNINGS 腿），恒定加权形式取地图字面值（×1.2）；
    symbol→industry 映射沿用同节点 04 卡已冻结的派生口径（≤T 最近一次 research_report 的 industry），
    本卡不改该口径；两臂的催化剂成员判定阈值（密度 z>0）一经写死不得回改
buckets:
  type: dim_pair
  'on': 'arm 对 {arm_A_map_flat_20pct=板块级恒定 +20%（地图文字版）, arm_B_code_exponential_decay=标的级 1+direction×strength×2^(−age/4.0)（在码版）}'
  min_obs_per_bucket: 60
pillars:
  paired_edge: 在码衰减臂相对恒定 20% 臂 Sharpe 差 >= 0.1 且 MaxDD 改善 >= 3pp（OOS 段）
  ic_floor: 两臂权重标量各自与次日收益的截面 IC 均值 >= 0.02、IC_IR >= 0.3（一臂不过即形式失效）
  half_life_check: 在码臂的 age=0..8 逐日 IC 衰减须接近 2^(−age/4) 形状（实测半衰期落在 [2,8] 交易日带外即
    _EVENT_HALFLIFE 应改，这是"初拟待校准"四字的直接结账）
  flat_leg_breadth: 恒定 20% 臂须单独出"命中板块数占比"——催化剂覆盖面 >60% 时 +20% 退化为无效常数平移，
    该退化态要写明不得藏进 IC
  regime_stability: bull/bear 两段同号（牛段靠故事接力、熊段故事失灵是节点文字的隐含前提）
  tradability_guard: T+1 与涨停不可买（臂内 close 触涨停的 symbol-day 不计成交），两臂同规则
target:
  primary: next_day_index_return（CSI300 次日收益，双臂共用同一目标序列，执行器 shift(-1) 现器可考）
  secondary: symbol_next5d_excess_weighted（按臂权重加权的 5 日超额，辅轴=形式对排序质量的边际；
    需成分/行业映射，窗受限见 evidence）
  note: 出分只裁定"加权形式"，不裁定催化剂读数本身的预测力（那是 02/03/04 三卡的题）；
    政策/事件类催化剂腿（POLICY/SUDDEN/MERGER/IPO/GEO 五类半衰期）在码有常量无落库标注面，
    本卡只用 EARNINGS 腿，不得外推到政策催化剂有效
