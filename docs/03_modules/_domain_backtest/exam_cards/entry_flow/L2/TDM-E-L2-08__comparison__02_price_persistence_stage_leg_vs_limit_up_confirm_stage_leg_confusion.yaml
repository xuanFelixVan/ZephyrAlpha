hypothesis: 图面 dq＝「这个板块自己走到生命周期哪一段了（启动/发酵/高潮/熄火）」。兄弟卡在册两出面原样引用＝可算面：强度分（两路合成分，共用 L2-01 重算）的 5 日自相关 A(5)，与板块 20 日收益/20 日波动的 t 值，两指标各自二分交叉成四段；确认面（该卡自标受限）：高潮=板块内涨停家数占比（需成分）、熄火=龙头断板 ∧ 炸板率>40%（需 limit_up_pool.open_board_count/首触数据）。本卡对照题设＝同一
  sector×同一全局交易日两面对四段的归属一致率与混淆结构，重点在两类错配＝确认面判「高潮」而价格面判「发酵」、确认面判「熄火」而价格面判「高潮」。若价格面已能覆盖确认面的档划分（混淆集中于可容忍档），则生命周期可只用 kline_sector_880 复算，确认腿属可派生冗余→必并；若错配集中在高潮/熄火两端，则该族门柱在确认史补齐前不得以价格面替代（跨源不并）。有效分母限定＝两面均可算的 sector×日
  子面；在册缺源须同框登记＝limit_up_pool 的 consec_limit 面仅自 2026-09 起可用（本线多次复证），故本班把「分母不足即不出数」写为判据前置，禁把价格面单侧结论读成生命周期已证。
