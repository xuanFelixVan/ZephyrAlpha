    故本卡的 emotion 腿须按 implementation_gap ② 的在册取法装载，否则日频面被造第二读数。
  impl_ref: src/zephyr/signal_ashare/sector/sector_gate.py + MOD-SIG-059/094/107/131（象限口径真源
    =src/zephyr/signal_ashare/sector/sector_rrg.py :109-157）
