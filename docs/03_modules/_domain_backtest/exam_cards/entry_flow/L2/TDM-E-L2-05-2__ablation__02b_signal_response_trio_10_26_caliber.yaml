      pit_rule: 信号侧取 t 日行，目标侧取 t+1 日收益，禁未来信息（卡面 signal_derivation 原文冻结）
      key_evidence_a: DDL 真源 schemas/categories/market/market_emotion_index.py 的 ORDER_BY=(trade_date, stage)
      key_evidence_b: 在册读取件 SQL 常量：SELECT trade_date, sector_code, sector_name, close … WHERE period='1d'（证据 scripts/backtest/p1_conditional_tables.py）
      joinable_now: true
    - left: c1_market.kline_index
      right: c1_market.kline_sector_880
      tables:
      - c1_market.kline_index
      - c1_market.kline_sector_880
      keys:
      - trade_date
      alignment: 同日对齐（两侧共享键同名同频，1:1 行对齐；不做前向填充）
      pit_rule: 信号侧取 t 日行，目标侧取 t+1 日收益，禁未来信息（卡面 signal_derivation 原文冻结）
      key_evidence_a: 在册配方表 SQL：symbol 维＋toDate(trade_date) 分组＋anyLast 去重（证据 scripts/backtest/fexam/card_binding.py）
      key_evidence_b: 在册读取件 SQL 常量：SELECT trade_date, sector_code, sector_name, close … WHERE period='1d'（证据 scripts/backtest/p1_conditional_tables.py）
      joinable_now: true
  signal_table: c1_market.kline_sector_880 + c1_market.emotion_index + c1_market.kline_index
  signal_column: kline_sector_880.close/amount；emotion_index.emotion_index；kline_index.close(000300 基准)
  signal_derivation: >-
    板块强度=两路合成分（与 L2-01 共用重算）；水温档=emotion_index 六段（与 L2-05-1 共用）；
    象限=RS-Ratio 与 RS-Momentum 双 EMA 式对 100 中枢四分（与 L2-02-1/02b 共用口径，
    构造式逐字承在册 sector_rrg.py:19-22：RS = 100 × P_sector / P_bench、
    RS-Ratio = EMA(RS, 10) / EMA(RS, 26) × 100、RS-Momentum = EMA(RS-Ratio, 10) / EMA(RS-Ratio, 26) × 100）；
    arm 变量：权重缩放=按档乘 0.5/0.8/1.0/1.2；门槛升降=池规模分位上下移一档；
    象限过滤=水冰档只保留 leading/improving 象限板块。
    三件全用=查表切换；单件剔除=该件退回中性值（权重 1.0/门槛不升/不过滤）。
    板块宇宙=sector_code_name_map.code_family IN (industry_l1, industry_ths) 的在册映射界定，禁自拟名单；
    禁直读 c1_market.sector_state.rrg_quadrant 作信号（被测件同族产物＝自证循环，仅口径交叉核对）。
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: >-
    承 02 的 2026-10-10 实测段逐字保留（kline_sector_880 industry_l1(61)/industry_ths(128) 板块指数
    =2021-08-02..2026-10-08，78263/163038 行，amount/close 满配；emotion_index close_final
    =1991-06-10..2026-09-30/8617 行；kline_index 000300=2005-01-04..2026-10-09/5284 行；
    本节点 TDM data_refs 为空 [] ⇒ 全部输入来自上游件，取数面靠上述三表重算，
    登记为"无自有数据面"而非"可得"；象限过滤真口径依赖 RRG，其象限在本仓有
    sector_state.rrg_quadrant（2022-09-01 起满配）但属被测件产物，仅交叉核对不直读）；
