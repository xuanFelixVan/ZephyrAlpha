    registered_at: '2026-10-14'
    inherited_from: TDM-E-L2-05-2/ablation/02_信号响应三件套（键面属主 st-examunlock-20261013，本块=逐字镜像转录，禁自补一个键）
    mirror_note: pairs 子树与母卡同名块逐字节等值（含母卡执笔班的第一人称措辞），本版本卡只新增 registered_by/registered_at/inherited_from/mirror_note 四键
    basis_casefile: docs/_working/examunlock_campaign/22_composite_join_registry.yaml
    executor_note: 键面与对齐规则沿用 22 册冻结原值；本版本卡只换象限构造式，共键面零变更
    card_face_declared_join_key_before: false
    pairs:
    - left: c1_market.emotion_index
      right: c1_market.kline_index
      tables:
      - c1_market.emotion_index
      - c1_market.kline_index
      keys:
      - trade_date
