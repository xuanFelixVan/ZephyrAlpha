title_zh: 三级放行·先 gate 后 weight 序列腿 vs 门槛并入打分合取腿的池成员对照卡
hypothesis: 图面 dq＝「这只股配不配进打分池（先 gate 后 weight）」。兄弟卡在册三关原样引用＝关1 板块强度 10 分制>6（两路合成分/10，与 L2-01 共用重算）；关2 个股自身强度>5（个股 20 日收益截面 rank-pct×10）；关3 当日成交金额>2e8（kline_daily_hfq.amount）；三关合取后才计入池，池内再按 arm 决定是否 weight。本卡对照题设＝同一日两个形制产出的池成员集合与池内排序：序列形制（先三关合取成池→池内
  weight 排序）vs 合取形制（把三关折算成打分项与权重同批并入一个总分再排序，不设硬剔除）。分歧标的＝「权重高但至少一关未过」那批（合取形制可保留、序列形制必剔），重点看微盘/低成交段。若两集合与排序无差则「先 gate」只是措辞（可派生→并）；若序列形制系统性剔掉合取形制保留的高权重低门槛标的，则顺序本身是一枚真实门（与兄弟卡「三关的顺序亦为消融对象」同轴，但本卡换的是形制不是单关）。在册限定＝本卡不删关、不改
  >6/>5/>2e8 三值；关3 的 amount 单位口径未定（兄弟卡 deriv 原文＝「单位元口径须在开考前实测确认，若为万元/手需换算——该换算写进 evidence，禁看数后改」），故本卡把该未定单位列为开考前置，不在本班自选单位。
