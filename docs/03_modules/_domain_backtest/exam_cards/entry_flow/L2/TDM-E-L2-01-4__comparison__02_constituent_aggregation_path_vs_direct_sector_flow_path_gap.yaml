hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册两路原样引用＝聚合路=Σ(成分个股 main_net_inflow)/板块成交额（3 日累计版同理，money_flow + sector_constituent）；直读路=sector_fund_flow.net_amount/(inflow_amount+outflow_amount)（历史更短）；大单口径=large_net_inflow，且「禁把
  super_large+large 混称'大单'，口径写死」。该卡现挂 blocked_on_data，本卡题设不是绕过缺源而是**把两条路在同一批 sector×日上对齐**＝两路占比之差的分布、分歧最大的板块集，以及分歧方向能否由成分表口径解释（成分聚合路的分母是板块成交额、直读路的分母是流入+流出之和，二者在换手突变日给出不同标度）。判读＝若两路在共同可得段上比值近似恒定（分歧仅来自标度差），则两路属同真源可派生→必并，本节点只须保留一路并把标度换算写进
  evidence，缺源面缩短为一路的历史长度问题；若分歧在情绪扩散段系统性变号（个股 money_flow 的 main_net 与板块 net_amount 对同向流入给出相反符号），则两路的「主力」定义对象不同，直读路不可作为聚合路的替身，该卡「资金流权重占板块总分 25% 的合理性由本卡出分裁定」必须先裁定用哪一路，否则 25% 的裁定无基座。在册限定＝本卡不自立第三条资金路口径、不改 large_net_inflow
  的写死口径、不改 3 日累计窗；两路公式与历史长度差逐字承该卡 data_binding；缺源未补即维持 blocked_on_data，本卡不出数、不判信号无（缺源面路由 ①②⑤）；禁在 2025-09-09 后取判据值。
