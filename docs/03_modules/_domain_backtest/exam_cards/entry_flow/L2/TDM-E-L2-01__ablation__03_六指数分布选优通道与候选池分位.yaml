discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.kline_index（分布通道六指数腿）+ c1_market.kline_sector_880（强度分腿底座）
  signal_column: kline_index.close where symbol IN ('000001','000016','000300','000905','000852','399006')；
    kline_sector_880.close/amount where period='1d'
  signal_derivation: >-
    分布腿=直接调用在册件 src/zephyr/pf_alloc/core/sector_distribution_comparator.py 的
    _predict_quantiles(close, train_window=500, warmup=30) 逐指数独立拟合（特征=ret + lag_{1,5,10,20} + vol_20，
    QUANTILES=(0.05,0.50,0.95)，FEATURE_LAGS=(1,5,10,20)，均为件内实读常量，禁改）；
    排序键=收益-风险比 = q50 / (q95 − q05)（件 docstring 原文"比较预测分布的收益-风险比（中位数/区间宽度）"）；
    强度分腿=承同车道 ablation/02 的两路可算合成分口径（路A amount 占比+环比、路B 多周期动量 0.2q3+0.3q5+0.5q20 的 rank-pct），
    不重造、不改系数；叠加臂=两秩算术平均（0.5/0.5，frozen_note 已钉死）；
    候选池臂=截面 Top-{10,15,20}%（15% 为节点原文值）；
    no_pit_control 臂=把特征窗整体右移 1 日（仅用于前视对照，不作结论臂）。
  target_source: kline_index 000300 close→next_day_return（主）；kline_sector_880 close→5 日超额（辅）
  data_window_evidence: >-
    实测 2026-10-10（本车道台账 §2-P7，命令原文
    `SELECT symbol, min(trade_date), max(trade_date), count() FROM c1_market.kline_index WHERE symbol IN ('000001','000016','000300','000905','000852','399006') GROUP BY symbol`）：
    000001=1990-12-19..2026-10-09/8738；000016=2004-01-02../5527；000300=2005-01-04../5284；
    000852=2005-01-04../5284；000905=2007-01-15../4790；399006=2010-06-01../3970
    ⇒ 六指数交集自 2010-06-01 齐，叠件内 500 日热身 ⇒ 分布腿自 ~2012-07 可算，
    故本卡分布单腿设有 2013-01-04 起的长窗副面（「这是 L1 车道"板块层可考面上限=2021-08-02"硬结论的例外边界」，
    该上限只约束以 880 为底座的腿）。
    强度腿底座实测（本车道台账 §2-P6）：`countDistinct(sector_code) WHERE period='1d'` →
    2021-08-02=266 / 2023-12-29=677 / 2026-10-08=728 ⇒ IS 内宇宙 +155%，
    分位阈值类读数（前 15%）的分母族必须按日截面算（当日在数 code 的 15%），禁用固定 code 数冒充。
    件在册性正查（本车道台账 §3-A1）：`git grep -ln "MOD-PA-023|DAL-SECTOR-DIST"` 命中本件，
    头注 [STABILITY]=experimental、[SAFETY]=L、[TESTS]=tests/pf_alloc/test_sector_distribution_comparator.py
    ⇒ 通道已在码（非 blocked_on_impl），本卡考其效果而非存在性。
  impl_ref: src/zephyr/pf_alloc/core/sector_distribution_comparator.py（MOD-PA-023，TDM 本节点 algo_refs 直指件）
    + src/zephyr/signal_ashare/core/sector_strength_aggregator.py（MOD-SIG-142，强度分底座）
    + scripts/backtest/fexam/calibration_exam.py:run_card（series 面机判正门）
executor: >-
  需 exam 侧新写 ≤80 行 arm driver（直接 import MOD-PA-023 件函数 + 两秩复合 + 分位取池，无缺失语义、不改件）；
  机判面走 scripts/backtest/fexam/calibration_exam.py:run_card（每臂一行 series 记录）。
  标注为"接线工单"而非 blocked_on_impl：被测件与取数件均在岗，缺的只是考卷侧组装。
origin: cross_probe_RXA（漏矿来源=TDM 节点原文 UP-4 段与"前 15%"阈值，非"觉得还能加一张"）
sources:
