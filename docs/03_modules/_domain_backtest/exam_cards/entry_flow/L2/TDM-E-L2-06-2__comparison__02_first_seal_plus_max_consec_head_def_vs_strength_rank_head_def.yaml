title_zh: 龙头四态定位·最先涨停＋最高连板腿 vs 板块强度榜第一腿的态归属错配对照卡
hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册定义原样引用＝板块维度用 limit_up_pool.industry（自带行业列，绕开成分表）；龙头=同 industry 内 first_seal_time 最早 **且** consec_limit 取最大；MAE=（未来 5 日最低价/当日收盘 −1）。该卡 hypothesis 里对龙头另给了一句「板块强度榜第一且最先涨停」＝同一态名在本卡面存在两个第一性判据（封板时序面
  vs 强度榜面）。本卡对照题设＝同一 sector×同一交易日两定义各自的龙头归属，把错配日单独成集（A=最先涨停但非强度第一；B=强度第一但封板更晚），对两集分别测前向 5 日超额与各态 MAE 分位差。判读＝若两定义在 >=90% 的板块-日上给出同一标的，则「龙头」在两种写法下派生同一对象→必并，卡面须收敛为一条判据以免四态排序结论被口径分叉稀释；若 A 集显著强于 B 集（或反），则「止损宽度按定位分级（龙头宽/跟风窄）」这条主张的承重项被换成封板时序，强度榜版结论不可直接引用。在册限定＝本卡不改
  first_seal_time/consec_limit 的取法、不自立第三种龙头定义、MAE 式逐字承该卡；该卡在册缺源须同框登记＝consec_limit 面起点受限（本线多次复证仅自 2026-09 起可用），故本卡把「分母不足即不出数」写为前置，缺源未补维持 blocked_on_data、不判四态无效（缺源件路由 ①②）；target 承该卡 next_day_index_return（series
  面），禁在 2025-09-09 后取判据值。
