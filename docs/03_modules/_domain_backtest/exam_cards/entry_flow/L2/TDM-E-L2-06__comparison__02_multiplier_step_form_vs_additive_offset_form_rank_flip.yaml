hypothesis: 图面 dq＝「板块结论怎么喂给个股层而不越权」。兄弟卡在册形制原样引用＝板块强度=两路合成分（0-100，映射到 10 分制）→调节乘数（>=9→1.15、6..9→1.05、<6→0.90，只乘个股 score 不重排名）；个股 score=池内个股既有截面 rank 合成（考卷侧口径）；并存在册越界对照臂 rank_override（按板块强度对池内个股做跨行业重排）。本卡对照题设＝同一
  sector×symbol×同一日，把同一份强度分施加为「乘数」与施加为「等幅加性调节项」两形制后，池内个股截面排序是否产生翻转（尤其两形制对既有 ablation 三臂 off/two_field_only/rank_override 的集合边界改动）；因乘数在高分段放大差异、加性对全体近似平移，二者在 Top 段可给出不同先后。若两形制排序恒等（单调变换不变性成立）则「乘数 vs 加分」属伪命题（同真源可派生→必并）；若乘数形制在
  Top 段产生翻转，则节点文字「只调分不重排名」这条立法在乘数形制下已被违反——该情形按兄弟卡同款表述只出证据、须提 Owner 门。在册限定＝三档阈值与乘数值逐字承兄弟卡，本卡不自立新乘数、不新设第三形制、不动强度两路合成分。
