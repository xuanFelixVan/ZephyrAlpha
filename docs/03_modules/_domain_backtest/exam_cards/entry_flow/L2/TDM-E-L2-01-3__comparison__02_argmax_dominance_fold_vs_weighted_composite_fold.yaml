title_zh: 多周期动量·主导周期离散折叠腿 vs 加权和连续折叠腿对照卡
hypothesis: 图面 dq＝「是真启动还是一日游（q20/q5/q3 谁主导）」。兄弟卡在册定义＝三周期收益 q_i=close/close.shift(i)−1（i∈{3,5,20}，按 sector_code 分组）、截面 rank-pct 归一、主导度=argmax_i(rank_i)、连续面=0.2·rank_q3+0.3·rank_q5+0.5·rank_q20（照在码先验权重原样取）。本卡对照题设＝两腿各自按日折叠成市场级序列后的分歧：离散腿折叠＝当日(q3
  主导板块数−q20 主导板块数)/板块总数，连续腿折叠＝当日连续面截面均值；两序列在同一交易日上的分岔日（一升一降或幅度背离）单独成档，再各测对 next_day_index_return 的单调响应。若两折叠序列高度同向且对次日收益的响应同形，则「谁主导」只是连续分的一种读数形制（同真源可派生→按根宪法 §4 必并）；若分岔日集中在极烫/极冷两端且只有离散腿在那两档给出反向信号，则 argmax
  承载了连续分丢掉的形状信息（跨形不并）。在册矛盾须同框裁决＝兄弟卡原文登记「现码先验权重 q3/q5/q20=0.2/0.3/0.5 与节点文字（q3 主导最优）方向相反——本卡即裁决该矛盾」，本班两腿一律共用该权重，禁在本卡改权（改权＝改判据，归 ⑩/Owner 门）。
