  signal_table: c1_market.kline_sector_880 + c1_market.kline_index
  signal_column: kline_sector_880.close（板块）、kline_index.close where symbol='000300'（基准）
  signal_derivation: >-
    构造式逐字承在册 `sector_rrg.py:19-22` 的 JdK DualEma 标准公式：
    RS = 100 × P_sector / P_bench；RS-Ratio = EMA(RS, 10) / EMA(RS, 26) × 100；
    RS-Momentum = EMA(RS-Ratio, 10) / EMA(RS-Ratio, 26) × 100；
    象限按 (RS-Ratio, RS-Momentum) 对 100 中枢四分为 leading/weakening/lagging/improving
    （规则=classify_quadrant :153-157，快慢序由该函数签名固定，本卡不自拟第二种映射）；
    板块宇宙=sector_code_name_map.code_family IN (industry_l1, industry_ths) 的在册映射界定，禁自拟名单；
    占比类读数按日截面分母（当日在数 code 数），族口径固定（防"宇宙扩张"冒充"信号改善"）；
    series=当日 leading 占比 − lagging 占比；categorical 迁移标签=昨日象限→今日象限；
    采信规则=raw（单日跨界即计入，承 02 冻结面——"连续 2-3 日确认"是否值多少由 03b 卡判，本卡不预设）；
    最小数据量由在册件自己守：板块与基准须等长且 >= long×2+short=62 日、基准价须 >0，
    不足即 compute_rrg_series raise（:130-136）⇒ 该板块当日不参与，禁在绑定腿里预削窗口；
    禁直读 c1_market.sector_state.rrg_quadrant 作信号（那是被测件同族产物，自证循环）；
    该列仅用作口径一致性的交叉核对（差异 >10% 时先查口径再开考）。
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: >-
    承 02 的 2026-10-10 实测段（kline_sector_880 industry_l1/industry_ths 首交易日 2021-08-02、
    末 2026-10-08；sector_code_name_map 族分布 industry_l1 61 ∪ industry_ths 128=189 codes；
    sector_state.rrg_quadrant 非空计数 2022=29927/2023=96298/2024=105176/2025=111658/2026=89029，
    板块数 376/418/451/465/729 ⇒ 占比类指标须固定族口径）；
    本班 2026-10-14 复现腿新增实测：kline_index symbol='000300' 基准腿末 500 交易日切片＝
    与 4 个抽中板块的共同日数 497 日（02 原文写"5284 行"、矿考二班 §33.9 实测 5,286 行，
    该引用陈旧属他班案卷，本班只登记不擅改）；
    在册 10/26 式的振荡健康面＝share 标准差 0.5344／取值种数 9（n=4 长史板块的有偏样本，
    横截面粒度粗，读数只用于"是否退化为常量"这一条判据，不用于水平高低比较）。
  impl_ref: src/zephyr/signal_ashare/sector/sector_rrg.py（module_ref；本卡构造式即该件 :109-157 的
    compute_rrg_series＋classify_quadrant，公共性与调用先例见 mainline_candidates.py:65）
  execution_note: >-
    绑定腿形状=复合族入口 CW-MINELOOP-001 的 sector_family_panel 装载形（880 截面形）＋face_daily 基准腿，
    共键=trade_date（逐字承上方 pairs[0]）；算子=OPS 册 rrg_quadrant_series，
    引句双校验用卡面原文"series=当日 leading 占比 − lagging 占比"。
