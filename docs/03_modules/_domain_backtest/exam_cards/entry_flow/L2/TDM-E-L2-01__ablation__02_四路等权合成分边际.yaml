  signal_table: c1_market.kline_sector_880（两路可算面）；c1_market.sector_constituent（结构路，受限）
  signal_column: close, amount（两路）；strength（sector_state，仅 2026 起）
  signal_derivation: >-
    路A 动量活跃=amount/Σamount 的截面 rank-pct + 其 5 日环比；
    路B 多周期动量=0.2×q3+0.3×q5+0.5×q20 收益的 rank-pct；
    arm full2=(A+B)/2×100；drop_* 只余单路；market_adj 叠加 L1 水温档 ±10 分（查表）。
    结构路（涨停比/梯队）与资金路（主力净流入）在 2026-07-22 前不可算——
    成分快照仅 2026-07-22 起（见 evidence），禁以"板块指数涨幅"冒充"板块内涨停占比"（裸扩口径）。
