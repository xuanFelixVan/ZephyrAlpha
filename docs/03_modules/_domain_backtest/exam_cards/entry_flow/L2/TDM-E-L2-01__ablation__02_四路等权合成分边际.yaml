schema_version: '1.0'
card_id: TDM-E-L2-01/ablation/02_四路等权合成分边际
node_id: TDM-E-L2-01
family: ablation
title_zh: 板块强度四路等权合成·消融卡（两路可算面）
hypothesis: >-
  四路子分（结构强度/动量活跃/多周期动量/资金流）等权 0.25 合成不是先验巧合：
  逐一剔除任一路后，剩余子分合成的板块强度对次日指数收益的 IC 与单调性下降，
  且市场级调节 ±10 的加入相对不加调节同样下降。本卡声明 scope=历史可算的两路
  （动量活跃+多周期动量）；结构强度路与资金流路在 2026-07 前无成分口径（见 data_binding），
  四路全量消融另立 blocked 面，不冒充可考。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: 看数前冻结；等权先验（0.25×4）在码注释明示"待 IC 重校"，本卡即该校的考题
buckets:
  type: ablation_arm
  'on': arm 集合 {full2, drop_mom_active, drop_multi_period, full2+market_adj}
  min_obs_per_bucket: 60
pillars:
  ablation_marginal: 加入被消融路后的合成强度 IC 相对剔除臂提升 >= 0.01 且 mono_spearman>=0.6
  ic_floor: 合成强度截面 IC 均值 >= 0.02 且 IC_IR >= 0.3（方案 §7 三件套地板）
  lag_profile: 强度分 t+1..t+3 IC 半衰期 >= 1 交易日（建档）
  regime_stability: bear/rebound 两段 IC 同号且过 ic_floor
  degraded_flag_honesty: 资金流路缺席时必须标 degraded（三路重归一），禁静默补零（在码契约
    sector_surface.py 逐值断言留档 100.0/33.33）
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: sector_strength_cross_section_rank_next5d（强度榜 5 日秩持续性，辅轴）
  note: 等权→IC 加权的改权提案须等本卡出分，不得先改码
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L2-01.confidence
preregistered_by: st-nightmine-20261010-L1
preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
