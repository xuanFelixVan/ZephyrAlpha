hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册口径原样引用＝个股涨停=close>=limit_up（用 stk_limit 在册涨停价，禁自定 9.9% 阈值）；板块内涨停占比=count(涨停股∈成分)/count(成分)；梯队完整度=同板块内 max(consec_limit)>=3 且存在 consec_limit>=2 的家数>=2；两式取板块截面均值→日度 series，目标=next_day_index_return（CSI300
  次日收益）。该卡把占比与梯队合成同一强度读数；本卡把两腿拆成同一交易日上的两条 series 各自分档，对照三格＝占比高/梯队全、占比高/梯队缺、占比低/梯队全（第三格是兄弟卡合成式里被抹平的一格：占比给分但梯队不给分），各测对次日指数收益的日度均值与样本数。判读＝若「占比高/梯队缺」格与「占比低/梯队全」格的读数都落在合成单值给出的同侧且无额外分离力，则梯队完整度是占比的下游派生（涨停多了自然有梯队），合成式可按
  §4 并回单腿并删掉图面「梯队」字样；若「占比高/梯队缺」显著劣于「占比低/梯队全」，则两腿跨形不并，且兄弟卡的合成读数在该格上系统性高估情绪强度。在册限定＝本卡不改涨停判定式、不改 >=3/>=2 两阈值与其家数口径、不改板块截面均值聚合向、不自定成分名单（sector_constituent 在册映射逐字回读）；起点缺陷原样同框＝该卡缺源未补即维持 blocked_on_data、不出数、不判信号无（缺源路由
  ①②）；禁在 2025-09-09 后取判据值。
