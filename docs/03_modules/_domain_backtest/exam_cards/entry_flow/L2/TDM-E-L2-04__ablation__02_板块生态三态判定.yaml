  signal_table: c1_market.kline_sector_880（高潮分/集中度底座）+ c1_market.limit_up_pool（梯队连击，受限）
  signal_column: close, amount；limit_up_pool.consec_limit/industry（仅 2026-09 起）
  signal_derivation: >-
    高潮分=当日板块强度榜 Top5 的 1 日收益截面 z 合成分位（0-100，重算自 880，不读模块输出）；
    Top2 集中度=前 2 板块成交额 / 全板块成交额（880 amount，可算，历史 2021-08-02 起）；
    梯队连击=行业内连续涨停（consec_limit）>=2 的家数>=2 ⇒ 仅 2026-09-01 起可得，
    本卡以"板块 1 日收益>= 行业族内 95 分位 + 该板块 3 日连涨"作梯队代理，
    代理差异在此明列，出分后不得当作梯队连击本身的结论。
  target_source: kline_index 000300 close→next_day_return
