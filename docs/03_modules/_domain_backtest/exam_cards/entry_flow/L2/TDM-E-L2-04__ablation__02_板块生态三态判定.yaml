schema_version: '1.0'
card_id: TDM-E-L2-04/ablation/02_板块生态三态判定
node_id: TDM-E-L2-04
family: ablation
title_zh: 板块级市场状态三态判定·消融卡
hypothesis: >-
  高潮分>=90→次日分歧警示、梯队连击>=2 且 Top2 集中度>=30%→主线清晰、其余→混沌降仓，
  这套三态封闭判定相对"不做判定（全体中性）"提升次日风险调整收益的判别力；
  逐一剔除三态中的任一态（把它并入混沌）后判别力下降，证明三态都必要。
  优先级 高潮>主线清晰>混沌 的顺序亦为消融对象（顺序调换后 IC 是否变化）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: 看数前冻结；三态阈值（90 / 连击 2 / Top2 30%）全取在码既有口径不改
buckets:
  type: ablation_arm
  'on': arm 集合 {no_state, full_three, drop_climax, drop_mainline, priority_swapped}
  min_obs_per_bucket: 60
pillars:
  ablation_marginal: full_three 相对 no_state 的判别面提升 >= 0.01 且 mono_spearman>=0.6
  ic_floor: 三态 dummy（高潮=−1/主线=+1/混沌=0）对次日指数收益 IC 均值 >= 0.02、IC_IR >= 0.3
  lag_profile: 高潮态的负向效应应集中在 t+1..t+2（"次日分歧警示"的字面可判面），半衰期 >= 1 交易日
  regime_stability: bear/rebound 两段同号（尤其检验高潮警示在熊段是否仍为负）
  priority_test: priority_swapped 相对 full_three 的 IC 差 >= 0 则顺序无信息，登记为简化提案
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: emotion_six_state_transition（情绪六段态转移概率，辅轴，与 L1 同锚）
  note: 本卡=aggregation 型枢纽判定，按车道立法走 ablation；五态细分类另见 L2-04-1 calibration
status: preregistered
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-E-L2-04.confidence
