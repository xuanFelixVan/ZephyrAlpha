schema_version: '1.0'
card_id: TDM-E-L2-09-2/ablation/03_图谱PIT有效行过滤臂
node_id: TDM-E-L2-09-2
family: ablation
title_zh: 冲击标的清单的图谱有效行过滤（valid_to IS NULL）·消融卡
hypothesis: >-
  前役 L1 车道把本节点判为 blocked_on_data，理由原文="图谱 ig_* 无版本化/PIT⇒回放即前视"
  （台账 §1 L2-09-2 行与 §7 blocked 表）。本车道复挖实测该理由**不成立**：
  ig_node 与 ig_node_company 都有 valid_to 列，生产件与仪表盘一律以 valid_to IS NULL 取 PIT 有效行
  （chain_impact_resolver.py 第 8 行 INVARIANTS 原文"公司映射只取 ig_node_company.valid_to IS NULL（PIT 有效行）"、
  第 377 行 SQL 常量、api_server.py 第 3935/3941/3949/3964/4109/4111 行、chainmap_equity_graph.py 第 139/148 行）。
  版本化机制在册，真实缺口只剩"构建史短"（ig_node_company created_at 仅 2026-08-28..2026-09-24，前役 §3-P15）。
  本卡假设：把 valid_to 过滤当成可消融的臂有直接可判价值——
  不过滤臂（含已失效映射与墓碑节点）相对过滤臂（在码口径）会系统性高估冲击清单的次日命中率；
  高估幅度即"前视污染"的量化尺，量出来才知道图谱回放到底能不能用作回测（前役是以断言代替了测量）。
window:
  in_sample:
  - '2026-08-28'
  - '2026-09-24'
  oos: &id001
  - '2026-09-25'
  - '2026-10-08'
  regimes:
    bull: 2026-08-28..2026-09-15（图谱构建前段，市场态另册）
    bear: 2026-09-16..2026-09-24（图谱构建后段）
  frozen_note: 看数前冻结；窗不是设计选择而是实测边界——ig_node_company created_at 首末=2026-08-28 04:08:55+08:00
    / 2026-09-24 15:47:33+08:00（前役 §3-P15 在册）；两臂差异只在过滤谓词 valid_to IS NULL，
    扩散参数（2 跳、hop_decay=0.6、polarity ±0.15 死区）两臂完全同值（在码 INVARIANTS 原文口径）；
    本卡与同节点 ablation/02（跳数/衰减/方向口径消融）对象不同，不得合并出分
buckets:
  type: ablation_arm
  'on': 'arm 集合 {arm_open_pit_filtered=valid_to IS NULL（在码口径）, arm_base_pit_unfiltered=不过滤（含失效映射与墓碑节点）}'
  min_obs_per_bucket: 60
pillars:
  lookahead_gap: 不过滤臂的次日命中率减过滤臂命中率的差值须单独出数并给方向；
    差值 <= 0 即"图谱历史行不引入前视"，前役 blocked 理由应改判为纯样本量问题
  ablation_marginal: 过滤臂相对不过滤臂 Sharpe 差 >= 0.1 且 MaxDD 改善 >= 3pp（若过滤是保护，两臂必有此差）
  hit_list_stability: 两臂冲击标的清单的 Jaccard 重合度须逐日出数，低于 0.5 的天占比 >20% 即清单不可复现
  dead_node_share: 不过滤臂引入的墓碑/失效行占比单独报（ig_node 墓碑口径=名称含"（已并入）"，api_server 在册 SQL）
  regime_stability: 图谱构建前后两段同号
  sample_floor: 每臂每桶 >= 60 观测为硬地板，不足则该桶记 nan 不外推（本卡判 blocked 的机检面）
target:
  primary: next_day_index_return（CSI300 次日收益，双臂共用同一目标序列，执行器 shift(-1) 现器可考）
  secondary: impacted_symbol_next5d_excess（冲击清单标的 5 日超额，panel 主对象；需 kline_daily_hfq 个股面）
  note: 出分只裁定"valid_to 过滤这一臂的信息量与前视幅度"，不裁定 2 跳扩散是否优于 1 跳（那是 02 卡的题）；
    本卡结论不得被引用为"事件催化剂有效"的证据
