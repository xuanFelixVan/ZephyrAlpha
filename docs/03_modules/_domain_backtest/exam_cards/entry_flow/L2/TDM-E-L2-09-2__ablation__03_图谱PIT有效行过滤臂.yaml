data_binding:
  signal_table: PostgreSQL depgraph 库 ig_node（node_id, chain_id, name, valid_to） + ig_edge（无向邻接） +
    ig_node_company（node_id, symbol, role, confidence, valid_to, created_at） +
    c1_market.news_sentiment_window（scope='symbol'，polarity/sentiment_index 作冲击方向输入） +
    c1_market.kline_daily_hfq（个股 5 日前向收益）
  signal_column: ig_node.node_id, ig_node.valid_to, ig_edge.node_id, ig_edge.peer_node_id,
    ig_node_company.symbol, ig_node_company.confidence, ig_node_company.valid_to,
    news_sentiment_window.sentiment_index, kline_daily_hfq.close
  signal_derivation: 种子=当日 scope='symbol' 且 |sentiment_index|>0.15 的 symbol 经 ig_node_company 反查命中节点
    （死区 ±0.15 取在码 INVARIANTS 原值）；扩散=ig_edge 无向 BFS 2 跳、置信=种子 confidence×0.6^hop×公司映射
    confidence（0.6/2 跳均为在码值，非本卡新拟）；落标的=hop>0 的 ig_node_company.symbol；
    臂 open=在扩散图与公司映射两侧同时加 valid_to IS NULL 谓词（在码口径）；
    臂 base=去掉该谓词（全量历史行，含已失效映射与墓碑节点）；
    冲击分=Σ(置信×sign(sentiment_index)) 按 symbol 去重取（hop 升序、置信降序）最优并记 sources 数；
    命中率=清单 symbol 的次日个股收益>0 占比（按日截面取中位）。
  target_source: kline_index(symbol='000300').close → next_day_return（主轴）；
    辅轴=kline_daily_hfq.close 的 5 日 forward return 减同期 000300 5 日收益（个股面 1990-12-19..2026-09-30 充分，
    前役 §3-P10；2026-09-30 后 9 日缺口对本卡 OOS 终点 2026-10-08 有影响，须在开考时以实际可得行截断并登记，
    截断不改判据面）
  data_window_evidence: 全部引用在册实测（本车道 21:00-22:30 未自取新数）：
    ①PG 图谱规模与构建窗实测=ig_chain 873、ig_node 5560、ig_edge 1726、ig_node_company 25559，
    min/max(created_at) FROM ig_node_company=2026-08-28 04:08:55+08:00 / 2026-09-24 15:47:33+08:00，
    ig_* 不在治理库、在 depgraph 库（前役 L1 台账 §3-P15，两次尝试均留痕）；
    ②valid_to 列在产的证据=本车道 2026-10-10 直读源码所得（chain_impact_resolver.py 第 8/25/371/377 行、
    api_server.py 第 3935/3941/3949/3964/4109/4111 行、chainmap_equity_graph.py 第 139/148 行，
    均以 valid_to IS NULL 为在册读取口径）⇒ 前役"无版本化/PIT"表述与代码事实矛盾；
    ③输入面 news_sentiment_window scope='symbol' 仅 2026-02-24..2026-08-20/19635 行/4857 标的
    （同战役 L3 车道在册，见 TDM-E-L1-S0-1__calibration__03 卡 evidence）与图谱构建窗 2026-08-28 起**不相交**
    ⇒ 种子侧在冻结窗内零行，这是本卡 blocked 的第二条根因（前役未查这一条）；
    ④节点下游在册边=config/trading_decision_map.yaml 第 6384-6386 行
    （09-1→09-2 sequence、09-2→L3-04 feed daily、09-2→L0-02 feed intraday），
    本车道 Grep 反查消费方=src/zephyr/intelligence/chain_impact_resolver.py、chain_impact_stream.py、
    news_chain_node_linker.py（三件在产，MOD-INT-CHAIN-IMPACT 状态 testing）⇒ ②向非零命中，前役未列 grep 凭据。
  impl_ref: src/zephyr/intelligence/chain_impact_resolver.py（MOD-INT-CHAIN-IMPACT，testing，23 单测在册）+
    src/zephyr/intelligence/chain_impact_stream.py
