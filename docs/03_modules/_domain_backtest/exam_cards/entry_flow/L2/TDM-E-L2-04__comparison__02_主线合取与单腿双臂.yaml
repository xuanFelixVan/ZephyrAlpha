    集中度腿=当日该族内 amount 前 2 名之和 / 该族当日 amount 总和（**取成交额口径**，
    即节点原文与件常量名 TURNOVER_CONCENTRATION_MIN 的语义；在产接线 MOD-SIG-144 注入的是
    "Top2 主力净流入/全池主力净流入"，与本卡不同口径，该错配另在本卡 note 登记，不在本卡考）；
    arm_A 主线集={streak>=2 且 conc>=0.30}；arm_B 主线集={conc>=0.30}；
    暴露=主线日 1.0、其余 0.5；组合收益=暴露(t)×000300 次日收益，暴露变动日扣单边 10bp。
  target_source: kline_index 000300 close→next_day_return
