schema_version: '1.0'
card_id: TDM-E-L2-04/comparison/02_主线合取与单腿双臂
node_id: TDM-E-L2-04
family: comparison
title_zh: 主线清晰判定的合取形式·连击腿+集中度双腿 vs 仅集中度单腿双臂对照卡
hypothesis: >-
  节点写死"梯队连击≥2 **且** Top2 集中度≥30%=主线清晰"（trading_decision_map.yaml:1125-1127），
  而被测核 MOD-SIG-143 的两个输入常量分别来自两处不同真源（LEAD_STREAK_MIN=2 的注释指向
  mainline_probability "lead_streak<2=无主线混沌"的反向，TURNOVER_CONCENTRATION_MIN=0.30 指向节点原文），
  前役 L1 的 ablation/02 只考"三态整体是否比不判定强"与"优先级能否调换"，
  **从未考过这两腿的合取形式本身**（其臂集 {no_state, full_three, drop_climax, drop_mainline, priority_swapped}
  里 drop_mainline 是"把主线态并入混沌"，不是"把合取式降格为单腿式"——两个不同对象）。
  本卡一句话：连击腿按在码口径（=当日收益最高板块的连续领涨天数，MOD-SIG-061 mainline_candidates
  件内定义，可自 2021-08-02 起在 880 行业族上重算）取值时，
  合取式（streak≥2 且 conc≥30%）相对单腿式（仅 conc≥30%）在风险调整上不劣
  （OOS Sharpe 差 >= -0.10）且 MaxDD 改善 >= 2.0pp ⇒ 连击腿有独立信息、合取形式成立；
  若 Sharpe 显著下降而 MaxDD 无改善 ⇒ 连击腿是纯减分器，节点的双条件应改单条件（产出纠口径材料，不代裁）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: >-
    看数前冻结（G4-5）。两腿常量取在码原值不扫（2 与 0.30，sector_ecology_judge.py:39、41）；
    仓位映射钉死=MAINLINE_CLEAR 日暴露 1.0、其余日暴露 0.5（唯一差别=哪些日被判主线）；
    CLIMAX 优先臂**不在本卡范围**——其高潮分腿在产为阶跃映射且分母待实测，另立
    TDM-E-L2-04/calibration/02（blocked_on_data）单独考，两卡结论互不外推；
    换手扣减口径写死=每次暴露变动按单边 10bp 计（本卡自设的数量级检查值，双臂同一费率）。
buckets:
  type: dim_pair
  'on': 判定形式双臂 {arm_A_conjunction=streak>=2 且 conc>=0.30, arm_B_single_leg=conc>=0.30（连击腿视为恒真）}
  pairing: 同一 880 底座、同一窗、同一暴露映射与同一费率，双臂逐日配对（仅主线集不同）
  min_obs_per_bucket: 60
pillars:
  sharpe_noninferior: arm_A 相对 arm_B 的 OOS 年化 Sharpe 差 >= -0.10（合取式不得系统性劣于单腿式）
  maxdd_improvement: arm_A 的 OOS MaxDD 相对 arm_B 改善 >= 2.0pp（"主线清晰=聚焦做"的风险面兑现）
  leg_trigger_rate: 连击腿（streak>=2）的日频触发率必须实测披露；若 >= 0.90 ⇒ 该腿近恒真，
    合取式与单腿式在构造上近乎同物，判 DEVICE_INCONCLUSIVE，禁把"无差"报成"腿不必要"
  state_share: 双臂的 MAINLINE_CLEAR 日占比与三态封闭性检查（arm_A 判出的主线日必为 arm_B 的子集，
    若非子集说明实现走偏，本卡作废重跑）
  lag_profile: 主线态的暴露优势应集中在 t+1（次日），t+2/t+3 衰减须披露（承同车道时滞建档纪律）
  regime_split: bear/rebound 两段 arm_A−arm_B 利差同号；熊段反号则"聚焦做"仅在修复段成立，须限定
target:
  primary: 双臂暴露组合（底座=kline_index 000300 次日收益）的 OOS Sharpe 差与 MaxDD 改善
  secondary: 主线态次日收益均值差（state_nextday_return_spread，辅轴，不作通过判据）
  note: 出分前禁改判定式结构（不代裁）；结论若指向"改单条件"，产出的是纠口径材料而非代码改动
