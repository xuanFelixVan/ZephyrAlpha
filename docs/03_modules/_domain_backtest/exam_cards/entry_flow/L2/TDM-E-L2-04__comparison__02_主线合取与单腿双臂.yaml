  signal_column: kline_sector_880.close（日收益→领涨板块与连续领涨天数）、kline_sector_880.amount（Top2 集中度）
  signal_derivation: >-
    截面族冻结=industry_l1 ∪ industry_ths，剔除 880001-880011 市场统计指数
    （承 MOD-SIG-061 件内实证口径"880001 作 RRG 基准/市场收益代理，剔除出板块全集"）；
    连击腿=逐日取该族内当日 1 日收益最高者为领涨板块，按 analysis_utils.lead_streaks 语义累计
