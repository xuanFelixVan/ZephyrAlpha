schema_version: '1.0'
card_id: TDM-E-L2-02-1/ablation/03_象限迁移确认腿与稀有路径护栏
node_id: TDM-E-L2-02-1
family: ablation
title_zh: RRG 象限迁移确认腿与稀有路径护栏·消融卡（RX-A 交叉复挖漏矿）
hypothesis: >-
  TDM 本节点 `invalidation` 原文="象限转移须连续 「2-3 日确认」，单日跳变不采信；transition 概率「<10% 异常路径加 1 日确认」"，
  `fallback` 原文="板块日K 不足 「62 日」（DualEma 最小数据量）→该板块不参与序列排名"。
  这两条是节点对实现下的「硬约束」，而同车道 calibration/02 把迁移面显式降为
  "transition_matrix：象限迁移矩阵 5 日平稳性登记（纯描述性，不做门柱）"⇒"这道确认滤波本身值不值"从未被考。
  本卡四臂：raw（单日跨界即采信，=现行考卷口径）/ confirm2（连续 2 日同象限才采信）/ confirm3 /
  rare_guard（对上日转移概率 <10% 的稀有跨界再额外 +1 日确认）。
  假设：确认腿降低信号翻转次数（滤波有效）且不削弱增益（信息未被滤掉）；
  若 raw 与 confirm2/3 的增益无差，则"单日跳变不采信"是凭经验的过度滤波，应简化实现（净零：零触发零消费→退役）；
  若 confirm2 显著更好，则现行考卷与在码 sector_rrg 的采信规则须对齐。62 日门槛作为宇宙护栏单列（实测影响面仅 8/729 codes，
  预期判 no_binding，如实报而非宣称验证）。
window:
  in_sample:
  - '2021-08-02'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bear: 2021-08-02..2022-10-31（贴现率熊+微盘熊）
    rebound: 2022-11-01..2023-12-31（防疫转向+风格修复）
  frozen_note: >-
    看数前冻结。RS/RRI 口径逐字承同车道 calibration/02 的冻结（RS=100·exp(4 日累计 ln(板块收盘/000300 收盘)) 平移口径、
    RRI=RS 的 4 日 EMA、象限以 100 中枢±带宽 5 四分）——「故意不另起口径」，否则与 02 卡不可比、覆盖尺虚增；
    "连续 2-3 日确认"取 2 与 3 两档（节点给的是区间，两档都跑不挑一个）；
    "转移概率<10%"的估计窗=过去 250 交易日的经验转移频率（开考前钉死，禁事后扫窗）。
buckets:
  type: ablation_arm
  'on': 采信规则臂 {raw, confirm2, confirm3, rare_guard_confirm2}
  min_obs_per_bucket: 60
pillars:
  ablation_marginal: confirm2 相对 raw 的判别面（"新进领先占比−新进落后占比"对次日指数收益的 IC）提升 >= 0.01 且
    mono_spearman>=0.6 ⇒ 确认腿必要；若 < 0 ⇒ 判"过度滤波"，登记为简化提案（不撤码，只入册）
  flip_reduction: 信号翻转次数（日频象限标签变更次数）confirm2/confirm3 相对 raw 下降 >= 30%，
    且增益不劣 ⇒ 滤波的净效果为正；翻转降而增益也降=信息被滤掉，如实入册
  rare_path_honesty: 稀有路径（上日转移经验概率 <10%）子集单独出数并披露样本数；子集 obs < 60 判 nan 禁并入主判
    （节点这条是给异常路径的，不许用全样本平均把它抹平）
  ic_floor: 各臂连续面（leading 占比−lagging 占比）日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  regime_stability: bear/rebound 两段同号且均过 ic_floor
  universe_guard: 62 日门槛面=按"当日 code 的历史长度"分层报增益（<62 / 62-180 / >=180 三层，实测 IS 内 8/22/… 个 code，见 evidence）：
    若 <62 层的预测误差显著更大 ⇒ 节点门槛有据，保留并在考卷侧守；若无差异 ⇒ 门槛是历史长度歧视，
    登记为"可放宽"提案；「该柱禁与确认腿混判」（不同对象，内收判据铁律：跨域不同对象→不并）
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: quadrant_signal_flip_count（翻转次数，本卡专属判据面）与 sector_next5d_excess
  note: 与同车道 calibration/02 分工=02 考"象限位置/迁移方向有没有预测力"，本卡考"节点规定的采信规则要不要、值多少"
