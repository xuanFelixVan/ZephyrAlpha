  signal_table: c1_market.kline_sector_880 + c1_market.kline_index
  signal_column: kline_sector_880.close where period='1d'（键列=sector_code）；kline_index.close where symbol='000300'
  signal_derivation: >-
    与同车道 calibration/02 逐字同口径重算（禁直读 c1_market.sector_state.rrg_quadrant，那是被测件同族产物=自证循环；
    该列仅作口径一致交叉核对，差异 >10% 先查口径再开考）；
    新增面=按日构造"code×昨日象限→今日象限"标签序列，再按采信规则把标签转成信号：
    raw=当日跨界即置 1；confirm_k=须连续 k 日处同一目标象限才置 1（否则视作仍在旧象限）；
    rare_guard=在 confirm2 之上，若该转移的经验概率（过去 250 交易日频率）<10% 则再延后 1 日；
    历史长度层=每 code 自其首个 trade_date 起累计 in-window 交易日数（用于 universe_guard 分层）。
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: >-
    实测 2026-10-10（本车道台账 §2-P6）。列集：
    `SELECT groupArray(name) FROM system.columns WHERE database='c1_market' AND table='kline_sector_880'`
    → ['period','trade_date','timestamp','sector_code','sector_name','open','high','low','close','volume','amount','forward_factor','data_source','fetched_at','ingest_ts']
    ⇒ 键列是 「sector_code」（本车道首跑误用 symbol/code 连报 5 次 HTTP 404，依作业簿 §四"空结果/404 先判静默失败"排查后改对，
    留痕=404 不等于无数据）；日期列 trade_date 在册（与 L1 台账 §3-P17 的 typeof 探测失败不同源，本处为列名错非查询失败）。
    宇宙漂移：`countDistinct(sector_code) WHERE period='1d'` → 2021-08-02=「266」、2023-12-29=「677」、2026-10-08=「728」
    ⇒ IS 内 +155%，占比类读数（leading/lagging 占比）必须按日截面分母（当日在数 code 数），禁固定 code 数。
    62 日门槛影响面实测：
    `SELECT count() FROM (SELECT sector_code, countDistinct(trade_date) AS uniq FROM c1_market.kline_sector_880 WHERE period='1d' AND trade_date<='2023-12-31' GROUP BY sector_code HAVING uniq<62)` → 「8」；
    同形查询 HAVING uniq>=62 AND uniq<180 → 「22」；全 code（不限日期）→ 「729」
    ⇒ 节点 fallback 门槛的实践影响面=8/729≈1.1% codes（故本卡该柱预期 no_binding，如实报）。
    全表规模复证：`SELECT count() FROM c1_market.kline_sector_880` → 785204 行（与 L1 台账 §3-P3 同数，口径一致）。
  impl_ref: src/zephyr/signal_ashare/sector/sector_rrg.py（MOD-SIG-026，TDM module_ref；确认腿的在码现状须开考前实读该件是否已实现 2-3 日确认——
    若码内已有而考卷用 raw，则本卡同时是"考卷与被测件口径不一致"的治理产出）
