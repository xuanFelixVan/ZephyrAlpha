  面）。该卡两路都写但把补涨候选合成一个面板；本卡把两路拆成同一龙头板块同一日的两个候选集，考两件事＝(i) 两集合的重叠率与其补涨缺口分布差；(ii) 两路各自「距启动天数」分桶上的超额驼峰峰位是否同日。判读＝若重叠率高且两路峰位同日，则成分路与图谱路是同一现象的两种映射，可派生→§4 必并，图面应只留一路并声明另一路为其投影；若图谱路峰位系统性滞后（上下游传导需要额外天数），则两路是不同时标对象、禁互相替代，兄弟卡的合成面板在该滞后窗内会把图谱路的未启动误读成「无补涨机会」。在册限定＝本卡不改
  Top10 龙头定义、不改缺口=板块涨幅−个股涨幅式、不改分桶变量（仍按距启动天数）、不自拟图谱边权重或跳数、不改 MAE/amount 字段面；起点缺陷原样同框＝缺源未补即 blocked_on_data、不出数、不判补涨无效；禁在 2025-09-09 后取判据值。
