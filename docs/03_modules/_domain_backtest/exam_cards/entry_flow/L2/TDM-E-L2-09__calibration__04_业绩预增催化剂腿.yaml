data_binding:
  signal_table: c3_fundamental.earnings_forecast（主）+ c3_fundamental.express_report（兑现复核辅轴）
    + c3_fundamental.research_report（symbol→industry 派生映射与龙头识别，宇宙偏差见 evidence）
  signal_column: earnings_forecast.forecast_type / profit_change_min / profit_change_max / last_year_profit
    / announce_date / first_announce_date / report_period / symbol
  signal_derivation: >-
    市场级 series=按 `first_announce_date` 归集当日预告：净占比 =（预增+扭亏 家数 − 预减+首亏 家数）/ 当日预告总家数；
    强度面 = profit_change 中位（取 (min+max)/2，1%–99% 截尾，总家数 <30 的日判 nan 禁补零）；
    PIT 纪律=「只用 first_announce_date ≤ T 的行，同一 (symbol, report_period) 只取首次披露」（修订稿不得回溯覆盖，
    防"以公告日 vs 首次公告日"混用造成的前视——该表两列并存正是本卡选 first_announce_date 的理由）；
    行业级 panel 辅轴=symbol→industry 以 「≤T 最近一次 research_report 的 industry」 取值（派生映射），
    龙头子集=同 industry 内 ≤T 研报覆盖条数排名前 3 的 symbol；
    未兑现复核=同一 (symbol, report_period) 的 express_report.net_profit 落入预告区间 [net_profit_min, net_profit_max] 之外者计 miss。
  target_source: kline_index 000300 close→next_day_return（主）；行业辅轴基准=kline_sector_880（行业族 close，5 日超额 vs 000300）
  data_window_evidence: >-
    实测 2026-10-10（本车道台账 §2-P8，命令原文
    `SELECT min(announce_date),max(announce_date),count(),uniqExact(symbol) FROM c3_fundamental.earnings_forecast`）
    → `1999-01-08 / 2026-07-03 / 125582 / 5707`；
    分年（`WHERE announce_date>='2019-01-01' GROUP BY toYear(announce_date)`）→
    2019=7703 / 2020=7957 / 2021=7257 / 2022=5791 / 2023=5406 / 2024=5121 / 2025=4991 / 2026=3351
    ⇒ IS 窗（2019-01-04..2023-12-31）约 34,114 行、年均 ~6,800 ⇒ 五分位×60 日样本门槛满足（1214 交易日/5≈243 日每桶）；
    forecast_type 分布（`GROUP BY forecast_type`）→ 预增 34846/略增 19145/首亏 14945/续亏 14647/预减 14343/扭亏 11441/
    略减 9027/续盈 5563/不确定 1569/其他 56 ⇒ 十分类在册且"其他"仅 56 行（分类无失控）；
    样本行抽查 4 条（2024 年）确认 profit_change_min/max、last_year_profit、reason 全文变动原因、
    announce_date 与 first_announce_date 分列均非空。
    `SELECT min(announce_date),max(announce_date),count(),uniqExact(symbol) FROM c3_fundamental.express_report`
    → `2005-01-08 / 2026-07-02 / 28708 / 4395`（兑现复核辅轴可用）。
    映射宇宙上限：`SELECT uniqExact(symbol), uniqExact(industry), min(publish_date), max(publish_date) FROM c3_fundamental.research_report`
    → `4709 / 207 / 2017-01-02 / 2026-09-30` ⇒ 派生映射仅覆盖 4,709 只（偏机构覆盖票，全市场 ~5,591 只，见同台账 §2-P4 的 stk_limit 计数）
    ⇒ 「行业辅轴须明列宇宙偏差，禁当板块真口径」（同车道 §0 红线"裸扩口径=造回归"；本卡主轴=市场级 series，不需任何映射）。
    板块级严格口径仍缺的成分历史（本车道独立复核）：sector_constituent 的 min(valid_from)=2026-07-23、uniqExact(valid_from)=6，
    as-of '2022-06-30' 查询=0 行 ⇒ industry_class 的 valid_from 全部 2026-08-03、as-of 2021-06-30=0 行
    ⇒ 两个归属源都无历史 PIT，故本卡的行业腿只能走"研报派生映射+偏差声明"这条辅轴，真口径腿维持 blocked（不改判）。
  impl_ref: src/zephyr/signal_ashare/screening/event_driven_screener.py（MOD-SIG-049/106，TDM module_ref，催化剂扫描件）
    + c3_fundamental.earnings_forecast 的生产方采集件（开考前的口径核对项：该表是否已做 ST/退市中继过滤）
executor: scripts/backtest/fexam/calibration_exam.py:run_card（series 面机判 _panel_metrics+judge；辅轴 panel 面同件）
origin: cross_probe_RXA（漏矿来源=TDM 节点 algo_note_zh 三类催化剂中的"业绩（行业龙头超预期）"原文一句）
翻案声明: >-
  本卡不推翻同车道任何 blocked 判据（政策/事件文本腿经本车道 §2-P2 独立复证仍成立）。
  翻案对象=同车道 §1/§7 名单隐含的"催化剂只剩研报代理可考"这一覆盖判断：
  业绩腿有 1999 起、2019 后年均 ~6,800 行的 PIT 安全自有数据面，属"未查表"而非"无数据"。
sources:
  - 族级矿脉 S7（研报评级/PEAD 反应不足），URL+发布方+年份见 L1 台账 §2-S7；本卡复用其"信息扩散慢"结论支撑 lag_profile 先验，
    不外借参数（业绩漂移族与预告族的口径差异已在 leader_vs_breadth_split 柱中自设判据）
