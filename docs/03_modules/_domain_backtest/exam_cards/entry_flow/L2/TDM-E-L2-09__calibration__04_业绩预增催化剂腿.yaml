schema_version: '1.0'
card_id: TDM-E-L2-09/calibration/04_业绩预增催化剂腿
node_id: TDM-E-L2-09
family: calibration
title_zh: 业绩超预期催化剂腿·校准卡（RX-A 交叉复挖漏矿，含对"业绩腿不可考"的翻案）
hypothesis: >-
  TDM 本节点原文把催化剂分「三类」："政策（部委文件/产业规划）、「业绩（行业龙头超预期）」、事件（涨价/突破/签约）"，
  并写死"有当下催化剂的板块加权 20%——有故事的资金才敢接力"。同车道已立两卡（calibration/02 研报密度、
  calibration/03 评级上调聚集）「都建在 research_report 上」，即两类都还只是"卖方关注度/方向共识"这一族代理，
  其 blocked 名单只登记了"政策/事件文本腿"⇒ 业绩腿既未入卡也未进 blocked=「漏登记」（本车道实测该腿有长史：
  c3_fundamental.earnings_forecast 125,582 行/1999-01-08..2026-07-03/5,707 symbols/forecast_type 十类，见 evidence）。
  本卡假设：以首次披露日归集的"预增+扭亏 家数 − 预减+首亏 家数"净占比（及其强度面 profit_change 中位）分桶，
  对次日指数收益与该行业未来 5 日超额具单调正效应（超预期=真故事，比研报关注度更接近"资金敢接力"的因果位）；
  同时允许反向结论——A 股预告密度在顶部也高（预增泛滥=情绪透支），若净占比高档反向，
  则节点的"催化剂=加分"叙事在业绩腿上不成立，须如实入册（不许因叙事而只报正号档）。
  并与 02 卡同场对比（信息类型正交性）：若业绩面的净 IC 在控制研报密度后归零，则"业绩催化剂"是关注度的影子，
  三类催化剂的加权应合并计算而非各自 20%。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: >-
    看数前冻结。数据物理上限虽到 1999，但 IS 起点保守取 2019-01-04=「与同车道 02/03 卡同窗保持可比（覆盖尺不虚增）」，
    且 2019 前预告披露规则（2014/2019 修订的强制预告范围）漂移未做画像；此取舍在 evidence 里明列，
    开考前若补做"披露规则断点画像"可前推窗，但须另立扩档卡而非改本卡窗口。
    净占比方向、预增/扭亏 vs 预减/首亏 的归类、龙头定义（industry 内 ≤T 研报覆盖条数前 3）全部写死于此，事后禁重挑。
buckets:
  type: quantile_quintile
  'on': 当日市场级业绩催化剂净占比（series）；行业×日净占比（panel 辅轴）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 五分位中位前向收益 Spearman 单调 rho>=0.6（IS 窗内；符号按实测，先验为正但不豁免反向结论）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（方案 §7 三件套地板）
  lag_profile: t+1..t+5 至少一档 |IC| 达峰值且半衰期 >= 2 交易日（业绩预告是慢扩散信息，峰值若落在 t=0 说明已被当日价格吸收）
  regime_stability: bull/bear 两段 IC 同号（熊段减弱可接受、变号即"业绩腿在熊市失效"须写进 confidence）
  oos_same_sign: 上述方向在 OOS 再现，不再现即判主张不稳健
  leader_vs_breadth_split: 节点特指"行业龙头超预期"⇒ 龙头子集（industry 内 ≤T 研报覆盖前 3 只）与非龙头子集「分别出数」；
    若只有非龙头子集有效，则节点的"龙头超预期"口径失据（禁以全样本冒充龙头口径，这是本卡最主要的口径诚实面）
  orthogonality_to_02: 与 calibration/02（研报密度）共线性检验=控制密度后的业绩净 IC 仍 >= 0.01 才算"催化剂类别独立"；
    归零则提请把三类催化剂的 20% 加权合并为一层（净零：同真源可派生→必并）
  express_confirmation: 辅轴=以 express_report（2005 起 28,708 行）复核预告是否兑现；
    "预告预增但未兑现"子集的后续收益须单独报（这是"故事"与"事实"分离的唯一在册路径）
target:
  primary: next_day_index_return（CSI300 次日收益，series 主轴）
  secondary: industry_excess_next5d（行业 5 日超额，panel 辅轴，须用派生映射并披露宇宙偏差）与 express_miss_return（未兑现子集后续收益）
  note: 本卡=业绩腿在本仓的第一次量化冻结；出分不得外推到"政策/事件催化剂有效"（那两腿仍 blocked）
