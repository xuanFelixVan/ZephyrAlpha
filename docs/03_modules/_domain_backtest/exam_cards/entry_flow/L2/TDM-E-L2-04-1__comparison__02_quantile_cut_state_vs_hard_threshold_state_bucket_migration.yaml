hypothesis: 图面 dq 承本节点裸骨架（逐行回读）。兄弟卡在册口径原样引用＝截面方差=当日跨板块强度分布 std（分位化）、集中度=Top2 成交额占比（分位化），二维各按**历史三分位**切五态（高潮/主线/分歧/派发/混沌），调节标量=高潮 −1／派发 −0.75／分歧 −0.25／混沌 0／主线 +0.5，且「与 +10%/−15% 线性同序」、规则与在码 sector_rotation_state
  一致但重算（禁直读输出）。该卡考的是五态对次日指数收益的单调映射；本卡考的是**态划分对切档口径本身的敏感性**＝同一批交易日，把分位化二维改以绝对阈值（方差、集中度各取其全期均值线）切同名五态后，态归属的迁移矩阵与迁移集中发生的档；重点两格＝「主线↔混沌」（分位线在结构平静期必给主线，绝对线不给）与「高潮↔分歧」（分位线在全体同涨时把领涨段判高潮、绝对线判分歧）。判读＝若迁移矩阵对角占优且两态对
  next_day_index_return 的分组均值不随切法变，则五态是同一对象的稳定划分、三分位只是实现细节（可派生→并，兄弟卡的「态划分须比随机五分更准」这一结构有效性判据足以覆盖）；若迁移集中于上述两格且分组均值随之翻转，则该族结论的真正承重项是切档口径而非五态语义，任何未声明切法的读数都不可外推。在册限定＝本卡不改 −1/−0.75/−0.25/0/+0.5 五值、不改 Top2 集中度定义、不改
  0.5/0.5 强度底座合成分；三分位切法与「禁直读在码输出」两条原样承该卡 frozen_note 与 deriv；窗承 IS 2021-08-02..2023-12-31／OOS 2024-01-01..2025-09-09 与两 regime 段，禁看数后改。
