schema_version: '1.0'
card_id: TDM-E-L2-04/calibration/02_在码高潮分四档阶跃响应
node_id: TDM-E-L2-04
family: calibration
title_zh: 在产高潮分=涨停比四档阶跃映射·对次日指数收益的档间响应校准卡
hypothesis: >-
  三态判定的高潮腿在产口径是一张四档阶跃查表而非连续分：
  sector_strength_wiring.py:56-62 的 BREADTH_CLIMAX_MAP={'极强':95.0,'强':70.0,'中':40.0,'弱':15.0}，
  档界取 sector_breadth.py:35-38 的涨停比阈值（>0.10 极强 / >0.05 强 / <0.02 弱 / 其余中），
  而 MOD-SIG-143 的高潮门柱是 climax_score>=90（sector_ecology_judge.py:43、113）
  ⇒ 门柱在产语义下严格等价于"全市场涨停比>10% 这一档"，其余三档永不触发高潮态。
  本卡一句话：把该阶跃序列取负后（-climax_score，使高潮越重取值越低，与执行器正 IC 地板同向），
  其对次日 CSI300 收益的四档利差须呈单调（档序=极强1/强2/中3/弱4，分桶中位前向收益 Spearman rho>=0.6）
  且"极强"档次日均值显著为负（"第二天大概率分歧"的字面可判面）；
  若"强"档（70 分，不触发高潮）的次日均值与极强档无别 ⇒ 90 这根门柱定错位置，
  它漏掉实际同样危险的一档，须提请改档或连续化（不代裁，出分只产出纠口径材料）。
window:
  in_sample:
  - '2019-01-04'
  - '2021-12-31'
  oos: &id001
  - '2022-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛，承同层 L2-01-1 卡在册段，不另造）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊，同前）
  frozen_note: >-
    看数前冻结（G4-5）。档界与分值一律取在码常量原值不扫（0.10/0.05/0.02 与 95/70/40/15，
    门柱 90 亦不扫——门柱位置检验靠档间利差比较完成，不靠挪门柱）；
    涨停判定 MUST 用不复权 c1_market.kline_daily 配 c1_market.stk_limit（任务书 §3 在册口径：
    用 kline_daily_hfq 得 3,882 家涨停荒谬值），禁自定 9.9% 阈值；
    宇宙=当日在市股票数（分母按日截面算，禁固定家数）；
    已知风险如实声明=涨停比>10% 的"极强"档在历史上是极端稀疏事件（2019-01 与 2024-09 两轮涨停潮为主），
    其样本可能集中于 OOS 段且可能不足 60 日——届时该档判"数据不足非通过"（承双臂卡的覆盖地板语义），
    禁把稀疏档报成通过，也禁因稀疏而删档。
buckets:
  type: discrete_bucket
  'on': 全市场涨停比四档映射（极强/强/中/弱，档序 1..4 按高潮分降序）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 四档的次日均值按档序（极强→弱）单调上升，Spearman rho >= 0.6（在取负序列上判，与执行器同号）
  ic_floor: 取负序列的日频 IC 均值 >= 0.02 且 IC_IR >= 0.3（等价于原序列 IC 均值 <= -0.02，符号已由取负钉死，禁事后翻号）
  climax_negative: 极强档（取负序列取值最低的一档）的次日均值必须 < 0，且其绝对值 >= 其余三档均值绝对值最大者
    （高潮=次日分歧的方向性硬判）
  threshold_placement: 极强档与强档的次日均值差 >= 0.30×|强档与中档均值差| 时判"门柱位置大致对"；
    若强档与极强档无差而中档以下才变号 ⇒ 90 门柱失据，产出改档/连续化材料
  lag_profile: t+1..t+3 衰减形状建档（现器 calibration `_series_metrics` 硬编码 shift(-1)，t+2/t+3 只作人工判读不入机判地板）
  regime_stability: bull/bear 两段取负序列 IC 同号（若仅牛段同号，则"高潮警示"实为牛市顶部效应，须限定适用范围）
target:
  primary: next_day_index_return（CSI300 次日收益）
  secondary: 极强档后 5 日累计收益（state_next5d_cumulative，辅轴，声明=现器不支持多日前向地板，仅人工判读，不作通过条件）
  note: 本卡不考三态合取形式（另卡 TDM-E-L2-04/comparison/02），也不考五态细分类（L2-04-1 calibration/02）
