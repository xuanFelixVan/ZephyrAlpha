discipline: 冻结后开考；事后挪门柱=作废（G4-5）；断供不弃卡（任务书 §2 ⑥向）；试次全入 n_trial_ledger
signal_kind: series
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
oos_window_ref: *id001
data_binding:
  signal_table: c1_market.kline_daily（不复权，close/前收→当日全市场在市股票数与涨停家数的分子分母底座）
    + c1_market.stk_limit（在册涨停价列 limit_up，涨停判定唯一口径）
  signal_column: kline_daily.close、kline_daily.pre_close、kline_daily.trade_date、stk_limit.limit_up
  signal_derivation: >-
    个股涨停=kline_daily(不复权).close >= stk_limit.limit_up（禁自定 9.9%，禁 hfq——任务书 §3 在册：
    hfq 会得 3,882 家涨停荒谬值）；全市场涨停比=当日涨停家数 / 当日在 kline_daily 有行的在市股票数；
    按 sector_breadth.classify_limit_up_breadth 的档界映射为 极强/强/中/弱
    （ratio>0.10→极强、0.05<ratio<=0.10→强、0.02<=ratio<=0.05→中、ratio<0.02→弱，件内 if-else 顺序原样照抄）；
    再按 BREADTH_CLIMAX_MAP 取分值（95/70/40/15）并整体取负得到日度单序列（signal_kind=series）；
    与已在册的 docs/_working/nightmine_campaign/series/limit_up_count.csv 逐日交叉核对（分子一致性，
    差异 > 1% 的日期须计数披露，禁静默取舍）。
  target_source: kline_index 000300 close→next_day_return
  data_window_evidence: >-
    在册与实读两面：①c1_market.stk_limit=2015-01-05..2026-10-09/9254772 行/5831 symbols（L1 台账 §3-P7）；
    ②kline_daily 表面 2015/1990 起，但 2019 前仅约 237 只票且 100% rule_computed
    ⇒ 涨停回放诚实上限=2019-01-03 起（任务书 §3 断供面在册结论），故本卡 IS 起点取 2019-01-04；
    ③分子面已在册：series/limit_up_count.csv 2019-01-04..2025-09-09、1622 交易日零缺日
    （任务书 §3 广度 7 序列在册；本车道实读表头与首末数据行核得 1623 行=1 表头+1622 日，
    首行 2019-01-04=84、末行 2025-09-09=66）；
    ④缺面明列=**逐日分母（当日在市股票数）与由此得到的涨停比序列从未实测**，
    需一次 CH 聚合：
    `SELECT d.trade_date, countDistinct(d.symbol) AS universe, countIf(d.close >= l.limit_up) AS limit_up_cnt
     FROM c1_market.kline_daily d JOIN c1_market.stk_limit l USING (symbol, trade_date)
     WHERE d.trade_date BETWEEN '2019-01-04' AND '2025-09-09' GROUP BY d.trade_date`
    （21:00–22:30 CH 重查询禁令=任务书 §1 与本战役在册让路通知，本车道未跑）。
    data_window_evidence 补口=待总包 22:30 后按上列命令实测并回填行数与首末日；回填前本卡 status 保持 blocked_on_data。
  blocked_reason: >-
    缺"全市场涨停比"的日度分母实测（当日在市股票数），而非缺表——分子面已在 HEAD 且零缺日，
    解锁成本=一条 GROUP BY trade_date 聚合查询（不涉成分口径、不涉 880 深史 2021-08-02 上限）。
    本卡因此与前役登记的"梯队/高潮面 blocked 于 limit_up_pool 仅 28 日"是**不同根因**：
    前役把阻塞挂在采集面上，而在产阶跃口径的数据面其实在 2019 起已具备（唯分母待一次实测）。
  impl_ref: src/zephyr/signal_ashare/core/sector_strength_wiring.py（MOD-SIG-144，BREADTH_CLIMAX_MAP 56-62 行）
    + src/zephyr/signal_ashare/sector/sector_breadth.py（MOD-SIG-088，档界常量 35-38 行、
    classify_limit_up_breadth 83-91 行、ratio=limit_up_count/constituent_count 语义 78-80 行——
    件内该比率的板块级定义需成分，本卡按接线层的"全市场涨停比"用法取市场级分母，该口径差如实登记）
    + src/zephyr/signal_ashare/core/sector_ecology_judge.py（MOD-SIG-143，门柱 43/113 行）
    + scripts/backtest/fexam/calibration_exam.py:run_card（series 面机判正门）
origin: remine_L11（漏矿来源=④后端实读接线件发现的阶跃映射与门柱等价关系，
