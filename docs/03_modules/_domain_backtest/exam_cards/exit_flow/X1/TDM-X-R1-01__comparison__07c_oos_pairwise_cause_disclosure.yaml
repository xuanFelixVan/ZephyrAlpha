  统筹裁定 2026-10-12＝**甲案（一卡两跑，各判一对）**，三条附加规则随此钉进本卡： ①**PASS 判定＝两跑合议**——本卡最终结论以两次考试行合并判定：
    `arms_variant=off` 那跑判"开臂 vs 关臂"（所判柱 maxdd_improvement_min=5.0、sharpe_delta_min、
