schema_version: '1.0'
card_id: TDM-X-R1-01/comparison/07b_熔断五级梯度减仓对照_复位阶梯锚定版
node_id: TDM-X-R1-01
family: comparison
title_zh: 熔断五级状态机（梯度减仓 vs 单一全清）·净值回放双臂对照卡·复位阶梯锚定版（07b）
version_of: TDM-X-R1-01/comparison/07_熔断五级梯度减仓对照_五态仓位锚定版
hypothesis: >-
  与 07 同一命题（原文不改写）：以组合回撤轴驱动的五级状态机
  （NORMAL/WARN/DANGER/CRISIS/KILL 五态封顶锚定，迟滞解除=半阈值+持续窗+min_hold 三重守卫）
  相对"触发即一次性全清、恢复即一次买回"臂，能在同窗内以更小换手成本取得不劣于后者的回撤控制；
  若判不出来，五级表只是复杂度装饰。
  本版本卡的**唯一新增**＝把 07 卡面上"A2 追认的 L4 不可解除近似"换成**可回放的复位规则**，
  并令复位后的敞口走在册判定件自家的 RECOVERY 阶梯（不是满仓）——
  07 v1 实测该近似使 1414/2123 交易日锁在 KILL、OOS 整窗空仓，本卡要判的是"带复位的纪律"，
  不再是"一次踩死永不松手"。
why_new_version_not_edit: >-
  G4-5：07 的近似条款（L4 不可解除）与三臂级别序列定义属其冻结面；把它原地换掉＝口径变更。
  另起 07b，且 07 v1 的 fail 结论按统筹裁定①**完整保留不翻案**
  （"本卡判的是 fail-closed 清仓纪律本身，OOS 面不可判"）。
signal_kind: series
window:
  in_sample:
  - '2018-01-02'
  - '2025-09-30'
  oos:
  - '2025-10-09'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛，沿用 07/02）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊，沿用 07/02）
    crisis: 2020-02-01..2020-03-23 与 2024-01-02..2024-02-08（两处在册危机段，沿用 02/07）
  multispan_reading_note: >-
    crisis 串是**两段**声明，读数必须全段覆盖：既有 `_span_dates` 只取前两个日期（实现面背离冻结意图的 bug），
    统筹 2026-10-13 已裁修；影响面盘点（哪些卡用多段、哪些已有分数行需 only-append 重读）
    =docs/_working/mineloop2_campaign/12_regime_multispan_impact_inventory.yaml。
  frozen_note: 看数前冻结（裁定#501 纪律）；本卡窗口三值与 07 逐字同值；事后挪门柱=作废（G4-5）
buckets:
  type: arm_matrix
  'on': >-
    开臂=五态封顶锚定＋迟滞＋**复位阶梯（本卡新增）** vs 关臂=五态二值全清（NORMAL/WARN/DANGER/CRISIS
    一律 1.0，唯 KILL 0.0）＋同一复位阶梯 vs 中间臂=五态无迟滞构造档＋同一复位阶梯——
    三臂共用同一条基线净值与同一成交口径，臂间差异只允许出现在级别→cap 乘子表
    （本卡 data_binding.level_to_cap_map，档值全部逐字来自在册件）与解除/复位规则上。
    敏感性括号＝复位入口两档（bracket_A_wide / bracket_B_strict，见 reset_rule），
    两档各跑一对（off/mid），共四跑。
  min_obs_per_bucket: 60
pillars:
  paired_arm_protocol: 三臂共用同一底层组合净值路径（同一份基线臂净值），仅风控层规则异；风控层成交一律按次日开盘价（prereg stop_rules.exit_exec 同语义，禁当日往返）
  drawdown_floor: 开臂相对关臂 OOS MaxDD 改善 >= 5pp；相对中间臂改善 >= 1pp（沿用 07）
  sharpe_floor: 开臂 OOS Sharpe 减关臂 >= -0.1（沿用 07）
  whipsaw_gate: 开臂 30 个交易日内升降级往返次数 <= 基臂降档触发次数；且危机段（两处在册）真实触发不缺席（沿用 07，读数口径见 ③ 已落地实现）
  turnover_cost_gate: 年化换手增量 <= 8.0x；40bp 成本档重跑后开臂结论不变，Sharpe >= 0.0（沿用 07）
  oos_stability: IS/OOS 回撤改善同号；两处危机段均不得劣于关臂（取严：任一恶化即 FAIL）（沿用 07）
  reset_not_full_reentry: >-
    本卡新增的唯一文字柱：复位后敞口**必须**走 RECOVERY 阶梯（25%/50%/75% 然后 NORMAL 100%），
    禁一次买回满仓。这条不是装饰——07 v1 的关臂就是"恢复即一次买回"，
    若开臂复位也直接回满，两臂在"解除形状"上就同构了，本卡只能判回撤阈值一条腿。
    机判面（2026-10-13 落地，不再"待申报"）＝绑定层 `card_binding._validate_recovery_ladder`：
    **开臂**乘子表的 RECOVERY@0/1/2 三行必须①整表覆盖、②逐字等于本卡 level_to_cap_map 里某张已声明的表、
    ③严格递增且首档 <1.0；三条任一不合即抛不出分（禁降级成观测行）。
    只管开臂：关臂三行取 1.0 是它的声明角色（见 ladder_join_provenance），不是违柱。
pillars_numeric:
  maxdd_improvement_min: 5.0
  maxdd_improvement_vs_no_hysteresis_min_pp: 1.0
  sharpe_delta_min: -0.1
  whipsaw_roundtrip_ratio_max: 1.0
  missed_crisis_trigger_max: 0
  turnover_delta_annual_max: 8.0
  cost_tier_bp_required: 40.0
  oos_same_sign: true
pillars_numeric_provenance: >-
  八键逐字沿用 07（=02/06 同值），本班零新增、零收紧、零放宽。本卡与 07 的可批差异只在
  reset_rule（复位入口两档＋RECOVERY 阶梯）与 reset_not_full_reentry 那一根文字柱；
  ③（统筹 2026-10-12 裁定）后三根迟滞/抖动/漏触发柱已有机器面，本卡不再申报 out_of_vocab_pillars。
reset_rule:
  ruling_basis: >-
    统筹裁定 2026-10-13 三裁：①甲案（毕业准则柱无面，入 not_judged 披露）；
    ②两档都跑（A 宽＋B 严括号敏感性，4 试次入账、两档同号取结论）；
    ③B 档自拟值（20 交易日/须创新高）随卡披露＋禁挪他卡＝照本班草案写。规则形状（可回放＋预登记＋呈批后开考）已于 2026-10-12 批。
  machine_anchors: >-
    逐字镜像在册判定件 src/zephyr/risk/core/drawdown_state_machine.py，本班零自造语义：
    KILL 唯一出口 `request_manual_reset`（:556，"KILL 无自动出口"见 :377）；
    复位入参三项确认 `ResetConfirmation`（:236-244）；
    RECOVERY 敞口上限 `position_cap` = 0.25*(step+1)（:312-326，五态表逐字不变）；
    阶梯晋升门槛 `recovery_step_recovered=(0.50, 0.75, 1.0-1e-6)`（:162）＋
    `min_hold_recovery_step=5`（:161）＋`recovery_freeze_days=5`（:169）；
    阶梯回退判据 dd>crisis_dd / dd>danger_dd（:476-499 区段）；
    复位守卫四值 `reset_window_days=20 / max_resets_per_window=3 / reset_cooldown_days=3 /
    permanent_lock_threshold=5`（:170-173）与守卫实现（:575-597，触发即抛 RefuseResetError）；
    毕业准则腿的显式无面档 `graduation_face`（路径 1 补丁新增，缺省 required＝旧行为逐字不变）。
  entry_brackets:
    bracket_A_wide:
      reset_trigger_recovered_pct: 0.50
      reset_cooldown_and_lock_guards: 全部沿用在册守卫原值，本档零自拟参数
      provenance: 0.50 逐字取在册 recovery_step_recovered[0]；冷却/窗口/永久锁定沿用在册四值，不另造
    bracket_B_strict:
      reset_trigger_recovered_pct: 0.75
      reset_cooldown_and_lock_guards: 与 A 档同一套在册守卫原值（两档只差 recovered_pct 门槛）
      provenance: >-
        0.75 取在册 recovery_step_recovered[1]。
        ⚑ 本班上一版在此写"cooldown=20 交易日与须创新高两件机器侧无对应在册值"——**该句不实，已更正**：
        在册件本有复位守卫四值（`reset_window_days=20 / max_resets_per_window=3 /
        reset_cooldown_days=3 / permanent_lock_threshold=5`，:170-173，由 `request_manual_reset` :556-600 逐条强制），
        我把"窗长 20 自然日"误当成"冷却 20 交易日"用了（单位与语义都不同）。
        本卡因此**不另造冷却参数**：复位一律走在册守卫原值（冷却 3 日、近 20 日内 ≤3 次、累计 5 次永久锁定），
        括号之间只差在 recovered_pct 门槛；"须创新高"一件**从两档删除**（无在册对应物，删比自拟干净）。
        若统筹仍要保留"创新高"一件，请另行指定，本班不自拟。
  after_reset_ladder: >-
    两档复位后的阶梯**同值同规**（0.25/0.50/0.75/1.0，晋升门槛与 min_hold/freeze 一律取上列在册值），
    括号之间**只许差在复位入口**——否则敏感性读的就不是"复位快慢"而是两套恢复纪律。
    ⚑2026-10-13 接线实测的**结构发现**（在册件性质，非本卡缺陷，读数必须按此读）：
    阶梯第 2 档→NORMAL 的晋升门槛是 recovered_pct ≥ 1.0-1e-6，而在册回补比例公式
    （risk_layer_orchestrator.py:884-888）在 dd≥0 时返回 0.0，且 recovered=1.0 要求 nav 恰等于 peak
    ⇔ dd=0 ⇒ **回升途中 recovered 严格 <1**，创新高当日又直接归 0 ⇒ 日频净值回放面上
    `graduate_to_NORMAL` 那一行不可达：深回撤后的开臂会长期停在 RECOVERY@2（cap 0.75），
    回 NORMAL 只剩"回撤加深退级/复位"一条路。由 tests/backtest/test_card_binding.py
    ::test_recovered_pct_is_the_in_register_formula_and_saturates_below_one 钉住（max<1.0 断言）。
    本卡不自拟替代门槛（比如把 1.0-1e-6 改 0.95＝改判据）；这条账转维护三班核"生产面同样不可达"是否有意。
  three_confirmation_faces_in_replay: >-
    holdings_verified_zero ⟺ 复位判定日敞口实测为 0（可自证）；
    orders_cancelled_verified ⟺ 日频装置无在途挂单概念，以"日频无在途"近似（不可判，随件披露）；
    new_open_locked_verified ⟺ 复位日起新仓受 RECOVERY cap 约束（由阶梯实现，可判）。
  graduation_criteria_face_declared_no_face: >-
    甲案（统筹裁定①）：在册毕业准则六件（min_trades 3 / min_profit_streak 3 / min_expectancy_r 0.3 /
    min_rule_compliance 0.80 / max_single_loss_r 1.2 / window 10，:163-168）的输入面是**逐笔交易序列**，
    而本卡装置（exit_simulator）只交日频净值/敞口 ⇒ 该面**不可评估**。
    本班不造代理指标（拿"连续 3 日正收益"冒充"3 笔盈利"＝偷换语义）。
    **落实形态（统筹裁定 2026-10-13 路径 1，署名批准＋Owner 否决窗）**：
    该柱经 `graduation_face='absent'` 显式跳过并留痕（生产件配置档，统筹批＋Owner 否决窗）——
    即在册件 `src/zephyr/risk/core/drawdown_state_machine.py` 新增纯追加配置档，
    缺省 `required` 时旧行为逐字不变，只有显式配 `absent` 才跳过这一腿，
    且跳过必计数（`graduation_face_skips`）＋打点（`DRAWDOWN_GRADUATION_FACE_ABSENT`），
    凭据面可复核；拼错取值即 `InvalidDrawdownStateError`（禁静默退回缺省）。
    路径 2（笔级回放面）留档不承诺；路径 3（适配器内自写阶梯变体）永不采用——
    那是本班自己钉进 07 的"禁在考卷里重写判定逻辑"，统筹令明文不拆。
exam_scope_note: >-
  考试范围与合议规则（统筹裁定②）：本卡须跑 **四跑＝2 复位括号 × 2 配对档（off/mid）**，
  配对档由绑定册 `arms_variants.{off,mid}` 显式指名（同 07 裁定甲③，跑与跑之间禁动其他参数）；
  ①**任何单跑不得读成全卡结论**——同一括号内两跑合议（判"开臂 vs 关臂"与"开臂 vs 中间臂"两对），
  跨括号取**同号**方可读作稳健：两档结论不同号＝本卡判"规则选择未过稳健性"，不挑好的那档报；
  ②四跑试次**全部进 n_trial_ledger**（同卡四试次，预算册记 4；判官侧 batch_id 无跑次判别位，
  按 07 成例经同一 record_run 单口以带判别位 batch_id 补记，并照单申报）；
  ③凭据面须同时显形 `arm_level_creds`（含复位后的 RECOVERY 驻留日数与阶梯晋升次数）
  与 `not_judged_pillars`，缺一即交付不闭环（07 的验收条件沿用）。
data_binding:
  baseline_birth: 出生四件（信号面/宇宙册/调仓行批次/r 位来源）逐字沿用 06 卡 piece_1..piece_4 的符号引用链，真源=scripts/backtest/fexam/exit_sim/prereg_frozen.yaml；本班禁把 24 列名单抄进本卡（抄＝造第二真源）
  signal_table: c1_market.kline_daily_hfq + c1_market.technical_indicator（经装置 load_* 面，本卡不直查）
  signal_column: 基线臂日净值（simulate(stop_enabled=True) 产出）；级别判定与迟滞/复位回放真源=src/zephyr/risk/core/drawdown_state_machine.py（MOD-RK-049），禁在考卷里重写判定逻辑
  level_to_cap_map:
    five_state_native: {NORMAL: 1.0, WARN: 0.8, DANGER: 0.5, CRISIS: 0.3, KILL: 0.0}
    binary_full_clear: {NORMAL: 1.0, WARN: 1.0, DANGER: 1.0, CRISIS: 1.0, KILL: 0.0}
    recovery_ladder: {step_0: 0.25, step_1: 0.5, step_2: 0.75, graduate_to_NORMAL: 1.0}
    five_state_native_with_ladder: {NORMAL: 1.0, WARN: 0.8, DANGER: 0.5, CRISIS: 0.3, KILL: 0.0, RECOVERY@0: 0.25, RECOVERY@1: 0.5, RECOVERY@2: 0.75}
    binary_full_clear_with_ladder: {NORMAL: 1.0, WARN: 1.0, DANGER: 1.0, CRISIS: 1.0, KILL: 0.0, RECOVERY@0: 1.0, RECOVERY@1: 1.0, RECOVERY@2: 1.0}
    provenance: 前三表逐字取在册件 position_cap 的 return 行（:312-326）与 recovery_step_recovered（:162）；本卡不自拟任何档值
    ladder_join_provenance: >-
      ⑑2026-10-13 接线实测补的两张"拼好的表"，零新数值，只把上面三表拼成臂乘子表的合法形状：
      `five_state_native_with_ladder` 的 RECOVERY@0/1/2 三行逐字＝`recovery_ladder` 的 step_0/1/2
      （即在册 position_cap 0.25/0.50/0.75，:312-326）；
      `binary_full_clear_with_ladder` 的三行=1.0 是**关臂的声明角色**——本卡 buckets.on 原文
      "NORMAL/WARN/DANGER/CRISIS 一律 1.0，唯 KILL 0.0"，复位后的三档按同一条纪律取 1.0（＝一次买回）。
      为什么必须在卡面写出来：级别序列一旦出现 RECOVERY@k，`arm_level_cap_multiply` 与判官 `_cap_series`
      都按"映射没覆盖即抛"的红线走（有意的 fail-closed），三表没拼好的形态是**跑到阶梯那天当场红**；
      而关臂的 1.0 若不写进卡面，绑定层就只能自己在册外拍数。上一版本只有三表，off 配对的关臂无处取值。
  arm_protocol: 三臂输入同一基线净值序列与同一成交口径；级别序列由在册判定件按臂档分别从同一基线回放产出（迟滞档/无迟滞档/复位档）
  device_ref: scripts/backtest/fexam/exit_sim/exit_simulator.py（净值与成交口径）+ src/zephyr/risk/core/drawdown_state_machine.py（判定真源）+ scripts/backtest/fexam/card_binding.py 的 replay_drawdown_levels（日频适配器）
  implementation_gap: >-
    ①–⑤ 逐件的落地态（2026-10-13 本班接线袋；原"缺一不开考"的自钉已兑现，逐件去向如下）：
    ①【已落地】`replay_drawdown_levels` 新增复位档 `levels_with_reset`／`levels_no_hysteresis_with_reset`
    （档位属性册 `DRAWDOWN_LEVEL_TIERS` 是档名唯一真源，`DRAWDOWN_LEVEL_SERIES_NAMES` 由它派生）。
    复位动作**只调在册件** `request_manual_reset`（含三项确认与四守卫，守卫拒因原样计数进凭据面
    `refusals_first8`，适配器零守卫分支）；`drawdown_level_series_pack` 改为按册格点名取档、
    **无默认全集**（默认全产会让复位档悄悄进 07 的每一跑，两卡读数从此不可比）。
    回补比例的峰/谷逐字镜像在册 drawdown_tracker.py:276-287（与真 DrawdownTracker 逐日对拍钉住），
    比值**直调**在册 risk_layer_orchestrator.py:884-888（不重写公式）。
    ②【已落地】RECOVERY 带步号档名 RECOVERY@0/1/2 进乘子面：卡面新增两张拼好的表（见
    ladder_join_provenance），`_validate_recovery_ladder` 逐字对卡面校验，缺行/拍数/形状不合即抛不出分。
    ③【已落地】两括号入口参数由绑定册 `arms_variants.<跑>.reset_trigger_recovered_pct` 逐跑注入，
    适配器与判官都不硬编；错配四态各红一次（复位档缺参数／非复位档收参数／越界／没点复位档却给参数）。
    ④【已落地】`_span_dates` 多段解析缺陷的修（统筹裁修）已随 0015 落地；07 受影响 2 行的
    only-append 重读按新 run_id 执行、旧行保留（见 12_regime_multispan_impact_inventory.yaml）。
    ⑤【已落地】路径 1 的 `graduation_face` 配置档（统筹署名批准＋Owner 否决窗，否决窗 2026-10-13 晨到期）
    随本卡接线袋之前的独立袋落地；缺省 `required` 档旧行为逐字不变，复位档显式配 `absent` 并留痕
    （凭据面 `graduation_face`／`graduation_face_skips`＋生产打点 DRAWDOWN_GRADUATION_FACE_ABSENT）。
