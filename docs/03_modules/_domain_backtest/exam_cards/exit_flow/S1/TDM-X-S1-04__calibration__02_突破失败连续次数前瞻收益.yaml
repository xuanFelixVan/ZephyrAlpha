schema_version: '1.0'
card_id: TDM-X-S1-04/calibration/02_突破失败连续次数前瞻收益
node_id: TDM-X-S1-04
family: calibration
title_zh: 突破失败（买入理由消失）·连续失败次数分档校准卡
hypothesis: 个股"创 20 日新高后跌回且量能萎缩"的连续失败次数 K（0/1/2/3）对次日及未来 5 日个股收益有单调负向预测力（取反向标定值后应为正 IC）；K≥3 档的后续收益显著劣于 K=0 基线——这正是 TDM 把 K≥3
  定为强制清仓触发器的经验根据。
signal_kind: panel
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos:
  - '2024-01-01'
  - '2025-09-09'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛，段轴真源=entry_flow/L1 校准模板 window.regimes）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结（裁定#501 纪律）；窗口与分桶沿用战役模板同期口径，事后挪门柱=作废（G4-5）
buckets:
  type: ordinal_event_count
  'on': K∈{0,1,2,3+}（同一票 20 日内连续"新高跌回+量缩"失败计数，成功突破或满 20 日清零）
  min_obs_per_bucket: 60
pillars:
  response_monotonicity: 分档中位前向收益（取反向标定后）Spearman 单调 rho>=0.6（IS 窗内）
  ic_floor: 日频截面 rank IC 均值 >= 0.02 且 IC_IR >= 0.3（沿用战役模板地板不自降标准；事件条件类若达不到即判该读数无独立判别力）
  gap_vs_baseline: K>=3 档 5 日中位收益相对 K=0 档差值 <= -0.5%（强制清仓触发器的经验门槛；达不到则 K≥3 触发器应降级为观察）
  lag_profile: t+1..t+5 至少一档 |IC| 达峰值且半衰期 >= 1 交易日（时滞曲线建档）
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor（条件稳定性）
pillars_numeric:
  mono_spearman_min: 0.6
  ic_mean_min: 0.02
  ic_ir_min: 0.3
  regime_same_sign: true
  oos_same_sign: true
  gap_k3_vs_k0_5d_max: -0.005
target:
  primary: next_day_stock_return（个股次日收益，后复权口径，主轴）
  secondary: forward_5d_excess_vs_000300（未来 5 日相对 000300 超额）
  note: 纯读数环节（本节点三路信号里唯一长窗可算的一路）；情绪退潮/龙虎榜两路各自另卡，见本卡 data_window_evidence 的断供披露
lineage:
  card: null
  run_id: p08b-1016-02-x-s1-04-02
  score_row: exam_scores_v1.yaml#rows[109]
  confidence_writeback: TDM.nodes.TDM-X-S1-04.confidence
data_binding:
  signal_table: c1_market.kline_daily_hfq
  signal_column: high / close / volume（衍生 20 日新高、跌回判定、量能萎缩比）
  signal_derivation: 突破=当日 high > 前 20 交易日最高 close；失败=此后 5 个交易日内收盘跌回突破日前高之下 且 当日 volume < 20 日均 volume×0.8；连续失败计数 K 在同票滚动
    20 日内累加，成功站稳（收盘连续 2 日高于突破前高）或超 20 日清零；信号取反向标定值 sig=-K 使正相关假设成立（K 越大越该卖）
  target_source: kline_daily_hfq close 的 T+1 简单收益（load_close/forward_returns 复用 ch_data.py:190-199）；超额面基准=kline_index symbol='000300'
    close（实测覆盖 2005-01-04..2026-10-09 共 5284 行）
  data_window_evidence: '命令原文: python -c "import sys; sys.path.insert(0,''scripts/backtest''); from fexam.ch_data import ch_query_df;
    print(ch_query_df(''SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM c1_market.kline_daily_hfq''))"
    → 实测 1990-12-19..2026-09-30 rows=10098785 nsym=5916；kline_index(000300) 实测 2005-01-04..2026-10-09 rows=5284'
  blocked_faces: 情绪退潮路=断供不弃卡：六段态在 CH 仅有 c1_backtest.decision_daily.market_state（实测 138 行、2026-09-16..2026-10-12、值域 expansion/unknown），无历史六段序列；c1_market.emotion_index.stage
    实测枚举=close_final/pre_open/auction（快照阶段标记，非情绪六段），不可误用作退潮代理；sector_snapshot 实测 2026-08-14 起 122746 行、market_breadth_snapshot
    2026-08-24 起 174 行，窗均不足 → 该路 status=blocked_on_data（缺=2019..2025 段六段态表）
