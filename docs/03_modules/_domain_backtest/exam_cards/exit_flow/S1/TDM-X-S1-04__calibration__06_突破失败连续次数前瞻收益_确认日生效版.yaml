data_binding:
  signal_table: c1_market.kline_daily_hfq
  signal_column: high / close / volume（衍生 20 日新高、跌回判定、量能萎缩比）
  signal_derivation: >-
    突破＝当日 high > 前 20 交易日最高 close；失败＝此后 5 个交易日内收盘跌回突破日前高之下 且 当日 volume < 20 日均 volume×0.8；
    连续失败计数 K 在同票滚动 20 日内累加，成功站稳（收盘连续 2 日高于突破前高）或超 20 日清零；
    信号取反向标定值 sig=-K 使正相关假设成立（K 越大越该卖）。
    本条与母卡逐字同，唯一改动＝补"落定时点＝确认日 d5 收盘"与"K(t) 只累加生效日 ≤ t 的事件"两句（frozen_definitions）。
  target_source: kline_daily_hfq close 的确认日次一交易日简单收益（load_close/forward_returns 复用 ch_data.py 同段）；超额面基准=kline_index symbol='000300' close
  data_window_evidence: >-
    沿用母卡 02 的实测窗证据（该证据由母卡在 2026-10-10 取数登记，本卡窗内未发任何 CH 查询＝Owner 10:5x 压缩窗令）：
    kline_daily_hfq 1990-12-19..2026-09-30 rows=10098785 nsym=5916；kline_index(000300) 2005-01-04..2026-10-09 rows=5284。
    窗毕开考前须按本卡新定义重取"确认日"面的逐票事件序列，取数命令随绑定层工单出。
  blocked_faces: >-
    情绪退潮路/龙虎榜路各自另卡（母卡 02 已披露断供：六段态无 2019..2025 历史序列），本卡不并面、不代判。
