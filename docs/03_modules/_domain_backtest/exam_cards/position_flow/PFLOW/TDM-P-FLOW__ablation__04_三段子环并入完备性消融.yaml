    + c1_market.kline_daily_hfq（ATR14 自算）
  signal_column: 批1分数册 verdict==pass 的 ch_backings 首列，文档序去重 cap 24（承 prereg_frozen.yaml
    device.columns_cap24 同一清单，禁挑列）
  signal_derivation: composite_signal → monthly_topn_signals(top_n=20) → 各臂叠 overlay；
    做T 腿=S123 待施工注入项
  target_source: 各臂日 NAV → strategy_exam.window_metrics；基准=kline_index 000300 close
  data_window_evidence: |
    边表事实（本车道 Grep 实读，config/trading_decision_map.yaml 原文行）：
    L6378 `- {from_node: TDM-P-P3, to_node: TDM-P-FLOW, edge_type: feed, payload_type: signal,
    frequency: continuous, lag: "0d", pit_proof: legacy-unaudited}`——全仓 grep TDM-P-FLOW 仅此一条入边、
    零条出边（与前役"下游无（终点）"一致，但**P1/P2 未接入流根**是前役六向未记的事实）。
    做T 料面在册实测（前役 L4_ledger.md §二 P2-01/P2 行 + docs/_working/t0_matrix/
    t0_conditional_e4_v3_verdict.md）：V3 主考 0 对、禁做侧 26 对净均 -36.26bp、前置命中率 0.2308、
    宏观放行 20 对被情绪门 100% 否决。
    价格面：c1_market.kline_daily_hfq 1990-12-19..2026-09-30 / 10,098,785 行（L4_ledger.md §一实测表）。
    K 维折叠事实：factory_grid_executor.py DEFAULT_CONTEXT capital_ramp_enabled=False（前役实读 L122）。
non_duplication_note: 净新增考法，不替代任何既有卡。与 TDM-P-FLOW/ablation/02 的区别=
