data_binding:
  signal_table: grid run 产物（net_returns 宽表，index=trade_date）+ 条件包（由该表派生的日亏档）
    + c1_market.kline_daily_hfq（close 面，复核 nav 与个股后续 10 日收益）
  signal_column: net_returns（组合日收益）→ cell_eligible={date, cell_id(B2/B4), 是否加仓笔}
  signal_derivation: >-
    组合日收益 port_t = nav_t/nav_{t−1} − 1（与引擎 _apply_dd_breaker_overlay 同口径 weights.shift(1)×rets，:1226-1229 实读，禁另造）；
    禁加日 B2 = {port_t <= −0.02}、B4 = {port_t <= −0.04}；
    加仓笔 = 同 recipe 下 K=pyramid 臂相对 lump 臂的正权重增量日（档成交语义见 arm_definition）；
    后续收益 = 该增量权重在未来 10 交易日的贡献（成本后，承 run 产物已扣 frozen_l0 的净收益序列）；
    战场格 = B2 ∩ ¬B4（两口径唯一分歧处，本卡最重要的一格）。
  target_source: run 产物 net_returns 的分层年化/成本后 sharpe（condition_attribution 件产出）
  data_window_evidence: >-
    口径对撞的三处实码原文（本车道台账 §3-A3，命令均在本工棚实跑 2026-10-10）：
    ①`src/zephyr/position/core/defensive_asset_whitelist.py:54-61` `class CircuitLevel`：
    `L0 正常` / `L1 警戒（日亏≥2% 禁加仓）` / `L2 禁开仓（日亏≥4%：白名单窄门开启）` / `L3 减仓（日亏≥6%）` / `L4 保命（清仓+Owner 接管）`
    （头注声明"真源=X-R1-01 drawdown_state_machine，本模块只消费不判定"）；
    ②`src/zephyr/position/core/pyramiding_rules.py:79-81` `_CIRCUIT_BAN_LEVELS = frozenset({L2,L3,L4})`＋`:22` 注释"日亏 4% 熔断=L2 触发时全禁"
    ⇒ 加仓码实际在 「>=4%」 才禁加仓（与①的"2% 禁加仓"冲突）；
    ③`src/zephyr/risk/core/ashare_stop_loss_engine.py:141` `daily_loss_limit: float = 0.02`（文档串"日亏损限额, 默认 0.02 (-2%)"）
    ⇒ 日亏限额本身按 2% 计，而"禁加仓"按 4% 触发 ⇒ 同一"日亏"状态量在两件里承担不同动作。
    装置在岗性实测（本车道台账 §3-A4/§2）：`factory_grid_executor.py:839-841` 实读
    `breaker_mode = v.get("X_breaker","off")` → `if breaker_mode != "off": weights, _ = _apply_dd_breaker_overlay(weights, closes, breaker_mode)`
    ⇒ 熔断维已接线（与同车道台账 §一 一致）；`_apply_dd_breaker_overlay`(:1204-1234) 帽带常量 NORMAL 1.0/WARN 0.75/DANGER 0.50/CRISIS 0.25/KILL 0.0
    且 `kill_dd=0.20`、状态量=nav 回撤 ⇒ 判「不可」作为"日亏熔断"替身（本卡据此不采 X_breaker 作臂，只采其 nav 派生写法）。
    分层归因正门在册性：`scripts/backtest/condition_attribution.py:20-56`（件自述胞级仅作观察、判据仍=全窗成本门）
    + 同节点 comparison/03 已用该件与 `load_pack=zephyr.backtest.regime_validation.condition_package`（对方 evidence 原文）
    ⇒ 结论：④腿「无缺件」，同车道"需施工"的隐含判断经复核不成立=本车道翻案之一。
    材料现实前置：金字塔 K 维在 DEFAULT_CONTEXT 中 `capital_ramp_enabled=False`（引擎 L122 实读，承同车道台账），
    故本卡须以 `capital_ramp_enabled=true` 的 run 为准；若既有 run 未开闸则该格判 DEVICE_NOT_ARMED（禁把"无料"判成"无信号"，承同车道 §四 结论②纪律）。
  impl_ref: src/zephyr/position/core/pyramiding_rules.py（TDM module_ref=MOD-POS-027，④腿载体）
    + src/zephyr/position/core/defensive_asset_whitelist.py（CircuitLevel 枚举真源消费方）
    + scripts/backtest/condition_attribution.py（分层归因正门）
executor_note: 本卡不需新执行件（见 data_window_evidence 的装置在岗性实测），仅缺 ≤30 行条件包派生脚本（exam 侧临时件）
