    禁补亏损仓=红线）；②情绪段权限（点火/扩张段才开加仓，退潮/亢奋关）；③策略亲和度>0；
    ④非熔断禁加期（日亏 4% 熔断触发时全禁）”；
    live 侧门实现实读 src/zephyr/position/core/pyramiding_rules.py:76-81
    （_PHASES_ALLOW={IGNITION,EXPANSION}、_CIRCUIT_BAN_LEVELS={L2,L3,L4}）；
    引擎侧确认无段门/无熔断门/无亲和度门（_apply_capital_ramp_overlay 全文只读价格档）⇒
    本卡的 B 臂与另三腿均为施工位，逐腿卡已分列（②见 P3-01/comparison/03）
    正查义务：`python -m zephyr.library.lookup state "金字塔加仓"` 输出摘录见台账 §三 探针账
