data_binding:
  signal_table: c1_market.kline_daily_hfq（close 与 ATR14 底座）+ 合成持仓台账（entry 价，回测平面唯一来源）
  signal_column: 派生 pnl% = kline_daily_hfq.close / entry_price − 1（非在册单列）；
    对照面 ATR 带宽 = (close − stop_line)/ATR14（承同车道 02 卡定义）
  signal_derivation: >-
    持仓集合与 entry 价承同车道 02 卡口径：composite_signal → monthly_topn_signals(top_n=20) → 调仓 T+1 开盘价为 entry；
    stop_line = entry − 3×ATR14(调仓信号日收盘)（prereg_frozen.yaml stop_rules）；
    ATR14 用 Wilder 平滑，件复用 scripts/backtest/fexam/exit_sim/exit_simulator.py 的 atr14_wilder(L135)/wilder_atr_one(L119)，禁重造；
    「ATR 缺失判定=该 (symbol, trade_date) 在 hfq 表无行，或自上市起有效交易日 <14（热身不足）」，
    该子集即 fallback 腿的检验对象，须单独计数披露，禁混入三档（承同车道 02 卡 atr_missing_arm 的同一纪律）；
    合取臂=WATCH if (pnl% < −0.03) OR (band < 1.5)（节点"或"字的直译），纯 ATR 臂=WATCH if (band < 1.5)。
  target_source: kline_daily_hfq close → worst_return_next_5d（未来 5 交易日 min(close_{t+i}/close_t − 1））；
    stop_trigger_rate_5d 用同表 close vs stop_line
  data_window_evidence: >-
    覆盖实测（本车道台账 §2-P4 与 L4 台账 §一，同表同口径）：c1_market.kline_daily_hfq=
    1990-12-19..2026-09-30 / 10,098,785 行，列含 open/high/low/close/volume/amount/amplitude/pct_change/turnover
    ⇒ close 足算 pnl% 与未来 5 日最差收益，high/low 足算 ATR14；OOS 上界 2026-09-30=实测 max(trade_date)（其后 9 日缺口已在 L4 台账 §3-P10 登记）。
    码内现状正查（本车道台账 §3-A2，命令原文
    `grep -n "PCT|0.03|pnl|浮亏" src/zephyr/sell_decision/core/position_triage.py`）→ 仅
    `_WATCH_ATR_MULTIPLIER: Final[float] = 1.5`(L62)、`_HOLD_ATR_MULTIPLIER: Final[float] = 3.0`(L63)、
    `watch_abs = _WATCH_ATR_MULTIPLIER * atr_value - delta_abs`(L148)、`hold_abs = ...`(L149)
    ⇒ 「盈亏百分比尺与 ATR 缺失降级路径在码内无载体」，而 TDM 原文两条都写了
    ⇒ 本卡是考法也是治理产出（"地图有、码内无"如实登记，不改 TDM、不改码，属本车道禁区）。
    节点原文指针=config/trading_decision_map.yaml 本节点 algo_note_zh 与 fallback 字段（本车道节点快照
    D:/ZephyrAlpha/.runtime/tmp/st-nightmine-20261010/rxa_dump.txt L223-256）。
  impl_ref: src/zephyr/sell_decision/core/position_triage.py（TDM module_ref=MOD-SELL-000，实读 L62-63/L148-149/L151-153）
    + scripts/backtest/fexam/exit_sim/exit_simulator.py（ATR/成本/调仓口径复用件）
