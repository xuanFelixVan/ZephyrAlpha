schema_version: '1.0'
card_id: TDM-P-P1-02/calibration/04_盈亏百分比腿与ATR缺失降级
node_id: TDM-P-P1-02
family: calibration
title_zh: 持仓盈亏百分比尺与 ATR 缺失降级·校准卡（RX-A 交叉复挖漏矿）
hypothesis: >-
  TDM 本节点 algo_note 的分级判据是「两把尺的合取」："WATCH（「浮亏>3%」 或临近止损）秒级盯；
  MONITOR（「浮盈浮亏 3% 内」）5 分钟盯；HOLD（深度浮盈安全区）事件驱动"，且 `fallback` 原文=
  "「ATR 数据缺失→按盈亏百分比粗分级」"。同车道两卡（calibration/02 与 comparison/03）的 buckets 都是
  「纯 ATR 带宽」（(close−stop)/ATR14 的 1.5/3.0 两把尺），盈亏百分比尺从未入任何判据面；
  本车道正查实码（台账 §3-A2）确认 `position_triage.py` 只有 `_WATCH_ATR_MULTIPLIER=1.5`/`_HOLD_ATR_MULTIPLIER=3.0`
  与 delta 扣阈，「grep 无 pnl/3% 相关常数 ⇒ 地图写了、码内没有」。
  本卡三问：①盈亏% 尺对后续下行有没有独立信息（IC/单调）；②在 ATR 尺之上叠加它有没有边际
  （合取臂 vs 纯 ATR 臂，边际<=0 则节点"或"字的一半是装饰）；③ATR 缺失子样本里它单独用够不够
  （=直接考节点那条 fallback：若判别力塌陷，则 fallback 应改写为"缺 ATR 直接进最高档 WATCH"而非"按盈亏粗分级"）。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: >-
    看数前冻结。IS/OOS 与 ATR 口径逐字承同车道 calibration/02（ATR14 Wilder、stop=entry−3×ATR14、
    entry=月频调仓 T+1 开盘价、threshold_delta 反馈钳制本考置 0 以隔离反馈面），
    目的是「与 02 卡同窗同底座可比」，不另起口径虚增覆盖尺。
    节点原文只给"3%"一处数字，"深度浮盈安全区"无数值 ⇒ 本卡钉死 HOLD-pnl=浮盈>+3%（与 MONITOR 带对称，
    这是补齐地图空白的最小冻结而非调参），并在此声明：若日后 TDM 给出别的数，须另立扩档卡，本卡不追溯。
buckets:
  type: ordinal_three_level
  'on': 当日盈亏百分比 pnl% = close/entry − 1 映射三档（<−3%=WATCH-pnl；−3%..+3%=MONITOR-pnl；>+3%=HOLD-pnl）
  min_obs_per_bucket: 60（三档各 >=60 持仓-日；WATCH-pnl 档若不足判 nan 禁并入）
  extra_bucket: pnl% 连续值另做十分位分桶用于单调性 rho；另设 ATR 缺失子样本层（见 atr_missing_arm）
pillars:
  response_monotonicity: 十分位 pnl% × 未来5日最差收益 的中位响应 Spearman rho >= 0.6（pnl 越负越危险，符号为负）
  ic_floor: 日频截面 IC 均值 >= 0.02 且 IC_IR >= 0.3（机构对标地板，与同车道 02 卡同门槛；
    符号先验为「正」——pnl% 越高则未来 5 日最差收益越高，机判面 pillars_numeric 即按此有符号口径判，
    若实测为负号则同车道 02 卡的 ATR 带宽尺符号亦应反号，两卡同场对卡后才可判谁错）
  level_ordering: 三档中位未来5日最差收益必须满足 HOLD-pnl > MONITOR-pnl > WATCH-pnl（一档反序=判 fail）
  increment_over_atr_band: 合取臂（WATCH = pnl<−3% 「或」 ATR 带宽<1.5，承节点"或"字）相对纯 ATR 臂的
    IC 提升 >= 0.005 且 mono 不劣 ⇒ 盈亏尺必要；提升 < 0 ⇒ 节点双尺之一是装饰，登记为简化提案
  atr_missing_arm: 「本卡对 fallback 的直接检验」——ATR 不可得（停牌/新股热身不足）的持仓-日单独成层，
    在该层内 pnl% 尺的 |IC| 与单调 rho 须 >= 全样本同指标的 60% 才判"按盈亏百分比粗分级可接受"；
    低于 60% ⇒ 该 fallback 应改写（缺信息时的降级分类不可靠，宁可进最高档），这是节点文字的可证伪面
  lag_profile: t+1/t+3/t+5 至少一档 |IC| 达峰值且半衰期 >= 1 交易日
  regime_stability: bull/bear 两段同号且均过 ic_floor（pnl 尺在熊段应更强，若不更强则该尺的告警价值被高估）
  alert_cost_pairing: 合取臂的 WATCH 档占比增量须同框报数（<= +15pp，承同车道 comparison/03 的告警膨胀地板）——
    碰钱环节的盯盘频率是稀缺资源，判据成组禁单指标
target:
  primary: worst_return_next_5d（未来 5 个交易日的最差收盘收益，下行侧口径，与同车道 02 卡同 target 以便直接对卡）
  secondary: stop_trigger_rate_5d（未来 5 日收盘跌破 stop_line 概率）与 watch_share_delta（告警量代价）
  note: 本卡与同车道 02 卡的关系=02 考 ATR 尺，本卡考 pnl 尺与两尺合取；两卡合起来才覆盖节点原文的完整判据句
