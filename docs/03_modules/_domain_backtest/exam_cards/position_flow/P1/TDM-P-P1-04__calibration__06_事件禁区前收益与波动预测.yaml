schema_version: '1.0'
card_id: TDM-P-P1-04/calibration/06_事件禁区前收益与波动预测
node_id: TDM-P-P1-04
family: calibration
title_zh: 风险否决体检·校准卡：财报前 1 日/解禁前 3 日禁区的下行与波动证据（缺表挂账不弃卡）
hypothesis: >-
  第三类否决线=事件禁区（财报前 1 日、解禁前 3 日不做加仓/做T，转离场评估）。假设这两类事件前
  个股的下行风险与已实现波动显著抬升（禁区=削尾部而非赚收益）。
  若事件前无异常，则禁区只是流程性保守，其机会成本应从 P3 加仓收益中扣减披露。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30
    bear: 2021-07-01..2024-01-31
  frozen_note: 看数前冻结；T-1/T-3 禁区定义先写死
buckets:
  type: event_window
  'on': 事件前窗口分组（财报前 1/2/3/5 日、解禁前 1/3/5/10 日），对照组=无事件日同分层样本
  min_obs_per_bucket: 60（每窗口每段个股-日样本）
pillars:
  event_effect: 财报前 1 日与解禁前 3 日的未来 5 日超额收益中位显著低于无事件对照（差 >= 0.3pp/5日）
  vol_gate: 事件窗内已实现波动（5 日 close-to-close std）分位 >= 对照 +10pp（禁区=波动腿）
  ic_floor: 事件距离（天）对未来 5 日超额的日频截面 IC 均值 <= -0.02、|IC_IR| >= 0.25
  regime_stability: 牛/熊两段同号（预期熊段更强）
  opportunity_cost: 另报“禁区误伤成本”=禁区期内若照常加仓的模拟超额（负向披露，碰钱面必须两面都算）
target:
  primary: excess_return_next_5d（事件窗 vs 对照）
  secondary: realized_vol_5d 分位差、禁区误伤成本
status: blocked_on_data
signal_kind: panel
pillars_numeric:
  event_effect_min_pp: 0.003
  ic_mean_min: -0.02
  ic_ir_min: -0.25
  regime_same_sign: true
  oos_same_sign: true
blocked_on_data:
  missing_tables: 个股级财报披露日表 / 限售解禁日历表（c1_market 库内无）
  evidence: |
    cd D:/ZephyrAlpha && python -c "
    import sys; sys.path.insert(0,'scripts/backtest')
    from fexam.ch_data import ch_query
    print(ch_query(\"SELECT name FROM system.tables WHERE database='c1_market' AND (name LIKE '%unlock%' OR name LIKE '%restrict%' OR name LIKE '%disclos%' OR name LIKE '%report%' OR name LIKE '%express%' OR name LIKE '%financial%' OR name LIKE '%holder%') FORMAT TabSeparated\"))"
    输出：execution_report（仅此一条，且=交易执行报告非财报/解禁日历）
    另：c1_market.calendar_event 列实测=['event_date','event_type','description','data_source','ingest_ts',
    'pub_value','exp_value','prev_value']——宏观数据发布类（pub/exp/prev value），无 symbol 维，
    不可用于个股事件禁区（空结果/窄结果先判静默失败：本次为列结构确证，非查询失败）
  needed: 登记任一在册财报披露日/解禁日历源（如 DS 族内可派生则改指针），接线后即可开考
  keep_card_alive: 断供不弃卡（作业簿 §三⑥）——假设/窗口/分桶/门柱已冻结，补数即跑
lineage:
  card: null
  run_id: null
  score_row: null
  confidence_writeback: TDM.nodes.TDM-P-P1-04.confidence
