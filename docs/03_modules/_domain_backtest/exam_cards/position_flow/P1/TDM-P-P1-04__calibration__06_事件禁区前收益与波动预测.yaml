preregistered_at: '2026-10-10'
discipline: 冻结后开考；事后挪门柱=作废（G4-5）
data_binding:
  signal_table: 待登记（财报披露日/解禁日历）；对照面 c1_market.kline_daily_hfq（已有）
  signal_column: event_distance_days（距财报披露日/解禁日的交易日数）
  signal_derivation: 事件日表 join symbol×trade_date 面板，取 min(距披露交易日数, 距解禁交易日数)
  target_source: kline_daily_hfq close → 未来5日超额收益与已实现波动
  data_window_evidence: |
    可用侧实测：kline_daily_hfq 1990-12-19..2026-09-30 共 10,098,785 行（列含 open/high/low/close/
    amplitude/pct_change/turnover）；缺表侧探针原文见本卡 blocked_on_data.evidence
    正查义务留痕：本卡“缺表”断言的三源正查=system.tables LIKE 探针（上）+ 馆库
    `python -m zephyr.library.lookup state "财报 解禁 日历"`（输出摘录进台账 §三 探针账）+
    data_asset_registry.yaml grep（财报/解禁相关 DS 条目待补行号）
  ds_ref: DS-107=event.news_sentiment_window（registry L4661，事件衰减面属 P1-03 而非本卡的日历禁区）
