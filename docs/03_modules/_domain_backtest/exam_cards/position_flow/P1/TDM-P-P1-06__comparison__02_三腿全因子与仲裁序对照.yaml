  signal_column: 24 列 cap 合成秩
  signal_derivation: composite_signal → monthly_topn_signals → 三腿 overlay（序开关待施工）
  price_table: c1_market.kline_daily_hfq
  target_source: 8 臂日 NAV → strategy_exam.window_metrics；冲突日集合=各腿 trigger 矩阵按行相加 >=2
  data_window_evidence: |
    接线/未接线实读证据：factory_grid_executor.py:836-841（stop_mode/breaker_mode 取自 v 并调用 overlay）、
    :1034 定义 _apply_thesis_survival_overlay 且文件内 grep 无调用点；
    config/position_recipe_grid_schema.yaml:71-87（X_stop/X_breaker active_if "phase >= 3"），无 thesis/M5 维
    TDM 本节点原文=“汇总五路体检…任一子项异常=该持仓置‘人工确认’默认态”（人工确认面属 live 运维，不在回测平面）
