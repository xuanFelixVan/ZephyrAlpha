buckets:
  type: champion_challenger
  'on': champion 与 4 挑战者逐日配对收益差
  min_obs_per_bucket: 配对观测日 >= 244（一年）方可出 mSPRT 证据量；不足只报描述统计
pillars:
  evidence_gate: 每个挑战者报告 mSPRT 对数似然比（或降级配对 t 的 t 值与 p 值），
    不判终胜负（MOD-PF-008 口径，件 docstring 明写）
  risk_gate: champion 相对 rk08_solo 的 OOS MaxDD 不劣化 >1pp 且成本后 Sharpe 不劣 >0.1，
    否则帽层=过度工程候选（进净零合并评估队列）
  turnover_or_cost_gate: 各套换手与成本后指标同框报数；钳制/地板必然抬换手，未扣成本的改善不算数
  oos_and_regime_gate: 证据方向须在 OOS 与熊段不反向
  rollback_gate: 影子期判据未达标 ⇒ 维持现 champion 且本卡结论=“帽层保留但证据不足”，
    禁据此直接上生产（转生产属 Owner 门位，宪法 §5 资金与实盘交易）
target:
  primary: msprt_log_lr_champion_vs_each_challenger（降级时 paired_t 统计量）
  secondary: oos_maxdd_delta、sharpe_after_cost_delta、turnover_delta
