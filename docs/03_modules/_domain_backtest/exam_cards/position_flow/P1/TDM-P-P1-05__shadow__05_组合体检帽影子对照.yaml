title_zh: 组合级体检·影子卡：champion 三层叠加分配器 vs 逆波 solo（体检帽的影子并行证据量）
hypothesis: >-
  组合层候选（帽子类改动）不宜直接改生产配方，先走影子并行累积证据量。在册 champion=
  three_layer_stack（0.5 等权+0.3 逆波+0.2 动量倾斜，SIG-131 钳制 ±50% 均值，RK-08 地板 ≥0），
  挑战者含 rk08_solo（纯逆波动率风险预算）。假设含“体检帽语义”的 champion（带地板+钳制）
  相对 solo 逆波在证据量上不落下风：若 mSPRT 证据显著偏向 solo，则三层叠加里的帽层是过度工程，
  应提净零合并（同真源可派生→必并）。
arm_definition:
  champion: three_layer_stack（0.5 equal + 0.3 inv_vol + 0.2 momentum tilt，SIG-131 clamp ±50%，RK-08 floor ≥0）
  challenger_1: equal_weight
  challenger_2: rk08_solo（逆波动率风险预算，简化实现）
  challenger_3: pa015_solo（体制倾斜：trend_up 放大动量 / trend_down 放大逆波，简化实现）
  challenger_4: sig131_solo（等权×±50% 钳制，简化实现）
  note: 五套同一合成信号+同一窗口（批2同窗），影子并行；件自述“简化实现（非 pf_alloc 逐行复用——
    weight 变换向量化和）”，该简化位须随卷披露，禁把它当成 pf_alloc 本体的考试
executor: D:/ZephyrAlpha/scripts/backtest/fexam/allocator_shadow.py（五套影子考正门；
  mSPRT 内核复用 zephyr.pf_core.core.msprt_champion_challenger，不可用则降级配对 t 并留痕；
  口径=MOD-PF-008“只报当前证据量不判终胜负”）
