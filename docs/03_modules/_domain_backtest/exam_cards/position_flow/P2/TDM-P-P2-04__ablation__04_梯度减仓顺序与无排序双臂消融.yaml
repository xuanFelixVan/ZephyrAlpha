  signal_table: c1_market.kline_daily_hfq（open/high/low/close 自算 ATR14，与浮盈序列）
    + c1_market.technical_indicator（目标权重面的合成秩来源，读取须 argMax/FINAL 去重）
  signal_column: atr_pct（ATR14/close）、unrealized_pnl_pct（相对 entry 的 hfq 浮盈）、ballast_flag、削减额分配
  signal_derivation: monthly_topn_signals(top_n=20) 出目标权重面 → drift_band 触发减仓总额 →
    按排序键把总额分配到票（R0=等比例，R1=浮亏升序优先，R2=ATR% 降序优先，R3=压舱石末位）
  target_source: 各臂日 NAV → strategy_exam.window_metrics（sharpe 年化 244+MaxDD）；
    5 日下行为票级面板均值聚合（复用同件，禁另造分母）
  data_window_evidence: |
    在册原文引用：config/trading_decision_map.yaml L3777-3778（X-R1-02 algo_note_zh 三键序+路由 P2-04 执行）、
    L3791-3792（D113 注释："减仓顺序=重亏仓→高波动仓→压舱石…梯度减仓参考机构软去杠杆阶梯；
    恢复=修复 50% 回撤逐级加回（机构标准 recover-50% 规则）"）、
    L6352（入边 X-R1-02→TDM-P-P2-04）；
    裁定#227（ruling_registry.yaml L1026-1030，status=active）原文摘录"…D113 熔断期减仓
    （梯度=重亏仓→高波动仓→压舱石，恢复=修复 50% 逐级加回）…"；
    docs/_working/2026-09-04-trading-decision-map-discussion.md L807（D113 条目，
    "梯度=机构软去杠杆阶梯（80%/60%/40%）…指令路由 P2-04（D44 优先级不变）"）；
    decision_algo_registry.yaml L103-109（DAL-GRADIENT-TRIM，status=design，code_ref=null）。
    价格面在册实测：c1_market.kline_daily_hfq 1990-12-19..2026-09-30 / 10,098,785 行
