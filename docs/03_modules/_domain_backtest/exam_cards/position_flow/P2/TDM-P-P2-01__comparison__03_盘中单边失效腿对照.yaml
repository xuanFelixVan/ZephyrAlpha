data_binding:
  signal_table: c1_market.kline_daily × c1_market.stk_limit（跌停/涨停家数重建）+
    data/backtest_artifacts/bt-*.json（做T 配对材料）+ c1_market.kline_daily_hfq.amplitude（振幅门底座，承同车道）
    + c1_market.limit_up_pool（仅作重建口径的交叉校验，2026-09 起）
  signal_column: kline_daily.close × stk_limit.limit_down / limit_up（按 symbol+trade_date join）；
    stk_limit 列集实含 board/st_flag/limit_pct/pre_close/valid_from/valid_to
  signal_derivation: >-
    当日跌停家数 = COUNT(close <= limit_down + 0.011)、涨停家数 = COUNT(close >= limit_up − 0.011)
    （容差 0.011 元覆盖四舍五入到分的价格步长，join 用 symbol+trade_date 双键，两表 symbol 格式实测均为裸 6 位，无需符号规范化）；
    臂触发=日级布尔，被禁日内该日全部持仓撤做T资格；
    比值臂 C 用同日 跌停/涨停家数（涨停为 0 的日单独披露，禁除零静默）。
    配对集合与净 bp 口径承 t0_conditional_e4_v3_exam（成本 31.2bp、前置率 0.30、土规 30 对）。
  target_source: 配对成本后净均 bp（bt-*.json 材料经 V3 件算得）；代理面=当日 high/low 振幅派生存价差（须单列标注为代理）
  data_window_evidence: >-
    本车道独立实测（台账 §2-P4，全部经 scripts/backtest/fexam/ch_data.py，禁裸 duckdb；执行 2026-10-10）：
    ① `SELECT toYear(trade_date) y, count(), uniqExact(symbol) FROM c1_market.stk_limit GROUP BY y ORDER BY y` →
    2015:56331/239、2016:56646/234、2017:57183/240、2018:57156/237、2019:886711/3770、2020:969361/4358、
    2021:1088470/4840、2022:1181713/5179、2023:1260985/5380、2024:1296931/5436、2025:1317121/5498、2026:1026164/5591
    ⇒ 「全市场广度面自 2019-01-04 起可用」（2015-2018 每年仅 ~240 symbols，禁用于家数阈值类读数）。
    ② 重建口径校验（关键证据，命令原文=
    `SELECT a.trade_date, countIf(a.close >= b.limit_up - 0.011), countIf(a.close <= b.limit_down + 0.011) FROM (SELECT symbol,trade_date,close FROM c1_market.kline_daily WHERE trade_date>='2026-09-01' AND trade_date<='2026-09-04') a INNER JOIN (SELECT symbol,trade_date,limit_up,limit_down FROM c1_market.stk_limit WHERE ...) b ON a.symbol=b.symbol AND a.trade_date=b.trade_date GROUP BY a.trade_date`）
    → 自算涨停 「86/55/46/42」；同期 `SELECT trade_date, count() FROM c1_market.limit_up_pool GROUP BY trade_date`
    → 池 「83/52/44/39」 ⇒ 最大差 3 家/日、相对偏差 <=3.6% ⇒ 价格面重建 validated（差值方向为自算略多，符合池有 ST/新股过滤的先验）。
    ③ 历史极值抽查 → 2024-02-05 涨停 20 / 「跌停 1526」；2024-10-08 涨停 「893」 / 跌停 12；2020-09-30 涨停 31 / 跌停 12
    （与公开行情史实相符，作定性旁证）。
    ④ 阈值档样本量实测（IS 窗 2019-01-01..2023-12-31）→ 交易日 「1214」，跌停家数 >=100 的日 「38」、>=300 的日 「7」、>=500 的日 「3」
    ⇒ B1 可判、B2/B3 预期不足（已按此写死 buckets 的样本门，不藏不凑）。
    ⑤ 板块崩塌子腿缺段实测（本车道台账 §2-P3/P3b）→
    `SELECT min(valid_from),max(valid_from),uniqExact(valid_from) FROM c1_market.sector_constituent` = 2026-07-23 / 2026-10-01 / 6；
    as-of 2022-06-30 条件查询 = 0 行 0 symbols；`industry_class` 的 valid_from 全部 2026-08-03、as-of 2021-06-30 = 0 行 0 symbols
    ⇒ 两个归属源都无历史 PIT ⇒ 板块崩塌腿 「blocked_on_data」，缺段写死=2019-01-04..2026-07-22 个股↔板块归属日频快照。
    ⑥ 材料现实（承同车道）：data/backtest_artifacts 实测 66 条目、V3 全材料 26 对 <30 土规线 ⇒ DEVICE_INCOMPATIBLE 出口预置。
  impl_ref: src/zephyr/position/core/t1_sellable.py（TDM module_ref=MOD-POS-028，做T 可售判定）
    + src/zephyr/ex_sor/services/t0_cost_model.py（T0_MIN_EDGE_RATE=0.003 成本门，承同车道常数）
