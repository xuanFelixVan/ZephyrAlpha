title_zh: 减仓与再平衡·校准卡：RLM-POSITION-011"反弹冲高减半"的择时面与 50% 经验拍定阈值落点
hypothesis: 本节点在册唯一风险限额 risk_limit_refs=[RLM-POSITION-011]（前役六向完全未取此面）： name_zh"反弹冲高减半转进攻仓"，threshold_value=50.0、unit=%、param_origin=经验拍定、
  breach_action=warn、module_id=MOD-L04-001、doc_ref=29_factor_strategy_extraction.md §S14.18， consumption_tracking"弱beta压舱石反弹冲高减半，转入主线进攻仓"。
  该限额由两个可分离的断言组成：①**择时**——"冲到高点"是可判状态，且该状态后个股走弱； ②**比例**——减半=50%（自认经验拍定）。本卡只考①：定义反弹冲高度=close/T-20..T-1 最低价 - 1， 假设其对次日收益单调负（越冲高越弱）；若单调不成立，则该限额的触发状态无预测内容
  （warn-only 限额沦为噪声源，提请重定或降级为观察项）。比例面（50%）须另立双臂卡，本卡不代拍。
window:
  in_sample:
  - '2019-01-04'
  - '2023-12-31'
  oos: &id001
  - '2024-01-01'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（流动性牛）
    bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）
  frozen_note: 看数前冻结；冲高度回看窗 20 交易日、目标=次日（t+1 close-to-close，现器 shift(-1) 面）写死； 50% 减半比例在本卡中**不作为判据**（不得用本卡结果反推比例有效），事后不得改窗（G4-5）
buckets:
  type: quantile_decile
  'on': 冲高度=close/rolling_min(low,20)-1 的截面十分位
  min_obs_per_bucket: 每桶票-日 >= 500 且覆盖 >= 30 只票
  extra_report: 把在册阈值 threshold_value=50.0% 标在分布上，报其落在第几分位 （"经验拍定"的诚实体检：若 50% 在 P95 之外，则该限额几乎不触发=零触发零消费候选）
pillars:
  response_monotonicity: 分桶中位次日收益对冲高度单调（|Spearman rho| >= 0.6；符号约定=冲高越强次日越弱， 反向同号同样计分但须在结论里写明"限额方向被证伪"）
  ic_floor: 日频 IC 均值 >= 0.02 且 IC_IR >= 0.3
  threshold_placement_gate: 50% 阈值的分位落点须与 breach_action=warn 的强度相称 （落点>P99=限额形同虚设，提请重定；落点<P50=天天报警，warn 会造成告警膨胀）
  ballast_subgroup_gate: 分层稳定性=在低波动组（ATR% 三分位下档）与高波动组分别重算， 两组符号须一致；不一致则"压舱石反弹冲高减半"的适用对象须按波动分组重写
  regime_stability: 牛/熊两段 IC 同号且均过 ic_floor
  negative_honesty: 无单调=如实判该限额择时面无信息，禁事后换回看窗救 IC（G4-5）
target:
  primary: next_day_stock_return（t+1 close-to-close）
  secondary: null
status: examined
signal_kind: panel
