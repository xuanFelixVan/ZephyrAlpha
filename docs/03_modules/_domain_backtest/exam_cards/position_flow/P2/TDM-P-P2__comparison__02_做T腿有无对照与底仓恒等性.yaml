    V3 在册实测原文摘录（docs/_working/t0_matrix/t0_conditional_e4_v3_verdict.md §2-§3）：
    主考（双门均允许）n_pairs=0；对照（禁做侧）n_pairs=26，净正 6，≥30bp 6，毛均 −5.06bp，
