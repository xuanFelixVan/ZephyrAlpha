  signal_table: c1_backtest.regime_snapshot_history（体制态，路由输入）+ c1_market.kline_index（代理指数）
  signal_column: p_r1..p_r4 argmax→四态标签（use_hmm=True 显式启用；未过考默认 SMA200）
  signal_derivation: 体制格子→state_matrix cell 查可用策略集→激活集权重(由 C1-02 分配)→组合 NAV；对照臂=全 sleeve 可用不路由
  target_source: kline_index 000300 close→next_day_return；全策略臂=基准 v0(fw-tdm-current, Sharpe 0.963)
  data_window_evidence: |-
    命令：python -c "import sys;sys.path.insert(0,'scripts/backtest');from fexam.ch_data import ch_query_df; print(ch_query_df(\"SELECT min(trade_date),max(trade_date),count() FROM c1_backtest.regime_snapshot_history\").values.tolist())"
    实测：[['2019-04-01','2026-10-09','3635']]（HMM 四态快照，IS 段 2019-04 前用 SMA200 fallback 补洞）
    代理指数：c1_market.kline_index 000300 实测 [['2005-01-04','2026-10-09','5284']]
    断言依据：library.lookup state "策略路由 state_matrix" 见台账摘录（路由体未落码=by_ref_design）；不阻卡（缺实现标 blocked_on_impl）
