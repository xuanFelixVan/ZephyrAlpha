node_id: TDM-F-C1-03
family: shadow
title_zh: 灰度切换管理·双向 weight_band 爬坡 vs 硬切影子对拍
hypothesis: >-
  策略 A→B 切换按双向 weight_band 爬坡（步长上限 step_cap 0.2/日）渐变，切换期组合净值波动
  ≤ 硬切（A 一步清零同时 B 一步满配）：渐变应削平切换日换手冲击与滑点，OOS MaxDD 不劣于硬切臂，
  切换期双边成本显著低于硬切单点冲击成本。紧急态（X-R1/RK-41）例外允许硬切。
signal_kind: series
window:
  in_sample:
  - '2018-01-02'
  - '2025-09-30'
  oos: &id001
  - '2025-10-09'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（SMA200 trend_up 段）
    bear: 2021-07-01..2024-01-31（SMA200 trend_down 段）
  frozen_note: 窗口=fexam prereg v1 冻结窗；step_cap=0.2 与 PA-015 平滑过渡判例真源=TDM-F-C1-03 节点
buckets:
  type: switch_event
  'on': 每次 A→B 切换事件（渐变臂 vs 硬切臂）
  min_obs_per_bucket: 5
pillars:
  maxdd_delta: 渐变臂切换期 MaxDD ≤ 硬切臂 +1pp
  turnover_cost_gate: 渐变臂切换双边成本 ≤ 硬切臂成本（爬坡摊薄冲击）
  sharpe_vs_baseline: 渐变臂 OOS Sharpe ≥ 硬切臂
  oos_same_sign: 渐变臂与硬切臂 OOS 收益同号
  tracking_diff_max: 影子渐变臂与实盘臂日收益差 |t|<2
pillars_numeric:
  sharpe_vs_baseline_min: 1.0
  maxdd_delta_max: 0.01
  turnover_cost_gate: 1.0
  oos_same_sign: true
  tracking_diff_max: 2.0
target:
  primary: switch_period_nav_volatility（切换期净值波动/回撤）
  secondary: switch_turnover_cost（切换期双边换手成本）
  note: 灰度切换主卡（D125）
status: preregistered
blocked_on_impl: >-
  module_ref: null（red_reason=by_ref_design）——双向 weight_band 爬坡器无落码件（SIG-131/MOD-PA-015 挂载但渐变切换编排未接线）；
  本卡需切换事件生成器+爬坡权重序列才可跑
owner_gate_required: true
owner_gate_reason: 灰度切换=策略间 production 流转，触根宪法 §5 Owner 保留面（资金与实盘交易/交易核心域 production 流转）；本车道只出卡与判据，禁执行任何晋升或切换动作
