  signal_column: close（→两 sleeve 各自信号/净值，构建渐变权重 w(t)=clamp(step_cap) 爬坡序列）
  signal_derivation: 切换事件日 d0 起 B 权重从 0 以步长≤0.2/日爬坡、A 对称退坡至稳态；对照臂=d0 硬切（A 清零/B 满配）；两臂喂 DefaultBacktestEngine 出 NAV
  target_source: 组合 NAV 切换期日收益；硬切臂=对照基线
  data_window_evidence: |-
    命令：python -c "import sys;sys.path.insert(0,'scripts/backtest');from fexam.ch_data import ch_query_df,T_KLINE_DAILY_HFQ; print(ch_query_df(f\"SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM {T_KLINE_DAILY_HFQ} WHERE trade_date>='2018-01-02' AND trade_date<='2026-09-30'\").values.tolist())"
    实测：[['2018-01-02','2026-09-30','9061473','5822']]
    负存在断言证据指针：python -m zephyr.library.lookup state "灰度切换 weight_band" → 零命中（馆查零命中≠不存在，场外区；降级手工阶梯=读 TDM-F-C1-03 节点 module_ref:null/red_reason:by_ref_design 直证切换器未落码）
