pillars:
  maxdd_delta: cluster 上限臂 OOS MaxDD ≤ 无上限臂 −2pp（扎堆拆分应减回撤）
  sharpe_vs_baseline: cluster 上限臂 OOS Sharpe ≥ 无上限臂×0.95
  stress_rho: 危机压测（ρ→0.9）敞口较常规再降，熊段 MaxDD 进一步改善
  oos_same_sign: 两臂 OOS 收益同号
pillars_numeric:
  sharpe_vs_baseline_min: 0.95
  maxdd_delta_max: 0.02
  oos_same_sign: true
target:
  primary: cluster_capped_oos_maxdd（设/不设 cluster 上限 OOS 最大回撤）
  secondary: crisis_stress_exposure_delta（危机压测敞口下降幅度）
  note: 相关性聚类主卡（MOD-POS-012 correlation_regime_monitor.py 三档相关性 regime）
