title_zh: 相关性聚类·cluster 合并风控上限 vs 独立敞口对比
hypothesis: >-
  60 日滚动 PnL 相关矩阵→层次聚类，ρ>0.70 持仓合并计算敞口（视为同一风险）、ρ>0.85 禁新仓、
  单 cluster 总权重≤5% 权益，相对不设相关性上限的组合，OOS MaxDD 下降（扎堆被拆），
  危机期相关性趋于 1 时压测版（ρ→0.9）应进一步降敞口；牛段可能小幅牺牲收益（Sharpe 损失有限）。
