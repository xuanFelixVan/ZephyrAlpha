  - '2018-01-02'
  - '2025-09-30'
  oos: &id001
  - '2025-10-09'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（SMA200 trend_up 段）
    bear: 2021-07-01..2024-01-31（SMA200 trend_down 段）
