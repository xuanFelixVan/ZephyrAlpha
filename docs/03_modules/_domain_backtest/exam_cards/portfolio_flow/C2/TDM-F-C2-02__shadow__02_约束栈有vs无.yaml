  min_obs_per_bucket: 60
pillars:
  maxdd_delta: 过栈臂 OOS MaxDD ≤ 裸聚合臂 −2pp（约束削尾部，应改善）
  sharpe_vs_baseline: 过栈臂 OOS Sharpe ≥ 裸聚合臂×0.95
  turnover_cost_gate: 约束触发调仓双边成本 < 回撤改善收益的 50%
  oos_same_sign: 过栈臂与裸聚合臂 OOS 收益同号
  tracking_diff_max: 影子臂与实盘臂日收益差 |t|<2
pillars_numeric:
  sharpe_vs_baseline_min: 0.95
  maxdd_delta_max: 0.02
  turnover_cost_gate: 0.5
  oos_same_sign: true
  tracking_diff_max: 2.0
