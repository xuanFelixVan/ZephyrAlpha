title_zh: 组合约束栈·六层顺序过栈 vs 无约束影子对拍
hypothesis: >-
  组合净头寸顺序过六层约束栈（总仓位上限→回撤限额分级压缩→波动率目标→集中度单票 20%→流动性 3 日可退出→相关性 cluster 5%）
  相对不过栈裸聚合，OOS MaxDD 显著下降且 OOS Sharpe 不劣化；约束栈应主要削尾部（回撤限额最优先，硬约束容忍暂破期望目标）。
  过哪层裁哪层，按非策略仓优先裁。
