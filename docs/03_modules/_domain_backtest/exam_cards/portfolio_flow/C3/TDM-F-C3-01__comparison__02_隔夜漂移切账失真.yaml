schema_version: '1.0'
card_id: TDM-F-C3-01/comparison/02_隔夜漂移切账失真
node_id: TDM-F-C3-01
family: comparison
title_zh: 多维归因·T+1 隔夜漂移切账 vs 不切账对升降级失真
hypothesis: >-
  纸面组合从 decision price（信号日收盘）起算策略 alpha、隔夜漂移（信号日收盘→次日开盘）单列 delay cost
  不进 PerfScore 不进执行考核（切账臂），相对 decision price=fill price 混算（不切账臂），
  各 sleeve 的 alpha 估计与真实可捕获收益更一致——不切账会把隔夜漂移错算进策略能力，使升降级评审系统性失真。
  判据=切账后 sleeve 归因排名与"纯信号日收盘建仓"真值排名的秩相关显著高于不切账臂。
signal_kind: panel
window:
  in_sample:
  - '2018-01-02'
  - '2025-09-30'
  oos: &id001
  - '2025-10-09'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（SMA200 trend_up 段）
    bear: 2021-07-01..2024-01-31（SMA200 trend_down 段）
  frozen_note: 隔夜漂移切账/D84 正确性必改口径真源=TDM-F-C3-01 节点注释；收益基准双轨(TWR+Modified Dietz)同卡记；窗口=fexam prereg v1 冻结窗
buckets:
  type: sleeve_attribution
  'on': 8 sleeve（8 板块几何 Brinson）× 切账/不切账两臂
  min_obs_per_bucket: 60
pillars:
  tracking_diff_max: 切账臂 sleeve alpha 真值秩相关 ≥0.7；不切账臂秩相关差 ≥0.15（失真被证）
  oos_same_sign: 两臂 sleeve OOS 归因合计同号
  brinson_consistency: 几何 Brinson 三因子(配置+选股+交互)total_attribution 加和一致(is_consistent)
pillars_numeric:
  tracking_diff_max: 0.30
  oos_same_sign: true
  brinson_consistency: true
target:
  primary: sleeve_alpha_rank_agreement（切账后 sleeve alpha 排名与真值秩相关）
  secondary: overnight_delay_cost_share（隔夜漂移占未切账归因比例）
  note: 多维归因主卡（MOD-PF-007 PerformanceAttributionEngine 已落码，Brinson 三因子+降级/拥挤检测）
status: preregistered
