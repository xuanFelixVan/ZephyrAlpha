data_binding:
  engine_entry: src/zephyr/pf_core/core/performance_attribution_engine.py::PerformanceAttributionEngine（BrinsonResult/total_attribution/is_consistent）
  signal_table: c1_market.kline_daily_hfq（close=decision price 起算 alpha；open(t+1)=fill price→隔夜漂移=open(t+1)/close(t)-1 单列 delay cost）
  signal_column: close, open（分账：策略 alpha 从 close 起、delay cost=close→次日 open）
  signal_derivation: sleeve 逐笔 decision price→fill price 映射，切账臂剔除隔夜漂移、不切账臂混算；Brinson 三因子分解对照
  target_source: sleeve 归因 alpha 序列；真值=纯信号日收盘建仓理想组合
  data_window_evidence: |-
    命令：python -c "import sys;sys.path.insert(0,'scripts/backtest');from fexam.ch_data import ch_query_df,T_KLINE_DAILY_HFQ; print(ch_query_df(f\"SELECT min(trade_date),max(trade_date),count(),uniqExact(symbol) FROM {T_KLINE_DAILY_HFQ} WHERE trade_date>='2018-01-02' AND trade_date<='2026-09-30'\").values.tolist())"
    实测：[['2018-01-02','2026-09-30','9061473','5822']]（close+open 面板齐，隔夜漂移可切账）；MOD-PF-007 文件存在（ls 确认）
