title_zh: 绩效归因反馈·自我进化闭环开环 vs 归因不回流（不倾斜）对比
hypothesis: >-
  归因反馈闭环（多维归因→升降级评审→权重调权→参数校准→传感器可靠度反馈 L1，赚的加码亏的减码凭数据）
  全开相对归因只出报告不回流权重（关环），OOS Sharpe 提升且长期 MaxDD 收敛——
  系统自我进化发动机的净贡献应为正；关环臂即静态基准 v0。
