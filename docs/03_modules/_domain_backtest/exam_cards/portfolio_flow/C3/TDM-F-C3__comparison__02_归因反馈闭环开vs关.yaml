  maxdd_delta: 开环臂长期 OOS MaxDD ≤ 关环臂
  turnover_cost_gate: 反馈调权换手成本 < 归因带来的改善（否则反馈失效退化）
  oos_same_sign: 开环臂与关环臂 OOS 收益同号
pillars_numeric:
  sharpe_vs_baseline_min: 1.0
  maxdd_delta_max: 0.0
  turnover_cost_gate: 0.5
  oos_same_sign: true
target:
  primary: closed_loop_oos_sharpe（归因反馈闭环组合 OOS Sharpe）
  secondary: loop_turnover_net_gain（扣反馈调权成本后净增益）
  note: 绩效归因反馈父卡（系统自我进化闭环总检验；子路见 C3-01/02/03/04/05 各卡）
