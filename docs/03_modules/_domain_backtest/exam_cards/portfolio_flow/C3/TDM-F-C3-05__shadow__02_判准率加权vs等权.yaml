schema_version: '1.0'
card_id: TDM-F-C3-05/shadow/02_判准率加权vs等权
node_id: TDM-F-C3-05
family: shadow
title_zh: 可靠度养成·传感器判准率加权 vs 等权起步影子对拍
hypothesis: >-
  传感器/大盘判定器可靠度从"起步等权"（实证：简单平均 50 年最稳）升级到"月度判准率加权"（下限 10% 防 winner 通吃），
  加权臂的下游组合 OOS Sharpe ≥ 等权臂且滚动 IC 衰减>50% 报警能提前降权失效传感器；
  若加权臂不优于等权臂，则维持等权起步（Fed 实证先验）——本卡正面检验"判准率加权是否消灭等权假设"。
signal_kind: panel
window:
  in_sample:
  - '2018-01-02'
  - '2025-09-30'
  oos: &id001
  - '2025-10-09'
  - '2026-09-30'
  regimes:
    bull: 2019-01-04..2021-06-30（SMA200 trend_up 段）
    bear: 2021-07-01..2024-01-31（SMA200 trend_down 段）
  frozen_note: 三档递进（等权→判准率加权下限 10%→粒子滤波远期）真源=TDM-F-C3-05 节点；月度更新禁日级追归因调权权重（D93 修订 D82）
buckets:
  type: sensor_reliability
  'on': 传感器×滚动判准率档（高/中/低）× 加权臂/等权臂
  min_obs_per_bucket: 60
pillars:
  sharpe_vs_baseline: 判准率加权臂 OOS Sharpe ≥ 等权臂（否则维持等权先验）
  ic_decay_alarm: 滚动 IC 半衰期 hyperbolic 拟合，衰减>50% 报警命中率≥80%（提前降权失效传感器）
  floor_10pct: 单传感器权重下限 10% 生效（禁 winner 通吃）
  oos_same_sign: 加权臂与等权臂 OOS 收益同号
pillars_numeric:
  sharpe_vs_baseline_min: 1.0
  ic_decay_alarm_min: 0.8
  oos_same_sign: true
target:
  primary: reliability_weighted_portfolio_oos_sharpe（判准率加权组合 OOS Sharpe）
  secondary: ic_halflife_fit_quality（IC 半衰期拟合与衰减报警精度）
  note: 可靠度养成主卡（MOD-SIGQC-004 signal_degradation_monitor；反馈 E-L1-AGG 降权不可靠传感器，大盘判定器自己也要被考核）
status: preregistered
