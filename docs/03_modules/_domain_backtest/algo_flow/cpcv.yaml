    # A2: compute_pbo(每split取IS最优trial→其OOS相对秩ω=rank/(M+1)→logit(ω)→PBO=P(logit<0))
    # O1: list[CPCVSplit] / PBO报告dict(pbo/logits/omega)
    # [/ALGO_FLOW]
