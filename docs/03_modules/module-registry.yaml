# ============================================================================
# ZephyrAlpha 模块登记表 — 唯一真源（Module Registry SSoT）
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-01 | owner: ZephyrAlpha-Owner
#
# 对标: ITIL SACM CMDB（每个 CI 一条记录） + Google Monorepo OWNERS/BUILD（项目根）
#
# 用途: 登记 ZephyrAlpha 全部 14 层模块的完整生命周期
#       （蓝图（含施工指引）→ 交付记录），一条记录跟到底。
#
# AI 使用方式:
#   1. 先读 _schema → 了解合法字段和枚举值
#   2. 再查 modules → 按 layer / domain / status 过滤
#   3. 定位到具体 module → 读对应目录下的 blueprint.md（§1-§11 架构设计 + §12 施工指引）
#
# 自动校验: pre-commit 脚本扫描 03_modules/ 下实际目录，与登记表比对
# ============================================================================

_schema:
  description: "模块登记表的字段定义和受控词表（零歧义，AI 可直接使用）"

  # ---- 层级定义（14 层）----
  layers:
    - id: "L00"
      name: "data_source"
      dir: "l00_data_source"
      description: "数据接入层——行情/基本面/另类数据拉取、清洗、标准化"
    - id: "L01"
      name: "infrastructure"
      dir: "l01_infrastructure"
      description: "基础设施层——消息队列、缓存、数据库、存储"
    - id: "L02"
      name: "alpha_factor"
      dir: "l02_alpha_factor"
      description: "因子层——因子定义、计算、注册、评估"
    - id: "L03"
      name: "signal_generation"
      dir: "l03_signal_generation"
      description: "信号生成层——因子合成、信号加权、时间对齐"
    - id: "L04"
      name: "risk_management"
      dir: "l04_risk_management"
      description: "风控层——组合风险、头寸限制、压力测试"
    - id: "L05"
      name: "portfolio_construction"
      dir: "l05_portfolio_construction"
      description: "组合构建层——优化器、约束引擎、再平衡"
    - id: "L06"
      name: "trade_execution"
      dir: "l06_trade_execution"
      description: "交易执行层——订单路由、算法执行、滑点控制"
    - id: "L07"
      name: "post_trade_analytics"
      dir: "l07_post_trade_analytics"
      description: "归因分析层——绩效归因、交易成本分析、报告"
    - id: "L08"
      name: "human_ai_interface"
      dir: "l08_human_ai_interface"
      description: "人机界面层——前端、API、可视化、Dashboard"
    - id: "L09"
      name: "research_innovation"
      dir: "l09_research_innovation"
      description: "研究创新层——回测引擎、策略研究、模拟交易"
    - id: "L10"
      name: "compliance"
      dir: "l10_compliance"
      description: "合规层——合规检查、监管报告、审计追踪"
    - id: "L11"
      name: "ml_platform"
      dir: "l11_ml_platform"
      description: "ML 平台层——模型注册、训练管线、推理服务、Scout Agent"
    - id: "L12"
      name: "system_telemetry"
      dir: "l12_system_telemetry"
      description: "可观测层——日志、指标、追踪、告警"
    - id: "L13"
      name: "experimentation"
      dir: "l13_experimentation"
      description: "实验层——A/B 测试、特性开关、沙箱环境"

  # ---- 功能域定义（跨层分组）----
  functional_domains:
    - id: "market_data"
      name: "行情数据"
      layers: ["L00", "L12"]
    - id: "fundamental_data"
      name: "基本面数据"
      layers: ["L00"]
    - id: "alpha_research"
      name: "因子研究"
      layers: ["L02", "L03", "L09"]
    - id: "risk_control"
      name: "风控"
      layers: ["L04", "L10"]
    - id: "portfolio_mgmt"
      name: "组合管理"
      layers: ["L05", "L07"]
    - id: "execution"
      name: "交易执行"
      layers: ["L06"]
    - id: "ui_ux"
      name: "用户界面"
      layers: ["L08"]
    - id: "ml_ops"
      name: "ML 运维"
      layers: ["L11", "L13"]
    - id: "infra"
      name: "基础设施"
      layers: ["L01"]
    - id: "observability"
      name: "可观测性"
      layers: ["L12"]
    - id: "compliance_gov"
      name: "合规治理"
      layers: ["L10"]

  # ---- 状态受控词表 ----
  status_values:
    blueprint:
      - drafting       # 起草中
      - review         # 审核中
      - approved       # 已通过（进入施工阶段）
      - revision       # 修订中
      - retired        # 已退役
    delivery:
      - pending        # 待交付
      - delivered      # 已交付
      - verified       # 已验证

  # ---- 优先级 ----
  priority_values:
    - P0              # 核心路径，立即需要
    - P1              # 高优先级，Phase 1 内完成
    - P2              # 中优先级，Phase 2 内完成
    - P3              # 低优先级，按需完成

  # ---- 依赖类型 ----
  dependency_types:
    - runtime          # 运行时依赖（模块启动必须对方存在）
    - data             # 数据依赖（消费对方产出的数据）
    - build            # 构建时依赖（构建/测试需要对方存在）
    - contract         # 接口契约依赖（实现对方的接口）

# ============================================================================
# 模块登记（按 module_id 排序）
# ============================================================================
# 字段说明:
#   module_id         唯一标识符，格式 MOD-{LAYER}-{NNN}（例 MOD-DS-001）
#   name              模块名（全小写 kebab-case，与目录名一致）
#   layer             所属层级 ID（L00-L13）
#   functional_domain 所属功能域（见 _schema.functional_domains）
#   path              相对路径（从 docs/ 根），指向模块目录
#   blueprint         { status, file, version, author, created }
#   delivery          { latest_version, history[] }
#   dependencies[]    { module_id, type }
#   priority          优先级（P0-P3）
#   tags[]            自由标签
# ============================================================================

