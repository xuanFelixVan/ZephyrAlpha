items:
  - { id: 1, text: "点画布节点（如 TDM-E-L1-S1 大盘指数传感器）右侧抽屉弹出，再点空白/其他节点正常切换", check: 目检 }
  - { id: 2, text: "标题徽标三态与画布卡片同语义同色号：TDM-E-L1-S1 无 module_ref → 橙虚「🔴 红节点 · 设计态」", check: 目检 }
  - { id: 3, text: "「问」分区显示 decision_question（指数趋势/位置如何（数据面））；「机制」显示 algo_note_zh 大白话机制全文（MA20/MA60 排列规则）", check: 目检 }
  - { id: 4, text: "治理四键网格（激活/档位/失效/兜底）空值显式「—」留位不塌行（S1 四键全空=验收基准）", check: 目检 }
  - { id: 5, text: "模块锚空态「—」、策略挂载空态「—」显式留位", check: 目检 }
  - { id: 6, text: "依据锚 chip 流显示「DS-150 日 K 线」（编号+中文名，hover title 全称）", check: 目检 }
  - { id: 7, text: "上游 1 / 下游 2 导航行渲染（状态点+名称+边型 glyph+id），点击跳选联动抽屉切换到目标节点", check: 目检 }
  - { id: 8, text: "设计备注 5 条可读（悬空前导注释 4 条+块内 D109 终裁 1 条；注释提取规则=块内归本节点、悬空前导归下一节点）", check: 目检 }
  - { id: 9, text: "30s 轮询重绘保持阅读位置（scrollTop 保持，不冲掉阅读进度）", check: 目检 }
  - { id: 10, text: "「验证档案（回测台账）」分区渲染（追加在设计备注后）：空表=灰色「未验证」徽章+排序说明；有记录=当前 verdict 徽章+历次记录（窗口/触发次数/命中占比/显著性土规/map@commit）；CH 断连=「台账不可达」不冒充未验证；异步填充后阅读位置保持；TDM-E-L1-S1（空表态）为验收基准", check: 目检 }
  - { id: 11, text: "「算法锚（算法/模型）」分区渲染（追加在模块锚后）：algo_refs/model_refs 逐枚 chip 带 DAL=决策算法/IND=技术指标/EXA=执行算法/ML=模型 前缀类型徽（中文名就绪自动显示，未就绪显示 id）；空态=「未登记算法锚」灰字不隐藏分区；底部「代码锚」行：module_ref 有值=文件名可点击（点击复制路径+title 全路径），无值=「未落码」灰字", check: 目检 }

