    # 层: 步骤
    # - id: P1
    #   name: 路由分发（路径 → handler；写路由=白名单少数：promotion-decide/schedulegate-confirm 等）
    #   code: @app.post handler
    # - id: P2
    #   name: 数据装配（注册表/CH/PG/运行时日志只读真源；执行器经模块内 lazy import）
    #   code: _load_* / dispatcher / promotion_advisory
    # - id: P3
    #   name: 降级纪律（执行器缺位/异常 → 200 + ok:false + 空态或拒因，不 500 硬崩）
    #   code: except -> ok:false
    # 层: 算法
    # - id: A1
    #   name: 拍板写路由守门（schedulegate-confirm：order/decision 校验→事件账落账→幂等拒）
    #   code: dispatcher.confirm_skeleton
    # 层: 输出
    # - id: O1
    #   name: JSON 信封 {ok, count?, data, error?}（页契约形状；schedulegate=data.orders）
    #   code: -> dict[str, Any]
    # 边:
    # I1 --> P1
    # P1 --> A1
    # P1 --> P2
    # P2 --> P3
    # P2 --> O1
    # P3 --> O1
    # A1 --> O1
    # [/ALGO_FLOW]
