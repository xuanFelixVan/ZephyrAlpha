## 治理资产总清单 (Governance Asset Inventory)
##
## 用途: 管理所有管理系统的系统。
##       当任何 AI 说"我记得有个 XX 系统"时，先查此文件。
##       如果清单里没有，则说明它不存在（或已被清理），应该通过 git log 查找历史。
##
## 规则: 新建任何治理工具/标准/脚本前，必须先在此清单登记；
##        废弃时在此标记 status: deprecated 并记录 reason。
##
## Owner: Project Owner
## 对标: Citadel Governance Register / Two Sigma Infrastructure Catalog

schema_version: "1.0"
created_date: "2026-04-16"
last_updated: "2026-04-16"

