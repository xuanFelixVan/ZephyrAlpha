# ============================================================
# 六、AI 入职体系 (AI Onboarding System) — 跨会话连续性
# ============================================================
ai_onboarding:
  description: "分层 AI 入职体系（Phase 1 升级后）——通过分层规则加载解决上下文膨胀"
  upgrade_date: "2026-04-16"
  context_saving: "Layer 0 仅 ~200 行（原来 ~1200 行，节省 ~83%），其余按需触发"

  cursor_rules_layers:
    description: "Cursor 分层规则加载系统（Phase 1 新建）"
    layer_0_always:
      description: "永远加载层（<200 行）——不知道会出事的内容"
      files:
        - path: .cursor/rules/core-governance.mdc
          provides: "项目身份、20系统路由表、绝对禁止行为、零残留原则、注册表同步规则"
          status: active
          created: "2026-04-16"
        - path: .cursor/rules/project-conventions.mdc
          provides: "方案输出规范、Handoff Protocol、双编辑器防护（精简版）、Git规范"
          status: active

    layer_1_glob_triggered:
      description: "文件类型触发层——编辑对应文件时自动加载"
      files:
        - path: .cursor/rules/doc-governance.mdc
          globs: "docs/**/*.md"
          provides: "路径锁定表、File Movement Protocol、Change Propagation Map、Write Gate"
          status: active
          created: "2026-04-16"
        - path: .cursor/rules/audit-system.mdc
          globs: "scripts/**/*.py, .github/workflows/*.yml"
          provides: "审计系统规则、脚本修改禁令、死循环防护、准入门禁6步手续链"
          status: active
        - path: .cursor/rules/code-conventions.mdc
          globs: "src/**/*.py"
          provides: "施工规范、AI代码标准、测试要求、Commit格式"
          status: active
        - path: .cursor/rules/config-safety.mdc
          globs: "config/**/*.yaml, .env*"
          provides: "风控配置锁定、编码安全（config专属）、单一配置源"
          status: active
          created: "2026-04-16"

    layer_2_description_triggered:
      description: "按需触发层——AI 根据任务性质自主判断"
      files:
        - path: .cursor/rules/encoding-safety.mdc
          description: "双编辑器编码损坏的根因分析、检测和修复流程"
          status: active
          created: "2026-04-16"

  session_startup_sequence:
    description: "每次 AI session 的标准启动顺序"
    steps:
      - "1. 读 docs/01_GOVERNANCE/governance-asset-inventory.yaml（本文件）—— 了解全局20系统"
      - "2. 读 docs/04_CONSTRUCTION/PLANS/MASTER_DEVELOPMENT_PLAN.md —— 当前 Phase + 任务"
      - "3. 报告：当前 Phase X，下一任务是 Y"
      - "4. 确认：用户指令是否属于当前 Phase 范围"

  p0_reads_by_task:
    description: "P0 必读文档——按任务类型触发"
    items:
      - trigger: "要创建任何文件/目录"
        read: docs/subsystem-registry.yaml
      - trigger: "要创建新治理工具"
        read: docs/02_ARCHITECTURE/executable-asset-registry.md
      - trigger: "要运行审计"
        read: docs/09_AUDIT/PROCEDURES/audit-execution-procedures.md
      - trigger: "涉及模块开发"
        read: docs/02_ARCHITECTURE/MODULE_INVENTORY.md
      - trigger: "引入新技术"
        read: docs/02_ARCHITECTURE/TECH_DECISION_RECORDS.md

  missing_components:
    description: "当前缺失的 AI 入职体系组件（待建设）"
    items:
      - id: FILE_PROVENANCE_SYSTEM
        description: "文件搬迁感知系统——AI 搬迁前查询文件搬迁历史"
        status: partially_active
        rule_path: ".cursor/rules/project-conventions.mdc （File Movement Protocol 章节，已写入 2026-04-16）"
        script_path: "scripts/governance/trace_file_provenance.py"
        script_usage: "python scripts/governance/trace_file_provenance.py <相对路径> [--rename-only]"
        priority: P1

      - id: SESSION_ARTIFACT_PATTERN
        description: "会话产出物规范——Session Log 标准格式 + 固定存放位置"
        status: active
        standard_path: "docs/01_GOVERNANCE/STANDARDS/session-artifact-pattern-standard.md"
        log_dir: "docs/09_AUDIT/STATE/SESSION_LOGS/"
        template_path: "docs/09_AUDIT/FORM_STANDARDS/session-log-template.md"
        ttl_days: 30
        priority: P1
        created_date: "2026-04-16"

