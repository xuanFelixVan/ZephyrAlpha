## 治理资产总清单 (Governance Asset Inventory)
##
## ★★★ 强制同步规则（最高优先级）★★★
##   新建任何文件 → 必须在同一 commit 中更新本文件
##   删除任何文件 → 必须在同一 commit 中从本文件移除对应条目
##   修改文件路径 → 必须在同一 commit 中更新本文件中的 path
##   每个 AI session 第一件事 → 读本文件了解全局（20 大系统 + 所有资产）
##
## 用途: 实时全景注册表——AI 任何时候读此文件，即可一次性了解：
##       • 20 个治理系统的名称、位置、功能
##       • 所有脚本（audit/ci_audit/governance/hooks）的职责
##       • 所有 CI 工作流的触发条件
##       • 所有配置文件的用途
##       • 当任何 AI 说"我记得有个 XX 系统"时，先查此文件
##       • 如果清单里没有，则说明它不存在，应通过 git log 查找历史
##
## 准入门禁: 新建任何治理工具/标准/脚本必须先在此登记（status: proposed）
##           走完 6 步准入手续链后升级为 status: active
##           未登记直接创建 = 违规 → 审计扫描时直接删除
##           废弃时标记 status: deprecated 并记录 reason
##
## Owner: Project Owner
## 对标: Citadel Governance Register / Two Sigma Infrastructure Catalog

