# 文档治理综合审计检查清单
# Document Governance Comprehensive Audit Checklist
# 
# 用途: 为新模型系统(AI Agent)提供标准化的全量审计检查清单
# 格式: YAML (机器可读)
# 版本: 2.0.0
# 更新日期: 2026-04-13

audit_spec:
  version: "2.0.0"
  description: "专业量化机构文档治理全量审计标准检查清单"
  applicable_scope: "全系统文档生命周期"
  compliance_level: "强制标准"
  last_updated: "2026-04-13"
  
  # 元数据检查配置
  metadata:
    required_fields:
      - module_id
      - layer
      - version
      - status
      - responsibility
    layer_format: "^layer_(0[0-9]|10|11)$"  # layer_00 到 layer_11
    version_format: "^\\d+\\.\\d+\\.\\d+$"     # x.y.z
    valid_statuses:
      - Active
      - Draft
      - Archived
      - Deprecated

  # 目录结构检查配置
  directory_structure:
    max_depth: 6
    required_index_files:
      - INDEX.md
    layer_mapping:
      01_FRAMEWORK: layer_01
      02_FACTOR_LIBRARY: layer_02
      03_TRADING_TACTICS: layer_03
      04_EXECUTION: layer_04
      05_IMPLEMENTATION: layer_05
      06_ARCHIVE: layer_06
      07_RESEARCH: layer_07
      08_HUMAN_AI_INTERFACE: layer_08
      09_AUDIT: layer_09
      10_GOVERNANCE_COMPLIANCE: layer_10
      11_STRATEGIC_DECISION: layer_11
    prohibited_patterns:
      - "temp"
      - "tmp"
      - "backup"
      - "old"
      - "test"
      - "__pycache__"

# 检查项定义
checks:
  # ============================================================
  # P0 级别检查 - 阻止提交的关键缺陷
  # ============================================================
  
  - id: "C-01"
    name: "双YAML Frontmatter检测"
    description: "检测文件是否包含多个YAML frontmatter块"
    severity: "P0"
    category: "结构完整性"
    blocking: true
    threshold: 0
    script: "doc_guard_pre_commit.py --scan-double-yaml"
    success_criteria: "双YAML文件数 = 0"
    failure_action: "阻止提交，使用 fix_double_yaml_merge.py 修复"
    
  - id: "C-02"
    name: "无效内链检测"
    description: "检测Markdown内链目标文件是否存在"
    severity: "P0"
    category: "链接完整性"
    blocking: true
    threshold: 0
    script: "ci_cd_link_checker.py"
    success_criteria: "无效链接数 = 0"
    failure_action: "阻止合并，使用 batch_fix_invalid_links_v2.py 修复"
    
  - id: "C-03"
    name: "重复Module ID检测"
    description: "检测module_id是否全局唯一"
    severity: "P0"
    category: "标识唯一性"
    blocking: true
    threshold: 0
    script: "doc_guard_pre_commit.py --scan-module-id"
    success_criteria: "重复ID组数 = 0"
    failure_action: "阻止提交，使用 dedupe_module_id_frontmatter.py 修复"
    
  - id: "C-04"
    name: "编码损坏检测"
    description: "检测文件是否存在乱码字符"
    severity: "P0"
    category: "编码质量"
    blocking: true
    threshold: 0
    script: "doc_guard_pre_commit.py --scan-encoding"
    success_criteria: "乱码字符数 = 0"
    failure_action: "阻止提交，需人工重写修复"
    
  - id: "C-05"
    name: "必需元数据字段检测"
    description: "检测frontmatter是否包含所有必需字段"
    severity: "P0"
    category: "元数据完整性"
    blocking: true
    threshold: 0
    script: "check_required_metadata.py"  # 待创建
    success_criteria: "所有文件包含必需字段"
    failure_action: "阻止提交，使用 backfill_metadata_fields.py 修复"
    
  - id: "D-07"
    name: "目录命名规范检测"
    description: "检测目录命名是否符合规范（外部审计安全评估后新增）"
    severity: "P0"
    category: "目录规范"
    blocking: true
    threshold: 0
    script: "check_directory_naming.py"
    success_criteria: "目录命名违规数 = 0"
    failure_action: "阻止提交，重命名目录"
    naming_rules:
      layer_dirs: "^\\d{2}_[A-Z_]+$"      # 如 01_FRAMEWORK
      archive_dirs: "^\\d{2}_ARCHIVE$"     # 如 06_ARCHIVE
      sub_dirs: "^[a-z0-9_]+|[A-Z0-9_]+$"  # 小写或全大写
    prohibited_keywords:
      - "temp"
      - "tmp"
      - "backup"
      - "old"
      - "test"
      - "new"
    max_depth: 6
    
  # ============================================================
  # P1 级别检查 - 影响质量的重要问题
  # ============================================================
  
  - id: "C-10"
    name: "文件命名规范检测"
    description: "检测文件名是否符合命名规范"
    severity: "P1"
    category: "命名规范"
    blocking: false
    threshold: 5  # 允许5个以内不规范文件
    script: "check_naming_compliance.py"  # 待创建
    success_criteria: "不规范文件数 ≤ 5"
    failure_action: "警告，建议重命名"
    naming_rules:
      markdown: "^[a-z0-9_-]+\\.md$"  # 小写+下划线+连字符
      directory: "^(\\d{2}_[A-Z_]+|\\d{2}_ARCHIVE|\\d{2}_KNOWLEDGE)$"
      exceptions:
        - "README.md"
        - "INDEX.md"
        - "SITEMAP.md"
        - "LICENSE"
        - "CONTRIBUTING.md"
        - "SECURITY.md"
        
  - id: "C-11"
    name: "Layer字段一致性检测"
    description: "检测文档layer字段与所在目录是否一致"
    severity: "P1"
    category: "分层一致性"
    blocking: false
    threshold: 0
    script: "check_layer_consistency.py"  # 待创建
    success_criteria: "不一致文件数 = 0"
    failure_action: "警告，更新layer字段"
    
  - id: "C-12"
    name: "目录深度检测"
    description: "检测目录嵌套深度是否超过阈值"
    severity: "P1"
    category: "结构规范"
    blocking: false
    threshold: 0
    max_depth: 6
    script: "check_directory_depth.py"  # 待创建
    success_criteria: "超深目录数 = 0"
    failure_action: "警告，建议重构目录结构"
    
  - id: "C-13"
    name: "INDEX.md完整性检测"
    description: "检测每个目录是否都有INDEX.md文件"
    severity: "P1"
    category: "索引完整性"
    blocking: false
    threshold: 0
    script: "check_index_completeness.py"  # 待创建
    success_criteria: "缺失INDEX目录数 = 0"
    failure_action: "警告，自动生成INDEX.md"
    
  - id: "C-14"
    name: "SITEMAP同步检测"
    description: "检测新目录是否在SITEMAP.md中有映射"
    severity: "P1"
    category: "目录映射"
    blocking: false
    threshold: 0
    script: "doc_guard_pre_commit.py --scan-sitemap"
    success_criteria: "未映射目录数 = 0"
    failure_action: "警告，更新SITEMAP.md"
    
  # ============================================================
  # P2 级别检查 - 建议性改进
  # ============================================================
  
  - id: "C-20"
    name: "版本号一致性检测"
    description: "检测文档版本号是否符合语义化版本规范"
    severity: "P2"
    category: "版本管理"
    blocking: false
    threshold: 10
    script: "check_version_consistency.py"
    success_criteria: "不规范版本号数 ≤ 10"
    failure_action: "建议更新版本号"
    
  - id: "C-21"
    name: "死链接检测（外部）"
    description: "检测外部链接是否可访问"
    severity: "P2"
    category: "链接质量"
    blocking: false
    threshold: 20
    script: "check_external_links.py"  # 待创建
    success_criteria: "死外部链接数 ≤ 20"
    failure_action: "建议更新或移除链接"
    
  - id: "C-22"
    name: "文档长度检测"
    description: "检测超长文档（可能需要拆分）"
    severity: "P2"
    category: "内容质量"
    blocking: false
    threshold: 50
    max_lines: 3000
    script: "check_document_length.py"  # 待创建
    success_criteria: "超长文档数 ≤ 50"
    failure_action: "建议拆分为多个文档"
    
  - id: "C-23"
    name: "图片链接有效性"
    description: "检测图片链接是否有效"
    severity: "P2"
    category: "媒体完整性"
    blocking: false
    threshold: 10
    script: "check_image_links.py"  # 待创建
    success_criteria: "无效图片链接数 ≤ 10"
    failure_action: "建议修复或移除图片链接"

# 检查执行配置
execution:
  # 并行执行的检查组
  parallel_groups:
    - name: "结构检查"
      checks: ["C-01", "C-04", "C-12", "C-13"]
    - name: "链接检查"
      checks: ["C-02", "C-21", "C-23"]
    - name: "元数据检查"
      checks: ["C-03", "C-05", "C-10", "C-11", "C-20"]
      
  # 执行顺序
  sequence:
    - "C-01"  # 先检查结构
    - "C-04"
    - "C-02"  # 再检查链接
    - "C-03"  # 再检查唯一性
    - "C-05"
    - "C-10"  # 最后检查规范
    - "C-11"
    - "C-12"
    - "C-13"
    - "C-14"

# 报告配置
reporting:
  formats:
    - json
    - markdown
    - html
  output_dir: "docs/05_IMPLEMENTATION/04_OPERATIONS/audit_state"
  filename_template: "COMPREHENSIVE_AUDIT_{timestamp}"
  
  # 报告内容配置
  include:
    - summary
    - detailed_findings
    - fix_suggestions
    - statistics
    - trend_analysis
    
  # 阈值配置
  thresholds:
    excellent: 98  # 98%以上为优秀
    good: 95       # 95%以上为良好
    acceptable: 90 # 90%以上为可接受
    poor: 80       # 80%以下需立即整改

# 集成配置
integration:
  pre_commit:
    enabled: true
    checks: ["C-01", "C-03", "C-04", "C-05"]
    
  ci_cd:
    enabled: true
    checks: ["C-01", "C-02", "C-03", "C-04", "C-05", "C-10", "C-11"]
    
  periodic:
    enabled: true
    frequency: "weekly"
    checks: "all"
