module_id: GOV-AI-007
doc_type: schema
title: "Session Log 标准 Schema"
status: active
version: "2.1.0"
date: "2026-05-03"
owner: ZephyrAlpha-Owner
language: zh
created_by: human_plus_agent
ttl: permanent
summary: "定义每次 AI session 结束时必须写入的 Session Log 的字段 schema、存放路径和命名规范。v2.1.0：从 governance/ai/ 迁移至 _registry/schemas/。"
rule_form: data
supersedes:
  - path: "governance/ai/session-log-schema.yaml"
