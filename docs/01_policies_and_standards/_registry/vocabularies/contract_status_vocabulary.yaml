# contract_status 受控词表
# ZephyrAlpha 2.0 接口契约生命周期状态唯一真源
# 维护者：ZephyrAlpha-Owner
# 版本：1.0.0
# 创建日期：2026-06-26
#
# 本词表定义接口契约（interface contract）status 字段的所有合法值（3 种）。
# validate_interface_contracts.py 必须从本词表动态加载，
# 禁止硬编码 {"draft","frozen","deprecated"} 字面量。
#
# 注意：契约状态与文档状态（status_vocabulary.yaml）是不同词表：
#   - 文档 status: draft/active/deprecated（文档生命周期）
#   - 契约 status: draft/frozen/deprecated（合约生命周期，frozen=锁定不可变）
# "frozen" 语义不同于 "active"——frozen 表示合约已冻结锁定，消费者可安全依赖；
# "active" 表示文档当前有效但可走变更门控修改。

