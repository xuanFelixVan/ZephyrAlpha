values:
  - value: draft
    definition: "草稿——合约设计中，尚未冻结，消费者不应依赖"
    ai_consumption: "AI 标注合约状态时，设计中的合约使用此值"
    ai_keywords: ["草稿", "draft", "设计中", "未冻结"]
    next_states: ["frozen"]

  - value: frozen
    definition: "已冻结——合约锁定不可变，消费者可安全依赖"
    ai_consumption: "AI 标注合约状态时，已锁定的合约使用此值。frozen 合约变更需版本升级而非原地修改"
    ai_keywords: ["冻结", "frozen", "锁定", "不可变"]
    next_states: ["deprecated"]

  - value: deprecated
    definition: "已废弃——有新版本替代，不应再使用"
    ai_consumption: "AI 标注合约状态时，被替代的旧合约使用此值"
    ai_keywords: ["废弃", "deprecated", "已替代", "旧版"]
    next_states: []
