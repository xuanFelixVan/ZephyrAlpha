# ttl 受控词表
# ZephyrAlpha 2.0 文档保留期唯一真源
# 维护者：ZephyrAlpha-Owner
# 版本：1.1.0
# 创建日期：2026-05-02
#
# 本词表定义 ttl 字段的所有合法值（6 种）。
# 校验器 check_frontmatter_metadata.py 从本文件动态加载合法值。
# 新增/删除 ttl 值只需修改本文件，校验器自动同步。
#
# 对标标准：
#   - metadata_registry.yaml §2.1 + §4.7（TTL 定义真源）
#   - K8s well-known labels：label + value + meaning 三元组

schema_version: "1.0.0"
doc_type: vocabulary
module_id: PS-VOC-004
version: "1.1.0"
title: "ttl 受控词表"
status: active
owner: ZephyrAlpha-Owner
vocabulary_name: ttl
total_values: 6
source: "PS-STD-001 §2.1 + §4.7（TTL 保留期定义真源）"
depends_on:
  - target: PS-STD-001
    at: "§2.1 + §4.7"
    why: "ttl 受控词表定义真源"

values:
  - value: permanent
    definition: "永久保留——核心治理文件、元标准、宪章、蓝图。不可删除"
    applies_to: [policy, standard, protocol, blueprint]
    ai_keywords: ["永久", "permanent", "永不删除", "宪章"]

  - value: 30d
    definition: "30 天保留——临时施工文件、讨论稿。到期后可归档或删除"
    applies_to: [plan, design]
    ai_keywords: ["30天", "临时", "30d", "月度"]

  - value: 7d
    definition: "7 天保留——极短期会话产出物、自动生成报告"
    applies_to: [audit_report, log]
    ai_keywords: ["7天", "短期", "7d", "周"]

  - value: session
    definition: "会话生命周期——仅当前 AI session 有效，session 结束后失效"
    applies_to: [log]
    ai_keywords: ["session", "会话", "本次", "临时"]

  - value: periodic_review_90d
    definition: "定期审查（90 天周期）——需每 90 天人工审查是否需要更新。适用于相对稳定但仍需周期性确认的治理文件"
    applies_to: [standard, policy]
    ai_keywords: ["90天", "季度", "审查", "review", "periodic"]

  - value: task_bound
    definition: "任务绑定——文件与特定任务关联，当该任务完成时可清理。触发方式：用户喊 AI 扫描 ttl=task_bound 全项目文件，输出清单后人工判定关联任务是否完成。介于 session（会话结束即删）和 permanent（永不删）之间"
    applies_to: [doc]
    ai_keywords: ["任务", "task", "完成即删", "条件", "task_bound"]

# ── 二元判定树（AI 创建文档时 MUST 按此树判定 ttl，禁止靠关键词猜）──
# 设计原则：
#   1. 每个节点只能回答 是/否（二元）
#   2. 每个节点有客观判定标准（路径/前缀/内容特征），不靠"感觉"
#   3. match: any = 满足任一标准即为"是"
#   4. 判定顺序从最严格（permanent）到最宽松（30d）
#   5. 默认落点 30d（最保守的临时值），避免临时文档被误判为永久
#   6. 同一文档，任何 AI 按此树判定，结果必须一致（可复现）
decision_tree:
  root: Q1
  nodes:
    Q1:
      question: "文档是否为核心治理真源？"
      criteria:
        - "路径在 docs/01_policies_and_standards/"
        - "路径在 docs/02_enterprise_architecture/"
        - "路径在 docs/03_modules/（含 _manifests/）"
        - "路径在 docs/08_knowledge/（知识库沉淀）"
        - "frontmatter module_id 前缀为 PS-/MOD-/GOV-"
      match: any
      yes: permanent
      no: Q2
    Q2:
      question: "文档是否绑定到具体任务卡？"
      criteria:
        - "正文或 frontmatter 引用任务卡 ID（前缀 OPS-/TRA-/ARCH-/FIX-）"
        - "文档为该任务卡专属服务，任务完成后文档失效"
      match: any
      yes: task_bound
      no: Q3
    Q3:
      question: "文档是否需要周期复查？"
      criteria:
        - "frontmatter status 为 draft 或 review"
        - "正文显式声明'定期复查'或'周期审查'"
      match: any
      yes: periodic_review_90d
      no: Q4
    Q4:
      question: "文档是否仅当前 AI session 有效？"
      criteria:
        - "文件名以 _tmp_ 开头"
        - "路径在 .trae/sessions/"
        - "内容显式标注'本次对话临时产出'"
      match: any
      yes: session
      no: Q5
    Q5:
      question: "文档是否为自动生成的报告/日志？"
      criteria:
        - "文件头部含'自动生成'字样"
        - "路径在 docs/09_audit/ 或路径含 generated/audit/log"
        - "由脚本生成而非人工编写"
      match: any
      yes: 7d
      no: 30d  # 默认：人工编写的临时讨论稿/计划稿

deprecated_values: []
