# ── 内容判定树（AI 创建文档时 MUST 按此树判定 ttl）──
# 设计原则：
#   1. 优先用内容信号判定，路径作为辅助兜底（治本：changes/等过程文件不再误判 permanent）
#   2. 过程性子目录（changes/delivery/reports/_working/_archive/decomposition）→ task_bound
#   3. 过程性 doc_type（log/audit_report/operational_rule）→ task_bound
#   4. 永久区路径 → permanent（准入受控，必为永久文件）
#   5. 其他 → task_bound（默认落 docs/_working/）
#   6. AI 创建文件默认落 docs/_working/，除非用户明确要求创建永久文件
#   7. 永久区准入需用户同意（GitCommitGateway 门禁）
#   8. 同一文档，任何 AI 按此树判定，结果必须一致（可复现）
#   9. criteria 为机器可读结构（signal/value/operator），供脚本/gateway 直接消费
#  10. v2.1.0 变更：从路径判定改为内容判定，解决 changes/ 等过程文件误标 permanent
decision_tree:
  root: Q1
  nodes:
    Q1:
      question: "文档是否在过程性子目录？"
      criteria:
        - signal: path
          value: "docs/_working/"
          operator: startswith
        - signal: path
          value: "/changes/"
          operator: contains
        - signal: path
          value: "/reports/"
          operator: contains
        - signal: path
          value: "/_archive/"
          operator: contains
        - signal: path
          value: "/delivery/"
          operator: contains
      match: any
      yes: task_bound
      no: Q2
    Q2:
      question: "文档 doc_type 是否为过程性类型？"
      criteria:
        - signal: frontmatter.doc_type
          value: "log"
          operator: equals
        - signal: frontmatter.doc_type
          value: "audit_report"
          operator: equals
        - signal: frontmatter.doc_type
          value: "operational_rule"
          operator: equals
      match: any
      yes: task_bound
      no: Q3
    Q3:
      question: "文档是否在永久区路径？"
      criteria:
        - signal: path
          value: "docs/01_policies_and_standards/"
          operator: startswith
        - signal: path
          value: "docs/02_enterprise_architecture/"
          operator: startswith
        - signal: path
          value: "docs/03_modules/"
          operator: startswith
        - signal: path
          value: "docs/08_knowledge/"
          operator: startswith
      match: any
      yes: permanent
      no: task_bound  # 默认落 docs/_working/ 临时区

# ── 永久区准入机制（后续实现）──
# 永久区新文件必须经用户同意才能进入：
#   1. GitCommitGateway 检测新增永久区 .md 文件
#   2. 未带 --allow-promote → 阻断
#   3. 用户在终端带 --allow-promote → 交互确认后放行
#   4. AI 自动化调用无法绕过（无法触发终端交互）
# 不使用 frontmatter promoted_by 字段（审批人永远是用户，字段冗余且无法防伪造）

