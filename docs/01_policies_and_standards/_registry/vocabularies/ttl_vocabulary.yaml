# ttl 受控词表
# ZephyrAlpha 2.0 文档保留期唯一真源
# 维护者：ZephyrAlpha-Owner
# 版本：2.0.0（breaking：6 值→2 值二元裁定）
# 创建日期：2026-05-02
# 最后更新：2026-06-30
#
# v2.0.0 变更说明（2026-06-26）：
#   - 删除 7d（0 使用，死代码）
#   - 删除 30d（2 使用，本质 task_bound，已迁移）
#   - 删除 periodic_review_90d（1 使用，LLM 排行榜转 permanent）
#   - 删除 session（0 使用，是 task_bound 子集）
#   - 只留 permanent / task_bound 二元
#   - 判定树从 5 节点简化为 1 节点二元（永久区路径→permanent；否则→task_bound）
#   - 设计依据：粒度越细，AI 判定越猜；二元判定消除歧义
#
# ── ttl 判定优先级（2026-06-30 裁定，治本：消除三处 ttl 定义冲突）──
# ttl 有三处定义，回答不同问题，冲突时按以下优先级裁决（高→低）：
#   1. frontmatter.ttl（最高）——AI/人显式声明，直接生效，覆盖一切
#   2. directory_contract.yaml directory_zones.<zone>.default_ttl（位置优先）——
#      文件所在目录的 zone 决定默认 ttl（永久区→permanent，临时区→task_bound，中性区→null）
#   3. doc_type_vocabulary.yaml values[].ttl_default（类型默认）——
#      doc_type 的默认 ttl，仅在 zone 未声明 default_ttl 时兜底
#   4. ttl_vocabulary.yaml decision_tree（辅助判定）——
#      AI 创建文件时的判定流程，输出结果应与上述 1/2 一致；若不一致，以 1/2 为准
#
# 裁定理由：
#   - frontmatter 显式声明优先：AI/人明确意图高于任何推断
#   - zone 优先于 doc_type：位置决定命运，简单可预测（临时区放 policy 也是临时的）
#   - DCR-003/004 基于 zone 校验，与 frontmatter 显式声明一致，无需改校验逻辑
#   - decision_tree 是辅助工具，不是真源；冲突时以契约为准
#
# 本词表定义 ttl 字段的所有合法值（2 种）。
# 校验器 check_frontmatter_metadata.py 从本文件动态加载合法值。
# 新增/删除 ttl 值只需修改本文件，校验器自动同步。
#
# 对标标准：
#   - metadata_registry.yaml §2.1 + §4.7（TTL 定义真源）

schema_version: "1.0.0"
doc_type: vocabulary
module_id: PS-VOC-004
version: "2.0.0"
title: "ttl 受控词表"
status: active
owner: ZephyrAlpha-Owner
vocabulary_name: ttl
total_values: 2
depends_on:
  - target: PS-STD-001
    at: "§2.1 + §4.7"
    why: "ttl 受控词表定义真源"

values:
  - value: permanent
    definition: "永久保留——核心治理文件、元标准、宪章、蓝图、真源数据。不可删除"
    applies_to: dynamic_from_ssot  # 真源：doc_type_vocabulary.yaml values[].ttl_default == permanent
    ai_keywords: ["永久", "permanent", "永不删除", "宪章", "真源"]

  - value: task_bound
    definition: "任务绑定——文件与特定任务关联，任务完成后可清理。所有过程性文档（方案/评估/提案/调研报告/临时笔记）默认用此值。默认落点 docs/_working/"
    applies_to: dynamic_from_ssot  # 真源：doc_type_vocabulary.yaml values[].ttl_default == task_bound
    ai_keywords: ["任务", "task", "完成即删", "过程", "临时", "task_bound"]

# ── 内容判定树（AI 创建文档时 MUST 按此树判定 ttl）──
# 设计原则：
#   1. 优先用内容信号判定，路径作为辅助兜底（治本：changes/等过程文件不再误判 permanent）
#   2. 过程性子目录（changes/delivery/reports/_working/decomposition）→ task_bound
#      注：_archive 已于 commit 87392b2a60 提升为 permanent zone，不再属于过程性子目录
#   3. 过程性 doc_type（audit_report）→ task_bound（v3.1.0: operational_rule 已合并入 policy）
#   4. 永久区路径 → permanent（准入受控，必为永久文件）
#   5. 其他 → task_bound（默认落 docs/_working/）
#   6. AI 创建文件默认落 docs/_working/，除非用户明确要求创建永久文件
#   7. 永久区准入需用户同意（GitCommitGateway 门禁）
#   8. 同一文档，任何 AI 按此树判定，结果必须一致（可复现）
#   9. criteria 为机器可读结构（signal/value/operator），供脚本/gateway 直接消费
#  10. v2.1.0 变更：从路径判定改为内容判定，解决 changes/ 等过程文件误标 permanent
decision_tree:
  root: Q1
  nodes:
    Q1:
      question: "文档是否在过程性子目录？"
      criteria:
        - signal: path
          value: "docs/_working/"
          operator: startswith
        - signal: path
          value: "/changes/"
          operator: contains
        - signal: path
          value: "/reports/"
          operator: contains
        # 已删除：- signal: path value: "/_archive/" operator: contains
        # 病根：commit 87392b2a60 把 docs/_archive/ 提升为 permanent zone，但此条目未同步删除
        # _archive 是永久归档区，不是过程性子目录；Q3 会正确判定为 permanent
        - signal: path
          value: "/delivery/"
          operator: contains
      match: any
      yes: task_bound
      no: Q2
    Q2:
      question: "文档 doc_type 是否为过程性类型？"
      # 真源：doc_type_vocabulary.yaml values[].ttl_default == task_bound
      # 治本（2026-06-30）：从 doc_type_vocabulary.yaml 动态加载（via criteria_source filter+extract_field）
      # 消除硬编码 audit_report 副本——doc_type 变更只需改词表一处（v3.1.0: operational_rule 已合并）
      criteria_source:
        target: doc_type_vocabulary.yaml
        path: docs/01_policies_and_standards/_registry/vocabularies/doc_type_vocabulary.yaml
        module_id: PS-VOC-001
        section: values
        filter:
          field: ttl_default
          equals: task_bound
        extract_field: value
        signal: frontmatter.doc_type
        operator: equals
      match: any
      yes: task_bound
      no: Q3
    Q3:
      question: "文档是否在永久区路径？"
      # 真源：路径列表从 directory_contract.yaml directory_zones.permanent.paths 动态加载
      # 治本（2026-06-29）：消除与 directory_contract.yaml 的路径列表副本，路径变更只需改契约一处
      # load_decision_tree 加载时自动展开 criteria_source 为 criteria 列表（对 evaluate_ttl 透明）
      criteria_source:
        target: directory_contract.yaml
        path: docs/01_policies_and_standards/_registry/contracts/directory_contract.yaml
        module_id: PS-CTR-002
        section: directory_zones.permanent.paths
        signal: path
        operator: startswith
      match: any
      yes: permanent
      no: task_bound  # 默认落 docs/_working/ 临时区

# ── 永久区准入机制（已实现，ARCH-049，2026-07-05）──
# 永久区新文件必须经用户同意才能进入：
#   1. GitCommitGateway 检测新增永久区文件（FILE-PLACEMENT-TTL gate，priority=33）
#   2. 未带 allow_promote=True → 阻断（PROMOTION_BLOCKED）
#   3. 用户/AI 带 allow_promote=True → 放行
#   4. exempt_subdirs 生成器输出豁免（directory_contract.yaml directory_zones.permanent.exempt_subdirs）
# 实现：src/zephyr/gov_enforcement/commit_gates/file_placement_ttl_gate.py
# 三重校验：永久区准入 + TTL↔zone 一致性 + 根目录子目录准入（防乱建子目录）
# 不使用 frontmatter promoted_by 字段（审批人永远是用户，字段冗余且无法防伪造）

