# ── 正交性说明：node_type vs doc_type ──
# node_type 和 doc_type 是正交维度：
#   node_type —— 依赖图视角：这个文件在依赖图中是什么节点？（代码/配置/文档/域）
#   doc_type  —— 文档治理视角：这个文档的语义类型是什么？（策略/蓝图/词表/门禁）
#
# 关系：
#   - .py 文件有 node_type=module/script/test，但无 doc_type（代码不是文档）
#   - .md 文件同时有 node_type=doc/blueprint/policy 和 doc_type=policy/blueprint/...
#   - .yaml 配置文件有 node_type=config/registry/schema，doc_type=register/gate
#   - node_type 回答"依赖图怎么收录这个文件"；doc_type 回答"文档治理怎么管理这个文件"
