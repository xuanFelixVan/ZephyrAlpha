# ── type_priority 编号说明 ──
# 文件粒度合并时，同一路径多个扫描结果按 type_priority 取最小值（越优先）。
# 编号 11 故意留空（历史间隙），不分配给任何值——保持与原硬编码 TYPE_PRIORITY 完全一致。
# domain 级节点 type_priority=null（不参与文件粒度合并）。

# ── 白名单说明（裁定#184）──
# nodes 表只收录 in_nodes_whitelist=true 的 4 种 node_type：
#   module(.py 代码) / script(.py 脚本) / test(.py 测试) / config(.yaml 运行时配置)
# 新类型默认不进 nodes 表，天然安全（对齐 dependency-cruiser/madge/Bazel 实践）。
# 非白名单类型（registry/contract/schema/gate/doc/blueprint/policy/template/diagram/data/
#   knowledge_doc/infra/domain 级 6 种）进入 edges 表但不进 nodes 表。

# ── architecture_layer_fallback 映射说明 ──
# 本字段是 generate_project_depgraph.py L2728-2736 SQL CASE 的 SSoT。
# 兜底逻辑（Tier 3）：当 architecture_layer 为空时按 node_type 推导。
#   script/test                       → L3_application
#   config/registry/gate/contract/schema → L1_foundation
#   blueprint                         → L0_infrastructure
#   其他（含 module/data/doc/policy/template/diagram/domain 级/special）→ L3_application
# 注意：module 落 L3_application 是历史行为（SQL ELSE 分支），本词表如实记录而非修正。

# ── stability_fallback / autonomy_fallback 映射说明 ──
# 本字段是 generate_project_depgraph.py derive_stability_fallback / derive_autonomy_fallback 的 SSoT。
#   gate/policy                        → frozen / immutable_core（治理规则不可变，AI 不可改）
#   config/registry/schema/contract/template → stable / human_gated（配置需人工审批）
#   其他                               → evolving / ai_modifiable（默认开发中，AI 可改）

