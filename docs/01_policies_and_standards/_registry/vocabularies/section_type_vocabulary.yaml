# ── section_type 语义边界说明（防漂移）──
# 三个易混淆值的区别：
#   rule       = 定义"必须/禁止"（约束性）
#   context    = 提供"为什么/什么时候"适用（背景性）
#   information= 陈述"是什么"的事实（事实性）
#
# 三个治理类值的区别：
#   rule       = 具体规则（约束行为）
#   governance = 关于规则的治理（约束规则的规则，元层）
#   principles = 指导原则（价值导向，非具体约束）
#
# 三个诊断类值的区别：
#   symptom_mapping     = 症状→根因的映射表（静态查表）
#   error_patterns      = 常见错误模式（反模式集合）
#   root_cause_analysis = 根因分析方法论（动态分析过程）
#
# 三个文档辅助值的区别：
#   context    = 背景信息（帮助理解）
#   reference  = 外部引用（指向其他资源）
#   metadata   = 结构化元信息（关于数据的数据）

# ── 新增 section_type 值的判定树（AI 创建 section 时 MUST 按此树判定）──
# Q1: 你的 section 是定义"约束"还是提供"信息"？
#     → 约束（必须/禁止）→ rule
#     → 信息 → 看 Q2
#
# Q2: 你的信息是"背景"、"事实"还是"外部引用"？
#     → 背景（为什么/什么时候适用）→ context
#     → 事实（是什么）→ information
#     → 外部引用（指向其他资源）→ reference
#
# Q3: 你的约束是"具体规则"还是"关于规则的治理"？
#     → 具体规则 → rule
#     → 关于规则的治理（元层）→ governance
#     → 价值导向（非具体）→ principles
#
# Q4: 你的内容是"过程"还是"验证"？
#     → 过程（如何做）→ procedure
#     → 验证（如何检查）→ verification
#     → 决策（如何判断）→ decision_tree
#
# Q5: 你的内容是"诊断"类吗？
#     → 症状→根因映射表 → symptom_mapping
#     → 常见错误模式 → error_patterns
#     → 根因分析方法论 → root_cause_analysis
#
# Q6: 你的内容是"运维"类吗？
#     → 升级路径 → escalation
#     → 回滚方案 → rollback
#     → 事件响应 → incident_response

deprecated_values: []  # v1.0.0 首次创建，无废弃值

# ── 与 doc_type 的正交关系（防漂移文档）──
# section_type（本词表）：规则文件内部 section 的语义类型——section 是什么。
# doc_type（doc_type_vocabulary.yaml）：文件整体的语义类型——文件是什么。
#
# 两者正交：
#   - 一个 doc_type=policy 的文件，内部可有 rule/context/examples/principles 等多种 section_type
#   - section_type 描述文件内部结构，doc_type 描述文件整体归属
#   - 文件级用 doc_type，section 级用 section_type，不可混用
#
# 设计依据：与 doc_type_vocabulary.yaml 的正交性原则一致（类型即位置 vs 类型即内容）
