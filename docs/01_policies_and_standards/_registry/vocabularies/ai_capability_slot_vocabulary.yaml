values:
  - value: planned
    definition: "已规划——尚未实现"
    ai_consumption: "AI 能力已列入路线图，但尚未开发。AI 不应尝试使用 planned 能力槽位。"
    ai_keywords: ["已规划", "planned", "路线图", "待开发"]

  - value: reserved
    definition: "已预留——架构中留位，待开发"
    ai_consumption: "架构已为该能力预留接口，但实现尚未完成。AI 可引用接口定义但不可依赖实现。"
    ai_keywords: ["已预留", "reserved", "接口", "占位"]

  - value: active
    definition: "已激活——当前在用"
    ai_consumption: "AI 能力已完全实现并可正常使用。AI 可以依赖 active 能力槽位执行任务。"
    ai_keywords: ["已激活", "active", "可用", "运行中"]

  - value: none
    definition: "无——不需要 AI 能力槽位"
    ai_consumption: "该模块不需要 AI 能力。AI 不应尝试为该模块分配 AI 能力。"
    ai_keywords: ["无", "none", "不需要", "非 AI"]
