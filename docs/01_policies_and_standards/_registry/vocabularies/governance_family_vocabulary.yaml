#
# 本词表定义 governance_family 字段的所有合法值（4 种）。
# 用于分类治理文件的系统家族，指导 AI 的决策逻辑。
#
# 对标标准：
#   - PS-STD-001 §10.7：治理系统家族
#   - 规则分类与冲突裁决标准 (PS-STD-004)

schema_version: "1.0.0"
