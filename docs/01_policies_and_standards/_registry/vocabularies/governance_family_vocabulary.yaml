title: "governance_family 受控词表"
status: active
vocabulary_name: governance_family
total_values: 4
source: "PS-STD-001 §10.7"
depends_on:
  - target: PS-STD-001
    at: "§10.7"
    why: "governance_family 受控词表定义真源"
  - target: PS-STD-004
    at: "全表"
    why: "规则分类与冲突裁决标准"

values:
  - value: A
    definition: "家族 A——策略/标准类规则"
    ai_consumption: "家族 A 文件定义'必须做什么'和'禁止做什么'。AI 必须严格遵守，不可偏离。"
    ai_keywords: ["策略", "标准", "规则", "必须", "禁止", "家族 A"]
    examples: ["policy", "standard", "rule"]
    conflict_resolution: "家族 A > 家族 B > 家族 C > 家族 D（冲突时高优先级优先）"

  - value: B
    definition: "家族 B——操作性流程类规则"
    ai_consumption: "家族 B 文件定义'怎么做'。AI 在执行任务时应优先遵循家族 B 的操作步骤。"
    ai_keywords: ["操作", "流程", "runbook", "步骤", "家族 B"]
    examples: ["operational_rule", "runbook", "playbook"]
    conflict_resolution: "家族 B 与家族 A 冲突时，家族 A 优先"

  - value: C
    definition: "家族 C——Schema/契约类规则"
    ai_consumption: "家族 C 文件定义数据结构和接口契约。AI 在生成代码和数据时必须符合家族 C 的约束。"
    ai_keywords: ["Schema", "契约", "接口", "数据结构", "家族 C"]
    examples: ["schema", "contract", "protocol"]
    conflict_resolution: "家族 C 与家族 A/B 冲突时，家族 A/B 优先（Schema 是约束而非业务规则）"

  - value: D
    definition: "家族 D——模板/骨架类规则"
    ai_consumption: "家族 D 文件提供可复用的结构模板。AI 在创建新文件时应优先使用家族 D 的模板。"
    ai_keywords: ["模板", "骨架", "template", "结构", "家族 D"]
    examples: ["template", "blueprint"]
    conflict_resolution: "家族 D 优先级最低，可被任何其他家族覆盖"
