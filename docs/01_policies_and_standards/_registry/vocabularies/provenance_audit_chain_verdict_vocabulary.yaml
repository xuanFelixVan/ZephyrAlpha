    frontmatter_color: "🔴"

  - value: conditional
    definition: "有条件通过——审计通过但附带条件"
    ai_consumption: "AI 在引用 conditional 的审计记录时应同时列出附带条件，并确保条件已满足。"
    ai_keywords: ["有条件通过", "conditional", "附带条件", "有条件"]
    frontmatter_color: "🟡"
