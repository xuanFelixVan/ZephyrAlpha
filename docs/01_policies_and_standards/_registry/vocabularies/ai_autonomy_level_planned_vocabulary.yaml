values:
  - value: l0
    definition: "L0 无自治——AI 仅辅助建议，不执行任何操作"
    ai_consumption: "AI 只能提供建议，所有操作必须由人类执行。适用于高度敏感模块。"
    ai_keywords: ["L0", "无自治", "建议", "辅助", "人类执行"]

  - value: l1
    definition: "L1 低自治——AI 可执行读操作，写操作需审批"
    ai_consumption: "AI 可以读取文件和生成报告，但任何写入操作都须经过人类审批。"
    ai_keywords: ["L1", "低自治", "读操作", "写审批", "人类把关"]

  - value: l2
    definition: "L2 中自治——AI 可读写，关键操作需审批"
    ai_consumption: "AI 可以执行常规读写操作，但关键操作（如删除、权限变更）仍须审批。"
    ai_keywords: ["L2", "中自治", "读写", "关键审批", "半自主"]

  - value: l3
    definition: "L3 高自治——中风险封顶，Owner 授权范围内自主；全权自主超出本项目自治上限，不启用"
    ai_consumption: "AI 可在 Owner 授权范围内自主执行中风险及以下操作（本项目自治上限为中风险封顶，留痕可回滚）。全权自主不启用。"
    ai_keywords: ["L3", "高自治", "中风险封顶", "授权自主", "全权不启用"]
