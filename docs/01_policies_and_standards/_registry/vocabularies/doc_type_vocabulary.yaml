    ttl_default: permanent
    definition: "规则——定义'必须/禁止/条件'的行为约束、可量化技术标准（格式/接口/度量），或'如何做'的过程式步骤（runbook/playbook/procedure/checklist）。v3.1.0 合并 operational_rule 后承载声明式与过程式两类规则"
    rule_form: declarative  # 默认；过程式规则文件显式标 rule_form: procedural
    required_fields: []  # 声明式建议 valid_from，过程式必须 verifiability（VR-011 约束）
