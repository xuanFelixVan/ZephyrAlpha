# doc_type 受控词表
# ZephyrAlpha 2.0 文档类型唯一真源
# 维护者：ZephyrAlpha-Owner
# 版本：1.4.0
# 创建日期：2026-04-30
#
# 本词表定义 doc_type 字段的全项目合法值（27 种）——涵盖 01_policies_and_standards/
# 核心子集（13 种）+ 其他目录（03_blueprints/、02_enterprise_architecture/ 等）的
# 项目级类型（14 种）。任何文件 frontmatter 中的 doc_type 必须是以下值之一。
# 新增 doc_type 必须先在此词表中注册，再在 PS-STD-001 中更新。
#
# 对标标准：
#   - SchemaStore catalog.json：fileMatch + description 模式
#   - K8s well-known labels：label + value + meaning 三元组
#   - Cursor Rules：glob 自动触发 + 决策辅助
#   - OpenAPI 3.1：enum + description + deprecated flag

