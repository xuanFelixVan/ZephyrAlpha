    filename_suffixes: ["_policy.md", "_policy.yaml", "_policy.yml", "_rules.yaml", "_rules.yml", "_runbook.md", "_playbook.md", "_procedure.md", "_checklist.md"]
    usage_note: "v3.1.0 合并 operational_rule（2026-06-30）：policy 承载声明式（rule_form=declarative，默认）与过程式（rule_form=procedural，文件显式标注）两类规则。过程式 policy 必须含 verifiability 字段（VR-011）。原 operational_rule 文件的 ttl=task_bound 在 frontmatter 逐文件保留。"

