# ============================================================
# 字段语义说明：doc_type 与目录约束的关系
# （P4 治本 2026-06-30：allowed_directories/forbidden_directories 字段已删除，
#  目录约束迁移到 directory_contract.yaml 的 allowed_doc_types 字段）
# ============================================================
# doc_type 是文件的内在语义属性，回答"这个文件是什么"：
#   - 由文件内容/用途决定，不随存放位置改变
#   - 一个 policy 文件无论放在 governance/ 还是 _working/，它仍然是 policy
#
# 目录约束（"这个文件夹能放什么类型的文件"）已迁移到：
#   directory_contract.yaml §2 directory_extensions[].allowed_doc_types
#   - 方向：directory → doc_types（每个目录声明允许的 doc_type 列表）
#   - 校验：DCR-001（check_directory_contract.py）——file.doc_type 必须在
#     所在目录的 allowed_doc_types 内
#   - 豁免：allowed_doc_types=[] 的目录（代码/数据/临时区）豁免 doc_type 约束
#
# 历史迁移说明（P3/P4 治本）：
#   - 旧方向（已废弃）：doc_type_vocabulary.yaml values[].allowed_directories
#     定义"doc_type 允许去哪些目录"（doc_type → directories）
#   - 新方向（P3 启用）：directory_contract.yaml allowed_doc_types
#     定义"目录允许哪些 doc_type"（directory → doc_types）
#   - 迁移原因：用户诉求"每个文件夹只能放什么类型的文件"对应 directory→doc_types
#     方向；旧方向的 forbidden_directories 全为空数组，从未拦截过任何东西，
#     allowed_doc_types 白名单已足够严格（不在白名单即违规）
#   - DCR-002（forbidden_directories 校验）已废弃，无副作用

# ============================================================
# AI 决策辅助：选择 doc_type 的三问决策树
# （便捷参考——canonical 规则定义见 PS-STD-001 §3.2 + §3.2.1）
# ============================================================
# Q1: 你的文件在定义"规则"还是"操作步骤"？
#     → 规则（声明式）或操作步骤（过程式）→ 都用 policy（v3.1.0 合并 operational_rule）
#       声明式 policy：rule_form=declarative（默认），如行为约束/技术标准
#       过程式 policy：rule_form=procedural（显式标注），如 runbook/playbook/checklist
#
# Q2: 你的规则约束什么？
#     → 行为约束或技术规范（必须做/禁止做/格式/接口/度量）→ 声明式 policy（rule_form=declarative）
#
# Q3: 你的文件是"导航入口"、"数据结构"还是"结构骨架"？
#     → 目录级导航入口  → 用 index
#     → 数据清单/注册表 → 用 register
#     → 可复用的结构骨架 → 用 template
#
# Q4（项目级类型）: 你的文件不在 01_policies_and_standards/ 下吗？
#     → 蓝图/架构   → blueprint / architecture_view
#     → 知识库/词表 → vocabulary
#     → 审计/日志   → audit_report

# ============================================================
# 文件名与 doc_type 的强制映射（便捷参考——canonical 规则见 PS-STD-001 §3.4）
# ============================================================
# 【原则】文件名后缀必须反映 doc_type。不允许文件名误导文档类型。
# 做到"看名字就知道这个文件是什么类型的规则"——这是零记忆重启标准的基础。
#
# doc_type → 文件名后缀映射（v3.1.0，9 值）：
#   policy           → {subject}-policy.md / {subject}-rules.yaml（声明式）
#                       {subject}-runbook.md / -playbook.md / -procedure.md / -checklist.md（过程式）
#                       注：v3.1.0 合并 operational_rule，过程式后缀是 policy 的合法表达
#   register         → {subject}-registry.yaml / -registry.md / -register.md
#   index            → index.md（固定，不可变）
#   template         → {subject}-template.md（templates/ 目录下模板文件）
#                       注：模板文件的 doc_type 取目标文档类型（如 blueprint-construction-template.md 设 doc_type: blueprint）
#   vocabulary       → {subject}-vocabulary.yaml（如 doc_type_vocabulary.yaml）
#   blueprint        → {subject}-blueprint.md
#   audit_report     → {subject}-report.md
#   architecture_view → {subject}-spec.md / {subject}-view.md
#   gate             → {subject}-gate.yaml / {subject}-contract.yaml（历史命名保留）
#
# 历史修正：v1.1.0 允许"文件名描述业务场景、doc_type 定义文档结构，两者不需要一致"，该条款已废除。
# 原因：运行三个月后发现它导致文件名误导 AI 和人类，增加审计负担。
# 修正文件（2026-05-02）：adr-protocol-runbook.md → adr-protocol.md（protocol）
#                       security-incident-playbook.md → security-incident-response-policy.md（policy）
#                       document-discovery-runbook.md → trae_029_doc_operation_security.yaml（policy）
# ============================================================

# ============================================================
# 模板豁免规则（便捷参考——canonical 规则见 PS-STD-001 §3.4 + TMP-EX-001）
# ============================================================
# 【核心原则】templates/ 下的文件是"类定义"（Class Definition），不是
# "配置项实例"（CI Instance）。它不受 directory_contract.yaml 的
# allowed_doc_types 约束——因为模板本身不需要被部署到目标目录。
#
# 豁免规则 TMP-EX-001：模板文件 allowed_doc_types 豁免
#   触发条件：文件位于 templates/ 目录下
#   豁免内容：directory_contract.yaml 中该目录的 allowed_doc_types 约束
#             不对此文件生效（check_directory_contract.py 的 _DCR_EXEMPT_PREFIXES
#             包含 docs/01_policies_and_standards/templates/）
#   保留约束：doc_type 的 required_fields 仍然生效（模板应具备目标
#             文档所需的所有必填字段）
#
# 专业对标：
#   - K8s Helm：template/ 下的 YAML 不受命名空间约束，渲染后才落地
#   - OpenAPI $ref：引用的组件文件位置由 $ref 解析规则决定，不由
#     components/ 目录结构约束
#   - ITIL SACM：模板是 CI 类（Class），不是 CI 实例（Instance），
#     位置约束仅对实例生效
#   - Terraform：.tftpl 模板文件不受 provider schema 目录约束
#
# 大白话：模板教你怎么写文档，模板自己不需要遵守"文档应该放哪个目录"的规则。
# 就像菜谱告诉你"煎好的鱼应该放盘子里"——但菜谱本身不用放盘子里。
#
# 历史背景：本规则于 v1.3.0 从 template entry 的 usage_note 中"暗示"
# 升级为正式章节——暗示不够，AI 新 session 需要显式豁免条款。
# P4 治本（2026-06-30）：豁免对象从 allowed_directories/forbidden_directories
#   更新为 allowed_doc_types（目录约束已迁移到 directory_contract.yaml）
# ============================================================
# ============================================================

