# declarative 默认 + procedural 文件显式标注 + verifiability 字段）。doc_type 从 10 值收敛到 9 值。
# 任何文件 frontmatter 中的 doc_type 必须是以下值之一。
# 新增 doc_type 必须先在此词表中注册，再在 PS-STD-001 中更新。
#
# 对标标准：
#   - SchemaStore catalog.json：fileMatch + description 模式
#   - K8s well-known labels：label + value + meaning 三元组
#   - Cursor Rules：glob 自动触发 + 决策辅助
#   - OpenAPI 3.1：enum + description + deprecated flag

