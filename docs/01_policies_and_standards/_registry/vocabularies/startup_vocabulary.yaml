version: "1.1.0"
title: "startup 受控词表"
status: active
ttl: permanent
owner: ZephyrAlpha-Owner
vocabulary_name: startup
total_values: 5
depends_on:
  - target: trae_047_engineering_file_header.yaml
    at: "§gov_eng_002_enum_definitions STARTUP-ENUM（原内联定义，已迁出）"
    why: "startup 枚举定义原真源——本词表从此迁出为独立词表"
  - target: trae_060_generator_automation.yaml
    at: "§3 事件驱动全自动"
    why: "scheduled 禁止使用的依据"

values:
  - value: auto_start
    definition: "自动启动——系统启动时自动运行"
    ai_keywords: ["自动启动", "auto_start", "开机即运行"]

  - value: event_driven
    definition: "事件驱动——由特定事件触发运行"
    ai_keywords: ["事件驱动", "event_driven", "触发", "事件"]

  - value: manual
    definition: "手动触发——仅限一次性运维/诊断/迁移操作"
    ai_keywords: ["手动", "manual", "一次性", "运维", "诊断", "迁移"]

  - value: imported
    definition: "被动导入——不主动启动，被其他模块导入使用"
    ai_keywords: ["导入", "imported", "被动", "不主动启动"]

  - value: scheduled_task
    definition: "OS 托管计划任务——Windows Task Scheduler / CI schedule 等 OS 级调度器托管的 one-shot 守护执行（进程外托管层级，非进程内 Timer；仅限守护类：执行完即退出、不常驻）"
    ai_keywords: ["计划任务", "scheduled_task", "Task Scheduler", "OS 托管", "one-shot 守护"]

deprecated_values:
  - value: scheduled
    deprecated_in: "1.0.0"
    reason: "定时调度禁止使用——进程内定时触发等于要人指令触发，未达自动（见 trae_060 §3）"
