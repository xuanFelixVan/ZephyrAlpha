# startup 受控词表
# 文件头 [STARTUP] 字段唯一真源
# 维护者：ZephyrAlpha-Owner
# 版本：1.0.0
# 创建日期：2026-06-29
#
# 本词表定义 startup 字段的所有合法值（5 种）。
# 原先内联在 trae_047 §gov_eng_002_enum_definitions STARTUP-ENUM，已迁出为独立词表。
# 校验器从本文件动态加载合法值。
#
# 禁止值：scheduled（进程内定时调度）——见 trae_060 §3 事件驱动全自动原则
# 设计依据：强制 AI 声明文件触发方式；scheduled 禁止使用因进程内定时触发
#           等于要人指令触发未达自动（见 trae_060 §3）
# v1.1.0（2026-09-05 总管裁定）：增设 scheduled_task（OS 托管计划任务）——
#           依据 trae_060 L132 先例（CI schedule 属 CI 层批量兜底、非进程内 Timer、允许）：
#           Windows Task Scheduler 等 OS 级调度器托管的 one-shot 守护执行同属进程外托管层级；
#           对齐 Owner 2026-08-28 批准的 process_reaper 根治版设计（OS 托管 one-shot 优于进程内常驻）。
#           边界：仅限守护类 one-shot（执行完即退出）；进程内 Timer/轮询守护仍禁。

schema_version: "1.0.0"
doc_type: vocabulary
