module_id: PS-VOC-TAX-001
schema_version: "1.0.0"
doc_type: vocabulary
title: "知识分类边界标准（factor/strategy/other 受控类语义边界）"
version: "1.0.0"
status: active
owner: ZephyrAlpha-Owner
vocabulary_name: knowledge_taxonomy
ttl: permanent
created: "2026-08-30"
last_updated: "2026-08-30"
related_ruling: "GP1-EVAL-CALIBER-001（2026-08-29-gp1-eval50-review.md §六）"
