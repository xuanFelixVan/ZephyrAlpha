values:
  - value: synthesized
    definition: "综合——从此来源提炼/归纳"
    ai_consumption: "AI 在引用 synthesized 来源时应说明提炼过程，并保留原始来源的引用。"
    ai_keywords: ["综合", "synthesized", "提炼", "归纳", "总结"]

  - value: referenced
    definition: "引用——直接引用此来源"
    ai_consumption: "AI 在引用 referenced 来源时应提供直接引用标记和页码/章节。"
    ai_keywords: ["引用", "referenced", "直接引用", "来源"]

  - value: transformed
    definition: "转换——从此来源改写得来"
    ai_consumption: "AI 在引用 transformed 来源时应说明改写内容和原因，并保留原始来源的引用。"
    ai_keywords: ["转换", "transformed", "改写", "改编", "衍生"]
