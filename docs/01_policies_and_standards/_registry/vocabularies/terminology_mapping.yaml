body: '

  # 术语映射表（Terminology Mapping）


  ## 0. 本文档存在的理由


  ### 机构实践


  **所有大型机构都有术语表**，从来不是"画蛇添足"：


  | 机构类型 | 术语表的位置 |

  |---------|-------------|

  | **大型金融机构**（JPMorgan、高盛、BlackRock） | 专门的 "Enterprise Business Glossary" 系统，有治理层（谁能改） |

  | **咨询机构**（McKinsey、BCG） | 项目级术语卡片（glossary card），交付物必含 |

  | **AI 驱动团队** | 双向映射表（大白话 ↔ 术语），系统提示词中必带 |

  | **标准化组织**（ISO/IEEE） | 独立术语标准文档（如 ISO 2382 "Information Technology Vocabulary"） |


  ### 为什么要做


  - **新成员入职**：第一个月主要消化术语

  - **跨部门沟通**：业务语言 vs 工程语言必须对齐

  - **AI 系统尤其需要**：没有术语表，不同 agent 会用不同词指同一件事

  - **审计/合规场景**：关键术语必须有单一权威定义


  ### 对 ZephyrAlpha 2.0 的特定价值


  你（用户）是单人开发者，记不住所有行业黑话。本表让你：


  - **用大白话说需求** → AI 查表翻译成准确术语

  - **AI 用术语回复** → 你快速对照理解

  - **讨论时反复确认** → 避免"我以为是 X，AI 以为是 Y"


  ---


  ## 1. 使用方式


  ### 1.1 对人（你）


  讨论中遇到 AI 使用陌生术语：


  1. 第一查本表（Ctrl+F）

  2. 找不到的，要求 AI 补进本表

  3. 本表越补越全，就是你的行业词汇量的沉淀


  ### 1.2 对 AI


  所有 AI agent（Kimi / Opus / Composer）**应**：


  - 首次使用本表未收录的行业术语时，用括号内附大白话解释

  - 用户用大白话表述时，AI **可**内部翻译为术语并执行，但回复时**应**同时给出大白话

  - 收到不清楚的术语，查本表；仍无解时，加入本表并给出双向解释


  ---


  ## 2. 主术语表（核心术语，按拼音/字母排序）


  ### 2.1 架构与治理类


  | 大白话 | 行业术语 | 解释（一句话） | 关联文档 |

  |-------|---------|--------------|---------|

  | 唯一真源 / 正本 | Single Source of Truth (SSOT) / Canonical Source | 一件事只有一份权威记录，其他都是副本或引用 | ADR-0001 |

  | 正式文档区 / 正本区 | Canonical Domain / Canonical Area | 已拍板、长期维护、外部可信的正式文档存放区 | `docs/02_enterprise_architecture/` 等 |

  | 讨论区 / 沙盒 / 草稿区 | Workspace / Sandbox / Scratch | 未定稿、可随时改、不作对外承诺的区域 | ~~`docs/19_development_workspace/`~~ 已删除（2026-05-02，迁至外部独立目录） |

  | 真源迁移 / 搬家 | Migration / Canonicalization | 从旧结构搬到新结构，并统一规范 | ~~`taskbook.md`~~（已归档任务卡系统） 仓库搬迁章节 |

  | 文件夹规划 / 目录布局 | Information Architecture (IA) | 系统内容如何分层、分类、命名、存放的整体设计 | `docs/02_enterprise_architecture/target-architecture/02-information-architecture.md` |

  | 规矩 / 规范 | Standard / Policy / Rule | 对"合格产物"的明确要求 | `metadata_registry.yaml` |

  | 薄治理 / 轻规矩 | Thin Governance / Lightweight Governance | 只定最小必要规则，不搞庞大流程 | ~~`taskbook.md`~~（已归档任务卡系统） 段 C |


  ### 2.2 决策与记忆类


  | 大白话 | 行业术语 | 解释 | 关联文档 |

  |-------|---------|------|---------|

  | 为什么这么定 / 理由记录 | Architecture Decision Record (ADR) | 一份决策的永久凭证，含背景、方案对比、最终选择、后果 | **`KB:decisions`**（Git-backed） |

  | 推导链 / 讨论记录 | Rationale Log / Design Rationale | 推导出当前结论的时间轴 | `architecture-rationale-log.md` |

  | 还没想清楚的事 | Open Question / Open Issue | 已识别但未拍板的问题 | ~~`open-questions-register.md`~~（待建立） |

  | 可能出坏事的事 | Risk | 已识别的威胁，需要缓解或接受 | `_registry/catalogs/ai-risk-register.yaml` |

  | 记笔记 / 会议纪要 | Session Log / Meeting Notes | 一次会话/会议的记录 | `governance/ai/handoff-protocol.md`、`docs/19_development_workspace/session-logs/` |

  | 事后复盘 | Post-Mortem / Retrospective | 事件/阶段结束后的回顾 | （未启用） |

  | 组织记忆 | Organizational Memory | 团队层面的经验、决策、知识的系统化沉淀 | ~~`organizational-memory-system-design.md`~~（待建立） |

  | 决策记忆 | Decision Memory | 组织记忆中专门记录"决策与理由"的子系统 | 同上 |

  | 升格 / 转正 | Promotion / Publish / Accept | 从草稿状态升为正式状态（active / accepted） | `metadata_registry.yaml` §11 |

  | 作废 / 被取代 | Superseded | 被新文档或新决策取代，原文保留作为历史 | `metadata_registry.yaml` §6.2 |

  | 只追加不删改 | Append-only | 只允许新增，不允许修改或删除已有记录 | 同上 |


  ### 2.3 任务与流程类


  | 大白话 | 行业术语 | 解释 | 关联文档 |

  |-------|---------|------|---------|

  | 任务清单 | Taskbook / Backlog | 待办事项清单 | ~~`taskbook.md`~~（已归档任务卡系统） |

  | 办事流程表 | Checklist / Runbook | 完成一件事的标准步骤 | ~~`memory-system-landing-v1-checklist.md`~~（已归档） |

  | 大目标 / 大地图 | Roadmap | 3~12 个月的高层规划 | ~~`roadmaps/`~~（待建立） |

  | 里程碑 / 关卡 | Milestone (M1/M2/M3) | 阶段性完成节点 | ~~`roadmaps/`~~（待建立） |

  | 开工/进行中/完成/阻塞 | open / in-progress / closed / blocked | 任务四种状态 | ~~`taskbook.md`~~（已归档任务卡系统） 状态符号 |

  | 交接 / 交棒 | Handoff | 把工作从一方转给另一方 | `governance/ai/handoff-protocol.md` |

  | 体检 / 自检 | Health Check / Validation / Lint | 检查产物是否符合规范 | ~~`scripts/hooks/doc_guard_pre_commit.py`~~（待建立） |

  | 闸门 / 卡点 | Gate / Quality Gate | 必须通过才能进入下阶段的检查点 | ~~`taskbook.md`~~（已归档任务卡系统） 第 7 步 |


  ### 2.4 元数据与契约类


  | 大白话 | 行业术语 | 解释 | 关联文档 |

  |-------|---------|------|---------|

  | 文档头 / 标签区 | Frontmatter / Metadata / YAML Header | 文档开头的结构化信息（YAML 格式） | `metadata_registry.yaml` §2 |

  | 字段清单 / 数据格式 | Schema / Data Contract | 允许哪些字段、类型、取值范围 | 同上 |

  | 受控词表 | Controlled Vocabulary | 某字段只能取固定的几个值 | `metadata_registry.yaml` §3 |

  | 唯一编号 | Module ID / Document ID | 每份文档的唯一标识 | `metadata_registry.yaml` §4 |

  | 成熟度 / 状态 | Status / Lifecycle Stage | 草稿/讨论中/待评审/生效/作废 | `metadata_registry.yaml` §6 |

  | 密级 | Classification | 内部/保密/公开 | frontmatter `classification` 字段 |

  | 留存期 | Retention | 文档应保留多久 | frontmatter `retention` 字段 |

  | 来源追溯 | Provenance / Sources | 这份文档的信息来自哪里 | frontmatter `sources` 字段 |


  ### 2.5 AI 协作类


  | 大白话 | 行业术语 | 解释 | 关联文档 |

  |-------|---------|------|---------|

  | 多 AI 分工 | Multi-Agent Workflow | 多个 AI 各司其职协作 | ADR-0003 |

  | 发散思维模型 | Divergent / Brainstorming Model | 擅长产生多种想法的模型（Kimi、Grok、Gemini） | ADR-0003 |

  | 收敛精准模型 | Convergent / Precision Model | 擅长结构化、查错、立范式的模型（Opus） | ADR-0003 |

  | 批量操作模型 | Bulk Operation Model | 擅长机械批量任务的模型（Composer 2） | ADR-0003 |

  | 头脑风暴 | Brainstorming | 不限制格式的想法生成 | ADR-0003 |

  | 收口 / 定调 | Finalize / Structure / Review | 把发散结果整理成正式成品 | ADR-0003 |

  | 续接上下文 | Context Resume / Handoff | 新会话接续上一次会话的讨论 | `governance/ai/handoff-protocol.md` |

  | 伪 YAML / 格式踩坑 | Pseudo YAML / Format Corruption | AI 把 Markdown 语法错套到 YAML 上 | `governance/document/encoding-safety-standard.md` |


  ### 2.6 投资业务类（量化相关）


  | 大白话 | 行业术语 | 解释 | 关联文档 |

  |-------|---------|------|---------|

  | 数据、研究、模型、策略、组合、执行、报告 | Core Investment Value Chain | 量化投资的 7 步通用流程 | rationale-log R18 |

  | 因子 | Factor | 能预测股票收益的特征/指标 | ~~`docs/10_research_and_factor_lab/`~~（目录已不存在） |

  | 回测 | Backtest | 用历史数据验证策略 | |

  | 样本外测试 | Out-of-Sample Test / Walk-Forward | 用未参与调参的数据测试 | |

  | 压力测试 | Stress Test | 极端场景下的表现测试 | |

  | 再平衡 | Rebalancing | 定期调整组合权重 | |

  | 模型漂移 | Model Drift | 模型效果随时间变差的现象 | |

  | 执行滑点 | Execution Slippage | 下单价和实际成交价的差异 | |

  | 交易成本分析 | Transaction Cost Analysis (TCA) | 分析交易实际成本 | |


  ---


  ## 3. 反向索引：AI 术语 → 大白话


  当你看到 AI 说：


  | AI 说的 | 其实就是 |

  |--------|---------|

  | "这个符合 SSOT 原则" | 这个没做出双份 |

  | "应该走 canonicalization 流程" | 应该搬到正式区 |

  | "这是一份 ADR" | 这是记"为什么这么定"的凭证 |

  | "frontmatter schema" | 文档头的字段格式要求 |

  | "controlled vocabulary" | 只能从几个固定词里选 |

  | "append-only 机制" | 只能追加、不能改删 |

  | "supersedes / superseded" | 取代 / 被取代 |

  | "quality gate" | 卡点（过不去就别往下走） |

  | "health check" | 体检 |

  | "handoff" | 交接 |

  | "rationale log" | 推导过程的记录 |

  | "open questions register" | 还没想清楚的事的清单 |

  | "risk register" | 已经看到的风险清单 |

  | "roadmap / milestone" | 大目标 / 关卡 |

  | "IA (information architecture)" | 文件夹布局和命名 |

  | "provenance" | 来源追溯 |

  | "retention" | 保留多久 |

  | "classification" | 密级 |

  | "metadata contract" | 元数据字段约定 |

  | "divergent / convergent model" | 发散模型 / 收敛模型 |


  ---


  ## 4. 本表的维护规则


  ### 4.1 新增术语的时机


  - AI 第一次用的某术语，用户不认识 → 加一行

  - 讨论中自己发明的新概念 → 加一行（便于未来 AI 理解）

  - 看到的外部资料里频繁出现某术语 → 加一行


  ### 4.2 新增术语的字段


  每个术语至少有：


  - 大白话（用户日常说法）

  - 行业术语（英文原名 + 常见中文译名）

  - 解释（一句话说清）

  - 关联文档（哪份文档用到了）


  ### 4.3 争议术语


  如果一个术语在不同上下文有不同含义，**不要强行合并**，而是：


  - 分两行列出

  - 在"解释"栏标注使用上下文


  例如 `status`：

  - `status`（frontmatter 字段）= 文档成熟度状态

  - `status`（ADR §1 章节）= ADR 生命周期状态

  - `status`（任务）= 任务进度状态


  ### 4.4 升格路径


  本表未来可升格到：


  - `docs/00_governance/business-glossary.yaml`（规划中，尚未建立）

  - 机器可读版本 `docs/00_governance/glossary.yaml`（规划中，尚未建立）


  ---


