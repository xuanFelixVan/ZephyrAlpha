  - value: SR-11-7
    definition: "中国证监会《证券期货业数据安全管理与保护指引》"
    ai_consumption: "涉及中国境内证券期货数据处理的文件必须标注此标签。"
    ai_keywords: ["证监会", "数据安全", "SR-11-7", "中国证券"]
