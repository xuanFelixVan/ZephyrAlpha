    effective_date: "2023-01-01"

  - value: EU-AI-Act-Art12
    definition: "欧盟 AI 法案第 12 条——记录保存"
    ai_consumption: "涉及高风险 AI 系统的文件须标注此标签，确保记录保存义务。"
    ai_keywords: ["欧盟 AI 法案", "记录保存", "Art12", "EU AI Act"]
    jurisdiction: "欧盟"
    effective_date: "2024-08-01"

  - value: EU-AI-Act-Art14
    definition: "欧盟 AI 法案第 14 条——人工监督"
    ai_consumption: "涉及人工监督机制的文件须标注此标签。"
    ai_keywords: ["欧盟 AI 法案", "人工监督", "Art14", "human oversight"]
    jurisdiction: "欧盟"
    effective_date: "2024-08-01"

  - value: GDPR-Art22
    definition: "GDPR 第 22 条——自动化决策的限制"
    ai_consumption: "涉及自动化决策系统的文件须标注此标签，确保数据主体权利。"
    ai_keywords: ["GDPR", "自动化决策", "Art22", "数据主体权利"]
