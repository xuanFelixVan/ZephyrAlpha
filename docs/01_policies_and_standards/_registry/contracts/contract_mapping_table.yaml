module_id: DOM-GOV-001
schema_version: "1.0.0"
created: "2026-05-12"
last_updated: "2026-05-12"
description: "AS-CT-*/ME-CT-* 域契约 → CTR-* 层契约 映射表"

domain_contracts:
  alpha_signal_domain:
    domain_id: ALPHA-SIGNAL-DOMAIN-001
    blueprint: docs/03_modules/_alpha-signal-domain/blueprint.md
    contracts:
      - domain_contract_id: AS-CT-DATA-001
        direction: "L00→L02"
        description: "市场数据→因子引擎（OHLCV/orderbook/tick）"
        layer_contracts:
          - CTR-001
        status: Draft

      - domain_contract_id: AS-CT-FACTOR-001
        direction: "L02→L03"
        description: "因子数据帧（MultiIndex DataFrame: (timestamp, asset)×factor）"
        layer_contracts:
          - CTR-P1-015
        status: Draft

      - domain_contract_id: AS-CT-FACTOR-002
        direction: "L02 internal"
        description: "Code-Dedup-Engine→去重后的因子值（唯一source_key）"
        layer_contracts:
          - MOD-INF-005
        status: Draft

      - domain_contract_id: AS-CT-SIGNAL-001
        direction: "L03→L04"
        description: "信号数据帧→风控引擎"
        layer_contracts:
          - CTR-P1-015
          - CTR-008
        status: Draft

      - domain_contract_id: AS-CT-VMS-001
        direction: "L02+L03→VMS"
        description: "因子嵌入向量存储（8 collections: signal-embeddings）"
        layer_contracts:
          - MOD-INF-011
        status: Draft

  ml_experiment_domain:
    domain_id: ML-EXPERIMENT-DOMAIN-001
    blueprint: docs/03_modules/_ml-experiment-domain/blueprint.md
    contracts:
      - domain_contract_id: ME-CT-FEATURE-001
        direction: "VMS/KB→L11"
        description: "特征向量读取（ChromaDB collections: factor-signals, model-features）"
        layer_contracts:
          - MOD-INF-011
        status: Draft

      - domain_contract_id: ME-CT-TRAIN-001
        direction: "L11 internal"
        description: "训练Pipeline Gate：数据→训练→验证→Sanity→发布"
        layer_contracts:
          - CTR-P1-004
          - CTR-P1-005
        status: Draft

      - domain_contract_id: ME-CT-CHECKPOINT-001
        direction: "L11→L13"
        description: "检查点导入（MODEL_CHECKPOINTS→AB/Backtest Experiment）"
        layer_contracts:
          - CTR-011
        status: Draft

      - domain_contract_id: ME-CT-AB-001
        direction: "L13 internal"
        description: "AB实验全流程：config→traffic_split→gate[eval]→analyst→deploy/rollback"
        layer_contracts:
          - CTR-009
        status: Draft

      - domain_contract_id: ME-CT-BACKTEST-001
        direction: "L13 internal"
        description: "回测实验：ckpt→historical→PnL→Attribution→Report"
        layer_contracts:
          - CTR-010
          - CTR-P1-014
        status: Draft

      - domain_contract_id: ME-CT-SHADOW-001
        direction: "L13"
        description: "Shadow Mode：旁路预测→threshold→divergence alert→正式切流"
        layer_contracts:
          - CTR-009
        status: Draft

