module_id: MOD-GOVERNANCE
schema_version: "1.0.0"
created: "2026-05-12"
last_updated: "2026-05-12"
description: "AS-CT-*/ME-CT-* 域契约 → CTR-* 层契约 映射表"

domain_contracts:
  alpha_signal_domain:
    domain_id: ALPHA-SIGNAL-DOMAIN-001
    blueprint: docs/03_modules/_alpha-signal-domain/blueprint.md
    contracts:
      - domain_contract_id: AS-CT-DATA-001
        direction: "D_DATA→D_FACTOR"
        description: "市场数据→因子引擎（OHLCV/orderbook/tick）"
        layer_contracts:
          - CTR-001
        status: Draft

      - domain_contract_id: AS-CT-FACTOR-001
        direction: "L02→L03"
        description: "因子数据帧（MultiIndex DataFrame: (timestamp, asset)×factor）"
        layer_contracts:
          - CTR-P1-015
        status: Draft

      - domain_contract_id: AS-CT-FACTOR-002
        direction: "D_FACTOR internal"
        description: "Code-Dedup-Engine→去重后的因子值（唯一source_key）"
        layer_contracts:
          - MOD-INF-005
        status: Draft

      - domain_contract_id: AS-CT-SIGNAL-001
        direction: "D_SIGNAL→D_RISK"
        description: "信号数据帧→风控引擎"
        layer_contracts:
          - CTR-P1-015
          - CTR-008
        status: Draft

      - domain_contract_id: AS-CT-VMS-001
        direction: "D_FACTOR+D_SIGNAL→VMS"
        description: "因子嵌入向量存储（8 collections: signal-embeddings）"
        layer_contracts:
          - MOD-INF-011
        status: Draft

  ml_experiment_domain:
    domain_id: ML-EXPERIMENT-DOMAIN-001
    blueprint: docs/03_modules/_ml_experiment_domain/blueprint.md
    contracts:
      - domain_contract_id: ME-CT-FEATURE-001
        direction: "VMS/KB→D_ML_TRAIN"
        description: "特征向量读取（ChromaDB collections: factor-signals, model-features）"
        layer_contracts:
          - MOD-INF-011
        status: Draft

      - domain_contract_id: ME-CT-TRAIN-001
        direction: "D_ML_TRAIN internal"
        description: "训练Pipeline Gate：数据→训练→验证→Sanity→发布"
        layer_contracts:
          - CTR-P1-004
          - CTR-P1-005
        status: Draft

      - domain_contract_id: ME-CT-CHECKPOINT-001
        direction: "D_ML_TRAIN→实验"
        description: "检查点导入（MODEL_CHECKPOINTS→AB/Backtest Experiment）"
        layer_contracts:
          - CTR-011
        status: Draft

      - domain_contract_id: ME-CT-AB-001
        direction: "实验 internal"
        description: "AB实验全流程：config→traffic_split→gate[eval]→analyst→deploy/rollback"
        layer_contracts:
          - CTR-009
        status: Draft

      - domain_contract_id: ME-CT-BACKTEST-001
        direction: "实验 internal"
        description: "回测实验：ckpt→historical→PnL→Attribution→Report"
        layer_contracts:
          - CTR-010
          - CTR-P1-014
        status: Draft

      - domain_contract_id: ME-CT-SHADOW-001
        direction: "实验"
        description: "Shadow Mode：旁路预测→threshold→divergence alert→正式切流"
        layer_contracts:
          - CTR-009
        status: Draft

layer_contracts:
  - contract_id: CTR-001
    layer: data
    role: producer
    description: "NormalizedMarketData → D_FACTOR, D_SIGNAL, D_RESEARCH"
    domain_mapping: AS-CT-DATA-001

  - contract_id: CTR-TRACE-001
    layer: data
    role: producer
    description: "TraceContext 链头"
    domain_mapping: null

  - contract_id: CTR-004
    layer: pf_core
    role: producer
    description: "Order → D_EXECUTION_CORE"
    domain_mapping: null

  - contract_id: CTR-005
    layer: ex_core
    role: producer
    description: "Fill → D_REPORTING"
    domain_mapping: null

  - contract_id: CTR-006
    layer: ex_core
    role: producer
    description: "PositionSnapshot → D_RISK, D_REPORTING, D_ML_TRAIN"
    domain_mapping: null

  - contract_id: CTR-008
    layer: signal
    role: producer
    description: "SignalQualityMetrics → D_RISK, D_FRONTEND"
    domain_mapping: AS-CT-SIGNAL-001

  - contract_id: CTR-009
    layer: simulation
    role: producer
    description: "ExperimentConfig → D_ML_TRAIN ML Platform"
    domain_mapping: ME-CT-AB-001

  - contract_id: CTR-010
    layer: simulation
    role: producer
    description: "ExperimentMetric → D_RESEARCH Research"
    domain_mapping: ME-CT-BACKTEST-001

  - contract_id: CTR-011
    layer: simulation
    role: consumer
    description: "ModelCheckpoint ← D_ML_TRAIN ML Platform"
    domain_mapping: ME-CT-CHECKPOINT-001

  - contract_id: CTR-012
    layer: simulation
    role: producer
    description: "ExperimentArtifact → INF-012 Database"
    domain_mapping: null

  - contract_id: CTR-P1-003
    layer: signal
    role: producer
    description: "CapitalAllocationResult → D_PORTFOLIO_CORE"
    domain_mapping: null

  - contract_id: CTR-P1-004
    layer: ml_train
    role: producer
    description: "ModelServingRequest → D_SIGNAL, D_PORTFOLIO_CORE"
    domain_mapping: ME-CT-TRAIN-001

  - contract_id: CTR-P1-005
    layer: ml_train
    role: producer
    description: "ModelServingResponse → 推理响应"
    domain_mapping: ME-CT-TRAIN-001

  - contract_id: CTR-P1-006
    layer: pf_core
    role: producer
    description: "StrategyLifecycleEvent → D_REPORTING, D_COMPLIANCE"
    domain_mapping: null

  - contract_id: CTR-P1-009
    layer: reporting
    role: producer
    description: "PerformanceAttributionReport → D_FRONTEND, D_COMPLIANCE"
    domain_mapping: null

  - contract_id: CTR-P1-012
    layer: compliance
    role: both
    description: "ComplianceRule → D_RISK, D_EXECUTION_CORE, D_COMPLIANCE"
    domain_mapping: null

  - contract_id: CTR-P1-014
    layer: simulation
    role: producer
    description: "ExperimentResult → D_RESEARCH, D_ML_TRAIN"
    domain_mapping: ME-CT-BACKTEST-001

  - contract_id: CTR-P1-015
    layer: signal
    role: producer
    description: "SynthesizedSignal → D_RISK, D_PORTFOLIO_CORE"
    domain_mapping: AS-CT-FACTOR-001

  - contract_id: CTR-ERR-003
    layer: signal
    role: producer
    description: "SignalDegradationWarning → D_RISK, D_PORTFOLIO_CORE"
    domain_mapping: null

  - contract_id: EXT-DASHBOARD-FLE-001
    layer: frontend
    role: consumer
    description: "消费 FLE fitness Facade"
    domain_mapping: null
