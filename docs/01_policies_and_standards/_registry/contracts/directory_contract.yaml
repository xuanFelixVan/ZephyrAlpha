# 7. 废弃目录清单（Deprecated Directories）
# 来源：GitCommitGateway._DEPRECATED_DIRS（原硬编码，2026-06-30 迁入治本）
# ============================================================
# 显式禁止的目录前缀——与 global_forbidden 互补：
#   - global_forbidden 是"规则化禁止"（如"src/ 下禁止 .bak"，按扩展名/模式）
#   - deprecated_directories 是"目录级显式废弃"（整个目录已迁移他处，禁止新建任何文件）
# 双层防御（对标 GATE-DEPRECATED-DIR 设计，①② 层均已于 2026-06-30 修复）：
