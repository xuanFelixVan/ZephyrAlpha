# 3. 根目录白名单（Root Directory Whitelist）
# 来源：trae_047 §gov_eng_002_directory_mapping actions step 3
# ============================================================
# 根目录只允许以下文件存在，禁止白名单外的任何文件。
# 唯一豁免：docker-compose.yml/docker-compose.yaml（Docker 外部约定）

root_directory_whitelist:
  description: "根目录文件白名单——禁止白名单外的任何文件出现在项目根目录"
  files:
    - ".gitignore"
    - ".gitattributes"
    - ".editorconfig"
    - ".traeignore"
    - ".dockerignore"
    - ".env.example"
    - ".importlinter"
    - ".pre-commit-config.yaml"
    - "pyproject.toml"
    - "py.ini"
    - "requirements.txt"
    - "requirements-dev.txt"
    - "requirements-demo.txt"
    - "sitecustomize.py"
    - "Dockerfile"
    - "docker-compose.yml"
    - "docker-compose.yaml"
    - "MANIFEST.in"
    - "AGENTS.md"
    - "CONTRIBUTING.md"
    - "README.md"
    - "SECURITY.md"
    - "LICENSE"

# ============================================================
# 4. doc_type→目录交叉验证（Cross-Validation）
# 来源：doc_type_vocabulary.yaml values[].allowed_directories/forbidden_directories
# ============================================================
# doc_type→目录映射是 doc_type 的内在属性，保留在 doc_type_vocabulary.yaml。
# 本节不复制映射值，仅定义交叉验证规则。
# check_directory_contract.py 同时读取本契约和 doc_type_vocabulary.yaml 执行验证。

doc_type_directory_crosscheck:
  derived_from: "doc_type_vocabulary.yaml values[]"
  description: "doc_type 的 allowed_directories/forbidden_directories 由 doc_type_vocabulary.yaml 定义。本节提供目录侧交叉验证规则——文件所在目录必须与其 doc_type 的目录约束一致"

  validation_rules:
    - id: DCR-001
      name: "文件 doc_type 的 allowed_directories 包含文件所在目录"
      check: "file.doc_type.allowed_directories contains file.directory OR file.directory in temporary_zone OR file.directory in archive_zone OR file.directory in runtime_zone"
      severity: error
      note: "临时区（docs/_working/）、归档区（docs/_archive/）、运行时归档区（.runtime/）豁免此规则——临时区为过程性文档，归档区为历史遗留，运行时归档区为 neutral zone 非正式文档区，均不受 allowed_directories 硬约束"

    - id: DCR-002
      name: "文件 doc_type 的 forbidden_directories 不包含文件所在目录"
      check: "file.doc_type.forbidden_directories not contains file.directory"
      severity: error

    - id: DCR-003
      name: "永久区文件 ttl 必须=permanent"
      check: "if file.directory in directory_zones.permanent.paths then file.ttl == permanent"
      severity: error
      note: "与 ttl_vocabulary.yaml decision_tree Q3 一致——永久区路径→permanent"

    - id: DCR-004
      name: "临时区文件 ttl=task_bound"
      check: "if file.directory in directory_zones.temporary.paths then file.ttl == task_bound"
      severity: warning
      note: "警告而非阻断——临时区可能有正在迁移的永久文件"

    - id: DCR-005
      name: "文件扩展名在所在目录的 allowed 清单内"
      check: "file.extension in directory_extensions[path].allowed OR file.extension in directory_extensions[path].allowed_exceptions"
      severity: error

    - id: DCR-006
      name: "文件扩展名不在所在目录的 forbidden 清单内"
      check: "file.extension not in directory_extensions[path].forbidden"
      severity: error

    - id: DCR-007
      name: "根目录文件在白名单内"
      check: "if file.directory == project_root then file.name in root_directory_whitelist.files"
      severity: error

