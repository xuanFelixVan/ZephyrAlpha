# ============================================================
# ZephyrAlpha 架构合规契约
# ============================================================
#
# 用途：CI / pre-commit 消费的机器可验证规则。
# 定义三要素：目录 Schema（文件放哪）、字段定义（合法值）、验证规则（绝不能破）。
#
# 对标标准：
#   - OpenAPI 3.1：契约先行（先定义规则，再验证合规）
#   - K8s validation：声明式约束 + 条件必填 + 枚举校验
#   - Terraform Provider Registry：Schema → Validate → Pass/Fail
#   - PS-STD-001 §2.6 + §2.8：全量 frontmatter 一致性约束
#
# 依赖（本契约引用的真源文件）：
#   - vocabularies/doc_type_vocabulary.yaml   → doc_type 10 值（v3.0.0，canonical SSoT，全项目唯一真源）
#   - vocabularies/rule_form_vocabulary.yaml  → rule_form 4 值
#   - vocabularies/status_vocabulary.yaml    → status 3 值
#   - PS-STD-001 §3.2                      → doc_type 10 值（v3.0.0，引用 doc_type_vocabulary.yaml 真源）
#   - PS-STD-001 trae_043_meta_rule_metadata.yaml  → 全量字段定义 + 约束真源
# ============================================================

# ============================================================
# 0. 全局元数据
# ============================================================
contract_version: "2.2.0"
last_updated: "2026-05-03"
total_vr_rules: 11
contract_scope: "ZephyrAlpha 全项目所有目录下的 .md 和 .yaml 文件（与 PS-STD-001 §1.3 一致）——02_enterprise_architecture/ / 03_modules/ / 03_modules/_b_track_interfaces/ / _working/audit/ / archive/ 均纳入扫描范围"
scope_note: "目录 Schema（§1）当前仅定义 01_policies_and_standards/ 的结构规则。其他目录的目录级约束留待后续版本补充。VR 规则通过 tier 字段区分生效范围"

schema_version: "1.2.0"
doc_type: gate
module_id: PS-CTR-001
version: "1.2.0"
title: "Architecture Compliance Contract"
status: active
ttl: permanent
depends_on:
  - target: PS-STD-001
    at: "§2.5 + §2.6 + §2.8 + §3.2 + §4.1"
    why: "全量字段定义 + 跨字段约束 + doc_type/rule_form/status 受控词表真源——所有 vocabularies/ 文件均派生自 PS-STD-001"

# ============================================================
# 1. 目录 Schema
# 来源：PS-STD-001 §3.2.1 + §3.3
# ============================================================

directory_schema:
  root: "docs/01_policies_and_standards/"

  # subdir_schemas（原 allowed_directories，2026-06-30 重命名——消除与 doc_type_vocabulary.yaml
  # 的 allowed_directories 同名异义认知陷阱：此处是"docs/01_policies_and_standards/ 下允许的
  # 子目录结构 schema"，doc_type_vocabulary 的是"doc_type 允许存放的目录路径列表"）
  subdir_schemas:
    governance:
      allowed_subdirs: [document, ai, task, security, compliance, architecture, data, module]
      allowed_doc_types: [policy, register, index]
      forbidden_doc_types: []  # v3.1.0: operational_rule 合并入 policy；governance/ 禁止 procedural policy 由 VR-008 约束
      description: "声明式规则——定义'必须/禁止/条件'（governance/ 下 policy 必须 declarative，见 VR-008）"

    operational:
      allowed_subdirs: [vibe_coding, devops, migration]
      allowed_doc_types: [policy]  # v3.1.0: operational_rule 合并入 policy；operational/ 下 policy 必须 procedural，见 VR-009
      forbidden_doc_types: []
      description: "过程式规则——定义'如何做'的步骤（v3.1.0: 原 operational_rule 语义由 procedural policy 承载）"

    domains:
      allowed_subdirs_pattern: "{domain_name}"
      allowed_doc_types: [policy]  # v3.1.0: operational_rule 合并入 policy
      subdirs_must_have: [governance, operational]
      description: "层域特定规则——每个层域有 governance/ + operational/ 子目录"

    meta:
      allowed_doc_types: [register, index]
      description: "元标准——定义规则的规则"

    templates:
      allowed_doc_types: [template]
      description: "模板——可复用的文档结构骨架"

    _registry:
      allowed_subdirs: [contracts, catalogs, vocabularies, schemas]
      allowed_doc_types: [register, vocabulary, gate]
      description: "注册表——结构化数据清单 + Schema 定义"

# ============================================================
# 2. Frontmatter Schema
# 来源：PS-STD-001 §2.5 + §2.6
# ============================================================

frontmatter_schema:
  # 必填阶段说明（对齐 PS-STD-001 §2.2）：
  #   draft    = 7 字段——创建即需填写
  #   active   = 18 字段——生效前补齐
  #   deprecated_only = 仅废弃时需要（superseded_by）
  required_fields:
    - name: module_id
      format: "^[A-Z]+(-[A-Z]+)?-[A-Z]+-[0-9]{3,4}$"
      description: "模块唯一标识，格式：DOMAIN-[SUBDOMAIN-]TYPE-NNNN（与 VR-001 对齐）"
      stage: draft

    - name: title
      format: ".+"
      description: "文件中文标题"
      stage: draft

    - name: doc_type
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 doc_type_vocabulary.yaml 动态加载（v3.0.0，10 值）
      description: "文档类型，受控词表（canonical SSoT: doc_type_vocabulary.yaml）"
      derived_from: "_registry/vocabularies/doc_type_vocabulary.yaml"
      stage: draft

    - name: status
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 status_vocabulary.yaml 动态加载（3 值）
      derived_from: "_registry/vocabularies/status_vocabulary.yaml"
      description: "文档状态，受控词表（PS-STD-001 §4.1：3 值，archived 已否决）"
      stage: draft

    - name: version
      format: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
      description: "语义化版本号"
      stage: draft

    - name: layer
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 layer_vocabulary.yaml 动态加载
      description: "架构层归属——16 值（canonical SSoT: layer_vocabulary.yaml）"
      derived_from: "_registry/vocabularies/layer_vocabulary.yaml"
      stage: active

    - name: owner
      description: "文件负责人"
      stage: draft

    - name: classification
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 classification_vocabulary.yaml 动态加载
      description: "文件密级（3 值：public/internal/confidential，canonical SSoT: classification_vocabulary.yaml）"
      derived_from: "_registry/vocabularies/classification_vocabulary.yaml"
      stage: active

    - name: language
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 language_vocabulary.yaml 动态加载（3 值）
      description: "文件语言"
      derived_from: "_registry/vocabularies/language_vocabulary.yaml"
      stage: active

    - name: created_by
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 created_by_vocabulary.yaml 动态加载（3 值）
      description: "创建者类型"
      derived_from: "_registry/vocabularies/created_by_vocabulary.yaml"
      stage: active

    - name: date
      format: "^\\d{4}-\\d{2}-\\d{2}$"
      description: "创建/更新日期"
      stage: draft

    - name: ttl
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 ttl_vocabulary.yaml 动态加载（2 值二元）
      derived_from: "_registry/vocabularies/ttl_vocabulary.yaml"
      description: "文件保留期限（PS-STD-001 §6：2 值二元 v2.0.0）"
      stage: active

    - name: summary
      description: "一句话摘要"
      stage: active

    - name: tags
      type: list
      description: "标签列表"
      stage: active

    - name: rule_form
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 rule_form_vocabulary.yaml 动态加载（4 值）
      description: "规则表达形式"
      derived_from: "_registry/vocabularies/rule_form_vocabulary.yaml"
      stage: active

    - name: scope
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 scope_vocabulary.yaml 动态加载（4 值）
      description: "规则作用范围"
      derived_from: "_registry/vocabularies/scope_vocabulary.yaml"
      stage: active

    - name: stability
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 stability_vocabulary.yaml 动态加载（4 值）
      description: "规则稳定性（PS-STD-001 §2.5：4 值）"
      derived_from: "_registry/vocabularies/stability_vocabulary.yaml"
      stage: active

    - name: verifiability
      allowed_values: "dynamic_from_ssot"  # 禁止内联复制——值集从 verifiability_vocabulary.yaml 动态加载（3 值）
      description: "规则可验证性"
      derived_from: "_registry/vocabularies/verifiability_vocabulary.yaml"
      stage: active

  conditional_required:
    - name: superseded_by
      description: "替代文件路径——status=deprecated 时必填"
      stage: deprecated_only

# ============================================================
# 3. 验证规则（跨文件冲突 + 条件违规）
# 来源：PS-STD-001 §2.8 + §3.6 + §3.2.1
#
# tier 取值说明（控制 CI 扫描时每条规则对哪些目录生效）：
#   project_wide  = 全项目所有目录（02_enterprise_architecture/ 等 9 个目录全部扫描）
#   directory_scoped = 仅 01_policies_and_standards/ 目录（等目录 Schema 补全后扩展）
# ============================================================

validation_rules:
  - id: VR-001
    tier: project_wide
    name: "module_id 格式正确"
    check: "module_id matches ^[A-Z]+(-[A-Z]+)?-[A-Z]+-[0-9]{3,4}$"
    severity: error
    source: "PS-STD-001 §5"

  - id: VR-002
    tier: directory_scoped
    name: "doc_type 在对应目录的受控词表中"
    check: "doc_type in doc_type_vocabulary.yaml values (v3.0.0, 10 values); 废弃值见 deprecated_values"
    severity: error
    source: "PS-STD-001 §3.2"

  - id: VR-003
    tier: project_wide
    name: "status 在受控词表中"
    check: "status in status_vocabulary.yaml values (3 值); 废弃值见 deprecated_values"
    severity: error
    source: "PS-STD-001 §4.1"

  - id: VR-004
    tier: directory_scoped
    name: "doc_type 与 rule_form 一致"
    check: "doc_type→rule_form mapping defined in doc_type_vocabulary.yaml per-value (v3.0.0, 10 values); 废弃值的映射见 deprecated_values.migrated_to"
    severity: error
    source: "PS-STD-001 §2.8 #1 + §2.6 #3~#7"

  - id: VR-005
    tier: project_wide
    name: "必填字段齐全（分阶段闸门）"
    check: "all required_fields present and non-empty. 分阶段闸门（PS-STD-001 §2.2）：draft=7 字段 / active=7+11=18 字段 / deprecated=7+superseded_by。本条规则按 status 对应阶段判断——draft 不要求 rule_form/scope/stability 等 active 专属字段"
    severity: error
    source: "PS-STD-001 §2.5 + §2.2"

  - id: VR-006
    tier: project_wide
    name: "deprecated 文件必须有 superseded_by"
    check: "if status=deprecated then superseded_by must be non-empty"
    severity: warning
    source: "PS-STD-009 §2.1"

  - id: VR-007
    tier: directory_scoped
    name: "文件在正确的目录下（01_policies_and_standards/）"
    check: "file path matches directory_schema rules"
    severity: error
    source: "PS-STD-001 §3.2.1 + §3.3"

  - id: VR-008
    tier: directory_scoped
    name: "governance/ 下 policy 必须为 declarative（禁止 procedural）"
    check: "files under governance/ with doc_type=policy must have rule_form=declarative"
    severity: error
    source: "PS-STD-001 §3.2.1（v3.1.0 重新设计：operational_rule 合并入 policy 后，governance/ 只放声明式规则）"

  - id: VR-009
    tier: directory_scoped
    name: "operational/ 下 policy 必须为 procedural（禁止 declarative）"
    check: "files under operational/ with doc_type=policy must have rule_form=procedural"
    severity: error
    source: "PS-STD-001 §3.2.1（v3.1.0 重新设计：operational_rule 合并入 policy 后，operational/ 只放过程式规则）"

  - id: VR-010
    tier: project_wide
    name: "scope=layer 时 layer 不能是 cross_layer"
    check: "if scope=layer then layer != cross_layer"
    severity: warning
    source: "PS-STD-001 §2.8 #5"

  - id: VR-011
    tier: project_wide
    name: "procedural policy 必须可验证（不能是 inspection）"
    check: "if rule_form=procedural then verifiability != inspection"
    severity: error
    source: "PS-STD-001 §2.8 #6（v3.1.0 重新设计：operational_rule 合并入 policy 后，可验证性约束改为按 rule_form=procedural 触发）"
