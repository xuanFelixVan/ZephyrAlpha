description: >-
  R5 人机门位模型化落地（#ARCH-310，AI 原生治理评审五裁定之五，2026-09-12 Owner 批准全面开工）。
  将事实上的 human-gate 惯例（Owner 晨审/裁定/放行）注册表化：按功能域给出风险分级
  （high/medium/low）与对应门禁强度、human-gate 位。100% AI 开发场景下，AI 冷启动
  查询本表即知"这个域动什么需要 Owner 门位"，无需撞门后才知道。

  分级模型（评审 §五 R5）：
  - high   交易核心/资金数据写入/治理与门禁自身/注册表真源——合入 dev 须 Owner 放行位
  - medium 因子/信号/回测/分析/管线——全自动门禁，行为变更须 commit message 声明
  - low    文档/派生缓存/前端视觉/测试工具——全自动，兜底默认级

  默认兜底：未显式列出的 domain 一律 low（fail-open 分级、fail-closed 门禁——
  门禁强度由 gate 体系独立保证，本表只决定人机门位，不放松任何既有 gate）。

  维护策略：
  - 新域默认 low；升 high/medium 须 Owner 裁定登记（ruling_registry 关联）
  - human_gate 位变更（新增/退役）须 Owner 签字，本表 entries 同 commit 原子落库
  - 新鲜度由 tests/governance/test_risk_tier_registry.py 机械校验
entry_schema:
  domain: string (required, unique) — functional_domain_registry 的 domain 键（D_XXX）
  tier: string (required) — high | medium | low
  rationale: string (required) — 分级理由（一句话）
  human_gate: list[string] — 触发 Owner 门位的动作清单（仅 high 必填）
default_tier: low
tiers:
  high:
    gate_policy: 全量门禁+human_gate 位全生效
    human_gate: &high_human_gate
      - 首次施工转 production（对齐 depgraph design_maturity 流转 Owner 核验）
      - 注册表/真源条目删除（净删行）
      - 门禁 flag 出厂默认翻转（宪章 B-007 production 行为变更窗口）
      - 资金数据破坏性操作（RULE-DATA-OPS 三步验证前置）
  medium:
    gate_policy: 全量门禁+行为变更 message 声明
    human_gate: []
  low:
    gate_policy: 标准门禁
    human_gate: []
domain_tiers:
  # ── high：交易核心与资金路径 ──
  - domain: D_EX_CORE
    tier: high
    rationale: 实盘执行引擎/订单状态机，资金安全直接承载
    human_gate: *high_human_gate
  - domain: D_POSITION
    tier: high
    rationale: 持仓与 T0/T1 可卖判定，错误直接造成资金损失
    human_gate: *high_human_gate
  - domain: D_RISK
    tier: high
    rationale: 风控限额/回撤清算守门，错误=风控失效
    human_gate: *high_human_gate
  - domain: D_TRADING
