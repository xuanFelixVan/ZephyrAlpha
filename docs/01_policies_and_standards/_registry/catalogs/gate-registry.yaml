# ============================================================================
# 门禁类型枚举
# ============================================================================
_schema:
  gate_categories:
    pre_commit:  "Git pre-commit hooks——提交前自动检查"
    kms_pipeline: "KMS 知识管道阶段门禁——G1~G5 管道闸门"
    architecture_review: "架构评审门禁——变更前人工评审"
    admission: "准入门禁——模块/因子/文件进入项目前的筛选"
    vibe_coding: "Vibe Coding 会话门禁——AI 开始操作前的检查"

  severity_levels:
    P0: "硬阻断——不通过则禁止继续"
    P1: "软警告——通过但记录警告"
    P2: "提示——仅记录，不影响通过"

  failure_actions:
    block: "阻塞操作——强制修复后才能继续"
    warn: "仅警告——不影响继续，记入日志"
    reject: "拒绝——变更回退或任务保持 PENDING"
    flag: "标记——人工审核后决定"

# ============================================================================
# 门禁登记
#
# 字段说明:
#   gate_id           门禁唯一 ID
#   name              门禁名称
#   category          门禁类型（见 _schema.gate_categories）
#   trigger           触发时机
#   executor          执行者（pre-commit / GateEngine / 人工评审 / 准入策略）
#   check_items       检查项数量
#   severity          最高严重级别（P0/P1/P2）
#   on_failure        失败后的动作（见 _schema.failure_actions）
#   script_path       关联脚本路径（如有）
#   policy_file       关联策略文件
#   status            门禁状态: active / draft / deprecated
#   adr_ref           关联 ADR
#   note              补充说明
# ============================================================================

