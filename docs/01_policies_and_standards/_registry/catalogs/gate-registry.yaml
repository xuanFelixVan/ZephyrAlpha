# 门禁分类:
#   1. Pre-commit GATE（提交前检查——.pre-commit-config.yaml）: 11 个
#   2. KMS Pipeline GATE（知识管道阶段门禁——gate_engine.py）: 5 个
#   3. Architecture Review GATE（架构评审门禁——architecture-review-policy.md）: 5 个
#   4. Admission GATE（准入门禁——module/factor/file 准入）: 3 个
#   5. Vibe Coding GATE（会话开始前检查——vibe-coding-gate-checklist.md）: 12 个检查项
#
# 与 gate-strategy-standard.md 的关系:
#   - gate-strategy-standard.md 定义 5 级 KMS 门禁的详细策略
#   - 本登记表登记所有门禁（不只 KMS 管道）的 ID 和元数据
# ============================================================================

