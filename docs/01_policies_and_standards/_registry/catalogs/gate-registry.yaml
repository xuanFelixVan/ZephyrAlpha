#       + Google SRE Error Budget & Gates（每次发布前经过预算门禁）
#       + AWS Well-Architected Framework → Review Gates（每条支柱有对应门禁）
#       + OWASP SAMM → Security Gates（安全门禁嵌入 SDLC）
#       + Cursor Rules → pre-commit hooks（Vibe Coding 社区实践）
#
