# ============================================================================
# ADR 状态枚举
# ============================================================================
_schema:
  adr_status_values:
    proposed:    "草稿中——放在外部开发工作区，尚未拍板"
    accepted:    "已拍板——放在 adr/ 目录，生效中"
    superseded:  "被新 ADR 取代——原文保留，superseded_by 指向新 ADR"
    deprecated:  "已废弃但未被取代——极少使用"
    skipped:     "跳号（空号）——编号被分配但未使用，不可复用"
    reserved:    "保留号——有意识留空，预备未来使用"

