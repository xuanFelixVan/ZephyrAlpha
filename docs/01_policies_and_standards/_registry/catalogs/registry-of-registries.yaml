changelog:
  - version: "1.0.0"
    date: "2026-05-02"
    changes:
      - "初始创建——登记 2 个登记表 + 6 条跨表一致性规则"
      - "CR-001~006 覆盖 version / module_id / layer / status / priority / generation"
      - "SSoT 归属原则：第一手来源优先（物理文件 > 登记表）"
      - "v1.0.1: 新增 GOV-MOD-007 多登记表同步标准的交叉引用说明"
