module_id: MOD-GOVERNANCE
schema_version: "1.0"
registry_id: REG-DATAFLOW-001
name: 数据流图注册表
description: >
  数据流图（dataflowgraph）唯一真源（SSoT）。登记所有数据流节点（Dataset/Job）与边（data_flow）。
  与 depgraph（依赖图）正交：depgraph 表达"谁依赖谁"（模块依赖），dataflowgraph 表达"数据从哪流到哪"（数据流向）。
  通过 Job.source_code_ref 引用 depgraph 模块 path，建立跨图关联（不合并，各自独立演化）。
  ARCH-051 裁定建立，治本"跨层数据流无中央真源、靠 cross_layer_contracts.yaml flow 字段+散落各模块隐式假设推断"的病根。
  对齐业界标准 OpenLineage/Marquez（Dataset/Job/Run 三实体模型）。
owner: MOD-INF-037
tier: tier_1_governance
status: active
version: 1.0.0
created: '2026-07-06'
last_updated: '2026-07-06'
related_arch: '#ARCH-051'

# ============================================================
# 数据流图模型说明（对齐 OpenLineage/Marquez）
# ============================================================
# Dataset：数据集节点（数据载体，如 market_data.tick）
#   - scope=production：生产数据流（引用 CTR 契约）
#   - scope=backtest_internal：回测内部数据流（physical_type 指向具体类，contract_ref=NULL）
# Job：数据变换作业节点（数据加工，如 compute_value_factor）
#   - source_code_ref 引用 depgraph 模块 path（跨图关联）
# Run：Job 的运行实例（Phase 2 扩展，本文件不登记 Run，Run 由运行时生成）
# Edge：数据流边（edge_type: push/pull/sync/async/event_driven）
#   - Dataset→Job：消费（Job 读取 Dataset 作为输入）
#   - Job→Dataset：产出（Job 写入 Dataset 作为输出）

unique_key:
- datasets.dataset_id
- jobs.job_id

# ============================================================
# Dataset 节点 schema
# ============================================================
dataset_schema:
  dataset_id: str          # DS-NNN
  entity_name: str         # 命名空间.名称（如 market_data.tick）
  entity_type: str         # dataset（固定值）
  scope: str               # production | backtest_internal
  contract_ref: str        # (可选) CTR-ID，回测内部为 NULL
  physical_type: str       # 物理实现引用（如 src/.../market_data.py::NormalizedMarketData）
  produced_by_job: str     # 产出该 Dataset 的 Job ID（JOB-NNN）
  consumed_by_jobs: list   # 消费该 Dataset 的 Job ID 列表
  domain_id: str           # 所属域（D_MKT_DATA/D_FACTOR/...）
  pit_policy: str          # strict | loose | none（PIT 铁律适用性）
  format_summary: str      # 数据格式摘要（人类可读）
  valid_since: str          # 数据有效起始日期

# ============================================================
# Job 节点 schema
# ============================================================
job_schema:
  job_id: str              # JOB-NNN
  job_name: str            # 命名空间.名称（如 ingest.ifind_kline）
  entity_type: str         # job（固定值）
  scope: str               # production | backtest_internal
  source_code_ref: str     # depgraph 模块 path（跨图关联，如 src/zephyr/data/ingest.py）
  trigger_type: str        # event_driven | scheduled | manual | stream
  run_context: str         # 运行上下文（如 production / backtest_daily / backtest_tick）
  inputs: list             # 输入 Dataset ID 列表
  outputs: list            # 输出 Dataset ID 列表
  pit_relevance: str       # PIT 相关性（strict/loose/none）
  description: str         # 作业描述

# ============================================================
# Datasets（14 个核心数据集）
# ============================================================
datasets:
