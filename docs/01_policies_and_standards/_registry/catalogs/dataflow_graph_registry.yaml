# ============================================================
# Jobs（13 个核心数据变换作业）
# ============================================================
jobs:
  # --- 生产数据流 Job（scope=production） ---

  - job_id: JOB-001
    job_name: ingest.ifind_kline
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/data/ingest_ifind.py
    trigger_type: scheduled
    run_context: production
    inputs: []
    outputs: [DS-001]
    pit_relevance: strict
    description: "从同花顺iFind THS_RQ接口采集K线/Tick行情数据，写入DS-001 market_data.tick"

  - job_id: JOB-002
    job_name: aggregate.ohlc_bar
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/data/aggregator.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-001]
    outputs: [DS-002]
    pit_relevance: strict
    description: "将Tick数据聚合为OHLC K线（1m/5m/日线），产出DS-002 market_data.ohlc_bar"

  - job_id: JOB-003
    job_name: compute.value_factor
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/factor/value_factor.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-002]
    outputs: [DS-003]
    pit_relevance: strict
    description: "计算价值因子（PE/PB/股息率等），产出DS-003 factor.value_factor"

  - job_id: JOB-004
    job_name: compute.momentum_20d
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/factor/momentum.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-002]
    outputs: [DS-004]
    pit_relevance: strict
    description: "计算20日动量因子（收益率/相对强度），产出DS-004 factor.momentum_20d"

  - job_id: JOB-005
    job_name: synthesize.signal
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/signal_ashare/synthesizer.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-003, DS-004]
    outputs: [DS-005]
    pit_relevance: strict
    description: "合成多因子信号（加权/截面排名/置信度），产出DS-005 signal.composite"

  - job_id: JOB-006
    job_name: check.risk_limits
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/risk/risk_checker.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-005]
    outputs: [DS-006]
    pit_relevance: strict
    description: "风险限额检查（持仓/回撤/暴露度），产出DS-006 risk.limits"

  - job_id: JOB-007
    job_name: generate.order
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/pf_core/order_generator.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-005, DS-006]
    outputs: [DS-007]
    pit_relevance: strict
    description: "根据信号+风险限额生成目标订单，产出DS-007 order.target"

  - job_id: JOB-008
    job_name: execute.order
    entity_type: job
    scope: production
    source_code_ref: src/zephyr/ex_core/executor.py
    trigger_type: event_driven
    run_context: production
    inputs: [DS-007]
    outputs: [DS-008, DS-009]
    pit_relevance: strict
    description: "执行订单（实盘/模拟），产出DS-008 fill.executed + DS-009 position.snapshot"

  # --- 回测内部数据流 Job（scope=backtest_internal） ---

  - job_id: JOB-009
    job_name: backtest.replay_ticks
    entity_type: job
    scope: backtest_internal
    source_code_ref: src/zephyr/backtest/tick_replay.py
    trigger_type: manual
    run_context: backtest_tick
    inputs: [DS-001]
    outputs: [DS-011]
    pit_relevance: strict
    description: "历史Tick重放（从DS-001读取历史tick，按时间顺序重放），产出DS-011 backtest.tick_event"

  - job_id: JOB-010
    job_name: backtest.run_event_driven
    entity_type: job
    scope: backtest_internal
    source_code_ref: src/zephyr/backtest/event_engine.py
    trigger_type: event_driven
    run_context: backtest_tick
    inputs: [DS-011]
    outputs: [DS-012]
    pit_relevance: strict
    description: "事件驱动回测引擎（消费tick事件，运行策略生成目标权重），产出DS-012 backtest.target_weights"

  - job_id: JOB-011
    job_name: backtest.match_fills
    entity_type: job
    scope: backtest_internal
    source_code_ref: src/zephyr/backtest/matching_logic.py
    trigger_type: event_driven
    run_context: backtest_tick
    inputs: [DS-012]
    outputs: [DS-013]
    pit_relevance: strict
    description: "回测撮合引擎（根据目标权重模拟成交，含滑点/手续费），产出DS-013 backtest.fills"

  - job_id: JOB-012
    job_name: backtest.update_portfolio
    entity_type: job
    scope: backtest_internal
    source_code_ref: src/zephyr/backtest/portfolio.py
    trigger_type: event_driven
    run_context: backtest_tick
    inputs: [DS-013]
    outputs: [DS-014]
    pit_relevance: strict
    description: "回测组合更新（根据成交更新持仓/现金/净值），产出DS-014 backtest.nav_series"

  - job_id: JOB-013
    job_name: backtest.calc_metrics
    entity_type: job
    scope: backtest_internal
    source_code_ref: src/zephyr/backtest/metrics.py
    trigger_type: manual
    run_context: backtest_tick
    inputs: [DS-014]
    outputs: [DS-010]
    pit_relevance: strict
    description: "回测指标计算（Sharpe/MaxDrawdown/胜率等，含DSR修正+PIT校验），产出DS-010 backtest.result"

# ============================================================
# 数据流边（edges，由 datasets 的 produced_by_job/consumed_by_jobs 派生）
# ============================================================
# 边类型说明：
#   - Job→Dataset：产出（produces），edge_type=push
#   - Dataset→Job：消费（consumes），edge_type=pull
# edges 由 sync_dataflow_registry() 自动派生写入 dataflow_edges 表，无需手工登记
# 未来扩展：event_driven/sync/async 边类型（Phase 3 运行时 instrumentation）
edges_note: >
  数据流边由 Dataset 的 produced_by_job/consumed_by_jobs 字段派生，无需手工维护。
  sync_dataflow_registry() 读取 datasets/jobs 后自动生成 edges 写入 dataflow_edges 表。
  边类型（edge_type）枚举：push（Job→Dataset 产出）/ pull（Dataset→Job 消费）/
  sync（同步调用）/ async（异步消息）/ event_driven（事件驱动）。
  Phase 1 仅生成 push/pull 两类；Phase 3 运行时 instrumentation 补充 sync/async/event_driven。
