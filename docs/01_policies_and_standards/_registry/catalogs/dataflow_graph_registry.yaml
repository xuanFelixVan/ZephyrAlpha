module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '1.0'
registry_id: REG-DATAFLOW-001
name: 数据流图注册表
description: '数据流图（dataflowgraph）唯一真源（SSoT）。登记所有数据流节点（Dataset/Job）与边（data_flow）。 与 depgraph（依赖图）正交：depgraph 表达"谁依赖谁"（模块依赖），dataflowgraph
  表达"数据从哪流到哪"（数据流向）。 通过 Job.source_code_ref 引用 depgraph 模块 path，建立跨图关联（不合并，各自独立演化）。 ARCH-051 裁定建立，治本"跨层数据流无中央真源、靠 cross_layer_contracts.yaml
  flow 字段+散落各模块隐式假设推断"的病根。 对齐业界标准 OpenLineage/Marquez（Dataset/Job/Run 三实体模型）。

  '
owner: MOD-INF-037
tier: tier_1_governance
status: active
version: 1.0.1
created: '2026-07-06'
last_updated: '2026-08-17'
# v1.0.1 changelog(2026-08-17, AI-REGF-001): 13 条 jobs.source_code_ref 存量锚点漂移修复（2026-07-06 快照遗留，tracker #12；迁移类 6 条+功能继任类 7 条，均经实码核验；新库 data_asset_registry 对应 13 jobs 为 candidate 设计态 code_path=None 不受影响）
related_arch: '#ARCH-051'
unique_key:
- datasets.dataset_id
- jobs.job_id
dataset_schema:
  dataset_id: str
  entity_name: str
  entity_type: str
  scope: str
  contract_ref: str
  physical_type: str
  produced_by_job: str
  consumed_by_jobs: list
  domain_id: str
  pit_policy: str
  format_summary: str
  valid_since: str
  module_id: str
  design_maturity: str
  # v1.25.0 新增字段（对标 Assay PIT 正确回测引擎 as_of_date 字段语义契约）
  as_of_date_semantics: str       # eod_bar/execution_date/declaration_date/ex_date/universe_snapshot
                                  # eod_bar=收盘价当日可得（Prices）
                                  # execution_date=除权日生效（Splits）
                                  # declaration_date=公告日（Dividends，fallback 除权日，公告日≠除权日）
                                  # ex_date=除权日
                                  # universe_snapshot=时点成分（Universe，formation date 当下可得）
                                  # 复权价用后复权（backward-only）避免前瞻偏差
  # v1.26.0 新增字段（对标 NannyML 标签延迟分层监控）
  label_delay_days: int           # 标签可用延迟天数（财报90天/公告1天/Tick 0天），NannyML CBPE 估计须按延迟分层
  drift_detector: str             # none/evidently/nannyml/alibi_detect（漂移检测器，MVP 填 none，实盘后启用）
job_schema:
  job_id: str
  job_name: str
  entity_type: str
  scope: str
  source_code_ref: str
  trigger_type: str
  run_context: str
  inputs: list
  outputs: list
  pit_relevance: str
  description: str
  module_id: str
  design_maturity: str
