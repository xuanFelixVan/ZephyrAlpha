edges_note: '数据流边由 Dataset 的 produced_by_job/consumed_by_jobs 字段派生，无需手工维护。 sync_dataflow_registry() 读取 datasets/jobs 后自动生成
  edges 写入 dataflow_edges 表。 边类型（edge_type）枚举：push（Job→Dataset 产出）/ pull（Dataset→Job 消费）/ sync（同步调用）/ async（异步消息）/ event_driven（事件驱动）。
  Phase 1 仅生成 push/pull 两类；Phase 3 运行时 instrumentation 补充 sync/async/event_driven。

  '
