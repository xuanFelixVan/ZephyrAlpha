name: 数据流图注册表
description: '数据流图（dataflowgraph）唯一真源（SSoT）。登记所有数据流节点（Dataset/Job）与边（data_flow）。 与 depgraph（依赖图）正交：depgraph 表达"谁依赖谁"（模块依赖），dataflowgraph
  表达"数据从哪流到哪"（数据流向）。 通过 Job.source_code_ref 引用 depgraph 模块 path，建立跨图关联（不合并，各自独立演化）。 ARCH-051 裁定建立，治本"跨层数据流无中央真源、靠 cross_layer_contracts.yaml
  flow 字段+散落各模块隐式假设推断"的病根。 对齐业界标准 OpenLineage/Marquez（Dataset/Job/Run 三实体模型）。

  '
