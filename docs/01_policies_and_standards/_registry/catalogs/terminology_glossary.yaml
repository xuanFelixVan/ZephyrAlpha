module_id: REG-TERMINOLOGY-001
ttl: permanent
title: 架构文档术语词汇表（中英对照真源）
doc_type: register
registry_id: REG-TERMINOLOGY-001
name: 架构文档术语词汇表
description: |
  架构文档生成器共享的中文术语翻译真源（英文→中文）。SSoT 真源分类铁律（TRAE-062）：
  词汇表属规则数据 → 真源是本 YAML 文件，生成器通过 _shared/terminology_loader.py 共享读取，
  禁止在生成器代码硬编码中文字典（domain_name_mapping.py 的 DOMAIN_NAME_ZH 测试域 fallback 例外）。

  与 functional_domain_registry.yaml 的关系：
  - functional_domain_registry.yaml 的 domain_name_zh 是功能域规范名（D_XXX 形式）的 SSoT，
    经 sync_yaml_to_depgraph.py 同步到 DB domains.domain_name，由 domain_name_mapping.py 消费。
  - 域中文名（含 D_SIGNAL/D_ORDER 等遗留图示用名）单一真源归 functional_domain_registry.yaml
    （#ARCH-SSOT-GLOSSARY-MERGE-001）。本词汇表原 domain_id_display 类别已删除，避免双重真源；
    数据流图域中文名改走 domain_name_mapping._domain_en_zh 查询。

  类别清单（category 字段）：
  - edge_type：决策/数据流边类型（triggering/informing/constraining/.../produces/consumed by）
  - build_status：构建状态（planned/generated/testing/stable/deprecated/production，B-007 P0 2026-08-26 六态）
  - maturity：设计成熟度（design/production）
  - node_type：决策节点类型（signal/portfolio_target/risk_check/order/compliance_check/sell_decision）
  - pit_policy：PIT 策略（strict/loose/none）
  - trigger_type：触发类型（event_driven/scheduled/manual/stream）
  - scope：作用域（production/backtest_internal）
  - entity_name：数据流 Dataset/Job 实体名（market_data.tick 等）
  - decision_domain_short：决策轨短名域（data/factor/...，非 D_XXX 规范形式）
  - domain_responsibility：功能域核心职责（domain 文件头部展示，14 域各 1-2 句）
  - data_source：数据采集中文名（miniqmt/akshare/...）
  - table_name：数据清单表中文名（tick_data/daily_kline/...）
  - layer_name_short：导航页短名层（L0_infrastructure→基础设施层，无层号前缀；
    长名层 L0 基础设施层 的 SSoT 在 domain_name_mapping.LAYER_NAME_BILINGUAL）
  - trading_colloquial：A股社区土话→专业术语对照（2026-08-15 扩；用途=AI 读源文档/课程原话引用时锚定唯一专业译法，防自由翻译漂移；append-only 只增不改，新源文档接入时按需追加；条目级别名（形态/战法别名）不在此类，走各业务注册表 aliases 字段）

  新增 Dataset/Job/表/数据源后，在对应类别补 en/zh 条目即可，无需改生成器代码。
