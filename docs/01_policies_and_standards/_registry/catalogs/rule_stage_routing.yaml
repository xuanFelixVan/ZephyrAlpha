purpose_tags:
- tag: T1
  label: 新东西上户口
  plain_zh: 新建的东西必须登记姓名籍贯，否则门禁见一次拦一次
- tag: T2
  label: 施工队还活着吗
  plain_zh: 证明施工队没死，死了别让它继续代表你说话
- tag: T3
  label: 规则谁在执行
  plain_zh: 每条规则都要说得清谁在替它出手，否则就是纸上法律
- tag: T4
  label: 坏了谁发现
  plain_zh: 每个环节都挂着一本病历本，环节病了翻得到档案
- tag: T5
  label: 一个东西只有一个真源
  plain_zh: 同一事实只许一个家，其他副本都是快照
- tag: T6
  label: AI 不吹牛
  plain_zh: AI 说的每句话都要能回到真源，不能靠记忆拍脑袋
- tag: T7
  label: 钥匙不外泄
  plain_zh: 密钥权限走专道，裸拿硬编码都是开门揖盗
- tag: T8
  label: Owner 看得懂
  plain_zh: 非开发的人一遍能读懂这资产干嘛的、何时用它
- tag: T9
  label: 改坏能回来
  plain_zh: 任何动作都要留得下回头路，删之前先想好怎么活过来
- tag: T10
  label: 累犯必须机械化
  plain_zh: 同一个错犯第三次，就该把它变成机器判据而不是又写一遍提示词
