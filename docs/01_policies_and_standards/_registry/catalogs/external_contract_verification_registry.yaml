name: 外部契约验证登记表
description: >-
  外部 SDK / 券商 API 运行时契约验证的唯一真源（SSoT）。登记所有"静态不可证、需 runtime 实证"
  的外部契约及其 smoke test、验证状态、SDK 版本、实盘门禁标记。治本 #ARCH-EXT-CONTRACT-VERIFY-001
  的"外部契约验证治理缺位"病根——项目已有完善的内部机制验证闭环（TRAE-068 六层、capability_lookup、
  session 心跳），但外部契约（xtquant / QMT broker API）验证是空白。从回测期走向实盘期，外部契约
  错误从"数值怪异"升级为"真金白银损失"，必须补此治理短板。
owner: MOD-INF-037
tier: tier_1_governance
status: active
version: 1.0.0
created: '2026-07-31'
last_updated: '2026-07-31'
# 关联：#ARCH-EXT-CONTRACT-VERIFY-001（外部契约验证治理框架缺位）
#
# 字段语义：
#   last_result: pending | passed | failed
#     - pending: 未验证 / SDK 升级后需重跑（AI 可建条目，默认 pending）
#     - passed: 用户实跑 smoke test 通过后填入（AI 不得凭推断填 passed）
#     - failed: 实跑失败，阻断实盘上线
#   blocks_live_trading: true 表示该契约是实盘上线硬门禁（ZEPHYR_ENV=live 时 gate 检查）
#   open_points: 静态分析无法 100% 确认的运行时开放点清单（实证驱动）
#
# 维护规则：
#   - AI 可新增契约条目（last_result=pending）
#   - last_verified_at / last_result / verified_sdk_version 仅在用户实跑 smoke test 后由 AI 据实填入
#   - SDK 版本变更时（pip 包版本比对），相关条目 last_result 自动重置为 pending

entries:
  - contract_id: EXT-XTQUANT-BROKER
    category: broker_execution
    name: QMT Broker 执行链路契约
    smoke_test: scripts/tests/smoke_test_qmt_broker.py
    sdk: xtquant
    sdk_version_min: '250807.1.2'
    requires_live_terminal: true
    arch_ref: '#ARCH-XTQUANT-API-COMPAT-001'
    open_points:
      - order_stock 失败返回值语义（部分实证：午休 11:30-13:00 返回 -1，订单不进系统/错误队列空）
      - price_type 取值映射（实证：LIMIT=0, MARKET=5 正确）
      - subscribe 必要性（实证：connect()+subscribe() 均返回 0=成功，已确认必须 subscribe）
      - session int 参数要求
    partial_findings_20260731:
      - 'connect()=0 / subscribe()=0 均成功（模拟账号 8886156677）'
      - 'get_positions() 返回 cash=10000000, holdings=空 —— 持仓查询契约验证通过'
      - 'order_stock(600000.SH, BUY, 100, LIMIT, 8.84) 返回 -1 —— 午休时段(12:51)模拟盘拒单'
      - 'queuing_order_errors_byid/byseq 为空 dict，query_stock_orders=0 条 —— 订单本地即拒，未入系统'
      - '错误队列是属性(dict)非方法 —— 不可 () 调用'
      - '待盘中(13:00后)重试验证下单→查询→撤单全链路'
    last_verified_at: null
    last_verified_by: null
    last_result: pending
    verified_sdk_version: null
    blocks_live_trading: true

  - contract_id: EXT-XTQUANT-TICK
    category: data_fuel
    name: QMT Tick 数据燃料层契约
    smoke_test: scripts/tests/smoke_test_tick_data.py
    sdk: xtquant
    sdk_version_min: '250807.1.2'
    requires_live_terminal: true
    arch_ref: '#ARCH-EDE-TICK-FUEL-001'
    open_points:
      - xtdata tick 时间戳格式（UTC ms vs 北京时间）—— 时区转换治本在 miniqmt_provider.py L411-433
      - 5 档盘口 18 字段结构（ask/bid_price_1..5 / ask/bid_vol_1..5）
      - download_history_data 行为（部分券商权限限制历史 tick）
      - get_market_data_ex 返回结构与 _normalize_tick_data 假设匹配
    partial_findings_20260731:
      - 'get_full_tick 返回 dict，key 为 camelCase（非 snake_case）：lastClose/lastPrice/askPrice/bidPrice/askVol/bidVol'
      - 'lastClose=9.71（昨收），lastPrice=9.39（最新价），askPrice=[9.39,9.4,9.41,9.42,9.43]（5档卖）'
      - 'timetag=20260731 11:30:00（北京时间字符串，非 UTC ms）—— 时区转换逻辑需核对此格式'
      - '注意：miniqmt_provider._normalize_tick_data 若按 last_close 取 key 会 KeyError，应取 lastClose'
    last_verified_at: null
    last_verified_by: null
    last_result: pending
    verified_sdk_version: null
    blocks_live_trading: true
