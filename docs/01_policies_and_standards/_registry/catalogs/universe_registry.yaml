  - universe_id: UNI-RULE-002
    name: Event-Driven Pool
    name_zh: 事件驱动池
    aliases: [事件池]
    universe_type: rule_based
    construction_rule: >-
      基于事件触发的动态股票池（并购/业绩/政策/增减持等事件）。
      在全A可交易池基础上，叠加事件触发条件筛选。
    base_universe: UNI-RULE-001
    filter_rules:
      - 排除 ST/*ST
      - 排除退市风险警示
      - 事件触发条件（具体见26号文档）
    rebalance_frequency: daily
    component_count: null
    components_ref: src/zephyr/signal_ashare/
    used_by_strategies: [STR-EVENT-001]
