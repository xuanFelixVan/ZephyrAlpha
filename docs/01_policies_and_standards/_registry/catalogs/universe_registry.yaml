# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：primary_timeframe/applicable_timeframes/regime_valid/regime_invalid/direction 五字段不适用于股票池（标的集合无 K 线周期/市场环境/方向语义），不予登记。保留 entry_role=reference + 共有四维度（tags/applies_to/algorithm_status/evidence）；algorithm_status 固定 not_applicable（非算法条目）。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   事件、信号、因子、多因子、形态、成交、打板、指数、流动性、绩效、股票池、规则、财报、资金、风控
# ============================================================================
module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.0'
registry_id: REG-UNI-001
name: 股票池登记表
description: >-
  股票池/标的池唯一真源（SSoT）。登记所有可交易股票池（打板连板梯队/全A可交易/CSI300/CSI800/事件驱动池）。
  回测必需输入：每次回测 MUST 指定 universe_id。
  支持 static（固定成分股）/ dynamic（每日生成，如打板连板梯队）/ rule_based（规则过滤，如剔ST/低流动性）。
  对标 MSCI Index Universe / Bloomberg Universe Management。
  治本"回测不知道在哪些股票上跑"硬缺口。business_registry_consolidation_plan §8.7d。
# v1.1.0 changelog(2026-08-12): related_arch 旧引用（不存在的ARCH编号）→'#ARCH-BREG-001'；
#   entry_schema+5条entry补62号v1.24.0生存偏差三字段（pit_constituent_construction/delisted_handling/survivorship_free）；
#   UNI-INDEX-001/002 发现 components_ref（data/index_constituents/*.csv）未落盘→pit=false/survivorship_free=false诚实标注。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.2.1
created: '2026-08-10'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- universe_id

entry_schema:
  universe_id: str               # UNI-{TYPE}-{NNN}
  name: str
  name_zh: str
  aliases: list
  universe_type: str             # static / dynamic / rule_based
  construction_rule: str
  base_universe: str             # 基础池（rule_based 在此过滤）
  filter_rules: list
  rebalance_frequency: str       # daily/weekly/monthly/quarterly/none
  component_count: int           # 成分股数量（摘要）
  components_ref: str            # 成分股列表位置（DB/文件）
  used_by_strategies: list       # strategy_id 列表
  data_source: str               # data_asset_registry source_id
  module_id: str
  doc_ref: str
  code_path: str
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  # 生存偏差治理三字段（62号 v1.24.0 schema，2026-08-12 补落地，E14 c 维度审计）
  pit_constituent_construction: bool  # 成分股是否按 point-in-time 构造（true=每个调仓日只用当时可得成分；false=用当前成分回溯=生存偏差；null=未声明）
  delisted_handling: str           # include/exclude/unknown，退市股票处理（include=含退市至退市日，回测 MUST；exclude=仅存活=生存偏差）
  survivorship_free: bool          # universe 是否无生存偏差（true=含退市+PIT构造；false=仅存活股）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

universes:
  - universe_id: UNI-DYNAMIC-001
    name: Daban Lianban Echelon Pool
    name_zh: 打板连板梯队池
    aliases: [连板池, 涨停梯队池, 打板池]
    universe_type: dynamic
    construction_rule: >-
      每日从全市场涨停股中识别连板梯队结构（54321阵型），含首板/2板/3板/4板+标的。
      排除 ST/*ST/退市风险警示/涨跌停流动性失效标的。主板+创业板涨停标的。
    base_universe: UNI-RULE-001
    filter_rules:
      - 排除 ST/*ST
      - 排除退市风险警示
      - 排除涨跌停流动性失效标的
      - 仅含当日涨停（主板+创业板）
    rebalance_frequency: daily
    component_count: null
    components_ref: src/zephyr/signal_ashare/
    used_by_strategies: [STR-DABAN-001]
    data_source: SRC-QMT-001
    module_id: MOD-SIGNAL-ASHARE
    doc_ref: 24_daban_strategy_detail.md §3.1
    code_path: src/zephyr/signal_ashare/
    status: active
    version: 1.0.0
    created_at: '2026-08-10'
    updated_at: '2026-08-12'
    owner: MOD-SIGNAL-ASHARE
    pit_constituent_construction: true   # 每日用当日涨停/过滤数据重建（动态池日频重建天然 PIT）
    delisted_handling: exclude           # filter_rules 排除退市风险警示=仅存活，回测需注意
    survivorship_free: false             # exclude 退市=有生存偏差，打板短周期影响小但须声明
    entry_role: "reference"
    applies_to: ["stock", "market"]
    tags: ["打板", "风控", "流动性", "形态", "绩效", "股票池"]
    algorithm_status: "not_applicable"
    evidence: ""

  - universe_id: UNI-RULE-001
    name: Tradable A-Share Universe
    name_zh: 全A可交易池
    aliases: [全A, 沪深A股, 可交易池]
    universe_type: rule_based
    construction_rule: >-
      全市场沪深A股，剔除 ST/*ST/退市风险警示/次新(上市<60天)/低流动性(日均成交额<1000万)。
      多因子策略选股池，承载主资金，容量大。
    base_universe: null
    filter_rules:
      - 排除 ST/*ST
      - 排除退市风险警示
      - 排除次新（上市<60天）
      - 排除低流动性（日均成交额<1000万）
    rebalance_frequency: monthly
    component_count: 4500
    components_ref: src/zephyr/ex_core/trading_halt_resolver.py
    used_by_strategies: [STR-MULTIFACTOR-001]
    data_source: SRC-AKSHARE-001
    module_id: MOD-EX-CORE
    doc_ref: 25_multifactor_strategy_detail.md §选股池
    code_path: src/zephyr/ex_core/trading_halt_resolver.py + pricing_policy.py
    status: active
    version: 1.0.0
    created_at: '2026-08-10'
    updated_at: '2026-08-12'
    owner: MOD-EX-CORE
    pit_constituent_construction: true   # 过滤规则（ST状态/上市天数/成交额）均用当日可得数据
    delisted_handling: exclude           # filter_rules 排除退市风险警示=仅存活，回测需注意
    survivorship_free: false             # exclude 退市=有生存偏差，多因子长周期回测须评估影响
    entry_role: "reference"
    applies_to: ["stock", "market"]
    tags: ["资金", "风控", "流动性", "多因子", "股票池", "规则", "因子", "成交"]
    algorithm_status: "not_applicable"
    evidence: ""

