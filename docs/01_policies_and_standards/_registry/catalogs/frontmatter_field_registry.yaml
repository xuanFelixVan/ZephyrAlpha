      - {value: "active", description: "已生效，当前有效"}
      - {value: "deprecated", description: "已废弃，有替代品或已合并"}
    applicable_docs: []
    description: "文档状态——DocStatus 仅 3 值"
    source: "PS-STD-001 §4.1 + status_vocabulary.yaml"
    derived_from: "_registry/vocabularies/status_vocabulary.yaml"
