      - {value: "module", description: "Module 级——Level 2 单模块蓝图"}
    applicable_docs: []
    description: "蓝图层级——PS-STD-005 三级金字塔中的位置"
    source: "PS-STD-005 §8.1"
    note: "每个蓝图 MUST 声明其层级"

