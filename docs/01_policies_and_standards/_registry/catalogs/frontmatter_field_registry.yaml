    source: "GOV-ENG-001 §7 + blueprint-construction-template.md frontmatter"
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    note: "blueprint doc_type 下 MUST 填写。与 last_updated 不同——last_updated 记录修改时间，last_verified 记录验证通过时间。修改≠验证"

