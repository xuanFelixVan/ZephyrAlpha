    source: "PS-STD-005 §6.1"
    pattern: "^[A-Z]+(-[A-Z]+)?-[A-Z]+-\\d{3,4}$"
    note: "Level 2 蓝图 MUST 声明此字段。Level 0 蓝图不声明（顶层）。此 pattern 仅用于 frontmatter 文档 module_id，非 blueprint_id 三轨制格式"

