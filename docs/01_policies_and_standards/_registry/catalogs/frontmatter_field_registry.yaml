# ============================================================================
# ZephyrAlpha Frontmatter 字段定义登记表（Frontmatter Field Registry）— 唯一真源
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-02 | owner: ZephyrAlpha-Owner
#
# module_id: PS-REG-012
# doc_type: register
#
# 对标: ITIL SACM CMDB CI → Metadata Schema（每个字段有唯一定义）
#       + SchemaStore JSON Schema Catalog（每个 schema 有唯一 ID 和描述）
#       + Google API Design Guide → Field naming & consistency
#       + AWS CloudFormation Resource Schema（每个属性有类型/必填/描述）
#
# 用途: 登记 ZephyrAlpha 项目所有 frontmatter 字段的唯一定义——
#       字段名 / 类型 / 必填性 / 枚举值 / 适用 doc_type / 定义来源。
#       本登记表是 frontmatter 字段**数据**的 canonical SSoT。
#       字段**规则**（校验逻辑/一致性约束/违规检测）见 PS-STD-001。
#       两者关系：YAML=数据真源, MD=规则真源。
#       修改本文件字段定义 → MUST 同步检查 PS-STD-001 对应章节。
#       数据冲突 → 本文件优先。
#
# 与 frontmatter_schema.json 的关系:
#   - frontmatter_schema.json 是机器可读的校验 Schema（自动生成，不可手写）
#   - 本登记表是人工可读的字段定义真源（手动维护）
#   - 两者必须一致——S1 validate_registry_master_index.py 会交叉验证
#
# VR-005 根因修复:
#   - VR-005（frontmatter 校验脚本）曾产生 2484 条误报
#   - 根因: 字段定义散落在 PS-STD-001 + vocabulary/ + schema.json 三处
#   - 修复: 本登记表建立唯一字段定义真源 → VR-005 从此引用本表
#
# 自校验脚本: （experimental 补齐——validate_frontmatter_field_registry.py）
# ============================================================================

