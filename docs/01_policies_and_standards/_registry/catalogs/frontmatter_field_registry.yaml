# ============================================================================
# 字段登记说明
#
# 每个字段一条记录:
#   field_name         字段名（YAML frontmatter key）
#   type               字段类型: string / enum / integer / array / object / date
#   required           是否必填: always / conditional / optional
#   stage              required=conditional 时的阶段: phase0 / phase1 / phase2
#   enum_values[]      枚举值列表（type=enum 时），含中文描述
#   applicable_docs[]  适用哪些 doc_type（空 = 所有类型）
#   description        字段说明
#   source             定义来源: PS-STD-001 §X.Y / KBG-NNNN / vocabulary
#   note               补充说明
# ============================================================================

fields:
  # ── 7 个必填字段（frontmatter_schema.json required）──
  - field_name: module_id
    type: string
    required: always
    stage: null
    enum_values: []
    applicable_docs: []
    description: "模块唯一标识（frontmatter 文档标识符，格式：DOMAIN-TYPE-NNN）。注意：此 pattern 仅用于 frontmatter 文档 module_id，不适用于 depgraph blueprint_id 三轨制格式。blueprint_id 格式校验真源见 scripts/governance/validate_module_id_naming.py（裁定#208）"
    source: "PS-STD-001 §5"
    pattern: "^[A-Z]+(-[A-Z]+)?-[A-Z]+-\\d{3,4}$"
    note: "全项目唯一，不可重复。此 pattern 仅用于 frontmatter 文档 module_id，非 blueprint_id 三轨制格式"

  - field_name: title
    type: string
    required: always
    stage: null
    enum_values: []
    applicable_docs: []
    description: "文档标题。blueprint 类 MUST 使用格式：{English Name} 蓝图 — {中文一句话描述}（如 Vector Memory Service 蓝图 — ChromaDB 8 Collection 统一向量持久化）。H1 标题 MUST 与此字段一致。其他 doc_type：中文标题"
    source: "PS-STD-001 §2.1"
    min_length: 1
    format: "blueprint={English Name} 蓝图 — {中文描述} | other=中文标题"
    note: "blueprint H1 = title = {English Name} 蓝图 — {中文一句话描述}。模板见 blueprint-construction-template.md"

  - field_name: doc_type
    type: enum
    required: always
    stage: null
    enum_values:
      - {value: "policy", description: "策略——定义'必须/禁止'的声明式规则，AI 不可修改"}
      - {value: "standard", description: "标准——定义度量/格式/接口的声明式规范"}
      - {value: "operational_rule", description: "操作规则——定义'如何做'的步骤化流程"}
      - {value: "register", description: "注册表——结构化数据清单，AI 可修改"}
      - {value: "index", description: "索引入口——目录级导航文件"}
      - {value: "protocol", description: "协议——定义交互流程和消息时序"}
      - {value: "template", description: "模板——可复用的文档结构骨架"}
      - {value: "terminology", description: "术语——定义项目专有名词的统一含义"}
      - {value: "vocabulary", description: "词表——受控枚举值的权威来源"}
      - {value: "contract", description: "契约——声明式接口/行为约束，代码可消费"}
      - {value: "reference", description: "参考——非规范性辅助资料"}
      - {value: "gate", description: "闸门——CI/质量门禁定义"}
      - {value: "schema", description: "Schema 定义——JSON/YAML 格式的数据结构校验定义"}
    applicable_docs: []
    description: "文档品种——01_policies_and_standards/ 目录下 13 种"
    source: "PS-STD-001 §3.2.1 + doc_type_vocabulary.yaml"
    derived_from: "_registry/vocabularies/doc_type_vocabulary.yaml"
    note: ""

  - field_name: status
    type: enum
    required: always
    stage: null
    enum_values:
