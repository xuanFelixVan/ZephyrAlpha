      tier: green
      invoke: ""
      canonical: docs/index.md
      normalize: ["volatile_lines"]
      structural:
        scope_dir: docs
        include: ["*"]
        exclude: [".git", "__pycache__", ".obsidian", "_DO_NOT_USE", "node_modules", ".mypy_cache", "scripts", "_archive", ".trae", "_", "windi", "spikes", ".*", "index.md"]
