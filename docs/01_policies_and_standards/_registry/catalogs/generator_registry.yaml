# 生成器自动触发注册表（TRAE-062 规则数据真源=YAML）
# 真源说明：本文件是"生成器→触发源→输入/输出"映射的唯一真源。
#   - reconcile_generators.py 只读此表，禁止反向写入
#   - apply_*.py 调 reconcile(source) 时查 trigger_sources 匹配
#   - boot_hooks 调 reconcile_stale() 时按 input_sources mtime 对比
# 新增生成器自动化：在本表加一条即可，无需改编排器代码（§3.1 能现成不创造·注册表驱动）
#
# 字段说明：
#   name             — 生成器逻辑名（唯一键）
#   module_path      — Python 模块路径（reconcile 用 importlib.import_module / python -m 加载）
#   entry_function   — 可调用入口函数名（无参，返回 dict）。省略→subprocess 回退调 main()
#   args             — 可选 CLI 参数列表（subprocess 回退时传给 main()，如 domain_doc 需 --all）
#   trigger_sources  — 触发源列表（apply 调 reconcile(source) 时精确匹配）
#   input_sources    — 输入真源列表（reconcile_stale 用 mtime 对比）
#                      db: 前缀=数据库表（stale 扫描跳过，由 apply 实时触发）
#                      yaml: 前缀=YAML 文件（stale 扫描对比 mtime，#后为段名仅注释用）
#   output_globs     — 产物 glob 列表（reconcile_stale 取最早 mtime 作为产物基准）
#                      DB-only 生成器（无 yaml 源）不参与 stale 扫描，output_globs 仅供报告
#
# 双路径调用（reconcile_generators.py §双路径调用）：
#   - entry_function 声明且模块中存在 → in-process importlib（快，如 battle_map）
#   - 省略 entry_function → subprocess `python -m <module_path>`（隔离，免改造 main()-only 生成器）
#
# 触发源命名约定：
#   <graph>_db    — apply_<graph>.py 写 DB 后实时触发（如 depgraph_db / dataflowgraph_db）
#   <name>_yaml   — YAML 真源变更，boot_hooks 启动时 mtime 对比兜底触发
#
# 禁止注册清单（扫描器/sync 脚本，非派生生成器，登记即循环触发）：
#   - scripts/governance/generate_project_depgraph.py    — 扫描 src/ 代码造 depgraph 真源（上游真源写入方）
#   - scripts/governance/generate_decision_graph.py      — YAML→DB sync（=apply 真源写入方，非派生）
#   - scripts/governance/generate_project_path_tree.py   — 扫描文件系统造 arch_directory_tree（上游真源写入方）
#   禁止理由：本注册表只登记"真源→派生产物"生成器。上述脚本创造真源本身，若登记会形成
#   "扫描写DB → apply 触发 reconcile → 联动 21 生成器重跑 → ..."的循环触发，且违背"派生物
#   不写真源"铁律（§2.2 真源唯一）。二元判定：脚本产出"真源"→禁止；产出"派生物"→可登记。

