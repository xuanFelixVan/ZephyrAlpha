# 七、dev/prod 双模式权限表
# 核心原则：dev 宽松、prod 严格——dev 允许试错，prod 零容忍。
dev_prod_mode:
  # 7.1 环境判定规则
  env_rules:
    - condition: 文件路径包含 drafts-and-audits/
      env: dev
    - condition: 文件 status 为 draft
      env: dev
    - condition: 文件路径在 docs/ 且 status 为 active
      env: prod
    - condition: 文件路径在 src/zephyr/ 且已部署到生产服务器
      env: prod
    - condition: 无法判定时
      env: prod（默认，安全优先）

  # 7.2 双模式权限对照表
  permission_matrix:
    - operation: 创建新文件
      dev: AI-Modifiable
      prod: Human-Gated
      diff: prod 必须 Owner 审批
    - operation: 修改 frontmatter
      dev: AI-Modifiable
      prod: Human-Gated
      diff: prod 修改元数据需审批
    - operation: 修改规则内容（ABS）
      dev: Human-Gated
      prod: Immutable Core
      diff: prod ABS 规则不可修改
    - operation: 修改规则内容（COND）
      dev: AI-Modifiable
      prod: Human-Gated
      diff: prod COND 规则需审批
    - operation: 删除文件
      dev: Human-Gated
      prod: Immutable Core
      diff: prod 禁止删除，只能 deprecated
    - operation: 执行交易操作
      dev: 禁止
      prod: Human-Gated
      diff: dev 禁止交易，prod 需审批
    - operation: 修改风控参数
      dev: AI-Modifiable（测试值）
      prod: Immutable Core
      diff: prod 风控参数不可 AI 修改
    - operation: 修改数据源配置
      dev: AI-Modifiable（测试源）
      prod: Human-Gated
      diff: prod 数据源需审批
    - operation: 运行回测
      dev: AI-Modifiable
      prod: AI-Modifiable
      diff: 两环境均可
    - operation: 生成报告
      dev: AI-Modifiable
      prod: AI-Modifiable
      diff: 两环境均可
    - operation: 触发 kill switch
      dev: AI-Modifiable
      prod: AI-Modifiable
      diff: 两环境均可（紧急安全）
    - operation: 修改 kill switch 规则
      dev: Human-Gated
      prod: Immutable Core
      diff: prod 不可修改

  # 7.3 环境切换规则
  env_switch_rules:
    - 从 dev 切换到 prod：必须通过 Phase Gate 检查（参见 GOV-MOD-002 铁律8）
    - 任何文件从 draft 变为 active 时，该文件的 AI 自治权限自动从 dev 模式切换到 prod 模式
    - 禁止在 prod 环境下使用 dev 权限操作
