# 四、变更流程
change_process:
  modify_registry:
    - 提交 PR 修改本文件
    - Owner 直接审批
    - 同 commit 追加 R-XXX 到 architecture-rationale-log.md
    - 同 commit 更新所有相关模块代码注释
  modify_module_permission:
    rule: 不修改本表 = 错误。所有权限变更必须先改本表，再改代码注释
  add_new_module:
    - 必须在本表登记权限层级
    - 未登记 = pre-commit 拒绝
    - path_uniqueness_constraint: >-
        同一路径不得在多个节中出现——若模块同时属于业务层（§2.1/§2.2）与
        基础设施层（§2.3），仅在最能代表其核心职责的节中登记。发现重复路径
        = 注册表腐败（对标 ITIL SACM CMDB corruption → 同一 CI 两条矛盾记录）

