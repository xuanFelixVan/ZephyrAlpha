# ============================================================
# AI 自治权限注册表 — 正文（结构化数据）
# 唯一真源声明：本注册表是 ZephyrAlpha 全模块 AI 自治权限的唯一真源。
# 任何模块的权限判定必须以本表为准。前三轮审计在 8 份文档中各自标注
# 权限导致 25-30% 错误率，根因正是"没有横向汇总"——本表通过 Wave 0
# 终审兜底缺口 V-11 解决该问题。
# ============================================================

# 一、三层权限模型（来自 KBG-0010）
permission_layers:
  - level: Immutable Core
    semantics: 系统宪法层 / 风控核心 / 审计基础设施
    ai_modify_permission: 禁止 AI 自主修改
    modify_flow: Owner 直接审批 + KB 决策记录/rationale-log 记录
  - level: Human-Gated
    semantics: 业务规则 / 阈值 / 评估标准 / 治理参数
    ai_modify_permission: 修改前必须 Owner 审批
    modify_flow: request_change() + approve_change() + Provenance Chain
  - level: AI-Modifiable
    semantics: 算法实现 / 性能优化 / 日志级别
    ai_modify_permission: AI 可自主修改
    modify_flow: 每次修改写入 Provenance Chain，可被回溯

