# [A_config] module_id=REG-MAC-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：timeframe×2（发布节奏由 frequency/release_schedule 表达，本库以发布纪律为主）+ direction（宏观指标无固定方向语义）。保留 regime×2（宏观指标用于 regime 判定，标注其结论适用环境有价值）+ entry_role=state + 共有四维度；algorithm_status 固定 not_applicable。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   估值、信号、利率、压力、反转、周期、宏观、形态、情绪、成交、成长、指数、杠杆、波动、流动性、绩效、行业、行情、资金、通胀、风控
# ============================================================================
# module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.0'
registry_id: REG-MAC-001
name: Macro Indicator Registry
name_zh: 宏观指标注册表
description: >-
  宏观指标唯一真源（SSoT）。登记中国+美国关键宏观指标的发布机构、频率、
  PIT 滞后规则（公布时点 vs 数据时点）、修订政策、市场影响方向与消费模块。
  与 field_dictionary 正交：字段字典管"字段级 type/unit/口径"，本表管"指标级
  发布纪律/市场语义"。宏观发布事件实例归 event_calendar_registry EVT-MACRO-001，
  数值数据落 data_asset_registry（DS-101 中国宏观 / SRC-FRED-001 美国 22 序列）。
  消费：regime 层状态识别、宏观择时、流动性预期建模。
  对标：聚宽 JQData 宏观经济谱系（国民经济/财政/金融 8 大类）、
  FRED 序列治理、quant666 macro_cn_gdp/macro_sf_month 表。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.1.1
created: '2026-08-14'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- indicator_id
entry_count: 15

entry_schema:
  indicator_id: str              # MAC-{CN|US}-{NNN}
  name: str
  name_zh: str
  aliases: list[str]
  region: str                    # CN/US
  category: str                  # price/activity/monetary/credit/fiscal/external/sentiment
  release_agency: str            # 统计局/央行/海关/BLS/Fed
  frequency: str                 # monthly/quarterly/daily/event
  release_schedule: str          # 发布规律（如"每月 9-15 日 09:30"）
  pit_lag_rule: str              # PIT 规则（数据时点→可用时点的滞后）
  revision_policy: str           # 修订政策（中国宏观初值少修订；美国非农大幅修订常见）
  market_impact: str             # 市场影响方向（利多/利空/取决于预期差）
  impact_assets: list[str]       # 影响资产（equity_index/bond/cny/commodity/sector）
  data_ref: str                  # FK→data_asset_registry DS/SRC
  used_by: list[str]             # 消费模块（regime/择时/因子）
  reliability_note: str
  status: str                    # candidate/active/deprecated
  version: str
  created_at: date
  updated_at: date
  owner: str
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

