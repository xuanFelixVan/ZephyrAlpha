# [A_config] module_id=REG-DAL-001 | layer=config | stability=stable | safety=L | ai_autonomy=ai_modifiable
# ============================================================================
# 决策算法登记表（PB-05，Owner 2026-09-09 裁定保留·核心；前缀 DAL-*）
# 真源文档: docs/_working/2026-09-09-node-backtest-governance.md §7.1/§8.2 P1-3
# 挂载方式: 地图节点 algo_refs 允许 DAL-*（门禁 R13 值域扩展）；共振方式写机制文本不加新字段（精简裁定）
# ============================================================================
module_id: REG-DAL-001
ttl: permanent
schema_version: '1.0'
registry_id: REG-DAL-001
name: Decision Algorithm Registry
name_zh: 决策算法登记表
description: >-
  交易决策地图节点背后的决策算法唯一登记处（AI 的施工图）。与 IND/EXA 正交：
  IND=技术指标公式、EXA=执行算法、DAL=决策算法（判定/仲裁/预算/融合类）。
  共振方式（几个算法怎么合成结论）写在节点机制文本中，不单列字段。
  首批 15 条从地图机制文本提取（P1-3 授权）；code_ref=null=设计态未落码。
algorithms:
  - dal_id: DAL-REG-SNAPSHOT
    name_zh: 宏观 RegimeSnapshot（月级 12 态概率）
    mechanism_zh: 宏观月级状态判定，输出 12 态概率分布当谨慎度系数（概率越分裂越谨慎）
    code_ref: src/zephyr/regime/core/regime_detector.py
    inputs: [宏观月级特征]
    outputs: [12 态概率分布, 谨慎度系数]
    status: production
  - dal_id: DAL-REG-HMM4
    name_zh: HMM 四态降维
    mechanism_zh: HMM 状态模型 4 态降维（13 号 §2.1），给宏观状态四档概率
    code_ref: src/zephyr/regime/core/regime_detector.py
    inputs: [市场特征序列]
    outputs: [四态概率]
    status: production
  - dal_id: DAL-EMO-SIXSEG
    name_zh: 情绪六段分布（周级）
    mechanism_zh: 情绪周期六段（吸筹/点火/扩张/亢奋/派发/退潮）周级分布判定
    code_ref: null
    inputs: [情绪周期指标, 广度结构]
    outputs: [六段状态分布]
    status: design
  - dal_id: DAL-BUDGET-BAND
    name_zh: 六段预算带
    mechanism_zh: 按情绪六段查表给当日总仓位预算带（吸筹 30-50%/点火 50-70%/扩张 60-80%/亢奋封顶 30% 只卖不买）
    code_ref: null
    inputs: [六段状态]
    outputs: [当日仓位预算带]
    status: design
  - dal_id: DAL-WATER-TEMP
    name_zh: 盘中水温五档（S0-S4）
    mechanism_zh: 当日盘中 11 个信号环比（涨跌停比变化/成交额环比/炸板率走向等）合成 S0-S4 五档水温；9:35 首算盘中可更新
    code_ref: src/zephyr/signal_ashare/sector/sector_gate.py
    inputs: [盘中 11 信号环比]
    outputs: [S0-S4 水温档]
    status: production
  - dal_id: DAL-TEMP-MONTH-CAP
    name_zh: 月级 12 态封顶仲裁
    mechanism_zh: 日级水温为主判、月级 12 态封顶（日级水烫但月级熊市反弹=取温），防反弹期当牛市做
    code_ref: null
    inputs: [S0-S4 水温档, 12 态概率]
    outputs: [最终温档]
    status: design
  - dal_id: DAL-MA-ALIGN
    name_zh: MA20/MA60 均线排列计分
    mechanism_zh: MA20 在 MA60 上=多头加分，指数距 60 日高点<3%=高位减分；破 MA20 减一档、破 MA60 减两档，输出 -2~+2 趋势分
    code_ref: null
    inputs: [指数日 K, MA20, MA60]
    outputs: [指数趋势分 -2~+2]
    status: design
  - dal_id: DAL-BREADTH-SCORE
    name_zh: 广度结构计分
    mechanism_zh: 涨跌停比>3 且炸板率<30%=强势；连板高度断崖=退潮预警，给市场参与度打分
    code_ref: null
    inputs: [涨跌停家数, 炸板率, 连板梯队]
    outputs: [参与度分]
    status: design
  - dal_id: DAL-AGG-DUALAX
    name_zh: 双轴熵值仲裁
    mechanism_zh: 宏观 RegimeSnapshot 概率×情绪六段分布双轴相乘；指向一致直接取结论，分裂（熵值超阈）按就低不就高仲裁，输出三件套
    code_ref: null
    inputs: [12 态概率, 六段状态分布]
    outputs: [仓位预算带, 六段状态, 策略路由]
    status: design
  - dal_id: DAL-SECTOR-LIFE
    name_zh: 板块生命周期四段
    mechanism_zh: 启动（首板潮）/发酵（二三板+跟风）/高潮（涨停潮）/熄火（断板+炸板率>40%）四段判定；只做启动发酵，高潮只持有，熄火清仓
    code_ref: null
    inputs: [板块涨停结构, 炸板率, 龙头表现]
    outputs: [生命周期段位]
    status: design
  - dal_id: DAL-NINE-PHASE
    name_zh: 九阶段漏斗压缩
    mechanism_zh: 九阶段逐级压缩（每阶段砍 50-70%）：动量初筛→流动性→波动率带→趋势确认→相对强度→量价配合→形态过滤→负面剔除→最终精选，3000→10 主链
    code_ref: null
    inputs: [全市场股票池]
    outputs: [10-20 只精选池]
    status: design
  - dal_id: DAL-SIZE-QUAD
    name_zh: 仓位引擎四轨融合
    mechanism_zh: 风险预算/波动率目标/策略置信/现金约束四轨融合定单笔量级
    code_ref: null
    inputs: [账户风险状态, 波动率, 策略置信度, 现金约束]
    outputs: [单笔仓位量级]
    status: design
  - dal_id: DAL-GRADIENT-TRIM
    name_zh: L3 梯度减仓顺序
    mechanism_zh: 重亏仓优先砍→高波动仓（ATR 大）次之→压舱石最后动；恢复=回撤修复 50% 后逐级加回风险预算，禁 V 型回满
    code_ref: null
    inputs: [持仓浮亏/ATR 排序]
    outputs: [减仓顺序队列]
    status: design
  - dal_id: DAL-LHB-DISTRIB
    name_zh: 龙虎榜派发五规则
    mechanism_zh: 高位游资上卖方榜/三日榜净卖出=诱多出货信号；知名游资买入=接力有戏，机构席=中线票，拉萨天团=次日溢价差
    code_ref: null
    inputs: [龙虎榜席位数据]
    outputs: [派发/接力定性]
    status: design
  - dal_id: DAL-BREAK-FAIL
    name_zh: 突破失败三连计数
    mechanism_zh: 突破价跌回+量能萎缩计失败一次，连冲 3 次失败强制清仓（买入理由消失）
    code_ref: null
    inputs: [突破价, 量能序列]
    outputs: [清仓触发信号]
    status: design

  # ── 第二批 12 条（Owner 2026-09-09 批准的 DAL 补登批次；code_ref 全部实盘核验存在）──
  - dal_id: DAL-RRG-SEQ
    name_zh: RRG 相对旋转图四象限
    mechanism_zh: 板块相对大盘收益率×动量双轴旋转，四象限判定（改善/走弱/落后/布局中），目标=刚进领先象限的板块
    code_ref: src/zephyr/signal_ashare/sector/sector_rrg.py
    inputs: [板块相对收益, 板块动量]
    outputs: [四象限轮动状态]
    status: production
  - dal_id: DAL-SIPHON-ID
    name_zh: 虹吸态识别
    mechanism_zh: 极端分化判定：前 3 板块成交占比>40%=虹吸期，只做头部板块候选、其余板块候选池清空（虹吸期做非头部=接飞刀）
    code_ref: src/zephyr/signal_ashare/sector/sector_siphon.py
    inputs: [板块成交占比]
    outputs: [虹吸态开关]
    status: production
  - dal_id: DAL-PULLBACK-ABC
    name_zh: 回踩 ABC 质量分级
    mechanism_zh: 四因子合成——Fib 回撤位置（38.2% 附近=A 必要条件）×量能衰减（缩到峰值 1/3）×板块强度（>7）×时间窗（3-8 天），加权定 A/B/C 置信级
    code_ref: src/zephyr/signal_ashare/sector/sector_pullback.py
    inputs: [Fib 回撤位置, 量能衰减比, 板块强度, 回调天数]
    outputs: [A/B/C 置信级]
    status: production
  - dal_id: DAL-AUCTION-MICRO
    name_zh: 竞价微观结构选股
    mechanism_zh: 竞价 120 秒确认：竞价量比>5+竞价涨幅 2-5%（过高易炸）+匹配量大单主导→直接进当日候选
    code_ref: src/zephyr/signal_ashare/auction_microstructure_analyzer.py
    inputs: [竞价量比, 竞价涨幅, 匹配量结构]
    outputs: [当日候选确认]
    status: production
  - dal_id: DAL-SEAT-PATTERN
    name_zh: 龙虎榜席位形态分析
    mechanism_zh: 席位定性：一线游资买入=短线接力有戏；机构专用=中线票；拉萨天团（散户大本营）=次日溢价差；席位风格决定玩法
    code_ref: src/zephyr/signal_ashare/limit_up/seat_pattern_analyzer.py
    inputs: [龙虎榜席位数据]
    outputs: [席位定性（游资/机构/散户营）]
    status: production
  - dal_id: DAL-CHIP-DISTRIB
    name_zh: 筹码分布引擎
    mechanism_zh: 获利盘>90% 且单峰密集=拉升期无抛压；获利盘<30% 高位换手=派发嫌疑；低位单峰密集=最干净形态
    code_ref: src/zephyr/regime/features/chip_distribution_engine.py
    inputs: [历史成交分布]
    outputs: [获利盘占比, 单峰密集度]
    status: production
  - dal_id: DAL-CHANLUN
    name_zh: 缠论结构识别
    mechanism_zh: 缠论二买/三买位置+底部形态（W 底/头肩底颈线突破）+技术位（前高突破/平台整理）给买点定位；形态不单独构成买入理由
    code_ref: src/zephyr/signal_ashare/chanlun_structure.py
    inputs: [K 线序列]
    outputs: [买卖点位置, 底部形态确认]
    status: production
  - dal_id: DAL-CIRCUIT-5
    name_zh: 熔断五级状态机
    mechanism_zh: 组合日盈亏+回撤双轴分级——L1 警戒（日亏≥2% 禁加仓）/L2 禁开仓（≥4%）/L3 减仓（≥6%）/L4 保命（回撤≥25% 清仓人工接管）；迟滞解除=无新低+修复 50% 才降一级
    code_ref: src/zephyr/risk/core/drawdown_state_machine.py
    inputs: [组合日盈亏, 组合回撤]
    outputs: [L0-L4 熔断档位]
    status: production
  - dal_id: DAL-BRIER-CAL
    name_zh: Brier 概率校准
    mechanism_zh: 情景预测概率 vs 实际结果的 Brier 分数回填，校准明日情景概率（作战计划闭环的数学地基）
    code_ref: src/zephyr/plan_engine/brier_calibration.py
    inputs: [情景预测概率, 实际结果]
    outputs: [校准分数, 概率修正]
    status: production
  - dal_id: DAL-SCEN-PROB
    name_zh: 情景概率模型
    mechanism_zh: 由技术面因子与相似日统计生成明日情景概率分布（涨/跌/震荡×幅度档），供作战计划预案编排
    code_ref: src/zephyr/plan_engine/scenario_probability_model.py
    inputs: [技术面因子, 相似日统计]
    outputs: [情景概率分布]
    status: production
  - dal_id: DAL-SIMILAR-DAY
    name_zh: 相似日评估
    mechanism_zh: 历史日特征向量检索 TopN 相似日，统计其后续走势分布作为明日预案的实证锚
    code_ref: src/zephyr/plan_engine/similar_day_evaluator.py
    inputs: [历史日特征向量]
    outputs: [相似日 TopN 及次日走势统计]
    status: production
  - dal_id: DAL-T0-CLOSE
    name_zh: 做T闭环判定
    mechanism_zh: 盘中每 5 分钟核对做T买卖闭环；14:50 未闭环不管盈亏无条件平敞口（不留隔夜 T）；收盘判定=股数不变+总成本降=成功
    code_ref: src/zephyr/signal_ashare/intraday_t0/t0_trading_pipeline.py
    inputs: [当日做T买卖流水]
    outputs: [闭环状态, 成本变化]
    status: production
