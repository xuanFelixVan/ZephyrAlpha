# [A_config] module_id=REG-ATH-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# 告警阈值注册表（Alert Threshold Registry）
# 真源决策：docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/55_monitoring_review.md §3.3
#   「告警阈值统编为注册表，阈值不集中即不可审计」——个人系统唯一的"风控评审"就是复盘时看阈值清单，散落等于不可评审。
# 收录范围：监控/告警/复盘链路全部阈值（回撤/健康/偏离/PLV/告警机制/日终审计/风险报告/操作风险/漂移/退役判据/GPU）。
# 消费方式：全部消费模块从本注册表读阈值（fail-closed，缺文件/缺条目直接报错，禁止码内第二真源）；
#           2026-08-17 AI-THD-001 完成存量 9 模块统读改造（tracker #87，经 src/zephyr/shared/alerts/threshold_loader.py 共享加载器），码内硬编码常量已清零。
# status 口径：active=代码在用（锚点实证）/design=设计态（备忘已定、代码未落）/pending_adjudication=判据机制已施工、标准值待 Owner 裁定（55 号 §7⑤）。
# 2026-08-15 v1.1.0：§7⑤ 四条 pending_adjudication（THD-RETIRE-001/002/003 + THD-DEVIATION-003）经 Owner 裁定全部转正 active——
#   裁定逻辑=判据为评审触发器非自动关停，误触发成本≪漏触发成本，风险优先取早触发侧；校准点=首批上线数据回归（PLV 周期）。
# 2026-08-17 v1.2.0：存量 9 模块统读落地（drawdown/health/deviation/plv/alert/audit/report/oprisk 26 条 active 条目锚点随统读刷新）；
#   双向一致性对账测试演化为「注册表值=代码默认值」接线校验 + 红队 fail-closed 36 用例。
# 2026-08-28 v1.3.0：新增 THD-HEALTH-005（CH 单表 data parts 爆炸阈值 100）——64 号 §16.2 Q8 裁定施工尾巴，
#   ch_parts_monitor 阈值由码内硬编码改为注册表 fail-closed 统读（session AI-WAVE0-001，路线图 A17）。
# ============================================================================
# module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '1.0'
registry_id: REG-ATH-001
name: 告警阈值注册表
description: >-
  监控告警与复盘链路阈值唯一真源（SSoT）。登记回撤/健康/偏离/PLV/告警机制/日终审计/风险报告/操作风险/漂移/退役判据/GPU
  共 11 类阈值，含代码锚点（source_code）与消费模块（consumer）。55 号 G26 §3.3 决策落地（#ARCH-MON-001）。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.3.0
created: '2026-08-15'
last_updated: '2026-08-28'
related_arch: '#ARCH-MON-001'
unique_key:
- threshold_id

entry_schema:
  threshold_id: str          # THD-{CAT}-{NNN}
  name: str
  name_zh: str
  category: str              # drawdown/health/gpu/deviation/plv/alert/audit/report/oprisk/drift/retirement
  metric_zh: str             # 被度量的指标（中文）
  value: float|str           # 阈值当前值（数值或字符串规约，如 "±1%"）
  unit: str                  # ratio/percent/ms/seconds/trades/doc
  comparator: str            # gt/gte/lt/abs_gt/range/eq（突破方向的语义）
  severity_action: str       # 触发后动作（告警级别/流程动作）
  source_code: str           # 代码锚点 path::symbol 或文档锚点（design/pending 类为备忘锚点）
  consumer: str              # 消费模块（路径或模块名）
  status: str                # active/design/pending_adjudication/deprecated
  doc_ref: str               # 决策出处（design memo 锚点）
  tags: list                 # 中文检索标签
  evidence: str              # 证据摘要（行号/裁定文）
  last_verified: date        # 最近实证日期

