# [A_config] module_id=REG-EXA-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：direction（执行算法买卖方向无关，TWAP/VWAP 等双向通用）。保留 timeframe×2（执行算法有主周期语义，占位 null/[]）+ regime×2（高波动环境影响算法选择）+ entry_role=rule + 共有四维度；algorithm_status 推导：code_path 非空→quantized，否则 pending_backtest。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   信号、分时、可转债、均线、尾盘、成交、成本、打板、执行、指数、早盘、流动性、盘口、组合、规则、订单、资金、量价、量化、风控
# schema v2.1（2026-08-15，#ARCH-BREG-002 分域真源裁定）：新增 code_symbol 代码符号锚点 / code_fingerprint 实现指纹——库↔代码双向索引与漂移对账。实现域真源移交规则：代码未落地=库（设计态），代码落地锚定后=代码；业务语义域/治理评估域永属库。既有条目一律 null 占位，回填随条目重填与指纹扫描器施工（门禁A存在性校验/门禁B指纹对账立项#ARCH-BREG-002）。
# ============================================================================
module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.1'
registry_id: REG-EXA-001
name: Execution Algo Registry
name_zh: 执行算法登记表
description: >-
  执行算法唯一真源（SSoT）。登记全部拆单/撮合执行算法（TWAP/VWAP/ICEBERG/POV/IS/ALT 6 种，
  对齐 40 号文档 §2.3 实际代码实现，注册表模式零边际成本）。
  编号 EXA-{NAME}-{NNN}。schema 见 62_business_registry_construction.md §6.2.1。
  含 §4.20 监管合规 8 字段（程序化交易 15 笔/秒 + 撤单率 15% + 50µs 停留 + 盘后时段 + 广域网时延地板）
  与 §4.23③ A 股微观结构 3 字段（价格笼子/T+1/涨跌停不可成交）——实盘合规 MUST，非可选。
  自适应分档规则（小单直发/中单TWAP/大单VWAP/超大单IS）见 40 号 §2.3，本表登记算法资产本身。
# v1.0.0 changelog(2026-08-13): P1-B 首建——40 号 §2.3 六算法真源反查落盘（EXA-TWAP/VWAP/ICEBERG/IS/POV/ALT-001），
#   按 62 号 §4.5 CONSTRUCT_REGISTRY 8 步施工；cost_model_ref FK→CST-ASTOCK-001（REG-CST-001 已施工强 FK 验证通过）；
#   module_id=MOD-XS-005（AlgoTradingEngine，depgraph 实证）；
#   注：任务书口径"Smart/Aggressive"经真源反查对齐 40 号实际实现——Smart≈IS（指数衰减启发式近似 AC 轨迹），
#   Aggressive=ALT（保留为别名，62 号 §6.2.1 v1.1.0 裁定）；40 号另有 ICEBERG 已实现，共 6 条。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.2.0
created: '2026-08-13'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- execution_algo_id

entry_schema:
  execution_algo_id: str         # EXA-{NAME}-{NNN}，如 EXA-TWAP-001
  name: str
  name_zh: str
  aliases: list
  algo_class: str                # twap/vwap/iceberg/implementation_shortfall/percent_of_volume/alt（62号§6.2.1 v1.1.0 对齐40号实际6算法）
  formula: str
  params: obj
  applicable_scenario: str       # 大单/小单/流动性差/急单
  warmup_participation_rate: float  # 预热参与率（MVP 可空，Phase 1.5+ 校准，对标 MACE 2026）
  cooling_period: int            # 冷却期分钟数（MVP 可空，Phase 1.5+ 校准）
  anti_gaming: obj               # 反博弈随机化 {timing_randomization: poisson/uniform/none, size_jitter: 0-0.3}
  tca_metrics: list              # TCA 双报告指标（vwap_slippage + implementation_shortfall 必报，iotdigitaltwinplm 2026-06）
  market_impact_model: str       # 冲击模型引用（40号 propagator/Barzykin）
  impact_model_type: str         # square_root/almgren_chriss/i_star/propagator/fixed_bps/pluggable（v1.30.0，MVP 默认 square_root）
  cost_model_ref: str            # FK→cost_model_registry.cost_model_id
  rl_policy_ref: str             # 可选，RL 策略引用（Phase 1.5+ 远期选项，MVP 填 null）
  module_id: str
  doc_ref: str
  code_path: str
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  # §4.20 监管合规字段（2026-07 生效，实盘合规 MUST，v1.14.0/v1.15.0）
  max_orders_per_sec: int        # 高频认定下限 15 笔/秒，默认 14（留 1 笔余量）
  max_daily_orders: int          # 单日申报撤单上限 20000，默认 19000
  cancel_rate_limit: float       # 单日撤单率硬上限 0.15（对齐 40 号 CancelRateGuard）
  min_order_interval_us: int     # 每笔报单最短停留 50 微秒
  is_hft: bool                   # 是否高频（超阈值须报备）
  after_hours_eligible: bool     # 盘后固定价格交易时段资格（15:05-15:30，MVP 不用=false）
  latency_floor_ms: float        # 广域网双向时延地板 2.0ms（2026-07-31 局域网关闭）
  network_type: str              # wan/lan，默认 wan
  # §4.23③ A 股微观结构约束字段（v1.16.0）
  price_cage_config: obj         # 价格笼子 {board, buy_ceiling_pct, sell_floor_pct, has_unit_floor, unit_floor_yuan}
  t_plus_1: bool                 # A 股固定 true（信号当日不可执行，回测 MUST signal.shift(1)）
  limit_up_down_untradable: bool # 涨跌停不可成交（回测 MUST 检查 abs(ret)<limit_pct）
  primary_timeframe: str|null           # 主时间级别 Primary Timeframe — 条目归属的唯一时间级别（枚举 1min/5min/15min/30min/60min/120min/daily/weekly/monthly；无时间语义条目为 null）
  applicable_timeframes: list               # 可泛化时间级别 Applicable Timeframes — 条目可泛化适用的时间级别列表（多值，可空表）
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）
  code_symbol: str|null         # 代码符号锚点 Code Symbol — 算法实现的函数/类级锚点（格式 <relative_path>::<symbol>，如 src/zephyr/factor/momentum.py::calc_mom_20）；null=代码未落地（设计态，实现域真源暂为库）；代码落地后实现域真源移交代码，与 code_path 共同支撑库↔代码双向查找（#ARCH-BREG-002 分域真源裁定 2026-08-15）
  code_fingerprint: str|null    # 实现指纹 Code Fingerprint — 代码侧实现（参数/签名/AST）canonical hash 快照，由扫描器写入；库侧快照与代码重算不一致=漂移告警（门禁B reconciler 对账，告警不自动双写）；null=未计算

execution_algos:
  - execution_algo_id: EXA-TWAP-001
    name: Time-Weighted Average Price
    name_zh: 时间加权平均价（等量切片被动挂单）
    aliases: [TWAP, 等量切片]
    algo_class: twap
    formula: 总量 Q 按时间均匀切 N 片，每片 q_i=Q/N 等间隔被动挂单（Decimal 守恒：Σq_i==Q）
    params:
      slicing: time
      bucket: 5min
      price_strategy: PASSIVE     # 本方价挂单（PriceStrategy.PASSIVE）
      adv_band: [0.01, 0.05]      # 中单 1-5% ADV 默认档（40号§2.3）
      usage_frequency: 中频        # 建仓/调仓（40号§4.4：必需）
    applicable_scenario: 中单（1-5% ADV）/可转债（盘口极薄，VWAP 量曲线预测失效）/流动性极差标的（无稳定日内分布）
    warmup_participation_rate: null
    cooling_period: null
    anti_gaming: {timing_randomization: poisson, size_jitter: 0.15}  # 62号§6.2.1：确定性时钟切片=节拍器被抢跑，MVP 建议 poisson+0.1~0.2
    tca_metrics: [vwap_slippage, implementation_shortfall, fill_rate]
    market_impact_model: square_root（40号§13.1，MVP 默认；propagator/I-Star Phase 1.5+）
    impact_model_type: square_root
    cost_model_ref: CST-ASTOCK-001
