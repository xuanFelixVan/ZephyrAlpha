  - execution_algo_id: EXA-POV-001
    name: Percent of Volume
    name_zh: 参与率算法（跟随市场成交量比例）
    aliases: [POV, 参与率]
    algo_class: percent_of_volume
    formula: x_t=γ·V_t（跟随实时成交量）；内生性纠正 x=γ/(1-γ)·M（M=他人成交量，γ≤5% 时修正仅 5.3% 可忽略，γ≥0.5 定点发散）
    params:
      max_participation_rate: 0.05  # 监管参与率硬上限（MAX_PARTICIPATION_RATE=0.05，证监会程序化交易规定 40号§10.1；62号§6.2.1：MUST ≤0.10）
      usage_frequency: 储备          # 40号§4.4：与 VWAP 重叠，Phase 1.5 自适应参与率时才用
    applicable_scenario: 储备（参与率约束场景；Phase 1.5 自适应参与率启用）
