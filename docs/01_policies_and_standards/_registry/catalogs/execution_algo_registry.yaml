  - execution_algo_id: EXA-IS-001
    name: Implementation Shortfall
    name_zh: 实施差额（指数衰减启发式近似 AC 风险厌恶轨迹）
    aliases: [IS, 实施差额, Smart]   # Smart=任务书口径，真源对齐=IS（指数衰减启发式）
    algo_class: implementation_shortfall
    formula: 切片权重 w_i∝exp(-λ·t_i) 指数衰减前置加载（启发式近似 Almgren-Chriss 风险厌恶轨迹；非完整 AC 均值-方差 QP，Phase 2 可上推闭合形式双曲正弦轨迹）
    params:
      decay_kernel: exponential
      urgency_driven: true        # urgency 驱动前/后置加载
      adv_band: [0.15, null]      # 超大单 >15% ADV 档；单笔硬上限 15% ADV（MAX_ADV_FRACTION，超则 OrderTooLargeError 否决+上游拆分）
      usage_frequency: 储备        # 40号§4.4：个人资金极低频
    applicable_scenario: 超大单（>15% ADV，平衡冲击成本与时机风险）；个人资金罕见触发，储备能力
    warmup_participation_rate: null
    cooling_period: null
    anti_gaming: {timing_randomization: none, size_jitter: 0.0}      # 指数衰减轨迹本身非等间隔，MVP 不叠加随机化
    tca_metrics: [vwap_slippage, implementation_shortfall, fill_rate]
    market_impact_model: almgren_chriss 启发式近似（40号§2.3 注：非完整 QP；I-Star/propagator Phase 1.5+）
