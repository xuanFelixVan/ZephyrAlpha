  - execution_algo_id: EXA-ICEBERG-001
    name: Iceberg
    name_zh: 冰山算法（小额显示量隐藏大单）
    aliases: [ICEBERG, 冰山, 隐藏大单]
    algo_class: iceberg
    formula: 母单拆小，每次仅暴露小额显示量（visible peak），成交后补充挂单，隐藏真实订单意图
