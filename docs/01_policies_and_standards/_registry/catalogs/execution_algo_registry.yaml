    name: Volume-Weighted Average Price
    name_zh: 成交量加权平均价（按日内量能分布切片）
    aliases: [VWAP, 量能切片]
    algo_class: vwap
    formula: 按日内成交量分布加权切片 w_i=V_i/ΣV（A股 U 型：开盘20%/上午25%/午盘10%/尾盘45%，DEFAULT_VOLUME_PROFILE 代码真源）
