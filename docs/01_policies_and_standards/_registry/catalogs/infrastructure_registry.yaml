# ============================================================================
# 基础设施登记
# ============================================================================
# 字段说明:
#   infra_id            唯一标识，格式 INFRA-{TYPE}-{NNN}
#   name                组件名
#   type                类型（见 _schema.infra_types）
#   description         一句话说明
#   runtime_plane       运行时平面（hot/warm/cold）
#   host                host:port 或连接串（experimental 填具体值）
#   access_method       访问方式：模块/函数入口 + 安全参数（如 read_only=True）。数据库类组件必填，新 AI 读此字段即可安全访问数据库
#   health_check        健康检查：ping/http/tcp/query
#   dependency_of[]     被哪些模块依赖（module_id）
#   sla                 SLA 承诺
#   status              状态（planned → provisioned → connected …）
#   provisioned_at      创建时间（空 = planned）
#   note                备注
# ============================================================================

infrastructure:
  # --- 事件总线（RI-01 EventBus）---
  - infra_id: "INFRA-EVT-001"
    name: "zephyr-event-bus"
    type: event_bus
    description: "跨模块事件分发——基于 Redis Pub/Sub 或 RabbitMQ"
    runtime_plane: hot
    host: null
    health_check: ping
    dependency_of:
      - "MOD-INF-002"
      - "MOD-INF-001"
    sla: "99.9% uptime, < 100ms publish-delivery"
    status: planned
    provisioned_at: null
    note: "RI-01 EventBus 定义在 runtime-integration blueprint §4.2.1"

  # --- 消息队列（离线批处理 + 异步任务）---
  - infra_id: "INFRA-MQ-001"
    name: "zephyr-task-queue"
    type: message_queue
    description: "离线批处理 + 异步 AI 审计任务队列——基于 Celery + Redis"
    runtime_plane: cold
    host: null
    health_check: ping
    dependency_of:
      - "MOD-INF-005"
      - "MOD-TASK_SYSTEM"
    sla: "99.5% uptime, < 5s task pickup delay"
    status: planned
    provisioned_at: null
    note: "脚本系统离线阶段依赖此队列（实验阶段）"

  # --- 关系数据库（SQLite 任务库）---
  - infra_id: "INFRA-DB-001"
    name: "zephyr-sqlite-task-db"
    type: relational_db
    description: "SQLite 任务库——存放 TaskCard、状态迁移历史、Audit Trail"
    runtime_plane: cold
    host: ".runtime/db/data/databases/governance.db"
    access_method: "入口: zephyr.governance.task_repo.TaskRepository（高级 API）/ zephyr.governance.sqlite_schema.get_db_connection（低级 API）；验证: python -c \"from zephyr.governance.task_repo import TaskRepository; r=TaskRepository(); print(len(r.list_all()))\""
    health_check: query
    dependency_of:
      - "MOD-TASK_SYSTEM"
      - "MOD-INF-005"
    sla: "persisted, ACID, < 30ms read p50"
    status: connected
    provisioned_at: "2026-05-02"
    note: "Schema 源：task-system/blueprint.md §2.1；迁移路径见 task-card-meta-registry.md。ARCH-046 铁律2：governance.db 实际存在并使用（TaskRepository 已运营），按「存在=运营态」逻辑 status: planned→connected（2026-07-04 修正）"

  # --- 向量数据库（ChromaDB，VMS 双后端过渡期）---
  - infra_id: "INFRA-DB-002"
    name: "zephyr-chroma-vector-db"
    type: vector_db
    description: "向量检索与 KMS 语义检索——VMS (MOD-INF-011) 主向量后端，ChromaDB→FAISS 迁移过渡期"
    runtime_plane: cold
    host: "data/vector_db/"
    access_method: "入口: zephyr.integration.vector_memory.collection_manager.CollectionManager（内部用 chromadb.PersistentClient(path=data/vector_db/)）；迁移脚本: zephyr.integration.vector_memory.migrate_chroma_to_faiss.py"
    health_check: query
    dependency_of:
      - "MOD-INF-011"
      - "MOD-CONTEXT_ENGINE"
      - "MOD-KB-001"
      - "MOD-TASK_SYSTEM"
    sla: "< 200ms retrieval p95, index rebuild < 10 min"
    status: provisioned
    provisioned_at: "2026-05-05"
    note: "KBG-0031：ChromaDB 选型。实际部署 2026-05-05；PersistentClient 本地持久化 data/vector_db/（ARCH-LOCK-002 锁定）。8 Collection（5×1024d BGE-M3 + 3×512d bge-small-zh-v1.5）。ARCH-LOCK-003 锁定目标后端为 FAISS HNSW + SQLite WAL，当前处于 ChromaDB→FAISS 迁移过渡期，chroma.sqlite3（旧）与 vms_metadata.db+.index（新）共存；migrate_chroma_to_faiss.py 为迁移脚本。P3-T1 pgvector 处于 Suspended（消费方为零）"

  # --- 缓存（Redis）---
  - infra_id: "INFRA-CACHE-001"
    name: "zephyr-redis-cache"
    type: cache
    description: "Redis 缓存——Session Context / SSoT 校验缓存 / Embedding Cache"
    runtime_plane: warm
    host: null
    health_check: ping
    dependency_of:
      - "MOD-INF-001"
      - "MOD-TASK_SYSTEM"
    sla: "99.9% uptime, < 5ms GET p99"
    status: planned
    provisioned_at: null
    note: "capacity-assurance experimental 引入 Redis 缓存 SLI/SLO"

  # --- 对象存储（MinIO/S3）---
  - infra_id: "INFRA-STORE-001"
    name: "zephyr-object-storage"
    type: object_storage
    description: "MinIO/S3 对象存储——Session Log 归档 / KMS KO 文件 / 审计快照"
    runtime_plane: cold
    host: null
    health_check: http
    dependency_of:
      - "MOD-INF-005"
      - "MOD-TASK_SYSTEM"
    sla: "99.9% durability, < 100MB/s write"
    status: planned
    provisioned_at: null
    note: "beta 脚本系统归档依赖 S3；开发期可用本地 MinIO"

  # --- 配置中心（RI-04 ConfigCenter）---
  - infra_id: "INFRA-CFG-001"
    name: "zephyr-config-center"
    type: config_center
    description: "配置中心 — YAML 集中管理、热加载、版本化"
    runtime_plane: hot
    host: null
    health_check: http
    dependency_of:
      - "MOD-INF-002"
      - "MOD-TASK_SYSTEM"
    sla: "99.9% uptime, < 100ms config read"
    status: planned
    provisioned_at: null
    note: "RI-04 ConfigCenter——runtime-integration blueprint §4.2.4"

  # --- 服务注册（大规模模块后的服务发现）---
  - infra_id: "INFRA-SVC-001"
    name: "zephyr-service-registry"
    type: service_registry
    description: "模块服务发现 — 与 module-registry 元数据联动"
    runtime_plane: hot
    host: null
    health_check: http
    dependency_of:
      - "MOD-INF-002"
    sla: "99.9% uptime, < 50ms service lookup"
    status: planned
    provisioned_at: null
    note: "beta 大规模模块后启用；当前少量模块阶段手动管理即可"

  # --- CI/CD（GitHub Actions 治理流水线）---
  - infra_id: "INFRA-CI-001"
    name: "github-actions-governance-audit"
    type: ci_pipeline
    description: "GitHub Actions Governance Audit（windows-latest；升级 pip/setuptools/wheel 后 requirements-dev.txt + pip install -e .）；触发含 architecture_model/tests/data"
    runtime_plane: hot
    host: ".github/workflows/governance.yml"
    health_check: http
    dependency_of:
      - "MOD-TASK_SYSTEM"
    sla: "push/PR paths + workflow_dispatch；timeout 15m"
    status: connected
    provisioned_at: "2026-05-06"
    note: "paths 含 workflows/infra/config/architecture_model/tests/data/src/docs/scripts、requirements*、demo_e2e、docker-compose、门面文档、.editorconfig/.env.example/.gitignore/LICENSE、.trae、_patches；安装：pip+setuptools/wheel → requirements-dev → pip install -e .；pyproject 为 setuptools.build_meta + src"

  # --- 资源优化引擎进程池（MOD-RESOURCE_OPTIMIZATION_ENGINE）---
  - infra_id: "INFRA-PROC-001"
    name: "zephyr-shared-process-pool"
    type: cache
    description: "共享进程池——ResourceOptimizationEngine 管理的常驻工作进程池，避免子进程频繁创建销毁"
    runtime_plane: warm
    host: "in-process"
    health_check: ping
    dependency_of:
      - "MOD-RESOURCE_OPTIMIZATION_ENGINE"
    sla: "进程复用率 ≥ 80%，启动延迟 < 500ms"
    status: planned
    provisioned_at: null
    note: "MOD-RESOURCE_OPTIMIZATION_ENGINE 资源优化引擎——MAPE-K 循环驱动，进程池共享架构"

  # --- 资源优化引擎 I/O 缓存（MOD-RESOURCE_OPTIMIZATION_ENGINE）---
  - infra_id: "INFRA-CACHE-002"
    name: "zephyr-io-cache"
    type: cache
    description: "I/O 缓存——ResourceOptimizationEngine 管理的文件读取缓存层，LRU 淘汰策略"
    runtime_plane: warm
    host: "in-process"
    health_check: ping
    dependency_of:
      - "MOD-RESOURCE_OPTIMIZATION_ENGINE"
    sla: "缓存命中率 ≥ 90%，内存占用 < 512MB"
    status: planned
    provisioned_at: null
    note: "MOD-RESOURCE_OPTIMIZATION_ENGINE 资源优化引擎——I/O 缓存 + 流式读取 + 懒加载"

  # --- 依赖架构图库（depgraph，PostgreSQL 16，P2迁移已完成 2026-06-28）---
  - infra_id: "INFRA-DB-003"
    name: "zephyr-depgraph-db"
    type: relational_db
    description: "依赖架构图库——存储 nodes/edges/domains/infrastructure_components 等28表，架构治理真源（PostgreSQL 16）"
    runtime_plane: hot
    host: "localhost:5432/depgraph"
    access_method: "入口: zephyr.governance.depgraph_schema.get_depgraph_pg_connection()（统一入口）；导出工具: scripts/governance/extract_depgraph.py；连接配置: config/.env.postgres"
    health_check: query
    dependency_of:
      - "MOD-INF-012B"
      - "MOD-GOVERNANCE"
    sla: "ACID, MVCC, < 30ms read p50"
    status: connected
    provisioned_at: "2026-06-28"
    note: "P2迁移已完成（2026-06-28闭环）：SQLite→PostgreSQL 16；连接配置 config/.env.postgres；统一入口 get_depgraph_pg_connection()；DEPGRAPH_DB_PATH 常量仅保留作历史路径引用"

  # --- OLAP 分析引擎（DuckDB 内存模式）---
  - infra_id: "INFRA-DB-004"
    name: "zephyr-olap-engine"
    type: cache
    description: "DuckDB OLAP 分析引擎——内存模式(:memory:)只读挂载 governance.db 执行聚合查询，输出 Parquet 归档"
    runtime_plane: warm
    host: ":memory:"
    access_method: "入口: zephyr.governance.persistence.olap_engine.OLAPEngine（:memory: 模式，ATTACH governance.db 只读分析；禁止写入）"
    health_check: query
    dependency_of:
      - "MOD-INF-012A"
      - "MOD-TASK_SYSTEM"
      - "MOD-FEEDBACK_LOOP"
    sla: "内存模式，无持久化SLA；查询延迟 < 200ms p95"
    status: connected
    provisioned_at: "2026-06-15"
    note: "olap_engine.py L131 默认 :memory: 模式，ATTACH governance.db 只读分析；不迁移，P2后保持不变。ARCH-046 铁律2：OLAPEngine 实际在用（dashboard 3 文件消费：app.py/gate_statistics.py/olap_trend.py），按「存在=运营态」逻辑 status: planned→connected（2026-07-04 修正）"

  # --- 业务行情仓库（ClickHouse，2026-07-04 补登，c1_market）---
  - infra_id: "INFRA-DB-006"
    name: "zephyr-clickhouse-c1-market"
    type: relational_db
    description: "ClickHouse 业务行情仓库——c1_market 数据库，存放日线/分钟线/Tick/5档盘口/可转债隐含波动率/期货期限结构等行情数据。替代已删除的 INFRA-DB-005 market.duckdb。由母蓝图 docs/03_modules/_cross_layer/database/sub_blueprints/c1_market_clickhouse.md 定义。"
    runtime_plane: hot
    host: "localhost:9000/c1_market"
    access_method: "入口: zephyr.infrastructure.database_service.DatabaseService.get_clickhouse_conn()（统一入口，settings={'readonly': 1}）；蓝图: docs/03_modules/_cross_layer/database/sub_blueprints/c1_market_clickhouse.md；写入接口: c1_market_writer.py（待建）；查询接口: c1_market_reader.py（待建）"
    health_check: query
    dependency_of:
      - "MOD-DATA"
      - "MOD-BACKTEST"
      - "MOD-TRADING"
    sla: "持久化, 列式压缩, < 50ms write p95, < 200ms OLAP query p95"
    status: connected
    provisioned_at: "2026-07-01"
    note: "ClickHouse 26.6.1 部署在 WSL2 Ubuntu (D:\\WSL\\Ubuntu\\ext4.vhdx)，已创建 c1_market 数据库及 daily_kline 表。DatabaseService L86-101 已实现 get_clickhouse_conn()。MOD-ARCH-BIZDB 业务数据库顶层架构。母蓝图: docs/03_modules/_cross_layer/database/business_data_architecture.md。"

