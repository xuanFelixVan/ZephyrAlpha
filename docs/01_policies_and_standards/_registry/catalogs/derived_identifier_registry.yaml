# [A_config] module_id=CFG-derived-identifier-registry | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
module_id: REG-DERIVED-ID-001
ttl: permanent
title: 派生标识符关系表
doc_type: register
registry_id: REG-DERIVED-ID-001
name: 派生标识符关系表
description: 派生标识符关系唯一真源（SSoT）。记录从 domain_id 派生的子标识符关系（blueprint_id 域片段、节点路径域片段）。domain_id 改名时，apply_depgraph.py --propagate-rename 依据本表执行派生标识符同步传播（精确值映射，禁止子串REPLACE）。裁定#206 B-5/B-6 + 裁定#207 R3-4。
owner: MOD-INF-037
tier: tier_1_governance
status: active
version: 1.0.0
created: '2026-06-26'
last_updated: '2026-06-26'
# 裁定#206 B-5/B-6 + 裁定#207 R3-4: 派生标识符关系入库，防改名时派生ID残留旧域片段
unique_key:
- derived_type
- derived_field
entry_schema:
  derived_type: str          # blueprint_id | node_path
  source_field: str          # 源标识符所在表.列
  derived_field: str         # 派生标识符所在表.列
  derivation_rule: str       # 派生规则描述
  propagation_method: str    # exact_value_map | sequential_renumber
  sequence_required: bool    # 序号是否必填(裁定#208 R5: 派生轨=false可选, layer-master轨=true必填)
  format_pattern: str        # 格式正则(裁定#208 R5: 派生轨=^MOD-[A-Z]+(?:_[A-Z]+)*(?:-\d+)?$)
  scope: str                 # 适用轨道(裁定#208 R5: layer-master | domain-functional)
  source_doc: str
entries:
- derived_type: blueprint_id
  source_field: nodes.domain_id
  derived_field: nodes.blueprint_id
  derivation_rule: blueprint_id 域片段派生自 domain_id（去掉 D- 前缀后的片段），如 D_ASHARE_SIGNAL → MOD-ASHARE_SIGNAL[-NNN]（序号可选）；blueprint_id 命名格式见 trae_028 模块ID格式condition双轨制domain-functional轨
  propagation_method: exact_value_map
  sequence_required: false
  format_pattern: "^MOD-[A-Z]+(?:_[A-Z]+)*(?:-\\d+)?$"
  scope: domain-functional
  source_doc: docs/01_policies_and_standards/rules/trae_028_doc_structure_naming.yaml §gov_doc_003_derived_identifiers
- derived_type: blueprint_id
  source_field: blueprint_links.blueprint_id（FK→nodes.blueprint_id）
  derived_field: blueprint_links.blueprint_id
  derivation_rule: 跟随 nodes.blueprint_id 同步传播（blueprint_links 为 nodes 的派生视图，由 sync_blueprint_links 重建）
  propagation_method: exact_value_map
  sequence_required: false
  format_pattern: "^MOD-[A-Z]+(?:_[A-Z]+)*(?:-\\d+)?$"
  scope: domain-functional
  source_doc: docs/01_policies_and_standards/rules/trae_028_doc_structure_naming.yaml §gov_doc_003_derived_identifiers
- derived_type: node_path
  source_field: nodes.domain_id
  derived_field: nodes.path
  derivation_rule: 节点路径域片段派生自 domain_id，格式为 D-{DOMAIN片段}-{SEQ}，如 D_ASHARE_SIGNAL → .../D-ASHARE_SIGNAL-01；编号按域内顺序分配（裁定#206 B-9 重新编号策略）
  propagation_method: sequential_renumber
  sequence_required: true
  format_pattern: "^D-[A-Z]+(?:_[A-Z]+)*-\\d+$"
  scope: domain-functional
  source_doc: docs/01_policies_and_standards/rules/trae_028_doc_structure_naming.yaml §gov_doc_003_derived_identifiers
- derived_type: node_path
  source_field: blueprint_links.blueprint_path（FK→nodes.path）
  derived_field: blueprint_links.blueprint_path
  derivation_rule: 跟随 nodes.path 同步传播（blueprint_links 为 nodes 的派生视图，由 sync_blueprint_links 重建）
  propagation_method: exact_value_map
  sequence_required: true
  format_pattern: "^D-[A-Z]+(?:_[A-Z]+)*-\\d+$"
  scope: domain-functional
  source_doc: docs/01_policies_and_standards/rules/trae_028_doc_structure_naming.yaml §gov_doc_003_derived_identifiers
