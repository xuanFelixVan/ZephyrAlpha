# --- #ARCH-049: 临时文件乱放根目录治本（FILE-PLACEMENT-TTL gate 落地永久区准入机制） ---
- issue_id: '#ARCH-049'
  title: 临时文件乱放根目录治本——FILE-PLACEMENT-TTL gate 落地 ttl_vocabulary §146-152 永久区准入机制
  severity: P1高
  adjudication: |
    ARCH-049 裁定：新建 in-process gate FILE-PLACEMENT-TTL（priority=33），治本"AI 创建临时文件乱放根目录或永久区"的病根。

    【病根（5-Why 根因分析）】
    症状：2026-07-05 audit_assignment/ 临时文件夹放项目根目录（应在 docs/_working/）。

    Why-1：为什么临时文件放根目录？因为 AI 创建文件时无路径约束门禁。
    Why-2：为什么无路径约束门禁？因为 ttl_vocabulary.yaml §146-152 设计了永久区准入机制但标注"后续实现"未施工。
    Why-3：为什么标注"后续实现"未施工？因为 GitCommitGateway 预留了 allow_promote 参数 + PROMOTION_BLOCKED 常量但无检查逻辑。
    Why-4：为什么有预留无实现？因为永久区准入需要动态加载 directory_contract.yaml，原硬编码 _PERMANENT_ZONE_DIRS 是第四份真源。
    Why-5（根因）：路径约束与 TTL 约束分离设计——TTL 门禁只校验 ttl 字段合法性，不校验 ttl↔路径一致性；
    目录门禁只校验扩展名，不校验新文件准入。两个门禁各管一摊，"临时文件乱放"的空隙无人覆盖。

    【治本方案】
    新建 FILE-PLACEMENT-TTL gate（priority=33，在 TTL-METADATA(32) 之后、R5-DIGIT-SUFFIX(35) 之前），
    三重校验：
    1. 永久区准入（PROMOTION_BLOCKED）：permanent.paths 新文件需 allow_promote=True（exempt_subdirs 生成器输出豁免）
       ——只对新增文件检查（修改文件不触发）
    2. TTL↔zone 一致性：frontmatter.ttl=permanent 但在临时区 → 阻断；frontmatter.ttl=task_bound 但在永久区 → 阻断
       ——对所有文件检查（持续约束）
    3. 根目录子目录准入：第一级目录不在 directory_zones 所有 paths → 阻断（防止 audit_assignment/ 这类乱建子目录）
       ——只对新增文件检查（修改文件不触发）；以 . 开头的隐藏目录豁免

    【防复发三重防御】
    1. 门禁阻断：FILE-PLACEMENT-TTL gate 在 pre-commit 阶段阻断违规文件
    2. 真源动态加载：从 directory_contract.yaml + ttl_vocabulary.yaml 动态加载路径，禁止硬编码
    3. capability 登记：file_placement_ttl_gate capability 登记 + creation_token，新 AI 可发现

    【关联】
    - ttl_vocabulary.yaml §146-152——永久区准入机制设计（原"后续实现"，本 ARCH 落地）
    - directory_contract.yaml directory_zones——三区路径定义（permanent/temporary/neutral）
    - GitCommitGateway allow_promote 参数——PROMOTION_BLOCKED 状态接线
  fix_phase: |
    P0 DONE 2026-07-05：
    (a) ARCH-049 条目登记（本条目）
    (b) file_placement_ttl_gate.py 新建（in-process gate，priority=33，三重校验）
    (c) git_commit_gateway.py 注册 gate + allow_promote 透传 + PROMOTION_BLOCKED 状态映射
    (d) ttl_vocabulary.yaml §146-152 从"后续实现"改为"已实现，ARCH-049，2026-07-05"
    (e) directory_contract.yaml neutral zone 补充 session-logs/tmp/logs/_journals 路径
    (f) capability_canonical_file_registry.yaml 登记 file_placement_ttl_gate capability
    P1 TODO：测试用例补全（tests/governance/commit_gates/test_file_placement_ttl_gate.py）
  status: decided
  created: '2026-07-05'
  last_updated: '2026-07-05'

# --- #ARCH-050: 强化 --no-verify 使用约束（POST-COMMIT-GUARD hook） ---
- issue_id: '#ARCH-050'
  title: 强化 --no-verify 使用约束——POST-COMMIT-GUARD hook 检测 non-GW commit 并自动 revert
  severity: P1高
  adjudication: |
    ARCH-050 裁定：强化 --no-verify 使用约束，治本"AI/用户直接用 git commit --no-verify 绕过 GitCommitGateway 产生 non-GW commit"的病根。

    【病根（5-Why 根因分析）】
    症状：commit_gw_audit reconciler 检测到 non-GW commits（arch-debt 相关的 fix/docs commit，无 [GW: 标记）。

    Why-1：为什么有 non-GW commit？因为 AI/用户直接用 git commit --no-verify 提交，绕过了 GitCommitGateway。
    Why-2：为什么 --no-verify 能绕过 GitCommitGateway？因为 GitCommitGateway 是 in-process gate（Python 代码），
           --no-verify 绕过的是 pre-commit hook（shell 脚本），两者是不同的检查层。
    Why-3：为什么没有 post-commit 检测？因为现有 post-commit hook 只做 git-lfs 检查，没有 non-GW commit 检测。
    Why-4：为什么 commit_gw_audit reconciler 不阻断？因为它是事后审计（warn-only），commit 已入历史不可逆。
    Why-5（根因）：--no-verify 是 git 的合法参数，技术上无法禁止；但 post-commit hook 不被 --no-verify 绕过，
           可以在 post-commit 中检测 non-GW commit 并自动 revert，实现技术强制。

    【第一性原理：--no-verify 的边界】
    --no-verify 绕过的 hooks：pre-commit, commit-msg
    --no-verify 不绕过的 hooks：post-commit, post-merge, pre-push
    → post-commit 是检测 non-GW commit 的正确位置

    【治本方案】
    新建 POST-COMMIT-GUARD hook（post-commit）：
    1. 检测当前 commit message 是否含 [GW: 标记（GitCommitGateway / session_worktree_commit / session_worktree_merge 的合法标识）
    2. 检测是否是 merge commit（merge commit 豁免，subject 以 "merge " 开头，大小写不敏感）
    3. 不含 [GW: 且非 merge commit → 自动 git reset --soft HEAD~1（保留修改在 staging area）+ 记录违规到审计日志
    4. 输出告警信息，提示通过 GitCommitGateway 重新提交

    【合法标识（含 [GW: 标记的 commit）】
    - GitCommitGateway 常规 commit: [GW:{session_id}]
    - GitCommitGateway auto-commit: [GW:{session_id}:auto]
    - session_worktree_commit: [GW:{session_id}:worktree]
    - session_worktree_merge: [GW:{session_id}:merge]（ARCH-050 同期修复）

    【关联】
    - 裁定#208 R6——议题登记机制建立（本 ARCH 遵循铁律#6 登记）
    - commit_gw_audit reconciler——事后审计（本 ARCH 补强为事前阻断）
    - GitCommitGateway _run_git commit 守卫——禁止裸调 git commit（本 ARCH 补强 --no-verify 绕过场景）
  fix_phase: |
    P0 DONE 2026-07-05：
    (a) ARCH-050 条目登记（本条目）
    (b) scripts/governance/git_hooks/post_commit_guard.sh 新建（源文件，被 git 跟踪）
    (c) .git/hooks/post-commit 修改（追加 POST-COMMIT-GUARD 调用，本地有效）
    P1.5 DONE 2026-07-08：session_id 真实性验证层强化（闭环伪造 [GW: 标记残余风险）
    (d) post_commit_guard.sh L34-81 新增 session_id 验证逻辑：解析 [GW:{session_id}...]
        要求 sess- 前缀（治本描述文本误含 [GW: 片段的误判），查询 .runtime/session_registry.json
        注册表，未注册 → 伪造检测 → reset --soft HEAD~1
    (e) fail-open 设计：注册表不存在/解析失败 → 放行（避免环境问题阻断所有 commit）
    (f) AGENTS.md §10.1 同步更新两层验证描述
    P1 TODO：验证 hook 在并发 AI 对话场景下的行为（自动 revert 是否影响其他 AI 的工作流）
  status: decided
  created: '2026-07-05'
  last_updated: '2026-07-08'

# --- #ARCH-051: dataflowgraph 数据流图架构建设（同库不同表 + Dataset/Job 双类型） ---
- issue_id: '#ARCH-051'
  title: dataflowgraph 数据流图架构建设——与 depgraph 正交的第三维度全景图（同库不同表，Dataset/Job 双类型，设计态+运营态）
  severity: P1高
  adjudication: |
    ARCH-051 裁定：建设 dataflowgraph（数据流图）作为与 depgraph（依赖图）正交的第三维度全景图。
    治本"跨层数据流无中央真源、靠 cross_layer_contracts.yaml flow 字段（描述文本）+ 散落各模块的隐式假设推断"的病根。

    【病根（第一性原理推导）】
    症状：用户询问"数据流向怎么样？不会产生数据循环或数据错位？"时，无单一权威答案。
    Why-1：为什么无答案？因为项目中不存在 dataflowgraph/DataFlowGraph 任何形式（全项目零匹配）。
    Why-2：为什么不复用 depgraph？因为 depgraph 是模块依赖图（node=file/module，edge=import/contract），
           语义是"谁依赖谁"，不是"数据从哪流到哪"。两者是正交维度，合并会导致语义混淆。
    Why-3：为什么不复用 cross_layer_contracts.yaml？因为该文件是契约定义（schema 层），
           flow 字段是描述文本（如"Data Source → Alpha Factor"），不是可查询的结构化数据流图。
    Why-4：为什么不靠 AST 扫描代码推断？因为静态扫描只能得到"显式调用"，得不到运行时数据流
           （事件驱动/异步/动态分发），且无法表达 PIT 策略、回测内部数据流等设计态语义。
    Why-5（根因）：数据流是无中央真源的隐式知识，散落在 cross_layer_contracts.yaml / 各模块文档 /
           AI 推断中。100% AI 开发模式下，AI 每次推断数据流=幻觉温床（与 depgraph 缺失时的幻觉同构）。

    【7项架构裁定（治本方案）】
    裁定1：建设 dataflowgraph 作为第三维度全景图
      - depgraph（依赖图，已有）：node=file/module, edge=import/contract, 语义="谁依赖谁"
      - dataflowgraph（数据流图，本ARCH新建）：node=Dataset/Job, edge=data_flow, 语义="数据从哪流到哪"
      - decisiongraph（决策流图，另一AI对话建设）：node=decision_point, edge=decision_flow, 语义="决策如何触发"
      - 三图正交，通过 module_id 跨图关联（Job 节点的 source_code_ref 引用 depgraph 模块 path）
      - 不合并，各自独立演化

    裁定2：同库不同表（物理隔离方案）
      - dataflowgraph 6张表与 depgraph 25张表同在 PostgreSQL depgraph 数据库
      - 表名前缀 dataflow_*（dataflow_datasets/dataflow_jobs/dataflow_runs/dataflow_edges/
        dataflow_datasets_metadata/dataflow_jobs_metadata）
      - 共享连接配置（config/.env.postgres + get_depgraph_pg_connection() 模式）
      - 不共享 schema 结构（无 FK 跨图引用，避免耦合）
      - 写入互斥锁 key 不同：depgraph=424242, dataflowgraph=424243（避免互锁）

    裁定3：Dataset + Job 双类型节点（对齐 OpenLineage/Marquez 业界标准）
      - Dataset 节点：数据集（如 market_data.tick, factor.value_factor, backtest.tick_event）
        字段：entity_name, scope(production/backtest_internal), contract_ref(CTR-ID),
              physical_type, produced_by_job, domain_id, pit_policy, format_summary
      - Job 节点：数据变换作业（如 ingest_ifind_kline, compute_value_factor, replay_ticks）
        字段：job_name, source_code_ref(depgraph path), trigger_type, run_context,
              inputs[], outputs[], pit_relevance
      - 不设 Module 节点（模块已在 depgraph，通过 source_code_ref 关联）
      - Run 节点：Job 的运行实例（run_type: daily_backtest/minute_backtest/tick_backtest/production_run）

    裁定4：回测内部数据流纳入（通过 scope 字段区分）
      - Dataset.scope = production：生产数据流（CTR-001~006 契约数据）
      - Dataset.scope = backtest_internal：回测内部数据流（TickEvent/target_weights/fills/nav_series）
      - 回测内部 Dataset 的 contract_ref 为 NULL，physical_type 指向具体类（如 tick_replay.py::TickEvent）
      - 满足用户需求"未来回测也会有多个回测（日线回测分析大盘，分钟级回测找买卖点）"
        → Run.run_type 支持多回测类型枚举

    裁定5：三阶段渐进扫描策略（声明式 → AST → 运行时）
      - Phase 1（本批）：声明式 YAML 真源（dataflow_graph_registry.yaml），人工声明 14 Dataset + 13 Job
      - Phase 2（后续）：AST 扫描器，自动发现显式数据流（函数签名/contract 引用）
      - Phase 3（后续）：运行时 instrumentation，捕获事件驱动/异步/动态分发数据流
      - 三阶段渐进，不要求一次性完整（与 depgraph generate→apply→sync 三写模式一致）

    裁定6：复用 cross_layer_contracts.yaml，不重新定义契约
      - Dataset 节点的 contract_ref 字段引用 CTR-ID（如 CTR-001 NormalizedMarketData）
      - 不破坏 frozen 契约（CTR-001~004 frozen: true）
      - flow 字段（描述文本如"Data Source → Alpha Factor"）保留为派生属性，
        dataflowgraph 用独立 edge_type（push/pull/sync/async/event_driven）表达结构化数据流
      - 治本 cross_layer_contracts.yaml 未同步到 depgraph 的 contracts 表（schema_definition 列为空）
        → Phase 2 补 sync_contracts_to_depgraph()

    裁定7：设计态+运营态双态（对齐 depgraph 单表双态模式）
      - design_maturity 字段：design(设计态) / production(运营态) / prototype(原型)
      - build_status 字段：planned / generated / testing / stable / deprecated
      - 设计态=人工 curated 声明，运营态=扫描器/runtime 产出的真实快照
      - dataflow_datasets_metadata / dataflow_jobs_metadata 表保护人工 curated 字段
        （对齐 depgraph 裁定#209 Stage 2 字段角色分离模式）

    【业界对标】
    - OpenLineage：RunEvent(运行态) + JobEvent/DatasetEvent(设计态) 三事件模型，业界标准
    - Marquez：PostgreSQL 后端，Dataset/Job/Run 三实体，不可变版本化
    - ZephyrAlpha独创：PG + AI 自动维护 + 门禁校验（depgraph 模式自然延伸，dataflowgraph 同模式）

    【PIT 合规优先级】
    dataflowgraph 定为 P1.5（中高位），FeatureStore 落地前必须建好骨架。
    Two Sigma 事件警示：4.5年未发现的模型操纵导致$165M损失——证明独立审计轨迹的必要性。
    dataflowgraph 为 PIT 审计提供"数据从哪来、经过什么变换、到哪去"的完整轨迹。

    【关联】
    - 裁定#208 R6——议题登记机制建立（本 ARCH 遵循铁律#6 登记）
    - depgraph_schema.py——PG 连接配置模式参考（get_depgraph_pg_connection()）
    - cross_layer_contracts.yaml——CTR-001~006 契约真源（Dataset.contract_ref 引用）
    - apply_depgraph.py——CLI 风格参考（apply_dataflowgraph.py 对齐）
    - sync_yaml_to_depgraph.py——sync 模式参考（sync_dataflow_registry() 扩展）
    - 裁定#209 Stage 2——字段角色分离模式（nodes_metadata 模式复用）
  fix_phase: |
    Phase 1 全部施工（2026-07-06）：
    (a) ARCH-051 条目登记（本条目）
    (b) dataflow_graph_registry.yaml YAML 真源（14 Dataset + 13 Job）
        - 生产 Dataset：DS-001~010（market_data.tick/factor/signal/risk/order/fill/position/backtest.result）
        - 回测 Dataset：DS-011~014（tick_event/target_weights/fills/nav_series，scope=backtest_internal）
        - 生产 Job：JOB-001~008（ingest/aggregate/compute/synthesize/check/generate/execute）
        - 回测 Job：JOB-009~013（replay/run_event_driven/match/update_portfolio/calc_metrics）
    (c) 03_create_dataflow_schema.sql PG 表 DDL（6张表）
        - dataflow_datasets / dataflow_jobs / dataflow_runs / dataflow_edges
        - dataflow_datasets_metadata / dataflow_jobs_metadata（字段角色分离）
    (d) dataflowgraph_schema.py Python DDL + 连接入口（get_dataflowgraph_pg_connection，复用 _PG_ENV_PATH）
    (e) apply_dataflowgraph.py CLI 修改入口（--add-design-dataset/--add-design-job/--add-design-edge/--list-ops）
    (f) sync_yaml_to_depgraph.py 扩展 sync_dataflow_registry()（YAML→PG 只读缓存）
    (g) generate_dataflow_diagram.py Mermaid 文档生成器（输出 docs/02_enterprise_architecture/generated/dataflows/）
    (h) capability_canonical_file_registry.yaml 登记 dataflow_graph 能力
    Phase 2 TODO（后续专项工程）：
    - AST 扫描器（自动发现显式数据流）
    - 运行时 instrumentation（捕获事件驱动/异步数据流）
    - sync_contracts_to_depgraph()（治本 contracts 表 schema_definition 为空）
    - 两套 EventType 统一（shared/events/ vs shared/infra/observer.py）
  status: decided
  related_adjudication: '#208'
  created: '2026-07-06'
  last_updated: '2026-07-06'

