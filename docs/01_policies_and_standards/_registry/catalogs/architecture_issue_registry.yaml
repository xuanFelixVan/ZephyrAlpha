    Why2: 为什么 D_SIGLEGACY 被删除？因为 DM-100255 将其判定为空壳域（0 production_nodes）。
    Why3: 为什么 D_SIGLEGACY 有 0 production_nodes？因为裁定#201 将其保留为"设计态占位域"，实际代码分散到 3 个子域。
    Why4: 为什么 sync 脚本仍然硬编码 D_SIGLEGACY？因为删除域时只清理了 DB 层，未同步清理 YAML 真源和 sync 脚本硬编码。
    Why5: 为什么删除操作没有原子性传播？因为 cmd_delete_domain 只清理 DB 引用，不清理 YAML 真源/脚本硬编码/契约文件。
    根因：删除操作缺乏跨真源的原子性保证——"真源分裂"系统性问题。

    【第一性原理：layer 与 domain 是正交概念】
    layer = 逻辑分层（signal/factor/risk/...）——有 dir_prefix，描述数据流方向
    domain = 功能域（D_ASHARE_SIGNAL/D_FUNDAMENTAL_SIGNAL/D_SIGQC/...）——平级无父子，描述代码归属
    _LAYER_NAME_TO_DOMAIN 映射表的根本错误：假设每个 layer 必须对应一个 domain。
    但 signal 层实际包含 3 个平级子域，无法用单一 domain 代表。

    【三选项评估】
    A: 映射到 D_ASHARE_SIGNAL —— ❌ D_ASHARE_SIGNAL 是子域之一，不能代表整个 signal 层，违反"域平级无父子"铁律
    B: 返回 None/跳过 —— ✅ signal 层 C 轨占位已解除，但 4 个契约仍为 Draft，跳过不影响实际开发
    C: 新建 D_SIGNAL 域 —— ❌ 0 production_nodes → 又成空壳域 → 循环删除/新建

    【治本方案（分阶段）】
    P0（已完成 2026-07-04）：
