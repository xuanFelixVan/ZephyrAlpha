- issue_id: '#ARCH-CH-010'
  title: ClickHouse 连接传输架构重构（HTTP 端口 + 冷却期 + mirrored 模式兼容）
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景（三个关联子问题）：
    (A) HTTP 8123 端口落在 Windows Hyper-V 端口排除范围 8114-8213 内，
        ClickHouse 启动报 "Address already in use: 127.0.0.1:8123" 无法绑定 HTTP 服务。
    (B) 三级降级链（TCP→HTTP→WSL）中 HTTP 路径不可用时，每次请求都重复超时等待（死路径超时浪费）。
    (C) WSL2 mirrored 模式下 _discover_wsl_ip() 失败（hostname -I 返回空），
        且 Python urllib/socket 无法访问 WSL2 内 HTTP 服务（curl.exe 可访问但 Python 不行）。

    裁定：
    (1) HTTP 端口 8123→18123 避开 Hyper-V 排除范围（Phase 0.1，已完成）；
    (2) ch_writer.py 新增 HTTP 冷却期机制（_http_fail_ts + _HTTP_COOLDOWN_SEC=300），
        HTTP 探测失败后 300 秒内跳过 HTTP 路径，避免死路径超时浪费（Phase 0.2）；
    (3) 修复 delete_where() 使用不存在的 _CH_HTTP_HOST 常量 bug（改为 _get_http_host()）；
    (4) Phase 3 修复 _discover_wsl_ip() mirrored 模式兼容（hostname -I 返回空时的兜底）。
    本裁定是 #ARCH-CH-005（混合传输架构）的深化修复——#ARCH-CH-005 定义了三级降级链，
    但未处理端口排除范围、死路径超时、mirrored 模式兼容三个工程细节。
  impact:
  - /etc/clickhouse-server/config.d/enable_http.xml（http_port 18123）
  - src/zephyr/data/ch_writer.py（_CH_HTTP_PORT 18123 + _http_fail_ts 冷却期 + delete_where bug 修复）
  - src/zephyr/data/ch_writer.py（_discover_wsl_ip 已随 2026-07-16 Hyper-V 迁移移除，Phase 3 不再需要）
  fix_phase: '已完成（Phase 0.1+0.2 HTTP 端口迁移+冷却期；Phase 3 通过 2026-07-16 Hyper-V 迁移替代 WSL2，_discover_wsl_ip 函数已移除，不再需要 mirrored 兼容）'
  status: resolved
  related_rules:
