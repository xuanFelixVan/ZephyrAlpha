    （GATE-PATH-TREE 只管 arch_directory_tree，GATE-YAML-SYNC 只管规则缓存表），
    是设计缺口。
    核心裁定：分4阶段——阶段0纠正文档（即本裁定本身）；阶段1新增 GATE-DEPGRAPH-OPS
    reconciler（priority=130，trigger=commit .py）+ pg_advisory_lock 与 apply_depgraph.py
    互斥；阶段2字段角色分离治本（新建 nodes_metadata/edges_metadata 表，迁移
    PRODUCTION_PROTECTED_FIELDS + EDGES_PROTECTED_FIELDS）；阶段3增量能力建设
    （文件级 hash fingerprint）。
    第一性原理病根：运营态字段同时承担"派生数据"与"人工 curated 元数据"两种角色，
    业界主流是物理分离（Sourcegraph 派生索引+仓库元数据分离；Netflix 流量拓扑+
    服务所有权分离）。对标 Netflix/Stripe/Sourcegraph 自动触发主流做法。
