    - validate_layer_consistency.py——存在但未挂载，是 P1 PATH-REF-CONSISTENCY gate 的天然候选实现 [注：该文件已于2026-07-09作为死代码清理删除，PATH-REF-CONSISTENCY gate 需独立实现]
  fix_phase: |
    P0 DONE 2026-07-04：批量修复 31 处错误路径引用（11 个蓝图文件），全量 Grep 验证零残留。
