name: 架构议题注册表
description: 架构议题（#ARCH-XXX）唯一真源（SSoT）。登记所有架构治理议题的编号、状态、裁定与施工阶段。裁定#208 R6 建立，治本"#ARCH-XXX 无中央注册表、靠 grep-and-claim 占位"的病根。
owner: MOD-INF-037
tier: tier_1_governance
status: Active
version: 1.0.0
created: '2026-06-26'
last_updated: '2026-06-26'
# 裁定#208 R6+R7: 议题登记机制建立 + 编号分配铁律文档化

# ============================================================
# #ARCH 编号分配铁律（裁定#208 R7）
# ============================================================
# 1. 连续分配：#ARCH-NNN 按议题立项时间顺序连续分配，禁止跳号
# 2. 不回收：已分配编号永不回收，即使议题被废弃/superseded，编号仍保留
# 3. superseded_by 链：议题被新议题取代时，旧议题 status=superseded + 填 superseded_by=新议题ID；新议题 entries 中 reference 旧议题
# 4. status 四值：open(待施工) / decided(已裁定待施工) / deprecated(已废弃不施工) / superseded(已被新议题取代)
# 5. 编号预留：#ARCH-001~007 为早期预留编号（未正式登记，待回溯补录或永久保留为预留段）
# 6. 登记强制：任何 #ARCH-XXX 引用必须在本注册表有对应条目，禁止 grep-and-claim 占位

unique_key:
- issue_id

entry_schema:
  issue_id: str              # #ARCH-NNN
  title: str                 # 议题标题
  severity: str              # P0致命 | P1高 | P2中 | P3低
  adjudication: str          # 裁定/修复方案描述
  fix_phase: str             # 施工阶段
  status: str                # open | decided | deprecated | superseded
  superseded_by: str         # (可选) 取代本议题的新议题ID
  related_adjudication: str  # (可选) 关联裁定编号(如#208)
  created: str               # 立项日期
  last_updated: str          # 最后更新日期

entries:
