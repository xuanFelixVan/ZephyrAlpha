  created: '2026-07-15'
  last_updated: '2026-07-16'

# --- #ARCH-CH-012: ch_writer 锁分层——连接创建锁与 execute 串行化锁分离 ---
- issue_id: '#ARCH-CH-012'
  title: ch_writer 锁分层——_connect_lock（连接创建）与 _ch_lock（execute 串行化）分离
  severity: P2中
  category: data_architecture
  adjudication: |
    问题背景：
    run_schedule 并行化后（13 个 event_driven 任务并行），ch_writer 的 _ch_lock 同时保护
    两个完全不同层级的操作：(1) 连接创建（_get_client 内，含 _discover_wsl_ip subprocess 10s
    + TCP connect 3s，最坏 16s）；(2) execute 串行化（query/delete_where 内，毫秒级）。
    导致连接创建期间（16s）阻塞所有 execute。触发条件：冷启动首次 query + TCP 冷却期过期
    后重连（每 60s 一次周期性阻塞窗口）。

    裁定（治本方案）：
    (1) 新增 _connect_lock 保护 _ch_client/_ch_http_host 单例创建（秒级临界区）；
    (2) _ch_lock 仅保护 client.execute 串行化（毫秒级临界区）；
    (3) 两锁独立，连接创建不阻塞已有 client 的 execute；
    (4) 冷却期检查移到锁外快速路径，冷却期内不争抢锁立即返回 None 降级 HTTP API；
    (5) _get_http_host() 一并加 _connect_lock double-check locking（修复原无锁竞态）。
    锁顺序：_cache_lock → _connect_lock → _ch_lock（单向，无死锁）。
  impact:
  - src/zephyr/data/ch_writer.py（新增 _connect_lock + _get_client/_get_http_host 改用 _connect_lock）
  fix_phase: 已完成
  status: resolved
  related_rules:
  - '#ARCH-CH-004'
  - '#ARCH-CH-010'
  created: '2026-07-15'
  last_updated: '2026-07-15'

# --- #ARCH-CH-013: WSL2 失稳治本——本地落盘兜底+回灌+WSL 自愈 ---
- issue_id: '#ARCH-CH-013'
  title: WSL2 失稳致 CH 崩溃循环——本地落盘兜底+自动回灌+WSL 健康探活自愈
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    WSL2 虚拟机每 ~30 秒非正常停机一次（dmesg journal 腐蚀），导致 CH 进程被杀 +
    systemd 重启循环（单日 102 次重启）。根因：C 盘 93% 满（vhdx 宿主盘仅剩 15G）+
    WSL2 自身稳定性问题。表现为 wsl bash -c 返回 Wsl/Service/E_UNEXPECTED 灾难性故障。
    ch_writer.write_tsv 三级降级链（TCP→HTTP→WSL subprocess）全部失败时数据被丢弃。

    裁定（治本方案，三阶段）：
    Phase 1（代码层）：ch_writer.write_tsv 新增第四级降级——本地落盘兜底
    （local_replay.save_fallback），将 TSV 写入 data/local_fallback/*.tsv + JSONL manifest。
    scheduler 启动时 + 每 30 分钟自动回灌（local_replay.replay_batch），CH 恢复后数据回流。
    Phase 2（代码层）：scheduler 新增 WSL 健康探活线程（每 60s 探活 wsl -d Ubuntu -e echo ok），
    连续 3 次失败自动冷重启（wsl --shutdown → sleep 10s → wsl -d Ubuntu）。
    Phase 3（代码层，2026-07-15）：Phase 2 的"连续 3 次失败自动冷重启"存在误杀缺陷——
    systemd 用户会话故障（VM 存活、CH 可能仍在运行）被误判为 VM 崩溃，触发 wsl --shutdown
    误杀 CH 写入。Phase 3 新增 _classify_wsl_probe_result 区分故障类型：
    systemd 故障→抑制冷重启+告警；真正 VM 故障（E_UNEXPECTED）→保留冷重启。
    _probe_wsl 返回 (bool, classification) 供 _probe_loop 按分类决策。
    Phase 0（物理层，用户手动）：清理 C 盘 + 压缩 vhdx + 清理 83 个 broken-on-start part +
    修复 systemd 配置（RestartSec=30, 恢复 watchdog）。
    Phase 4（CH 稳定后）：OPTIMIZE TABLE c3_fundamental.news_data FINAL 消除 13721 parts 合并风暴。

    设计要点：
    - local_replay 原子写入（.tmp→rename）+ manifest 追加模式（JSONL）+ 线程安全（Lock）
    - 回灌复用 ch_writer.write_tsv，CH 可用时立即成功，失败保留待重试
    - WSL 探活独立于 CH 探活（后者只查 CH 不查 WSL），二者分工
  impact:
  - src/zephyr/data/local_replay.py（新建——本地落盘+回灌，保留并适用任意 CH 故障）
  - src/zephyr/data/ch_writer.py（write_tsv 新增第四级降级，保留）
  - src/zephyr/data/scheduler.py（_start_local_replay 保留；_start_wsl_health_probe + _classify_wsl_probe_result 已随 2026-07-16 Hyper-V 迁移移除）
  - docs/01_policies_and_standards/_registry/catalogs/capability_canonical_file_registry.yaml（local_replay.py creation_token 登记）
  fix_phase: 已完成（Phase 1 local_replay 保留；Phase 2+3 WSL 健康探活已随 2026-07-16 Hyper-V 迁移移除；Phase 0 根因已通过 Hyper-V 迁移治本消除；Phase 4 OPTIMIZE TABLE FINAL 待执行）
  status: resolved
  related_rules:
  - '#ARCH-CH-004'
  - '#ARCH-CH-010'
  - '#ARCH-CH-012'
  created: '2026-07-15'
  last_updated: '2026-07-16'

# --- #ARCH-CH-014: ch_writer 连接断开后冷却期失效——单例不自愈缺陷 ---
- issue_id: '#ARCH-CH-014'
  title: ch_writer 连接断开后冷却期失效——单例不自愈缺陷
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    ch_writer 的 _ch_client (TCP) 和 _ch_http_host (HTTP) 单例在连接成功后被缓存。
    当 CH 重启导致连接断开时，query()/_http_insert() 的 execute/请求失败路径
    不清理单例 + 不设冷却期，导致下次调用 _get_client()/_get_http_host() 的快速路径1
    返回已断开的旧单例，冷却期机制完全失效。表现：CH 重启后 scheduler 持续 degraded，
    必须人工重启 scheduler 才能恢复，违反"永久系统必须全自动"硬约束。

    裁定（治本方案）：
    (1) 新增 _invalidate_tcp_client(reason) 函数：清理 _ch_client=None + 设 _tcp_fail_ts
    (2) 新增 _invalidate_http_host(reason) 函数：清理 _ch_http_host=None + 设 _http_fail_ts
    (3) query() TCP execute 失败时调用 _invalidate_tcp_client()
    (4) query() HTTP 请求失败时调用 _invalidate_http_host()
    (5) _http_insert() HTTP 请求失败时调用 _invalidate_http_host()
    修复后自愈链路：execute 失败 → 清理单例+设冷却期 → 冷却期过后重试 → 成功

    这是 #ARCH-CH-010（冷却期机制）的深化修复——原设计只处理"首次连接失败"场景，
    未处理"连接成功后断开"场景。
  impact:
  - src/zephyr/data/ch_writer.py（新增 _invalidate_tcp_client + _invalidate_http_host + 3 处失败路径调用）
  fix_phase: 已完成
  status: resolved
  related_rules:
  - '#ARCH-CH-004'
  - '#ARCH-CH-010'
  - '#ARCH-CH-012'
  - '#ARCH-CH-013'
  created: '2026-07-15'
  last_updated: '2026-07-15'

# --- #ARCH-DATA-014: L2 行情权限缺失——优雅降级+权限预检 ---
- issue_id: '#ARCH-DATA-014'
  title: L2 行情权限缺失——优雅降级到五档快照+权限预检机制
  severity: P2中
  category: data_architecture
  adjudication: |
    问题背景：
    l2_tick 任务使用 miniQMT get_l2_quote 拉取逐笔行情，但该接口需 L2 行情权限。
    L2 权限绑定券商账号（资金门槛 50 万+），非 API key/订阅权限；部分券商 miniQMT 不支持 L2。
    当前账号无 L2 权限，导致 l2_tick 表 0 行。

    裁定（治本方案）：
    (1) miniqmt_provider 新增 _probe_l2_permission() 方法，启动时探测 L2 权限（结果缓存）；
    (2) _fetch_l2_tick 开头预检 L2 权限，无权限时 yield FetchResult(error="...降级...") 并 return；
    (3) tasks.yaml l2_tick_snapshot 任务配置 fallback_sources（降级到 tick_snapshot/get_full_tick 五档快照，
        写入 tick_data 表，免费）；
    (4) 代码层面无法"修复"权限缺失（需用户开通券商 L2 权限），但可优雅降级避免任务持续失败。

    设计要点：
    - 权限探测结果缓存在 self._has_l2，避免重复探测开销
    - 降级路径写入 tick_data 表（get_full_tick 三秒快照含五档），非 l2_tick 表
    - 任务级 fallback_sources 配置允许数据韧性三层机制自动切换
  impact:
  - src/zephyr/data/implementations/miniqmt_provider.py（_probe_l2_permission + _fetch_l2_tick 预检）
  - src/zephyr/data/config/tasks.yaml（l2_tick_snapshot fallback_sources + requires_permission）
  fix_phase: 已完成（代码层降级）；用户开通 L2 权限后可恢复原 l2_tick 拉取
  status: decided
  created: '2026-07-15'
  last_updated: '2026-07-15'

# --- #ARCH-CH-015: tick_data 破损 part 致 merge 死循环——自动检测+DETACH 隔离防复发 ---
- issue_id: '#ARCH-CH-015'
  title: tick_data 破损 part 致 merge 死循环——DETACH 止血+自动检测防复发
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    WSL2 失稳致 CH 崩溃时，正在写入的 data part 被零字节覆盖（Lessons Learned 已记录），
    形成 checksum 损坏的 active part。CH 后台 merge 线程反复尝试合并包含这些 part 的
    任务，失败 718 次（CHECKSUM_DOESNT_MATCH），临时目录清理 5142 次，形成无限循环，
    消耗大量 CPU/IO，致 scheduler 探针超时 status=degraded。

    Phase 0 未覆盖原因：Phase 0 清理的是"启动时检测到的 broken-on-start part"（83 个），
    但 checksum 损坏的 part 在 CH 启动时不验证数据完整性（只验证 metadata），
    只在 merge 读取 part 数据文件时才发现 checksum 不匹配。因此这 2 个破损 part
    作为 active part 一直存在，直到 merge 线程尝试读取才触发错误循环。

    裁定（治本方案，三阶段）：
    Phase 1（止血，已完成）：SYSTEM STOP MERGES → mv 2 个破损 part 到 detached/
      → 重启 CH 清空 merge 队列缓存 → SYSTEM START MERGES。
      数据丢失：202304 丢失 3217 万行（9.7%），202305 丢失 3546 万行（10.8%），
      共 6763 万行 801 MiB。
    Phase 2（数据恢复，待评估）：检查 bdpan 原始数据是否可用，可用则重新导入缺失数据。
    Phase 3（防复发，已完成）：在 scheduler.py 新增 _start_corrupted_part_detector
      自愈守护线程，每 5 分钟检查 CH err.log 中的 CHECKSUM_DOESNT_MATCH，
      检测到破损 part 后自动执行：SYSTEM STOP MERGES → ALTER TABLE DETACH PART
      → SYSTEM START MERGES → 审计日志 + 告警。
      设计要点：
      - 不新建独立模块（符合"能现成不创造"原则），集成到 scheduler.py 第四个自愈线程
      - 单次检测周期只处理 1 个破损 part（避免并发操作冲突）
      - 处理后冷却 10 分钟（避免频繁操作）
      - processed_parts 内存集合防止重复处理
      - part 名称安全校验（^[a-zA-Z0-9_-]+$ 防 SQL 注入）
      - 审计日志写入 data/local_fallback/corrupted_parts_audit.jsonl
      - 使用 ch_reader 查询 system.parts（读取层），ch_writer 执行 SYSTEM/DDL（写入层）
  impact:
  - src/zephyr/data/scheduler.py（新增 _start_corrupted_part_detector + start() 调用）
  - data/local_fallback/corrupted_parts_audit.jsonl（审计日志，运行时生成）
  fix_phase: Phase 1+3 已完成；Phase 2 待评估
  status: decided
  related_rules:
  - '#ARCH-CH-004'
  - '#ARCH-CH-013'
  - '#ARCH-CH-014'
  created: '2026-07-15'
  last_updated: '2026-07-15'

# --- #ARCH-CH-016: task_queue 并发竞态——调度周期串行化锁 ---
- issue_id: '#ARCH-CH-016'
  title: task_queue 并发竞态致 KeyError('未知 task_id')——_schedule_dag_lock 串行化
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    _run_schedule_dag 第155行 scheduler._task_queue = TaskQueue() 每个调度周期重建队列。
    多个 cron 时段并发触发时（如 event_driven 每15分钟 + daily_event 19:00 同时触发），
    后到的调度周期重建 _task_queue 覆盖前一个，导致正在执行的任务调用 mark_completed
    时抛 KeyError('未知 task_id')（task_queue.py mark_completed 检查 task_id in _tasks，
    新队列不含旧 task_id）。

    根因分析：
    APScheduler max_instances=1 只限制同一 job 不并发，但不同 schedule 的 job 可并发。
    event_driven（interval 15min）与 daily_event（cron 19:00）在 19:00 同时触发，
    两个 _run_schedule_dag 线程并发执行，竞态覆盖 _task_queue。

    治本方案：
    新增模块级 _schedule_dag_lock = threading.Lock()，_run_schedule_dag 全函数体
    with _schedule_dag_lock: 串行化。多个调度周期排队执行，避免 _task_queue 竞态覆盖。
    代价：调度周期串行，但单次调度内部仍并行（ThreadPoolExecutor max_workers=8），
    性能影响可忽略（调度周期本身是 IO 密集，串行等待无瓶颈）。
  impact:
  - src/zephyr/data/scheduler.py（新增 _schedule_dag_lock + _run_schedule_dag 加锁）
  fix_phase: 已完成
  status: decided
  related_rules:
  - '#ARCH-CH-013'
  - '#ARCH-CH-014'
  created: '2026-07-16'
  last_updated: '2026-07-16'

# --- #ARCH-CH-017: CH 连接配置单真源化（Hyper-V 迁移后配置完整性） ---
- issue_id: '#ARCH-CH-017'
  title: CH 连接配置单真源化——ch_writer 硬编码 IP 默认值 + scheduler 不加载 .env.clickhouse
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    Hyper-V 迁移后，config/.env.clickhouse 已更新 CLICKHOUSE_HOST=172.24.30.100，
    但 ch_writer.py 用 os.environ.get("CLICKHOUSE_HOST", "172.24.30.100") 硬编码默认值，
    database_service.py 用 get_secret_from_file_or_default(..., "localhost") 默认值，
    两者默认值不一致且都不主动加载 .env.clickhouse。scheduler.main() / cli._load_dotenv()
    也不加载该文件（cli 只加载项目根 .env）。当前 ch_writer 能连上 CH 纯属硬编码默认值
    巧合等于 .env.clickhouse 的值，CH 再迁移一次就会暴露。

    根因分析（第一性原理——100% AI 开发模式约束）：
    AI 写的代码只会 os.environ.get(...)，不会主动 load_dotenv(".env.clickhouse")。
    配置文件加载必须由"启动入口"显式承担，否则配置真源形同虚设。ch_writer 的硬编码
    默认值是"巧合成功"——它掩盖了配置真源的违反。

    治本方案：
    1. 新增 zephyr.data.ch_config 模块作为 CH 配置单真源加载器：
       - ensure_ch_env_loaded(): 幂等加载 .env.clickhouse 到 os.environ
       - load_ch_config(): 返回配置字典，CLICKHOUSE_HOST 缺失抛 CHConfigError（fail-closed）
    2. ch_writer.py 模块级调用 ensure_ch_env_loaded()，删除硬编码 IP 默认值
       （_CH_HOST 默认空字符串，连接时 fail-closed）
    3. database_service.py 委托给 ch_config.load_ch_config()，删除本地 "localhost" 默认值
    4. scheduler.main() 显式调用 ensure_ch_env_loaded()（启动入口明确声明）
    5. cli._load_dotenv() 增加调用 ensure_ch_env_loaded()
  impact:
  - src/zephyr/data/ch_config.py（新增）
  - src/zephyr/data/ch_writer.py（删除硬编码 IP，改用 ch_config）
  - src/zephyr/infrastructure/database_service.py（委托 ch_config，删除 localhost 默认值）
  - src/zephyr/data/scheduler.py（main() 显式加载）
  - src/zephyr/data/cli.py（_load_dotenv 加载 .env.clickhouse）
  fix_phase: 已完成
  status: decided
  related_rules:
  - '#ARCH-CH-010'
  - '#ARCH-CH-013'
  created: '2026-07-16'
  last_updated: '2026-07-16'

# --- #ARCH-CH-018: symbols=null 契约可执行化（akshare 4 个 A 类能力 fallback） ---
- issue_id: '#ARCH-CH-018'
  title: symbols=null 契约未实现——akshare 4 个 A 类能力直接报错不 fallback
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    tasks.yaml 注释 "# null=全市场（scheduler从stock_list取标的列表）" 是未实现的契约。
    scheduler._build_fetch_payload 只是 symbols=task.get("symbols") 透传 None，
    没有"从 stock_list 取标的"逻辑。akshare_provider 中 4 个 A 类能力
    （daily_valuation/money_flow/top10_shareholders/top10_circulating_shareholders）
    在 symbols=None 时直接 yield error，没有调用 _get_all_a_symbols 做 fallback。
    而另外 6 个 B 类能力（dividend/restricted_shares/stock_news_em/research_report/
    share_change/stock_indicator）正确实现了 fallback。这是设计不一致。

    根因分析（第一性原理——100% AI 开发模式约束）：
    AI 不会主动实现"注释里的契约"。tasks.yaml 注释对 AI 而言只是一行注释，
    AI 不会自动把它翻译成代码。契约必须用"机器可执行的真源"表达，不能依赖注释。
    此外，akshare_provider 内部 A/B 两类实现不一致，AI 在新增能力时不知道该模仿哪一类。

    治本方案：
    1. 修改 akshare_provider.py 4 个 A 类能力，统一走 _get_all_a_symbols fallback：
       - _fetch_daily_valuation (line 395-401)
       - _fetch_money_flow (line 670-676)
       - _fetch_top10_shareholders (line 2095-2101)
       - _fetch_top10_circulating_shareholders (line 2171-2177)
       每个能力改为：if not symbols: symbols = self._get_all_a_symbols(ak, policy)
       然后追加 if not symbols: yield error 兜底（参考 stock_news_em line 1097-1101 模式）
    2. 修正 tasks.yaml top10_shareholders 注释：从错误的"scheduler从stock_list取标的列表"
       改为"Provider 通过 _get_all_a_symbols 自动获取：akshare→CH stock_list fallback"
    3. _fetch_money_flow 需新增 import akshare as ak（原仅 import requests）

    长期战略（Phase 4，未实施）：
    引入 capability schema 校验，声明每个 capability 是否支持 symbols=null，
    scheduler 启动时校验 Provider 实现与声明一致。把"注释契约"升级为"机器可执行契约"。
  impact:
  - src/zephyr/data/implementations/akshare_provider.py（4 个 A 类能力补 fallback）
  - src/zephyr/data/config/tasks.yaml（修正 top10_shareholders/top10_circulating 注释）
  fix_phase: 已完成
  status: decided
  related_rules: []
  created: '2026-07-16'
  last_updated: '2026-07-16'

