      - 治本：file:///d:/ZephyrAlpha/... 形式的本地链接不再被误判为断链

    【关联】
    - ARCH-039（D_INFRA_RUNTIME 域归属造假）——同类病根（路径/域归属错误），ARCH-044 是系统性延展
