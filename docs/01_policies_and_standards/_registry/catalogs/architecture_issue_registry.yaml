# --- #ARCH-CH-020: tick_data 表 ORDER BY 设计缺陷致 21 个月有效数据被误删（RULE-DATA-OPS 治本） ---
- issue_id: '#ARCH-CH-020'
  title: tick_data 表 ORDER BY 设计缺陷导致有效数据被 ReplacingMergeTree 合并
  severity: P1高
  category: data_architecture
  adjudication: |
    问题背景：
    tick_data 表使用 ReplacingMergeTree 引擎，ORDER BY 为 (market_type, symbol, trade_date, timestamp)，
    不含 price 字段。同一时间戳不同价位的有效Tick记录（如指数同一秒的多笔成交）因排序键相同，
    被ReplacingMergeTree 后台 merge 视为"重复"合并，导致数据丢失。

    2026-07-16 事故：
    AI 用 count() - uniqExact(market_type, symbol, trade_date, timestamp) 算 tick_data "重复数"，
    把同一时间戳不同价位的有效记录算成"重复"（行数差 > 0 但实为排序键合并，非真重复）。
    AI 未按全字段 GROUP BY 验证实际重复行，直接执行 INSERT GROUP BY + REPLACE PARTITION
    "去重"，删除了 21 个月 index 数据（同一时间戳不同价位的有效记录）。

    根因分析：
    (a) 表设计根因：ORDER BY 不含 price，同一时间戳不同价位的有效记录排序键相同，
        ReplacingMergeTree merge 时合并（保留最新版本，丢弃其他），违反业务唯一性。
    (b) AI 操作根因：误用排序键作为"重复"判据——count() - uniqExact(排序键) 只能反映
        "排序键相同的行数"，不能判定"全字段相同的真重复"。未执行全字段 GROUP BY 验证。
    (c) 流程根因：未执行破坏性操作三步验证（必要性/真实性/可逆性），无备份直接执行
        INSERT GROUP BY + REPLACE PARTITION。

    治本方案（三阶段）：
    阶段1规则修复（本次）：新增 RULE-DATA-OPS 铁律（TRAE-063）+ 标准化重复检查工具
        （check_tick_duplication.py）+ 本议题登记。
    阶段2表结构修复：修改 ORDER BY 为 (market_type, symbol, trade_date, timestamp, price)，
        重建表（CREATE TABLE new AS SELECT * + RENAME），确保同时间戳不同价位记录不被合并。
    阶段3数据恢复：从百度云归档重新导入 21 个月 index 数据（2025-10 至 2026-06）。

    真重复定义（铁律）：所有 14 个业务字段完全相同的行才算真重复。
    - trade_date, timestamp, symbol, market_type, price, volume, amount, direction,
      data_source, bid_price, ask_price, bid_volume, ask_volume, quality_flag
    验证方法：GROUP BY 全字段 HAVING count() > 1，查看实际重复行内容。
    禁止判据：count() - uniqExact(排序键)。
  impact:
  - docs/01_policies_and_standards/rules/trae_063_data_ops_discipline.yaml（新增 RULE-DATA-OPS 铁律）
  - scripts/governance/data_quality/check_tick_duplication.py（新增标准化重复检查工具）
  - AGENTS.md（新增 RULE-DATA-OPS 章节）
