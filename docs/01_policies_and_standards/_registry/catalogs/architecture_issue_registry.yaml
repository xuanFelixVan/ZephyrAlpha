    pg_advisory_xact_lock(424242) 与 apply_depgraph.py 的 pg_advisory_lock(424242) 互斥。
    阶段2（已完成，commit fd4d301eb9）：schema 迁移，新建 nodes_metadata/edges_metadata 表，
    迁移 14+9 字段，下线 P1/P2 Python 保护机制（替代为 SQL UPSERT+UPDATE）。
