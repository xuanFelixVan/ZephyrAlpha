# 裁定#208 R6+R7: 议题登记机制建立 + 编号分配铁律文档化

# ============================================================
# #ARCH 编号分配铁律（裁定#208 R7）
# ============================================================
# 1. 连续分配：#ARCH-NNN 按议题立项时间顺序连续分配，禁止跳号
# 2. 不回收：已分配编号永不回收，即使议题被废弃/superseded，编号仍保留
# 3. superseded_by 链：议题被新议题取代时，旧议题 status=superseded + 填 superseded_by=新议题ID；新议题 entries 中 reference 旧议题
# 4. status 四值：open(待施工) / decided(已裁定待施工) / deprecated(已废弃不施工) / superseded(已被新议题取代)
# 5. 编号预留：#ARCH-001/003 永久保留为预留段（未立项任何议题，登记为 deprecated 条目以占位）；#ARCH-002/004/005/006/007 已回溯补录（2026-07-05，源自 dependency_path_panorama.md 裁定#203 早期议题）
# 6. 登记强制：任何 #ARCH-XXX 引用必须在本注册表有对应条目，禁止 grep-and-claim 占位
# 7. 域前缀编号：跨子系统的专题裁定使用 #ARCH-{DOMAIN}-NNN 格式（如 #ARCH-CH-007 ClickHouse、#ARCH-MM-001 Maturity、#ARCH-REN-001 域重命名、#ARCH-CAP-001 容量、#ARCH-BACKFILL-001 补下载）。DOMAIN 为大写字母子系统工程缩写，各 DOMAIN 内 NNN 独立连续分配。纯数字 #ARCH-NNN 保留给全局架构议题
# 8. 物理排列规则：entries 列表按**登记时间顺序**追加（新条目追加在末尾），不按编号顺序排列。编号连续性由铁律#1保证（按立项时间连续分配），物理排列顺序不影响 YAML list 语义。禁止为"排序"重排历史条目（高风险且无语义价值）。检索时按 issue_id 字段查找，不依赖物理位置。

unique_key:
- issue_id

entry_schema:
  issue_id: str              # #ARCH-NNN（全局）或 #ARCH-{DOMAIN}-NNN（域专题，如 #ARCH-CH-007）
  title: str                 # 议题标题
  severity: str              # P0致命 | P1高 | P2中 | P3低
  adjudication: str          # 裁定/修复方案描述
  fix_phase: str             # 施工阶段
  status: str                # open | decided | deprecated | superseded
  superseded_by: str         # (可选) 取代本议题的新议题ID
  related_adjudication: str  # (可选) 关联裁定编号(如#208)
  created: str               # 立项日期
  last_updated: str          # 最后更新日期

