# --- #ARCH-CH-011: ClickHouse 健康探活后台守护线程（回溯登记） ---
- issue_id: '#ARCH-CH-011'
  title: ClickHouse 健康探活后台守护线程——/health 端点非阻塞治本
  severity: P2中
  category: data_architecture
  adjudication: |
    问题背景：
    /health 端点原同步调用 ch_reader.query("SELECT 1")，当 ClickHouse 连接异常时
    三级降级链（TCP→HTTP→WSL）逐个超时，最坏情况 _DEFAULT_TIMEOUT=600s，
    导致 /health 请求阻塞 10 分钟。

    治本方案：
    - 后台守护线程每 _ch_health_interval 秒探活一次
    - 探活用独立短超时 timeout=3（禁止使用 _DEFAULT_TIMEOUT=600）
    - get_health() 只读缓存（非阻塞），保证 100ms 内响应
    - 缓存超过 3 个间隔未更新 → 判定探活线程死亡
  impact:
  - src/zephyr/data/scheduler.py（新增 _start_ch_health_probe + _probe_loop + get_health 读缓存）
  fix_phase: 已完成
  status: decided
  created: '2026-07-16'
  last_updated: '2026-07-16'

