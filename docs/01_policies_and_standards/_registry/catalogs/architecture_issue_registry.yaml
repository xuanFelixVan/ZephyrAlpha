- issue_id: '#ARCH-053'
  title: 三图设计态保护机制 + 对齐检测器（depgraph/dataflow/decision）
  category: architecture_governance
  severity: P1高
  status: decided
  description: |
    三大全景图（depgraph/dataflow/decision）均引入 design_maturity 三态机制
    （design/prototype/production），但只有 depgraph 有 DELETE/UPDATE 触发器保护
    design 态节点。dataflowgraph 和 decisiongraph 的设计态节点可被 sync 工具覆盖
    或删除（如 sync_dataflow_registry 批量同步会覆盖设计态节点）。
    此外，三图设计态分布不一致（如某模块在 depgraph 是 design 但 dataflow 中
    无对应记录），缺乏自动检测机制。
    裁定：建立三图设计态保护机制 + 三图对齐检测器。
  adjudication: |
    5 项架构裁定：
    (a) dataflowgraph 新增 3 个触发器（trg_protect_dataflow_design_datasets/
        jobs/edges），阻断 design 态行的 DELETE/UPDATE 降级，对齐 depgraph 模式
    (b) decisiongraph 新增 3 个触发器（trg_protect_decision_design_layers/
        nodes/edges），阻断 design 态行的 DELETE/UPDATE 降级
    (c) 新增 session 变量 app.allow_design_maturity_delete = on 作为逃生通道
        （对齐 depgraph app.allow_delete_apply_depgraph_edges 模式）
    (d) get_dataflowgraph_pg_connection / get_decisiongraph_pg_connection 新增
        allow_design_delete 参数；apply_dataflowgraph.py / apply_decisiongraph.py
        设计态写入命令显式传 allow_design_delete=True
    (e) 新建 align_panoramas.py 三图对齐检测器，输出报告到
        docs/02_enterprise_architecture/generated/panorama_alignment_report.md
        检测四类问题：孤儿（仅一图）/状态漂移（design_maturity 不一致）/
        域不一致（domain_id 不一致）/设计态孤立（design 仅一图）
    设计原则：
    - 逃生通道模式对齐 depgraph.app.allow_delete_apply_depgraph_edges
    - 触发器函数 protect_dataflow_design_maturity / protect_decision_design_maturity
      复用相同逻辑（仅 OLD.design_maturity='design' 触发）
    - 检测器是只读工具（不自动修复），由人工或后续工具根据报告处理
    - module_id 作为三图对齐 key（depgraph 用 blueprint_id，dataflow/decision
      用 module_id 字段）
  fix_phase: |
    Phase 1: apply_dataflowgraph.py 加入 GATE-ARCH-DIAGRAM _PG_WRITE_SCRIPTS
    Phase 2: 6 触发器 + 2 schema 函数 allow_design_delete + 2 apply 脚本改造
    Phase 3: align_panoramas.py 检测器（466 行，输出 panorama_alignment_report.md）
    Phase 4: ARCH-053 登记 + capability 登记（panorama_alignment_detection /
             design_maturity_trigger_protection）
  related_adjudication: '#203'
  created: '2026-07-06'
  last_updated: '2026-07-06'
- issue_id: '#ARCH-054'
  title: FOREIGN-CHANGE-DETECTION gate——claim 时基线快照检测搭便车提交治本
  severity: P1中
  adjudication: |
    2026-07-09 裁定：ARCH-031 搭便车提交根因治本——GitCommitGateway 新增
    FOREIGN-CHANGE-DETECTION gate（priority=45）。病根：session A 修改文件 X 后未 commit，
    session B claim_files(X) 时 HELD-OVERLAP gate 因 X 未被 claim 而放行，B commit 时
    将 A 的未提交修改一并提交（搭便车）。现有 HELD-OVERLAP 只检测"文件是否被其他 session
    claim"，无法检测"文件是否已有外来未提交变更"。
    裁定：
    (a) GitCommitGateway.claim_files 新增基线快照捕获——claim 成功后立即调用
        _capture_baseline_diff(file) 记录 git diff HEAD -- <file> 的 stdout。
    (b) 新增 FOREIGN-CHANGE-DETECTION gate（priority=45，在 CLAIM-REQUIRED(40) 后、
        HELD-OVERLAP(50) 前）——commit 时遍历目标文件，若基线快照非空则阻断
        （FOREIGN_CHANGE_VIOLATION），提示用 allow_overlap=True 逃生通道。
    (c) fail-open 边界：无基线快照（reconciler auto-commit 等未走 claim_files 的路径）
        → PASS；_claim_snapshots 读取异常 → 降级 PASS（不阻断 commit）。
    (d) worktree 物理隔离消除搭便车风险——session_worktree_commit 跳过
        FOREIGN-CHANGE-DETECTION（_WORKTREE_SKIP_GATES 已更新）。
  related_adjudication: '#203'
  created: '2026-07-09'
  last_updated: '2026-07-09'
- issue_id: '#ARCH-055'
  title: GATE-MODULE-INVENTORY-SYNC——commit_gates 模块清单漂移正向检测治本
  severity: P2中
  adjudication: |
    2026-07-09 裁定：ARCH-054 审查发现 gate_engine blueprint.md §0.1 模块清单漂移
    （29 个实际 .py 文件中 6 个未登记，漂移率 20.7%）。根因：派生数据（blueprint.md
    §0.1 模块清单）靠手工维护，100% AI 开发模式下每次新增 gate 文件都需 AI 自觉同步
    文档，必然漂移。现有 GATE-AGENTS-MD-REFS（priority=810）是反向检测（文档引用→
    代码存在性），缺正向检测（代码新增→文档同步）。
    裁定：
    (a) 新建 check_gate_inventory_drift.py 检测脚本——扫描 src/zephyr/governance/
        commit_gates/*.py 实际文件 vs blueprint.md §0.1 登记清单，输出 missing/extra
        漂移列表。exit 0=一致 / exit 1=漂移 / exit 2=错误。
    (b) 新增 post-commit reconciler GATE-MODULE-INVENTORY-SYNC（priority=820，在
        GATE-AGENTS-MD-REFS(810) 之后）——commit_gates/*.py 变更时触发，调用检测
        脚本，漂移时 warn-only（不阻断 commit，因漂移不致命，避免误报阻断正常开发）。
    (c) warn-only 而非 hard-block 理由：漂移是文档同步滞后，非代码错误；阻断会
        导致 AI 无法 commit 正常的 gate 新增（因 blueprint.md 未同步而阻断 gate 代码
        本身的 commit，形成死循环）。warn 提醒 AI 同步文档即可。
    (d) 阶段1已补齐现有 6 个漂移（blueprint.md §0.1 补登记 file_placement_ttl_gate/
        foreign_change_gate/msg_exposure_gate/msg_style_gate/rule_four_way_alignment_gate/
        unsafe_dict_spread_gate）+ AGENTS.md 并发防护章节同步 FOREIGN-CHANGE-DETECTION。
  related_adjudication: '#203'
