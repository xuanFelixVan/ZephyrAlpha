    (b) sync_yaml_to_depgraph.py 移除 3 处 D_SIGLEGACY 硬编码（LAYER_NAME_TO_DOMAIN/DOMAIN_CONTRACT_CONSUMER/CTR_CONSUMER_FALLBACK）
        设为 None，sync_contract_mapping_table 在 domain=None 时跳过契约写入
    (c) 解除 C 轨占位禁令——25 个文件 87 处标记替换 + _domain_simulation T2-deferred 解除
        涉及 13 个业务域蓝图（signal/simulation/risk/research/reporting/portfolio_core/
        machine_learning_train/factor/frontend/execution_core/data/compliance）
    (d) 创建 ARCH-045 裁定文档（本条目）

    P1（短期后续，独立任务卡）：
