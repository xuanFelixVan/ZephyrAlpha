      - CTR-P1-015（SynthesizedSignal）→ source_domain: D_FUNDAMENTAL_SIGNAL
      - CTR-P1-003（CapitalAllocationResult）→ source_domain: D_FUNDAMENTAL_SIGNAL
      - CTR-ERR-003（SignalDegradationWarning）→ source_domain: D_SIGQC
