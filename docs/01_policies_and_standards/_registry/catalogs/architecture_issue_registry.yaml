- issue_id: '#ARCH-047'
  title: 前端可视化技术栈第一性原理重构——Streamlit→Panel+HoloViz+Plotly+plotly_resampler+Lightweight Charts
  severity: P1高
  adjudication: |
    ARCH-047 裁定：前端可视化技术栈从 Streamlit 第一性原理重构为 Panel+HoloViz+Plotly+plotly_resampler
    +TradingView Lightweight Charts v5.2（HTML Pane+原生JS，不依赖Python封装包）。
    治本"Streamlit 三大架构硬伤导致回测可视化能力不足"的病根。

    【病根（5-Why 根因分析）】
    症状：回测交付页面+仪表盘方案调研发现 Streamlit 无法满足百万级 tick 渲染、实时盘口推送、
    crossfiltering 联动三大核心需求。

    Why-1：为什么 Streamlit 无法满足？因为 Streamlit 有三个架构性硬伤：
    (a) rerun 模型——每次交互重跑整个脚本，无法增量更新，大数据渲染慢
    (b) 无原生 WebSocket——实时推送依赖轮询，100ms 级盘口刷新不可行
    (c) 无 crossfiltering——多图表联动需要 st.session_state 手动管理，复杂且易错

    Why-2：为什么选 Streamlit？因为初期快速原型需求选择了最简单的方案，未考虑长期部署。
    Why-3：为什么未考虑长期部署？因为前端架构文档（VIEW-10-FRONTEND-ARCH）未定义可视化技术栈选型标准。
    Why-4：为什么未定义选型标准？因为前端架构缺少"第一性原理"驱动的技术栈评估框架。
    Why-5（根因）：前端可视化技术栈选择基于"快速原型"路径依赖，而非"长期部署+可扩展"第一性原理，
    导致技术债积累到回测可视化需求爆发时才暴露。

    【第一性原理推理】
    好的可视化系统应该是什么样子？
    1. 百万级数据渲染——Datashader 原生集成（0.5-1秒渲染百万 tick，仅阈值触发>50万点）
    2. 实时推送——Bokeh server WebSocket 原生推送（100ms 级盘口刷新）
    3. crossfiltering 联动——HoloViews 原生支持多图表联动
    4. 长期可扩展——Panel 支持 React 组件嵌入，未来可迁移到 G1 React 前端
    5. 金融图表——TradingView Lightweight Charts v5.2 专业 K 线/订单流（HTML Pane+原生JS）

    【四方案对比】
    方案A（Streamlit）：rerun 模型/无 WebSocket/无 crossfiltering——三硬伤不可治本
    方案B（Dash）：callback 模型复杂，Datashader 集成弱，社区活跃度下降
    方案C（Gradio）：面向 ML demo，金融图表支持弱
    方案D（Panel+HoloViz）：Datashader 原生/WebSocket 原生/crossfiltering 原生——三硬伤全治本

    决定：采用方案D（Panel+HoloViz+Plotly+plotly_resampler+Lightweight Charts），插入 G0.5 Python 过渡层。

    【外部评审采纳的改进（Grok/GPT/Claude 三方建议）】
    1. Panel callback 仅编排，业务逻辑独立为纯函数（fetch→ChartFactory.make_xxx()→callback），
       G1 升级时 fetch 可直接包装为 FastAPI 路由，零重写
    2. TradingView 不依赖 Python 封装包，直接用 pn.pane.HTML+lightweight-charts.js 原生渲染，
       避免供应链风险，G2 React 迁移时 JS 可直接复用
    3. Datashader 不默认进入 MVP，仅在数据量>50万点时阈值触发；MVP 全用 Plotly+plotly_resampler
       （10万级降采样足够），避免过早优化
    4. 新增 ChartFactory 统一工厂（make_equity/make_drawdown/make_heatmap/make_tick/make_kline），
       G2 React 迁移时可直接对应 React 组件
    5. 补充 v3.1.0 现有 Streamlit 页面迁移计划（5页面+10组件）

    【治本方案】
    P0 DONE 2026-07-04：
    (a) ARCH-047 条目登记（本条目）
    (b) VIEW-10-FRONTEND-ARCH v1.1.1→v1.2.0：G0.5 Python 过渡层插入
    (c) MOD-L08-001 frontend 蓝图 v2.2.0→v3.0.0：技术栈切换（20+ edits）
    (d) MOD-BT-001 backtest 蓝图 v1.2.0→v1.3.0：io/ 子目录新增（sink+repo）
    (e) CTR-P1-017 BacktestRunArtifact 跨层契约新建
    (f) CTR-P1-016 target_domains 追加 D_FRONTEND
    (g) consumer_registry.yaml：D_FRONTEND 消费关系新增
    (h) pyproject.toml + requirements.txt：5 个依赖新增
    (i) blueprint_registry.yaml v2.7.7 同步
    (j) 258 个 Python 源文件 [BLUEPRINT] 头部路径漂移修复（kebab→snake）
    (k) depgraph 设计态：2 节点 + 3 边登记

    P0 SUPPLEMENT DONE 2026-07-04（外部评审采纳）：
    (l) §3.1 组件架构表新增 ChartFactory 组件
    (m) §16.7.1-§16.7.5 组件规格全面更新：Panel callback仅编排+TradingView HTML Pane+Datashader阈值触发
    (n) §17.3 升级版本矩阵新增 v3.0.0/v3.1.0 行

    P1 DONE 2026-07-05：5 个交易/回测组件施工完成（backtest_results/tick_replay/order_book/position_monitor/trade_panel）
      - 5 组件在 v3.0.0 已完整实现（dataclass+fetch+render+ChartFactory 集成）
      - 36 个单元测试覆盖（test_p1_components_unit.py, 2026-07-05 补建）
      - 已集成到 app_panel.py Tab 6-10
    P2 OPTIONAL：G1 React 前端迁移时，Panel 组件嵌入 React（保留 HoloViz 渲染层）

    【G0.5 Python 过渡层】
    在 G0（无前端）和 G1（React+Vite+TS）之间插入 G0.5 Python 原生可视化层。
    退出条件（3 信号同时出现时升级到 G1）：
    ① MatchingLogic 共享后偏差仍>5%且定位不到
    ② 策略迭代速度成瓶颈
    ③ 有模拟实盘环境需求
    共存策略：G0.5 与 G1 可共存，Panel 组件可嵌入 React

    【关联】
    - VIEW-10-FRONTEND-ARCH——前端架构文档，G0.5 过渡层定义
    - MOD-L08-001——frontend 蓝图，技术栈切换实施
    - MOD-BT-001——backtest 蓝图，io/ 子目录新增
    - CTR-P1-016/017——跨层契约，回测结果+产物格式
  fix_phase: |
    P0 DONE 2026-07-04：技术栈切换全套治理（蓝图+契约+依赖+路径漂移修复+depgraph登记）
    P0 SUPPLEMENT DONE 2026-07-04：外部评审采纳改进（ChartFactory+callback约束+HTML Pane+Datashader阈值+v3.1.0迁移计划）
    P1 DONE 2026-07-05：5 个交易/回测组件施工完成（v3.0.0已实现+36单元测试覆盖）
    P2 OPTIONAL：G1 React 迁移时 Panel 组件嵌入
