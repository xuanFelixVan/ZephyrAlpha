  title: 蓝图间路径引用系统性漂移——_domain_infrastructure_operations/ 前缀误用（31处/11文件）
  severity: P1高
  adjudication: |
    ARCH-044 裁定：蓝图间引用路径系统性漂移治本方案。

    【病根（5-Why 根因分析）】
    Why1: 为什么会有 31 处错误引用？因为模块迁移后蓝图间引用未同步更新。
    Why2: 为什么未同步？因为引用使用路径字符串而非模块ID，无法建立反向引用索引。
    Why3: 为什么使用路径字符串？因为蓝图设计早期未建立"模块ID→canonical路径"映射的强制约束。
    Why4: 为什么没有强制约束？因为缺少 commit gate 校验蓝图间路径引用一致性。
    Why5: 为什么缺少 gate？因为 validate_layer_consistency.py 存在但未挂载到 commit gate 或 pre-commit（检测缺口）。[注：该文件已于2026-07-09作为死代码清理删除]

    根因：蓝图间引用使用路径字符串而非模块ID，导致无法自动追踪和更新引用关系。
    在 100% AI 开发模式下，错误会病毒式复制——每个新蓝图都可能引用错误的旧路径。

    【数据】
    错误引用：31 处 / 11 个蓝图文件
    错误模式：_domain_infrastructure_operations/{wrong_module_name}/blueprint.md
    涉及 16 个错误模块名（hyphen形式/旧别名/跨域误归）：
      - vector_memory（应归 _domain_knowledge/）
      - agent-spec（应归 _domain_autonomy_core/，且应为 snake_case agent_spec）
      - rbac（应归 _domain_autonomy_core/agent_role_based_access_control/）
      - pipeline（应归 _cross_layer/）
      - a2a-protocol（同域别名，应为 agent_to_agent_protocol）
      - budget-enforcer（应归 _domain_autonomy_perm/，且应为 snake_case）
      - task_system（应归 _domain_infrastructure_runtime/）
      - task-card-kms（已废弃合并入 task_system）
      - vibe-coding-pipelines（已废弃合并入 task_system）
      - knowledge_base（应归 _domain_knowledge/）
      - scaffold（MOD-INF-005 误名，应为 governance_automation）
      - code-dedup-engine（应归 _domain_governance/，且应为 snake_case）
      - asset-inventory（同域 hyphen，应为 snake_case asset_inventory）
      - registry-governance（应归 _domain_governance/，且应为 snake_case）
      - audit-trail（应归 _domain_governance/，且应为 snake_case）
      - agent-rbac（应归 _domain_autonomy_core/agent_role_based_access_control/）

    正确引用（4 个模块，保留不修改）：
      - capacity_assurance（MOD-INF-001，确实在 _domain_infrastructure_operations/ 下）
      - system_telemetry（MOD-INF-015，确实在 _domain_infrastructure_operations/ 下）
      - asset_inventory（MOD-INF-026，snake_case，确实在 _domain_infrastructure_operations/ 下）
      - agent_to_agent_protocol（MOD-INF-025，确实在 _domain_infrastructure_operations/ 下）

    【治本方案（分阶段）】
    P0（已完成 2026-07-04）：批量修复 31 处错误路径引用
      - 数据源：blueprint_registry.yaml（55 份蓝图自动同步注册表，frontmatter 是 SSoT）
      - 修复脚本：tmp/_fix_infrastructure_operations_paths.py（TTL=task_bound，完成后删除）
      - 验证：全量 Grep 确认 16 个错误模块名引用清零，4 个正确模块名引用保留
      - 修复文件清单（11 个）：
        1. _domain_infrastructure_runtime/task_system/blueprint.md（7处）
        2. _domain_governance/registry_governance/blueprint.md（5处）
        3. _domain_autonomy_perm/escalation_protocol/blueprint.md（4处）
        4. _domain_infrastructure_operations/asset_inventory/blueprint.md（3处，hyphen→snake_case 自引用修复）
        5. _cross_layer/context_engine/blueprint.md（2处）
        6. _cross_layer/_b_track_interfaces/vector_memory_service_interface.md（2处）
        7. _domain_integration/blueprint.md（2处）
        8. _domain_autonomy_core/agent_role_based_access_control/blueprint.md（3处，含子路径文件）
        9. _domain_governance/audit_trail/blueprint.md（1处）
        10. _domain_infrastructure_runtime/state_machine_engine/blueprint.md（1处）
        11. _cross_layer/_b_track_interfaces/context_engine_interface.md（1处）

    P1（短期后续，独立任务卡）：补建 PATH-REF-CONSISTENCY commit gate
      - priority=77（在 ARCH-REFERENCE p=75 之后，DOC-REF-BROKEN p=88 之前）
      - 检测逻辑：扫描蓝图 .md 文件中的 docs/03_modules/_domain_*/{module_name}/blueprint.md 引用，
        验证 {module_name} 在 blueprint_registry.yaml 中存在且 file_path 匹配
      - 真源：blueprint_registry.yaml（自动从 frontmatter 同步）
      - 挂载点：GitCommitGateway pre-commit 阶段
      - 逃生通道：--no-verify 绕过（与现有 gate 一致）
      - 治本：新蓝图引用错误路径时被硬阻断，杜绝病毒式复制

