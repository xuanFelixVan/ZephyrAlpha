schema_version: '2.1'
registry_id: REG-IND-001
name: Technical Indicator Registry
name_zh: 技术指标注册表
description: >-
  技术指标唯一真源（SSoT）。登记全部纯 OHLCV 计算指标（编号/公式/参数/输入输出列/预热期/状态/代码位置），
  5 大类 40 指标 58 输出列（对齐 16 号 §6.1-6.5 + 代码 src/zephyr/factor/technical_indicators/ 6 个 .py，
  数值正确性由 243 测试用例 + Registry↔DDL 双向交叉校验锁定）。
  全指标覆盖 9 周期（1min/5min/15min/30min/60min/120min/日/周/月，120min 由 60min 两根聚合），
  存储单表 c1_market.technical_indicator 按 (period, toYYYYMM(trade_date)) 分区。
  与 factor_registry 正交：技术指标=OHLCV 确定性变换（计算工具，无 alpha 断言），因子=alpha 来源。
  2026-08-13 全新施工（62 号 §4.5 CONSTRUCT_REGISTRY 8 步）：原 ALGOMAP 种子版（REG-TECHNICAL-INDICATOR-001，
  21 条 IND-ALGOMAP 派生种子）历史使命完成，name_zh/description 翻译职能已被本表 40 条正式条目吸收，
  algo_flow_translation_sync.py 同步加保护不再覆写本表。对标 QuantConnect Indicators / backtrader.indicators。
owner: MOD-GOVERNANCE
