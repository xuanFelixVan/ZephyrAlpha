name_zh: 技术指标注册表
description: >-
  技术指标唯一真源（SSoT）。登记全部技术指标（OHLCV 为主，批10 起筹码族引入换手率输入；编号/公式/参数/输入输出列/预热期/状态/代码位置），
  9 大类 142 在产指标 214 输出列（注册 143 条含退役 1；对齐 16 号 §6.1-6.10 + 代码 src/zephyr/factor/technical_indicators/ 8 个 .py，2026-09-14 A股标配批+3/趋势+1/统计族+4：BIAS/PSY/LWR/DKX/CORREL/BETA/LINEARREG+TSF/ROLLVAR；批2a+8：HMA/ZLEMA/KAMA/VORTEX/SUPERTREND/DPO/NATR/TRANGE；批2b+16：TSI/SMI/FISHER/KST/CONNORSRSI/QQE/STC/RVGI/MCGINLEY/MASSI/VWMA/ADOSC/EOM/KVO/NVI/PVI；批3：Ichimoku 补实现（IND-COMP-001 candidate→active）+ 循环族 HT 系 5 指标（MOD-L02-029 cycle.py）；批6：RV 波动率族 4+BBI+STOCH 本体+动量清偿（AROON/AROONOSC/BOP/PPO/APO/DX）+BRAR/CR 能量族共 14 指标（挖矿立卡 1/2/3+批5 增补全清偿）；批8：M-L4 经典族 10 指标（ALLIGATOR/GMMA/GANN_HILO/AC/FRACTALS/ELDER/COPPOCK/SQUEEZE/WAVETREND/FORCE_INDEX，数据先行放量批）；批9-1：tilib 清欠班波1 +15 指标/16 列（M-L1 自适应均线族 7：TEMA/TRIMA/T3/MAMA+FAMA/VIDYA/FRAMA/JMA + M-L2 价格变换族 4：AVGPRICE/MEDPRICE/TYPPRICE/WCPRICE + M-L3 统计回归族 4：LINEARREG_ANGLE/SLOPE/INTERCEPT/STDERR，talib 黄金对照逐位/1e-6 级一致）；批9-2：波2 M-L5 社区热门族 +16 指标/16 列（CHOP/CVI/ULCER/EBSW/INERTIA/QSTICK/RMI/PFE/FOSC/CTI/VHF/ER/WAD/VO/MARKETFI/ZSCORE；PSL=PSY、MSW=ht_sine 同义不重复立条）；批9-3：波3 M-L6 学术滤波器族 +3 指标/4 列（SUPERSMOOTHER/HIGHPASS/PTREND，TASC 2024-09 Precision Trend 挖矿）；批9-4：波5 学术卡清偿 +2 指标/3 列（CONTINUATION/GPRED，mesasoftware 官网 PDF 公式源，M-L6 登记卡全清偿）；批10：筹码族 +3 指标/9 列（CYQ 迭代衰减筹码分布/SCR 筹码集中度/CYC 成本均线通达信口径，MOD-L02-031 chips.py，指标输入首次引入换手率 stock_daily_basic 仅 daily 周期，其余周期软降级 NULL，CYQ 独立实现复算 000852 近 20 日逐日 0 偏差对表）
  数值正确性由 1109 测试用例 + Registry↔DDL 双向交叉校验锁定）。
  全指标覆盖 9 周期（1min/5min/15min/30min/60min/120min/日/周/月，120min 由 60min 两根聚合；筹码族例外仅 daily——换手率输入为日频），
  存储单表 c1_market.technical_indicator 按 (period, toYYYYMM(trade_date)) 分区。
  与 factor_registry 正交：技术指标=行情确定性变换（计算工具，无 alpha 断言），因子=alpha 来源。
  2026-08-13 全新施工（62 号 §4.5 CONSTRUCT_REGISTRY 8 步）：原 ALGOMAP 种子版（REG-TECHNICAL-INDICATOR-001，
  21 条 IND-ALGOMAP 派生种子）历史使命完成，name_zh/description 翻译职能已被本表 40 条正式条目吸收，
  algo_flow_translation_sync.py 同步加保护不再覆写本表。对标 QuantConnect Indicators / backtrader.indicators。
