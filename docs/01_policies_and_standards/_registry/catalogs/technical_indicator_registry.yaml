- indicator_id: IND-CHIPS-001
  name: Chip Distribution CYQ
  name_zh: 筹码分布
  aliases: ["CYQ", "获利盘", "筹码成本分布"]
  indicator_class: chips
  formula: >-
    迭代衰减筹码分布（400 bins 价格网格，PIT 只用过去+当日）：每日分布×(1−clip(换手率%,0,100)/100) 后，
    新增当日成交量均匀铺入 [low,high]（一字板全部质量落最近网格点）；网格越界按旧分布 CDF 线性插值质量守恒重铺。
    chips_winner=Σ(成本≤close)/Σmass；chips_avg_cost=Σ(price×mass)/Σmass；
    chips_cost_5/15/85/95=CDF 首次越过 5%/15%/85%/95% 的网格价（批10 扩项 +15/+85）。换手率 NaN（停牌/缺数）当日不衰减；换手率>100% 截断 100%。
    验收=Python 独立实现复算 000852 近 20 交易日逐日对表 winner 0 偏差/avg≤1.8e-15/分位 0 偏差
    （.runtime/tmp/st-data-fix-20260921/cyq_recalc_000852.tsv，2026-09-21）
  params: {bins: 400}
  inputs: [high, low, close, volume, turnover_rate]
  outputs: [chips_winner, chips_avg_cost, chips_cost_5, chips_cost_15, chips_cost_85, chips_cost_95]
  warmup_period: 1
  computation_mode: vectorized
  module_id: MOD-L02-031
