# 全景图扫描排除配置 — depgraph & path_tree 生成器的扫描排除规则真源
#
# 真源声明: 本文件是全景图扫描排除路径/类型清单的唯一真源(SSoT)。
#   - 规则定义: docs/01_policies_and_standards/rules/trae_058_depgraph_scan_exclusions.yaml
#   - 路径清单: 本文件
#   - 代码实现: scripts/governance/generate_project_depgraph.py + generate_project_path_tree.py
#
# 修改协议: 修改本文件后 MUST 运行:
#   python scripts/governance/generate_project_depgraph.py --warn-only
#   python scripts/governance/generate_project_path_tree.py --check
#
# 排除原因分类:
#   - whitelist: 不在白名单扫描根中(反向排除)
#   - exempt_dir: os.walk 时跳过的目录名(按目录名匹配)
#   - node_type: 节点类型过滤(非代码类型不进入依赖图)
#   - knowledge_doc: 知识文档类型跳过(零导入边)
#   - skip_ext: 跳过的文件扩展名(path_tree 专用)
#   - max_depth: 最大扫描深度(path_tree 专用)

# === depgraph 生成器排除配置 ===
depgraph:
  # 白名单扫描根 — 只有以下路径会被 depgraph 扫描
  # 不在此清单中的路径 = 不扫描(反向排除)
  # 排除原因: whitelist
  scan_dirs:
    - src/zephyr
    - scripts
    - tests
    - data/asset_index
    - data/config
    - data/metrics
    - config
    - schemas
    - docs/03_modules
    - docs/01_policies_and_standards
    - docs/02_enterprise_architecture
    - frontend
    - architecture_model
    - infra
    - tools
    - specs

  # os.walk 时跳过的目录名(按目录名匹配，非路径前缀)
  # 排除原因: exempt_dir
  exempt_dirs:
    - __pycache__
    - .git
    - .ailocks
    - node_modules
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - _backups
    - _temp
    - .audit_cache
    - session_logs
    - fixtures          # 测试 mock 数据(yaml/json)，0 依赖边，非架构组件，不纳入全景图

  # 节点类型过滤 — 以下类型的节点不进入依赖图
  # 排除原因: node_type (零 import_depends 边，只有噪音引用)
  excluded_node_types:
    - doc          # 文档文件(0 import edges)
    - policy       # 政策文档(0 import edges)
    - template     # 模板文档(0 import edges)
    - diagram      # mermaid 图表(0 import edges)
    - data         # 数据文件(0 import edges)

  # 知识文档类型跳过 — 以下路径的 .md 文件被分类为 knowledge_doc 并跳过
  # 排除原因: knowledge_doc (零导入边，历史记录/知识条目非代码依赖)
  knowledge_doc_paths:
    - docs/08_knowledge/   # 知识库条目 — 无导入依赖
    - docs/_working/audit/       # 审计日志 — 历史记录，无代码依赖

  # 类型分类前缀 — 用于将 .md/.yaml/.json 文件分类为具体类型
  # 这些前缀决定了文件被分类为哪种类型(部分类型会被 excluded_node_types 过滤)
  type_prefixes:
    policy:
      - docs/01_policies_and_standards/governance/
      - docs/01_policies_and_standards/domains/
      - docs/01_policies_and_standards/operational/
      - docs/01_policies_and_standards/rules/
    template:
      - docs/01_policies_and_standards/templates/
    registry:
      - docs/01_policies_and_standards/_registry/catalogs/
      - docs/01_policies_and_standards/_registry/vocabularies/
    contract:
      - docs/01_policies_and_standards/_registry/contracts/
    schema:
      - docs/01_policies_and_standards/_registry/schemas/
      - schemas/

# === path_tree 生成器排除配置 ===
path_tree:
  # 扫描根 — path_tree 扫描这些顶层目录
  scan_roots:
    - src/zephyr
    - scripts
    - tests
    - config
    - docs
    - data

  # 跳过的目录名(按目录名匹配)
  # 排除原因: exempt_dir
  skip_dirs:
    - __pycache__
    - .git
    - .ailocks
    - .audit_cache
    - node_modules
    - .mypy_cache
    - .pytest_cache
    - .ruff_cache
    - .tox
    - .venv
    - venv
    - .idea
    - .vs
    - .eggs
    - "*.egg-info"
    - cache
    - telemetry

  # 跳过的文件扩展名
  # 排除原因: skip_ext (二进制/编译产物)
  skip_extensions:
    - .pyc
    - .pyo
    - .so
    - .dll
    - .exe
    - .obj
    - .pdb
    - .idb

  # 最大扫描深度
  max_depth: 8

# === 不纳入全景图的路径说明 ===
# 以下路径不在 depgraph 中注册为 nodes，也不在 path_tree 中显示:
#   - docs/08_knowledge/   — 知识库条目(4647+ 文件)，经验积累非代码，无导入依赖
#   - docs/_working/audit/       — 审计报告(36 文件)，事后评估非代码，历史记录
#   - docs/_working/decomposition/  — 任务卡(7 文件)，拆解产物非代码，临时性
#   - data/cache/          — 运行时缓存，非代码
#   - data/telemetry/      — 遥测数据，非代码
#   - scripts/governance/_archive/  — 归档脚本，非活跃代码
#   - scripts/governance/repair/    — 修复脚本，临时性
#   - scripts/governance/_shared/   — 共享内部工具，非 depgraph 相关
#   - tests/fixtures/     — 测试 mock 数据(54 文件)，0 依赖边，非架构组件
