    required: always
    stage: null
    enum_values: []
    applicable_docs: []
    description: "语义化版本 X.Y.Z"
    source: "PS-STD-001 §3.4"
    pattern: "^\\d+\\.\\d+\\.\\d+$"
    note: ""

  - field_name: date
