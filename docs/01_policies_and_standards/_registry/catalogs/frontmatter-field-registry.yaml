# ============================================================================
# ZephyrAlpha Frontmatter 字段定义登记表（Frontmatter Field Registry）— 唯一真源
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-02 | owner: ZephyrAlpha-Owner
#
# module_id: PS-REG-012
# doc_type: register
#
# 对标: ITIL SACM CMDB CI → Metadata Schema（每个字段有唯一定义）
#       + SchemaStore JSON Schema Catalog（每个 schema 有唯一 ID 和描述）
#       + Google API Design Guide → Field naming & consistency
#       + AWS CloudFormation Resource Schema（每个属性有类型/必填/描述）
#
# 用途: 登记 ZephyrAlpha 项目所有 frontmatter 字段的唯一定义——
#       字段名 / 类型 / 必填性 / 枚举值 / 适用 doc_type / 定义来源。
#       本登记表是 frontmatter 字段的 SSoT（Single Source of Truth，单一真源）。
#       任何地方的字段定义如果与本登记表不一致，以本登记表为准。
#
# 与 frontmatter-schema.json 的关系:
#   - frontmatter-schema.json 是机器可读的校验 Schema（自动生成，不可手写）
#   - 本登记表是人工可读的字段定义真源（手动维护）
#   - 两者必须一致——S1 validate_registry_master_index.py 会交叉验证
#
# VR-005 根因修复:
#   - VR-005（frontmatter 校验脚本）曾产生 2484 条误报
#   - 根因: 字段定义散落在 PS-STD-001 + vocabulary/ + schema.json 三处
#   - 修复: 本登记表建立唯一字段定义真源 → VR-005 从此引用本表
#
# 自校验脚本: （experimental 补齐——validate_frontmatter_field_registry.py）
# ============================================================================

schema_version: "1.0.0"
doc_type: register
title: "Frontmatter 字段定义登记表"
version: "1.0.0"
status: active
created: "2026-05-02"
last_updated: "2026-05-02"
ai_autonomy: human_gated
ttl: permanent
total_registered: 40
depends_on:
  - target: PS-STD-001
    at: "§3.2.1"
    why: "doc_type 受控词表 + register 类型合法字段定义"
  - target: "frontmatter-schema.json"
    at: "$"
    why: "字段枚举值对标——本登记表与 schema 必须一致"

# ============================================================================
# 字段登记说明
#
# 每个字段一条记录:
#   field_name         字段名（YAML frontmatter key）
#   type               字段类型: string / enum / integer / array / object / date
#   required           是否必填: always / conditional / optional
#   stage              required=conditional 时的阶段: phase0 / phase1 / phase2
#   enum_values[]      枚举值列表（type=enum 时），含中文描述
#   applicable_docs[]  适用哪些 doc_type（空 = 所有类型）
#   description        字段说明
#   source             定义来源: PS-STD-001 §X.Y / ADR-NNNN / vocabulary
#   note               补充说明
# ============================================================================

fields:
  # ── 7 个必填字段（frontmatter-schema.json required）──
  - field_name: module_id
    type: string
    required: always
    stage: null
    enum_values: []
    applicable_docs: []
    description: "模块唯一标识。格式：DOMAIN-TYPE-NNN（大写字母+连字符）"
    source: "PS-STD-001 §5"
    pattern: "^[A-Z]+(-[A-Z]+)?-[A-Z]+-\\d{3,4}$"
    note: "全项目唯一，不可重复"

  - field_name: title
    type: string
    required: always
    stage: null
    enum_values: []
    applicable_docs: []
    description: "文档中文标题"
    source: "PS-STD-001 §3.1"
    min_length: 1
    note: ""

  - field_name: doc_type
    type: enum
    required: always
    stage: null
    enum_values:
      - {value: "policy", description: "策略——定义'必须/禁止'的声明式规则，AI 不可修改"}
      - {value: "standard", description: "标准——定义度量/格式/接口的声明式规范"}
      - {value: "operational_rule", description: "操作规则——定义'如何做'的步骤化流程"}
      - {value: "register", description: "注册表——结构化数据清单，AI 可修改"}
      - {value: "index", description: "索引入口——目录级导航文件"}
      - {value: "protocol", description: "协议——定义交互流程和消息时序"}
      - {value: "template", description: "模板——可复用的文档结构骨架"}
      - {value: "terminology", description: "术语——定义项目专有名词的统一含义"}
      - {value: "vocabulary", description: "词表——受控枚举值的权威来源"}
      - {value: "contract", description: "契约——声明式接口/行为约束，代码可消费"}
      - {value: "reference", description: "参考——非规范性辅助资料"}
      - {value: "gate", description: "闸门——CI/质量门禁定义"}
      - {value: "schema", description: "Schema 定义——JSON/YAML 格式的数据结构校验定义"}
    applicable_docs: []
    description: "文档品种——01_policies_and_standards/ 目录下 13 种"
    source: "PS-STD-001 §3.2.1 + doc_type-vocabulary.yaml"
    derived_from: "_registry/vocabularies/doc_type-vocabulary.yaml"
    note: ""

  - field_name: status
    type: enum
    required: always
    stage: null
    enum_values:
      - {value: "draft", description: "草稿，正在编写中"}
      - {value: "active", description: "已生效，当前有效"}
      - {value: "deprecated", description: "已废弃，有替代品或已合并"}
    applicable_docs: []
    description: "文档状态——DocStatus 仅 3 值"
    source: "PS-STD-001 §4.1 + status-vocabulary.yaml"
    derived_from: "_registry/vocabularies/status-vocabulary.yaml"
    note: "deprecated 时 superseded_by 条件必填"

  - field_name: version
