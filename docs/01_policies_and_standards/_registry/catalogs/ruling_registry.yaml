- ruling_id: '裁定#214'
  title: NO-HIGH-COMPLEXITY gate fix解锁Any-abuse死锁+暗债发现
  date: '2026-07-15'
  category: 治本
  status: active
  summary: >-
    第94轮治本。死锁问题：§5.145 Any-abuse 修复需修改函数签名，§5.158
    NO-HIGH-COMPLEXITY gate（priority=85）阻断对高复杂度函数 def 行的修改，两者
    形成死锁。根因：gate docstring 声明"只检测新增函数"但实现 node.lineno in
    added_lines 捕获了修改签名的已有函数（设计-实现不一致）。Phase 1 gate fix
    （commit ad759f67f3）：新增 _read_head_file+_collect_function_names 读取 HEAD
    版本函数名集合，跳过已存在函数（修改函数），仅对 HEAD 中不存在的函数名检测
    复杂度（真正新增函数）。Phase 3 清 14 个被死锁的 Any-abuse 违规（commit
    07ca241c3b，跨 10 文件 11 函数 Any→object/具体类型）。Phase 4 全量扫描脚本
    scan_complexity.py（纯 stdlib AST 扫描器，与 gate McCabe 算法一致）。暗债
    盲区发现：12928 个函数中 215 个超阈值（>15），最高复杂度 105（make_create_guard）。
    裁定 DEFERRED-PERMANENT=215（暗债类别），解锁条件为人类架构师发起循环复杂度
    重构专项+回归测试覆盖先行。同时引入 BLUEPRINT-FORMAT gate（Phase 0 防蔓延）。
