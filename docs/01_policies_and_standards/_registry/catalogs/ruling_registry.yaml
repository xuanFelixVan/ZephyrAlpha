- ruling_id: '裁定#281'
  title: 常驻门禁进程冻结门禁语义——任何门禁治本的生效延迟上限等于该进程寿命，必须自检代码纪元并原地 re-exec；落地环境的派生缓存陈旧不得当作违规证据
  date: '2026-09-16'
  category: 治理架构
  status: active
  summary: >-
    病根（两条叠加，缺一不可复现事故）：①commit_belt_daemon 是常驻进程，门禁模块在
    进程启动时 import 一次并常驻内存，模块内没有任何 reload/restart/SIGHUP/哨兵机制
    （grep 全文无匹配）——21:39 落地的 R21 假阳性治本对 07:17 启动的守护进程**完全无效**，
    14 小时前的模块对象仍在内存里按旧逻辑判违规，22:06 挡死 q-…-0017。
    推论：本仓所有门禁治本的生效延迟上限=守护进程寿命，而"修好了但不生效"比"没修"
    更危险（修复者会误判自己的治本无效，进而重复施工或错误回滚）。
    ②落地 worktree 的 .runtime/ 是 gitignored，派生缓存（depgraph_scan_cache.json）
    永不随主仓刷新——事故时它比 checkout 旧一整天，门禁拿它当"当前事实"。
    裁定：①常驻门禁进程必须自检代码纪元（如 src/zephyr/gov_enforcement 的 HEAD sha 或
    内容指纹），纪元变更时在**安全点**（两轮 drain 之间、lease 已释放）原地
    os.execv 重启自身——execv 替换进程映像=新 import、无孤儿、不依赖外部监管者拉起；
    禁自杀式退出（本仓无计划任务重拉 belt daemon，退出即掐断全仓排队落地）。
    ②门禁不得把派生缓存当违规证据的唯一来源：缓存 hash 未命中=陈旧=未知，未知即降级
    出声（warning），禁回退"取第一条"这类拿旧版本文件判当前违规的写法。
    ③本裁定的施工属**共享基础设施变更**，8 会话并发期禁自行 kill 常驻进程
    （会掐断他人排队落地），须在其静默窗或经 Owner 门位执行。
  evidence: >-
    活体取证：belt daemon PID 28648 启动于 07:17:43，R21 治本 634a9d71fc 落库于 21:39:55，
    q-…-0017 于 22:06:22 死于同一条 R21 假阳性；落地 worktree
    .runtime/depgraph_scan_cache.json mtime=Sep 15 22:17，内含改名前的
    MOD-INT_NEWS_CHAIN/MOD-INT_CHAIN_IMPACT，而主仓同名缓存 mtime=Sep 16 21:55
    已是 MOD-INT-NEWS-CHAIN（连字符）；对两文件做 sha256 查表实证 hash **未命中**
    （命中即不会报错），坐实"陈旧缓存 + 旧代码回退首条"双因叠加。
    非破坏性解阻：把主仓新鲜缓存拷入落地 worktree（原件保留为
    *.stale-20260916.bak），随后 q-…-0020 正常落地（250c134d9d）——反证阻断来自
    观测面陈旧而非物品内容。
  affected_files:
    - src/zephyr/gov_enforcement/rule_bridge/commit_belt_daemon.py
    - src/zephyr/trading/decision_map.py
  related_arch: []
  related_rulings: []
  superseded_by: null

- ruling_id: '裁定#282'
  title: EXP 族晋级判据禁挪——DS-275 覆盖边界只许"另立降权协议"，不许改主协议 IS 窗；exp02 在修复源上恒 not_evaluable
  date: '2026-09-16'
  category: 量化施工
  status: active
  summary: >-
    背景：DS-275 修复表源覆盖=A 段 2017-01~2021-12 + B 段 2026-07-22 起，中间
    2022-01~2026-07 是源覆盖空洞（非构建缺陷）；EXP 族主协议 IS 窗 2019-01~2023-12
    （60 个月）在修复源上只有 36 个月可得。三项候选处置：A 缩 IS 窗到 2019-2021、
    B 补挖 2022-2026 提取、C 判 not_evaluable。
    裁定：**主协议 IS 窗一格不动**（预注册判据禁挪是本仓铁律；挪窗=用事后信息改闸门，
    预注册当场失效），改为在看结果之前**另行预注册**一个降权协议 exp_r36：
    IS' 2019-01~2021-12；显著性由 t p<0.05 收紧到 |t|>3.0（Harvey-Liu-Zhu 2016；
    量化依据 SE ∝ 1/sqrt(T)（Lo 2002），T 60→36 月使 SE 放大 sqrt(60/36)=1.291 倍，
    同等严格度只能提高门槛，降低即自我放水）；|IC|>=0.02 效应量地板不变（效应量与
    样本量无关，放大它=变相放宽）；覆盖率>=60% 分母换成 IS' 月数；无 OOS' ⇒ OOS 段
    显式 not_evaluable（禁落成 n_months=0，那与"跑了但样本不足"同形）；
    evidence_class=preliminary-coverage-limited、promotion_authority=none
    （永不产出晋级/否决结论）。两条 fail-closed：exp_r36 只成立在 --source repaired
    （污染源上跑降权协议=给假历史发一张看起来合法的证）；exp02 × repaired 恒
    not_evaluable（DS-275 的 eps_std 结构性不可得、表内恒 0，以其为分歧归一分母算出的
    IC 是对不存在数据的断言；χ²(n-1) 在 n=1 时自由度 0=无定义，0 不是"零分歧"而是
    "不可得"）。路径 B（补挖 2022-2026）**本批不授权**：PDF 缓存 99.6% 就位但残余
    4,993 份提取属独立班次，且不得在督导器仍在看 C4 扫尾时重复拉起提取批。
    协议表落库这一步本身即预注册动作（时间戳不可变、先于任何结果）；出证已在看结果之前
    完成协议冻结后另行执行（结论见本条 evidence：三因子零通过），产物按 evidence_class
    分开归档（降权协议证据禁与主协议出证混放）。
    【2026-09-17 事实前提更正（判据与结论不变）】：F: 盘已重挂，data/c4_pdf_cache junction
    复活，实测缓存 60,245 份 PDF 全部落在 2017~2021 五个年桶（10,795/11,992/11,947/
    12,647/12,864），2022~2026 年桶为 0 份——上文的「PDF 缓存 99.6% 就位」只对 A 段残余
    4,993 份补提取成立；路径 B（补 2022-2026 空洞）在缓存内无一份现成 PDF，需全新语料
    下载批，代价量级与本条写作时的估计完全不同。本更正不动判据、不动结论（路径 B 本就
    「本批不授权」），只更正其代价估计；是否立项补洞批仍属 Owner 门位（语料规模授权）。
  evidence: >-
    代码与钉：_PROTOCOLS 协议表 + --protocol CLI + _seg_oos 显式 not_evaluable +
    _emit 单一出口 + _PANEL_HI 面板上界（缺省=主协议 OOS 末，历史行为零漂移）。
    实测：主协议合成 ic_gate 串与 registry 头 2026-09-12 原文全等（True）；
    exp_r36×polluted 退出码 2；exp02×repaired 产出 not_evaluable JSON
    （consensus_table=c3_fundamental.consensus_daily_repaired、oos_window=null、
    promotion_authority=none）。tests/scripts/test_build_consensus_daily_repaired.py
    17 passed（原 9 + 协议 5 钉：主协议判据逐字冻结、exp_r36 只严不宽、无 OOS 显式态、
    两条 fail-closed 出口；+ 滑点腿 3 钉，对应同批 _narrow 治本）。
