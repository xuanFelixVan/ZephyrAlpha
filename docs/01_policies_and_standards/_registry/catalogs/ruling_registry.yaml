    补登记 required=false/category=secret/rotation 90d，阿里云百炼 DashScope OpenAI
    兼容端点。三件处置后全仓 drift 复扫 critical=0/warn=0（era 面本已收口）。
    登记纪律：两 hot 文件 safe_write_text CAS+claim 制；本件不落盘任何密钥明文
