# ============================================================
# 裁定编号分配铁律（裁定#20-D）
# ============================================================
# 1. 连续分配：裁定#NNN 按裁定时间顺序连续分配，禁止跳号
# 2. 不回收：已分配编号永不回收，即使裁定被废弃/superseded，编号仍保留
# 3. 子裁定格式：裁定#NNN-A/B/C 表示主裁定（裁定#NNN）的子项（如裁定#203 的子裁定 #203-B），
#    捕获组为 \d+(?:-[A-Z]+)?，支持纯数字与带字母后缀
# 4. status 四值：active(生效中) / superseded(已被新裁定取代) / deprecated(已废弃) / draft(草案)
# 5. 登记强制：任何 裁定#NNN 引用必须在本注册表有对应条目，禁止 grep-and-claim 占位
#    （裁定#20-A 治本，对标编号铁律#6 的 #ARCH-XXX 机制）
# 6. 同提交原子性：新增 裁定#NNN 引用必须与 registry 同 commit 提交（裁定#20-B L2），
#    否则 RULING-REFERENCE gate 硬阻断（阶段2 启用，阶段1 manual stage 仅 WARNING）
# 7. 编号空洞检测：WARNING 不阻断，建议补登（如本项目编号缺口 #205/#212）
# 8. 物理排列规则：entries 列表按**裁定时间顺序**追加（新条目追加末尾），不按编号顺序排列。
#    编号连续性由铁律#1保证，物理排列顺序不影响 YAML list 语义。禁止为"排序"重排历史条目。
#    检索时按 ruling_id 字段查找，不依赖物理位置。
# 9. superseded_by 链：裁定被新裁定取代时，旧裁定 status=superseded + 填 superseded_by=新裁定ID；
#    新裁定 entries 中 reference 旧裁定
# 10. 跨表引用：裁定可关联 #ARCH-XXX 议题（related_arch）与其他裁定（related_rulings），
#     形成议题-裁定双向追溯链

unique_key:
- ruling_id

entry_schema:
  ruling_id: str              # 裁定#NNN 或 裁定#NNN-X（子裁定）
  title: str                  # 裁定标题
  date: str                   # 裁定日期 YYYY-MM-DD
  category: str               # 架构 | 治本 | 命名 | 流程
  status: str                 # active | superseded | deprecated | draft
  summary: str                # 裁定内容摘要（治本病根 + 方案 + 关键文件）
  affected_files: list        # 受影响文件绝对路径列表
  related_arch: list          # 关联 #ARCH-XXX 议题编号
  related_rulings: list       # 关联其他裁定编号
  superseded_by: str          # (可选) 取代本裁定的新裁定ID

