- ruling_id: '裁定#280'
  title: 提交队列的瞬态环境失败（索引锁争用/Windows 句柄占用/全局提交锁超时/CAS 重试耗尽前的插队）一律退回 pending，绝不死信——死信只留给"物品本身坏了"
  date: '2026-09-16'
  category: 治理架构
  status: active
  summary: >-
    病根：死信的语义是"这个物品是坏的，人工来看"。但队列把三类性质完全不同的失败
    混进了同一个出口：物品性失败（门禁判内容违规、快照路径非法）、环境性失败
    （git index.lock 争用、reset --hard 撞 Windows 句柄占用、全局提交锁 LOCK_TIMEOUT）、
    以及并发插队（CAS 重试上限过低）。环境失败死信=把无辜物品判坏，8 会话并发期
    一夜 16 项死信实证（q-…-0009/0010/0011 LOCK_TIMEOUT、q-…-0013 CAS 耗尽、
    q-…-0017 DECISION-MAP 假阳性、q-…-0018/0019 句柄占用）。
    裁定：①落地侧新增 _TRANSIENT_GIT_MARKERS 特征串单一真源 + _is_transient_git_error()，
    覆盖索引锁族（index.lock/unable to create）与 Windows 句柄占用族（unable to unlink/
    permission denied/being used by another process/the process cannot access the file）；
    **刻意不收裸 "Invalid argument"**（太宽，真 bug 也报它，收进来=把真物品失败洗成
    环境失败，坏物品会无限重试卡队）；②LOCK_TIMEOUT 抛 LandingEnvironmentError，
    全局提交锁等待由 gateway 缺省 60s 放宽到 300s（队列本就异步，无交互延迟预算）；
    ③CAS 重试上限 3→6（重放产生同内容 commit，CAS 保护不分叉，提上限只是把
    "人工 requeue"换成"自动重同步"）；④死因三分类 classify_dead_reason 的 env 标记表
    同步补齐，历史死信与直连路径也能正确判读为"物品无辜可 requeue"；
    ⑤CAS 重试耗尽**仍是死信**（不卡队），这条边界不许跟着放宽。
  evidence: >-
    tests/governance/test_commit_queue_landing.py 30 passed（新增 5 例：锁等待透传钉
    _lock_wait_seconds==300.0、LOCK_TIMEOUT 退回 pending 且 claim 已释放
    kinds==[claim,commit,release]、句柄占用生产实录原串退回 pending、
    特征串两族覆盖 + 反向钉裸 Invalid argument 不归瞬态、CAS 耗尽仍死信且
    commit_calls()==2）；tests/governance/test_commit_queue.py 80 passed（含
    TestClassifyDeadReason 三例，既有 DLQ 语义零回归）。落地实证：98d55d9a35（全局锁争用改判环境失败 + CAS 重试上限 3→6）+ 9dcbfcec06（Windows 句柄占用/索引锁残留归瞬态）。
  affected_files:
    - scripts/governance/commit_queue_landing.py
    - scripts/commit_queue.py
    - tests/governance/test_commit_queue_landing.py
    - tests/governance/test_commit_queue.py
