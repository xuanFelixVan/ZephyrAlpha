- ruling_id: '裁定#279'
  title: 全局对账型门禁的观测面必须是 git index/tree 而非本机磁盘，且必须做 HEAD 基线差分——存量不一致只挡引入者，不连坐无辜提交人
  date: '2026-09-16'
  category: 治理架构
  status: active
  summary: >-
    病根：全仓扫描型门禁（ERRCODE-CONSISTENCY 等）观测的是"我这台机器此刻磁盘上有什么"，
    而它要判的命题是"这次提交之后仓库是什么状态"。两者在三种常态下必然背离：
    ①提交队列落地 worktree 的 .runtime 派生物永不随主仓刷新（gitignored）；
    ②他会话在途 WIP 尚未落库；③本机残留/陈旧缓存。于是门禁对**不存在的仓库状态**
    断言违规，把无关批次挡死（2026-09-16 16:34 起 GATE-ERRCODE-CONSISTENCY 连续
    4 小时挡死所有含 src/zephyr 的批次，ZA-PA-0031/32/33 指向尚未进 git 的 pf_alloc
    文件；DECISION-MAP R21 同族，拿一天前的 depgraph 缓存判 MOD 对账不一致）。
    裁定：①观测面统一为 git index（git grep --cached / cat-file），磁盘只作补充证据；
    ②必须做 HEAD 基线差分（Google Tricorder "only new warnings"、bors-ng staging
    分支模型同源）：违规集 = NOW(index) − BASE(HEAD)，存量只挡引入它的那次提交；
    ③常态零额外开销是硬要求——index 面全绿即短路返回，不付第二次扫描
    （实测 7.53s→3.03s，与差分前同量级）；④fail-closed 语义保留：校验器不可达/
    真源损坏仍阻断，差分只改"谁该被挡"，不改"要不要挡"。
    同族盲区（本裁定适用面，逐个另案清偿，禁一次性大改）：
    CAP-CONSISTENCY（延期须附 claimant+TTL 证据）、schema_file_exists_gate.py
    L117-120、doc_ref_broken_gate.py、consumers_accuracy_gate.py L202-233、
    DECISION-MAP R21（已按"hash 未命中→None，降级 warning"清偿）。
  evidence: >-
    双环境实证：①忠实 serializer 沙箱（git reset --hard dev 后只放 3 个待验文件）
    NOW(index)={} 2.60s / BASE(HEAD)={} 2.94s / gate ok=True 3.03s；
    ②主仓活体 NOW(index)={} 2.96s / BASE(HEAD)={} 3.39s / introduced={} /
    gate ok=True 3.69s。短路钉：test_clean_index_skips_baseline_scan 断言
    只请求 tree=None 一次（calls == [None]）。既有 19 例 + SSoT 六断言违规证据集
    全绿；pf_alloc 三文件由其归属会话 fc28026614（车道D2 组合分配链落地）正常落库后
    ERRCODE 面自动归零（git log --diff-filter=A 实测三文件均由该 commit 首次进 git；
    =反证原阻断是观测面错误而非数据错误，本裁定未改任何业务数据）。
  affected_files:
    - src/zephyr/gov_enforcement/commit_gates/errcode_consistency_gate.py
    - tests/governance/commit_gates/test_errcode_consistency_gate.py
    - tests/governance/test_error_code_consistency.py
