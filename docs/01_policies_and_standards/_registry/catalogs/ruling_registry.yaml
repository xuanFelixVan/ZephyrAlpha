    病根实证②（移植当日新发现，比定址更危险）：pytest 读 .ini 只认 [pytest] 段
    （_pytest/config/findpaths.py load_config_dict_from_file 按后缀分支：.ini→[pytest]，
    [tool:pytest] 仅 .cfg 生效）。初版移植误写 [tool:pytest]，探针实测 pytest 照样打印
    `configfile: py.ini` 却 markers/--strict-markers/timeout/norecursedirs 全部零生效
    （Unknown pytest.mark.slow 告警 + 3 passed）。即"配置看着在、实则整套失效"的静默放宽：
    文件缺失至少被看守器判漂移，误段名此前无任何机制可见——正是本看守器要防的那类
    "换个跑法结论就变"缺陷的镜像形态（放宽版）。
    裁定①：精简 pytest 配置寄居根目录既有纳管件 py.ini 的 [pytest] 段，跑法
    `python -m pytest -c py.ini <目标>`。py.ini 已在 DIRECTORY-CONTRACT root_directory_whitelist
    且 .gitignore 已 !py.ini 放行→零受保护路径变更、零合同变更；rootdir 仍是仓库本体
    （-c <ini> 的 rootdir=ini 所在目录，实测）；py.ini 不在 pytest 自动发现名清单
    （pytest.ini/.pytest.ini/pyproject.toml/tox.ini/setup.cfg），故只有显式 -c 才生效，
    不改默认全量跑法（与"独立件"同一非侵入性质）。
    裁定②：裁定#275 的"独立件 pytest_min.ini 驻根"定址部分作废（superseded_by 本裁定），
    其"永久产物禁入 TTL 区""config/ 收不下 .ini（DCR-005）""markers 是 linelist 每行一个"
    三条判据完整保留并继续生效。
    裁定③：看守器 compare_pytest_configs 判据由三类扩为四类，新增 D=段名判据——py.ini
    无 [pytest] 段或只有 [tool:pytest] 即判漂移并早退（不再叠加比对噪声）；同时要求
    addopts 保留 --strict-markers（丢了它 A 类 markers 漂移在精简跑法下不可见）。
    自家测试钉扎误段名检出 + 真仓 py.ini vs pyproject 零漂移（防"测试全用 tmp fixture、
    真配置烂了没人知道"）；收集卫生守卫同步段名判据并把"永久件缺失"从 pytest.skip 改为
    硬失败（skip 曾长期掩护该守卫静默不执行）。
    裁定④：引用面同步——.pre-commit-config.yaml GATE-PYTEST-CONFIG-DRIFT 的 files 正则
    ^(pyproject\.toml|py\.ini)$、gate_registry（生成器再生，非手改）、
    module_translation_registry（upsert 工具）、pyproject P1-4 留痕注记（历史记录保留彼时
    件名+括注现址，不改写事实）。
    被否方案：(a) 申请 .gitignore 审批——夜班拿不到，且把人工闸永久嵌进产物生命周期；
    (b) 放 config/——DCR-005 只允许 .yaml/.yml/.json，全合同 77 目录条目无一允许 .ini；
    (c) 改名 pytest.ini——成为自动发现名，直接顶掉 pyproject 默认跑法（全仓跑法突变）；
