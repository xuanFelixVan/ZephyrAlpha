    加 !pytest_min.ini 单点放行——.gitignore 是 PROTECTED-PATHS（ARCH-MODEL-LIFECYCLE-001），
    修改须 Owner 审批且无 CLI 逃生旗，GitCommitGateway 直连两次 rc=8 硬拦。未伪造审批标记
    （POST-COMMIT-GUARD 对伪造 [GW:] 会 reset 回滚，且手写审批标记本身即事故）。
    结论：一个永久产物的一生里嵌一道只能人开的闸，与"全管线自动化、无需人工参与"的目标
