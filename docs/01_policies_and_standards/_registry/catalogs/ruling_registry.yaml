- ruling_id: '裁定#293'
  title: '回测合理性收益带单一真源化并收紧（+1000%→+300% / 11.0x→4.0x）——四落点字面量收归 engine_base 两常量，产物层倍数带由收益带推出'
  date: '2026-09-17'
  category: '治本'
  status: 'active'
  summary: >-
    裁定：回测合理性护栏的收益带数值单一真源=engine_base.MAX_PLAUSIBLE_TOTAL_RETURN=3.0 /
    MIN_PLAUSIBLE_TOTAL_RETURN=-0.95；产物层落盘兜底的净值首尾倍数带 MUST 由
    plausible_equity_multiple_bounds() 推出（=(4.0, 0.05)，即 1+收益带），下游四落点
    （引擎函数默认值 / BacktestConfig 字段默认 / event_driven getattr 兜底 / 产物层倍数比较）
    一律引常量，禁复述数值。同时把上限由 +1000% 收紧到 +300%（预注册口径变更，再动须另立裁定）。
    病根不是"阈值松"而是"一个口径两个数"：引擎层判 total_return>10.0、产物层判倍数>11.0x，
    两条线互不知情，改一处漏一处等于没有上限，且两个数互相背书制造"已对齐"假象。
    分析过程：①第一性原理——护栏的唯一职责是截断物理上不可能的样本；带越宽漏过的失真越多，
    而"上限有两个值"比"值不对"更坏，因为它让任何一侧的收紧都不产生确定效果。②100% AI 开发的
    责任链——字面量散落意味着后续 AI 只看得见局部字面量，会把它当权威抄到第五处；单一真源常量
    +机读 [INVARIANTS] 条款才是"改口径只有一个落点"的机械保证。③机构实践——主流回测框架把
    implausible-return 检查做成一处可配置常量（qlib/vectorbt 的 sanity check、Zipline 算法模拟器
    侧的极端值门），要点从来不是阈值多少而是"只有一处定义"。④量化社区——A 股无杠杆 long-only
    多年份实证里累计 +300% 已在头部区间，+1000% 段几乎只与前视/未复权/无限流动性三类失真同现，
    正是本护栏要拦的对象，把该段写成合法带等于给失真发通行证。⑤存量实测——现网 52 份回测产物
    total_return 最大 +118.7%、最小 −53.0%，净值首尾倍数最大 2.187x、最小 0.470x，
    >3.0 与 >4.0x 均为 0 件 → 收紧对现网零隔离、零 retroactive quarantine。
    执行：engine_base 新增两常量+换算函数并入 __all__；result_repository 倍数带改取该函数；
    vectorized_engine BacktestConfig 默认值（曾 10.0）与 event_driven_engine getattr 兜底
    （曾 10.0/−0.95）改引常量；三文件 [DEPENDENCIES]/[INVARIANTS] 头补真源条款；
    tests/backtest/test_bt_financial_correctness_p0.py 改口径驱动断言并新增同源测试
    （倍数带=1+收益带、Config 默认=真源、实证带内放行、5x 两层都拦）。
    编号注：按登记时注册表最大值+1 取号，与并行会话同规则；若并行 autostash/merge 扫回条目，
    以本文件最终态为准（可机械复核：ruling_id 唯一键）。
  evidence: >-
    现网 52 份产物实测（data/backtest_artifacts/bt-*.json，只读脚本逐件解析 metrics.total_return
    与 equity_curve 首尾倍数）：n=52 / n_curve=48，total_return max=1.187067 min=−0.530165，
    multiple max=2.187067 min=0.469835；>3.0 计 0 件、>4.0x 计 0 件、<0.05x 计 0 件 →
    新旧口径对现网裁决结果完全一致，差别只在"未来出现 5x 产物时是否有人解释得了"。
    旧口径双字面量的定位证据（施工前实测）：engine_base.enforce_result_plausibility 默认
    10.0/−0.95、vectorized_engine.BacktestConfig 155-156 行 10.0/−0.95、
    event_driven_engine getattr 兜底 10.0/−0.95、result_repository._artifact_plausibility_violations
    11.0x/0.05x——同一"上限"四套写法。复验：tests/backtest/test_bt_financial_correctness_p0.py
    35 passed（含新增 test_plausibility_band_single_source）；ruff 与 HEAD 基线比零新增。
  affected_files:
    - src/zephyr/backtest/core/engine_base.py
    - src/zephyr/backtest/io/result_repository.py
    - src/zephyr/backtest/implementations/vectorized_engine.py
    - src/zephyr/backtest/implementations/event_driven_engine.py
    - tests/backtest/test_bt_financial_correctness_p0.py
    - docs/01_policies_and_standards/_registry/catalogs/ruling_registry.yaml
