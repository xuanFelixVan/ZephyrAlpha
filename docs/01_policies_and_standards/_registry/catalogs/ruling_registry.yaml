- ruling_id: '裁定#292'
  title: 'ALGO_FLOW 出仓作者欠账三态处置口径——禁工具臆造节点/边，欠账转生成器台账派工，战役本体不连坐'
  date: '2026-09-17'
  category: '架构治理'
  status: 'active'
  summary: >-
    裁定：机器块语义残缺（欠 - id: 机器行 / 零边图 / 块不可解析）判为**作者欠账**，出仓工具
    禁止代补——补节点或补边即臆造算法语义，错图会被全景图渲染成「已验证」，比无图更坏；
    欠账由生成器产出台账逐件派工，可机械出仓部分先行收口、不因欠账连坐整役。分析过程：
    ①第一性原理——出仓是存储位置搬家（inline 机器块 → docs 镜像 yaml + 一行 external 锚），
    搬运工无权改语义；本役"搬家是否等价"的可机械判据=剔机器块后的可执行指令流同一性
    （dis.get_instructions 递归字节码流）+ 节点 id 集/边三元组集逐位相等，凡需新增语义即越界。
    ②100% AI 开发的责任链——工具越权补图会把"AI 猜的边"洗成"作者写的边"，事后无从追溯谁负责；
    与裁定#273（CloneGuard 触碰税禁以白名单消警=治理逃逸）、裁定#274（治本在解析器分段展开，
    禁改语料迁就解析器）同一价值观。③机构实践对标——自动生成资产入库强制 owner+人工评审
    （auto-generated ≠ auto-approved），schema 演进把"格式迁移"与"语义变更"分两类工单。
