- ruling_id: '裁定#294'
  title: 'DSR 显著性接入 candidate→sim 晋升预授权作第四条件 dsr_significance_pass——判定委托 evaluate_dsr（阈值零改动），证据缺位一律 fail-closed；实盘 pre-trade 接入与 combo 门 dsr_min=0.0 残余项显式留待 Owner'
  date: '2026-09-17'
  category: '量化施工'
  status: 'active'
  summary: >-
    裁定：DSR 显著性裁决 MUST 被 candidate→sim 晋升预授权消费，作第四条件
    `dsr_significance_pass`；判定委托既有单一裁决器 decision_gate.evaluate_dsr
    （DSR_SIGNIFICANCE_THRESHOLD=0.95 / DSR_OVERFITTING_FLOOR=0.5，本裁定零改动），
    数值只从台账列 c1_backtest.strategy_screen.deflated_sharpe 读取（经
    screen_source.fetch_dsr_map 侧车，N=trial_ledger 折减），消费侧禁重算；
    证据缺位（无该策略条目 / 侧车空 / 行键不可构造 / 台账无行 / 列 NULL / 读取异常）
    一律按"判不了=不放行"fail-closed，禁把缺席当 0 也禁当当通过。
    分析过程：①第一性原理——晋升是一次资源承诺（进 sim=占真实模拟额度与观测窗口），其前提
    必须包含"这套收益比运气更可信"；DSR 恰是该命题的唯一量化裁决，产出而不消费=信号白产，
    与本战役 H5-A（overfitting_flag 产而不消）同族病灶。②100% AI 开发的责任链——把既有裁决器
    接进既有门，判定口径仍可追溯到 decision_gate 一处；若新写一套"晋升用 DSR 判据"，就多出一个
    只有晋升路径知道的口径，事后无从审计谁定的标准。③机构实践——研究→模拟的准入门吃多重检验
    修正后的显著性（Bailey & López de Prado 2014 提出 DSR 的用途即"这份 SR 是否只是多次试验的
    产物"），且缺证据默认拒绝，与本件同构。④量化社区惯例——显著性不达标者留在研究池继续观察，
    但不得进入 forward test；本件只挡 candidate→sim，不挡回测与档案，正是该口径。⑤存量实测——
    台账 87 行 IS 批 DSR 最大 0.122，16 行及格集全部 <0.5（样例 CAND-29eb91dbaf60
    DSR=0.0002、N=35），注册表 161 条 candidate 的前三条件通过集=0 → 第四条件今日不改变任何
    现网裁决，其价值是把"没看过这一列"变成"看过并拒"，并在今日三条件被满足时仍留一道刹车。
    与 FSM guard 的不对称（有意保留，非欠账）：SimPromotionContext 仍三字段、guard 契约不动，
    本件比 guard 严，方向只会更少放行、不会反向放行——避免"改契约即改实盘可达状态集"的连坐。
    边界声明（本裁定不改的东西）：DSR_SIGNIFICANCE_THRESHOLD / DSR_OVERFITTING_FLOOR /
    手续费万 0.854 / MIN_COMMISSION=5 / 回撤阶梯 THD-DRAWDOWN-001/002/003 全零改动；
    台账列只读，本裁定不产生任何写入。
    编号注：按登记时注册表最大值+1 取号，与并行会话同规则；若并行 autostash/merge 扫回条目，
    以本文件最终态为准（可机械复核：ruling_id 唯一键）。
  evidence: >-
    现网只读实测（screen_source.fetch_bothwin/fetch_dsr_map + decision_gate.evaluate_dsr）：
    及格集 16 行 ∩ DSR 侧车 87 行 = 16 行全部有值，DSR min 0.0 / median 0.0018 / max 0.0793，
    <0.5 共 16 行、≥0.95 共 0 行，侧车全体 max=0.122；单条裁决样例
    evaluate_dsr(0.0002)→passed=False band=overfitting
    reason="DSR判定未通过(低于运气中值否决线): 0.0002 < 0.5（N=35 试验折减后）"。
    晋升评估器实跑：failed=['bh_fdr_pass','dsr_significance_pass']（接线前只 fail 前一项）。
    测试面：tests/strategy_pipeline/test_promotion_advisory.py 23 passed（含 TestSimPreauthorizationDsr
    7 项：显著通过 / 复核带 0.7 拒 / 过拟合带 0.12 拒 / 列 NULL 拒 / 台账无行拒 / 侧车读取异常
    降级为拒 / Context 仍三字段 / decide 带第四条件失败上呈 Owner 且不落决策墓碑）+
    test_screen_source.py 22 passed（含 TestDsrSidecar 键与及格集同源、NULL/零列语义、只读 SELECT）。
  affected_files:
    - src/zephyr/strategy_pipeline/screen_source.py
    - src/zephyr/strategy_pipeline/promotion_advisory.py
    - src/zephyr/strategy_pipeline/fw_backtest.py
    - tests/strategy_pipeline/test_promotion_advisory.py
    - tests/strategy_pipeline/test_screen_source.py
    - docs/_working/full-auto-chain/S11_assembled_backtest/nodes/risk_overlay_mining.md
    - docs/01_policies_and_standards/_registry/catalogs/ruling_registry.yaml
