- ruling_id: '裁定#291'
  title: 'DSR 三实现口径统一治本——V[SR] 峰度 Pearson 化 + E[max(Z_N)] 论文闭式 + 退化态 Fail-Closed（历史台账读数须按新口径重算后方可比）（编号注：登记时段内 #290~#294 曾被并行"排班 v2"会话占用，随后一次他会话 autostash/merge 把未提交条目扫回 HEAD，#290 由"qwen3-coder 移除"会话重新落地；本条按登记时注册表最大值+1 取 #291）'
  date: '2026-09-17'
  category: '回测口径'
  status: 'active'
  summary: >-
    裁定：把 Deflated Sharpe Ratio 的计算口径收归单一真源，并声明历史读数不可跨口径混比。
    根因=同一 V[SR] 公式在仓内被三处各自实现（deflated_sharpe_calculator 真源、
    overfitting_adjudicator 自带私有 Acklam 逆正态+自有 V[SR] 块、dsr_recalc_backfill
    文档字符串写死旧口径并导入私有名），三者对峰度的解释互不一致——文献
    （Lo 2002 / Bailey-Lopez de Prado 2014 / Harvey-Liu-Zhu 2021）的 V[SR] 用的是
    Pearson 峰度 κ_p（正态=3），而仓库各调用方一致传入超额峰度 κ_x（正态=0），
    旧实现直接把 κ_x 当 κ_p 代入 (κ−1)/4 项，等于把正态基准算成 (0−1)/4·SR² 的
    负修正，与 iid 正态锚点 (1+SR²/2)/(T−1) 自相矛盾。裁定四要点：
    ①口径钉死：V[SR]=(1−γ₃·SR+(κ_p−1)/4·SR²)/(T−1)，κ_p=κ_x+3，转换在真源内部完成，
    对外 API variance_of_sharpe(sharpe, skewness, excess_kurtosis, num_obs) 只收超额峰度；
    三处实现一律委派真源，私有别名仅为兼容保留。
    ②E[max(Z_N)] 钉死为论文闭式 (1−γ)·Φ⁻¹(1−1/N)+γ·Φ⁻¹(1−1/(N·e))，γ=Euler–Mascheroni，
    旧近似（N=1 时 0.8469）作废，闭式 N=1 给 0.5198。
    ③退化态判据：V[SR] 非正或非有限即"不可判定"，输出 degenerate=True + WARNING，
    下游判定 Fail-Closed（is_significant=False，不放行），禁止静默返回 0.0/1.0 充数；
    DSR 值域仍钉在 [0,1]。
    ④历史可比性：新旧口径净偏非单调（实测比值跨 0.967…1.165，随 SR/峰度组合双向摆动），
    不存在统一换算系数，故任何跨期 DSR 比较必须先按新真源重算；旧台账数值保留但不作为
    新判据的对照基线。
    边界声明（本裁定不改的东西）：DSR 放行阈值、_DECAY_SUSPECT、手续费万 0.854、
    MIN_COMMISSION=5、回撤阶梯 THD-DRAWDOWN-001/002/003=5%/10%/15% 全部零改动——
    本裁定只修"算错的数"，不放松也不收紧任何预注册判据强度。
    遗留待裁 R-2（不在本裁定处置范围）：近奇异正方差下 γ₃·SR→2⁻ 且 κ_x 取下界 γ₃²−2 时
    V→0⁺（实测 2.5e−7…2.5e−15），DSR 合法饱和为 1.0 而 degenerate=False，恰取等号（V=0）
    则判退化，两侧不连续。建议形态 V ≥ c/(T−1)（c>0 常量）统一判退化，属预注册判据强度
    变更，留 Owner 裁定后另批执行。
  evidence: >-
    真源件：src/zephyr/simulation/deflated_sharpe_calculator.py（variance_of_sharpe/
    expected_max_sharpe_z/sharpe_variance_is_degenerate/deflated_sharpe_from_moments，
    KURTOSIS_PEARSON_NORMAL=3.0，DSR_UNDECIDABLE=0.0）；消费方
    src/zephyr/backtest/core/overfitting_adjudicator.py（adjudicate_dsr 委派，净 −75 行）、
    src/zephyr/backtest/core/metrics.py（result[dsr_degenerate] 双路径）、
    scripts/backtest/dsr_recalc_backfill.py（第 4 个错口径实现，已改委派真源+docstring 更正）。
    独立复测（2026-09-17 收口方实跑）：iid 正态锚点新旧 V 比值恰为 2.0000（SR 项符号
    翻转的解析预期）；焦点件逐档 49 / 38 / 15 passed——
    tests/simulation/test_deflated_sharpe_calculator.py（含独立oracle 对拍 rel=1e−12、
    退化态 fail-closed caplog、跨实现收敛）、tests/backtest/test_overfitting_adjudicator.py、
    tests/backtest/test_dsr_recalc_backfill.py；目录级合跑 tests/simulation + tests/backtest +
    tests/strategy_pipeline = 2244 passed；圈复杂度 9/14/11 均在 15 以下；ruff 净零新增违规。
    本批另含一次工作区事故清偿：02:59 他会话 autostash/merge 把本批未提交改动扫回 HEAD，
    已按 lane 转录逐 Edit 重放复原，numstat 与 §12.1 实测逐条一致（+242/−52、+60/−135、
    +9/−3、+279/−6、+46/−0）。口径变更影响面档案=
    docs/_working/full-auto-chain/S11_assembled_backtest/nodes/coverage_map_cert_gates_mining.md
    §11（裁定与三实现前后对照）+ §12（收口批实测核验）。
  affected_files:
    - src/zephyr/simulation/deflated_sharpe_calculator.py
    - src/zephyr/backtest/core/overfitting_adjudicator.py
    - src/zephyr/backtest/core/metrics.py
