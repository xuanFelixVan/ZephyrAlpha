    补登记 required=false 台账收口（告警消失），.env 残值清理属 .env 写域走 Owner 门位，
    不在本件边界。③QWEN_API_KEY 反向漂移——活跃消费方实证：src/zephyr/integration/
    llm_runtime_gateway.py CHANNEL_QWEN（2026-08-22 #ARCH-162 MVP 引入）经
