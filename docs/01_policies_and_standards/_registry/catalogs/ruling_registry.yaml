- ruling_id: '裁定#283'
  title: mid 置信度提取值不入聚合（留档）——Fellegi-Sunter 复核区不得自动合并；DS-275 消费侧离散度不可得即 NaN/not_evaluable；变体 D 预注册但不启用
  date: '2026-09-16'
  category: 数据治理
  status: active
  summary: >-
    争议：A 段 high-only 入聚合是铁律，但 high 密度低（60,477 研报证据集经守卫+截断后
    38,467 行入聚合），mid 若并入可显著提高覆盖。
    裁定：**mid 维持不入聚合、只留档**。依据 Fellegi-Sunter(1969) 三区判定——
    match / non-match / clerical-review zone：mid 正是"机器不能自动接受也不能自动拒绝"
    的复核区，把复核区并入聚合等于让未经人工复核的证据直接进入决策链，且无法事后
    撤回（"只增不改"的表结构使污染不可回收，这正是 DS-229 事故的形态）。
    密度低是**证据不足的诚实呈现**，不是可以用降低证据标准来填补的缺口；
    Diether-Malloy-Scherbina(2002) 的分散度溢价研究同样以"可辨识的预测分布"为前提，
    把不可辨识的 mid 混入会让分散度统计失去解释力。
    配套两项：①离散度在 n_reports<2 时必须 NaN 而非 0（χ²(n-1) 自由度 0=无定义；
    0 会被消费端读成"全体分析师完全一致"=最强的假信号），且本项只施于 DS-275 消费侧
    （DS-229 历史行零触及是铁律，不改其存储语义）；②变体 D（mid 以独立列/独立
    evidence_class 并入，聚合口径仍 high-only）**预注册但不启用**——先写死口径再谈
    开不开，避免"看到覆盖率不好看再回头设计口径"。
  evidence: >-
    构建期守卫实证：0<eps<=50 剔除 634 行（2017-2021 全 A 股真实 EPS 上界=茅台 2021
    的 41.76；eps>50 定向采样 14/14 全为营收/净利行串列）、slot<=3 截断 126 行；
    落库 1,563,996 行（A 1,472,629/1,854 标的、60/60 月覆盖 2017-01~2021-12；
    B 91,367/2,632）。三重对照 3/3 PASS：B 段与 DS-229 重叠期逐日秩相关 0.9713
    （判据>=0.9 预注册未挪）、锚点股"多源须有修正"违反 0、A 段 20 季末快照日
    独立 SQL 路径重算比对 213 行不一致 0。exp02×repaired 恒 not_evaluable
    即离散度不可得的消费侧落地（裁定#282 同批）。
  affected_files:
    - scripts/ch/build_consensus_daily_repaired.py
    - src/zephyr/data/implementations/consensus_daily_repaired_compute.py
    - scripts/backtest/eval_exp_expectations.py
