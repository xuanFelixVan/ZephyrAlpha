- ruling_id: '裁定#271'
  title: WYF-3 终态补裁——wyckoff 维度判据层证伪 ⇒ 生产显式置零+一次性 WARNING（承 #264「阈值维持现值」未裁的"可用性"半边）
  date: '2026-09-16'
  category: 量化施工
  status: active
  summary: >-
    #264 只裁了"160 网格点零合格 ⇒ 阈值维持现值"，未裁"该维度到底能不能用"，本裁定补完后半。
    证据链（walk-forward，校准/评估段严格分离，决策日只用 ≤T-1）：命中率劣于无条件基线 17.7pp、
    0/5 折为正、合并 t=-0.10、WFE=-1.25、3/5 折恒零、1/5 折误爆（on_share 29.3%），纯净留存段
    max_score=45 仍不达门。另有 latch_dichotomy 结构性证据：cummax 永久粘滞使 on_share 只取两端
    （生产事件集 + 门槛降到 40 ⇒ 单次 2018 事件即永久在线 1927 日=36.6%），故不存在任何阈值向量
    能同时避免恒零与误爆——缺陷在判据而非门限，"再校准一次"不可能治本。
    处置：_DIMENSION_STATUS 置 status=falsified，wyckoff_score / wyckoff_score_from_events 显式
    返回恒 0 并一次性 WARNING（禁静默零值——消费方必须能区分"该维零分"与"该维未计算"），
    wyckoff_dimension_status() 对外披露快照；TRANSITION_CONFIG S2 confirm 的 wyckoff 门槛不动
    （0 分自然不再 confirm，S2 由其余 keys_or_gte 项继续供给）。
    爆炸半径实证：纯净留存段本就 max_score=45 不达门，置零是把"偶然不触发"改为"语义上不参与"，
    不新增生产流转面（非放松亦非收紧，是把既成事实显式化）。
    重跑触发条件（证伪不是永久真理，任一发生必须重跑管线并复议）：SC 量能腿由滚动 volume_anomaly z
    换成固定基准量纲（钝化根因，报告 §5.3）；六阶段判据/权重/memory_window 语义任一改动；
    TRANSITION_CONFIG S2 confirm keys_or_gte 的 wyckoff 门槛变动；指数标的或量纲口径变动
    （H1-P0 未复权治本后）。
