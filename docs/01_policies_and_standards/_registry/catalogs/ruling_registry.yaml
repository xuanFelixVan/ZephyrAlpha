  status: active
  summary: >-
    裁定：secret_registry_drift 首扫（裁定#287 C-4，GW-M 班落地）三项活体告警的收口批
    （st-secrets-20260917，GW-R1 车道，Owner 开工令明示全部解决不留待裁）。
    ①GRAFANA_ADMIN_PASSWORD required=true 失守（critical）——消费方普查实证当前阶段零消费：
    唯一引用面=docker-compose.yml grafana 服务 ${GRAFANA_ADMIN_PASSWORD:?} fail-fast 插值
    +SECURITY.md/.env.example 文档面，而该 compose 栈系#ARCH-065（2026-07-22）裁定的
    Post-Activation 预置配置，experimental 阶段（Windows 本地单机）明确不调用 docker compose up，
    宿主机实测 docker 命令不存在（容器栈从未部署）；全仓无密码找回渠道（无 .env 备份、
    handoff 无记载、无密码库文件）。第一性原理：required 的语义是"缺失即生产事故"，
    对一个从未部署服务的部署期凭据该断言恒假，死要求登记即噪音——按裁定#255 同型先例
    （required 密钥对应死通道=降级/移除登记）降级 required=false；不删条目：compose 未来
    激活仍引用该键且 RULE-SECRETS 映射保留（Post-Activation 激活时由 Owner 补钥再翻转）。
    ②IFIND_PASSWORD 反向漂移（.env 有钥未登记）——iFind 数据源已于 2026-08-14 退役
