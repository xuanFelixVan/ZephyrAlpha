- ruling_id: '裁定#275'
  title: pytest 精简跑法 ini 在合同下无容身之处——定项目根白名单位（DCR-005 禁 config/*.ini），顺带治好 -c 把 rootdir 搬出仓的旧位缺陷
  date: '2026-09-16'
  category: 治本
  status: active
  summary: >-
    病根实证：P2-1 波次落地 pytest 双配置对齐工具（T5 批）时，DIRECTORY-CONTRACT
    DCR-005 硬拦 config/pytest_min.ini（config/ allowed 仅 .yaml/.yml/.json）。
    四条机证定落点：①directory_contract.yaml 全 77 个目录条目无一 allowed 含 .ini，
    即"合同下不存在任何允许 .ini 的子目录"；②root_directory_whitelist 是根目录唯一
    纳管机制，其中已列 py.ini（同型先例，.gitignore 以 /* 忽略根目录、以 !py.ini 单点
    放行，配套机制现成）；③pytest 8.4.2 load_config_dict_from_file 只识别 .ini /
    .cfg([tool:pytest]) / .toml 三种后缀，故"改名 .conf 塞 config/system_configs/"
    或"改 .yaml 由工具派生"两条取巧路直接不可行（pytest 不认=静默丢配置，比拦下更坏）；
    ④探针测得 `-c <ini>` 的 rootdir 就是该 ini 所在目录（.runtime/tmp/bt_probe 与
    系统 Temp 两次均 rootdir 出仓）——旧位 .runtime/tmp/pytest_min.ini 除 2026-09-16
    外审遗留㉑已判的 TTL 断裂风险外，还静默把 rootdir 搬出仓库（conftest 截断、
    .pytest_cache 与相对路径锚点全部外移），㉑只治了 TTL 未看见这一半。
    裁定：ini 迁项目根 pytest_min.ini（非 pytest 自动发现名，只有显式 -c 才生效，
    不会覆盖 pyproject 默认跑法），.gitignore 紧随 py.ini 加 !pytest_min.ini，
    工具常量/pre-commit files 正则/gate_registry/module_translation/creation_token
    四处引用同步改派。㉑的原则"永久产物禁入 TTL 区"原样保留，改的只是永久区里的
    具体位置。被否方案：(a) 放宽合同让 config/ 收 .ini——为单件产物开政策口子，
    目录合同的意义即"按目录约束扩展名"，破例成本大于收益；(b) 工具派生 ini 到系统
    临时目录——rootdir 仍出仓且与 TTL 同族问题未变；(c) 干脆废除第二份配置只留
    pyproject——两轮测试协议（同测试双配置必须同判定）失去载体，属能力净减。
    残余不隐藏：①双份手工维护本身未消除，仍由 GATE-PYTEST-CONFIG-DRIFT 看守，
    按 §9.5"清单须生成器产出"的正解是派生生成器，已登记波次收口报告为候选（本裁定
    不扩面施工）；②仓内既有报告文本仍写旧路径 .runtime/tmp/pytest_min.ini，属历史
    留痕不回改，以本裁定与本件头注为准。
  affected_files:
    - pytest_min.ini
    - .gitignore
    - scripts/governance/d7_code/compare_pytest_configs.py
    - tests/governance/d7_code/test_compare_pytest_configs.py
    - .pre-commit-config.yaml
