- ruling_id: '裁定#285'
  title: WYF-3 v2 重跑（#271 触发条件第 1 条执行）——SC 量能腿固定基准量纲三族候选 0/204 合格，证伪加厚一档，维度维持置零
  date: '2026-09-16'
  category: 研究证伪
  status: active
  summary: >-
    执行裁定#271 明文重跑触发条件第 1 条："SC 量能腿由滚动 volume_anomaly z 换成固定基准
    量纲"。按预注册协议 v2（跑数前写死 + PreRegistrationRegistry hash 锁定）扫描三族候选：
    C1 量比（V/SMA，W_b∈{20,60}×thr 1.5-3.0）、C2 expanding 历史分位（thr 0.95-0.99）、
    C3 固定分位基准比（V/EXP_Q95，thr 1.0-1.5），×sc_pct×sc_window 共 204 网格点
    （新腿 168 + vol_z 对照臂 36）。结果：**新腿臂 0/168 合格**（SC 触发日最好 5 日 vs
    验收下限 10 日，且最好点全部来自 2015 单一波段、聚集数同不达标）；对照臂 9 日=裁定#264
    v1 扫描逐位复现（harness 交叉验证通过）。级联层按协议 §5.2.4 终止，验证段与程序级
    折叠未评（无冻结向量）。**证伪加厚**：缺陷不在"20 日滚动 z 太滚动"，而在恐慌日本身
    对任何量能基准都不再异常——2015-08-24（-8.75%）量比@20=1.009、历史分位=0.945、
    分位基准比=0.905 三族同时失明；expanding 族被第一波历史级巨量永久再锚定（第二波与
    2016/2018/2020/2022 后样本全盲）；分位基准比叠加成交量长期趋势（后样本暴跌日中位数
    0.815<1）。判别信息在价格腿（跌幅+新低），量能腿对指数 SC 无 any-baseline 判别增益。
    处置：DEFAULT_WYCKOFF_PARAMS 全部保持现值（sc_vol_mode 出厂锁 vol_z）；sc_vol_mode
    六字段+sc_volume_leg 构造作为**可复算能力**保留（PIT 自反测试锁死，非生产推荐值）；
    _DIMENSION_STATUS 维持 falsified，新增 recheck_log 台账（触发 1=已执行加厚，触发 2/3/4
    仍未执行）。下一候选方向（供 Owner 立项，本裁定不动工）：①普跌结构腿
    （advance_count/decline_count 在库，语义更贴 SC 多空力竭本义，推荐）；②成交额 amount
    口径（在库未试）；③量能腿→波动率腿=触发条件第 2 条，须新预注册。若开 v3 协议：
    事后诊断（阈值压低曲线）已构成数据先验，须声明；信息量门（#271 池化 t/命中率/WFE）
    仍是翻转必要条件。
  evidence: >-
