- ruling_id: '裁定#284'
  title: DS-275 双轨不切换（switch_gate=Owner）——并预注册切换判据；consensus_crosscheck 永不切换、pit_query 不在切换面
  date: '2026-09-16'
  category: 数据治理
  status: active
  summary: >-
    裁定：**本批不切换**。DS-229（污染轨）与 DS-275（修复轨）物理隔离双轨并存，
    DS-229 历史行零触及；切换权归 Owner（risk_tier_registry 语义：资金/生产流转
    级变更=high 域门位），会话不得自决。理由：①修复轨覆盖 2017-01~2021-12 +
    2026-07-22 起，中间 4.5 年是源空洞——切换等于把一段连续历史换成两段不连续历史，
    任何跨 2022-2026 的回测/因子会在断口上产生无法归因的跳变；②McLean-Pontiff(2016)
    的因子衰减与 Bailey-López de Prado(2014) 的 DSR/PBO 都要求在**同一口径的连续样本**
    上评估，切轨会同时改变数据与口径，使前后出证不可比；③修复轨自身尚未产出任何
    晋级级证据（裁定#282 的 exp_r36 无晋级权），没有切换的实证前提。
    预注册切换判据（写死在切换发生之前，禁事后挑选）：
    C1 修复轨在主协议 IS 窗（2019-2023）上覆盖>=60%（当前 36/60=60% 恰好压线，
      但 OOS 窗 2024+ 覆盖为 0 ⇒ 主协议整体 not_evaluable，故 C1 现判不满足）；
    C2 至少一个 EXP 族因子在**主协议**下出证通过（|IC|>=0.02 & t p<0.05 & 覆盖>=60%），
      降权协议 exp_r36 的通过不计入（无晋级权）；
    C3 2022-01~2026-07 空洞被真实源补齐（提取补挖或第三方 PIT 源接入），
      且补齐批次自身通过三重对照验收；
    C4 切换演练：同一评估脚本在双轨上并行出证、差异归因完成且无未解释跳变。
    四条全满足才提交 Owner 门位，缺一不得切换。
    边界：**consensus_crosscheck 永不切换**（它的职责就是暴露两轨差异，切轨即自废）；
    **pit_query 不在切换面**（它是查询口径而非数据源，切轨不改变其语义，把它列进
    切换面会造成"改查询=改数据"的错误耦合）。
  evidence: >-
    双轨并存实证：DS-275 落库 1,563,996 行且 DS-229 历史行零触及（构建脚本无 UPDATE/
    DELETE 路径，ReplacingMergeTree 读取一律 FINAL）；重叠期秩相关 0.9713 反证污染症状
    （同窗 DS-229 三年份 uniq=1 的天数 1,074 日=历史快照被今日预期回放覆盖的数值坐实）。
    注册侧：data_asset_registry DS-275 条目 dual_track/switch_gate=Owner 事实写入
    format_summary（注册表无此键先例，故不擅自扩表）；capability + 品类 +
    creation_token x6 + depgraph 4 节点 planned→generated + 模块大白话简介 x4 同批落库
    （250c134d9d）。
  affected_files:
    - docs/01_policies_and_standards/_registry/catalogs/data_asset_registry.yaml
    - scripts/ch/build_consensus_daily_repaired.py
    - scripts/backtest/eval_exp_expectations.py
