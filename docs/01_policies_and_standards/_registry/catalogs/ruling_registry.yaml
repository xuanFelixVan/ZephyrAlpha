- ruling_id: '裁定#252'
  title: lock_files 锁存活=会话存活（瞬时 CLI 进程 PID 活体探针失效治本——红蓝 v4 F2 上游）
  date: '2026-09-14'
  category: 治理架构
  status: active
  summary: >-
    Owner 委托架构师裁定（客观专业立场+第一性原理+两路外部调研）。
    现象：lock_files.acquire 由瞬时 CLI 进程领取，owner.json 记录的 PID 进程退出即死，
    下一次任何 lock_files 调用触发僵尸锁自清理把锁删掉（v4/v4.5 实弹：acquire 后立即
    check 即 FREE）——锁形同虚设，搭便车窗口期防线永不命中（F2 端到端残余缺口）。
    第一性原理：锁的全部价值=「持有者还活着」断言可信；活体探针候选①领取进程 PID（现状，
    瞬时进程必死=错误载体）②SessionRegistry 条目（失败提交即释放，双轨脱节）③会话本身
    （真正想表达的语义）——bug 本质=用①承载③。证据链：Gray & Cheriton 1989 Leases
    （被引 880+，锁有效性=时间租约与持有进程解耦）、etcd lease keepalive（锁绑租约由
    长命实体续约）、ZooKeeper ephemeral znode（znode 生死=会话生死）、Kleppmann 分布式
    锁批评系列（僵尸锁危险、fencing token 方向）、多智能体编码社区 2026 收敛方案
    （file-level locking+lease+fencing token）、CoAgent（arXiv 2026 多智能体并发控制）
    ——全部成熟体系均用「锁绑定长命实体（会话）生命周期」，无任何一家用瞬时进程 PID。
    本仓自证：26 会话并发实证（§7.28 registry Mutex 裁定）+100% AI 开发场景中会话是
    唯一稳定长命实体。裁定：采纳「锁存活=会话存活」（方案二）——acquire 增加 --session
    参数，owner.json 写 session_id，_is_stale 对带 session_id 的锁改调 SessionRegistry
    _is_session_alive（pid>0 双判活/pid=0 心跳 90s）判活；无 session_id 旧格式锁维持
    PID+TTL 语义向后兼容零破坏；held_overlap_gate._ailocks_other_holders 判活同步双格式。
    与 lock_files._is_stale PID 僵尸语义的有意分歧（gate 侧 TTL-only）已在 F2 gate 侧
    实施并保留，本裁定后双方语义收敛于会话判活。残余风险：会话崩溃后心跳过期前 90s
    窗口内他 session 提交被误拦——--allow-overlap 逃生口+90s 上界可接受。
    施工：lock_files.py（_is_stale/_write_owner/cmd_acquire/CLI）+
    held_overlap_gate.py 判活双格式 + 单测×3（会话活锁活/PID 死锁仍在/会话死锁废）
    同 commit 原子。
  evidence: 红蓝 v4 报告 §修复批附录 F2 节（docs/_working/2026-09-14-xtreme-redblue-v4-report.md）
    + F2 击穿/复测全记录（堵点本+内存复现诊断）+ v4.5 实弹（acquire 后立即 check=FREE）
