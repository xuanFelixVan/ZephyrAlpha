    病根：worktree 创建后主分支继续前进，worktree HEAD 落后会导致 commit 时基于过期
    base 应用 diff，产生 ghost-commit（看似提交但实际未同步到主分支最新状态）。
    自动对齐机制：检测落后→git fetch origin + git reset --hard origin/<branch>→
    再同步文件→commit。逃生通道：--skip-refresh（仅限故障时使用）。
