  business: "赚钱——行情/因子/信号/回测/风控/组合/执行/前端/数据接入/报表"
  ai: "进化——编排器/自主核心/反馈循环/ML 训练与推理/知识/LLM 安全/自我进化"
  infrastructure: "保运行——进程守护/备份容灾/遥测/数据库服务/消息总线/跨层连接件"
