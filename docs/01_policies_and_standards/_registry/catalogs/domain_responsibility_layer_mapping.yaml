description: >-
  裁定#335 结论⑥落地（战役 st-vocabconsol-20260918 环节 W4a）。为全部功能域登记
  responsibility_layer 四值：governance（不犯错）/ business（赚钱）/ ai（进化）/
  infrastructure（保运行）——取自三层愿景判例（docs/_working/ai_layer_vision/
  ai_layer_vision_and_roadmap_v1.md）。本字段与 layer_vocabulary.yaml v2.0.0
  （L0-L3 运行时栈，DB layer_id CHECK/trigger 真源）正交：职责分层≠运行时栈，
  L2_domain 里 governance 与 business 域混装（争点 C1）。消费方约束：新字段只可
  命名 responsibility_layer；生成器禁从 layer_id/目录名直推（争点 C17：目录≠域≠层），
  真源只能是本文件；叶级（模块→层）条目由生成器从本域级映射自动派生（宪法 §9.5
  静态清单禁手工维护——本文件是"人工+裁定"域级真源，非生成物；其下游派生件才是生成物）。
  归层判据三把尺（W1d §1 收敛）：①服务对象（谁消费产出）②职能性质
  （防错=治理/赚钱=业务/进化=AI/兜运行=基础设施）③KPI 反查（漏拦/收益/进化速度/可用性）。
  跨层复合域按主职能/KPI 定层，其余职能在 reason 留痕（裁定#335 结论⑥ / P4/P5）。

