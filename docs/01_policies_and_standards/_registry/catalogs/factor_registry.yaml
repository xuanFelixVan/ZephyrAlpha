entry_schema:
  factor_id: str                 # FCT-{CLASS}-{NNN}，如 FCT-MOM-001
  name: str
  name_zh: str
  aliases: list
  factor_class: str              # value/quality/momentum/volatility/size/liquidity/event/intraday/technical/sentiment
  formula: str                   # 表达式/公式
  params: obj                    # 参数字典
  inputs: list                   # 输入字段
  outputs: list                  # 输出列名
  alpha_source: str              # alpha来源一句话
  frequency: str                 # daily/intraday/tick
  lookback_period: int           # 回看周期
  universe: str                  # 适用股票池
  benchmark_id: str              # 因子评估基准
  neutralization: str            # industry/size/market/none
  pit_policy: str                # PIT处理策略
  module_id: str
  doc_ref: str
  code_path: str
  belongs_to_strategies: list
  variant_of: str                # 可选：因子变体指向parent
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  ic: float
  ir: float
  decay_halflife: int
  decay_detection_method: str
  last_decay_scan_at: date
  turnover: float
  capacity: float
  last_evaluated_at: date
  data_quality_policy: obj
  null_rate: float
  drift_psi: float
  drift_ks_pvalue: float
  range_bounds: obj
  last_quality_scan_at: date
  # v1.23.0 新增字段（对标 EFS arXiv:2507.17211v2 RMT 去噪因子相关性矩阵）
  correlation_group: str          # v1.20.0 新增：相关性分组（按因子分类粗分，Phase 1.5+ 接入 EntroPy 三维度检测后精细化）
  redundancy_status: str          # v1.20.0 新增：independent/redundant/orthogonal（E16 审计检查）
  causal_graph: str               # v1.21.0 新增：因果图 DAG 声明（E17 审计检查，MVP 填自然语言经济逻辑）
  # v1.31.0 新增字段（对标 CFA Institute Factor Mirage López de Prado + causal-quant v0.4.1）
  causal_structure: obj           # {confounders: list, colliders: list, specification_audit: str}
                                  # 因果设定结构——Factor Mirage=错误设定模型展现更高 R²+更低 p-value，计量教规主动偏好这类错误模型
                                  # confounders=故意排除的混杂变量列表（同时影响因子和收益，须控制）
                                  # colliders=已纳入但被因子和收益共同影响的变量列表（风险标志，collider 比 confounder 更危险）
                                  # specification_audit=natural_language/collider_flagged/confounder_controlled
                                  # 系数符号翻转实证：正确流动性 loading +0.08 → 错误控制变量下 −0.04（López de Prado 26 Barra 模型审计）
                                  # A 股最常见陷阱：past_return 作为 collider（被 quality 因子和未来收益共同影响）→ 虚假高 R²
                                  # §4.7 E17 审计检查扩展（v1.31.0）：collider 非空=warning highlight
                                  # MVP 阶段用自然语言填（如 momentum confounders=[market_beta,sector_rotation], colliders=[]）
  # v1.32.0 新增字段（对标 DASH 不可能性定理 arXiv:2605.21492）
  attribution_stability: obj      # {method: enum(dash/none), model_count: int, flip_rate: float, stable_ranking: bool}
                                  # 因子归因稳定性——DASH Lean 4 机器验证证明 collinearity 下 SHAP 排名结构性不稳定
                                  # faithfulness + stability + completeness 三者不可兼得，68% 公开数据集出现归因翻转
                                  # method=dash: DASH 跨 M 个独立训练模型等权平均 SHAP 值（M≥25 时翻转率<1%）
                                  # model_count: 聚合模型数量（M），MVP 阶段填 0
                                  # flip_rate: 跨模型排名翻转率（0-1，越低越稳定，>20%=warning highlight）
                                  # stable_ranking: 翻转率<5% 时为 true
                                  # §4.7 E16 审计检查扩展（v1.32.0）：correlation_group 非空因子 SHOULD 声明此字段
                                  # MVP 阶段填 {method: none}（规则型因子无 SHAP 归因），Phase 1.5+ ML 因子 SHOULD 启用 DASH
  lib_audit: obj                  # v1.22.0 新增：Latent Implementation Bias 审计（E19，仅 price-derived 因子检查）
  ex_post_filter_audit: obj       # v1.22.0 新增：ex-post 收益过滤偏差审计（E19，检查是否用 walk-forward 统计量）
  schema_plan: obj                # v1.19.0 新增：AlphaSchema 5 字段语义计划（event/context/qualities/direction/output）
  rmt_denoised: obj               # v1.23.0 新增：RMT 去噪因子相关性矩阵声明（E20 审计检查）
                                  # {applicable: bool, method: str, q_ratio: float, noise_eigenvalue_ratio: float}
                                  # MVP 因子数<20 时填 {applicable: false, reason: 'low_factor_count'}
                                  # Phase 1.5+ 因子数>20 时 MUST 启用 RMT clipping 去噪
  # v1.25.0 新增字段（对标 R&D-Agent-Quant 因子发现自动化）
  discovery_agent: str            # human/rd_agent/efs/hubble/quantevolver/other（因子发现来源）
                                  # human=人工构造（MVP 默认）
                                  # rd_agent=R&D-Agent-Quant 微软 NeurIPS 2025 因子-模型协同优化
                                  # efs=Evolutionary Factor Search LLM+进化算法 arXiv:2507.17211v2
                                  # hubble=Hubble LLM agentic AST 沙箱 arXiv:2604.09601v2
                                  # quantevolver=QUANTEVOLVER RL 微调 policy update arXiv:2605.15412（v1.27.0 新增）
  # v1.26.0 新增字段（对标 Kyle lambda 流动性因子实现陷阱）
  liquidity_metric: obj           # {metric_type, value, estimation_method, data_requirement}
                                  # metric_type: adv/turnover/amihud/kyle_lambda/ofi
                                  # kyle_lambda MUST 用 OLS slope = cov(log_ret, signed_flow)/var(signed_flow)
                                  # 而非 ratio = abs(log_ret)/volume（ratio 形式塌缩为 Amihud）
                                  # MVP 用 ADV/turnover 粗估，Phase 1.5+ 接入 Level-2 后计算精确 lambda/OFI
  # v1.27.0 新增字段（对标 Hubble AST 验证沙箱 LLM 因子生成安全标准）
  llm_safety_stack: obj           # {ast_validation, dsl_constrained, complexity_control, dual_channel_rag, family_aware_selection}
                                  # discovery_agent=rd_agent/efs/hubble/quantevolver 时 MUST 声明
                                  # ast_validation=AST 白名单节点验证（防任意代码执行）
                                  # dsl_constrained=DSL 约束生成器（算子名/arity/变量名严格匹配）
                                  # complexity_control=复杂度控制（depth/node-count 上限）
                                  # dual_channel_rag=双通道 RAG（positive 鼓励探索 + negative 控制 crowded）
                                  # family_aware_selection=family-aware 选择（crowding/similarity/family concentration 惩罚）
                                  # discovery_agent=human 时填 null

