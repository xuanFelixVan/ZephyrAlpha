name: 因子登记表
description: >-
  交易因子唯一真源（SSoT）。登记所有alpha因子（value/quality/momentum/volatility/size/liquidity/event/intraday/technical/sentiment 10类）。
  因子=alpha来源，与技术指标（OHLCV计算工具）正交。
  对标 WorldQuant Alpha Bank / qlib Alpha158。
  治本"因子无登记、回测不知道用了哪些因子"硬缺口。business_registry_construction_plan §6.1.1。
owner: MOD-GOVERNANCE
