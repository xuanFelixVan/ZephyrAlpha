- module_path: CAND-RSK-014
  domain_id: D_RISK
  name_zh: 黑天鹅模式库
  name_en: black_swan_pattern_library
  desc_zh: 极端事件模式识别+历史重放+预案匹配+黑天鹅事件分类+自动根因分析
  desc_en: ''
  plain_zh: "像2015股灾、2020疫情底这种极端行情，现有风控挡不住。这个库把历史极端事件存成模式，实盘遇到相似走势自动预警并触发熔断，保命用的。"
- module_path: CAND-SIGLEGACY-001
  domain_id: D_SIGLEGACY
  name_zh: 多策略引擎（死域）
  name_en: multi_strategy_engine_legacy
  desc_zh: 原设计的多策略编排引擎，功能已由 D_PF_CORE 承接，域已死
  desc_en: ''
  plain_zh: "本来想做个'多策略总调度'，但这活儿已经被 D_PF_CORE 的 MOD-L05-001 干了。域也死了，留档只为防止以后有人重复设计。"
- module_path: CAND-PTC-001
  domain_id: D_RISK
  name_zh: 盘前检查器（已实现组合）
  name_en: pre_trade_checker
  desc_zh: 盘前统一检查器，已被 risk_validator+risk_validation_bridge+position_limit_checker 三件组合承接
  desc_en: ''
  plain_zh: "下单前先查一遍：持仓够不够、资金够不够、有没有违规。但这功能已有三个模块组合起来做了，再单建一个等于重复造轮子。"
- module_path: CAND-WFO-001
  domain_id: D_BACKTEST
  name_zh: 滚动前进优化器
  name_en: walk_forward_optimizer
  desc_zh: Walk-Forward 滚动优化，训练窗固定测试窗前推，评估参数稳健性防过拟合
  desc_en: ''
  plain_zh: "回测调参时用一段历史调、下一段验证，像考试一样滚动检验，防止参数只在历史上好看、实盘就拉胯。等真出现过拟合再说。"
- module_path: CAND-AISA-001
  domain_id: D_INTELLIGENCE
  name_zh: AI舆情分析器
  name_en: ai_sentiment_analyzer
  desc_zh: AI 舆情分析，对新闻/公告/研报做 NLP 情绪打分，产出舆情分数与事件信号
  desc_en: ''
  plain_zh: "A股受政策和新闻影响大。这模块用AI读新闻/公告/研报打情绪分，给交易决策参考。但还在评估：是不是直接让AI运行时做就行，不用专门建模块。"
- module_path: CAND-BACL-001
  domain_id: D_INTEGRATION
  name_zh: 经纪商访问控制三层架构
  name_en: broker_acl_three_tier
  desc_zh: 将经纪商访问控制重构为三层ACL（认证/授权/审计分层）
  desc_en: ''
  plain_zh: "把券商接入的权限管理拆成认证/授权/审计三层。但现在只有2个券商适配器，平铺着够用，没到非要重构的程度。"
- module_path: CAND-PC-001
  domain_id: D_GOV_RULE
  name_zh: 策略编译器（AI替代）
  name_en: policy_compiler
  desc_zh: 将高层策略 DSL 编译为可执行检查器代码，实现规则→检查器自动翻译
  desc_en: ''
  plain_zh: "把高层规则自动翻译成可执行的检查器代码。但TRAE AI运行时直接能做这种翻译，专门造个编译器属于过度工程。"
- module_path: CAND-DR-001
  domain_id: D_INFRA_RECOVERY
  name_zh: 异地备份（用户推翻）
  name_en: offsite_backup
  desc_zh: 异地/离线备份，本地外接盘之外增加异地副本，满足 3-2-1 备份原则
  desc_en: ''
  plain_zh: "本地备份之外再加一份云上/异地副本（3-2-1原则）。用户已裁定：单用户场景本地外接盘F盘就够，不预埋异地备份。"
- module_path: CAND-EX-001
  domain_id: D_EX_CORE
  name_zh: 富途IB券商适配器
  name_en: futu_ib_broker_adapters
  desc_zh: 富途/IB券商适配器，对接富途OpenAPI/IB TWS API 实现真实券商下单
  desc_en: ''
  plain_zh: "对接富途/IB券商的真实下单API。现在MiniQMT只管A股，等真要做港股/美股/期货时再加。"
- module_path: CAND-EX-002
  domain_id: D_EX_CORE
  name_zh: 多线程订单处理
  name_en: multi_threaded_order_processing
  desc_zh: execution_engine 从单线程升级为 ThreadPoolExecutor，支持并发订单提交
  desc_en: ''
  plain_zh: "下单从单线程改多线程并发，一次能同时发多个单。现在订单量小（并发<10），单线程不卡，等批量下单真成瓶颈再改。"
- module_path: CAND-SIG-002
  domain_id: D_SIGNAL
  name_zh: ML驱动信号合成
  name_en: ml_signal_synthesizer
  desc_zh: 用机器学习模型学习因子IC权重，替代当前IC加权占位实现
  desc_en: ''
  plain_zh: "用机器学习学每个因子的权重，代替固定加权，能捕捉因子间的复杂关系。但当前因子太少（<50），ML学不出稳定权重，等因子攒够了再说。"
- module_path: CAND-FAC-001
  domain_id: D_FACTOR
  name_zh: 因子缓存
  name_en: factor_cache
  desc_zh: 缓存因子计算结果，避免重复计算，降低计算延迟
  desc_en: ''
  plain_zh: "把算过的因子结果存起来，下次直接用，省得重复算。现在因子不到10个、算得又快，没到需要缓存的份。"
- module_path: CAND-SIM-002
  domain_id: D_SIMULATION
  name_zh: 实验队列调度
  name_en: experiment_queue_scheduler
