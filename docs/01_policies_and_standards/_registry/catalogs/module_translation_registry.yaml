description: |
  每个 .py 模块的中英文名+功能简介中英文+大白话解释(plain_zh) SSoT。生成器通过 _shared/module_translation_loader.py 共享读取。
  模块级翻译属规则数据 → 真源是本 YAML 文件，禁止在生成器代码硬编码模块翻译字典。
  与 terminology_glossary.yaml（术语级）和 functional_domain_registry.yaml（域级）分工：本注册表是模块级，粒度不同。
  plain_zh 是面向非开发读者的大白话解释（做什么/解决什么），用日常语言避免技术黑话，用于 Mermaid 节点标签等需要易懂描述的场景。
