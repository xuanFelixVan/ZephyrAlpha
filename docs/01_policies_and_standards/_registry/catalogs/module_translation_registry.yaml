  name_en: min_variance_risk_parity_rebalance
  desc_zh: 在 DefaultEquityStrategy 内实现 Min-Variance 与 Risk-Parity 两种权重分配算法
  desc_en: ''
  plain_zh: "给组合分配加两种经典量化算法：最小方差（让组合波动最小）和风险平价（让各资产风险均摊）。现在枚举值定义了但方法没写，选了会偷偷退回等权。"
