  desc_en: ''
  plain_zh: "多个实验排队、按优先级并发跑。现在实验都是单跑、顺序来，没几个并发，用不着排队调度。"
- module_path: CAND-BT-001
  domain_id: D_BACKTEST
  name_zh: 回测v2.0辅助模块
  name_en: backtest_v2_auxiliary
  desc_zh: 回测v2.0辅助模块：scheduler+decay_monitor+report_generator+cache_manager
  desc_en: ''
  plain_zh: "回测的四个辅助工具：批量调度、衰减监控、自动报告、结果缓存。现在回测是手动单策略，等要批量跑、自动出报告时再开发。"
- module_path: CAND-DAT-001
  domain_id: D_DATA
  name_zh: DataFrame迁移Pydantic
  name_en: dataframe_to_pydantic_migration
  desc_zh: 将数据层输出从 pandas DataFrame 迁移到 Pydantic V2 BaseModel
  desc_en: ''
  plain_zh: "把数据层从pandas DataFrame换成Pydantic强类型模型，运行时能自动校验类型对不对。现在DataFrame够用，等下游真强制要求再迁。"
- module_path: CAND-INT-001
  domain_id: D_INTEGRATION
  name_zh: ONNX推理优化
