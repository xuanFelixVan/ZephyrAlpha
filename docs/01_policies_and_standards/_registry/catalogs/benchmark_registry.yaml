# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：同 universe——基准是参照物，无 K 线周期/市场环境/方向语义，裁 timeframe×2/regime×2/direction。保留 entry_role=reference + 共有四维度；algorithm_status 固定 not_applicable。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   基准、指数、绩效
# schema v2.1（2026-08-15，#ARCH-BREG-002 分域真源裁定）：新增 code_symbol 代码符号锚点 / code_fingerprint 实现指纹——库↔代码双向索引与漂移对账。实现域真源移交规则：代码未落地=库（设计态），代码落地锚定后=代码；业务语义域/治理评估域永属库。既有条目一律 null 占位，回填随条目重填与指纹扫描器施工（门禁A存在性校验/门禁B指纹对账立项#ARCH-BREG-002）。
# ============================================================================
module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.1'
registry_id: REG-BMK-001
name: 基准登记表
description: >-
  交易基准唯一真源（SSoT）。登记所有回测/归因对比基准（沪深300/中证500/中证全指/绝对收益）。
  回测必需输入：每次回测 MUST 指定 benchmark_id 计算超额收益/相对收益。
  与 universe_registry 关联：benchmark 通常基于某 universe 加权。
  治本"回测无法计算超额收益"硬缺口。business_registry_consolidation_plan §8.7e。
  engine_base.py 现仅 benchmark_symbol 字符串，需结构化。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.2.0
created: '2026-08-10'
last_updated: '2026-08-16'
related_arch: '#ARCH-BREG-001'
unique_key:
- benchmark_id

entry_schema:
  benchmark_id: str              # BMK-{TYPE}-{NNN}
  name: str
  name_zh: str
  aliases: list
  benchmark_type: str            # index / custom_equal / custom_cap / absolute / peer_strategy
  underlying_universe: str       # universe_id
  weight_method: str             # cap_weighted / equal_weighted / price_weighted / custom
  data_source: str               # data_asset_registry source_id
  used_by_strategies: list       # strategy_id 列表
  module_id: str
  doc_ref: str
  code_path: str
  status: str
  version: str
  created_at: date
  updated_at: date
  owner: str
  annual_return: float           # 运行时可空
  sharpe: float
  max_drawdown: float
  last_evaluated_at: date
  # v1.30.0 新增字段（对标 Custom Benchmark Construction + Active Share + Style Drift / 2026 Great Benchmark Reset）
  construction_method: str       # index_provider/holdings_based/returns_based/custom
                                 # 基准构造路线——2026 大基准重置（Russell 半年再平衡+S&P 咨询）使"被动基准"不被动
                                 # index_provider=指数公司官方（沪深300/中证500/中证全指，MVP 默认）
                                 # holdings_based=持仓复制（首选，constrained opt 匹配因子暴露+最小化 tracking error）
                                 # returns_based=回归推断暴露（持仓不可得时，快速但精度低）
                                 # custom=自定义（BMK-ABSOLUTE-001 零基准）
  active_share: float            # 组合 vs 基准持仓差异百分比（0%=完全复制 100%=完全不同）
                                 # 指示 concentration/overlap，>60% 主动管理 / <20% 接近指数增强
                                 # BMK-ABSOLUTE-001 零基准填 null
  style_drift_detection: obj     # {method: enum(rolling_regression/holdings_similarity/none), monitoring_frequency: str}
                                 # 风格漂移检测——rolling_regression=滚动因子暴露变化
                                 # holdings_similarity=持仓相似度（Jaccard/cosine）
                                 # none=MVP 默认（单策略无需漂移检测）
                                 # monitoring_frequency=daily/weekly/monthly
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）
  code_symbol: str|null         # 代码符号锚点 Code Symbol — 算法实现的函数/类级锚点（格式 <relative_path>::<symbol>，如 src/zephyr/factor/momentum.py::calc_mom_20）；null=代码未落地（设计态，实现域真源暂为库）；代码落地后实现域真源移交代码，与 code_path 共同支撑库↔代码双向查找（#ARCH-BREG-002 分域真源裁定 2026-08-15）
  code_fingerprint: str|null    # 实现指纹 Code Fingerprint — 代码侧实现（参数/签名/AST）canonical hash 快照，由扫描器写入；库侧快照与代码重算不一致=漂移告警（门禁B reconciler 对账，告警不自动双写）；null=未计算

