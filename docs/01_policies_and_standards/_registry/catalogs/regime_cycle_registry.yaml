    cycle_type: "time"
    recognition_algorithm: "rule_based"
    algorithm_variant: "规则法(30 交易日间隔+前后 3 日容忍)"
    params: {period: 30, tolerance: 3}
    inputs: ["OHLCV", "date_series"]
    outputs: {present: bool, next_window: date, confidence: float}
    subjectivity: "medium"
    timeframe: "daily"
