ttl: permanent
schema_version: '1.0'
registry_id: REG-CYCLE-001
name: Regime Cycle Registry
name_zh: 周期分析注册表
description: >-
  周期分析唯一真源（SSoT）。登记时间周期、价格周期、几何周期（Gann 江恩）、
  天文周期、统计周期（FFT/自相关/聚类）的识别算法、参数、输入输出。
  与 regime（市场状态/风险节流）和 emotion_cycle（情绪周期/择时）正交：
  本表管"时间窗口"（何时可能变盘），regime 管"市场状态"（多谨慎），
  emotion_cycle 管"sleeve 内 alpha 择时"（买卖什么）。
  对标：Gann 江恩理论现代量化重述（MarketForum 2025-12）、
  周期检测 spectral analysis / regime-switching models。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.0.0
created: '2026-08-14'
last_updated: '2026-08-14'
related_arch: '#ARCH-BREG-001'
unique_key:
- cycle_id
entry_count: 12

entry_schema:
  cycle_id: str                  # CYC-{TYPE}-{NNN}，如 CYC-TIME-001
  name: str
  name_zh: str
  aliases: list[str]
  cycle_type: str                # time/price/geometric/astro/statistical
  recognition_algorithm: str     # rule_based/fft/regression/clustering/spectral
  algorithm_variant: str         # 江恩角度法/傅里叶变换/自相关/周期聚类/周年日法
  params: obj                    # {period: 30, tolerance: 3}
  inputs: list[str]              # OHLCV/日期序列/价格序列
  outputs: obj                   # {present: bool, next_window: date, confidence: float}
  subjectivity: str              # high/medium/low
  timeframe: str                 # daily/weekly/monthly/yearly
  module_id: str
  doc_ref: str
  code_path: str
  used_by_factors: list[str]
  status: str                    # candidate/active/deprecated
  version: str
  created_at: date
  updated_at: date
  owner: str

