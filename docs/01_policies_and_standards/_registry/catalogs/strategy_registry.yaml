# [A_config] module_id=REG-STR-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：无裁剪：全量 10 字段。entry_role 默认 trigger（策略产生买卖触发信号）；direction 默认 neutral 为占位；algorithm_status 推导规则同 factor（deprecated/retired→not_applicable，code_path 非空→quantized，否则 pending_backtest）。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   k线、事件、仓位、估值、信号、出货、分时、动量、压力、反转、吸筹、周期、因子、均值回归、均线、基准、多因子、宏观、尾盘、形态、成交、成本、成长、打板、执行、持续、指数、支撑、放量、数据、早盘、止损、波动、流动性、盘口、突破、组合、绩效、缠论、缩量、缺口、股票池、背离、行业、行情、规则、订单、财报、质量、资金、趋势、量价、量化、震荡、风控、龙头
# schema v2.1（2026-08-15，#ARCH-BREG-002 分域真源裁定）：新增 code_symbol 代码符号锚点 / code_fingerprint 实现指纹——库↔代码双向索引与漂移对账。实现域真源移交规则：代码未落地=库（设计态），代码落地锚定后=代码；业务语义域/治理评估域永属库。既有条目一律 null 占位，回填随条目重填与指纹扫描器施工（门禁A存在性校验/门禁B指纹对账立项#ARCH-BREG-002）。
# direction 语义澄清（2026-08-15）：A股选股/打板策略=多头开仓，exit_logic 的卖点/止损/出货/破位为多头持仓退出信号不计入 direction；short 仅用于明示做空/融券语义（本库当前无此类条目）。applies_to=[stock] 经 benchmark_id=BMK-INDEX-001（沪深300，成分=股票）二跳推导。
# ============================================================================
# module_id: MOD-GOVERNANCE
module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.1'
registry_id: REG-STR-001
name: 策略登记表
name_zh: 策略登记表
description: >-
  交易策略唯一真源（SSoT）。登记所有alpha策略（daban/multifactor/event_driven/value_reversal/momentum_trend/sector_rotation 6类）。
  策略=入场+出场+仓位+风控的完整交易逻辑。
  风控规则（止损/仓位管理/风险控制）不在本注册表，在risk_limit_registry.yaml。
  治本"策略无登记、无法系统化管理"硬缺口。business_registry_construction_plan §6.1.2。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.3.0
created: '2026-08-10'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- strategy_id

entry_schema:
  strategy_id: str               # STR-{CLASS}-{NNN}，如 STR-DABAN-001
  name: str
  name_zh: str
  aliases: list
  strategy_class: str            # daban/multifactor/event_driven/value_reversal/momentum_trend/sector_rotation
  sleeve: str                    # 所属sleeve
  alpha_sources: list            # factor_id列表
  variant_of: str                # 可选：variant指向parent
  entry_logic: str
  exit_logic: str
  position_sizing: str           # Kelly/固定比例/风险预算
  risk_rules: list               # risk_limit_id列表
  holding_period: str            # T+1/波段/趋势
  benchmark_id: str
  universe_id: str               # A4 三件套：回测股票池引用（universe_registry.universe_id）
  cost_model_id: str             # A4 三件套：交易成本模型引用（cost_model_registry.cost_model_id）
  module_id: str
  doc_ref: str
  code_path: str
  lifecycle_status: str          # candidate/backtest/sim/paper/live/monitoring/decayed/retired
  status: str                    # active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  go_live_date: date
  retired_date: date
  owner: str
  decay_detection_method: str
  decay_threshold: float
  last_decay_scan_at: date
  mrp_baseline: float
  adaptation_level: int
  last_refit_at: date
  baseline_sharpe: float
  baseline_expectancy: float
  baseline_win_rate: float
  baseline_profit_factor: float
  baseline_max_drawdown: float
  # v1.18.0 新增字段（对标 Regime融合 + Meta-labeling）
  combination_strategy: obj       # 组合策略配置（{enabled: bool, regime_detector: str, allocation_method: str}）
                                  # regime_detector enum: 200d_sma/hmm/msm/wasserstein_hmm/news_aware/text_var_dual/statistical_jump/jump_diffusion_hmm/none
                                  # 200d_sma=200日简单均线（MVP 默认，简单可解释）
                                  # hmm=隐马尔可夫模型（plain HMM 滚动重估计有标签置换问题，受"过快回归"失败模式影响）
                                  # msm=Markov-Switching Multifractal
                                  # wasserstein_hmm=Wasserstein HMM 2-Wasserstein 模板跟踪锚定身份（v1.26.0，Phase 1.5+ 优先于 plain hmm）
                                  # news_aware=Alpha-R1 风格 LLM 推理激活/停用因子（v1.19.0）
                                  # text_var_dual=文本候选+VAR 双向验证（v1.27.0，Phase 2+，FinLLM@IJCAI 2026 arXiv:2605.30363v2）
                                  # statistical_jump=Nystrup 显式跳跃惩罚，捕获持续 regime（v1.31.0 §4.38③，data-driven 惩罚选择，实证优于 Markov-switching）
                                  # jump_diffusion_hmm=HMM + Poisson jump-duration，强制尾部驻留时间（v1.31.0 §4.38③，避免 Baum-Welch EM，合成数据+压力测试用）
                                  # none=不启用 regime 检测
  meta_labeling_config: obj       # Meta-labeling 配置（{enabled: bool, primary_model: str, meta_model: str, direction_position_separated: bool}）
  # v1.19.0 新增字段（对标 LLM 蒸馏策略）
  origin: str                     # human/llm_distilled/llm_assisted/hybrid（策略来源标记）
  distilled_to_code: bool         # 是否已从自然语言/LLM 描述蒸馏为可执行代码
  # v1.20.0 新增字段（对标策略容量检验 G9 门禁）
  capacity_aum_limit: float       # 策略可承载最大 AUM（资金量），按 5% ADV 估算
  participation_rate_limit: float # 最大参与率上限（≤0.05-0.10，占 ADV 比例）
  market_impact_model: str        # square_root/linear/none（市场冲击模型）
  baseline_trade_frequency: float # 基线交易频率（trades/month，决定 trade-count vs calendar 窗口选择，v1.5.0）
  decay_cause: str               # crowding/regime/overfitting/tech/depletion/unknown（v1.5.0，MVP 填 unknown）
  decay_scan_frequency: str      # 扫描频率 monthly/weekly/daily（v1.5.0）：active/live=monthly, monitoring=weekly, decayed=daily
  sharpe: float                  # 性能字段（运行时可空）
  max_drawdown: float
  annual_return: float
  capacity: float
  turnover: float
  last_evaluated_at: date
  code_commit: str               # 可选，git commit hash（DB 阶段 MUST，v1.4.0）
  data_quality_policy: obj       # 数据质量监控（E11 审计检查，factor/strategy MUST 声明，v1.4.0）
  null_rate: float               # 运行时：当前空值率
  drift_psi: float               # 运行时：PSI 分布漂移
  drift_ks_pvalue: float         # 运行时：KS 检验 p-value
  range_bounds: obj              # {min,max} 训练期范围
  last_quality_scan_at: date     # 上次数据质量扫描时间
  entry_series: str              # 条目系列标记（v1.34.0 K2③：panpan_course_rules=潘潘课程规则条目，与机构式策略区分；机构式填 null）
  primary_timeframe: str|null           # 主时间级别 Primary Timeframe — 条目归属的唯一时间级别（枚举 1min/5min/15min/30min/60min/120min/daily/weekly/monthly；无时间语义条目为 null）
  applicable_timeframes: list               # 可泛化时间级别 Applicable Timeframes — 条目可泛化适用的时间级别列表（多值，可空表）
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  direction: str                # 信号方向 Direction — long/short/both/neutral（无方向语义用 neutral）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）
  code_symbol: str|null         # 代码符号锚点 Code Symbol — 算法实现的函数/类级锚点（格式 <relative_path>::<symbol>，如 src/zephyr/factor/momentum.py::calc_mom_20）；null=代码未落地（设计态，实现域真源暂为库）；代码落地后实现域真源移交代码，与 code_path 共同支撑库↔代码双向查找（#ARCH-BREG-002 分域真源裁定 2026-08-15）
  code_fingerprint: str|null    # 实现指纹 Code Fingerprint — 代码侧实现（参数/签名/AST）canonical hash 快照，由扫描器写入；库侧快照与代码重算不一致=漂移告警（门禁B reconciler 对账，告警不自动双写）；null=未计算

