    entry_logic: "针对不同行业板块，对标该领域研究实力最强的券商研报团队进行重点跟踪，以获取最高质量的产业研究和个股推荐，避免泛泛阅读所有研报导致信息过载或采信低质量研究。行业-研究机构映射：宏观（科技方向）→广发/天风+安信；新能源→中信+建投；医药→兴业+东吴；消费→中信+长江；周期股→申万+中泰；券商→华泰。 ①明确所关注行业方向后，按映射锁定该领域头部研究机构；②优先采信头部机构的产业研究、个股推荐和目标价；③与 S9.24 业绩维\"券商金股推荐家数/目标价\"配合时，头部研究机构推荐权重高于其他机构；④与 F6.19 催化分级\"B 级（券商研报）\"配合时，头部机构研报采信度高于一般机构。"
