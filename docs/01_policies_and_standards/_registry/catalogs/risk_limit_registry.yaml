- risk_limit_id

entry_schema:
  risk_limit_id: str             # RLM-{TYPE}-{NNN}
  name: str
  name_zh: str
  limit_type: str                # position/concentration/drawdown/var/es/leverage/turnover/kill_switch/firm_risk
  scope: str                     # strategy/sleeve/portfolio/firm
  scope_strategy: str            # scope=strategy时关联strategy_id
  threshold_value: float
  threshold_unit: str            # %/元/σ
  inherent_risk: float           # 固有风险（控制前）
  residual_risk: float           # 剩余风险（控制后）
  consumption_tracking: str
  kri_frequency: str             # daily/weekly/monthly
  review_cycle: str              # quarterly/annually
  breach_action: str             # warn/skip/fix-in-place/halt
  module_id: str
  doc_ref: str
  code_path: str
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  current_consumption: float     # 运行时消耗
  # v1.22.0 新增字段
  stage: str                     # active/deprecated/disabled（Apidurio 四阶段状态机，disabled 阻止新策略引用即将退役的限额）
  response_strategy: str         # mitigate/transfer/avoid/accept（ISO 31000 风险响应策略，与 breach_action 执行动作正交）
  # v1.23.0 新增字段（对标 RSB 非高斯回撤校准 + RWC 共形 VaR 校准）
  drawdown_calibration_method: str  # gaussian/rsb_non_gaussian/fbm_long_memory/weighted_kolmogorov，回撤阈值校准方法
                                   # gaussian=高斯假设（MVP 默认，保守阈值兜底）
                                   # rsb_non_gaussian=Rej-Seager-Bouchaud 非高斯校准（Phase 1.5+，重尾策略 γ₄>6 MUST 启用）
                                   # fbm_long_memory=分数布朗运动长记忆校准（Phase 2+，Hurst H≠0.5 的策略）
                                   # weighted_kolmogorov=Weighted Kolmogorov Metric 重尾分布回测指标收敛性修复（v1.27.0，arXiv:2601.04490，重尾策略 γ₄>8 MUST 启用）
                                   # 仅 drawdown 类限额（RLM-DRAWDOWN-001~008）声明
  var_calibration_method: str       # historical/rwc_conformal/weighted_kolmogorov，VaR 校准方法
                                   # historical=历史模拟法（MVP 默认，固定窗口分位数）
                                   # rwc_conformal=Regime-Weighted Conformal Calibration（Phase 1.5+）
                                   # weighted_kolmogorov=Weighted Kolmogorov Metric 重尾分布回测指标收敛性修复（v1.27.0，arXiv:2601.04490，重尾策略 γ₄>8 MUST 启用）
                                   # 仅 var 类限额声明
  # v1.28.0 新增字段（对标 Leave-One-Out 风险贡献分解 arXiv:2604.10375 Alexander & Fabozzi）
  risk_contribution_decomposition: obj  # {inherent_component: float, correlation_component: float, decomposition_method: enum(loo/standard_rc/none)}
                                   # LOO 分解将标准 RC 拆为 inherent（仓位自身波动，恒正）+ correlation（与组合协方差，可对冲）
                                   # 区分"孤立高风险"（inherent 主导→降仓位）vs"高相关风险"（correlation 主导→加对冲）
                                   # 注意：与 inherent_risk/residual_risk（NIST 控制前/后语义）完全不同——
                                   #   NIST inherent=加风控前风险，LOO inherent=仓位自身波动占组合风险比例
                                   # decomposition_method: loo=Leave-One-Out 精确分解（Phase 1.5+ 持仓>20 MUST）
                                   #                       standard_rc=单一 RC 数字（MVP 默认，持仓<10 人工判断）
                                   #                       none=未分解
                                   # 仅 concentration/var 类限额声明
  # v1.30.0 新增字段（对标 Ulcer Index/Calmar/Pain Index 路径依赖疼痛度量 Martin 1989 / metricgate 2026-05）
  pain_metric: obj                 # {metric_type: enum(ulcer_index/pain_index/none), threshold: float, monitoring_window_days: int}
                                   # 路径依赖回撤度量，编码"深度×持续时间"——区别于 max_drawdown（单一深度标量）和 VaR（分布尾部）
                                   # ulcer_index=drawdown 序列二次均值 √(ΣD²/N)，0-2% 极低/2-5% 中等/5-10% 升高/>10% 深度或持续
                                   # pain_index=drawdown 序列算术均值（比 Ulcer 更平滑）
                                   # none=MVP 默认（持仓<10 人工判断 max_drawdown 足够）
                                   # threshold=疼痛告警阈值（如 ulcer_index 5%），超阈触发 breach_action
                                   # monitoring_window_days=计算窗口（如 252 交易日）
                                   # 仅 drawdown 类限额声明
  # v1.31.0 新增字段（对标证监会法释〔2026〕13号 2026-07-27 内幕交易司法解释 + 短线交易监管规定 2026-04-07）
  compliance_notices: list[obj]    # 每项 {regulation: str, effective_date: date, applicability: enum(applicable/not_applicable/conditional), impact_note: str}
                                   # 登记 A 股合规红线及适用性——§4.20 交易规则/程序化之外的司法解释维度
                                   # 法释〔2026〕13号（内幕交易司法解释 14 年来首次系统性修订）：
                                   #   敏感期前移（初步意向即认定）+ 四类人群入刑减半 + 三大脱罪理由失效
                                   #   event_driven 策略 applicability=conditional（事件窗口划定不得依赖非公开信息）
                                   # 短线交易规定（适用主体 5%+股东/董监高）：个人非大股东 applicability=not_applicable
                                   # 个人量化基于公开数据不涉内幕；compliance_notices 作合规存档非阻断门禁
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

