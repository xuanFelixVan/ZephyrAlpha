# ============================================================
# 席位分析六维框架（2026-08-14 检索证据：淘股吧/雪球/爱股票）
# ============================================================
seat_analysis_framework:
  dimension_1_seat_type: "席位定性：机构>游资>量化>散户，决定行情持续性"
  dimension_2_capital_strength: "资金力度：净买入占比>10%强势，5-10%中性，<5%诱多"
  dimension_3_position: "股价位置：低位首板最优，高位4板+回避"
  dimension_4_theme: "题材/市场热点：贴合主线，孤龙必死"
  dimension_5_structure: "买卖结构：买一买二合计40-60%最佳，独食危险"
  dimension_6_continuity: "连续性：三日榜真实，单日可对倒诱多"

# 数据源说明
# - AKShare: stock_lhb_detail_em（东财龙虎榜明细，每日收盘后更新，免费）
# - 交易所：上交所/深交所每日交易公开信息（官方源）
# - 东财 Choice：历史龙虎榜回溯（付费，回测用）
# - 数据宝：龙虎榜回测统计（证券时报，2026-06 机构净买入胜率 45.7%）
