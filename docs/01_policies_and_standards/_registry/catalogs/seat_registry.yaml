# [A_config] module_id=REG-SEAT-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：无裁剪：全量 10 字段。entry_role 默认 reference（席位=『谁在买』的实体参照）；primary_timeframe=daily、applicable_timeframes=[daily]（龙虎榜=交易所日度披露，由 update_frequency=daily 推导）；applies_to=[stock]（龙虎榜仅覆盖股票）；algorithm_status 固定 pending_backtest（history_win_rate/avg_premium 待回测回填，库描述明示）。
# ============================================================================
# module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.0'
registry_id: REG-SEAT-001
name: Seat Registry
name_zh: 龙虎榜席位注册表
description: >-
  龙虎榜席位唯一真源（SSoT）。登记沪深交易所每日交易公开信息（龙虎榜）的买卖前五席位
  身份分类、操盘风格、历史胜率、席位溢价。与 chart_pattern_registry 正交：本表管"谁在买"
  （结构化披露数据），图形形态表管"怎么买"（价格形态）。
  数据源：AKShare stock_lhb_detail_em（东财）/ iFind（已退役）/ 交易所公开数据。
  对标：EasyQuant 涨停复盘龙虎榜模块、数据宝龙虎榜回测。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.1.0
created: '2026-08-14'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- seat_id
entry_count: 15

entry_schema:
  seat_id: str                   # SEAT-{TYPE}-{NNN}，如 SEAT-YOUZI-001
  seat_name: str                 # 席位名称（如"机构专用"或具体营业部）
  seat_type: str                 # institution/youzi/quant/northbound/retail
  seat_style: str                # 操盘风格（龙头连板/首板/低吸/一日游/波段/量化T0）
  data_source: str               # AKShare stock_lhb_detail_em / eastmoney / exchange
  update_frequency: str          # daily（交易日收盘后）
  history_win_rate: float        # 历史胜率（近12个月次日上涨概率，回测回填）
  avg_premium_1d: float          # 次日平均溢价（%，回测回填）
  avg_premium_3d: float          # 3日平均溢价（%，回测回填）
  max_holding_days: int          # 典型持仓天数（1=一日游，3=短线，20+=波段）
  reliability_score: float       # 可靠性评分 0-100（综合胜率/溢价/风格一致性）
  aliases: list[str]
  status: str                    # candidate/active/deprecated
  version: str
  created_at: date
  updated_at: date
  owner: str
  primary_timeframe: str|null           # 主时间级别 Primary Timeframe — 条目归属的唯一时间级别（枚举 1min/5min/15min/30min/60min/120min/daily/weekly/monthly；无时间语义条目为 null）
  applicable_timeframes: list               # 可泛化时间级别 Applicable Timeframes — 条目可泛化适用的时间级别列表（多值，可空表）
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  direction: str                # 信号方向 Direction — long/short/both/neutral（无方向语义用 neutral）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

