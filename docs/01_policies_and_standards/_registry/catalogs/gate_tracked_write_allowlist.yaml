  # compliance_log.jsonl / kill_switch_probes.jsonl / red_blue_report.json /
  # shutdown_snapshot.json）已 git rm --cached + .gitignore 登记，写入方继续在盘
  # 追加但不再入 git 跟踪面——白名单 C 类条目数即燃尽指标，当前=0。
  # 新增"运行期写 tracked"的写入方仍 MUST 登记本表（C 类）或改走 .runtime/。
