  provider_name: str           # miniQMT/AkShare/iFind/...
  name: str
  name_zh: str
  connection_type: str         # api/sdk/file/db/internal
  frequency: str               # tick/1min/day/realtime
  sla: str
  cost: str                    # 免费/付费/按量
  compliance: str
