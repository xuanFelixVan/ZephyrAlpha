# ============================================================================
# 1. 登记表分类体系
# ============================================================================
# 按 ITIL CI 类型分类：
#   governance_rule  — 治理规则登记
#   document         — 文档/产物清单
#   module           — 模块/蓝图/组件
#   infrastructure   — 运行时基础设施
#   dependency       — 跨模块依赖关系
#   ai_asset          — AI 模型/Agent/Session
#   risk              — 风险与合规
#   operational       — 操作脚本/流程
#   knowledge         — 知识库条目
#   vocabulary        — 受控词表（辅助基础设施）
#   contract          — 验证契约（辅助基础设施）
# ============================================================================
