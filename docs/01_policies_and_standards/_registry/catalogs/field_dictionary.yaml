# [A_config] module_id=REG-FLD-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：timeframe×2/regime×2/direction——数据字段定义无周期/环境/方向语义。保留 entry_role=reference + 共有四维度；algorithm_status 固定 not_applicable。
# ============================================================================
module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.0'
registry_id: REG-FLD-001
name: Field Dictionary Registry
name_zh: 字段字典登记表
description: >-
  数据字段唯一真源（SSoT）。登记数据层字段（行情/资金流/情绪广度/技术指标/宏观/因子信号/合成信号/委托/成交/持仓/
  组合配置/风险/绩效/执行/实验/模型服务 16 域）的 type/unit/source/复权口径/PIT 性质/质量规则。
  真源反查自 cross_layer_contracts.yaml（18 个业务数据契约 SSoT）+ factor_registry inputs（111 个因子声明输入字段）。
  职责边界（裁定 8）：仅管数据层字段语义，不合并 frontmatter_field_registry.yaml（文档元数据）；FK 消费方=
  factor.inputs / technical_indicator.inputs（62号 §4.6）。对标 DAMA-DMBOK / dbt schema.yml（2026 补
  sensitivity/freshness/notes 三字段）。source_system FK → data_asset_registry（SRC-QMT-001/SRC-AKSHARE-001/SRC-INTERNAL-001 三值已回填，2026-08-13 AI-REG-FLD-001）。
  business_registry_construction §7.1。施工：AI-REG-FLD-001（2026-08-13，62号 §4.5 八步算法）。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.1.0
created: '2026-08-13'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- field_id

entry_schema:
  field_id: str                  # FLD-{DOMAIN}-{NNN}；DOMAIN ∈ {MKT,MFLOW,SENT,IND,MACRO,FCT,SIG,ORD,FILL,POS,PORT,RISK,PERF,EXEC,EXP,ML}
  field_name: str                # 字段名（snake_case，对齐契约/注册表引用名）
  name_zh: str                   # 中文名
  business_definition: str       # 业务定义
  data_type: str                 # int/float/str/datetime/bool/dict/list/obj（扩展：契约含 Dict/List 容器类型）
  unit: str                      # 元/股/份/%(小数)/倍/点/毫秒/天/交易日/笔/只/板/个/bps/美元|桶|盎司/亿元/分(0-10)/none
  allowed_values: list[str]      # 枚举合法值；非枚举=null
  source_system: str             # FK → data_asset_registry source_id（SRC-QMT-001/SRC-AKSHARE-001/SRC-INTERNAL-001，已回填闭环）
  adjust_method: str             # 前复权/后复权/不复权/none
  pit_property: str              # point_in_time/look_ahead_risk
  quality_rules: list[str]       # 质量规则（值域/一致性/格式）
  steward: str                   # 数据责任人
  sensitivity: str               # 敏感标记（dbt 2026 对标）：none/internal/pii
  freshness: str                 # 更新频率（dbt 2026 对标）：tick/15min/daily/weekly/monthly/event/realtime/on_demand
  notes: str                     # caveats/gotchas（dbt 2026 对标）
  module_id: str                 # 关联模块（契约字段=MOD-INF-016，数据层字段=MOD-MKT-DATA）
  doc_ref: str                   # 关联设计备忘节号
  code_path: str                 # 契约文件路径（注册表声明字段=null，E10 豁免 REG-FLD-001）
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

