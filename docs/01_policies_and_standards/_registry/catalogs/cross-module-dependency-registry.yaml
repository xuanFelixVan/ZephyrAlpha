# ============================================================================
# 依赖图可视化（YAML → Graphviz/Mermaid 自动生成的数据源）
# ============================================================================
dependency_graph:
  # 正向依赖：source → [targets]
  forward:
    MOD-INF-001: []              # 无依赖——最底层
    MOD-INF-002:                 # ← 依赖 MOD-INF-001
      - MOD-INF-001
    MOD-INF-003:                 # ← 依赖 MOD-INF-001 + MOD-INF-002
      - MOD-INF-001
      - MOD-INF-002
    MOD-INF-004:                 # ← 依赖 MOD-INF-001 + MOD-INF-002 + MOD-INF-003 + MOD-INF-005
      - MOD-INF-001
      - MOD-INF-002
      - MOD-INF-003
      - MOD-INF-005
    MOD-INF-005:                 # ← 依赖 MOD-INF-001 + MOD-INF-003 + MOD-INF-004
      - MOD-INF-001
      - MOD-INF-003
      - MOD-INF-004

  # 反向依赖：target ← [谁依赖它]
  reverse:
    MOD-INF-001:
      - MOD-INF-002
      - MOD-INF-003
      - MOD-INF-004
      - MOD-INF-005
    MOD-INF-002:
      - MOD-INF-003
      - MOD-INF-004
    MOD-INF-003:
      - MOD-INF-004
      - MOD-INF-005
    MOD-INF-004:
      - MOD-INF-005
    MOD-INF-005:
      - MOD-INF-004

  # 无环性校验
  acyclic: true
  note: "DAG（有向无环图）——无循环依赖，验证通过"


