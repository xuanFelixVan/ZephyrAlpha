    strength: hard
    description: "RI-01 EventBus 的容量上限需要 capacity-assurance 中定义的 SLI/SLO 阈值来设定退避策略。无容量模型时事件总线会无限堆积——硬依赖"
    contract_anchor: "cross-layer-contracts.yaml §CL-002"
    direction: upstream
    valid_since: "2026-05-01"

  # ── MOD-INF-003(task-card-kms) → MOD-INF-001(capacity-assurance) ──
