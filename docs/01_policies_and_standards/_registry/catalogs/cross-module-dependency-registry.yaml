# 对标: ITIL SACM CMDB CI → Dependency Map
#       + Google BUILD Dependency Graph（每个模块声明其 build/runtime 依赖）
#       + import-linter contract（can import / must not import 矩阵）
#
# 用途: 从 module-registry.yaml 中提取的依赖关系独立登记——
#       一张表看清"谁依赖谁、怎么依赖、为什么依赖"。
#       后续模块从 5→1500 时，依赖图自动生成的核心数据源。
#
# 与 module-registry.yaml 的关系:
#   - module-registry.yaml：模块生命周期（含 dependencies 字段摘要）
#   - 本登记表：依赖的深度展开——含方向、强度、理由、契约锚点
#   本登记表是 module-registry.yaml 的"依赖投影"（模块→依赖正反向，你中有我）
# ============================================================================

schema_version: "1.0.0"
doc_type: register
title: "跨模块依赖登记表"
version: "1.0.0"
status: active
created: "2026-05-02"
last_updated: "2026-05-02"
ai_autonomy: human_gated
ttl: permanent
total_dependencies: 5
depends_on:
  - target: PS-STD-001
    at: "§3.2.1"
    why: "doc_type 受控词表 + register 类型合法字段定义"

# ============================================================================
# 字段 Schema
# ============================================================================
_schema:
  dependency_types:
    - runtime    # 运行时依赖——source 启动必须 target 存在
    - data       # 数据依赖——source 消费 target 产出的数据
    - build      # 构建时依赖——source 构建/测试需要 target 存在
    - contract   # 契约依赖——source 实现 target 定义的接口

  dependency_strength:
    - hard    # 强依赖——target 不可用 source 崩溃
    - soft    # 弱依赖——target 不可用 source 降级
    - none    # 可选——仅文档引用

  dependency_direction:
    - upstream    # source → target（source 依赖 target）
    - downstream  # target → source（谁依赖了 source）
    - peer         # 双向/同级


# ============================================================================
# 依赖登记
# ============================================================================
# 字段说明:
#   dep_id              唯一标识，格式 DEP-{NNN}
#   source              依赖方（module_id）
#   target              被依赖方（module_id）
#   type                依赖类型（runtime/data/build/contract）
#   strength            依赖强度（hard/soft/none）
#   description         依赖的具体内容——source 用到了 target 的什么
#   contract_anchor     契约锚点（如果是 contract 类型，指向契约定义）
#   direction           方向：upstream=source→target / downstream=target→source
#   valid_since         此依赖从哪个版本开始生效
# ============================================================================

dependencies:

