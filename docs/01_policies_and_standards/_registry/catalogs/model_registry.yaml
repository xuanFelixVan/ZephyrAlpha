# ============================================================
# 治理规则
# ============================================================
# 1. 晋升门禁：candidate→staging→production 走 62 号文 §4.13 G1-G9 门
#    （IC 阈值/CPCV/容量检验/多重检验校正），experiment_ref MUST 可溯源。
# 2. 衰减监控：active 模型 MUST 配置 decay_detection_method（factor_registry 同款
#    状态机 created→benching→active→monitoring→decayed→disabled）。
# 3. PIT 纪律：training_dataset_ref MUST 为 PIT 合规数据集（data_asset_registry
#    pit_policy=strict），禁止未来函数。
# 4. 与 experiment_registry 分工：实验=运行记录（可多次），模型=产物（晋升唯一）。
#    同一 model_id 的多次训练在实验表记多行，本表只记当前晋升版本。
# 5. 防过度工程：个人项目暂不引入 content_hash/SHA256 manifest（git commit 天然
#    提供追溯，62 号文 §4 原则 9）；监管级需求出现再升级。
