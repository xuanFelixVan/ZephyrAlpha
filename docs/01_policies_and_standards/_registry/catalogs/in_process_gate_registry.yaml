module_id: CFG-IN-PROCESS-GATE-REGISTRY-001
ttl: permanent
title: In-Process Gate 注册真源（YAML 驱动自动注册）
doc_type: register
registry_id: CFG-IN-PROCESS-GATE-REGISTRY-001
name: In-Process Gate 注册真源
description: >-
  GitCommitGateway in-process gate 的注册真源（#ARCH-GATE-REGISTRY-AUTO-001 治本）。
  每条 entry 声明 gate_id + module_path + factory_function + enabled，
  gate_auto_registrar.py 从此 YAML 动态 import + register，
  替代 git_commit_gateway.py 中的 75 个显式 import + register 硬编码。

  病根：git_commit_gateway.py 是 75 个 gate 的硬编码注册中心，违反开闭原则，
  多 session 并发修改冲突频发，与 trae_072 跨 commit 原子性铁律1冲突。

  治本：YAML 列表追加比 Python 函数插入更易合并，新 gate 只需在 YAML 追加条目，
  无需修改 git_commit_gateway.py。gate 文件 + YAML 条目可在同 commit 原子提交。

  维护策略：
  - 新增 gate：在 gates 列表追加条目（gate_id + module_path + factory_function + enabled: true）
  - 禁用 gate：设置 enabled: false（不删除条目，保留历史）
  - 迁移 gate：修改 module_path/factory_function（如重构后路径变更）
  - Phase 6 会将本 YAML 合并到 gate_registry.yaml（扩展 generate_gate_registry.py）
owner: MOD-GATE-ENGINE
tier: tier_1_governance
status: active
version: 1.0.0
created: '2026-07-21'
last_updated: '2026-07-21'
unique_key: gate_id
entry_schema:
  gate_id: string (required, unique) — gate 标识，与 GateSpec.gate_id 一致
  module_path: string (required) — Python 模块路径（如 zephyr.gov_enforcement.commit_gates.held_overlap_gate）
  factory_function: string (required) — 工厂函数名（如 make_held_overlap_gate）
  source: string (required, fixed "in_process") — 来源标识
  register_line: integer (informational) — 原 git_commit_gateway.py 中的注册行号（迁移参考）
  enabled: boolean (required, default true) — 是否启用（false 则 auto_registrar 跳过）
  priority: integer (informational) — gate 优先级（从 GateSpec 读取，YAML 不覆盖）
total_gates: 99  # 2026-09-23 114→99 st-gslim-20260923 P4 七簇合并（22→7，gate_audit_report_v1 §C2 Owner E 全批）：REFERENCE-INTEGRITY/PERMANENT-SYSTEM-TRIGGER/GATE-VOCAB/DEPGRAPH-ENFORCEMENT/MAP-ALIGNMENT/BLUEPRINT-HEADER/COMPLEXITY-GUARD
