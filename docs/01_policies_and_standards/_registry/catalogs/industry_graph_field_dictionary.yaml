        type: text
        required: true
        standard: 事实宾语；relation=产品网关系时须为产业产品词——禁菜谱/生活词（外采产品网数据混入'三七全鸡汤/DIY面膜'类噪音，写入前须过滤，存量噪音清理批另做）
