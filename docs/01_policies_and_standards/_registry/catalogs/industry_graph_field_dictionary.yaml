    pk: fact_id
    fields:
      subject:
        type: text
        required: true
        standard: 事实主语（公司代码或产品名，按 relation 定类型约束——supplies_to 两端须产品名）
        good_example: 688268.SH（produces 关系=公司代码）
      relation:
        type: text
