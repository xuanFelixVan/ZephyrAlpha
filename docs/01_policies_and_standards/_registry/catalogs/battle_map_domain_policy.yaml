---
# [BLUEPRINT] MOD-GOV-BATTLE-MAP-DOMAIN-POLICY | battle_map_positioning.md §8.3 第三项 | align_battle_map.py §5 域漂移检查
# [MODULE] docs.01_policies_and_standards._registry.catalogs.battle_map_domain_policy
# [DOMAIN] D_GOV_RULE
# [TTL] permanent
# 战作地图域漂移检查规则真源
# 定义每个 flow_stage 允许挂载哪些 domain 的模块/候选
# align_battle_map.py 从此文件读取规则，校验 battle_map_anchors 的 target domain 是否在允许列表
#
# SSoT 分类（TRAE-062）：规则数据 → 真源是本 YAML 文件，禁止 DB 反向写入
# 真源流向：本 YAML（规则真源）→ align_battle_map.py（读取）→ 对齐报告（派生）
#
# 严格模式（V1.0.0，2026-08-02，Owner 拍板）：
# 组合优化（D_PF_CORE/D_PF_ALLOC）不属于 stock_selection 阶段——
# 选股是"挑哪些股票"，组合优化是"挑完之后怎么配仓位"，语义正交
# 预期发现 7 个漂移锚点：
#   - buy_flow: D_SELL_DECISION(1) + D_FRONTEND(1)
#   - stock_selection: D_PF_CORE(3) + D_PF_ALLOC(2)

policy_version: "1.1.0"
policy_status: active
last_updated: "2026-08-06"
decision_basis: "battle_map_positioning.md §3.1 L0-L6 分层架构 + §3.6 作战阶段与架构层对应关系"

# ===== 裁定原则（2026-08-04，Owner 拍板，作为未来域归属裁定的标准）=====
# 1. 核心原则：域归属看"模块承载什么决策"，不看"被谁调用"。
#    管道/协议层模块（MCP 服务器、网关、事件总线等）即使被业务环节调用一万次，
#    其域属性不变——管道就是管道，调用量不改变域归属。
# 2. 角色区分：battle_map_anchors.target_role 分两级——
#    - primary（主承载）：承载该环节的业务决策，MUST 通过域漂移检查（域须在 flow_stage 允许列表）。
#    - supplement（补充）：环节"用到"的工具/能力，不承载业务决策，豁免域漂移检查。
# 3. 判定流程：拿到锚点→看 target_role→primary 严查域（防语义错位，如卖出决策挂到买入流程）；
#    supplement 跳过域检查（防误报，如 MCP 工具被对账环节调用不应算漂移）。
# 4. 边界情况：若某 MCP server 封装了业务逻辑，应把业务逻辑拆到对应业务域模块，
#    MCP server 只留协议层（见 model_context_protocol_servers/blueprint.md 既有原则）；
#    不靠"建新业务治理域"解决，现有域体系（D_RISK/D_GOV_RULE/D_DATA_GOV 等）已能容纳 AI 自治治理。
# 5. 实现层：align_battle_map.py §BM-INV-004 按 target_role=='supplement' 跳过域漂移检查。
adjudication_principles:
  core: "域归属看模块承载什么决策，不看被谁调用"
  role_check:
    primary: "严查域（承载决策，须在 flow_stage 允许列表）"
    supplement: "豁免域漂移检查（工具被用到，不承载业务决策）"
  enforcement: "align_battle_map.py BM-INV-004 按 target_role 区分"

# flow_stage → 允许的 domain_id 列表
# domain_id 必须是 depgraph.domains.domain_id 或 candidate_module_registry.yaml 的 domain 字段值
flow_stage_allowed_domains:
  stock_selection:
    description: "选股阶段——从全市场筛选出候选股票池。对应 L1 因子 + L2 信号 + L3 策略工厂 + 筛选漏斗"
    allowed:
      - D_FACTOR              # 因子计算
      - D_ASHARE_SIGNAL       # A股特色信号
      - D_FUNDAMENTAL_SIGNAL  # 基本面信号
      - D_SIGNAL              # 通用信号（候选池专用 domain）
      - D_INTELLIGENCE        # 上下文管理/智能分析
      - D_KNOWLEDGE           # 知识图谱
      - D_INTEGRATION         # 管线路由/信号集成
      - D_MKT_DATA            # 行情数据
      - D_DATA                # 数据接入
      - D_ML_SERVE            # ML 推理
      - D_ML_TRAIN            # ML 训练
      - D_ALT_DATA            # 另类数据
      - D_CROSS_ASSET         # 跨资产
      - D_INFRA_RUNTIME       # 运行时（基础设施）
      - D_SHARED              # 共享服务
      - D_SIGQC               # 信号质量控制（因子/信号质量门禁，2026-08-03 补入）
    forbidden_rationale:
      D_PF_CORE: "组合核心属仓位管理域，选股阶段不应承载组合决策"
      D_PF_ALLOC: "组合分配属仓位管理域，选股阶段不应承载仓位分配"
      D_SELL_DECISION: "卖出决策属卖出阶段，不应出现在选股"
      D_EX_CORE: "执行核心属执行阶段"
      D_POSITION: "仓位管理属仓位阶段"

  buy_flow:
    description: "买入流程——决策买入信号、多情景对策、四轨融合、决策编排、交易纪律合规闸。对应 L3 策略决策 + MTF + DO + 买入侧合规"
    allowed:
      - D_PF_CORE             # 组合核心（买入决策涉及组合构建）
      - D_PF_ALLOC             # 组合分配（买入时分配仓位）
      - D_TRADING              # 交易运营
      - D_RISK                 # 风控（买入前风险检查）
      - D_INTEGRATION          # 管线路由
      - D_ORCHESTRATOR         # 决策编排器
      - D_INTELLIGENCE         # 上下文管理
      - D_COMPLIANCE           # 合规（A股交易纪律四项严禁合规闸，BM-BUY-08，2026-08-03 增补）
      - D_ASHARE_SIGNAL        # A股特色信号（BM-BUY-02-A-1 次日8态走势预测/体制转换检测消费 MOD-SIG-036/037，买入时机预判需读取 A股信号，2026-08-03 增补）
    forbidden_rationale:
      D_SELL_DECISION: "卖出决策不应在买入流程承载——语义正交"
      D_FRONTEND: "前端域是 UI 层，不属于作战决策流程"
      D_EX_CORE: "执行核心属执行阶段，买入是决策不是执行"
      D_POSITION: "仓位管理属仓位阶段，买入流程产出信号但仓位裁决在后续环节"

  sell_flow:
    description: "卖出流程——卖出信号触发、卖出决策、止损止盈。对应 L3 卖出决策 + DO"
    allowed:
      - D_SELL_DECISION        # 卖出决策核心
      - D_TRADING              # 交易运营
      - D_RISK                 # 风控（止损触发）
      - D_POSITION             # 仓位管理（止损触发的仓位调整）
    forbidden_rationale:
      D_PF_CORE: "组合核心属仓位/买入，不在卖出流程"
      D_FRONTEND: "前端不属于作战决策"

  position_management:
    description: "仓位管理——持仓状态机、仓位漂移监控、再平衡。对应 L3.5 仓位管理"
    allowed:
      - D_POSITION             # 仓位管理核心
      - D_PF_CORE              # 组合核心（仓位调整涉及组合）
      - D_PF_ALLOC             # 组合分配
      - D_RISK                 # 风控（仓位受风控约束）
    forbidden_rationale:
      D_SELL_DECISION: "卖出决策属卖出阶段"
      D_EX_CORE: "执行核心属执行阶段"
      D_FRONTEND: "前端不属于作战决策"

  execution:
    description: "执行——风控审批、订单生成、交易执行。对应 L4 风控 + 交易执行"
    allowed:
      - D_EX_CORE              # 执行核心
      - D_EX_SOR               # 执行路由（Smart Order Routing）
      - D_TRADING              # 交易运营
      - D_RISK                 # 风控
      - D_REPORTING            # 报告（执行产出执行报告）
    forbidden_rationale:
      D_FACTOR: "因子属选股阶段"
      D_SIGNAL: "信号属选股阶段"
      D_FRONTEND: "前端不属于作战决策"
      D_SELL_DECISION: "卖出决策属卖出阶段"

  reconciliation:
    description: "对账——清算/费率/公司行为、报告复盘、闭环优化反馈。对应 L5 闭环 + C-017 交易运营"
    allowed:
      - D_REPORTING            # 报告
      - D_BACKTEST             # 回测（策略验证）
      - D_SIMULATION           # 仿真
      - D_TRADING               # 交易运营（清算/公司行为）
      - D_FACTOR                # 因子（IC 衰减反馈）
      - D_FEEDBACK_LOOP         # 反馈循环引擎
      - D_FBL_DETECTORS         # 反馈检测器（异常/衰减检测，2026-08-03 补入）
      - D_FBL_DIAGNOSERS        # 反馈诊断器（根因诊断，2026-08-03 补入）
      - D_FBL_VERIFICATION      # 反馈验证（修复验证，2026-08-03 补入）
      - D_OPS                   # 反馈循环运营（反馈闭环运营，2026-08-03 补入）
    forbidden_rationale:
      D_EX_CORE: "执行核心属执行阶段，对账是事后"
      D_SELL_DECISION: "卖出决策属卖出阶段"
      D_FRONTEND: "前端不属于作战决策"

  # ===== 2026-08-03 全生命周期扩展：+5 新阶段（研究孵化/模型训练/回测验证/仿真验证/风控管控）=====

  research_incubation:
    description: "研究孵化——策略/因子 R&D、实验追踪、假设管理、Notebook、可复现性。盘后研究迭代入口，策略诞生地"
    allowed:
      - D_RESEARCH             # 研究基础设施核心
      - D_DATA                 # 研究数据
      - D_ML_TRAIN             # 训练（研究产出喂训练）
      - D_KNOWLEDGE            # 知识图谱（研究发现沉淀）
      - D_INTELLIGENCE         # D-RESEARCH 候选模块在候选库中注册于 D_INTELLIGENCE 域（2026-08-03 全生命周期扩展）
      - D_DATA_ENG             # 数据工程（研究数据 ETL/管线，2026-08-03 补入）
      - D_DATA_GOV             # 数据治理（研究数据质量/血缘/目录，2026-08-03 补入）
      - D_DATA_SEC             # 数据安全与契约（研究数据安全，2026-08-03 补入）
    forbidden_rationale:
      D_EX_CORE: "执行属执行阶段，研究是盘后离线"
      D_SELL_DECISION: "卖出属卖出阶段"
      D_POSITION: "仓位属仓位阶段，研究不直接管仓位"
      D_FRONTEND: "前端不属于作战决策"

  model_training:
    description: "模型训练——训练流水线、AutoML、因子发现、实验追踪晋升、漂移自适应。盘后 20:00-23:59 模型重训练核心"
    allowed:
      - D_ML_TRAIN             # 训练核心
      - D_FACTOR               # 因子（训练产出新因子）
      - D_DATA                 # 训练数据
      - D_RESEARCH             # 研究（实验追踪联动）
    forbidden_rationale:
      D_EX_CORE: "执行属执行阶段，训练是盘后离线"
      D_SELL_DECISION: "卖出属卖出阶段"
      D_POSITION: "仓位属仓位阶段"
      D_FRONTEND: "前端不属于作战决策"

  backtest_validation:
    description: "回测验证——回测引擎、撮合、PIT铁律、过拟合检测、Walk-Forward、决策门控（策略上线门禁）。C-003回测 P0"
    allowed:
      - D_BACKTEST             # 回测核心
      - D_DATA                 # 回测数据
      - D_FACTOR               # 因子（IC/IR 评估）
      - D_SIMULATION           # 仿真（回测与仿真联动）
      - D_RISK                 # 风控（实盘同构铁律：回测必须串入 D_RISK）
      - D_POSITION             # 仓位（实盘同构铁律：回测必须串入 D_POSITION）
      - D_EXEC_SIM             # 执行仿真（撮合/滑点/冲击成本仿真，2026-08-03 补入）
    forbidden_rationale:
      D_EX_CORE: "执行属执行阶段，回测是离线验证"
      D_SELL_DECISION: "卖出属卖出阶段"
      D_FRONTEND: "前端不属于作战决策"

  simulation_validation:
    description: "仿真验证——市场仿真、策略仿真、蒙特卡洛、场景生成、压力测试、依赖图数字孪生。what-if/如果怎样"
    allowed:
      - D_SIMULATION           # 仿真核心
      - D_BACKTEST             # 回测（仿真与回测联动）
      - D_RISK                 # 风控（压力测试与风控联动）
      - D_DIGITAL_TWIN         # 数字孪生（市场/策略数字孪生，2026-08-03 补入）
    forbidden_rationale:
      D_EX_CORE: "执行属执行阶段，仿真是离线"
      D_SELL_DECISION: "卖出属卖出阶段"
      D_POSITION: "仓位属仓位阶段"
      D_FRONTEND: "前端不属于作战决策"

  risk_control:
    description: "风控管控——风控策略/限额/实时监控/Kill Switch熔断/A股止损/系统性风险/盘后审计/压力测试黑天鹅。D-RISK 20模块 P0"
    allowed:
      - D_RISK                 # 风控核心
      - D_REPORTING            # 报告（盘后审计归因）
      - D_POSITION             # 仓位（仓位受风控约束）
      - D_TRADING              # 交易运营（风控联动清算）
      - D_SECURITY             # 安全（MOD-INF-018 安全基线属风控管控，2026-08-03 补入）
    forbidden_rationale:
      D_FACTOR: "因子属选股阶段，风控不直接算因子"
      D_SIGNAL: "信号属选股阶段"
      D_FRONTEND: "前端不属于作战决策"
      D_SELL_DECISION: "卖出决策属卖出阶段（止损触发走卖出，但风控策略本身不属卖出）"

# 校验规则元数据
validation:
  check_id: "BM-INV-004"
  check_name: "域漂移检查"
  severity: "warn"  # 君子协定，先 warn 不阻断
  enforcement_type: "doc"  # 启用方式：君子协定告警，不硬阻断
  ai_pre_action_check: true  # AI 挂载新锚点前应查此规则

# ===== 域分类（V1.1.0，2026-08-06 新增，治本：替代 _business_domain_whitelist 并集逻辑）=====
# BM-INV-007 业务域白名单的真源：显式声明哪些域是"业务域"（承载决策，须挂作战地图），
# 哪些域是"工具域"（基础设施/管道/支撑，铁律5不挂作战地图，天然排除 BM-INV-007 扫描）。
#
# 根因（原并集逻辑的缺陷）：
#   _business_domain_whitelist() = 所有 flow_stage allowed 域的并集。
#   但某些 flow_stage 的 allowed 含工具域（如 D_INFRA_RUNTIME/D_INTEGRATION 作 supplement 工具被用到），
#   并集后工具域被误判为业务域 → 106 个基础设施模块被误报孤儿 → 100%AI 开发下引发治理振荡
#   （AI 反复尝试给基础设施挂锚点 → 违反铁律5 → 删除 → 再误报 → 循环）。
#
# 治本：用显式分类替代并集推断。align_battle_map.py 优先读此段；此段缺失时回退并集（兼容）。
# 裁定原则（同 §adjudication_principles.core）：域归属看"承载什么决策"，不看"被谁调用"。
#   - business_domains：承载交易/研究/风控决策的域 → 必须有作战锚点（BM-INV-007 扫描）
#   - tool_domains：基础设施/管道/协议/治理/前端 → 铁律5不挂作战地图，天然排除
domain_classification:
  business_domains:
    # 承载交易决策的域——必须至少有一个 battle_map 锚点指向（BM-INV-007 扫描对象）
    - D_FACTOR              # 因子计算
    - D_ASHARE_SIGNAL       # A股特色信号
    - D_FUNDAMENTAL_SIGNAL  # 基本面信号
    - D_SIGNAL              # 通用信号
    - D_INTELLIGENCE        # 上下文管理/智能分析
    - D_KNOWLEDGE           # 知识图谱
    - D_MKT_DATA            # 行情数据
    - D_DATA                # 数据接入
    - D_ML_SERVE            # ML 推理
    - D_ML_TRAIN            # ML 训练
    - D_ALT_DATA            # 另类数据
    - D_CROSS_ASSET         # 跨资产
    - D_SIGQC               # 信号质量控制
    - D_PF_CORE             # 组合核心
    - D_PF_ALLOC            # 组合分配
    - D_TRADING             # 交易运营
    - D_RISK                # 风控
    - D_ORCHESTRATOR        # 决策编排器
    - D_COMPLIANCE          # 合规
    - D_SELL_DECISION       # 卖出决策
    - D_POSITION            # 仓位管理
    - D_EX_CORE             # 执行核心
    - D_EX_SOR              # 执行路由
    - D_REPORTING           # 报告
    - D_BACKTEST            # 回测
    - D_SIMULATION          # 仿真
    - D_RESEARCH            # 研究基础设施
    - D_DATA_ENG            # 数据工程
    - D_DATA_GOV            # 数据治理
    - D_DATA_SEC            # 数据安全与契约
    - D_FEEDBACK_LOOP       # 反馈循环引擎
    - D_FBL_DETECTORS       # 反馈检测器
    - D_FBL_DIAGNOSERS      # 反馈诊断器
    - D_FBL_VERIFICATION    # 反馈验证
    - D_OPS                 # 反馈循环运营
    - D_EXEC_SIM            # 执行仿真
    - D_DIGITAL_TWIN        # 数字孪生
    - D_REGIME              # 体制识别（2026-08-06 补入：选股决策输入，解决 MOD-REGIME-001 域漂移）

  tool_domains:
    # 基础设施/管道/支撑——铁律5不挂作战地图，BM-INV-007 天然排除
    - D_INFRA_RUNTIME       # 运行时基础设施（被业务环节调用，不承载决策）
    - D_INTEGRATION         # 管线路由/MCP协议层（管道就是管道，调用量不改变域归属）
    - D_SHARED              # 共享服务
    - D_SECURITY            # 安全基线（风控管控阶段作为 supplement 调用，不承载交易决策）
    - D_GOV_DOCS            # 治理文档
    - D_GOV_RULE            # 治理规则
    - D_GOV_SCRIPTS         # 治理脚本
    - D_GOVERNANCE          # 治理总域
    - D_FRONTEND            # 前端UI
    # 2026-08-06 审计补入：DB 实际存在但原分类遗漏的治理/基础设施域（共764个模块）
    - D_GOV_CODE_QUALITY    # 代码质量治理（177模块，静态检查/门禁规则，不承载交易决策）
    - D_GOV_AUDIT           # 治理审计（115模块，合规审计/追踪，不承载交易决策）
    - D_GOV_OPS_RESILIENCE  # 治理运维韧性（91模块，故障恢复/韧性策略，基础设施）
    - D_GOV_DRIFT           # 治理漂移检测（71模块，架构漂移监控，基础设施）
