registry_id: REG-PAT-001
name: Chart Pattern Registry
name_zh: 图形形态注册表
description: >-
  图形形态唯一真源（SSoT）。登记 8 大类图形形态（candlestick_pattern/chart_pattern/chanlun/
  elliott_wave/trendline_channel/support_resistance/fibonacci/structure）的识别算法、参数、
  输入输出、主观性分级。MVP 按 O6 裁剪：candlestick（6种已施工）+ chart_pattern（4种登记）+
  trendline_channel（1种登记）+ support_resistance（3种已施工）+ structure（1种已施工），
  chanlun/elliott_wave/fibonacci 3 类 schema 预留按需补充。
  对标 TA-Lib CDLPATTERN 61 种 K 线形态 + Edwards&Magee 经典图表形态 + 缠论 + 艾略特波浪。
  business_registry_construction_plan §6.2.4。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: draft
version: 1.0.0
created: '2026-08-13'
last_updated: '2026-08-13'
related_arch: '#ARCH-BREG-001'
unique_key:
- pattern_id
entry_count: 15

entry_schema:
  pattern_id: str                # PAT-{CLASS}-{NNN}，如 PAT-CANDLE-001
  name: str
  name_zh: str
  aliases: list[str]
  pattern_class: str             # candlestick_pattern/chart_pattern/chanlun/elliott_wave/trendline_channel/support_resistance/fibonacci/structure
  pattern_subtype: str           # 子类（反转/持续、单根/两根/三根、推动浪/调整浪）
  recognition_algorithm: str     # rule_based/template_match/fractal/regression/dl_cnn/dl_transformer/dl_yolo
  algorithm_variant: str         # 峰谷法/回归法/模板匹配法/分形法/规则法/yolov8/vit-tiny/resnet/cnn_talib_hybrid/cnn_lstm_hybrid
  dl_model_ref: str              # DL 模型引用（MVP 预留不实施）
  dl_training_dataset: str       # 训练数据集来源（MVP 预留不实施）
  params: obj                    # {lookback: 20, threshold: 0.03}
  inputs: list[str]              # OHLCV/分时数据/K线图像
  outputs: obj                   # {present: bool, start_pos: int, end_pos: int, confidence: float}
  subjectivity: str              # high/medium/low
  timeframe: str                 # intraday/daily/weekly
  module_id: str
  doc_ref: str
  code_path: str
  used_by_factors: list[str]     # 反向关联 factor_id（forward-ref，factor_registry 施工后回填）
  variant_of: str                # 可选：形态变体（单向引用）
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  # 性能（可空，运行时填充）
  hit_rate: float
  false_positive_rate: float
  last_evaluated_at: date

