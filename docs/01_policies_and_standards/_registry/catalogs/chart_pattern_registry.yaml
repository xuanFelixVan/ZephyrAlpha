description: >-
  图形形态唯一真源（SSoT）。登记 8 大类图形形态（candlestick_pattern/chart_pattern/chanlun/
  elliott_wave/trendline_channel/support_resistance/fibonacci/structure）的识别算法、参数、
  输入输出、主观性分级。v2.13.0 十四轮全网 SOTA 调研驱动扩充（2026-08-14）：
  candlestick 77 条（TA-Lib 61 函数全集+A股特色7+Nison镊子2+塔形2+Crabel NR7+
  关键反转日/WRB/Oops+酒田三空）+
  chart_pattern 62 条（Edwards&Magee/Bulkowski 经典全集（含扇贝/牛角/管道/BARR/
  三升谷三降峰/BigW BigM/复合头肩）+缺口四型+Wolfe浪/Quasimodo/VCP/Ross 123+钩/
  Lindsay三峰穹顶/O'Neil高紧旗/Brooks H2L2+A股游资情绪形态10+A股技术派老鸭头
  空中加油2+DeMark TD计数2）+
  trendline_channel 12 条（趋势线/通道/音叉(含Schiff变体)/金叉+Gann 角度1x1+九方图+
  速度阻力线+Gann摆动图）+ support_resistance 9 条（+Murrey Math/Camarilla）+
  fibonacci 17 条（工具6+谐波 XABCD 11（含5-0））+ chanlun 15 条（对齐 chan.py/
  chanlun-pro 量化实现）+ elliott_wave 8 条 + structure 54 条（Wyckoff 全套+
  SMC 智能资金概念+Matrix Profile+VSA 量价形态7+分时盘口形态9+订单流不平衡2+
  ORB/Seiden供需区/ICT PO3/冰山单/幌骗层叠+
  13 条 DL 算法套件锚点：YOLOv8/Swin-T TADA-AW/ViT-MAE/多模态LLM/Kronos/Mamba/
  扩散生成式/Chart-RVR GRPO/多尺度VLM基准/AC-Seq2Net/ElliottAgents/wave-alpha/GAF-CNN）。
  business_registry_construction_plan §6.2.4。
# ============================================================
# SOTA 算法演进说明（2026-08-14 全网调研，三轮检索结论）
# ============================================================
# 1. 规则法基线（当前 15 条 active/candidate 的实现方式）：
#    TA-Lib CDL 函数族 + 峰谷法 + 回归法。K线图基准准确率约 68%（CSDN daily_stock_analysis
#    实测：规则引擎 68.3% vs CNN 74.1% vs YOLOv8 92.6%）。
# 2. 目标检测派（识别精度 SOTA）：YOLOv8 直接在 K 线图上定位形态区域+置信度，
#    支持多形态共存/失败形态识别（右肩量能不足等）。参考 ChartScanAI（Birogul 2019 IEEE 扩展）。
# 3. Transformer 派：
#    - Swin Transformer + TADA-AW（时间感知动态聚合+自适应窗口，IJICIC 2025-08）
#    - ViT-Tiny + MAE 自监督（Stanford CS231N 2025：SSL 聚类后发现可回测形态表示）
#    - GAF-CNN（Gramian Angular Field 编码 + CNN，arXiv 2605.00875：简单 4 层 CNN 达 0.892 AUC）
# 4. 多模态 LLM 派（零样本/解释性 SOTA）：LLaMA 3.2-Vision prompt 驱动（IJMO 2025，超越
#    CNN/ResNet/ViT）；Gemini 2.5 Flash 结构化 JSON 输出月度形态+支撑阻力（MLCI 2026-07）。
#    A股语境优先 Qwen-VL 系（中文金融图表对齐）。
# 5. 无监督挖掘派（形态发现，非预定义形态）：Matrix Profile（STUMPY：motif/discord/
#    FLUSS 语义分段/snippets）；L-MAP 可学习多维矩阵轮廓（AAAI-26，GNN+三元组学习）。
# 6. 缠论量化派：chan.py（严格笔/线段特征序列法/中枢/三类买卖点/divergence_rate=0.9）、
#    chanlun-pro（MACD 面积力度比较背驰，query_macd_ld/compare_ld_beichi）。
# 施工策略：规则法先落地（可解释/低延迟/无训练成本），DL 变体经 dl_model_ref 字段预留，
#    实验对比后按 experiment_registry 登记回测证据再升级。
# 第二轮循环审查补充（2026-08-14 同日）：
# 7. K线基础模型：Kronos（AAAI 2026，BSQ tokenizer+45交易所120亿K线，RankIC +93%，
#    MIT 开源）——K线领域专用预训练表示，零样本/微调双模式 → PAT-DL-005。
# 8. 状态空间架构：Mamba/SSM（ICLR 2024 最佳论文，O(n) 线性复杂度+HiPPO 长程记忆，
#    高频微结构场景延迟敏感适用）→ PAT-DL-006。
# 9. 谐波形态族（第一轮遗漏修正）：XABCD+斐氏比例 10 种（对齐 djoffrey/HarmonicPatterns
#    2026-06 活跃维护版）→ FIB-007~016。
# 10. A股游资情绪形态族（领域特色）：涨停板 21 型量化拆解（搓揉线/天地板/地天板/
#     一阳穿多线/反包/双响炮/黄金坑/碎阳吸筹/低位箱体/首板试盘/连板/断板洗盘/
#     烂板回封/尾盘偷袭）→ CANDLE-065~068 + CHART-027~036。
# 第三轮循环审查补充（2026-08-14 同日）：
# 11. VSA 量价形态族（Wyckoff 量化分支，Tom Williams）：三输入 Spread/Volume/
#     ClosePosition 百分位引擎（rolling100 十分位 Effort-vs-Result，2026-07 开源
#     量化实现）——SC/BC/NoSupply/NoDemand/STV/Test/PseudoUT 7 条 → STRUCT-019~025。
# 12. DeMark TD 序列：纯价格行为计数（9 Setup+13 Countdown 衰竭）→ CHART-037~038。
# 13. 扩散模型生成式：图表图像→图表图像条件生成（arXiv 2509.02308）→ PAT-DL-007。
#     至此 DL 套件 7 条：YOLOv8/Swin-T/ViT-MAE/多模态LLM/Kronos/Mamba/Diffusion。
# 第四轮循环审查补充（2026-08-14 同日）：
# 14. 分时盘口形态族（打板连板梯队核心输入）：承接四形态（阶梯推升/横盘缩量/
#     双底/VWAP防守）+ 隔日涨停六条件（脉冲试盘/窄幅锯齿/卖单压盘）+ 托而不举
#     出货/举而不断洗盘 9 条 → STRUCT-026~034。
# 15. Gann 江恩几何：角度 1x1（现代量化重述=回归斜率+标准差带）→ TREND-009；
#     九方图（√price+角度偏移再平方）→ TREND-010。
# 第五轮循环审查补充（2026-08-14 同日）：
# 16. 订单流不平衡族：OFI/TFI（买卖量差>=3倍斜对角读取）→ STRUCT-035；
#     Footprint POC（足迹图控制点）→ STRUCT-036。
# 17. 判定不登：龙虎榜席位（结构化披露数据，归 data_asset_registry 或新建
#     seat_registry）、情绪周期五阶段（归 regime/sleeve 层，非图形形态）、
#     Ichimoku（归 technical_indicator）、Renko/P&F/Kagi（归数据图表类型）、
#     Gann 时间周期（归 regime 周期分析），非遗漏。
# 第六轮循环审查补充（2026-08-14 同日）：
# 18. Chart-RVR：GRPO 强化学习+可验证奖励（图表类型/表格重建/过程一致性），
#     6 benchmark SOTA（Morgan Stanley，arXiv 2510.10973）→ PAT-DL-008。
# 19. 多尺度 VLM 基准：多时间尺度 K 线评估框架（Leeds/SYSU，Qwen/Claude/Gemini
#     对比，arXiv 2604.12659）→ PAT-DL-009。至此 DL 套件 9 条。
# 20. 判定不登：跨市场相关性形态（金/油/币/股联动，属宏观 regime 层），非遗漏。
# 第七轮循环审查补充（2026-08-14 同日）：
# 21. 经典补遗 15 条（Bulkowski/Ross/Minervini/Wolfe 体系查漏）：Wolfe 浪/
#     Quasimodo/上升/下降扇贝/牛角顶底/管道顶底/BARR 顶底/VCP 波动收缩/
#     1-2-3 反转/罗斯钩 → CHART-039~051；A股技术派老鸭头/空中加油 → CHART-052~053。
# 22. K线补遗 3 条（Nison+Crabel，TA-Lib 之外）：镊子底(双针探底)/镊子顶/
#     NR7/NR4 窄幅整理日 → CANDLE-069~071；出水芙蓉并入 CANDLE-068 aliases。
# 23. AC-Seq2Net 神经符号几何派：OLS 趋势线显式几何特征+CNN-BiLSTM-Attention+
#     SHAP（EAI AIRO 2026-06，0.9947 AUC）→ PAT-DL-010。至此 DL 套件 10 条。
# 24. 判定不登：葛南维均线法则（归 technical_indicator）、Market Profile TPO 日型
#     （归盘口分布数据层）、平台突破（CHART-015 交易规则非独立形态），非遗漏。
# 第八轮循环审查补充（2026-08-14 同日）：
# 25. 日内/区域形态补遗 3 条：ORB 开盘区间突破（Crabel）→ STRUCT-037；
#     Seiden 供需区 RBR/DBD（SMC 同源不同学派）→ STRUCT-038；
#     ICT PO3 积累-操纵-派发日内三阶段 → STRUCT-039。
# 26. 数浪算法双锚点：ElliottAgents 多智能体 LLM+RAG+DRL（ICAART/PACLIC 2025，
#     arXiv 2506.16813/2507.03435）→ PAT-DL-011；wave-alpha 0.14.3 确定性规则
#     引擎+校准备选+多周期一致性（PyPI 2026-05）→ PAT-DL-012。DL 套件 12 条。
# 27. 判定不登：ICT Killzone 时段（归会话日历）、Initial Balance（归盘口分布
#     数据层）、鱼跃龙门/猎豹出击/龙头回首（民间非标准化称谓），非遗漏。
# 第九轮循环审查补充（2026-08-14 同日）：
# 28. K线补遗 3 条（TA-Lib 之外经典）：关键反转日(外包反转)/宽幅推进K线 WRB
#     (与 NR7 伸缩对)/Larry Williams Oops 跳空反向 → CANDLE-072~074。
# 29. Lindsay 三峰穹顶 28 点规则 → CHART-054（低优先级候选，主观性 high）。
#     GAF-CNN 补齐锚点（arXiv 2605.00875 已在 L4 梯队引用但未建条）→ PAT-DL-013。
#     DL 套件 13 条。另修正别名治理：锤子线误挂"上吊线"别名→改挂金针探底/单针探底；
#     上吊线补"吊颈线"。
# 30. 判定不登：Measured Move（由 FIB AB=CD+旗形覆盖）、AAAI/ICLR 2026 因子挖掘
#     系（TiMi/FinZero/WaveLSFormer 等属因子/策略层，非形态语义），非遗漏。
# 第十轮循环审查补充（2026-08-14 同日）：
# 31. Bulkowski 全集对账补遗 6 条：三升谷/三降峰/Big W/Big M/缺口四型(普通/
#     突破/逃逸/衰竭, 含测幅投射)/复合头肩 → CHART-055~060。至此 Bulkowski
#     《Encyclopedia of Chart Patterns》主体全集对账完成（Roof/Spike&Ledge 等
#     边际变体判定不登）。
# 32. 判定不登：Roof/Inverted Roof、Spike-and-Ledge（Bulkowski 边际低频变体，
#     样本稀少无稳定统计），非遗漏。
# 第十一轮循环审查补充（2026-08-14 同日）：
# 33. 工具族补遗 5 条：速度阻力线(Edson Gould 1/3-2/3 扇形) → TREND-011；
#     Murrey Math 八度线 → SR-008；Camarilla 枢轴 → SR-009；谐波 5-0(Carney,
#     Shark 衍生) → FIB-017；冰山单隐藏流动性 → STRUCT-040。
#     Schiff/Modified Schiff 音叉变体并入 TREND-008 anchor_mode（不另立条）。
# 34. 判定不登：NeoWave（Neely 专有规则未完全公开）、Earnings Flag（事件驱动
#     属因子层）、Cumulative Delta 背离（属订单流指标非形态），非遗漏。
# 第十二轮循环审查补充（2026-08-14 同日）：
# 35. 补遗 3 条：Gann 摆动图(2-day reaction rule, 与 zigzag 计数规则区分) →
#     TREND-012；O'Neil 高紧旗(旗杆 8 周>=90%+旗面 3-5 周<=25%) → CHART-061
#     (variant_of CHART-010)；幌骗/层叠挂单(封单真实性) → STRUCT-041。
#     海龟汤(Turtle Soup)并入 SR-001 aliases（同源假突破反向）。
# 36. 判定不登：Flat Base/Base-on-Base（O'Neil，由 Rectangle/VCP 覆盖）、
#     Momentum Pinball（Raschke，属指标层）、Footprint Stacked Imbalance
#     （由 STRUCT-035 OFI 参数扩展覆盖），非遗漏。
# 第十三轮循环审查补充（2026-08-14 同日）：
# 37. 补遗 2 条：酒田五法·三空（同向三连未回补缺口衰竭， 本间宗久）→
#     CANDLE-075；Al Brooks H1-H4/L1-L4 两腿回撤计数（nexusfi 2026-06 执行
#     指南量化规则）→ CHART-062。酒田其余四法（三山/三川/三兵/三法）经核查
#     已由三重顶底/启明星/红三兵黑三鸦/上升下降三法覆盖。
# 38. 判定不登：Brooks Spike&Channel（由 BARR+通道覆盖）、Failed Final Flag
#     （由旗形+高潮覆盖）、Drummond 几何（过度小众无量化标准），非遗漏。
# 第十四轮循环审查补充（2026-08-14 同日，收敛验证）：
# 39. 补遗 2 条：Nison 塔形顶/塔形底（长柱+塔身横盘群+反向长柱收塔， TA-Lib
#     之外）→ CANDLE-076~077。本轮全网 2026 最新榜单对账（financialtechwiz/
#     elearnmarkets/finformula/tradersunion 50+35+20 榜）其余条目均为已覆盖子集。
# 第十五轮循环审查（2026-08-14 同日，最终收敛判定）：
# 40. 可发现图形形态新增 = 0。检索覆盖：Abandoned Baby/Ladder Bottom/Takuri/
#     Stick Sandwich 等稀有 K 线（TA-Lib 已含）、Euphoria/Double Trouble
#     （2025 博客个人命名 Heikin-Ashi 实验， 无公认定义， 判定不登）、弱转强
#     （已挂烂板回封 aliases）。声明：候选池穷尽， 循环审查收敛关闭。
#     后续触发重开条件：新学术流派/新 A股战法出现公认量化定义时按 CAND 流程补登。
