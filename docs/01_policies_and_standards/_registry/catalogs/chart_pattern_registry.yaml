entry_schema:
  pattern_id: str                # PAT-{CLASS}-{NNN}，如 PAT-CANDLE-001
  name: str
  name_zh: str
  aliases: list[str]
  pattern_class: str             # candlestick_pattern/chart_pattern/chanlun/elliott_wave/trendline_channel/support_resistance/fibonacci/structure
  pattern_subtype: str           # 子类（反转/持续、单根/两根/三根、推动浪/调整浪）
  recognition_algorithm: str     # rule_based/template_match/fractal/regression/matrix_profile/dl_cnn/dl_transformer/dl_yolo/dl_llm
  algorithm_variant: str         # 峰谷法/回归法/模板匹配法/分形法/规则法/STUMPY motif/FLUSS/yolov8/swin_tada_aw/vit_mae/gaf_cnn/qwen_vl_zero_shot/cnn_talib_hybrid/cnn_lstm_hybrid
  dl_model_ref: str              # DL 模型引用（MVP 预留不实施）
  dl_training_dataset: str       # 训练数据集来源（MVP 预留不实施）
  params: obj                    # {lookback: 20, threshold: 0.03}
  inputs: list[str]              # OHLCV/分时数据/K线图像
  outputs: obj                   # {present: bool, start_pos: int, end_pos: int, confidence: float}
  subjectivity: str              # high/medium/low
  timeframe: str                 # intraday/daily/weekly
  module_id: str
  doc_ref: str
  code_path: str
  used_by_factors: list[str]     # 反向关联 factor_id（forward-ref，factor_registry 施工后回填）
  variant_of: str                # 可选：形态变体（单向引用）
  status: str                    # candidate/experimental/active/deprecated/retired
  version: str
  created_at: date
  updated_at: date
  owner: str
  # 性能（可空，运行时填充）
  hit_rate: float
  false_positive_rate: float
  last_evaluated_at: date
  primary_timeframe: str|null           # 主时间级别 Primary Timeframe — 条目归属的唯一时间级别（枚举 1min/5min/15min/30min/60min/120min/daily/weekly/monthly；无时间语义条目为 null）
  applicable_timeframes: list               # 可泛化时间级别 Applicable Timeframes — 条目可泛化适用的时间级别列表（多值，可空表）
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  direction: str                # 信号方向 Direction — long/short/both/neutral（无方向语义用 neutral）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

