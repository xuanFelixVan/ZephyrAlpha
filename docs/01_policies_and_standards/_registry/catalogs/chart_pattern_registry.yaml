name: Chart Pattern Registry
name_zh: 图形形态注册表
description: >-
  图形形态唯一真源（SSoT）。登记 8 大类图形形态（candlestick_pattern/chart_pattern/chanlun/
  elliott_wave/trendline_channel/support_resistance/fibonacci/structure）的识别算法、参数、
  输入输出、主观性分级。v2.2.0 三轮全网 SOTA 调研驱动扩充（2026-08-14）：
  candlestick 68 条（TA-Lib 61 函数全集+A股特色7）+ chart_pattern 38 条（Edwards&Magee/
  Bulkowski 经典全集+A股游资情绪形态10+DeMark TD计数2）+ trendline_channel 8 条 +
  support_resistance 7 条 + fibonacci 16 条（工具6+谐波 XABCD 10）+ chanlun 15 条
  （对齐 chan.py/chanlun-pro 量化实现）+ elliott_wave 8 条 + structure 32 条（Wyckoff
  全套+SMC 智能资金概念+Matrix Profile+VSA 量价形态7+7 条 DL 算法套件锚点：YOLOv8/
  Swin-T TADA-AW/ViT-MAE/多模态LLM/Kronos/Mamba/扩散生成式）。
  business_registry_construction_plan §6.2.4。
# ============================================================
# SOTA 算法演进说明（2026-08-14 全网调研，三轮检索结论）
# ============================================================
# 1. 规则法基线（当前 15 条 active/candidate 的实现方式）：
#    TA-Lib CDL 函数族 + 峰谷法 + 回归法。K线图基准准确率约 68%（CSDN daily_stock_analysis
#    实测：规则引擎 68.3% vs CNN 74.1% vs YOLOv8 92.6%）。
# 2. 目标检测派（识别精度 SOTA）：YOLOv8 直接在 K 线图上定位形态区域+置信度，
#    支持多形态共存/失败形态识别（右肩量能不足等）。参考 ChartScanAI（Birogul 2019 IEEE 扩展）。
# 3. Transformer 派：
#    - Swin Transformer + TADA-AW（时间感知动态聚合+自适应窗口，IJICIC 2025-08）
#    - ViT-Tiny + MAE 自监督（Stanford CS231N 2025：SSL 聚类后发现可回测形态表示）
#    - GAF-CNN（Gramian Angular Field 编码 + CNN，arXiv 2605.00875：简单 4 层 CNN 达 0.892 AUC）
# 4. 多模态 LLM 派（零样本/解释性 SOTA）：LLaMA 3.2-Vision prompt 驱动（IJMO 2025，超越
#    CNN/ResNet/ViT）；Gemini 2.5 Flash 结构化 JSON 输出月度形态+支撑阻力（MLCI 2026-07）。
#    A股语境优先 Qwen-VL 系（中文金融图表对齐）。
# 5. 无监督挖掘派（形态发现，非预定义形态）：Matrix Profile（STUMPY：motif/discord/
#    FLUSS 语义分段/snippets）；L-MAP 可学习多维矩阵轮廓（AAAI-26，GNN+三元组学习）。
# 6. 缠论量化派：chan.py（严格笔/线段特征序列法/中枢/三类买卖点/divergence_rate=0.9）、
#    chanlun-pro（MACD 面积力度比较背驰，query_macd_ld/compare_ld_beichi）。
# 施工策略：规则法先落地（可解释/低延迟/无训练成本），DL 变体经 dl_model_ref 字段预留，
#    实验对比后按 experiment_registry 登记回测证据再升级。
# 第二轮循环审查补充（2026-08-14 同日）：
# 7. K线基础模型：Kronos（AAAI 2026，BSQ tokenizer+45交易所120亿K线，RankIC +93%，
#    MIT 开源）——K线领域专用预训练表示，零样本/微调双模式 → PAT-DL-005。
# 8. 状态空间架构：Mamba/SSM（ICLR 2024 最佳论文，O(n) 线性复杂度+HiPPO 长程记忆，
#    高频微结构场景延迟敏感适用）→ PAT-DL-006。
# 9. 谐波形态族（第一轮遗漏修正）：XABCD+斐氏比例 10 种（对齐 djoffrey/HarmonicPatterns
#    2026-06 活跃维护版）→ FIB-007~016。
# 10. A股游资情绪形态族（领域特色）：涨停板 21 型量化拆解（搓揉线/天地板/地天板/
#     一阳穿多线/反包/双响炮/黄金坑/碎阳吸筹/低位箱体/首板试盘/连板/断板洗盘/
#     烂板回封/尾盘偷袭）→ CANDLE-065~068 + CHART-027~036。
# 第三轮循环审查补充（2026-08-14 同日）：
# 11. VSA 量价形态族（Wyckoff 量化分支，Tom Williams）：三输入 Spread/Volume/
#     ClosePosition 百分位引擎（rolling100 十分位 Effort-vs-Result，2026-07 开源
#     量化实现）——SC/BC/NoSupply/NoDemand/STV/Test/PseudoUT 7 条 → STRUCT-019~025。
# 12. DeMark TD 序列：纯价格行为计数（9 Setup+13 Countdown 衰竭）→ CHART-037~038。
# 13. 扩散模型生成式：图表图像→图表图像条件生成（arXiv 2509.02308）→ PAT-DL-007。
#     至此 DL 套件 7 条：YOLOv8/Swin-T/ViT-MAE/多模态LLM/Kronos/Mamba/Diffusion。
algorithm_variant_sota_ladder:
  - "L1 规则法（基线，全部条目默认）"
  - "L2 统计法（峰谷/回归/分形/zigzag，经典形态条目）"
  - "L3 挖掘法（matrix_profile motif/FLUSS，STRUCT-017/018）"
  - "L4 深度法（dl_yolo YOLOv8 / dl_transformer Swin-T TADA-AW / dl_cnn GAF-CNN）"
  - "L5 多模态（dl_llm Qwen-VL/Gemini 类零样本形态判读，structured JSON 输出）"
