# 派生产物清单注册表
# 真源：本文件是"真源→派生产物"映射的唯一真源
# AI 改了 depgraph.db 后 MUST 运行对应生成器更新派生产物
# GATE-DERIVED 从本文件加载派生产物清单，执行 --check 校验
#
# 创建日期：2026-06-26（OPS-2026062655 派生产物治理机制建设）
# 维护者：ZephyrAlpha-Owner

schema_version: "1.0.0"
doc_type: catalog
module_id: PS-REG-021
version: "1.0.0"
title: "派生产物清单注册表"
status: active
owner: ZephyrAlpha-Owner
source: "OPS-2026062655 派生产物治理机制建设"

# 派生产物清单
# 每个条目定义：产物路径、生成器、真源、写入命令、校验命令
derived_artifacts:
  - artifact: data/asset_index/project_entity_depgraph.yaml
    generator: scripts/governance/generate_project_depgraph_artifact.py
    source_type: depgraph_db
    source: data/databases/depgraph.db
    write_command: "python scripts/governance/generate_project_depgraph_artifact.py --write"
    check_command: "python scripts/governance/generate_project_depgraph_artifact.py --check"
    has_check_mode: true
    description: "CQRS 只读制品——depgraph.db 的 YAML 投影（6501 节点 + 7191 边）"

  - artifact: data/asset_index/target_path_tree.yaml
    generator: scripts/governance/generate_target_path_tree.py
    source_type: depgraph_db
    source: data/databases/depgraph.db
    write_command: "python scripts/governance/generate_target_path_tree.py --write"
    check_command: "python scripts/governance/generate_target_path_tree.py --check"
    has_check_mode: true
    description: "目标路径树——depgraph.db 中模块路径与迁移注册表对齐校验"

  - artifact: data/asset_index/blueprint_domain_mapping.yaml
    generator: scripts/_archive/governance/dm101_blueprint_domain_mapping.py
    source_type: blueprint_registry
    source: docs/03_modules/blueprint_registry.yaml
    write_command: null  # 生成器已归档，无活跃写入命令
    check_command: null
    has_check_mode: false
    description: "蓝图-域映射——生成器 dm101 已归档，产物由 dm106_p2b_verification.py 消费（CHK-11）。路径变更时需手动更新"
    archived_generator: true
    note: "生成器归档后成为孤儿产物。后续应评估：恢复 dm101 或让 dm106 从 depgraph.db 直接查询"

# 非派生产物（不纳入 GATE-DERIVED 校验范围）
# 这些文件虽有生成器，但输入源是文件系统扫描而非 depgraph.db
non_derived:
  - artifact: data/asset_index/unified-asset-index.yaml
    generator: scripts/governance/generate_asset_index.py
    source_type: filesystem_scan
    note: "文件系统扫描产物，无 --check 模式，不纳入 GATE-DERIVED"

  - artifact: data/asset_index/module_domain_matching.csv
    generator: scripts/governance/dm106_p2b_verification.py
    source_type: mixed
    note: "混合数据源，不纳入 GATE-DERIVED"
