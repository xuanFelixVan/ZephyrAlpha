# 状态词表中央登记表（REG-STATE-VOCAB-001）——词表 SSOT 制度 W2 收编件 / W3 执法门比对基底
# 真源方向（宪法 RULE-SSOT）：立法件=语义真源，本册=机读登记真源，market_state.py=官方常量的代码镜像。
#   语义真源 docs/_working/vocab_legislation/01_official_state_vocabulary.md（裁定 #398 五①＋#399 四 已批）
#   存量普查真源 docs/_working/vocab_legislation/02_state_vocabulary_mapping_register.md（逐套实物锚点）
#   执法件 src/zephyr/gov_enforcement/commit_gates/library/state_vocab_registry_gate.py（STATE-VOCAB-REGISTRY）
#   官方常量 src/zephyr/shared/vocab/market_state.py（SH-VOCAB-001）
# 本册不新造任何状态值：所有 values/tokens/映射逐字取自上列两件已立法文件。
# 计数铁律（宪法 §4.3）：entry_count 为派生标量，由生成器/总筹按 vocabularies 数组长度重算，禁手改散文。
schema_version: 1
registry_id: REG-STATE-VOCAB-001
name: 状态词表中央登记表
status: active
maintenance: manual
created_by_lane: W3-E（st-ailayer-final-20260924 施工车道 W3-E，补建件＝使既有声明为真，不新开制度）
ruling_basis: ['裁定#398 五①', '裁定#399 四']
scope_statement: >-
  登记面真源：凡"状态/阶段/市况/情绪/模式"封闭枚举，必须在本册有一条登记，
  否则 STATE-VOCAB-REGISTRY 门在提交面记为未登记。本册不裁业务语义、不改分段判据。
boundary_statement: >-
  与 docs/01_policies_and_standards/_registry/catalogs/strategy_registry 的 lifecycle_status 词表
  （对齐层 src/zephyr/shared/lifecycle/registry_state_vocab.py）是**跨域不同对象→不并**：
  那边=策略生命周期"FSM 词↔注册表词"拼写对齐，这边=大盘状态/情绪本体。禁顺手合并（94 波2 裁定册 §四 边界）。

# ── 官方本体（轴 M/E/S + C11 归一表；values_locked=true 的类由执法门做"值不在册→拦"）──────
official_ontology:
  module: zephyr.shared.vocab.market_state
  constant_id: SH-VOCAB-001
  physical_location: src/zephyr/shared/vocab/market_state.py
  paradigm: vnpy constant.py 同构（类做命名空间 + 字符串字面量成员 + 模块级映射表；纯常量零逻辑零 IO）
  classes:
    - name: MacroRegime
      target: zephyr.shared.vocab.market_state.MacroRegime
      axis: m.regime
      role: 官方本体（轴 M 宏观 regime，HMM 七态）
      values_locked: true
      canonical_values: [R1, R2, R3, R4, R10, R11, R12]
      tokens: [m.regime.r1, m.regime.r2, m.regime.r3, m.regime.r4, m.regime.r10, m.regime.r11, m.regime.r12]
      zh_labels: {R1: 低波震荡, R2: 中波震荡, R3: 牛市趋势, R4: 熊市阴跌, R10: 危机, R11: 复苏, R12: 突破}
      state_count_rule: 七态是裁定#304 锚定的代码绑定资产；4 态收敛走裁定#398 五② 专项，回测证据出来前不动
      data_source: c1_backtest.regime_state_anchored
      collision_notes: [C1]
    - name: EmotionCycleSix
      target: zephyr.shared.vocab.market_state.EmotionCycleSix
      axis: e.cycle
      role: 官方本体（轴 E 情绪周期六段 v1.2，Owner 已批格子语义）
      values_locked: true
      canonical_values: [CAPITULATION, ACCUMULATION, IGNITION, EXPANSION, EUPHORIA, DISTRIBUTION]
      tokens: [e.cycle.capitulation, e.cycle.accumulation, e.cycle.ignition, e.cycle.expansion, e.cycle.euphoria, e.cycle.distribution]
      zh_labels: {CAPITULATION: 投降（冰点）, ACCUMULATION: 蓄势, IGNITION: 点火, EXPANSION: 主升, EUPHORIA: 亢奋, DISTRIBUTION: 退潮（派发）}
      segmentation_ruling: 六段划分已裁（#398 五①＋#399 四）——本册与代码本体只做固化，禁重开设计、禁改分段语义
      data_source: config/trading_decision_map.yaml state_matrix.states（映射册 E4 行＝官方 token 拼写源）
      collision_notes: [C2]
    - name: IntradayFive
      target: zephyr.shared.vocab.market_state.IntradayFive
      axis: e.intraday
      role: 官方伴生轴（盘中五态，非第七段，经 INTRADAY_TO_SIX 挂六段）
      values_locked: true
      canonical_values: [LOW, DEFENSE, OSCILLATION, ATTACK, EUPHORIC]
      approved_edges: {LOW: CAPITULATION, DEFENSE: ACCUMULATION, OSCILLATION: ACCUMULATION, ATTACK: IGNITION}
      proposed_edges: {EUPHORIC: IGNITION}
      proposed_note: 立法件 §2 明示 euphoric→ignition 为 proposed（Owner 未批），未批前不得当已批边消费
      collision_notes: [最热方向相反陷阱（立法件 §3 末条）]
    - name: AnchoredTier
      target: zephyr.shared.vocab.market_state.AnchoredTier
      axis: s.anchored
      role: 官方本体（轴 S 个股锚定四档，C1 撞名消歧件）
      values_locked: true
      canonical_values: [ANCHORED_R3, ANCHORED_R2, ANCHORED_R1, ANCHORED_R4]
      tokens: [s.anchored.r3, s.anchored.r2, s.anchored.r1, s.anchored.r4]
      zh_labels: {ANCHORED_R3: 低风险, ANCHORED_R2: 中风险, ANCHORED_R1: 中高风险, ANCHORED_R4: 高风险}
      thresholds_owner: 阈值 0.30/0.60/0.80 的真源是 anchored_state_machine（业务面），本册不搬阈值（防双真源）
      collision_notes: [C1]
  extreme_alias_table:
    name: EXTREME_STATE_ALIASES
    target: zephyr.shared.vocab.market_state.EXTREME_STATE_ALIASES
    axis: m.regime
    role: C11 官方归一表——九种"最坏状态"写法统一归一到 m.regime.r10
    canonical_keys: [CRISIS, crisis, CRISIS_VOL, EMERGENCY, CRASH, S0_ICE, ICE, 冰点, 退潮]
    normalization_target: m.regime.r10
    emotion_face_note: >-
      映射册 §G 对 S0_ICE/ICE/冰点/退潮 四键同时标注情绪落点（capitulation/distribution），
      属"按语境"注记而非第二归一方向；主归一方向仍是 r10（立法件 §3-C11）。
      代码侧镜像=market_state.EXTREME_ALIAS_EMOTION_FACE，仅披露不改向。

