    版 无类型检查），红蓝对抗归一到 process_pool.py（语义最匹配：与 PooledProcess.is_alive / _reap_zombies
    同属进程存活检测；向内收原则：能 扩展不新增）。调用方 MUST from zephyr.shared.infra.process_pool import
