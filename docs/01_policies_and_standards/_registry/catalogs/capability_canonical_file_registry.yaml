# ============================================================================
# capability_canonical_file_registry.yaml
# 能力→真源文件反查注册表（capability → canonical_file reverse lookup）
# ============================================================================
# module_id: PS-REG-019
# status: active
# version: 1.1.0
# date: 2026-06-26
#
# 用途:
#   解决"AI 不知道某功能已存在、真源在哪"的信息不可达问题。
#   声明每个能力的 capability_id / aliases / description（能力索引）。
#   canonical_file / module_id / blueprint_id / domain / maturity / duplicates /
#   removed_duplicates 全部由 CapabilityLookup 运行时从磁盘头部 + git log 自动派生，
#   不在本文件维护——消除 YAML↔代码头部同步漂移成本。
#
# 真源性质（v1.1.0 治本重构）:
#   本文件是"能力索引"真源：仅声明 capability_id / aliases / description（人工维护，
#   低频）+ 可选的人工裁定字段（canonical_override / duplicates_manual /
#   removed_duplicates_manual）。
#   canonical/duplicates/removed_duplicates 是派生数据（查询时实时算，不持久化为
#   独立 report，避免第二数据源漂移）。
#
#   注：本文件不是"规则数据真源"（那条铁律仅适用于 docs/01_policies_and_standards/
#   下的规则文件，由 sync_yaml_to_depgraph.py 同步到 9 个 readonly DB 表）。
#   本文件是能力索引，不被 sync_yaml_to_depgraph.py 同步——它是 CapabilityLookup
#   的查询输入，与 depgraph（PostgreSQL，INFRA-DB-003）的 nodes 表是两个独立的数据面。
#
# alias 策略（防重建规矩）:
#   aliases 仅用于英文标识符（函数名/常量/类名，如 REPO_ROOT、load_blueprint_path、
#   RollbackExecutor）——精确短路径，find() 精确子串分支覆盖。
#   中文变体（如"仓库根路径"/"蓝图磁盘路径"）由 find() token 包含匹配
#   （CJK ≥3 字符公共子串）自然处理，禁止堆中文同义词 alias——
#   那是把能力索引当同义词字典的反模式，每出新中文表达都要回来加 alias，
#   违反真源唯一/向内收/第一性原理治本。
#
# 对标:
#   K8s Service（声明式 capability_id）+ Endpoints 控制器（实时发现 canonical）——
#   Endpoints 不持久化为独立资源，是 Service 的实时投影。本注册表同构。
#
# 派生规则（CapabilityLookup._derive_* 实现）:
#   - canonical 候选：磁盘文件 basename(无 .py) ∈ {capability_id} ∪ aliases（标准化）
#   - canonical 选择优先级：canonical_override > 单候选 > 成熟度排序
#     (production > prototype > design) > import 数 > 歧义(需 override)
#   - duplicates (auto)：磁盘上同 basename 的其他候选（relation 由 blueprint 比对派生：
#     同蓝图=conflicting，异蓝图=sibling）
#   - duplicates_manual：语义 sibling（auto 无法发现，人工声明 relation + note）
#   - removed_duplicates (auto)：git log --diff-filter=D 派生（basename 匹配 + 头部验证）
#   - removed_duplicates_manual：未被 git 跟踪的历史文件（人工声明 path + note）
#
# AI 使用方式:
#   1. from zephyr.governance.capability_lookup import CapabilityLookup
#   2. reg = CapabilityLookup()              # 自动加载本文件 + 扫磁盘 + 派生
#   3. reg.find("session handoff")            # 关键词搜索
#   4. reg.get("rollback_executor")           # 按 capability_id 精确查
#   5. reg.check_file_canonical("src/...py")   # 反查某文件是哪个能力的 canonical
#   6. reg.list_ssot_conflicts()              # 列出同蓝图多实现冲突
#
# 维护规则:
#   - 新增能力：加 capability_id + aliases + description（3 个必填字段）
#   - 派生选错 canonical：加 canonical_override（人工裁定真源路径）
#   - auto 漏掉语义 sibling：加 duplicates_manual（relation + note）
#   - 历史文件未被 git 跟踪：加 removed_duplicates_manual（path + note）
#   - 其余字段（canonical_file / module_id / maturity / duplicates / removed_in_commit）
#     全部自动派生，禁止手工维护
# ============================================================================

schema_version: "1.1.0"
module_id: PS-REG-021
doc_type: gate
title: "能力→真源文件反查注册表"
status: active
version: "1.1.1"
date: "2026-06-26"
summary: >-
  capability → canonical_file 反查注册表，解决"AI 不知道某功能真源在哪"的信息不可达问题。
  v1.1.0 治本重构：YAML 仅声明能力索引（capability_id/aliases/description）+ 可选人工
  裁定字段；canonical_file/module_id/blueprint_id/domain/maturity/duplicates/
  removed_duplicates 全部由 CapabilityLookup 从磁盘头部 + git log 自动派生，消除
  YAML↔代码头部同步漂移成本。对标 K8s Service(声明) + Endpoints(实时发现) 模式。

# 能力状态（派生）：alive = canonical 文件存在于磁盘；dead = 不存在
# 重复关系（duplicates[].relation 派生规则）：conflicting = 同蓝图；sibling = 异蓝图
#   duplicates_manual 可覆盖 relation（语义判定 auto 无法派生）

# ============================================================================
# 能力清单
# ============================================================================
capabilities:

  # --------------------------------------------------------------------------
  - capability_id: session_handoff_continuity
    aliases:
      - session_continuity
      - handoff
      - session_handoff
    description: >-
      Session 交接包自动生成与恢复。解决"打开 IDE 不知道上回做到哪了"的零记忆重启痛点。
      依据：MOD-TASK_SYSTEM v0.3.2 + AGENTS.md §5.1 零记忆重启。12 importers，SQLite
      handoffs 表。canonical 由 auto 派生：basename session_continuity 匹配 alias，
      单候选（shared_services proxy 版已删除，commit 9ae4970995，P2 闭环）。
    # auto 派生漏掉的语义 sibling（basename handoff_manager 不匹配任何 alias）：
    duplicates_manual:
      - path: src/zephyr/behavioral_audit/handoff_manager.py
        relation: sibling
        note: >-
          漂移修复 handoff（Cross-Session Handoff Manager §6.14），与交接本语义不同
          （交接本=AI session 状态持久化；漂移 handoff=修复上下文交接包）。非重复实现，
          是同族不同语义子能力。auto 派生按 basename 匹配会漏掉（handoff_manager 不在
          aliases 中），故人工声明。
    # 未被 git 跟踪的历史死副本（git log --diff-filter=D 无法派生）：
    removed_duplicates_manual:
      - path: src/zephyr/shared/session/session_continuity.py
        note: "shared/ 真源的死副本（原未被 git 跟踪），已删（commit d586cb25 清理）"

  # --------------------------------------------------------------------------
  - capability_id: rollback_executor
    aliases:
      - rollback
      - RollbackExecutor
    description: >-
      回滚执行器核心封装。canonical = src/zephyr/infrastructure/rollback/
      rollback_executor.py（auto 派生：basename rollback_executor 匹配 capability_id，
      多候选按成熟度排序——infrastructure 版 production > governance 版 prototype）。
      duplicates (auto): governance/rollback_executor.py（同蓝图 MOD-INF-021，
      relation=conflicting，头部 [MODULE] 错声明为 infrastructure 路径——需 Owner 裁定）。

  # --------------------------------------------------------------------------
  - capability_id: project_root_resolution
    canonical_override: src/zephyr/shared/io/paths.py
    aliases:
      - PROJECT_ROOT
      - REPO_ROOT
      - project_root
      - repo_root
      - repo root
      - project root
    description: >-
      仓库根目录的权威解析入口。所有需要仓库根的代码应 from zephyr.shared.io.paths import REPO_ROOT，
      禁止各自用 Path(__file__).parents[N] 推算（N 值散乱导致 bug，见 commit 1cd39ad5）。
      src/zephyr/shared/io/paths.py 是 src/ 代码的 REPO_ROOT 真源；截至本次仍有 90+ 文件各自推算，
      彻底归一见独立任务。GATE-DD07 已扩展检测 Path(__file__).parents[N] 模式（warn-only）。
    duplicates_manual:
      - path: scripts/governance/_shared/constants.py
        relation: re_export
        note: >-
          bootstrap import + re-export 自 src/zephyr/shared/io/paths.py。
          scripts/ 可 import src/（先例:git_commit.py），无需独立定义。

  # --------------------------------------------------------------------------
  - capability_id: find_repo_root
    canonical_override: src/zephyr/shared/io/paths.py
    aliases:
      - find_repo_root
      - repo_root_finder
      - find_project_root
    description: >-
      仓库根目录查找算法(向上遍历找 src/zephyr/__init__.py 标记文件)。
      单真源:src/zephyr/shared/io/paths.py。scripts/ 可 bootstrap import src/
      (先例:git_commit.py/check_ssot_gate.py),无架构约束阻碍单真源化。
      scripts/governance/_shared/constants.py re-export 本真源,不再有独立实现。
      GATE-VOCAB 不扫描此函数(非词表合法值)。
    duplicates_manual:
      - path: scripts/governance/_shared/constants.py
        relation: re_export
        note: >-
          bootstrap import + re-export 自 src/zephyr/shared/io/paths.py。

  # --------------------------------------------------------------------------
  - capability_id: vocabulary_values_loader
    canonical_override: src/zephyr/shared/io/yaml_utils.py
    aliases:
      - load_vocabulary_values
      - load_vocabulary_entries
      - load_vocabulary_deprecated_map
      - vocabulary_loader
      - vocab_loader
      - yaml_vocabulary_loader
    description: >-
      vocabulary YAML 合法值集合 + 值+定义列表 + 废弃值映射加载的唯一公共真源入口（治本1 收拢点）。
      真源实现：src/zephyr/shared/io/yaml_utils.py 提供 load_vocabulary_values()（返回 set[str]、
      只需值集合时用）、load_vocabulary_entries()（返回 list[dict] 含 value+definition、
      schema.json 双向同步填充 description 时用）和 load_vocabulary_deprecated_map() 三个函数；
      scripts/governance/_shared/yaml_utils.py 重新导出，scripts/ 侧通过
      from _shared.yaml_utils import load_vocabulary_values 使用。
      src/zephyr/ 侧直接 from zephyr.shared.io.yaml_utils import load_vocabulary_values。
      严禁任何脚本复制 _load_xxx_values() 局部函数（违反 SCRIPT-QUALITY-001 D-D-05
      + 向内收原则1：能用现成的不创造）。strict=True 默认 fail-fast，文件不存在抛
      FileNotFoundError（消除静默失败 DoS 漂移）。对标 trae_060 §2 词表唯一真源原则。

  # --------------------------------------------------------------------------
  - capability_id: vocab_hardcode_detector
    canonical_override: scripts/governance/d3_metadata/check_vocab_hardcode.py
    aliases:
      - GATE-VOCAB
      - check_vocab_hardcode
      - vocabulary_hardcode_gate
      - gate_vocab
    description: >-
      GATE-VOCAB 词表合法值硬编码阻断门禁（trae_060 §2 + 向内收原则2 自动事件触发）。
      pre-commit 阶段自动触发：src/zephyr/**/*.py 或 scripts/governance/**/*.py 变更时
      AST 扫描 VALID/ALLOWED/LEGAL/PERMITTED_*_(VALUES|STATUSES|TYPES|LAYERS|LIST|SET)
      字面量集合硬编码 + dict()/list()/tuple()/"x,y".split() 隐式字面量 + walrus 操作符
      + load_vocabulary_values("xxx.yaml") 引用文件存在性。--ci 模式硬阻断（exit 1）。
      内联豁免：# noqa: gate-vocab（带理由的诚实豁免）。canonical 在 scripts/ 下
      （非 src/zephyr/），无法 auto 派生，故用 canonical_override 显式声明。

  # --------------------------------------------------------------------------
  - capability_id: blueprint_path_query
    canonical_override: src/zephyr/governance/rule_enforcement/sys_master_compliance.py
    aliases:
      - SYS_MASTER_PATH
      - MOD_MASTER_PATH
      - DOM_GOV
      - load_blueprint_path
      - blueprint_path
      - blueprint disk path
    description: >-
      蓝图磁盘路径查询的唯一入口。从 blueprint_registry.yaml（SSoT 派生）按 module_id 查询，
      不硬编码路径。真源链：blueprint.md frontmatter → sync_registry_from_blueprints.py
      → blueprint_registry.yaml → load_blueprint_path(module_id)。
      消除连字符/下划线漂移根因。

  # --------------------------------------------------------------------------
  - capability_id: frontmatter_metadata_validation
    canonical_override: scripts/governance/d3_metadata/check_frontmatter_metadata.py
    aliases:
      - doc_type_validation
      - ttl_validation
      - GATE-15
      - frontmatter_check
      - frontmatter_metadata
      - frontmatter_ttl_check
      - frontmatter_metadata_check
    description: >-
      .md 文档 frontmatter 字段校验的唯一真源（GATE-15）。校验 ttl（必填+合法值，
      始终 hard block）+ doc_type（必填+合法值，默认 warn-only，--strict-doctype 或
      ZEPHYR_DOCTYPE_STRICT=1 升级 hard block）。合法值从 ttl_vocabulary.yaml +
      doc_type_vocabulary.yaml 动态加载（YAML 词表是唯一真源）。字段校验配置 _FIELD_RULES：
      新增词表字段校验只需加一行配置。归档脚本 validate_frontmatter_values.py 是 legacy
      副本，不复活——扩展字段校验扩展本文件。canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用 canonical_override 显式声明。

  # --------------------------------------------------------------------------
  - capability_id: llm_security_gateway
    canonical_override: src/zephyr/security/llm_defense/llm_security/gateway.py
    aliases:
      - LSG
      - LSGSecurityGateway
      - llm_security
      - security_gateway
    description: >-
      LLM 安全网关（L0-L8 十层纵深防御）。所有 LLM 调用必须经过 LSGSecurityGateway
      进行安全扫描（输入/输出/Agent 动作），禁止裸调 LLM API。对标 RULE-LSG-001。
      canonical = src/zephyr/security/llm_defense/llm_security/gateway.py（basename gateway
      不匹配任何 alias，无法 auto 派生，故用 canonical_override 显式声明）。
      412 个测试覆盖，100% 通过率。

  # --------------------------------------------------------------------------
  - capability_id: bare_llm_call_detector
    canonical_override: scripts/governance/d7_code/detect_direct_llm_calls.py
    aliases:
      - GATE-20
      - llm_security_gateway_gate
      - validate_llm_security_gateway
      - detect_direct_llm_calls
    description: >-
      GATE-20 裸调 LLM API 检测门禁（合并 COND-30 + RULE-LSG-001）。pre-commit
      阶段自动触发，AST 扫描 src/zephyr/ 下所有 Python 文件，检测未导入 LSG 的
      裸调 LLM API（openai/anthropic/langchain/litellm）+ exec/eval/compile 绕过。
      支持 --ci（硬阻断）/ --warn-only / --cond30（仅导入检测）三种模式。
      canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用
      canonical_override 显式声明。Session 20260626 合并自 validate_llm_security_gateway.py。

  # --------------------------------------------------------------------------
  - capability_id: pure_shim_detector
    canonical_override: scripts/governance/d7_code/check_pure_shim.py
    aliases:
      - GATE-NO-PURE-SHIM
      - check_pure_shim
      - pure_shim
      - is_pure_reexport_shim
      - reexport_shim_detector
    description: >-
      GATE-NO-PURE-SHIM 纯 re-export shim 文件检测门禁（治本漏洞1，2026-06-29）。
      防止新 AI 创建纯 re-export shim 文件（star import + 无实质代码），重蹈 shared_08
      冗余 proxy 层覆辙（commit 98c990141c 删除 144 文件治本）。双层防御：① pre-commit
      钩子（.pre-commit-config.yaml gate-no-pure-shim），commit src/zephyr/**/*.py 时
      自动检测；② GitCommitGateway._check_pure_shim Python 层补偿校验（subprocess 复用
      本检测器真源，--no-verify 绕不过）。检测逻辑真源：is_pure_reexport_shim() 函数
      （AST 白名单分析，覆盖绝对/相对/任意包 star import）。合法例外：__init__.py 包聚合。
      canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用 canonical_override
      显式声明。

  # --------------------------------------------------------------------------
  - capability_id: runtime_llm_call_interceptor
    canonical_override: src/zephyr/security/llm_defense/llm_security/runtime_interceptor.py
    aliases:
      - GATE-20-RUNTIME
      - runtime_gate
      - runtime_interceptor
      - LSG_RUNTIME_BACKUP
      - BareLLMCallError
    description: >-
      GATE-20 运行时后备防线（RULE-LSG-001 运行时执行层）。GATE-20 是 pre-commit
      AST 静态门禁，存在不可修复的静态分析上限：当代码内容运行时从外部（文件/网络/
      数据库）获取再 exec 时，AST 层面不可见。本能力在 Python 进程运行时拦截所有
      绕过 LSG 的裸调 LLM API（openai/anthropic/langchain/litellm）。
      机制（方案 A+B 融合）：sitecustomize.py 启动时自动 install()（零业务侵入）→
      sys.meta_path finder 拦截目标库导入→加载后 monkey-patch 核心调用方法→
      调用时检查 LSG 放行令牌（contextvar+threading.local 混合存储，TTL 30s）→
      缺失令牌抛 BareLLMCallError 硬阻断。LSG 的 scan_input/full_scan/scan_agent_action
      在返回 ALLOW 时颁发令牌（gateway.py 单点注入）。支持 kill-switch
      ZEPHYR_RUNTIME_GATE=0。canonical basename=runtime_interceptor 不匹配 alias，
      无法 auto 派生，故用 canonical_override 显式声明。

  # --------------------------------------------------------------------------
  - capability_id: validate_module_id_naming
    canonical_override: scripts/governance/validate_module_id_naming.py
    aliases:
      - module_id_naming
      - is_valid_module_id
      - is_valid_domain_id
    description: >-
      module_id/blueprint_id/domain_id 格式校验真源（裁定#208 三轨制正则唯一责任点）。
      提供 is_valid_module_id(bp_id) 和 is_valid_domain_id(domain_id) 两个公共校验函数，
      被 check_naming_convention.py（N-06 GATE-11）和 apply_depgraph.py（V1/V2 漏洞修复 +
      P1-2 --rename-domain 校验）复用，消除正则重复定义。三轨制：layer-master 轨
      MOD-{LAYER}-NNN / 派生轨 MOD-{DOMAIN}[-NNN] 或 D-{DOMAIN}-NNN / 跨域共享轨
      SH-{ABBR}-NNN。canonical 在 scripts/governance/ 下（非 src/zephyr/），无法 auto
      派生，故用 canonical_override 显式声明。

  # --------------------------------------------------------------------------
  - capability_id: n16_exemption_loader
    canonical_override: scripts/governance/d3_metadata/check_naming_convention.py
    aliases:
      - N-16_exemption_loader
      - n16_config_loader
      - n16_exemption
      - filename_uniqueness_exemption
      - naming_convention_exemption
      - GATE-11_exemption
      - N-16
      - N16
      - n16_exemption_names
      - exempt_names_loader
      - yaml_loader_n16
      - yaml_exemption_loader
      - ssot_linkage_validator
      - validate_ssot
      - validate_ssot_n16
      - fallback_consistency_check
    description: >-
      N-16 文件名项目内唯一性检测的豁免清单唯一 YAML 加载入口（治本：消除代码硬编码
      vs YAML 真源同步缺口）。真源：trae_028_doc_structure_naming.yaml v1.5.0
      §gov_doc_003_filename_uniqueness.n16_config（exempt_names_tests +
      exempt_names_docs_extra + skip_dirs_docs + skip_dir_prefixes 四个字段）。加载函数：
      _load_n16_exemptions_from_yaml() 在模块 import 时读取一次（per-process 缓存，
      commit 每次启动新进程自动重载，YAML 改即生效）。fail-open 策略：YAML 缺失/
      解析失败/类型不合规（非 list 或含非 str 元素）→ 回退到 _N16_*_FALLBACK 硬编码
      安全值（防破坏性故障）。继承关系：_N16_DOCS_EXEMPT_NAMES = tests | docs_extra
      （docs 豁免继承 tests 基线）。类型严格校验防 string 标量被迭代成 char set
      绕过检测（红蓝测试 B5-B5e 修复）。N-16 为硬阻断规则，不受 GATE-11 --warn-only
      过渡期影响。canonical_override 显式指向 d3_metadata 版（pre-commit 实际调用），
      因存在 3 个同名 check_naming_convention.py 副本，auto 派生会歧义。改豁免清单
      改 trae_028.yaml §n16_config，禁止改代码 _N16_*_FALLBACK（[MODIFY-GUARD] 保护）。
      同文件内 _validate_ssot_linkage() 提供 N-16 fallback 4元组与 YAML 一致性校验
      （--validate-ssot 触发，防 fallback 过时漂移），新AI写一致性检查前MUST反查此函数。

  # --------------------------------------------------------------------------
  - capability_id: precommit_id_uniqueness_check
    canonical_override: scripts/governance/d5_architecture/checkers/check_precommit_id_uniqueness.py
    aliases:
      - GATE-ID-UNIQ
