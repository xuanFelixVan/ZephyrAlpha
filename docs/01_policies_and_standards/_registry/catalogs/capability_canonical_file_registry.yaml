    token: "auto-create-guard-20260630"
    created_by: "session-trae-redteam-deadly-5"
    capability: "create_guard"

  - file: "src/zephyr/governance/commit_gates/capability_overlap_gate.py"
    token: "auto-capability-overlap-gate-20260630"
    created_by: "session-trae-redteam-deadly-5"
    capability: "capability_overlap_gate"

  - file: "src/zephyr/governance/commit_gates/claim_required_gate.py"
    token: "auto-claim-required-gate-20260630"
    created_by: "session-trae-redteam-deadly-5"
    capability: "claim_required_gate"

  - file: "src/zephyr/governance/commit_gates/directory_contract_gate.py"
    token: "auto-directory-contract-gate-20260630"
    created_by: "session-trae-redteam-deadly-5"
    capability: "directory_contract_checker"

  - file: "src/zephyr/governance/commit_gates/held_overlap_gate.py"
    token: "auto-held-overlap-gate-20260630"
    created_by: "session-trae-redteam-deadly-5"
    capability: "held_overlap_gate"

  # --- governance/ 核心文件（示例条目） ---
  - file: "src/zephyr/governance/git_commit_gateway.py"
    token: "auto-git-commit-gateway-20260630"
    created_by: "session-trae-redteam-deadly-5"
