- capability_id: pure_shim_detector
  canonical_override: scripts/governance/d7_code/check_pure_shim.py
  aliases:
  - GATE-NO-PURE-SHIM
  - check_pure_shim
  - pure_shim
  - is_pure_reexport_shim
  - reexport_shim_detector
