  aliases:
  - doc_type_validation
  - ttl_validation
  - GATE-15
  - frontmatter_check
  - frontmatter_metadata
  - frontmatter_ttl_check
  - frontmatter_metadata_check
  description: .md 文档 frontmatter 字段校验的唯一真源（GATE-15）。校验 ttl（必填+合法值， 始终 hard block）+
    doc_type（必填+合法值，默认 warn-only，--strict-doctype 或 ZEPHYR_DOCTYPE_STRICT=1 升级 hard
    block）。合法值从 ttl_vocabulary.yaml + doc_type_vocabulary.yaml 动态加载（YAML 词表是唯一真源）。字段校验配置
    _FIELD_RULES： 新增词表字段校验只需加一行配置。归档脚本 validate_frontmatter_values.py 是 legacy 副本，不复活——扩展字段校验扩展本文件。canonical
    在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用 canonical_override 显式声明。
