    创建纯 re-export shim 文件（star import + 无实质代码），重蹈 shared_08 冗余 proxy 层覆辙（commit 98c990141c
    删除 144 文件治本）。双层防御：① pre-commit 钩子（.pre-commit-config.yaml gate-no-pure-shim），commit
    src/zephyr/**/*.py 时 自动检测；② GitCommitGateway._check_pure_shim Python 层补偿校验（subprocess
    复用 本检测器真源，--no-verify 绕不过）。检测逻辑真源：is_pure_reexport_shim() 函数 （AST 白名单分析，覆盖绝对/相对/任意包
    star import）。合法例外：__init__.py 包聚合。 canonical 在 scripts/ 下（非 src/zephyr/），无法 auto
    派生，故用 canonical_override 显式声明。
- capability_id: runtime_llm_call_interceptor
  canonical_override: src/zephyr/security/llm_defense/llm_security/runtime_interceptor.py
  aliases:
  - GATE-20-RUNTIME
  - runtime_gate
  - runtime_interceptor
  - LSG_RUNTIME_BACKUP
  - BareLLMCallError
  description: GATE-20 运行时后备防线（RULE-LSG-001 运行时执行层）。GATE-20 是 pre-commit AST 静态门禁，存在不可修复的静态分析上限：当代码内容运行时从外部（文件/网络/
    数据库）获取再 exec 时，AST 层面不可见。本能力在 Python 进程运行时拦截所有 绕过 LSG 的裸调 LLM API（openai/anthropic/langchain/litellm）。
    机制（方案 A+B 融合）：sitecustomize.py 启动时自动 install()（零业务侵入）→ sys.meta_path finder 拦截目标库导入→加载后
    monkey-patch 核心调用方法→ 调用时检查 LSG 放行令牌（contextvar+threading.local 混合存储，TTL 30s）→
    缺失令牌抛 BareLLMCallError 硬阻断。LSG 的 scan_input/full_scan/scan_agent_action 在返回 ALLOW
    时颁发令牌（gateway.py 单点注入）。支持 kill-switch ZEPHYR_RUNTIME_GATE=0。canonical basename=runtime_interceptor
    不匹配 alias， 无法 auto 派生，故用 canonical_override 显式声明。
