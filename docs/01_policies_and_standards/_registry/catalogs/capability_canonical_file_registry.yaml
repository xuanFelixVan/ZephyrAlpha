  - capability_id: process_liveness_detection
    canonical_override: src/zephyr/shared/infra/process_pool.py
    aliases:
      - is_pid_alive
      - pid_alive_check
      - zombie_lock_detection
      - stale_pid_cleanup
      - pid_liveness
    description: >-
      PID 存活检测真源唯一（红蓝对抗归一）。检查任意 PID 是否存活（跨平台：
      Win32 用 OpenProcess(0x1000) + GetLastError 区分"进程不存在"
      (ERROR_INVALID_PARAMETER 87) vs "权限不足"(ERROR_ACCESS_DENIED 5，算存活)；
      Unix 用 os.kill(pid, 0)）。含防御性 isinstance 类型检查（None/str/float
      等非法类型直接返回 False）。用于僵尸锁/PID 文件 stale 清理——进程崩溃时
      锁/PID 文件残留，本函数在 TTL 过期前先查 PID 存活，僵尸锁立即清理
      （零窗口期，实测避免 3min+ 阻塞）。曾三处分裂（git_commit_gateway.py /
      ide_health_service.py / _concurrency.py 各自定义，实现差异：gateway 版
      最健壮含 isinstance+GetLastError，ide_health 版用 psutil，_concurrency 版
      无类型检查），红蓝对抗归一到 process_pool.py（语义最匹配：与
      PooledProcess.is_alive / _reap_zombies 同属进程存活检测；向内收原则：能
      扩展不新增）。调用方 MUST from zephyr.shared.infra.process_pool import
      is_pid_alive，禁止重复定义。scripts/ 调用方（ide_health_service.py /
      _concurrency.py）需一次性 sys.path bootstrap（REPO_ROOT 规则允许）。
      注：tests/ 下 4 处 _is_pid_alive（tasklist subprocess 实现）未归一，因测试
      隔离原则 + 不同实现策略，后续独立处理。
    integrity_anchors:
      - is_pid_alive              # PID存活检测函数(红蓝对抗归一真源,删则僵尸锁/PID文件清理全部失效)

