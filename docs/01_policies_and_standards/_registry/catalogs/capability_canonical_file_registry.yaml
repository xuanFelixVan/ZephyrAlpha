    description: >-
      文档引用完整性门禁（GATE-DOC-REF）。检测 .md/.csv/.yaml/.json 中的断链与
      幽灵引用（markdown 链接 [text](target) + 纯文本路径 + CSV 列值 + YAML 值
      + frontmatter blueprint_id + index.md 清单 + audit_report 审计对象）。
      治本背景（2026-06-29）：调研发现 AI 在 .md/.csv/.yaml 中编造虚假文件引用
      （如 dom_gov_001 虚假审计闭环：index.md 列 22 张不存在的任务卡，move_plan.csv
      引用 4 个不存在的文件，形成自审自闭环）。原 audit_broken_links.py 仅检测 .md
      的 markdown 链接语法，漏检 CSV/YAML/JSON 中的纯文本路径引用。本扩展治本：
      多文件类型 + 多引用语法 + 三重路径解析（文件相对 + 项目根相对 + basename 全局兜底）。
      五防护缺口治本：GAP-1(非.md路径引用)+GAP-2(blueprint_id存在性)+GAP-3(index.md
      清单严格本地解析,禁basename兜底)+GAP-4(audit_report审计对象)+GAP-5(跨目录闭环reconciler)。
      pre-commit 事件驱动（.md/.csv/.yaml/.json 变更时触发，非 manual）。
      --ci 硬阻断 + --check-new 历史豁免（仅阻断新引入断链，对比 HEAD 版本，参考 N-16 模式）。
      canonical 在 scripts/ 下（非 src/zephyr/），basename audit_broken_links
      不匹配任何 alias，无法 auto 派生，故用 canonical_override 显式声明。
      解决发现性：新 AI 搜 "断链/ghost ref/phantom reference/doc ref" 可定位真源。
      解决防重建：check_file_canonical() 反查阻止重建同类断链检测脚本。
      扩展提示：如需检测其他文件类型的引用，扩展本脚本（加提取器函数），勿新建 checker。
    integrity_anchors:
      - _resolve_and_check       # 路径解析+存在性检查(篡改即检测失效,三重解析逻辑真源)
      - audit_file               # 单文件审计(提取器选择逻辑真源)
      - _audit_content           # 内容审计核心(被audit_file和audit_file_check_new共用,删则逻辑分裂)
      - _extract_csv_paths       # CSV路径提取(治本GAP-1,删则CSV虚假引用漏检)
      - _extract_text_paths      # 纯文本路径提取(治本GAP-1,删则非markdown语法引用漏检)
      - _get_basename_cache      # basename全局搜索缓存(策略3兜底,删则裸文件名误报暴增)
      - _frontmatter_field       # frontmatter字段提取(GAP-2/4共用,删则语义引用漏检)
      - _get_valid_blueprint_ids # blueprint_registry.yaml缓存(GAP-2/4共用,删则存在性校验失效)
      - _check_blueprint_id_exists # GAP-2:blueprint_id存在性校验(删则frontmatter幻觉漏检)
      - _check_index_md_inventory # GAP-3:index.md清单严格本地解析(删则本目录契约幻觉漏检)
      - _check_audit_report_objects # GAP-4:audit_report审计对象校验(删则审计报告幻觉漏检)
      - _get_head_content        # HEAD版本内容获取(--check-new历史豁免,删则存量违规误判为新引入)
      - audit_file_check_new     # 历史豁免审计(对比HEAD,仅报新引入断链,删则--ci阻断存量文件)
      - SUPPORTED_EXTENSIONS     # 支持的文件扩展名集合(篡改即检测范围改变)

