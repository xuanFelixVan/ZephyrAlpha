    + GetLastError 区分"进程不存在" (ERROR_INVALID_PARAMETER 87) vs "权限不足"(ERROR_ACCESS_DENIED
    5，算存活)； Unix 用 os.kill(pid, 0)）。含防御性 isinstance 类型检查（None/str/float 等非法类型直接返回
