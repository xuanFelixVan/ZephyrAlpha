    SH-{ABBR}-NNN。R2 治本修订：D-XXX-NNN 已废弃 为 module_id 派生轨，重定义为 submodule_id 专用（蓝图内部子模块编号，见
    trae_028 gov_doc_009）。canonical 在 scripts/governance/d3_metadata/ 下（非 src/zephyr/），
    无法 auto 派生，故用 canonical_override 显式声明。
- capability_id: n16_exemption_loader
  canonical_override: scripts/governance/d3_metadata/check_naming_convention.py
  aliases:
  - N-16_exemption_loader
  - n16_config_loader
  - n16_exemption
  - filename_uniqueness_exemption
  - naming_convention_exemption
  - GATE-11_exemption
  - N-16
  - N16
