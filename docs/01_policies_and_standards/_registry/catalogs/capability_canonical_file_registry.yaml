# ============================================================================
# capability_canonical_file_registry.yaml
# 能力→真源文件反查注册表（capability → canonical_file reverse lookup）
# ============================================================================
# module_id: PS-REG-019
# doc_type: contract
# status: active
# version: 1.1.0
# date: 2026-06-26
#
# 用途:
#   解决"AI 不知道某功能已存在、真源在哪"的信息不可达问题。
#   声明每个能力的 capability_id / aliases / description（能力索引）。
#   canonical_file / module_id / blueprint_id / domain / maturity / duplicates /
#   removed_duplicates 全部由 CapabilityLookup 运行时从磁盘头部 + git log 自动派生，
#   不在本文件维护——消除 YAML↔代码头部同步漂移成本。
#
# 真源性质（v1.1.0 治本重构）:
#   本文件是"能力索引"真源：仅声明 capability_id / aliases / description（人工维护，
#   低频）+ 可选的人工裁定字段（canonical_override / duplicates_manual /
#   removed_duplicates_manual）。
#   canonical/duplicates/removed_duplicates 是派生数据（查询时实时算，不持久化为
#   独立 report，避免第二数据源漂移）。
#
#   注：本文件不是"规则数据真源"（那条铁律仅适用于 docs/01_policies_and_standards/
#   下的规则文件，由 sync_yaml_to_depgraph.py 同步到 9 个 readonly DB 表）。
#   本文件是能力索引，不被 sync_yaml_to_depgraph.py 同步——它是 CapabilityLookup
#   的查询输入，与 depgraph.db 的 nodes 表是两个独立的数据面。
#
# 对标:
#   K8s Service（声明式 capability_id）+ Endpoints 控制器（实时发现 canonical）——
#   Endpoints 不持久化为独立资源，是 Service 的实时投影。本注册表同构。
#
# 派生规则（CapabilityLookup._derive_* 实现）:
#   - canonical 候选：磁盘文件 basename(无 .py) ∈ {capability_id} ∪ aliases（标准化）
#   - canonical 选择优先级：canonical_override > 单候选 > 成熟度排序
#     (production > prototype > design) > import 数 > 歧义(需 override)
#   - duplicates (auto)：磁盘上同 basename 的其他候选（relation 由 blueprint 比对派生：
#     同蓝图=conflicting，异蓝图=sibling）
#   - duplicates_manual：语义 sibling（auto 无法发现，人工声明 relation + note）
#   - removed_duplicates (auto)：git log --diff-filter=D 派生（basename 匹配 + 头部验证）
#   - removed_duplicates_manual：未被 git 跟踪的历史文件（人工声明 path + note）
#
# AI 使用方式:
#   1. from zephyr.governance.capability_lookup import CapabilityLookup
#   2. reg = CapabilityLookup()              # 自动加载本文件 + 扫磁盘 + 派生
#   3. reg.find("session handoff")            # 关键词搜索
#   4. reg.get("rollback_executor")           # 按 capability_id 精确查
#   5. reg.check_file_canonical("src/...py")   # 反查某文件是哪个能力的 canonical
#   6. reg.list_ssot_conflicts()              # 列出同蓝图多实现冲突
#
# 维护规则:
#   - 新增能力：加 capability_id + aliases + description（3 个必填字段）
#   - 派生选错 canonical：加 canonical_override（人工裁定真源路径）
#   - auto 漏掉语义 sibling：加 duplicates_manual（relation + note）
#   - 历史文件未被 git 跟踪：加 removed_duplicates_manual（path + note）
#   - 其余字段（canonical_file / module_id / maturity / duplicates / removed_in_commit）
#     全部自动派生，禁止手工维护
# ============================================================================

schema_version: "1.1.0"
module_id: PS-REG-019
doc_type: contract
title: "能力→真源文件反查注册表"
status: active
version: "1.1.0"
date: "2026-06-26"
summary: >-
  capability → canonical_file 反查注册表，解决"AI 不知道某功能真源在哪"的信息不可达问题。
  v1.1.0 治本重构：YAML 仅声明能力索引（capability_id/aliases/description）+ 可选人工
  裁定字段；canonical_file/module_id/blueprint_id/domain/maturity/duplicates/
  removed_duplicates 全部由 CapabilityLookup 从磁盘头部 + git log 自动派生，消除
  YAML↔代码头部同步漂移成本。对标 K8s Service(声明) + Endpoints(实时发现) 模式。

# 能力状态（派生）：alive = canonical 文件存在于磁盘；dead = 不存在
# 重复关系（duplicates[].relation 派生规则）：conflicting = 同蓝图；sibling = 异蓝图
#   duplicates_manual 可覆盖 relation（语义判定 auto 无法派生）

# ============================================================================
# 能力清单
# ============================================================================
capabilities:

  # --------------------------------------------------------------------------
  - capability_id: session_handoff_continuity
    aliases:
      - session_continuity
      - handoff
      - 交接本
      - session_handoff
    description: >-
      Session 交接包自动生成与恢复。解决"打开 IDE 不知道上回做到哪了"的零记忆重启痛点。
      依据：MOD-TASK_SYSTEM v0.3.2 + AGENTS.md §5.1 零记忆重启。12 importers，SQLite
      handoffs 表。canonical 由 auto 派生：basename session_continuity 匹配 alias，
      多候选按成熟度排序（shared_services 版 production 胜）。
    # auto 派生漏掉的语义 sibling（basename handoff_manager 不匹配任何 alias）：
    duplicates_manual:
      - path: src/zephyr/behavioral_audit/handoff_manager.py
        relation: sibling
        note: >-
          漂移修复 handoff（Cross-Session Handoff Manager §6.14），与交接本语义不同
          （交接本=AI session 状态持久化；漂移 handoff=修复上下文交接包）。非重复实现，
          是同族不同语义子能力。auto 派生按 basename 匹配会漏掉（handoff_manager 不在
          aliases 中），故人工声明。
    # 未被 git 跟踪的历史死副本（git log --diff-filter=D 无法派生）：
    removed_duplicates_manual:
      - path: src/zephyr/shared/session/session_continuity.py
        note: "shared/ 真源的死副本（原未被 git 跟踪），已删（commit d586cb25 清理）"

  # --------------------------------------------------------------------------
  - capability_id: rollback_executor
    aliases:
      - rollback
      - RollbackExecutor
      - 回滚执行器
    description: >-
      回滚执行器核心封装。canonical = src/zephyr/infrastructure/rollback/
      rollback_executor.py（auto 派生：basename rollback_executor 匹配 capability_id，
      多候选按成熟度排序——infrastructure 版 production > governance 版 prototype）。
      duplicates (auto): governance/rollback_executor.py（同蓝图 MOD-INF-021，
      relation=conflicting，头部 [MODULE] 错声明为 infrastructure 路径——需 Owner 裁定）。

  # --------------------------------------------------------------------------
  - capability_id: project_root_resolution
    canonical_override: src/zephyr/shared/io/paths.py
    aliases:
      - PROJECT_ROOT
      - REPO_ROOT
      - 仓库根
      - 仓库根路径
      - 仓库根目录
      - project_root
      - repo_root
      - repo root
      - project root
    description: >-
      仓库根目录的权威解析入口。所有需要仓库根的代码应 from zephyr.shared.io.paths import REPO_ROOT，
      禁止各自用 Path(__file__).parents[N] 推算（N 值散乱导致 bug，见 commit 1cd39ad5）。
      src/zephyr/shared/io/paths.py 是 src/ 代码的 REPO_ROOT 真源；截至本次仍有 90+ 文件各自推算，
      彻底归一见独立任务。GATE-DD07 已扩展检测 Path(__file__).parents[N] 模式（warn-only）。
    duplicates_manual:
      - path: src/zephyr/integration/shared_08/io/paths.py
        relation: sibling
        note: >-
          shared_08 re-export wrapper（zephyr.integration.shared_08.io.paths），与 shared/io/paths.py
          同属 MOD-INF-016。canonical 裁定为 src/zephyr/shared/io/paths.py（shared/ 是 src/ 代码真源）。
      - path: scripts/governance/_shared/constants.py
        relation: sibling
        note: >-
          scripts/ 下治理脚本的 REPO_ROOT 真源（find_repo_root()）。scripts/ 不能导入 src/zephyr/ 包，
          故独立定义。src/ 代码用 zephyr.shared.io.paths，scripts/ 用 _shared.constants，两者平级。

  # --------------------------------------------------------------------------
  - capability_id: vocabulary_values_loader
    canonical_override: scripts/governance/_shared/yaml_utils.py
    aliases:
      - load_vocabulary_values
      - vocabulary_loader
      - 词表加载器
      - vocab_loader
      - yaml_vocabulary_loader
    description: >-
      vocabulary YAML 合法值集合加载的唯一公共入口。所有 scripts/ 下需要加载词表合法值
      （如 VALID_STATUSES / VALID_LAYERS / VALID_TTL_VALUES 等）的代码应
      from _shared.yaml_utils import load_vocabulary_values，禁止各脚本复制
      _load_xxx_values() 局部函数（违反 SCRIPT-QUALITY-001 D-D-05）。
      canonical = scripts/governance/_shared/yaml_utils.py（auto 派生：basename
      yaml_utils 匹配别名；无同蓝图竞争候选）。对标 trae_060 §2 词表唯一真源原则。
      注意：src/zephyr/ 下的代码（如 triage.py）因包路径隔离无法 import 此模块，
      暂保留局部 loader，待统一到 src/zephyr/shared/yaml_utils 后消除。

  # --------------------------------------------------------------------------
  - capability_id: blueprint_path_query
    canonical_override: src/zephyr/governance/rule_enforcement/sys_master_compliance.py
    aliases:
      - SYS_MASTER_PATH
      - MOD_MASTER_PATH
      - DOM_GOV
      - load_blueprint_path
      - blueprint_path
      - 蓝图路径
      - 蓝图磁盘路径
      - 蓝图路径查询
      - blueprint disk path
    description: >-
      蓝图磁盘路径查询的唯一入口。从 blueprint_registry.yaml（SSoT 派生）按 module_id 查询，
      不硬编码路径。真源链：blueprint.md frontmatter → sync_registry_from_blueprints.py
      → blueprint_registry.yaml → load_blueprint_path(module_id)。
      消除连字符/下划线漂移根因。

  # --------------------------------------------------------------------------
  - capability_id: frontmatter_metadata_validation
    canonical_override: scripts/governance/d3_metadata/check_frontmatter_metadata.py
    aliases:
      - doc_type_validation
      - ttl_validation
      - GATE-15
      - frontmatter_check
      - frontmatter_metadata
      - frontmatter_ttl_check
      - 元数据校验
      - frontmatter_metadata_check
    description: >-
      .md 文档 frontmatter 字段校验的唯一真源（GATE-15）。校验 ttl（必填+合法值，
      始终 hard block）+ doc_type（必填+合法值，默认 warn-only，--strict-doctype 或
      ZEPHYR_DOCTYPE_STRICT=1 升级 hard block）。合法值从 ttl_vocabulary.yaml +
      doc_type_vocabulary.yaml 动态加载（YAML 词表是唯一真源）。字段校验配置 _FIELD_RULES：
      新增词表字段校验只需加一行配置。归档脚本 validate_frontmatter_values.py 是 legacy
      副本，不复活——扩展字段校验扩展本文件。canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用 canonical_override 显式声明。

  # --------------------------------------------------------------------------
  - capability_id: llm_security_gateway
    canonical_override: src/zephyr/security/llm_defense/llm_security/gateway.py
    aliases:
      - LSG
      - LSGSecurityGateway
      - llm_security
      - LLM安全网关
      - security_gateway
      - 安全网关
    description: >-
      LLM 安全网关（L0-L8 十层纵深防御）。所有 LLM 调用必须经过 LSGSecurityGateway
      进行安全扫描（输入/输出/Agent 动作），禁止裸调 LLM API。对标 RULE-LSG-001。
      canonical = src/zephyr/security/llm_defense/llm_security/gateway.py（basename gateway
      不匹配任何 alias，无法 auto 派生，故用 canonical_override 显式声明）。
      412 个测试覆盖，100% 通过率。

  # --------------------------------------------------------------------------
  - capability_id: bare_llm_call_detector
    canonical_override: scripts/governance/d7_code/detect_direct_llm_calls.py
    aliases:
      - GATE-20
      - llm_security_gateway_gate
      - 裸调LLM检测
      - validate_llm_security_gateway
      - detect_direct_llm_calls
    description: >-
      GATE-20 裸调 LLM API 检测门禁（合并 COND-30 + RULE-LSG-001）。pre-commit
      阶段自动触发，AST 扫描 src/zephyr/ 下所有 Python 文件，检测未导入 LSG 的
      裸调 LLM API（openai/anthropic/langchain/litellm）+ exec/eval/compile 绕过。
      支持 --ci（硬阻断）/ --warn-only / --cond30（仅导入检测）三种模式。
      canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，故用
      canonical_override 显式声明。Session 20260626 合并自 validate_llm_security_gateway.py。

# ============================================================================
# 维护日志
# ============================================================================
# 2026-06-26 v1.0.0 初版。种子 2 条：session_handoff_continuity + rollback_executor。
#   记录已删 4 个 session_handoff 重复（commit d586cb25）。
#   标记 rollback_executor 同蓝图 MOD-INF-021 双实现为 conflicting，待 Owner 裁定。
# 2026-06-26 v1.1.0 治本重构（第一性原理审核）：
#   - 精简为能力索引（capability_id/aliases/description）+ 3 个可选人工裁定字段
#   - canonical_file/module_id/blueprint_id/domain/maturity 改为从磁盘头部 auto 派生
#   - duplicates[] 改为从磁盘 basename 匹配 auto 派生（relation 由 blueprint 比对派生）
#   - removed_duplicates[] 改为从 git log --diff-filter=D auto 派生
#   - 语义 sibling 移至 duplicates_manual（auto 无法发现）
#   - 未被 git 跟踪的历史文件移至 removed_duplicates_manual
#   - 消除 YAML↔代码头部同步漂移成本（治本）
# 2026-06-26 新增 frontmatter_metadata_validation（GATE-15，Stage 3 doc_type 门禁）：
#   - canonical 在 scripts/ 下（非 src/zephyr/），无法 auto 派生，用 canonical_override 显式声明
#   - 解决发现性：AI 搜 doc_type validation / ttl validation / GATE-15 可定位真源
#   - 解决防重建：check_file_canonical() 反查阻止重复创建 frontmatter 校验脚本
