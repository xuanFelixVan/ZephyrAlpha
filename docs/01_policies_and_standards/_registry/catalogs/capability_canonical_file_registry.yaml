    is_valid_submodule_id(submodule_id) 三个公共校验函数，被 check_naming_convention.py （N-06
    GATE-11）和 apply_depgraph.py（V1/V2 漏洞修复 + P1-2 --rename-domain 校验）复用， 消除正则重复定义。双轨制（R2
