      - CLAIM-REQUIRED
      - claim-required
      - make_claim_required_gate
      - unclaimed_file_blocker
      - file_claim_enforcer
    description: >-
      claim_files 前置检查门禁（CLAIM-REQUIRED，2026-06-30 治本）。已注册 session
      提交代码前必须 claim 目标文件，未 claim 则阻断（CLAIM_REQUIRED_VIOLATION）。
      病根：不 claim_files 可绕过 held_overlap_gate 防护（session 未声明 held_files
      则 held_overlap 无比对基准），claim_required_gate 治本——强制 session 先 claim
      再 commit。priority=40（优先于 HELD-OVERLAP(50)，先检查 claim 再检查 overlap）。
      逃生通道：--allow-overlap 参数放行（特殊情况）。canonical basename
      claim_required_gate 匹配 capability_id，可 auto 派生。
      解决发现性：新 AI 搜 "claim required/file claim/unclaimed commit" 可定位真源。
      解决防重建：check_file_canonical() 反查阻止重建同类强制 claim 脚本。
    integrity_anchors:
      - make_claim_required_gate    # gate 工厂(删则 gate 不注册)

