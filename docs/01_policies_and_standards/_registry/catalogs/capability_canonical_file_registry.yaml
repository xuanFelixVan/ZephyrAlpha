ttl: permanent
doc_type: gate
title: 能力→真源文件反查注册表
status: active
version: 1.1.1
date: '2026-06-26'
summary: capability → canonical_file 反查注册表，解决"AI 不知道某功能真源在哪"的信息不可达问题。 v1.1.0 治本重构：YAML
  仅声明能力索引（capability_id/aliases/description）+ 可选人工 裁定字段；canonical_file/module_id/blueprint_id/domain/maturity/duplicates/
  removed_duplicates 全部由 CapabilityLookup 从磁盘头部 + git log 自动派生，消除 YAML↔代码头部同步漂移成本。对标
  K8s Service(声明) + Endpoints(实时发现) 模式。
capabilities:
- capability_id: session_handoff_continuity
  aliases:
  - session_continuity
  - handoff
  - session_handoff
  description: Session 交接包自动生成与恢复。解决"打开 IDE 不知道上回做到哪了"的零记忆重启痛点。 依据：MOD-TASK_SYSTEM
    v0.3.2 + AGENTS.md §5.1 零记忆重启。12 importers，SQLite handoffs 表。canonical 由 auto
    派生：basename session_continuity 匹配 alias， 单候选（shared_services proxy 版已删除，commit
    9ae4970995，P2 闭环）。
  duplicates_manual:
  - path: src/zephyr/gov_drift/handoff_manager.py
    relation: sibling
    note: 漂移修复 handoff（Cross-Session Handoff Manager §6.14），与交接本语义不同 （交接本=AI session
      状态持久化；漂移 handoff=修复上下文交接包）。非重复实现， 是同族不同语义子能力。auto 派生按 basename 匹配会漏掉（handoff_manager
      不在 aliases 中），故人工声明。
  removed_duplicates_manual:
  - path: src/zephyr/shared/session/session_continuity.py
    note: shared/ 真源的死副本（原未被 git 跟踪），已删（commit d586cb25 清理）
- capability_id: rollback_executor
  aliases:
  - rollback
  - RollbackExecutor
  description: 回滚执行器核心封装。canonical = src/zephyr/infrastructure/rollback/ rollback_executor.py（auto
    派生：basename rollback_executor 匹配 capability_id）。 ARCH-034 P4 已删除 governance/rollback_executor.py
    孤儿副本（production， 无消费者，SSoT 冲突已消除）。
- capability_id: drift_fix
  aliases:
  - DriftFixHandler
  - drift_fix
  description: 漂移自动修复处理器（G-CT-005 消费端）。canonical = src/zephyr/infrastructure/ rollback/drift_fix.py（auto
    派生：basename drift_fix 匹配 capability_id）。 ARCH-034 P3 / SRC-038 合并后唯一 canonical
    真源（MATURITY=production）。 原有3份冗余副本已合并：governance/drift_fix.py（路径漂移，已删）、 rollback/governance/drift_fix.py（production，已删）。
    DriftFixHandler.on_drift_fix() 消费 ManagedDriftEvent 执行回滚兜底。 解决发现性：新 AI 搜 "drift_fix/DriftFixHandler"
    可定位真源。 解决防重建：check_file_canonical() 反查，新AI准备造同类功能前可发现。
- capability_id: project_root_resolution
  canonical_override: src/zephyr/shared/io/paths.py
  aliases:
  - PROJECT_ROOT
  - REPO_ROOT
  - project_root
  - repo_root
  - repo root
  - project root
  description: 仓库根目录的权威解析入口。所有需要仓库根的代码应 from zephyr.shared.io.paths import REPO_ROOT，
    禁止各自用 Path(__file__).parents[N] 推算（N 值散乱导致 bug，见 commit 1cd39ad5）。 src/zephyr/shared/io/paths.py
    是 src/ 代码的 REPO_ROOT 真源；截至本次仍有 90+ 文件各自推算， 彻底归一见独立任务。GATE-DD07 已扩展检测 Path(__file__).parents[N]
    模式（warn-only）。
  duplicates_manual:
  - path: scripts/governance/_shared/constants.py
    relation: re_export
    note: bootstrap import + re-export 自 src/zephyr/shared/io/paths.py。 scripts/ 可
      import src/（先例:git_commit.py），无需独立定义。
- capability_id: find_repo_root
  canonical_override: src/zephyr/shared/io/paths.py
  aliases:
  - find_repo_root
  - repo_root_finder
  - find_project_root
  description: 仓库根目录查找算法(向上遍历找 src/zephyr/__init__.py 标记文件)。 单真源:src/zephyr/shared/io/paths.py。scripts/
    可 bootstrap import src/ (先例:git_commit.py/check_ssot_gate.py),无架构约束阻碍单真源化。 scripts/governance/_shared/constants.py
    re-export 本真源,不再有独立实现。 GATE-VOCAB 不扫描此函数(非词表合法值)。
  duplicates_manual:
  - path: scripts/governance/_shared/constants.py
    relation: re_export
    note: bootstrap import + re-export 自 src/zephyr/shared/io/paths.py。
- capability_id: vocabulary_values_loader
  canonical_override: src/zephyr/shared/io/yaml_utils.py
  aliases:
  - load_vocabulary_values
  - load_vocabulary_entries
  - load_vocabulary_deprecated_map
  - vocabulary_loader
  - vocab_loader
  - yaml_vocabulary_loader
  description: vocabulary YAML 合法值集合 + 值+定义列表 + 废弃值映射加载的唯一公共真源入口（治本1 收拢点）。 真源实现：src/zephyr/shared/io/yaml_utils.py
    提供 load_vocabulary_values()（返回 set[str]、 只需值集合时用）、load_vocabulary_entries()（返回
    list[dict] 含 value+definition、 schema.json 双向同步填充 description 时用）和 load_vocabulary_deprecated_map()
    三个函数； scripts/governance/_shared/yaml_utils.py 重新导出，scripts/ 侧通过 from _shared.yaml_utils
    import load_vocabulary_values 使用。 src/zephyr/ 侧直接 from zephyr.shared.io.yaml_utils
    import load_vocabulary_values。 严禁任何脚本复制 _load_xxx_values() 局部函数（违反 SCRIPT-QUALITY-001
    D-D-05 + 向内收原则1：能用现成的不创造）。strict=True 默认 fail-fast，文件不存在抛 FileNotFoundError（消除静默失败
    DoS 漂移）。对标 trae_060 §2 词表唯一真源原则。
- capability_id: vocab_hardcode_detector
  canonical_override: scripts/governance/d3_metadata/check_vocab_hardcode.py
  aliases:
  - GATE-VOCAB
  - check_vocab_hardcode
  - vocabulary_hardcode_gate
  - gate_vocab
  description: 'GATE-VOCAB 词表合法值硬编码检测器（trae_060 §2 + 向内收原则2 自动事件触发）。 pre-commit 阶段自动触发：src/zephyr/**/*.py
    或 scripts/governance/**/*.py 变更时 AST 扫描 VALID/ALLOWED/LEGAL/PERMITTED_*_(VALUES|STATUSES|TYPES|LAYERS|LIST|SET)
    字面量集合硬编码 + dict()/list()/tuple()/"x,y".split() 隐式字面量 + walrus 操作符 + load_vocabulary_values("xxx.yaml")
    引用文件存在性。--ci 模式硬阻断（exit 1）。 内联豁免：# noqa: gate-vocab（带理由的诚实豁免）。canonical 在 scripts/
    下 （非 src/zephyr/），无法 auto 派生，故用 canonical_override 显式声明。 注：in-process gate 包装（vocab_hardcode_gate.py）是独立
    capability，subprocess 调用本检测器（检测逻辑 SSoT 在此，gate 仅是 thin wrapper）。'
- capability_id: blueprint_path_query
