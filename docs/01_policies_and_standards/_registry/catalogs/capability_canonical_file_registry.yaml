  description: '.pre-commit-config.yaml 内 hook id 唯一性检测门禁（GATE-ID-UNIQ）。同一 repo 块
    内重复 id 会导致后者覆盖前者（历史教训：commit a09e510ec 中两个 SSoT 门禁同用 id: gate-ssot，line 324 src/zephyr/*.py
