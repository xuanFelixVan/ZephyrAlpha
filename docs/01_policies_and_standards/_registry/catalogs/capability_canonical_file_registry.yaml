  - yaml_loader_n16
  - yaml_exemption_loader
  - ssot_linkage_validator
  - validate_ssot
  - validate_ssot_n16
  - fallback_consistency_check
  description: N-16 文件名项目内唯一性检测的豁免清单唯一 YAML 加载入口（治本：消除代码硬编码 vs YAML 真源同步缺口）。真源：trae_028_doc_structure_naming.yaml
    v1.5.0 §gov_doc_003_filename_uniqueness.n16_config（exempt_names_tests + exempt_names_docs_extra
    + skip_dirs_docs + skip_dir_prefixes 四个字段）。加载函数： _load_n16_exemptions_from_yaml()
    在模块 import 时读取一次（per-process 缓存， commit 每次启动新进程自动重载，YAML 改即生效）。fail-open 策略：YAML
    缺失/ 解析失败/类型不合规（非 list 或含非 str 元素）→ 回退到 _N16_*_FALLBACK 硬编码 安全值（防破坏性故障）。继承关系：_N16_DOCS_EXEMPT_NAMES
    = tests | docs_extra （docs 豁免继承 tests 基线）。类型严格校验防 string 标量被迭代成 char set 绕过检测（红蓝测试
    B5-B5e 修复）。N-16 为硬阻断规则，不受 GATE-11 --warn-only 过渡期影响。canonical_override 显式指向 d3_metadata
    版（pre-commit 实际调用）， 因存在 3 个同名 check_naming_convention.py 副本，auto 派生会歧义。改豁免清单 改
    trae_028.yaml §n16_config，禁止改代码 _N16_*_FALLBACK（[MODIFY-GUARD] 保护）。 同文件内 _validate_ssot_linkage()
    提供 N-16 fallback 4元组与 YAML 一致性校验 （--validate-ssot 触发，防 fallback 过时漂移），新AI写一致性检查前MUST反查此函数。
