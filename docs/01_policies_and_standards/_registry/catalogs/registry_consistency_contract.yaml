# YAML canonical 字段（AI 零歧义消费——对标 §6.12 AI-First）
schema_version: "1.1.0"
module_id: PS-REG-016
doc_type: gate
title: "登记表的登记表 — 跨登记表一致性契约"
status: active
version: "1.2.0"
date: "2026-05-16"
summary: "管理项目中所有登记表的跨表共享字段一致性规则。声明每个共享字段的 SSoT 归属、一致性级别、校验触发时机。v1.1.0：从 meta/ 迁移至 _registry/catalogs/，增补 YAML canonical 字段。v1.2.0：增补 GOV-MOD-007 MRS-001 交叉引用与 registry-master-index.yaml 自动扫描说明。"
#
# 对标: ITIL SACM CMDB 关系类型（CI 之间的 exact/derived/independent）
#       + ISO 42001 §10.3 持续性改进（跨登记表一致性是 AI 系统可靠性的基础）
#       + AGENTS.md §6.4 最有利于 AI 施工的选择——声明式期望状态
#       + GOV-MOD-007 多登记表同步标准 v2.0.0——MRS-001 定义了全部工件类型的操作登记矩阵
#
# 用途: 管理项目中所有登记表（registry YAML）的跨表共享字段一致性规则。
#       声明每个共享字段的 SSoT 归属、一致性级别、校验触发时机。
#       校验脚本 check_registry_consistency.py 读取本文件执行自动化比对。
#       MRS-001 全量操作-登记矩阵在 GOV-MOD-007 §5.1——本文件只管共享字段比对。
#
# 注意: 本文件仅覆盖共享字段一致性（version/module_id/layer/status/priority/generation）。
#       创建工件时的全量登记目标清单见 GOV-MOD-007 MRS-001 矩阵。
#       registry-master-index.yaml 按「脚本自动扫描 `_registry/catalogs/*.yaml`」生成 `total_registries`（数以该字段为准，勿写死）。
#
# AI 使用方式:
#   1. 读本文件 → 了解项目中有哪些登记表、各自管什么字段
#   2. 读 cross_registry_rules → 了解哪些字段跨表必须一致、以谁为准
#   3. 修改任何登记表的共享字段后 → 运行 check_registry_consistency.py 验证
# ============================================================================

_schema:
  description: "登记表集合的字段定义和受控词表"

  # ---- 一致性级别 ----
  consistency_levels:
    - id: "exact"
      description: "强制完全一致——所有来源的值必须完全相同。不一致 = 阻断级错误"
      violation_severity: "CRITICAL"
    - id: "derived"
      description: "可推导——一个来源的值可由另一个来源推导（如 generation=1 当 version=1.x）。不一致 = 警告"
      violation_severity: "MEDIUM"
    - id: "independent"
      description: "独立定义——各来源的值可以不同，无需比对"

  # ---- 校验触发时机 ----
  validation_triggers:
    - id: "manual"
      description: "手动运行 check_registry_consistency.py"
    - id: "pre_commit"
      description: "pre-commit 钩子自动触发（每次 git commit 前执行）"
    - id: "scheduled"
      description: "周度全量审计（Cron 定时任务）"

  # ---- SSoT 源类型 ----
  ssoT_source_types:
    - id: "physical_blueprint_frontmatter"
      description: "物理 blueprint.md 文件的 YAML frontmatter——version 等字段的第一手来源"
    - id: "module_registry"
      description: "module-registry.yaml 的 modules[] 条目——module_id、priority 等的登记源"
    - id: "blueprint_registry"
      description: "blueprint_registry.yaml 的 blueprints[] 条目——completeness_pct、generation 等的评估源"

