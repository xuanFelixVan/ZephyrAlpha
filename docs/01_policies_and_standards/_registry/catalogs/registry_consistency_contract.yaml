# ============================================================================
# 跨登记表一致性规则
# ============================================================================
cross_registry_rules:

  # ---- CR-001: version 字段三方一致 ----
  - rule_id: "CR-001"
    title: "version 字段跨表一致性"
    fields: ["version"]
    sources:
      - registry: "REG-001"
        yaml_path: "modules[].blueprint.version"
      - registry: "REG-002"
        yaml_path: "blueprints[].version"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "version"
    ssoT: "physical_blueprint"
    ssoT_rationale: |
      version 的第一手来源是蓝图作者写在 blueprint.md frontmatter 中的值。
      登记表中的 version 是"抄录"而非"定义"——以物理文件为准。
      对标 Kubernetes 声明式配置：资源版本定义在 manifest 自身，不在 etcd。
    consistency: exact
    violation_action: block

  # ---- CR-002: module_id 跨表一致 ----
  - rule_id: "CR-002"
    title: "module_id 跨表一致性"
    fields: ["module_id"]
    sources:
      - registry: "REG-001"
        yaml_path: "modules[].module_id"
      - registry: "REG-002"
        yaml_path: "blueprints[].module_id"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "module_id"
    ssoT: "REG-001"
    ssoT_rationale: |
      module_id 由 module-registry.yaml 首次分配并作为主键。
      blueprint.md frontmatter 和 blueprint_registry.yaml 中的 module_id 必须与主键一致。
    consistency: exact
    violation_action: block

  # ---- CR-003: layer 字段跨表一致 ----
  - rule_id: "CR-003"
    title: "layer 字段跨表一致性"
    fields: ["layer"]
    sources:
      - registry: "REG-001"
        yaml_path: "modules[].layer"
      - registry: "REG-002"
        yaml_path: "blueprints[].layer"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "layer"
    ssoT: "REG-001"
    ssoT_rationale: |
      layer 是模块的层级归属，由 module-registry.yaml 在模块创建时分配。
      物理文件和蓝图登记表必须与此一致。
    consistency: exact
    violation_action: block

  # ---- CR-004: status 字段跨表一致 ----
  - rule_id: "CR-004"
    title: "status 字段跨表一致性"
    fields: ["status"]
    sources:
      - registry: "REG-001"
        yaml_path: "modules[].blueprint.status"
      - registry: "REG-002"
        yaml_path: "blueprints[].blueprint_status"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "status"
    ssoT: "REG-001"
    ssoT_rationale: |
      蓝图审批状态由 module-registry.yaml 的 status 受控词表管理。
      物理文件和蓝图登记表必须与模块登记表的状态一致。
    consistency: exact
    violation_action: block

  # ---- CR-005: priority 字段跨表一致 ----
  - rule_id: "CR-005"
    title: "priority 字段跨表一致性"
    fields: ["priority"]
    sources:
      - registry: "REG-001"
        yaml_path: "modules[].priority"
      - registry: "REG-002"
        yaml_path: "blueprints[].priority"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "priority"
    ssoT: "REG-001"
    ssoT_rationale: |
      priority 由 module-registry.yaml 集中管理以保持全局优先级排序一致。
    consistency: exact
    violation_action: block

  # ---- CR-006: generation 可由 version 推导 ----
  - rule_id: "CR-006"
    title: "generation 与 version 推导关系"
    fields: ["generation", "version"]
    sources:
      - registry: "REG-002"
        yaml_path: "blueprints[].generation"
      - source: "physical_blueprint"
        file_pattern: "{module_path}/blueprint.md"
        frontmatter_key: "version"
    ssoT: "REG-002"
    ssoT_rationale: |
      generation 是蓝图登记表对 version 的解读（1.x → 第1代，2.x → 第2代）。
      规则：version 主版本号 = generation。
    consistency: derived
    derivation_rule: "generation == int(version major)"
    violation_action: warn

