# ============================================================================
# ZephyrAlpha 项目目录登记表（Directory Registry）— 唯一真源
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-02 | owner: ZephyrAlpha-Owner
#
# module_id: PS-REG-013
# doc_type: register
#
# 对标: ITIL SACM CMDB CI → Physical CIs（物理配置项——目录/文件夹属于基础设施拓扑）
#       + Linux FHS（Filesystem Hierarchy Standard——每个目录有明确职责声明）
#       + TOGAF §IV-D Architecture Repository（架构资产的有序存放结构）
#       + Kubernetes Namespace（每个 namespace 有唯一职责边界）
#
# 用途: 登记 ZephyrAlpha 项目所有目录——
#       路径 / 职责声明 / 父目录 / 是否有 index.md / 关联的 module_id。
#       本登记表是目录结构的 SSoT（唯一真源），用于自动校验目录是否"有职无位"或"有位无责"。
#
# 自动驾驶化: experimental 补齐——
#   - validate_directory_registry.py: 扫描实际目录 → 比对登记表 → 报告漂移
#   - 新增目录时，AI 必须先查登记表确认是否有冲突
#
# 与 directory-structure-standard.md 的关系:
#   - directory-structure-standard.md 定义目录创建和命名的规则
#   - 本登记表登记每个目录的当前实际状态
# ============================================================================

