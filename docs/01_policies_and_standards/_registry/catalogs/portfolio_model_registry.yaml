# 治理规则
# ============================================================
# 1. MVP 基线：所有策略回测 MUST 同时报 1/N（PFM-HEU-001）对照——优化模型
#    OOS 跑不赢 1/N 则不得晋升（DeMiguel 2009 纪律）。
# 2. 估计误差声明：使用协方差/预期收益的模型 MUST 声明估计方法与 lookback，
#    回测 MUST 含参数敏感性（lookback ±50%）扫描。
# 3. 与 risk_limit 衔接：优化输出 MUST 过 risk_limit_registry 限额检查
#    （position/concentration）后才生成 order.target（DS-006）。
# 4. 交易成本感知：目标权重变动 MUST 经 cost_model_registry 扣费评估，
#    换手成本 > 预期边际收益时不调仓（52 号回测框架对接）。
