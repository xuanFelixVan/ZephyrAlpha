heatmap:
  # 格式: probability × impact → risk_score → 颜色
  # 最低 = 1（very_low × minimal = 1×1=1）
  # 最高 = 25（very_high × critical = 5×5=25）
  critical_zone:   # risk_score ≥ 15 —— 立即应对
    - {risk_id: AI-RSK-001, score: 16, label: "AI幻觉输出"}
  high_zone:       # 10 ≤ risk_score < 15 —— experimental 应对
    - {risk_id: AI-RSK-002, score: 12, label: "Prompt注入"}
    - {risk_id: AI-RSK-004, score: 12, label: "多模型质量不一致"}
    - {risk_id: AI-RSK-005, score: 12, label: "容量溢出"}
  medium_zone:     # 5 ≤ risk_score < 10 —— beta 应对
    - {risk_id: AI-RSK-003, score: 8, label: "Context泄漏"}
    - {risk_id: AI-RSK-006, score: 9, label: "登记表漂移"}
    - {risk_id: AI-RSK-007, score: 8, label: "API不可用"}
    - {risk_id: AI-RSK-008, score: 9, label: "自审计闸缺失"}
  low_zone: []     # < 5 —— 监控即可

