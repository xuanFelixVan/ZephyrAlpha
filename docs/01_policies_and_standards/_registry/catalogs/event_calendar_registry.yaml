# [A_config] module_id=REG-EVT-001 | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# ============================================================================
# schema v2.0 升级（2026-08-15）：条目级多维适用性标注 + 库内算法迭代字段
# 背景：潘潘课程 546 条因子/策略条目入库前，库结构先支持多维适用性标注（设计备忘录 29_factor_strategy_extraction.md v1.2.2；
#       对标 TEJ Factor Library 分类树 / FactorDBMS 元数据评估分表 / Qlib Alpha158 六大类 / BigQuant 参数族）。
# 新增字段中文释义（条目级；既有条目为默认值/空值占位，禁止视为已填写内容，逐条校正随条目内容填入完成）：
#   primary_timeframe 主时间级别 | applicable_timeframes 可泛化时间级别 | regime_valid 有效市场环境 |
#   regime_invalid 失效市场环境 | direction 信号方向 | entry_role 条目角色 | applies_to 适用标的 |
#   tags 自由检索标签 | algorithm_status 算法状态 | evidence 回测证据（空=未回测）
# 本库裁剪与默认值决策：裁剪：timeframe×2（事件是离散时点，持有窗口由 typical_holding_window 表达）+ direction（事件类型本身方向不定，利好/利空逐事件判定）。保留 regime×2（事件有效性随市场环境变化）+ entry_role=trigger（事件=策略触发源）+ 共有四维度；algorithm_status 固定 not_applicable（事件类型=日历披露纪律，非算法）。
# v2.0 标签词表（本库在用，防同义词漂移——同一含义统一用词：翻转→反转、破位/跌破→突破、阻力→压力、派发→出货、横盘/盘整→震荡、超买超卖→均值回归族；同义新词须先归并再入库）：
#   事件、信号、分红、利率、压力、套利、宏观、尾盘、市场结构、情绪、成交、打板、指数、指标、数据、早盘、波动、流动性、绩效、股票池、规则、财报、资金、通胀、风控
# ============================================================================
# module_id: MOD-GOVERNANCE
ttl: permanent
schema_version: '2.0'
registry_id: REG-EVT-001
name: Event Calendar Registry
name_zh: 事件日历注册表
description: >-
  事件类型唯一真源（SSoT）。登记 A 股事件驱动策略依赖的全部事件类型 taxonomy：
  财报披露/业绩预告/业绩快报/除权除息/限售解禁/停复牌/股东增减持/回购/定增/
  指数成分调整/宏观发布/股东大会。每类事件定义字段、PIT 规则（公告时间 vs 生效时间）、
  数据源、典型市场影响方向与持有窗口。事件实例数据落 data_asset_registry 数据集
  （DS-091~097），本表管"事件类型定义+PIT 纪律"。
  与 regime_cycle_registry 正交：周期表管"规则性时间窗口"（固定间隔），
  本表管"离散公司/宏观事件"（不规则触发）。
  对标：Benzinga Events Calendar API（2026-07，公司事件机器可读化趋势）、
  聚宽 JQData 事件数据谱系、quant666 disclosure_date/share_float 事件表。
owner: MOD-GOVERNANCE
tier: tier_2_data_runtime
status: active
version: 1.2.0
created: '2026-08-14'
last_updated: '2026-08-15'
related_arch: '#ARCH-BREG-001'
unique_key:
- event_type_id
entry_count: 12

entry_schema:
  event_type_id: str             # EVT-{CLASS}-{NNN}，如 EVT-EARN-001
  name: str
  name_zh: str
  aliases: list[str]
  event_class: str               # earnings/corporate_action/holder/capital/market_structure/macro/governance
  subtype: str                   # 细分（如业绩预告=预增/预减/扭亏/首亏）
  pit_rule: str                  # PIT 纪律：announce_time 可用，effective_date 不可提前使用
  advance_notice_days: str       # 提前披露规律（如"财报披露计划提前约 10 交易日"）
  typical_impact: str            # 典型市场影响（正向催化/负向压力/双向高波动）
  typical_holding_window: str    # 典型事件策略持有窗口（如"公告后 1-5 日"）
  data_dataset_ref: str          # FK→data_asset_registry DS-XXX
  data_source: str               # AKShare/Tushare 接口
  update_frequency: str          # daily/weekly/monthly/quarterly/event
  used_by_strategies: list[str]  # FK→strategy_registry event_driven 类
  reliability_note: str          # 数据质量/陷阱备注
  status: str                    # candidate/active/deprecated
  version: str
  created_at: date
  updated_at: date
  owner: str
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  tags: list               # 自由检索标签 Tags — 中文多值标签，服务库内搜索与归纳
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）

