ttl: permanent
title: 图书馆标签标准词库（枚举+别名层）
doc_type: register
registry_id: REG-TAGVOCAB-001
name: Library Tag Vocabulary
name_zh: 图书馆标签标准词库
description: 资产登记 tags 字段的标准词枚举真源（ulib3 战役 T7，指令真源 docs/_working/ultimate_library/12_ulib3_directive.md §1.7）。结构=标准词（canonical）+ 别名层（aliases，每别名挂唯一标准词，别名孤儿=违规）。起步收编三源：①15 份 catalog 内联 "v2.0 标签词表"（58 词，同域重复簇必并，各
  catalog 改引用）②全 catalog 在用 tags 实测 564 值中语义归并③五个采集器硬编码 tags（ch/fs/pg/asset_bus/schtasks/mcp/外溢资产）。 纪律：新词只准馆员/裁定增补（st-ulib3-20260922 Owner 批），施工 AI 只能选不能造； 非枚举 tags 由 TAG-VOCAB 闸拦（观察期 warn 起步）。对标 Getty
  AAT/CSNL 词表结构 （canonical+variant 同一法系）。净零声明：替代 15 份内联标签簇（同域重复簇→收敛唯一， 宪法 §4 w5_1），不立平行登记表——tags 消费方继续读各登记表，本表只管"词准不准"。
