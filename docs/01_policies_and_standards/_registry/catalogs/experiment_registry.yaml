entry_schema:
  experiment_id: str             # EXP-{TYPE}-{NNN}，如 EXP-BACKTEST-001 / EXP-REGIME-001
  name: str
  name_zh: str
  experiment_type: str           # enum: backtest/factor_eval/strategy_eval/param_search/walk_forward/regime_validation
  target_type: str               # enum: factor/strategy/indicator/pattern/risk_rule/execution_algo
  target_id: str                 # 被测对象 id（FK 到对应注册表；regime 节流验证 target_type=risk_rule）
  params_summary: obj            # 参数快照（C1 门槛/网格/配置）
  data_period: str               # 数据区间，如 2015-01-01~2026-06-30
  universe: str                  # FK universe_registry（未登记允许 forward-ref 标 pending）
  benchmark_id: str              # FK benchmark_registry（v1.2.0 新增，计算超额收益）
  cost_model_ref: str            # FK cost_model_registry（v1.2.0 新增，MUST 指定扣成本）
  result_summary: obj            # {sharpe, max_dd, ic} 或验证项扩展键（obj 类型允许）
  conclusion: str
  # 回测过拟合检测（v1.3.0 新增，六方法体系 PBO+DSR+PSR+MinBTL+MTC+CPCV）
  is_overfit: bool               # 综合判定（PBO>0.2 或 DSR p-value<0.05 → True）
  pbo_value: float               # Probability of Backtest Overfitting（null=0.5，<0.1 可信，>0.2 红旗；n_trials<10 留 null）
  dsr_value: float               # Deflated Sharpe Ratio（>1.0 显著）
  psr_value: float               # Probabilistic Sharpe Ratio（AUC 0.81 最强单一诊断）
  n_trials: int                  # 参数搜索试验数（DSR/PBO 计算必需）
  min_trl_years: float           # v1.11.0：Minimum Track Record Length（年），MBL=0.5×(Z_α×σ_ann/SR_ann)²
  plateau_score: float           # v1.6.0：参数稳健性高原分数（选择原则非独立检测）
  adversarial_result: obj        # v1.6.0：对抗验证结果 {test_name, passed, kill_reason} 列表
  # 有效 trial 数鲁棒性带（v1.21.0 新增）
  trial_correlated: bool         # trial 间相关性（参数网格/同源变体=True）
  effective_trial_count_band: obj # ≥5 估计器区间 {estimators, robust_range, verdict}
  bootstrap_test_passed: bool    # White RC / Hansen SPA（trial_correlated=True 时 MUST，MVP warning 级）
  log_location: str              # 日志详情位置（db:// 或 logs/xxx）
  artifact_path: str             # 产物目录
  fallback_ref: str              # FallbackBackend JSON 路径（logs/experiment_tracking_fallback/{component}/{run_id}/run_meta.json）；
                                 # 62 号 v1.34.0 指令：MLflow 完全卸载后由 mlflow_run_id 改名，51 号 A/B/C 施工完成后全量生效
  mace_env_ref: str              # 可选，MACE RL 环境引用（execution_algo 实验）
  status: str                    # enum: running/completed/failed/archived
  module_id: str                 # §4 原则 4：关联 depgraph 蓝图号（MOD- 前缀）
  doc_ref: str                   # §4 原则 4：关联 design memo §节号
  code_path: str                 # §4 原则 4：关联代码（稳定 path，禁止 node_id/edge_id）
  created_at: date
  completed_at: date
  updated_at: date               # §4 原则 2 entry 通用字段
  version: str                   # §4 原则 2/9 entry 版本字段（git diff 提供追溯）
  owner: str
  parent_experiment_id: str      # 迭代链（self-ref 单向，裁定 S4）
  tags: list
  # 回测数据偏差治理（v1.18.0 新增，E14 审计）
  backtest_bias_checks: obj      # {survivorship: passed/failed/unknown, lookahead: ..., stop_exit: ...}
  # 归因分析（v1.18.0 新增；执行逻辑在 54 号，本字段仅登记结果）
  attribution_result: obj        # {method: brinson/factor_based/none, allocation_effect, ...}
  # LLM 前瞻偏差治理（v1.19.0 新增，E15 审计；非 LLM 实验 applicable=false）
  llm_lookahead_check_result: obj # {applicable: bool, reason, masking_level, alpha_decay, test_method}
  # LLM 前瞻污染检测（v1.22.0 新增，E18 审计 warning 级 MVP 不阻断）
  lap_check_result: obj          # {applicable: bool, lap_value, interaction_beta3, contamination, suppression_method}
  # 预注册协议（v1.25.0 新增；MVP 阶段所有回测 MUST pre_registered=true）
  pre_registered: bool           # 实验前声明假设/指标/样本量/止损规则（git commit 时间戳为证）
  cost_vetoed: bool              # 成本否决结果（含真实成本 OOS 收益≤0 → True）
  ic_oos_gap: float              # IC 与 OOS 收益脱钩度（<0.3 告警；无因子 IC 实验留 null）
  # 上线裁决三值结果（v1.28.0 新增；regime 验证等非上线裁决场景留 null）
  viability_verdict: str         # enum: supported/refuted/inconclusive
  # 过拟合实证模式分类（v1.28.0 新增）
  overfit_pattern: str           # enum: none/walk_forward_divergence/regime_flip/parameter_cliff/indicator_stacking/survivorship
  # 路径依赖回撤度量（v1.30.0 新增）
  ulcer_index: float             # √(ΣD²/N)，深度×持续时间（MVP 自动可算，未算留 null）
  calmar_ratio: float            # 年化收益/|max_drawdown|（>1.0 可接受 / >3.0 优秀）
  # LLM 时序泄漏测量（v1.31.0 新增；MVP 默认 method=none）
  temporal_leakage_measurement: obj # {method: matched_control/boundary_detection/none, leakage_score, reference_model}
  # 参数稳定性区域（v1.32.0 新增；MVP 阶段填 {selection_method: single_optimum}）
  parameter_stability_region: obj   # {plateau_identified, cliff_detected, stability_score, selection_method}
  # 多重检验校正 MTC（v1.12.0 正文声明 schema 预留；n_strategies<5 时可选）
  mtc_method: str                # romano_wolf/mcs/bh_fdr
  mtc_pvalue: float              # 修正后 p 值
  mtc_survived: bool             # 是否在 MTC 中存活（False → 阻断部署）
  # CPCV 组合净化交叉验证（v1.16.0 正文声明 schema 预留；Phase 1.5+ 替代单路径 walk-forward）
  cpcv_n_groups: int             # 默认 10
  cpcv_k_test: int               # 默认 2
  cpcv_oos_sharpe_mean: float
  cpcv_oos_sharpe_std: float     # std/mean>0.5 红旗（切法敏感=过拟合）
  cpcv_worst_max_dd: float       # 45 条中最差 MaxDD；>0.15 一票否决（§4.13 G1）
  regime_valid: list               # 有效市场环境 Regime Valid — 条目生效的市场环境列表（枚举 trend_up/trend_down/ranging/panic/euphoria/high_vol/low_vol，空=未标注）
  regime_invalid: list               # 失效市场环境 Regime Invalid — 条目失效的市场环境列表（多值，可空）
  entry_role: str                # 条目角色 Entry Role — trigger触发/state状态量/filter过滤/ranking排序/rule规则/reference基准
  applies_to: list               # 适用标的 Applies To — 条目适用的标的类型列表（枚举 stock/etf/index/futures/sector/market）
  algorithm_status: str                # 算法状态 Algorithm Status — quantized已量化/pending_backtest待回测/pending_definition待定义/not_applicable非算法条目
  evidence: str                # 回测证据 Evidence — IC/胜率等回测证据摘要，空串=未回测（后续条目内容填入时回填）
  code_symbol: str|null         # 代码符号锚点 Code Symbol — 算法实现的函数/类级锚点（格式 <relative_path>::<symbol>，如 src/zephyr/factor/momentum.py::calc_mom_20）；null=代码未落地（设计态，实现域真源暂为库）；代码落地后实现域真源移交代码，与 code_path 共同支撑库↔代码双向查找（#ARCH-BREG-002 分域真源裁定 2026-08-15）
  code_fingerprint: str|null    # 实现指纹 Code Fingerprint — 代码侧实现（参数/签名/AST）canonical hash 快照，由扫描器写入；库侧快照与代码重算不一致=漂移告警（门禁B reconciler 对账，告警不自动双写）；null=未计算

experiments:
  # ── EXP-REGIME-001：C1 Shrinkage 开/关对比验证（11 号 Phase 1，核心一票否决）──
  - experiment_id: EXP-REGIME-001
    name: C1 Shrinkage On/Off Validation (Phase 1)
    name_zh: C1 Shrinkage 开/关对比验证（Phase 1 核心一票否决）
    experiment_type: regime_validation
    target_type: risk_rule
    target_id: RLM-POSITION-001      # 行情三分仓位法（risk_limit_registry L325）；C1 验证其 regime shrinkage 节流机制"有效不伤害"
    params_summary:
      c1_sharpe_tolerance: 0.1
      c1_maxdd_improvement_pp: 0.03
      c1_calmar_improvement_ratio: 1.2
      c1_turnover_max_ratio: 2.0
      trading_days_per_year: 252
      walk_forward_quarters: 46      # 46 季度 HMM refit（每季度仅用当时可得数据）
      basket: 10-large-cap           # 10 大盘股等权篮子
      initial_capital: 1000000
      commission_rate: 0.0003        # 万3（c1_metrics.json backtest_config 实证）
      slippage_bps: 1                # 1bp
      risk_free_rate: 0.02           # 实证值（非 metrics.py 默认 0.025）
    data_period: "2015-01-01~2026-06-30"
    universe: UNI-BASKET-001         # ✅ 已登记 universe_registry（2026-08-17 AI-REGF-001 补登核销）
    benchmark_id: BMK-ABSOLUTE-001   # 开/关自我对比，无市场基准；绝对收益口径
    cost_model_ref: CST-ASTOCK-001   # 万3佣金+1bp滑点实证对齐 A 股标准成本模型
    result_summary:
      sharpe: 0.3473825209431231     # 实验组（开）；基准组（关）=0.36776231567978096
      max_dd: 0.14845225996851333    # 实验组；基准组=0.22208449853641024（改善 +0.0736）
      ic: null
    conclusion: >-
      四项全通过：Sharpe 开0.3474 vs 关0.3678（差-0.0204，门槛≥-0.1=tolerance）✅；
      MaxDD 0.1485 vs 0.2221（改善+0.0736≥0.03）✅；Calmar 0.3694≥0.3502（关×1.2，+27%）✅；
      Turnover 2.5522/yr≤4.5444（关×2）✅。Shrinkage 节流有效不伤害，可采纳。
      行业对照 Morwane OOS 2013-2026：MaxDD 改善 7.4pp 优于其 3.9pp。
      施工 commit 852457e9；ARCH #ARCH-REGIME-VALIDATION-001 + #ARCH-REGIME-C1-RUNNER-001。
    is_overfit: false                # 开/关单次对比非参数搜索，无选择偏差
    pbo_value: null                  # n_trials=1 <10，62 号 MVP 决策统计意义有限不跑
    dsr_value: null
    psr_value: null
    n_trials: 1
    min_trl_years: null              # σ_ann 未产出，未计算
    plateau_score: null
    adversarial_result: null
    trial_correlated: false
    effective_trial_count_band: null
    bootstrap_test_passed: null
