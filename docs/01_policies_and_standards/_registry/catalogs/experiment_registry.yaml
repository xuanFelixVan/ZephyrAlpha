  存储后端=FallbackBackend 本地 JSON（logs/experiment_tracking_fallback/，MLflow 已裁定完全卸载，
  51 号 §四.1 用户选择）；展示层=Panel 实验历史 Tab（experiment_history.py，51 号工作流 B）。
  对标 MLflow Experiment Registry / Comet.ml。business_registry_construction_plan §7.2。
