# [A_config] module_id=REG-LOG-001 | layer=config | stability=stable | safety=M | ai_autonomy=human_gated
# ============================================================================
# v1.0.0 首建（2026-08-22，92 号清单 §7.12 / 44 号备忘 §12.1 M4-①）：
#   全仓日志/事件落盘写入点总索引（"100+ 日志的总清单"）——AI 进项目即可发现。
#   覆盖口径：src/ + scripts/（_archive/__pycache__ 除外）四类写入模式扫描
#   ①open(...,"a") 追加 ②logging FileHandler/RotatingFileHandler ③write_text 落
#   日志/审计目标 ④治理库日志表 INSERT（drift_events/reconciliation_differences/
#   prediction_log）；tests/ 临时落盘非生产日志不纳入。对账脚本=
#   scripts/governance/check_registry_of_logs.py（warn-only MVP，exit 恒 0）。
#   对标：机构 OMS/EMS 全量订单日志目录+数据字典；Fed SR 11-7 模型清单+验证记录。
# ============================================================================
module_id: REG-LOG-001
ttl: permanent
schema_version: '1.0'
registry_id: REG-LOG-001
name: Registry of Logs
name_zh: 日志总账索引登记表
description: >-
  全仓日志/事件落盘载体唯一总索引（SSoT）。每条登记：log_id/路径/写入方（模块文件）/
  消费方/schema 摘要/保留期/状态。用途：①AI 进项目即发现全量日志载体（44 号 §12.1
  Owner 原话"所有日志应有一个总索引/总清单表"）；②日志→参数校准反馈闭环（M4-④）
  与 experiment_registry 联动的发现入口；③治理审计对账（写入点漂移告警，配套
  check_registry_of_logs.py warn-only 扫描）。范围=src/+scripts/ 生产写入点；
  运行时数据本体（data/**、.runtime/**）不入 git、仅登记载体路径与口径。
  边界：本表管"日志/事件落盘载体"，业务数据资产（CH 表/数据集/任务）归
  data_asset_registry.yaml（REG-DATAFLOW-001），预测类输出统一落库表
  prediction_log 同时在本表（LOG-DB-003）与治理库 DDL 登记。
doc_type: register
status: active
version: 1.0.0
owner: ZephyrAlpha-Owner
tier: tier_1_governance
created: '2026-08-22'
last_updated: '2026-08-22'
related_arch: '92号清单 §7.12（M4-①）/ 44号备忘 §12.1'
unique_key: [log_id]
entry_counts: {logs: 97}

# 扫描口径（check_registry_of_logs.py 对账基准，改动需同步脚本常量）：
scan_scope:
  roots: [src, scripts]
  exclude_dirs: [__pycache__, _archive]
  patterns:
    append_open: 'open(...,"a") 追加写入（含 Path.open("a")）'
    file_handler: 'logging FileHandler/RotatingFileHandler/TimedRotatingFileHandler'
    write_text_log: 'write_text 且同行含 log/audit/.jsonl/.ndjson 词元'
    db_insert: 'INSERT INTO drift_events/reconciliation_differences/prediction_log'

entry_schema:
  log_id: str              # LOG-{FAMILY}-{NNN}；FAMILY∈{AUD,CMP,DED,SEC,MCP,GATE,RBK,INF,DATA,TRD,SIG,SKL,SHD,GOV,DRF,DB,OPS}
  name_zh: str             # 中文名
  kind: str                # event_log/audit_log/run_log/metrics_log/db_table/data_append
  path: str                # 仓相对路径或模式（<>/{} 为注入/动态段；db_table 用 库文件::表名）
  writers: list[str]       # 写入方模块文件（仓相对路径）——对账键
  consumers: list[str]     # 消费方模块文件或角色（未知=人工查询排障）
  schema_summary: str      # 记录字段摘要（一行）
  retention: str           # 保留期口径
  status: str              # active/legacy

logs:
  # ═══════════════ AUD — 治理审计链（不可变/WORM 族） ═══════════════
  - log_id: LOG-AUD-001
    name_zh: 治理审计事件主链
    kind: audit_log
    path: data/audit_trail/events.jsonl
    writers: [src/zephyr/gov_audit/writer.py]
    consumers: [src/zephyr/gov_audit/integrity.py, src/zephyr/gov_audit/anomaly.py, src/zephyr/gov_audit/merkle_hourly.py, src/zephyr/gov_audit/query.py, src/zephyr/gov_audit/replay_engine.py]
    schema_summary: JSONL 追加+SHA-256 哈希链+HMAC-SHA256 签名+Lamport 时钟（event/ts/prev_hash/hash 等）
    retention: permanent（核心不可变链；merkle_hourly 批次固化，log_rotation 归档 data/audit_history）
    status: active
  - log_id: LOG-AUD-002
    name_zh: 门禁链持久化（gate chain）
    kind: audit_log
    path: data/audit_trail/gate_chain.jsonl
    writers: [src/zephyr/gov_enforcement/rule_enforcement/audit_chain_verifier.py]
    consumers: [src/zephyr/gov_enforcement/rule_enforcement/audit_chain_verifier.py]
    schema_summary: 门禁判定记录 JSONL 链（env ZEPHYR_GATE_CHAIN_PATH 可覆盖）
    retention: permanent
    status: active

  # ═══════════════ CMP — 合规 ═══════════════
  - log_id: LOG-CMP-001
    name_zh: 合规检测日志
    kind: audit_log
    path: data/compliance_log/compliance_log.jsonl
    writers: [src/zephyr/compliance/compliance_log.py]
    consumers: [src/zephyr/compliance（域内查询）, 人工查询排障]
    schema_summary: 合规检测事件 JSONL（append-only，newline=\n 固定）
    retention: permanent
    status: active

  # ═══════════════ DED — 代码去重决策链 ═══════════════
  - log_id: LOG-DED-001
    name_zh: 决策审计链（code_dedup）
    kind: audit_log
    path: data/cache/decision_audit_chain.ndjson
    writers: [src/zephyr/gov_code_quality/code_dedup/decision_auditor.py]
    consumers: [人工查询排障]
    schema_summary: NDJSON 决策事件链（44 号 §12.1 实证"已有"件）
    retention: permanent
    status: active

  # ═══════════════ SEC — 安全 ═══════════════
  - log_id: LOG-SEC-001
    name_zh: LLM 行为审计日志
    kind: audit_log
    path: '{log_dir}/audit-{YYYY-MM-DD}.jsonl（log_dir 构造注入）'
    writers: [src/zephyr/security/llm_defense/llm_security/behavior_audit_logger.py]
    consumers: [人工查询排障]
    schema_summary: LLM 行为事件 JSONL（按日切分）
    retention: permanent
    status: active
  - log_id: LOG-SEC-002
    name_zh: 防篡改证据日志
    kind: audit_log
    path: logs/tamper_evident.jsonl
    writers: [src/zephyr/governance/security_governance/tamper_evident_log.py]
    consumers: [人工查询排障]
    schema_summary: 防篡改事件 JSONL（log_path 可注入覆盖）
    retention: permanent
    status: active

  # ═══════════════ MCP — 集成审计 ═══════════════
  - log_id: LOG-MCP-001
    name_zh: MCP 工具调用审计
    kind: audit_log
    path: logs/mcp_audit/tools_call.jsonl
    writers: [src/zephyr/integration/mcp/audit_logger.py]
    consumers: [人工查询排障]
    schema_summary: 工具调用记录 JSONL（log_dir 注入可覆盖默认 AUDIT_LOG_DIR）
    retention: permanent
    status: active

  # ═══════════════ GATE — 提交网关/session worktree 族（.runtime） ═══════════════
  - log_id: LOG-GATE-001
    name_zh: worktree 操作遥测日志
    kind: event_log
    path: .runtime/worktree_ops_log.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/session_worktree.py, src/zephyr/gov_enforcement/rule_bridge/emergency_commit.py, src/zephyr/shared/io/workspace_telemetry.py]
    consumers: [人工查询排障, worktree 治理审计]
    schema_summary: '{ts, op/session_id, source, file, content_hash, backup_path} JSONL'
    retention: .runtime 运行时（gitignored，随治理清理）
    status: active
  - log_id: LOG-GATE-002
    name_zh: worktree abort 审计
    kind: audit_log
    path: .runtime/gate_audit/worktree_abort.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/session_worktree.py, scripts/session_worktree.py]
    consumers: [worktree 治理审计]
    schema_summary: abort 事件 JSONL（四段验证留痕字段）
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-003
    name_zh: force_merge 逃生通道使用记录
    kind: audit_log
    path: .runtime/gate_audit/force_merge_usage.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/session_worktree.py]
    consumers: [worktree 治理审计]
    schema_summary: '{timestamp, session_id} JSONL'
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-004
    name_zh: 工作区漂移告警
    kind: event_log
    path: .runtime/workspace_drift_warn.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/session_worktree.py]
    consumers: [人工查询排障]
    schema_summary: 漂移告警事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-005
    name_zh: session 心跳审计
    kind: event_log
    path: .runtime/sessions/<session_id>/heartbeat.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/heartbeat_daemon.py]
    consumers: [src/zephyr/gov_enforcement/rule_bridge/session_worktree.py（merge/abort 清理）]
    schema_summary: '{ts, pid, status(started/alive/exited/...), extra} JSONL，30s 间隔'
    retention: session 生命周期（merge/abort 时删除 heartbeat.jsonl）
    status: active
  - log_id: LOG-GATE-006
    name_zh: commit 锁降级回退记录
    kind: audit_log
    path: .runtime/gate_audit/commit_lock_fallback.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/git_commit_gateway.py]
    consumers: [commit 网关治理审计]
    schema_summary: 锁回退事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-007
    name_zh: 网关 index 卫生事件
    kind: audit_log
    path: .runtime/gate_audit/gateway_index_hygiene.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/git_commit_gateway.py]
    consumers: [commit 网关治理审计]
    schema_summary: index 卫生事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-008
    name_zh: claim 快照采纳记录
    kind: audit_log
    path: '{claim_snapshots_dir}/<session_id>_adopted.jsonl（注入）'
    writers: [src/zephyr/gov_enforcement/rule_bridge/git_commit_gateway.py]
    consumers: [commit 网关治理审计]
    schema_summary: 采纳快照 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-009
    name_zh: worktree 状态快照
    kind: event_log
    path: .runtime/gate_audit/worktree_status_snapshots.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/git_commit_gateway.py]
    consumers: [commit 网关治理审计]
    schema_summary: 状态快照 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-010
    name_zh: hook 跟踪漂移记录
    kind: audit_log
    path: .runtime/audit/hook_tracked_drift.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/git_commit_gateway.py]
    consumers: [commit 网关治理审计]
    schema_summary: hook 漂移事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-011
    name_zh: --allow-overlap 旗标使用记录
    kind: audit_log
    path: .runtime/gate_audit/allow_overlap_usage.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/commit_gate_registry.py]
    consumers: [commit 网关治理审计]
    schema_summary: 旗标使用事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-012
    name_zh: 受保护路径绕过记录
    kind: audit_log
    path: .runtime/gate_audit/protected_paths_bypass.jsonl
    writers: [src/zephyr/gov_enforcement/commit_gates/protected_paths_gate.py]
    consumers: [commit 网关治理审计]
    schema_summary: 绕过事件 JSONL
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-013
    name_zh: worktree 漂移看门狗
    kind: event_log
    path: .runtime/audit/worktree_drift_watchdog.jsonl + .runtime/audit/watchdog.jsonl
    writers: [src/zephyr/gov_enforcement/rule_bridge/worktree_drift_watchdog.py]
    consumers: [人工查询排障]
    schema_summary: 归因审计/看门狗事件 JSONL（永不回 tracked 区）
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-014
    name_zh: claim 后外來改动审计
    kind: audit_log
    path: .runtime/gate_audit/post_claim_modifications.jsonl
    writers: [src/zephyr/gov_enforcement/commit_gates/foreign_change_gate.py]
    consumers: [commit 网关治理审计]
    schema_summary: '{timestamp, session_id, file, baseline_size, current_size, adopted, post_claim_change} JSONL'
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-015
    name_zh: capability 查阅审计（按 session）
    kind: audit_log
    path: .runtime/lookup_audit/<session_id>.jsonl
    writers: [src/zephyr/governance/capability_lookup.py, src/zephyr/integration/mcp/rule_discovery_server.py]
    consumers: [src/zephyr/gov_enforcement/commit_gates/capability_lookup_required_gate.py]
    schema_summary: capability 查阅事件 JSONL（无有效 session_id 跳过）
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-016
    name_zh: git 性能监控日志
    kind: metrics_log
    path: .runtime/git_performance_log.jsonl
    writers: [src/zephyr/governance/audit/git_performance_monitor_reconciler.py]
    consumers: [src/zephyr/governance/audit/git_performance_monitor_reconciler.py（趋势检测回读）]
    schema_summary: git 操作耗时记录 JSONL（写入失败仅 debug 不阻断）
    retention: .runtime 运行时
    status: active
  - log_id: LOG-GATE-017
    name_zh: capability 查阅绕过审计
    kind: audit_log
    path: .runtime/lookup_audit/bypass_audit.jsonl
    writers: [src/zephyr/governance/audit/reconciliation_registry.py]
    consumers: [commit 网关治理审计]
    schema_summary: 绕过事件 JSONL
    retention: .runtime 运行时
    status: active

  # ═══════════════ RBK — 回滚族（.zephyr） ═══════════════
  - log_id: LOG-RBK-001
    name_zh: 拓扑变更日志
    kind: event_log
    path: .zephyr/topology_change_log.jsonl
    writers: [src/zephyr/infrastructure/rollback/topology_change_log.py]
    consumers: [人工查询排障]
    schema_summary: '{timestamp_utc, details, ...} JSONL'
    retention: permanent（.zephyr 治理区）
    status: active
  - log_id: LOG-RBK-002
    name_zh: 回滚 WAL（预写日志）
    kind: audit_log
    path: .zephyr/rollback_wal.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_wal.py]
    consumers: [src/zephyr/infrastructure/rollback/rollback_scheduler.py, src/zephyr/infrastructure/rollback/rollback_executor.py]
    schema_summary: WAL 条目 JSONL（append-only，含 written_at）
    retention: permanent
    status: active
  - log_id: LOG-RBK-003
    name_zh: 回滚循环检测日志
    kind: event_log
    path: .zephyr/rollback_loop_log.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_loop_detector.py]
    consumers: [人工查询排障]
    schema_summary: '{gate_id, success, ...} JSONL'
    retention: permanent
    status: active
  - log_id: LOG-RBK-004
    name_zh: 回滚锁请求队列
    kind: event_log
    path: .zephyr/rollback_lock_queue.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_lock.py]
    consumers: [src/zephyr/infrastructure/rollback/rollback_lock.py（队列消费）]
    schema_summary: LockRequest JSONL 队列（有效行重写压缩同文件）
    retention: permanent
    status: active
  - log_id: LOG-RBK-005
    name_zh: 回滚丢弃审计
    kind: audit_log
    path: .zephyr/audit/rollback_discard_audit.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_executor.py]
    consumers: [回滚治理审计]
    schema_summary: 丢弃事件 JSONL
    retention: permanent
    status: active
  - log_id: LOG-RBK-006
    name_zh: 回滚操作审计
    kind: audit_log
    path: .zephyr/audit/rollback_operations_audit.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_executor.py]
    consumers: [src/zephyr/infrastructure/rollback/rollback_abuse_detector.py]
    schema_summary: 回滚操作事件 JSONL
    retention: permanent
    status: active
  - log_id: LOG-RBK-007
    name_zh: 回滚预算消耗日志
    kind: metrics_log
    path: .zephyr/rollback_budget_log.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_budget.py]
    consumers: [人工查询排障]
    schema_summary: '{reason, token_cost, ...} JSONL'
    retention: permanent
    status: active
  - log_id: LOG-RBK-008
    name_zh: 回滚审计枢纽
    kind: audit_log
    path: .zephyr/audit/rollback_nexus_audit.jsonl
    writers: [src/zephyr/infrastructure/rollback/rollback_audit_nexus.py]
    consumers: [回滚治理审计（summary 派生 .zephyr/audit/rollback_nexus_summary.json）]
