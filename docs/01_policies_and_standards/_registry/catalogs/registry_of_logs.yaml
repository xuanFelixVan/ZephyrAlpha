  - log_id: LOG-RBK-009
    name_zh: 已知好状态台账
    kind: audit_log
    path: .zephyr/knowngoodstate_ledger.jsonl
    writers: [src/zephyr/infrastructure/rollback/knowngoodstate_ledger.py]
    consumers: [src/zephyr/infrastructure/rollback/checkpoint_gc.py]
    schema_summary: 签名台账记录 JSONL（含 signature）
    retention: permanent
    status: active
  - log_id: LOG-RBK-010
    name_zh: 熔断开关记录
    kind: audit_log
    path: .zephyr/kill_switches.jsonl
    writers: [src/zephyr/infrastructure/rollback/kill_switch.py]
    consumers: [人工查询排障]
    schema_summary: '{token_used, ...} JSONL'
    retention: permanent
    status: active
  - log_id: LOG-RBK-011
    name_zh: 意图归档清单
    kind: event_log
    path: .zephyr/intent_archive/manifest.jsonl
    writers: [src/zephyr/infrastructure/rollback/intent_archiver.py]
    consumers: [人工查询排障]
    schema_summary: 意图清单 JSONL（intent 文本同目录落 .md）
    retention: permanent
    status: active
  - log_id: LOG-RBK-012
    name_zh: 取证 merkle 链
    kind: audit_log
    path: '{forensic_dir}/merkle_chain.jsonl（注入）'
    writers: [src/zephyr/infrastructure/rollback/forensic.py]
    consumers: [人工查询排障]
    schema_summary: 取证链 JSONL
    retention: permanent
    status: active
  - log_id: LOG-RBK-013
    name_zh: 回滚演练日志+熔断告警
    kind: event_log
    path: .zephyr/drill_logs/ + .zephyr/ROLLBACK_MELTDOWN.json（告警单文件）
    writers: [src/zephyr/infrastructure/rollback/rollback_drill.py]
    consumers: [人工查询排障]
    schema_summary: 演练日志文本 + meltdown 告警 JSON（write_text 快照）
    retention: permanent
    status: active

  # ═══════════════ INF — 基础设施遥测/队列/SLA ═══════════════
  - log_id: LOG-INF-001
    name_zh: 领域事件存储
    kind: event_log
    path: data/events/event_store.jsonl
    writers: [src/zephyr/infrastructure/events/event_store.py]
    consumers: [人工查询排障]
    schema_summary: DomainEvent JSONL（data_dir 注入可覆盖）
