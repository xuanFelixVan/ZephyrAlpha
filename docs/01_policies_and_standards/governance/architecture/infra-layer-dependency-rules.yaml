      status: pending_refactor

    - from: "MOD-INF-014"
      to: "MOD-INF-010"
      current: "llm-security depends_on feedback-loop"
      recommendation: "LSG 异常上送走 EventBus Topic: alert.security"
      status: resolved
      resolution: "depends_on 已移除，改用 EventBus 松耦合"

    - from: "MOD-INF-009"
      to: "MOD-INF-014"
      current: "pipeline depends_on llm-security"
      recommendation: "pipeline 执行前安全检查走 EventBus Topic: action.security_check"
      status: pending_refactor

    - from: "MOD-INF-020"
      to: "MOD-INF-012"
      current: "audit-trail depends_on database"
      recommendation: "审计记录写入走 database 提供的 Contract 接口，不直接 depends_on module_id"
      status: pending_refactor
      note: "可降级为 DEPTH_0（audit 必须持久化）；仍需收敛为有限步长"

    - from: "MOD-INF-010"
      to: "MOD-INF-015"
      current: "feedback-loop depends_on system-telemetry"
      recommendation: "FLE 消费遥测走 Shared/EventBus 松耦合"
      status: resolved
      resolution: "depends_on 已移除，改用 EventBus 松耦合"

    - from: "MOD-INF-015"
      to: "MOD-INF-015"
      current: "system-telemetry depends_on 自身（自引用）"
      resolution: "已移除—自体监控不进入 depends_on 图"

    - from: "MOD-INF-018"
      to: "MOD-INF-020"
      current: "agent-rbac depends_on audit-trail"
      recommendation: "RBAC 决策审计走 EventBus Topic: audit.record"
      status: pending_refactor

    - from: "MOD-INF-021"
      to: "MOD-INF-020"
      current: "rollback-system depends_on audit-trail"
      recommendation: "回滚审计走 EventBus Topic: audit.record"
      status: pending_refactor

    - from: "MOD-INF-023"
      to: "MOD-INF-020"
      current: "drift-detector depends_on audit-trail"
      recommendation: "漂移检测记录走 EventBus Topic: audit.record"
      status: pending_refactor

    - from: "MOD-INF-024"
      to: "MOD-INF-020"
      current: "budget-enforcer depends_on audit-trail"
      recommendation: "预算执行记录走 EventBus Topic: audit.record"
      status: pending_refactor

    - from: "MOD-INF-022"
      to: "MOD-INF-020"
      current: "escalation-protocol depends_on audit-trail"
      recommendation: "升级记录走 EventBus Topic: audit.record"
      status: pending_refactor

    - from: "MOD-INF-011"
      to: "MOD-INF-014"
      current: "vector-memory depends_on llm-security"
      recommendation: "向量检索安全检查走 EventBus Topic: query.security_check"
      status: pending_refactor
```

### §3.2 跨层依赖边界

```yaml
cross_layer_boundary:
  rules:
    - "cross_layer 模块之间允许单向 depends_on shared-core(MOD-INF-019)"
    - "cross_layer 模块之间禁止直接双向 depends_on（除白名单 LEGAL-001）"
    - "l01_infrastructure 模块 → cross_layer 模块：仅允许 depends_on shared-core/pipeline/database（需架构评审）"
    - "cross_layer 模块 → l01_infrastructure 模块：仅允许 depends_on 具体 l01 模块（需架构评审，优先 EventBus）"
  enforcement: "detect_depends_on_cycles.py 检测到违规时报告违反的具体规则 ID"
```

