## §5 剩余21循环分析

```yaml
remaining_cycles_analysis:
  category_1_document_level:
    count: 2
    cycles:
      - id: "REMAIN-DOC-001"
        path: ["MOD-INF-006", "TEMPLATE-TASK-001", "MOD-INF-006"]
        rationale: "task-system 引用 task-card-template 作为文档模板，template 引用 task-system 的字段定义"
        recommendation: "模板文件移入 docs/01_policies_and_standards/templates/，对 task-system 的引用改为方案性单向依赖"
        status: pending_refactor

      - id: "REMAIN-DOC-002"
        path: ["GOV-AI-002", "MOD-INF-006", "GOV-AI-002"]
        rationale: "model-routing-policy 引用 task-system 的任务路由字段定义，task-system 引用策略作为配置源"
        recommendation: "策略引用改为 depends_on 单向（policy → module），module 通过配置注入读取策略，不直接 depends_on"
        status: pending_refactor

  category_2_cross_layer_mesh:
    count: 19
    core_cluster: [feedback-loop(MOD-INF-010), pipeline(MOD-INF-009), llm-security(MOD-INF-014)]
    peripheral_cluster: [database(MOD-INF-012), vector-memory(MOD-INF-011), audit-trail(MOD-INF-020),
                         agent-rbac(MOD-INF-018), rollback-system(MOD-INF-021),
                         drift-detector(MOD-INF-023), budget-enforcer(MOD-INF-024),
                         escalation-protocol(MOD-INF-022), system-telemetry(MOD-INF-015)]
    root_cause: >
      feedback_loop ↔ pipeline ↔ llm-security 形成致密三角，所有外围模块通过
      audit-trail ↔ database 接入该三角，外加 system-telemetry 的 db ↔ telemetry 回路，
      构成 23-节点全连通网格。
    recommendation: >
      分两步解网：
      Step A: 将外围模块对 audit-trail 的依赖全部迁至 EventBus（§3.1 已列出 5 条边），
      此步骤立即消除大量小循环。
      Step B: 对核心三角 (FLE ↔ pipeline ↔ llm-security) 实施架构重新设计——
      定义明确的 EventBus Topic 契约，将三角中的调用关系全部转为 subscribe/publish。
      此步骤为架构级决策，需 owner + 架构评审。
    estimated_after_step_a: "~10 cycles remaining"
    estimated_after_step_b: "0-3 cycles (含 LEGAL-001)"
```

