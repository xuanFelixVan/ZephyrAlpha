# Infrastructure Layer Dependency Rules

> module_id: GOV-ARCH-010 | version: 1.0.0 | status: active

---

## §1 术语定义

| 术语 | 定义 |
|------|------|
| DEPTH_0 边 | 物理部署必须同时存在的依赖关系。断则系统无法运行时初始化。 |
| DEPTH_1 边 | 运行时通过接口/EventBus/Shared 实现的调用关系，可重构。 |
| 合法循环 | 两个模块互为 DEPTH_0 依赖（如 database ↔ telemetry：db 记录遥测，遥测监控 db）。必须收敛、有限步长、可证明无分歧。 |
| EventBus 松耦合 | 替代直接 depends_on 的模式：生产者发事件到 Topic，消费者订阅，双方互不感知 module_id。 |
| shared-core | MOD-INF-019，位于 _cross_layer/，提供所有基础设施模块共用的类型、常量、异常、协议定义。 |

---

## §2 DEPTH_0 规则（不可断依赖）

以下 depends_on 边被视为 DEPTH_0——断掉则系统运行时初始化失败。这些边允许存在，不触发循环告警。

### §2.1 shared-core 依赖（所有模块均可单向依赖 shared-core）

```yaml
depth_0_shared_core:
  rule: "所有 infra/cross_layer 模块允许单向 depends_on MOD-INF-019 (shared-core)"
  justification: "shared-core 仅提供类型定义和常量，无运行时副作用，不产生循环"
  allowed_edges:
    - from: "MOD-INF-*"
      to: "MOD-INF-019"
      direction: unidirectional
```

### §2.2 基础运行时三元组（database + pipeline + telemetry）

```yaml
depth_0_runtime_triad:
  rule: "database ↔ system-telemetry 允许双向依赖（telemetry 记录到 db，db 健康受 telemetry 监控）"
  justification: "两个模块在系统启动时互为 bootstrap 依赖，有限步长收敛"
  allowed_edges:
    - from: "MOD-INF-012"
      to: "MOD-INF-015"
      bidirectional: true
      max_step: 2
      constraint: "telemetry 写 db 走 connection-pool 直写，不走 ORM"
```

### §2.3 合法循环白名单

```yaml
depth_0_legal_cycles:
  cycles:
    - id: "LEGAL-001"
      path: ["MOD-INF-012", "MOD-INF-015", "MOD-INF-012"]
      justification: "database ↔ system-telemetry 运行时 bootstrap 对"
      status: approved
      approved_by: owner
      approved_date: "2026-05-06"
```

