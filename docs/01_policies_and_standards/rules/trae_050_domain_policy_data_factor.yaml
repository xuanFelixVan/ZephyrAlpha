  dom_l02_001:
    section_type: rule
    title: 因子质量门控
    original_rules:
    - DOM-L02-001-ABS-001
    - DOM-L02-001-ABS-002
    - DOM-L02-001-ABS-003
    - DOM-L02-001-COND-001
    - DOM-L02-001-COND-002
    - DOM-L02-001-COND-003
    conditions:
    - type: constraint
      check: 四维质量检查：年化夏普≥1.0(扣费后) / 最大回撤≤15% / Rank IC均值≥0.03 / IC_IR≥0.5
      pass: 因子通过四维质量门控
      fail: 任一维度未达标，拒绝上线
    - type: constraint
      check: 实盘可行性：日均单边换手率≤30%(量价≤20%,基本面≤50%) / 策略容量/AUM≤5倍 / 计算延迟≤50ms
      pass: 因子通过实盘可行性检查
      fail: 未通过实盘可行性检查，拒绝上线
    - type: constraint
      check: 衰减监控：IC连续20日<0.01→decaying / 滚动60日夏普<0.3→underperforming / IC连续60日=0→deprecated / 相关系数从<0.3升至>0.7→converging
      pass: 因子无衰减信号
      fail: 触发衰减处置（降权/通知/退役）
    - type: constraint
      check: 市场状态回测：牛市夏普≥0.8 / 熊市最大回撤≤25% / 震荡IC均值≥0.02 / 极端行情最大回撤≤35%
      pass: 所有市场状态通过
      fail: 任一状态未通过→标记market_state_risk，拒绝上线
    actions:
    - type: mandatory
      step: ABS-001：因子上线前必须通过四维质量检查（收益能力/风险控制/预测能力/稳定性）
    - type: mandatory
      step: ABS-002：未通过质量门控的因子禁止进入prod环境，必须在因子注册表标记quality_gate:failed
    - type: mandatory
      step: ABS-003：因子上线前必须通过实盘可行性检查（换手率/容量/延迟）
    - type: mandatory
      step: COND-001：已上线因子必须持续监控衰减（IC衰减/夏普衰减/完全失效/相关性漂移）
    - type: mandatory
      step: COND-002：新因子上线前必须执行准入流程：回测验证(≥3年)→样本外测试(≥6月)→四维质量检查→实盘可行性检查→相关性检查(<0.7)→Owner审批
    - type: mandatory
      step: COND-003：回测必须覆盖牛市/熊市/震荡/极端行情四种市场状态
    prohibitions:
    - 禁止上线未通过四维质量检查的因子
    - 禁止不执行实盘可行性检查即上线因子
    - 禁止衰减因子继续以原权重运行
    - 禁止跳过市场状态分段回测
    - 禁止上线与现有因子相关性>0.7的新因子
  dom_l02_002:
    section_type: rule
    title: 因子入职操作手册
    original_rules:
    - DOM-L02-002
    conditions:
    - type: constraint
      check: 样本外偏差<30%（回测vs样本外）
      pass: 样本外测试通过
      fail: 标记overfitting，返回Step1
    - type: constraint
      check: 与现有因子相关系数<0.7
      pass: 相关性检查通过
      fail: 标记redundant，考虑合并或替换
    - type: constraint
      check: 灰度发布每阶段通过标准：因子信号日变化率<50% / 收益率在回测±2σ内 / 无风控事件触发
      pass: 灰度阶段通过
      fail: 降回上一阶段权重，排查原因
    actions:
    - type: mandatory
      step: Step1：在src/zephyr/factors/下创建因子类，实现calculate()/get_metadata()，编写单元测试
    - type: mandatory
      step: Step2：使用至少3年历史数据回测，计算四维质量指标，确认所有维度达标
    - type: mandatory
      step: Step3：使用最近6个月数据进行样本外测试，确认偏差<30%
    - type: mandatory
      step: Step4：计算与现有因子相关系数矩阵，确认<0.7
    - type: mandatory
      step: Step5：灰度发布1%→5%→20%→50%→100%，每阶段至少10个交易日
    - type: mandatory
      step: Step6：在因子注册表(待创建)注册（因子ID/名称/类型/回测指标/换手率/容量/质量门控状态），验证延迟≤50ms，配置衰减监控和告警
    prohibitions:
    - 灰度发布涉及实盘配置变更，禁止AI自动执行（必须Owner手动）
    - 回滚涉及活跃因子配置变更，禁止AI自动执行（必须Owner手动）
