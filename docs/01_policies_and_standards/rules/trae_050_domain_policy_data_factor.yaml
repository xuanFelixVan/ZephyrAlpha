    section_type: procedure
    title: 因子入职操作步骤
    original_rules:
    - DOM-L02-002-§2
    steps:
    - order: 1
      action: 在src/zephyr/factors/下创建因子类，实现calculate()/get_metadata()，编写单元测试
      pre_condition: 因子概念已确认
      expected_result: 因子代码+单元测试完成
      on_failure: 修复代码问题
    - order: 2
      action: 使用至少3年历史数据回测，计算四维质量指标，确认所有维度达标
      pre_condition: 因子代码完成
      expected_result: 年化夏普≥1.0/最大回撤≤15%/Rank IC≥0.03/IC_IR≥0.5
      on_failure: 标记quality_gate:failed，返回Step1
    - order: 3
      action: 使用最近6个月数据进行样本外测试，确认偏差<30%
      pre_condition: 回测通过
      expected_result: 样本外偏差<30%
      on_failure: 标记overfitting，返回Step1
    - order: 4
      action: 计算与现有因子相关系数矩阵，确认<0.7
      pre_condition: 样本外测试通过
      expected_result: 所有关联系数<0.7
      on_failure: 标记redundant，考虑合并或替换
    - order: 5
      action: 灰度发布1%→5%→20%→50%→100%，每阶段至少10个交易日
      pre_condition: 相关性检查通过
      expected_result: 每阶段因子信号日变化率<50%/收益率在回测±2σ内/无风控事件
      on_failure: 降回上一阶段权重，排查原因
    - order: 6
      action: 在因子注册表(待创建)注册+验证延迟≤50ms+配置衰减监控和告警
      pre_condition: 灰度发布完成
      expected_result: 注册完成+监控就绪
      on_failure: 检查注册表格式和监控配置
