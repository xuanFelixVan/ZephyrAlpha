rule_id: TRAE-046
title: 工程治理-代码重组安全
version: 1.0.6
layer: L1_foundation
module_id: TRAE-046
depends_on: []
tags:
- TRAE
- engineering_code_restructure
- L1
ttl: permanent
stability: stable
safety_level: H
ai_autonomy: human_gated
aliases:
- GOV-ENG-004
severity: error
scope: engineering_code_restructure
domain: TRAE
triggers:
- operation: code_merge
- operation: code_split
- operation: code_migration
- operation: code_rename
sections:
  gov_eng_004_s1:
    title: 安全搬家铁律(9条)
    section_type: rule
    original_rules:
    - GOV-ENG-004
    conditions:
    - type: pre_condition
      check: 执行前是否重新扫描目标文件的所有import引用
      pass: 'Grep工具: pattern=''from zephyr.目标模块'' path=''src/'' output_mode=''content'' -n=true 输出完整引用清单'
      fail: 蓝图记录可能过时，必须现场确认
    - type: pre_condition
      check: 是否确认无未提交变更
      pass: git status working tree clean
      fail: 有未提交变更
    actions:
    - type: mandatory
      step: 执行前必须重新扫描目标文件的所有import引用
    - type: mandatory
      step: 重复文件合并必须逐条做价值分析
    - type: mandatory
      step: 合并后必须验证内容完整性（对比合并前后的class/function列表）
    - type: mandatory
      step: "import更新必须全量验证（Grep工具: pattern='from zephyr.旧路径' path='src/' output_mode='files_with_matches' 返回零结果）"
    - type: mandatory
      step: 一次只搬一个文件
    - type: mandatory
      step: 搬完一个验证一个（pytest tests/相关目录/ 返回0 failed）
    - type: mandatory
      step: 每步必提交
    - type: mandatory
      step: 安全优先，速度第二
    - type: mandatory
      step: 做完一个，更新一个蓝图（重组+蓝图更新是原子操作）
    prohibitions:
    - 禁止批量合并多个重复文件
    - 禁止批量延迟更新蓝图
    - 禁止"看起来一样就直接删"——必须用Read工具对比确认
    - 禁止迁移/重构后只清理使用点不清理定义点——改了sqlite3.connect(X)为get_db_connection()后，X常量定义MUST同步清理（实证：P2迁移 auto_runner.py _DEPGRAPH_DB 死代码残留与 depgraph_schema.DB_PATH 真源分裂）
  gov_eng_004_s2:
    title: 重复文件价值分析方法论(5步)
    section_type: rule
    original_rules:
    - GOV-ENG-004
    conditions:
    - type: constraint
      check: 同名文件内容对比
      pass: Read工具对比标记差异完成
      fail: 未做内容对比
    actions:
    - type: mandatory
      step: 步骤1：用Read工具对比两个同名文件，标记差异
    - type: mandatory
      step: 步骤2：分类判定（完全相同/re-export wrapper/版本分叉/同名不同功能）
    - type: mandatory
      step: 步骤3：价值提取——列出A/B独有class/function+共有但实现不同的
    - type: mandatory
      step: 步骤4：归并决策（独有→迁移真源/共有→保留更完整/全部独有→保留并重命名）
    - type: mandatory
      step: 步骤5：验证——归并后对比class/function列表确认无遗漏
    prohibitions: []
  gov_eng_004_s3:
    title: 强制安全协议
    section_type: rule
    original_rules:
    - GOV-ENG-004
    conditions:
    - type: pre_condition
      check: Pre-flight Scan 3项全通过
      pass: import引用完整+蓝图记录偏差<5%+working tree clean
      fail: 任一项未通过
    actions:
    - type: mandatory
      step: 'Pre-flight: 扫描目标文件import引用+确认与蓝图记录一致+确认无未提交变更'
    - type: mandatory
      step: '执行中: 一次只操作1个文件+每步操作后立即验证+验证通过后立即提交'
    - type: mandatory
      step: 'Post-merge: 旧import路径零残留+class/function列表完整性+相关测试全部通过'
    prohibitions:
    - 禁止批量操作
    - 禁止验证未通过就提交
  gov_eng_004_preflight_verify:
    title: Pre-flight Scan验证流程
    section_type: verification
    original_rules:
    - GOV-ENG-004
    items:
    - step: 扫描目标文件的所有import引用
      command: 'Grep工具: pattern=''from zephyr.目标模块'' path=''src/'' output_mode=''content'' -n=true'
      expected_exit: 0
      on_fail: 输出完整引用清单，无遗漏
    - step: 确认目标文件与蓝图记录一致
      command: Read工具读取目标文件确认行数与蓝图记录偏差
      expected_exit: 0
      on_fail: 行数与蓝图记录偏差>=5%
    - step: 确认无未提交变更
      command: git status
      expected_exit: 0
      on_fail: working tree not clean——必须先提交或stash
  gov_eng_004_postmerge_verify:
    title: Post-merge Verify验证流程
    section_type: verification
    original_rules:
    - GOV-ENG-004
    items:
    - step: 旧import路径零残留
      command: 'Grep工具: pattern=''from zephyr.旧路径'' path=''src/'' output_mode=''files_with_matches'''
      expected_exit: 1
      on_fail: 仍有旧import残留——必须更新
    - step: class/function列表完整性
      command: 'Grep工具: pattern=''^class |^def '' path=''目标文件'' output_mode=''content'' -n=true 对比合并前后'
      expected_exit: 0
      on_fail: 仅新增项允许，无删除项——有删除=遗漏
    - step: 相关测试全部通过
      command: pytest tests/相关目录/
      expected_exit: 0
      on_fail: 测试失败——必须修复
    - step: 被替换的常量/变量定义点零残留
      command: 'Grep工具: pattern=''被替换的常量名'' path=''src/'' output_mode=''content'' -n=true 确认无死代码定义'
      expected_exit: 1
      on_fail: 迁移/重构后遗留死代码定义点——MUST删除无引用的常量/变量定义，避免真源分裂（实证：P2迁移 auto_runner.py _DEPGRAPH_DB 死代码残留）
  gov_eng_004_taskcard_template:
    title: 任务卡安全条款模板
    section_type: examples
    original_rules:
    - GOV-ENG-004
    items:
    - description: acceptance_criteria模板
      details: '旧import路径零残留: Grep工具: pattern=''from zephyr.旧路径'' path=''src/'' output_mode=''files_with_matches'' 返回零结果; class/function列表完整性: 合并后对比无遗漏; 相关测试通过: pytest tests/相关目录/ 返回0 failed'
    - description: applicable_rules模板
      details: 'GOV-ENG-004 §1 安全搬家铁律 #1-#9; GOV-ENG-004 §2 价值分析方法论 步骤1-5; GOV-ENG-004 §3 强制安全协议 Pre-flight + 执行中 + Post-merge'
  gov_eng_004_classification_decision:
    title: 重复文件分类判定决策树
    section_type: decision_tree
    original_rules:
    - GOV-ENG-004
    items:
    - condition: Read工具对比结果为0差异
      if_true: 完全相同——保留1份，其余标记deprecated
      if_false: 继续检查
    - condition: 顶行含Backward-compatible alias或re-export
      if_true: re-export wrapper——保留真源，wrapper标记deprecated
      if_false: 继续检查
    - condition: 有实质差异但有共享类名
      if_true: 版本分叉——进入价值提取(步骤3)
      if_false: 同名不同功能——两个都保留，重命名消除歧义
  gov_eng_004_merge_decision:
    title: 归并决策树
    section_type: decision_tree
    original_rules:
    - GOV-ENG-004
    items:
    - condition: 独有功能(仅A或仅B有)
      if_true: 迁移到真源文件
      if_false: 继续检查
    - condition: 共有功能(两者都有但实现不同)
      if_true: 保留更完整的版本，删除冗余版本
      if_false: 继续检查
    - condition: 全部独有(A和B功能完全不同)
      if_true: 两个文件都保留，重命名
      if_false: 无效场景
  gov_eng_004_source_truth_mapping:
    title: 真源声明映射(GOV-FSTR-001重组结果)
    section_type: examples
    original_rules:
    - GOV-ENG-004
    items:
    - description: EventBus
      details: '真源: shared/event_bus.py | 废弃: core/events/event_bus.py | 状态: 已合并'
    - description: KillSwitch
      details: '真源: shared/kill_switch.py | 废弃: 4个副本 | 状态: 已合并'
    - description: SafetyGate
      details: '真源: feedback_loop/gates/parameterized_safety_gate.py | 废弃: 所有safety_gate_L*.py | 状态: 已参数化'
    - description: PipelineOrchestrator拆分
      details: '2541行→7组件: PipelineOrchestrator/ModelRouter/CircuitBreakerManager/CostTracker/DeadLetterQueue/PreemptionManager/PipelineLock'
    - description: DriftEngine拆分
      details: '2134行→5组件: DriftEngine/DriftInfrastructure/AIConstructionDetectors/DriftResultTypes/DriftTraining'
  gov_eng_004_scope:
    title: 适用范围
    section_type: context
    original_rules:
    - GOV-ENG-004
    summary: 代码重组安全策略适用于跨目录重复文件合并、大文件拆分、版本分叉归一、模块迁移、re-export shim创建
    impact_on_rules: 任何涉及代码搬家的操作必须遵守本策略
    key_decisions:
    - 一次只搬一个文件是原子操作底线
    - 重组+蓝图更新是不可分割的原子操作
    - 安全优先速度第二
  gov_eng_004_cross_refs:
    title: 交叉引用
    section_type: context
    original_rules:
    - GOV-ENG-004
    summary: 代码重组安全策略依赖代码构建标准(GOV-ENG-001)和文件操作安全策略(GOV-DOC-007)
    impact_on_rules: 重组后代码必须符合GOV-ENG-001构建规范
    key_decisions:
    - GOV-DOC-007的三问三步是删除/移动文件的前置条件
    - IRN-003 SSoT唯一+IRN-004断链清零是重组的约束
    - '消费者: gate_engine(CheckType: restructuring_safety)/task-card-standard/drift_detector/construction_verifier'
