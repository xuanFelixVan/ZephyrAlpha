rule_id: TRAE-001
title: 文件操作安全协议
version: 1.6.0
layer: L1_foundation
module_id: TRAE-001
depends_on: []
tags:
- TRAE
- file_operation
- L0
ttl: permanent
stability: frozen
safety_level: H
ai_autonomy: immutable_core
aliases:
- RULE-ZERO
- RULE-ONE
- RULE-THREE
- RULE-FOUR
- RULE-FIVE
- RULE-FOURTEEN
- 文件锁
- 原子写入
- 删除审判
- 创建入口
- 零残留
- 根目录清爽
severity: critical
scope: file_operation
domain: TRAE
triggers:
- operation: file_write
- operation: file_create
- operation: file_delete
- operation: db_write
- gate_id: G0
sections:
  file_lock_protocol:
    section_type: procedure
    title: 文件锁协议
    original_rules:
    - RULE-ZERO
    conditions:
    - type: pre_condition
      check: python scripts/lock_files.py check <file>
      pass: 文件 FREE，可获取锁
      fail: 文件被锁定，STOP
    actions:
    - type: mandatory
      step: 写入前 check → acquire → 写入 → release
    - type: mandatory
      step: 批量操作：先全部 check → 全部 FREE 后逐个 acquire → 全部改完逐个 release
    - type: mandatory
      step: 'session_id 格式: session-YYYYMMDD-NNN'
    prohibitions:
    - 跳过 check 直接写文件
    - check 返回 LOCKED 后仍然写文件
    - 用 Write 工具绕过 lock_files.py
    - 写完后不执行 release（死锁）
  ttl_design:
    section_type: rule
    title: TTL 设计说明（3 处文件锁 TTL 一致 + session TTL 差异化）
    original_rules: []
    conditions:
    - type: pre_condition
      check: 'lock_files.DEFAULT_TTL_S / session_concurrency.LOCK_TTL_SECONDS / staging_area._TTL_SECONDS 是否一致？'
      pass: 文件锁 TTL=1800s 一致（3 处）
      fail: 强行统一会破坏设计
    actions:
    - type: mandatory
      step: '文件锁 TTL=1800s（30min，AI 对话级锁）：lock_files.DEFAULT_TTL_S / session_concurrency.LOCK_TTL_SECONDS / staging_area._TTL_SECONDS 三处一致。session TTL=3600s（1h，session 生命周期，比单次锁长，差异化设计合理，禁止统一）。stale 判定先查 PID 存活（is_pid_alive 真源唯一 process_pool.py），PID 已死立即清理，不靠 TTL 过期。'
    prohibitions:
    - 强行统一文件锁 TTL 与 session TTL（用途不同，差异化设计合理）
    - 在代码中硬编码 TTL 常量而不引用本 YAML ttl_design section（漂移源）
    - 本地重复定义 _pid_alive（AGENTS.md §8 is_pid_alive 真源声明，真源唯一 process_pool.is_pid_alive）
  atomic_write:
    section_type: procedure
    title: Python脚本并发写入安全
    original_rules:
    - RULE-ONE
    conditions:
    - type: pre_condition
      check: 脚本产出文件
      pass: 适用原子写入模式
      fail: 不适用
    actions:
    - type: mandatory
      step: tmp_path=f'{OUTPUT_PATH}.{os.getpid()}.tmp' → open(tmp_path,'w',encoding='utf-8') → os.replace(tmp_path,OUTPUT_PATH)
    prohibitions:
    - 脚本中 open(fixed_path, 'w') 直接写最终文件
    - Path.write_text(fixed_path) 直接写
    - 新写脚本跳过原子写入模式
  db_write_protocol:
    section_type: procedure
    title: 数据库写入协议（文件写/DB 写区分，P2 PG 迁移治本 2026-06-29）
    original_rules: []
    conditions:
    - type: pre_condition
      check: 写入目标是 PostgreSQL 数据库（depgraph/governance 等）？
      pass: 适用 DB 写协议（PG 事务保护，禁用文件锁）
      fail: 回退文件锁协议（file_lock_protocol）
    actions:
    - type: mandatory
      step: 'DB 写入通过 PG MVCC 事务保护（BEGIN/COMMIT/ROLLBACK），禁止调用 lock_files.py。连接入口：depgraph 用 get_depgraph_pg_connection()，governance 用 get_governance_connection()。真源指针：trae_054 §mandatory "depgraph 写入禁用 lock_files.py"'
    - type: mandatory
      step: '批量 DB 写入用 apply_depgraph.py --batch（内置事务回滚）。脚本中直接写 DB 须用 with 事务块：with conn: cursor.execute(...)（异常自动 ROLLBACK）'
    prohibitions:
    - 在 DB 写入路径调用 lock_files.py（PG MVCC 替代文件锁，文件锁对 PG 写无保护作用）
    - 硬编码 sqlite3.connect("绝对路径.db")（GitCommitGateway _check_repo_root_usage 模式5 检测阻断）
    - 在 DB 写入脚本中 import lock_files（GitCommitGateway _check_repo_root_usage 模式6 AST 检测阻断：同一文件内 DB 写入信号 + lock_files import 信号 → 返回 REPO_ROOT_VIOLATION，--no-verify 绕不过）
    exceptions:
      file_write_fallback: '若写入目标是文件（非 DB），回退 file_lock_protocol + atomic_write 双重保护 ✅'
  delete_confirmation:
    section_type: procedure
    title: 删除前置确认
    original_rules:
    - RULE-THREE
    conditions:
    - type: pre_condition
      check: 文件在 manifest/registry/__init__.py 中被引用？
      pass: 有价值，不能删
      fail: 进入 STEP 2
    - type: pre_condition
      check: 有另一个文件与它内容完全相同且已注册？
      pass: 真正重复，可删
      fail: 进入 STEP 3
    actions:
    - type: mandatory
      step: 'STEP 1: 登记检查 → STEP 2: 重复检查 → STEP 3: 逐行价值检查'
    - type: mandatory
      step: 临时文件也须过 STEP 3
    prohibitions:
    - 跳过审判三步直接删除
    - 看到文件名像临时就直接删
    - 批量删除时不对每个文件逐一审判
    - 删除后不检查废墟引用
    - 用零消费者判定删除（零消费者≠无价值）
  create_and_register:
    section_type: procedure
    title: 创建即注册
    original_rules:
    - RULE-FOUR
    conditions:
    - type: pre_condition
      check: python scripts/scaffold.py module/script/gate ...
      pass: 文件创建并注册
      fail: 绕过 scaffold = 孤儿
    actions:
    - type: mandatory
      step: scaffold.py module <pkg> <name> → 创建模块+注册 __init__.py
    - type: mandatory
      step: scaffold.py script <path> → 创建脚本+注册 script-manifest.yaml
    - type: mandatory
      step: scaffold.py gate <id> → 创建门禁+注册 _registry.yaml
    prohibitions:
    - 用 Write/SearchReplace 直接创建新文件
    - 绕过 scaffold 创建后事后补注册
    - 创建后不验证 scaffold 输出的导入命令
    - 跳过 SSoT 冲突检查直接创建
  zero_residue:
    section_type: rule
    title: 临时文件零残留
    original_rules:
    - RULE-FIVE
    conditions:
    - type: pre_condition
      check: python scripts/lock_files.py status
      pass: 无临时文件残留
      fail: 发现临时文件必须先处置
    actions:
    - type: mandatory
      step: 有持续价值 → 归档到标准目录+注册；一次性 → 物理删除
    - type: mandatory
      step: session 关闭前必须完成临时文件处置
    prohibitions:
    - 在根目录创建临时 .py/.yaml/.json 脚本
    - session 关闭时根目录仍有 _temp* 等文件
    - 留'可能以后有用'的临时文件
    - 跳过每日安检直接开工
  root_directory_cleanliness:
    section_type: rule
    title: 根目录清爽铁律
    original_rules:
    - RULE-FOURTEEN
    conditions:
    - type: pre_condition
      check: ls 根目录 → 逐项对照白名单
      pass: 所有项在白名单中
      fail: 不在白名单中的=垃圾，删除或归档
    actions:
    - type: mandatory
      step: session 关门时强制根目录审计（AIR-001）
    - type: mandatory
      step: 系统生成根目录文件必须配套 TTL/上限/轮转策略（AIR-002）
    - type: mandatory
      step: 创建目录时 MUST 同时写入内容（禁止 mkdir-only）
    - type: mandatory
      step: 每次检查生成报告用 O(1) 文件（覆盖写入/追加单日志/写数据库）
    prohibitions:
    - 在根目录创建永久性 .py/.md/.yaml/.json/.txt 文件（应放到 scripts/docs/tests/ 等标准目录）
    - 在根目录创建子目录（_temp*/_check*/新名字）
    - session 结束时根目录仍有临时文件残留
    - 创建空目录而不填充（meta/tasks/results/cache/ 等）
    - 每次检查生成独立报告文件（如 truth_source_cascade 轰炸 300+ 个）
    - Skill 查找失败后持久化 NONEXISTENT-SKILL_*.json
    - 自动保存 AI 会话提示词到 _prompts/
    whitelist:
      ide_config: ['.editorconfig', '.traeignore', '.vscode/']
      ai_rules: ['.trae/', 'AGENTS.md']
      version_control: ['.gitignore', '.gitattributes']
      cicd: ['.pre-commit-config.yaml', '.github/']
      arch_constraint: ['.importlinter']
      python: ['pyproject.toml', 'requirements.txt', 'requirements-dev.txt', 'requirements-demo.txt', 'py.ini']
      runtime_config: ['.env.example', 'config/']
      docker: ['Dockerfile', 'docker-compose.yml']
      project_docs: ['README.md', 'LICENSE', 'CONTRIBUTING.md', 'SECURITY.md']
      source_dirs: ['src/', 'scripts/', 'tests/', 'tools/']
      docs: ['docs/', 'architecture_model/', 'specs/']
      data: ['data/', 'models/', 'infra/', 'demos/', 'session_logs/']
      runtime_auto: ['.ailocks/', '.aidrafts/', '.audit_cache/', '.mypy_cache/', '.ruff_cache/', '.runtime/', '.zephyr/', '.zephyr_secure/', 'logs/', 'reports/', '_journals/']
  change_history:
    section_type: examples
