rule_id: TRAE-084
title: pre-commit hook 增量守门纪律铁律（Pre-commit Incremental Discipline）
name: pre-commit hook 增量守门纪律铁律
version: '1.0.0'
layer: L1_foundation
module_id: TRAE-084
priority: 51
