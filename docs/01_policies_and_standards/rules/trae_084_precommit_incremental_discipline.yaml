- TRAE-073
tags:
- TRAE
- precommit_incremental
- L1_foundation
- incremental_gate
- audit_separation
- staged_files_only
- no_full_repo_scan
stability: stable
safety_level: M
ai_autonomy: human_gated
ttl: permanent
severity: high
scope: precommit_incremental_discipline
domain: TRAE
triggers:
- operation: precommit_config_edit
- operation: git_commit_invocation
