# ── 原有规则段（保留不变） ──────────────────────────────────────────────────

sections:
  capability_lookup_scene_classify:
    section_type: procedure
    title: capability lookup bypass 场景分类铁律（RULE-CAPABILITY-LOOKUP-SCENE-CLASSIFY）
    original_rules:
    - RULE-CAPABILITY-LOOKUP-SCENE-CLASSIFY
    - 裁定 #ARCH-CAPABILITY-LOOKUP-SCENE-CLASSIFY-001
    - 扩展 #ARCH-CAPABILITY-LOOKUP-BYPASS-DEAD（6 层闭环——可预防性精确化）
    - 扩展 #ARCH-PREVENTABILITY-LAYER-001（TRAE-068 第 6 层——告警准确性）
    - 扩展 #ARCH-066（v2.0.0——共享模块 + gate-time 白名单检查 + YAML 数据真源）
    conditions:
    - type: trigger
      check: CAPABILITY-LOOKUP-HEALTH reconciler 统计 bypass 频率时
      pass: reason 含白名单关键词 → 豁免统计（scene=exempt，不计入 violation_count）
      fail: reason 不含白名单关键词 → 计入违规统计（scene=violation，计入 violation_count）
    - type: constraint
      check: critical_warn 阈值判断
      pass: violation_count > 5（最近窗口内违规 bypass 超 5 次）→ critical_warn
      fail: violation_count <= 5（合法豁免不计入）→ clean/warn
    - type: constraint
      check: '#ARCH-066 gate-time 白名单检查（v2.0.0 新增）'
      pass: reason 含白名单关键词 → gate 放行（零摩擦逃生通道保留）
      fail: reason 不含白名单关键词 → gate 硬阻断（需 ZEPHYR_BYPASS_LOOKUP=1 高摩擦逃生）
    - type: maintenance
      check: 新增合法 bypass 场景时
      pass: MUST 同步更新 bypass_exempt_keywords 段（本 YAML）——load_bypass_policy() 自动加载
      fail: 仅更新代码不更新 YAML → 白名单真源漂移
    actions:
    - type: mandatory
      step: '铁律1: CAPABILITY-LOOKUP-HEALTH reconciler MUST 按 bypass_exempt_keywords 白名单分类 bypass——合法 bypass（exempt）豁免统计，违规 bypass（violation）计入统计'
    - type: mandatory
      step: '铁律2: critical_warn 阈值基于 violation_count（违规 bypass 数量），非 bypass_count（总 bypass 数量）——合法 bypass 不触发 critical_warn'
    - type: mandatory
      step: '铁律3: bypass_audit.jsonl entry MUST 包含 scene 字段（exempt/violation）——便于审计追溯场景分类判定'
    - type: mandatory
      step: '铁律4（v2.0.0 更新）: 新增合法 bypass 场景时 MUST 同步更新本 YAML 的 bypass_exempt_keywords 段——capability_lookup_bypass_policy.py 通过 load_bypass_policy() fail-open 加载此段。单一真源是 YAML（trae_062 规则数据分类），代码常量仅 fail-open 兜底'
    - type: mandatory
      step: '铁律5: 白名单关键词匹配使用大小写不敏感的子串匹配（reason_lower contains keyword），且 reason 归一化（_ → -）后匹配——容忍 reason 格式变体（#ARCH-066 改进）'
    - type: mandatory
      step: '铁律6: 旧格式 [no-lookup:reason] 向后兼容——reason 不含白名单关键词时 gate 硬阻断（v2.0.0 升级，原 v1.0.0 仅 reconciler 统计层分类）'
    - type: mandatory
      step: '铁律7（v2.0.0 新增）: gate（CAPABILITY-LOOKUP-REQUIRED）和 reconciler（CAPABILITY-LOOKUP-HEALTH）MUST 共用 capability_lookup_bypass_policy 共享模块——禁止各自定义白名单/阈值/标记前缀（消除双真源）'
    - type: forbidden
      step: '禁止: 把合法 bypass（gate-fix/test-fix/merge-prep/continuation 等）计入违规统计——会导致 critical_warn 误报（狼来了效应）'
    - type: forbidden
      step: '禁止: 仅更新代码白名单不更新 trae_077 YAML——白名单真源漂移会导致 AI 不知道哪些 reason 合法'
    - type: forbidden
      step: '禁止（v2.0.0 新增）: gate 和 reconciler 各自定义 [no-lookup: 标记前缀/白名单/阈值——MUST 通过共享模块共用（#ARCH-066 消除双真源）'
    examples:
    - scenario: gate-fix bypass 豁免统计（合法场景）
      正确: AI 修复 gate bug → commit msg 含 [no-lookup:gate-fix-xxx] → gate 白名单匹配 "gate-fix" → 放行 → reconciler scene=exempt → 不计入 violation_count → clean
      错误: AI 修复 gate bug → commit msg 含 [no-lookup:gate-fix-xxx] → gate 不检查白名单 → 零摩擦放行 → reconciler 不分类 → 计入 bypass_count → 误报 critical_warn
      reason: gate 自身代码变更天然不适用规则反查——gate-fix 是合法 bypass，gate 和 reconciler 均应豁免
    - scenario: 新功能开发 bypass 阻断（违规场景，v2.0.0 升级）
      正确: AI 写新功能未查规则 → commit msg 含 [no-lookup:new-feature-xxx] → gate 白名单不匹配 → 硬阻断（需 ZEPHYR_BYPASS_LOOKUP=1 高摩擦逃生）
      错误: AI 写新功能未查规则 → commit msg 含 [no-lookup:new-feature-xxx] → gate 零摩擦放行 → 违规被淹没
      reason: 新功能开发 MUST 查规则——违规 bypass 应在 gate 层阻断，不应等到 post-commit 才告警
    - scenario: 归一化匹配（v2.0.0 新增）
      正确: AI commit msg 含 [no-lookup:root_cause_fix] → 归一化 _ → - → 匹配 "root-cause" → gate 放行 + reconciler scene=exempt
      错误: AI commit msg 含 [no-lookup:root_cause_fix] → 不归一化 → 不匹配 "root-cause" → gate 阻断 + reconciler scene=violation
      reason: reason 格式变体（_ vs -）不应导致匹配失败——归一化提高白名单命中率
    - scenario: 白名单维护（新增合法场景）
      正确: 发现新的合法场景 → 更新本 YAML 的 bypass_exempt_keywords 段 → load_bypass_policy() 自动加载 → gate 和 reconciler 同步生效
      错误: 发现新的合法场景 → 仅更新代码常量 → YAML 漂移 → 其他 AI 不知道合法 reason 列表
      reason: 白名单单一真源——YAML（trae_062 规则数据分类），代码常量仅 fail-open 兜底
    common_mistakes:
    - '❌ 把所有 [no-lookup:] bypass 一视同仁计入统计——合法 bypass 误报 critical_warn（狼来了效应）'
    - '❌ 更新代码白名单不更新 trae_077 YAML——白名单真源漂移'
    - '❌ 白名单关键词过大写敏感——reason 格式变体导致匹配失败'
    - '❌ critical_warn 阈值基于 bypass_count 而非 violation_count——合法 bypass 触发误报'
    - '❌（v2.0.0）gate 和 reconciler 各自定义 [no-lookup: 标记/白名单/阈值——双真源漂移'
    - '❌（v2.0.0）gate 零摩擦放行非白名单 reason——应在 gate 层阻断，而非等到 post-commit'
    background:
      source: 2026-07-22 裁定 #ARCH-CAPABILITY-LOOKUP-SCENE-CLASSIFY-001 + #ARCH-066
      rationale: |
        #ARCH-CAPABILITY-LOOKUP-BYPASS-DEAD 治本建立了 CAPABILITY-LOOKUP-REQUIRED gate
        （priority=110）+ CAPABILITY-LOOKUP-HEALTH reconciler（priority=220）的 6 层闭环。
        但 reconciler 的 bypass 频率统计存在场景分类缺陷——把所有 [no-lookup:reason]
        bypass 一视同仁计入统计，不区分"新功能开发违规 bypass"与"合法运维场景 bypass"。

        实证（bypass_audit.jsonl 最近 10 条记录全部分析）：
        全部 10+ 条记录均为合法场景（gate-fix/test-fix/merge-prep/continuation/
        investigated/auto-fix/batch-treatment/batch-governance/architectural-refactor/sync），
        无一例"AI 跳过能力反查直接施工新功能"违规。但触发 critical_warn 误报。

        病根（TRAE-068 第 6 层可预防性违反）：
        critical_warn 误报违反"可预防性"——告警准确性是可预防性的前提。误报导致 AI 对
        critical_warn 脱敏（狼来了效应），当真正违规发生时 AI 可能忽视告警。100% AI 场景下
        无人类视觉通道过滤误报，告警 MUST 精确——只在真正违规时触发。

        #ARCH-066 治本（v2.0.0，2026-07-22）：
        结构性不对称——gate-time 逃生通道 [no-lookup:any-string] 零摩擦放行（任何非空
        reason 都通过），而 post-commit reconciler 只能观察不能阻断。治本方案：
        ① 创建共享 bypass 策略模块（capability_lookup_bypass_policy.py）——gate 和
          reconciler 共用白名单/阈值/标记前缀，消除双真源
        ② gate-time 白名单检查——非白名单 reason 硬阻断（不再零摩擦放行）
        ③ trae_077 YAML 升级为结构化数据真源——load_bypass_policy() 从本文件加载
          白名单关键词 + 阈值（fail-open 到默认值）

        白名单关键词清单（16 项，单一真源——本 YAML bypass_exempt_keywords 段）：
        原有 10 项（v1.0.0）：gate-fix/test-fix/merge-prep/continuation/investigated/
        auto-fix/batch-treatment/batch-governance/architectural-refactor/sync
        扩充 6 项（v2.0.0，基于 bypass_audit.jsonl 实证）：
        mechanical/completing/research/bugfix/root-cause/调研

        与现有裁定的关系：
        - 扩展 #ARCH-CAPABILITY-LOOKUP-BYPASS-DEAD（父裁定）：该裁定建立 6 层闭环，
          但 reconciler 统计层缺场景分类——v1.0.0 补；gate 层缺白名单检查——v2.0.0 补
        - 扩展 #ARCH-PREVENTABILITY-LAYER-001（TRAE-068）：第 6 层可预防性要求告警精确，
          误报导致 AI 脱敏——v1.0.0 治本告警准确性；v2.0.0 治本 gate-time 阻断
        - #ARCH-066：v2.0.0 共享模块 + gate-time 白名单 + YAML 数据真源
      related_arch: '#ARCH-CAPABILITY-LOOKUP-SCENE-CLASSIFY-001, #ARCH-CAPABILITY-LOOKUP-BYPASS-DEAD (父裁定), #ARCH-PREVENTABILITY-LAYER-001 (TRAE-068 第 6 层), #ARCH-066 (v2.0.0 共享模块)'

