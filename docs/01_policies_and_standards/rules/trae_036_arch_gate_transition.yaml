  gov_arch_006_exemption:
    section_type: procedure
    title: 豁免机制
    original_rules:
    - GOV-ARCH-006
    - GATE-010
    steps:
    - order: 1
      action: 资格判定——仅Project Owner可签发豁免，AI禁止自行签发；GOV-P0红线（编码损坏、锚点文件删除）不可豁免
      pre_condition: 门禁检查失败且需豁免
      expected_result: Owner确认签发
      on_failure: 非Owner签发则无效
    - order: 2
      action: commit trailer签发——格式gate-exempt:G{N}-C{NN}|reason:...|valid_until:YYYY-MM-DD，valid_until最多30天
      pre_condition: Owner确认签发
      expected_result: commit message包含合规trailer
      on_failure: trailer格式不合规则豁免无效
    - order: 3
      action: 副作用记录——(1)gates.details.exempted_by记录trailer(2)events表追加exemption事件(3)月度审计高亮豁免>3次触发复盘
