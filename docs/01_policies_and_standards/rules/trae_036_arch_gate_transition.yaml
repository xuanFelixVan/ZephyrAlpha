        - 定义HiL审核流程

        '
      language: yaml
      note: 初版发布
  gov_arch_006_v1_v2_diff:
    section_type: context
    title: v1→v2关键修订
    original_rules:
    - GOV-ARCH-006
    summary: 门禁策略从v1到v2的5项关键修订
    impact_on_rules: 所有门禁YAML和代码需同步更新
    key_decisions:
    - 5级门禁语义——从3级(PASS/WARN/FAIL)改为5级(G1~G5)串行门禁体系
    - 与代码一致性——YAML定义与GateEngine代码实现双向对齐
    - 与task_repo集成——门禁结果写入gates表+events表，task状态转换受门禁结果驱动
    - YAML schema不一致——统一gate_name为机读slug，消除name/title混用
    - severity语义——YAML侧只允许error/critical/warning/warn/info，P0/P1/P2只在代码内部
    - checks vs entry_conditions——entry_conditions为权威字段，checks为过渡期兼容别名
  gov_arch_006_kms_pipeline:
    section_type: procedure
    title: KMS知识管道5阶段
    original_rules:
    - GOV-ARCH-006
    - GATE-001
    steps:
    - order: 1
      action: G1 Ingest——外部文档进入管道，检查文件格式/编码/frontmatter
      pre_condition: 文档被标记为待吸入
      expected_result: 合格文档进入IN_PROGRESS状态
      on_failure: P0失败→reject回滚保持PENDING
    - order: 2
      action: G2 Triage——分类评估，检查内容完整性/分类标签/优先级
      pre_condition: G1通过
      expected_result: 文档分类完成，进入COMPLETED状态
      on_failure: P0失败→状态机回滚IN_PROGRESS
    - order: 3
      action: G3 Evaluate——价值打分，计算knowledge_value_score(≥0.4阈值)
      pre_condition: G2通过
      expected_result: 高价值文档进入VERIFIED状态
      on_failure: score<0.4→reject，task降档FAILED
    - order: 4
      action: G4 Activate——依赖就绪检查+冲突检测，deferred_queue管理
      pre_condition: G3通过
      expected_result: KE对象准备写入
      on_failure: 依赖缺失→WAITING；冲突→BLOCKED；其他P0→FAILED
    - order: 5
      action: G5 Extract——实际写入知识库+后验检查
      pre_condition: G4通过
      expected_result: 新KE落盘
      on_failure: 后验失败→git checkout回滚+FAILED
  gov_arch_006_gate_attributes:
    section_type: context
    title: 5级门禁属性表
    original_rules:
    - GOV-ARCH-006
    - GATE-001~GATE-010
    summary: 5级门禁的机读名/触发时机/执行者/产物
    impact_on_rules: 门禁属性定义了执行语义
    key_decisions:
    - G1 Ingest——机读名:G1,触发:task PENDING→IN_PROGRESS,执行者:GateEngine.evaluate,产物:ingest_report
    - G2 Triage——机读名:G2,触发:task IN_PROGRESS→COMPLETED,执行者:GateEngine.evaluate,产物:triage_report
    - G3 Evaluate——机读名:G3,触发:task COMPLETED→VERIFIED,执行者:GateEngine.evaluate,产物:evaluation_report+knowledge_value_score
    - G4 Activate——机读名:G4,触发:task VERIFIED→写入前,执行者:GateEngine.evaluate,产物:activation_report
    - G5 Extract——机读名:G5,触发:实际写入前,执行者:GateEngine.evaluate,产物:extraction_report+KE文件
  gov_arch_006_severity_criteria:
    section_type: decision_tree
    title: 门禁严重级别分级判定
    original_rules:
    - GOV-ARCH-006
    - GATE-002
    branches:
    - condition: 失败导致不可逆损失（数据损坏/安全漏洞/系统不可用）
      if_true: P0 硬阻断——GateViolationError，task状态回滚，禁止继续
      if_false: 继续判定
    - condition: 失败导致可逆损失但需可见（质量下降/重复入库/分类错误）
      if_true: P1 软警告——记录事件，可继续但需标记
      if_false: 继续判定
    - condition: 失败仅为风格/规范提示（命名不规范/格式问题）
      if_true: P2 仅记录——记入日志，不阻断不标记
      if_false: 重新评估严重级别
  gov_arch_006_g3_scoring:
    section_type: procedure
    title: G3评分维度
    original_rules:
    - GOV-ARCH-006
    - GATE-003
    steps:
    - order: 1
      action: 计算design_decision_density(权重0.30)——文档中设计决策密度
      pre_condition: G2通过，文档已分类
      expected_result: 0.0~1.0浮点分数
      on_failure: 无法计算则默认0.0
    - order: 2
      action: 计算technical_specificity(权重0.25)——技术具体性
      pre_condition: G2通过
      expected_result: 0.0~1.0浮点分数
      on_failure: 无法计算则默认0.0
    - order: 3
      action: 计算reuse_potential(权重0.25)——复用潜力
      pre_condition: G2通过
      expected_result: 0.0~1.0浮点分数
      on_failure: 无法计算则默认0.0
    - order: 4
      action: 计算irreplaceability(权重0.20)——不可替代性
      pre_condition: G2通过
      expected_result: 0.0~1.0浮点分数
      on_failure: 无法计算则默认0.0
    - order: 5
      action: 加权求和得到knowledge_value_score——score = 0.30*density + 0.25*specificity + 0.25*reuse + 0.20*irreplaceability
      pre_condition: 4个维度分数已计算
      expected_result: score ≥ 0.4 则通过
      on_failure: score < 0.4 → reject，task降档FAILED
  gov_arch_006_g4_deferred:
    section_type: procedure
    title: G4 Deferred Queue
    original_rules:
    - GOV-ARCH-006
    - GATE-004
    steps:
    - order: 1
      action: 依赖缺失时进入deferred_queue——task状态设为WAITING，waiting_for记录缺失依赖ID
      pre_condition: G4-C01 dependencies_ready检查失败
      expected_result: task进入WAITING状态，等待依赖就绪
      on_failure: 直接reject(FAILED)
    - order: 2
      action: retry_interval=1h——每1小时重试检查依赖是否就绪
      pre_condition: task在WAITING状态
      expected_result: 依赖就绪则推进到下一步
      on_failure: 继续等待
    - order: 3
      action: max_wait_time=72h——超过72h未就绪则转人工review
      pre_condition: 等待时间超过72h
      expected_result: 转人工review，Owner决定继续等待或reject
      on_failure: 无自动处理，必须人工介入
  gov_arch_006_g5_posterior:
    section_type: verification
    title: G5后验检查
    original_rules:
    - GOV-ARCH-006
    - GATE-005
    checks:
    - step: 提取内容非空——KE文件内容不为空
      command: 检查KE文件大小>0
      expected_exit: 内容非空
      on_fail: git checkout回滚+FAILED
    - step: frontmatter合法——KE文件frontmatter字段完整且类型正确
      command: 检查frontmatter必填字段
      expected_exit: frontmatter合法
      on_fail: git checkout回滚+FAILED
    - step: 无数据丢失命中率≥90%——源文档关键信息保留率
      command: 对比源文档与KE内容
      expected_exit: 命中率≥90%
      on_fail: git checkout回滚+FAILED
    - step: 交叉引用有效——KE中引用的其他KE/模块/路径均存在
      command: 逐条验证交叉引用
      expected_exit: 所有引用有效
      on_fail: git checkout回滚+FAILED
  gov_arch_006_dependency_matrix:
    section_type: procedure
    title: 5级门禁依赖矩阵
    original_rules:
    - GOV-ARCH-006
    - GATE-001
    steps:
    - order: 1
      action: G1依赖——下游Gate:G2/必要前置:无/可选前置:Write Guard/并行允许:无
      pre_condition: 文档进入管道
      expected_result: G1独立执行
      on_failure: G1失败则G2不可执行
    - order: 2
      action: G2依赖——下游Gate:G3/必要前置:G1 PASS/可选前置:无/并行允许:无
      pre_condition: G1通过
      expected_result: G2依赖G1
      on_failure: G1未通过则G2不可执行
    - order: 3
      action: G3依赖——下游Gate:G4/必要前置:G2 PASS/可选前置:无/并行允许:无
      pre_condition: G2通过
      expected_result: G3依赖G2
      on_failure: G2未通过则G3不可执行
    - order: 4
      action: G4依赖——下游Gate:G5/必要前置:G3 PASS/可选前置:Contract Guard/并行允许:无
      pre_condition: G3通过
      expected_result: G4依赖G3
      on_failure: G3未通过则G4不可执行
    - order: 5
      action: G5依赖——下游Gate:无(终态)/必要前置:G4 PASS/可选前置:Commit Guard/并行允许:无
      pre_condition: G4通过
      expected_result: G5依赖G4
      on_failure: G4未通过则G5不可执行
  gov_arch_006_state_integration:
    section_type: procedure
    title: 状态转换集成映射
    original_rules:
    - GOV-ARCH-006
    - GATE-009
    steps:
    - order: 1
      action: PENDING→IN_PROGRESS——触发门禁:G1/失败行为:保持PENDING/成功副作用:写入events表ingest事件
      pre_condition: task处于PENDING
      expected_result: G1通过后task进入IN_PROGRESS
      on_failure: G1失败则保持PENDING
    - order: 2
      action: IN_PROGRESS→COMPLETED——触发门禁:G2/失败行为:回滚IN_PROGRESS/成功副作用:写入events表triage事件
      pre_condition: task处于IN_PROGRESS且G1通过
      expected_result: G2通过后task进入COMPLETED
      on_failure: G2失败则回滚IN_PROGRESS
    - order: 3
      action: COMPLETED→VERIFIED——触发门禁:G3/失败行为:降档FAILED/成功副作用:写入events表evaluation事件+knowledge_value_score
      pre_condition: task处于COMPLETED且G2通过
      expected_result: G3通过后task进入VERIFIED
      on_failure: G3失败则降档FAILED
    - order: 4
      action: VERIFIED→写入前——触发门禁:G4/失败行为:WAITING或BLOCKED/成功副作用:写入events表activation事件
      pre_condition: task处于VERIFIED且G3通过
      expected_result: G4通过后准备写入
      on_failure: G4失败则WAITING/BLOCKED/FAILED
    - order: 5
      action: 写入前→落盘——触发门禁:G5/失败行为:git checkout回滚+FAILED/成功副作用:写入events表extraction事件+KE文件落盘
      pre_condition: G4通过
      expected_result: G5通过后KE落盘
      on_failure: G5失败则回滚+FAILED
  gov_arch_006_task_status_mapping:
    section_type: context
    title: TaskStatus与门禁交互映射
    original_rules:
    - GOV-ARCH-006
    - GATE-009
    summary: TaskStatus十状态与门禁的交互关系
    impact_on_rules: 状态转换必须经过对应门禁
    key_decisions:
    - PENDING——等待G1 Ingest，无门禁交互
    - IN_PROGRESS——G1通过后进入，G2 Triage待执行
    - COMPLETED——G2通过后进入，G3 Evaluate待执行
    - VERIFIED——G3通过后进入，G4 Activate待执行
    - FAILED——任一门禁P0失败可进入，可RETRY或Owner手动CANCELLED
    - WAITING——G4依赖缺失进入，等待依赖就绪(max 72h)
    - BLOCKED——G4冲突进入，需Owner仲裁
    - CANCELLED——Owner手动取消，不触发门禁
    - RETRY——从FAILED重试，重新执行失败的门禁
    - ARCHIVED——终态，不触发门禁
  gov_arch_006_yaml_schema:
    section_type: context
    title: 门禁YAML Schema规范
    original_rules:
    - GOV-ARCH-006
    - GATE-003
    - GATE-006
    summary: 门禁YAML文件的Schema规范定义
    impact_on_rules: 所有门禁YAML必须符合此Schema
    key_decisions:
    - 顶层字段——gate_name(机读slug,必填)/title(人类标签,必填)/severity(error|critical|warning|warn|info,必填)/entry_conditions(数组,必填)/checks(过渡期兼容别名,可选)
    - entry_conditions数组项——id(必填,格式G{N}-C{NN})/description(必填)/severity(必填)/auto_action(可选:reject|defer|flag|auto_fix|auto_assign|auto_fill|auto_register|auto_scope)/manual(可选,bool)
    - 字段命名消歧——gate_name为机读权威slug,title为人类标签,顶层name字段禁止使用;entry_conditions为权威字段,checks为过渡期兼容别名
    - schema校验7项——(1)gate_name必填且唯一(2)title必填(3)severity枚举值合法(4)entry_conditions非空数组(5)每项id格式正确(6)每项severity枚举值合法(7)gate_name全局唯一性
  gov_arch_006_gates_table:
    section_type: context
    title: gates表持久化格式
    original_rules:
    - GOV-ARCH-006
    - GATE-008
    - GATE-009
    summary: 门禁评估结果的持久化存储格式
