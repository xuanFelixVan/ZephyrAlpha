rule_id: TRAE-036
title: 架构治理-门禁与过渡
version: 1.1.0
layer: L1_foundation
module_id: TRAE-036
depends_on: []
tags:
- TRAE
- architecture_gate_transition
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- GOV-ARCH-002
- GOV-ARCH-005
- GOV-ARCH-006
severity: error
scope: architecture_gate_transition
domain: TRAE
triggers:
- operation: architecture_gate_transition
sections:
  gov_arch_002:
    title: 架构评审门控
    section_type: rule
    original_rules:
    - GOV-ARCH-002
    - ARG-001
    - ARG-002
    - ARG-003
    - ARG-004
    - ARG-005
    conditions:
    - type: trigger
      check: 变更类型为新增模块、删除模块、修改模块间接口、更换核心技术栈、修改数据流方向之一
      pass: 必须经过架构评审
      fail: 变更不得实施
    - type: constraint
      check: 变更是否违反已有KB决策记录
      pass: 无冲突，继续评审
      fail: 必须先废弃或修改KB决策记录再实施变更，否则否决
    - type: constraint
      check: 变更是否引入循环依赖（跨层循环 OR 同层循环）
      pass: 无循环（跨层无循环 AND 同层无循环），继续评审
      fail: 必须重新设计消除循环，否则否决
    - type: constraint
      check: 变更是否降低系统可观测性
      pass: 无影响，继续评审
      fail: 必须补充监控方案，否则否决
    - type: constraint
      check: 变更是否影响数据一致性且无补偿方案
      pass: 无影响或有补偿方案
      fail: 必须提供补偿方案后再评审，否则否决
    - type: constraint
      check: 变更是否有可行回滚方案
      pass: 有明确回滚步骤
      fail: 必须提供回滚步骤和回滚验证，否则否决
    - type: constraint
      check: 变更是否引起显著性能退化且无优化方案
      pass: 无影响或有优化方案
      fail: 必须提供性能优化方案或退化影响评估，否则否决
    - type: constraint
      check: 变更需更新文档但未列出更新清单
      pass: 已列出需更新的文档清单并指定负责人
      fail: 必须列出需更新的文档清单并指定负责人，否则否决
    actions:
    - type: mandatory
      step: 触发条件表中的变更类型，未经架构评审不得实施（ARG-001）
    - type: mandatory
      step: 架构评审必须逐项检查评审清单（6项），不可跳过（ARG-002）
    - type: mandatory
      step: 架构评审必须由Owner亲自执行，或由Owner书面委托的具备系统架构知识的人员执行（ARG-004）
    - type: mandatory
      step: 评审记录必须包含：评审日期（ISO 8601 UTC）、评审人ID、变更描述、清单逐项检查结果、否决/通过决定、决定理由（ARG-005）
    - type: mandatory
      step: 评审记录存放于 docs/_working/audit/architecture-reviews/YYYY-MM-DD-变更简述.md（ARG-005）
    prohibitions:
    - AI不得单独执行架构评审或代替Owner做出评审决定（ARG-004）
    - 触发条件内的变更未经架构评审不得实施（ARG-001）
    - 评审不得跳过清单中的检查项（ARG-002）
  gov_arch_005:
    title: 阶段过渡双门协议
    section_type: rule
    original_rules:
    - GOV-ARCH-005
    - PTP-001
    - PTP-002
    - PTP-003
    - PTP-004
    - PTP-005
    conditions:
    - type: trigger
      check: 系统从一个stability stage过渡到下一个stage
      pass: 必须通过退出门+准入门双门校验
      fail: 禁止启动下一stage
    - type: constraint
      check: exit_criteria中每条criterion是否全部通过
      pass: 退出门通过，进入准入门校验
      fail: 当前stage未完成，禁止过渡
    - type: constraint
      check: next_stage_entry_criteria中每项是否有references_exit指向前一stage的EXIT条目或type:pre-existing且成立≥72小时
      pass: 零暗门原则满足
      fail: 违反零暗门原则，禁止过渡
    - type: constraint
      check: 自动校验全绿后是否有HiL人工审核
      pass: 用户签字批准
      fail: 禁止启动下一stage
    actions:
    - type: mandatory
      step: 每个stage必须在frontmatter同时声明exit_criteria + next_stage_entry_criteria（PTP-001双门同时声明）
    - type: mandatory
      step: 每条criterion必须能被validate_stage_*.py自动校验；不可机器验证的标注manual:true（PTP-002机器可验证优先）
    - type: mandatory
      step: Stage过渡必须有用户显式点头，不可跳过HiL审核（PTP-003 HiL强制节点）
    - type: mandatory
      step: 每个stage都有rollback_snapshot_path，过渡失败可回退（PTP-004回滚协议配套）
    - type: mandatory
      step: next_stage_entry_criteria必须是前一stage的exit_criteria子集，由validate_phase_transition.py --check zero-backdoor校验（PTP-005零暗门原则）
    - type: mandatory
      step: exit_criteria中id格式EXIT-<stage>-<seq>，validator在machine_verifiable:true时必填
    - type: mandatory
      step: HiL审核产出docs/_working/audit/phase-N-acceptance.md，包含退出门校验结果、准入门校验结果、用户签字、日期、已知风险清单
    - type: mandatory
      step: 校验脚本：validate_phase_exit.py --phase N / validate_phase_entry.py --phase N / validate_phase_transition.py --from N --to N+1（注：validate_phase_exit.py和validate_phase_entry.py为计划中脚本，当前由validate_phase_transition.py统一处理）
    prohibitions:
    - 禁止在next_stage_entry_criteria中出现前一stage的exit_criteria没有覆盖的新依赖（零暗门原则）
    - 禁止跳过HiL人工审核直接启动下一stage
    - 禁止stage N未完成时开始stage N+1任务（跨stage偷跑）
    - stable阶段（phase=4）无需next_phase_entry_criteria，但必须有exit_criteria作为稳定态DoD
  gov_arch_006:
    title: 5级门禁策略（KMS知识管道门禁体系）
    section_type: rule
    original_rules:
    - GOV-ARCH-006
    - GATE-001
    - GATE-002
    - GATE-003
    - GATE-004
    - GATE-005
    - GATE-006
    - GATE-007
    - GATE-008
    - GATE-009
    - GATE-010
    conditions:
    - type: trigger
      check: 文档被吸入KMS管道（task PENDING→IN_PROGRESS）
      pass: 触发G1 Ingest Gate
      fail: 不进入管道
    - type: trigger
      check: 文档已分类并准备进入评估（IN_PROGRESS→COMPLETED）
      pass: 触发G2 Triage Gate
      fail: 退回IN_PROGRESS
    - type: trigger
      check: 价值打分完成，准备激活（COMPLETED→VERIFIED）
      pass: 触发G3 Evaluate Gate
      fail: 降档FAILED
    - type: trigger
      check: KE对象即将写入知识库前
      pass: 触发G4 Activate Gate
      fail: 依赖未就绪→WAITING；冲突→BLOCKED；其他P0→FAILED
    - type: trigger
      check: 实际执行知识条目文件写入前
      pass: 触发G5 Extract Gate
      fail: 回滚+FAILED
    - type: constraint
      check: G3 knowledge_value_score阈值
      pass: score ≥ 0.4
      fail: reject，task降档FAILED
    - type: constraint
      check: G4 deferred_queue超时
      pass: 依赖在72h内就绪
      fail: 转人工review
    - type: constraint
      check: G5后验检查——提取内容非空、frontmatter合法、无数据丢失（命中率≥90%）、交叉引用有效
      pass: 新KE落盘
      fail: git checkout回滚+task降回FAILED
    actions:
    - type: mandatory
      step: 5级门禁严格串行执行：G1→G2→G3→G4→G5，同一task禁止跳级（GATE-001）
    - type: mandatory
      step: 严重级别双层映射：YAML侧error/critical→P0(硬阻断)，warning/warn→P1(软警告)，info→P2(仅记录)（GATE-002）
    - type: mandatory
      step: YAML文件中gate_name为机读权威slug，title为人类标签，顶层name字段禁止使用（GATE-003）
    - type: mandatory
      step: entry_conditions为权威字段，checks仅为过渡期兼容别名（GATE-004）
    - type: mandatory
      step: YAML侧只允许error/critical/warning/warn/info，P0/P1/P2只在代码内部出现（GATE-005）
    - type: mandatory
      step: GateEngine.reload_gates()启动时必须对每个YAML执行schema校验（7项必填字段+正则+枚举+唯一性），失败则fail-fast拒绝启动（GATE-006）
    - type: mandatory
      step: 门禁检查必须在task_repo._write_tx()之外执行，防止死锁（GATE-007事务隔离）
    - type: mandatory
      step: 同一(task_id,gate_id)重复evaluate必须产生独立gate_run_id，禁止UPSERT覆盖（GATE-008幂等性）
    - type: mandatory
      step: 门禁结果写入gates表同时，task_repo侧写入events表一条gate_evaluation事件（GATE-009事件写入）
    - type: mandatory
      step: 豁免仅Project Owner可签发，commit message使用trailer格式gate-exempt:G{N}-C{NN}|reason:...|valid_until:YYYY-MM-DD，valid_until最多30天
    prohibitions:
    - 禁止运行时动态升降级严重级别，级别调整仅能通过修改YAML+二次review完成
    - 禁止直接调用GateEngine.evaluate(task,"G3")跳过G1/G2（跳级禁止）
    - 禁止YAML文件直接写P0/P1/P2（机读字符串不应出现在策略文件中）
    - 禁止顶层name字段使用（消歧）
    - 禁止生产环境关闭门禁（enable_gate=False仅限单元测试/scaffold补录）
    - AI禁止自行签发豁免
    - GOV-P0红线（编码损坏、锚点文件删除）不可豁免
  g1_g5_check_items:
    title: G1-G5 门禁检查项表
    section_type: rule
    original_rules:
    - GATE-001~GATE-010 检查项
    conditions:
    - type: constraint
      check: G1 Ingest Gate检查项
      pass: G1-C00~G1-C07全部通过
      fail: P0失败→reject回滚保持PENDING；P1失败→记p1_count继续推进
    - type: constraint
      check: G2 Triage Gate检查项
      pass: G2-C00~G2-C06全部通过
      fail: P0失败→状态机回滚IN_PROGRESS；auto_assign特例(G2-C03缺priority自动填P2)
    - type: constraint
      check: G3 Evaluate Gate检查项
      pass: G3-C01~G3-C05全部通过
      fail: P0失败→task降档FAILED；P1相似度过高→记dedup_candidate事件
    - type: constraint
      check: G4 Activate Gate检查项
      pass: G4-C01~G4-C06全部通过
      fail: G4-C01依赖缺失→defer(WAITING)；G4-C02冲突→flag(BLOCKED)；其他P0→reject(FAILED)
    - type: constraint
      check: G5 Extract Gate检查项
      pass: G5-C01~G5-C06全部通过+后验检查通过
      fail: P0失败→reject+task进FAILED+清理临时产物；后验失败→git checkout回滚
    actions:
    - type: mandatory
      step: G1检查项——G1-C00 no_deprecated_path(P0 reject)/G1-C01 file_exists(P0 reject)/G1-C02 encoding_compliant(P0 reject)/G1-C03 line_ending_compliant(P1 auto_fix)/G1-C04 frontmatter_present(P0 reject)/G1-C05 frontmatter_required_fields(P0 reject)/G1-C06 file_size_within_limit(P1 flag)/G1-C07 no_binary_content(P0 reject)；G2检查项——G2-C00 content_not_empty_shell(P0 reject)/G2-C01 classification_label_valid(P0 reject)/G2-C02 doc_type_valid(P0 reject)/G2-C03 priority_score_assigned(P0 auto_assign)/G2-C04 layer_assignment_valid(P1 flag)/G2-C05 no_duplicate_ingest(P0 reject)/G2-C06 source_path_compliant(P1 flag)；G3检查项——G3-C01 knowledge_value_score_threshold(P0 reject,score≥0.4)/G3-C02 uniqueness_check(P1 flag,similarity<0.95)/G3-C03 content_integrity_verified(P0 reject)/G3-C04 metadata_complete(P1 auto_fill)/G3-C05 no_expired_ttl(P0 reject)；G4检查项——G4-C01 dependencies_ready(P0 defer)/G4-C02 no_conflict_with_existing(P0 flag)/G4-C03 target_path_compliant(P0 reject)/G4-C04 frontmatter_schema_valid(P0 reject)/G4-C05 module_id_registered(P1 auto_register)/G4-C06 no_orphan_references(P1 flag)；G5检查项——G5-C01 extraction_template_ready(P0 reject)/G5-C02 target_path_available(P0 flag)/G5-C03 target_path_compliant(P0 reject)/G5-C04 ke_number_assigned(P0 auto_assign)/G5-C05 source_document_complete(P0 reject)/G5-C06 extraction_scope_defined(P1 auto_scope)
    prohibitions: []
  degradation_strategy:
    title: 门禁降级策略
    section_type: procedure
    original_rules:
    - GATE 降级策略
    conditions:
    - type: constraint
      check: G1降级策略
      pass: P0失败→GateViolationError+task保持PENDING；P1失败→记p1_count+1继续；auto_fix特例(G1-C03 CRLF→LF替换后重验)
      fail: P0未阻断导致不合格文档进入管道
    - type: constraint
      check: G2降级策略
      pass: P0失败→状态机回滚IN_PROGRESS；auto_assign特例(G2-C03缺priority自动填P2)
      fail: 不合格分类进入评估阶段
    - type: constraint
      check: G3降级策略
      pass: P0失败→task降档FAILED可RETRY或Owner手动CANCELLED；P1相似度过高→记dedup_candidate事件G4阶段必须挂载merge_policy
      fail: 低价值或重复文档进入知识库
    - type: constraint
      check: G4降级策略
      pass: G4-C01依赖缺失→defer(WAITING,waiting_for记录缺失依赖ID,72h超时转人工)；G4-C02冲突→flag(BLOCKED,需Owner仲裁)；其他P0→reject(FAILED)
      fail: 依赖未就绪或冲突的KE被激活
    - type: constraint
      check: G5降级策略
      pass: auto_assign/auto_scope→记events.auto_filled继续；G5-C02路径冲突→flag等待Owner设gate-exempt commit trailer；P0失败→reject+task进FAILED+清理临时产物；后验失败→git checkout回滚
      fail: 不合格KE落盘
    actions:
    - type: mandatory
      step: '各级降级策略严格执行——G1: P0→reject+回滚,P1→记录继续,auto_fix→修复后重验；G2: P0→回滚IN_PROGRESS,auto_assign→自动填P2；G3: P0→FAILED可RETRY,P1→记dedup_candidate；G4: 依赖缺失→defer(WAITING≤72h),冲突→flag(BLOCKED),其他P0→reject(FAILED)；G5: auto→记录继续,路径冲突→flag等Owner,P0→reject+FAILED+清理,后验失败→git checkout回滚'
    prohibitions: []
  lifecycle_guards_boundary:
    title: Lifecycle Guards 边界声明
    section_type: context
    original_rules:
    - GOV-ARCH-006 附录A
    conditions:
    - type: constraint
      check: 区分5级门禁与Lifecycle Guards的职责边界
      pass: 各守卫归属正确，不越界
      fail: 门禁与守卫职责混淆导致检查遗漏或重复
    actions:
    - type: mandatory
      step: Lifecycle Guards边界——Write Guard(ATM原子写入时,属atomic-write-standard.md,G1之前)/Commit Guard(git commit pre-commit hooks,属.pre-commit-config.yaml,G1-G5之外的版本控制层)/Phase Guard(Phase切换,属phase-verification-procedure.md,聚合G1-G5指标作输入)/Contract Guard(Pydantic v2校验,属src/zephyr/schemas.py,G4调用底层实现)/Runtime Guard(运行时观测,属runtime-observability-standard.md,不触发5级Gate)
    prohibitions: []
  gov_arch_002_exclusions:
    section_type: decision_tree
    title: 架构评审豁免判定
    original_rules:
    - GOV-ARCH-002
    - ARG-001
    branches:
    - condition: 变更类型为新增配置项（不改变模块间接口）
      if_true: 无需架构评审
      if_false: 继续判定
    - condition: 变更类型为修复bug（不改变模块间接口和数据流方向）
      if_true: 无需架构评审
      if_false: 继续判定
    - condition: 变更类型为重命名（不改变语义）
      if_true: 无需架构评审
      if_false: 需要架构评审
  gov_arch_002_review_checklist:
    section_type: verification
    title: 架构评审清单
    original_rules:
    - GOV-ARCH-002
    - ARG-002
    checks:
    - step: 检查架构一致性——变更是否与现有架构一致
      command: 评审人逐项检查
      expected_exit: 通过/不通过
      on_fail: 必须重新设计或否决
    - step: 检查无冲突——变更是否与已有KB决策记录冲突
      command: 评审人逐项检查
      expected_exit: 无冲突
      on_fail: 必须先废弃或修改KB决策记录
    - step: 检查无循环——变更是否引入循环依赖（跨层循环 OR 同层循环）
      command: python D:/ZephyrAlpha/scripts/governance/diagnose_depgraph.py
      expected_exit: 无新循环依赖（跨层无循环 AND 同层无循环）
      on_fail: 必须重新设计消除循环
    - step: 检查有明确回滚步骤
      command: 评审人逐项检查
      expected_exit: 回滚步骤明确且可执行
      on_fail: 必须提供回滚步骤
    - step: 检查性能影响已评估
      command: 评审人逐项检查
      expected_exit: 性能影响已评估或有优化方案
      on_fail: 必须提供性能评估
    - step: 检查安全影响已评估
      command: 评审人逐项检查
      expected_exit: 安全影响已评估
      on_fail: 必须提供安全评估
  gov_arch_002_verification:
    section_type: verification
    title: 架构评审验证
    original_rules:
    - GOV-ARCH-002
    - ARG-005
    checks:
    - step: 检查评审记录是否存在且完整
      command: 检查 docs/_working/audit/architecture-reviews/ 下对应日期文件
      expected_exit: 文件存在且包含评审日期/评审人ID/变更描述/清单逐项结果/否决或通过决定/决定理由
      on_fail: 评审记录缺失或不完整，必须补充
    - step: 检查是否使用评审清单
      command: 检查评审记录中是否逐项覆盖6项清单
      expected_exit: 6项全部覆盖
      on_fail: 评审不完整，必须补充缺失项
    - step: 检查否决条件是否被通过
      command: 检查评审记录中否决项是否被正确处理
      expected_exit: 否决项已解决或有Owner书面批准
      on_fail: 否决条件未处理，变更不得实施
  gov_arch_002_change_history:
    section_type: examples
    title: 架构评审变更历史
    original_rules:
    - GOV-ARCH-002
    items:
    - title: v1.0.1 审计修复
      code: '- 修复评审记录格式不一致问题

        - 补充评审清单缺失项

        '
      language: yaml
      note: 审计发现修复
    - title: v0.2.0 审批修复
      code: '- 修复Owner委托流程缺失书面记录问题

        - 增加委托模板

        '
      language: yaml
      note: 审批流程补全
    - title: v0.1.0 初始版本
      code: '- 初始架构评审门控规则

        - 定义触发条件和否决条件

        '
      language: yaml
      note: 初版发布
  gov_arch_005_problem_context:
    section_type: context
    title: 阶段过渡问题背景
    original_rules:
    - GOV-ARCH-005
    - PTP-001~PTP-005
    summary: 当前stage管理存在3个漏洞导致漂移失控
    impact_on_rules: 需要双门协议堵住3个漏洞
    key_decisions:
    - 单门漂移——仅exit_criteria无entry_criteria，stage边界可被绕过
    - 跨stage偷跑——stage N未完成时开始stage N+1任务，依赖未就绪
    - 隐性依赖漂移——next_stage_entry_criteria中出现前一stage未覆盖的新依赖（暗门）
  gov_arch_005_dual_gate_spec:
    section_type: procedure
    title: 双门定义完整格式
    original_rules:
    - GOV-ARCH-005
    - PTP-001
    - PTP-002
    steps:
    - order: 1
      action: 定义exit_criteria字段——每条criterion包含id(EXIT-<stage>-<seq>)/description/validator/machine_verifiable(bool)/manual(bool)/blocking(bool)
      pre_condition: stage已确定
      expected_result: exit_criteria声明完整
      on_failure: 缺少必填字段则校验失败
    - order: 2
      action: 定义next_stage_entry_criteria字段——每项包含id(ENTRY-<stage>-<seq>)/description/validator/machine_verifiable(bool)/manual(bool)/blocking(bool)/references_exit(指向stage N-1的EXIT条目ID)
      pre_condition: exit_criteria已定义
      expected_result: entry_criteria声明完整
      on_failure: 缺少必填字段则校验失败
    - order: 3
      action: 零暗门原则校验——ENTRY项必须references_exit指向stage N-1的EXIT条目，或type:pre-existing且成立≥72小时
      pre_condition: 双门已声明
      expected_result: validate_phase_transition.py --check zero-backdoor 通过
      on_failure: 违反零暗门原则，禁止过渡
  gov_arch_005_stage_gates:
    section_type: verification
    title: 5个Stage双门内容
    original_rules:
    - GOV-ARCH-005
    - PTP-001~PTP-005
    checks:
    - step: Stage 0 scaffold——EXIT(3条):EXIT-0-01文件创建且注册/EXIT-0-02 __init__.py导出正确/EXIT-0-03 scaffold.py --verify通过；ENTRY(2条):ENTRY-1-01 references_exit:EXIT-0-01/ENTRY-1-02 references_exit:EXIT-0-02
      command: validate_phase_exit.py --phase 0 && validate_phase_entry.py --phase 1
      expected_exit: 全部通过
      on_fail: 当前stage未完成或准入条件不满足
    - step: Stage 1 experimental——EXIT(3条):EXIT-1-01基础功能可运行/EXIT-1-02单元测试覆盖核心路径/EXIT-1-03无阻断级bug；ENTRY(3条):ENTRY-2-01 references_exit:EXIT-1-01/ENTRY-2-02 references_exit:EXIT-1-02/ENTRY-2-03 references_exit:EXIT-1-03
      command: validate_phase_exit.py --phase 1 && validate_phase_entry.py --phase 2
      expected_exit: 全部通过
      on_fail: 当前stage未完成或准入条件不满足
    - step: Stage 2 beta——EXIT(4条):EXIT-2-01集成测试通过/EXIT-2-02性能基线达标/EXIT-2-03文档完整/EXIT-2-04无P0/P1缺陷；ENTRY(3条):ENTRY-3-01 references_exit:EXIT-2-01/ENTRY-3-02 references_exit:EXIT-2-03/ENTRY-3-03 references_exit:EXIT-2-04
      command: validate_phase_exit.py --phase 2 && validate_phase_entry.py --phase 3
      expected_exit: 全部通过
      on_fail: 当前stage未完成或准入条件不满足
    - step: Stage 3 stable——EXIT(3条):EXIT-3-01生产环境验证通过/EXIT-3-02监控告警就绪/EXIT-3-03回滚方案验证；ENTRY(3条):ENTRY-4-01 references_exit:EXIT-3-01/ENTRY-4-02 references_exit:EXIT-3-02/ENTRY-4-03 references_exit:EXIT-3-03
      command: validate_phase_exit.py --phase 3 && validate_phase_entry.py --phase 4
      expected_exit: 全部通过
      on_fail: 当前stage未完成或准入条件不满足
    - step: Stage 4 stable(终态)——EXIT(2条):EXIT-4-01稳定态DoD满足/EXIT-4-02持续运行30天无回退；无需next_stage_entry_criteria
      command: validate_phase_exit.py --phase 4
      expected_exit: 全部通过
      on_fail: 稳定态DoD未满足
  gov_arch_005_automation:
    section_type: procedure
    title: 自动化校验接口
    original_rules:
    - GOV-ARCH-005
    - PTP-002
    steps:
    - order: 1
      action: validate_phase_transition.py——校验阶段过渡合法性(--from N --to N+1 --check zero-backdoor)
      pre_condition: 双门已声明
      expected_result: 输出JSON lines格式，每行{"phase","check","status","detail"}
      on_failure: 过渡不合法，禁止执行
    - order: 2
      action: validate_ssot.py——校验frontmatter与注册表一致性
      pre_condition: 文件已创建
      expected_result: 输出JSON lines格式
      on_failure: 不一致，需修复
    - order: 3
      action: phase_manager.py——PHASE_SEQUENCE注册+阶段推进
      pre_condition: 门禁YAML已注册
      expected_result: 阶段推进成功
      on_failure: 门禁未通过
    - order: 4
      action: gate_engine.py——GateEngine.evaluate()执行门禁评估
      pre_condition: gate YAML已加载
      expected_result: 输出JSON lines格式，每行{"gate_id","severity","status","detail"}
      on_failure: 门禁评估失败
  gov_arch_005_hil_review:
    section_type: procedure
    title: 人工审核流程(HiL)
    original_rules:
    - GOV-ARCH-005
    - PTP-003
    steps:
    - order: 1
      action: HiL触发——自动校验全绿后触发HiL审核节点
      pre_condition: exit_criteria+entry_criteria全部通过
      expected_result: HiL审核节点激活
      on_failure: 自动校验未全绿，不触发HiL
    - order: 2
      action: 产出phase-N-acceptance.md——包含退出门校验结果/准入门校验结果/用户签字/日期/已知风险清单
      pre_condition: HiL审核节点激活
      expected_result: 文件写入docs/_working/audit/phase-N-acceptance.md
      on_failure: 缺少必要字段
    - order: 3
      action: 一人团队不跳过HiL的4条理由——(1)签字=确认理解风险(2)签字=承诺维护责任(3)签字=审计追踪锚点(4)跳过=漂移失控的起点
      pre_condition: 一人团队场景
      expected_result: 仍然执行HiL签字
      on_failure: 禁止跳过HiL
  gov_arch_005_change_history:
    section_type: examples
    title: 阶段过渡协议变更历史
    original_rules:
    - GOV-ARCH-005
    items:
    - title: v1.1.0 目录迁移
