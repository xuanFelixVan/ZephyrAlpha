rule_id: TRAE-044
title: 合规治理-审计与监管
version: 1.4.3
layer: L1_foundation
module_id: TRAE-044
depends_on: []
tags:
- TRAE
- compliance_audit
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- GOV-CMP-001
- GOV-CMP-002
- GOV-CMP-003
severity: error
scope: compliance_audit
domain: TRAE
triggers:
- operation: compliance_audit
sections:
  gov_cmp_001:
    title: 监管分类法
    section_type: rule
    original_rules:
    - GOV-CMP-001
    - CMR-001
    - CMR-002
    - CMR-003
    conditions:
    - type: trigger
      check: 新市场开展交易前
      pass: 已完成该市场合规评估
      fail: 禁止在该市场交易
    - type: trigger
      check: 监管法规变更
      pass: 30天内更新合规评估
      fail: 合规风险
    - type: trigger
      check: 新产品上线
      pass: 上线前完成合规评估
      fail: 禁止上线
    actions:
    - type: mandatory
      step: 'CMR-001: 新市场准入必须完成合规评估，确认所有监管要求可满足'
    - type: mandatory
      step: 'CMR-002: 合规检查必须覆盖该市场所有适用的合规维度，不得遗漏'
    - type: mandatory
      step: 'CMR-003: 监管法规变更后30天内更新合规评估；新产品上线前完成合规评估'
    prohibitions:
    - 未完成合规评估即在新市场交易
    - 合规检查遗漏适用维度
    - 监管法规变更后超30天未更新评估
    - 新产品未完成合规评估即上线
  gov_cmp_002:
    title: 审计追踪策略
    section_type: rule
    original_rules:
    - GOV-CMP-002
    - AUD-001
    - AUD-002
    - AUD-003
    - AUD-004
    conditions:
    - type: constraint
      check: 6类操作（交易下单/撤单、系统配置变更、密钥/权限变更、数据库读写、AI操作、安全事件）
      pass: 审计记录自动生成
      fail: 视为P1安全事件
    - type: constraint
      check: 审计日志是否被修改或删除
      pass: 保留期内不可篡改
      fail: 视为P0安全事件
    actions:
    - type: mandatory
      step: 'AUD-001: 6类操作的审计记录必须自动生成，不可被关闭或绕过'
    - type: mandatory
      step: 'AUD-002: 审计日志一旦生成，任何人（包括Owner）不得修改或删除，直到保留期满'
    - type: mandatory
      step: 'AUD-003: 审计日志只有Auditor和Owner角色可读，其他角色禁止访问'
    - type: mandatory
      step: 'AUD-004: 每条审计记录必须包含timestamp(ISO 8601 YYYY-MM-DDTHH:MM:SSZ UTC)、operator_id、operation_type、operation_detail、result，字段名使用snake_case'
    prohibitions:
    - 关闭或绕过6类操作的审计记录生成
    - 修改或删除保留期内的审计日志
    - 非Auditor/Owner角色访问审计日志
    - 审计记录缺失5个必填字段或格式不合规
  gov_cmp_003:
    title: 治理审计执行协议
    section_type: rule
    original_rules:
    - GOV-CMP-003
    conditions:
    - type: trigger
      check: 季度评审/Phase过渡/重大变更后
      pass: 执行FULL审计
      fail: 未执行审计
    - type: trigger
      check: 每日/每次commit后
      pass: 执行QUICK扫描(D3+D5+D6+D7)
      fail: 未执行快速扫描
    - type: constraint
      check: P0违规数量
      pass: P0=0
      fail: 必须立即修复（同一session内）
    - type: constraint
      check: 审计等级L1通过条件
      pass: 所有P0脚本0违规
      fail: L1未通过
    - type: constraint
      check: 审计等级L2通过条件
      pass: 所有P0+P1脚本0违规 + 12维综合分≥6.0
      fail: L2未通过
    - type: constraint
      check: 审计等级L3通过条件
      pass: 所有P0+P1+P2脚本0违规 + 12维综合分≥8.0
      fail: L3未通过
    actions:
    - type: mandatory
      step: 审计执行5步法：确定范围→执行自动化扫描→人工复核→生成报告→闭环处置
    - type: mandatory
      step: P0违规必须立即修复（同一session内），修复后重跑失败脚本验证
    - type: mandatory
      step: P1违规排入当前sprint（≤2周），修复后验证
    - type: mandatory
      step: P2违规记录到backlog，按计划修复
    - type: mandatory
      step: 每次审计执行和结果必须按GOV-CMP-002 §2-4留痕
    - type: mandatory
      step: QUICK模式必须包含D3+D5（最高频违规来源）
    prohibitions:
    - P0违规未修复即关闭审计
    - 跳过5步审计流程中的任何步骤
    - 审计结果不留痕
  gov_cmp_001_market_taxonomy:
    title: 监管框架按市场分类
    section_type: principles
    original_rules:
    - GOV-CMP-001
    principles:
    - id: MKT-A
      statement: A股市场受证监会(CSRC)监管，核心法规为《证券法》《期货和衍生品法》，合规要求为程序化交易报备和异常交易监控
      rationale: 不同市场有不同监管机构和法规要求，必须按市场分别管理合规
      applies_to: A股交易
    - id: MKT-HK
      statement: 港股市场受证监会(SFC)监管，核心法规为《证券及期货条例》，合规要求为算法交易通知和暗盘交易限制
      rationale: 跨境交易需遵守当地监管
      applies_to: 港股交易
    - id: MKT-US
      statement: 美股市场受SEC/FINRA监管，核心法规为Regulation NMS/Rule 15c3-5，合规要求为市场接入控制和最佳执行
      rationale: 美国市场有独特的市场接入和执行要求
      applies_to: 美股交易
    - id: MKT-FUT
      statement: 期货市场受各交易所监管，核心法规为交易所规则，合规要求为持仓限制和大户报告
      rationale: 期货市场有持仓和报告的特殊要求
      applies_to: 期货交易
  gov_cmp_001_compliance_dimensions:
    title: 合规维度分类
    section_type: principles
    original_rules:
    - GOV-CMP-001
    principles:
    - id: DIM-TRADE
      statement: 交易行为合规——是否存在操纵市场、幌骗等行为，适用全部市场，检查频率为实时
      rationale: 交易行为合规是最基本也是最高频的合规要求
      applies_to: 全部市场
    - id: DIM-POSITION
      statement: 持仓限制——是否超过监管持仓上限，适用A股/期货，检查频率为每日
      rationale: 超持仓是直接违规行为，需每日检查
      applies_to: A股/期货
    - id: DIM-DISCLOSURE
      statement: 信息披露——是否按规定披露持仓/交易信息，适用A股/港股，检查频率为每季度
      rationale: 信息披露是法定义务，按季度披露
      applies_to: A股/港股
    - id: DIM-RETENTION
      statement: 数据保留——交易数据是否按规定期限保留，适用全部市场，检查频率为每年
      rationale: 数据保留是合规底线
      applies_to: 全部市场
    - id: DIM-ALGO
      statement: 算法交易报备——算法交易是否已向监管报备，适用A股/港股，检查频率为新算法上线前
      rationale: 算法交易报备是程序化交易的前置条件
      applies_to: A股/港股
  gov_cmp_001_verification:
    title: 监管分类验证方式
    section_type: verification
    original_rules:
    - GOV-CMP-001
    steps:
    - step: 验证CMR-001新市场准入合规评估
      command: 检查新市场准入是否有合规评估记录
      expected_exit: 0
      on_fail: 禁止在该市场交易
    - step: 验证CMR-002合规检查维度覆盖
      command: 检查合规检查清单是否覆盖所有维度
      expected_exit: 0
      on_fail: 审计不通过
    - step: 验证CMR-003法规变更后评估更新
      command: 检查法规变更后是否更新评估
      expected_exit: 0
      on_fail: 合规风险
  gov_cmp_002_audit_operations:
    title: 必须审计的6类操作
    section_type: principles
    original_rules:
    - GOV-CMP-002
    - AUD-001
    principles:
    - id: AOP-TRADE
      statement: 交易下单/撤单必须审计，记录时间、标的、方向、数量、价格、操作者
      rationale: 交易操作是核心业务操作，必须完整留痕
      applies_to: 交易系统
    - id: AOP-CONFIG
      statement: 系统配置变更必须审计，记录变更前值、变更后值、操作者、时间
      rationale: 配置变更可能影响系统行为，必须可追溯
      applies_to: 配置管理系统
    - id: AOP-SECRET
      statement: 密钥/权限变更必须审计，记录变更类型、影响范围、审批者、时间
      rationale: 密钥和权限变更是安全敏感操作
      applies_to: 密钥管理系统
    - id: AOP-DATABASE
      statement: 数据库读写（生产）必须审计，记录查询内容、操作者、时间、影响行数
      rationale: 生产数据库操作必须可追溯
      applies_to: 生产数据库
    - id: AOP-AI
      statement: AI操作必须审计，记录操作内容、AI代理ID、权限级别、时间
      rationale: AI操作需要与人类操作同等留痕
      applies_to: AI代理系统
    - id: AOP-SECURITY
      statement: 安全事件必须审计，记录事件级别、描述、响应措施、复盘结论
      rationale: 安全事件是事后分析和改进的基础
      applies_to: 安全事件响应系统
  gov_cmp_002_record_format:
    title: 审计记录格式模板
    section_type: examples
    original_rules:
    - GOV-CMP-002
    - AUD-004
    examples:
    - title: 审计记录标准格式
      code: "audit_record:\n  timestamp: \"2026-05-04T10:30:00Z\"\n  operator_id: \"Owner\"\n  operation_type: \"governance_audit\"\n  operation_detail: \"FULL audit D1-D12, level L2\"\n  result: \"PASS with 3 P1 findings\"\n"
      language: yaml
      note: timestamp使用ISO 8601格式YYYY-MM-DDTHH:MM:SSZ（UTC时区），字段名使用snake_case
  gov_cmp_002_verification:
    title: 审计追踪验证方式
    section_type: verification
    original_rules:
    - GOV-CMP-002
    steps:
    - step: 验证AUD-001审计不可绕过
      command: 检查6类操作是否都有审计记录
      expected_exit: 0
      on_fail: 视为P1安全事件
    - step: 验证AUD-002审计日志不可篡改
      command: 检查审计日志是否有被修改的痕迹
      expected_exit: 0
      on_fail: 视为P0安全事件
    - step: 验证AUD-003审计日志访问受限
      command: 检查审计日志的访问权限配置
      expected_exit: 0
      on_fail: 收回越权访问权限
    - step: 验证AUD-004审计记录格式
      command: 抽查审计日志格式是否合规（5个必填字段+snake_case+ISO 8601）
      expected_exit: 0
      on_fail: 格式不合规的记录需补录
  gov_cmp_003_audit_types:
    title: 审计类型与等级分类
    section_type: principles
    original_rules:
    - GOV-CMP-003
    principles:
    - id: ATYPE-FULL
      statement: 全量审计(FULL)——季度评审/Phase过渡/重大变更后触发，覆盖D1-D12全部维度，预计耗时30-60min，执行者为Owner+AI
      rationale: 全量审计确保系统整体健康
      applies_to: 季度评审/Phase过渡/重大变更
    - id: ATYPE-QUICK
      statement: 快速扫描(QUICK)——每日/每次commit后触发，覆盖D3+D5+D6+D7维度，预计耗时5-10min，执行者为AI自动
      rationale: 快速扫描保证日常合规底线
      applies_to: 每日/每次commit
    - id: ATYPE-TARGETED
      statement: 定向审计(TARGETED)——发现问题后定向排查/新模块准入触发，覆盖指定维度，预计耗时10-20min，执行者为Owner+AI
      rationale: 定向审计高效聚焦问题
      applies_to: 问题排查/新模块准入
    - id: ATYPE-COMPLIANCE
      statement: 合规审计(COMPLIANCE)——外部要求/合规检查触发，覆盖D6+D11+D12维度，预计耗时20-30min，执行者为Owner
      rationale: 合规审计满足外部监管要求
      applies_to: 外部审计/合规检查
    - id: ALEVEL-L1
      statement: 基础级(L1)——所有P0脚本0违规，适用于每日快速扫描的最低要求
      rationale: L1是合规底线
      applies_to: 每日快速扫描
    - id: ALEVEL-L2
      statement: 标准级(L2)——所有P0+P1脚本0违规 + 12维综合分≥6.0，适用于Phase过渡门/季度评审
      rationale: L2是过渡门槛
      applies_to: Phase过渡/季度评审
    - id: ALEVEL-L3
      statement: 生产级(L3)——所有P0+P1+P2脚本0违规 + 12维综合分≥8.0，适用于stable稳定态/外部审计
      rationale: L3是生产级标准
      applies_to: 稳定态/外部审计
  gov_cmp_003_audit_type_level_matrix:
    title: 审计类型与等级矩阵
    section_type: decision_tree
    original_rules:
    - GOV-CMP-003
    branches:
    - condition: 审计类型为FULL
      if_true: 最低等级L2，推荐等级L3
      if_false: 继续判断
    - condition: 审计类型为QUICK
      if_true: 最低等级L1，推荐等级L1
      if_false: 继续判断
    - condition: 审计类型为TARGETED
      if_true: 最低等级L1，推荐等级L2
      if_false: 继续判断
    - condition: 审计类型为COMPLIANCE
      if_true: 最低等级L2，推荐等级L3
      if_false: 无效审计类型
  gov_cmp_003_12_dimensions:
    title: 12维度审计清单
    section_type: procedure
    original_rules:
    - GOV-CMP-003
    steps:
    - order: 1
      action: D1目录与配置结构——审计孤儿.py、临时/残留文件、index与磁盘一致性、immutable_core零修改、pre-commit/CI配置完整性
      pre_condition: 项目根目录+scripts/governance/+src/zephyr/+tests/+docs/各级index.md+config/+.pre-commit-config.yaml+.github/workflows/
      expected_result: 零孤儿.py；零临时/残留文件；所有index.md与磁盘一致；immutable_core零修改
      on_failure: GATE-17/GATE-IDX/GATE-SQ/GATE-ADM门禁阻断
    - order: 2
      action: D2链接与引用——审计内部链接有效性、相对路径检测
      pre_condition: docs/所有.md文件的内部链接+architecture_model/YAML的交叉引用
      expected_result: 零断裂内部链接；零相对路径引用
      on_failure: GATE-01门禁阻断
    - order: 3
      action: D3元数据合规——审计frontmatter字段、命名规范、蓝图真源、枚举一致性、登记表总索引自校验
      pre_condition: docs/所有含frontmatter的.md文件+_registry/vocabularies/*.yaml(12个)+_registry/catalogs/*.yaml+_registry/contracts/*.yaml
      expected_result: 所有frontmatter字段合法且一致；零跨级降格；零过期未归档文件；枚举派生零漂移
      on_failure: GATE-11/GATE-12/GATE-15/GATE-16/GATE-ENUM/GATE-FRONTMATTER/GATE-DERIVED/GATE-DUP门禁阻断
    - order: 4
      action: D4路径纪律——审计废弃路径写入、废墟引用、文件过度搬迁、删除引用分离提交
      pre_condition: docs/+src/zephyr/的文件路径+git log中的文件移动记录
      expected_result: 零废弃路径写入；零废墟引用；文件搬迁≤1次
      on_failure: GATE-16间接覆盖
    - order: 5
      action: D5架构一致性——审计YAML↔代码↔文档三方一致、循环依赖、AI自治权限、蓝图同步、接口契约
      pre_condition: architecture_model/*.yaml+layers/*.yaml(25+)+docs/03_modules/*/blueprint.md+src/zephyr/目录结构+_registry/contracts/*.yaml+ai_autonomy_authority_registry.yaml
      expected_result: YAML↔代码↔文档三方一致；零循环依赖；零未登记模块；蓝图与代码同步；AI自治权限注册表自洽
      on_failure: GATE-01~03/06/07/14/16/A/B/SUM/XREF/BLUEPRINT-CODE/CONTRACT/INDEX/13/AUTHORITY门禁阻断
    - order: 6
      action: D6安全红线——审计密钥硬编码、shell=True、危险Git/Shell命令、锚点文件删除、日志敏感词
      pre_condition: src/zephyr/**/*.py+scripts/governance/**/*.py+tests/**/*.py+所有配置文件+21个锚点文件
      expected_result: 零密钥硬编码；零shell=True；零危险Git/Shell命令；锚点文件零删除；规则文件零模糊术语
      on_failure: pre-commit detect-private-key hook阻断
    - order: 7
      action: D7代码质量——审计缺失encoding、FLE import合规、测试覆盖率、未使用导入、直接LLM调用
      pre_condition: src/zephyr/**/*.py+tests/**/*.py
      expected_result: 测试覆盖率≥70%；零未使用导入；零缺失encoding；公共API有docstring+类型注解；D_FACTOR-D_REPORTING零直接LLM SDK调用
      on_failure: GATE-18测试收集门禁阻断
    - order: 8
      action: D8文档同步——审计TTL过期、文档生命周期、带日期快照、AI产物位置
      pre_condition: docs/所有.md文件的TTL/status/superseded_by/created_by字段
      expected_result: 零TTL过期文件；零带日期快照；AI产物不在docs/主目录
      on_failure: GATE-15/GATE-16间接覆盖
    - order: 9
      action: D9知识图谱——审计孤立文档、规范用语重复定义
      pre_condition: docs/所有.md文件的入边引用关系
      expected_result: 零孤立文档（每个文件≥1入边引用）；零规范用语重复定义
      on_failure: 无独立门禁
    - order: 10
      action: D10运维架构——检查SLI/SLO定义完整性、OpenTelemetry覆盖
      pre_condition: src/zephyr/运维相关代码+08-operations_architecture.md
      expected_result: 5项SLI/SLO已定义；OpenTelemetry traces/metrics/logs三支柱覆盖
      on_failure: 手动检查
    - order: 11
      action: D11合规运营——审计manifest准入、脚本质量、commit格式、蓝图重叠、真源级联
      pre_condition: scripts/governance/**/*.py+script-manifest.yaml+git commit messages+docs/真源引用链
      expected_result: 所有治理脚本通过10项质量检查；manifest准入8项全通过；commit格式100%合规
      on_failure: GATE-SQ/GATE-ADM/GATE-COMMIT/GATE-13门禁阻断
    - order: 12
      action: D12 AI幻觉与治理——审计Session 12项gate_check完整性
      pre_condition: Session logs+.runtime/logs/+Vibe Coding会话记录
      expected_result: Session操作不超预算；每次会话12项gate_check全部pass
      on_failure: VC-A/B/C/D门禁阻断
  gov_cmp_003_audit_tools:
    title: 审计工具矩阵
    section_type: verification
    original_rules:
    - GOV-CMP-003
    steps:
    - step: 统一调度全部审计脚本（以script-manifest.yaml为准）
      command: python scripts/governance/run_all.py
      expected_exit: 0
      on_fail: 检查脚本健康状态
    - step: 按维度选择性执行
      command: python scripts/governance/run_all.py --dimensions D3 D5 D6 D7
      expected_exit: 0
      on_fail: 按维度排查
    - step: 警告模式执行（不阻断）
      command: python scripts/governance/run_all.py --warn-only
      expected_exit: 0
      on_fail: 记录警告
    - step: 审计脚本健康状态查询
      command: python scripts/governance/status.py
      expected_exit: 0
      on_fail: 检查脚本注册
    - step: SSoT矛盾扫描
      command: python scripts/governance/d5_architecture/validate_ssot.py
      expected_exit: 0
      on_fail: 修复SSoT冲突
    - step: 12维评分
      command: python scripts/governance/score_architecture.py --quarterly
      expected_exit: 0
      on_fail: 修复低分维度
    - step: 架构门禁检查
      command: python scripts/governance/d5_architecture/check_architecture_gates.py
      expected_exit: 0
      on_fail: 修复门禁违规
    - step: 环境就绪检查
      command: python scripts/governance/env_check.py --install
      expected_exit: 0
      on_fail: 安装缺失依赖
    - step: 索引自动校验/修复
      command: python scripts/governance/d5_architecture/auto-generate-index.py --check
      expected_exit: 0
      on_fail: 修复索引
  gov_cmp_003_audit_frequency:
    title: 审计频率调度
    section_type: procedure
    original_rules:
    - GOV-CMP-003
    steps:
    - order: 1
      action: 每次commit——QUICK自动审计，覆盖pre-commit 25 hooks+GATE-01~18+SQ+ADM+IDX+COMMIT，等级L1，自动执行
      pre_condition: git commit触发
      expected_result: pre-commit hooks全部通过
      on_failure: commit被阻断
    - order: 2
      action: 每日——QUICK审计，覆盖D3+D5+D6+D7，等级L1，AI执行
      pre_condition: 每日定时
      expected_result: P0=0
      on_failure: 进入闭环处置
    - order: 3
      action: 每周——TARGETED审计，覆盖上周变更涉及的维度+script_manifest新增脚本验证，等级L1，AI执行
      pre_condition: 每周定时
      expected_result: 变更维度P0=0
      on_failure: 进入闭环处置
    - order: 4
      action: 每两周——FULL轻量审计，覆盖D1-D12仅P0脚本（以script-manifest.yaml为准），等级L1，AI执行
      pre_condition: 每两周定时
      expected_result: P0全过
      on_failure: 进入闭环处置
    - order: 5
      action: 每月——FULL审计，覆盖D1-D12 P0+P1脚本（以script-manifest.yaml为准），等级L2，Owner+AI执行
      pre_condition: 每月定时
      expected_result: P0+P1全过+综合分≥6.0
      on_failure: 进入闭环处置
    - order: 6
      action: 每季度——FULL+评分审计，覆盖D1-D12全量脚本（以script-manifest.yaml为准）+score_architecture.py，等级L2-L3，Owner执行
      pre_condition: 每季度定时
      expected_result: 全量通过+综合分达标
      on_failure: 进入闭环处置
    - order: 7
      action: Phase过渡时——FULL+评分审计，覆盖D1-D12全量+Phase退出门检查，等级L2+，Owner执行
      pre_condition: Phase过渡触发
      expected_result: Phase退出门检查通过
      on_failure: 禁止过渡
  gov_cmp_003_trigger_audit:
    title: 触发式审计决策树
    section_type: decision_tree
    original_rules:
    - GOV-CMP-003
    branches:
    - condition: 新模块准入
      if_true: TARGETED审计D1+D3+D5+D11
      if_false: 继续判断
    - condition: 安全事件
      if_true: TARGETED审计D6+D11
      if_false: 继续判断
    - condition: 架构变更
      if_true: TARGETED审计D3+D5+D12
      if_false: 继续判断
    - condition: CI管线失败
      if_true: TARGETED审计失败维度
      if_false: 继续判断
    - condition: SSoT矛盾新增
      if_true: TARGETED审计D5+D11
      if_false: 继续判断
    - condition: 新审计脚本提交
      if_true: TARGETED审计D11(GATE-ADM 8项准入+GATE-SQ质量)+D1(smoke_test)
      if_false: 继续判断
    - condition: 登记表变更
      if_true: TARGETED审计D3(validate_registry_master_index+validate_frontmatter_values)
      if_false: 无需触发式审计
  gov_cmp_003_execution_flow:
    title: 审计执行5步法
    section_type: procedure
    original_rules:
    - GOV-CMP-003
    steps:
    - order: 1
      action: 确定审计范围——确定审计类型→查§1.1获取覆盖维度→确定审计等级→查§1.2获取通过条件→git diff --stat获取最近变更文件→检查触发式审计→记录审计范围到Session Log
      pre_condition: 审计需求已明确
      expected_result: 审计范围清单已生成
      on_failure: 范围不明确则暂停
    - order: 2
      action: 执行自动化扫描——运行env_check.py --install→按维度执行run_all.py→QUICK模式必须包含D3+D5→记录扫描结果到stdout+.runtime/logs/
      pre_condition: 审计范围清单已生成
      expected_result: 自动化扫描报告已生成
      on_failure: 环境问题先修复
    - order: 3
      action: 人工复核——审查P0违规(必须修复)→审查P1违规(评估是否需立即修复)→审查P2违规(记录到待办)→对自动化无法覆盖的检查项人工审查(D10运维/D12 AI自检/ARG架构评审/G1-G5 KMS管道/MOD-ADMIT准入/回滚策略/渐进式信任/知识衰减)
      pre_condition: 自动化扫描报告已生成
      expected_result: 复核结论已形成
      on_failure: P0违规必须修复
    - order: 4
      action: 生成审计报告——填写审计报告模板→FULL类型额外运行score_architecture.py --quarterly --dashboard→归档报告到docs/_working/audit/reports/
      pre_condition: 复核结论已形成
      expected_result: 审计报告已归档
      on_failure: 报告不完整则补全
    - order: 5
      action: 闭环处置——P0违规立即修复→重跑失败脚本验证→P1违规排入当前sprint→P2违规记录到backlog→修复完成后重新执行步骤2验证→更新审计报告状态为CLOSED→审计追踪记录(GOV-CMP-002 §2)
      pre_condition: 审计报告已生成
      expected_result: 所有违规已处置并验证，报告状态为CLOSED
      on_failure: P0未修复不关闭
  gov_cmp_003_flow_decision_tree:
    title: 审计流程决策树
    section_type: decision_tree
    original_rules:
    - GOV-CMP-003
    branches:
    - condition: 审计类型为QUICK
      if_true: run_all.py --dimensions D3 D5 D6 D7 --warn-only → P0=0则PASS记录结果结束 / P0>0则FAIL进入步骤5闭环
      if_false: 继续判断
    - condition: 审计类型为FULL
      if_true: env_check.py → run_all.py全量脚本（以script-manifest.yaml为准） → L2通过则score_architecture.py生成报告结束 / L2未通过则进入步骤5闭环修复后重跑
      if_false: 继续判断
    - condition: 审计类型为TARGETED
      if_true: run_all.py --dimensions <指定> --warn-only → 目标维度P0=0则PASS记录结果结束 / 目标维度P0>0则FAIL进入步骤5闭环
      if_false: 无效审计类型
  gov_cmp_003_violation_escalation:
    title: 违规处置升级路径
    section_type: escalation
    original_rules:
    - GOV-CMP-003
    triggers:
    - trigger: P0违规发现
      level: P0
      action: 立即修复（同一session内）→重跑失败脚本→确认0违规
      timeout: 同一session内
    - trigger: P1违规发现
      level: P1
      action: 排入当前sprint（≤2周）→创建任务卡→修复→验证
      timeout: 2周
    - trigger: P2违规发现
      level: P2
      action: 记录到backlog→择机修复→验证
      timeout: 下sprint或按计划
  gov_cmp_003_report_template:
    title: 审计报告模板
    section_type: examples
    original_rules:
    - GOV-CMP-003
    examples:
    - title: 审计报告文件命名
      code: docs/_working/audit/reports/<YYYY-MM-DD>-<审计类型>-audit_report.md
      language: text
      note: 示例docs/_working/audit/reports/2026-05-04-FULL-audit_report.md
    - title: 审计报告frontmatter
      code: '---

        type: generated

        ttl: 90d

        generated_by: audit-protocol-GOV-CMP-003

        audit_type: FULL | QUICK | TARGETED | COMPLIANCE

        audit_level: L1 | L2 | L3

        scan_time: <YYYY-MM-DD HH:MM:SS>

        auditor: <Owner | AI-Agent-ID>

        ---

        '
      language: yaml
      note: 报告TTL为90天
    - title: 审计报告摘要表
      code: '| 严重级别 | 数量 | 处置要求 |

        |---------|------|---------|

        | P0（严重）| N | 必须立即修复 |

        | P1（重要）| N | 本sprint内修复 |

        | P2（建议）| N | 按计划处理 |

        '
      language: markdown
      note: P0/P1/P2三级分类
  gov_cmp_003_quick_reference:
    title: 审计快速参考
    section_type: context
    original_rules:
    - GOV-CMP-003
    context:
      summary: 日常审计速查——每日D3+D5+D6+D7 warn-only；每周D1-D9+D11+D12 warn-only；每月全量run_all.py；季度全量+评分+dashboard。违规处置——P0立即修复不通过不睡觉；P1本sprint不拖延；P2记backlog不遗忘。等级速查——L1=P0全过(P0脚本数以script-manifest.yaml为准)；L2=P0+P1全过+综合分≥6.0(脚本数以script-manifest.yaml为准)；L3=P0+P1+P2全过+综合分≥8.0(全部脚本，以script-manifest.yaml为准)
      impact_on_rules:
      - QUICK模式必须包含D3+D5（最高频违规来源）
      - P0违规未修复禁止关闭审计
      - 审计结果必须按GOV-CMP-002 §2-4留痕
      key_decisions:
      - 门禁数以gate_registry.yaml的total_gates为准
      - catalogs登记表数以registry-master-index.yaml的total_registries为准
      - 不依赖附录中的历史常量
  gov_cmp_003_framework_alignment:
    title: 专业框架对标
    section_type: principles
    original_rules:
    - GOV-CMP-003
    principles:
    - id: ALIGN-OWASP
      statement: OWASP ASVS对标——V1架构安全→D5+ARG门禁；V2认证→D6；V3会话→D12；V4访问控制→D5 ABS-05~10；V5输入验证→D6 shell=True/危险命令；V7错误处理→D7 COND-44~15；V8数据保护→D6日志敏感词；V10恶意代码→D6全部9个P0安全脚本；V13配置→D1 11层纵深+pre-commit
      rationale: 对标OWASP ASVS确保安全审计覆盖面
      applies_to: 安全审计维度设计
    - id: ALIGN-OPENSFF
      statement: OpenSSF Best Practices Badge对标——基础设施安全→D6 11个安全脚本+pre-commit detect-secrets；代码质量→D7 14个质量脚本+ruff；安全审计→本协议全文+脚本数以script-manifest.yaml为准+门禁数以gate_registry.yaml的total_gates为准；漏洞响应→GOV-CMP-002审计追踪+D6；文档完整性→D8 4个文档同步脚本+D9 2个知识脚本
      rationale: 对标OpenSSF确保开源最佳实践
      applies_to: 合规审计框架设计
    - id: ALIGN-NASA
      statement: NASA Kaiaulu方法论对标——Git挖掘合规证据→run_all.py（脚本数以script-manifest.yaml为准）+git diff准入；量化合规指标→12维评分+score_architecture.py；可视化项目合规→--dashboard输出+报告模板；最小化审计工作量→4类审计类型+7级频率调度
      rationale: 对标Kaiaulu确保审计方法论科学性
      applies_to: 审计方法论设计
  gov_cmp_003_cross_validation:
    title: 交叉验证记录
    section_type: verification
    original_rules:
    - GOV-CMP-003
    steps:
    - step: 脚本覆盖交叉验证——manifest中所有脚本（以script-manifest.yaml为准）在§2中全覆盖，协议中引用的脚本路径在manifest中存在，P0/P1/P2优先级与manifest一致
      command: 对比script-manifest.yaml与audit_protocol.md §2
      expected_exit: 0
      on_fail: 补充遗漏脚本引用
    - step: 门禁覆盖交叉验证——所有门禁在协议中均有引用位置（门禁数以gate_registry.yaml的total_gates为准）
      command: 对比gate_registry.yaml与audit_protocol.md
      expected_exit: 0
      on_fail: 补充遗漏门禁引用
    - step: 登记表覆盖交叉验证——所有登记表（以registry-master-index.yaml的total_registries为准）通过validate_registry_master_index.py等脚本覆盖
      command: 对比registry-master-index.yaml与审计脚本覆盖
      expected_exit: 0
      on_fail: 补充遗漏登记表覆盖
  gov_cmp_003_known_limitations:
    title: 已知限制与缓解
    section_type: error_patterns
    original_rules:
    - GOV-CMP-003
    patterns:
    - pattern: KMS管道门禁G1-G5为运行时门禁
      description: 非静态扫描，依赖gate_engine.py在线状态
      example: G1-G5门禁在CI governance.yml管道回归中检查
      detection: §5步骤3人工复核+CI管道回归
    - pattern: ARG-001~005架构评审为纯人工评审
      description: 大多为draft状态，需Owner人工
      example: 架构评审门禁需人工确认
      detection: §5步骤3人工复核
    - pattern: AGENTS.md §6.7/6.8/6.13无自动化脚本
      description: 回滚策略/渐进式信任/知识衰减概念性强，无自动化检测
      example: 无法自动检测回滚策略是否完整
      detection: 人工审查
    - pattern: D10运维架构无专项脚本
      description: 当前无自动化审计脚本覆盖D10
      example: SLI/SLO定义完整性需手动检查
      detection: 手动检查08-operations_architecture.md
  gov_cmp_001_scope:
    title: 监管分类法适用范围
    section_type: context
    original_rules:
    - GOV-CMP-001
    context:
      summary: 监管分类法定义ZephyrAlpha量化交易系统涉及的监管框架分类，适用于3类场景
      impact_on_rules:
      - 新市场准入必须先完成合规评估（CMR-001）
      - 合规检查维度覆盖决定审计范围（CMR-002）
      - 法规变更和新产品上线触发评估更新（CMR-003）
      key_decisions:
      - 适用场景1：确定不同市场/管辖区适用的监管规则
      - 适用场景2：合规检查的分类维度
      - 适用场景3：新市场准入的合规评估
  gov_cmp_001_change_history:
    title: 监管分类法修订记录
    section_type: examples
    original_rules:
    - GOV-CMP-001
    items:
    - description: v0.2.0 审批修复
      details: '#16 审批修复：ABS/COND → CMR-（CMR-001~CMR-003），消除SSoT冲突。补齐depends_on:[GOV-CMP-002]+ai_autonomy:human_gated（合规准入含Owner决策链）。date→2026-05-01'
    - description: v0.1.0 初始版本
      details: 2026-04-30 初始版本
  gov_cmp_002_scope:
    title: 审计追踪策略适用范围
    section_type: context
    original_rules:
    - GOV-CMP-002
    context:
      summary: 审计追踪策略定义ZephyrAlpha系统中什么操作必须留痕，适用于6类操作类型
      impact_on_rules:
      - 6类操作必须审计留痕（含安全事件）
      - 审计日志不可篡改和访问受限是安全底线
      key_decisions:
      - 适用操作1：交易操作
      - 适用操作2：系统配置变更
      - 适用操作3：密钥/权限变更
      - 适用操作4：数据访问
      - 适用操作5：AI操作
      - 适用操作6：安全事件
  gov_cmp_002_cross_refs:
    title: 审计追踪策略交叉引用
    section_type: context
    original_rules:
    - GOV-CMP-002
    context:
      summary: 审计追踪策略与GOV-SEC-002（角色定义）和GOV-DATA-003（保留期限）存在强依赖关系
      impact_on_rules:
      - AUD-003审计日志访问受限——角色定义见GOV-SEC-002访问控制策略
      - 审计日志保留期限参见GOV-DATA-003 data-retention-policy.md §2保留期限表
      key_decisions:
      - Auditor和Owner角色定义以GOV-SEC-002为SSoT
      - 保留期限以GOV-DATA-003为SSoT
  gov_cmp_002_change_history:
    title: 审计追踪策略修订记录
    section_type: examples
    original_rules:
    - GOV-CMP-002
    items:
    - description: v0.2.0 审批修复
      details: '#25 审批修复。(1)编号前缀：ABS/COND→AUD-（AUD-001~AUD-004）。(2)AUD-004审计记录格式：指定字段名使用snake_case（timestamp/operator_id/operation_type/operation_detail/result），ISO 8601格式YYYY-MM-DDTHH:MM:SSZ。(3)depends_on:GOV-DATA-003,GOV-SEC-002,ai_autonomy:human_gated。(4)date→2026-05-01'
    - description: v0.3.0 内部矛盾修复
      details: RQ-01审查修复。gov_cmp_002_scope summary从"5类操作"修正为"6类操作"，impact_on_rules从"5类操作必须审计留痕，扩展为6类"修正为"6类操作必须审计留痕（含安全事件）"，key_decisions补充第6类"安全事件"，与gov_cmp_002 actions的6类操作定义对齐
    - description: v0.1.0 初始版本
      details: 2026-04-30 初始版本
  gov_cmp_003_scope:
    title: 治理审计执行协议范围声明
    section_type: context
    original_rules:
    - GOV-CMP-003
    context:
      summary: 明确本协议是什么和不是什么，防止范围蔓延
      impact_on_rules:
      - 本协议是审计执行入口——打开即知如何审计
