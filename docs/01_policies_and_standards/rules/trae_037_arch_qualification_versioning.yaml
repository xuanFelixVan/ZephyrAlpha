      pre_condition: 边状态为resolved
      expected_result: 无告警输出
      on_failure: N/A
    - order: 5
      action: 策略文件加载失败时MUST回退到默认规则——MOD-INF-*→MOD-INF-019的边不参与环检测；TEMPLATE-*和GOV-*之间的小环(≤3步)降级为WARNING
