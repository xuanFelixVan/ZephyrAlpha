  gov_arch_010_cycle_analysis:
    title: 剩余21循环根因分析
    section_type: root_cause_analysis
    original_rules:
    - GOV-ARCH-010
    methodology: 按类别分层分析——文档级循环2个+跨层网格19个，识别核心致密三角并制定分步解网方案
    reasoning_chain:
    - step: 1
      finding: 2个文档级循环——REMAIN-DOC-001(task-system↔task-card-template)和REMAIN-DOC-002(model-routing-policy↔task-system)
      implication: 文档模板与模块间的双向引用需改为单向依赖
    - step: 2
      finding: 19个跨层网格循环，核心簇为feedback-loop↔pipeline↔llm-security致密三角
      implication: 核心三角是根因，所有外围模块通过audit-trail↔database接入该三角
    - step: 3
      finding: 外围模块(agent-rbac/rollback-system/drift-detector/budget-enforcer/escalation-protocol)均依赖audit-trail
      implication: 将外围模块对audit-trail的依赖全部迁至EventBus可立即消除大量小循环
    - step: 4
      finding: 核心三角需架构级重新设计，定义EventBus Topic契约将调用关系转为subscribe/publish
      implication: 需owner+架构评审决策，预计Step A后剩余约10循环，Step B后剩余0-3循环（含LEGAL-001）
