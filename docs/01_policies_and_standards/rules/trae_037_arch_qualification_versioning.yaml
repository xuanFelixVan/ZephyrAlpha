rule_id: TRAE-037
title: 架构治理-合格与版本化
version: 0.4.2
layer: L1_foundation
module_id: TRAE-037
depends_on: []
tags:
- TRAE
- architecture_qualification
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- GOV-ARCH-003
- GOV-ARCH-004
- GOV-ARCH-010
severity: error
scope: architecture_qualification
domain: TRAE
triggers:
- operation: architecture_qualification
sections:
  gov_arch_003:
    title: 架构版本化策略
    section_type: rule
    original_rules:
    - GOV-ARCH-003
    - AVP-001
    - AVP-002
    - AVP-003
    - AVP-004
    conditions:
    - type: constraint
      check: 架构文档frontmatter是否包含version字段
      pass: 格式为X.Y.Z，合规
      fail: 文档不合规
    - type: constraint
      check: 版本号递增是否符合规则
      pass: Patch(Z+1)=文字修正；Minor(Y+1)=新增章节/规则；Major(X+1)=架构方向变更
      fail: 版本号混乱
    - type: trigger
      check: Minor及以上变更
      pass: 必须在文档末尾修订记录中记录变更日期、版本和内容
      fail: 审计不通过
    - type: trigger
      check: 架构变更导致代码修改
      pass: 代码变更的PR必须引用对应的架构文档版本
      fail: PR不被接受
    actions:
    - type: mandatory
      step: 所有架构文档frontmatter必须包含version字段，格式X.Y.Z（AVP-001）
    - type: mandatory
      step: 版本号递增遵循Patch/Minor/Major规则（AVP-002）
    - type: mandatory
      step: Minor及以上变更必须在修订记录中记录变更日期、版本和内容（AVP-003）
    - type: mandatory
      step: 架构变更导致代码修改时，PR必须引用对应架构文档版本，架构决策记录参见KB:decisions namespace（AVP-004）
    prohibitions:
    - 架构文档不得省略version字段
    - 版本号递增不得违反Patch/Minor/Major语义
  gov_arch_004:
    title: 系统合格判定标准
    section_type: rule
    original_rules:
    - GOV-ARCH-004
    - SQS-001
    - SQS-002
    - SQS-003
    - SQS-004
    conditions:
    - type: constraint
      check: 工程层6项基础检查——模块边界清晰、统一日志/Tracing、回测&实盘一致性、异常处理机制、数据质量校验、延迟监控与SLI
      pass: 全部满足=达到工程级门槛
      fail: 任何一项不满足=系统尚未达到工程级门槛
    - type: constraint
      check: 架构层5项核心能力——数据流标准化、统一消息/数据总线、可扩展性、统一风控层、回放&仿真
      pass: 满足至少4项=专业级系统
      fail: 不满足4项=未达专业级
    - type: constraint
      check: 机构级7问——无人值守一周、100%决策回放、1天接入新策略、100+策略并行、统一风险敞口控制、交易成本可控(<收益20%)、合规审计要求
      pass: 7项全部满足=接近机构级系统
      fail: 未全部满足
    actions:
    - type: mandatory
      step: 工程层6项基础检查必须全部满足才算合格（SQS-001）
    - type: mandatory
      step: 架构层5项核心能力满足至少4项判定为专业级（SQS-002）
    - type: mandatory
      step: 机构级7问全部满足判定为接近机构级系统（SQS-003）
    - type: mandatory
      step: 系统水平综合公式=架构成熟度×策略质量×风控能力×执行稳定性，模块数量≠系统水平（SQS-004）
    prohibitions:
    - 不得以模块数量作为系统水平的判定依据
  gov_arch_010:
    title: 基础设施层依赖规则
    section_type: rule
    original_rules:
    - GOV-ARCH-010
    - ILDR-001
    - ILDR-002
    - ILDR-003
    - ILDR-004
    conditions:
    - type: constraint
      check: DEPTH_0边——shared-core依赖（所有MOD-INF-*→MOD-INF-019单向依赖）
      pass: 允许存在，不触发循环告警
      fail: N/A
    - type: constraint
      check: DEPTH_0边——database(SH-DB-001)↔system-telemetry(MOD-INF-015)双向依赖
      pass: 合法循环LEGAL-001，有限步长收敛，不触发循环告警
      fail: N/A
    - type: constraint
      check: DEPTH_1边——运行时调用关系应通过EventBus或Shared/Contract接口实现松耦合
      pass: 已迁至EventBus或标记pending_refactor
      fail: 触发循环告警，附带recommendation
    - type: constraint
      check: 跨层依赖边界——cross_layer模块间仅允许单向depends_on shared-core
      pass: 符合规则
      fail: 违规，需架构评审
    - type: exception
      check: DIP例外——编排器(控制平面)依赖下层抽象契约
      pass: 编排器depends_on下层Protocol/ABC/接口类(contract类型)或通过EventBus调度(event类型)，不触发逆向依赖告警
      fail: 编排器depends_on下层具体实现类(runtime类型)，触发违规告警
    actions:
    - type: mandatory
      step: 所有infra/cross_layer模块允许单向depends_on MOD-INF-019(shared-core)，不触发循环告警（ILDR-001）
    - type: mandatory
      step: database↔system-telemetry双向依赖为合法循环LEGAL-001，telemetry写db走connection-pool直写不走ORM（ILDR-002）
    - type: mandatory
      step: DEPTH_1边应迁至EventBus松耦合，已列出12条候选边及recommendation（ILDR-003）
    - type: mandatory
      step: 跨层依赖边界4条规则：cross_layer间仅单向depends_on shared-core；禁止直接双向depends_on（除LEGAL-001）；infra_ops→cross_layer仅允许depends_on shared-core/pipeline/database（需架构评审）；cross_layer→infra_ops仅允许depends_on具体l01模块（需架构评审，优先EventBus）（ILDR-004）
    - type: mandatory
      step: detect_depends_on_cycles.py消费本规则，DEPTH_0白名单边不触发循环告警，DEPTH_1边仍触发告警但附带recommendation
    - type: exception
      step: DIP例外——编排器(F1/AutoPilot)depends_on下层抽象契约(contract类型，如TaskRepository Protocol)或通过EventBus调度(event类型)不算逆向依赖，不触发循环告警。对标K8s CRI/CSI、Netflix Conductor Worker API。编排器depends_on下层具体实现类(runtime类型)触发违规告警
    prohibitions:
    - cross_layer模块之间禁止直接双向depends_on（除白名单LEGAL-001）
    - 禁止在DEPTH_1边维持直接depends_on而不迁至EventBus（pending_refactor状态需逐步消除）
    - 合法循环必须收敛、有限步长、可证明无分歧
    - 编排器禁止depends_on下层具体实现类(runtime类型)——应改为contract依赖抽象接口（DIP例外允许contract/event类型）
  gov_arch_003_scope:
    title: 架构版本化策略适用范围
    section_type: context
    original_rules:
    - GOV-ARCH-003
    summary: 本策略适用于架构视图文档、架构决策记录（KB decisions namespace）、系统设计文档
    impact_on_rules:
    - 界定AVP-001~004规则的适用范围，非架构类文档不强制遵循版本化策略
    key_decisions:
    - 架构决策记录参见KB:decisions namespace，ADR协议规约由本规则承接
  gov_arch_003_verification:
    title: 架构版本化验证方式
    section_type: verification
    original_rules:
    - GOV-ARCH-003
    steps:
    - step: AVP-001 检查架构文档是否有version字段
      command: 检查架构文档frontmatter是否包含version字段
      expected_exit: 0
      on_fail: 文档不合规，必须补齐version字段
    - step: AVP-002 检查版本号递增是否符合规则
      command: 对比变更前后版本号，验证Patch/Minor/Major递增语义
      expected_exit: 0
      on_fail: 版本号混乱，必须修正递增规则
    - step: AVP-003 检查修订记录是否完整
      command: Minor及以上变更后检查文档末尾修订记录
      expected_exit: 0
      on_fail: 审计不通过，必须补齐修订记录
    - step: AVP-004 检查代码PR是否引用架构版本
      command: 代码PR中检查是否引用对应架构文档版本
      expected_exit: 0
      on_fail: PR不被接受，必须补充架构文档版本引用
  gov_arch_003_change_history:
    title: 架构版本化策略修订记录
    section_type: examples
    original_rules:
    - GOV-ARCH-003
    items:
    - description: '2026-05-01 v0.2.0'
      details: '#20审批修复：ABS/COND→AVP-（AVP-001~AVP-004）。补齐depends_on:[GOV-ARCH-001]+ai_autonomy:human_gated。date→2026-05-01。'
    - description: '2026-04-30 v0.1.0'
      details: 初始版本
    - description: '2026-06-19 v0.3.0'
      details: RQ审查修复——补充references.scripts和enforcement.executors(detect_depends_on_cycles.py)、provenance迁移状态标记(RQ-04/RQ-09)。
  gov_arch_004_principles:
    title: 系统合格判定核心原则
    section_type: principles
    original_rules:
    - GOV-ARCH-004
    - SQS-004
    items:
    - id: SQS-P001
      statement: 模块数量≠系统水平
      rationale: 模块数量既可能代表复杂度高，也可能代表拆分过度、设计混乱。顶级量化系统有的模块很多，但也有极其精简、靠抽象和复用取胜的。
      applies_to: 系统合格判定、系统水平评价
    - id: SQS-P002
      statement: 系统水平=架构成熟度×策略质量×风控能力×执行稳定性
      rationale: 综合公式而非单一维度，模块数量不是评价因子
      applies_to: 系统水平综合评价
  gov_arch_004_verification:
    title: 工程层6项基础检查
    section_type: verification
    original_rules:
    - GOV-ARCH-004
    - SQS-001
    steps:
    - step: 模块边界清晰
      command: 依赖图分析——检查模块间低耦合、高内聚，无循环依赖
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须解决循环依赖
    - step: 统一日志/Tracing
      command: 日志审计——检查全链路可追踪，支持上下文传递
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须补齐统一日志
    - step: 回测&实盘一致性
      command: 回归测试——验证同一套代码逻辑在不同执行模式下结果一致
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须修复一致性问题
    - step: 异常处理机制
      command: 混沌测试——验证单点故障不扩散，有降级策略
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须补齐异常处理
    - step: 数据质量校验
      command: 数据质量报告——检查价格跳空检测、重复数据检测、时间戳一致性
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须补齐数据质量校验
    - step: 延迟监控与SLI
      command: 监控仪表盘——检查端到端延迟分布（P50/P99/P99.9）可观测
      expected_exit: 0
      on_fail: 系统尚未达到工程级门槛，必须补齐延迟监控
  gov_arch_004_architecture_patterns:
    title: 架构层5项核心能力与架构模式
    section_type: context
    original_rules:
    - GOV-ARCH-004
    - SQS-002
    summary: 架构层关键看5个核心能力（数据流标准化、统一消息/数据总线、可扩展性、统一风控层、回放&仿真），满足至少4项=专业级系统。2026年主流为混合架构，非纯EDA。
    impact_on_rules:
    - SQS-002判定规则依赖5项能力的满足数量
    key_decisions:
    - 满足5项中至少4项=专业级系统
    - 2026年主流为混合架构（EDA+Dataflow+RPC），非纯EDA
    architecture_capabilities:
    - '序号①: 数据流标准化——市场数据→特征→信号→决策→执行，链路清晰'
    - '序号②: 统一消息/数据总线——基于标准化总线（事件驱动/数据流/混合均可），非硬编码调用'
    - '序号③: 可扩展性——新增策略无需修改多个模块'
    - '序号④: 统一风控层——风险敞口集中管控，非各策略自行处理'
    - '序号⑤: 回放&仿真——可复现任意历史日期的决策过程'
    architecture_patterns:
    - pattern: 事件驱动(EDA)
      scenario: 高频、复杂事件处理
      trend: 仍主流，但混合模式增多
    - pattern: 数据流驱动(Dataflow)
      scenario: 中低频、批量特征计算
      trend: 因Apache Flink/Beam成熟，占比上升
    - pattern: 请求-响应(RPC)
      scenario: 策略配置、风控查询
      trend: 与EDA混合使用
    - pattern: 混合架构
      scenario: 大型机构
      trend: 2026年主流，非纯EDA
  gov_arch_004_frontier_tech:
    title: 前沿技术评估（2026年）
    section_type: context
    original_rules:
    - GOV-ARCH-004
    summary: 2026年前沿技术在量化系统中的成熟度评估，包括LLM异常检测、因果推断、联邦学习、量子优化
    impact_on_rules:
    - 前沿技术评估不直接影响合格判定，但影响架构演进方向
    key_decisions:
    - LLM-based异常检测建议评估引入（生产中）
    - 因果推断中长期规划（学术界→工业界）
    - 联邦学习视合作需求（早期采用）
    - 量子优化持续关注（实验阶段）
    frontier_tech_table:
    - tech: LLM-based异常检测
      maturity: 生产中
      scenario: 市场异常模式识别
      recommendation: 建议评估引入
    - tech: 因果推断(Causal Inference)
      maturity: 学术界→工业界
      scenario: 区分相关性与因果性，避免过拟合
      recommendation: 中长期规划
    - tech: 联邦学习(Federated Learning)
      maturity: 早期采用
      scenario: 多机构联合训练因子
      recommendation: 视合作需求
    - tech: 量子优化(Quantum Optimization)
      maturity: 实验阶段
      scenario: 组合优化（仓位分配）
      recommendation: 持续关注
  gov_arch_004_module_matrix:
    title: 模块数量与系统水平四象限矩阵
    section_type: decision_tree
    original_rules:
    - GOV-ARCH-004
    - SQS-004
    items:
    - condition: 模块多+结构清晰
      if_true: 有机构级雏形
      if_false:
    - condition: 模块多+调用混乱
      if_true: 复杂但不高级
      if_false:
    - condition: 模块少+抽象复用强
      if_true: 高水平设计
      if_false:
    - condition: 模块少+功能单薄
      if_true: 玩具项目
      if_false:
  gov_arch_004_change_history:
    title: 系统合格判定标准修订记录
    section_type: examples
    original_rules:
    - GOV-ARCH-004
    items:
    - description: v1.0.0 2026-05-01
      details: 初始版本。定义工程层6项基础检查、架构层5项核心能力、机构级7问、系统水平综合公式、模块数量四象限矩阵。
    - description: v1.1.0 2026-06-19
      details: RQ审查修复——补充change_history记录（RQ-14）。
  gov_arch_010_terminology:
    title: 基础设施层依赖术语定义
    section_type: context
    original_rules:
    - GOV-ARCH-010
    summary: 定义DEPTH_0边、DEPTH_1边、合法循环、EventBus松耦合、shared-core五个核心术语
    impact_on_rules:
    - 术语定义是ILDR-001~004规则的理解基础
    - detect_depends_on_cycles.py依赖这些术语进行循环检测分类
    key_decisions:
    - DEPTH_0边断则系统无法运行时初始化，不触发循环告警
    - DEPTH_1边可重构，应迁至EventBus松耦合
    - 合法循环必须收敛、有限步长、可证明无分歧
    terminology:
    - term: DEPTH_0边
      definition: 物理部署必须同时存在的依赖关系。断则系统无法运行时初始化。
    - term: DEPTH_1边
      definition: 运行时通过接口/EventBus/Shared实现的调用关系，可重构。
    - term: 合法循环
      definition: 两个模块互为DEPTH_0依赖（如database↔telemetry）。必须收敛、有限步长、可证明无分歧。
    - term: EventBus松耦合
      definition: 替代直接depends_on的模式——生产者发事件到Topic，消费者订阅，双方互不感知module_id。
    - term: shared-core
      definition: MOD-INF-019，位于_cross_layer/，提供所有基础设施模块共用的类型、常量、异常、协议定义。
  gov_arch_010_legal_cycle:
    title: 合法循环白名单
    section_type: context
    original_rules:
    - GOV-ARCH-010
    - ILDR-002
    summary: 合法循环LEGAL-001为database(SH-DB-001)↔system-telemetry(MOD-INF-015)双向依赖，有限步长收敛，不触发循环告警
    impact_on_rules:
    - LEGAL-001是ILDR-002的核心实例
    - detect_depends_on_cycles.py对LEGAL-001不触发循环告警
    key_decisions:
    - LEGAL-001经owner批准，approved_date为2026-05-06
    - telemetry写db走connection-pool直写不走ORM
    legal_cycles:
    - id: LEGAL-001
      path: SH-DB-001→MOD-INF-015→SH-DB-001
      justification: database↔system-telemetry运行时bootstrap对
      status: approved
      approved_by: owner
      approved_date: '2026-05-06'
      constraint: telemetry写db走connection-pool直写不走ORM
  gov_arch_010_eventbus_edges:
    title: 应迁至EventBus的DEPTH_1边
    section_type: procedure
    original_rules:
    - GOV-ARCH-010
    - ILDR-003
    steps:
    - order: 1
      action: 将feedback-loop(MOD-FEEDBACK_LOOP)→pipeline(MOD-INF-009)迁至EventBus Topic:action.execute
      pre_condition: feedback-loop depends_on pipeline
      expected_result: depends_on移除，FLE向pipeline提交Action走EventBus
      on_failure: 维持pending_refactor状态，触发循环告警
    - order: 2
      action: 将llm-security(MOD-LLM_SECURITY)→feedback-loop(MOD-FEEDBACK_LOOP)迁至EventBus Topic:alert.security
      pre_condition: llm-security depends_on feedback-loop
      expected_result: depends_on已移除，LSG异常上送改用EventBus松耦合
      on_failure: N/A（已resolved）
    - order: 3
      action: 将pipeline(MOD-INF-009)→llm-security(MOD-LLM_SECURITY)迁至EventBus Topic:action.security_check
      pre_condition: pipeline depends_on llm-security
      expected_result: depends_on移除，pipeline执行前安全检查走EventBus
      on_failure: 维持pending_refactor状态，触发循环告警
    - order: 4
