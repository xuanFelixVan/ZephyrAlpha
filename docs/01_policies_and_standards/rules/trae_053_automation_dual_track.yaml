sections:
  rule_fifteen:
    section_type: rule
    title: 自动化双轨判定(RULE-FIFTEEN)
    original_rules:
    - RULE-FIFTEEN
    conditions:
    - type: trigger
      check: 新建/改造自动化系统时
      pass: 通过两轨分类+实现验证(🕐定时/⚡事件/🕐+⚡双轨)
      fail: 单轨实现=未完成
    - type: constraint
      check: 全项目扫描(去重/孤儿/临时文件/审计保留)
      pass: 归属🕐定时轨
      fail: 挂在事件驱动上(每次文件变更扫全项目=拖死)
    - type: constraint
      check: 状态变更响应(BLOCKED→升级/IN_PROGRESS→超时计时器)
      pass: 归属⚡事件轨
      fail: 只靠定时(反馈延迟十几小时)
    - type: constraint
      check: 关键校验(预算健康/三方对齐/升级路径)
      pass: 归属🕐+⚡双轨(事件做增量+定时做全量兜底)
      fail: 只有一轨无兜底(事件丢了没补偿=漏报)
    actions:
    - type: mandatory
      step: STEP1判定归属→对照两轨分类表确定🕐/⚡/🕐+⚡
    - type: mandatory
      step: STEP2实现→🕐定时在boot_cron_jobs.py注册(circadian_scheduler.register_task)；⚡事件在boot_hooks.py注册(hook_registry.register或event_bus.subscribe)；🕐+⚡双轨两条都要
    - type: mandatory
      step: STEP3验证→python scripts/ide_health_service.py --status→circadian.running=true+tasks_registered正确计数→🕐通过；触发事件后check对应hooks执行→⚡通过
    prohibitions:
    - 新建自动化系统不判定两轨归属(盲目挂在单一轨=要么遗漏要么浪费)
    - 全项目重扫描挂在事件驱动上(每次文件变更扫全项目=拖死)
    - 实时校验只靠定时(等到凌晨才跑=反馈延迟十几小时)
    - 关键校验只有一轨无兜底(事件丢了没补偿=漏报)
    - 实现定时轨但不注册到circadian_scheduler(代码写好了但没人跑)
    - 实现事件轨但不注册到hook_registry(触发条件满足了但钩子不响)
