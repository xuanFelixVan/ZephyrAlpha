    items:
    - consumer: PS-STD-001
      tier: 1
      consumption: 新增scope stability字段定义
    - consumer: PS-STD-002
      tier: 1
      consumption: 引用Layer维度定义
    - consumer: behavior_boundaries_standard.yaml
      tier: 1
      consumption: 引用Executor维度定义+冲突裁决推导链
    - consumer: document-metadata-index.yaml
      tier: 1
      consumption: 新增domain scope stability字段
    - consumer: frontmatter_schema.json
      tier: 1
      consumption: 新增scope stability字段Schema
    - consumer: check_frontmatter_metadata.py
