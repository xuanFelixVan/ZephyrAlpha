  ps_std_004_ssot:
    title: SSoT声明
    section_type: context
    original_rules:
    - PS-STD-004 §12
    summary: 本标准作为规则分类体系五维度受控词表+冲突裁决推导链的唯一真源
    key_decisions:
    - 本标准是ZephyrAlpha项目规则分类体系五个维度及其受控词表+规则冲突裁决推导链的唯一真源
    - 下位规则可以定义领域内子分类但不得与本标准维度冲突
    - 新增字段scope和stability两个frontmatter字段由本标准定义
    - 冲突仲裁时本标准与PS-STD-001冲突以PS-STD-001为准(字段定义权属于PS-STD-001)
  ps_std_004_consumers:
