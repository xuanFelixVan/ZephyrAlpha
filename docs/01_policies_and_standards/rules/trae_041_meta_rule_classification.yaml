  ps_std_004_derivation_examples:
    title: 推导示例
    section_type: examples
    original_rules:
    - PS-STD-004 §10
    summary: 冲突裁决推导链的具体应用示例
    items:
    - case: 不同stability
      rule_a: PS-STD-003 §3 禁止删除审计日志 (stability=frozen)
      rule_b: 某domain规则日志可压缩 (stability=evolving)
      verdict: A优先 (frozen > evolving)
    - case: 同stability不同authority_tier
      rule_a: GOV-DOC-009 引用必须用绝对路径 (cross_layer stable)
      rule_b: 某模块规则模块内可用相对路径 (L3 stable)
      verdict: A优先 (cross_layer > L3)
    - case: 无法推导
      rule_a: PS-STD-003 ABS-14 不知道文件位置就不操作 (cross_layer frozen)
      rule_b: PS-STD-003 ABS-52 先读当前版本再改 (cross_layer frozen)
