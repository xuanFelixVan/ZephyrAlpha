rule_id: TRAE-041
title: 元规则-规则分类与裁决
version: 1.4.1
layer: L1_foundation
module_id: TRAE-041
depends_on:
- TRAE-018
- TRAE-019
- TRAE-020
tags:
- TRAE
- meta_rule_classification
- L2
ttl: permanent
stability: evolving
safety_level: L
ai_autonomy: ai_modifiable
aliases:
- PS-STD-004
- PS-STD-012
- STD-007
- STD-008
severity: warning
scope: meta_rule_classification
domain: TRAE
triggers:
- operation: meta_rule_classification
sections:
  ps_std_004_five_dimensions:
    title: 五维分类体系
    section_type: context
    original_rules:
    - PS-STD-004 §2~§7
    conditions:
    - type: trigger
      check: 创建或修改规则文件时
      pass: 规则文件五维分类完整且合规
      fail: 分类缺失或不合规
    actions:
    - type: mandatory
      step: 每条规则必须按5个维度分类：Domain(9值)/Authority Tier(L1/L2/L3/cross_layer)/Scope(global/domain/module/session)/Stability(frozen/stable/evolving)/Executor(immutable_core/human_gated/ai_modifiable)；每条规则必须且只能属于一个domain和scope
    prohibitions: []
  ps_std_004_vibe_coding_retrieval:
    title: Vibe Coding AI检索策略映射
    section_type: context
    original_rules:
    - PS-STD-004 §2.2
    summary: 五维分类定义了AI怎么理解规则，但Vibe Coding AI实际施工时需要怎么找到规则。以下是Vibe Coding AI从查询意图到分类维度的检索路径
    items:
    - query_intent: 文件操作的禁止行为有哪些
      retrieval_path: domain=document → stability=frozen→stable→evolving → 优先读PS-STD-003(SSoT)
      explanation: 先定位领域→按稳定性排序(冻结文件权威性最高)→先读SSoT
    - query_intent: 某个模块的编码规则变更要走什么审批
      retrieval_path: scope=module→domain → stability维度 → 查看PS-STD-009变更门控
      explanation: 自底向上——模块→领域→全局
    - query_intent: AI可以自主修改哪些文件
      retrieval_path: executor=ai_modifiable → stability不为frozen → layer可写
      explanation: AI自治权限=可修改范围→Executor维度直接筛选
    - query_intent: 当前项目所有规则文件有哪些
      retrieval_path: authority_tier=cross_layer → L1 → L2 → L3 → domain分组
      explanation: 层级影响范围大头优先——全局规则→领域规则→会话规则→模块规则
    - query_intent: 这条规则和哪条有冲突
      retrieval_path: scope相同 → stability是否矛盾 → §9冲突裁决推导链
      explanation: 作用范围相同的规则最可能冲突，不同scope互不干扰
    key_decisions:
    - SSoT优先——如果有SSoT文件声明了该领域(如PS-STD-003声明行为边界)，先读SSoT再查领域规则
    - 稳定性过滤——frozen文件优先于stable优先于evolving，冻结内容的权威性最高
    - 权威层级收敛——cross_layer → L1 → L2 → L3，范围大的先读，在理解全局约束后再看局部
    - 领域隔离——不同domain的规则互不冲突，冲突仅在同domain且scope重叠时发生
  ps_std_004_domain_vocabulary:
    title: 领域(Domain)受控词表
    section_type: context
    original_rules:
    - PS-STD-004 §3.1
    summary: 领域维度的9个受控词表条目——含义/对应目录/示例文件
    items:
    - value: meta
      meaning: 元规则——定义规则怎么写、怎么分类、怎么变更
      directory: meta/
      examples: PS-STD-002, PS-STD-003, PS-STD-004
    - value: document
      meaning: 文档治理——命名、路径、编码、生命周期
      directory: governance/document/
      examples: file-naming-standard.md
    - value: ai
      meaning: AI治理——自治权限、入职、幻觉自检
      directory: governance/ai/
      examples: ai-onboarding-guide.md
    - value: task
      meaning: 任务治理——任务卡、交接、裁决
      directory: governance/task/
      examples: task-card-standard.md
    - value: vibe_coding
      meaning: Vibe Coding操作——上下文规则、状态机、可验证性
      directory: operational/vibe_coding/
      examples: vibe-coding-session-state-runbook.md
    - value: architecture
      meaning: 架构治理——模块注入、入职规则
      directory: governance/module/
      examples: module-injection-rules.yaml
    - value: migration
      meaning: 迁移——迁移审计(该文件从未创建，2026-05-02已标记deprecated)
      directory: operational/migration/
      examples: —
    - value: devops
      meaning: DevOps——pre-commit、CI、部署
      directory: operational/devops/
      examples: pre-commit-simplification-plan.md
    - value: coding
      meaning: 编码——代码风格、安全编码
      directory: 待建立
      examples: encoding-safety-standard.md
  ps_std_004_authority_tier_vocabulary:
    title: 权威层级(Authority Tier)受控词表
    section_type: context
    original_rules:
    - PS-STD-004 §4.1
    summary: 权威层级维度的4个受控词表条目——含义/规范性语言/对应doc_type/章节
    items:
    - value: L1
      meaning: 治理层——最高权威，可使用MUST
      normative_language: MUST/SHOULD/MAY
      doc_types: policy, register
      chapters: 6~15章(按子类型，见PS-STD-002 §3.2)
    - value: L2
      meaning: 设计层——中等权威，禁止MUST
      normative_language: SHOULD/MAY
      doc_types: blueprint, architecture_view
      chapters: 10章
    - value: L3
      meaning: 基础层——信息性，禁止规范性语言
      normative_language: 禁止MUST/SHOULD
      doc_types: 其他所有doc_type
      chapters: 5章
    - value: cross_layer
      meaning: 跨层——适用于所有层级
      normative_language: 按引用上下文决定
      doc_types: meta类文件
      chapters: 6~15章(按子类型，见PS-STD-002 §3.2)
  ps_std_004_scope_vocabulary:
    title: 作用范围(Scope)受控词表与变更通知范围矩阵
    section_type: context
    original_rules:
    - PS-STD-004 §5.1, §5.2
    summary: Scope维度的4个受控词表条目(含义/影响范围/示例)及Scope变更通知范围矩阵
    items:
    - value: global
      meaning: 全局——影响项目中所有文件、所有session
      impact_scope: 整个项目
      examples: PS-STD-001, PS-STD-002, PS-STD-003
      change_notification: 通知所有Tier 1消费者
    - value: domain
      meaning: 领域——影响某个领域下的所有文件
      impact_scope: 一个领域
      examples: file-naming-standard.md(影响所有文档的命名)
      change_notification: 通知该领域内的Tier 1消费者
    - value: module
      meaning: 模块——影响特定模块
      impact_scope: 一个或几个模块
      examples: module-injection-rules.yaml
      change_notification: 通知引用该模块的Tier 1消费者
    - value: session
      meaning: 会话——仅影响当前AI session
      impact_scope: 单个session
      examples: vibe-coding-session-state-runbook.md
      change_notification: 无需通知，下个session自动生效
  ps_std_004_stability_vocabulary:
    title: 稳定性(Stability)受控词表与审批门槛矩阵
    section_type: context
    original_rules:
    - PS-STD-004 §6.1, §6.2
    summary: Stability维度的3个受控词表条目(含义/变更频率/修改条件/示例)及Stability审批门槛矩阵
    items:
    - value: frozen
      meaning: 冻结——除非Owner批准+ADR方可解冻
      change_frequency: 极低(年级别)
      modification_condition: Owner批准+ADR+90天过渡期
      approval_threshold: Owner批准+ADR
      examples: PS-STD-001, PS-STD-003
    - value: stable
      meaning: 稳定——变更需充分理由和审批
      change_frequency: 低(季度级别)
      modification_condition: 领域负责人批准+消费者同意
      approval_threshold: 领域负责人批准
      examples: file-naming-standard.md
    - value: evolving
      meaning: 演进中——可能频繁变更
      change_frequency: 中(月级别)
      modification_condition: 正常变更流程即可
      approval_threshold: 正常变更流程
      examples: vibe-coding-session-state-runbook.md
  ps_std_004_executor_vocabulary:
    title: 执行者(Executor)受控词表
    section_type: context
    original_rules:
    - PS-STD-004 §7.1
    summary: Executor维度的3个受控词表条目——含义/AI权限/示例
    items:
    - value: immutable_core
      meaning: 不可变核心
      ai_permission: AI禁止修改，需Owner直接审批+ADR
      examples: PS-STD-001, PS-STD-002
    - value: human_gated
      meaning: 人类门控
      ai_permission: AI可提议修改，需Owner批准后执行
      examples: rule_lifecycle_and_change_standard.yaml
    - value: ai_modifiable
      meaning: AI可编辑
      ai_permission: AI可自主修改，需在Session Log记录
      examples: vibe-coding-session-state-runbook.md
  ps_std_004_scope_stability:
    title: scope与stability字段
    section_type: context
    original_rules:
    - PS-STD-004 §5~§6
    conditions:
    - type: trigger
      check: 新增规则文档时
      pass: scope和stability字段已声明且值在受控词表中
      fail: 字段缺失或值不在受控词表中
    actions:
    - type: mandatory
      step: scope必填(默认domain)；stability必填(默认stable)；frozen必须对应immutable_core(单向强制)；stability与ai_autonomy遵循PS-STD-001 §2.6架构公民原则(正交维度)
    prohibitions: []
  ps_std_004_derivation_chain:
    title: 冲突裁决推导链
    section_type: context
    original_rules:
    - PS-STD-004 §9
    conditions:
    - type: trigger
      check: 两条规则发生冲突时
      pass: 按推导链裁决出优先级
      fail: 无法推导或AI自行裁决
    actions:
    - type: mandatory
      step: 按stability→authority_tier→scope→Owner四步链式推导：frozen>stable>evolving；cross_layer>L1>L2>L3；global>domain>module；三步后仍冲突→停止操作上报Owner(MTH-003目标优先裁决)
    prohibitions:
    - AI自行裁决无法推导的冲突(必须上报Owner)
    - AI选择对自己更方便的规则
    - AI忽略高stability或高authority_tier的规则
    - AI绕过推导链直接声称"这条规则优先"
  ps_std_004_new_domain:
    title: 新增领域流程
    section_type: decision_tree
    original_rules:
    - PS-STD-004 §3.3
    conditions:
    - type: trigger
      check: 需要新增领域(domain)受控词表条目时
      pass: 按流程新增
      fail: 未经批准新增领域
    actions:
    - type: mandatory
      step: 在PS-STD-004 §3.1新增受控词表条目→在01_policies_and_standards/下创建对应子目录→更新PS-STD-001的doc_type路径映射→更新rule_catalog_registry.yaml；新增领域需Owner批准+KB决策记录
    prohibitions: []
  ps_std_004_scope:
    title: 规则分类与仲裁标准的目的与范围
    section_type: context
    original_rules:
    - PS-STD-004 §1
    summary: "ZephyrAlpha项目规则分类体系与规则冲突裁决机制的唯一真源。上半卷（§2-§8）定义五维分类体系（Domain/Authority Tier/Scope/Stability/Executor），下半卷（§9-§11）定义冲突裁决推导链（stability→authority_tier→scope→Owner）。"
    applies_to:
    - "01_policies_and_standards/下所有规则文档"
    - "规则冲突裁决场景"
    impact_on_rules:
    - "新增scope和stability两个frontmatter字段，由本标准定义受控词表和分类规则"
    - "推导链为规则冲突提供机械裁决机制，三步推导后仍冲突则上报Owner"
    key_decisions:
    - "五维分类体系：domain(9值)/authority_tier(4值)/scope(4值)/stability(3值)/executor(3值)"
    - "推导链优先级：frozen>stable>evolving → cross_layer>L1>L2>L3 → global>domain>module"
    - "v2.0.0合并原PS-STD-008（rule_priority_hierarchy.md），分类与裁决是供需关系"
  ps_std_004_normative_refs:
    title: 规则分类与仲裁标准规范性引用
    section_type: context
    original_rules:
    - PS-STD-004 §0
    summary: "规则分类与仲裁标准依赖的规范性文件和标准"
    depends_on:
    - target: PS-STD-001
      at: "§2~§3"
      why: "layer/ai_autonomy字段定义——本标准引用其字段定义不重复定义"
    - target: PS-STD-002
      at: "§3"
      why: "L1/L2/L3层级定义——Authority Tier维度引用其层级定义"
    - target: PS-STD-011
      at: "MTH-003"
      why: "目标优先裁决原则——推导链失效时的终极仲裁"
    impact_on_rules:
    - "字段定义权归属PS-STD-001，本标准仅定义受控词表和分类规则"
    - "冲突仲裁时本标准与PS-STD-001冲突以PS-STD-001为准（字段定义权属于PS-STD-001）"
    key_decisions:
    - "scope和stability字段由本标准向PS-STD-001注册，字段定义权归PS-STD-001"
    - "stability与ai_autonomy一致性约束：frozen必须对应immutable_core（单向强制）"
  ps_std_004_change_history:
    title: 规则分类与仲裁标准修订记录
    section_type: examples
    original_rules:
    - PS-STD-004
    items:
    - version: "2.0.2"
      date: "2026-05-01"
      change: "规则分类与仲裁标准当前版本。定义五维分类体系+冲突裁决推导链+新增scope/stability字段注册。"
  ps_std_012_v1_v4:
    title: 验证分级V1-V4
    section_type: rule
    original_rules:
    - PS-STD-012 §2
    conditions:
    - type: trigger
      check: 验证规则合规性时
      pass: 按验证级别执行
      fail: 跳过验证级别
    actions:
    - type: mandatory
      step: V1自动化阻断(pre-commit/CI即时阻止)；V2自动化警告(允许继续但同类型3次升格V1)；V3人工审查(每月/每季度)；V4审计抽样(每年20%随机抽取)；V1阻断不可绕过
    prohibitions:
    - 绕过V1阻断继续操作
    - 忽略V2警告超过3次不处理
    - 跳过V3审查周期
    - 在V4审计中隐瞒已知问题
  ps_std_012_v5:
    title: V5深度内容审计
    section_type: context
    original_rules:
    - PS-STD-012 §7
    conditions:
    - type: trigger
      check: 目录结构变更后/文件批量搬迁后/规则体系重大重构后
      pass: 执行四步审计流程
      fail: 跳过深度审计
    actions:
    - type: mandatory
      step: Step1字段扫描(自动化)→Step2内容读取(人工/AI判断doc_type与实际内容是否一致)→Step3交叉验证(目录/module_id/depends_on一致性)→Step4判定与修复(搬迁/修改doc_type/改名/搬出)
    prohibitions: []
  ps_std_012_scope:
    title: 规则验证标准的目的与范围
    section_type: context
    original_rules:
    - PS-STD-012 §1
    summary: "定义ZephyrAlpha规则体系的验证标准——五级验证（V1自动化阻断/V2自动化警告/V3人工审查/V4审计抽样/V5深度内容审计）、验证频率矩阵、违规响应流程"
    applies_to: "01_policies_and_standards/下所有规则文档及其enforcement机制"
    impact_on_rules: "所有规则文档必须按V1-V4级别接受验证；V5深度审计在目录结构变更/文件批量搬迁/规则体系重大重构后触发"
    key_decisions:
    - "V1阻断不可绕过"
    - "V2警告同类型3次升格V1"
    - "V5为独立深度审计不计入V1-V4频率矩阵"
  ps_std_012_normative_refs:
    title: 规则验证标准规范性引用
    section_type: context
    original_rules:
    - PS-STD-012 §0
    summary: "规则验证标准的规范性引用文件"
    depends_on:
    - target: "PS-STD-001"
      at: "§2~§3"
      why: "字段定义+受控词表——验证字段合法性依据"
    impact_on_rules: "PS-STD-001定义的字段受控词表是V1/V2自动化验证的判定依据"
    key_decisions:
    - "对标OWASP ASVS v5三级验证体系+Kubernetes Conformance+ISO 42001 §8.2"
  ps_std_012_change_history:
    title: 规则验证标准修订记录
    section_type: examples
    original_rules:
