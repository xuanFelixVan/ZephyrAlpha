    items:
    - version: "1.3.0"
      date: "2026-06-21"
      change: "RQ-04修复——移除tmr_normative_refs.references中对已删除文件glossary_glossary.md和terminology_mapping_reference.md的引用（Glob验证不存在）；tmr_scope.key_decisions更新术语定义仲裁源描述为本YAML规则文件"
