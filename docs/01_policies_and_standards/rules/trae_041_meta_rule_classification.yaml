  ps_std_012_v1_triggers:
    title: V1自动化阻断触发条件详表
    section_type: rule
    original_rules:
    - PS-STD-012 §2.1
    summary: V1自动化阻断的触发条件详表——以下条件触发时操作被自动阻止且不可绕过
    trigger_conditions:
    - condition: frontmatter缺失或格式错误
      block_rule: META-V01~V02
      source: PS-STD-001 §14
    - condition: doc_type使用未定义值
      block_rule: META-V03
      source: PS-STD-001 §14
    - condition: "修改stability: frozen文件"
      block_rule: P0变更
      source: PS-STD-009 §2
    - condition: "删除ttl: permanent文件"
      block_rule: 禁止删除
      source: —
    - condition: blueprint_refs引用的蓝图不存在
      block_rule: META-V16
      source: PS-STD-001 §14
    - condition: index.md文件状态与实际frontmatter status不一致
      block_rule: META-V21
      source: PS-STD-012 §2.1
    prohibitions:
    - 绕过V1阻断继续操作
    - V1阻断未修复就继续操作
  ps_std_012_v2_triggers:
    title: V2自动化警告触发条件详表
