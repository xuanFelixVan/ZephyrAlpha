    frequency: 每年
  ps_std_012_v5_four_step:
    title: V5深度审计四步流程详表
    section_type: rule
    original_rules:
    - PS-STD-012 §7.1
    summary: V5深度内容审计的四步法详细流程——字段扫描→内容读取→交叉验证→判定与修复
    four_step_process:
    - step: Step1字段扫描(自动化对应V1~V2)
      operations:
      - 遍历所有文件frontmatter检查doc_type是否在受控词表中
      - 检查doc_type是否匹配所在目录的合法值(如governance/下policy必须declarative)
      - 检查文件名后缀是否匹配doc_type(§一.0强制映射表)
      output: 字段违规清单
    - step: Step2内容读取(人工/AI深度审查对应V5)
      operations:
      - 对Step1通过的文件逐文件打开并阅读正文内容
      - 声明式规则(policy)正文应是"什么必须/禁止/推荐"不是"怎么做"
      - 过程式规则(policy+procedural)正文应是"Step 1→N操作步骤"不是声明式禁令
      - 注册表(register)正文应是结构化数据清单不是叙事散文
      - 索引入口(index)正文应只是目录导航不含规则文本
      output: 内容-标签不一致清单
    - step: Step3交叉验证
      operations:
      - 对照directory-structure-standard.md的反向映射表确认每种内容类型是否在正确的目录
      - 对照module_id命名空间确认前缀是否匹配目录
      - 对照depends_on引用链确认引用的文件是否存在且doc_type一致
      output: 跨文件一致性清单
    - step: Step4判定与修复
      operations:
      - 放错目录→搬迁到正确目录(见directory-structure-standard.md §5.1.2反向映射表)
      - doc_type写错→修改frontmatter doc_type为正确值
      - 文件名误导→按§一.0强制映射表改名
      - 内容根本不是规则→搬出01_policies_and_standards/放到正确位置
      output: 修复操作清单+修复后验证
  ps_std_012_v5_decision_table:
    title: V5审计判定速查表
    section_type: rule
    original_rules:
    - PS-STD-012 §7.2
    summary: V5深度审计的判定速查表——7种常见不一致类型的判定和操作
    decision_table:
    - content: 蓝图(模块架构设计)
      doc_type_claimed: policy
      actual_content: 蓝图
      verdict: 标签+位置均错误
      action: 搬到03_modules/l*/模块名/blueprint.md
    - content: 施工图(实施步骤)
      doc_type_claimed: policy (procedural)
      actual_content: 模块施工图
      verdict: 内容非操作规则
      action: 搬到03_modules/l*/模块名/construction-plan.md
    - content: ADR讨论稿
      doc_type_claimed: protocol
      actual_content: 讨论草稿
      verdict: 内容类型错误
      action: "迁入KB:decisions namespace(Git-backed)；若以Markdown草稿承载则在_development_workspace/或仓库批准的草稿路径撰写——禁止写入已删除的旧docs/02_enterprise_architecture/adr/树"
    - content: 路线图
      doc_type_claimed: standard
      actual_content: 路线图
      verdict: 内容类型错误
      action: 搬到02_enterprise_architecture/或归档
    - content: 会话日志
      doc_type_claimed: policy
      actual_content: 会话记录
      verdict: 标签+位置均错误
      action: 搬到session_logs/
    - content: 声明式规则
      doc_type_claimed: policy
      actual_content: 确实是规则
      verdict: 正确
      action: 原地不动
    - content: 过程式步骤
      doc_type_claimed: policy (procedural)
      actual_content: 确实是操作流程
      verdict: 正确
      action: 原地不动
  ps_std_012_v5_scriptable:
    title: V5可脚本化部分评估表
    section_type: rule
    original_rules:
    - PS-STD-012 §7.3
    summary: V5深度审计中可脚本化的检查项及其实现难度评估
    scriptable_items:
    - check_item: doc_type是否在词表中
      difficulty: 容易
      suggested_location: GATE-11 pre-commit(已实现)
    - check_item: doc_type是否匹配目录
      difficulty: 容易
      suggested_location: GATE-11 pre-commit(已实现)
    - check_item: 文件名后缀是否匹配doc_type
      difficulty: 容易
      suggested_location: GATE-11 N-08新规则
    - check_item: index.md文件清单vs磁盘实际文件
      difficulty: 中等
      suggested_location: scripts/governance/check_index_integrity.py
    - check_item: 内容关键词vs doc_type(如content含Step但doc_type=policy)
      difficulty: 较难
      suggested_location: scripts/governance/d3_metadata/deep_content_scanner.py(启发式需人工复核)
    - check_item: 全文内容vs doc_type匹配
      difficulty: 困难
      suggested_location: 人工审查+AI辅助(V5)
    note: "前三个检查项是机器干的活脚本一秒扫完；最后两个才是需要打开文件看内容判断的过程无法完全自动化因为\"内容像不像规则\"需要理解上下文；前三个检查项做好后人工审查工作量从70+个文件缩减到3~5个可疑文件"
  tmr_purpose:
    title: 本文档存在的理由
    section_type: context
    original_rules:
    - GOV-027 §0
    summary: 术语映射表存在的理由——所有大型机构都有术语表AI驱动团队尤其需要双向映射表
    key_decisions:
    - 大型金融机构有Enterprise Business Glossary系统咨询机构有glossary card AI驱动团队有双向映射表
    - 新成员入职第一个月主要消化术语跨部门沟通业务语言vs工程语言必须对齐
    - 对ZephyrAlpha 2.0用户用大白话说需求→AI查表翻译成术语；AI用术语回复→用户快速对照理解
  tmr_usage:
    title: 使用方式
    section_type: rule
    original_rules:
    - GOV-027 §1
    conditions:
    - type: trigger
      check: AI或用户使用术语时
      pass: 按使用方式执行
      fail: 不遵守使用方式
    actions:
    - type: mandatory
      step: 对人遇到AI使用陌生术语→第一查本表(Ctrl+F)→找不到的要求AI补进本表；对AI首次使用本表未收录的行业术语时用括号内附大白话解释→用户用大白话表述时AI可内部翻译为术语并执行但回复时应同时给出大白话→收到不清楚的术语查本表仍无解时加入本表并给出双向解释
  tmr_main_table:
    title: 主术语表
    section_type: information
    original_rules:
    - GOV-027 §2
    summary: 核心术语双向映射表按类别分组——架构与治理/决策与记忆/任务与流程/元数据与契约/AI协作/投资业务
    items:
    - category: 架构与治理类
      examples: 唯一真源↔SSOT 正式文档区↔Canonical Domain 规矩↔Standard/Policy/Rule 薄治理↔Thin Governance
    - category: 决策与记忆类
      examples: 为什么这么定↔ADR 推导链↔Rationale Log 还没想清楚的事↔Open Question 可能出坏事的事↔Risk 升格↔Promotion 作废↔Superseded 只追加不删改↔Append-only
    - category: 任务与流程类
      examples: 任务清单↔Taskbook/Backlog 办事流程表↔Checklist/Runbook 大目标↔Roadmap 里程碑↔Milestone 交接↔Handoff 体检↔Health Check 闸门↔Quality Gate
    - category: 元数据与契约类
      examples: 文档头↔Frontmatter 字段清单↔Schema 受控词表↔Controlled Vocabulary 唯一编号↔Module ID 成熟度↔Status 密级↔Classification 留存期↔Retention 来源追溯↔Provenance
    - category: AI协作类
      examples: 多AI分工↔Multi-Agent Workflow 发散思维模型↔Divergent Model 收敛精准模型↔Convergent Model 批量操作模型↔Bulk Operation Model 头脑风暴↔Brainstorming 续接上下文↔Context Resume
    - category: 投资业务类
      examples: 核心投资价值链↔Core Investment Value Chain 因子↔Factor 回测↔Backtest 样本外测试↔Out-of-Sample Test 压力测试↔Stress Test 再平衡↔Rebalancing 模型漂移↔Model Drift 执行滑点↔Execution Slippage
  tmr_reverse_index:
    title: 反向索引
    section_type: information
    original_rules:
    - GOV-027 §3
    summary: AI输出的行业术语快速翻译回大白话的反向索引表
    items:
    - ai_term: SSOT
      plain: 这个没做出双份
    - ai_term: canonicalization
      plain: 应该搬到正式区
    - ai_term: ADR
      plain: 记为什么这么定的凭证
    - ai_term: frontmatter schema
      plain: 文档头的字段格式要求
    - ai_term: controlled vocabulary
      plain: 只能从几个固定词里选
    - ai_term: append-only
      plain: 只能追加不能改删
    - ai_term: superseded
      plain: 取代/被取代
    - ai_term: quality gate
      plain: 卡点过不去就别往下走
    - ai_term: handoff
      plain: 交接
    - ai_term: rationale log
      plain: 推导过程的记录
  tmr_maintenance:
    title: 本表的维护规则
    section_type: rule
    original_rules:
    - GOV-027 §4
    conditions:
    - type: trigger
      check: 维护术语映射表时
      pass: 按维护规则执行
      fail: 不遵守维护规则
    actions:
    - type: mandatory
      step: 新增时机AI第一次用的某术语用户不认识→加一行；讨论中自己发明的新概念→加一行；外部资料里频繁出现某术语→加一行。新增字段每个术语至少有大白话+行业术语(英文原名+常见中文译名)+解释(一句话说清)+关联文档。争议术语不同上下文有不同含义时不强行合并而是分两行列出并在解释栏标注使用上下文。升格路径未来可升格到business-glossary.yaml或机器可读版本glossary.yaml
    prohibitions:
    - 强行合并不同上下文有不同含义的争议术语
