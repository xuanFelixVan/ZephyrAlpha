rule_id: TRAE-011
title: 代码构建-类型与导入
version: 1.0.0
layer: L1_foundation
module_id: TRAE-011
depends_on: []
tags:
- TRAE
- code_type_import
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- CODE-005
- CODE-006
- CODE-007
severity: error
scope: code_type_import
domain: TRAE
triggers:
- operation: code_type_import
sections:
  code_005:
    title: 类型注解强制层级
    section_type: rule
    original_rules:
    - CODE-005
    conditions:
    - type: constraint
      check: L00-L01层mypy模式
      pass: strict模式——100%覆盖，disallow_untyped_defs=true
      fail: 未达到strict要求
    - type: constraint
      check: L02-L08层mypy模式
      pass: 关键接口strict——跨模块接口100%，内部实现80%+
      fail: 跨模块接口未100%覆盖
    - type: constraint
      check: L09-L15层mypy模式
      pass: public API strict——public函数/方法100%
      fail: public API未100%覆盖
    actions:
    - type: mandatory
      step: 所有函数签名（参数+返回值）必须有类型注解
    - type: mandatory
      step: 所有类属性必须有类型注解
    - type: mandatory
      step: 所有跨模块数据结构必须有类型注解
    - type: mandatory
      step: 所有public API必须有类型注解
    - type: mandatory
      step: 金额/价格/数量使用Decimal（禁止float）
    - type: mandatory
      step: 时间戳使用Timestamp（纳秒UTC，禁止裸datetime）
    - type: mandatory
      step: 货币运算使用Money类型
    prohibitions:
    - 禁止缺类型注解的函数签名——def process(data):
    - 禁止泛型字典作为参数——def process(data: dict)
    - 禁止Any绕过类型检查——def process(data: Any)（显式Any反序列化除外）
    - 禁止金额/价格/数量使用float
    - 禁止时间戳使用裸datetime
  code_006:
    title: 导入规范
    section_type: rule
    original_rules:
    - CODE-006
    conditions:
    - type: constraint
      check: 导入分组与排序
      pass: 标准库→第三方→项目内（绝对导入）→同层（相对导入）
      fail: 导入分组不正确或排序混乱
    actions:
    - type: mandatory
      step: 导入按4组排序：1.标准库 2.第三方 3.项目内绝对导入 4.同层相对导入
    - type: mandatory
      step: 同层模块使用相对导入（仅限同package内）
    - type: exception
      step: DIP例外——编排器(控制平面)可导入下层暴露的抽象契约(Protocol/ABC/接口类)，不可导入下层具体实现类。编排器导入下层抽象接口不算"下层导入上层"违规。对标K8s CRI/CSI、Netflix Conductor Worker API
    prohibitions:
    - 禁止import *——破坏静态分析，永远禁止
    - 禁止下层导入上层——违反分层架构（DIP例外：编排器导入下层抽象契约Protocol/ABC允许）
    - 禁止裸dict[str, Any]作为跨模块参数——使用冻结dataclass/Pydantic替代
  code_007:
    title: 依赖管理(SSoT守卫)
    section_type: rule
    original_rules:
    - CODE-007
    conditions:
    - type: constraint
      check: 数据结构修改是否走SSoT流程
      pass: 修改YAML→运行生成脚本→审计下游→KB决策记录
      fail: 直接修改Python文件
    - type: constraint
      check: 循环导入检测
      pass: 无循环依赖(跨层无循环 AND 同层无循环)
      fail: CI阶段import-linter检测到循环导入(跨层循环 OR 同层循环)
    actions:
    - type: mandatory
      step: 修改数据结构时先修改SSoT YAML(cross_layer_contracts.yaml)
    - type: mandatory
      step: 运行生成脚本重新生成Python代码+递增schema_version
    - type: mandatory
      step: 审计所有下游模块的适配需求
    - type: mandatory
      step: Breaking change创建KB决策记录
    - type: clarification
      step: 同层间允许单向导入(如门禁导入预算检查)，但禁止同层循环导入(如A→B→A禁止)。同层协作对标K8s/Conductor同层组件协作模式
    prohibitions:
    - 禁止跳过YAML直接修改Python数据结构定义
    - 禁止循环导入(跨层循环)
    - 禁止同层循环导入(同层形成环)
  gov_eng_011_type_prohibition_examples:
    title: 类型注解禁止写法示例
    section_type: examples
    original_rules:
    - CODE-005
    items:
    - description: 禁止缺类型注解
      details: '禁止: def process(data): ...; 正确: def process(tick: NormalizedMarketData) -> FactorSignal: ...'
    - description: 禁止泛型字典
      details: '禁止: def process(data: dict): ...; 正确: 使用Pydantic/dataclass定义具体类型'
    - description: 禁止Any绕过类型检查
      details: '禁止: def process(data: Any): ...; 豁免: def deserialize(raw: bytes) -> Any: ... (至少表态''我知道这里是动态类型'')'
    - description: Decimal/Timestamp/Money强制
      details: 金额/价格/数量→Decimal(禁止float); 时间戳→Timestamp(纳秒UTC，禁止裸datetime); 货币运算→Money类型
  gov_eng_011_ssot_procedure:
    title: SSoT数据结构修改流程
    section_type: procedure
    original_rules:
    - CODE-007
    items:
    - order: 1
      action: 修改SSoT YAML(cross_layer_contracts.yaml)
      pre_condition: 需要修改数据结构
      expected_result: YAML已更新
      on_failure: 禁止跳过此步直接修改Python文件
    - order: 2
      action: 运行生成脚本重新生成Python代码+递增schema_version
      pre_condition: YAML已更新
      expected_result: Python代码已重新生成，版本号已递增
      on_failure: 生成失败→检查YAML格式
    - order: 3
      action: 审计所有下游模块的适配需求
      pre_condition: 代码已重新生成
      expected_result: 下游模块适配清单已列出
      on_failure: 遗漏下游→集成断裂
    - order: 4
      action: Breaking change创建KB决策记录(存入KB:decisions)
      pre_condition: 存在破坏性变更
      expected_result: KB决策记录已创建
      on_failure: 无KB记录=变更无追溯
  gov_eng_011_import_examples:
    title: 导入规范示例
    section_type: examples
    original_rules:
    - CODE-006
    items:
    - description: 导入分组与排序
      details: '1.标准库: import asyncio / from pathlib import Path / from typing import Optional; 2.第三方库: import numpy as np / from pydantic import BaseModel; 3.项目内模块(绝对导入): from zephyr.shared.contracts.market_data import NormalizedMarketData; 4.同层模块(相对导入，仅限同package内): from .models import FactorSignal'
  gov_eng_011_scope:
    title: 适用范围
    section_type: context
    original_rules:
    - GOV-ENG-001
    summary: 类型注解与导入规范适用于全14层(L00-L15)，按§3分层定级确定mypy模式
    impact_on_rules: 类型注解不合规=CI阶段mypy报错
    key_decisions:
    - L00-L01用strict模式，L02-L08关键接口strict，L09-L15 public API strict
    - SSoT守卫确保YAML是数据结构唯一真源
  gov_eng_011_cross_refs:
    title: 交叉引用
    section_type: context
    original_rules:
    - GOV-ENG-001
    summary: 类型注解与导入规范是代码构建标准的中间层，上承命名组织(§1-§2)，下承SSoT守卫(§5)
    impact_on_rules: 循环导入由CI阶段import-linter检测
    key_decisions:
    - import *永远禁止，无例外
    - 下层导入上层违反分层架构
    - cross_layer_contracts.yaml是数据结构SSoT
  gov_eng_011_verification:
    title: 类型与导入验证流程
    section_type: verification
    original_rules:
    - CODE-005
    - CODE-006
    - CODE-007
    items:
    - step: 类型注解完整性检查
      command: mypy --strict src/zephyr/对应层/
      expected_exit: 0
      on_fail: 类型注解不完整——必须补充
    - step: 导入分组排序检查
      command: ruff check --select I src/zephyr/
      expected_exit: 0
      on_fail: 导入排序不合规——必须修正
    - step: 循环导入检测
      command: import-linter
      expected_exit: 0
      on_fail: 存在循环导入——必须解除
    - step: SSoT数据结构一致性检查
      command: python scripts/governance/d5_architecture/validators/validate_module_schema.py
      expected_exit: 0
      on_fail: Python数据结构与YAML SSoT不一致——必须走SSoT流程
    - step: 下层导入上层检查
      command: python scripts/governance/d5_architecture/checkers/check_dependency_direction.py
      expected_exit: 0
      on_fail: 存在下层导入上层——违反分层架构
  gov_eng_011_change_history:
    title: 变更历史
    section_type: context
    original_rules:
    - GOV-ENG-001
    items:
    - version: 1.1.0
      date: '2026-06-19'
      change: RQ审查修复：修复references.scripts路径（check_dependency_direction.py→d5_architecture/checkers/；validate_module_schema.py→d5_architecture/validators/）（RQ-04）；同步修复verification section脚本路径（RQ-04）；provenance标注源文件已superseded（RQ-04/RQ-09）；补充change_history（RQ-14）
    - version: 1.0.0
      date: '2026-06-13'
      change: 初始提取自GOV-ENG-001§3-§5
    summary: 类型与导入规范提取自GOV-ENG-001§3-§5
    impact_on_rules: 无结构性变更
    key_decisions:
    - §3类型注解、§4导入规范、§5 SSoT守卫从GOV-ENG-001独立提取
