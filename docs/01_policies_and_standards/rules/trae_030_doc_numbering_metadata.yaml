  gov_doc_016_pure_assertion:
    title: 规则文档纯陈述原则 (GOV-DOC-016)
    section_type: rule
    original_rules:
    - DOC-016
    conditions:
    - type: constraint
      check: 规则文档表述方式
      pass: 只包含当前有效规则的肯定陈述句（陈述结果/约束/命令）
      fail: 包含否定陈述句（"已废止"/"旧定义"/"之前是X现在改为Y"/"已被取代"等过渡文本）
    - type: constraint
      check: 历史版本追溯
      pass: 历史版本差异通过 git log 和 change_history 追踪
      fail: 在正文保留已过时的规则原文或添加废止标注
    actions:
    - type: mandatory
      step: 发现规则过时时 MUST 直接更新为新规则，不保留旧规则原文
    - type: mandatory
      step: 禁止添加"已废止"/"已取代"/"旧定义"等标注；直接用新规则替换旧规则
    - type: mandatory
      step: 规则变更记录写入 change_history section（版本号+日期+变更摘要），不写入正文
    - type: mandatory
      step: 规则文档中所有数字、字段数、版本号、计数必须是当前唯一真实值
    prohibitions:
    - 在正文中保留"已废止"/"已取代"标注（直接更新为新规则）
    - 在正文中保留"之前是X现在改为Y"过渡文本（直接写当前值）
    - 在正文中保留已过时的规则原文（历史在 git log，不在正文）
    - 添加解释性段落说明"之前为什么是错的"（直接修正为正确值）
    rationale:
      why_pure_assertion: 否定陈述句增加 AI 上下文字符、降低效率、制造漂移风险。AI 读取"已废止"标注时需要额外处理旧规则与新规则的关系，增加幻觉概率。纯陈述句让 AI 直接看到当前有效规则，零歧义消费。
      why_git_log: 历史版本差异是 git log 的职责，不是正文的职责。正文只承载当前真实值。双源（正文+git log）会导致不一致和漂移。
  gov_doc_017_rule_abstraction:
    title: 规则抽象性原则 (GOV-DOC-017)
    section_type: rule
    original_rules:
    - DOC-017
    conditions:
    - type: constraint
      check: 规则中数字的性质
      pass: 数字是阈值（定义边界/比例/关系，不随当前状态变化）
      fail: 数字是事实状态（描述当前值/实测值，会随时间变化）
    - type: constraint
      check: 事实状态获取方式
      pass: 事实状态通过动态查询获取（如 extract_depgraph.py --summary）
      fail: 事实状态固化在规则正文中
    actions:
    - type: mandatory
      step: 规则中的数字 MUST 是阈值（边界定义），禁止是事实状态（当前实测值）
    - type: mandatory
      step: 文件大小/当前节点数/当前域数/当前模块数等会变化的值 MUST 通过动态查询获取，禁止固化在规则中
    - type: mandatory
      step: 发现规则中存在事实状态数字时 MUST 删除，改为引用动态查询命令
    prohibitions:
    - 在规则中固化文件大小（如"depgraph 157MB"——157是事实状态会变化）
    - 在规则中固化当前节点数（如"804个production节点"——804是事实状态会变化）
    - 在规则中固化当前域数（如"43域"——43是事实状态会变化）
    - 在规则中固化当前模块数（如"60个蓝图模块"——60是事实状态会变化）
    rationale:
      threshold_vs_fact: 阈值是规则定义的边界（如"单域≤200"的200），不随当前状态变化，可以写入规则。事实状态是当前实测值（如"depgraph 157MB"的157），会随时间变化，固化在规则中会导致规则过时失真。
      why_dynamic_query: 事实状态必须通过动态查询获取（extract_depgraph.py --summary），确保规则永远引用当前值，不会失真。
