    title: 蓝图拆分判定流程 (GOV-DOC-011 §4.5)
    section_type: procedure
    original_rules:
    - DOC-011
    procedure:
    - order: 1
      action: 识别职责域——蓝图中的内容是否属于同一职责域?判定维度:服务对象/变更频率/依赖关系
