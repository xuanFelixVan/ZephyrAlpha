      on_failure: 无法判断职责域→保留原状不拆分
    - order: 2
      action: "职责域判定——职责相同(同一模块的升级/扩展)→原地升级;条件:服务对象相同+变更频率同步+依赖关系重叠"
      pre_condition: 职责域已识别
      expected_result: 判定结果为原地升级或拆分独立蓝图
      on_failure: 判定不确定→保留原状
    - order: 3
      action: "拆分独立蓝图判定——职责不同(独立子系统/独立能力域)时检查触发条件:有独立module_id前缀/有独立Phase路线图和交付节奏/有独立依赖关系图(与蓝图主体depends_on交集<50%)/内容超过100行且与蓝图主体无直接数据流"
      pre_condition: 职责不同
      expected_result: 满足任一触发条件→拆分独立蓝图
      on_failure: 不满足触发条件→原地升级
    - order: 4
      action: 拆分后验证——子蓝图有独立frontmatter+概述+§0~§18;子蓝图belongs_to=本蓝图module_id;本蓝图§10依赖关系新增子蓝图引用;blueprint_registry.yaml同步更新
      pre_condition: 拆分独立蓝图决定已做出
      expected_result: 四项验证全部通过
      on_failure: 任一验证未通过→补充后重新验证
