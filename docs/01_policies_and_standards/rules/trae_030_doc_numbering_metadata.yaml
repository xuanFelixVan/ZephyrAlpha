rule_id: TRAE-030
title: 文档治理-编号与元数据
version: 1.1.3
layer: L1_foundation
module_id: TRAE-030
depends_on:
- TRAE-010
- TRAE-011
- TRAE-012
- TRAE-028
- TRAE-048
tags:
- TRAE
- doc_numbering_metadata
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- DOC-011
- DOC-012
- DOC-013
- DOC-014
- DOC-015
- DOC-016
- DOC-017
severity: error
scope: doc_numbering_metadata
domain: TRAE
triggers:
- operation: doc_numbering_metadata
sections:
  doc_011:
    title: AI产出物压缩工作流-产出物规格 (GOV-DOC-011第一篇)
    section_type: rule
    original_rules:
    - DOC-011
    conditions:
    - type: constraint
      check: 时态判定规则§0
      pass: 永久时态(当前架构/接口/约束/状态事实)→保留;临时时态(从A到B的过程)→执行完毕后删除;施工声明(铁律/安全删除/必备链接等)→永久保留不可改为链接引用
      fail: 未按时态分类就决定保留/删除
    - type: constraint
      check: 临时时态删除前置条件
      pass: 正确方案/代码已实现+可运行(pytest+mypy+ruff通过)→才可删除
      fail: 正确方案未实现或不可运行时删除临时时态内容
    - type: constraint
      check: 可删清单§1(11类)
      pass: 大白话解释/对标段落/AI意识植入散文/修订记录/ASCII流程图(条件:信息已在表格中完整表达)/已实现代码蓝图内重复/已执行完毕临时时态/配置文件完整示例/技术栈理由列/§7备选方案(正确方案已实现)/§15正面后果(与§1重复)
      fail: 删除不在清单中的内容
    - type: constraint
      check: 对标段替换协议§1.1
      pass: 文化类比对标段(引用K8s/ITIL/Unix/航空业/法庭/OpenAI/Anthropic/Rails等外部框架)→MUST替换为可执行引用(规则文件file:///路径/门禁ID/验证命令/实现文件路径至少一项)→替换后MUST验证引用真实性(文件/门禁/命令存在)
      fail: 简单删除对标段不替换/替换为另一段文化类比/引用悬空(指向不存在的文件或门禁)
    - type: constraint
      check: 执行后文档审查协议§1.2
      pass: Session关门时MUST审查本次session修改的文档+蓝图/规则→按§0时态判定+§1可删清单+GOV-DOC-016纯陈述原则检查过程陈述/噪音/冲突→标记"待规格化"(不立即删除)→标记数≥3→触发规格化流程
      fail: Session关门时未审查文档内容/未标记待规格化/立即删除(跳过规格化流程)
    - type: constraint
      check: 不可删清单§2(18类)
      pass: frontmatter字段/路径/module_id引用/命令和代码模板/表格/禁止必须约束/漂移防护语句/异常处理/状态不变量/depends_on声明/触发条件/完成标准/多步流程步骤/可解析引用/导航路径/蓝图特有内容/反向进化通用新增/蓝图概述段
      fail: 删除不可删清单中的内容
    - type: constraint
      check: 必须补充清单§3(10类)
      pass: 可达性入口/frontmatter完整/负向责任/SSoT声明/消费者注册表/触发条件/可解析引用/导航路径/漂移防护/铁律禁止清单
      fail: 规格化后缺失任一补充项
    - type: constraint
      check: 蓝图铁律B-00~B-22
      pass: B-00:Layer1先于Layer2;B-01:施工步骤禁止砍;B-02:接口契约禁止砍;B-03:架构设计禁止砍;B-04:功能描述禁止砍;B-05:错误处理禁止砍;B-06:产出物路径禁止砍;B-07:必备链接表禁止砍;B-08:安全删除协议禁止砍;B-11:蓝图铁律表禁止砍;B-12:容量估算禁止砍;B-13:MUST标注codification_level;B-14:不可因模板砍价值;B-15:反向进化原则;B-16:蓝图特有内容保留;B-17:反向进化流程;B-18:规格化前MUST建立内容价值映射;B-19:概述段禁止砍;B-20:已实现代码不在蓝图重复;B-21:临时时态执行完毕后删除;B-22:蓝图拆分判定
      fail: 违反任一蓝图铁律
    - type: constraint
      check: 代码文件十五字段标准§5
      pass: "代码文件头部十五字段完整性(真源→trae_047 field_specs.a_full.required);__init__.py豁免规则见trae_047 init_min"
      fail: 代码文件头部缺失必填字段
    actions:
    - type: mandatory
      step: 规格化是双向操作:该减的减+该加的加+反向进化。只减不加=越规格化越脆弱
    - type: mandatory
      step: 蓝图规格化后必须通过19项验证(§4.4)
    - type: mandatory
      step: 蓝图>800行时MUST按§4.5执行拆分判定(B-22)
    prohibitions:
    - 禁止删除不可删清单中的18类内容
    - 禁止将施工声明(铁律/安全删除/必备链接/类似功能/文件范围/治理信息)改为链接引用
    - 禁止因模板砍价值(B-14)
    - 禁止未分类就动手规格化(B-18)
    - 禁止砍掉概述段(B-19)
  doc_012:
    title: AI产出物压缩工作流-施工流程 (GOV-DOC-011第二篇)
    section_type: rule
    original_rules:
    - DOC-012
    conditions:
    - type: trigger
      check: 规格化触发条件§7
      pass: 漂移检测告警/新AI反馈规则读不完/规则冲突/可达性审计发现0%可达文件/可达性审计发现缺失必要属性
      fail: 常规维护(无上述信号)不触发
    - type: constraint
      check: 规格化前置流程§8(强制七步)
      pass: STEP0判受众→STEP0.5 Layer1合规(内容价值映射+章节完整性+反向进化)→STEP1搜→STEP1.5时态判定→STEP2转化(散文→二元规则)→STEP3查重→STEP3.5幻觉安全验证→STEP3.6三桶判定→STEP4标注可执行性→STEP5补充缺失→STEP5.5十五字段验证→STEP6审计
      fail: 跳过任何步骤
    - type: constraint
      check: Layer1先于Layer2
      pass: 先检查蓝图+施工图模板v4.0章节完整性(Layer1);Layer1不通过→不得进入Layer2(规格化砍削)
      fail: 跳过Layer1直接规格化砍削
    - type: constraint
      check: 幻觉安全验证STEP3.5
      pass: 砍前四问:路径漂移?存在性幻觉?操作幻觉?触发幻觉?全部NO→可砍;任意YES→进入三桶判定
      fail: 未通过幻觉安全验证就砍内容
    - type: constraint
      check: 三桶判定STEP3.6
      pass: 桶1可删除(标题+表格自解释)/桶2可压缩(保留区分信号+防漂移约束删除解释)/桶3必须保留(删掉导致幻觉且无法压缩);判定优先级:桶1>桶2>桶3
      fail: 未按三桶判定处置幻觉安全验证未通过的内容
    actions:
    - type: mandatory
      step: 规格化后步骤§11:更新depends_on+sync_rule_registry.py+标记codification_level+DriftDetector确认+可达性验证+可执行性验证+补充验证
    - type: mandatory
      step: 每次只改一个文件改完确认再下一个
    prohibitions:
    - 禁止跳过STEP2转化直接删除散文段落
    - 禁止跳过STEP3.5幻觉安全验证就砍内容
    - 禁止Layer1不通过就进入Layer2
    - 禁止未完成内容价值映射(B-18)就动手规格化
  doc_013:
    title: AI产出物压缩工作流-安全原则与策略 (GOV-DOC-011§9-§10)
    section_type: rule
    original_rules:
    - DOC-013
    conditions:
    - type: constraint
      check: 安全原则-防幻觉最高
      pass: 防幻觉/防漂移>一切其他规则;删掉会导致幻觉或漂移的内容即使它是理由/背景/原因也必须保留
      fail: 以"AI只需规则不需理由"为由删除防幻觉内容
    - type: constraint
      check: 安全原则-转化优先
      pass: 读到散文→先试转化为二元规则→能转化就保留;不能转化才判定砍/留;砍是最后手段不是默认操作
      fail: 直接删除未尝试转化的散文
    - type: constraint
      check: 安全原则-可达性铁律
      pass: 规格化后的文件MUST在L0/L1/registry中有入口;0%可达=规格化未完成
      fail: 规格化后文件无入口
    - type: constraint
      check: 安全原则-可执行性铁律
      pass: 规格化后的规则MUST标注执行方式:AI自觉/脚本门禁/策略引擎;纯MD声明且无执行机制=规格化未完成
      fail: 规则无执行方式标注
    - type: constraint
      check: 安全原则-补充铁律
      pass: 规格化后MUST对照§3必须补充清单检查并补充缺失项
      fail: 规格化后未补充缺失项
    - type: constraint
      check: 安全原则-裁决原则
      pass: 不确定→保留;宁可多留不可误删
      fail: 不确定时选择删除
    - type: constraint
      check: 成熟度目标
      pass: 所有规则文件MUST达到L1(可发现);核心规则MUST达到L2(可强制)
      fail: 规则文件未达L1或核心规则未达L2
    actions:
    - type: mandatory
      step: IDE规则类:保留表格/命令/路径/约束/状态不变量;砍掉原理/对标/AI意识植入/触因根因/修订历史;必须补充可达性入口+触发条件
    - type: mandatory
      step: 蓝图类:保留frontmatter/接口契约/约束/depends_on/施工步骤/SSoT声明/消费者注册表/代码存在性/依赖图/自动化规格/施工声明;砍掉散文/对标/重复拓扑/已实现代码重复/已执行临时时态/配置示例/技术栈理由/重复模块列表/人日列/§7备选/§15正面后果
    prohibitions:
    - 禁止以"AI只需规则"为由删除防幻觉/防漂移内容
    - 禁止砍是默认操作(转化优先砍是最后手段)
    - 禁止规格化后文件0%可达
    - 禁止规格化后规则无执行方式标注
  doc_014:
    title: 统一编号规范-违规检测与迁移 (GOV-DOC-001§6-§7)
    section_type: rule
    original_rules:
    - DOC-014
    conditions:
    - type: constraint
      check: 自动检测项NUM-V03
      pass: 施工图文件名以construction_plan_{domain}_或construction_plan_shared_开头
      fail: 文件名不匹配(WARNING级)
    - type: constraint
      check: 自动检测项NUM-V05
      pass: 模块ID匹配D-XXX-{SEQ}格式
      fail: frontmatter module_id不匹配(WARNING级)
    - type: constraint
      check: 自动检测项NUM-V06
      pass: 架构文档正文不使用旧编号指代架构层
      fail: 正则匹配到废弃docs编号+业务域名称组合(WARNING级)
    - type: constraint
      check: 人工审查NUM-R01
      pass: 新增层编号经KB决策记录审批
      fail: L14+编号首次出现未经审批
    - type: constraint
      check: 人工审查NUM-R02
      pass: 前端子层编号合理
      fail: FE-L5+编号首次出现未经审查
    - type: constraint
      check: 人工审查NUM-R03
      pass: 跨层契约正确引用两端层编号
      fail: 新增CTR-*条目未检查引用
    actions:
    - type: mandatory
      step: 迁移原则:不改变docs物理目录结构;只改变架构语义引用统一用D-XXX;渐进式迁移新文档必须遵守存量文档下次编辑时顺带修正
    - type: mandatory
      step: 迁移检查清单:Mermaid图节点→D-XXX;蓝图frontmatter→域英文名;施工图→construction_plan_{domain}_;模块ID→D-XXX-{SEQ};KB决策记录→D-XXX;移除旧编号称呼
    prohibitions:
    - 禁止违反迁移原则直接修改docs物理目录结构
  doc_015:
    title: 文件路径规范-物理路径树与违规检测 (GOV-DOC-004§四-A~§五)
    section_type: rule
    original_rules:
    - DOC-015
    conditions:
    - type: constraint
      check: 物理路径树规则1
      pass: project_path_tree.yaml由脚本自动生成禁止手写
      fail: 手写路径树文件
    - type: constraint
      check: 物理路径树规则2
      pass: path_ownership_map.yaml中同一路径只能被一个蓝图声明
      fail: 同一路径被多个蓝图声明(冲突)
    - type: constraint
      check: 物理路径树规则3
      pass: 路径冲突时ssot_claims声明优先于§0.1清单声明
      fail: 未按优先级解决冲突
    - type: constraint
      check: 物理路径树规则4
      pass: 路径变更(移动/重命名)必须同步更新path_ownership_map.yaml
      fail: 路径变更后未同步更新
    - type: constraint
      check: 违规检测-旧体系新建
      pass: 不在docs/(旧体系)下新建文件
      fail: 在旧体系下新建文件
    - type: constraint
      check: 违规检测-根目录白名单
      pass: 不在根目录创建白名单外文件
      fail: 根目录存在白名单外文件
    - type: constraint
      check: 违规检测-类型错放
      pass: 治理规范不放02_enterprise_architecture/;架构视图不放01_policies_and_standards/
      fail: 文件类型与目录不匹配
    - type: constraint
      check: 违规检测-AI产物
      pass: AI生成产物不直接写入受版本控制目录
      fail: AI产物写入受版本控制目录
    actions:
    - type: mandatory
      step: 产出物:物理路径树快照→docs/01_policies_and_standards/_registry/catalogs/project_path_tree.yaml(脚本scripts/governance/generate_project_path_tree.py)
    - type: mandatory
      step: 产出物:路径归属声明→docs/03_modules/path_ownership_map.yaml(脚本scripts/governance/generators/generate_path_ownership_map.py)
    prohibitions:
    - 禁止手写project_path_tree.yaml
    - 禁止同一路径被多个蓝图声明
    - 禁止路径变更后不更新path_ownership_map.yaml
  gov_doc_011_anti_patterns:
    title: 压缩工作流常见反模式 (GOV-DOC-011 §6)
    section_type: error_patterns
    original_rules:
    - DOC-011
    patterns:
    - pattern: "砍错-把触发条件当散文"
      description: "砍掉适用场景列表导致AI不知何时调用"
      example: "砍掉当漂移检测告警时MUST触发→AI不知道何时执行"
      detection: "检查规格化后是否丢失触发条件/适用场景"
    - pattern: "砍错-把反模式清单当散文"
      description: "砍掉反例清单导致AI失去对照"
      example: "砍掉禁止凭记忆猜测路径→AI重新凭记忆操作"
      detection: "检查规格化后是否丢失禁止/反模式列表"
    - pattern: "砍错-把完成标准当散文"
      description: "砍掉exit criteria导致AI不知道算不算做完"
      example: "砍掉pytest exit 0才算通过→AI凭感觉判断完成"
      detection: "检查规格化后是否丢失验证/完成标准"
    - pattern: "砍错-部分删除流程步骤"
      description: "砍掉流程中间步骤导致步骤链断裂"
      example: "砍掉治根处理步骤→AI不知道下一步"
      detection: "检查流程步骤是否完整(全留或全删)"
    - pattern: "砍错-保留不可解析引用"
      description: "写一篇KB决策记录但没有路径"
      example: "参见KB决策记录无路径→AI无法定位"
      detection: "检查所有项目术语后是否有路径"
    - pattern: "砍错-砍掉导航路径"
      description: "砍掉最小必读路径导致新AI不知道从哪开始"
      example: "砍掉新AI→AGENTS.md→index.md→本标准→新AI迷失"
      detection: "检查规格化后是否保留导航路径"
    - pattern: "漏补-缺可达性入口"
      description: "文件规格化后AI仍然找不到"
      example: "新文件未在registry_of_registries.yaml注册"
      detection: "检查文件是否在L0/L1/registry中有入口"
    - pattern: "漏补-缺SSoT声明"
      description: "两个文件都说自己管同一领域"
      example: "两个文件都定义命名规则→AI不确定哪个是权威"
      detection: "检查文件是否有SSoT声明"
    - pattern: "漏补-缺漂移防护"
      description: "修改后未同步更新依赖文件"
      example: "修改§3可删清单但未同步更新project_rules.md"
      detection: "检查文件是否有漂移防护声明"
  gov_doc_011_doc_type_strategy:
    title: 按文档类型规格化策略 (GOV-DOC-011 §9)
    section_type: examples
    original_rules:
    - DOC-011
    items:
    - description: "IDE规则类(.trae/rules/AGENTS.md/CLAUDE.md)"
      details: "目标L0自含≤500tokens+L1触发加载;保留表格/命令/路径/约束/状态不变量;砍掉原理/对标/AI意识植入/触因根因/修订历史;必须补充可达性入口+触发条件;分层判定四问法:不知道会造成不可逆破坏→L0;是机械命令→L0;是为什么/背景→L2;是特定场景流程→L1"
    - description: "蓝图类(blueprint.md)"
      details: "保留frontmatter/接口契约§4/约束§5/depends_on/施工步骤§16/SSoT声明/消费者注册表/§0.1代码存在性/§10.2依赖图对齐/§10.3内部依赖图/§10.4自动化规格/施工声明;砍掉散文/对标/重复拓扑/已实现代码重复(B-20)/已执行临时时态(B-21)/配置示例/技术栈理由/重复模块列表/人日列/§7备选/§15正面后果;拆分判定>800行MUST按§4.5"
    - description: "编码标准类"
      details: "保留frontmatter/命名约定表/文件组织约束/类型注解层级表/导入规范/SSoT守卫/禁止清单;砍掉大白话解释/对标段落/代码正例反例/修订记录;必须补充KB决策记录路径引用+最小必读路径"
    - description: "操作手册类(vibe_coding/)"
