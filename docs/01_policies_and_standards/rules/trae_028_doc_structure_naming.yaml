  gov_doc_008_file_split_threshold:
    title: 规则文件拆分阈值协议 (GOV-DOC-008)
    section_type: rule
    original_rules:
    - DOC-008
    conditions:
    - type: constraint
      check: 规则文件拆分阈值
      pass: 文件行数≤3000行(约120KB)时不拆分;AI一次性读取完整文件保证上下文完整性
      fail: 文件行数>3000行且未拆分
      note: 阈值依据1M token context window;3000行约36000 token占context 3.6%;AI有效注意力范围内
    - type: constraint
      check: 拆分条件与验收标准
      pass: 同时满足3个条件才允许拆分(1)文件>3000行(2)用户明确同意(3)拆分后责任唯一+真源唯一(SSoT);责任唯一=每个文件独立负责一个子主题且无两个文件负责相同主题;真源唯一=每个数据/规则只有一个权威来源文件且无多源冲突
      fail: 缺少任一条件即拆分;或拆分后产生责任重叠(多个文件覆盖相同主题);或拆分后产生真源冲突(多个文件定义相同数据/规则)
    actions:
    - type: mandatory
      step: 默认不拆分规则文件;能不拆分就绝对不拆分
    - type: mandatory
      step: 文件超过3000行时向用户报告并请求拆分许可;未经用户同意禁止拆分
    - type: mandatory
      step: 拆分时保证每个新文件责任唯一+真源唯一(SSoT)
    - type: mandatory
      step: 拆分后更新所有跨文件引用(references.rule_ids/scripts);运行verify_rule_yaml_migration.py验证
    prohibitions:
    - 禁止未经用户同意拆分规则文件
    - 禁止拆分后产生责任重叠(多个文件负责相同主题)
    - 禁止拆分后产生真源冲突(多个文件定义相同数据)
    - 禁止拆分后丢失跨文件引用关系
    rationale: 防幻觉>Token节省;AI理解规则需要完整上下文;拆分导致跨文件引用断裂风险;1M context window的AI可处理3000行无压力
  gov_doc_018_folder_capacity_threshold:
    title: 文件夹平铺容量阈值协议 (GOV-DOC-018)
    section_type: rule
    original_rules:
    - DOC-018
    definition: |
      本协议中"文件数N"指可执行模块数（.py文件，排除__init__.py），与验证器实现
      (validate_nested_flat_dirs.py L82: f.suffix==".py" and f.name!="__init__.py")
      及thresholds.yaml键名(src_py_warn/src_py_error)对齐。ARCH-031案例亦按.py计数
      (L304: ".py文件数从271降至31排除__init__.py")。
      理由：GOV-DOC-018本质保证AI可靠召回可执行模块（实验依据见rationale），非.py
      配置/状态/数据文件不构成AI召回负担（由脚本内部硬编码引用加载，AI召回的是脚本本身）。
      裁定来源：#ARCH-041。
    conditions:
    - type: constraint
      check: 前置否决项-增量速度
      pass: 文件夹文件数有自然封顶(项目完成即停止增长,如架构定义/配置模板);进入数量阈值裁定
      fail: 文件夹文件数随项目开发线性增长且无自然封顶(如测试脚本随模块增加);直接判定必须建子目录,不参与数量裁定
      rationale: 线性增长无封顶型文件夹无论当前数量多少,终局一定爆炸;数量阈值对它无意义,增量速度作前置否决项
    - type: constraint
      check: 数量阈值-无稳定命名前缀规则
      pass: 封顶型文件夹且终局文件数N≤60;平铺OK
      fail: 封顶型文件夹且N>60且无稳定命名前缀规则;必须建子目录或先立命名前缀规则
      rationale: 无稳定前缀分组时AI凭文件名主动召回率仅约15%;60为AI纯记忆可靠扫描上限(实测依据见rationale)
    - type: constraint
      check: 数量阈值-有稳定命名前缀规则
      pass: 封顶型文件夹且终局文件数N≤120且有稳定命名前缀规则(如trae_NNN_主题_描述/gct_NNN_/p0_前缀);平铺OK
      fail: 封顶型文件夹且N>120;必须建子目录
      rationale: 有前缀分组时AI可凭前缀构造Glob模式定位;120为工具辅助定位可靠上限;超过则AI主动召回遗漏率飙升
    - type: constraint
      check: 命名前缀规则强度判定
      pass: 文件名有稳定的语义前缀分组(编号序列/功能域前缀/层前缀);前缀可预测且覆盖全部文件
      fail: 扁平命名(如test_topic.py)无统一前缀;或前缀不覆盖全部文件
    - type: constraint
      check: 子目录划分标准
      pass: 子目录内文件数≤60;按功能域/层/类型划分;子目录内仍适用本协议(递归)
      fail: 子目录内文件数>120;或划分维度与功能无关
    actions:
    - type: mandatory
      step: 新建文件夹前MUST评估终局文件数和增量特征(线性增长型/封顶型)
    - type: mandatory
      step: 封顶型且N≤120+稳定命名前缀规则→平铺;线性增长型或N>120→建子目录
    - type: mandatory
      step: 60<N≤120且无前缀→MUST先立命名前缀规则,否则建子目录
    - type: mandatory
      step: 检测脚本(validate_nested_flat_dirs.py/validate_directory_structure.py)阈值从thresholds.yaml directory_scalability节读取,warn=60/error=120;脚本默认值fail-open对齐;validate_nested_flat_dirs.py --check-prefix 模式检查>T_hard(60)目录是否有前缀约定文档(标记:命名规则/前缀簇/T_soft/GOV-DOC-018/模块地图),GATE-NESTED-FLAT-PREFIX注册在.pre-commit-config.yaml,src/zephyr/*.py变更时自动触发(ARCH-043 Risk 2-B)
    prohibitions:
    - 禁止无稳定命名前缀规则下平铺>60个文件
    - 禁止任何文件夹终局文件数>120仍平铺(无论是否有前缀)
    - 禁止线性增长无封顶型文件夹平铺(无论当前数量)
    - 禁止子目录内文件数>120
    rationale: |
      实验依据(GLM-5.2抄书背书测试,2026-07-01):对tests/governance/下288个.py文件抄书(Glob列出)后背书(主动回忆),
      仅召回45个(召回率15.6%),其中60%(27个)靠编号序列/前缀,仅18个靠语义钩子零散记住,0虚构但243个遗漏(84.4%)。
      结论:288个平铺远超AI可靠扫描区间;无前缀时可靠上限约60,有前缀时约120;超过则AI不会主动想到去找,
      直接回答"没有"而漏掉实际存在的文件。
      前置否决依据:线性增长无封顶型文件夹(如测试脚本随开发模块增加)无论当前数量,终局一定爆炸,数量阈值对它无意义。
