rule_id: TRAE-028
title: 文档治理-结构与命名
version: 1.7.5
layer: L1_foundation
module_id: TRAE-028
depends_on:
- TRAE-010
- TRAE-022
- TRAE-030
- TRAE-042
tags:
- TRAE
- doc_structure_naming
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- DOC-001
- DOC-002
- DOC-003
- DOC-004
- DOC-005
- DOC-006
- DOC-008
- DOC-018
severity: error
scope: doc_structure_naming
domain: TRAE
triggers:
- operation: doc_structure_naming
sections:
  doc_001:
    title: 统一编号规范 (GOV-DOC-001)
    section_type: rule
    original_rules:
    - DOC-001
    conditions:
    - type: constraint
      check: 层编号格式
      pass: 两位数字左补零+大写L前缀(L00-L13)
      fail: L0/L4/L130等非两位格式
    - type: constraint
      check: 目录路径命名
      pass: 文件系统路径使用小写snake_case;禁止大写L前缀;禁止kebab-case
      fail: 路径中使用大写L前缀或kebab-case
    - type: constraint
      check: YAML文件命名
      pass: snake_case格式(l00_data_source.yaml)
      fail: kebab-case或其他格式
    - type: constraint
      check: docs目录编号使用范围
      pass: 仅在文件系统路径引用/信息架构视图内部讨论/_index.yaml目录导航中使用
      fail: 在Mermaid架构图/KB决策记录/蓝图frontmatter/施工图命名/模块ID前缀/跨文档引用中使用docs编号
    - type: constraint
      check: 编号空间预留
      pass: L00-L13已分配;L14-L19近期预留;L20-L49中期预留;L50-L89远期预留;L90-L99实验临时层
      fail: 编号空间未预留或冲突
    - type: trigger
      check: 新增层编号
      pass: 提交KB决策记录+确认无法通过现有层子模块解决+在_index.yaml注册+同步更新本规范
      fail: 未走审批流程直接使用新编号
    - type: constraint
      check: 违规检测NUM-V01
      pass: Mermaid图中不使用docs目录编号作为节点ID
      fail: 正则匹配到docs编号作为节点ID(ERROR级)
    - type: constraint
      check: 违规检测NUM-V02
      pass: 蓝图frontmatter layer字段使用域英文名snake_case
      fail: layer字段使用docs目录编号(ERROR级)
    - type: constraint
      check: 违规检测NUM-V04
      pass: src/zephyr/下目录名匹配域英文名snake_case或shared
      fail: 目录名不匹配(ERROR级)
    - type: constraint
      check: 违规处置
      pass: ERROR级pre-commit阻断提交;WARNING级允许提交但下次审计必须修复
      fail: 未按严重级别处置
    actions:
    - type: mandatory
      step: 所有架构语义场景必须使用D-XXX域编号，docs目录编号仅用于物理路径
    - type: mandatory
      step: 新增层编号必须走KB决策记录审批流程
    - type: mandatory
      step: 前端使用FE前缀(FE-L1~L4)，不使用D-XXX编号
    - type: mandatory
      step: 模块ID格式为双轨制(layer-master轨MOD-{LAYER_CODE}-{SEQ}+domain-functional派生轨MOD-{DOMAIN_FRAGMENT}[-NNN]或D-XXX-{SEQ})，Shared为SH-{ABBR}-{NNN}，Frontend为FE-L{N}-{ABBR}-{NNN}
    prohibitions:
    - 禁止在Mermaid架构图中使用docs目录编号作为节点ID
    - 禁止在KB决策记录中用docs编号引用架构层
    - 禁止在蓝图frontmatter layer字段使用docs目录编号
    - 禁止在施工图命名中使用docs编号
    - 禁止L90-L99实验层进入生产
  doc_002:
    title: 目录结构规范 (GOV-DOC-002)
    section_type: rule
    original_rules:
    - DOC-002
    conditions:
    - type: constraint
      check: LPC双轨架构依赖方向
      pass: C轨内部逐层向下依赖;C→B允许;B→C禁止;B轨内部受KBG-0019约束
      fail: C轨反向依赖或B→C反向依赖
    - type: constraint
      check: governance/operational边界判据
      pass: 声明式(必须/禁止/不得)→governance/;过程式(步骤/流程/检查清单)→operational/
      fail: 声明式放operational/或过程式放governance/
    - type: constraint
      check: 混合内容处理
      pass: 70%以上声明式→governance/;70%以上过程式→operational/;耦合豁免需frontmatter标注rule_form:declarative
      fail: 未按主体判定归属
    - type: constraint
      check: domains/内部结构
      pass: 每个层域目录必须含governance/+operational/两个子目录
      fail: 只有其中一个或都没有
    - type: constraint
      check: C轨层内直铺文件数
      pass: 单目录直接子文件数(排除__init__.py)≤60(WARNING阈值);≤120(ERROR阈值);适用GOV-DOC-018文件夹平铺容量阈值协议
      fail: 终局文件数>120(ERROR);或线性增长无封顶型文件夹
    - type: constraint
      check: 03_modules/层内直铺blueprint.md
      pass: 不存在直铺blueprint.md(必须用module/子目录)
      fail: 存在直铺blueprint.md(ERROR)
    - type: trigger
      check: 新增docs/顶级目录
      pass: 在本文档提出+起草KB决策记录+Owner批准+创建目录+重新生成rule_catalog_registry.yaml
      fail: 未经审批新建顶级目录
    - type: trigger
      check: 新增src/zephyr/包
      pass: 运行归属决策树+KB决策记录+接口合同+Phase路线+本文档记录+创建骨架+Owner批准
      fail: 未经审批新建包
    actions:
    - type: mandatory
      step: MUST按本标准目录结构存放文件——散落存放=AI无法可靠定位
    - type: mandatory
      step: AI放置文件前必须执行防幻觉验证五步流程(查反向映射表→查完整路径→用锚点验证→核心判据二次验证→放置)
    - type: mandatory
      step: B轨新包创建门禁:独立顶级包=BC边界明确+至少1个KB决策记录+至少1份接口合同+至少1个Phase路线
    prohibitions:
    - 禁止在docs/(旧体系)下新建文件
    - 禁止在docs/根目录下新建.md文件(migration-declaration.md和index.md除外)
    - 禁止将治理规范放入02_enterprise_architecture/
    - 禁止将架构视图放入01_policies_and_standards/
    - 禁止新建未在本文档中定义的顶级目录
    - 禁止将B轨平台能力放入某一C轨层
    - 禁止将C轨业务层改成B轨平级形式
    - 禁止混用大小写文件名
    - 禁止在governance/下放过程式文件
    - 禁止在operational/下放声明式文件(耦合豁免除外)
    - 禁止在domains/下创建空目录(至少1+1规则)
    - 禁止手动编辑_registry/catalogs/和_registry/schemas/
    - 禁止在governance/子目录下再建子目录(文件数超过GOV-DOC-018阈值时除外)
    - 禁止把全局规则放入domains/
    - 禁止把层域规则放入governance/
  doc_003:
    title: 文件命名规范 (GOV-DOC-003)
    section_type: rule
    original_rules:
    - DOC-003
    conditions:
    - type: constraint
      check: 通用文件命名
      pass: 全小写snake_case;禁止大写(AGENTS.md白名单除外);禁止空格;禁止版本号后缀;禁止round/iteration后缀;禁止日期后缀(LATEST除外);禁止kebab-case
      fail: 违反任一规则
    - type: constraint
      check: 下划线使用
      pass: 全项目统一下划线(snake_case);适用于文件名/目录名/YAML字段名/Python源文件;一条规则零例外
      fail: 文件名使用kebab-case(连字符)
    - type: constraint
      check: doc_type→文件名后缀映射
      pass: policy→-policy.md/-rules.yaml/-runbook.md/-playbook.md/-procedure.md/-checklist.md(v3.1.0合并operational_rule);standard→-standard.md;protocol→-protocol.md;register→-registry.md/-register.md;index→index.md;template→{target_doc_type}-template.md
      fail: 文件名后缀与doc_type不匹配
    - type: constraint
      check: 文件夹命名风格
      pass: 单词或snake_case;域目录名=域英文名snake_case;禁止kebab-case文件夹名;禁止大写;禁止驼峰;禁止数字前缀(非层编号)
      fail: 违反命名风格规则
    - type: constraint
      check: GATE-11检测规则N-01
      pass: 新建文件名不含大写字母(AGENTS.md豁免)
      fail: 文件名包含大写字母
    - type: constraint
      check: GATE-11检测规则N-02
      pass: 新建文件名不含版本号后缀(TECH_VERSION_TOKENS豁免)
      fail: 文件名含-vN/-roundN/-iterationN
    - type: constraint
      check: GATE-11检测规则N-08
      pass: 文件名后缀与frontmatter doc_type匹配
      fail: 后缀与doc_type不一致(V1阻断)
    - type: constraint
      check: 大写文件白名单
      pass: 仅AGENTS.md允许保留;新建文件一律全小写
      fail: 新建大写文件名
    - type: constraint
      check: 规则文件主题前缀(ARCH-037)
      pass: rules/下规则文件名格式trae_NNN_<主题>_<描述>.yaml;<主题>段便于按文件名定位(如arch_/behavior_/doc_/methodology_/module_/meta_rule_/anti_hallucination_等);主题前缀集合由scaffold.py::_derive_rule_theme_prefixes从现有文件名自动派生(无独立词表真源)
      fail: 规则文件名缺<主题>段(单段name);scaffold.py create_rule检查1.5阻断
    actions:
    - type: mandatory
      step: 文件名后缀必须匹配doc_type(GATE-11 N-08强制校验)
    - type: mandatory
      step: 文件夹命名按决策树:对应功能域→域英文名snake_case;一个词够→单词;不够→snake_case
    - type: mandatory
      step: 技术栈专有名词版本白名单维护在scripts/governance/d3_metadata/check_naming_convention.py::TECH_VERSION_TOKENS
    - type: mandatory
      step: 规则文件创建MUST经scaffold.py rule子命令(检查1.5强制<主题>_<描述>格式);主题前缀从现有文件名派生,新前缀仅警告不阻断(允许主题扩展)
    prohibitions:
    - 禁止声明式规则用过程式后缀(governance-runbook.md→governance-protocol.md)
    - 禁止策略文件用操作后缀(security-incident-playbook.md→security-incident-response-policy.md)
    - 禁止策略文件用手册后缀(record-retention-runbook.md→record-retention-policy.md)
    - 禁止kebab-case文件夹名
    - 禁止大写字母文件夹名
    - 禁止驼峰文件夹名
    - 禁止域目录使用l{xx}_前缀或d_xxx前缀
  doc_004:
    title: 文件路径规范 (GOV-DOC-004)
    section_type: rule
    original_rules:
    - DOC-004
    conditions:
    - type: constraint
      check: 强制写入路径
      pass: 21种文件类型各有唯一强制路径(治理规范→01_policies_and_standards/;AI治理→governance/ai/;架构视图→02_enterprise_architecture/;模块文档→03_modules/;业务代码→src/zephyr/{layer_id}/;治理脚本→scripts/governance/等)
      fail: 文件未放在强制路径
    - type: constraint
      check: 废弃路径
      pass: 不在废弃路径(docs/旧体系/01_FRAMEWORK/10_GOVERNANCE_COMPLIANCE/04_CONSTRUCTION/adr/)写入
      fail: 在废弃路径新建文件
    - type: constraint
      check: 根目录白名单
      pass: 仅允许AGENTS.md/README.md/LICENSE/CONTRIBUTING.md/SECURITY.md/pyproject.toml/requirements*.txt/.pre-commit-config.yaml/.env*/.gitignore/.editorconfig/.roomodes
      fail: 根目录存在白名单外文件
    - type: constraint
      check: 物理路径树规则
      pass: project_path_tree.yaml由脚本自动生成禁止手写;同一路径只能被一个蓝图声明;路径冲突时ssot_claims优先;路径变更必须同步更新path_ownership_map.yaml
      fail: 违反路径树规则
    actions:
    - type: mandatory
      step: MUST按本标准路径映射存放文件——散落存放=路径引用断裂
    - type: mandatory
      step: 路径变更(移动/重命名)必须同步更新path_ownership_map.yaml
    prohibitions:
    - 禁止在docs/(旧体系)下新建文件
    - 禁止在根目录创建白名单外文件
    - 禁止新建未在trae_028_doc_structure_naming.yaml doc_002中定义的顶级目录
    - 禁止在废弃路径写入
    - 禁止将治理规范放入02_enterprise_architecture/
    - 禁止将架构视图放入01_policies_and_standards/
    - 禁止将AI生成产物直接写入受版本控制目录
  doc_005:
    title: 编码安全规范 (GOV-DOC-005)
    section_type: rule
    original_rules:
    - DOC-005
    conditions:
    - type: constraint
      check: Trae编辑器配置
      pass: files.autoGuessEncoding=false;files.encoding=utf8
      fail: autoGuessEncoding=true或encoding非utf8
    - type: constraint
      check: Python文件编码
      pass: open()必须显式指定encoding='utf-8'
      fail: open(path,'w')不指定encoding
    - type: constraint
      check: PowerShell脚本编码
      pass: 使用[System.IO.File]::WriteAllText($path,$content,[System.Text.Encoding]::UTF8)
      fail: 使用echo/Out-File默认参数写文件
    - type: trigger
      check: 编码损坏识别信号
      pass: 文件末尾出现阿拉伯文/西里尔文字符;frontmatter字段值出现非中英文字符;正文标题出现非中英文字符;尾部出现重复frontmatter块
      fail: 未识别损坏信号继续使用
    actions:
    - type: mandatory
      step: 开始任何Trae session之前必须确认autoGuessEncoding=false已生效
    - type: mandatory
      step: 编码损坏修复唯一流程:check_encoding.py确认→git checkout恢复→确认修复
    prohibitions:
    - 禁止用文本编辑器逐字修改乱码字符(必须git checkout整文件还原)
    - 禁止PowerShell echo/Out-File默认参数写.md文件
    - 禁止Python open(f,'w')不指定encoding
    - 禁止两个编辑器同时打开同一文件编辑
    - 禁止在损坏文件上追加修复块或混合段落
    - 禁止将损坏文件当作参考资料使用
  doc_006:
    title: 文档生命周期管理规范 (GOV-DOC-006)
    section_type: rule
    original_rules:
    - DOC-006
    conditions:
    - type: constraint
      check: TTL分级
      pass: permanent(永久)/task_bound(任务绑定，完成即删)
      fail: 未指定TTL或TTL值不在二元分类中
    - type: constraint
      check: 文档状态机
      pass: 只有draft/active/deprecated三种状态;draft→active需Owner批准+补齐14个必填字段;active→deprecated需填写superseded_by;deprecated→active需Owner审批
      fail: 使用非法状态值或未按转换规则操作
    - type: constraint
      check: LATEST覆盖写入模式
      pass: 状态快照文件必须使用LATEST命名(*-LATEST.json/yaml/md);历史版本通过git log查询
      fail: 按日期新建状态快照文件
    - type: trigger
      check: 归档流程触发
      pass: 文件移动到archive/子目录+更新frontmatter status:deprecated ttl:task_bound+更新所有引用+重新生成rule_catalog_registry.yaml+同一commit完成
      fail: 未走归档流程直接处理
    - type: trigger
      check: 废弃流程触发
      pass: 创建新版本+新文件frontmatter添加supersedes+旧文件添加superseded_by和status:deprecated+确认无引用+按TTL处理旧文件
      fail: 未走废弃流程直接删除Active文档
    actions:
    - type: mandatory
      step: MUST为所有文档指定TTL和status——无生命周期管理=过期文档堆积
    - type: mandatory
      step: AI生成产物必须写入.audit_cache/(已gitignored)，禁止写入受版本控制目录
    - type: mandatory
      step: AI生成文件frontmatter必须包含created_by:agent和ttl:7d或ttl:30d
    - type: mandatory
      step: AI生成产物提升为正式文档需Owner审查后手动移入正式目录
    prohibitions:
    - 禁止按日期新建状态快照文件(使用LATEST覆盖写入)
    - 禁止文件名带版本号后缀(-v2/-v3)
    - 禁止AI生成产物直接写入docs/
    - 禁止不更新rule_catalog_registry.yaml就删除文件
    - 禁止跳过废弃流程直接删除Active文档
  gov_doc_001_layer_registry:
