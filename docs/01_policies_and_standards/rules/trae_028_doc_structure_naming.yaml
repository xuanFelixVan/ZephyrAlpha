      details: src/zephyr/infra_ops/;已规划
    - description: 实验 - 实验管线与A/B测试框架
      details: src/zephyr/simulation/;已规划
  gov_doc_001_numbering_space:
    title: 编号空间预留与前端编号 (GOV-DOC-001 §2.3+§4)
    section_type: principles
    original_rules:
    - DOC-001
    principles:
    - id: NS-001
      statement: L00-L13已分配(14个业务/技术层);L14-L19近期预留(2-5年);L20-L49中期预留(5-10年);L50-L89远期预留(10年+);L90-L99实验临时层(不得进入生产)
      rationale: 为5-10年系统演化预留充足编号空间
      applies_to: 统一编号体系
    - id: NS-002
      statement: 前端使用FE前缀(FE-L1展示层/FE-L2状态管理层/FE-L3服务层/FE-L4基础设施层)，不使用D-XXX编号
      rationale: 前端作为独立平台，与后端14层体系分离
      applies_to: 前端模块编号
    - id: NS-003
      statement: 前端FE-L3通过D_FRONTEND人机交互层与后端交互，架构图中交互边必须标注D_FRONTEND为边界层
      rationale: 前后端交互必须经过明确的边界层
      applies_to: 前后端交互
    - id: NS-004
      statement: 新增层编号必须提交KB决策记录+确认无法通过现有层子模块解决+在_index.yaml注册+同步更新本规范
      rationale: 编号空间append-only，新增需审批
      applies_to: 新增层编号审批
  gov_doc_001_entity_ids:
    title: 其他实体ID前缀 (GOV-DOC-001 §5.8)
    section_type: examples
    original_rules:
    - DOC-001
    items:
    - description: CTR-{NNN} 跨层数据契约
      details: 示例CTR-001
    - description: E-{DOMAIN}-{NN} 领域事件
      details: 示例E-EX-01
    - description: AGG-{NNN} DDD聚合根
      details: 示例AGG-001
    - description: ENT-{NNN} DDD实体
      details: 示例ENT-001
    - description: VO-{NNN} DDD值对象
      details: 示例VO-001
    - description: T-{QUADRANT}{NN} Technology Radar(EA YAML)
      details: 示例T-A01
    - description: IMPL-T-{QUADRANT}{NN} Technology Radar(仓库根摘要)
      details: 示例IMPL-T-A01;与T-*隔离
    - description: DS{NN} 数据源
      details: 示例DS01
    - description: LLM{NN} LLM供应商
      details: 示例LLM01
    - description: KBG-{NNNN} KB内部架构决策引用ID(不对应物理文件)
      details: 示例KBG-0007;通过KB.search()检索
  gov_doc_001_capacity_expansion:
    title: ID容量扩展规则 (GOV-DOC-001 §5.9 容量扩展)
    section_type: rule
    original_rules:
    - DOC-001
    conditions:
    - type: constraint
      check: 容量扩展触发阈值
      pass: 任一ID类型已用量达到理论上限80%时触发扩展
      fail: 未达阈值继续使用现有格式
    - type: constraint
      check: 向后兼容原则
      pass: 扩展后现有ID保持不变;新ID使用扩展格式;通过前缀位数区分
      fail: 强制迁移现有ID
    - type: constraint
      check: 扩展格式定义
      pass: 见capacity_expansion_table
      fail: 使用未定义的扩展格式
    actions:
    - type: mandatory
      step: ID容量达到80%时MUST提交KB决策记录审批扩展方案
    - type: mandatory
      step: 扩展后MUST同步更新_index.yaml id_conventions和module_id_registry.yaml
    - type: mandatory
      step: 扩展后MUST同步更新check_naming_convention.py正则检测规则
    prohibitions:
    - 强制迁移现有ID到扩展格式（违反向后兼容原则）
    - 使用未在capacity_expansion_table中定义的扩展格式
    - 未达80%阈值提前触发扩展
  gov_doc_001_capacity_expansion_table:
    title: ID容量扩展映射表 (GOV-DOC-001 §5.9.1)
    section_type: examples
    original_rules:
    - DOC-001
    items:
    - description: GATE门禁ID扩展
      details: 现有GATE-NN(2位,上限99);扩展为GATE-NNN(3位,上限999);触发阈值80个;当前数量通过gate_registry.yaml查询
    - description: 领域事件ID扩展
      details: 现有E-{DOMAIN}-NN(2位,上限99/域);扩展为E-{DOMAIN}-NNN(3位,上限999/域);触发阈值80/域
    - description: 数据源ID扩展
      details: 现有DS-NN(2位,上限99);扩展为DS-NNN(3位,上限999);触发阈值80个
    - description: LLM供应商ID扩展
      details: 现有LLM-NN(2位,上限99);扩展为LLM-NNN(3位,上限999);触发阈值80个
    - description: 跨层契约ID扩展
      details: 现有CTR-NNN(3位,上限999);扩展为CTR-NNNN(4位,上限9999);触发阈值800个;当前数量通过registry查询，接近阈值时需监控
    - description: KBG决策ID扩展
      details: 现有KBG-NNNN(4位,上限9999);扩展方案A:KBG-NNNNN(5位,上限99999);扩展方案B:启用KBG-5xxxx段(50000-99999);触发阈值8000个;当前数量通过registry查询，接近阈值时需规划
    - description: 脚本前缀内序号管理
      details: 合法前缀数量通过script-manifest.yaml查询;扩展规则:前缀内使用4位序号{prefix}_NNNN_{name}.py;目标10000脚本容量;现有脚本数通过script-manifest.yaml查询，逐步迁移
    - description: 模块ID容量评估
      details: layer-master轨MOD-{LAYER}-NNN(3位,上限999/层)和domain-functional派生轨D-XXX-NNN(3位)/MOD-{DOMAIN_FRAGMENT}[-NNN](序号可选);1500目标预估充足;4位扩展MOD-{LAYER}-NNNN(上限9999/层)作为预留
  gov_doc_001_1500_module_naming:
    title: 模块命名空间分区规则 (GOV-DOC-001 §5.10)
    section_type: rule
    original_rules:
    - DOC-001
    conditions:
    - type: constraint
      check: 模块命名空间分区
      pass: 模块按域分区，单域 production 节点 80-150 默认 / 150-200 高度耦合放宽 / 200 硬上限（见 trae_055 ARCH-CAP-002）
      fail: 单域 production 节点 >200 未拆分
    - type: constraint
      check: 模块ID分配优先级
      pass: 优先复用空缺ID(查numbering_gaps);其次分配新ID;禁止跳号
      fail: 未查gaps直接分配新ID
    - type: constraint
      check: 跨域模块命名
      pass: 跨域共享模块使用SH-{ABBR}-{NNN}格式;域专属模块使用domain-functional派生轨格式MOD-{DOMAIN_FRAGMENT}[-NNN]或D-{DOMAIN}-{NNN}(序号可选,见模块ID格式condition双轨制)
      fail: 跨域模块使用域专属格式
    actions:
    - type: mandatory
      step: 新增模块MUST先在module_id_registry.yaml注册再使用
    - type: mandatory
      step: 单域达 150 production 节点时评估是否需要拆分；达 200 时 MUST 启动拆分流程（见 trae_055 ARCH-CAP-002/006）
    prohibitions:
    - 未查numbering_gaps直接分配新ID（违反ID复用优先级）
    - 跨域共享模块使用域专属D-{DOMAIN}-{NNN}格式（应使用SH-{ABBR}-{NNN}）
    - 单域 production 节点 >200 继续分配ID
    - 跳号分配模块ID
  gov_doc_001_script_versioning:
    title: 脚本版本化命名规则 (GOV-DOC-001 §5.11)
    section_type: rule
    original_rules:
    - DOC-001
    conditions:
    - type: constraint
      check: 脚本版本化触发条件
      pass: 脚本有多个不兼容版本共存时启用版本化
      fail: 单版本脚本使用普通命名
    - type: constraint
      check: 版本化命名格式
      pass: '{prefix}_v{N}_{name}.py;N为单数字版本号;最多9个版本'
      fail: 使用多数字版本号或非v前缀
    - type: constraint
      check: 版本化脚本注册
      pass: 所有版本MUST在script_manifest.yaml注册;废弃版本标记status:deprecated
      fail: 未注册或未标记废弃版本
    actions:
    - type: mandatory
      step: 版本化脚本MUST在script_manifest.yaml注明parent_script和supersedes
    prohibitions:
    - 单版本脚本使用版本化命名（仅多版本不兼容共存时启用）
    - 使用多数字版本号或非v前缀（如_v01/_v10/version2）
    - 版本化脚本未在script_manifest.yaml注册
    - 废弃版本未标记status:deprecated
  gov_doc_001_transaction_id:
    title: 跨系统事务ID规则 (GOV-DOC-001 §5.12)
    section_type: rule
    original_rules:
    - DOC-001
    conditions:
    - type: constraint
      check: 事务ID格式
      pass: TXN-{YYYYMMDD}-{NNNNNN};日期8位+序号6位;单日上限999999
      fail: 使用其他格式
    - type: constraint
      check: 事务ID分配
      pass: 100AI并发时每个AI分配独立序号段;通过transaction_registry.yaml管理
      fail: 多AI共用序号段导致冲突
    - type: constraint
      check: 事务ID生命周期
      pass: 事务完成7天后归档;异常事务保留30天;通过TTL自动清理
      fail: 事务ID永久保留
    actions:
    - type: mandatory
      step: 跨AI协作MUST使用事务ID追踪
    - type: mandatory
      step: 事务IDMUST写入audit_trail表
    prohibitions:
    - 使用非TXN-{YYYYMMDD}-{NNNNNN}格式的事务ID
    - 多AI共用序号段导致冲突（须通过transaction_registry.yaml分配独立序号段）
    - 事务ID永久保留（须按7天归档/异常30天/TTT自动清理）
  gov_doc_002_module_decision_tree:
    title: 新模块归属决策树 (GOV-DOC-002 §四)
    section_type: decision_tree
    original_rules:
    - DOC-002
    decision_tree:
    - condition: 此模块的核心职责是某条业务流水线的某一阶段吗?
      if_true: 归入对应l<NN>_*/层(C轨)
      if_false: 进入Q2
    - condition: Q2:此模块是服务所有业务层的跨层平台能力吗?
      if_true: 进入Q3
      if_false: 回到Q1重新审视业务归属
    - condition: Q3:此能力有明确稳定文档化的业务边界(Bounded Context)吗?
      if_true: 创建独立顶级包(B轨无l<NN>_前缀);同步创建_b_track_interfaces/<name>-interface.md接口合同;同步创建KB决策记录
      if_false: 进入Q4
    - condition: Q4:此能力是若干业务层共享的小工具/常量/契约/Schema吗?
      if_true: 归入shared/子目录
      if_false: 登记不实施
  gov_doc_002_anti_hallucination_verify:
    title: 防幻觉路径验证流程 (GOV-DOC-002 §5.1.2)
    section_type: verification
    original_rules:
    - DOC-002
    steps:
    - step: 查反向映射表确定文件类型对应的唯一目标目录
      command: 查GOV-DOC-002 §5.1.2反向映射表
      expected_exit: 找到唯一目标目录
      on_fail: 文件类型未在映射表中→登记
    - step: 查完整路径映射表确认目标目录完整路径
      command: 查GOV-DOC-002 §5.1.2完整路径映射表
      expected_exit: 确认完整路径
      on_fail: 路径不存在→检查目录是否已创建
    - step: 用锚点文件验证路径是否存在(搜索锚点文件的module_id)
      command: Grep锚点文件的module_id
      expected_exit: 找到锚点文件确认路径正确
      on_fail: 锚点文件找不到→路径可能有误
    - step: 按§5.1.1核心判据二次验证(文件是声明式还是过程式)
      command: 判断文件主体内容类型
      expected_exit: 声明式→governance/;过程式→operational/
      on_fail: 混合内容→看主体(70%)+看意图+耦合豁免
    - step: 放置文件
      command: 将文件放入验证后的目标路径
      expected_exit: 文件在正确位置
      on_fail: 路径验证未通过禁止放置
  gov_doc_003_special_naming:
    title: 特殊文件命名规则 (GOV-DOC-003 §2)
    section_type: examples
    original_rules:
    - DOC-003
    items:
    - description: Session Log命名
      details: 格式session-YYYYMMDD-NNN.md;示例session-20260422-001.md;NNN为当日序号从001开始
    - description: 架构模型YAML(层文件)命名
      details: 格式l{XX}_{layer_name}.yaml;示例l00_data_source.yaml/l13_experiment_pipeline.yaml
    - description: 状态快照(LATEST模式)命名
      details: 格式{name}-LATEST.{ext};示例architecture_snapshot_LATEST.yaml;禁止按日期新建
    - description: 知识库条目命名
      details: 格式ke-{三位数序号}-{snake_case_title}.md;示例ke_025_encoding_corruption_postmortem.md
    - description: Python源文件命名
      details: 格式{snake_case}.py(PEP8);示例intent_parser.py/task_repo.py
    - description: 模板文件命名
      details: 格式_template.md(下划线前缀表示非编号项);位置各类文档目录下
    - description: 技术栈专有名词版本白名单(N-02豁免)
      details: 文件名包含pydantic-v/python-v/node-v/go-v/rust-v/numpy-v/pandas-v/postgres-v/mysql-v/sqlite-v/redis-v/django-v/flask-v/fastapi-v/typescript-v/react-v/vue-v/next-v/kubernetes-v/docker-v/terraform-v/ansible-v/http-v/tls-v/oauth-v时N-02不触发;完整清单维护在scripts/governance/d3_metadata/check_naming_convention.py::TECH_VERSION_TOKENS
  gov_doc_003_folder_decision_tree:
    title: 文件夹命名决策树 (GOV-DOC-003 §一.1.3)
    section_type: decision_tree
    original_rules:
    - DOC-003
    decision_tree:
    - condition: 这个目录是否对应某个功能域(D-XXX)?
      if_true: 用域英文名snake_case(查depgraph v3域→目录映射表)
      if_false: 进入Q2
    - condition: Q2:目录名是否用一个单词就能准确表达?
      if_true: 用单词(如ai/document/task/)
      if_false: 用snake_case(如vibe_coding/post_trade_analytics/)
  gov_doc_004_path_tables:
    title: 强制写入路径+废弃路径+根目录白名单 (GOV-DOC-004 §一~§三)
    section_type: examples
    original_rules:
    - DOC-004
    items:
    - description: 治理规范/标准/协议强制路径
      details: docs/01_policies_and_standards/
    - description: 规则文件强制路径(含AI治理/架构治理/文档治理等所有规则)
      details: docs/01_policies_and_standards/rules/
    - description: 企业架构视图(TOGAF)强制路径
      details: docs/02_enterprise_architecture/（00-04 自动生成层）
    - description: KB决策记录强制路径
      details: KB:decisions(Git-backed);旧docs/02_enterprise_architecture/adr/物理树已移除
    - description: 架构模型YAML强制路径
      details: architecture_model/
    - description: 架构快照强制路径
      details: docs/02_enterprise_architecture/snapshots/
    - description: 模块生命周期文档强制路径
      details: docs/03_modules/{domain_name}/{module}/
    - description: 知识库条目强制路径
      details: docs/08_knowledge/
    - description: 审计报告/状态强制路径
      details: docs/_working/audit/
    - description: 业务代码强制路径
      details: src/zephyr/{layer_id}/
    - description: 治理/审计脚本强制路径
      details: scripts/governance/
    - description: pre-commit hooks强制路径
      details: scripts/hooks/
    - description: AI生成产物(临时)强制路径
      details: .audit_cache/(已gitignored)
    - description: 废弃路径docs/01_FRAMEWORK/
      details: 替代→docs/02_enterprise_architecture/
    - description: 废弃路径docs/10_GOVERNANCE_COMPLIANCE/
      details: 替代→docs/01_policies_and_standards/
    - description: 废弃路径docs/04_CONSTRUCTION/
      details: 替代→docs/03_modules/
    - description: 废弃路径docs/02_enterprise_architecture/adr/
      details: 替代→KB:decisions(KB决策记录权威namespace)
    - description: 根目录白名单
      details: AGENTS.md/README.md/LICENSE/CONTRIBUTING.md/SECURITY.md/pyproject.toml/requirements*.txt/.pre-commit-config.yaml/.env*/.gitignore/.editorconfig/.roomodes;禁止根目录创建白名单外文件
  gov_doc_005_encoding_symptoms:
    title: 编码损坏症状映射与修复流程 (GOV-DOC-005 §三~§四)
    section_type: symptom_mapping
    original_rules:
    - DOC-005
    mappings:
    - symptom: 文件末尾出现阿拉伯文/西里尔文字符
      root_cause: Trae autoGuessEncoding=true误判UTF-8为GBK/Latin-1→以错误编码写入→Cursor以UTF-8读取显示乱码
      treatment: git checkout HEAD -- <损坏文件路径>恢复;然后确认autoGuessEncoding=false
    - symptom: frontmatter字段值出现非中英文字符
      root_cause: 双重编码损坏;主体可能全部损坏
      treatment: git checkout整文件还原;禁止逐字修改乱码
    - symptom: 正文标题出现非中英文字符
      root_cause: 至少局部损坏
      treatment: git checkout整文件还原
    - symptom: 尾部出现重复frontmatter块
      root_cause: 双重编码追加导致
      treatment: git checkout整文件还原;禁止在损坏文件上追加修复块
  gov_doc_005_encoding_repair:
    title: 编码损坏修复流程 (GOV-DOC-005 §四)
    section_type: procedure
    original_rules:
    - DOC-005
    procedure:
    - order: 1
      action: 确认损坏范围
      pre_condition: 发现编码损坏信号
      expected_result: check_encoding.py输出损坏文件列表
      on_failure: 手动检查文件编码
    - order: 2
      action: 从git历史恢复(推荐)
      pre_condition: 确认损坏文件路径
      expected_result: git checkout HEAD -- <损坏文件路径>成功
      on_failure: HEAD也已损坏→进入步骤3
    - order: 3
      action: 找干净版本
      pre_condition: HEAD也已损坏
      expected_result: git log找到干净commit;git show导出干净版本
      on_failure: 无干净版本→从备份恢复
    - order: 4
      action: 确认修复
      pre_condition: 文件已恢复
      expected_result: check_encoding.py确认无损坏
      on_failure: 仍有损坏→重复步骤2-3
  gov_doc_006_lifecycle_state_machine:
    title: 文档状态机与TTL分级 (GOV-DOC-006 §一~§二)
    section_type: examples
    original_rules:
    - DOC-006
    items:
    - description: TTL=permanent(永久有效)
      details: 适用治理规范/架构视图/KB决策记录/知识库条目/真源数据;不过期需Owner明确废弃
    - description: TTL=task_bound(任务绑定，完成即删)
      details: 适用施工方案/评估报告/提案/调研报告/临时笔记;任务完成后可清理;默认落 docs/_working/
    - description: 状态转换draft→active
      details: Owner批准;更新frontmatter status为active;补齐Active阶段14个必填字段(PS-STD-001 §2.2);更新rule_catalog_registry.yaml
    - description: 状态转换active→deprecated
      details: 被新版本取代或内容过时;填写superseded_by字段;若被取代同时在新文件添加supersedes;更新rule_catalog_registry.yaml
    - description: 状态转换deprecated→active
      details: Owner审批(重新启用);更新frontmatter status为active;清除superseded_by字段
    - description: 状态转换deprecated→删除
      details: TTL过期+确认无引用+Owner明确指示;执行文件删除安全门禁(GOV-DOC-007)
    - description: LATEST覆盖写入模式
      details: 状态快照文件必须使用*-LATEST.json/yaml/md命名;禁止按日期新建;历史版本通过git log查询;例外:Session Log和审计报告归档允许带日期
  gov_doc_006_archive_deprecated_flow:
    title: 归档与废弃流程 (GOV-DOC-006 §四~§五)
    section_type: procedure
    original_rules:
    - DOC-006
    procedure:
    - order: 1
      action: 归档-将文件移动到docs/_archive/(统一归档区;01/02/03/08所有永久区deprecated文件归此一处;废除各永久区下的_archive/子目录)
      pre_condition: 文档需要归档(保留历史但不再活跃使用)
      expected_result: 文件已移至docs/_archive/
      on_failure: 目录不存在→先创建docs/_archive/目录
    - order: 2
      action: 归档-更新文件frontmatter(status:deprecated;ttl:permanent)+更新所有引用+重新生成rule_catalog_registry.yaml
      pre_condition: 文件已移至archive/
      expected_result: frontmatter和引用已更新
      on_failure: 引用未全部更新→在同一commit中完成
    - order: 3
      action: 废弃-创建新版本文件(新文件名不带版本号后缀)
      pre_condition: 文档被新版本取代
      expected_result: 新文件已创建
      on_failure: 无法创建新文件→先解决阻塞
    - order: 4
      action: 废弃-在新文件frontmatter添加supersedes:旧文件路径;在旧文件frontmatter添加superseded_by:新文件路径+status:deprecated
      pre_condition: 新版本文件已创建
      expected_result: 新旧文件frontmatter已互相关联
      on_failure: 字段缺失→补充
    - order: 5
      action: 废弃-确认无其他文件引用旧文件(运行断链检测)+按TTL规则处理旧文件
      pre_condition: frontmatter已更新
      expected_result: check_dead_links.py确认无新增断链;permanent文件需Owner明确指示才删除
      on_failure: 仍有引用→先更新引用再继续
  gov_doc_006_ai_product_rules:
    title: AI生成产物特殊规则 (GOV-DOC-006 §六)
    section_type: procedure
    original_rules:
    - DOC-006
    procedure:
    - order: 1
      action: AI生成产物写入.audit_cache/(已gitignored)
      pre_condition: AI需要生成临时产物
      expected_result: 产物在.audit_cache/目录下;不在受版本控制目录中
      on_failure: 直接写入docs/→必须移回.audit_cache/
    - order: 2
      action: AI生成文件frontmatter必须包含created_by:agent和ttl:7d或ttl:30d
      pre_condition: AI生成产物已写入.audit_cache/
      expected_result: frontmatter字段完整
      on_failure: 缺失字段→补充
    - order: 3
      action: AI生成产物提升为正式文档需Owner审查后手动移入正式目录
      pre_condition: AI产物需要成为正式文档
      expected_result: Owner审查通过;文件移入正式目录;frontmatter更新(created_by改为human_plus_agent;ttl改为permanent)
      on_failure: Owner未审查→产物保留在.audit_cache/按TTL过期
  gov_doc_cross_refs_028:
    title: 文档治理域跨规则关系 (GOV-DOC-001~006)
    section_type: context
    original_rules:
    - DOC-001
    - DOC-002
    - DOC-003
    - DOC-004
    - DOC-005
    - DOC-006
    context:
      summary: GOV-DOC-001~006构成文档治理的结构与命名子域。001定义编号体系→002定义目录结构→003定义文件命名→004定义文件路径→005定义编码安全→006定义生命周期。六者形成依赖链:001的编号前缀→003的module_id命名空间→002的目录锚点→004的路径映射→005的编码保护→006的状态管理
      impact_on_rules:
      - 修改GOV-DOC-001编号前缀→必须同步更新GOV-DOC-003 §四module_id命名空间和GOV-DOC-010 §4.2前缀速查表
      - 修改GOV-DOC-002目录结构→必须同步更新GOV-DOC-004 §一强制路径表和GOV-DOC-007锚点文件清单
      - 修改GOV-DOC-003命名规则→必须同步更新GATE-11检测脚本(scripts/governance/d3_metadata/check_naming_convention.py)
      - 修改GOV-DOC-006生命周期状态→必须对齐PS-STD-001 §4.1 DocStatus枚举
      key_decisions:
      - 编号体系使用D-XXX域编号(docs目录编号仅用于物理路径)
      - 目录结构采用LPC双轨架构(C轨14层+B轨横切能力)
      - 文件名后缀必须匹配doc_type(GATE-11 N-08强制)
      - 编码安全核心是autoGuessEncoding=false
      - 生命周期只有draft/active/deprecated三种状态
