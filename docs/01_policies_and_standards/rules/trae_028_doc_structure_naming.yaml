  gov_doc_003_naming_ssot:
    title: 命名规则唯一真源声明 (GOV-DOC-003 §SSoT)
    section_type: rule
    original_rules:
    - DOC-003
    conditions:
    - type: constraint
      check: 命名规则真源唯一性
      pass: 所有命名规则以本文件(trae_028_doc_structure_naming.yaml)为唯一真源;其他文件(trae_010/022/030/042)的命名规则段落已删除改为引用本文件
      fail: 其他文件中存在命名规则定义(非引用)
    - type: constraint
      check: 域ID格式
      pass: D-XXX_YYY(大写D+大写域缩写+下划线分隔业务语义片段,对应domain_naming_rules_registry.yaml NR-002);示例D_MKT_DATA/D_ASHARE_SIGNAL/D_AUTONOMY_CORE;下划线用于拼接多业务语义片段,不表示父子层级
      fail: 连字符格式(D_EX_CORE)或小写格式(d-ex_core)
    - type: constraint
      check: 域ID语义完整性
      pass: 域ID下划线后的第一段不得与任何已存在域ID匹配(无父子前缀,对应domain_naming_rules_registry.yaml NR-001);域ID必须独立表达业务含义,不得依赖其他域ID才能理解(语义独立性,对应NR-003);domain_name必须与domain_id语义一致(中文名一致,对应NR-005);所有域平级无父子关系
      fail: D-XXX_YYY形式中XXX是已存在域ID(如D-SIGNAL_ASHARE暗示ASHARE是SIGNAL子域,违反NR-001);或域ID是其他域ID加下划线后缀形式(如D-SIGNAL_QUALITY依赖D-SIGNAL上下文,违反NR-003);或domain_name与domain_id表达不同业务含义(违反NR-005)
    - type: constraint
      check: 模块ID格式（双轨制，裁定#208 R1）
      pass: 双轨制 scoped 适用—layer-master轨=MOD-{LAYER_CODE}-{SEQ}(如MOD-L00-001/MOD-INF-005,序号必填);domain-functional派生轨=MOD-{DOMAIN_FRAGMENT}[-NNN]或D-XXX-{SEQ}(如MOD-ASHARE_SIGNAL/MOD-ASHARE_SIGNAL-001/D-MKT_DATA-001,域片段派生自domain_id去D-前缀,序号可选);Shared为SH-{ABBR}-{NNN};Frontend为FE-L{N}-{ABBR}-{NNN};双轨判定=token共享测试(blueprint_id去MOD-/D-前缀与domain_id去D-前缀分词有交集则属派生轨)
      fail: 其他格式(既非layer-master轨也非domain-functional派生轨)
      rationale: 双轨制对标K8s name/UID分离(layer-master≈UID稳定不透明+派生轨≈name语义可读);调和L1038(序号必填)与派生规则(派生序号可选)的历史矛盾
    - type: constraint
      check: 标识符编号格式（ARCH/MOD/PS-REG/GOV-DOC/D-XXX等）
      pass: 所有标识符编号一律大写（ARCH-NNN/MOD-{LAYER}-{SEQ}/PS-REG-NNN/GOV-DOC-NNN/D-XXX_YYY/SH-{ABBR}-{NNN}/FE-L{N}-{ABBR}-{NNN}）;标识符编号是YAML/DB中的ID字段值,不是文件名;大写用于与snake_case文件名/字段名视觉区分
      fail: 小写标识符编号(arch-033/mod-inf-006/ps-reg-002等)
      rationale: 标识符编号与文件名/目录名/字段名分离——后者强制snake_case小写(跨平台兼容Windows大小写不敏感+Linux大小写敏感的import路径坑+PEP8),前者大写用于视觉区分和与文件名解耦;大写标识符不会出现在文件名上(文件名用snake_case如mod_inf_039_blueprint.yaml)
    - type: constraint
      check: 文件名格式
      pass: 全小写snake_case;适用于YAML/JSON/MD/所有文件类型;禁止kebab-case(连字符);禁止大写(AGENTS.md白名单除外)
      fail: kebab-case或大写文件名
    - type: constraint
      check: 目录名格式
      pass: 单词或snake_case(小写+下划线);域目录名=域英文名snake_case;禁止kebab-case;禁止大写;禁止驼峰
      fail: kebab-case或大写或驼峰目录名
    - type: constraint
      check: Python源文件命名
      pass: snake_case.py(PEP8);测试文件test_{module}.py
      fail: CamelCase.py或kebab-case.py
    - type: constraint
      check: 代码标识符命名
      pass: 类名PascalCase;函数/变量snake_case;常量UPPER_SNAKE_CASE;私有_leading_underscore;布尔is_/has_/can_前缀
      fail: 违反PEP8标识符命名
    - type: constraint
      check: YAML内部字段名
      pass: snake_case(小写+下划线)
      fail: kebab-case或CamelCase字段名
    actions:
    - type: mandatory
      step: 所有命名规则以本文件为唯一真源;修改命名规则必须先修改本文件
    - type: mandatory
      step: 域ID/模块ID/ARCH议题编号/规则ID等所有标识符编号保持大写格式(标识符不是文件名,与snake_case文件名解耦);统一使用下划线分隔业务语义片段(禁止连字符);下划线不表示父子层级,所有域平级(见域ID语义完整性condition)
    - type: mandatory
      step: 文件名/目录名统一snake_case(全项目统一下划线,一条规则零例外)
    - type: mandatory
      step: check_naming_convention.py必须与本文件对齐;本文件修改后必须同步更新检测脚本
    prohibitions:
    - 禁止在其他规则文件(trae_010/022/030/042)中定义命名规则(只能引用本文件)
    - 禁止域ID使用连字符(D_EX_CORE)或小写(d-ex_core)
    - 禁止文件名使用kebab-case(连字符)
    - 禁止目录名使用kebab-case(连字符)
    - 禁止check_naming_convention.py的检测规则与本文件不一致
  gov_doc_003_derived_identifiers:
    title: 派生标识符规则 (GOV-DOC-003 §派生)
    section_type: rule
    original_rules:
    - DOC-003
    conditions:
    - type: constraint
      check: blueprint_id 派生关系
      pass: blueprint_id 的域片段派生自 domain_id(如domain_id=D_ASHARE_SIGNAL则blueprint_id=MOD-ASHARE_SIGNAL[-NNN],序号可选,见模块ID格式condition双轨制domain-functional轨);派生关系记录在derived_identifier_registry.yaml(sequence_required字段控制序号是否必填,派生轨=false)
      fail: blueprint_id 域片段与所属 domain_id 不一致(如domain_id=D_ASHARE_SIGNAL但blueprint_id=MOD-SIGNAL_ASHARE-旧名残留)
    - type: constraint
      check: 节点路径域片段派生关系
      pass: nodes.path 中的域标识片段派生自 domain_id(如domain_id=D_ASHARE_SIGNAL则节点路径含D_ASHARE_SIGNAL-NNN);节点路径编号按域内顺序分配(D-XXX-01,-02...)
      fail: nodes.path 域片段与所属 domain_id 不一致(如domain_id=D_ASHARE_SIGNAL但路径含D-SIGNAL-21旧名残留)
    actions:
    - type: mandatory
      step: 派生标识符的域片段必须跟随 domain_id;domain_id 改名时派生标识符必须同步改名(见gov_doc_003_rename_propagation)
    - type: mandatory
      step: 派生标识符关系表 maintained in derived_identifier_registry.yaml;新增派生关系必须先登记
    prohibitions:
    - 禁止 blueprint_id/节点路径的域片段与 domain_id 不一致
    - 禁止 blueprint_id 使用子串替换传播(SIGNAL_ASHARE含SIGNAL子串会误伤,必须用精确值映射)
  gov_doc_003_rename_propagation:
    title: 改名传播规则 (GOV-DOC-003 §传播)
    section_type: rule
    original_rules:
    - DOC-003
    conditions:
    - type: constraint
      check: 改名传播完整性
      pass: domain_id 改名时所有引用旧ID的位置必须同步更新;覆盖范围由值扫描兜底(全表TEXT列扫描残留旧ID),非仅列名枚举;改名后必须通过audit_rename_completeness.py审计(0残留才通过)
      fail: 改名后存在残留旧ID(如nodes.owner/business_stream/tags等列名不含domain但值含旧ID的列被遗漏)
    - type: constraint
      check: 派生标识符同步改名
      pass: domain_id 改名时blueprint_id/节点路径的域片段同步改名(精确值映射,禁止子串REPLACE);edges不受影响(用node_id INTEGER引用,不引用path)
      fail: domain_id 改名后blueprint_id或节点路径仍含旧域片段
    actions:
    - type: mandatory
      step: domain_id 改名必须用apply_depgraph.py --rename-domain(含值扫描兜底)+--propagate-rename(派生标识符传播);禁止手动SQL改domain_id
    - type: mandatory
      step: 改名后必须运行audit_rename_completeness.py --check-all-text-columns;0残留才通过
    prohibitions:
    - 禁止改名后遗留任何残留旧ID(包括列名不含domain但值含旧ID的列)
    - 禁止用SQLite LIKE '%OLD_ID%'子串替换传播blueprint_id(子串陷阱,必须精确值映射)
    - 禁止跳过audit_rename_completeness.py审计直接结束改名
  gov_doc_003_filename_uniqueness:
    title: 文件名项目内唯一性规则 (GOV-DOC-003 §N-16)
    section_type: rule
    original_rules:
    - DOC-003
    # N-16 结构化配置真源——check_naming_convention.py 直接消费本块(非同步复制)
    # 设计: exempt_names_tests 为基线; exempt_names_docs_extra 为 docs 专属增量;
    #       代码侧 _N16_DOCS_EXEMPT_NAMES = exempt_names_tests | exempt_names_docs_extra(继承关系在代码体现)
    n16_config:
      exempt_names_tests:
      - conftest.py
      - __init__.py
      exempt_names_docs_extra:
      - index.md
      - blueprint.md
      - readme.md
      - changelog.md
      - spec.md
      - .gitkeep
      - _index.yaml
      skip_dirs_docs:
      - _DO_NOT_USE_old_tree
      - _archive
      - _backups
      - session_logs
      # 临时沙箱目录前缀(目录名前缀匹配,os.walk剪枝);覆盖 tests/ 与 docs/ 下任意 _tmp_* 子目录
      # 防并发红蓝对抗临时沙箱(如 tests/_tmp_redblue_f2/)与正式文件撞名误触发N-16硬阻断
      skip_dir_prefixes:
      - _tmp_
    conditions:
    - type: constraint
      check: GATE-11检测规则N-16
      pass: 文件名在项目内唯一——tests/目录下test_*.py文件basename不重复;docs/目录下所有文件(跳过_archive/_backups/_DO_NOT_USE_old_tree/session_logs)basename不重复
      fail: 同一basename在项目内多处存在(如两个capability_heatmap.md漂移)
      rationale: 同名文件导致AI无法确定真源,产生漂移和幻觉(如capability_heatmap.md曾存在19315字节vs11966字节两个不同内容同名文件)
    - type: constraint
      check: tests/豁免清单
      pass: conftest.py和__init__.py允许跨目录同名(约定俗成的Python机制)
      fail: 其他文件跨目录同名
    - type: constraint
      check: docs/豁免清单(继承tests/基线)
      pass: 继承tests/豁免(conftest.py/__init__.py)+docs专属豁免(index.md/blueprint.md/readme.md/changelog.md/spec.md/.gitkeep/_index.yaml)
      fail: 其他docs文件跨目录同名
      rationale: 用继承关系消除__init__.py/conftest.py的同步复制(真源唯一原则)
    - type: constraint
      check: docs/跳过目录
      pass: _archive/_backups/_DO_NOT_USE_old_tree/session_logs目录不纳入检查(运行时产物/归档/备份)
      fail: 将这些目录纳入检查产生误报
    - type: constraint
      check: 临时沙箱目录前缀跳过(tests/ + docs/通用)
      pass: _tmp_开头子目录(如 tests/_tmp_redblue_f2/)不纳入N-16检查(目录名前缀匹配,os.walk剪枝);用于并发红蓝对抗临时沙箱,其清理晚于commit
      fail: 临时沙箱内文件与正式文件撞名误触发N-16硬阻断,卡死并发commit窗口
      rationale: 2026-06-26 tests/_tmp_redblue_f2/test_gate11_naming_convention_unit.py(与 tests/unit/ 同名)撞名硬阻断;沙箱由已自删的 scripts/_tmp_redblue_final.py 探针建在仓库内,正式红蓝测试 tests/test_f18_redblue.py 用 pytest tmp_path 无此问题
    - type: constraint
      check: 硬阻断特性
      pass: N-16不受GATE-11的--warn-only过渡期影响,直接硬阻断commit
      fail: N-16违规被warn-only放过
      rationale: N-16是新激活规则,无历史违规包袱,必须硬阻断防止同名漂移再次发生
    actions:
    - type: mandatory
      step: 创建新文件前必须检查项目内是否已存在同名文件(Grep basename)
    - type: mandatory
      step: N-16违规必须重命名其中一个文件(优先保留内容更完整的),禁止用版本号后缀区分
    - type: mandatory
      step: 重命名后必须更新所有引用(git mv + grep引用更新)
    prohibitions:
    - 禁止创建与项目内已有文件同名的文件(无论目录是否相同)
    - 禁止用版本号后缀区分同名文件(如foo-v2.md),必须重命名为语义不同的名字
    - 禁止将N-16豁免清单硬编码在代码中不记录在YAML真源(本section.n16_config是唯一结构化真源;代码必须从此动态加载,仅允许保留fail-open回退值)
  gov_doc_003_directory_semantics:
    title: 目录命名语义规则 (GOV-DOC-003 §目录语义)
    section_type: rule
    original_rules:
    - DOC-003
    conditions:
    - type: constraint
      check: 目录名缩写禁止
      pass: 新建目录名长度≥3字符且为完整单词或snake_case复合词;行业通用缩写白名单(api/mcp/io/a2a/sla/db)仅限历史目录保留,新建目录不得使用白名单外的缩写
      fail: 新建目录名为2字符及以下缩写(如ce/ui/ux)或自创缩写(如ce=context_engine的缩写)
      rationale: AI无法从缩写推断语义;ce/曾导致AI困惑是context_engine还是cli工具;完整单词让AI望文生义
    - type: constraint
      check: 集合型目录用复数
      pass: 放多个同质文件的目录用复数名词(skills/detectors/services/models/contracts/events/errors/patterns/layers/payloads/guards/verifiers/bridges/adapters/implementations/strategies)
      fail: 集合型目录用单数(如放59个skill_*.py的目录叫skill/)
      rationale: 复数反映集合性质,AI可预期内部是同质文件
    - type: constraint
      check: 单体型目录用单数
      pass: 放单一核心实现或异构辅助模块的目录用单数名词(core/engine/runtime/dashboard/sandbox/schema/state/pipeline/governance/infrastructure/shared/context)
      fail: 单体型目录用复数(如只放1个核心引擎的目录叫engines/)
      rationale: 单数反映单体性质,AI可预期内部是一个主模块+辅助
    - type: constraint
      check: 数字后缀目录禁止
      pass: 目录名无数字后缀(如llm_security/observability/api)
      fail: 目录名含_NN数字后缀(如llm_security_01/infra_06/observability_02/api_03/ctr_001_consumer)
      rationale: 数字后缀暗示多真源(存在_01/_02/_03),违反SSoT原则;AI会把_01/_02当作不同实体产生幻觉
    - type: constraint
      check: 复合目录名snake_case
      pass: 多词业务语义目录名用snake_case(drift_detection/audit_trail/semantic_audit/behavioral_admission)
      fail: 复合目录名用kebab-case或驼峰
      rationale: 已由gov_doc_003_naming_ssot目录名格式condition覆盖,此处重申强调
    actions:
    - type: mandatory
      step: 新建子目录前MUST评估集合性质——同质多文件用复数,单体或异构辅助用单数
    - type: mandatory
      step: 新建子目录MUST使用完整单词,禁止2字符及以下缩写和自创缩写
    - type: mandatory
      step: 新建子目录禁止使用_NN数字后缀;若需区分版本,用语义不同的名字(如llm_security_v1→llm_security_legacy+llm_security)
    - type: mandatory
      step: 历史违规目录(缩写/数字后缀)在下次涉及该目录的refactor时顺带修正;不发起专门批量改名任务(避免过度工程)
    prohibitions:
    - 禁止新建2字符及以下缩写目录名(如ce/ui/ux/bot)
    - 禁止新建自创缩写目录名(如ce=context_engine的缩写,应为context_engine或合并到context/)
    - 禁止新建含_NN数字后缀的目录名(如foo_01/foo_02)
    - 禁止用版本号后缀区分同名目录(如foo_v1/foo_v2),必须重命名为语义不同的名字
    - 禁止同包内集合型目录用单数(如skills包内放多个detector的目录叫detector/)
    - 禁止同包内单体型目录用复数(如只放1个engine的目录叫engines/)
    grandfathered:
      description: 历史目录 grandfathered 豁免清单(仅保留,新建不得效仿)
      abbreviation_dirs:
      - api  # 行业通用,Application Programming Interface
      - mcp  # 行业通用,Model Context Protocol
      - io   # 行业通用,Input/Output
      - a2a  # 项目约定,Agent-to-Agent
      - sla  # 行业通用,Service Level Agreement
      - db   # 行业通用,Database
      - kb   # 行业通用,Knowledge Base
      note: 历史自创缩写目录(如ce/)不享受grandfathered豁免,MUST在refactor时修正
    progressive_convergence:
      description: 历史违规目录渐进收敛策略与待处理清单(ARCH-033阶段C-6完成,全部收敛,2026-07-04更新)
      strategy: 历史违规目录不批量改名(避免过度工程),在下次refactor时顺带修正;多真源问题优先处理
      pending_directories: []
      resolved_directories:
      - path: src/zephyr/security/access_control/auto_fix_engine_03/
        violation: R5数字后缀
        action: 已删除
