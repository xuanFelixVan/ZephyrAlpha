      details: src/zephyr/signal/;已创建
    - description: D_RISK - 实时风控、Kill Switch、压力测试与合规检查
      details: src/zephyr/risk/;已创建
    - description: D_PORTFOLIO_CORE - 组合构建、权重优化与再平衡决策
      details: src/zephyr/pf_core/;已创建
    - description: D_EXECUTION_CORE - 订单路由、执行引擎、Broker ACL边界与成交管理
