  gov_doc_002_new_directory_procedure:
    title: 新增目录审批流程 (GOV-DOC-002 §七)
    section_type: procedure
    original_rules:
    - DOC-002
    procedure:
    - order: 1
      action: 新增docs/顶级目录-在GOV-DOC-002提出新目录编号+用途和准入规则
      pre_condition: 需要新增docs/下顶级目录
      expected_result: 新目录编号/用途/准入规则已在GOV-DOC-002中记录
      on_failure: 未在规范中登记→禁止创建
    - order: 2
      action: 新增docs/顶级目录-起草KB决策记录(若涉及架构性归属)或直接修订GOV-DOC-002
      pre_condition: 新目录用途已定义
      expected_result: KB决策记录已创建或GOV-DOC-002已修订
      on_failure: 架构性归属未确认→需Owner仲裁
    - order: 3
      action: 新增docs/顶级目录-获得Owner批准+创建目录+重新生成rule_catalog_registry.yaml
      pre_condition: KB决策记录或修订完成
      expected_result: 目录已创建+注册表已更新
      on_failure: Owner未批准→禁止创建
    - order: 4
      action: 新增src/zephyr/包-运行§四归属决策树明确C轨或B轨
      pre_condition: 需要新增src/zephyr/下包
      expected_result: 归属已确定(C轨/B轨/shared)
      on_failure: 归属不确定→登记
    - order: 5
      action: "新增src/zephyr/包-C轨新层(L14+)需KB决策记录+14层总数变更冲击评估;B轨新独立包需KB决策记录+接口合同+Phase路线"
      pre_condition: 归属已确定
      expected_result: 审批材料齐全
      on_failure: 材料不全→补充后重新提交
    - order: 6
      action: 新增src/zephyr/包-在GOV-DOC-002记录新包+创建骨架(__init__.py+docstring)+Owner批准后合并
      pre_condition: 审批材料齐全
      expected_result: 新包已创建+GOV-DOC-002已更新+Owner已批准
      on_failure: Owner未批准→禁止合并
    - order: 7
      action: 废弃/合并目录-归档到archive/reorg-YYYY-MM-DD/superseded/+保留最少12个月后才可永久删除
      pre_condition: 目录需要废弃或合并
      expected_result: 迁移记录已登记+归档完成
      on_failure: 未登记迁移记录→禁止删除
