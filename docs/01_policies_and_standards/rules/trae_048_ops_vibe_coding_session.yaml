rule_id: TRAE-048
title: 操作-Vibe Coding会话管理
version: 0.3.0
layer: L1_foundation
module_id: TRAE-048
depends_on: []
tags:
- TRAE
- operational_vibe_coding
- L2
ttl: permanent
stability: evolving
safety_level: L
ai_autonomy: ai_modifiable
aliases:
- OPS-VC-002
- OPS-VC-004
- OPS-VC-005
severity: warning
scope: operational_vibe_coding
domain: TRAE
triggers:
- operation: operational_vibe_coding
sections:
  vc_scope:
    title: 适用范围与目的
    section_type: context
    original_rules:
    - OPS-VC-002
    - OPS-VC-004
    - OPS-VC-005
    conditions: []
    actions: []
    prohibitions: []
    description: '本规则覆盖Vibe Coding会话全生命周期管理，包括三部分：

      1. OPS-VC-002：Session状态机（5状态/7转换/4禁止转换/超时/异常）

      2. OPS-VC-004：AI与系统事故响应（P0/P1/P2三级/隔离/回滚/复盘）

      3. OPS-VC-005：会话门禁检查清单（12项A1-D2/自动化映射）

      适用场景：AI行为异常（幻觉/越权/规则违反/性能异常）+ 系统紧急事故（密钥泄露/交易异常/文件损坏/kill switch被绕过）

      '
  vc_normative_refs:
    title: 规范性引用
    section_type: context
    original_rules:
    - OPS-VC-002
    - OPS-VC-004
    - OPS-VC-005
    conditions: []
    actions: []
    prohibitions: []
    references_map:
    - ref_id: PS-STD-003
      at: §2~§3, ABS-47
      why: 行为边界标准——绝对禁止操作清单；kill switch定义
    - ref_id: GOV-SEC-001
      at: §3
      why: 密钥管理——密钥泄露响应
    - ref_id: GOV-SEC-003
      at: COND-001
      why: 事故通知——Owner知悉
    - ref_id: GOV-AI-001
      at: §7.1~§7.2
      why: AI权限——环境确认与自治权限
    - ref_id: GOV-DOC-002
      at:
      why: 文件位置规范
    - ref_id: GOV-DOC-003
      at:
      why: 命名规范
    - ref_id: GOV-DOC-005
      at:
      why: 编码安全
    - ref_id: GOV-DOC-007
      at:
      why: 文件操作安全门禁
    - ref_id: PS-STD-011
      at: MTH-006 step 6
      why: 诊断反转验证
  vc_change_history:
    title: 变更历史
    section_type: examples
    original_rules:
    - OPS-VC-002
    - OPS-VC-004
    - OPS-VC-005
    conditions: []
    actions: []
    prohibitions: []
    items:
    - version: 0.1.0
      date: '2026-05-01'
      change: 初始提取，17个sections从3个MD源文件提取
    - version: 0.2.0
      date: '2026-06-16'
      change: 深度提取补充——添加section_type(17个)、新增5个sections(vc_scope/vc_normative_refs/vc_change_history/ops_vc_002_alignment/ops_vc_005_automation)
    - version: 0.2.1
      date: '2026-06-19'
      change: RQ审查修复：填充空references.rule_ids(OPS-VC-002/004/005)和references.scripts(config/session_state_machine.yaml)；修复kebab-case引用document-metadata-index-registry.yaml为snake_case的rule_catalog_registry.yaml(RQ-05裁定落地)；标准化change_history格式(changes/desc→items/change)
  ops_vc_002_states:
    title: Session状态定义与合法转换
    section_type: context
    original_rules:
    - OPS-VC-002
    conditions:
    - type: constraint
      check: Session在任意时刻恰好处于一个状态
      pass: 状态一致性满足
      fail: 状态冲突，必须修复
    - type: constraint
      check: 每个Session有唯一session_id
      pass: 唯一性满足
      fail: session_id冲突
    - type: constraint
      check: Session Log在状态变更后5分钟内写入
      pass: 日志及时性满足
      fail: 日志延迟
    - type: constraint
      check: ACTIVE状态的Session持有任务锁
      pass: 锁一致性满足
      fail: 锁状态异常
    - type: constraint
      check: PAUSED状态的Session已释放任务锁
      pass: 锁一致性满足
      fail: 锁未释放
    actions:
    - type: mandatory
      step: INIT→ACTIVE：任务已分配且前置条件满足→加载任务上下文，开始处理(P0)
    - type: mandatory
      step: ACTIVE→PAUSED：用户暂停/依赖不可用/token预算耗尽→保存状态，释放资源(P0)
    - type: mandatory
      step: ACTIVE→COMPLETED：所有任务成功完成→写入Session Log，更新追踪器(P0)
    - type: mandatory
      step: ACTIVE→FAILED：不可恢复错误发生→记录错误，标记Session失败(P0)
    - type: mandatory
      step: PAUSED→ACTIVE：用户恢复且依赖可用且token预算剩余→重新加载上下文，恢复处理(P1)
    - type: mandatory
      step: PAUSED→COMPLETED：用户取消剩余任务→写入部分Session Log，标注取消(P1)
    - type: mandatory
      step: PAUSED→FAILED：暂停超时且无法恢复→自动标记失败(P2)
    prohibitions:
    - COMPLETED→ACTIVE：已完成的Session不可重启，必须创建新Session
    - FAILED→ACTIVE：失败的Session不可自动恢复，必须创建新Session并从错误中学习
    - COMPLETED→PAUSED：已完成状态不可回退
    - FAILED→PAUSED：失败状态不可降级
  ops_vc_002_alignment:
    title: Session状态机YAML对齐差异
    section_type: context
    original_rules:
    - OPS-VC-002
    conditions: []
    actions: []
    prohibitions: []
    alignment_diffs:
    - dimension: 初始状态名
      yaml_value: idle
      md_value: INIT
      reason: 语义相同，命名对齐KBG-0035
    - dimension: 归档状态
      yaml_value: archived独立状态
      md_value: 归入COMPLETED出口动作
      reason: 归档是完成后的自动行为，非独立状态
    machine_readable_source: config/session_state_machine.yaml
  ops_vc_002_timeout:
    title: Session超时规则
    section_type: rule
    original_rules:
    - OPS-VC-002
    conditions:
    - type: constraint
      check: ACTIVE状态最大持续时间4小时
      pass: 在时限内
      fail: 自动转为PAUSED，通知用户(P0)
    - type: constraint
      check: PAUSED状态最大持续时间72小时
      pass: 在时限内
      fail: 自动转为COMPLETED(部分结果)，标注timed_out(P1)
    - type: constraint
      check: INIT状态最大持续时间30分钟
      pass: 在时限内
      fail: 自动转为FAILED，报告初始化超时(P1)
    actions: []
    prohibitions: []
  ops_vc_002_exceptions:
    title: Session异常处理
    section_type: procedure
    original_rules:
    - OPS-VC-002
    conditions:
    - type: trigger
      check: encoding_error发生
      pass: 暂停Session，记录错误，通知用户
      fail: 不处理
    - type: trigger
      check: dependency_not_found发生
      pass: 暂停Session，加入延迟队列，依赖可用时自动恢复(P1)
      fail: 不处理
    - type: trigger
      check: token_budget_exceeded发生
      pass: 暂停Session，保存进度检查点，用户必须批准额外token预算(P0)
      fail: 不处理
    - type: trigger
      check: unrecoverable_error发生
      pass: 强制转为FAILED，无自动恢复，需人工干预(P0)
      fail: 不处理
    actions: []
    prohibitions: []
  ops_vc_002_modification:
    title: Session状态机修改条件
    section_type: rule
    original_rules:
    - OPS-VC-002
    conditions: []
    actions:
    - type: mandatory
      step: 修改本文档必须同时更新config/session_state_machine.yaml(机器可读版本)
    - type: mandatory
      step: 修改本文档必须同时更新_registry/catalogs/rule_catalog_registry.yaml(注册表)
    - type: mandatory
      step: 修改本文档必须同时更新任何引用状态机的KB决策记录文档
    - type: mandatory
      step: 修改通过rule_lifecycle_and_change_standard.yaml定义的变更门禁
    prohibitions: []
  ops_vc_004_classification:
    title: 事故分级与隔离
    section_type: context
    original_rules:
    - OPS-VC-004
    conditions:
    - type: constraint
      check: P0事故(数据/资金/安全不可逆损失)响应时限=立即
      pass: 立即响应
      fail: 延迟响应=违规
    - type: constraint
      check: P1事故(架构/规则被破坏但可恢复)响应时限=5分钟内
      pass: 5分钟内响应
      fail: 超时=违规
    - type: constraint
      check: P2事故(操作质量下降但无破坏)响应时限=30分钟内
      pass: 30分钟内响应
      fail: 超时=违规
    actions:
    - type: mandatory
      step: 隔离步骤(所有事故通用)：停止当前session所有文件操作→标记session为suspended→如涉及交易系统触发kill switch(PS-STD-003 ABS-47)→如涉及密钥确认未泄露(GOV-SEC-001 §3)→评估影响范围
    prohibitions: []
  ops_vc_004_p0:
    title: P0事故响应
    section_type: incident_response
    original_rules:
    - OPS-VC-004
    conditions:
    - type: trigger
      check: 密钥泄露(GOV-SEC-001 §3)
      pass: 立即停止session→触发kill switch→执行密钥泄露响应(撤销→生成新密钥→搜索残留→通知→记录→复盘)→通知Owner(GOV-SEC-003 COND-001)
      fail: 不处理
    - type: trigger
      check: 交易系统异常下单
      pass: 立即触发kill switch→检查异常订单→未成交则撤销→已成交则评估损失通知Owner→Session Log记录
      fail: 不处理
    - type: trigger
      check: kill switch被绕过
      pass: 立即物理断开交易系统网络连接→通知Owner→排查绕过原因→修复kill switch漏洞→恢复网络前需Owner明确批准
      fail: 不处理
    actions: []
    prohibitions:
    - kill switch被绕过时恢复网络连接前必须获Owner明确批准
  ops_vc_004_ai_anomaly:
    title: AI异常诊断与幻觉响应
    section_type: symptom_mapping
    original_rules:
    - OPS-VC-004
    conditions:
    - type: trigger
      check: AI幻觉(输出不存在的信息)
      pass: 对照SSoT验证
      fail: 不处理
    - type: trigger
      check: AI越权(执行超出权限的操作)
      pass: 对照GOV-AI-001验证
      fail: 不处理
    - type: trigger
      check: AI规则违反(违反ABS/COND规则)
      pass: 对照具体规则文件验证
      fail: 不处理
    - type: trigger
      check: AI性能异常(超时/无限循环/资源耗尽)
      pass: 监控系统告警
      fail: 不处理
    actions:
    - type: mandatory
      step: AI幻觉响应：识别幻觉内容→查阅SSoT确认正确信息→评估是否已写入文件→如已写入则回滚→如未写入则标记→记录到Session Log→分析根因(上下文不足？规则缺失？)→制定预防措施
    - type: mandatory
      step: AI越权响应：确认越权操作内容→对照GOV-AI-001确认正确权限→回滚越权变更→检查连带影响→记录到Session Log→通知Owner
    prohibitions: []
  ops_vc_004_p1:
    title: P1事故响应
    section_type: incident_response
    original_rules:
    - OPS-VC-004
    conditions:
    - type: trigger
      check: AI修改ABS规则
      pass: 停止session→git diff确认修改→回滚→检查连带修改→Session Log记录→通知Owner
      fail: 不处理
    - type: trigger
      check: 批量文件损坏
      pass: 停止session→列出被修改文件→逐个检查→回滚损坏文件→运行编码检查(GOV-DOC-005)→Session Log记录
      fail: 不处理
    actions: []
    prohibitions: []
  ops_vc_004_p2:
    title: P2事故响应
    section_type: incident_response
    original_rules:
    - OPS-VC-004
    conditions: []
    actions:
    - type: mandatory
      step: AI幻觉补全接口/路径：标记幻觉内容→查阅SSoT确认正确内容→修正→Session Log记录
    - type: mandatory
      step: 文件放错位置/命名不规范：确认正确位置(GOV-DOC-002)→移动文件→更新所有引用→运行命名检查(GOV-DOC-003)
    prohibitions: []
  ops_vc_004_rule_violation:
    title: 规则违反事故响应
    section_type: incident_response
    original_rules:
    - OPS-VC-004
    conditions: []
    actions:
    - type: mandatory
      step: 确认违反的具体规则编号→评估违反后果
    - type: mandatory
      step: P0级违反：回滚整个session的变更
    - type: mandatory
      step: P1级违反：停止当前操作，修复后继续
    - type: mandatory
      step: P2级违反：记录违规，继续操作
    - type: mandatory
      step: 记录违规事件到Session Log
    prohibitions: []
  ops_vc_004_rollback_recovery:
    title: 通用回滚与恢复操作
    section_type: rollback
    original_rules:
    - OPS-VC-004
    conditions: []
    actions:
    - type: mandatory
      step: 通用回滚：确认最近正确版本(git log或备份)→回滚→重新执行被覆盖的正确修改→验证文件内容完整
    - type: mandatory
      step: 恢复操作：确认所有异常已修复→确认所有文件内容正确→运行门禁检查清单(OPS-VC-005)→标记session为resumed→继续未完成操作
    prohibitions: []
  ops_vc_004_review:
    title: 事故后复盘
    section_type: procedure
    original_rules:
    - OPS-VC-004
    conditions: []
    actions:
    - type: mandatory
      step: 每次事故响应完成后必须在Session Log中记录：事故时间/等级/类型、发现方式、影响范围(文件数/系统数)、响应步骤执行情况、根因分析
    - type: mandatory
      step: 诊断反转验证：初始诊断与深挖结论不一致→追问为什么初始诊断是错的→更新症状-根因映射表
    - type: mandatory
      step: 表达检查：深挖后未发现系统性问题→检查写法/表述是否制造了误解(MTH-006规则7)
    - type: mandatory
      step: 记录预防措施和是否需要更新规则
    prohibitions: []
  ops_vc_005_context:
    title: 会话门禁-上下文加载
    section_type: procedure
    original_rules:
    - OPS-VC-005
    conditions:
    - type: pre_condition
      check: A1-已读取当前Phase(按AGENTS.md §8执行)
      pass: 上下文加载A1通过
      fail: 读取onboarding文件
    - type: pre_condition
      check: A2-已读取施工图(知道本次session要执行哪些步骤)
      pass: 上下文加载A2通过
      fail: 读取对应Phase的施工图
    - type: pre_condition
      check: A3-已读取相关SSoT文件(施工图必备链接中所有文件已读取)
      pass: 上下文加载A3通过(GATE-16)
      fail: 逐个读取必备链接中的文件
    actions: []
    prohibitions:
    - 任何一项未通过，禁止开始操作
  ops_vc_005_rules:
    title: 会话门禁-规则确认
    section_type: verification
    original_rules:
    - OPS-VC-005
    conditions:
    - type: pre_condition
      check: B1-行为边界已确认(已读取PS-STD-003，知道哪些操作绝对禁止)
      pass: 规则确认B1通过(GATE-14+GATE-16)
      fail: 读取trae_018-021行为规则文件（PS-STD-003）
    - type: pre_condition
      check: B2-幻觉自检已通过(按幻觉自检流程执行)
      pass: 规则确认B2通过(GATE-15)
      fail: 读取trae_006-009防幻觉规则文件（GOV-AI-003）
    - type: pre_condition
      check: B3-双编辑器规则已确认(知道当前使用哪个编辑器、哪些文件可编辑)
      pass: 规则确认B3通过
      fail: 读取trae_040_ai_model_routing.yaml双编辑器规则（GOV-AI-004）
    - type: pre_condition
      check: B4-操作类型已自检(本次操作是否修改既有产物？是→MTH-006完整七步强制；否→仅须诊断反转验证)
      pass: 规则确认B4通过
      fail: 读取trae_024 MTH-006完整七步(非仅step 6)
    actions: []
    prohibitions:
    - 任何一项未通过，禁止开始操作
  ops_vc_005_security:
    title: 会话门禁-安全检查
    section_type: verification
    original_rules:
    - OPS-VC-005
    conditions:
    - type: pre_condition
      check: C1-编码安全已确认(所有文件UTF-8编码)
      pass: 安全检查C1通过(GATE-16)
      fail: 读取GOV-DOC-005
    - type: pre_condition
      check: C2-文件操作安全已确认(知道删除/移动文件的安全门禁)
      pass: 安全检查C2通过(GATE-16)
      fail: 读取GOV-DOC-007
    - type: pre_condition
      check: C3-密钥管理已确认(不在代码中硬编码密钥)
      pass: 安全检查C3通过(GATE-16)
      fail: 读取GOV-SEC-001
    actions: []
    prohibitions:
    - 任何一项未通过，禁止开始操作
  ops_vc_005_environment:
    title: 会话门禁-环境确认
    section_type: verification
    original_rules:
    - OPS-VC-005
    conditions:
    - type: pre_condition
      check: D1-当前环境已确认(知道当前是dev还是prod环境)
      pass: 环境确认D1通过
      fail: 参见GOV-AI-001 §7.1
    - type: pre_condition
      check: D2-权限模式已确认(知道当前环境的AI自治权限)
      pass: 环境确认D2通过(GATE-14)
      fail: 参见GOV-AI-001 §7.2
    actions: []
    prohibitions:
    - 任何一项未通过，禁止开始操作
  ops_vc_005_automation:
    title: 会话门禁-自动化映射
    section_type: context
    original_rules:
    - OPS-VC-005
    conditions: []
    actions: []
    prohibitions: []
    automation_map:
      context_loading:
        A1:
          automated: false
          gate:
          note: 人工-按AGENTS.md §8执行
        A2:
          automated: false
          gate:
          note: 人工-读取施工图
        A3:
          automated: true
          gate: GATE-16
          note: SSoT文件读取校验
      rule_confirmation:
        B1:
          automated: true
          gate: GATE-14+GATE-16
          note: 行为边界校验
        B2:
          automated: true
          gate: GATE-15
          note: 幻觉自检流程
        B3:
          automated: false
          gate:
          note: 人工-双编辑器规则
        B4:
          automated: false
          gate:
          note: 人工-诊断反转验证
      security_check:
        C1:
          automated: true
          gate: GATE-16
          note: 编码安全校验
        C2:
          automated: true
          gate: GATE-16
          note: 文件操作安全校验
        C3:
          automated: true
          gate: GATE-16
          note: 密钥管理校验
      environment_confirmation:
        D1:
          automated: false
          gate:
          note: 人工-环境确认
        D2:
          automated: true
          gate: GATE-14
          note: 权限模式校验
    coverage_summary: 自动化覆盖：7/12项(A3/B1/B2/C1/C2/C3/D2)；人工：5/12项(A1/A2/B3/B4/D1)
