rule_id: TRAE-045
title: 数据治理-质量与血缘
version: 1.1.1
layer: L1_foundation
module_id: TRAE-045
depends_on: []
tags:
- TRAE
- data_governance
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- GOV-DATA-001
- GOV-DATA-002
- GOV-DATA-003
severity: error
scope: data_governance
domain: TRAE
triggers:
- operation: data_governance
sections:
  gov_data_001:
    section_type: rule
    title: 数据质量策略
    original_rules:
    - GOV-DATA-001
    - DQA-001
    - DQA-002
    - DQA-003
    conditions:
    - type: constraint
      check: 数据入库前5个质量维度检查（完整性/准确性/时效性/一致性/唯一性）
      pass: 所有维度通过
      fail: 拒绝入库；触发告警
    - type: constraint
      check: 质量告警响应时间
      pass: 4小时内响应（确认/修复/豁免）
      fail: 告警升级
    - type: constraint
      check: 质量豁免有效期
      pass: 最长30天，到期后重新评估
      fail: 自动恢复质量检查
    - type: constraint
      check: 完整性告警阈值
      pass: 空值率≤5%
      fail: 触发告警
    - type: constraint
      check: 准确性告警阈值
      pass: 偏差≤3σ
      fail: 触发告警
    - type: constraint
      check: 时效性告警阈值
      pass: 延迟≤30秒（实时）/≤1天（批量）
      fail: 触发告警
    - type: constraint
      check: 一致性告警阈值
      pass: 不一致率≤1%
      fail: 触发告警
    - type: constraint
      check: 唯一性告警阈值
      pass: 重复率≤1%
      fail: 触发告警
    actions:
    - type: mandatory
      step: 'DQA-001: 所有数据入库前必须通过5个质量维度检查，任一维度不通过则拒绝入库'
    - type: mandatory
      step: 'DQA-002: 质量告警触发后必须在4小时内响应（确认/修复/豁免）'
    - type: mandatory
      step: 'DQA-003: 数据源已知缺陷可申请质量豁免，但必须记录豁免原因和影响范围；豁免有效期最长30天'
    prohibitions:
    - 数据未通过质量检查即入库
    - 质量告警4小时内未响应
    - 未记录的豁免
    - 豁免超期未重新评估
  gov_data_002:
    section_type: rule
    title: 数据血缘策略
    original_rules:
    - GOV-DATA-002
    - DLG-001
    - DLG-002
    - DLG-003
    conditions:
    - type: constraint
      check: 关键数据（交易信号/持仓数据/风控指标/合规报告）是否有完整血缘记录
      pass: 有完整血缘记录
      fail: 数据不可信；禁止用于决策
    - type: constraint
      check: 血缘粒度——关键数据
      pass: 字段级别
      fail: 粒度不足需补充
    - type: constraint
      check: 血缘粒度——非关键数据
      pass: 表/文件级别
      fail: 可接受
    actions:
    - type: mandatory
      step: 'DLG-001: 交易信号、持仓数据、风控指标、合规报告必须有完整血缘记录'
    - type: mandatory
      step: 'DLG-002: 血缘记录必须包含数据源（上游）、转换逻辑、数据目标（下游）'
    - type: mandatory
      step: 'DLG-003: 关键数据血缘粒度到字段级别；非关键数据到表/文件级别'
    prohibitions:
    - 关键数据无血缘记录即用于决策
    - 血缘记录缺失上下游信息
    - 关键数据血缘粒度不足（未到字段级别）
  gov_data_003:
    title: 数据保留策略
    section_type: rule
    original_rules:
    - GOV-DATA-003
    - DRP-001
    - DRP-002
    - DRP-003
    conditions:
    - type: constraint
      check: 合规相关数据（交易记录/审计日志）在保留期内是否被删除
      pass: 保留期内未删除
      fail: 视为合规违规
    - type: constraint
      check: 数据删除前三项确认
      pass: (1)活跃DAG无引用 (2)近30天无访问 (3)下游无活跃连接——三项全通过
      fail: 删除回退；数据恢复操作
    - type: trigger
      check: 监管机构要求延长保留
      pass: 按要求延长
      fail: 不延长视为违规
    - type: trigger
      check: 诉讼保全
      pass: 相关数据不得删除直到诉讼结束
      fail: 删除视为违规
    actions:
    - type: mandatory
      step: 'DRP-001: 保留期限表中的合规相关数据（交易记录7年、审计日志7年）在保留期内不得删除'
    - type: mandatory
      step: 'DRP-002: 数据删除前必须执行三项确认：(1)检查活跃数据管线DAG引用 (2)查询近30天访问日志 (3)确认下游无活跃连接'
    - type: mandatory
      step: 'DRP-003: 监管机构要求延长保留时按要求延长；诉讼保全期间相关数据不得删除'
    prohibitions:
    - 合规相关数据在保留期内被删除
    - 数据删除前未执行三项确认
    - 诉讼保全期间删除相关数据
  gov_data_004:
    title: 质量维度分类体系
    section_type: principles
    original_rules:
    - GOV-DATA-001
    - DQA-001
    principles:
    - id: QDIM-001
      statement: 完整性——数据是否有缺失
      rationale: 缺失数据导致分析结论偏差，影响交易决策
      applies_to: 所有数据源和系统内部产生的数据
    - id: QDIM-002
      statement: 准确性——数据是否正确
      rationale: 错误数据直接导致错误交易信号和风控判断
      applies_to: 所有数据源和系统内部产生的数据
    - id: QDIM-003
      statement: 时效性——数据是否及时
      rationale: 过时数据在实时交易中无价值，延迟数据导致决策滞后
      applies_to: 所有数据源和系统内部产生的数据
    - id: QDIM-004
      statement: 一致性——不同来源的数据是否一致
      rationale: 数据源矛盾导致系统行为不可预测
      applies_to: 所有数据源和系统内部产生的数据
    - id: QDIM-005
      statement: 唯一性——数据是否重复
      rationale: 重复数据导致统计偏差和资源浪费
      applies_to: 所有数据源和系统内部产生的数据
  gov_data_005:
    title: 关键数据判定决策树
    section_type: decision_tree
    original_rules:
    - GOV-DATA-002
    - DLG-001
    decision_tree:
    - condition: 数据是否直接影响交易下单决策？
      if_true: 关键数据，必须有完整血缘记录
      if_false: 继续判断下一条件
    - condition: 数据是否直接影响账户资金安全？
      if_true: 关键数据，必须有完整血缘记录
      if_false: 继续判断下一条件
    - condition: 数据是否直接影响风控阀值计算？
      if_true: 关键数据，必须有完整血缘记录
      if_false: 继续判断下一条件
    - condition: 数据是否直接影响合规报告生成？
      if_true: 关键数据，必须有完整血缘记录
      if_false: 非关键数据，血缘粒度到表/文件级别即可
  gov_data_006:
    title: 数据保留期限表
    section_type: context
    original_rules:
    - GOV-DATA-003
    - DRP-001
    - DRP-002
    context:
      summary: 定义12类数据的保留期限、删除方式和合规依据
      impact_on_rules:
      - DRP-001依赖此表判定合规相关数据的保留期限（交易记录7年、审计日志7年）
      - DRP-002依赖此表判定数据到期后执行删除前确认流程
      - DRP-003合规例外可能延长此表中的保留期限
      key_decisions:
      - 交易记录/审计日志/安全事件记录保留7年（证监会/合规要求）
      - 系统配置变更/密钥权限变更保留5年（运维/安全需要）
      - 行情数据保留5年（策略回测需要，归档后删除）
      - 数据库读写记录/因子数据/AI操作记录保留3年（审计/研究/治理需要）
      - 系统日志/AI会话日志保留1年（运维/GOV-AI-007）
      - 测试数据保留90天（无合规要求）
      retention_table:
      - data_type: 交易记录
        retention: 7年
        deletion_method: 自动删除
        compliance_basis: 证监会要求
      - data_type: 审计日志
        retention: 7年
        deletion_method: 自动删除
        compliance_basis: 合规要求
      - data_type: 安全事件记录
        retention: 7年
        deletion_method: 自动删除
        compliance_basis: 合规要求
      - data_type: 系统配置变更记录
        retention: 5年
        deletion_method: 自动删除
        compliance_basis: 运维需要
      - data_type: 密钥/权限变更记录
        retention: 5年
        deletion_method: 自动删除
        compliance_basis: 安全需要
      - data_type: 行情数据
        retention: 5年
        deletion_method: 归档后删除
        compliance_basis: 策略回测需要
      - data_type: 数据库读写记录（生产）
        retention: 3年
        deletion_method: 自动删除
        compliance_basis: 审计需要
      - data_type: 因子数据
        retention: 3年
        deletion_method: 自动删除
        compliance_basis: 研究需要
      - data_type: AI操作记录
        retention: 3年
        deletion_method: 自动删除
        compliance_basis: 治理需要
      - data_type: 系统日志
        retention: 1年
        deletion_method: 自动删除
        compliance_basis: 运维需要
      - data_type: AI会话日志
        retention: 1年
        deletion_method: 自动删除
        compliance_basis: GOV-AI-007
      - data_type: 测试数据
        retention: 90天
        deletion_method: 自动删除
        compliance_basis: 无合规要求
  gov_data_007:
    title: 数据质量验证流程
    section_type: verification
    original_rules:
    - GOV-DATA-001
    - DQA-001
    - DQA-002
    - DQA-003
    verification:
    - step: 检查入库数据是否都有质量检查记录
      command: 查询数据入库日志，确认每条入库记录关联质量检查结果
      expected_exit: 0
      on_fail: 标记无质量检查的数据，触发DQA-001违规告警
    - step: 检查质量告警是否在4小时内响应
      command: 查询告警系统，确认每条告警的响应时间≤4小时
      expected_exit: 0
      on_fail: 标记超时告警，触发升级
    - step: 检查豁免是否在有效期内
      command: 查询豁免登记表，确认所有活跃豁免未超过30天有效期
      expected_exit: 0
      on_fail: 自动恢复质量检查，标记超期豁免
    verification_schedule:
      DQA-001: 每日
      DQA-002: 每次告警
      DQA-003: 每周
  gov_data_008:
    title: 数据血缘验证流程
    section_type: verification
    original_rules:
    - GOV-DATA-002
    - DLG-001
    - DLG-002
    - DLG-003
    verification:
    - step: 检查关键数据是否有血缘记录
      command: validate_architecture.py 扫描关键数据源是否有血缘记录
      expected_exit: 0
      on_fail: 标记缺失血缘的关键数据，禁止用于决策
    - step: 检查血缘记录是否包含上下游
      command: 查询血缘注册表，确认每条记录包含数据源、转换逻辑、数据目标
      expected_exit: 0
      on_fail: 标记不完整血缘，要求补充
    - step: 检查血缘粒度是否达标
      command: 查询血缘注册表，确认关键数据粒度为字段级、非关键数据粒度为表/文件级
      expected_exit: 0
      on_fail: 标记粒度不足，要求补充
    verification_schedule:
      DLG-001: 每季度
      DLG-002: 每季度
      DLG-003: 每季度
  gov_data_009:
    title: 数据保留验证流程
    section_type: verification
    original_rules:
    - GOV-DATA-003
    - DRP-001
    - DRP-002
    - DRP-003
    verification:
    - step: 检查合规数据是否在保留期内被删除
      command: 查询删除日志，确认交易记录和审计日志在7年保留期内未被删除
      expected_exit: 0
      on_fail: 标记为合规违规，触发数据恢复
    - step: 检查删除操作前是否有引用检查记录
      command: 查询删除审批记录，确认每次删除前三项确认均有通过记录
      expected_exit: 0
      on_fail: 标记为违规删除，触发回退和数据恢复
    - step: 检查是否有合规例外未处理
      command: 查询合规例外登记表，确认所有监管延长和诉讼保全请求已处理
      expected_exit: 0
      on_fail: 标记未处理例外，上报合规团队
    verification_schedule:
      DRP-001: 每月
      DRP-002: 每次删除
      DRP-003: 每季度
  gov_data_010:
    title: 删除前确认流程
    section_type: procedure
    original_rules:
    - GOV-DATA-003
    - DRP-002
    procedure:
    - order: 1
      action: 检查活跃的数据管线DAG是否引用此数据源
      pre_condition: 数据已到达保留期限，拟执行删除
      expected_result: 活跃DAG中无对此数据源的引用
      on_failure: 保留数据，更新DAG依赖后重新评估
    - order: 2
      action: 查询近30天访问日志确认无读取记录
      pre_condition: 步骤1通过，DAG无引用
      expected_result: 近30天无对此数据源的访问记录
      on_failure: 保留数据，等待访问停止后重新评估
    - order: 3
      action: 确认下游应用/服务未持有活跃数据库连接
      pre_condition: 步骤2通过，近30天无访问
      expected_result: 下游无活跃数据库连接
      on_failure: 保留数据，等待连接释放后重新评估
  gov_data_011:
    title: 质量豁免流程
    section_type: procedure
    original_rules:
    - GOV-DATA-001
    - DQA-003
    procedure:
    - order: 1
      action: 识别数据源已知缺陷，确认缺陷影响范围
      pre_condition: 数据源存在已知缺陷，无法通过质量检查
      expected_result: 缺陷原因和影响范围已记录
      on_failure: 无法申请豁免，数据按DQA-001拒绝入库
    - order: 2
      action: 申请质量豁免，记录豁免原因和影响范围
      pre_condition: 步骤1完成，缺陷已确认
      expected_result: 豁免申请已提交，包含原因和影响范围
      on_failure: 未记录的豁免视为违规
    - order: 3
      action: 豁免生效，设置30天有效期
      pre_condition: 豁免申请已批准
      expected_result: 数据在豁免期内可入库，豁免到期后自动恢复质量检查
      on_failure: 豁免超期未重新评估，自动恢复质量检查
  gov_data_012:
    title: 策略范围与定义
    section_type: context
    original_rules:
    - GOV-DATA-001
    - GOV-DATA-002
    - GOV-DATA-003
    context:
      summary: 三个数据治理策略的适用范围定义
      impact_on_rules:
      - GOV-DATA-001 适用于所有进入系统的数据源和系统内部产生的数据
      - GOV-DATA-002 适用于所有数据流转路径
      - GOV-DATA-003 适用于系统中各类数据的保留期限和删除规则
      key_decisions:
      - 数据质量策略覆盖数据源和内部数据两个维度
      - 数据血缘策略覆盖全流转路径，不限于特定数据类型
      - 数据保留策略按数据类型分别定义保留期限
  gov_data_013:
    title: 质量维度检查方法
    section_type: examples
    original_rules:
    - GOV-DATA-001
    - DQA-001
    examples:
    - description: 完整性检查方法
      details: 空值率检查——统计字段空值占比，超过5%触发告警
    - description: 准确性检查方法
      details: 交叉验证与异常值检测——多源数据交叉比对，偏差超过3σ触发告警
    - description: 时效性检查方法
      details: 延迟检查——实时数据延迟超过30秒、批量数据延迟超过1天触发告警
    - description: 一致性检查方法
      details: 跨源比对——不同数据源相同指标比对，不一致率超过1%触发告警
    - description: 唯一性检查方法
      details: 主键/唯一约束检查——检测重复记录，重复率超过1%触发告警
  gov_data_014:
    title: 策略间交叉引用与依赖
    section_type: context
    original_rules:
    - GOV-DATA-001
    - GOV-DATA-002
    - GOV-DATA-003
    context:
      summary: 三个数据治理策略之间的依赖关系和外部引用
      impact_on_rules:
      - GOV-DATA-001 依赖 PS-STD-001 §2.5（frontmatter字段唯一真源——策略文件的doc_type/rule_form一致性约束）
      - GOV-DATA-002 依赖 PS-STD-001 §2.5（frontmatter字段唯一真源——策略文件的doc_type/rule_form一致性约束）
      - GOV-DATA-003 依赖 PS-STD-001 §2.5（frontmatter字段唯一真源）和 GOV-AI-007（AI会话日志保留期限依据）
      key_decisions:
      - 所有策略的 doc_type/rule_form 一致性受 PS-STD-001 §2.5 约束
      - GOV-DATA-003 中AI会话日志保留1年引用 GOV-AI-007
  gov_data_015:
    title: 关键数据判定升级路径
    section_type: procedure
    original_rules:
    - GOV-DATA-002
    - DLG-001
    procedure:
    - order: 1
      action: 新增数据类型时，按四项标准判定是否需要血缘（交易下单决策/账户资金安全/风控阀值计算/合规报告生成）
      pre_condition: 系统中新增数据类型
      expected_result: 能明确判定为关键数据或非关键数据
      on_failure: 无法明确判定时上报Owner裁定
    - order: 2
      action: 上报Owner裁定数据是否为关键数据
      pre_condition: AI无法按四项标准明确判定
      expected_result: Owner给出裁定结果（关键/非关键）
      on_failure: 默认视为关键数据，按字段级血缘要求执行
  gov_data_016:
    title: 变更历史
    section_type: context
    original_rules:
    - GOV-DATA-001
    - GOV-DATA-002
    - GOV-DATA-003
    context:
      summary: 三个数据治理策略的版本变更记录
      impact_on_rules:
      - 文件级元数据修复——enforcement.type从code改为doc（executors为空时type应为doc，与trae_042 RQ-06 enforcement验证对齐）
