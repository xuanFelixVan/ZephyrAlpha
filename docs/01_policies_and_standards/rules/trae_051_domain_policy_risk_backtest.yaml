    title: 分析管线异常处理
    original_rules:
    - DOM-L07-002-§3
    items:
    - title: 数据源未就绪
      code: 'detection: 数据源状态检查

        action: 等待30分钟重试，超1小时升级P2'
      language: yaml
      note: 可自动重试
    - title: 数据质量不达标
      code: 'detection: GOV-DATA-001脚本

        action: 标记不可信+通知数据团队+部分报告标注数据质量警告'
      language: yaml
      note: 部分产出
    - title: 分析管线报错
      code: 'detection: 步骤执行日志

        action: 检查日志定位错误+修复后重跑失败步骤'
      language: yaml
      note: 仅重跑失败步骤
    - title: 报告生成失败
      code: 'detection: 模板渲染错误

        action: 检查模板和数据+修复后重新生成'
      language: yaml
      note: 模板问题
    - title: 管线OOM
      code: 'detection: 系统OOM日志

        action: 检查数据量+必要时分批处理+修复后重跑'
      language: yaml
      note: 内存溢出
    - title: 管线超时(>30min)
      code: 'detection: 超时监控

        action: 中断当前运行+通知Owner'
      language: yaml
      note: 必须中断
    - title: 进程被kill
      code: 'detection: 系统日志(OOM Killer/手动)

        action: 确认kill原因+修复后重跑'
      language: yaml
      note: 需确认原因
  l07_pipeline_verification:
