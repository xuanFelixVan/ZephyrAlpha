      command: 运行数据质量检查脚本
      expected_exit: 数据质量检查通过
      on_fail: 等待或升级P2
    - step: 4类报告全部产出
      command: 检查报告目录
      expected_exit: 交易执行/策略绩效/风控合规/数据质量报告均存在
      on_fail: 重跑失败步骤
    - step: 报告在时限内产出
      command: 检查报告时间戳
      expected_exit: 符合DOM-L07-001 §2 SLA
      on_fail: 排查延迟原因
    - step: 报告数据可追溯
      command: 检查报告中数据来源标注
      expected_exit: 每个数字有数据来源
      on_fail: 补充数据来源标注
    - step: 分发完成
      command: 检查分发确认记录
      expected_exit: 所有对象已收到
      on_fail: 重试分发
