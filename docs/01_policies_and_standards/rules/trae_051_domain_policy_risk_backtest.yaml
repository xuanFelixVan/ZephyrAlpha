        action: AI根据策略定义生成标准配置'
      language: yaml
      note: 可自动
    - title: Step3质量校验
      code: 'ai_permission: needs_confirmation

        action: AI执行并输出报告，Owner确认质量达标'
      language: yaml
      note: 需确认
    - title: Step3.5幂等性检查
      code: 'ai_permission: auto

        action: 连续3次执行，比较md5校验值'
      language: yaml
      note: 可自动
    - title: Step4报告生成
      code: 'ai_permission: auto

        action: AI调用report-templates/模板生成'
      language: yaml
      note: 可自动
    - title: Step5分发验证
      code: 'ai_permission: needs_confirmation

        action: AI配置测试分发，Owner确认收到'
      language: yaml
      note: 需确认
    - title: 异常处理
      code: 'ai_permission: needs_confirmation

        action: AI可按文档步骤操作，Owner确认最终决策'
      language: yaml
      note: 需确认
  l07_pipeline_ttl_lifecycle:
    section_type: context
    title: 分析管线TTL与生命周期
    original_rules:
    - DOM-L07-002-§6
    summary: 分析管线手册的有效期和生命周期管理
    impact_on_rules:
    - 有效期至2026-07-30
    - 失效条件：报告策略重大变更/报告模板格式升级/新增必需的质量检查步骤
    - 过期后动作：标记status:deprecated+superseded_by指向新版，旧版保留90天后归档
    - 审查触发：每次创建新报告管线时审查步骤是否仍适用；每60天例行审查；报告质量连续不合格时回溯审查
    key_decisions: []
