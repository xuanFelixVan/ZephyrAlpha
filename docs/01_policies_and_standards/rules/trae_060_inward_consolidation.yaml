metadata:
  change_policy: frozen
  impact_level: H
  modification_permission: immutable_core
  superseded_by: null
  review_cycle: permanent
  design_rationale: |
    项目100%AI开发,上下文有限,靠trae对话触发工作。在此场景下:
    多真源=漂移源,时间触发=人触发(未达自动),不质疑元问题=症状反复。
    本原则将用户"向内收"三决策固化为frozen顶层规则,统辖trae_057/053/054既有铁律,
    使新进AI有可机器执行的判定标准,而非依赖散文理解。
    配套GATE-VOCAB门禁(warn-only起步)提供机械检测,打破自指盲区。

