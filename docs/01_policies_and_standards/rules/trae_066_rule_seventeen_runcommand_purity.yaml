        未外部化到 trae_*.yaml——新 AI 若不读 project_rules.md 则无法发现此规则。
        本次外部化（#ARCH-GOV-CONVERGENCE-META G3）将规则迁移到 trae_066.yaml，
        使 MCP rule_discovery 可查询，为 AGENTS.md 瘦身扫清覆盖度障碍。
      related_arch: '#ARCH-GOV-CONVERGENCE-META'
