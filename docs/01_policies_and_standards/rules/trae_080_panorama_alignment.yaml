  reason: 把已落地的 ARCH-053/056 四图对齐机制提升为入职必读 + 必须遵守的 L1 规则。机制已存在（align_panoramas.py 检测器 + sync_panorama_module.py 同步引擎 + GATE-PANORAMA-ALIGNMENT 门禁），本规则补齐认知可见性——让所有新 AI 在 RULE-DEPGRAPH 第三件事就建立四图对齐心智模型并知道 3 步 workflow。强制力走君子协定 + 复用现有门禁，不加新硬门禁。
