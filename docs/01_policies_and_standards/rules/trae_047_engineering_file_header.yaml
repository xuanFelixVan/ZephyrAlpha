  gov_eng_002_module_id_naming:
    title: module_id命名规则(全局唯一性)
    section_type: rule
    original_rules:
    - GOV-ENG-002
    conditions:
    - type: constraint
      check: module_id全局唯一性
      pass: 每个文件的[A_module] module_id声明全局唯一
      fail: 多个文件声明相同module_id（冲突）
    - type: constraint
      check: 子包__init__.py命名格式
      pass: 子包__init__.py使用{parent_id}_{child_name}格式（如MOD-BT-001_core）
      fail: 子包__init__.py复制父包module_id（Type A冲突）
    - type: constraint
      check: bridges文件命名格式
      pass: bridges/目录下文件使用{parent_id}_bridge格式（如MOD-GOV_anomaly_bridge）
      fail: bridges文件复制父目录文件module_id（Type C冲突）
    - type: constraint
      check: 游离module_id声明
      pass: module_id仅出现在[A_module]头部声明行
      fail: 文件体内出现游离的module_id:声明行（非头部声明）
    actions:
    - type: mandatory
      step: '子包__init__.py命名——{parent_id}_{child_name}（如MOD-BT-001_core, MOD-ALT_DATA_api）'
    - type: mandatory
      step: 'bridges/文件命名——{parent_id}_bridge（如MOD-GOV_anomaly_bridge）'
    - type: mandatory
      step: '禁止游离声明——module_id仅出现在文件头部[A_module]行，文件体内禁止出现module_id:声明行'
    - type: mandatory
      step: '命名后缀使用下划线连接（_child_name），禁止用连字符避免与module_id前缀MOD-XXX的连字符混淆'
    prohibitions:
    - 禁止多个文件声明相同module_id——MODULE-ID-CONSISTENCY gate硬阻断
    - 禁止子包__init__.py复制父包module_id——Type A冲突
    - 禁止bridges文件复制父目录文件module_id——Type C冲突
    - 禁止文件体内出现游离的module_id:声明行——非真实声明，导致扫描器误匹配
    enforcement:
      gate: MODULE-ID-CONSISTENCY
      checks: [module_id_collision, stray_module_id_line]
    rationale: module_id是文件唯一标识——冲突导致gate误判/depgraph节点歧义/AI幻觉; 子包复制父包module_id是常见错误(100+文件), bridges复制是第二常见错误(9组); 游离声明行干扰扫描器精确匹配
