rule_id: TRAE-047
title: 工程治理-文件头部与扩展
version: 1.3.0
layer: L1_foundation
module_id: TRAE-047
depends_on: []
tags:
- TRAE
- engineering_header_expansion
- L1
ttl: permanent
stability: stable
safety_level: H
ai_autonomy: human_gated
aliases:
- GOV-ENG-002
- GOV-ENG-003
severity: error
scope: engineering_header_expansion
domain: TRAE
triggers:
- operation: file_creation
- operation: module_expansion
sections:
  gov_eng_002:
    title: 文件头部标准(防幻觉/防漂移)
    section_type: rule
    original_rules:
    - GOV-ENG-002
    # 机器可读字段规范（SSoT——门禁/校验工具从此读取，禁止在代码中硬编码字段列表）
    field_specs:
      a_full:
        required: [BLUEPRINT, MODULE, DOMAIN, DEPENDENCIES, CONSUMERS, STARTUP, MATURITY, INVARIANTS, MODIFY-GUARD, STABILITY, SAFETY, AI_AUTONOMY, ERROR_CONTRACT, TESTS, TTL]
      a_test:
        required: [BLUEPRINT, MODULE, STABILITY, SAFETY, AI_AUTONOMY, TESTS, TTL]
      init_min: [BLUEPRINT, MODULE, DOMAIN]
    conditions:
    - type: constraint
      check: 文件是否包含治理锚定表头
      pass: 100% AI开发语境下所有文件MUST包含治理锚定表头
      fail: 缺少表头
    - type: constraint
      check: 表头格式是否与file_category匹配
      pass: A_full(code/script)/A_test(test)/B_yaml(gate/registry/contract/config/data)/C_json(contract(json)/schema(json))/D_md(doc)/E_shell(infra)
      fail: 格式不匹配
    actions:
    - type: mandatory
      step: 'A_full格式：15字段注释头部——[BLUEPRINT]/[MODULE]/[DOMAIN]/[DEPENDENCIES]/[CONSUMERS]/[STARTUP]/[MATURITY]/[INVARIANTS]/[MODIFY-GUARD]/[STABILITY]/[SAFETY]/[AI_AUTONOMY]/[ERROR_CONTRACT]/[TESTS]/[TTL]'
    - type: mandatory
      step: '[DEPENDENCIES]上游依赖——填此文件import的模块，分号分隔；强制AI创建代码时到全景图查上游节点是否存在'
    - type: mandatory
      step: '[STARTUP]启动方式——枚举auto_start/event_driven/manual/imported；scheduled禁止使用(见trae_060§3事件驱动全自动)；强制AI声明文件触发方式'
    - type: mandatory
      step: '[MATURITY]设计成熟度——枚举design/prototype/production；强制AI声明设计态还是运营态'
    - type: mandatory
      step: A_test格式：7字段简化版——[BLUEPRINT]/[MODULE]/[STABILITY]/[SAFETY]/[AI_AUTONOMY]/[TESTS]/[TTL]
    - type: mandatory
      step: B_yaml格式：6字段注释块——blueprint/module_id/stability/safety_level/ai_autonomy/ttl
    - type: mandatory
      step: C_json格式：_meta字段——blueprint/module_id/stability/safety_level/ai_autonomy/ttl
    - type: mandatory
      step: E_shell格式：5字段注释——[BLUEPRINT]/[STABILITY]/[SAFETY]/[AI_AUTONOMY]/[TTL]
    - type: mandatory
      step: 锚定文件时执行7步：判断归属蓝图→添加表头→更新蓝图§0.1→更新蓝图§11→更新蓝图§10→更新注册表和全景图→验证双向对齐
    - type: mandatory
      step: 修改枚举值MUST同步检查PS-STD-001对应章节
    prohibitions:
    - 禁止UNHEADERED状态文件被AI修改——先完成锚定
    - 禁止LOCKED状态文件被AI修改——任何修改必须经Owner批准
    - 禁止手动编辑cross_layer_contracts.yaml注册表——使用validate_module_schema.py --sync-contracts自动同步
  gov_eng_003:
    title: 1500模块扩展规范
    section_type: rule
    original_rules:
    - GOV-ENG-003
    conditions:
    - type: constraint
      check: 命名空间碰撞
      pass: 顶层包名无碰撞，建议≤200顶层包
      fail: 有命名碰撞
    - type: constraint
      check: 最大命名深度
      pass: ≤4层（zephyr.<a>.<b>.<c>）
      fail: 超过4层
    - type: constraint
      check: 依赖图性能
      pass: 全量扫描≤60s
      fail: '>60s→CI阻塞→必须优化'
    - type: constraint
      check: 蓝图§4对齐率
      pass: 新模块MUST 100%对齐
      fail: 对齐率不足
    actions:
    - type: mandatory
      step: 新模块扩展8步流程：1.创建蓝图模板 2.注册蓝图 3.scaffold.py创建包 4.添加[BLUEPRINT]头 5.注册blueprint_registry.yaml 6.更新path-tree 7.更新depgraph 8.audit_registration.py验证
    - type: mandatory
      step: 生成新模块时MUST通过scaffold.py查重
    - type: mandatory
      step: 蓝图§4文件清单必须列出所有.py文件
    - type: mandatory
      step: 新模块[BLUEPRINT]头部module_id|path|§N三字段必填
    - type: mandatory
      step: 同包互斥——同一__init__.py一次只能一个Agent写入
    - type: mandatory
      step: 注册表互斥——blueprint_registry.yaml写入需串行
    prohibitions:
    - 禁止循环导入——EngineerCheck gate硬阻断
    - 禁止绕过scaffold.py创建模块
  gov_eng_002_exempt:
    title: 豁免文件清单
    section_type: examples
    original_rules:
    - GOV-ENG-002
    items:
    - description: __init__.py
      details: 仅做import+__all__（按§3.3简化标记），豁免完整表头
    - description: .db/.sqlite3
      details: 二进制数据库，AI通过代码操作
    - description: .bin/.index
      details: 向量索引二进制产物
    - description: .jsonl
      details: append-only日志，AI只追加不修改
    - description: .gitkeep/.gitignore
      details: Git内部文件
    - description: .log
      details: 只读日志
    - description: test_fixtures/下的文件
      details: 测试夹具，故意模拟违规模式
  gov_eng_002_format_mapping:
    title: 文件类型到表头格式映射
    section_type: examples
    original_rules:
    - GOV-ENG-002
    items:
    - description: A_full(.py十五字段注释头部)
      details: '适用: code, script | 字段数: 15'
    - description: A_test(.py七字段简化版)
      details: '适用: test | 字段数: 7'
    - description: B_yaml(YAML 6字段注释块)
      details: '适用: gate, registry, contract(yaml), config, data | 字段数: 6'
    - description: C_json(JSON _meta字段)
      details: '适用: contract(json), schema(json) | 字段数: 6'
    - description: D_md(.md YAML frontmatter)
      details: '适用: doc | 引用REG-FRONTMATTER-001'
    - description: E_shell(Shell/Mermaid注释头部)
      details: '适用: infra(.sh/.ps1/.mmd) | 字段数: 5'
  gov_eng_002_directory_mapping:
    title: 格式-目录映射规则(定死不可乱放)
    section_type: rule
    original_rules:
    - GOV-ENG-002
    conditions:
    - type: constraint
      check: 文件扩展名是否在所在目录的允许格式清单内
      pass: 文件放在正确的目录且格式匹配
      fail: 文件放在错误的目录(如 .py 在 docs/ 下)
    ssot_pointer:
      target: directory_contract.yaml
      path: docs/01_policies_and_standards/_registry/contracts/directory_contract.yaml
      module_id: PS-CTR-002
      sections: [directory_extensions, root_directory_whitelist, global_forbidden]
      migration_note: 目录→扩展名映射的唯一真源已迁入 directory_contract.yaml（2026-06-29）。原 actions 散文式步骤已结构化为 directory_extensions 数组，本节不再摘抄值。
    enforcement:
      gate: GATE-DIRECTORY-CONTRACT
      script: scripts/governance/d1_structure/check_directory_contract.py
      checks: [DCR-005, DCR-006, DCR-007]
    rationale: 责任唯一真源唯一——每种格式有且只有一个合法存放区域; AI不需猜测该放哪里; 消除多目录同类内容的同步成本和漂移风险
  gov_eng_002_enum_definitions:
    title: 枚举值定义(SSoT)
    section_type: principles
    original_rules:
    - GOV-ENG-002
    - PS-REG-012
    items:
    - id: STABILITY-ENUM
      statement: 'stability枚举: frozen(冻结不可变更)/stable(稳定需门控)/evolving(演进可频繁修改)/volatile(易变AI可自主调整)'
      rationale: 与PS-REG-012完全一致，零冲突
      applies_to: 所有文件表头的[STABILITY]/stability字段
    - id: SAFETY-ENUM
      statement: 'safety_level枚举: H(高风险涉及安全关键路径)/M(中风险影响系统稳定性)/L(低风险辅助功能)'
      rationale: 与PS-REG-012完全一致，零冲突
      applies_to: 所有文件表头的[SAFETY]/safety_level字段
    - id: AUTONOMY-ENUM
      statement: 'ai_autonomy枚举: immutable_core(不可变核心AI只能读)/human_gated(人工闸门AI可提议需Owner批准)/ai_modifiable(AI可修改)'
      rationale: 与PS-REG-012完全一致，零冲突
      applies_to: 所有文件表头的[AI_AUTONOMY]/ai_autonomy字段
    - id: MATURITY-ENUM
      ssot_pointer:
        target: maturity_vocabulary.yaml
        path: docs/01_policies_and_standards/_registry/vocabularies/maturity_vocabulary.yaml
        module_id: PS-VOC-028
      rationale: 真源已迁出为独立词表（2026-06-29），消除内联枚举的同步成本
      applies_to: 所有A_full格式文件表头的[MATURITY]字段
    - id: STARTUP-ENUM
      ssot_pointer:
        target: startup_vocabulary.yaml
        path: docs/01_policies_and_standards/_registry/vocabularies/startup_vocabulary.yaml
        module_id: PS-VOC-029
      rationale: 真源已迁出为独立词表（2026-06-29），消除内联枚举的同步成本
      applies_to: 所有A_full格式文件表头的[STARTUP]字段
    - id: HEADER-FORMAT-ENUM
      ssot_pointer:
        target: header_format_vocabulary.yaml
        path: docs/01_policies_and_standards/_registry/vocabularies/header_format_vocabulary.yaml
        module_id: PS-VOC-030
      rationale: 真源已迁出为独立词表（2026-06-29），消除内联枚举的同步成本
      applies_to: 所有文件的表头格式选择
    - id: FILE-CATEGORY-ENUM
      ssot_pointer:
        target: file_category_vocabulary.yaml
        path: docs/01_policies_and_standards/_registry/vocabularies/file_category_vocabulary.yaml
        module_id: PS-VOC-031
      rationale: 真源已迁出为独立词表（2026-06-29），消除内联枚举的同步成本
      applies_to: 所有文件的分类判定
  gov_eng_002_state_machine:
    title: 表头状态机
    section_type: procedure
    original_rules:
    - GOV-ENG-002
    items:
    - order: 1
      action: 'UNHEADERED→ANCHORED: 执行锚定7步操作(添加表头+更新蓝图§0.1/§11+更新注册表+验证双向对齐)'
      pre_condition: 文件存在但无表头
      expected_result: 表头完整，蓝图§0.1/§11已更新
      on_failure: 锚定未完成——禁止AI修改此文件
    - order: 2
      action: 'ANCHORED→STABILIZED: stability从evolving/volatile提升为stable'
      pre_condition: 文件通过门控验证
      expected_result: 表头[STABILITY]更新+蓝图§0.1状态列更新
      on_failure: 门控未通过——保持ANCHORED
    - order: 3
      action: 'STABILIZED→LOCKED: stability=frozen或ai_autonomy=immutable_core'
      pre_condition: 文件需要锁定
      expected_result: 表头更新+freezemanifest.yaml注册
      on_failure: 锁定失败——保持STABILIZED
    - order: 4
      action: '任何→UNHEADERED: 蓝图重构/文件迁移导致蓝图引用失效'
      pre_condition: 蓝图引用失效
      expected_result: 重新执行锚定7步
      on_failure: 蓝图引用失效=不可操作
    - order: 5
      action: '任何→REMOVED: 文件被删除(通过RULE-THREE三步审判)'
      pre_condition: 文件已通过删除审判
      expected_result: 蓝图§0.1移除条目+注册表移除条目
      on_failure: 删除审判未通过——保留文件
  gov_eng_002_state_behavior:
    title: 表头状态与AI行为映射
    section_type: decision_tree
    original_rules:
    - GOV-ENG-002
    items:
    - condition: 文件状态=UNHEADERED
      if_true: 只读——禁止修改，先完成锚定
      if_false: 继续检查
    - condition: 文件状态=ANCHORED
      if_true: 按[AI_AUTONOMY]和[STABILITY]约束操作
      if_false: 继续检查
    - condition: 文件状态=STABILIZED
      if_true: 按[AI_AUTONOMY]约束操作，修改需通过门控
      if_false: 继续检查
    - condition: 文件状态=LOCKED
      if_true: 只读——任何修改必须经Owner批准
      if_false: 无效状态
  gov_eng_002_anchoring_procedure:
    title: 锚定7步操作清单
    section_type: procedure
    original_rules:
    - GOV-ENG-002
    items:
    - order: 1
      action: 判断归属蓝图
      pre_condition: 文件需要锚定
      expected_result: 蓝图module_id和路径已确定
      on_failure: 无法确定归属——必须先创建蓝图
    - order: 2
      action: 给文件添加表头
      pre_condition: 蓝图归属已确定
      expected_result: 表头格式与header_format映射一致
      on_failure: 格式不匹配——必须修正
    - order: 3
      action: 更新蓝图§0.1文件清单
      pre_condition: 表头已添加
      expected_result: 文件条目已添加到蓝图
      on_failure: 蓝图未更新——锚定不完整
    - order: 4
      action: 更新蓝图§11产出物存放目录
      pre_condition: 蓝图§0.1已更新
      expected_result: 产出物条目已添加
      on_failure: 产出物未注册
    - order: 5
      action: 更新蓝图§10依赖(如引入新依赖)
      pre_condition: 文件引入新依赖
      expected_result: 依赖声明已添加
      on_failure: 依赖未声明
    - order: 6
      action: 更新注册表和全景图
      pre_condition: 蓝图已更新
      expected_result: script-manifest.yaml/__init__.py/_registry.yaml已更新 + depgraph nodes表已INSERT/UPDATE对应节点(design_maturity/path/domain_id/belongs_to) + edges表已INSERT上下游依赖边
      on_failure: 注册表或全景图未更新=孤儿
    - order: 7
      action: 验证双向对齐
      pre_condition: 所有更新完成
      expected_result: Grep蓝图→文件+Grep文件→蓝图均命中 + extract_depgraph.py --modules <module_id>能查到节点
      on_failure: 双向对齐失败——必须修复
  gov_eng_002_verification:
    title: 文件头部验证流程
    section_type: verification
    original_rules:
    - GOV-ENG-002
    items:
    - step: 表头完整性检查
      command: python scripts/ops/verify_header_completeness.py
      expected_exit: 0
      on_fail: 缺失表头——必须补充
    - step: 枚举值一致性检查
      command: 检查[STABILITY]/[SAFETY]/[AI_AUTONOMY]与PS-REG-012定义一致
      expected_exit: 0
      on_fail: 枚举值不一致——MUST同步PS-REG-012
    - step: 蓝图-代码双向对齐
      command: 蓝图§0.1文件清单与代码[BLUEPRINT]字段互相验证
      expected_exit: 0
      on_fail: 不对齐——必须修复
    - step: 状态机合规检查
      command: LOCKED文件无AI修改记录
      expected_exit: 0
      on_fail: LOCKED文件被AI修改——违规
    - step: commit-time门禁检查
      command: GitCommitGateway的CREATE-GUARD检查新建.py文件表头完整性（field_specs动态读取，--no-verify绕不过）
      expected_exit: 0
      on_fail: commit阻断——必须修复表头
  gov_eng_002_yaml_design_decision:
    title: B_yaml设计决策
    section_type: context
    original_rules:
    - GOV-ENG-002
    summary: B_yaml格式用注释块而非YAML字段——避免破坏现有YAML schema解析
    impact_on_rules: 门禁有gate_id/checks，能力卡有capability_id/input_schema，直接加字段会导致解析失败
    key_decisions:
    - 用注释块而非YAML字段是刻意设计
    - B_yaml适用: gate/registry/contract(yaml)/config/data/architecture
  gov_eng_003_namespace_baseline:
    title: 命名空间验证基线(2026-05-19)
    section_type: examples
    original_rules:
    - GOV-ENG-003
    items:
    - description: 当前状态
      details: '顶层包数: 以extract_depgraph.py --summary为准 | 子包数(含__init__.py): 以extract_depgraph.py --summary为准 | .py模块数: 以extract_depgraph.py --summary为准 | 模块注册表条目: 以blueprint_registry.yaml为准 | 蓝图条目: 以blueprint_registry.yaml为准 | 蓝图物理文件: 以blueprint_registry.yaml为准'
    - description: 碰撞检测结果
      details: '顶层包名重复: 通过scaffold.py查重门控(无碰撞) | __init__.py __all__大小: 无硬编码限制(Python list) | 模块名冲突: 通过scaffold.py查重检测 | 功能域重叠: 由functional-domain-registry.yaml门控'
    - description: 1500模块时投影
      details: '扁平命名池: 建议<=200顶层包，其余嵌套 | 生成新模块时MUST通过scaffold.py查重'
  gov_eng_003_depgraph_performance:
    title: 依赖图性能基准
    section_type: examples
    original_rules:
    - GOV-ENG-003
    items:
    - description: 实测数据(包数/模块数以extract_depgraph.py --summary为准，运行时查询，不固化具体数字)
      details: 'scan_ground_truth_deps.py: 阈值 <=60s（实测数据通过运行时查询获取） | 内存占用: 阈值 <=2GB（实测数据通过运行时查询获取）| 超阈值→Gate硬阻断→必须优化'
    - description: 性能保障策略
      details: Incremental scan(仅扫描变更包) / ThreadPoolExecutor(max_workers=8)(RULE-SEVEN强制) / 缓存ground_truth_deps.cache(未变更模块跳过) / Gate硬阻断(全量扫描>60s→CI阻塞→必须优化)
  gov_eng_003_alignment_baseline:
    title: 蓝图§4对齐基线
    section_type: examples
    original_rules:
    - GOV-ENG-003
    items:
    - description: 当前对齐率
      details: '蓝图物理文件: 以blueprint_registry.yaml为准 | 子包数: 以extract_depgraph.py --summary为准 | 对齐率(蓝图/包): 通过audit_registration.py运行时查询 | 已注册模块: 以blueprint_registry.yaml为准'
    - description: 新模块对齐标准
      details: '蓝图§4文件清单: 新模块所有.py文件MUST列出 | [BLUEPRINT]头部: module_id|path|§N三字段必填 | cross-reference: 蓝图与代码互相引用 | 不变量: 蓝图§4文件数=代码文件数(audit_registration.py校验) | 对齐率目标: 新模块MUST 100%对齐'
  gov_eng_003_expansion_procedure:
    title: 新模块扩展8步流程
    section_type: procedure
    original_rules:
    - GOV-ENG-003
    items:
    - order: 1
      action: 创建蓝图模板
      pre_condition: 确定新模块需求
      expected_result: 复制docs/03_modules/template_registry.yaml指定模板，填frontmatter
      on_failure: 模板选择错误——必须重新选择
    - order: 2
      action: 注册蓝图
      pre_condition: 蓝图模板已创建
      expected_result: 写入docs/03_modules/blueprint_registry.yaml
      on_failure: 注册失败——蓝图不可发现
    - order: 3
      action: 创建包
      pre_condition: 蓝图已注册
      expected_result: python scripts/scaffold.py module <pkg> <name> --desc '...'
      on_failure: scaffold.py查重失败——名称冲突
    - order: 4
      action: 添加[BLUEPRINT]头
      pre_condition: 包已创建
      expected_result: 每个新.py填入十五字段(GOV-ENG-002§4)
      on_failure: 缺表头=孤儿文件
    - order: 5
      action: 注册到blueprint_registry.yaml
      pre_condition: 表头已添加
      expected_result: 添加新条目——module_id/layer/blueprint/priority
      on_failure: 注册失败=模块不可发现
    - order: 6
