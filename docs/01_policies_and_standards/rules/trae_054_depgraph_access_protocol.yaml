sections:
  depgraph_access_protocol:
    section_type: procedure
    title: depgraph 程序化访问协议(RULE-SIXTEEN)
    original_rules:
    - RULE-SIXTEEN
    conditions:
    - type: trigger
      check: 任何需要读取或修改 depgraph 的操作（查看模块定义/修改physical_files/更新blueprint_status/查看域结构等）
      pass: 通过 extract_depgraph.py/apply_depgraph.py 程序化访问
      fail: 直接 Read/Write depgraph 文件 → OOM 崩溃
    - type: constraint
      check: depgraph 存储在 PostgreSQL 数据库（通过 config/.env.postgres 配置连接，数据库名 depgraph，运行在 localhost:5432）。禁止 AI 直接连数据库，必须通过 extract_depgraph.py/apply_depgraph.py 程序化访问
      pass: 禁止 AI 直接 Read/Write，必须通过提取/应用脚本操作
      fail: 大文件加载 → OOM 崩溃
    actions:
    - type: mandatory
      step: '读取 depgraph: STEP1 确定需要什么数据 → STEP2 运行 extract_depgraph.py 对应命令 → STEP3 AI 只读提取结果(JSON, 几KB到几百KB, 安全)'
    - type: mandatory
      step: '修改 depgraph 前置备份(STEP0): 使用 pg_dump 或 apply_depgraph.py 内置物理备份。回滚: 通过 pg_restore 或 apply_depgraph.py 回滚命令'
    - type: mandatory
      step: '修改 depgraph: STEP0 前置备份(见上) → STEP1 AI 生成变更 JSON 文件 → STEP2 apply_depgraph.py --batch changes.json --dry-run(验证) → STEP3 apply_depgraph.py --batch changes.json(执行) → STEP4 extract_depgraph.py --summary(验证变更)'
    - type: mandatory
      step: '备份触发条件: 每次 apply_depgraph.py 执行前(apply_depgraph.py 是唯一合法 depgraph 写入口)。通过 PG 事务回滚提供原子性保障。extract_depgraph.py/diagnose_depgraph.py 是只读操作不需要备份。generate_project_depgraph.py 治本后允许运行（需先执行OPS-2026062502-506）'
    - type: mandatory
      step: '备份范围: 通过 pg_dump 备份整个 depgraph (PostgreSQL)。脚本文件(extract_depgraph.py/apply_depgraph.py)通过 git 常规版本控制保护，不需要额外备份触发'
    - type: mandatory
      step: '物理备份规范: apply_depgraph.py 每次非 dry-run 写操作前通过 PG 事务保护。需要完整备份时使用 pg_dump。存放位置: data/databases/backups/。命名格式: depgraph.backup.{YYYYMMDD_HHMMSS}_{tag}.sql'
    - type: mandatory
      step: 'extract_depgraph.py 命令清单: --summary(域数+模块数) / --domains D_FACTOR,D_RISK / --modules D-FACTOR-01 / --top(顶级元数据) / --paths(所有physical_files) / --stats(文件大小统计)'
    - type: mandatory
      step: '变更 JSON 格式: [{"op":"update","module_id":"D-FACTOR-01","field":"blueprint_status","value":"has_blueprint"}] / [{"op":"add_physical_file","module_id":"D-FACTOR-01","path":"src/zephyr/factor/new_file.py"}] / [{"op":"remove_physical_file",...}] / [{"op":"set_physical_files","module_id":"D-FACTOR-01","files":["path1.py","path2.py"]}]'
    - type: mandatory
      step: 'build_status 合法值约束（裁定#178-183，OPS-2026062505 已添加 DB CHECK 约束）: nodes.build_status 字段只允许 5 种合法值——planned(设计态未实现)/generated(代码已生成)/testing(测试中)/stable(生产稳定)/deprecated(废弃态)。状态机为单调推进: planned→generated→testing→stable→deprecated。DB 层 CHECK 约束已生效，INSERT 非法值（如 draft/inactive/unbuilt/production/active 等）会被 psycopg2.IntegrityError 拒绝。design_maturity 字段只允许 3 种合法值: design/production/prototype。module_lifecycle_state 字段已删除（v11 迁移归档到 nodes_archive_module_lifecycle 表）'
    - type: mandatory
      step: 'depgraph 写入禁用 lock_files.py（P2 PG 迁移治本，2026-06-29）: depgraph 已迁移到 PostgreSQL，写入通过 PG MVCC 事务保护（apply_depgraph.py 内置事务回滚），文件锁（lock_files.py cmd_acquire/cmd_release）对 PG 写无保护作用。禁止在 depgraph 写入路径调用 lock_files.py。真源指针：sync_yaml_to_depgraph.py 已删除 lock_files import（向内收治本，禁止恢复）；GitCommitGateway _check_repo_root_usage 模式5 检测 sqlite3.connect 硬编码 + 模式6 检测 DB 写入脚本中 import lock_files（DB 写入信号 + lock_files import 信号 → REPO_ROOT_VIOLATION，--no-verify 绕不过）'
    prohibitions:
    - 用 Read 工具读取 depgraph 文件（大文件加载 → OOM 崩溃 → IDE 重启）
    - 用 Write 工具直接写 depgraph 文件（大文件写入 → OOM 崩溃 + 可能损坏文件）
    - 用任何方式将 depgraph 内容注入 AI 上下文（token 数远超模型 context 上限 → 内存溢出）
    - 拆分 depgraph 为多个域文件（跨域关系丢失 → 漂移和幻觉）
    - 绕过提取脚本自己写 Python 代码直接读 depgraph（AI 上下文不能装下）
    - 在 depgraph 写入路径调用 lock_files.py（P2 PG 迁移后文件锁对 PG 写无保护作用，改用 PG MVCC 事务）
    exceptions:
      read_first_20_lines: 'Read(limit=20) 仅看文件头警告 ✅'
      generate_depgraph: '运行 generate_project_depgraph.py 生成/更新（治本后允许，需先执行OPS-2026062502-506，生成器已修复build_status推导和白名单准入）✅'
      diagnose_depgraph: '运行 diagnose_depgraph.py 诊断 ✅'
    rationale:
      no_split: '拆分为多个域文件 → 跨域关系丢失 → AI 看到碎片化数据 → 产生大量漂移和幻觉。depgraph 保持一个文件(SSoT)，通过程序化提取访问'
      no_model_change: 'depgraph 内容远超任何当前模型的 context 上限。任何当前模型都无法装下'
