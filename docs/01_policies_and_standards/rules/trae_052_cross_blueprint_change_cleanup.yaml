ttl: permanent
stability: frozen
safety_level: H
ai_autonomy: immutable_core
aliases:
- RULE-ELEVEN
- RULE-TWELVE
severity: critical
scope: cross_blueprint_change_cleanup
domain: TRAE
triggers:
- operation: cross_blueprint_change_notification
- operation: project_slimming_auto_cleanup
sections:
  rule_eleven:
    section_type: rule
    title: 跨蓝图变更通知(RULE-ELEVEN)
    original_rules:
    - RULE-ELEVEN
    conditions:
    - type: trigger
      check: 修改任何蓝图的接口契约(Collection名/API签名/数据格式/依赖方向)时
      pass: 执行强制三步(识别消费方→同步更新→验证)
      fail: 只改提供方不改消费方导致消费方静默降级/断路
    actions:
    - type: mandatory
      step: STEP1识别消费方→Grep全项目引用该接口的所有蓝图/代码
    - type: mandatory
      step: STEP2同步更新→所有消费方蓝图§4+代码常量/调用同步修改
    - type: mandatory
      step: STEP3验证→端到端测试确认消费方仍能正常调用
    prohibitions:
    - 只改提供方，不改消费方(消费方静默降级/断路)
    - 改了接口但不Grep消费方(遗漏消费方→生产故障)
    - 消费方蓝图不更新§4契约(下个AI session看到旧契约→幻觉)
  rule_twelve:
    section_type: rule
    title: 项目瘦身与自动清理(RULE-TWELVE)
    original_rules:
    - RULE-TWELVE
    conditions:
    - type: trigger
      check: 发现候选清理物(零消费者/版本旧/孤儿)时
      pass: 先判定价值→有价值则接通系统，无价值才删除
      fail: 仅凭"零消费者"或"版本旧"直接删除
    actions:
    - type: mandatory
      step: 价值判定→有价值→接入系统(归属蓝图+对齐依赖图+对齐路径树+对齐代码表头)；无价值→走RULE-THREE三步审判→确认无价值→删除
    - type: mandatory
      step: 过时蓝图版本→新版本缺失旧版本独有内容→保留/合并不删；新版本完全覆盖→归档
    - type: mandatory
      step: 零消费者→判功能价值(不看消费者数)→有价值→接入；无价值→删除
    - type: mandatory
      step: 清理后验证三步→audit_registration.py(exit 0)+generate_project_path_tree.py --write+generate_project_depgraph.py --max-workers 8
    prohibitions:
    - 仅凭"零消费者"判定删除(误删有价值的安全/治理组件)
    - 仅凭"时间旧"删除蓝图版本(丢失新版本未覆盖的内容)
    - 清理后不跑验证三步(注册表/路径树/依赖图漂移)
    - 只做一次性清理，不建常驻机制(垃圾持续累积)
references:
