rule_id: TRAE-010
title: 代码构建-命名与组织
version: 1.0.0
layer: L1_foundation
module_id: TRAE-010
depends_on:
- TRAE-028
tags:
- TRAE
- code_naming
- L1
ttl: permanent
stability: stable
safety_level: M
ai_autonomy: human_gated
aliases:
- CODE-001
- CODE-002
- CODE-003
- CODE-004
severity: error
scope: code_naming
domain: TRAE
triggers:
- operation: code_naming
sections:
  code_001:
    title: 代码命名规范（命名格式规则真源见trae_028_doc_structure_naming.yaml gov_doc_003_naming_ssot）
    section_type: rule
    original_rules:
    - CODE-001
    conditions:
    - type: constraint
      check: 代码命名格式合规性
      pass: 命名格式规则遵循trae_028_doc_structure_naming.yaml gov_doc_003_naming_ssot（文件名/目录名/Python源文件/代码标识符/YAML字段名统一snake_case；类名PascalCase；常量UPPER_SNAKE_CASE）
      fail: 命名格式违反trae_028 gov_doc_003_naming_ssot
    - type: constraint
      check: 代码命名语义质量
      pass: 变量名有意义；无单字母（x、i除外）；无拼音；无类型嵌入；无无意义命名
      fail: 命名语义质量不合规
    actions:
    - type: mandatory
      step: 命名格式规则统一遵循trae_028_doc_structure_naming.yaml gov_doc_003_naming_ssot（本文件不再重复定义命名格式规则，仅保留代码语义质量约束）
    - type: mandatory
      step: __init__.py仅导出公开API（最小原则）
    prohibitions:
    - 禁止单字母变量名（x、i除外——仅限推导式/循环索引）
    - 禁止拼音命名
    - 禁止在变量名中嵌入类型（str_name、list_items）——类型注解已承担此职责
    - 禁止data、info、result等无意义命名
  code_002:
    title: 文件组织
    section_type: rule
    original_rules:
    - CODE-002
    conditions:
    - type: constraint
      check: 单文件行数
      pass: ≤300行
      fail: '>300行必须拆分'
    - type: constraint
      check: 单函数行数
      pass: ≤50行
      fail: '>50行必须拆分'
    - type: constraint
      check: 单类行数
      pass: ≤200行
      fail: '>200行必须拆分'
    - type: constraint
      check: 文档文件tokens
      pass: 警告阈值40K / 强制拆分60K
      fail: 超过强制拆分阈值必须拆分
    - type: constraint
      check: 文档文件行数
      pass: 警告阈值800行 / 强制拆分1200行
      fail: 超过强制拆分阈值必须拆分
    actions:
    - type: mandatory
      step: 超限文件拆分为同目录下的多个模块文件
    - type: mandatory
      step: __init__.py仅导出公开API，禁止from .module import *
    - type: mandatory
      step: 一个文件一个主类+辅助函数
    - type: mandatory
      step: 文档拆分后必须创建总览索引文件(00-总览与索引.md)
    - type: mandatory
      step: 文档拆分后子文件头部声明parent_file+sibling_files
    - type: mandatory
      step: 文档拆分后路径映射必须符合依赖图path_mappings
    - type: mandatory
      step: 文档拆分后交叉引用无断裂
    prohibitions:
    - 禁止在__init__.py中写业务逻辑
    - 禁止from .module import *（破坏静态分析）
    - 禁止文档拆分策略使用自定义策略时不说明理由
  code_003:
    title: 包结构(__init__.py/__all__)
    section_type: rule
    original_rules:
    - CODE-003
    conditions:
    - type: constraint
      check: 每个子包是否声明__all__
      pass: 已声明__all__包含所有公开符号
      fail: 未声明__all__
    actions:
    - type: mandatory
      step: 每个子包MUST声明__all__，包含所有公开符号
    prohibitions: []
  code_004:
    title: 模块职责单一原则
    section_type: rule
    original_rules:
    - CODE-004
    conditions: []
    actions:
    - type: mandatory
      step: 每个文件一个主类+辅助函数
    - type: mandatory
      step: 超过300行拆分辅助函数/子类到独立文件
    prohibitions: []
  gov_eng_010_naming_examples:
    title: 命名约定详细示例（命名格式规则真源见trae_028_doc_structure_naming.yaml gov_doc_003_naming_ssot）
    section_type: examples
    original_rules:
    - CODE-001
    items:
    - description: 命名格式规则真源
      details: 文件命名/目录命名/Python源文件命名/代码标识符命名/YAML字段命名的完整规则与示例见trae_028_doc_structure_naming.yaml gov_doc_003_naming_ssot（本文件不再重复定义）
    - description: 代码命名语义质量约束（本文件独有，非trae_028覆盖范围）
      details: 禁止单字母变量名(x、i除外);禁止拼音命名;禁止在变量名中嵌入类型(str_name、list_items);禁止data/info/result等无意义命名
  gov_eng_010_split_strategy:
    title: 文档拆分策略优先级
    section_type: principles
    original_rules:
    - CODE-002
    items:
    - id: SPLIT-001
      statement: 按功能域拆分——域驱动设计，各域内聚
      rationale: D-DATA / D_RISK / D-EXECUTION等域自然内聚
      applies_to: 文档拆分首选策略
    - id: SPLIT-002
      statement: 按架构层拆分——层级清晰的系统
      rationale: 基础设施 / D_FACTOR Alpha / D_SIGNAL信号等层级清晰
      applies_to: 文档拆分次选策略
    - id: SPLIT-003
      statement: 按依赖深度拆分——扁平依赖结构
      rationale: 核心链路 / 扩展链路 / 外围
      applies_to: 文档拆分第三选策略
    - id: SPLIT-004
      statement: 自定义拆分——混合策略需在拆分索引中说明理由
      rationale: 混合策略需要额外说明
      applies_to: 文档拆分最后选策略
  gov_eng_010_split_template:
    title: 拆分索引模板
    section_type: examples
    original_rules:
    - CODE-002
    items:
    - description: 总览索引文件模板(00-总览与索引.md)
      details: '文件清单表: #/文件/一句话/tokens/状态; 拆分策略: by_domain/by_layer/by_depth/custom; 触发原因: 单文件>60K tokens; 拆分依据: 按功能域自然拆分'
    - description: 子文件头部模板
      details: 'parent_file: 00-总览与索引.md | sibling_count: {N}'
  gov_eng_010_split_requirements:
    title: 拆分后必须满足的要求
    section_type: verification
    original_rules:
    - CODE-002
    items:
    - step: 总览索引文件存在
      command: 检查00-总览与索引.md是否存在，列出所有子文件+一句话摘要+链接
      expected_exit: 0
      on_fail: 缺少总览索引——必须创建
    - step: 子文件互相引用
      command: 检查子文件头部是否声明parent_file+sibling_files
      expected_exit: 0
      on_fail: 缺少互相引用——必须添加
    - step: 路径映射合规
      command: 检查拆分后文件路径是否符合依赖图§19 path_mappings
      expected_exit: 0
      on_fail: 路径映射不合规——必须修正
    - step: 交叉引用无断裂
      command: 检查拆分前能跳转的链接拆分后仍然有效
      expected_exit: 0
      on_fail: 交叉引用断裂——必须修复
  gov_eng_010_scope:
    title: 适用范围
    section_type: context
    original_rules:
    - GOV-ENG-001
    summary: 代码构建标准适用于全14层(L00-L15)，按§3分层定级
    impact_on_rules: 所有Python代码必须遵守命名与组织规范
    key_decisions:
    - 文件大小约束是硬性限制，超限必须拆分
    - 文档拆分策略有优先级，按功能域优先
  gov_eng_010_cross_refs:
    title: 交叉引用
    section_type: context
    original_rules:
    - GOV-ENG-001
    summary: 命名与组织规范是代码构建标准的基础层，上承类型注解(§3)和导入规范(§4)
    impact_on_rules: 命名不规范=代码不可提交
    key_decisions:
    - __init__.py最小原则与GOV-ENG-002§3.3简化标记一致
    - 文档拆分阈值(40K/60K tokens)是128K窗口下的实际约束
  gov_eng_010_change_history:
    title: 变更历史
    section_type: context
    original_rules:
    - GOV-ENG-001
    items:
    - version: 1.2.0
      date: '2026-06-21'
      change: 'std_009/std_011审查修复：references.rule_ids移除4个TRAE-010自引用重复（RQ-04）；references.modules的GOV-ENG-001迁移到blueprints（引用类型错位）'
    - version: 1.1.0
      date: '2026-06-19'
      change: RQ审查修复：code_001命名格式规则改为引用trae_028 gov_doc_003_naming_ssot（RQ-02/RQ-03散布修复）；gov_eng_010_naming_examples同步改为引用；修复code_003/code_004 prohibitions格式（RQ-08）；provenance标注源文件已superseded（RQ-04/RQ-09）；补充change_history（RQ-14）
    - version: 1.0.0
      date: '2026-06-13'
      change: 初始提取自GOV-ENG-001§1-§2
    summary: 命名与组织规范提取自GOV-ENG-001§1-§2
    impact_on_rules: 无结构性变更
    key_decisions:
    - §1命名约定和§2文件组织从GOV-ENG-001独立提取
