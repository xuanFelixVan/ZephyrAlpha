sections:
  scan_exclusion_principle:
    section_type: rule
    title: 全景图扫描排除原则
    original_rules: []
    conditions:
    - type: trigger
      check: AI session 查询"为什么某路径不在全景图中"或"某路径是否应该纳入全景图"
      pass: 查本规则 §排除路径清单 + 配置文件 depgraph_scan_exclusions.yaml
      fail: 凭模式猜测 → 幻觉
    - type: constraint
      check: depgraph 回答"谁依赖谁"（CODE 依赖关系），非代码文件不进入依赖图
      pass: 非代码文件(文档/知识/审计/数据)排除出 depgraph nodes
      fail: 非代码文件进入 depgraph → 噪音边泛滥 → 依赖图不可用
    - type: constraint
      check: path_tree 回答"磁盘上有什么文件"（物理路径树），覆盖所有项目文件
      pass: path_tree 仅排除二进制/缓存/编译产物，保留文档/知识/审计
      fail: path_tree 排除文档 → AI 看不到磁盘文件结构 → 幻觉
    actions:
    - type: mandatory
      step: '查询排除规则: 查 depgraph_scan_exclusions.yaml(路径清单真源) → 查本规则(原则定义)'
    - type: mandatory
      step: '修改排除规则: 修改 depgraph_scan_exclusions.yaml → 运行 generate_project_depgraph.py --warn-only 验证 → 运行 generate_project_path_tree.py --check 验证'
    - type: mandatory
      step: '新增排除路径: 在 depgraph_scan_exclusions.yaml 对应段落添加路径 + 注明排除原因 + 更新本规则 §排除路径清单'
  exclusion_mechanism:
    section_type: reference
    title: 排除机制详解
    rationale:
      whitelist: 'depgraph 用白名单扫描根(SCAN_DIRS)——不在白名单的路径根本不扫描。这是最主要的排除机制。'
      exempt_dir: 'os.walk 时按目录名跳过(如 __pycache__/.git)——通用缓存/锁/临时目录。'
      node_type_whitelist: '节点类型白名单准入(NODES_WHITELIST，裁定#184)——只有 module/script/test/config 4 种 node_type 进入依赖图 nodes 表，其余类型默认不进 nodes（保留在 arch_directory_tree）。白名单天然安全——新类型默认不进 nodes。原 EXCLUDED_NODE_TYPES 黑名单不可靠（漏掉 gate/contract/registry/schema 共 561 个非代码节点污染）。'
      knowledge_doc: '知识文档类型跳过——docs/08_knowledge 和 docs/_working 的 .md 文件被分类为 knowledge_doc 并跳过，因为它们是经验积累/历史记录，无代码依赖。'
      skip_ext: 'path_tree 跳过二进制/编译产物扩展名(.pyc/.dll/.exe 等)。'
      max_depth: 'path_tree 最大扫描深度 8 层，防止无限递归。'
  excluded_paths:
    section_type: reference
    title: 不纳入全景图的路径清单
    description: |
      以下路径不纳入 depgraph nodes 表(不可见)。
      path_tree 中 docs/08_knowledge、docs/_working 仍可见(物理路径树保留)。
    items:
    - path: docs/08_knowledge/
      reason: 知识库条目(4647+ 文件)，经验积累非代码，无导入依赖
      exclusion_mechanism: whitelist + knowledge_doc
      in_path_tree: true
    - path: docs/_working/audit/
      reason: 审计报告(36 文件)，事后评估非代码，历史记录
      exclusion_mechanism: whitelist + knowledge_doc
      in_path_tree: true
    - path: docs/_working/decomposition/
      reason: 任务卡(7 文件)，拆解产物非代码，临时性
      exclusion_mechanism: whitelist
      in_path_tree: true
    - path: docs/_working/decomposition/tasks/
      reason: 任务卡文件(DM-*.md)，拆解产物非代码
      exclusion_mechanism: whitelist
      in_path_tree: true
    - path: data/cache/
      reason: 运行时缓存，非代码
      exclusion_mechanism: whitelist + exempt_dir(cache)
      in_path_tree: false
    - path: data/telemetry/
      reason: 遥测数据，非代码
      exclusion_mechanism: whitelist + exempt_dir(telemetry)
      in_path_tree: false
    - path: scripts/governance/_archive/
      reason: 归档脚本，非活跃代码
      exclusion_mechanism: whitelist
      in_path_tree: true
    - path: scripts/governance/repair/
      reason: 修复脚本，临时性
      exclusion_mechanism: whitelist
      in_path_tree: true
    - path: scripts/governance/_shared/
      reason: 共享内部工具，非 depgraph 相关
      exclusion_mechanism: whitelist
      in_path_tree: true
  nodes_whitelist:
    section_type: reference
    title: nodes 表节点类型白名单准入（裁定#184）
    description: |
      nodes 表只收录 4 种 node_type（白名单准入），其余类型默认不进 nodes 表。
      白名单机制天然安全——新类型默认不进 nodes，无需手动维护排除清单。
      非白名单类型保留在路径全景图（arch_directory_tree 表），AI 仍可查询其位置。
      原 EXCLUDED_NODE_TYPES 黑名单不可靠（漏掉 4 种类型导致 561 个非代码节点污染）。
    whitelist:
    - type: module
      reason: Python 代码模块，有 import 依赖
      file_type: .py
    - type: script
      reason: Python 脚本，有 import 依赖
      file_type: .py
    - type: test
      reason: Python 测试，有 import 依赖
      file_type: .py
    - type: config
      reason: 运行时配置，有配置依赖
      file_type: .yaml/.yml
    non_whitelist_examples:
      description: '以下类型不进 nodes 表（保留在 arch_directory_tree），举例非穷举：'
      examples:
      - type: doc
        reason: 文档文件，0 import edges
      - type: policy
        reason: 政策文档，0 import edges
      - type: standard
        reason: 标准文档，0 import edges
      - type: template
        reason: 模板文档，0 import edges
      - type: diagram
        reason: mermaid 图表，0 import edges
      - type: data
        reason: 数据文件，0 import edges
      - type: gate/contract/registry/schema/blueprint
        reason: 治理/契约/注册表/Schema/蓝图节点，非代码依赖
  config_file_reference:
    section_type: reference
    title: 配置文件真源
    description: |
      排除路径/类型的具体清单存储在 YAML 配置文件中(非硬编码在 Python 代码中)。
      修改排除规则 = 修改配置文件，不需要改代码。
    config_file: docs/01_policies_and_standards/_registry/catalogs/depgraph_scan_exclusions.yaml
    config_structure:
      depgraph.scan_dirs: depgraph 白名单扫描根
      depgraph.exempt_dirs: depgraph os.walk 跳过的目录名
      depgraph.nodes_whitelist: depgraph nodes 表准入节点类型（裁定#184，4种：module/script/test/config）
      depgraph.knowledge_doc_paths: depgraph 知识文档跳过路径
      depgraph.type_prefixes: depgraph 类型分类前缀
      path_tree.scan_roots: path_tree 扫描根
      path_tree.skip_dirs: path_tree 跳过的目录名
      path_tree.skip_extensions: path_tree 跳过的扩展名
      path_tree.max_depth: path_tree 最大扫描深度
  code_implementation:
    section_type: reference
    title: 代码实现
    description: |
      两个生成器从 depgraph_scan_exclusions.yaml 读取配置，不硬编码排除规则。
      裁定#184 后，generate_project_depgraph.py 已从 EXCLUDED_NODE_TYPES 黑名单改为 NODES_WHITELIST 白名单准入。
    generators:
    - script: scripts/governance/generate_project_depgraph.py
      reads_config: depgraph 段(scan_dirs + exempt_dirs + nodes_whitelist + knowledge_doc_paths + type_prefixes)
      whitelist_mechanism: 'NODES_WHITELIST = {module, script, test, config}（裁定#184），if node_type not in NODES_WHITELIST: skip'
      cleaned_dead_code: EXCLUDED_SCAN_DIRS(定义但从未使用，已删除) + EXCLUDED_NODE_TYPES(黑名单替换为白名单)
    - script: scripts/governance/generate_project_path_tree.py
      reads_config: path_tree 段(scan_roots + skip_dirs + skip_extensions + max_depth)
      note: path_tree 不排除 docs/08_knowledge、docs/_working(物理路径树保留所有文档)
  change_history:
    section_type: examples
    title: 修订记录
    items:
    - version: '1.1.0'
      date: '2026-06-25'
      by: session-20260625-507
      changes: '裁定#184-188治本对齐——废除 EXCLUDED_NODE_TYPES 黑名单，改为 NODES_WHITELIST 白名单准入（4种：module/script/test/config）；更新 exclusion_mechanism 从黑名单改为白名单机制；更新 config_structure 和 code_implementation 引用；同步 generate_project_depgraph.py 代码已实现白名单'
    - version: '1.0.0'
      date: '2026-06-22'
      by: session-20260622-001
      changes: '初始创建——从 generate_project_depgraph.py 和 generate_project_path_tree.py 代码中提取扫描排除规则，建立独立规则文件 + YAML 配置文件真源。清理 EXCLUDED_SCAN_DIRS 死代码。解决 AI session 无法通过规则文件发现排除策略的问题。'
