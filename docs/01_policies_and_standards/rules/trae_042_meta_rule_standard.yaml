    summary: "ZephyrAlpha规则体系生命周期状态机和变更门控审批体系的唯一真源。定义draft→active→deprecated状态转换规则、P0-P3四级变更审批流程、退役级联、自动归档。v3.0.0合并原PS-STD-010（rule_lifecycle_and_change_standard.md）。"
    applies_to:
    - "01_policies_and_standards/下所有doc_type文件"
