  ps_std_005_relation_to_ps_std:
    title: 与已有标准的关系
    section_type: context
    original_rules:
    - PS-STD-005 §11
    summary: 本标准与PS-STD系列其他标准的关系——互补不重复
    ps_std_relations:
    - standard: PS-STD-000宪法
      responsibility: 规则怎么分类
      relation: 本标准是登记表层标准——后果可逆(重组目录归属是可逆操作)
    - standard: PS-STD-001字段
      responsibility: frontmatter字段定义
      relation: belongs_to字段的定义以本标准为准不与其他字段冲突
    - standard: PS-STD-002模板
      responsibility: 单个标准怎么写
      relation: 本标准(格式定义型子类型)遵循PS-STD-002的Common Core(6章)+该子类型的条件章节；§12/§13/§14不适用(本标准不定义字段不定义行为约束行为约束在本§5禁止行为中表达)
    - standard: PS-STD-003行为边界
      responsibility: ABS/COND/REC
      relation: 本标准的禁止行为在本§5；因果关系可逆——违反即重组目录归属不需要纳入宪法
    conditions:
    - type: trigger
      check: 本标准与其他PS-STD标准冲突时
      pass: 按关系表判定主从
      fail: 不清楚主从关系导致冲突
    actions:
    - type: mandatory
      step: 本标准与PS-STD系列互补不重复；belongs_to字段定义以本标准为准；frontmatter字段定义以PS-STD-001为准；章节模板以PS-STD-002为准
    prohibitions: []
  ps_std_005_normative_refs:
    title: 蓝图架构标准规范性引用
    section_type: context
    original_rules:
    - PS-STD-005 §12
    summary: 本标准的normative(规范性6项)和informative(资料性4项)引用清单
    normative_references:
    - document: blueprint-construction-template.md
      content: 蓝图模板——单份蓝图的章节结构
      arbitration: 蓝图模板
    - document: PS-STD-000(meta_standard_constitution.yaml)
      content: 元标准宪法——规则分类(标准vs宪法)
      arbitration: PS-STD-000
    - document: PS-STD-001(metadata_registry.yaml)
      content: frontmatter字段定义
      arbitration: PS-STD-001
    - document: PS-STD-002(document_structure_standard.yaml)
      content: L1标准模板——格式定义型子类型适用的章节集
      arbitration: PS-STD-002
    - document: 03_modules/module-registry.yaml
      content: 模块生命周期登记
      arbitration: module-registry.yaml
    - document: 03_modules/blueprint_registry.yaml
      content: 蓝图深度评估
      arbitration: 本标准+blueprint_registry.yaml(§8.1扩展字段以本标准为准)
    informative_references:
    - document: Codified Context(arXiv 2602.20478)
      content: 三层记忆模型(设计参考)
    - document: Microsoft Edge AI Blueprint Architecture
      content: master-blueprint→domain-blueprint→component层级(设计参考)
    - document: HP Inc AI-Blueprints specification.md
      content: specification.md vs blueprint.md双层分离(设计参考)
    - document: TOGAF Architecture Repository
      content: COBIT对齐——架构仓库分级存放
    conditions:
    - type: trigger
      check: 引用其他标准或文档时
      pass: 按normative/informative分类引用
      fail: 混淆normative和informative引用
    actions:
    - type: mandatory
      step: 标准间引用必须分normative(必须遵守违反=违反本标准)和informative(仅供参考违反≠违反本标准)两类；冲突时按arbitration字段判定
    prohibitions: []
  ps_std_005_exception:
    title: 蓝图架构标准异常豁免机制
    section_type: rule
    original_rules:
    - PS-STD-005 §13
    summary: 适用于临时性违反——如1过渡期内暂时无法升级既存蓝图frontmatter的情况；瞬态豁免+建设豁免+失效条件
    exception_levels:
    - level: 瞬态豁免
      definition: 1既有蓝图不强制立即声明belongs_to
      trigger: 现有蓝图>20份且Owner判断立即声明成本过高
      approval: 本声明即可——Owner已知
    - level: 建设豁免
      definition: 目录迁移中允许暂时存在双目录(旧目录+新目录)
      trigger: 目录迁移过程中必须不能一次切换
      approval: Owner口头批准
    failure_conditions:
    - condition: 本标准发布后experimental结束时(任务系统v0.3.0升级完成+GateEngine G7完整度门禁激活)
      requirement: 所有既存蓝图MUST已声明belongs_to
      effect: 瞬态豁免自动失效
    conditions:
    - type: trigger
      check: 临时性违反本标准时
      pass: 按豁免级别匹配审批要求
      fail: 跳过豁免流程直接违反
    actions:
    - type: mandatory
      step: 豁免必须匹配级别(瞬态/建设)+触发条件+审批要求；experimental结束时所有既存蓝图MUST已声明belongs_to届时瞬态豁免自动失效
    prohibitions:
    - 永久豁免(应修改标准而非永久豁免)
    - 跳过审批流程直接违反
  ps_std_005_ai_consumable:
    title: 蓝图架构标准AI可消费性声明
    section_type: context
    original_rules:
    - PS-STD-005 §14
    summary: AI可理解性+AI上下文预算+AI工具兼容性——全文Markdown+YAML对照表AI可直接消费无需额外推理
    consumability_status:
      semantic_clarity: MUST/SHOULD/MAY精确使用所有约定有对照表
      context_self_contained: 不需要读外部文档即可执行目录创建和ID生成
      example_sufficiency: 每项规则覆盖目录创建和ID生成
      token_estimate: 约3000 tokens
      minimum_required_reading: §3+§4+§5(ID命名)+§7(定位)+§9(归属映射)——约1200 tokens
      ai_tool_compatibility: 全文Markdown+YAML对照表——AI可直接消费无需额外推理
    conditions:
    - type: trigger
      check: AI消费本标准时
      pass: 语义无歧义+上下文自足+示例充分
      fail: AI产生幻觉或偏离
    actions:
    - type: mandatory
      step: 标准文档必须声明AI可理解性(语义无歧义/上下文自足/示例充分)+AI上下文预算(Token估算/最小必读/按需加载)+AI工具兼容性
    prohibitions: []
  ps_std_005_completeness_checklist:
    title: 蓝图架构标准完整性自检清单
    section_type: verification
    original_rules:
    - PS-STD-005 §15
    summary: 13项完整性自检清单——SHOULD(可选)不具备独立验证力(对比PS-STD-002 §18)
    checklist_items:
    - item: §1目的与范围——目的+责任范围(管什么)+责任边界(不管什么)
      status: pass
    - item: §2 SSoT声明——真源/非真源表格+以本标准为准
      status: pass
    - item: §3主体内容——三级金字塔完整定义(Level 0/1/2属性+职责+条件)
      status: pass
    - item: §4目录结构约定——整体目录树+命名规则表
