    impact_on_rules:
    - "变更分级基于声明属性（stability+scope）推导，属性来源PS-STD-004"
    - "P0变更（frozen文件）Owner必须手动执行，AI禁止操作"
    - "废弃级联影响≥5个文件时需Owner批准"
    key_decisions:
    - "archived不是独立状态——deprecated满6个月后执行文件物理迁移，status字段保持deprecated不变"
