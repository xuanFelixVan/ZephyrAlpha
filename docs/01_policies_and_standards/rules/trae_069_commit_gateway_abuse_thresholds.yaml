    adjudication: '#ARCH-PREVENTABILITY-LAYER-001 Phase 3 (P3-0/P3-6/P3-1)'
    notes: >-
      P3-0: AdaptiveThreshold 双模式扩展（PROBABILITY + COUNT），static_floor 强制下限。
      P3-6: 7d baseline 持久化到 .runtime/abuse_monitor/abuse_baseline.json。
      P3-1: 接入 AdaptiveThreshold，有效阈值 = max(adaptive, static)。
      阈值数值未变更（仍是 warn_only=50, emergency=5, allow_overlap=30, forged=3, non_gw=10），
      本次仅启用自适应计算层（基于 7d EWMA 基线动态调整，但受 static_floor 下限约束）。
