sections:
  symbol_convention:
    section_type: procedure
    title: Symbol 约定铁律（裸码 symbol + exchange 列 + 派生 symbol_canonical）
    original_rules:
    - RULE-SYMBOL
    - ARCH-DATA-SYMBOL-001
    conditions:
    - type: trigger
      check: 任何 securities 表（kline/tick/nav/list/index/futures/option 等）的 DDL 建表或 provider 写入
      pass: symbol 列存裸码 + exchange 列填交易所码 + symbol_canonical 派生为 {symbol}.{exchange}
      fail: symbol 列混入后缀(.SZ)/前缀(sh) → 跨表 JOIN 零匹配或裸码碰撞 → 静默数据断裂
    - type: constraint
      check: 跨表 JOIN 的标的身份键
      pass: 用 symbol_canonical（MATERIALIZED 列）或 (symbol, exchange) 复合键
      fail: 仅用裸 symbol 做 JOIN → 000001 平安银行(kline_daily) 与 000001 上证指数(kline_index) 碰撞 → 股价与指数点位混合
    - type: constraint
      check: symbol 唯一性维度 = 代码 + 交易所 + 资产类别；裸码单独不唯一（已证实 stock vs index 同码冲突）
      pass: exchange 列消歧（000001.SZ 平安银行 vs 000001.SH 上证指数）；跨市场用 exchange=HK/US/CFFEX
      fail: 依赖裸码格式差异（6位A股 vs 5位港股）消歧 → 不可靠且无法区分同市场 stock/index
    actions:
    - type: mandatory
      step: '三字段语义定义: 【symbol】裸码，纯数字/字母代码，禁止含 "." 或交易所前缀（如 159865/000001/AAPL/IF2510）。【exchange】交易所码 LowCardinality(String)，A股 SH/SZ/BJ、港股 HK、美股 US、期货 CFFEX/SHFE/CZCE/DCE/INE/GFEX、指数 SH/SZ（与股票同码不同 exchange 区分，如 000001.SH=上证指数 vs 000001.SZ=平安银行）。【symbol_canonical】派生字段 = concat(symbol,".",exchange)，如 159865.SZ/000001.SH/IF2510.CFFEX，作为跨表 JOIN 的 canonical 身份键'
    - type: mandatory
      step: '历史数据零改写原则: 禁止全量 ALTER UPDATE 把 19.5B 行裸码（tick_data 14.5B + kline_1min 3.9B 等）改写为后缀——物理不可行且阻塞热表。改用"保留裸码 symbol + ADD COLUMN exchange MATERIALIZED multiIf(前缀推导) + ADD COLUMN symbol_canonical MATERIALIZED"达成等价消歧，零回填（MATERIALIZED 惰性求值，历史 part 读取时自动派生）'
    - type: mandatory
      step: '#ARCH-DATA-SYMBOL-002 推翻 market_type 复用：实测 market_type 是 asset_class（stock/index/sector/etf/cb/lof）非交易所码，覆写破坏正交维度（INV-005）。改为 ADD COLUMN exchange LowCardinality(String) MATERIALIZED multiIf(前缀推导) 对所有证券表统一零回填。三层策略：Tier-1（A股前缀可推导，~49表）MATERIALIZED multiIf；Tier-2（市场隐含 HK/US，~4表）MATERIALIZED 常量；Tier-3（期货/期权，~6表）普通列 DEFAULT "" provider 写入。market_type 列不动（asset_class 语义保护）'
    - type: mandatory
      step: 'universal MATERIALIZED 表达式兼容带后缀 symbol：splitByChar(".", symbol)[1] 提取裸码推导 exchange，symbol_canonical 用 if(position(symbol,".")>0, symbol, concat(symbol,".",exchange)) 保留原后缀。带后缀 symbol（如 588000.SH）无需归一，表达式自动兼容——零数据改写（TRAE-082 1.1.0 universal）'
    - type: mandatory
      step: 'provider 写入路径: A股 provider 零改（exchange MATERIALIZED 自动派生，get_insert_columns 排除 MATERIALIZED 列）；仅 Tier-3 期货/期权 provider 需写 exchange 列（CFFEX/SHFE/CZCE/DCE/INE/GFEX）。禁止任何 provider 向 symbol 列写入含 "." 的值'
    - type: mandatory
      step: 'symbol_canonical MATERIALIZED 列（替代 v_{table} 视图族）：每张 securities 表 ADD COLUMN symbol_canonical String MATERIALIZED if(position(symbol,".")>0, symbol, concat(symbol,".",exchange))。消费者跨表 JOIN 直接用 symbol_canonical 列，无需建视图——维护面降 90%（TRAE-082 1.1.0 #ARCH-DATA-SYMBOL-002）'
    - type: mandatory
      step: 'commit gate（注册到 CommitGateRegistry）: lint 校验①securities 表 symbol 列样本不含 "." ②exchange 列非空 ③新表 DDL 必含 exchange 列。verify_schema_truth.py 增校验所有 securities 表含 exchange 列。防回退'
    - type: forbidden
      step: '禁止: symbol 列含交易所后缀（.SZ/.SH/.BJ/.HK）——后缀只允许出现在派生字段 symbol_canonical'
    - type: forbidden
      step: '禁止: symbol 列含交易所前缀（sh/sz/bj）——lof_list 旧格式须归一为裸码+exchange'
    - type: forbidden
      step: '禁止: 跨表 JOIN 仅用裸 symbol 做身份键——000001 在 kline_daily(平安银行) 与 kline_index(上证指数) 碰撞已证实，必须用 symbol_canonical 或 (symbol,exchange) 复合键'
    - type: forbidden
      step: '禁止: 全量改写历史裸码数据为后缀——tick_data 14.5B/kline_1min 3.9B 行物理不可行；须用派生替代'
    - type: forbidden
      step: '禁止: 新建 securities 表 DDL 不含 exchange 列——架构债务，须在 DDL 阶段就含 exchange LowCardinality(String)'
    invariants:
    - id: SYMBOL-INV-001
      title: symbol 裸码纯净性
      description: securities 表的 symbol 列只存裸码（纯代码，无 "." 无前缀），后缀仅存在于派生字段 symbol_canonical
      enforcement: commit gate lint + verify_schema_truth.py + provider 写入路径强约束
      violation_action: reject_write
    - id: SYMBOL-INV-002
      title: exchange 列必填
      description: 所有 securities 表必含 exchange 列且非空，作为 symbol_canonical 派生源与跨市场消歧依据
      enforcement: DDL 校验 + ADD COLUMN MATERIALIZED 补齐 + verify_schema_truth.py 零漂移校验
      violation_action: reject_write
    - id: SYMBOL-INV-003
      title: symbol_canonical 派生唯一性
      description: symbol_canonical = concat(symbol,".",exchange) 是跨表 JOIN 的 canonical 身份键，单字段唯一标识全球任一可交易标的（000001.SZ 平安银行 vs 000001.SH 上证指数 vs 00001.HK 长江）
      enforcement: MATERIALIZED 列 + 消费者 JOIN 规范
      violation_action: reject_change
    - id: SYMBOL-INV-004
      title: 历史数据零破坏
      description: 治本不依赖历史裸码数据物理改写；exchange + symbol_canonical 均为 MATERIALIZED 列（ADD COLUMN，零回填），历史裸码 symbol 原样保留
      enforcement: 禁止大表 ALTER UPDATE 后缀化
      violation_action: reject_change
    migration:
      current_state: '三套约定并存——kline_*/tick_data(miniqmt,裸码,~19.5B行)、etf_nav/etf_list(akshare,带后缀,~7K行)、lof_list(akshare,前缀式,361行)。已证实 000001 在 kline_daily(平安银行) 与 kline_index(上证指数) 裸码碰撞'
      target_state: '统一 symbol(裸码)+exchange(列)+symbol_canonical(派生)。等价达成"带后缀 canonical"消歧目标，零历史改写'
      phases:
      - '阶段0 SSoT登记: 本规则文件 + #ARCH-DATA-SYMBOL-001/#ARCH-DATA-SYMBOL-002 议题 + depgraph 设计态 symbol_normalizer 模块'
      - '阶段1 DDL 落地（已完成 2026-07-30）: apply_exchange_columns.py ADD COLUMN exchange+symbol_canonical MATERIALIZED，三层策略(Tier-1/2/3)，零回填；82表部署(60 c1_market + 22 c3_fundamental)+碰撞消歧验证通过；schemas/categories/*.py DDL-as-Code 同步+verify_schema_truth.py 零漂移(94表0漂移)'
      - '阶段2 universal 表达式+provider 适配（已完成 2026-07-30）: _bare() 扩展 replaceRegexpAll 去字母前缀(sh/sz/bj/hk)兼容三种 symbol 格式；全部 53 Tier-1/2 表升级新表达式；futures_position 迁移 MATERIALIZED→regular(Tier-3 修正)；verify_exchange_coverage.py 创建(大表采样优化)；数据质量清洗(垃圾symbol DELETE+字母前缀归零回填治本)；c3_fundamental 22表补 exchange+symbol_canonical；契约视图取消(MATERIALIZED 列直接替代，维护面降90%)'
      - '阶段3 消费者迁移+门禁（已完成 2026-07-30）: GATE-SYMBOL-CONVENTION commit gate lint 注册(.pre-commit-config.yaml)；lint_symbol_convention.py 静态校验所有 securities 表 DDL 含 exchange+symbol_canonical 列；A股 provider 零改(get_insert_columns 排除 MATERIALIZED)；Tier-3 provider 写 exchange 待后续(provider 适配专项)'
      - '阶段4 验证: 000001.SZ vs 000001.SH 不再冲突; kline_etf_daily⋈etf_nav on symbol_canonical 非空; 138+测试回归'
      industry_benchmark: 'tushare ts_code(000001.SZ 后缀,中国量化事实标准) + ISO 10383 MIC(市场标识须随标的同行) + qlib(裸码+exchange列) + vnpy(跨市场统一接口)。本规则 = tushare 三列共存模型的等价实现(symbol裸码/ts_code=symbol_canonical/exchange)'
      reasoning: '用户战略直觉(带后缀跨市场不歧义)正确且为治本所需——裸码碰撞今天已发生。但 19.5B 行历史裸码(tick_data 14.5B+kline_1min 3.9B)物理改写不可行。故采纳"裸码 symbol + ADD COLUMN exchange MATERIALIZED + symbol_canonical MATERIALIZED"——结果与"统一到带后缀"等价(跨市场消歧+stock/index消歧),成本从重建数仓降至 ADD COLUMN MATERIALIZED（零回填零视图,TRAE-082 1.1.0 #ARCH-DATA-SYMBOL-002）'
enforcement:
  paired_gate_id: null
  type: doc
  executors:
  - human_review
  - ai_pre_action_check
  - commit_gate_lint
  bypass_allowed: false
  pairing_note: '配套硬阻断 commit gate GATE-SYMBOL-CONVENTION（校验 symbol 列裸码纯净+exchange 非空+新表 DDL 含 exchange 列）在阶段3 落地，届时 paired_gate_id 从 null→GATE-SYMBOL-CONVENTION。当前阶段0-2 为君子协定，由 verify_schema_truth.py 增量校验兜底'
