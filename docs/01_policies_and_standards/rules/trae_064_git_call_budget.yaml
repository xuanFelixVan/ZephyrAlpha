rule_id: TRAE-064
title: Git 调用预算铁律（ARCH-GIT-CALL-BUDGET）
version: '1.0.0'
layer: L1_foundation
module_id: TRAE-064
depends_on:
- TRAE-054
tags:
- TRAE
- git_call_budget
- L1_foundation
- git_subprocess
- performance
- crash_prevention
ttl: permanent
stability: evolving
safety_level: H
ai_autonomy: immutable_core
aliases:
- RULE-GIT-CALL-BUDGET
- Git调用预算
- ARCH-GIT-CALL-BUDGET
severity: critical
scope: git_subprocess_budget
domain: TRAE
triggers:
- operation: git_subprocess_call
- operation: session_worktree_commit
- operation: session_worktree_merge
- operation: commit_gate_check
- operation: reconciler_execution
sections:
  git_call_budget:
    section_type: procedure
    title: Git 调用预算铁律（ARCH-GIT-CALL-BUDGET）
    original_rules:
    - RULE-GIT-CALL-BUDGET
    conditions:
    - type: trigger
      check: 任何调用 git 子进程（subprocess.run(["git", ...])）的操作
      pass: 按预算表控制调用频率，批量化替代逐文件调用
      fail: 逐文件 git 调用（N 文件 = N subprocess）→ git.exe 崩溃放大源
    - type: constraint
      check: git 是昂贵外部资源，Windows 上每次 subprocess.run(["git",...]) 成本 ~50-100ms + fscache/fsmonitor 初始化开销
      pass: 用 GitCommandBatcher 批量化（1 次 git archive 替代 N 次 git show）
      fail: 逐文件调用在 14 万文件工作区 + fscache/fsmonitor 路径上是 git.exe 2.48.x 崩溃（0xc0000005 @ 0x13e4d4）的放大源
    actions:
    - type: mandatory
      step: '铁律1: 任何循环内禁止直接调用 subprocess.run(["git", ...])（N 文件 = N subprocess）。MUST 用 GitCommandBatcher 批量化（git_show_batch / git_diff_cached_names / git_ls_files_tracked）'
    - type: mandatory
      step: '铁律2: 可信内部模块（session_worktree / GitCommitGateway）的 git 子进程调用 MUST 设置 ZEPHYR_GIT_GUARD_FAST_PATH=1 env，跳过 git_guard alias 拦截的 ls-files 扫描'
    - type: mandatory
      step: '铁律3: 仓库级 .git/config MUST 锁定 core.fscache=false + core.fsmonitor=false（git 2.48.x 崩溃路径）'
    - type: mandatory
      step: '铁律4: AI session 启动时 MUST 运行 git_health_smoke.py 健康度检查，fail 时 escalate 而非静默 workaround'
    - type: mandatory
      step: '铁律5: GIT-CALL-BUDGET gate 检测 staged .py 中 subprocess.run(["git",...]) 在循环内调用，warn-only（P2），P3 升级 block'
    - type: forbidden
      step: '禁止: 在 for/while 循环内直接调用 subprocess.run(["git", ...])——逐文件 git 调用是崩溃放大源'
    - type: forbidden
      step: '禁止: 在仓库级 .git/config 启用 core.fscache=true 或 core.fsmonitor=true——git 2.48.x 崩溃路径'
    - type: forbidden
      step: '禁止: AI 遇到核心工具报错时 silently workaround——MUST 上报（escalate）'
    - type: forbidden
      step: '禁止: 绕过 GitCommandBatcher 用 N 次 git show 获取 N 个文件内容——MUST 用 git_show_batch（1 次 git archive）'
    invariants:
    - id: GIT-BUDGET-INV-001
      title: 循环内 git 调用禁止
      description: 任何 for/while 循环内禁止直接调用 subprocess.run(["git", ...])。MUST 用 GitCommandBatcher 批量化（1 次 git archive 替代 N 次 git show）
      enforcement: GIT-CALL-BUDGET gate（warn-only P2, block P3）AST 检测 subprocess.run(["git",...]) 在 For/While 体内
      violation_action: warn_p2_block_p3
    - id: GIT-BUDGET-INV-002
      title: 批量化强制
      description: 获取 N 个文件内容 MUST 用 GitCommandBatcher.git_show_batch（git archive --format=tar），禁止 N 次 git show。获取 staged/diff/tracked 文件名 MUST 用对应的批量方法
      enforcement: GIT-CALL-BUDGET gate AST 检测 + 代码审查
      violation_action: warn_p2_block_p3
    - id: GIT-BUDGET-INV-003
      title: Fast-path 授权
      description: 可信内部模块（session_worktree / GitCommitGateway）的 git 子进程调用 MUST 设置 ZEPHYR_GIT_GUARD_FAST_PATH=1 env，使 git_guard.py 跳过 alias 拦截的 ls-files 扫描
      enforcement: 代码审查 + git_guard.py _is_fast_path_authorized 检查
      violation_action: warn
    - id: GIT-BUDGET-INV-004
      title: fscache/fsmonitor 仓库级锁定
      description: 仓库级 .git/config MUST 锁定 core.fscache=false + core.fsmonitor=false。git 2.48.x 的 fscache/fsmonitor 代码路径是 0xc0000005 崩溃的触发点
      enforcement: git_health_smoke.py 检测 + 人工审查
      violation_action: reject_change
    - id: GIT-BUDGET-INV-005
      title: AI session 启动 smoke test
      description: AI session 启动时 MUST 运行 git_health_smoke.py，检测 git 版本/fscache/fsmonitor/status 计时/alias 状态。fail 时 MUST escalate 而非静默 workaround
      enforcement: AGENTS.md 规则 + session_worktree_start 可选调用
      violation_action: warn
    implementation_status:
      title: ARCH-GIT-CALL-BUDGET 建设阶段落地状态
      description: |
        跟踪 P0-P3.5 各建设阶段的实际落地状态与 commit hash。SSoT——其他文档
        （capability_canonical_file_registry.yaml / full_project_tree_zh.md）引用本节为准。
        2026-07-19 架构裁定（第一性原理 + Web 调研）：
        - git 2.48.x 崩溃真实根因是 MSYS2/Cygwin FAST_CWD 指针计算失效（msys2-runtime#86 修复于 2.49.0），
          fscache/fsmonitor 只是崩溃放大器（触发 fork+pipe-back-to-parent 代码路径）而非根因。
        - P3.1/P3.4 基于错误假设（fscache/fsmonitor 是根因），裁定为 cancelled。
        - 新增 P3.5 stale worktree 清理治本（调研中发现的真实运维债务）。
      last_updated: "2026-07-19"
      phases:
      - phase: P0
        title: 铁律定义 + git_health_smoke.py 健康度检查基础
        status: landed
        commit: cb2cf154f2
        date: "2026-07-19"
      - phase: P1
        title: GitCommandBatcher 批量化工具 + ZEPHYR_GIT_GUARD_FAST_PATH env（可信内部模块跳过 git_guard alias 拦截）
        status: landed
        commit: cb2cf154f2
        date: "2026-07-19"
      - phase: P2.1
        title: fscache/fsmonitor 仓库级锁定（.git/config core.fscache=false + core.fsmonitor=false）
        status: landed
        commit: cb2cf154f2
        date: "2026-07-19"
      - phase: P2.2
        title: GIT-CALL-BUDGET gate（warn-only P2，AST 检测循环内 subprocess.run(["git",...])；P3 升级 block）
        status: landed
        commit: cb2cf154f2
        date: "2026-07-19"
      - phase: P2.3
        title: BatchedAutoCommitter reconciler 批量 auto-commit（post-commit 多 reconcilers 合并 1 次 commit）
        status: landed
        commit: 867defaec9
        date: "2026-07-19"
      - phase: P3.1
        title: node_modules 排除（fsmonitor 扫描优化）
        status: cancelled
        reason: |
          范畴错误（category error）——前提假设"fsmonitor 是根因"已被推翻。
          第一性原理调研（2026-07-19）：git 2.48.x 崩溃真实根因是 MSYS2/Cygwin
          FAST_CWD 指针计算失效（msys2-runtime#86 修复于 2.49.0），fsmonitor 只是
          fork+pipe-back-to-parent 代码路径上的崩溃放大器，且铁律3已将 fsmonitor 锁定
          为 false。在 fsmonitor 禁用的前提下，"排除 node_modules" 无可优化对象。
          且本项目无 node_modules 目录（.gitignore 已排除 .aidrafts/sess-*/、
          __pycache__/、.venv/ 等），git status 实测 0.16s（60x 低于 warn 阈值）。
          无问题可治，裁定 cancelled。
        date: "2026-07-19"
      - phase: P3.2
        title: git_health_smoke.py AI session 启动健康度 smoke test（git 版本/fscache/fsmonitor/status 计时/alias 状态）
        status: landed
        commit: cb2cf154f2
        date: "2026-07-19"
      - phase: P3.3
        title: WorktreePool 预创建池（git worktree move 重定位 .aidrafts_pool/→.aidrafts/{sid}/，消除 session 启动 git worktree add 开销）
        status: landed
        commit: a2c6d92874
        followup_commit: 97e4fbec0c
        followup_note: Windows 文件锁重试（antivirus/search indexer 句柄占用 git worktree move，3 次重试 0.5s 间隔）
        date: "2026-07-19"
      - phase: P3.4
        title: git fsmonitor--daemon 替代方案（PoC 探索）
        status: cancelled
        reason: |
          同源崩溃路径——fsmonitor--daemon 与已禁用的 fsmonitor 共享 fork+pipe-back-to-parent
          代码路径（FAST_CWD 崩溃热点），重新启用等于撤销 P0 已消除的放大路径。
          第一性原理调研（2026-07-19）：
          - 真实根因是 MSYS2/Cygwin FAST_CWD（msys2-runtime#86，2.49.0 修复），非 fsmonitor。
          - 当前无性能问题：git status 实测 0.16s（warn 阈值 10s 的 1/60）。
          - fsmonitor--daemon 与 worktree 快速生命周期不兼容：每个 worktree 需独立 daemon，
            20 个 stale worktree = 20 个孤儿 daemon，运维负担不可接受。
          - fsmonitor--daemon 要求 core.untrackedcache=true，否则在 20 万+ 文件仓库上
            反而拖慢 git status（Tao Klerks 报告）。
          裁定 cancelled——若未来升级到 git 2.50.1+ 后确认无 FAST_CWD 残留风险，且
          untrackedcache 已验证，可重新立项（届时作为新 phase 而非复活 P3.4）。
        date: "2026-07-19"
      - phase: P3.5
        title: Stale worktree 清理治本（增强 _branch_commits_superseded + age-based 强制清理）
        status: planned
        reason: |
          调研中发现的真实运维债务（非 P3.1/P3.4 范畴错误）。当前 .aidrafts/ 下
          20 个 worktree 但 registry 仅 4 个 session（0 active），134,962 文件
          占项目 91%。session_worktree_sweep 报 swept=0——_branch_commits_superseded
          过于保守（检测到 unmerged commit 即跳过清理，即使这些 commit 已被
          其他路径 supersede）。治本方案：
          1. 增强 _branch_commits_superseded：用 cherry-tracking 判定 commit 是否
             已通过其他分支合入主仓（cherry-detected = superseded）。
          2. age-based 强制清理：worktree 创建超过 N 天且 session 未注册 → 标记
             stale，sweep 时强制清理（移送到 .runtime/orphan_quarantine/<sid>/，
             保留 72h 后物理删除，可逆操作）。
          3. 新增 git_performance_monitor reconciler（Phase 4）：持续监控 git status
             计时，stale worktree 累积超阈值时早期预警。
        date: "2026-07-19"
enforcement:
  paired_gate_id: "GIT-CALL-BUDGET"  # Phase 3.5 规则-执行配对
