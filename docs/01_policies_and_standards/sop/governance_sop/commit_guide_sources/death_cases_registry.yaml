entry_schema:
  case_id: string (required, unique)
  symptom: string (required) — 你看到什么（死信文案特征）
  gate: string (required) — 关联门禁
  root_cause: string (required) — 机制
  prescription: string (required) — 怎么修（可直接执行）
  cost_note: string (optional) — 实测成本
  evidence: list (optional) — qid/commit 证据
cases:
  - case_id: DEATH-001-TOKEN-MISSING
    symptom: "无 creation_token，禁止造第二真源"
    gate: CREATE-GUARD
    root_cause: 新文件未登记 token（队列 gate 读 HEAD 名册，盘面登记未落地=无）
    prescription: "batch_creation_tokens.py --prefix <目录> --created-by <sid> --capability <名> --merge-evaluation \"<四判据一句话>\"；token 与内容同批原子或 token 批先行独立批"
    cost_note: "P50 14.1min/封，112 封中 13 封"
    evidence: [q-20260923-st-cleaninv-20260923-0007]
  - case_id: DEATH-002-BASENAME-COLLISION
    symptom: "新文件与已有文件 basename 碰撞（第二函数面）"
    gate: CREATE-GUARD
    root_cause: basename 碰撞检测有两条函数面，只豁免修复其一=盲发重发连死
    prescription: "对照两处检查函数确认豁免面（basename==__init__.py）后重发；盲发重发=白死（0058/59/60 连三实证）"
    evidence: [chainpile-0058, chainpile-0059, chainpile-0060]
  - case_id: DEATH-003-R5-DIGIT-DIR
