# 回测配置模板
# Backtest Configuration Template
# 版本: v1.0
# 创建日期: 2026-04-02

# ============================================
# 回测基本信息
# ============================================

backtest:
  id: "BT_001"                        # 回测ID
  name: "动量策略回测"                 # 回测名称
  strategy_id: "S001"                 # 关联策略ID
  version: "1.0.0"                    # 配置版本

  created_at: "2026-04-02"
  updated_at: "2026-04-02"

# ============================================
# 时间配置
# ============================================

time:
  # 回测时间范围
  start_date: "2020-01-01"
  end_date: "2025-12-31"

  # 数据频率
  frequency: "1d"                     # 1d, 1h, 5m, 1m

  # 时区
  timezone: "America/New_York"

  # 交易日历
  trading_calendar: "NYSE"            # NYSE, NASDAQ, SHSE

# ============================================
# 资金配置
# ============================================

capital:
  # 初始资金
  initial_capital: 1000000

  # 资金货币
  currency: "USD"

  # 资金调整
  adjustments:
    dividend: true                    # 是否考虑分红
    split: true                       # 是否考虑拆股

# ============================================
# 交易成本配置
# ============================================

costs:
  # 手续费
  commission:
    type: "percentage"                # percentage, fixed, tiered
    value: 0.001                      # 0.1%
    min_commission: 1.0               # 最小手续费

  # 滑点
  slippage:
    type: "percentage"                # percentage, fixed
    value: 0.0005                     # 0.05%

  # 印花税（中国市场）
  stamp_tax:
    enabled: false
    rate: 0.001

  # 其他成本
  other_costs:
    exchange_fee: 0.00001             # 交易所费用
    clearing_fee: 0.00002             # 清算费用

# ============================================
# 数据配置
# ============================================

data:
  # 数据源
  source:
    type: "local"                     # local, database, api
    path: "data/market_data.parquet"  # 本地数据路径

  # 数据字段
  fields:
    - "open"
    - "high"
    - "low"
    - "close"
    - "volume"
    - "adj_close"

  # 数据质量检查
  quality_check:
    enabled: true
    check_missing: true               # 检查缺失值
    check_outliers: true              # 检查异常值
    fill_method: "ffill"              # 填充方法: ffill, bfill, interpolate

# ============================================
# 策略配置
# ============================================

strategy:
  # 策略文件路径
  module: "strategies.momentum_strategy"
  class: "MomentumStrategy"

  # 策略参数
  parameters:
    fast_period: 10
    slow_period: 30
    stop_loss: 0.02
    take_profit: 0.03

  # 策略预热期
  warmup_period: 30                   # 策略预热期（天数）

# ============================================
# 风控配置
# ============================================

risk_management:
  # 仓位限制
  position_limits:
    max_position_pct: 0.95            # 单个标的最大仓位
    max_positions: 10                 # 最大持仓数量
    min_position_pct: 0.01            # 最小仓位

  # 风险限制
  risk_limits:
    max_daily_loss: 0.05              # 最大日损失
    max_drawdown: 0.15                # 最大回撤
    max_leverage: 1.0                 # 最大杠杆

  # 行业限制
  sector_limits:
    enabled: false
    max_sector_exposure: 0.30         # 最大行业敞口

# ============================================
# 基准配置
# ============================================

benchmark:
  # 基准标的
  symbol: "SPY"                       # S&P 500 ETF

  # 基准数据源
  source:
    type: "local"
    path: "data/benchmark/SPY.parquet"

  # 比较指标
  comparison_metrics:
    - "total_return"
    - "annual_return"
    - "sharpe_ratio"
    - "max_drawdown"
    - "win_rate"

# ============================================
# 输出配置
# ============================================

output:
  # 输出目录
  directory: "output/backtest/BT_001"

  # 输出文件
  files:
    trades: true                      # 交易记录
    equity_curve: true                # 权益曲线
    positions: true                   # 持仓记录
    metrics: true                     # 绩效指标

  # 报告生成
  report:
    enabled: true
    format: "html"                    # html, pdf, markdown
    template: "standard"              # standard, detailed, summary

  # 图表生成
  charts:
    enabled: true
    equity_curve: true                # 权益曲线图
    drawdown: true                    # 回撤图
    returns: true                     # 收益分布图
    positions: true                   # 持仓变化图

# ============================================
# 性能配置
# ============================================

performance:
  # 并行处理
  parallel:
    enabled: true
    num_workers: 4                    # 并行工作进程数

  # 内存优化
  memory:
    chunk_size: 100000                # 数据分块大小
    gc_interval: 1000                 # 垃圾回收间隔

  # 缓存
  cache:
    enabled: true
    ttl: 3600                         # 缓存过期时间（秒）

# ============================================
# 日志配置
# ============================================

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"

  file:
    enabled: true
    path: "logs/backtest_BT_001.log"
    max_size: 10485760
    backup_count: 5

  console:
    enabled: true

# ============================================
# 验证配置
# ============================================

validation:
  # 前瞻性偏差检查
  look_ahead_bias:
    enabled: true
    strict: true

  # 幸存者偏差检查
  survivorship_bias:
    enabled: true
    delisted_data: true

  # 数据质量验证
  data_quality:
    enabled: true
    min_data_points: 252              # 最小数据点数
    max_missing_pct: 0.01             # 最大缺失比例
