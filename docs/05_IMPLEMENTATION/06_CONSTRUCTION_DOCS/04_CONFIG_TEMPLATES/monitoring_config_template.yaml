# 监控配置模板
# ZephyrAlpha量化交易系统监控配置

# Prometheus配置
prometheus:
  scrape_interval: 15s
  evaluation_interval: 15s
  
  alerting:
    alertmanagers:
      - static_configs:
          - targets:
              - localhost:9093
  
  scrape_configs:
    - job_name: 'prometheus'
      static_configs:
        - targets: ['localhost:9090']
    
    - job_name: 'node'
      static_configs:
        - targets: ['localhost:9100']
    
    - job_name: 'zephyr-api'
      static_configs:
        - targets: ['localhost:8000']
      metrics_path: '/metrics'

# AlertManager配置
alertmanager:
  global:
    resolve_timeout: 5m
    smtp_smarthost: 'smtp.example.com:587'
    smtp_from: 'alert@example.com'
    smtp_auth_username: 'alert@example.com'
    smtp_auth_password: 'password'
  
  route:
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 10s
    repeat_interval: 1h
    receiver: 'team-email'
  
  receivers:
    - name: 'team-email'
      email_configs:
        - to: 'team@example.com'
          send_resolved: true

# Grafana配置
grafana:
  admin_user: admin
  admin_password: admin
  
  datasources:
    - name: Prometheus
      type: prometheus
      url: http://localhost:9090
      access: proxy
      isDefault: true

# 告警规则
alert_rules:
  # 系统告警
  - alert: HighCPUUsage
    expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "CPU使用率过高"
      description: "CPU使用率超过80%"
  
  - alert: HighMemoryUsage
    expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "内存使用率过高"
      description: "内存使用率超过85%"
  
  - alert: HighDiskUsage
    expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "磁盘使用率过高"
      description: "磁盘使用率超过85%"
  
  # 应用告警
  - alert: HighErrorRate
    expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.1
    for: 5m
    labels:
      severity: critical
    annotations:
      summary: "API错误率过高"
      description: "API错误率超过10%"
  
  - alert: SlowResponse
    expr: rate(http_request_duration_seconds_sum[5m]) / rate(http_request_duration_seconds_count[5m]) > 1
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "API响应时间过长"
      description: "API平均响应时间超过1秒"
