# 多主播直播金融分析系统配置文件
# 硬件配置: RTX 3090 24GB + 64GB RAM + i7-12700KF
# 配置评级: 机构级配置

system:
  name: "多主播直播金融分析系统"
  version: "1.0.0"
  hardware:
    gpu: "NVIDIA RTX 3090 24GB"
    memory: "64GB"
    cpu: "i7-12700KF"
    config_level: "enterprise"  # 机构级

# 模型配置
models:
  # 语音识别模型
  whisper:
    type: "local"  # 本地部署
    model_size: "large-v3"  # RTX 3090可运行最大模型
    device: "cuda"
    language: "zh"
    options:
      fp16: true  # 使用FP16加速
      beam_size: 5  # 提高准确率
      best_of: 5
  
  # 内容分析模型（大语言模型）
  llm:
    type: "ollama"  # 使用Ollama
    model_name: "deepseek-r1:14b"  # 您已有的模型
    # 备选模型（推荐拉取）:
    # - qwen2.5:32b (金融理解最强)
    # - deepseek-r1:32b (推理能力最强)
    base_url: "http://localhost:11434"
    options:
      temperature: 0.3
      num_predict: 2000
      top_p: 0.9
      top_k: 40
  
  # 情感分析模型
  sentiment:
    type: "local"
    model_name: "yiyanghkust/finbert-tone"
    device: "cuda"
    max_length: 512

# 直播监控配置
monitor:
  check_interval: 60  # 检查间隔（秒）
  browser_type: "chrome"
  headless: true  # 无头模式
  timeout: 30  # 超时时间（秒）

# 录制配置
recorder:
  output_dir: "./recordings"
  audio_format: "mp3"
  bitrate: "128k"  # 音频比特率
  sample_rate: 44100
  segment_duration: 1800  # 分段时长（秒）30分钟
  max_duration: 7200  # 最大录制时长（秒）2小时

# 转录配置
transcriber:
  batch_size: 1  # RTX 3090可以处理大批量
  save_segments: true  # 保存分段信息
  output_format: "json"  # 输出格式

# 分析配置
analyzer:
  max_retries: 3  # 最大重试次数
  timeout: 120  # 超时时间（秒）
  save_raw_response: true  # 保存原始响应
  
  # 观点提取配置
  extraction:
    min_confidence: 3  # 最小信心度
    max_sectors: 10  # 最大板块数量
    max_stocks: 20  # 最大股票数量

# 聚合配置
aggregator:
  min_streamers: 3  # 最少主播数量
  weight_by_online_count: true  # 按在线人数加权
  weight_by_confidence: true  # 按信心度加权
  
  # 权重配置
  weights:
    online_count_factor: 0.3  # 在线人数权重
    confidence_factor: 0.4  # 信心度权重
    base_weight: 0.3  # 基础权重

# 因子生成配置
factor_generator:
  # 因子权重
  factor_weights:
    sentiment: 0.4  # 情绪因子权重
    consensus: 0.3  # 一致性因子权重
    influence: 0.2  # 影响力因子权重
    confidence: 0.1  # 信心度因子权重
  
  # 标准化配置
  normalization:
    method: "zscore"  # 标准化方法
    rolling_window: 20  # 滚动窗口

# 输出配置
output:
  result_dir: "./results"
  factor_output: "./factors"
  save_transcript: true  # 保存转录文本
  save_audio: false  # 不保存音频（节省空间）
  save_metadata: true  # 保存元数据
  
  # 输出格式
  formats:
    - "json"
    - "csv"
    - "parquet"  # 用于量化系统

# 数据库配置（可选）
database:
  enabled: false  # 暂不启用
  type: "postgresql"
  host: "localhost"
  port: 5432
  database: "live_analysis"
  user: "postgres"
  password: ""

# 日志配置
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "./logs/live_analysis.log"
  max_size: 10485760  # 10MB
  backup_count: 5

# 性能优化配置
performance:
  # GPU优化
  gpu:
    enabled: true
    device_id: 0
    memory_fraction: 0.9  # 使用90%显存
    
  # 并发配置
  concurrency:
    max_workers: 4  # 最大并发数
    batch_size: 2  # 批处理大小
    
  # 缓存配置
  cache:
    enabled: true
    type: "redis"
    host: "localhost"
    port: 6379
    ttl: 3600  # 1小时

# 告警配置
alert:
  enabled: false  # 暂不启用
  channels:
    - "dingtalk"
    - "wechat"
  thresholds:
    disk_space: 10  # 磁盘空间不足10GB告警
    memory_usage: 90  # 内存使用超过90%告警
    gpu_memory: 95  # 显存使用超过95%告警
