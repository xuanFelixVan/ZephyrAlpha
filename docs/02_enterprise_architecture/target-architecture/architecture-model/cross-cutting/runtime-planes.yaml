schema_version: "2.0"
partition:
  id: cross-cutting-runtime-planes
  name: Runtime Planes
  description: Hot/Warm/Cold 运行平面标注（来源：04bis-runtime-planes.md v1.0.0，ADR-0011 accepted）
  source_view: 04bis-runtime-planes.md
  related_kb_ref: [ADR-0011]
  activation_note: >
    当前（2026-04-21）处于 Warm-only 阶段（T0）。
    Hot Path 未激活（T1 真实资金接入后首激活）。
    Cold Path 部分激活（L02 回测 / L07 归因 / L11 训练）。

planes:
  hot:
    latency_target: "< 10ms (P99)"
    latency_p50: "< 1ms"
    description: >
      交易执行核心路径。不可中断（kernel-bypass + 预分配内存）。
      事件驱动 / 固定轮询。语言：C++20 / Rust / DPDK / RDMA。
      部署：裸金属 / 物理机 / 机架同城，无 GC / 无虚拟化 / 无容器。
    activation_trigger: T1 真实资金接入
    current_status: inactive
    modules:
      - id: l04-limits
        layer: l04
        submodule: limits/
        note: pre-trade hard check（T1 激活）
      - id: l04-stop-loss
        layer: l04
        submodule: stop_loss/
        note: 毫秒级 kill switch 触发（T1 激活）
      - id: l04-monitor-hot
        layer: l04
        submodule: monitor/
        note: real-time hard monitor（T1 激活）
      - id: l06-sor
        layer: l06
        submodule: sor/
        note: smart order routing（T1 激活）
      - id: l06-adapters-hot
        layer: l06
        submodule: adapters/*_hot.py
        note: 券商直连（T1 激活）
      - id: l10-security-gateway  # hot_adjacent
        layer: l10
        submodule: ai_security/security_gateway
        note: AISG security_gateway，< 50ms 目标（Hot-adjacent）
      - id: shared-runtime-plane-tag
        layer: shared
        submodule: contracts/runtime_plane_tag.py
        note: 枚举定义，所有平面共用契约
    t3_additional_modules:
      - l00-connectors-hot
      - l03-signals-hot
      - l11-serving-hot
      - l12-metrics-hot
    sla:
      latency_p50_ms: 1
      latency_p99_ms: 10
      throughput_min: "100k msg/s"
      availability_percent: 99.99
      failure_impact: 资金直接损失（订单错过 / 风控失守）
    tech_stack:
      languages: [C++20, Rust, C]
      runtime: 裸金属 / 物理机
      ipc: [Aeron, LMAX Disruptor, ZeroMQ, RDMA]
      storage: Shared Memory Ring Buffer / mmap files
      concurrency: lock-free ring buffers / SPSC queue
      gc: 禁止（预分配 / arena allocator）
      scheduling: CPU亲和 / NUMA感知 / 大页内存

