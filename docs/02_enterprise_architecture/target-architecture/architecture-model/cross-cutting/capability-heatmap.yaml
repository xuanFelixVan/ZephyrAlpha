schema_version: '2.0'
partition:
  id: cross-cutting-capability-heatmap
  name: Capability Maturity Heatmap
  description: '能力成熟度热力图（来源：04ter-capability-heatmap.md v1.0.0，ADR-0012 accepted）。 五档成熟度：L0 Missing / L1 Designed / L2 Drafted / L3 Usable / L4 Production / L5 Leading。 对标：Goldman Sachs Enterprise Architecture
    Capability Dashboard / BlackRock Aladdin Capability Heatmap / Gartner IT Capability Framework (CMMI-aligned)。

    '
  source_view: 04ter-capability-heatmap.md
  related_adr:
  - ADR-0012
  baseline_date: '2026-05-03'
  review_cadence: quarterly
  overall_maturity_score: 1.12
  overall_maturity_level: L1
  score_calculation_method: '加权平均法：14层 × 10能力域（C1~C7 业务域 + CC1~CC3 横切域）。 业务域权重：C1数据0.20 / C2因子0.20 / C3风控0.25 / C4组合0.15 / C5执行/交易后0.10 / C6 ML/AI平台0.05 / C7治理/合规0.05。 横切域（CC1人机交互/CC2可观测性/CC3 AI自治）不参与总分计算，单独评估。
    每域成熟度 = 该域内所有层评分的算术平均。总分 = Σ(各业务域成熟度 × 域权重)。当前 1.12 对应 L1（Designed 已设计但无代码）。

    '
  overall_assessment: '架构蓝图已 95% 锁定，代码施工刚起步。 外部评审 89/100 分——架构设计完整度领先 + 代码实现刚开始。

    '
maturity_scale:
  L0:
    name: Missing
    color: '#e5e7eb'
    symbol: ⚪
    description: 能力完全不存在，无代码/无文档/无ADR
  L1:
    name: Designed
    color: '#bfdbfe'
    symbol: 🔵
    description: 有ADR/有架构视图/有canonical设计稿，无代码
  L2:
    name: Drafted
    color: '#fde68a'
    symbol: 🟡
    description: 有代码原型/skeleton目录/部分模块stub级实现
  L3:
    name: Usable
    color: '#86efac'
    symbol: 🟢
    description: 核心功能实现+测试覆盖≥60%+文档齐全+Sprint验证
  L4:
    name: Production
    color: '#c4b5fd'
    symbol: 🟣
    description: 真实资金/真实流量+治理三层完整覆盖+监控告警+Runbook
  L5:
    name: Leading
    color: '#fca5a5'
    symbol: 🔴
    description: 对标Goldman/JPM/Two Sigma/Citadel顶级机构业界领先实现
capability_domains:
- id: C1
  name: 数据能力
  description: Market data ingestion / quality / PIT / survivorship / lineage
  primary_layers:
  - l00
  - l01
  investment_intensity: Critical
  investment_rationale: 'ACL + Vendor Registry 架构已设计（R53），但代码层未实现； 是全链路数据来源，阻塞 C2/C4/C8（对应 BCM C01）

    '
- id: C2
  name: 因子 & 信号能力
  description: Alpha factor / sentiment / signal extraction / factor registry / IC-IR
  primary_layers:
  - l02
  - l03
  investment_intensity: Critical
  investment_rationale: '05-DA + 03-AA 已完成因子层设计；需依赖 C1 数据就绪后才能进入 L3； 是 Alpha 生成核心（对应 BCM C02）

    '
- id: C3
  name: 风控能力
  description: Pre-trade / at-trade / post-trade / VaR-CVaR / limits / stop-loss
  primary_layers:
  - l04
  investment_intensity: Critical
  investment_rationale: '03-AA §8 Fault Tolerance + Pre-trade Risk Gate 设计已完成（R55）； 代码层 L04 需实现 Circuit Breaker + Bulkhead；是交易合规的硬性门槛（对应 BCM C08）

    '
- id: C4
  name: 组合构建能力
  description: Optimization / rebalancing / backtest / strategic allocation / meta-router
  primary_layers:
  - l05
  investment_intensity: Critical
  investment_rationale: 'meta_router 架构已锁定（R35）；portfolio 优化逻辑待实现； 首个交易策略的核心路径（对应 BCM C04）

    '
- id: C5
  name: 执行 & 交易后能力
  description: OMS / SOR / execution / attribution / TCA / review
  primary_layers:
  - l06
  - l07
  investment_intensity: High
  investment_rationale: 'BrokerInterface + OMS + Idempotency Guard 设计完成（R56）； SimulationAdapter 为 P0，真实 Broker API 为 P1（对应 BCM C05）； 交易后分析仅有层定义，报告模板和分发机制待设计（对应 BCM C06，Medium）

    '
- id: C6
  name: ML / AI 平台能力
  description: Model lifecycle / training / serving / scout / experimentation
  primary_layers:
  - l11
  - l13
  investment_intensity: High
  investment_rationale: '仅有 14 层架构中 L11 的目录定义；ML 框架（Q5-3）待 ADR； 依赖 C2 因子工程成熟后激活（对应 BCM C03）

    '
- id: C7
  name: 治理 & 合规能力
  description: Compliance runtime / governance three-layer / AISG / audit trail / fitness functions
  primary_layers:
  - l10
  investment_intensity: Low
  investment_rationale: '个人阶段不激活；外部投资人/受监管基金时触发； 当前仅有层定义（对应 BCM C09）

    '
- id: CC1
  name: 人机交互 & 研究
  description: Human-AI interface / research notebooks / CLI
  primary_layers:
  - l08
  - l09
  type: cross_cutting
  investment_intensity: High
  investment_rationale: 'handoff-log / Feishu webhook / Cursor 协作已在用（partial）； AI Operator 完整 agent ops 体系（OQ-063）待激活（对应 BCM C07）； KMS 10 层目录体系已建立，持续填充中（对应 BCM C10，Medium）

    '
- id: CC2
  name: 可观测性
  description: Metrics / logs / traces / ai_behavior
  primary_layers:
  - l12
  type: cross_cutting
  investment_intensity: Medium
  investment_rationale: 'L12 三支柱 metrics/logs/traces 设计完整，无代码； T1 真实资金接入前需达 L3（无直接 BCM 对应，从 C5/C8 运维需求推导）

    '
- id: CC3
  name: AI 自治
  description: D 家族 6 系统 / ai_operator 预留口子 / decision engine
  primary_layers:
  - cross
  type: cross_cutting
  investment_intensity: High
  investment_rationale: 'archive/reorg-2026-04-24/draft-abandoned/working-designs/ai-autonomy-architecture-design.md v1.3.0 accepted（ARC-20260424-007）； D 家族 6 系统已登记，多数 ai_operator 目录预留（无代码）； AI Operator
    完整 agent ops 体系待激活（对应 BCM C07 部分）

    '
