schema_version: '2.0.0'
system:
  name: ZephyrAlpha
  description: 个人量化交易系统
  architecture_style: layered_event_driven_polyglot

# === 分区管理约定（Partition Management Convention）===
# 以下两条铁律定义了"分区"在架构模型中的生命期状态，是本次审计修复的根源性产出。
#
# 铁律 1（文件必须存在）：
#   _index.yaml 中枚举的每个 partition 必须有对应的物理 YAML 文件。
#   不允许"仅 _index.yaml 枚举而无文件"的虚分区——这会导致 CI GATE-01 失败 + 审计漂移。
#
# 铁律 2（骨架文件是合法状态）：
#   允许创建 status: planned 的骨架 YAML 文件表示"计划中但尚未激活"的分区。
#   骨架文件是最小合法内容：schema_version + partition 元数据 + 空 modules 列表 + summary。
#   "planned" 不等于"broken"——骨架文件是 TOGAF 架构渐进式填充的标准做法。
#   审计脚本不应将 status: planned 的文件报告为"缺失"或"不完整"。
#
# 大白话：
#   房产证（_index.yaml）里登记了的房间，必须真的存在（有对应的 YAML 文件）。
#   但"存在"不等于"装修好了"——毛坯房（status: planned 的骨架文件）也是合法状态。
#   不能登记了房间号但实际没有房间——这就是之前 infra/ 分区的问题，已修复。

partitions:
- id: shared
  path: layers/shared.yaml
  description: 跨层公共契约与基础能力
- id: l00
  path: layers/l00-data-source.yaml
  description: 数据接入、标准化、落库、缓存与质量门禁
- id: l01
  path: layers/l01-infrastructure.yaml
  description: 配置、日志、异常与基础运行能力
- id: l02
  path: layers/l02-alpha-factor.yaml
  description: Alpha 因子计算引擎、PIT 合规与因子库管理
- id: l03
  path: layers/l03-signal-generation.yaml
  description: 交易信号生成、策略调度与信号合成
- id: l04
  path: layers/l04-risk-management.yaml
  description: 实时风控、Kill Switch、压力测试与合规检查
- id: l05
  path: layers/l05-portfolio-construction.yaml
  description: 组合构建、权重优化与再平衡决策
- id: l06
  path: layers/l06-trade-execution.yaml
  description: 订单路由、执行引擎、Broker ACL 边界与成交管理
- id: l07
  path: layers/l07-post-trade-analytics.yaml
  description: 交易后分析、绩效归因与报告生成
- id: l08
  path: layers/l08-human-ai-interface.yaml
  description: 人机交互、API 网关、监控面板与告警通知
- id: l09
  path: layers/l09-research-innovation.yaml
  description: 研究工作台、回测框架与策略实验室
- id: l10
  path: layers/l10-governance-compliance.yaml
  description: 合规治理、审计追踪与监管报告
- id: l11
  path: layers/l11-ml-platform.yaml
  description: ML 平台、Scout Agent、战略决策与 AI 引擎
- id: l12
  path: layers/l12-system-telemetry.yaml
  description: 系统遥测、可观测性、健康检查与 SLA 监控
- id: l13
  path: layers/l13-experiment-pipeline.yaml
  description: 实验管线与 A/B 测试框架
- id: frontend
  path: frontend/frontend-model.yaml
  description: 前端独立平台 FE-L1~L4
- id: scripts
  path: scripts/scripts-model.yaml
  description: 治理/审计/部署脚本
- id: cross-cutting
  path: cross-cutting/
  description: 运行平面、不变量、能力成熟度（含 runtime-planes.yaml / invariants.yaml / capability-heatmap.yaml）
- id: contracts
  path: contracts/cross-layer-contracts.yaml
  description: P0/P1 跨层数据契约、OCP 扩展点、外部系统契约、AI 治理接口签名
- id: events
  path: events/domain-events.yaml
  description: 22 条领域事件（6 域）、事件链、频率等级与运行时声明
- id: ddd-model
  path: domain/ddd-model.yaml
  description: DDD 战术模式：8 Aggregate Root + 6 Entity + 12 Value Object + 边界铁律
- id: technology
  path: technology/
  description: >
    技术选型与版本治理 SSoT。
    Partition A — `technology-landscape.yaml`：43 项技术雷达条目（Adopt/Trial/Assess/Hold/Build 五象限 + 5 数据源 + 4 LLM 供应商）。
    Partition B — `vibe-coding-infrastructure-tech-stack.yaml`：Vibe Coding 2.0 基础设施层 6 大核心服务（LSG/CE/VMS/Orc/FLE/KB）的 17 项技术选型 + upgrade_watchboard 升级管控看板。
- id: core-services
  path: infra/core-services.yaml
  description: >
    Vibe Coding 2.0 6 大核心服务（代码位于 src/zephyr/ 根层级，架构归属 L12 跨层支撑层）。
    包含 llm_security（LSG）、vector_memory（VMS）、context_engine（CE）、orchestrator（Orc）、feedback_loop（FLE）、kb（知识库）。
    YAML 模型文件已创建（infra/core-services.yaml v2.0，status: planned），experimental 填充详细接口。
- id: shared-infra
  path: infra/shared-infra.yaml
  description: >
    跨层共享基础设施（代码位于 src/zephyr/ 根层级）。
    包含 core（蓝图分解/核心模型）、db（原子事务/OLAP引擎/任务仓储）、gates（门禁引擎/断路器等治理基础设施）、
    mcp（MCP协议服务器）、pipeline（流水线编排）。
    YAML 模型文件已创建（infra/shared-infra.yaml v2.0，status: planned），experimental 填充子模块边界。
