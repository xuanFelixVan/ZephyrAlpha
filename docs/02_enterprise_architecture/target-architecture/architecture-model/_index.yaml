query_hints:
- question: 系统有哪些层？
  answer: 14层 + shared + frontend，见 partitions 列表
- question: 某层有哪些模块？
  answer: 读对应分区 YAML，如 layers/l04-risk-management.yaml
- question: 模块间的依赖关系？
  answer: 各分区 YAML 的 modules[].interfaces 字段
- question: 为什么这样分层？
  answer: 读 L1 视图 03-application-architecture.md §2 Core Decisions
- question: 不变量/安全红线？
  answer: 读 cross-cutting/invariants.yaml
- question: 某模块的详细设计？
  answer: 读 03_modules/L{XX}/ 对应 blueprint
- question: 运行平面（Hot/Warm/Cold）分布？
  answer: 读 cross-cutting/runtime-planes.yaml
- question: 系统能力成熟度？
  answer: 读 cross-cutting/capability-heatmap.yaml
- question: 前端有哪些模块？
  answer: 读 frontend/frontend-model.yaml
- question: 治理/审计脚本有哪些？
  answer: 读 scripts/scripts-model.yaml
- question: 跨层公共契约？
  answer: 读 layers/shared.yaml
- question: 全系统概览？
  answer: 读 _index.yaml（本文件）+ README.md
- question: P0 跨层数据契约有哪些？
  answer: 读 contracts/cross-layer-contracts.yaml §p0_contracts
- question: 领域事件清单？
  answer: 读 events/domain-events.yaml，22 条事件覆盖 6 个域
- question: DDD 聚合/实体/值对象？
  answer: 读 domain/ddd-model.yaml，含 8 AGG + 6 ENT + 12 VO
- question: 技术选型全景？
  answer: 读 technology/technology-landscape.yaml（Technology Radar 风格）
- question: Vibe Coding 2.0 基础设施运行时用了什么技术栈？
  answer: 读 technology/vibe-coding-infrastructure-tech-stack.yaml（17 项选型 + upgrade_watchboard）
id_conventions:
  description: 各分区 YAML 中实体 ID 的命名前缀规范（风险 4 修复）
  prefixes:
  - prefix: CTR-{NNN}
    scope: contracts/cross-layer-contracts.yaml
    example: CTR-001
  - prefix: E-{DOMAIN}-{NN}
    scope: events/domain-events.yaml
    example: E-EX-01
  - prefix: AGG-{NNN}
    scope: domain/ddd-model.yaml — aggregate_roots
    example: AGG-001
  - prefix: ENT-{NNN}
    scope: domain/ddd-model.yaml — entities
    example: ENT-001
  - prefix: VO-{NNN}
    scope: domain/ddd-model.yaml — value_objects
    example: VO-001
  - prefix: T-{QUADRANT}{NN}
    scope: technology/technology-landscape.yaml
    example: T-A01
    note: EA Technology Radar canonical；仓库根摘要使用 IMPL-T-*，不得与 T-* 混号等价
  - prefix: IMPL-T-{QUADRANT}{NN}
    scope: architecture-model/technology-landscape.yaml（repository root）
    example: IMPL-T-A01
    note: 施工树摘要专有 ID；可选用 mirrors_ea_id 指向 EA 同义项
  - prefix: DS{NN}
    scope: technology/technology-landscape.yaml — data_sources
    example: DS01
  - prefix: LLM{NN}
    scope: technology/technology-landscape.yaml — llm_providers
    example: LLM01
  - prefix: CORE-{name}
    scope: infra/core-services.yaml — services[].id
    example: core-llm-security
    note: "Vibe Coding 2.0 核心服务使用 services[].id（如 core-llm-security），非 MOD- 前缀"
  - prefix: INFRA-{name}
    scope: infra/shared-infra.yaml — modules[].id
    example: infra-core
    note: "跨层共享基础设施使用 modules[].id（如 infra-core），非 MOD- 前缀"
