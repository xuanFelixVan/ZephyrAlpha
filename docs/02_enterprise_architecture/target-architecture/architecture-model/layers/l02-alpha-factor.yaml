        role: consumer
        description: 批量消费 NormalizedMarketData 进行历史因子回算
      - contract_id: CTR-002
        role: producer
        description: 批量生产 FactorSignal 历史序列
    adr_ref: [ADR-0005]
    plane_note: pipeline/ 全量计算 Cold；与 PIT 铁律（INV-004）强绑定

  - id: l02-registry
    name: Factor Registry
    submodule_path: src/zephyr/l02_alpha_factor/registry/
