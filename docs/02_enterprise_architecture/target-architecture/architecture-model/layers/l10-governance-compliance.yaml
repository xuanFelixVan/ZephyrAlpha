schema_version: "2.0"
partition:
  id: l10
  name: Governance & Compliance
  layer_position: 10
  runtime_plane: warm
  view_file: 03-application-architecture.md
  view_section: "§4.1 l10_compliance/"

modules:

  - id: l10-rules
    name: Compliance Rule Definitions
    submodule_path: src/zephyr/l10_compliance/rules/
    status: planned
    priority: P0
    runtime_plane: warm
    description: 合规规则定义（监管、内部政策、辖区分片）；规则库，OCP 扩展，每辖区独立规则包
    interfaces:
      - contract_id: CTR-P1-012
        role: producer
        description: 生产ComplianceRule契约，提供规则注册和评估接口
    adr_ref: [ADR-0010]

  - id: l10-validators
    name: Runtime Compliance Validators
    submodule_path: src/zephyr/l10_compliance/validators/
    status: planned
    priority: P0
    runtime_plane: warm
    description: 运行时合规校验，对照 rules/ 执行校验逻辑；pre-trade 合规拦截与运行时强制检查
    interfaces:
      - contract_id: CTR-P1-012
        role: consumer
        description: 消费ComplianceRule进行合规校验
      - contract_id: CTR-004
        role: consumer
        description: 消费Order进行pre-trade合规检查
      - contract_id: CTR-005
        role: consumer
        description: 消费Fill进行post-trade合规检查
      - contract_id: CTR-006
        role: consumer
        description: 消费PositionSnapshot进行持仓合规检查
    adr_ref: [ADR-0010]

  - id: l10-audit-trail
    name: Audit Trail
    submodule_path: src/zephyr/l10_compliance/audit_trail/
    status: planned
    priority: P1
    runtime_plane: cold
    description: 产品级审计痕迹生成；append-only policy_decision_ledger.jsonl（INV-016），不可篡改
    interfaces: []
    adr_ref: [ADR-0010]

  - id: l10-policies-sbom
    name: Jurisdiction Policy Packs
    submodule_path: src/zephyr/l10_compliance/policies/
    status: planned
    priority: P1
    runtime_plane: cold
    description: 辖区分片政策包（cn_a_share/ / us_share/ / eu_mifid2/ / crypto_global/）；含供应链 SBOM 扫描，Cold batch
    interfaces: []
    adr_ref: [ADR-0010]

  - id: l10-policy-engine
    name: Policy Engine
    submodule_path: src/zephyr/l10_compliance/policy_engine/
    status: planned
    priority: P1
    runtime_plane: warm
    description: 政策评估器接口（Python 规则评估器 + OPA 预留）；调用 rules/ + policies/ 执行策略裁决
    interfaces: []
    adr_ref: [ADR-0010]

  - id: l10-security-gateway
    name: AI Security Gateway (AISG)
    submodule_path: src/zephyr/l10_compliance/ai_security/
    status: planned
    priority: P0
    runtime_plane: warm
    description: >
      AI 安全网关防泄密子系统（脱敏引擎、映射注册表、推理路由、Prompt Guard & Audit、红队检测）；
      security_gateway 子模块 Hot-adjacent（< 50ms），其余 5 模块 Warm。
      预留依据：OQ-076 / J0-a / ADR-0009 v1.1.0 §3.5；激活触发器见 OQ-081。
      治理归属跨 09-GOV 全三层（Policy 白名单 / Factory 脱敏编译器 / Runtime 拦截审计）。
    interfaces:
      - contract_id: EXT-003
        role: consumer
        description: 消费 LLM Providers 外部接口，经 AISG 脱敏/路由后转发到外部 AI 服务
      - contract_id: CTR-004
        role: consumer
        description: 消费 Order 契约进行 pre-trade 安全审查（敏感信息检测）
    adr_ref: [ADR-0009, ADR-0010]
    plane_note: security_gateway 子模块 Hot-adjacent（< 50ms INV-015）；其余 5 子模块 Warm

  - id: l10-ai-security-others
    name: AISG Non-Gateway Modules
    submodule_path: src/zephyr/l10_compliance/ai_security/
    status: planned
    priority: P1
    runtime_plane: warm
    description: AISG 中 security_gateway 之外的 5 个模块（脱敏引擎、映射注册表、推理路由、Prompt Guard & Audit、红队检测）
    interfaces: []
    adr_ref: [ADR-0009, ADR-0010]
    note: 本条目与 l10-security-gateway 共用同一目录，通过子模块区分；此处指非 gateway 的 5 个模块

