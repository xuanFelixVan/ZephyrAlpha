    本层处理产品级合规运行。
    仓库级治理（pre-commit/CI/文档扫描）属于 scripts/，见 §5。
    内部治理（IPS/IC 决议/AI 自治/39 治理系统）属于 docs/07_governance_and_compliance/META_GOVERNANCE/ + scripts/governance/。
    命名依据（R32）：业界绝大多数顶级机构（Goldman/Citadel/Two Sigma/BlackRock/JPM）L10 均命名为 compliance。
