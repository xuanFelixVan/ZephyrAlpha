  note: >
    消费者注册表是 CTR-VER-001 版本协商的前置基础设施。
    任何 P0/P1 契约的 MAJOR 版本变更前，必须通过本表查询所有注册消费者并提前 30 天通知。
    Tier 1 = 阻塞式消费者（MAJOR 不兼容会导致其不可用）。
    Tier 2 = 非阻塞式消费者（可退化或延迟处理）。
    EXT/OCP 契约由外部系统版本控制 / _b_track_interfaces/ 管理，不在此注册表中。
