  L1:
    name: Designed
    color: '#bfdbfe'
    symbol: 🔵
    description: 有KB决策记录/有架构视图，无代码
  L2:
    name: Drafted
    color: '#fde68a'
    symbol: 🟡
    description: 有代码原型/skeleton目录
  L3:
    name: Usable
    color: '#86efac'
    symbol: 🟢
