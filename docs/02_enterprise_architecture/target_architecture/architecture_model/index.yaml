module_id: MOD-023
schema_version: '3.0.0'
system:
  name: ZephyrAlpha
  description: 个人量化交易系统
  architecture_style: domain_driven_event_driven_polyglot

# === 分区管理约定（Partition Management Convention）===
# §2.1裁定（2026-06-22）：43域是唯一物理分类体系，14层（L00-L13）降级为域的layer_id属性。
# 物理分类由depgraph.db的domains表（43域）定义，AI找模块只有一条路：按域找。
# 旧的layers/l00-l13-*.yaml文件已废弃，信息合并入depgraph.db域定义。

partitions:
# === 43域索引（物理分类唯一真源：depgraph.db domains表）===
- id: domains
  path: ../../../../data/databases/depgraph.db
  description: >
    43域物理分类唯一真源（§2.1裁定）。
    查询命令: python scripts/governance/extract_depgraph.py --summary
    14层（L00-L13）降级为域的layer_id属性，不再作为并行分类体系。

# === 横切关注点分区（非业务分类，保留）===
# 注: frontend/scripts/infra/layers 目录已删除，信息合并入 depgraph.db 对应域
- id: shared
  path: ../../../../data/databases/depgraph.db
  description: 跨域公共契约与基础能力（D-SHARED域）
- id: frontend
  path: ../../../../data/databases/depgraph.db
  description: 前端独立平台 FE-L1~L4（D-FRONTEND域）
- id: scripts
  path: ../../../../data/databases/depgraph.db
  description: 治理/审计/部署脚本（D-GOV-SCRIPTS域）
- id: cross_cutting
  path: cross_cutting/
  description: 运行平面、不变量、能力成熟度
- id: contracts
  path: contracts/cross_layer_contracts.yaml
  description: P0/P1跨域数据契约、OCP扩展点、外部系统契约、AI治理接口签名
- id: events
  path: events/domain_events.yaml
  description: 22条领域事件（6域）、事件链、频率等级与运行时声明
- id: ddd-model
  path: domain/ddd_model.yaml
  description: DDD战术模式：8 Aggregate Root + 6 Entity + 12 Value Object + 边界铁律
- id: technology
  path: technology/
  description: 技术选型与版本治理SSoT
- id: core-services
  path: ../../../../data/databases/depgraph.db
  description: Vibe Coding 2.0 6大核心服务（depgraph.db派生）
- id: shared-infra
  path: ../../../../data/databases/depgraph.db
  description: 跨域共享基础设施（D-INFRA_OPS域）

