#
# 依据: discussion_002 §4.2 B4 + discussion_003 §2.2
# 用途: Phase 2 B4 验证器对照本库判定 HMM 8 转换触发时点是否吻合
# 标注原则:
#   - 选取 A 股历史上有明确"危机爆发/危机复苏"特征转换的事件
#   - date 为事件核心日（爆发日 / 政策日），非区间
#   - expected_stage: 该事件期望触发的阶段（任一命中即算吻合）
# 吻合判定: 检测器在事件日 ±5 交易日内触发对应 transition_type 的
#           expected_stage 中任一阶段 → 命中
# 命中门槛: 8 事件中 ≥ 6 命中 → B4 PASS
#
# 数据范围说明:
#   - ClickHouse 全历史 K 线覆盖 2010-01-01 起，故 2008 事件用 2010 后的等价事件替代
#   - 2008 雷曼事件保留为标注（历史参照），实际验证以 2010 后事件为主
#   - BREAKOUT 主升浪启动点需人工量价识别，第一批 MVP 暂不纳入验证（见 todo）

