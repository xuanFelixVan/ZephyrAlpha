# data_acquisition_requirements.yaml
# 真源：数据获取缺口备忘录（仅登记空表/未下载数据的表）
# 生成器 generate_data_inventory.py 读取此文件，在 data_inventory.md 表格中追加"需补充"和"可获取性"列
# SSoT分类：规则数据 → YAML是真源
# 维护方式：修改此文件后重新运行 generate_data_inventory.py 刷新 data_inventory.md
# 维护原则：已有数据的表不登记需求（不是缺口）；只有完全没数据的空表才登记

# 按表名的需求清单（key=表名，不含库名前缀）
# 仅登记 ClickHouse 中行数为 0 的空表
requirements:
  # === L1 Tick执行层空表 ===
  auction_book:
    priority: P1
    need: "集合竞价簿（9:15-9:25逐笔委托/撤单）"
    availability: "API可用(QMT subscribe_quote)"
  l2_tick:
    priority: P1
    need: "Level2 Tick数据（逐笔成交+委托队列）"
    availability: "需付费(QMT Level2行情)"

  # === L9 宏观层空表 ===
  edb_data:
    priority: P2
    need: "EDB宏观数据（iFind经济数据库）"
    availability: "已验证(iFind EDB)"
