# 4. 施工设计（批准后按此序做；零新建模块，全部扩在册件面）

1. **P0 净值配对面**（照 04_ 稿 §3 原设计，不重画）：`ArmNavFace(net, turnover, gross|None, cost_bp, face_id)`
   由 `run_backtest_full` 的 `(stats, net)`＋`turnover` 直接装配；判官 comparison 分支按交付面分派；
   **净值路径不得再扣费**（防双扣，红证 R2）；非 `ArmNavFace`/非 Series 入口加**类型闸**（防单列 DataFrame 静默吞并，R4）。
2. **新臂底座来源**（B/C/D 三卡所需，接进 `ARM_BASE_SOURCES`）：形状=**按臂产出日频信号序列**
   （05_ 稿 §2 备注原话），一臂一序列；e/r 双引句仍按在册双臂协议校验，档值全部从绑定册 args 进，
   Python 不出现档值（红证 R6 沿用）。
3. **跨 run 对照协议**（C 的六臂必需）：一次跑 N 臂 ⇒ 产出 N 行分数**共用同一 `run_group` 判别位**，
   边际/剂量响应柱在该组内比对；无组位即拒判该柱（禁跨日期跨班拼行——与 §33.8"两根柱归另一 run"
   同一条在册读法纪律的机器化）。
4. **两支装载形**（本班域，随包附属）：emotion_index `components` JSON 提取形（带 stage='close_final'＋
   同键唯一性断言，先例 `emotion_linkage_exam.py:25,79-80,246-248`）；六指数拆列形（多 symbol，禁求和塌成一条）。
5. **八格面板机判面**（W-4 的丙项）：判官接 `(板块×日)` 格标签 ⇒ 按卡面冻的八格算次日均值与先验秩。

