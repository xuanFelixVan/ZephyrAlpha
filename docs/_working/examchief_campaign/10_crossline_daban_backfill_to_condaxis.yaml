# 1. 一句话（大白话）

考试卡 A 要用"涨停温度、晋级率"两条腿，这两条腿的原料表只存了 22 个交易日的近期数据，
而考卷要考 2019-2025——**没米下锅**。条件轴情绪线已经证明这张原料表其实是从日线价量**派生**出来的、
可以整段重放，所以这块米该由他们那条线种出来，考卷这边等着换米重考。
本班不自己另起一台重放器（那会是第二真源）。

