# 1. 一句话（大白话）

**改的是"用什么公式画这张 RRG 图"，不是"考试要考什么、及格线是多少"。**
旧卡自己写的公式（4 天累计涨跌的指数式）实测画出来是一条直线——497 个交易日里板块永远落在
同一个象限、横截面占比的标准差＝0，等于拿一把没有刻度的尺去考试。所以换成仓库里早就在册、
被生产件在用的那条公式（10/26 双 EMA）。按 G4-5 的规矩，旧卡一个字都不动，另起三张"版本卡"。

