# 3. 逐卡变更面（旧句留痕，不覆写）

## 3.1 TDM-E-L2-02-1/calibration/02_RRG象限迁移 → …/02b_RRG象限迁移_在册10_26双EMA口径版

- 废止面（母卡原文逐字）：frozen_note 的"看数前冻结；RS=ln(板块 4 日累计相对收益)+0.5、
  RRI=RS 4 日平滑、象限以 100 中枢±带宽划分（带宽=5，取自 RRG 通行口径并在此钉死，事后不可调）"；
  signal_derivation 的"RS=100·exp(4 日累计 ln(板块收盘/基准收盘)) 平移口径，RRI=RS 的 4 日 EMA；
  象限按 (RRI,RS) 相对 100 中枢四分为 leading/improving/weakening/lagging"。
- 新面（在册真源逐字）：`sector_rrg.py:19-22` 三行式＋`:47-48` 参数 10/26＋
  `:153-157` classify_quadrant 的 100 中枢严格四分＋`:89-101` EMA 通达信口径；
  快慢序由该函数签名固定（第二分叉的"坐标快慢序"在甲路下自然消解，本班不再自拟映射）。
- 保留面：series 定义"当日 leading 占比 − lagging 占比"、迁移标签定义、
  禁直读 `sector_state.rrg_quadrant`＋差异 >10% 先查口径、族口径固定、按日截面分母、
  62 日最小数据量由装置自身 raise（不在绑定腿预削窗口）。
- 新增声明面：`buckets.machine_face_gap`——八格 categorical 面无法由一条日频序列复现，
  执行器 series 路径会走分位分桶缺省 10 桶（在册同型拒绑先例＝绑定册 L2-02-2/02 的理由②
  "分桶协议不可执行／ORDINAL_FALLTHROUGH"）；本班据此**不把十分位代理读数当八格先验秩来签 pass**。

