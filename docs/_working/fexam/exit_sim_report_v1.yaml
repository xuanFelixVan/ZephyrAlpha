    composite: strategy_exam.composite_signal（逐列截面秩 pct，direction 全部为空=long，逐日等权均值）——函数复用禁重造
    weights: strategy_exam.monthly_topn_signals top_n=20 月频等权步进函数——函数复用禁重造
    candidate_filter: 信号日 ATR14 非 NaN 者方可入 top20 候选；不足 20 只=该月空仓（同装置 len<top_n 语义）
    execution: 调仓信号=月首交易日收盘生成；执行=T+1 开盘（execution_lag_days=1 同引擎语义）
    windows:
      run:
