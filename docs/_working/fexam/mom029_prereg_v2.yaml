hypothesis:
  statement_zh: 过去20个交易日涨幅越高的股票，短期被追涨资金推得越透支，随后数日到数周价格倾向均值回落——本因子赌的是A股月内短期反转（做多前期输家、回避前期赢家），不是动量延续。
  bet: A股月内短期反转（短期反转表现，非动量延续）
  direction: short
  direction_meaning: 因子值与前向收益负相关；判卷按 eff=-IC/-ICIR 口径（ic_exam.judge direction=short）
  literature_basis: 动量/反转文献通识：Jegadeesh & Titman (1993) 经典动量成立于3-12个月形成期；1个月形成期即使在美股也呈短期反转（Jegadeesh 1990; Lehmann 1990）；A股散户占比高、追涨杀跌重，月频短期反转效应稳健且强于美股（A股实证文献共识，本项目
    factor_family_glossary 反转族亦载“20日反转是经典有效因子”）。
  prior_independence_note: 本假设为事前登记：direction 仅依据动量/反转文献通识与代码数学含义（close.pct_change(20) 截面动量），未引用B道 codesym_factor_exam_v1
    或任何实测 IC 符号作为 direction 依据。
