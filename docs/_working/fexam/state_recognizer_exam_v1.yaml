# state_recognizer_exam_v1 — prereg 冻结块（2026-10-06 开跑前落盘；判据事前定，禁看分改）
# 本快照存于 .runtime/tmp/st-matrix-20261006/prereg_snapshot_v1.yaml，与最终分数册 prereg 块逐字一致。
prereg_v1:
  exam_window:
    start: '2019-04-01'
    end: '2026-08-31'
    forward_buffer: '2026-09-30'
    note: 考窗留 2026-09 做前向缓冲（fwd20 标签可用）；fwd60 尾部越窗行按 NaN 丢弃并如实报 n
  proxy:
    primary: 000300 指数收盘价
    source: c1_market.kline_index（symbol='000300'，5282 行，2005-01-04..2026-09-30，考窗全覆盖）
    deviation_note: 施工单初拟查 c1_market.kline_daily——实测该表无 000300（count=0），000300 真源在同库 kline_index，属同一指数更优真源，如实标注非改判据
    fallback: 全市场等权均值代理（ch_data.sma_regime_fallback 同源口径）——本考未触发（kline_index 覆盖齐全）
  hmm_states:
    table: c1_backtest.regime_snapshot_history
    loader: scripts/backtest/fexam/ch_data.py load_regime_states（同日多快照去重取末笔=最新检测态）
    labels: p_r1=ranging_low_vol / p_r2=ranging_mid_vol / p_r3=trend_up / p_r4=trend_down（argmax）
    pit_semantics: 表本身 PIT 设计（trade_date=t 行的检测信息 ≤ t-1，勿用当日行外推当日）；本考 state(t) 原样对齐，前向收益=close(t)→close(t+h)，不加额外滞后
  realized_state_definition:   # 事前冻结，逐字执行
    fwd20: close(t+20)/close(t)-1（000300 交易日口径）
    rv20: 000300 日收益率（pct_change）滚动 20 日标准差
    rv_pct: rv20 在考窗截面内的百分位秩（实现已然标签允许用窗内信息； tercile 边界=1/3、2/3）
    labels:
      trend_up: fwd20 > 0 且 rv_pct ≤ 2/3
      trend_down: fwd20 < 0
      ranging_low_vol: 其余（fwd20 ≥ 0 且 rv_pct > 2/3，或 fwd20 == 0）且 rv_pct ≤ 1/3
      ranging_mid_vol: 其余且 rv_pct > 1/3
    drop_rule: fwd20 为 NaN 的考窗尾部行从一切 realized 相关指标剔除，如实报 n
  pass_criteria:   # 初拟待 Owner 校，全部事前冻结
    c1_trend_up_hit: P(fwd20>0 | HMM=trend_up) ≥ 0.55
    c2_trend_down_hit: P(fwd20<0 | HMM=trend_down) ≥ 0.55
    c3_confusion_diag: 混淆矩阵对角线占比（trace/N，HMM 行 × realized 列）≥ 0.40（四类随机基线 0.25）
    c4_switch_lag: 真实体制转折→HMM 换挡滞后 median(|lag|) ≤ 5 个交易日
    c5_baseline_dominance: 对 SMA200 土办法基线同口径四指标（①②③④）全部不劣于（HMM ≥ baseline，无容差）
  switch_lag_protocol:
    realized_change_points: realized(t) ≠ realized(t-1) 且前后两段均 ≥5 个交易日的边界（滤单日毛刺）
    hmm_change_points: HMM 态序列逐日变化点，不加持续过滤（保真反映识别器抖动）
    lag: 每个 realized 转折点到最近 HMM 变化点的有符号交易日距离（取 |lag| 最小者）；±20 交易日截断；另报 |lag|≤5 占比、P90、max
    calendar: 000300 交易日历（考窗内）
  baseline:
    sma200: 000300 收盘价 200 日简单均线（min_periods=200；2005 起算，考窗内无预热缺口）
    state: close > SMA200 → trend_up，否则 trend_down（两态）
    same_caliber_metrics: ①（trend_up 行 P(fwd20>0)）、②（trend_down 行 P(fwd20<0)）、③（基线标签==realized 四类标签占比）、④（同 lag 协议）
  verdict_rule:
    qualified: ①②③④⑤ 全过
    conditionally_qualified: ①②③ 全过、仅 ④ 和/或 ⑤ 未过（准头够、及时性/基线劣势）
    unqualified: ①②③ 任一未过
  sentiment_layer: report_only 盘点（无及格线）：MOD-ALT-EMOTION-INDEX-BUILDER blueprint 读态 + news_score_daily 实测（CH 只读）

