proxy_declarations:
- stock_strength（L2-06 gate②）= 个股20日动量截面百分位×10（v1 合成因子不在本车道，代理显式声明）
- 行业指数 = 成员等权日收益累积指数代理（起点=1；非官方行业指数）
- L2-01-1 涨停占比/连板梯队子分不可算（stk_limit 不在本波底座）→ struct 路仅 trend 子分
- L2-01-4 资金流路不可算（money_flow 不在本波底座）→ sector_score 三路等权归一（in-spec fallback）
- 市场级 ±10 调节（L2-01-5）缺席未计
risks:
- industry_class 为现行快照：valid_to 全 NULL、valid_from 仅 2 个 ingest 日（2026-08-03/2026-09-28），无 PIT 历史——映射按 2026-09 现状回溯应用于全窗，含幸存者/前视偏差（行业重分类不可见），分数解释须带此折价
- kline_sector 实测宽覆盖自 2026-03（每月≥100 码），全部落在 HOLDOUT 内——其派生因子无 IS_REF 参照（retain 不可判）且 code 无名称列（880/881 与 industry_sw
  无权威 join），prereg 冻结窗下不可考（禁挪窗）；
- 板块因子经 one-hot 广播后个股层截面区分度=行业内同值（每行业一值），IC 有效样本=行业数×成员，与个股原生因子的可比较性有限
- 动量族全负 IC 为 HOLDOUT 窗市场反转态（raw 个股 mom20 对拍同号 -0.0515 佐证非管线错位）；stk_resid_mom20/stk_cond_gated 的 |IC|/|ICIR| 若按 short
  预登记可达线——但改向必须走新 prereg，禁看分后翻向
