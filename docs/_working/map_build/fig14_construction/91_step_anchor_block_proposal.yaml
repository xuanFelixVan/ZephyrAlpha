# handoff 节点另按簿03 反洗白口径落 manual，原始列值保留在 `skeleton_verifiability`）；
# exec_source/gates/executable/cli_anchors/docs = 三本作业簿实测坐标（件不存在者一律
# 落 `gap_anchors`，不许当锚用）。

