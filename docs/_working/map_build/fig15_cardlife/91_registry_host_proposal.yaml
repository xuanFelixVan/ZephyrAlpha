# 宿主落地后由总包把图头 registry_host 改为 experiment_registry、anchor_source 改为 registry，
# 本件随即降级为施工档案（回落判据见 host_migration_checklist.regression_when_landed）。
# 禁手改本件的 *_universe/counts 派生数字（一律由 generate_strategy_card_lifecycle_map.py 现算回查）。
schema_version: '0.1'
proposal_id: fig15-card-state-host-extension
title_zh: 策略卡状态登记面唯一宿主扩枚举提案（含 89 张卡映射与六处分裂收敛）
lane: L-CARD15
map_id: strategy_card_lifecycle_map
skeleton_ref: docs/_working/map_build/fig15_cardlife/00_skeleton.md
registry_spec_ref: docs/_working/map_build/fig15_cardlife/90_card_state_registry_spec.md
books_ref:
- docs/_working/map_build/fig15_cardlife/01_状态族前段.md
- docs/_working/map_build/fig15_cardlife/02_状态族后段与迁移.md
- docs/_working/map_build/fig15_cardlife/03_三处分裂对账与外部对标.md
blueprint_ref: docs/_working/map_build/03_final_blueprint_and_schema.md

# ---------------------------------------------------------------------------
# §1 宿主裁定承接（总包已裁：唯一宿主=扩 experiment_registry，不新建卡状态册）
# ---------------------------------------------------------------------------
host:
  decision: extend_existing_registry            # 总包已裁，本件不再另立候选
  registry_path: docs/01_policies_and_standards/_registry/catalogs/experiment_registry.yaml
  registry_id: REG-EXP-001
  schema_now: '2.1'
  schema_target: '2.2'
  unique_key: [experiment_id]                   # 主键不动（改主键=牵动全册 FK 与 ROOR 消费方）
  contract_entry_prefix: CARD-                  # 与既有 EXP- 前缀互斥，无重号风险（实测 11 条全 EXP-*）
  write_authority: 总包                          # 本车道禁写该热册（提案+机读块归本件，迁移归总包）
  rejected_alternatives:
    - {candidate: 新建 strategy_card_registry.yaml, reason: 同域重复簇必并（宪法 §4 第 2 条），且 +ROOR 行 +双真源同步义务}
    - {candidate: 卡 md frontmatter 为唯一真源, reason: 89 张中 29 张无头、23 种自由串、0 张在受控词表内（簿03 §A-1）}
    - {candidate: backtest_backlog.yaml, reason: 注释承诺的 threshold_status 字段实测 142 条中出现 0 次（F-09）}
    - {candidate: run 档案面 data/backtest_artifacts, reason: 整目录 gitignored、本 worktree 不存在（F-11），换机即断}
    - {candidate: task_card_meta_registry.yaml, reason: 跨域不同对象（任务卡），塞入触发其 MR-05 违例；只借 migration_rules 形态}
    - {candidate: 复用 contract_status_vocabulary.yaml, reason: 宿主册已归档（孤儿）且值域缺六态，扩它=跨域污染}
  why_this_host_evidence:
    - 在册且有 unique_key/pending_fk 治理面（可承接 CARD-* forward-ref）
    - 已在管预注册语义 pre_registered（实测 True 6 / False 5）+ n_trials/dsr_value/pbo_value 齐备
    - 闲置字段 viability_verdict 三值恰为 exam_policy 三态出口直译（实测 11 条全 null）⇒ 启用而非新造
    - 该册有活执法链（registry_code_anchor_gate / check_registry_code_fingerprint / registry_alignment 等，簿03 §A-2）
    - 与卡语料键级零交集 ⇒ 扩它是"补键"，不是"改语义"（簿03 §A-2 实测 bizmine/prereg 命中 0）

# ---------------------------------------------------------------------------
# §2 拟新增词表 card_state_vocabulary.yaml（13 值，值集与骨架 §1 一一对应）
#     校验器与生成器现在从本块动态取值（registry 词表落地后自动改读 registry 面）
# ---------------------------------------------------------------------------
card_state_vocabulary:
  target_path: docs/01_policies_and_standards/_registry/vocabularies/card_state_vocabulary.yaml
  values:
    - {value: draft, map_state: D15-S1, name_zh: 草案, terminal: false, credential_required: false, definition_zh: 卡已立、判据未写死，可自由改}
    - {value: candidate, map_state: D15-S2, name_zh: 候选卡, terminal: false, credential_required: false, definition_zh: 机器筛出未升格，禁出任何 PASS 语义}
    - {value: frozen, map_state: D15-S3, name_zh: 冻结, terminal: false, credential_required: false, definition_zh: 考窗/阈值/桶边界/N_eff 全部写死，参数不可再改}
    - {value: frozen_amended, map_state: D15-S4, name_zh: 冻结带附录, terminal: false, credential_required: true, definition_zh: 只增不改，勘误与修订以带日期附录追加，frozen 参数零改动}
    - {value: executing, map_state: D15-S5, name_zh: 在测, terminal: false, credential_required: true, definition_zh: 试验台账行已开、执行件跑数中}
    - {value: green, map_state: D15-S6, name_zh: 判绿, terminal: false, credential_required: true, legacy_field: viability_verdict=supported, definition_zh: 预注册阈值全过且 DSR 校正后仍显著}
    - {value: red, map_state: D15-S7, name_zh: 判红, terminal: false, credential_required: true, legacy_field: viability_verdict=refuted, definition_zh: 阈值未过，机制假设是否可修尚未定}
    - {value: insufficient, map_state: D15-S8, name_zh: 不可判, terminal: false, credential_required: true, legacy_field: viability_verdict=inconclusive, definition_zh: 样本或功效不足、fail-closed 存疑，既非绿也非红}
    - {value: suspended, map_state: D15-S9, name_zh: 挂起, terminal: false, credential_required: true, definition_zh: 裁定延后重考并带显式触发条件，禁被读成通过}
    - {value: sealed, map_state: D15-S10, name_zh: 封卡, terminal: true, credential_required: true, definition_zh: 终态，不再重开、不再改参重跑，证据定版}
    - {value: condemned, map_state: D15-S11, name_zh: 判死归档, terminal: true, credential_required: true, definition_zh: 终态，机制证伪或数据面不可修，入死矿账防复挖}
    - {value: graduated, map_state: D15-S12, name_zh: 毕业出卡, terminal: true, credential_required: true, definition_zh: 终态，结论已回写因子与策略册，卡使命完成}
    - {value: void, map_state: D15-S13, name_zh: 作废, terminal: true, credential_required: true, definition_zh: 终态，挪门柱或中途加条目或 N_eff 破，本批结论作废}

# ---------------------------------------------------------------------------
# §3 宿主 entry_schema 2.1→2.2 的字段增量（三处分裂的收敛点全在这里）
# ---------------------------------------------------------------------------
entry_schema_delta:
  add_fields:
    - {field: card_id, type: str, required: 契约条目必填, semantics: 卡业务号（业务键，非主键）, regex: '^[A-Z][A-Z0-9]*(?:-[A-Z0-9]+){1,4}$'}
    - {field: entry_kind, type: enum, values: [single_hypothesis, family, narrowing_ruling], required: true, semantics: 卡粒度（骨架案例 B 实测三粒度，族级文书不得参与族成员计数）}
    - {field: card_state, type: vocabulary, source: card_state_vocabulary.yaml, required: true, semantics: 契约法律地位（13 值闭集）}
    - {field: hypothesis_key, type: str, required: 回填目标（缺则 CV-08 A 腿不可判）, semantics: 同一假设归一标识，X09 双卡判定的唯一合法轴}
    - {field: claim_fingerprint, type: str, required: false, semantics: H1 正文归一化 sha256 前 12 位，hypothesis_key 的机器可复核来源}
    - {field: status_note, type: str, required: false, semantics: 收纳卡头原自由文本串（23 种串的语义不丢位）}
    - {field: lives_in, type: map, required: true, semantics: path_history 列表（一张卡允许多版本文件，单键 path 会把正常 M03 升版误判为重复）}
    - {field: credential, type: list, required: 'card_state 所在状态的 credential_required 为真时必填', semantics: '迁移流水清单，每条含 seq/from/to/ruling_id 或 flag/date，是跳序列表而非单值（簿03 §D E-1）'}
    - {field: rejudge_used, type: bool, required: true, semantics: M10 一次性重判全局令牌，true 后再有重判请求即 X03/X01}
    - {field: revives, type: str, required: '命中复活判据时必填（X13）', semantics: 复活指针，指向已终态旧卡 card_id}
    - {field: revived_by, type: str, required: false, derived: true, semantics: 反向指针，由 revives 派生生成，禁手填双写}
    - {field: derived_from, type: str, required: false, semantics: 派生指针（S2 候选卡由 frozen 卡派生，与复活分轴，簿01 OBS-K-2）}
    - {field: verdict_bindings, type: list, required: false, semantics: 判决件三元组（card_id 与 ruling_id 或 report_path 与 verdict 三值同读），CV-08 B 腿的输入}
    - {field: body_fingerprint, type: map, required: true, semantics: '{path, content_sha256, frozen_at}，X02 静默改的机验原料（复用 file_utils.content_sha256）'}
    - {field: history_from, type: date, required: true, semantics: 登记面生效日，此前迁移不计（🌑L-1 诚实截断）}
    - {field: frozen_at, type: date, required: false, semantics: 冻结日（字段名复用 config/standards.yaml 既有键，不新造第三套同义词）}
    - {field: conclusion_tier, type: enum, values: [final, provisional], required: false, semantics: 结论可信度档（exam_policy §4 引用位，不映射进 card_state）}
  reuse_untouched: [experiment_id, status, pre_registered, viability_verdict, n_trials, dsr_value, pbo_value, is_overfit, target_id, target_type]
  new_enums_added: 0        # green/red/insufficient 直译在册 viability_verdict 三值 ⇒ 净零
  run_to_card_fk: {field: card_id, on_run_entries: true, cardinality: '卡 1 : N run', naming: 对齐既有 target_id/target_type 范式，不新造第三套 FK 命名}
  pending_fk_policy: 允许 CARD-* 的 forward-ref，形态照既有 UNI-BASKET-001 记录（实测该册已有 pending_fk 治理面且已 resolved 一条）

# ---------------------------------------------------------------------------
# §4 23 种卡头 status 串 → 13 值的映射规则（"融合处置"的成品；语义不丢）
#     disposition: map | non_domain | needs_adjudication | unmapped_headless
# ---------------------------------------------------------------------------
status_alias_rules:
  ordered: true
  rules:
    - {rule_id: AL-01, when_token: 已封卡, disposition: map, to_state: sealed, matched_strings: 1, note: 唯一 S10 实例，串内嵌裁定号在回填后改为引用（X11）}
    - {rule_id: AL-02, when_token: 候选, disposition: map, to_state: candidate, matched_strings: 1, note: 唯一 S2 实例}
    - {rule_id: AL-03, when_token: draft, disposition: map, to_state: draft, matched_strings: 1, note: 唯一 S1 实例（sector v0）}
    - {rule_id: AL-04, when_token: frozen, disposition: map, to_state: frozen, matched_strings: 19, note: 17 种括号变体零语义增量，差异落在 frozen_at/data_collection_started/amendment_channel 三个正交字段（簿01 结论 2）}
    - {rule_id: AL-05, when_token: frozen, when_path_in: [IBT-PROTOCOL-V1.md], disposition: non_domain, matched_strings: 1, note: 战役规程件，不是契约卡（簿01 映射表 T04）}
    - {rule_id: AL-06, when_token: active, disposition: needs_adjudication, matched_strings: 2, note: 设计备忘录 35/37，无 H1 与判据结构，不入册（簿01 T01）}
    - {rule_id: AL-07, when_path_in: [tick_matrix_protocol.md], disposition: non_domain, note: 月度滚动考试规程，一卡一规程里的"规程"侧（簿01 T02）}
    - {rule_id: AL-08, when_headless: true, disposition: unmapped_headless, matched_files: 29, note: 无头率 29/89=32.6%（骨架口径 29/68，本件口径 29/89）}

# ---------------------------------------------------------------------------
# §5 六处分裂的收敛方案（簿03 §A 开账 + §C 处置；图的 gaps 面由此显性化）
# ---------------------------------------------------------------------------
split_faces:
  - {face_id: D15-G01, name_zh: 卡头 status 面, object: 契约, today: '89 张卡 / 60 有头 29 无头 / 23 种串 / 0 张在受控词表内', red_reason: unwired, disposition: 降级为只读镜像（方向恒为 册→md）, net_zero: 替代 23 种自由串与模板 status 行，语义进 status_note}
  - {face_id: D15-G02, name_zh: 宿主 REG-EXP-001 面, object: 一次跑数实例, today: '11 条与卡键级交集 0；viability_verdict 11 条全 null', red_reason: unwired, disposition: 升格为唯一宿主并扩 schema 2.2, net_zero: 启用在册闲置字段 viability_verdict，零新枚举}
  - {face_id: D15-G03, name_zh: 战役台账面, object: 战役事件, today: '6 本台账 ≈527 表格行，带 card_state 语义键的行 0', red_reason: terminal, disposition: 保留为视图（卡态不再是它的职责，只留 card_id 指针）, net_zero: 替代台账"状态"列中的卡语义，不改台账文件}
  - {face_id: D15-G04, name_zh: CH 三判定表面, object: 策略件与因子件与节点, today: 'hypothesis_precheck 58 / strategy_screen 1340 / node_verdict 58 行，带卡号 0 行', red_reason: terminal, disposition: 不并（跨域不同对象），禁建 verdict 推 card_state 的隐式派生, net_zero: 无对价（不新增不删除）}
  - {face_id: D15-G05, name_zh: 以卡为键的机读判决件面, object: 卡级 verdict 与 N_eff 三关, today: 'pattern_narrow_results.csv 6 张卡带 verdict 列、exam_results.csv 18 行带 n_eff 与三关布尔、7 处 card: 键（2 处悬空）', red_reason: broken_supply, disposition: '收编为 runs 与 verdict_bindings 的 schema 母版，禁再新增第四种 csv 形态', net_zero: 替代"新造卡-run 结构"的需要}
  - {face_id: D15-G06, name_zh: 真源完整性面, object: 判据灭失与档案不在版本控制, today: '3 个 production 脚本的 BLUEPRINT 卡锚指向从未入库的两张卡；run 档案整目录 gitignored', red_reason: ghost_ref, disposition: 纠偏 + 校验器显性红（CV-17 指纹无从计算即 error，禁静默 warn）, net_zero: 无（属修复不属新建）}

# ---------------------------------------------------------------------------
# §6 判据回炉记录（总包已裁"两处判据缺陷必须先回炉"；本件只改输入口径，不改阈值）
# ---------------------------------------------------------------------------
validator_rework:
  cv_06:
    defect: 原前置"entry_kind 新卡且 family_id 命中已 SEALED 族 ⇒ revives 必填"对唯一真复活链不成立——复活卡的 family_id 是新族名 T0-CONDITIONAL，不命中被封族 T0-PRERG（簿02 §11 X13 行、§末 B R-23）
    changed_input: 复活判定的输入从"单字段 family_id 等值"改为"三元命中即触发"——(1) 条目自带 revives；(2) 条目 parent_context 或 credential 引用图内 revival_authorizations 集合中的在册裁定号；(3) 条目文本或路径命中处于终态的 card_id 或 family_id
    threshold: 未改（仍是一条 error 级 X13，不降级不放宽）
    red_case_kept: 复活卡 t0_conditional_prereg_card.md 引用 裁定#399 与 裁定#331 而 revives 缺省 ⇒ 必红（F-05 现状被抓）
    blue_case_zeroed: 候选卡 parent_context 指向一张 frozen 卡与其考试报告（派生而非复活，簿01 OBS-K-2）⇒ 不得红
    also: revives 指向自身、指向不存在卡、指向非终态卡、以及同一 card_id 从终态回非终态，四形一律 error
  cv_08:
    defect: 原判定式"同 family_id 且 entry_kind=single_hypothesis 的活跃条目 >1 ⇒ error"既误伤又漏判——family_id 是封闭族（N_eff 账）的键而非"同一假设"的键，多成员族本就合法（89 张口径下命中 37 张，簿03 在 89 未收 force_index 时算得 36）；而 F-07 的两张卡不共享 family_id（ALGO 件③ 连 family_id 头都没有），等值判据天然失效
    changed_input: 拆成三条独立腿且各自读三元组而非单字段——A 假设身份：同 hypothesis_key 的活跃 single_hypothesis 条目 >1 ⇒ error（X09 正解，hypothesis_key 缺失只计 warn 不猜）；B 卡号↔文件↔判决三元对齐：verdict_bindings 每条按 evidence_path 反查所属卡，判决挂到别的卡上 ⇒ error（F-07 抓的就是这一条）；C 族账对账：每个 family_id 下 count(entry_kind=single_hypothesis) 必须等于声明 n_eff ⇒ 不等即 error（这才是 family_id 的正确用法）
    threshold: 未改（>1 语义与 error 级别一字不动，改的是"按什么分组"）
    red_case_kept: T0-PRERG 族两张卡（T0-PRERG-01 与 ALGO-VWAP-03）hypothesis_key 同为 vwap_reversion_t0 且 n_eff=1 而族内单假设成员 2 ⇒ A 腿与 C 腿双红；#390 把 T0-PRERG-01 的 RED 判据落在 algo_mining 报告上 ⇒ B 腿红
    blue_case_zeroed: P3-E1C-STABLE13（13/13）、P3-B2-VOL12（12/12，含归还的 force_index 一张）、P3-B2-STAT3（3/3）、P3-B-FIRST6（族级 NARROWING 按 entry_kind 剔除后 6/6）四族在 C 腿下全部合规，A 腿因 hypothesis_key 互异不误伤
  non_negotiable: 任何后续放宽/收紧判据都必须先回写骨架与作业簿实测，禁在校验器侧改阈值凑绿

