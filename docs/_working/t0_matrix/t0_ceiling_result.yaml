caveats:
  bar_count_uses_uniqExact: kline_1min 为 ReplacingMergeTree 且未 FINAL 时同分钟多版（普查实测约
    1.74×），count() 会虚增 bar_n 把不可交易日误判为可交易 ⇒ 必用 uniqExact(trade_time)
  no_limit_up_fix: 未修正涨跌停可成交性；该不修正使上界更大（更不易判死），与单向判读方向一致（卡 §4.2）
  dominant_is_vol_band: regime_state_anchored.dominant 实为波动率风险四档非趋势标签（卡 §4.4），故 by_macro_state_T1
    各组只能读成波动分层
  zero_price_minute_bars_exist: 实测 kline_1min 存在 min(low)=0 的股票-日（零价分钟 bar），本件把除法收进
    if() 兜住并在 daily.csv 带出 zero_lo_sd 计数；任何用该表算振幅的消费方都须先挡这一路（本包首跑即被 Code 153 拦下）
  ceiling_not_strategy: 本件全部结论均为容量上界，不含任何策略可实现性主张
  cb_etf_out_of_scope: 转债/跨境 ETF 无分钟 bar，未入本卡；真 T+0 战场另立待料（见 T0_SCHEME_MATRIX §四）
