  lanes:
  - lane: domain:<3级前缀>（动态开，非固定编制）
    serialization: 域内文件路径锁（非域锁）
    items_pct: 63
  - lane: registry-append（热注册表专用道）
    serialization: 条目级键 merge；仅同键真冲突才串行
    items_pct: 37
  - lane: derived-consolidator（唯一写者，出提交者等待路径）
    serialization: 1 条串行，但异步
    items_pct: 20
  - lane: ref-cas（git 真正需要的全局点）
    serialization: commit-tree + 分支 CAS，预算 <5s
    items_pct: 100
