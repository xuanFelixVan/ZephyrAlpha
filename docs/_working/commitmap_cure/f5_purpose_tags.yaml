labels:
- ordinal: 1
  label_name: 「会话进场先亮身份」
  one_liner: 进场先登记身份，干活留名，出了事找得到人
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 2
  label_name: 「施工队还活着吗」
  one_liner: 证明施工队没死，死了别让它继续"代表你"说话
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 3
  label_name: 「文件在谁手里」
  one_liner: 改文件前先领地，防止两个人同时改一个文件互相踩
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 4
  label_name: 「新文件上户口」
  one_liner: 新建的东西必须登记姓名籍贯，否则就是黑户，门禁见一次拦一次
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 5
  label_name: 「别拿假地址骗我」
  one_liner: 防幻觉漂移——文件名、路径、引用必须真实存在，不许凭记忆编
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 6
  label_name: 「别人犯错别连坐我」
  one_liner: 他人的违规不能算在我头上，各扫门前雪；死人的错我顺路扫（见 §2.1）
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 7
  label_name: 「宁可留错不可删错」
  one_liner: 档案安全——销账不可逆，删东西必须过最高审
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 8
  label_name: 「账本必须对得上」
  one_liner: 一致性对账——册子和现实必须一致，两处说法必有一假
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 9
  label_name: 「代码的底线体面」
  one_liner: 质量底线——格式、命名、时区这些不改就难受的洁癖
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 10
  label_name: 「死信也要死得明白」
  one_liner: 死信生命周期——为什么死、能不能救、救不了怎么体面下葬
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 11
  label_name: 「门禁快而不漏」
  one_liner: 提速——安检可以快，但检查项一项不能少
  source: 00_design_basis.md §1 冻结表逐字
- ordinal: 12
  label_name: 「别把钥匙留在门口」
  one_liner: 密钥不裸奔/SQL 不散落/LLM 必经安检
  source: 01_review_adjudications.md §1#2 批准原文（§5#1 Owner 批增设；裁定#480 入册）
