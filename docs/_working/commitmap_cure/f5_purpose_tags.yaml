  revision_note: 2026-10-04 终审修订（Owner 反馈批处理复核，st-vm12e-20261004）：5 条 label_name 按 SOP v1.1.1 §2 规2「标签须自含主体名词」补主体——你是谁→会话进场先亮身份/你还活着吗→施工队 还活着吗/这块地在谁手里→文件在谁手里/死也要死得明白→死信也要死得明白/快而不漏→门禁快 而不漏；labels 清单与 gates
