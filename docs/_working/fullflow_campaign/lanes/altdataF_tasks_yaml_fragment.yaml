  dependencies: []
  capability: cftc_positioning
  symbols:
  extra:
    description: "CFTC 持仓报告(COT)四报表宽转长——AKShare macro_usa_cftc_c_holding(商品非商业)+macro_usa_cftc_nc_holding(外汇非商业)+macro_usa_cftc_merchant_goods_holding(商品商业)+macro_usa_cftc_merchant_currency_holding(外汇商业)；1986- 周频全史；上游=金十 datacenter dc_cftc_* 族(实测仍周更,与 2025-10 停更的议息日历族不同报表)"

