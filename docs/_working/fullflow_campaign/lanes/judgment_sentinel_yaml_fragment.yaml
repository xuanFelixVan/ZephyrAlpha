tables:
  - table: c1_market.judgment_intraday_market_state
    date_col: asof_ts
    max_lag_days: 2
    lag_basis: trading_days
    past_only: false
    row_filter: "synthetic = 0"
    column_fill_ratio:
      cols: [confidence]
      min_ratio: 0.9
      window_days: 10
      treat_zero_as_missing: true
    leg_name: "真生产行"

  - table: c1_market.judgment_next_day_forecast
    date_col: asof_ts
    max_lag_days: 2
    lag_basis: trading_days
    past_only: false
    row_filter: "synthetic = 0"
    column_fill_ratio:
      cols: [confidence]
      min_ratio: 0.9
      window_days: 10
      treat_zero_as_missing: true
    leg_name: "真生产行"

  - table: c1_market.judgment_daily_plan
    date_col: asof_ts
    max_lag_days: 2
    lag_basis: trading_days
    past_only: false
    row_filter: "synthetic = 0"
    column_fill_ratio:
      cols: [confidence]
      min_ratio: 0.9
      window_days: 10
      treat_zero_as_missing: true
    leg_name: "真生产行"

  - table: c1_market.judgment_plan_verification
    date_col: verified_at
    max_lag_days: 2
    lag_basis: trading_days
    past_only: false
    row_filter: "synthetic = 0"
    leg_name: "真生产行"
