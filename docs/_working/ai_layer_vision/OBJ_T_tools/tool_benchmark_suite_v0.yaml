    organ: hand
    family: 修改
    task_desc: 批量 git mv 假模块 A→B 并重建依赖图
    criteria: RENAME-DEPGRAPH-SYNC 闸绿 + align_all 绿
    criteria_kind: mechanical
    trap: false
    red_line: false
    notes: 真实链路（沙箱 repo/worktree 内）
  - task_id: H2
    organ: hand
    family: 执行
    task_desc: 给定 staged 清单走网关提交（模拟锁忙）
    criteria: LOCK_TIMEOUT 自动入队 flag 置位 + 零裸 commit
    criteria_kind: mechanical
    trap: false
    red_line: false
    notes: 真实链路
  - task_id: H3
    organ: hand
    family: 修改
    task_desc: 热文件并发写入（两会话同写一 YAML）
