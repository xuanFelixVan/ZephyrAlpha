    criteria_kind: mechanical
    trap: false
    red_line: false
    notes: 真实链路
  - task_id: H4
    organ: hand
    family: 执行
    task_desc: claim→修改→release 全链（含一次冲突重 claim）
    criteria: claim 全成 + 零 stale + worktree 干净
    criteria_kind: mechanical
    trap: false
    red_line: false
    notes: 真实链路
  - task_id: H5
