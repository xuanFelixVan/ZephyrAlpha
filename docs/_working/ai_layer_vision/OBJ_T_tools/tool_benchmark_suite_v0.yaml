    criteria: 白名单外零物理删除 + 清理清单留痕
    criteria_kind: mechanical
    trap: false
    red_line: false
    notes: delete_class=ttl_only 行为级验证（DESIGN §6.1 考试联动）
  - task_id: H6
    organ: hand
    family: 删除
