  治理面翻 DCS 四族章。留空不硬凑五类：终端/段容器、未施工缺口（module_ref=null）、手经验规则域无病历族、

  风控熔断域病历册缺位（GOMAP 同域缺口已显式登记）、券商执行域病历缺位。任务卡六层矩阵→TDM 实际层码语义映射：

  L1 感知=TDM L1、L2 特征=TDM L2、L3 决策=TDM L3、L4 执行=TDM L4、L5 风控=X1 应急+风控散布环节、L6 复盘=L0-03/S2-06/C3 族；

  章名出入校正：「001#队列」→002#域三（001 章系无队列章）、「001#审批」→DCS#审批、「009#过拟合」→005#过拟合与前视

  （009 章系仅 N试次/红证）、「005#域一/域五」无此章（域一判读=L1 无独立守护体不实挂；004 审查两卷 TDM 侧查证同 SP 图

  结论=内容域为战役治理审查非交易域病历，全图零挂不硬凑，完备性由图11 主挂满足）。003/004 全图零挂；

  例外声明：D2/E2/Z1/V2 为未施工但语义直配先例账的环节（翻的是纪律/治理先例非运行日志，如实注明）；

  挂载=INV-1 指针引用，不复制册内内容。'
