# 0. 一句话结论（先给判据，再给方案）

**"一块面服务 16 支"这个说法要改口：panel 面不是缺引擎，是缺三样不同的东西。**
实测分桶后：日频权重帧回放**已在册**（`_c4_engine.run_backtest_full`，含涨跌停可成交性闸与
三档成交价口径）；真正缺的是①**逐臂净值的配对面**（判官侧零改动不可达，最小必改 17 行）
和②**日内/分钟撮合面**（全仓零命中）；③至于按臂产出 weights 的接线，是小件。
所以排产顺序＝P0 配对判据面（Owner/统筹门位）→ P1 按臂权重帧接线（我域）→ P2 分钟撮合面（另案）。

