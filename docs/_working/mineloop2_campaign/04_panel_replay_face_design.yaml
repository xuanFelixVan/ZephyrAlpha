# 2. 设计目标与非目标

**目标**：让臂的定义落在 symbol×日（或日内）帧上的卡，也能进同一套裁决与分数面，
且不新增第二判官、不新增第二引擎、不改任何卡面判据数值。

**非目标（明确不做）**：
1. 不做"把 panel 臂折算成日频总敞口再喂现有 e 位"的捷径——折算丢掉的正是要判的信息（构成/次序/分批），
   出的分是假分；此路由意为**禁用**，不是待议。
2. 不在判官之外自建净值对照并写分数（第二真源）。
3. 不动 `0080/0081` 他班在途件、不动 02/06/07 卡面判据数值。
4. 本设计稿不含任何施工：批准前一行代码不写（统筹令）。

# 3. 三件分层设计

## P0 逐臂净值配对面（**门位件，须批准后才有后续**）

**接口形状（建议）**：新增一个**净值交付面**而非改语义——
`ArmNavFace(net: pd.Series, turnover: pd.Series, gross: pd.Series | None, cost_bp: float, face_id: str)`，
由引擎侧 `run_backtest_full` 的 `(stats, net)` ＋ `turnover` 直接装配（引擎已产出 turnover，不新算）。
判官 comparison 分支改为**按交付面分派**：吃 `e/r` 标量对 → 走现路径（逐位零漂移）；
吃 `ArmNavFace` → 走净值路径。

**关键风险 1（重复扣费，必须设计掉）**：判官 `:237-239` 从敞口算换手并扣费；引擎 `_net_line` 也已扣费。
净值路径若再走 :239 就是**系统性双扣**。处方＝净值路径**不得**再扣费，且 `cost_bp` 只作披露位；
并由一颗红证钉死（见 §4 R2）。

**关键风险 2（单列 DataFrame 静默吞并）**：`:217/:152` 无显式拒绝，单列 DataFrame 会一路静默通过。
处方＝净值路径入口加**类型闸**（非 `ArmNavFace` 且非 Series 即 raise），把现有隐式崩溃/吞并改成显式红。

**必须自证（批准的先决条件，非可选项）**：
- 零漂移重放：取 dev 上最近 **100 笔**在册 comparison/ablation 分数行，用改后判官重跑，
  逐笔核 outcome 与全部数值列逐位等值（在册纪律：合并/改判官须重放 100 笔自证）。
- `arm IC 面` 归属：净值臂没有"敞口×次日收益"的逐日 IC，`:313-323` 的 ic 列必然缺值。
  两种处置须统筹选其一（见 §5 待裁 D1），本班不代裁。

**规模**：判官侧 17 行＋装配件约 60-90 行＋重放自证脚本一次性（tmp，不入袋）；
测试面新增 ≥6 支（红证 3＋正证 3）；**不新建模块**（净零，仍落既有件）。

## P1 按臂权重帧接线（我域可施工，依赖 P0）

- B1/B5（5 支）：按臂产出 `weights: pd.DataFrame`，直接调 `run_backtest_full(weights, px_close, ...)`
  → 得该臂 net＋turnover → 装 `ArmNavFace` → 交 P0 配对面。
  引擎与可成交性闸**全复用**（`gate_limits=True` 默认开），本班零新撮合代码。
- B2（6 支）：`simulate()` 的按臂参数化调用（卡面原文自己写着"三臂各跑一次 simulate()"）。
  需要先把 `stop_mult/commission` 之外的**臂级参数**（时间止损档、确认分层、生死线档）做成
  simulate 的显式入参或配置注入——这一步**可能动在册装置**，动它须同批重跑 E 道既有对拍自证零漂移
  （与 0080 返回面扩展同型处方）。故 B2 的"动装置"部分单独呈批（见 §5 D2）。
- 绑定册侧新增算子（走在册 ARM_OPS 通道，带卡面原文引句校验），禁 Python 硬编码档值——
  这条纪律沿用 31_ 册 arm_base_source_seam_probe 的在册结论。

## P2 日内/分钟撮合面（另案，4 支，成本最高）

- 实测现状：`exec_caliber` 只有 `close|next_open|vwap` 三档**日频**口径；
  5 分钟分批、逐 bar 追单 1 tick 重挂、"最优五档即成剩撤"兜底、参与率硬顶、尾盘 14:57 分段
  ——**全部零命中**（无任何在册日内撮合件可复用）。
- 样本面硬约束：卡面自证"分钟数据起点实测 2021-09-01（禁越界外推）"，OOS=2025-10-09..2026-09-30
  ⇒ IS 窗仅约 3.3 年（2021-09..2025-09），跨不到 02/07 卡用的 2018 起长窗。
  **这是排产前必须先核的事实面**：样本年数不足可能使这 4 支卡的 min_obs_per_bucket=60 与
  危机段覆盖判据先天不可满足——若如此，缺的不是引擎而是**数据窗**，排引擎就是错排。
- 建议：P2 先做"数据窗与样本面核"（只读，1 个班次），核完再决定引擎是否立项。

# 4. 红证设计（每条都是"改坏了必红"，不是恒绿）

- R1 折算捷径必红：把 panel 臂的 weights 帧直接 `.sum(axis=1)` 折成标量敞口喂 e 位
  ⇒ 类型闸当场 raise（钉住 §2 非目标 1）。
- R2 重复扣费必红：构造一个已知 net 与 turnover 的 `ArmNavFace`，使"扣费一次"与"扣费两次"
  的 ann_ret/maxdd 可区分 ⇒ 断言只扣一次；若净值路径误走 `:239`，此证红。
- R3 零漂移必红：100 笔在册分数重放，任何一行的 outcome 或数值列变化 ⇒ 红（这是批准前置）。
- R4 单列 DataFrame 静默吞并必红：喂单列 DataFrame ⇒ 必须 raise，不得出分。
- R5 权重帧可成交性闸不得旁路：`gate_limits=False` 只准出现在反例对照用例，
  生产路径出现即红（在册 E7 修复的守卫）。
- R6 卡面档值不得进 Python：算子参数里出现硬编码数字而绑定册无对应卡面引句 ⇒ `ArmQuoteNotFound` 红
  （沿用在册引句双校验）。

