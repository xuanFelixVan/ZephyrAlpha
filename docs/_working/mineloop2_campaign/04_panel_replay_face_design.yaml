  `:237` 换手 `turn = df["e"].diff().abs().iloc[1:]`（**从敞口位取**）；
  `:239` 逐日扣费 `ret_net = ret - turn * cbp / 10000.0`；`:240` `nav = (1+ret_net).cumprod()`。
