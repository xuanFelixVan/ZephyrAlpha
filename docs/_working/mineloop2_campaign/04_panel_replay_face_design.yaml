## 1.3 已在册的日频权重帧回放装置（**这是复用件，不是新写件**）

`scripts/backtest/translated/_c4_engine.py:800-830` 原文签名与返回：

```
def run_backtest_full(weights: pd.DataFrame, px_close: pd.DataFrame,
                      gate_limits: bool = True, slippage_bp: float | None = None, *,
                      backend: str | None = None,
                      pre_tensor: tuple[pd.DataFrame, pd.DataFrame] | None = None,
                      exec_caliber: str = "close",
                      px_exec: pd.DataFrame | None = None) -> tuple[dict[str, Any], pd.Series]:
    gross, turnover = _backtest_core(weights, px_close, gate_limits=gate_limits, ...)
    net = _net_line(gross, turnover, slippage_bp)
    return _stats_from_net(net, turnover, weights, backend_info=_LAST_BACKEND_GUARD), net.fillna(0.0)
```

- `:86` `_VALID_EXEC_CALIBERS = ("close", "next_open", "vwap")`；`:627-631` 非 close 口径**必须**给
  `px_exec` 宽表，否则 raise（原文"禁静默回落 close"）⇒ 三档**日频**口径在册，**没有** 5 分钟/VWAP 逐 bar 档。
- `:495-502` `apply_fillability_gate(weights, gate_limits=True)` 原文"涨跌停可成交性闸（E7 引擎洞修复）：
  封板日禁开新仓/禁出逃"，原料 CH `stk_limit` 与 `kline_daily`（:11-12 注记），
  `gate_limits=False` 仅供反例对照 ⇒ **可成交性约束已在册**，B4 桶缺的不是这一条，是日内时间轴。
- 换手与成本：引擎侧已算 `turnover` 并在 `_net_line(gross, turnover, slippage_bp)` 内扣费 ⇒
  **net 是费后量**（这条决定 P0 的接口形状，见 §3.2）。

