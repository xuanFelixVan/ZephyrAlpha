  多列会在 `:243 float()` 抛 TypeError，**单列 DataFrame 会静默通过**（隐式吞并＝假绿面）。
- 词表外键是**显式披露**不是静默跳过：`:346-349` `unknown = set(p) - _UNION_PILLAR_KEYS` → `fails.append(...)`，
