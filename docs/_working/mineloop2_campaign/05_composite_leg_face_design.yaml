# 0. 一句话结论（先给判据，再给方案）

**复合族入口不是第二台引擎，也不撞 P0 的判官门位。** 实测 14/14 张复合卡的**目标腿一律是
`next_day_index_return`**（执行器现供：card_binding.py:1610/:1645），22 册登记的 join **全部落在
信号腿之间**（0/14 存在"只出现在目标面"的 join 腿）。因此复合面只要把多条信号腿装配成
**一条日频 Series**，判官零改动、零新阈值、分数面沿用现册。机判分桶结果＝
**批-A 8 张现在就能通**（合计只欠 3 张表进配方册＋逐卡合成算子），**批-B 5 张**堵在 22 册自标的
"键面未冻结"，**批-C 1 张** 22 册未登记。⇒ 本面可与 04_ 设计稿（逐臂净值面，Owner 门位）**解耦排产**。

动笔前的假说与被证伪（留案不遮）：本班原猜"不少复合卡的 join 其实是信号腿↔目标腿，
因而可退化成单腿登记、连合成都省了"。P2 谓词直接否证（tgt_only 恒空，14/14 全在多信号腿之间）。
但结论方向反过来更省：正因为目标腿恒为指数次日收益，复合面不必动判官——省的是**门位**而不是代码。

