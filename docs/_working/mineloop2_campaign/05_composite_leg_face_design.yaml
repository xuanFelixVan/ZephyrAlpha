# 2. 设计：复合面＝绑定册 v2 的 `legs`/`combine` 形（净零：不新建模块）

每卡一格，沿用 binding book v1 全部字段，只新增两键；`legs` 逐腿带键面与粒度凭据，
`combine` 只声明卡面已冻结的算法：

```yaml
- card_id: TDM-E-L2-02-1/calibration/02_RRG象限迁移
  status: proposed                  # 批准前不置 approved（沿用在册册格纪律）
  legs:
    - table: c1_market.kline_sector_880
      loader: sector_family_panel   # 复用 :493，args 携 families/period/close_col/amount_col
      keys: [trade_date]            # 逐字抄 22 册 pair.keys，禁自补一个键
      grain_evidence: "22 册 evidence_a/evidence_b 原文＋schema ORDER_BY 指针"
    - table: c1_market.kline_index
      loader: face_daily            # 复用 :87，000300 基准收盘
      keys: [trade_date]
  combine:
    op: rrg_quadrant_series         # 新算子名，进 OPS 册（:828 同一本）
    align: inner_on_keys            # 对齐方式由 22 册键面驱动，非算子自选
    prose_quote: "RS=100·exp(4 日累计 ln(板块收盘/基准收盘))"   # 卡面原文子串，机械校验
  arms: null                        # 双臂/消融卡走现 arm_base_source 通道（新增来源=按臂产出信号序列）
```

分类器改法（**不弱化**，这是本设计最要紧的一条）：`classify_card` 的多表出口照旧返回 U；
只有当该卡在绑定册里存在 `legs` 格、且**三条件齐**（腿品类全可解析＋输入腿键面全冻＋22 册 registered）
才给新类号 `X`（复合可绑）。任一不满足照拦并点名缺哪条腿（沿用 :366 `table_not_in_recipe_book` 的
"拒绑而非猜粒度"纪律）。禁关键词匹配、禁按表名拼 SQL、禁把 `A?`/`U` 改宽。

批-A 的装配清单（机械派生自本册，非手抄）：
- 卡：8 张（L1-AGG/02、L1-AGG/03、L2-01-5/02、L2-01/03、L2-02-1/ablation03、L2-02-1/calibration02、
  L2-04/comparison02、L2-05-2/02）；输入腿数 2/2/2/2/2/2/2/3。
- 需新登记进 `_REGISTERED_TABLES` 的输入腿：**3 张**
  （`c1_backtest.regime_state_anchored`、`c1_market.emotion_index`、`c1_market.kline_sector_880`）；
  `c1_market.kline_index` 已在册。每张登记须带 `date_col`/`where`/`grain_evidence` 三要素，
  逐条抄自卡面与 schema 真源，禁自拟。
- 需新算子（OPS 册扩面，每个都必须是"卡面 signal_derivation 原文已冻结的算法"）：
  档序映射（r3/r2/r1/r4→1/2/3/4，卡面先验冻结值）、滚动 z（卡面钉 250 日窗）、
  RS/RRI 象限重算（禁直读 `sector_state.rrg_quadrant`，该列只作交叉核对）、
  水温档查表缩放（消融臂变量）。**零新阈值**：阈值一律从卡面引句取。
- emotion_index 的 `components` 是 JSON 明细列（品类硬约束原文"components JSON 明细必带"），
  取 C1/C2 子键需一个**提取形**装载口；这是批-A 里唯一一处新装载形，其余全是复用。

与 04_ 设计稿的关系：P0（逐臂净值配对面＝判官 17 行改动）服务的是"臂的结果是净值"的 16 支双臂 panel 卡；
