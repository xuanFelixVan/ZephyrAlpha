# 5. 红证设计（每条都是"改坏了必红"，禁恒绿）

- R1 腿集合不符必红：卡面 `data_binding` 申报表集合 ≠ 册内 `legs` 表集合 ⇒ 拒绑（防多绑/漏绑）。
- R2 键面自补必红：`legs.keys` 与 22 册 `pair.keys` 不逐字等值 ⇒ 拒绑（防本班替 examunlock 拍键）。
- R3 未登记腿必红：`legs.table` 不在 `_REGISTERED_TABLES` ⇒ 拒绑（沿用 :366 现纪律，零扩权）。
- R4 引句不在卡面必红：`combine.prose_quote` 非卡面原文子串 ⇒ raise（沿用 :885 双校验）。
- R5 对齐静默吞行必红：inner join 后行数 < min(各腿行数) 而未在凭据面披露 ⇒ 红；
  缺腿禁补零（卡面原文"缺项不补零，直接少"），NaN 比例超阈值仍走 :1268 现质量闸。
- R6 异轴顶替必红：任何 `legs` 指向 `market_sentiment_panel` 作 A股情绪腿 ⇒ 名单闸直接红（钉-2 机器化）。
- R7 判官零改动自证：批-A 出分前后重放 **100 笔**在册分数行（04_ 稿 §3 同款处方），
  outcome 与全部数值列逐位等值；不等即中止上报。这条是本面的**批准前置**，不是可选项。
- R8 分类器不扩权必红：对"无 legs 格"的多表卡，`classify_card` 必须仍返 U——用例钉死，
  防止"加了复合入口顺手放宽单表判定"。

