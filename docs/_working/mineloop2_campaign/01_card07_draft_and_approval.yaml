    signal_column: 基线臂日净值（由 exit_simulator.simulate(stop_enabled=True) 生成的日收益序列，即被风控层监控的组合）；级别判定与迟滞解除回放真源=src/zephyr/risk/core/drawdown_state_machine.py（MOD-RK-049），禁在考卷里重写判定逻辑
