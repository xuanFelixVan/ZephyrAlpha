  hypothesis: >-
    与母卡 02/06 同一命题（原文不改写）：以组合日盈亏+组合回撤双轴驱动的五级状态机
    （L1 日亏≥2% 禁加仓 / L2≥4% 停新开 / L3≥6% 梯度减仓 / L4 回撤≥25% 清仓+人工接管，
    迟滞解除=当日无新低且修复当日跌幅 50% 才降一级）相对"触发即一次性全清、恢复即一次买回"臂，
    能在同窗内以更小换手成本取得不劣于后者的回撤控制；若判不出来，五级表只是复杂度装饰。
    本版本卡的**唯一新增**是把"级别→仓位映射"从卡面自拟的 L1..L4 数字改锚为
    在册判定件（MOD-RK-049）position_cap 的五态表逐字值（见 data_binding.level_to_cap_map），
    出生四件与 r 位声明一律沿用 06，判据数值沿用 02。
    **本卡实际考的阶梯＝回撤轴驱动的五态**（统筹批复 A1 裁乙：var/cvar 两槽不喂，
    与全仓唯一日频真实调用点 sim_daily_runner.py:1410 的同形跑法）；
    日亏触发路径不进本卡判据，未覆盖面随件披露见 data_binding.approximations_disclosed。
  why_new_version_not_edit: >-
    G4-5：改映射＝口径变更，禁原地改 02/06。02 把级别→仓位写成 L1 100%/L2 100% 禁新开/
