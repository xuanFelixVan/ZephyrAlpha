trigger:
  buy: "bar.low <= base * (1 - grid_bp/1e4)（当日首个触档 bar；买 bar 即定）"
  sell: "bar.high >= buy_fill * (1 + grid_bp/1e4)（严格晚于买 bar 的首个触档 bar；末日未触发=末根 close 强平）"

