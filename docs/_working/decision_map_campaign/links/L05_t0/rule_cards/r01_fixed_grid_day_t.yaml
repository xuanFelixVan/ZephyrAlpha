  pairing_ref: "scripts/audit/cost_trio_exam.py build_pairs（同票同日既买又卖计 1 对、配对量=min(Σ买,Σ卖)、全侧 VWAP 近似；RT_COST_BP=31.2/EDGE_PRECONDITION_BP=30/PAIR_GATE=30 import 复用禁重写）"
