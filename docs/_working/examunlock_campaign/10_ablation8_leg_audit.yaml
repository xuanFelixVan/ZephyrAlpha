question_answered: 令卡"注册册 8 策略 ablation 分解卡起草（06 卡形制）"能否如实落地
verdict_on_premise: 不可如实落地——8 条里只有 2 条有可机读的腿字段，ablation 需要"去掉某条腿再比臂间差"，
  单腿且全册 risk_rules/alpha_sources 大面积为空时，逐腿分解卡的内容无从派生；硬写＝自拟判据数值，
  而 Owner 03:1x 附录明文"卡面判据数值须先呈统筹批，批后才开考"。

