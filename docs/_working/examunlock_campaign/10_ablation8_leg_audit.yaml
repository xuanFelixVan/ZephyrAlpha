second_blocker_executor_shape:
  statement: 即便腿字段补齐，本族卡型是"比臂间差"形（双臂/面板），现器绑定层只交单序列
  evidence: |
    考试班 03:2x 实测已把这条钉进台账（§十五）：ablation 卡若为"逐腿拆＋比臂间差"形，
    走双臂/面板形时绑定层实测报 AttributeError: 'Series' object has no attribute 'columns'；
    本班复核该结论指向的通道现仍在矿考域（04 号件里 16 张双臂形卡同堵）。
  consequence: 8 张卡到手也一张考不出；绕＝假分

what_this_shift_delivered_instead:
  - 本审计件（分母与二重堵点全部现读再取，非转述）
  - 未向 exam_cards 投放任何自拟数值的 ablation 卡（Owner 附录要求判据数值先呈批）
  - 移交诉求写在本件 request_to_owner_or_chief 三段内（不另起件，防悬空引用）

request_to_owner_or_chief:
  - id: AB8-1
    ask: 8 条注册策略的腿字段（alpha_sources/risk_rules/entry→exit→sizing 的可机读分解）由谁补、按哪本册的 schema 补
    why_without_it: 无腿面则 ablation 族永远只能出生为 blocked_on_impl，族计数永远停在 75
  - id: AB8-2
    ask: 双臂/面板消费面（矿考域）落地排期——它同时是 16 张双臂形卡＋本族的唯一出口
    note: 与 04 号件"目标面通道 94 条腿"合并排期更省（同一条通道解两类堵）

