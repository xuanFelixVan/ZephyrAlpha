headline_finding:
  statement: 元层"入考通过率"在仓库面**无法计算**——四条泳道共 3988 行候选、4024 个去重 id，
    在 exam_cards 全部 518 张卡里命中数=0。
  why: 挖矿泳道的 candidate_id 与考试卡的 card_id/origin/node_id 之间**没有任何在册连结键**；
    现册里能连结的只有 birth_batch（批次号）与卡面 origin（族标）两套各自表述，二者无映射表。
  consequence: 三指标里只有第 1 条（产出量）能在仓内出数；
    第 2 条（入考通过率）与第 3 条（预检判定分布）的分子分母都在 CH 表
    `c1_backtest.hypothesis_precheck.verdict`（生产者 `scripts/backtest/hypothesis_precheck.py:373`），
    本班受让路窗纪律未查，留 04:00 后补或交下一班补——不猜、不以仓内 0 命中冒报"通过率 0"。

three_metric_definition_for_whoever_continues:
  m1_output_volume_by_batch: {status: 本班已出数, source: data/strategy_intake/*.csv 的 birth_batch}
  m2_intake_pass_rate:
    status: 待 CH 读数
    numerator: hypothesis_precheck.verdict=通过 计数（按 birth_batch 分组）
    denominator: m1 同批候选数
    blocker: 仓内无 candidate_id→card_id 连结键（本件 headline_finding）
  m3_hallucination_or_originality_rate:
    status: 查无在册口径
    note: 仅在提案文档出现（2026-10-12-exam-card-mining-meta-method-research.md:187），无门、无字段、无生产者

artifacts_found:
  bom: data/strategy_intake/*.csv 首列表头带 UTF-8 BOM（`﻿candidate_id`）；
    用 utf-8 直读的读者会把第一列名读成带 BOM 的键并 KeyError——本班第一遍就踩了，
    改 utf-8-sig 后才有数。登记此条防后人把"键不存在"当成"数据为空"。
  duplicate_candidate_ids: lane_c 3 例、three_high 31 例（60 行仅 29 个不同 id）
    —— 若下游按 candidate_id 去重或做主键，重复行会被静默吞掉；本班不改数据，只登记实测数。
  no_version_column: 四张 candidates.csv 均无 version/generated_at 字段，
    批次时间只能靠 birth_batch 字符串（形如 E1B-20261012-2xxxxx）解析。

prior_snapshot_in_book:
  what_exists: LaneC 体检案卷在 `docs/_working/gpuwo_campaign/`
    （01_anchor_reverify_lanec.yaml、05_lanec_fakegreen_fix.yaml:55"零产出判据四桩实测"），
    假绿机理= `_e2_passed_by_channel()` 的 `except: return set()` 静默吞
    （factory_intake_pipeline.py:267-268 形）——本班的 0 命中读数与该族机理同型，故本件显式区分
    "连结键缺失"与"真的零入考"，不上报后者。

