overnight_leg_exposure_evidence:
  claim_under_test: 本班 15 号件 §一自纠"隔夜腿不是缺算子/缺物化，而是缺曝露位"是否仍成立
  evidence_lines:
    - "card_binding.py:125 注释即写明 ret_open = open/lag(close)-1（后复权空间，卡面原文）"
    - "card_binding.py:142 SQL 里 if(lag_c > 0, o / lag_c - 1, -99.0) AS ret_open"
    - "card_binding.py:150 avgIf(ret_open, lu_prev = 1) AS prem_open"
    - "card_binding.py:621 _PANEL_COLS 已含 prem_open"
    - "card_binding.py:673 open_ser, _ = _apply_set_floor(panel, 'prem_open', min_set)"
  what_happens_to_it: open_ser 只被用作两条诊断证据（open_form_days / open_form_median），函数 return 只交回收盘侧序列
  therefore: 隔夜腿在 CH 面**已算出**，缺的只是把它作为可消费序列曝露出来＋卡面检验量立法 ⇒ 属主动作是"改返回面"，不需要第二次装载
  zero_extra_ch_cost: true

