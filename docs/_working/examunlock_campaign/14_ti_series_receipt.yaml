fixes_made_this_shift:
  - id: FIX-1
    name: 去重口径改确定性写法
    change: "anyLast(col) → argMax(col, ingest_ts)"
    why: >-
      首跑（04:04）复算腿判红：adosc 逐日最大绝对差 3.5e7，早段（2019）逐日全等、差集中在 2025-07 起。
      该表 ENGINE=ReplacingMergeTree 未带版本参数、ORDER BY (symbol,period,trade_time)，ingest_ts 只是普通列
      ⇒ 同键多版共存时 anyLast 挑哪一版跨执行不确定。在册不变量原文＝
      "聚合去重口径 anyLast(argMax 同义) per day"，故 argMax(值, ingest_ts) 是同口径的确定性写法，非新造口径。
    ruled_out_first:
      - "外部写入中：system.processes 过滤自身后零条 TI 查询、system.mutations 零未完成"
      - "自家观测污染：一次 count() 命中 1 条其实是我自己的探针语句含过滤词（在案老坑，已排除）"
      - "内存墙：取错误体后确认那次 500 是本公司把 anyLast 写成两参的语法错——500 不等于墙"
  - id: FIX-2
    name: 复算判据改为逐字符等（不拍容差）
    change: 'max_abs_diff == 0 → 与写盘同一格式（%.10g）逐字符相等；抽成可测函数 repro_check()'
    why: 写盘只有 10 位有效数字，用浮点差判等会把书写精度误判成数据漂移（换口径后 adosc 余差 0.048/量级 1e8）
    tests_added: 3   # 值动到第10位有效数字必须红／日期错位必须红／缺文件必须红
    suite: "12 → 15 支，全绿"
  - id: FIX-3
    name: 行尾归一到在册 LF 契约
    change: "csv 写手补 lineterminator=LF；在盘 21 枚文件 CRLF → LF"
    why: 02 号规格自写 LF 契约，且在册 7 枚序列实测零 CRLF，而本班首跑 20/20 带 CRLF（DictWriter 默认 \\r\\n）
    evidence: "归一后复扫仍含 CRLF 的文件数=0；verify 第四次仍 20/20 not_reproducible=[]"
  - id: FIX-4
    name: provenance 收成单点
    change: "取消逐列 .meta.yaml，只落汇总册 ti_ew_series_v1.meta.yaml（含统一 caliber 块），汇总册加字段 per_column_meta_materialized_separately: 0"
    why: 逐列册内容全可由汇总册派生 ⇒ 按根宪法 §4.2 同真源可派生必并，避免 41 枚与 1 枚长期两写
  - id: FIX-5
    name: 口径注记回流生成器（防"文件改了、册上还写旧口径"）
    change: >-
      汇总册 caliber.dedup 原文只写 anyLast，与 FIX-1 后的实现不符。本班 04:5x 把确定性写法的说明写进
      生成器常量（dedup 文案与汇总册逐字节同源，用 ast 取字面量比对为真），再过 ruff format；
      序列 CSV 零改动（数值与本件 result 段全部读数不变），只 caliber 注记一行变更。
    why: 在册教训"改完 .py 必重跑归档件再入袋"＋"文档与实现分写两口径＝下一班按旧口径复算必红"
    sha_after: "物化件 19,054B/c8cada6e…；测试 10,274B/4d054692…；汇总册 11,065B（parse 通过，dedup 与生成器字面量等）"
    tests_rerun: "15 passed（04:5x 复跑）"

