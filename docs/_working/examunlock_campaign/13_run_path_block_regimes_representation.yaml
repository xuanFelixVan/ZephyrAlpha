option_a_card_side_representation_fix:
  who: 卡件属主（挖矿二班）或受其授权的接班
  what: 20 张（可加另 2 张散文形卡）的 `window.regimes` 散文→映射，逐张断言
        ①解析出的段名与段数与原散文一致 ②每段日期串逐字相同 ③括号内注记丢弃但不进判据
  cost: 每卡 2 行内变更；本班已备可执行配方（见 evidence_files 里的预演件解析式），
        且转换后判 fail 这一条本身就是"非凑通"的证据
  reversibility: 逐卡 git revert 即回；不触分数册
  risk: 触 JUDGMENT_KEYS 字节面，须由属主署名，否则日后对账说不清是谁改的题面

option_b_judge_side_tolerant_parser:
  who: 矿考二班（判官件属主）
  what: 一处 helper 把 `regimes` 归一为映射，四条消费位共用；**解不出即显式抛**（fail-closed），
        禁默认段、禁最近邻补段
  cost: 一个函数＋配对测试（现有 41 支考尺测试面内可加钉）
  risk: 判据面代码改动会改变"什么样的卡面能出分"的边界，覆盖面从 310 张扩到 332 张；
        散文里若出现第三种写法，解析歧义＝静默错段（比现在这种"当场抛"更坏）

