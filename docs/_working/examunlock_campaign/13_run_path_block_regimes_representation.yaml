symptom: |
  20 张 `origin=reverse_triage_batch3_20261012` 反向卡即便（a）基序列物化件跑通、
  （b）绑定册格就位，run 面仍在**出分前**抛：
  `AttributeError: 'str' object has no attribute 'items'`
  at `scripts/backtest/fexam/calibration_exam.py:752`（`_event_metrics` 里
  `for name, span in (w.get("regimes") or {}).items()`）。

root_cause: |
  卡面把 `window.regimes` 写成散文串：
  `bull: 2019-01-04..2021-06-30（流动性牛）；bear: 2021-07-01..2024-01-31（贴现率熊+微盘熊）——逐字继承 16 卡先例窗`
  而判官对该字段的**四条消费位一律按映射读**：
  `calibration_exam.py:163`（series 路）、`:200`（panel 路）、`:402`（crisis 多段解析）、`:752`（event 路）。
  本班全库普查该字段形态（518 张卡，按 yaml 解析后的实际类型计数，不按文本猜）：
    dict=310 / NoneType=186 / str=22
  ⇒ 卡面自称"逐字继承 16 卡先例窗"**在表示层不成立**：16 卡与 07 卡的 regimes 都是 dict（本班实测），
     这 20 卡（外加另 2 张）是散文串，全仓无任何解析器能把散文喂给那四条消费位。

proof_that_this_is_the_only_remaining_block: |
  本班在 **tmp 副本**里做了一次纯表示层转换（磁盘卡件一字节未动）：
    prose → {bull: "2019-01-04..2021-06-30", bear: "2021-07-01..2024-01-31"}
    （解析式只认 `名: YYYY-MM-DD..YYYY-MM-DD`，两段都解不出即断言失败，禁静默补段）
  再跑完整链：绑定册格 → run_binding_book（prose_quote 校验过）→ _event_base_series(base_csv 路)
    → op_event_flag_rolling_pctile → run_card（判据 event 路）
  实测输出（本班原样贴）：
    REGIMES parsed= {'bull': '2019-01-04..2021-06-30', 'bear': '2021-07-01..2024-01-31'}
    BIND OK  rows=1373 event_days=477 share=0.3474
    RUN OK  verdict=**fail**  pillars_all_pass=False
    fails=['is_gap_bp 2.50bp > 0.0（负向命题要求更负）', 't_stat 0.579 > -2.0（负向命题要求更显著）',
           'oos 窗事件日 134 < 门槛 200（确认窗同样受族内下限约束，禁小窗冒确认）',
           "regime_gap 反号 {'bull': {...}} ..."]
    score_rows_on_disk=1（tmp 分数册）  PROD UNTOUCHED scores=44918（生产分数册零字节变更）
    CARD status after run=examined  judgment untouched=True
  ⚑ 关键一条：转换后该卡**判 fail 不是 pass**。⇒ 这条修法不属于"改卡面凑通"，
     因为它没有让任何命题通过，只是让判据能正常评估该命题。

