    三件先例，走 args 携表名，不依赖 _REGISTERED_TABLES）
  cards:
  - card_id: TDM-E-L2-01-2/calibration/02_板块成交额占比活跃度
    signal_column: amount
    signal_derivation_verbatim: 占比=sector amount / Σ(同 code_family 全体 sector amount)（分母口径=行业族 industry_l1∪industry_ths， 由 c1_market.sector_code_name_map.code_family
      在册映射界定，禁自拟名单）； 环比=占比/占比.shift(5)−1；series 面取"占比前 10% 板块等权组合的次日超额"与全样本差。
