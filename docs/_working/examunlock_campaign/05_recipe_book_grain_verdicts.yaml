  - card_id: TDM-E-L2-01-3/calibration/02_多周期动量主导度
    signal_column: close
    signal_derivation_verbatim: 三周期收益=q_i = close/close.shift(i) − 1（i∈{3,5,20}，按 sector_code 分组）； 各周期截面 rank-pct 归一 → 主导度=argmax_i(rank_i)；连续面=0.2·rank_q3+0.3·rank_q5+0.5·rank_q20
      （照在码先验权重原样取，卡只判该权重对不对，不改权）。
    cross_section_hit: true
    agg_mismatch_hit: false
    pivot_unfrozen_hit: false
    a_path_blockers:
    - cross_section_form
    a_path_fit: no_fit
    cross_section_phrase: 按 sector_code
  - card_id: TDM-E-L2-01/comparison/02_等权与IC加权双臂
    signal_column: kline_sector_880.close（日收益与 q3/q5/q20 动量）、kline_sector_880.amount（活跃度路）
    signal_derivation_verbatim: 截面族冻结=industry_l1 ∪ industry_ths（承同车道 ablation/02 与 L2-07-1 卡的既有分母族口径， 剔除 880001-880011 市场统计指数，承 MOD-SIG-061 件内实证口径），按日在数
      code 计算分位（禁固定 code 数）； 路A 动量活跃=当日 amount/Σamount 的截面 rank-pct 与其 5 日环比（两子项等权合成后×100）； 路B 多周期动量=0.2×q3+0.3×q5+0.5×q20 收益的 rank-pct×100； arm_A=(路A+路B)/2；arm_B=w_A×路A+w_B×路B，(w_A,w_B)
      由 IS 窗日频截面 IC 均值 （对 CSI300 次日收益）取正后归一，估毕即冻结不再更新； 双臂各自 clamp [0,100]（件内语义 max(0,min(100,raw))，不加市场
    cross_section_hit: true
    agg_mismatch_hit: true
    pivot_unfrozen_hit: true
    a_path_blockers:
    - cross_section_form
    - agg_caliber_mismatch_vs_anyLast
    - series_not_frozen_to_one_column
    a_path_fit: no_fit
    cross_section_phrase: 截面
  - card_id: TDM-E-L2-01/comparison/03_缺路处置律重归一与剔除双臂
    signal_column: kline_sector_880.close、kline_sector_880.amount
    signal_derivation_verbatim: 截面族冻结=industry_l1 ∪ industry_ths（承同车道统一分母族，剔除 880001-880011 市场统计指数）， 分位/占比按日在数 code 计算； 路A/路B 子分逐字承 comparison/02 的 signal_derivation；
      屏蔽集=固定种子 20261010 下对 (板块,交易日) 二维抽 20% 置路B 为缺失，双臂共用同一屏蔽集； arm_A：composite=mean(可用路)×100（两路齐⇒(A+B)/2；仅余路A⇒路A×100），随后 clamp [0,100]； arm_B：被屏蔽板块当日整体退出截面（不进
      rank、不进分母、不入池，等价 MOD-SIG-144 现行为）； 两臂各自加市场级调节 ±10（承 ablation/02 的水温档查表口径）后取 Top-15% 池； 组合收益=池内 880 行业族指数次日等权收益均值
    cross_section_hit: true
    agg_mismatch_hit: true
    pivot_unfrozen_hit: true
    a_path_blockers:
    - cross_section_form
    - agg_caliber_mismatch_vs_anyLast
    - series_not_frozen_to_one_column
    a_path_fit: no_fit
    cross_section_phrase: 截面
  - card_id: TDM-E-L2-02-2/calibration/02_板块见顶预警三信号
    signal_column: close, amount, high, low
    signal_derivation_verbatim: RSI14(Wilder) 按 sector_code 计算；放量滞涨=amount>=roll_max(amount,20) 且 close/close.shift(5)-1 <= 0；series=当日命中 >=1 信号的板块占比（市场级预警密度）；
      panel 辅轴=板块×日命中数对未来 5 日超额的单调性。
    cross_section_hit: true
    agg_mismatch_hit: false
    pivot_unfrozen_hit: false
    a_path_blockers:
    - cross_section_form
    a_path_fit: no_fit
    cross_section_phrase: 按 sector_code
  - card_id: TDM-E-L2-04-1/calibration/02_轮动五态调节分
    signal_column: close, amount
    signal_derivation_verbatim: 强度底座=同 L2-01 卡的两路合成分（动量活跃+多周期动量，0.5/0.5）； 截面方差=当日跨板块强度分布 std（分位化）；集中度=Top2 成交额占比（分位化）； 二维各三分位切五态（规则与在码 sector_rotation_state
      一致但重算，禁直读输出）； 调节标量=高潮 −1 / 派发 −0.75 / 分歧 −0.25 / 混沌 0 / 主线 +0.5（与 +10%/−15% 线性同序）。
    cross_section_hit: true
    agg_mismatch_hit: false
    pivot_unfrozen_hit: false
    a_path_blockers:
    - cross_section_form
    a_path_fit: no_fit
    cross_section_phrase: 截面
  - card_id: TDM-E-L2/ablation/02_板块候选池整体边际
    signal_column: close, amount
    signal_derivation_verbatim: 板块日收益=close.pct_change（按 sector_code×trade_date）；板块强度合分＝ (成交额占比 rank-pct ×0.25 + 1d 收益 rank-pct ×0.25 + 5d 动量 rank-pct ×0.25
      + 20d 动量 rank-pct ×0.25)×100，clamp[0,100]，取 Top15% 作候选池掩码； 枢纽 arm 序列=当日池内板块强度均值 − 池外均值（供 series 面判单调）。 行业锚 sector_code 前缀 8803=industry_l1/881=industry_ths（口径经
      c1_market.sector_code_name_map 在册映射核对，禁自拟名单）。
    cross_section_hit: true
    agg_mismatch_hit: true
    pivot_unfrozen_hit: false
    a_path_blockers:
    - cross_section_form
    - agg_caliber_mismatch_vs_anyLast
    a_path_fit: no_fit
    cross_section_phrase: 按 sector_code
