  - case_id: 1
    case_no: "ASSERT-2026-0002"
    title: 热册「被抹 56 条」由双点快照误判（正存在断言失实第二录，复原未遂）
    date: '2026-10-09'
    status: closed_retracted_triage_first
    归属: dexp 战役（st-dexp-20261009）本班自犯自报；Owner 令改 triage-first 后撤回
    案由: >-
      2026-10-09 收尾班核账时，我用两个单点快照（HEAD 条目数 vs 主区工作区条目数）断言
      module_translation_registry「主区比 HEAD 少 56 条／净删 294 行，谁提交就删 56 条」，
      并拟以 `git checkout HEAD` 复原热册。Owner 裁定改为 triage-first（禁盲复原，-47 可能含
      活会话在途 token）→ 三向对账（HEAD／git index／盘面）实测 14,201／14,203／14,203，
      缺失 0、多出 2 且两枚都属活跃会话的在途条目 ⇒ 我的 56/294 是两次单点快照正好撞在
      他队写入窗口上的测量伪影；那条复原命令若执行会删掉 2 枚活 token（＝归属篡改级事故）。
    根因四层:
      表层: 用单点快照差作「件消失」的证据，且两次读数之间未冻结写入面
      流程层: 「判损→复原」没有强制的 triage-first 闸，本次靠 Owner 拦下而非流程自拦
      制度层: 主区工作树是多会话混合池且 agent 写文件即自动 git add（在册事实），
        故任何「盘面 vs HEAD」差分天然是竞态读数，不具备断言力
      工具层: 键集合差自证配方只接在「改册」路径上，「判册损」路径仍用行数差——同一把尺没覆盖两个入口
    治本四件:
      - "C1: 判册损一律三向对账（HEAD／index／盘面）＋键集合差，禁用 numstat 行数差"
      - "C2: 报「件消失」前三事（qid 全状态目录＋影子根＋自改名 tmp 的 find；计数变动先对表最老存活件时间以排除 TTL/compaction 这类设计内收缩；判落地只认 git show HEAD）——2026-09-27 已立案，本案是其正向复证"
      - "C3: 复原类命令（以 HEAD 版覆盖盘面）按破坏性操作对待，未做键集合差自证不得执行也不得呈批"
      - "C4: 本案入册（CASEBOOK-010 case 1），与 case 0 同册成双"
    复测判据: |-
      三向对账一条命令可复算：对同一册分别取 HEAD／index／盘面三把键集合，
      要求 缺失=HEAD−盘面=0 且 多出=盘面−HEAD 的每条都能指到活跃会话 claim；
      任一天实测出现 缺失>0 且多出全属死会话，则本案判据不足以解释损册，须另立真损案。
