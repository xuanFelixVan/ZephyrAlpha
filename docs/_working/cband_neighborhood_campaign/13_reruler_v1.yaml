reading_class: 尺判别力标定（折减前＋在标为无效待复算的快照上），非任何格的录用判定
underlying_validity: void_pending_recompute——晨裁①原文：基线被 TI 回填挪了零点，159 格现读数全部标记无效待复算
ruling_stamp: 统筹晨裁 2026-10-12（②号发给 C 族邻域班）①：换尺＝批，两案并用
thresholds_inherited:
  maxdd_gain_pp: 0.05
  sharpe_delta_floor: -0.2
ruler_definitions:
  在册原尺_仅OOS: MaxDD 改善≥5pp 且 SharpeΔ≥-0.2，只看 OOS 窗
  案A_IS与OOS双窗同改: 同一格须在 IS 与 OOS 两窗同时满足原两阈
  案B_同波动缩放对照_仅OOS: 对照臂先按各格实现波动等比缩放，再看 OOS 两阈
  新尺_案A且案B: 两案并用＝A∧B
approximation_note: 实现波动量级 σ=|年化收益|/|Sharpe|（年化收益由 total_return 与 n_days 几何折算；Sharpe 与收益符号相反时取量级，因 λ 是比值故抵消）；参照臂按 λ=σ_cell/σ_ref
  等比缩放：Sharpe 对缩放不变，回撤/收益按 (1+x)^λ−1 几何缩放——只有端点统计量时的近似，随册申报；复算时（令 D 晨裁⑤）应改从逐日净值序列量 σ，本近似届时退役
prereg_ref: docs/_working/cband_neighborhood_campaign/01_prereg_axis_sets_v1.yaml
