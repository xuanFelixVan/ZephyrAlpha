# ───────────────────────── 3. PIT 闭卷纪律（实算证据）
pit_governance:
  cutoff: '2025-09-09'
  hard_rules:
    - 全部取数 SQL 上界 trade_date <= '2025-09-09'（SQL 文本随 payload.panels.sqls 导出）
    - 面板装载后二次断言端点 ≤ 切点；请求 cutoff 后移直接 AssertionError（实测 --cutoff 2025-12-31
      → "PIT 闭卷切点不可后移：请求 cutoff=2025-12-31 > 战役切点 2025-09-09（用切点后数据=换卷作弊）"）
    - 前瞻收益在面板内 shift(-n) 自然截断 ⇒ 信号端自动截止：1 日=2025-09-08、5 日=2025-09-02、20 日=2025-08-12
    - 收益端最大实现日=2025-09-09（=切点），无切点后收益参与
  panel_endpoints: {signal_window_first: '2021-01-04', panel_last_trade_date: '2025-09-09',
                    forward_return_end_max: '2025-09-09'}

# ───────────────────────── 4. 统一实现口径（六问共用，与先例对齐）
caliber:
  signal: c1_market.money_flow FINAL.main_net_inflow_pct（主力=大单+超大单净买 ÷ 主力档毛成交 ×100）
  price: c1_market.kline_daily(close, market_type='A_share', close>0) × c1_market.adj_factor
    （argMax(adj_factor, ingest_ts) 去版本；后复权自算——同 PQ-0110 先例 pool_note 口径）
  forward_return: wide.shift(-n)/wide - 1（交易日历对齐；端点停牌无行→NaN→该名该日剔除，
    禁把停牌期拉伸进收益窗）
  ic: 逐日截面 Spearman 秩 IC（向量化 percentile-rank Pearson，并列平均秩），日截面有效名 ≥300 方计入
    （MIN_NAMES=300，同 PQ-0110 先例）
  inference: 日频 IC 序列均值的 Newey-West HAC t（Bartlett 核，lag=前瞻窗长 n，重叠窗修正）；
    实现与 .runtime/tmp/st-metaq-20260923/probes/stat_market_PQ-011x.py:73-84 逐式等价
  split: exam_plan method 原文"60/40 样本内外切分"=交易日历时间序前 60% 为样本内、后 40% 为样本外，
    切点按 IC 序列下标 int(n*0.6)，禁随机打乱；月度滚动复考=按自然月 IC 均值分布一并披露
  pool_primary: 全 A 现价池（kline_daily 有成交且 money_flow 有信号；题面未要求 ST/退市过滤，同 PQ-0110 先例）
  pool_variant_for_disclosure: 稳健性变体=剔 ST（stk_limit.st_flag PIT）∧剔涨跌停锁板∧成交额≥1e7∧
    剔次新（上市<120 日历日），仅作披露不改主判据
  exam_plan_source: PG meta_question.meta_question.exam_plan 运行时回读（判据零改动，禁本地另写）

