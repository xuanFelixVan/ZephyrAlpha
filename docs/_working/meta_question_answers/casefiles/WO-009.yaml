# ───────────────────────── 6. 与 equity_penetration 的关系裁定（工单配套④）
equity_penetration_ruling:
  code_read: scripts/entity_graph/equity_penetration.py L50-51 _NON_HOLDING=("pledge","judicial_frozen") + L181 并入口跳过
  current_effect_measured: >-
    ig_equity_edge 现存 804 行 relation 仅 shareholding(1)/invests_in(803)，质押/冻结=0 行
    → 该排除今天是个"零行命中"的守卫，作用在防止未来 ig 侧灌入非持股事件，而不是造成 PQ-0072 的原因
  decision: 维持排除（不解除）
  reasons:
    - 语义：质押/司法冻结在股权上设的是质权/处分限制，不转移所有权与表决权，把它当持股边喂进穿透链会推出错误的控制关系
    - 职责：PQ-0072 的缺口是"事件不驱动版本推进"，已由事件载体承接；把事件塞回持股边是用错误的表回答正确的问题
    - 风险：解除排除=改写 275,370 对持股边的成员集，穿透深度/实控人判定/牛散跨票信号全部连坐，且 edge_holding 的
      UNIQUE(from,to,role,valid_from,source) 会开始混装两套语义的行
  how_consumers_should_use_the_carrier: >-
    持股边保持纯净，质押作为"附标层"左连接叠加：
    metaq_pledge.v_holder_edge_version_timeline（统一版本流，version_kind 区分 holding_snapshot / pledge_event）
    或 metaq_pledge.holder_versions_as_of(code, as_of_date[, knowledge_cutoff]) 做 PIT 取版本；
    实测烟测：000033 @2020-06-30 → 函数返回 3 条版本、视图该票 6 条版本行
  production_code_changed: false   # 故本单无待落地业务补丁；仅白名单门禁补丁（见 pending_landing）

