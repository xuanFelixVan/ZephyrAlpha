# ───────────────────────── 1. 判据精确复述（考试原尺子，一字未放宽）
acceptance_criterion:
  q_id: PQ-0072
  question: 股权质押/冻结公告事件与 edge_holding 现行版本（as_of=2025-12-31）的时序一致性是否满足 PIT（事件日晚于版本生效日的违规样本=0）？
  exam_plan:
    method: 质押/冻结公告事件对版本时戳全量比对
    criterion: 事件日与版本生效日的时序合规率
    threshold: 违规样本=0
  operational_definition:
    event_side: >-
      CH c3_fundamental.equity_pledge_detail，WHERE announce_date <= '2025-09-09'（PIT 闭卷切点）
      AND shareholder_name != '' → 112,822 条事件
    version_side_key: >-
      (股东名去空白归一 re.sub(r"\s+","") , 6 位股票代码)；edge_holding 侧 symbol 由 to_entity
      'CO:000415.SZ' 去前缀去后缀得到；事件侧 symbol 本身即 6 位裸码（实测 dot_in_symbol=0）
    version_side_value: 该键下 max(valid_from)（考试探针取全部版本的最大生效日，不加时点过滤——原样继承）
    violation_operator: str(announce_date) > str(max_valid_from)   # 与考试探针同为 ISO 字符串比较
    denominator_exam: 匹配成功的事件条数（考试实测 110,690，即 112,822 中 2,132 条无对可配）
  source_of_truth:
    - docs/_working/meta_question_answers/results/b2/PQ-0072.yaml（three_check.caliber + evidence 数字）
    - .runtime/tmp/st-metaq-20260923/probes/l2_q0072.py（探针实现）
    - PG meta_question.meta_question q_id=PQ-0072（题面与 exam_plan 原文）
  judge_code: scripts/governance/meta_question/wo009/recheck_pq0072_violation.py::judge

# ───────────────────────── 2. 载体选型裁定（工单配套①）
selection:
  options:
    A: 旁挂双时态 event_version 表（新增 metaq_pledge.pledge_event_version，不动 edge_holding）
    B: edge_holding 加 as_of 链（本单约束下只能做成"旁挂新表+视图"，不得 ALTER 原表）
  decision: A
  one_line_reason: >-
    违规的实质是"事件发生了但版本链没推进"（实测 5,238 条里 4,678 条在事件日之后该对根本没有任何持股版本行），
    这是事实缺失不是时戳写错——所以必须新建一条能表达"事件即版本"的双时态链，而不是去改既有快照表的日期列。
  evidence:
    - name: 换口径无效（本单复测）
      detail: 事件日改用 pledge_start_date 后违规 2,775/110,690=2.51%≠0
      note: 考试作业簿登记为 44%，本单实测 2.51%，两值都不归零→"换口径无效"定性成立；差异已如实留档（见 open_items.O5）
      source: .runtime/tmp/st-metaq-gc-20260924/wo009/probe03_out.json Q1
    - name: 违规性质分解（决定性证据）
      detail: >-
        5,238 条违规中：事件日之后该对仍有持股版本公告的仅 560 条；4,678 条在事件日之后再无任何持股版本行
        （版本链停在事件前，如 000506 中润置业 2012-10-27 事件 vs 最新版本 2009-06-30）
      implication: 改 valid_from 等于伪造持股事实 → 只能新增事件驱动版本
      source: probe03_out.json Q2
    - name: 方案 B 污染面
      detail: >-
        需向 public.edge_holding（1,500,341 行）灌入 112,822 行=+7.52%，且引入 role 词表外的新值
        （现库 role 仅 shareholder/invests_in/shareholding），穿透链与牛散/实控人信号全部下游连坐；
        且该表只有 valid_from/valid_to 单时态轴，无处安放"何时知道"→ 语义上装不下本题
      source: probe03_out.json Q5 + information_schema 实测
    - name: 匹配键唯一性（可行性）
      detail: node_entity.name_norm 全局唯一（实测同名多实体=0），edge_holding 侧 (归一名,代码) 对无多实体歧义
        → 事件↔版本可确定join，不需引入模糊匹配
      source: probe03_out.json Q3/Q4
  open_source_contrast:
    sql_2011_temporal_tables: >-
      SYSTEM_TIME 只给单时态版本链，解不了"回填何时被知道"——本表按 SQL:2011 的 valid_from/valid_to
      做区间，并额外加 transaction_time（PG 侧 DEFAULT now()），等价 PERIOD + 装载时刻
    scd_type2: 仅记 current 行，历史快照语义靠 valid_to 闭链（本表已实现）；但 SCD2 无"知识到达"轴，故不足以单独支撑 PIT
    bitemporal_dbt_snapshots: >-
      dbt snapshot 的 valid_from/valid_to + dbt_updated_at 双轴是本设计直接对照的范式；
      本表 event_uid=内容指纹做 snapshot 唯一键、ON CONFLICT DO UPDATE 等价 dbt 的 change-detection 重放
    convention_name: 双时态（bitemporal）事件版本载体，valid_time=公告生效时点，transaction_time=入库时点

# ───────────────────────── 3. DDL 落地（工单配套②）
ddl:
  schema: metaq_pledge
  objects:
    table_main: metaq_pledge.pledge_event_version        # 事件版本载体（双时态）
    table_runlog: metaq_pledge.backfill_run_log          # 分片断点账本（续跑真源）
    view_current: metaq_pledge.v_pledge_event_current
    view_timeline: metaq_pledge.v_holder_edge_version_timeline   # 持股快照版本 ∪ 质押事件版本
    function_pit: metaq_pledge.holder_versions_as_of(text, date, timestamptz)
  deployer: scripts/governance/meta_question/wo009/apply_pledge_event_version_ddl.py
  idempotent: true                # 全 CREATE ... IF NOT EXISTS / OR REPLACE；重放实测 20 条语句零报错
  verified: "VERIFY metaq_pledge: OK（2 表 + 5 索引 + 2 视图 + 1 函数 + 时区列实核）"
  timezone_compliance:
    rule: RULE-SCHEMA-TZ
    facts: known_at/recorded_at/finished_at 均 TIMESTAMPTZ；因果 CHECK 用 (valid_from::timestamp AT TIME ZONE 'Asia/Shanghai') 显式写时区；回填脚本零 datetime.now()/time.time()
  key_invariants_plain_language:
    - "一行=一条质押公告的一个版本；主键是源行全列内容指纹（源表无主键，实测窗内零重复行），所以重放不会长出第二行"
    - "valid_from=公告日（市场从这天知道）；valid_to=同对下一个不同公告日，故 CHECK 恒要求 valid_to>valid_from（零长区间被硬拦）"
    - "known_at=载体入库时点（transaction_time）；CHECK 硬拦 known_at<valid_from——不许未卜先知"
    - "business_from/business_to 是业务真实区间，与公告日分列：这正是'换口径无效'的形状——判据要的是知识时点，不是业务时点"
    - "源列 ingest_ts 实测不可当 transaction_time 用（DEFAULT now() 读时求值，全表仅 2 取值且最大值随查询时刻漂移）→ 已弃用并在列注释里写明"
    - "股东实体解析：只在归一名唯一命中时写 holder_entity_id，未命中必 NULL（反幻觉，禁编造实体），并留 holder_resolution 标明"
    - "business_span_inverted：源数据倒挂的行照原值保留 + 强制申报（CHECK 保证声明与数据逐行吻合），不改写不丢弃"
  write_safety_by_code: >-
    部署器每条语句先过 assert_statement_safe()：全局禁 DELETE/UPDATE/TRUNCATE/ALTER TABLE/DROP TABLE/DROP COLUMN；
    任何非目标 schema 的关系引用即拒跑；新建对象必须 schema 限定（防 search_path 打偏）。
    唯一维护通道 --rebuild-carrier 只能 DROP 本单自有 5 个对象（逐字白名单），public.* 在该路径同样不可达。

