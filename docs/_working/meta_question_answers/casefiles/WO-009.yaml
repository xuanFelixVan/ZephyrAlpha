  integrity_assertions:             # 与"归零"正交的 7 项，防纸面归零
    I1_row_equality: {source: 112822, carrier: 112822, ok: true}
    I2_fingerprint_recomputable: {distinct_uids: 112822, source_dup_uids: 0, carrier_only: 0, source_only: 0, ok: true}
    I2b_value_level_sample: {rows_checked: 3000, fields: 12, mismatch_by_field: {}, ok: true}
    I3_chain: {bad_span: 0, overlap: 0, gap: 0, is_current_mislabel: 0, ok: true}
