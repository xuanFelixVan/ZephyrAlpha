# WO-004 复权表族级联修复

## 1. 为什么这张单存在（不是原工单范围，是本战役自造缺陷）

WO-004 依 Owner 裁定（复权真源 = `raw × adj_factor`）重算并换名日线后复权表之后，
本总包独立实测发现族内两张派生表未跟进：

| 比对（周末收盘 vs 日线末收盘） | 不符率 |
|---|---|
| 周线 vs **新**日线 | **71.77%**（3,748 / 5,222） |
| 周线 vs **旧**（已判错）日线 | 5.65%（295 / 5,222） |

即周线/月线仍建立在**已被判定为错误**的基座上，`kline_daily_hfq` 与 `kline_weekly_hfq`
对约 72% 的标的给出互相矛盾的后复权价——**同一项目内双真源**。
施工车道曾把此项记为"待裁 T2"；本总包定性为**生效中的数据冲突**，
不属于可挂起的口径之争，故另派修复而不代拍。

## 2. 修复配方（沿用 WO-004 已验证的可逆路径）

1. 以**已修正的** `kline_daily_hfq` 为输入，按反推并验证过的聚合规则重算周线、月线到新表；
2. 族内对拍四闸全绿后才原子换名；
3. 旧表整张留存：`kline_weekly_hfq_legacy_20260924`、`kline_monthly_hfq_legacy_20260924`；
4. 提供反向换名回滚；月度抽检器带**负控**（对 legacy 跑必须报红，否则尺无牙）。

## 3. 本总包盘外独立复验（不采信施工方自报，全部自己跑）

复核命令与实测（`c1_market`，CH reader）：

| 验收项 | 实测 | 判定 |
|---|---|---|
| 周线末收盘 vs 新日线末收盘 不符数 | **0 / 5,909** | 达标（原 71.77%） |
| 月线末收盘 vs 新日线末收盘 不符数 | **0 / 5,909** | 达标 |
| 周线 OHLC 偏序违例 | **0** | 达标 |
| 周线行数 / 标的数 | **2,127,400 行 / 5,909 只**（1990-12-21~2026-09-24） | 覆盖**扩容**：旧表 1,856,392 行 / 5,222 只 |
| 旧表留存 | `kline_weekly_hfq_legacy_20260924` 1,856,392 行；monthly 同规则留存 | 可回退 |
| 族内表清单 | daily / weekly / monthly 三张 + 三张 `*_legacy_20260924` | 六表并存为设计态，非残留 |

**顺带解决的一个历史缺口**：修复前周线只有 5,222 只标的而日线有 5,909 只，
差 **687 只**从来就没有周线。本次重算后周线标的数与日线齐平（5,909），
即该缺口被一并补齐（行数增量 +271,008 即其体现）。

## 4. 复考影响

PQ-0012 / PQ-0131 的判据是**日线**复权链对 `raw × adj_factor` 的违例数，
已由 WO-004 侧判 pass（402,607 点违例 0）。本单不新增问的桶位变化，
但**移除了一个会让后续任何用周/月复权价的考题得出错误答案的隐患**，
并使"复权链"这一条源线在日/周/月三个粒度上首次达到同源一致。

## 5. 遗留（如实登记，不自解）

1. `technical_indicator` 等**由复权价派生**的下游表是否需按新族重刷：属 production 流转门位，
   未自行动手，留 Owner 拍（与本单原车道 T3 同源）。
2. 复权因子的**日增量腿**仍取自外部报价流而非本地 `raw × adj_factor`，
   长期看应改为同一真源派生，否则每日新增段仍可能与重算段口径分叉（原车道 T1，production 门位）。
3. legacy 三张表的留存处置时限（占盘），建议随下轮冷储盘点一并裁定。
