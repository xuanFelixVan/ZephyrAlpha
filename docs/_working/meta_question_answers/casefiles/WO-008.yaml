pit_rule_delivered: >-
  双时间轴分离（B-②）：valid_from=源业务期 as_of（主营构成/ig_fact 观测），registered_as_of=载体入册期
  （源行 created_at），两列各自存、判据基准可选（本册两基准并报）。锚点否证才闭合 valid_to：节点退役
  （ig_node.valid_to→pit_note=anchor_node_retired）或全部支撑成员边到期（ig_node_company.valid_to 取最大
  到期日→pit_note=membership_expired）。同名产品跨期归属变更不改写本册行——归属时变真源在
  ig_node_company(valid_from/valid_to/pit_strength)，册内经 node_id/symbol 外派 join 取历史，双写必漂移
  （RULE-SSOT）；同簇多锚点候选并存（anchor_candidates 计数留痕），主锚点按 (-置信, route rank, node_id)
  确定性择一。as-of 谓词：valid_from<=:D and (valid_to is null or valid_to>:D)。实测滞后分布：
  library_lag_legit 101,387 行（入册晚于业务期=合法滞后，不计违例）、无业务期轴 3,452 行、真倒挂 0 行。

