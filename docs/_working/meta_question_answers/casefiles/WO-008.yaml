self_adjudications:
  - "主判据口径随裁定链走：裁定⑤ 定 5% 时按 4.6% 证据同口径（端点级）建判据；A+A+A 收窄分子时同步实现唯一节点档；终版 B 又指定端点级+双口径并报——本册三档同时机读化，任何一版裁定都能机械复现，不因裁定来回而重做（这是把'口径之争'沉淀成数据结构的第一次尝试）"
  - "is-a 与包含关系拒绝入判据（实测诱惑 59.6%）：实体对齐通行 is-a≠same-as，采纳即污染 ig_edge 语义"
  - "k3 规格剥离设数字前置条件：无数字/拉丁线索不剥，防 '海参'↔'参' 过度归一（探针实证激进剥离会把 9 个词剥成空键互并）；归一到空键退回原字面自成一簇"
  - "company_set 弱锚定计入主判据（裁定⑤ 证据口径如此）但显式量化分离，并在 honesty_note 禁止下游把 5.89% 当入图率引用"
  - "ig_entity_code_map 只作 symbol 等价扩边不作产品锚（88 行、master_id 系非上市主体，产品面零命中）"
  - "外部依赖全部做成注入口而非硬读：WO-007 未完成产物零接触，合批时总包接线（并发隔离优先于一次性好看数字）"
  - "体量优先可重放而非完备：全量边审计（57,459 行）不落盘，改由册头 sha256 + 取数 SQL 机械复现"

