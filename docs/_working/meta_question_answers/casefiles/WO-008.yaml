register_design: >-
  实体对齐通行五段式（blocking→candidate→matching→clustering→scoring，对标 recordlinkage/dedupe 的
  score+relation 分档）：词表采集 → 三级归一化 blocking（k1 NFKC/casefold/去空白标点；k2 括注剥离；
  k3 数字锚定的单位规格剥离）→ canonical_product_id='CP-'+sha1(k3)[:10]（内容派生、跨重放稳定）→
  五路由机械锚定（R1 主营构成 node_ref 直挂 / R3 图谱名与别名 / R2b 主营构成-symbol / R2a produces-symbol /
  R4 外部注入）→ 锚点沿同一性链接传播（exact 不折、alias×0.95、rule×0.85）→ 三档判据实测。
  identity 铁律：is-a（subtype_of 52,937 行"成分→菜品"）与名称包含关系不传播锚点。
  体量治理：不存 canonical_label/norm_key（可重算，双写必漂移）；全量边审计改由 sha256+SQL 复现。
  规模：104,839 链接行 / 102,128 规范簇（singleton 101,097、pair 441、multi 590）；
  全库 match_basis=exact 55,901 / alias 19 / rule 6 / unmatched 48,913。

