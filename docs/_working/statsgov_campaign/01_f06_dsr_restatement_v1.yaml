pbo:
  registered_survivor_set:
    computable: false
    code: NOT_COMPUTABLE
    reasons_three_layers:
    - 名单层：f06_survivors.csv 仅 1 行，cpcv.compute_pbo 要求 n_trials>=2（src/zephyr/backtest/core/cpcv.py:234 直接拒）
    - 逐期层：出生批 grid_20260916-123551 无 net_returns.parquet（该产物晚于本批才加），IS 窗逐期收益已不可得
    - 成对层：其余成绩册（codesym/grid_strategy_oos）只有每候选一组 (IS,OOS) 标量 ⇒ n_splits=1，PBO 退化成 0/1
    what_would_be_needed: 同空间同 seed 重跑出生批并持久化 net_returns.parquet（=数据/算力依赖，非本班零数据范围），须呈批
  substitute_batch:
    computable: true
    batch: grid_20261010-210933
    matrix_shape_TxN:
    - 970
    - 10080
    columns_used: 10076
    columns_dropped_not_usable_in_every_split: 4
    window:
    - '2020-01-01'
    - '2023-12-31'
    splits:
      n_groups: 8
      k_test: 4
      n_splits: 70
      t1: None（日频点标签，无 purge；本矩阵是日净收益而非标签窗）
      embargo: 0
    pbo: 0.4429
    mean_logit: 0.3332
    omega_min_max:
    - 0.0239
    - 0.9896
    reading: 从同子空间 10076 格里挑 IS 最优：其在样本外跑输中位数的折占比 = 0.4429
    transferability_caveat: 替代批与出生批配方交集=实测 0 个（出生批 10080／替代批 10080）；交集为 0 ⇒ 本读数不能重述 1.721 那一格，只能回答同一子空间的结构性问题：『从 10,080 格里挑 IS 最优，样本外跑输中位数的概率有多大』
    neff_recheck:
      computable: true
      subsample_cols: 1600
      subsample_selection: 等距步长（确定性，无随机种子）
