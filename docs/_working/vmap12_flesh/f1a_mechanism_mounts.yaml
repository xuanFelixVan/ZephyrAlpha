15 个=DSC-GAP-NEWSGHOST/MACRO/DUPGUARD/CONSENSUSCHAIN/NAV/EXECEP/FFVAL/FFSIG/ARCHIVE-AUDIT/CODEBACKUP/L2TICK/REPLAY/MIRROR/TERMINUS/RECDIFF（config/data_supply_chain_map.yaml counts.gap_nodes=15 机生）。
