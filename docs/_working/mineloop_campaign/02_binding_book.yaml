    实测（grain_probe3）：1,166 行/584 uniq report_date/1978-01-31..2026-08-31；
    月度 m1_yoy/m2_yoy 2025-01..2026-08 连续无缺月；多版本行按 anyLast 取末版（禁把两版当两月）。
