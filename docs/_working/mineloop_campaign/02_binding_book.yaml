    table: c1_market.kline_index
    date_col: trade_date
    col: close
    symbol: "000300"
    dev_window: 20
    pctile_window: 250
  prose_quote: "下行半偏差 = sqrt(244 × mean(min(r_t,0)^2 over 20 日窗))"
  reviewed_by: st-mineloop-20261010
  review_note: |
    实测：000300 close 5,284 行 2005-01-04..2026-10-09 ⇒ IS 2019-01-04 起有 250 日暖机。
    严格按卡面公式：r=close/close.shift(1)-1；仅取负收益平方均值×244 开方；再取 250 日滚动分位。
    禁改回全波动口径（卡面原文：改了就是另一张卡）。件内 synthetic_vix.py 走期权 IV 链，
    与本卡面声明的"由指数收益重建"不同源⇒本绑定按卡面公式实现，不调该件（差异在此声明）。
