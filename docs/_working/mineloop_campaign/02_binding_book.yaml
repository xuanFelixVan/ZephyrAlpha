  review_note: >-
    两档配对的引句均经 verify_face_pair_quotes/verify_arm_quote 机械校验逐字命中该卡面对应文本域；
    两张 level_map 逐字取卡面 data_binding.level_to_cap_map（five_state_native 与 binary_full_clear），
