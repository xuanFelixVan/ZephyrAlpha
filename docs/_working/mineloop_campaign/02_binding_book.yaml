    开考前置门 G-CAL-1 已消解（实测面=12_gcal1_reconciliation.yaml，2026-10-11 02:0x）：
    卡面比值口径逐日涨停家数年均 64.8/80.9/87.3/76.8/43.9/89.1/78.7（2019..2025），
    与卡面 evidence 锚「年均 44-89 家（65.4/81.9/87.9/77.0/44.1/89.2/77.0）」逐年吻合（差 ≤1.5 家=后续新日入库）；
    不复权比值口径与后复权比值口径差 ≤0.3 家/日（表选择对本卡信号无实质影响）；
    在册 R1_L11_ledger.md:77「hfq 得 3882 荒谬值」根因实测=后复权**绝对价** × 不复权**涨停绝对价** 混空间
    （该式逐年均值 3147/3303/3456/3639/3893/4098/4207，2023 段正落在 3882 量级），非卡面比值式之过。
    接线全部取卡面原文：S_{t-1}=r_{t-1}>=limit_pct-0.002（r=close/lag(close)-1，后复权空间），
    主信号=mean_{i∈S_{t-1}}(close_{i,t}/close_{i,t-1}-1)，|S_{t-1}|<20 置 NaN，
    目标=csi300 次日收益（与执行器 shift(-1) 同口径）。
    开盘口径另档建档（中位数与天数入运行附注），未占机判入口（卡面 two_form_spread 自记不作一票否决门柱）。
    未判柱清单（分数册附注必带，G-ANNOT-1）：ic_floor 的 IC_IR 半边（series 路 ic_ir=None）、
    lag_profile（t+1..t+3，现器硬编码 shift(-1)）、two_form_spread（无冻结检验量）。
