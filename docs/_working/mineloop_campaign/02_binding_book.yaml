schema_version: mineloop-binding-book/v1
title: 矿考循环班绑定册（卡面原文引句 → 算子实现，一卡一格；未列卡=不绑不出分）
built_by: scripts/backtest/fexam/card_binding.py
owner_sid: st-mineloop-20261010
discipline: |
  每格 prose_quote 必须是卡面 data_binding 原文子串（运行器机械校验，找不到即拒绑）；
  算子只做卡面已冻结的算法，零自创口径；判据面（window/buckets/pillars_numeric）由
  card_binding.run_one 出分前后做内容级断言，被改动即 BindingIntegrityError 整卡中止。
