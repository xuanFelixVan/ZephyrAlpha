negative_knowledge:
- id: NK-MINELOOP-001
  kind: 语义在机器侧无对应态
  statement: >-
    考试卡 TDM-X-R1-01/comparison/02 与其版本卡 06 所写"级别→仓位映射"里的
    L3 三档梯度 80/60/40%（原文"梯度参考机构软去杠杆阶梯"）在在册判定件
    src/zephyr/risk/core/drawdown_state_machine.py（MOD-RK-049）里**没有对应三态**；
    该件只有 NORMAL/WARN/DANGER/CRISIS/KILL 五态＋（人工复位才进入的）RECOVERY 阶梯。
  verdict: 原语义不可考（不是"还没找到映射"）
  verdict_basis:
  - 实测 position_cap 属性逐档 return 行：NORMAL 1.0/WARN 0.8/DANGER 0.5/CRISIS 0.3/KILL 0.0，
    RECOVERY=0.25*(recovery_step+1)；无 0.6/0.4 档，亦无"同一态内三子档"结构
  - 实测状态枚举六值（_SEVERITY_ORDER 键集），无任何梯度子档字段
  - 全仓查"80/60/40"形态的减仓表：在册件内零命中（02/06 卡面为唯一载体）
  reopened_by: 统筹裁定（开班令预付裁定④）要求改锚五态表并记本条负知识
  reopen_condition: 若在册件新增三子档，或发现某在册件承载 80/60/40 三档减仓语义，本条作废并须重评 07
  landed_in:
  - docs/03_modules/_domain_backtest/exam_cards/exit_flow/X1/（07 转正后的卡面 lineage 节）
  - docs/_working/mineloop2_campaign/01_card07_draft_and_approval.yaml（草案期人读）
- id: NK-MINELOOP-002
  kind: 机制在机器侧不存在
  statement: >-
    02/06 关臂原文"触发即一次性全清、**恢复即一次买回**"里的"恢复即买回"半边，
    在在册判定件里**没有任何自动路径**——KILL 态唯一出口是 request_manual_reset
    （需持仓清零/挂单已撤/锁新开仓三项人工确认，另受复位窗口/冷却/永久锁定三守卫）。
  verdict: 原语义不可考（回测面无人在场＝出口永不开）
  verdict_basis:
  - 实测 evaluate()：`if self._current is DrawdownState.KILL: pass  # KILL 无自动出口（§3.7）`
  - 实测 _DEESCALATION_PATH 键集 = {WARN, DANGER, CRISIS}，**不含 KILL**
  - 可执行红证：tests/backtest/test_card_binding.py::test_replay_levels_kill_is_sticky_and_quantified
    （净值修复后级别仍驻留 KILL，且凭据 kill_stuck_days 量化驻留日数）
  reopened_by: 统筹批复 A2（2026-10-12）令按负知识入册，与 NK-MINELOOP-001 同族
  reopen_condition: 若回测面引入"虚拟人工复位"事件源（须另立卡面口径并呈批），本条转为已覆盖面
  landed_in:
  - docs/_working/mineloop2_campaign/01_card07_draft_and_approval.yaml（negative_existence_knowledge）
- id: NK-MINELOOP-003
  kind: 阈值身份被叙事改写
  statement: >-
    卡面"日亏≥2%/≥4%/≥6%"三值**不是参数，是叙事改写**：其数值身份是在册件的风险轴阈值
    （warn_var/danger_var/crisis_var），而阈值册 THD-DRAWDOWN-001/002/003 全是**回撤**轴
    （0.05/0.10/0.15），册内没有 2%/4%/6% 的日亏条目。
  verdict: 三值不得作为"日亏参数"另行冻结或再找映射
  verdict_basis:
  - config/trading_decision_map.yaml:3738 原文"L1 警戒（日亏≥2%：禁加仓）"
  - 同文件 :3746 threshold_refs: [THD-DRAWDOWN-001, THD-DRAWDOWN-002, THD-DRAWDOWN-003]
  - alert_threshold_registry.yaml:69-70/88-89 metric_zh="当前回撤（相对峰值）" value=0.05/0.10
  - drawdown_state_machine.py:150-152 warn_var 0.02/danger_var 0.04/crisis_var 0.06（注释 :133"升级 VaR_95 阈值"）
  - 全仓唯一日频真实调用点 scripts/backtest/sim_daily_runner.py:1410 只喂 drawdown_pct，不喂 var/cvar
  reopened_by: 统筹批复 A1 附带条件②令入 lineage（人读）＋本件（机读）
  reopen_condition: 若阈值册新立 2%/4%/6% 的日亏条目，或 36 号侧产出把"日亏"正式定义为 VaR 代理，本条重评
  related_ruling: 统筹批复 A1 裁乙（var/cvar 两槽不喂）

