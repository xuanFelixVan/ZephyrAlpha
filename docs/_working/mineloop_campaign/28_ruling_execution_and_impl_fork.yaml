ruling_3_wo_a4_spec:
  title: WO-A4 展开前冻结（pre-expansion dimension freeze）
  problem_measured: >-
    执行器次序＝compiler.compile(ctx) 全展开 → 再按 subspace 过滤（factory_grid_executor.py:1951 compile→1954 if subspace→1956 过滤 recipes_all）；
    且 GridCompiler._expand 在内存里把 combos 整表铺开（position_recipe_compiler.py:269）
    ⇒ phase>=2/3 或 ramp=True 时空间从 362,880 跳到 725,760/52,254,720，直调 compile 实测 MemoryError；
    故风控 5 维（J/X_stop/X_breaker/X_sector/K）无法用 --context-json＋--subspace-json 组合窄扫（先炸后筛）
  design: >-
    ①给执行器加"维级钉值前置"入口（--freeze-dims-json 或复用 --subspace-json 语义改为编译前生效）：
    把每维候选集在 compile 之前裁成 subspace 允许的子集，再交给 GridCompiler（GridCompiler.from_yaml 接 dict/路径，
    可在内存里构造"值子集化后的 schema"，零改编译器语义）；
    ②加 --schema-path 覆盖口（route_b 同处改动）；
    ③产物 batch_meta 必须记录 subspace/freeze 与生效 schema 路径＋sha256，否则日后无法区分"同一空间的不同抽样"与"不同空间的同抽样"（可比性判据）；
    ④验收＝三条：(a) phase=3+ramp=True 全钉 5 维外的核点，compile 不再 MemoryError 且 n_raw=1（逐核点）；
    (b) 现册默认路径逐字节零漂移（不带新旗时行为与今 dev 一致，须以既有 4 处 n_raw 断言零改动为证）；
    (c) 与 --eval-backend cpu/gpu 双后端配对时逐位等价（沿用 st-gpux 的 N-3 配对法，禁自造对拍口径）
  blast_radius: 只动 factory_grid_executor.py 的编译前置段＋batch_meta 两个字段；不动编译器、不动卡面、不动判据；须与 st-gpux 协调同文件
  trial_ledger: 风控族窄批试次走 --exploration-ledger 探索分册（在册处方），不占考试 N 账本
  status: 排产待窗（CH 窗内零代码改动）

