    future_function: "通过。'is_lu_{i,t} = (close/lag(close)-1 >= stk_limit.limit_pct - 0.002)'、'promotion_rate_t = countIf(is_lu_{t} AND is_lu_{t-1}) / nullIf(countIf(is_lu_{t-1}),0)' 全用 t/t-1；辅轴 next_day_emotion_index_delta 本次不考"
