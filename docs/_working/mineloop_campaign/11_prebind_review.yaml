    op: limit_up_premium_close_series
    args:
      universe_table: c1_market.kline_daily_hfq（卡面 signal_table 原文）
      limit_rule_table: c1_market.stk_limit
      limit_up_flag: "r_{i,t-1} = close/lag(close)-1 >= limit_pct - 0.002（卡面'先按卡 09 口径标出 t-1 日的涨停集合 S_{t-1}（r_{t-1} >= lim_{t-1}-0.002，r = close/lag(close)-1）'）"
      signal_col: "limit_up_premium_close_derived = mean_{i∈S_{t-1}}(close_{i,t}/close_{i,t-1}-1)（卡面 signal_column + derivation 原文）"
      set_floor: "nullIf(|S_{t-1}|,) <20 → NaN（卡面 min_set_size 原文）"
      suspension_rule: "停牌股（t 日无行）不入截面均值并在 run 附注计缺失数（卡面原文，须真计缺失数）"
      window: "IS 2019-01-04..2023-12-31 / OOS 2024-01-01..2025-09-09（卡面 window）"
      target: "kline_index symbol='000300' close → next_day_return = close(t+1)/close(t)-1（卡面 target_source 原文，与现器 shift(-1) 同口径）"
      buckets: "quantile_decile→10，min_obs_per_bucket=60（卡面；现器不校 60 只校 len>=n_buckets*10，窗内约 1622 日→每桶约 162，满足，须在附注写实）"
    pandas_steps:
      - "df = ch(kline_daily_hfq, cols=[symbol,trade_date,close,open], trade_date∈[2018-10-01..2025-09-09])  # IS 前留暖机与 t-1 集合"
      - "lim = ch(stk_limit, cols=[symbol,trade_date,limit_pct]) 按 symbol×trade_date asof 前向填充、FINAL/argMax 去重（去重口径沿用 emotion_lane_status.yaml:334 在册配方，本车道未实测）"
      - "df['r'] = df.groupby('symbol')['close'].pct_change(); df['is_lu'] = df['r'] >= df['limit_pct'] - 0.002"
      - "df['prev_is_lu'] = df.groupby('symbol')['is_lu'].shift(1); df['prev_close'] = df.groupby('symbol')['close'].shift(1)"
      - "df = df[df['prev_is_lu']]  # 截面=S_{t-1}"
      - "g = df.groupby('trade_date'); n = g.size(); prem_close = (g['close']/g['prev_close']-1).mean()"
      - "prem_close[(n < 20) | prem_close.isna()] = NaN  # 卡面 min_set_size"
      - "idx = ch(kline_index, symbol='000300')['close']; tgt = idx.shift(-1)/idx-1"
      - "calibration_exam.run_card(card, signal=prem_close, target=tgt)  # 开盘口径另建 prem_open 序列仅入附注，不占 run_card 入口"
    hardest_step: "昨涨停集合 S_{t-1} 的标记＝pct_change×stk_limit.limit_pct 的 asof 对齐＋去重；此步直接踩在 caliber_supply 闸的 hfq/不复权 互斥上，绑定前必须先做一次两口径日频涨停数对账（开考前置门，见 pre_run_gates）"
