      in_register_recipe: emotion_lane_status.yaml:333-335 已给同卡接线一句话（asof FINAL 去重＋IS_B/OOS_B 过滤），本车道引用未实测
    pandas_steps:
      - "df = ch(kline_daily_hfq, [symbol,trade_date,close], 2018-09-01..2025-09-09)"
      - "lim = stk_limit asof symbol×trade_date + dedup"
      - "df['is_lu'] = df.groupby('symbol').close.pct_change() >= df.limit_pct - 0.002"
      - "df['lu_prev'] = df.groupby('symbol').is_lu.shift(1)"
      - "d = df[df.lu_prev].groupby('trade_date').agg(num=('is_lu','sum'), den=('lu_prev','sum'))"
      - "sig = (d.num/d.den).where(d.den >= 20)"
      - "run_card(card, signal=sig, target=idx_next_day_return)"
    hardest_step: "den 必须是'昨板家数'而非当日在市家数——同一 groupby 上对 is_lu 与 shift(1) 后的 is_lu 分别求和，错一步就把晋级率算成涨停占比"
  score_run_annotation_required: "未判柱＝IC_IR 半边、lag_profile、promotion_ladder；首批 N=1 的在册定位（emotion_lane_status.yaml first_batch）与本判定不冲突"

