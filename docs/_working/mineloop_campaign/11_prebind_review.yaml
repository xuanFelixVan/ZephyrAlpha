    caliber_supply: "⚠ 命中风险须在开考前消解（不作 reject 的唯一理由=母卡 09 与在册配方链同绑 hfq 且已 examined）：卡面绑 `c1_market.kline_daily_hfq + c1_market.stk_limit` 并自述'全部比值在后复权空间内计算（同一 symbol 相邻两日复权因子一致，比值免污染）'；在册另有相反实测口径 R1_L11_ledger.md:77 '涨停判定 MUST 不复权 kline_daily + stk_limit（任务书 §3，hfq 得 3882 荒谬值）'。母卡 09 卡面 :52 亦写 'signal_table: c1_market.kline_daily_hfq + c1_market.stk_limit（导生宽表，无单表可直接 SELECT）' ⇒ 两条在册陈述互斥，本车道禁 CH 不能裁"
