  verdict: bindable
  binding_spec:
    op: promotion_rate_series
    args:
      tables: c1_market.kline_daily_hfq + c1_market.stk_limit（卡面 signal_table）
      flag_rule: "is_lu_{i,t} = close/lag(close)-1 >= stk_limit.limit_pct - 0.002（卡面原文，标'卡 09 口径'）"
      signal_col: "promotion_rate_derived = countIf(is_lu_t AND is_lu_{t-1})/nullIf(countIf(is_lu_{t-1}),0)"
      nan_rule: "分母 <20 置 NaN（卡面原文）"
      warmup: "串须 IS 前 60 交易日暖机（卡面原文）⇒ 取数起点不得晚于 2018-09"
      window: "IS 2019-01-04..2023-12-31 / OOS 2024-01-01..2025-09-09 / regimes bull 2019-01-04..2021-06-30、bear 2021-07-01..2024-01-31"
