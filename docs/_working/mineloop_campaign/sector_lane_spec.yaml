- card_id: TDM-E-L2-09/calibration/03_评级上调聚集
  verdict: implementable
  buckets_type: quantile_quintile
  buckets_on: 行业级 5 日评级上调占比（市场级取行业均值作 series）
  signal_table_kind: "非 880 面板：c3_fundamental.research_report，需独立 SQL 模板（表名经 args/registry 注入）"
  signal_column: "industry, rating, rating_change, publish_date, org_name, symbol"
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    industry: "行业分组键"
    rating: "相邻变化方向的取值源（空串行剔除）"
    rating_change: "实测全表非空=0 ⇒ 卡面'以其为准'分支不触发，走自算方向支"
    publish_date: "时间排序键（本表无 trade_date，实测确认）"
    org_name_symbol: "(org_name,symbol) 配对键=相邻变化序列的分组键"
  quote_signal_derivation: |-
    按 (org_name,symbol) 时间序列取相邻 rating 变化方向 → 行业-日聚合：
    上调占比=上调数/(上调数+下调数)（分母 <3 记 NaN，防小样本假信号）；
    series=行业加权均值，panel=行业×日。
    rating 编码序（如 买入>增持>中性>减持）须在开考前以实测取值分布钉死并写入 evidence，禁凭记忆排序。
  quote_buckets: |-
    buckets: {type: quantile_quintile, on: 行业级 5 日评级上调占比（市场级取行业均值作 series）, min_obs_per_bucket: 60}
  pandas_steps:
    - "S = ch_query_df(SQL_RATING_ADJACENT_ROWS.format(...))；df.columns=['d','org','sym','ind','rt']（位置协议）"
    - "df['sc'] = pd.to_numeric(df['rt'].map(rating_score_map), errors='coerce')；剔 NaN（空评级/未知词）"
    - "sort_values(['org','sym','d','sc']) + drop_duplicates(['org','sym','d'], keep='last')  # 同机构同标的同日多行去版本，防同日自环造出假上调"
    - "prev = groupby(['org','sym'])['sc'].shift(1)；up=(sc>prev)&(d>prev_d)；dn=(sc<prev)&(d>prev_d)"
    - "ind_day = groupby(['ind','d']) 聚合 up/dn 计数；ratio=up/(up+dn) where (up+dn)>=3 else NaN（卡面分母<3 记 NaN）"
    - "5 日面：buckets.on 写'行业级 5 日评级上调占比'⇒ ratio 按行业滚动 5 交易日求和后再取比值（sum(up)/sum(den)，非比值均值，防小分母抖动）"
    - "series = 每日跨行业等权均值（见 caliber_conflict）"
    - "bucket = _bucket_response(series, next_day_index_return, n_buckets=5)  # quintile 必须显式传，见 executor_risks §2"
  preflight_required:
    - "评级序映射：卡明令'实测钉死、禁凭记忆'。实测取值集合={买入,增持,持有,中性,减持,卖出,回避}+空串（见 measured_evidence §RATING_DIST），但计数不给出序；在册可引真源有两套且互相冲突（consensus_daily_compute.py:70-78 的 RATING_SCORE_MAP 与 nlp/research_rating.py:38-48 的 RATING_SCORE）。⇒ 本班不选，须由总包/Owner 指定其一并在 evidence 写死；若取前者，注意其 中性=持有=3、减持=回避=2 会造出'转移不计数'的并列对（持有↔中性、减持↔回避 全表占比 0.8%/0.0007%，量级极小但须登记）"
  caliber_conflict: |-
    同卡两处口径不一致：buckets.on=「市场级取行业均值作 series」（等权），derivation=「series=行业加权均值」（带权，权重未给）。
    本班按判据面（buckets.on）取等权，带权版未实现——权重未冻结，禁替它拍数。
  expected_sample_days: "实测窗 2017-01-02..2026-09-30；IS 2019-01-04..2023-12-31 ≈1220 交易日、OOS 2024-01-01..2025-09-09 ≈415 交易日（研报表不受 880 首交易日 2021-08-02 约束，比板块族卡多 2.5 年 IS）"
  is_oos_coverage: "IS 完整可得；实测 IS 窗内逐年行数与 207 行业名单在册，五等分×60 门槛（1220/5=244 日/档）满足；辅轴（行业 5 日超额）因成分表 2026-07-22 起才可用而窗受限，主轴不受影响"
  hardest_step: "评级序映射的选取——卡把'钉死序'交给实测，而实测只能定取值集合不能定序，两个在册映射还互斥；这是本车道唯一必须由总包/Owner 补一刀的地方（其余步骤全机械）"
  reject_reason: null
  head_to_head_note: "pillars.head_to_head 要求与 02 卡（研报条数密度）同场对比并给'去掉密度后的净 IC'⇒ 需 TDM-E-L2-09/calibration/02_板块催化剂密度 同批出分（跨卡对比面，本班只交本卡算子，对比项标 needs_parity）"

