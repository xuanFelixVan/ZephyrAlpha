    blocker_3_percentile_window: "'分位化'未给窗口（历史三分位=全历史 expanding 还是 252 日滚动？两读法两条序列），且 frozen_note 说与 L2-01-5 共用重算=跨卡口径依赖"
    blocker_4_strength_base: "'强度底座=同 L2-01 卡的两路合成分（0.5/0.5）'——两路子分在本卡未数值化（动量活跃路含 5 日环比还是水平值不明），属 needs_engine 面"
  pandas_steps: []
