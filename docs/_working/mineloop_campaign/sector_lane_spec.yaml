- card_id: TDM-E-L2/ablation/02_板块候选池整体边际
  verdict: needs_engine
  buckets_type: ablation_arm
  buckets_on: arm 集合 {off, strength_top15, conduction, strength_top15+conduction}
  signal_column: close, amount
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    板块日收益: "close.pct_change（按 sector_code×trade_date）"
    强度合成分: "amount 截面占比 rank-pct + 1d/5d/20d 收益 rank-pct，各 ×0.25，×100 后 clamp[0,100]"
    Top15pct池: "ceil(N×0.15) 掩码（N=当日在数 code 数）"
  quote_signal_derivation: |-
    板块强度合分＝(成交额占比 rank-pct ×0.25 + 1d 收益 rank-pct ×0.25 + 5d 动量 rank-pct ×0.25 +
    20d 动量 rank-pct ×0.25)×100，clamp[0,100]，取 Top15% 作候选池掩码；
    枢纽 arm 序列=当日池内板块强度均值 − 池外均值（供 series 面判单调）。
  quote_pillars_level_isolation: |-
    level_isolation: 结构性判据：传导只调分不重排名（层级隔离不变量，MOD-SIG-136/sector_surface 在码契约），
    若排名被打乱=违规施工而非分数问题，卡直接判无效不计分
  what_is_already_frozen: "四路合成分与 Top15% 池掩码在本卡数值化完全（0.25×4、clamp、ceil 保底 1）⇒ 面板子面可算，算子 op_sector_strength_pool_spread 已交付并桩测通过（池规模均值=ceil(N×0.15) 在 12 code 桩上=1.9 符合预期）"
  why_still_needs_engine:
    - "arm 集合里的 conduction 臂=在个股层 A1/A2 之后、Top-N 之前注入 X_sector 传导（卡面 arm_impl_ref→scripts/backtest/sector_surface.py MOD-BT-238 接线），需要个股×板块的组合重放链路，非板块面板可算"
    - "判据 ablation_marginal 是'最强 arm 相对 off 的日频 IC/次日均值差>=+0.01'+组合层 mono，同样要 off/full 双臂的 NAV 与逐持仓重放"
    - "level_isolation 结构性判据要检查注入前后个股排名是否被打乱 ⇒ 必须有个股层候选序列，属引擎侧不变量断言"
    - "'off' 臂要求同一底座关掉板块注入⇒ 与在产 pipeline 的 A1/A2 顺序耦合，考卷侧无法自造重放（造了=回归复刻，卡面 frozen_note 禁）"
  pandas_steps:
