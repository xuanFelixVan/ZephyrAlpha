    - "（不可交付部分）conduction 臂与 off 臂：需 sector_surface.py 的组合重放 + 个股层排名不变量检查"
  expected_sample_days: "IS ≈575 交易日（池掩码与合成分面）；组合层 arm 的样本=同窗逐日配对"
  is_oos_coverage: "IS/OOS 全覆盖无数据障碍（880 至 2026-10-08、000300 至 2026-10-09 均在册）；瓶颈是重放引擎不是数据"
