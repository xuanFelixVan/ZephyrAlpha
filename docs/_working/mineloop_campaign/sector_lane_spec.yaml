measured_evidence:
  environment: "Python 3.12.8；CH 时窗合规：00:16 执行，01:00 前收工；此后只做纸面"
  commands_and_results:
    - id: RR_COLUMNS
      cmd: "python -c \"from fexam.ch_data import table_columns; sorted(table_columns('c3_fundamental.research_report'))\""
      result: |-
        ['body_ref','body_status','data_source','eps_fy0','eps_fy1','eps_fy2','exchange','fy0_year',
         'fy1_year','fy2_year','industry','ingest_ts','org_name','pe_fy0','pe_fy1','pe_fy2',
         'publish_date','rating','rating_change','report_id','researchers','source_url','symbol','symbol_canonical','title']
        ⇒ 卡面断言"该表无 trade_date 列"复证成立；日期列=publish_date；derivation 所需 6 列（industry/rating/rating_change/publish_date/org_name/symbol）全部在位
    - id: RATING_DIST
      cmd: "SELECT rating, count() FROM c3_fundamental.research_report GROUP BY rating ORDER BY count() DESC LIMIT 30"
      result: "买入 101225｜增持 33144｜空串 11384｜持有 610｜中性 544｜卖出 30｜回避 2｜减持 1（合计 146940）"
      is_window: "买入 59049｜增持 15790｜空串 4105｜持有 380｜中性 166｜卖出 5｜回避 2｜减持 1（IS 窗 2019-01-04..2023-12-31）"
    - id: RATING_CHANGE_FILL
      cmd: "SELECT count(), countIf(rating_change IS NOT NULL AND toString(rating_change)<>'') FROM c3_fundamental.research_report"
      result: "146940 / 0 ⇒ rating_change 全表空，卡的'以其为准'支不触发，必走 (org,symbol) 相邻自算方向支"
    - id: RR_WINDOW
      cmd: "SELECT min(publish_date), max(publish_date), count(), uniqExact(industry), uniqExact(org_name) FROM c3_fundamental.research_report"
      result: "2017-01-02｜2026-09-30｜146940｜207 industry｜116 org_name（与卡 evidence 逐字一致）"
    - id: FAMILY_CENSUS
      cmd: "SELECT code_family, uniqExact(sector_code), min(sector_code), max(sector_code) FROM c1_market.sector_code_name_map GROUP BY code_family"
      result: |-
        concept_or_style 426（880501.SH..880979.SH）｜industry_ths 128（88002.SH..881479.SH）｜
        industry_l2 71（880400.SH..880497.SH）｜industry_l1 61（880301.SH..880399.SH）｜
        region 32（880201.SH..880232.SH）｜mkt_index 11（880001.SH..880082.SH）
        ⇒ 底座"族=industry_l1(61)∪industry_ths(128)=189 codes"复证成立；sector_code 带 .SH 后缀
    - id: MKTSTAT_NOT_IN_INDUSTRY_FAMILY
      cmd: "SELECT code_family, groupUniqArray(30)(sector_code) FROM c1_market.sector_code_name_map WHERE sector_code IN ('880001',...,'880011') GROUP BY code_family"
      result: "Empty DataFrame ⇒ 不带 .SH 后缀的字面量在 map 里查不到；再用后缀版普查见 FAMILY_CENSUS：880001.SH-880082.SH 归 mkt_index(11)，不属于 industry_l1/industry_ths"
  executor_face:
    - "scripts/backtest/fexam/calibration_exam.py:100 def _bucket_response(signal, target, n_buckets=10)：单级；nunique<=n_buckets 时 dense-rank 序数分桶，否则 qcut 分位分桶。全文零处 categorical_then_quantile/dim_pair/ablation_arm ⇒ 两级/臂集分桶确无机判面"
    - "scripts/backtest/fexam/calibration_exam.py:116-121 _series_metrics 内 resp=_bucket_response(sig, tgt) 未传 n_buckets ⇒ 一律十分位"
    - "scripts/backtest/fexam/calibration_exam.py:199 ret = df['e'].shift(0) * df['r'].shift(-1)：_arm_nav_metrics 把 arm 序列当【敞口】"
    - "scripts/backtest/fexam/calibration_exam.py:339 def run_card / :370 _comparison_metrics(signal, signal_b, target, card)：双臂机判面存在，但在 run_card 直跑路径上"
    - "scripts/backtest/fexam/card_binding.py:628-639 run_binding_book 与 :661-663 run_one(...) 全链单 Series ⇒ 绑定册无双臂通道"
    - "grep 全 fexam 目录：dim_pair / ablation_arm / categorical_then_quantile 零命中（仅 card_binding.py:565 的 quantile_quintile 注释）"

executor_risks:
  - id: NAV_ARM_SEMANTICS
    severity: 最高（会出假分不是出错）
    statement: |-
      comparison/02、comparison/03 与 L2/ablation/02 的 arm 面若直接把"池内 880 次日等权收益"序列当 signal/signal_b
      喂给 run_card，_arm_nav_metrics 会再乘一次指数次日收益（e*r.shift(-1)），得到"收益×收益"的二阶量，
      Sharpe/MaxDD 差与 +0.10/+1.0pp/+1.5pp 门柱全部失去可比性——而它不会报错，只会给出看似合理的分。
      正解：arm 序列须是"敞口"语义（如池成员占比/0-1 敞口），或给执行器加一条 return 序列回放支路。
  - id: QUINTILE_VS_TEN_BUCKETS
    severity: 高（挪门柱级，非自愿）
    statement: |-
      _series_metrics 不读 card.buckets.type，恒 n_buckets=10。本车道三张'可考'卡里 01-2 与 09-03 都是
      quantile_quintile，且 01-2 卡面写死"IS 575 交易日，五分位×60 满足；十分位×60=600>575 ⇒ 本卡分桶定为 quintile"。
      按现执行器跑=十分位（575/10≈57.5 日/档 < min_obs_per_bucket=60），既违反冻结桶型又直接跌破自身门槛。
      整合时必须把 n_buckets 从 buckets.type 派生（quintile→5、decile→10）或在绑定册显式传 5。
  - id: ORDINAL_FALLTHROUGH
    severity: 中
    statement: |-
      02-2 的 series（预警密度，连续值）走 qcut 正常；但若总包改绑面板的 hit∈{0,1,2} 三档，
      执行器会因 nunique(3)<=n_buckets(10) 自动 dense-rank 分桶——表面通过，实为把卡面 categorical
      静默转成序数且与 10 桶默认值混用，档位语义（0/1/2 命中数）不再显式，须在绑定册显式声明桶型。
  - id: FAMILY_LIST_MUST_NOT_BE_REMADE
    severity: 中（本车道已给 args 面，防手滑）
    statement: |-
      880001.SH-880082.SH 实测归 code_family='mkt_index'，族过滤（industry_l1,industry_ths）已把它们排除；
      comparison/03 与 comparison/02 卡面另写"剔除 880001-880011"。若再按【不带 .SH 后缀】的字面量前缀二次剔除，
      该 IN 列表在带后缀的 sector_code 面上命中 0 行=空操作（安全）；但若有人改用 LIKE '8800%' 前缀二次剔除，
      会把 880301.SH 等 industry_l1 板块一起杀掉（880 前缀同源），直接掏空分母。二次剔除一律禁。

