# sector_lane_spec — 板块族 9 张候选卡"可机械实现"定案（规格件，非分数件）
# 判定枚举: implementable | unfrozen | needs_engine | two_level_bucket_reject
# 底座引用（不重测）: scripts/backtest/fexam/card_binding.py:load_sector_family_panel
#   族=c1_market.sector_code_name_map.code_family 在册映射 industry_l1(61) ∪ industry_ths(128)=189 codes
#   period='1d'；(日,板块) 先 anyLast 去版本
#   c1_market.kline_sector_880 period='1d' = 785,204 行／729 codes／2020-03-17..2026-10-08
# 本件禁改卡件/分数册/card_binding.py；实现块见 .runtime/tmp/st-mineloop-20261010/lane_sector/sector_ops_draft.py

cards:
- card_id: TDM-E-L2-01-2/calibration/02_板块成交额占比活跃度
  verdict: implementable
  buckets_type: quantile_quintile
  buckets_on: 当日板块成交额占比截面值
  signal_column: amount
  signal_column_is_single_identifier: true
  quote_signal_derivation: |-
    占比=sector amount / Σ(同 code_family 全体 sector amount)（分母口径=行业族 industry_l1∪industry_ths，
    由 c1_market.sector_code_name_map.code_family 在册映射界定，禁自拟名单）；
    环比=占比/占比.shift(5)−1；series 面取"占比前 10% 板块等权组合的次日超额"与全样本差。
  quote_buckets: |-
    buckets: {type: quantile_quintile, on: 当日板块成交额占比截面值, min_obs_per_bucket: 60}
  quote_target: |-
    primary: next_day_index_return（CSI300 次日收益）
    secondary: sector_rotation_relay_hit（当日 Top10 活跃板块在 T+5 强度 Top10 的命中率）
  quote_pillars_numeric: |-
    mono_spearman_min: 0.6 / ic_mean_min: 0.02 / ic_ir_min: 0.3 / regime_same_sign: true / oos_same_sign: true
  pandas_steps:
    - "P = load_sector_family_panel(is_start-20d, oos_end+2d)  # 189 codes 已在册，禁自拟名单"
    - "P[dt,sector,amount] = pd.to_numeric(errors='coerce')"
    - "denom = P.groupby('dt')['amount'].transform('sum')      # 分母=当日行业族全体 amount"
    - "P['share'] = P['amount'] / denom"
    - "P['share_chg5'] = P.groupby('sector', sort=False)['share'].transform(lambda s: s / s.shift(5) - 1)"
    - "signal = P['share']                                     # buckets.on=占比截面值（保符号，不取 abs，卡面 note 同口径）"
    - "response = next_day_index_return 对齐（沿用车道已出分三张的 target 装配口）"
    - "bucket = _bucket_response(signal, response, kind='quantile_quintile', min_obs=60)"
    - "series 面: 每日 share.rank(pct=True)>=0.9 等权组合次日收益 − 全样本次日收益"
  expected_sample_days: "IS 2021-08-02..2023-12-31 实测窗内 ≈575 交易日（卡 evidence 自证）；shift(5) 预热后有效起点 ≈2021-08-09"
  panel_sample: "575 日 × 189 板块 ≈ 108,675 (日,板块) 观测；五分位日截面 ≈38 只/档，min_obs_per_bucket=60 按池化计数满足"
  is_oos_coverage: "IS 2021-08-02..2023-12-31 与 OOS 2024-01-01..2025-09-09 均落在 880 period='1d' 实测窗 2020-03-17..2026-10-08 内，双窗可覆盖"
  hardest_step: "分母口径——必须用装载器的行业族 189 codes 截面 sum 而非全表 729 codes，否则占比被 industry_l2/概念族稀释"
  reject_reason: null
  caveats:
    - "pillars.condition_stability（低涨幅高占比 vs 低涨幅低占比 交互档）需要 close 涨幅维，不在 buckets.on 面上；算子只出单信号分桶，交互面须由总包另建双臂或判 unfrozen"
    - "target.secondary 需'T+5 强度 Top10'口径——强度榜定义未在本卡数值化（见 needs_engine 说明，主面不受影响）"

- card_id: TDM-E-L2-01-3/calibration/02_多周期动量主导度
  verdict: two_level_bucket_reject
  buckets_type: categorical_then_quantile
  buckets_on: 主导周期三档 {q3,q5,q20}；档内再按该周期动量值分三桶
  signal_column: close
  signal_column_is_single_identifier: true
  quote_buckets: |-
    buckets:
      type: categorical_then_quantile
      'on': 主导周期三档 {q3,q5,q20}；档内再按该周期动量值分三桶
      min_obs_per_bucket: 60
  quote_signal_derivation: |-
    三周期收益=q_i = close/close.shift(i) − 1（i∈{3,5,20}，按 sector_code 分组）；
    各周期截面 rank-pct 归一 → 主导度=argmax_i(rank_i)；连续面=0.2·rank_q3+0.3·rank_q5+0.5·rank_q20
    （照在码先验权重原样取，卡只判该权重对不对，不改权）。
  pandas_steps: []
  expected_sample_days: "卡自证 ≈550 交易日 × 61~189 板块（q20 预热，IS 有效起点 2021-10-29）"
  is_oos_coverage: "窗覆盖本身可行，但分桶形制不可执行，不做样本核算"
  hardest_step: null
  reject_reason: |-
    buckets.type=categorical_then_quantile 是两级（先按主导周期三档分类、档内再分位三桶=9 桶），
    执行器 _bucket_response 只支持单级分位/序数分桶 ⇒ 机械不可实现；复核确认与上一轮同判据（非数据不可得，纯形制不匹配）。
  unblock_path: "需执行器先支持两级分桶（engine 侧改 _bucket_response），或在卡面冻结前把两级降为单级——降桶=挪门柱（G4-5），本班不做"

- card_id: TDM-E-L2-02-2/calibration/02_板块见顶预警三信号
  verdict: implementable
  buckets_type: categorical
  buckets_on: 命中数 {0,1,2}（两信号命中计数）
  signal_column: "close, amount, high, low"
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    rsi14_wilder: "close（卡 frozen_note：RSI=14 日 Wilder 口径）"
    volume_stall: "amount（roll_max 20 日新高）+ close（5 日收益<=0）"
    high_low: "卡 derivation 全文未使用 high/low ⇒ 列名冗余，不参与算子；已在下条声明"
  quote_signal_derivation: |-
    RSI14(Wilder) 按 sector_code 计算；放量滞涨=amount>=roll_max(amount,20) 且
    close/close.shift(5)-1 <= 0；series=当日命中 >=1 信号的板块占比（市场级预警密度）；
    panel 辅轴=板块×日命中数对未来 5 日超额的单调性。
  quote_buckets: |-
    buckets: {type: categorical, on: 命中数 {0,1,2}（两信号命中计数）, min_obs_per_bucket: 60}
  quote_frozen_note: "RSI=14 日 Wilder 口径、\"滞涨\"=5 日板块收益 <= 0 而 amount 创 20 日新高"
  pandas_steps:
    - "P = load_sector_family_panel(...)"
    - "delta = P.groupby('sector', sort=False)['close'].diff()"
    - "gain = delta.clip(lower=0); loss = (-delta).clip(lower=0)   # Wilder: ewm(alpha=1/14, adjust=False) 非 SMA"
    - "rsi = 100 - 100/(1 + gain.ewm(alpha=1/14, adjust=False).mean() / loss.ewm(alpha=1/14, adjust=False).mean())"
    - "sig_rsi = rsi > 75"
    - "amt_new_high_20 = P.groupby('sector', sort=False)['amount'].transform(lambda s: s >= s.rolling(20, min_periods=20).max().shift(0))"
    - "sig_stall = amt_new_high_20 & (P.groupby('sector', sort=False)['close'].transform(lambda s: s/s.shift(5)-1) <= 0)"
    - "hit = sig_rsi.astype('int8') + sig_stall.astype('int8')     # buckets.on = {0,1,2}"
    - "response_panel = forward 5d 板块超额（板块 5 日收益 − 当日族内中位或 000300 5 日收益，二者取一须与总包对齐）"
    - "bucket = _bucket_response(hit, response_panel, kind='categorical', min_obs=60)"
    - "series 面: 每日 hit>=1 的板块占比 = 预警密度，对次日指数收益求 IC"
  expected_sample_days: "IS ≈575 交易日；RSI14+20 日新高需 20 日预热 ⇒ 有效起点 ≈2021-09-01（卡 evidence 自证需 20 日预热）"
  panel_sample: "575×189≈108k 观测，三档池化每档远超 60"
  is_oos_coverage: "IS/OOS 均在 880 实测窗内；卡自带 blocked_scope 只封'盘中实时面'与'龙头破位维'，与日频收盘面无关，主面不受影响"
  hardest_step: "Wilder RSI 口径唯一化——gain/loss 必须 ewm(alpha=1/14, adjust=False)（Wilder 平滑），用 SMA 版 RSI 会与在码 sector_analyzer 结果分叉，属挪门柱级误差"
  reject_reason: null
  caveats:
    - "pillars.ic_floor 的'连续面（RSI 分位+放量滞涨 z 值合成）'未给合成权重与 z 定义 ⇒ 该 pillar 面 unfrozen，算子只提供 hit 计数与两子信号各自分位，禁替它拍权重"
    - "pillars.precision_floor 依赖'T+5 跌出强度榜前 50%'——强度榜口径未数值化（同 01-2 secondary），标 needs_parity"
    - "第三信号（龙头股率先破位）卡自判 blocked_on_data，本算子不实现"
    - "pre-flight 必查：真实面板下命中数=2 档的观测数是否 >=min_obs_per_bucket=60（本班随机数桩里 2 档=0 例）；不足则该档门柱不可达，须如实记 DEVICE_INCONCLUSIVE 而非合并档位"

- card_id: TDM-E-L2-01/comparison/02_等权与IC加权双臂
  verdict: needs_engine
  buckets_type: dim_pair
  buckets_on: 权重律双臂 {arm_A_equal=(0.5,0.5)，arm_B_icweighted=IS 窗估计并冻结}
  signal_column: kline_sector_880.close / kline_sector_880.amount
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    path_A: "amount→截面 rank-pct + 5 日环比（两子项等权合成后×100）"
    path_B: "close→q3/q5/q20 收益 0.2/0.3/0.5 加权后 rank-pct×100"
    unused: "无"
  quote_buckets: |-
    buckets:
      type: dim_pair
      'on': 权重律双臂 {arm_A_equal=(0.5,0.5)，arm_B_icweighted=IS 窗估计并冻结}
      pairing: 同一子分底座、同一窗、同一 0.15 分位池规则，双臂逐日配对（仅权重向量不同）
      min_obs_per_bucket: 60
  quote_signal_derivation_key: |-
    arm_A=(路A+路B)/2；arm_B=w_A×路A+w_B×路B，(w_A,w_B) 由 IS 窗日频截面 IC 均值
    （对 CSI300 次日收益）取正后归一，估毕即冻结不再更新；
    池=arm 合成分截面 Top-15%（ceil(N×0.15)，保底 1 个）；
    组合收益=池内 880 行业族指数次日简单等权收益均值（无权重倾斜，无杠杆）。
  not_unfrozen_note: "本卡不算 unfrozen：IC 权重估法是数值规则（max(IS 截面 IC 均值_i,0) 归一，双双<=0 退 (0.5,0.5)），池分位取件常量 0.15，卡自述'禁补任意小数冒充权重'——按数值规则可估，无需本班拍数"
  pandas_steps:
    - "① 子分底座=op_sector_strength_pool_spread 内的四路/两路合成分（本卡只取路A/路B 两路）"
    - "② IS 窗内逐日算路A/路B 对 CSI300 次日收益的截面 Spearman → 日均值 → 取正归一 → (w_A,w_B) 冻结"
    - "③ arm_A/arm_B 两条合成分宽帧 → 各自 ceil(N×0.15) 池掩码 → 两条池等权次日收益日序列"
    - "④ 双臂喂 run_card 的 signal/signal_b → _comparison_metrics 出 sharpe_delta/maxdd_delta"
    - "⑤ 诊断面：IS 内滚动 252 日重估权重序列 std<=0.15；双臂池成员逐日重合率>=0.95 ⇒ DEVICE_INCONCLUSIVE"
  engine_gap:
    - "绑定册单序列面：card_binding.py:628-639 run_binding_book 与 OPS 各 op 一律 return (pd.Series, dict) 单序列，无 signal_b 通道；run_one(card_path, approve, scores_path, run_tag, dry, book) 亦无双臂入参（实测 661-663 行签名）"
    - "执行器双臂面存在但入口不同：calibration_exam.py:339 def run_card / :370 m=_comparison_metrics(signal, signal_b, target, card) —— 绕过绑定册直跑 run_card 才会走到双臂，绑定册侧需新增'双序列 op'协议"
    - "口径冲突（阻断级，见 executor_risks §1）：_arm_nav_metrics 把 arm 当【敞口】，ret=e*r.shift(-1)（calibration_exam.py:199）；本卡 arm 定义是【池组合收益序列】本身。直接粘进 run_card 会把'池收益×指数次日收益'当 NAV，Sharpe/MaxDD 全是错的"
  expected_sample_days: "IS 2021-08-02..2023-12-31 ≈575 日（权重估计窗），OOS 2024-01-01..2025-09-09 ≈415 日判 Sharpe/MaxDD 差"
  is_oos_coverage: "两窗均在 880 实测窗内；卡另引 kline_index 000300=2005-01-04..2026-10-09/5284 行（在册）"
  hardest_step: "双臂 NAV 口径——要么给执行器加'return 序列直接回放'支路，要么把池组合改写成'池是否持有的敞口×指数收益'（后者改变卡面定义=挪门柱，本班不选）"
  reject_reason: null
  depends_on:
    - "TDM-E-L2-01/ablation/02（卡面 frozen_note：'两臂的子分派生系数逐字承 ablation/02 的 signal_derivation，禁在本卡重造或改系数'——跨卡口径依赖在册）"
    - "TDM-E-L2-01/ablation/03（窗口统一口径承此卡）"

- card_id: TDM-E-L2-01/comparison/03_缺路处置律重归一与剔除双臂
  verdict: needs_engine
  buckets_type: dim_pair
  buckets_on: 处置律双臂 {arm_A_renormalize=可用路均值×100 并保留参与排名, arm_B_exclude=该板块当日退出排名分母且不入池}
  signal_column: kline_sector_880.close / kline_sector_880.amount
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    path_A: "amount rank-pct + 5 日环比（承 comparison/02）"
    path_B: "close 的 0.2q3+0.3q5+0.5q20 rank-pct（承 comparison/02）"
  quote_buckets: |-
    buckets:
      type: dim_pair
      'on': 处置律双臂 {arm_A_renormalize=可用路均值×100 并保留参与排名, arm_B_exclude=该板块当日退出排名分母且不入池}
      min_obs_per_bucket: 60
  quote_signal_derivation_key: |-
    屏蔽集=固定种子 20261010 下对 (板块,交易日) 二维抽 20% 置路B 为缺失，双臂共用同一屏蔽集；
    arm_A：composite=mean(可用路)×100（两路齐⇒(A+B)/2；仅余路A⇒路A×100），随后 clamp [0,100]；
    arm_B：被屏蔽板块当日整体退出截面（不进 rank、不进分母、不入池，等价 MOD-SIG-144 现行为）；
    两臂各自加市场级调节 ±10（承 ablation/02 的水温档查表口径）后取 Top-15% 池。
  pandas_steps:
    - "① 同 comparison/02 的两路子分宽帧"
    - "② 掩码：default_rng(20261010) 对 (code×date) 布尔抽 20% 置 path_B=NaN（双臂同掩码，须存种子与形状以复现）"
    - "③ arm_A=nanmean(可用路)×100 后 clip(0,100)；arm_B=掩码板块整行退出（rank 前先 drop 该 (日,板块)）"
    - "④ 各自 +市场级调节 ±10（水温档查表口径不在本卡→见 unfrozen_secondary）"
    - "⑤ 各自 ceil(N×0.15) 池→两条组合日收益→run_card 双臂；另须计数披露池规模差（pillar pool_denominator_effect）"
  engine_gap:
    - "同 comparison/02 的单序列绑定面 + NAV 敞口语义冲突"
    - "剔除臂改变了截面分母 ⇒ 池规模逐日不同，'Top-15%'在两臂下不是同一件事（卡自己要求披露），需 arm driver 输出池规模序列，现执行器无该出口"
  unfrozen_secondary:
    - "两臂'各自加市场级调节 ±10（承 ablation/02 的水温档查表口径）'——本卡未给水温档数值与档位边界，须承 TDM-E-L2-01/ablation/02 或 TDM-E-L2-01-5/ablation/02 的调节面口径；该口径未在其卡外冻结，禁本班代拍"
  expected_sample_days: "IS ≈575 日 / OOS ≈415 日；20% 屏蔽后单路可用样本仍充足（189 code×日）"
  is_oos_coverage: "窗覆盖可行；卡自述缺失工况的现实性=结构路/资金流路 2026-07-22 前不可算，属全窗常态，与算子实现无碍"
  hardest_step: "arm_B 的'整行退出截面'与 arm_A 的'留在分母'必须共享同一 rank 调用序，否则 rank-pct 基线漂移会伪装成处置律效应（分位漂移=卡明令要防的假信号）"
  reject_reason: null
  depends_on:
    - "TDM-E-L2-01/comparison/02（子分口径同源，须同一次装配）"
    - "TDM-E-L2-01/ablation/02 或 TDM-E-L2-01-5/ablation/02（市场级调节 ±10 水温档数值）"

- card_id: TDM-E-L2-04-1/calibration/02_轮动五态调节分
  verdict: unfrozen
  buckets_type: categorical
  buckets_on: 五态 {高潮,主线,分歧,派发,混沌}
  signal_column: close, amount
  signal_column_is_single_identifier: false
  signal_column_decomposition:
    截面方差: "close→跨板块强度分布 std（但'强度'本身未在本卡数值化，见 blocker_1）"
    集中度: "amount→Top2 成交额占比"
  quote_signal_derivation: |-
    强度底座=同 L2-01 卡的两路合成分（动量活跃+多周期动量，0.5/0.5）；
    截面方差=当日跨板块强度分布 std（分位化）；集中度=Top2 成交额占比（分位化）；
    二维各三分位切五态（规则与在码 sector_rotation_state 一致但重算，禁直读输出）；
    调节标量=高潮 −1 / 派发 −0.75 / 分歧 −0.25 / 混沌 0 / 主线 +0.5（与 +10%/−15% 线性同序）。
  quote_frozen_note: "看数前冻结；五态边界=方差与集中度各按历史三分位切（口径唯一，与 L2-01-5 共用重算）"
  blockers:
    blocker_1_unfrozen_map: |-
      二维各三分位=3×3=9 格，卡只给 5 个态名与调节标量，未给 9 格→5 态的映射表
      （哪几格同归'分歧'、哪格判'高潮'）⇒ 映射即权重级的自由参数，禁本班替它拍数。
    blocker_2_incode_claim_false: |-
      卡称"规则与在码 sector_rotation_state 一致"——实读该件（src/zephyr/signal_ashare/sector/sector_rotation_state.py:40-49）
      分类用的是 top_n_hhi(换手/成交额 HHI 集中度) 阈值 0.20/0.25/0.30 + UP_RATIO 普涨比 0.70/0.40 +
      LEAD_STREAK_MAINLINE=3 连续领涨日，三维绝对阈值判据，既非'截面方差'也非'Top2 成交额占比三分位'。
