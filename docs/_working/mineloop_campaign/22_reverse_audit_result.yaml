reading_of_result:
  headline: 三张可跑的事件开关卡全部 fail：过热档（基序列历史滚动分位>0.80）日的次日指数收益差在样本内要么不显著（t=-0.99 / -0.01 / +0.17）要么方向都不对，且**三张的 OOS 窗全部反号**（+9.5 / +23.1 / +5.5 bp）
  what_it_does_not_refute: 这不否定母卡在册的**时序相关**负号（Spearman IC 度量的是单调共动，全样本所有日子一起算）；它否定的是更强的可交易形式——『负效应集中在高分位过热日』。两者是不同命题，本车道只审后者。
  one_round_limit_executed: 按各卡面预写的『一轮为限』：三张命题本轮未确认 ⇒ 族 reverse_triage_T1_20261011 归档，禁改分位阈/改窗长再考（这就是多重比较防线的落地点）
  floor_strongest_reading: 本轮把 n≥200 的族内下限从『全窗』扩到『被用来确认的那一窗』（OOS 窗实测只有 79-104 个事件日，不足 200 即不得拿'OOS 同号'当确认证据）；该改动只增 fail 不增 pass＝单向收紧，非放松
