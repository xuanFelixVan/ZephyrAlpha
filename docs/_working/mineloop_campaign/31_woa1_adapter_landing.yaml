question_1_answered_first_what_goes_into_e_slot:
  e_slot: >-
    当日**敞口系数**，值域 [0,1]（含 1e-9 容差）。依据＝判官侧不可动的事实：
    calibration_exam.py:217 `_arm_nav_metrics(exposure, target)` 在 :236 原文
    `ret = df["e"].shift(0) * df["r"].shift(-1)  # t 敞口吃 t+1 收益`——e 位天然只能吃敞口。
  r_slot: >-
    同一底座的**日收益**序列：量级帽 |r|<=0.5，且长样本（>=20 日）不得全非负
    （全非负＝敞口/仓位面特征，日收益必含负日）；单调非负且 max>1 即净值/累计面，直接拒。
  why_this_is_a_landmine_not_a_style_note: >-
    16 支 blocked 卡里有"臂＝池组合收益回放"这一类语义。若把那条收益序列喂进 e 位，
    判官算出来是"收益×次日收益"——它**不抛异常**，只安静产出一个像模像样的假分并写进分数册。
    所以判据必须是数值的、结构的，不能是注释或约定。
  gates_added_mechanical:
    - require_exposure_face(series, name, card_id) → ArmFaceMismatch("not_exposure_face ... 会算成收益×收益")
    - require_daily_return_face(series, name, card_id) → ArmFaceMismatch("not_daily_return_face"｜"长样本全非负")
    - verify_face_pair_quotes(card, entry) → 册格必须同时写 e_face_quote 与 r_face_quote，
      且 e 引句只能落在**臂定义面**、r 引句只能落在**底座/目标出处面**（两域不可互换；
      缺任一＝ArmFaceMismatch("face_contract_undeclared")，命中不到＝ArmQuoteNotFound）
    - build_arms 每个算子产出（含 arm_identity 直喂底座那条路）一律过敞口位校验 ⇒ 底座是收益面时装配当场红
  new_high_level_entry: >-
    build_arm_pair(card, entry, *, base, target) → (开臂, 基臂, 日收益, 凭据)。
    build_arms 旧签名与旧行为保留（dev 上已落地的 10 支测试零改动仍绿），
    但"能出双臂"与"三面语义已声明"分开：只有 build_arm_pair 会替调用方把 r 位也校完。

