pilot_batch:
  selection_note: |
    首批 5 张=本车道给出完整接线的袋：tier1 即刻可出分 1 张、tier2 待门位 2 张、tier3 待具名缺件 2 张。
    诚实申报：按 binning_rules 判据，"敞口可表达 + 臂参数已冻结"的卡实测只有 1 张（P1），凑不出 5 张即刻出分。
    若总统要 5 张即刻出分，须先三选一：补 P2 的门幅度数值／给 P3 定路由／落横截面回放件（可解锁 10 支）。
    "走 card_binding 通道"的实测边界：18 支配对分支内的臂卡底座全是"同一基线净值/同一卖单清单/symbol×日行集"，
    只有 P5 的 target 面真走 card_binding.index_next_day_return；本模块对底座通道无关（只做敞口变换），
    双校验形制（算子存在性 + 引句在卡面）与表名经 TableRegistry 的约束均沿用 card_binding。
  cards:
    - card_id: TDM-X-R1-01/comparison/02_熔断五级梯度减仓对照
      tier: tier1_score_now
      base_face:
        source: scripts/backtest/fexam/exit_sim/exit_simulator.py 的 simulate(stop_enabled=True) → pd.Series(nav)（实测 L171 返 (nav, st)，run_all L328 已按臂装配）
        transform: base_ret = nav/nav.shift(1) - 1（target 面＝被风控层监控的组合日收益）
        quote_from_signal_column: |
          由 exit_simulator.simulate(stop_enabled=True) 生成的日收益序列
        exposure_base: 同一交易日历上的 1.0 常数序列（满仓基线），作为 build_arms 的 base 传入
      arm_open:
        op: arm_level_cap_multiply
        params:
          level_map: {L1: 1.0, L2: 1.0, L3: 0.8, L4: 0.0}
          levels: 由 src/zephyr/risk/core/drawdown_state_machine.py（MOD-RK-049，实测有 position_cap/recovery_factor 与逐日 evaluate）回放产出
        quote_from_arm_protocol: |
          级别→仓位映射（L1 100%/L2 100% 禁新开/L3 梯度 80/60/40%/L4 0%）冻结于本卡
        quote_no_rewrite: |
          级别判定与迟滞解除按
        declared_gap: L3 三档 80→60→40 的推进键卡面未指派 ⇒ 只能由在册件给 level 序列，本件不代推；L2 档「禁新开」是路径约束，标量面按 1.0 处理并须在台账披露
      arm_base:
        op: arm_gate_multiply
        params:
          gate: 基线回撤/日亏触阈（阈取卡面 frozen_note 在册值 日亏 2%/4%/6%、回撤 25%，禁自拟）
          on_values: [triggered]
          factor: 0.0
        quote_from_buckets_on: |
          关臂=单一阈值全清/全买回（二值开关）
      pairing: 核只吃两臂 ⇒ 三臂须 2 次 run_card（开vs关、开vs中间臂五级无迟滞），run_id 分别带 -vs-flat 与 -vs-nohyst，分数行 only-add
      expected_sample_days:
        oos_2025_10_09_to_2026_09_30: 241（实测，见 measured_evidence）
        is_2018_01_02_to_2025_09_30: 依卡面在册（个股 hfq 10098785 行至 2026-09-30）；净值面行数须总包实跑 simulate 后复核
        executor_thresholds: _arm_nav_metrics 要求 n>=30、_series_metrics 段内 n>=60 —— 241 日两者均过
      blockers: 词表外门柱 3 支 ⇒ 首跑必为带"未支持判据键（机判面待扩）"诚实凭据的 fail 行，pass 须先扩词表立法
      run_recipe: |
        arm, base, ev = build_arms(card, entry, base=ones_series)
        run_card(card_path, signal=arm, signal_b=base, target=base_ret,
                 run_id="mineloop-armP1-vs-flat", recorded_by="st-mineloop-20261010")
    - card_id: TDM-X-R1-01/ablation/03_市场体制条件下熔断减仓增量
      tier: tier2_needs_one_frozen_number
      base_face:
        source: 同 P1（同一基线净值序列，同一成交口径）
        quote_from_arm_protocol: |
          三臂输入同一基线净值序列与同一成交口径
      arm_open:
        op: arm_level_cap_multiply 后接 arm_gate_multiply（both 臂＝先级别乘子再体制门）
        params: level_map 同 P1 + 体制门 gate
      arm_base:
        op: arm_gate_multiply（regime-only 臂＝level 恒 L1，物理上不接入状态机）
        params:
          gate: c1_backtest.regime_snapshot_history 的 T-1 体制标签（实测列 dominant / risk_signal，取值面 trend_up / trend_down）
          on_values: [trend_down]
          factor: 卡面未给 ⇒ 拒出（ArmParamUnfrozen，禁替卡拍数）
        quote_ablation_seam: |
          regime-only 臂必须物理上不接入状态机
        quote_gate_face: |
          体制臂=按 regime_snapshot_history 的 T-1 体制标签做趋势门
        unfrozen_credential: 同节点 02 卡明文「仓位带属 C1 预算面（禁与本卡混判）」⇒ 门幅度须由 C1 预算面带 as_of 入数据册
      expected_sample_days:
        regime_face: 1824 个 distinct trade_date / 3635 行（≈2 版本/日，必按日 anyLast 去版本）/ 2019-04-01..2026-10-09
        oos: 241 日（T-1 位移后有效 240）
      blockers: 门幅度未冻结（先决）＋词表外门柱 4 支
    - card_id: TDM-X-R1/shadow/02_拔电源影子运行对照
      tier: tier2_needs_routing_ruling
      base_face:
        source: 同 P1
        quote_from_arm_protocol: |
          两臂同一基线净值路径
      arm_open:
        op: arm_constant（触发日敞口=0；触发前用 arm_identity）
        params: {value: 0.0}
        quote_cash_park: |
          影子臂的现金停放 0 收益
      arm_base:
        op: arm_identity
      expected_sample_days:
        oos: 241（同 P1 底座面）
      blockers: family=shadow 不进配对分支；改 family=挪门柱，本件不动，须总统裁定另立 shadow 出分通道或正式改族留痕
    - card_id: TDM-X-R1-02/comparison/02_L3减仓顺序三臂对照
      tier: tier3_needs_named_device
      base_face:
        source: exit_simulator 净值口径 + 同一持仓快照生成器（卡面声明同一随机 seed 序列）
        quote_from_arm_protocol: |
          三臂共用同一持仓快照生成器与同一随机 seed 序列；顺序由键函数切换，不改其他参数
      arm_open:
        op: 非本册标量算子（横截面选择，须逐标的回放）
        formula: 顺序键=浮亏幅度 DESC 后 ATR14/close DESC 再压舱石 ASC；压舱石取卡面自声明代理=浮盈 + 20 日均额最高分位（局限须在结果披露）
        quote_order_key: |
          顺序键=（浮亏幅度 DESC，ATR14/close DESC，压舱石属性 ASC）
      arm_base:
        formula: 随机顺序（固定 seed，确定性可复现）
        quote_from_buckets_on: |
          关臂=随机顺序（固定 seed，确定性可复现）
      shared_exposure_proof: |
        卡面：三臂同一持仓快照、同一减仓量、同一成交价口径（次日开盘，prereg exit_exec 语义），仅卖出次序异
        ⇒ 两臂日频总敞口相同，配对差只来自横截面构成；标量敞口面恒等于零差＝不可考，必须逐标的回放
      expected_sample_days:
        oos: 241（实测）；被减仓位 20 日后续损失面须逐标的价格路径
      blockers: 装置部分减仓能力（卡面 implementation_gap 自证 simulate() 全仓进出，:171-181 实测无形参支持）＋逐臂日净值配对面＋词表外门柱 2 支
    - card_id: TDM-E-L2-09/comparison/02_催化剂加权形式板块恒定与标的指数衰减
      tier: tier3_needs_light_panel_replay
      base_face:
        source: card_binding.index_next_day_return()（target 面；本袋唯一真走 card_binding 通道的一面）
        quote_target_primary: |
          next_day_index_return（CSI300 次日收益，双臂共用同一目标序列，执行器 shift(-1) 现器可考）
      arm_open:
        op: 非本册标量算子（symbol×日 权重帧）
        formula: 臂 B weight = 1 + direction×strength×2^(−age_days/4.0)，age_days>20 记 nan；PIT 只用 first_announce_date≤T，同一 (symbol, report_period) 取首次披露
        quote_arm_b: |
          weight=1+direction×strength×2^(−age_days/4.0)
      arm_base:
        formula: 臂 A 恒定 +20%（industry 催化剂态=过去 5 个交易日研报条数截面 z>0 → 该 industry 内 symbol×日 weight=1.2，其余 1.0）
        quote_arm_a: |
          该 industry 内全部 symbol×日 weight=1.2，其余 weight=1.0
        pairing_rowset: |
          两臂权重矩阵行对齐（同一 symbol×日同时有两值才入配对，缺一侧则该日剔两臂）
      expected_sample_days:
        is_2019_01_04_to_2023_12_31: 1212 交易日（实测 index 面）
        oos_2024_01_01_to_2025_09_09: 410 交易日（实测 index 面）
      blockers: 需横截面权重帧→日组合收益轻量回放（含卡面 T+1 与涨停不可买 逐标的约束）；辅轴 symbol_next5d_excess_weighted 需成分/行业映射本袋不接；政策/事件五类催化剂腿卡面自标 blocked_on_data，本袋只用 EARNINGS 腿
      note: 门柱 3 键全在词表内 ⇒ 回放件一旦落地，本张是 5 张里唯一"出分即可判 pass/fail 无立法依赖"的

rejected_and_refusal_reasons:
  needs_matching_engine_common_gap: |
    16 支共同缺件（可执行一句版）：按臂参数化调用在册装置（exit_simulator / sell_signal_fusion_engine /
    sell_execution_planner）的适配器 + 逐臂日收益配对面（现核 comparison 分支两臂共用同一 target，
    结构上吃不下两条各自实现的净值路径）。这两件落地一次解锁横截面/路径族 10 支；分钟族 5 支另需 5min bar 切片器。
  minute_or_tick_family: [TDM-X-S1-06, TDM-X-S2-01, TDM-X-S2-03, TDM-X-S2-04, TDM-X-S2]
  cross_sectional_or_path_family: [TDM-X-S1-01, TDM-X-S1-02, TDM-X-S1-03, TDM-X-S1-05, TDM-X-S1, TDM-X-S2-05, TDM-X-S2-06, TDM-X-FLOW, TDM-X-R1-02, TDM-E-L2-07, TDM-E-L2-09]
  not_scoreable_pillars_note: |
    拒因全是"接线缺件"，不是"判据不合格"：本车道未对任何一张卡下结论性 verdict，判据面零动。
    X-S1-01 另有一条核内已知 fail-closed（misfire_reduction_min 需笔级价格面，核内无机判面）。

