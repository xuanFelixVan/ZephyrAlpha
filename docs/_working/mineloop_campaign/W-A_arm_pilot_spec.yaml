discipline: |
  判据面零动：本车道对卡件/绑定册/分数册/注册表只读不写，window/buckets/pillars/pillars_numeric/target/
  signal_kind 未改一字节；card_binding.py 未触碰。本件只出方案与码，不出分——出分由总包跑（见 todo_for_package_owner）。
  引句面：本文件所有 quote_* 字段为卡面原文逐字片段，可经 arm_protocol_binding.verify_arm_quote(card, quote, op)
  机械复核（空格归一后不在卡面即拒绑）；收口前已对本文件全部引句跑过机械复核。
  数据面：CH 只走 sys.path.insert(0,'<工棚>/scripts/backtest') 后的 fexam.ch_data.ch_query_df，
  返回位置协议（列名 c1..cN、NULL=空串、dtype=str）⇒ 按列位取数 + pd.to_numeric(errors="coerce")。
  时窗：每次时间动作前实测 date；本件 CH 面完成于 00:27–00:31，早于 01:00–04:00 停查窗（夜跑让路）。

