  measured:
    with_arm_protocol_key: 17
    of_which_comparison: 8
    of_which_ablation: 8
    of_which_shadow: 1
    in_exam_branch_comparison_or_ablation: 16
    prose_only_paired_arm_protocol_no_key: 2
    prose_only_card_ids:
      - TDM-E-L2-07/comparison/03_追高与低吸胜率对照
      - TDM-E-L2-09/comparison/02_催化剂加权形式板块恒定与标的指数衰减
    covered_by_this_spec: 19
  note: |
    令所称 17 = 含 arm_protocol 键的卡数（内 16 支走配对分支 + 1 支 family=shadow 不走）。
    另 2 支 comparison 卡无该键、只在 window.frozen_note 散文里声明 paired_arm_protocol，
    同属"有臂协议面"故一并分箱，本表因此 19 行。实测命令：
    grep -rn "arm_protocol" docs/03_modules/_domain_backtest/exam_cards

binning_rules:
  executor_facts: |
    calibration_exam.run_card 的 comparison/ablation 分支（实测 L363-371）对两臂恒走 _series_metrics +
    _arm_nav_metrics(exposure, target)：t 敞口 × t+1 目标、换手扣费、配对差 maxdd_improvement_pp /
    sharpe_delta / turnover_delta_annual_x 全在核内，且两臂共用同一 target 序列。
    ⇒ signal/signal_b 就是两臂敞口序列：臂只要写成"同一底座上的敞口变换 f(base)"就能出分，不需新引擎；
    只有臂本身要重新撮合/逐标的持仓路径的才真缺件。
  precedence:
    rule1_panel: signal_kind=panel → needs_matching_engine（DataFrame 进核内 cumprod/mean 的轴从跨日变跨列＝语义走偏；卡面另带逐标的可成交性约束）
    rule2_trade_path: 臂定义面命中持仓路径片段（simulate(/成交价/执行价/分钟/切片/卖单/成交清单/逐笔/分批/出清/追单/条件单/参与率/顺序/离场判定函数/权重字典/调权/确认模式/路由/涨停/触发集合）→ needs_matching_engine
    rule3_unfrozen: 臂定义面命中同一底座标量变换凭据，但臂幅度词相邻 16 字内无数字 → unfrozen_arm_definition（禁替卡拍数）
    rule4_feasible: 前三条全不触发 → feasible_now
  judgement_domain: 判据域=臂定义面（arm_protocol / paired_arm_protocol / frozen_note / buckets.on）；device_ref、signal_derivation、implementation_gap 属"底座 provenance"，不参与臂型判定（simulate 生成底座≠臂要重新撮合）
  independent_flags:
    out_of_vocab_pillars: 门柱键在 calibration_exam._COMPARISON_KNOWN_KEYS 词表外＝立法面（本件只读词表不复制；读不到即标 _vocab_unread_from_execution_core，禁谎报全在内）
    pending_numeric_params: 臂幅度词提了但没给数值的面
    family_not_routed: family 非 comparison/ablation 时执行核不配对
  state_counts:
    total: 19
    feasible_now: 3
    feasible_now_in_branch: 2
    needs_matching_engine: 16
    unfrozen_arm_definition: 0
    missing_device_clusters:
      panel_or_path_replay: 10
      minute_or_tick_slicer: 5
      partial_reduction_capability: 1
    unfrozen_note: |
      三态里 unfrozen_arm_definition 实测 0 支——没有一张卡是"形状可表达而卡面完全无数字"；
      数字缺口集中在"某个臂参数没赋值"（体制门降幅），以 pending_numeric_params 单列，
      并由 build_arms 的 ArmParamUnfrozen 在装配时硬拒（禁本车道替卡拍数）。

