step_2_fail_closed:
  change: >-
    judge() 起始处 unknown = set(pillars_numeric) - _CALIBRATION_JUDGED_KEYS，非空即
    return ("fail", ["未支持判据键（机判面待扩，fail-closed）: 点名键列表"])
  single_source: run_card 的分派集合与观测面同一（局部字面量改引模块常量 _CALIBRATION_JUDGED_KEYS）
  guard_against: 已判面不受波及——五键齐的强信号卡仍 pass（专测一支钉住，防把门柱抬高）

