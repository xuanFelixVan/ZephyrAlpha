  （G4-5：新判据适用新考生，旧行保留）。这是还卡面冻结判据以真意，不是改门柱。」

defect_being_closed: >-
  实测缺陷（22e481951e 绑定前复核册原文）：judge() 只读 5 个键
  （mono_spearman_min/ic_mean_min/ic_ir_min/regime_same_sign/oos_same_sign），
  对 calibration 族**无未知键 fail-closed**（只有 comparison 族的 _judge_comparison 有）——
  卡面 pillars_numeric 里多出的冻结柱一律静默跳过，且 mono=None / ic_ir=None 也静默跳过，
  所以出分的 "pass" 只代表那 4-5 个已知键，不代表卡面门柱全过。
  次生形态：pillars_numeric **只含**未知键的卡走到 p["mono_spearman_min"] 取数面抛 KeyError，
  崩的是整批而不是单卡（异常代替判决）。

