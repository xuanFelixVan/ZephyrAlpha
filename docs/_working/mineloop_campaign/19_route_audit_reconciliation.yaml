ruling: >-
  统筹 2026-10-11 03:3x 裁定①：「判官选择改为按门柱键集并集（family 路由是实现层偶然，卡面才是权威）
  ——31 行重跑对拍照做（红绿对账入册），66 张混形卡的另一侧门柱从此有判官接手。」

implemented:
  route: >-
    pillars_route(card) 不再读 family：'dual_arm' 当且仅当键集⊄校准词表 且 至少命中一个配对侧专有键
    （_NAV_ONLY_PILLAR_KEYS = _COMPARISON_KNOWN_KEYS − _CALIBRATION_JUDGED_KEYS）；
    其余一律 'series'（含键集为空＝缺面错由 judge() 报准；含"两侧词表都不认"的纯越表卡）。
  why_nav_only_condition: >-
    裁定字面若直译成"⊄ 校准集即双臂"，会把一张只有 tail_ratio_min / car_t_stat_min 这类**任何判官都无面**
    的卡送去双臂判官，那里它先撞上"需双臂接线"这条**假错**（它缺的是机判面，不是第二条臂）。
    本实现按"确有一柱只有配对面能算"来分派，66 张（精算 51 张，见下）混形卡的归属与裁定意图一致，
    改的只是无 NAV 柱的越表卡去向：留在校准判官由未知键 fail-closed 诚实点名。两套口径的差异如实摆出，
    如 Owner 要字面版，改一行即可（本件已把条件与理由写死在册面，禁事后无痕）。
  union_vocab: >-
    _judge_comparison 的已知键由 _COMPARISON_KNOWN_KEYS 扩为 _UNION_PILLAR_KEYS（并集），
    混形卡的校准侧五柱在**开臂 IC 面**（m["arm_open"]）上评——开臂＝被测装置那一臂；
    卡面无从二选一，取臂选择随本裁定入册留痕，禁事后换臂。
  exclusions_kept_semantics:
    oos_same_sign: >-
      不参与校准侧复评：它在对照卡上的冻结语义＝"配对 IC 差的 OOS 与 IS 同号"，
      _judge_comparison 原有一条就是它的真身；再按单信号语义评一遍＝同一键两套判据（禁）。
    sample_gate_false: >-
      校准侧复评不附"oos_ic nan / 无有效主指标"两道样本闸——配对面已有自己的 ic_delta nan 闸，
      再叠一层＝给卡面没冻的柱加门柱＝抬高门柱（禁）。
  shared_face_extraction: >-
    校准侧五柱的判据本体抽成 _judge_calibration_face(p, m, sample_gate=True)，judge() 与
    _judge_comparison() 共用同一实现（禁抄第二份，防两条面漂移）。抽取时顺带修掉一处真实崩溃风险：
    旧体是无条件取 p["mono_spearman_min"] / p["ic_mean_min"] / p["ic_ir_min"]，
    卡面少冻一键就抛 KeyError 崩整批；现逐柱先问"卡面冻没冻这个键"，没冻不评（不放松已冻的柱）。

