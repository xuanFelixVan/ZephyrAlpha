        列 close/lag(close) 与 limit_pct；聚合=日频 promotion_rate=countIf(今板∧昨板)/countIf(昨板)
        （分母<20 置 NaN，IS 前 60 交易日暖机）；目标面=kline_index symbol='000300' close 的
        next_day_return（执行器 _series_metrics 的 shift(-1) 原生口径）；辅轴=emotion_index
        WHERE stage='close_final' 的 emotion_index 次日差分（实测窗内 gap=0）。
