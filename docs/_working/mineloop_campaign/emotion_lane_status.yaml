    严格口径=QMT 在岗才解锁 + 单臂可出分 + 判据腿实测满窗 + 不依赖未冻结分段。
    实测下来情绪族里没有第二张满足：单臂且真靠情绪面的卡要么被 pre_open/auction 腿（0 日）挡、
    要么被 components C1/C2（0/8620 ok）挡、要么落在"六段/四态重建规则未冻结"上，
    其余 11 张是 comparison/ablation 需双臂。为不凑数，N=1。
  cards:
