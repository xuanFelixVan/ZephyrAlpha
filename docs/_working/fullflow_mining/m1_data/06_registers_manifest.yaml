      c1_market.tick_data: 8953165904
      c1_market.kline_1min: 1486013551
      c1_market.tick_depth_5: 103506452
      c1_market.kline_daily: 10108926
      c1_market.kline_daily_hfq: 10079242
      c3_fundamental.news_data: 8249360
      c1_market.l2_tick: 0
