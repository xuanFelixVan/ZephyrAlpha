    我把这条与"按星期映射"另一方案一起量了 40 夜（8 周）：doy%4 的四片占比＝32.5%/35%/35%/37.5%，
    按星期映射那版＝27.5%/27.5%/27.5%/55%（0 片被周一/周四双取，严重偏斜）。
    ⇒ 保留实现中的 doy%4；这不是"没验证的直觉"，是量过之后的选择。前 12 夜序列（doy%4）＝1,2,3,0,3,0,1,2,3,2,3,0。
    另一条如实标注的固有近似：宇宙是每晚按当日成交额重排的 top-N ⇒ 分片切的是"当晚宇宙"，
    跨夜成员会变，四夜一轮覆盖的是"4×当晚 top-300"而非一个固定全集的稳定划分。

