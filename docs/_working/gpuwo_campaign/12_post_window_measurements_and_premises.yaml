measurements_after_0400:
  r4_smoke:
    when: 2026-10-12 04:04-04:08（date 实测；让路窗 04:00 之后开跑）
    command: python .runtime/tmp/gpuwo_r4_smoke.py --cap-min 24 --out .runtime/tmp/gpuwo_r4_smoke.out（rc=0）
    scope_per_R4: 5 只票／每票 pred_len=1 sample_count=8／synthetic 标记强制／**零写生产表**
    per_symbol_seconds: {600519.SH: 3.22, "000001.SZ": 0.45, 300750.SZ: 0.41, 600000.SH: 0.39, "002415.SZ": 0.48}
    mean_seconds_per_symbol: 0.99
    warm_cache_seconds_per_symbol: 0.43
    quantiles_monotonic: 5/5 只票 q005≤q025≤q050≤q075≤q095 全单调
    bars_used: 278（fetch_kline(days=250) 实得，尾部窗 400 不足即全用）
    vram_ruler:
      channel_a_nvml_per_process_memory: not_attributable（本 PID 在 NVML 计算进程表里有行，
        但 usedGpuMemory 返回 WDDM 哨兵 0xFFFFFFFFFFFFFFFF＝本机不可逐进程归因）
      channel_b_nvml_per_process_smUtil: not_attributable（驱动侧行宽非公开头所写，
        候选步长解出的 pid 过不了"必须全在计算进程表内"的正对照 ⇒ 整条通道作废，不发布对不上人的数）
      channel_c_torch_per_process: peak allocated 126 MiB / reserved 142 MiB（按构造即逐进程）
      channel_d_device_level_旁证: used 17966 MiB / total 24576 MiB（含桌面与其他进程，明确不当尺）
    acceptance_8g_verdict: >-
      以 torch 进程内自计为尺＝142 MiB ≤ 8192 MiB ⇒ 过，且余量两个数量级。
      诚实定级：R-4 要的是"逐进程真尺"，本机 NVML 的两条逐进程通道都判不可归因（A 哨兵、B 步长对不上人），
      所以这个"过"只有 channel_c 一条真尺撑着；若 Owner 要 NVML 口径的硬证，需换 pynvml/装 NVML 绑定
      或在 Linux 机上重跑（pynvml 与 py3nvml 本机实测均未安装：find_spec 双双 False）。
    r3_calibration_payoff: >-
      首夜标定要的就是这个数：热态 0.43 秒/标的 ⇒ 25 分钟上限约装 3400 只票；
      今晚 R-3 的"一夜一片×四夜一轮"对 top-300 来说严重过配（一片 75 只≈32 秒）。
      ⇒ 可呈的下一步不是把窗口拉长，而是把 top_n 提到 1000-2000 级（仍留大量余量），
      这条改不改由 Owner 定，我不自行放大覆盖面（那是消费面扩产）。
    not_covered_by_this_run: >-
      本次没量到"真实夜窗含落表写 CH 的整段耗时"（落表被 R-4 明令禁写）；
      也没在车道码上跑——vendor\Kronos 与 vendor\kronos_weights 只在主区工作树存在，
      车道里 load_predictor 必 RuntimeError（实测报的就是车道路径），
      故模型侧三函数取主区 dev 码、把车道新增的 5 行尾窗切片逐字内联。
      数值路径同一条（score_forward 本就只是 predict_close_quantiles 的转发），但口径上属"主区码＋内联"级，标清楚。

  w1_depth_join:
    when: 2026-10-12 04:00-04:12（两条尺：gpuwo_w1_depth_join.py 与正对照 gpuwo_w1_control.py，rc=0）
    execution_report_face:
      rows_total: 1
      rows_total_final: 1
      rows_with_decision_timestamp: 0
      distinct_symbols: 1
      the_single_row: "order_id=f216058c…，symbol=510300.SH，execution_start=2026-09-18 10:26:15.033+00:00，decision_timestamp=NULL，slippage_bps=-10000.0"
    tick_depth_5_face:
      months_with_rows: {"202607": 48, "202608": 4, "202609": 130146930}
      max_trade_date: 2026-09-30
      october_2026_rows: 0
      distinct_symbols_september: 8720
      daily_rows_september_sample: {"2026-09-30": 3822768, "2026-09-29": 1, "2026-09-28": 22830201, "2026-09-21": 14567}
    join_test_result: "1 只抽样标的，可联 0 条"
    why_this_probe_is_inconclusive_by_construction: >-
      语料只有 1 行，抽样比例无从谈起；而且把该行的 execution_start(10:26:15 UTC) 按 +8h 换成北京时间是 18:26，
      已过收盘，落在深度表的无数据时段；同日该标的那张表确实有 2015 行（正对照查过）
      ⇒ 到底是"写入方把本地时间贴了 UTC 标签"还是"这行本就是测试行"，一行语料判不了。
      我不把 joinable_share=0.0 当成"连不上"的结论报，那是我的时区算法与一行数据互相喂出来的数。
    decisive_finding_for_the_replay_leg: >-
      M-2／真实 replay 腿的真正拦路石不是"obs 缺档口"（07 册那句只到第二层），
      而是**上游根本没有语料**：execution_report 全库 1 行且 slippage_bps=-10000、decision_timestamp=NULL；
      另一侧 tick_depth_5 自 2026-09-30 之后 0 行（10 月整天 0 行，9-29 只有 1 行、9-21 只有 1.4 万行这种窟窿），
      也就是说档级行情的采集面在最近 12 天是断的。两条合起来：
      "从真实成交+真实盘口重建 24 维 obs"这条路今夜量出来是**双重空集**，不是工作量问题。
      这直接改 B-007 材料包的依据：真训练若要"真实流水"，先要有写者把 execution_report 填起来、
      并把档级采集恢复；否则只能走合成盘口（=现在 env 的 book_provider 形态），而那要如实标"合成"。
    ownership_note: 档级采集断档与 execution_report 无写者，都属数据车道/采集链的账，本班只报数不代修。

