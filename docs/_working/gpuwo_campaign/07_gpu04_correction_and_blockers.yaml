blocker_for_M2:  # 这条是要 Owner/统筹定向的实事，不是抱怨
  statement: >-
    M-2 按字面"用 execution_report 做 behavior-cloning 预热"**做不了**，原因在观测维度而非工作量：
    TD3 的 obs 是 24 维（obs_dim_for():42-44＝5 档×(价差比+量占比)×2 侧＋进度 4），
    state_to_obs():47-67 需要**五档盘口快照**（RlExecState.book.ask_price/bid_price/ask_vol/bid_vol＋last_price）；
    而 execution_report 一行只有订单与成交侧字段（intended/actual 量价、vwap、slippage_bps、
    decision_timestamp、algo_type、broker_id）——**没有任何档级盘口**。硬凑 obs＝把不存在的数写进训练面，
    正是我今夜在 GPU-03 那边抓到的同一类错（"基底有值但口径错"比查无更致命）。
  options_for_adjudication:
    - id: W-1
      name: 按 (symbol, decision_timestamp) 联接档级行情重建 obs
      needs: market_tick_depth_5 / market_l2_tick / market_tick 三张表之一做 join 源（同 schema 目录下siblings）
      risk: 档口深史覆盖与 PIT 对齐要先量（本仓有"深史上限"前科，别假设能连上）；CH 读属让路窗外动作
    - id: W-2
      name: 降维——BC 只在"动作参数面"学（slice 比例／参与率），不吃档口
      needs: 重定义 obs（或另建窄策略头），checkpoint 与现 24 维不兼容＝换策略契约，属设计变更
      risk: 与现 td3_agent 的 [-1,1]^2 语义耦合被改动，且与 env 硬边界契约要重核
    - id: W-3
      name: 承认 M-2 暂不可行，先做 M-1（缝已实测存在），BC 等行情联接量完再开
      cost: 零新代码面损失
      my_recommendation: 这条。M-1 的缝是真的、可落、能判生死；M-2 缺的是**数据要素**不是工程量，
        在要素到位前硬写只会产出一个能跑但没有意义的 buffer。
  also_note: schemas 目录内已有一句实测警示——market_execution_report.py:61 注明
    "本表 slippage_bps 全库零程序读者"＝这张表今天连一个读取方都没有（我核过，与我 find 的结果一致）。

governance_gap_found:  # 不是本单要修的，但必须报
  fact: >-
    docs/01_policies_and_standards/_registry/catalogs/risk_tier_registry.yaml 的 domain_tiers(:67-202，18 域)
    **不含 D_EX_SOR**；default_tier=low(:41)＋"未显式列出的一律 low"(:29-31) ⇒ 治理面把 D_EX_SOR 记为 low、无 human_gate。
    而该域代码件全部自声明高安全级：rl_exec_env.py:11 / rl_exec_contract / rl_exec_boundary /
    algo_execution_selector 均 [SAFETY] H；相邻的 D_EX_CORE 却是 tier: high＋7 条 Owner human_gates(:67-77)，
    其措辞"交易核心域（D_EX_CORE/D_POSITION/D_RISK/D_TRADING/D_PLAN）"本身也不含 D_EX_SOR。
  why_it_matters: >-
    执行域 RL（真训练与产物去向）恰好落在这个错位里：模块说 H，查表说 low。分级不放松 gate，
    但"未列出＝low"会让 medium/low 全自动那一路径管到本该 Owner 门的东西上。
  my_action: 只登记不代改（风险分级册属治理热册＋Owner 门位语境）；建议统筹定向补条目或改措辞。

