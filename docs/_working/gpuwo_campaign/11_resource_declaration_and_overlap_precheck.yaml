r4_ruler_channels_measured_2026_10_12_032x: >-
  冒烟尺在建的过程中先出三条实测（都是尺本身的成败，不是被测数）：
  ①NVML 逐进程 usedGpuMemory：本机能开 nvml.dll、能列 21 个计算进程，但对本 PID 返回哨兵值
  0xFFFFFFFFFFFFFFFF（WDDM 下不可归因）⇒ 这条只报 not_attributable，不报数；
  ②NVML 逐进程 smUtil（nvmlDeviceGetProcessUtilization）：结构行宽非公开头所写 32B（实测 rc=7 时驱动回填
  "需要 72 行"），按候选步长解出的 pid 过不了"必须全部落在计算进程表里"的正对照 ⇒ 整条通道判 not_attributable，
  我不拿它出数；
  ③设备级 nvmlDeviceGetMemoryInfo(v1，_v2 在本机 rc=2)：total=24576MiB、used≈3562-4163MiB 波动，
  **只作旁证不当验收尺**（在册教训：设备级被桌面图形污染，零负载也能 8-57%）。
  ⇒ 今夜 R-4 的"≤8G 验收"只能由 ④torch 进程内自计（max_memory_allocated/max_memory_reserved）承担，
  这一条按构造就是逐进程的。若它也不可用（跑在 CPU 上），我就如实报"显存验收无真尺可用"，不交假数。

