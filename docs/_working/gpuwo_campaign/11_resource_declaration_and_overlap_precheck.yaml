correction_of_my_own_record:
  old_claim: 03 册与我给 Owner 的口头进度里那句"实体挂 gpu_default/llm_local 互斥组"
  truth_measured: >-
    generate_resource_profile_registry.py 的申报面只有两处能定 resource_class/互斥组：
    ①MANUAL_ENTITY_SEED（手动/事件实体种子表，如 manual_kronos_adapter 才是 class=gpu grp=gpu_default）；
    ②schedule.yaml 槽位特化表。计划任务（sch_*）由 register_*.ps1 解析"任务名/触发器/时限"生成，
    class 走默认值。⇒ 我的三件新任务落册时是 light/default/无互斥组，不是我说的 gpu_default/llm_local。
  evidence: >-
    实测已落地那件的册面：sch_sft_train_window｜class=light｜pool=default｜exclusive_group=[]｜
    window=cron "0 10 * * 0"｜est_duration_min=300｜peak_mem_gb=0.5｜status=active｜
    schedule_truth_source=scripts/tasks/register/register_sft_train_window_task.ps1
    （它已随 a2c46fddca 落进 dev，册在 2026-10-12 00:25 的再生里收编了它）。
  how_i_am_fixing_it: >-
    按 Owner 固定正解"改喂给闸的输入指向，不动判据"：我不去改生成器（那是资源车道的册），
    而是把**申报诚实度**补回来——三个 register 脚本改成缺省注册为 DISABLED＋显式 -Enable 才上膛，
    并在脚本头把"闸此刻看不见互斥"这条写死。这样"零红"不会因为看不见而假绿，
    而"上膛"变成一个有痕迹的动作。生成器缺通道这条另立续单呈资源车道。

clock_face_overlaps_measured: >-
  用真实 cron＋申报时长手算的钟面撞车（不是我那把尺的输出，尺的局限见下）：
  1) sch_f06_grid = "0 23 * * 6"，est_duration_min=1440 ⇒ 周六 23:00 一直占位到周日 23:00；
     而 GPU-03 的周日 10:00-15:00 训练窗与 GPU-02 的周日 00:30-00:55 打分窗都落在它里面。
  2) sch_factory_lane_c = "0 20 * * 1-5"，est_duration_min=240 ⇒ 周一到周五 20:00-00:00；
     GPU-01 的夜窗 23:00-01:00 与它重叠整整一小时，且两批都要用本机 Ollama（LaneC 翻译腿今晨才被我确诊过依赖）。
  3) sch_decision_chain_sentinel = "50 9 * * *"，15 分钟 ⇒ 09:50-10:05，与周日 10:00 训练窗头 5 分钟相接
     （轻任务，属可接受，但如实列）。
  含义：令文那句"冲突闸零红才算过"我今天**给不出**——不是因为闸报红，而是因为闸此刻看不见这三件的重量。

ruler_limits_disclosed: >-
  我那把预检尺（.runtime/tmp/gpuwo_conflict_precheck.py）跑出来 5 个候选，其中 3 个是尺本身的毛病：
  ①est_duration_min 为 0/None 的实体被当成"零长窗"，点状窗口照样判重叠；
  ②多 cron 用竖线拼在一个字段里（如 "5 10 * * *|5 11 * * *"），croniter 解析失败后我按"无窗口"跳过＝漏报方向；
  ⇒ 所以本册的结论只认手算那三条，尺的输出不作数。这类"我的观测工具自己造的数"是已在册的坑，别再转手当证据。

