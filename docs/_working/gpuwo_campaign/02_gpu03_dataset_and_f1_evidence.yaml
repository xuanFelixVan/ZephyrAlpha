blockers_for_full_run:  # 三重实测拦路，任一都不该被我自行绕过
  - id: B-1
    kind: 人工闸门归属
    text: >-
      src/zephyr/ml_train/services/sentiment_sft_entry.py 头部 INVARIANTS 原文＝"禁真训练大模型——dry_run=False
      恒抛 ZA-MLT-0003；大模型真训练属 B-007 人工闸门事项，AI 不可自行触发"，其 CONSUMERS 又写
      "scripts/ml/run_sft_train.py（未来接线）"。而 scripts/ml/run_sft_train.py:105-107 在 main() 里直接
      import SentimentSFTTrainer 起跑，**不经过该入口** ⇒ 这道 Owner 闸今天对实际 CLI 路径是装饰件。
      令文一面要我"full 档真跑"，一面把"训练批复"列为只呈批不代拍——我不自行裁定哪句优先。
    my_action: 新 wrapper 把"按钮"显性化（授权文件缺失=零训练退出 0），既不违令也不越闸
  - id: B-2
    kind: 资源窗算术
    text: >-
      资源册 manual_run_sft_train est_duration_min=240（config/resource_profile_registry.yaml，manual/gpu_default/planned）。
      本班实测仅"推理 200 条"一腿就花 452s+536s≈16.5min；full 档 4258 条×3 epoch 的 QLoRA 必超 2h。
      现在时刻 23:3x ⇒ 起跑必伸进 01:00-04:00 CH 让路窗（令文 §3 红线第 4 条：窗内零跑批）。
      ⇒ 真跑只能在**周日日间登记窗**，今夜不属该窗。
  - id: B-3
    kind: 判据不可达＋产物覆盖
    text: >-
      按上面实测，同一份数据同一配方重训，跨 15.8 个百分点的概率极低；且 run_sft_train.py 无 --output-dir，
      cfg.output_dir 硬编 models/qwen25-7b-sft-v1（scripts/ml/run_sft_train.py:54；训练期 save_steps=100 直写该目录，
      结束时 save_pretrained 覆盖 adapter_model.safetensors）⇒ 真跑会覆盖**唯一在盘 SFT 产物**且该面无 git 跟踪。
      若仍要跑，前置＝先做带时间戳的 adapter 备份（10MB 级，本机 D 盘余 76G）。

