deviation_note_window: >-
  令文写"双周周日日间训练窗"。资源册生成器解析触发器的 _RE_WEEKLY
  （scripts/governance/generators/generate_resource_profile_registry.py:903）只认
  "-Weekly -DaysOfWeek X -At HH:MM"，不认 WeeksInterval；若我落双周，机生册会声明"每周"而实跑"双周"
  =静默漂移。故注册为**每周周日 10:00**（声明==实测），代价是每两月多一次空火（wrapper 秒退 0）。
  另：本班实测**从车道根跑生成器只出 69/103 实体**（丢的正是全部 sch_* 家族），从主区根跑出 102=与 HEAD 全等
  ⇒ 资源册再生必须在主区根执行，这条已写进本袋复核命令。

