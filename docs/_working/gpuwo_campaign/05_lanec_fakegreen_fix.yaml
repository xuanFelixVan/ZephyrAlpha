fix_1_ollama_no_longer_masquerades_as_green:
  measured_root_cause: 见第一袋 N-1（10-08 那跑每条候选 refusal_reason=llm_error:ConnectionError、exam_files=[]，
    hypothesis_translator 仍返回 0，包装层据 rc 打 "lane C full chain rc all green" 并 exit 0）
  mechanism:
    preflight: 起批前 Invoke-RestMethod 探 http://localhost:11434/api/tags
    recovery: 探不通先 schtasks /run /tn ZephyrAlpha_OllamaServe，等 20s 再探一次
    if_still_down: >-
      跳过 translate 段并 Complete-Run 90（不再跑明知会全灭的翻译腿，也不再报绿）
    zero_output_guard: >-
      即便 Ollama 通着，翻译腿的 stdout 落独立文件后按 translated/negative 两个计数判定；
      translated=0 且 negative>0 判 Complete-Run 91；stdout 不可读或读不到计数同样判 91——量不到就不给绿
  sentinel_rc_table:
    90: translate SKIPPED（Ollama 不可达＝基础设施失败，非策略失败）
    91: translate exit 0 但零可用产出（假绿形态）
    其余: python 段自身退出码，判据与阈值一字未改
  why_skip_not_run_anyway: 翻译腿在 Ollama 死时必然全灭，跑它只会产出一堆 llm_error 阴性行污染候选台账；
    跳过＋非 0 收口＝失败可见、候选不被误记

fix_2_killed_run_cannot_pass_silently:
  measured_root_cause: 10-09 那跑 fired 后只有 150 行 spearmanr 告警、四段横幅一条没写、00:00 被 4h 上限掐死，
    LastTaskResult 留非终态码，入库面两夜净贡献 0 条且无人知晓（第一袋 anchor_2 有全量数字）
  mechanism: 起批追加 start 记录到 .runtime/logs/factory_lane_c.run_state；
    每条收口路径（成功/各段失败/哨兵）经 Complete-Run 追加 end 记录；
    **下一班起批**先扫孤儿（tail 200 行里 start 数 > end 数）⇒ 落 orphan_detected＋Alerter ERROR 再开工
  design_note: 被强杀的进程写不了自己的遗嘱，这是机制约束不是偷懒；因此把"发现"外包给下一班，
    最坏滞后一晚，但绝不静默。若统筹要"当场告警"，需另建 watchdog（属新增常驻件＝另批呈批，本袋不自造）

refactor_disclosure: >-
  为把"收口必写 end"变成不可遗漏，27 行原有内联语句改写为等价 helper 调用
  （Write-Log / Notify / Complete-Run）。逐条对应关系：`"==== X exit code $x ====" | Out-File ...` → `Write-Log`；
  `cmd.exe /c "python -c ""...Alerter..."" >> $log 2>&1"` → `Notify`；
  四段失败分支的 `exit $x` → `Complete-Run $x <note>`（行为等价：仍打 FAILED 横幅＋ERROR＋以该 rc 退出，
  只是额外落一条 end 记录并统一 "exit code" 横幅措辞）。末段 `exit $finalRc` → `Complete-Run $finalRc all green`。
  四段 python 命令、参数、短路顺序全部未动 ⇒ 现产线判定与阈值零变更。

