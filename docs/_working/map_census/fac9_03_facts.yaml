db_prescriptions:

  - table: c1_backtest.strategy_screen
    prescription: "SELECT count() AS rows, uniqExact(strategy_id) AS strategies, max(screen_batch) AS latest_batch FROM c1_backtest.strategy_screen"
    note: "E4 考试成绩主台账（FAC-E4 store_refs 真源）；近 30 天触发电=加 WHERE created_at >= now()-INTERVAL 30 DAY（列名以 DESC TABLE 实勘为准）"
  - table: c1_backtest.hypothesis_precheck
    prescription: "SELECT count() AS rows, countIf(verdict='pass') AS pass_cnt, countIf(verdict!='pass') AS reject_cnt FROM c1_backtest.hypothesis_precheck"
    note: E2 预审判定台账（MOD-BT-091/152/153）；列名 verdict 以 DESC TABLE 实勘为准
  - table: c1_backtest.sim_daily_report
    prescription: "SELECT count() AS rows, uniqExact(trade_date) AS days FROM c1_backtest.sim_daily_report"
    note: E7 模拟盘日刊台账（MOD-BT-223 表结构）
  - table: c1_backtest.regime_snapshot_history
    prescription: SELECT count() AS rows FROM c1_backtest.regime_snapshot_history
    note: MOD-REGIME-001 消费证据位（E8 元分配输入）
  - table: c1_backtest.alloc_budget_daily
    prescription: "SELECT count() AS rows, uniqExact(trade_date) AS days FROM c1_backtest.alloc_budget_daily"
    note: E8 sleeve 落库（PP-001 三件套，batch_plan_json.sleeve 读面=SQL_SLEEVE_DAY_SLICE）
  - table: c1_backtest.decision_daily
    prescription: SELECT count() AS rows FROM c1_backtest.decision_daily
    note: MOD-BT-212 日度决策快照表
  - table: n_trials（trial_ledger_registry.yaml）
