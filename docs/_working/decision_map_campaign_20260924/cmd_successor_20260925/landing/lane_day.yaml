  day_skip_verdict: >-
    不成立。2026-09-25 在唯一真源 c1_market.trade_calendar（SSE，8797 行全 is_open=1，只存开市日，
    覆盖 1990-12-19..2026-12-31）里无开市行，09-28 恢复开市；decision_daily 目标日序列
