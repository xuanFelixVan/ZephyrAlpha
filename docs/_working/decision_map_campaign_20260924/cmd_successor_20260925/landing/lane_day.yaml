    （09-25 当晚哨兵判词本就正确）。外部公告旁证见案卷 §⑥。
  ruler_cure: >-
    旧尺 last=裸 max(trade_date) 无上界，任一"超前于当日"的行（09-25 晨批写 target=09-28 是合法形态）把 last
    顶过 ref ⇒ lag 恒 0 ⇒ 尾部/中间整日缺失全被掩盖。新尺 E=日历 >=ref 首个开市日，act=max(trade_date WHERE trade_date<=E)，
    act!=E 即"缺即告警"，lag=(act,E] 开市日数；超前行只以 decision_max_unclamped/rows_beyond_axis 露出。
    --lag-days（真源 scripts/governance/_shared/thresholds.py，未动）继续管"日历期望日腿不可用"的降级轴，
    阈值文件与其他判据文件零改动 ⇒ 治的是尺子选型，不是放松阈值。
