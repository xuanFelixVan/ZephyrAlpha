entries:
  - module_path: scripts/backtest/t1_t2_handover.py
    domain_id: D_BACKTEST
    name_zh: T1到T2网格跑批守望交接器
    name_en: T1 to T2 Grid Handover Watchdog
    desc_zh: 断链重建件（LANE-AUTO 2026-09-25）：幂等一遍查状态机——定位最新 t1 run，核 manifest
      存在性与进程生死（WAITING/T1_DIED 只报不处置）；完赛后逐条执行 17 号文 §一验收判据与垃圾触发线
      落 handover_verdict.yaml；全绿则按"主效应前 20% 层参数展开"确定性构造 ≤tier2_points 的
      T2 子空间 JSON；claim 文件 O_EXCL 原子认领防双发，GPU 独占探测+E0 问闸过后方可沿用
      factory_grid_executor CLI 无窗发车并登记 reaper keep。
    desc_en: Idempotent T1-to-T2 handover watchdog: locates the latest tier-1 grid run, waits or
      reports death without remediation, runs the frozen acceptance criteria into a machine-readable
      verdict, deterministically builds the tier-2 subspace JSON (top-20% main-effect layers with
      parameter expansion, capped), and launches T2 through the existing executor CLI only after an
      atomic claim, single-GPU exclusivity probe and E0 window gate all pass.
    plain_zh: 交接班的哨兵。每半小时来看一眼第一批三千七百格跑完没有：跑完就照验收单逐条打勾，全合格才自动发出第二批九百格，并且先插一面"我发过了"的小旗，防止两个哨兵重复发同一批把显卡挤爆；没跑完或显卡正忙就下轮再看，第一批中途死了只报告位置、不自作主张重启。
