entries:
  - module_path: src/zephyr/backtest/core/closed_book_gate.py
    domain_id: D_BACKTEST
    name_zh: 闭卷读取闸
    name_en: Closed Book Read Gate
    desc_zh: 研究/回测数据面的前视泄露 fail-closed 执行件（LANE-PIT 件一）：切点由
      validation_method_registry.yaml 的 holdout_months 与 runner.ValidationConfig.finalized_at
      经 holdout_cutoff 派生（本件禁落切点常数，真源缺位即 ClosedBookConfigError，禁放宽为全窗可读）；
      enforce_closed_book_read 在查库之前判定——研究态 end>切点抛 ClosedBookViolation，
      闭卷考试态必须显式 exam_ticket 且同批 CAS 追加一行审计到
      data/backtest_artifacts/closed_book_exam_audit.jsonl，缺工单同样拒。消费方=
      ch_tick_replay.fetch_historical 与 ChTickProvider.fetch_historical 两个 tick 统一读口。
    desc_en: Fail-closed point-in-time gate for research/backtest tick reads. The holdout cutoff is
      derived from the validation discipline registry plus the finalization anchor (no new constant),
      reads whose window ends past it are rejected before any SQL, and an explicit closed-book exam
      ticket is required to pass, which simultaneously appends an immutable audit line.
    plain_zh: 考前试卷的封条检查员。任何人想调秒级行情做研究，先在打开柜子之前检查日期：
      越过考试起点就当场拒绝，一行数据都不会被取出；确实是官方安排的闭卷考试，必须报工单号，
      放行同时在本子上记一笔（谁、哪张卷、哪天到哪天），没工单照样不让开柜。
  - module_path: tests/backtest/test_closed_book_tick_gate.py
    domain_id: D_BACKTEST
    name_zh: 闭卷读取闸证尺测试
    name_en: Closed Book Read Gate Proof Tests
    desc_zh: 件一证尺（红绿双证，CH 交互全 mock）：切点派生与"源码禁字面量"自证、真源缺位
      fail-closed、两读口研究态拦截且 SQL 执行次数=0、考试态放行并落审计、缺工单拒、
      切点当日边界放行/次日拦、在窗内正常读。零写生产 data/。
    desc_en: Red/green proof suite for the tick closed-book gate with mocked ClickHouse.
    plain_zh: 检查封条检查员的考卷：偷看要当场拦住、报了工单才放行且留记录、拦的时候柜子根本没开过。
  - module_path: tests/backtest/test_n_trial_ledger_t0_family.py
    domain_id: D_BACKTEST
    name_zh: 做T族入分母证尺测试
    name_en: T0 Family DSR Denominator Proof Tests
    desc_zh: 件二证尺：t0 规则引擎 manifest 自动发现入 batch_records（只认 batches_done 实跑批、
      畸形批不猜补值、幂等、出生证 note 可复核、空面零增），以及 DSR 随分母单调非增、
      纳入 t0 后同一净值序列 n_trials 严格变大且 dsr 严格变小，并钉阈值常量未随本件改动。
      全 tmp_path 注入，零写生产账本与 data/。
    desc_en: Proof suite for counting t0 rule-engine trials in the DSR denominator plus DSR
      monotonicity in n_trials, all on tmp_path fixtures.
    plain_zh: 给"考了多少次试"的账本补漏：做T那几万次回测要计入分母，计了之后成绩分数只会更低不会更高，
      及格线一个数字都没动。
