    close_ratio_over_run: 9.86
    note: 斯达半导 603290(IPO 2020-02-04)=22、立昂微 605358(IPO 2020-09-11)=22 同期长连板亦被同一条链复现
caliber_risk:
- '**基准侧（非推导侧）缺陷**：官方池 limit_up_down(akshare) 按盘中多次快照累积写入，日行数=盘中快照并集，44 天里仅 12 天可作收盘态基准。干净日上推导 vs 官方：含
  ST 偏差 0.034、剔 ST 偏差 0.0022。冻结窗（2019-2025）的家数口径**无同期官方池可验**（官方池 2026-07-20 才有数据，在册断供结论成立）⇒ 冻结窗正确性靠口径自证
  + 该干净日外推，残余风险见下。'
- 官方 AKShare 池实测不含 ST（name LIKE '%ST%' = 0/4246 行）；主序列**含 ST**（ST 涨跌停是真实市场事件，剔除会使家数虚低）。对拍同时报告含/剔 ST 两版不挑选；卡侧若要剔
  ST 口径，逐日 ST 家数已给（per_series.limit_up_count.st_count_per_day）。
- 北交所 2021-11-15 才开板，故 bj 在冻结窗前段天然缺席（非数据缺口）；连板/涨停家数在 2021-11 前后总体口径连续，但 bj 参与会让绝对家数存在结构性阶跃。
- 涨跌停价 binding 检验（high>lu+0.02 即判当日无涨跌幅限制）是经验判据：若 stk_limit 某行 limit_up 本身录错，会被误判为非 binding 而漏计该日涨停。
