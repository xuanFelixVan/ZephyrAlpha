generated_for: L0d 广度序列解锁（TDM L1-S2 7 张预注册卡）
frozen_window:
- '2019-01-04'
- '2025-09-09'
expected_trade_days: 1622
selected_tables:
  price_panel:
    table: c1_market.kline_daily
    columns_used:
    - trade_date
    - symbol
    - high
    - low
    - close
    - volume
    - pct_change
    - ingest_ts
    - market_type
    adjustment: unadjusted_raw_prices（不复权）
    adjustment_evidence: 600519 同日两表面比对：kline_daily.close=975.0 / 2019-06-20，kline_daily_hfq.close=7031.7；2024-06-18
      raw=1521.5 vs hfq=11955.3384 ⇒ kline_daily 确为原始成交价面板，与涨跌停价同源。kline_daily.adj_factor 实测恒=1（不可用于还原），故除权不作二次修正，昨收/涨跌幅直取在册
      pct_change。
    dedup: argMax(col, ingest_ts) GROUP BY (trade_date, symbol)
    dedup_reason: 窗口内实测 656 个重复 (trade_date,symbol) 键（ReplacingMergeTree 未收敛批次）；不去重则家数虚高
  limit_price:
    table: c1_market.stk_limit
    columns_used:
    - trade_date
    - symbol
    - limit_up
    - limit_down
    - st_flag
    window_coverage: 1,622 distinct trade_date = SSE 日历冻结窗全集（零缺日）；7,589,103 行；limit_up IS NULL 5,082 行(0.067%)
    bj_coverage: 北交所窗口内 230,751 行 / 278 标的（首探按 board='bj' 得 0 是探针口径错：该列存中文标签，非在册英文枚举）
  universe_dim:
    table: c1_market.stock_list
    columns_used:
    - symbol
    - market
    - list_date
    - delist_date
    note: 5,930 唯一 symbol；delist_date 1970-01-01 哨兵=未退市
  trade_calendar:
    table: c1_market.trade_calendar
    filter: exchange='SSE' AND is_open=1
    expected_days: 1622
  selfcheck_official_pool:
    table: c1_market.limit_up_down
    filter: data_source='akshare' ONLY
    why_exclude_derived: 表内另有 data_source='derived_stk_limit'（2026-07-20..2026-07-31）=同款推导，非独立官方真源，已剔出对拍基准
limit_price_source: 主源=库内 c1_market.stk_limit 官方涨跌停价（已含 ST/除权效应）；兜底=在册 daban_board_event_deriver.rule_limit_price（Decimal
  ROUND_HALF_UP 到分；主板 10%、ST 5%（ST→10% 生效日 2026-07-06 在冻结窗外，2019-2025 全程 ST=5%）、科创/创业 20%、北证 30%）。未用 tushare
  拉取（库内源已全窗覆盖）。
eps: 0.001
touch_seal_definitions:
  touched_up: high >= limit_up - eps
  sealed_up: high >= limit_up-eps AND close >= limit_up - eps
  one_word: low >= limit_up - eps
  touched_dn: low <= limit_down + eps
  sealed_dn: low <= limit_down+eps AND close <= limit_down + eps
no_limit_binding_tol: 0.02
universe_rules:
  market_scope: market_type='A_share'（kline_daily 实测纯股票面板：60xx/00xx/30xx/68xx/92xx/83xx；ETF/转债/指数在各自独立表，未混入）
  board_classification: 按 symbol 前缀复用在册 board_of()；**禁**按 stk_limit.board 中文字符串筛（两 enum 不同）
  board_pct: sh_main/sz_main 10%、主板 ST 5%（冻结窗全程）、star/chinext 20%、bj 30%
  ST: 主序列**含 ST**（ST 涨跌停是真实市场事件，家数不应虚低）；st_flag 由 stk_limit 直给；同时产出剔 ST 变体供对拍（官方池不含 ST）
  new_ipo_no_limit: 显式处理=涨跌停价 binding 检验：limit_up 非空但 high > limit_up+0.02 或 low < limit_down-0.02 ⇒ 当日无有效涨跌幅限制（覆盖科创
    2019-07-22 起 / 创业板 2020-08-24 起 / 北证 2021-11-15 起 首 5 日、主板全面注册制 2023-02-20 起首 5 日），该类 symbol-day 从涨停/跌停/炸板/连板系列剔除（仍计入净广度）；limit_up
    IS NULL 同样剔除
  halt: volume=0 剔除（窗口内 25,417 行）：停牌不参与任何家数与净广度
  delisted: stock_list.delist_date 之后剔除；未在 stock_list（mkt=''）剔除
  pre_listing: trade_date < list_date 剔除
  one_word_board: 一字板计入涨停家数（卡要求'含一字'），且天然计入 touched
  bj_北证: 北证（4/8 开头与 92 开头，在册 board_of 判 'bj'，幅度 30%）全程纳入 universe：stk_limit 窗口内北交所 230,751 行 / 278 标的（92
    开头 229,638 行 / 275 标的 / 1,379 交易日）。北交所 2021-11-15 才开板 ⇒ 冻结窗**前段天然无北证样本**（非数据缺口），但绝对家数在 2021-11 前后存在结构性阶跃，卡侧分位/桶须知情。
  streak_and_ipo_first_day: 连板链只把'涨跌停价 binding 且收盘封住'的日子计入连续段：主板新股上市首日（44%/36% 限幅）与注册制首 5 日无涨跌幅日会被 binding
    检验剔除 ⇒ 若市场习惯把 IPO 首日也算进'X 个涨停'，本序列连板高度会比该习惯口径**低 1**（实测：万泰生物 603392 上市 2020-04-29，市场称 26 个一字板，本序列
    2020-04-30..2020-06-08=25）。涨停家数不受影响（IPO 首日非 10% 涨停板语义）。
