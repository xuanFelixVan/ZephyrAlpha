method_notes:
- 主面=data_binding 内 table/source/refs/series/target 类键解析出的 CH 表；辅面=其余键（只登记不作判据）
- 日期列取业务列（trade_date/window_date/snapshot_date/report_date/...），ingest_ts/updated_at/fetched_at 是摄取时刻永不作窗口判据（首轮误用 ingest_ts 且该列多为 epoch 0，已纠）
- scorable_now 三件同时满足：①主面表在册且窗内实覆 ⊇ 冻结窗 ②signal 列名在 system.columns 实测命中 ③卡自述 signal_derivation 无推导算子（词表判定，标题词不作证据）且全 binding 文本无运行产物语义（净值/成交/持仓/run_id/shadow）、无 PG/图谱面；now 卡若卡名含聚合语义则在 gap_or_build_note 记残留风险。覆盖判据=主面表窗内实覆 [min,max]
  ⊇ 冻结窗，且窗内日期数 >= trade_calendar(is_open=1) 同窗应有日数-1
- '>4 亿行表（tick_data/technical_indicator/kline_1min 等）窗内 countDistinct 跳过，按全表 min/max 判'
- 聚合表行数取 system.tables.total_rows（未 FINAL），需要 FINAL 精确数时按行登记 engine 供复核
