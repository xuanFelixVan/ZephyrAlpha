  ②再拆两袋投（测件袋 --depends-on 源码袋）⇒ TEST-SOURCE-CONSISTENCY 判败，因为它按落地面 HEAD
  查符号，源码袋还没落地时新符号当然查无——这正是"守卫必须与被守件同袋"的在册教训。
  终局＝回到一袋：给测件头部补一行 [DOMAIN] D_EX_SOR。这不是为了让门闭嘴而造的豁免：
  COMMIT-SCOPE 自己的优先级就是"先读 .py 的 [DOMAIN] 头，再退路径推断"，而这个测件的 [MODULE] 写的就是
  tests.ex_sor.test_td3_trainer、[A_test] 的 module_id 是 TEST-MOD-EX_SOR——它本来就测 D_EX_SOR 的码，
  补上头部是把已有事实写成门认的形态（同 AGENTS 二节第 4 条"改动与自家守卫同批是合法的"语义）。
  顺带留痕：q-20261012-st-gpuwo-20261011-0014 是这一袋的前身（源码＋文档两件套），
  后继袋带齐三件且字节为终态；两袋都按 FIFO 落，落地后 HEAD 的最终面就是本册描述的那份。

