leg_m1_shadow_compare:
  file: src/zephyr/ex_sor/services/rl_trainer/trainer.py（改，+117/-5 对 dev）
  deleted_lines_audit: >-
    删掉的 5 行全是我自己重写的那 5 行头部字段与一行 typing import——
    [INVARIANTS]/[CONSUMERS]/[ERROR_CONTRACT]/[TESTS] 四行＋"from typing import Final"；
    业务代码零删除。
  why_here_not_in_the_selector: >-
    对拍的候选腿要用的东西全在训练器这一侧（obs 编码、解码单点、env 回放），而
    MOD-XS-011 AlgoExecutionSelector 是 MATURITY=production／SAFETY=H 的实盘选择路径。
    影子评估的意义恰恰是"不进那条路径也能先把两个数摆在一起看"，所以本腿零 import 生产侧新依赖，
    只复用文件里已有的 RlExecEnv／TD3Agent／decode_action。
  api:
    passive_reference_actor: 参考腿（每片同档同参与率；越界参数 fail-loud）
    agent_reference_actor: 候选腿（TD3 actor，缺省 sigma=0＝评估态不掺探索噪声）
    run_shadow_leg: 一条腿走完一回合，逐切片记（档, 比例, 成交量, 本步成本）＋回合级 is_total/fill_ratio
    shadow_compare: 同 seed 同盘口序列多腿逐切片对拍，输出 divergence_rate 与 is_delta_vs_reference
  caliber钉死:
    divergence_rate: 与参考腿不同的切片占比＝档不同 或 参与率差>ratio_tolerance（缺省 0.05）；一边提前终止的切片也记分歧
    is_delta: is_total(该腿) - is_total(参考腿)，正数＝比参考腿更贵
    single_decode: >-
      参考腿产出口径是 [-1,1]^2 原始动作，解码继续走 decode_action 这一个点。
      刻意不另造"直接给 RlExecAction"的通道，否则对拍比的是两套解码而不是一套策略。
    same_market_premise: env_factory 必须每次造同 seed＋同 book_provider 的环境，否则两数不可比（有测件钉这条）
    no_wiring_marker: 返回字典带 consumption 一句"未接任何生产/实盘路径；转正走 B-007 Owner 门"

