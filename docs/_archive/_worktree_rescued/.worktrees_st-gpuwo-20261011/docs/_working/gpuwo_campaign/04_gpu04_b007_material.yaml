decision_requested:  # 一句话能批的那种，不摊三层菜单
  question: 是否批准 GPU-04 进入"先补 M-1/M-2 两腿、再以 --real-training 触发一次短程真训（240min 周日窗）"的施工？
  my_recommendation: >-
    建议批**只补腿不触发**（M-1＋M-2 施工，--real-training 再单独批一次）。
    理由三条都可在盘上核：①安全级 [SAFETY] H 且奖励语义是"永不为正"的滑价成本，训练本身不危险但**产物去向**危险；
    ②影子对拍腿不存在＝今天真训完也没有能判定它好坏的尺，训了也只能拿 loss 曲线自证（那是我最不想交给 Owner 的那种绿）；
    ③本班今夜刚实测到一类同族病（GPU-03 的 SFT 线：模型跑出来 0.6290 而基线 0.7869，15.8pp 差距——
    根因之一就是**先训后想尺**）。把尺先立起来，成本 2 条腿，收益是"训完能判生死"。
  if_denied: GPU-04 转"trainer 已在位、材料已呈、待裁"归档，零训练动作维持。

