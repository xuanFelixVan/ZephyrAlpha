premise_correction_first: >-
  工单 GPU-04（2026-09-17）§1 写"trainer 不存在"、本派工令 §2 P3 写"TD3 选型**建议**"——
  两条都已被现盘事实超越，且超出的部分是**按 H-04 新口径正当解禁的**：
  src/zephyr/ex_sor/services/rl_trainer/ 现有一包三件（__init__.py 1774B／td3_agent.py 8168B／trainer.py 6833B，
  mtime 2026-09-23 14:29），算法**已经是 TD3**，且 rl_exec_env.py:42-45 原文记
  "训练器施工已按 H-04 新口径解禁（HANDOFF_20260921_ab_league.md 62 行，实现=zephyr.ex_sor.services.rl_trainer）；
  真训练管线触发与训练后模型上实盘仍属 Owner 闸门"。
  ⇒ 因此本袋**不是**"trainer 设计方案"，而是**"要不要按下 --real-training"这件事的材料包**。
  我不重写已存在的选型，只把已存在的实现如实呈上＋把还缺的东西点名缺。

