gpu02_score_only:
  file: scripts/backtest/kronos_adapter.py
  new_symbols: [SCORE_COLUMNS, _pick_last_window, score_forward, build_prediction_row, write_kronos_predictions, resolve_score_universe, run_score_only]
  eval_leg_untouched_evidence:
    method: AST 结构判据（不是"看起来没改"），同一套判据打在 dev 未修码上 5/5 判败、打在本码上 0/5 判败
    red_proof: "dev(未修) = {early_before_eval_import: False, score_body_clean: False, flag_registered: False, has_score_columns: False, registry_key_ok: False}"
    tests: "tests/research/backtest/test_kronos_score_only.py 10 支 + 既有 test_kronos_adapter.py 10 支 = 40 passed（含 lane_b 20 支）"
    isolation_mechanism: main() 里 args.score_only 的早退分支位于 import distribution_forecast_eval **之前**（行号由测试判据锁死）；run_score_only 体内禁出现 evaluate_distribution_forecast/walk_forward_eval/naive_quantiles
  premise_corrections_measured:
    - 工单 §2.1 说预测给"分布参数+点估计"——实测 Kronos 只出 **5 个分位**（0.05/0.25/0.5/0.75/0.95），仓内**无 mu/sigma**；点估计取 q050，表里同时存 q050 与 point_estimate 双列并注明同值
    - 工单 §2.2 要求 PIT 字段含"barre 截面"——实测 schemas/ 全树**无 barra/barre 列先例**；截面口径改用仓内既有 `as_of_date DateTime64(3,'Asia/Shanghai')`（factor_signal.py:63 同族）＋ asof_ts/input_cutoff_ts 双 UTC 锚
    - prepare_multi_symbol 取"日期交集"且不足即抛 ⇒ **不可**用于全市场（宇宙越宽交集越空）；score-only 改走逐标的尾窗截断 _pick_last_window(max_context=400)
    - 全市场成本实测面未取（见 blocked_by_classifier）：按代码路径推算 batch=1 时 5000 只×8 样本=4 万次 generate，单夜不可能跑完；批量分块（128-256）才是可行形态，需实测确认
  self_caught_defects:
    - "分位索引错位：初版写 q[x][i]（i=枚举序）⇒ 只有 pred_len>=5 才碰巧对；被自己的 test_row_width 抓到 IndexError，改 [0]"
    - "表名解析用错键：get_registry().table() 认 category_id 不认物理表名；初版传 'kronos_prediction_daily' 直接 KeyError，改 'market_kronos_prediction_daily'（实测 market_a50_futures_daily→c1_market.a50_futures_daily 同构）"
    - "本袋 .ps1 初版含中文 6 行（45/18 字节）⇒ 违 .ps1 纯 ASCII 红线，被自家逐字节尺抓到后全部改英，现 6 件全 0 非 ASCII"

format_reflow_disclosure: >-
  本袋在 kronos_adapter.py 上带 103 行**同码重排**（非语义变更），必须在这里说明白，别让人从 diff 里自己猜：
  实测 dev 那份该件本身就**不是 ruff-format-clean**（把 dev 字节落临时件跑 ruff format --diff，它会主动重排
  40+ 处：多行 return 拆行、闭合括号单独成行等）。而提交正门的 RUFF-PRECLEAN 预检对入队批要求确定性
  lint/format 零违规（通道阻断谱 ruff-format+ruff 占全史 46%），所以只要碰这个文件就必须整件顺格式。
  自证三件：①dev 副本同尺同判（ruff format --check 亦判待改）；②逐行集合差分 LOST=103 全部是同一语句的
  重新折行，NEW=306 里含我的新增与这些折行；③三支测试 40 passed＋AST 结构判据 0/5 判败＋
  ruff check/format 现全清。apply_market_tables_ddl.py 同尺 **LOST=0**（纯新增 9 行），未顺带动他人行。

