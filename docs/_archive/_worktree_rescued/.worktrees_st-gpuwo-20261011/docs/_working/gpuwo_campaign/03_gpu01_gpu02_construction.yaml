gpu01_night_window:
  register: scripts/tasks/register/register_night_mining_task.ps1（23:00 周日~周四，2h 上限，IgnoreNew，Get/Set 幂等）
  runner: scripts/tasks/run/run_night_mining.ps1
  backlog_discipline: 只跑 lane_b_idea_generator generate ＋ mcts_expression_search；**不调** factory_intake_pipeline run/construct、不调 hypothesis_translator（那三步才是入册/E2判决/考件生成腿）
  silent_error_fix: 起批前用 Invoke-RestMethod 读 /api/tags，**服务不可达或目标模型 tag 不在册即 Alerter ERROR＋退出非 0**，不再出现 10-08 那种"每条 llm_error:ConnectionError 却报 all green"
  lane_b_premise_correction: 工单 §2.1 称"--model 参数已支持，零代码"——实测 lane_b **没有** --model（MODEL 常量在 :56，OllamaChat 在 :150，出生证在 :130 硬读 MODEL）；lane_c2(:458)/translator(:344) 才有。故本袋补 lane_b 的 --model（缺省=None⇒沿用常量，现产线零变更），并**同步出生证**：换档后出生证仍写旧常量＝台账把 14b 的产出记成 8b，属不可逆归属错记
  mcts_note: mcts_expression_search **零 LLM**（随机/UCB 过白名单）⇒ 它不参与档位 A/B，只有 lane_b/lane_c2/translator 参与
  ab_command_set_pending: |
    三档各一夜（23:00 窗，次日 10-12/10-13/10-14）：
      $env:NIGHT_MINING_MODEL="qwen3:8b";  schtasks /run /tn ZephyrAlpha_NightMining
      $env:NIGHT_MINING_MODEL="qwen3:14b"; schtasks /run /tn ZephyrAlpha_NightMining
      $env:NIGHT_MINING_MODEL="deepseek-r1:14b"; schtasks /run /tn ZephyrAlpha_NightMining
    读数面：产出量=lane_b_candidates.csv 按 birth_batch 直方；入考通过率=c1_backtest.hypothesis_precheck.verdict 按批聚合；
    幻觉率=同一册的 verdict_reason ∈ {reject_no_mechanism, reject_tautology, reject_cost_prohibitive, reject_unfalsifiable, reject_lookahead, reject_out_of_scope} 占比
    （**注意**：lane_c2 自己的 thin_mechanism/originality_duplicate/llm_error 三类原因只在 stdout，未持久化——那是 A/B 的一个真实盲区，已登记不代修）

scheduling_finding_gpu02: >-
  令文对 GPU-02 的两个要求互相冲突：①"00:30 周日~周四"②"01:00-04:00 CH 让路窗内零跑批零 CH 查询"。
  00:30 起跑＋任何超过 30 分钟的跑批都必然伸进让路窗，而 score-only **本身就写 CH**。本袋的处置＝
  执行链把上限传给适配器（--max-runtime-min，默认 25 分钟＝00:55 收手），到点**自己停并如实报
  yield_window_hit=true 且零落表不判绿**；ExecutionTimeLimit=35min 只做外层兜底。
  代价讲明白：这个口径下"全市场 ~5000 标的单夜跑完"（工单验收第 1 条）**机械上不可能达成**。
  两条出路请统筹定向：(a) 打分窗挪到周日日间（与 SFT 窗同侧，可给 4h）；(b) 宇宙分片（如每日 top-1000，
  四天铺满一轮）并把验收判据从"单夜全市场"改成"一周内全市场覆盖率"。我不自行改验收口径。

