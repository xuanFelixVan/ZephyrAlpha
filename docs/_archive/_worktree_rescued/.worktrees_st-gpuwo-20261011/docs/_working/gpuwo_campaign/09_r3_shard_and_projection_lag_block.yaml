r3_shard_landing:
  ruling_restated: >-
    R-3 批复口径：00:30 那片按"一夜一片、四夜一轮"切；单夜硬上限 25 分钟；首夜要出标定数；
    分片没跑完禁报绿；不许把打分挪到周日白天。本节把这四句变成代码与 runner 的实参。
  python_side:
    file: scripts/backtest/kronos_adapter.py
    new_function: shard_universe(universe, *, shard_index, shard_count)
    slicing_rule: >-
      宇宙序＝SQL_UNIVERSE 成交额降序（真源次序），切片只按位置取 [idx*size, (idx+1)*size)，
      size 用 ceil ⇒ 末片可短但不漏票；越界 shard_index 抛 ValueError（禁"取不到就当没活干"）。
    cli_flags: --shard-index / --shard-count（缺省 0 / 1＝不分片，老 runner 的字节口径零变更）
    summary_fields_added: universe_total shard_index shard_count shard_size shard_status calibration
    calibration_meaning: >-
      elapsed_min / sec_per_symbol / symbols_fit_in_cap 三个数就是"首夜标定"要的实测吞吐：
      分片粒度合不合适只能由跑出来的秒数说，不能由我拍头的 shard_count 说。
    exit_code_contract:
      "0": 本片全部标的成功落表
      "1": 硬败（宇宙空／本片空／分片参数非法／落表失败／一行都没落）
      "3": 本片跑完但有标的取数或打分失手（覆盖有洞）
      "4": 25 分钟让路闸把本片掐断（覆盖不全，明晚那一片不等于今晚这片跑完了）
  runner_side:
    file: scripts/tasks/run/run_kronos_scoring.ps1
    rotation_formula: shard_index = (Get-Date).DayOfYear % shard_count，shard_count 缺省 4
    rotation_note: >-
      Sun-Thu 五夜里按日序取模轮片，多出来那一夜只是重复某一片；预测表主键含 as_of_date，
      同一天同一只票重复打分是 ReplacingMergeTree 的幂等覆盖，不产生第二种口径。
    env_overrides: KRONOS_TOP_N / KRONOS_MAX_RUNTIME_MIN / KRONOS_SAMPLE_COUNT / KRONOS_SHARD_COUNT / KRONOS_SHARD_INDEX
    rc_policy: >-
      rc!=0 一律写 NOT GREEN 行＋Alerter ERROR 并按原 rc 退出（不折成 0）；rc=0 才写 green。
      这一段是本班 LaneC 教训的复用：静默把"没跑完"记成"跑完了"比不跑更坏。
    ascii_ruler: 字节 5505／非 ASCII 0；Parser::ParseFile=SYNTAX-OK（PS5.1 中文注释会假报语法错，在册红线）
  guards:
    test_file: tests/research/backtest/test_kronos_score_only.py
    measured: 19 passed（本袋新增 9 支）；同批 test_lane_b_idea_generator.py 20 passed，两文件合计 39 passed
    new_predicates:
      - 四片拼回逐位等于原宇宙（防切片顺手重排＝跨夜口径漂移）
      - ceil 分片不漏票（10 票 4 片＝3/3/3/1）
      - 越界 shard_index 抛 ValueError
      - CLI 里必须有 --shard-index/--shard-count（防参数只活在代码常量里）
      - run_score_only 函数体内必须真的调用 shard_universe（防 runner 传参是装饰品）
      - 中断且有行＝rc4；有失手＝rc3；全成＝rc0 且标定三字段齐
      - shard_count=1 时本片＝全宇宙（老口径零变更）
    red_proof: >-
      同一套 9 条判据打在 dev 未修码上 9/9 判败，打在车道已修码上 0 判败。
      尺子脚本 .runtime/tmp/gpuwo_redproof_shard.py（只读，零写盘）。
  untouched: >-
    walk-forward 评估腿、判定尺、K 线取数、模型加载、落表列序单点全部未动；
    本节的分片只发生在 --score-only 腿的宇宙切片上。

