    n_trials_effective 披露位现值仍停在 2026-10-07T10:59:22+00:00 的 value=16
    （note batch:20261007-112020 n=2459）——即"最新批次有效试次"这一披露位已 4 日陈旧
  blast_radius_honest: >-
    窄：批级 N_eff 真值仍在各批 summary.json（2/2/11/16…）可读，f06_e4_wfa_exam 的溯源用的是
    per-record n_trials_eff 不是全局位；全局位现无生产读者（git grep 只见 snapshot() 自身与测试）。
    宽：任何将来读者会拿到 4 日前的数——所以仍须修，但不是 P0
  own_half_fixed: >-
    WO-A5 本班自修：抽 _should_write_neff_slot(smoke, exploration_ledger) 判据 + _write_neff_slot 单点写，
    run_batch 调用点改为走闸（+25/−7，删除的 7 行＝被替换的旧 if 块与那句旧注释，无别的删行）；
    测试 tests/research/backtest/test_factory_grid_executor.py::TestNeffLedgerGate 5 支（真值表四态／正常批写一次／
    smoke 不写／探索分册不写／AST 结构守卫"finalize 段不得再出现裸 set_effective_trials 且恰一处走闸"）；
    红证＝同一套判据打在 dev 未修字节上三条全红（.runtime/tmp/st-mineloop-20261010/woa5_red_proof.py，
    R1 裸调用=1 走闸=0、R2 条件名=[len, nets_for_neff, smoke] 不含探索旗、R3 真值表 1 处分叉）
  referred_not_self_fixed: >-
    护栏标定不在本班域：registry_mass_edit_guard 的 threshold=max(1, ceil(总行数×0.005))
    （src/zephyr/shared/io/file_utils.py:437/606-607，符号名 _REGISTRY_MASS_EDIT_MAX_RATIO /
    _registry_deleted_line_ratio）对 317 行的中等册＝2 行预算，而 CAS 覆盖中段多行标量块**必然**替换 ≥4 旧行
    ⇒ 合法写常驻失败；判据"删除行数"应改"净删除行数"才对准它要防的蒸发形态（本守卫把 delete+replace 一并计旧行）。
