    .runtime/audit/safe_write.jsonl 里 pid=53780（＝200438 批）10 条 event=refused
    reason=registry_mass_edit_guard deleted_lines=4 threshold=2（CAS 十次重试全拒，executor 的
    `except Exception` 只 warning ⇒ 静默）
