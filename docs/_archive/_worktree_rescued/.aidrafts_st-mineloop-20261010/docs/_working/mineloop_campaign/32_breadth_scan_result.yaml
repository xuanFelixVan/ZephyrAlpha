result_conditional_curve:
  design: A1_factor_normalize(3)×A2_combine_weight(3)×C_sizing(2)=18 核，每核 4 个 B_top_n 点＝平衡全因子（72 格）
  point_mean_sharpe: {top50: 0.4961, top100: 0.4271, top150: 0.4209, top200: 0.4226}
  adjacent_delta: {top50_to_top100: -0.069, top100_to_top150: -0.0062, top150_to_top200: 0.0017}
  monotone_increasing_cores: 0/18
  monotone_decreasing_cores_4point: 9/18（其余 9 核非单调，含 rank 分层 U 形）
  per_core_top50_to_top200_delta: >-
    18 个核里 14 个为负（−0.165…−0.043），4 个为正且量级极小（+0.007/+0.007/+0.02/+0.021）
    ⇒ 没有任何一核在 top50 之后**持续上升**
  strata_curves:
    A1_industry_neutral: [0.5513, 0.4865, 0.4778, 0.4687]
    A1_zscore: [0.5287, 0.4405, 0.4148, 0.3972]
    A1_rank: [0.4083, 0.3543, 0.3702, 0.402]
    A2_halflife60: [0.5265, 0.448, 0.4333, 0.4345]
    A2_ic_ir: [0.4818, 0.4177, 0.4158, 0.4172]
    A2_ic_mean: [0.48, 0.4157, 0.4137, 0.4162]
    C_equal_weight: [0.47, 0.3957, 0.396, 0.4022]
    C_signal_strength: [0.5222, 0.4586, 0.4459, 0.443]
    shape_note: industry_neutral/zscore 沿池宽单调下降；rank 呈 U 形（谷在 top100，末点 0.402 仍低于起点 0.4083）
  self_correction_4th: >-
    本班第四次自纠，且是**用自己的跑批证伪自己的前提**：26_/29_ 写的"广度未见顶 ⇒ 该续扫 top150/200"
    依据的是 23_ 的**边际均值**（joint_GxTopN_mean_sharpe：top50 0.2835 → top100 0.3393，差 +0.0558，
    即在整张 72.6 万格全空间的随机样本上按 B 轴分组取均值）。同一对档位在**条件面**
    （其余三维平衡全因子、只沿 B 轴走）是 −0.069，符号相反。
    为什么边际会反号——这次有实测样本可看了：误跑批 grid_20261011-190142 的 200 格里
    top10/top20/top30 占 114 格（实测 B_top_n 分布 {top100:49, top30:41, top20:38, top50:37, top10:35}），
    而 23_ 那张边际曲线正是这类不平衡样本按 B 轴分组的结果：窄池档与宽池档混算，
    把"同核沿 B 轴越宽越差"的斜率抹成了"越宽越好"的上升。
    ⇒ 教训入工法：判"未见顶"必须用**同窄面条件曲线**；边际均值在维度构成不平衡时是伪影，
      任何"该续扫"的结论先问一句"它是按哪一列分组取的均值"

