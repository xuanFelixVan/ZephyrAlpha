    = 648 格 ≈ 9.7-10.8 小时；216 格 ≈ 3.2-3.6 小时；两者同批 ≈ 13-14.4 小时 CPU 单线程
  gpu_stance: 本决定**不用 GPU**；GPU 留给 st-gpux 做基线对拍（③的曲线即其"改前"证据）
  unexplored_dimension_gap_action: 不自行发车（新增维度＝新扫描面，非邻域）；已作为本回执最大缺口呈统筹定夺

