finding_1_dimensions_never_varied: >-
  16 维里有 7 维在全部 27,423 格中**从未变过**：F_merge_policy=single、I_cost_tier=frozen_l0、
  J_regime_switch=off、K_capital_ramp=lump、X_breaker/X_sector/X_stop=off。
  ⇒ 名义 16 维的扫描实际只是 9 维子空间，且**整个风险控制族（成本档/体制开关/熔断/板块/止损/资金爬坡）
  被钉死在关闭位**。所以"top 区域"不含任何风控信息，任何"这套配置好"的读法都越不出被钉住的那 7 维。
  这是比"边界邻域"更大的缺口（且属新增维度，不是邻域补扫）。

finding_2_boundary_hits:
  H_turnover_lambda:
    means: {lambda_0: -0.5773, lambda_5bp: 0.3938, lambda_15bp: 0.1844}
    best_is_endpoint: true      # 5bp 是非零最小档
    cliff: true                 # gap/组内std = 0.585 ≥ 0.5
    read: 真实最优在 (0, 5bp) 内，格点集在该方向无内侧点 ⇒ 需定向补扫（新档 1/2/3/4bp）
  B_top_n_in_hs300:
    means: {top10: 0.2471, top20: 0.2566, top30: 0.2672, top50: 0.2835, top100: 0.3393}
    best_is_endpoint: true      # top100 是最大档，且在 hs300 每一档都是单调升
    cliff: false
    read: 宽度收益未见顶 ⇒ 需定向补扫 top150/top200（仅 hs300 内）
  A2_combine_weight:
    means_headline: halflife60 最优，gap/组内std=0.701 且非端点（8 档内测到了内侧峰）
    read: 面内已闭合 ⇒ 不补扫

finding_3_two_region_definitions_disagree: >-
  按"均值最优"读，赢面是 hs300（0.4176 领先）；按"top1% 富集度（lift≥1.3）"读，核心区域却是
  all_a_ex_st。两者不矛盾但含义不同：all_a_ex_st 的分布是**双峰**（多数格很差、少数格极好），
  hs300 是整体右移。⇒ 稳定性必须分两问回答：区域边界是否悬崖（已判，见 finding_2），
  以及区域是否跨时间稳定（**本轮不可判**：manifest 只有 2020-2023 单一窗的聚合指标，
  没有分段净值）——这正是把新卡的考试窗钉在 2024 之后的理由。

