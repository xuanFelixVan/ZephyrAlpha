purpose: >-
  24_ 号回执落地后继续核价核闸。实测把结论从"补扫很贵所以要定夺"改成
  "补扫很便宜但被两道结构闸挡住"。本件只更正与呈报：零发跑、零改他人件、零改冻结册。

correction_1_cost_estimate_20x_off:
  what_24_said: >-
    定向补扫 648+216 格 ≈ 13-14.4 小时 CPU 单线程（引"实测 54-60s/格"）
  measured_now:
    - >-
      data/strategy_intake/grid_20261010-233721_s0of6/heartbeat.jsonl 末支：
      cells_done=4167 elapsed_s=2719.5 ⇒ 0.652 秒/格
    - >-
      data/strategy_intake/grid_20261010-233721_s1of6/heartbeat.jsonl 末支：
      cells_done=4167 elapsed_s=2416.8 ⇒ 0.580 秒/格
    - >-
      data/strategy_intake/grid_20261010-232435_s0of6/heartbeat.jsonl 末支：
      cells_done=617 elapsed_s=621.6 ⇒ 0.993 秒/格（含一次数据装载暖机）
  caliber_honesty: >-
    三值均为 6 分片并发下的同片墙钟速率，且 batch_meta 记 engine=auto
    （心跳里 gpu_util=11-13%、gpu_mem 5.7GB ⇒ 确有部分面上卡）。
    纯 CPU 路径（--engine cpu --eval-backend cpu）速率未测：
    全仓 15 支 grid_ 批次的 batch_meta 无一支 engine=cpu，无历史读数可引。
  consequence: >-
    864 格在 auto 口径下 ≈ 9-10 分钟，不是 13-14.4 小时。我那句"按实测 54-60s/格"
    把 GPU 化班账袋里的一次性口径当成了网格速率，属数字错，且错向"更贵"
    （偏保守方向所以当时没拦下车——下次这类估算要先落在实测文件上）。
    发跑前须先用 8 格 smoke 量 CPU 真速。

