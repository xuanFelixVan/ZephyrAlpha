    核账时误在 shell 当前目录＝主区（非本车道）的状态下用相对路径 rm 掉了两个刚落地的自家件
    （docs/_working/mineloop_campaign/23_/24_），主区 index 随即把删除自动暂存成 "D " 两条
    ——若他袋此刻提交整池，会把这两件从 dev 上真删。
  cure: >-
    git checkout HEAD -- 两件复原；git status 对这两路已空；sha1 与落地时逐位相符
    （23_=826851a04c80…、24_=0156b2ed3715…），车道内原件全程未动。
  rule_adopted: >-
