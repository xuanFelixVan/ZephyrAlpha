blocker_2_phase3_unexplored_family_is_structurally_closed:
  my_earlier_read: 24_ 称风控族被 active_if 钉死，暗示"开旗即可跑"——错。
  measured:
    - >-
      空间乘积按 schema 逐维值数实算：phase=1 且 capital_ramp_enabled=False ⇒ 362,880 格
      （与 GridCompiler.compile 返回的 n_raw=362,880 逐位相符）
    - >-
      phase=3 且 capital_ramp_enabled=True ⇒ 52,254,720 格（144 倍：J2×X_stop3×X_breaker2×X_sector3×K4）
    - >-
      直调 GridCompiler.compile(phase=3, ramp=True) 实测 MemoryError，
      栈在 src/zephyr/position/core/position_recipe_compiler.py:269 的 combos 全展开行
    - >-
      执行器侧 subspace 过滤发生在 expand 之后（factory_grid_executor.py:1951 compile →
      1954 if subspace → 1956 才过滤 recipes_all）⇒ --context-json 与 --subspace-json
      无法组合成窄扫：先炸再筛
  consequence: >-
    风控族"从未扫过"不是忘开旗，是执行器当前结构打不开——需一支"展开前冻结"工单（WO-A4）。

correction_2_finding_1_three_parts_wrong:
  original_claim: 16 维里 7 维从未变过 ⇒ 整个风险控制族被钉死在关闭位（暗示 7 维皆遗漏）。
  corrections:
    I_cost_tier: >-
      属预注册设计恒折叠：schema 注释原文"不进乘法网格，恒折叠；执行器对幸存者单独重跑"；
      预注册册 cost_gate.tiers_bp=[0,5,10,20,40] 五档梯由 exam_cost_gate.run_cost_tier_scan
      在考试面消费，该册并明写"成本档禁作搜索轴"。故不算漏扫。
    F_merge_policy: >-
      其 active_if 要求 strategy_pool 长度大于 1；单池跑批下恒 single 是设计（多池合并才是另一条腿）。
    truly_closed_5_dims: >-
      J_regime_switch(phase>=2)、X_stop/X_breaker/X_sector(phase>=3)、K_capital_ramp(capital_ramp_enabled)
      ——这 5 维才是真未开面。
  extra_unjudged_fact: >-
    另一半证据面同样未开：本班 10 批 27,423 格尚无幸存者进 cost_gate 五档梯
    （data/strategy_intake/f06_survivors.csv 在册仅 1 支，birth_batch=grid_20260916-123551 属老批）。
  net: >-
    24_ 的 finding_1 大方向成立（这批读数不含风控信息、越不出被关掉的维），
    但"7 维皆钉死"把设计折叠算成了遗漏，按 5 维更正。

