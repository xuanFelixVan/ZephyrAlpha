verdict:
  gcal_1_resolved: true
  reasoning:
    - "A（卡面比值式）逐年 64.8/80.9/87.3/76.8/43.9/89.1/78.7 与卡面锚 65.4/81.9/87.9/77.0/44.1/89.2/77.0
      逐年吻合（最大差 0.7 家/日，方向=卡面 prereg 之后又有新交易日入库），G-CAL-1 的降级触发条件
      （『hfq 口径与卡面锚不符而接近 3882 量级』）为假 ⇒ 不触发 reject。"
    - "A 与 B 逐年差 ≤0.3 家/日 ⇒ 后复权/不复权表的选择对本卡涨停集合几乎无影响（卡面自述理由
      『同一 symbol 相邻两日复权因子一致，比值免污染』在实测面上成立）。"
    - "C（在册明令的绝对价口径）比 A/B 系统性低 3.5-5.4 家/日（61.6 vs 64.8 等）——绝对价 close>=limit_up
      会漏掉以涨跌幅口径封板但收盘价位因四舍五入/盘中复权差而未及 limit_up 的情形；两口径都是『合法涨停』，
      只是判据不同源。卡面冻结的是比值式（A），按 G4-5 判据冻结面零动，开考取 A，不以 C 替换。"
  root_cause_of_registered_3882: >-
    在册"hfq 得 3882 荒谬值"实测复现=把**后复权绝对价**与**不复权涨停绝对价**放在一起比
    （F_mixspace: kline_daily_hfq.close >= stk_limit.limit_up），逐年均值
    3147.4/3303.5/3456.4/3639.8/3893.5/4098.0/4207.3，2023 段正落在 3,882 量级——
    后复权绝对价可达 4 万-9 万（实测 max_hfq_close 逐年 23,685..90,286，而不复权 max_raw_close 仅 1,234..2,601），
    故该式几乎把全市场判成涨停。次高危候选=百分数与小数混单位
    （E_unitbug: kline_daily.pct_change(百分数) >= limit_pct(小数)-0.002），逐年 1759-2600，量级不足。
    ⇒ 结论：3882 不是"后复权比值口径"的错，是"混空间绝对价比"的错；卡面比值式无罪，R1_L11 的告诫
      应重述为"禁把复权后绝对价与不复权涨停价直接比"，而非"禁在后复权空间算比值"。
  disposition:
    - "卡 05/06 由 bindable 放行为可开考（11_prebind_review.yaml 的 G-CAL-1 闸口在此消解，不改该件原文）。"
