pbo_axis:
  positive_pbo: 0.4714
  negative_pbo: 0.0286
  gate: 0.05
  finding: PBO 不能当全仓统一门，但它的失效方式要说准（三族同尺实测）：①小市值真异象族 PBO=0.0=**判对**；②月频反转族 PBO=0.4714=**也判对**（该族本窗确无稳健效应）；③2,400 个随机选股族 PBO=0.0286=**判错**——噪声冠军照样过 0.05 门。机理不是'方向反'而是**在同质池上失去判别力**：随机选股组合≈全市场组合，池内成员彼此高相关，IS
    最优≈池中位，故其 OOS 也很少落到中位以下 ⇒ PBO 恒低。⇒ PBO≤0.05 只可作**族内相对指标**（池成员差异明显时），不可作跨族统一晋级门；晨裁 M3 的那一半应撤回。对照之下 DSR 尺在三族上都给出了正确方向（噪声冠军在自身 N=2,400 与治理 N 下均被挂）⇒ 本案未证伪 DSR。
