# Docker Compose — ZephyrAlpha 开发/测试环境
# Phase B: 加入 Prometheus + Grafana 可观测性
# 5.31.15 修复：移除已废弃的 version 字段（Docker Compose v2 忽略并输出 warning）

services:
  # ── 核心应用（Phase B 启动）──
  zephyr-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zephyr-core
    ports:
      - "8000:8000"
    env_file:
      # 5.31.14 修复：原 env_file: .env 但 .env 被 .gitignore 忽略，新克隆者无 .env 直接报错退出
      # 改为 .env.example 作为默认（仓库内已包含），新克隆者可直接 docker-compose up
      - .env.example
    environment:
      # 5.34.1 修复：原 ZEPHYR_ENV=development 不在 Env 枚举（dev/staging/production/test）中
      # _detect_env() ValueError 被吞掉静默回退 Env.DEV，导致环境隔离失效
      # 改为 ZEPHYR_ENV=dev（与枚举值一致）
      - ZEPHYR_ENV=dev
      - ZEPHYR_T1_KILL_SWITCH_PROBE=0
      - ZEPHYR_METRICS_DIR=/data/metrics
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    deploy:
      # 5.43.1 修复：为核心应用设置 CPU/内存上限，防止内存泄漏耗尽宿主机
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    restart: unless-stopped
    networks:
      - zephyr-net
    healthcheck:
      # 5.31.2 修复：原 zephyr.l01_infrastructure.health 不存在，改为简单 import 检查
      test: ["CMD", "python", "-c", "import zephyr; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus（可观测性）──
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: zephyr-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      # 5.43.1 修复：Prometheus TSDB 内存占用可控，限制 1 CPU / 1g
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    restart: unless-stopped
    networks:
      - zephyr-net

  # ── Grafana（仪表板可视化）──
  grafana:
    image: grafana/grafana:11.0.0
    container_name: zephyr-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-zephyr_admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    deploy:
      # 5.43.1 修复：Grafana 仪表板轻量，限制 0.5 CPU / 512m
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    restart: unless-stopped
    networks:
      - zephyr-net
    depends_on:
      - prometheus

  # ── Node Exporter（宿主机指标）──
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: zephyr-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    deploy:
      # 5.43.1 修复：node-exporter 仅采集指标，极轻量，限制 0.5 CPU / 256m
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    restart: unless-stopped
    networks:
      - zephyr-net

networks:
  zephyr-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
