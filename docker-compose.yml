# Docker Compose — ZephyrAlpha 开发/测试环境
# ⚠️ 阶段定性（2026-07-22，#ARCH-065）：本文件为 Post-Activation 预置配置，定义 experimental
#   阶段激活后要起的容器化 + 可观测性栈（zephyr-core / prometheus / grafana / node-exporter）。
#   当前 experimental 阶段（Windows 本地单机 + 本地日志文件）不调用 docker compose up——这是
#   experimental vs Post-Activation 二阶段框架（原 technology_principles.md §4.1，文档已删 2026-07-30，见 #ARCH-065）的预期行为，非死代码。
#   激活触发：接入真实资金 / 外部投资人 / 多账户 / SRE 抽屉激活。
#   注：Dockerfile + .dockerignore 仍被 .github/workflows/governance.yml docker-build job 使用，勿删。
# Phase B: 加入 Prometheus + Grafana 可观测性
# 5.31.15 修复：移除已废弃的 version 字段（Docker Compose v2 忽略并输出 warning）
#
# 5.34.2 修复：本地开发覆盖（override）用法说明
#   Docker Compose 启动时自动加载项目根的 docker-compose.override.yml 叠加到本文件
#   （无需 -f 参数，生产语义不变——本文件仍是唯一入库的 compose 配置真源）。
#   本地 dev 覆盖示例（debug 日志/源码挂载/热重载）见：
#     config/infra/docker-compose.override.example.yml
#   启用方式：
#     cp config/infra/docker-compose.override.example.yml docker-compose.override.yml
#     docker compose up -d
#   docker-compose.override.yml 已加入 .gitignore（本地私有覆盖，禁止入库）；
#   生产/CI 环境不要创建 override 文件，语义以本文件为准。

services:
  # ── 核心应用（Phase B 启动）──
  zephyr-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zephyr-core
    ports:
      - "8000:8000"
    env_file:
      # 5.31.14 修复：原 env_file: .env 但 .env 被 .gitignore 忽略，新克隆者无 .env 直接报错退出
      # 改为 .env.example 作为默认（仓库内已包含）
      # 注意（W2 fail-fast 后修正）：grafana 服务的 ${GRAFANA_ADMIN_PASSWORD:?...} 插值读取
      # 项目根 .env / shell 环境（非本 env_file），未设置时整个 compose 命令报错退出——
      # 新克隆者须先在项目根 .env 或 shell 中设置 GRAFANA_ADMIN_PASSWORD 再 docker compose up
      - .env.example
    environment:
      # 5.34.1 修复：原 ZEPHYR_ENV=development 不在 Env 枚举（dev/staging/production/test）中
      # _detect_env() ValueError 被吞掉静默回退 Env.DEV，导致环境隔离失效
      # 改为 ZEPHYR_ENV=dev（与枚举值一致）
      - ZEPHYR_ENV=dev
      - ZEPHYR_T1_KILL_SWITCH_PROBE=0
      - ZEPHYR_METRICS_DIR=/data/metrics
    volumes:
      - ./data:/data
      - ./logs:/app/logs
      - ./config:/app/config:ro
    deploy:
      # 5.43.1 修复：为核心应用设置 CPU/内存上限，防止内存泄漏耗尽宿主机
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
    restart: unless-stopped
    networks:
      - zephyr-net
    healthcheck:
      # 5.31.2 修复：原 zephyr.l01_infrastructure.health 不存在，改为简单 import 检查
      test: ["CMD", "python", "-c", "import zephyr; print('ok')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Prometheus（可观测性）──
  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: zephyr-prometheus
    ports:
      - "9090:9090"
    volumes:
      # 5.31.13 修复：原挂载 ./infra/prometheus/prometheus.yml（infra/ 目录不存在），
      # 改指向已有 SSoT 配置 config/infra/（git 跟踪，rule_registry_collection.yaml 登记）
      - ./config/infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    deploy:
      # 5.43.1 修复：Prometheus TSDB 内存占用可控，限制 1 CPU / 1g
      resources:
        limits:
          cpus: '1.0'
          memory: 1g
    restart: unless-stopped
    networks:
      - zephyr-net

  # ── Grafana（仪表板可视化）──
  grafana:
    image: grafana/grafana:11.0.0
    container_name: zephyr-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      # AI-01 W2 治本（2026-08-01）：原 ${GRAFANA_ADMIN_PASSWORD:-zephyr_admin} 是静默弱口令兜底——
      # env_file=.env.example 不含该变量 → 默认 zephyr_admin 必生效，SECURITY.md 的"仅本地开发"是文档治理，
      # AI 不会先读 SECURITY.md 再 compose。改 fail-fast：unset/空值均报错退出，强制环境变量注入。
      # 详见 SECURITY.md 开发侧约定 + .env.example 可观测性栈段。
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD 未设置——见 SECURITY.md 开发侧约定（本地开发自设强口令，生产必须环境变量注入）}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-clickhouse-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      # 5.31.13 修复：同 prometheus，挂载源 ./infra/ → ./config/infra/（目录已存在且 git 跟踪）
      - ./config/infra/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/infra/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    deploy:
      # 5.43.1 修复：Grafana 仪表板轻量，限制 0.5 CPU / 512m
      resources:
        limits:
          cpus: '0.5'
          memory: 512m
    restart: unless-stopped
    networks:
      - zephyr-net
    depends_on:
      - prometheus

  # ── Node Exporter（宿主机指标）──
  node-exporter:
    image: prom/node-exporter:v1.8.1
    container_name: zephyr-node-exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    deploy:
      # 5.43.1 修复：node-exporter 仅采集指标，极轻量，限制 0.5 CPU / 256m
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    restart: unless-stopped
    networks:
      - zephyr-net

networks:
  zephyr-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
