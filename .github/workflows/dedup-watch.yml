name: Dedup Watch

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly Monday 6AM UTC
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install pydantic pytest pyyaml
      - name: Run drift watch
        run: python -c "from zephyr.l01_infrastructure.code_dedup_engine.temporal_drift_tracker import TemporalDriftTracker; t = TemporalDriftTracker(); print(t.watch())"
