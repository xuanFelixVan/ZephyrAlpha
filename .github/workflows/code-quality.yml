# AI-generated: Python 代码质量门禁（ruff + mypy + pytest，与 Batch A 钩子互补）
name: Code quality

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/hooks/**'
      - 'scripts/governance/**'
      - 'pyproject.toml'
      - '.github/workflows/code-quality.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/hooks/**'
      - 'scripts/governance/**'
      - 'pyproject.toml'
      - '.github/workflows/code-quality.yml'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pyyaml
          pip install -e ".[dev]" || pip install pytest-cov || true

      - name: Ruff (pre-commit hooks + hook support)
        run: ruff check scripts/hooks scripts/governance/hook_support.py

      - name: Mypy (Batch A hook scripts)
        run: |
          mypy scripts/hooks/check_index_links.py \
            scripts/hooks/check_related_documents.py \
            scripts/hooks/check_standards_index_registration.py \
            scripts/hooks/check_body_script_refs.py \
            scripts/hooks/check_tdr_propagation.py \
            scripts/governance/hook_support.py \
            --ignore-missing-imports

      - name: Pytest (unit; 排除已知遗留债务模块)
        run: |
          pytest tests/unit \
            --ignore=tests/unit/test_core.py \
            --ignore=tests/unit/test_main.py \
            -v --tb=short
