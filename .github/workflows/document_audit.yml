name: Document Governance Audit

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  weekly-audit:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule

    - name: Run weekly audit
      run: |
        python scripts/ci_audit/weekly_audit_optimized.py

    - name: Upload audit report
      uses: actions/upload-artifact@v4
      with:
        name: weekly-audit-report
        path: docs/09_AUDIT/STATE/weekly_audit_*.json

    - name: Check compliance rate
      run: |
        python scripts/ci_audit/check_compliance_rate.py

  monthly-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule

    - name: Run monthly audit
      run: |
        python scripts/ci_audit/monthly_audit.py

    - name: Upload audit report
      uses: actions/upload-artifact@v4
      with:
        name: monthly-audit-report
        path: docs/09_AUDIT/STATE/monthly_audit_*.json

    - name: Check compliance rate
      run: |
        python scripts/ci_audit/check_compliance_rate.py

  quarterly-audit:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install schedule

    - name: Run quarterly audit
      run: |
        python scripts/ci_audit/quarterly_audit.py

    - name: Upload audit report
      uses: actions/upload-artifact@v4
      with:
        name: quarterly-audit-report
        path: docs/09_AUDIT/STATE/quarterly_audit_*.json

    - name: Check compliance rate
      run: |
        python scripts/ci_audit/check_compliance_rate.py
