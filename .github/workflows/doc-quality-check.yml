name: 文档质量检查

on:
  pull_request:
    branches: [ main, master ]
    paths:
      - 'docs/**/*.md'
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**/*.md'
  schedule:
    # 每周一早上8点执行全量检查（合并自 document_quality_check.yml）
    - cron: '0 8 * * 1'
  workflow_dispatch:

jobs:
  duplicate-detection:
    runs-on: ubuntu-latest
    name: 重复文档检测

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 创建报告目录
      run: mkdir -p reports

    - name: 运行重复文档检测
      id: duplicate_check
      run: |
        python scripts/ci_audit/duplicate_detector.py --dir docs/ --threshold 0.8 --output reports/duplicate_check.json

    - name: 生成重复文档检测报告
      if: always()
      run: |
        python scripts/ci_audit/duplicate_detector.py --dir docs/ --threshold 0.8 --output reports/DUPLICATE_DETECTION_REPORT.md

    - name: 上传检测报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: duplicate-detection-report
        path: reports/

    - name: 发布检测结果
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const reportPath = 'reports/duplicate_check.json';
            if (!fs.existsSync(reportPath)) {
              console.log('报告文件不存在');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const totalIssues = report.summary.total_issues;
            const p0Issues = report.summary.p0_issues;
            const p1Issues = report.summary.p1_issues;
            const p2Issues = report.summary.p2_issues;

            const passed = totalIssues === 0;
            const summary = `重复文档检测结果: ${passed ? '✅ 通过' : '❌ 发现问题'}

            📊 检测结果概览:
            - 总问题数: ${totalIssues}
            - P0级问题: ${p0Issues}
            - P1级问题: ${p1Issues}
            - P2级问题: ${p2Issues}

            📄 检测范围: ${report.scan_info.docs_dir}
            📁 文档总数: ${report.scan_info.total_documents}
            🎯 相似度阈值: ${report.scan_info.threshold}`;

            let details = '';
            if (report.module_id_duplicates && report.module_id_duplicates.length > 0) {
              details += '\n\n### 🔴 module_id重复\n';
              report.module_id_duplicates.slice(0, 3).forEach(dup => {
                details += `- **${dup.module_id}**: ${dup.documents.length}个文档\n`;
              });
            }

            if (report.content_duplicates && report.content_duplicates.length > 0) {
              details += '\n\n### 🔴 内容完全重复\n';
              report.content_duplicates.slice(0, 3).forEach(dup => {
                details += `- 内容哈希 ${dup.content_hash.substring(0, 16)}...: ${dup.documents.length}个文档\n`;
              });
            }

            if (report.similarity_duplicates && report.similarity_duplicates.length > 0) {
              details += '\n\n### 🟡 相似度重复\n';
              report.similarity_duplicates.slice(0, 3).forEach(dup => {
                details += `- 相似度 ${dup.similarity.toFixed(2)}: ${dup.doc1} ↔ ${dup.doc2}\n`;
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 重复文档检测报告\n\n${summary}${details}\n\n完整报告请下载artifact。`
            });

          } catch (error) {
            console.error('处理检测报告时出错:', error);
          }

  link-check:
    runs-on: ubuntu-latest
    name: 链接有效性检查

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 设置Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 安装依赖
      run: |
        pip install requests

    - name: 创建报告目录
      run: mkdir -p reports

    - name: 运行链接有效性检查
      id: link_check
      run: |
        python scripts/ci_audit/link_checker.py --dir docs/ --max-depth 3 --timeout 10 --output reports/link_check.json

    - name: 生成链接检查报告
      if: always()
      run: |
        python scripts/ci_audit/link_checker.py --dir docs/ --max-depth 3 --timeout 10 --output reports/LINK_CHECK_REPORT.md

    - name: 上传检查报告
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: link-check-report
        path: reports/

    - name: 发布检查结果
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          try {
            const reportPath = 'reports/link_check.json';
            if (!fs.existsSync(reportPath)) {
              console.log('报告文件不存在');
              return;
            }

            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));

            const totalIssues = report.summary.total_issues;
            const p0Issues = report.summary.p0_issues;
            const p1Issues = report.summary.p1_issues;
            const p2Issues = report.summary.p2_issues;

            const passed = p0Issues === 0;
            const summary = `链接有效性检查结果: ${passed ? '✅ 通过' : '❌ 发现问题'}

            📊 检查结果概览:
            - 总问题数: ${totalIssues}
            - P0级问题: ${p0Issues} (内部链接失效)
            - P1级问题: ${p1Issues} (外部链接失效/不安全链接)
            - P2级问题: ${p2Issues} (路径层级超限)

            📄 检查范围: ${report.scan_info.docs_dir}
            📁 文档总数: ${report.scan_info.total_documents}
            🎯 最大路径层级: ${report.scan_info.max_depth}`;

            let details = '';
            if (report.broken_internal_links && report.broken_internal_links.length > 0) {
              details += '\n\n### 🔴 内部链接失效\n';
              report.broken_internal_links.slice(0, 5).forEach(link => {
                details += `- [${link.link_text}](${link.link_url}) in ${link.source_file}\n`;
              });
            }

            if (report.broken_external_links && report.broken_external_links.length > 0) {
              details += '\n\n### 🟡 外部链接失效\n';
              report.broken_external_links.slice(0, 5).forEach(link => {
                details += `- [${link.link_text}](${link.link_url}) in ${link.source_file}\n`;
              });
            }

            if (report.depth_violations && report.depth_violations.length > 0) {
              details += '\n\n### 🟢 路径层级超限\n';
              report.depth_violations.slice(0, 5).forEach(link => {
                details += `- [${link.link_text}](${link.link_url}) (${link.depth}层) in ${link.source_file}\n`;
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 链接有效性检查报告\n\n${summary}${details}\n\n完整报告请下载artifact。`
            });

          } catch (error) {
            console.error('处理检查报告时出错:', error);
          }

  quality-summary:
    runs-on: ubuntu-latest
    name: 质量检查汇总
    needs: [duplicate-detection, link-check]
    if: always()

    steps:
    - name: 下载所有报告
      uses: actions/download-artifact@v4

    - name: 生成质量汇总报告
      run: |
        echo "# 文档质量检查汇总报告" > quality_summary.md
        echo "" >> quality_summary.md
        echo "**检查时间**: $(date '+%Y-%m-%d %H:%M:%S')" >> quality_summary.md
        echo "**触发事件**: ${{ github.event_name }}" >> quality_summary.md
        echo "" >> quality_summary.md
        echo "---" >> quality_summary.md
        echo "" >> quality_summary.md
        echo "## 检查结果" >> quality_summary.md
        echo "" >> quality_summary.md
        echo "| 检查项 | 状态 |" >> quality_summary.md
        echo "|--------|------|" >> quality_summary.md
        echo "| 重复文档检测 | ${{ needs.duplicate-detection.result }} |" >> quality_summary.md
        echo "| 链接有效性检查 | ${{ needs.link-check.result }} |" >> quality_summary.md
        echo "" >> quality_summary.md
        echo "---" >> quality_summary.md
        echo "" >> quality_summary.md
        echo "**检查工具**: duplicate_detector.py v1.0.0, link_checker.py v1.0.0" >> quality_summary.md
        cat quality_summary.md

    - name: 上传汇总报告
      uses: actions/upload-artifact@v4
      with:
        name: quality-summary-report
        path: quality_summary.md
