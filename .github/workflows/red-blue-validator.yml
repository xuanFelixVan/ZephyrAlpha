# [BLUEPRINT] MOD-INF-030 | docs/03_modules/_cross_layer/red_blue_validator/blueprint.md | §12 + §16 Phase 3
#
# 治本(2026-08-17, AI-02 审计)——本 workflow 原已全面失效，本次按 CLI 真源修复：
# ① CLI 目标错误：`python -m zephyr.red_blue_validator` 指向 re-export shim 包
#    （无 __main__.py，调用必失败 "package cannot be directly executed"）；
#    真源 CLI = `python -m zephyr.security.adversarial_validation`（cli.py 实证）。
# ② 参数签名全部不存在于真实 CLI：run --tier 1（应为 L1~L7）/--format json；
#    onboard --source-dir（真实为位置参数 module_path）；report --format/--output
#    （真实 report 无此参数，JSON 报告直接取 run 子命令 stdout）；
#    gameday --frequency DAILY --timeout（真实为小写 daily 且无 --timeout）。
# ③ 触发路径 5 个幽灵目录（llm_security/escalation-engine/agent_rbac/circuit_breaker/
#    drift_detector 均不存在于 src/zephyr/）——域重组迁移残留；改指真实目录
#    （security/adversarial_validation + security/llm_defense + security/access_control + gov_drift），
#    并补登实现本体路径 security/adversarial_validation/**。
name: Red-Blue Adversarial Validator

on:
  push:
    branches: [main, master, dev, "phase/*", "sprint/*", "feature/*"]
    paths:
      - "src/zephyr/red_blue_validator/**"
      - "src/zephyr/security/adversarial_validation/**"
      - "src/zephyr/security/llm_defense/**"
      - "src/zephyr/security/access_control/**"
      - "src/zephyr/gov_enforcement/rule_enforcement/**"
      - "src/zephyr/governance/**"
      - "src/zephyr/feedback_loop/gates/**"
      - "src/zephyr/gov_drift/**"
      - ".github/workflows/red-blue-validator.yml"
  pull_request:
    branches: [main, master, dev]
    paths:
      - "src/zephyr/red_blue_validator/**"
      - "src/zephyr/security/adversarial_validation/**"
      - "src/zephyr/security/llm_defense/**"
      - "src/zephyr/security/access_control/**"
      - "src/zephyr/gov_enforcement/rule_enforcement/**"
      - "src/zephyr/governance/**"
      - "src/zephyr/feedback_loop/gates/**"
      - "src/zephyr/gov_drift/**"
      - ".github/workflows/red-blue-validator.yml"
  workflow_dispatch:

jobs:
  adversarial-session:
    name: Red-Blue Adversarial Session
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Cold Start Bootstrap
        run: python -m zephyr.security.adversarial_validation onboard src/zephyr
        continue-on-error: true

      - name: Red-Blue Adversarial Run
        id: adversarial
        # run 子命令 stdout 即 JSON 报告（session_id/total/blocked/bypassed/blocked_rate/duration_ms）；
        # 硬阻断语义：bypassed>0（有攻击穿透防御）→ exit 1，CI 最后防线不失效。
        run: |
          New-Item -ItemType Directory -Force data/red_blue | Out-Null
          $out = python -m zephyr.security.adversarial_validation run --name ci-adversarial --tier L1 --blast-radius FILE
          $out | Out-File -Encoding utf8 data/red_blue/ci_report.json
          $report = $out | ConvertFrom-Json
          Write-Host "total=$($report.total) blocked=$($report.blocked) bypassed=$($report.bypassed) blocked_rate=$($report.blocked_rate)"
          if ($report.bypassed -gt 0) {
            Write-Host "FAIL: $($report.bypassed) 个攻击场景穿透防御（bypassed>0）"
            exit 1
          }
        continue-on-error: false

      - name: Check Convergence
        if: always()
        run: python -m zephyr.security.adversarial_validation status
        continue-on-error: true

      - name: Upload Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-blue-report
          path: data/red_blue/ci_report.json
          retention-days: 30

  game-day:
    name: Game Day Sweep (manual trigger)
    runs-on: windows-latest
    timeout-minutes: 45
    # 原 schedule 触发已移除（违反 RULE-FIFTEEN 禁止时间触发）
    # 现仅支持 workflow_dispatch 手动触发 + CI 批量兜底
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run Game Day
        id: gameday
        run: python -m zephyr.security.adversarial_validation gameday --frequency daily
        continue-on-error: true

      - name: Upload Game Day Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-blue-gameday-report
          path: data/red_blue/gameday_report.json
          retention-days: 7
