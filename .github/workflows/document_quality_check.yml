name: Document Quality Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**/*.md'
  schedule:
    # 每周一早上8点执行
    - cron: '0 8 * * 1'

jobs:
  document-quality-check:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml

    - name: Check document links
      run: |
        python scripts/ci_audit/ci_cd_link_checker.py

    - name: Check YAML metadata
      run: |
        python scripts/ci_audit/yaml_metadata_checker.py

    - name: Check document structure
      run: |
        python scripts/ci_audit/document_structure_checker.py

    - name: Generate quality report
      run: |
        python scripts/ci_audit/generate_quality_report.py

    - name: Upload quality report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: document-quality-report
        path: docs/09_AUDIT/STATE/
        if-no-files-found: ignore

    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'docs/09_AUDIT/STATE/QUALITY_REPORT_LATEST.md';

          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📊 文档质量检查报告\n\n${report}`
            });
          }
