name: Document Quality Check

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'docs/**/*.md'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'docs/**/*.md'
  schedule:
    # 每周一早上8点执行
    - cron: '0 8 * * 1'

jobs:
  document-quality-check:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
    
    - name: Check document links
      run: |
        python scripts/ci_cd_link_checker.py
      continue-on-error: true
    
    - name: Check YAML metadata
      run: |
        python scripts/yaml_metadata_checker.py
      continue-on-error: true
    
    - name: Check document structure
      run: |
        python scripts/document_structure_checker.py
      continue-on-error: true
    
    - name: Generate quality report
      run: |
        python scripts/generate_quality_report.py
    
    - name: Upload quality report
      uses: actions/upload-artifact@v3
      with:
        name: document-quality-report
        path: docs/05_IMPLEMENTATION/04_OPERATIONS/audit_state/QUALITY_REPORT_*.md
    
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const reportPath = 'docs/05_IMPLEMENTATION/04_OPERATIONS/audit_state/QUALITY_REPORT_LATEST.md';
          
          if (fs.existsSync(reportPath)) {
            const report = fs.readFileSync(reportPath, 'utf8');
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## 📊 文档质量检查报告\n\n${report}`
            });
          }
