# AI-generated: CI 治理审计门禁（Sentinel L1 + 与 pre-commit 对齐的脚本路径）
name: Governance audit

on:
  push:
    branches: [main, develop, master]
    paths:
      - 'docs/**'
      - 'scripts/audit/**'
      - 'scripts/governance/**'
      - '.github/workflows/governance-audit.yml'
  pull_request:
    branches: [main, develop, master]
    paths:
      - 'docs/**'
      - 'scripts/audit/**'
      - 'scripts/governance/**'
      - '.github/workflows/governance-audit.yml'
  workflow_dispatch:

jobs:
  sentinel-l1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml

      - name: Sentinel L1 governance scan
        run: python scripts/audit/sentinel_l1_governance_scan.py

      - name: UTF-8 / 编码一致性全量扫描（D-05）
        run: python scripts/hooks/doc_guard_pre_commit.py --scan-encoding

      - name: 文件命名规范全量扫描（C-10）
        run: |
          # 扫描所有 docs/ 下的 .md 文件命名合规性
          # 中文/空格/特殊字符/版本号后缀为阻断项（exit 1）；双轨格式不符仅警告（exit 0）
          find docs/ -name "*.md" | python scripts/hooks/doc_guard_pre_commit.py --check-naming
        continue-on-error: true

      - name: Upload Sentinel L1 JSON artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-l1-json
          path: docs/09_AUDIT/STATE/SENTINEL_L1_SCAN_20260408.json
          if-no-files-found: ignore
