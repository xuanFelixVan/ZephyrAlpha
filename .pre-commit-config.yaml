# A1: 仅注册磁盘上真实存在的入口；文档治理钩子位于 scripts/hooks/，审计辅助位于 scripts/audit/
# 说明：check_metadata_completeness 含硬编码绝对路径且无 --pre-commit 模式，已移除。
# 社区钩子：基础卫生与 YAML 语法，不依赖本仓库脚本。

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--unsafe]
        # 以下为带 Python 风格文档字符串的「伪 YAML」，非标准 YAML 文档
        exclude: ^src/modules/ai_factor_miner/config/ai_factor_miner_config\.yaml$
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict

  - repo: local
    hooks:
      - id: validate-version-metadata
        name: 验证版本元数据（全库阈值）
        entry: python src/utils/validate_version_metadata.py
        language: system
        files: \.md$
        args: [--recursive, --threshold, "80"]
        pass_filenames: false

      - id: check-version-in-filename
        name: 检查文件名中的版本信息
        entry: python src/utils/validate_version_metadata.py
        language: system
        files: \.md$
        args: [--validate-only, --check-filename-only]
        pass_filenames: true

      - id: check-metadata-required-fields
        name: 检查元数据必选字段
        entry: python src/utils/validate_version_metadata.py
        language: system
        files: \.md$
        args: [--validate-only, --check-metadata-only]
        pass_filenames: true

      - id: check-document-placement
        name: 检查根目录杂散文档放置
        entry: python scripts/hooks/check_document_placement.py
        language: system
        files: \.(md|txt|json)$
        pass_filenames: true

      - id: check-index-integrity
        name: 检查索引文件存在性（配置目录列表）
        entry: python scripts/hooks/check_index_integrity.py
        language: system
        files: \.md$
        pass_filenames: false

      - id: doc-guard-pre-commit
        name: 文档缺陷防护 (D-01/D-02/D-05 等)
        entry: python scripts/hooks/doc_guard_pre_commit.py --check staged
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: check-file-naming
        name: 检查文件命名规范 (C-10)
        entry: python scripts/hooks/doc_guard_pre_commit.py --check-naming
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: check-directory-naming
        name: 检查目录命名规范 (D-07)
        entry: python scripts/hooks/check_directory_naming.py --staged
        language: system
        files: ^docs/
        pass_filenames: false

      - id: source-guard
        name: 真源卫兵（双 YAML / module_id / frontmatter）
        entry: python scripts/hooks/source_guard_pre_commit.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: false

      - id: mandatory-inbound-guard
        name: 强制入链守卫（docs 新文件）
        entry: python scripts/audit/mandatory_inbound_guard.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      # ── 红队 A2 专项（Batch A2）────────────────────────────────────
      - id: check-index-links
        name: INDEX.md 相对死链检查（G-02）
        entry: python scripts/hooks/check_index_links.py
        language: system
        files: (^docs/.*/INDEX\.md$)
        pass_filenames: true

      - id: check-related-documents
        name: frontmatter parent/related 路径存在性
        entry: python scripts/hooks/check_related_documents.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: check-standards-index-registration
        name: STANDARDS 新文件须登记 INDEX
        entry: python scripts/hooks/check_standards_index_registration.py
        language: system
        files: ^docs/(09_AUDIT/STANDARDS|01_GOVERNANCE/STANDARDS)/.*\.md$
        pass_filenames: true

      - id: check-body-script-refs
        name: 正文幽灵脚本命令检查
        entry: python scripts/hooks/check_body_script_refs.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: check-tdr-propagation
        name: TDR 变更联动暂存检查
        entry: python scripts/hooks/check_tdr_propagation.py
        language: system
        files: (^docs/02_ARCHITECTURE/TECH_DECISION_RECORDS\.md$|^docs/02_ARCHITECTURE/TECH_DECISION_RECORDS/.*\.md$)
        pass_filenames: false

      - id: check-directory-budget
        name: 目录文件预算门禁（写入守卫）
        entry: python scripts/hooks/check_directory_budget.py
        language: system
        files: ^docs/
        pass_filenames: false
        always_run: true

      - id: governance-health-snapshot
        name: 治理健康度快照（Sentinel L1 阈值）
        entry: python scripts/hooks/pre-commit-governance-check.py
        language: system
        pass_filenames: false
        always_run: true

      - id: validate-blueprint-frontmatter
        name: 蓝图 frontmatter 完整性校验（priority/layer/status）
        entry: python scripts/hooks/validate_blueprint_frontmatter.py
        language: system
        files: ^docs/.*\.md$
        pass_filenames: true

      - id: check-subsystem-registry
        name: 新建子目录须在 subsystem-registry.yaml 中登记
        entry: python scripts/governance/scan_subsystem_duplicates.py --fail-on-ghost
        language: system
        files: ^docs/
        pass_filenames: false
        always_run: false
