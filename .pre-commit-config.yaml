# ZephyrAlpha 2.0 — Pre-commit GATE 门禁配置
# Sprint 0 批次F (F-03): 接入5个核心架构GATE检查
#
# ============================================================================
# Warn-Only → Hard-Block 过渡计划 (Phase A → Phase B)
# ============================================================================
#
# 当前状态 (2026-05-05): 8 个 GATE 处于 warn-only 骨架阶段
# 设计原则: Phase A 骨架阶段先跑数据收集，Phase B 施工阶段转为硬阻断
#
# 过渡触发条件 (每个 GATE 独立评估):
#   a) warn-only 连续 30 天零新增违规 (稳定期)
#   b) 所有存量违规清零或归档为已知问题并记录 Owner
#   c) 对应层的 Phase B 实现代码达到 "functional" 状态
#
# 过渡时间表:
#
#   GATE-12 (蓝图真源准入)      → 目标 2026-Q3 转硬阻断
#     依赖: L02/L03 蓝图全部完成 Provenance 标注
#     当前违规数: 待扫描确认
#
#   GATE-13 (蓝图重叠检测)      → 目标 2026-Q3 转硬阻断
#     依赖: Component Registry 建成
#     当前违规数: 待扫描确认
#
#   GATE-14 (AI权限注册表)      → 目标 2026-Q2 转硬阻断
#     依赖: 权限注册表完成三轮审计
#     当前违规数: 待扫描确认
#
#   GATE-15 (Frontmatter ttl)    → ✅ 已转硬阻断（commit 阶段增量校验 + 全量审计）
#     依赖: ttl_vocabulary.yaml decision_tree 二元判定树
#     当前违规数: 0（5144 files 全量扫描通过，阶段2 回填 4815 文件后归零）
#     全量审计: python scripts/governance/d3_metadata/check_frontmatter_metadata.py --all-files
#
#   GATE-16 (架构合规)          → 目标 2026-Q3 转硬阻断
#     依赖: architecture_contract.yaml 全覆盖验证
#     当前违规数: 待扫描确认
#
#   GATE-IDX (索引-实际同步)    → 目标 2026-Q2 转硬阻断
#     依赖: 所有 index.md 完成自动生成改造
#     当前违规数: 待扫描确认
#
#   GATE-DD07 (_shared API重定义) → 目标 2026-Q2 转硬阻断
#     依赖: 所有 bypass 实例修复完成
#     当前违规数: 待扫描确认
#
#   GATE-22 (AI加载路径完整性)  → 目标 2026-Q3 转硬阻断
#     依赖: AGENTS.md §8.2 路径映射 100% 准确
#     当前违规数: 待扫描确认
#
# 执行: 转硬阻断时只需将 args 中的 --warn-only 改为 --ci
#       例如: args: ["--warn-only"] → args: ["--ci"]
#
# 负责人: Architecture Owner (需在 invariants.yaml 中指定)
# 审查周期: 每两周一次 GATE health review
# ============================================================================
#
# 使用方式:
#   cd
#   pre-commit install
#   pre-commit run --all-files
#
# GATE 脚本路径:
#   scripts/governance/d5_architecture/check_architecture_gates.py

# 安装时同时注册 post-commit / commit-msg（Handoff / Conventional Commits）
#   pre-commit install --hook-type pre-commit --hook-type post-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, post-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "修剪行尾空格（manual—避免pre-commit stash冲突）"
        stages: [manual]
      - id: end-of-file-fixer
        name: "确保文件末尾换行（manual—避免pre-commit stash冲突）"
        stages: [manual]
      - id: check-yaml
        name: "YAML 语法检查"
        args: ["--unsafe"]
      - id: check-json
        name: "JSON 语法检查"
      - id: check-merge-conflict
        name: "检测未解决的合并冲突标记"
      - id: detect-private-key
        name: "检测意外提交的私钥"
        exclude: |
          (?x)^(
              src/zephyr/security/llm_defense/llm_security/patterns/secrets\.py|
              tests/test_fix_safety\.py|
              tests/unit/auto_fix_engine/test_auto_fix_core\.py|
              tests/llm_security/test_secrets\.py|
              tests/test_credential_rotation_trigger\.py
          )$

  - repo: local
    hooks:
      - id: ruff
        name: "Ruff Lint"
        entry: python -m ruff check --no-cache
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: "Ruff Format Check (只检查不修复—避免pre-commit stash冲突)"
        entry: python -m ruff format --check --no-cache
        language: system
        types: [python]
        require_serial: true

  - repo: local
    hooks:
      # ── GATE-01: _index.yaml 可达性检查 ──
      - id: gate-01-index-reachability
        name: "GATE-01: _index.yaml 可达性检查"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        args: ["--gate", "01"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "检查所有 _index.yaml 文件的引用可达性，确保无断链"

      # ── GATE-02: P0 接口契约完整性检查 ──
      - id: gate-02-p0-contract-integrity
        name: "GATE-02: P0 接口契约完整性检查"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        args: ["--gate", "02"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "验证所有 P0 接口契约的字段完整性（schema_version / fields / owner）"

      # ── GATE-03: 不变量 owner 检查 ──
      - id: gate-03-invariant-owner
        name: "GATE-03: 不变量 owner 检查"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        args: ["--gate", "03"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "检查每条不变量是否有且仅有一个 owner 层，防止职责模糊"

      # ── GATE-06: KB 决策记录状态检查 ──
      - id: gate-06-kb-decision-status
        name: "GATE-06: KB 决策记录状态检查"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        args: ["--gate", "06"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "验证所有 KB 决策记录的 status 字段合法（Accepted / Proposed / Superseded / Deprecated）"

      # ── GATE-07: 事件 publisher 层级检查 ──
      - id: gate-07-event-publisher-layer
        name: "GATE-07: 事件 publisher 层级检查"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        args: ["--gate", "07"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "检查每条领域事件的 publisher 层级是否与事件所属域一致"

      # ── GATE-11: 命名规范门禁（Stage G 落地）──
      # 权威依据：docs/01_policies_and_standards/rules/file_naming_standard.md v2.0.1 §五
      # 续号于 Architecture-as-Code GATE-01 ~ GATE-10（避让 AaC 编号空间）
      # 检测 7 条 N-01 ~ N-07 违规：文件名大小写 / 版本号后缀 / 日期后缀 /
      #   KBG 嵌套编号 / KBG kebab 尾缀 / module_id scope 前缀 / KBG 编号一致性
      - id: gate-11-naming-convention
        name: "GATE-11: 命名规范门禁"
        entry: python scripts/governance/d3_metadata/check_naming_convention.py
        args: ["--warn-only"]
        language: system
        pass_filenames: true
        always_run: false
        files: "^.*"
        description: "全库命名规范门禁（kebab-case / module_id namespace / KBG 铁律）。裁定#208 过渡期 --warn-only（N-17/N-06 历史违规不阻断，阶段 E 激活后移除转硬阻断）。多AI并发安全：pass_filenames只检查触发文件，不检查所有staged文件"

      # ── GATE-12: 蓝图真源准入门禁（Wave 0 终审 R73 · V-12）──
      # 权威依据：metadata_registry.md §10.3（provenance 字段格式）
      # 真源声明：rationale-log R73 兜底缺口 V-12 / Claude-Opus-4.7 终审
      # 校验范围：docs/02_enterprise_architecture/target_architecture/ + 04_construction_plans/ + 01_policies_and_standards/
      # 校验内容：frontmatter.provenance 三件套（origin_drafts + audit_chain≥3 + arbitration）+ 物理路径存在性
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-12-blueprint-provenance
        name: "GATE-12: 蓝图真源准入门禁（Wave 0 V-12 骨架）"
        entry: python scripts/governance/d3_metadata/validate_blueprint_provenance.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/(02_enterprise_architecture/target_architecture|04_construction_plans|01_policies_and_standards)/.*\\.md$"
        description: "蓝图真源 Provenance 三件套校验（origin_drafts / audit_chain≥3 / arbitration），骨架阶段 warn-only"

      # ── GATE-14: AI 自治权限注册表自校验（Wave 0 终审 R74 · V-11）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md
      # （governance/ai/ 下为 deprecated 桩，勿作为校验路径）
      # 真源声明：rationale-log R74 兜底缺口 V-11 / T-V2-003
      # 校验范围：ai_autonomy_authority_registry.md（上述 catalogs 路径）中的权限标注
      # 校验内容：三层权限值合法 / 必填字段完整 / 模块无重复 / 章节覆盖率 / Immutable Core 最低数量
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-14-authority-registry
        name: "GATE-14: AI 自治权限注册表自校验（Wave 0 V-11 骨架）"
        entry: python scripts/governance/d5_architecture/validators/validate_authority_registry.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/01_policies_and_standards/_registry/catalogs/ai-autonomy-authority-registry\\.md$"
        description: "权限注册表自校验（三层权限值 / 必填字段 / 重复模块 / 章节覆盖 / Immutable Core 最低数量），骨架阶段 warn-only"

      # ── GATE-13: 蓝图重叠检测门禁（Wave 1 V-14 · T-V2-011）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md §2.11
      # 真源声明：Wave 1 V-14 兜底 / T-V2-011
      # 校验范围：docs/19_development_workspace/drafts-and-audits/ 下草稿的 components 字段
      # 校验内容：同一 component_id 出现在 2+ 草稿时 warn
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-13-blueprint-overlap
        name: "GATE-13: 蓝图重叠检测门禁（Wave 1 V-14 骨架）"
        entry: python scripts/governance/d11_compliance/validate_blueprint_overlap.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/19_development_workspace/drafts-and-audits/.*\\.md$"
        description: "蓝图重叠检测（同一 component_id 出现在多个草稿时 warn），骨架阶段 warn-only"

      # ── G-TRIPLE-ALIGN: 蓝图↔代码↔依赖图三方对齐门禁（防漂移强制执行层）──
      # 权威依据：RULE-TWO 反孤儿 + 防幻觉 #6 漂移检测 + 用户需求"三方必须对齐"
      # 检测范围：蓝图变更或代码变更时触发
      # 检测内容：module_id/属性(stability/safety/ai_autonomy)/文件存在/进度/依赖图条目
      # 模式：硬阻断（ERROR 时 exit(1) 拒绝提交）
      - id: gate-triple-align
        name: "G-TRIPLE-ALIGN: 蓝图↔代码↔依赖图三方对齐门禁"
        entry: python src/zephyr/governance/rule_enforcement/triple_alignment.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^(docs/03_modules/.*blueprint\\.md|src/zephyr/.*\\.py|docs/02_enterprise_architecture/system-dependency-map\\.md|docs/01_policies_and_standards/_registry/catalogs/cross-module-dependency-registry\\.yaml)$"

      # ── GATE-15: Frontmatter ttl 校验（ttl_vocabulary.yaml v2.0.0）──
      # 权威依据：docs/01_policies_and_standards/_registry/vocabularies/ttl_vocabulary.yaml
      # 校验范围：docs/ 下所有 .md 文件（有 frontmatter 的文档）
      # 校验内容：ttl 字段存在 + ttl 值合法（2 种合法值从 ttl_vocabulary.yaml 动态加载）
      # 模式：增量校验（pass_filenames=true，只校验本次 commit 的 .md）；AI 创建无 ttl 文档时 commit 被阻断
      # 全量审计：python scripts/governance/d3_metadata/check_frontmatter_metadata.py --all-files
      # Gateway 等效校验：GitCommitGateway 内置 GATE-15 等效检查（弥补 --no-verify 副作用）
      - id: gate-15-frontmatter-metadata
        name: "GATE-15: Frontmatter ttl 校验（增量）"
        entry: python scripts/governance/d3_metadata/check_frontmatter_metadata.py
        args: ["--ci"]
        language: system
        pass_filenames: true
        always_run: false
        files: "^docs/.*\\.md$"
        description: "Frontmatter ttl（必填+合法值，hard block）+ doc_type（必填+合法值，默认 warn-only）校验，从 ttl_vocabulary.yaml + doc_type_vocabulary.yaml 动态加载。capability: frontmatter_metadata_validation"

      # ── GATE-16: 架构合规校验（architecture_contract.yaml v1.0.0）──
      # 权威依据：docs/01_policies_and_standards/_registry/contracts/architecture_contract.yaml
      # 真源声明：stable D-008/D-011 产出
      # 校验范围：docs/01_policies_and_standards/ 下所有 .md 和 .yaml 文件
      # 校验内容：目录合规 / frontmatter 必填字段 / doc_type↔rule_form 一致性 / governance下无operational_rule / operational下无policy
      # 骨架阶段：--warn-only 模式（只警告不阻塞），待验证稳定后转 --ci 强制
      - id: gate-16-architecture-compliance
        name: "GATE-16: 架构合规校验（architecture-contract v1.0.0）"
        entry: python scripts/governance/d3_metadata/validate_architecture.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/01_policies_and_standards/.*\\.(md|yaml|yml)$"
        description: "架构合规校验（目录合规 / frontmatter必填 / doc_type↔rule_form一致性 / governance无operational_rule / operational无policy），骨架阶段 warn-only"

      # ── GATE-17: 孤儿.py文件检测（AGENTS.md §6.5）──
      # 权威依据：AGENTS.md §6.5（脚本自创入库强制约定）
      # 真源声明：Session 20260502-005 根因审计产出
      # 检测范围：项目根目录（）一级目录下的所有 .py 文件
      # 检测内容：任何出现在根目录的 .py 文件视为违规（.py只能放在 scripts/governance/ / src/zephyr/ / tests/）
      # 模式：--fix 自动删除孤儿文件
      - id: gate-17-orphan-py
        name: "GATE-17: 孤儿.py文件检测（§6.5 根目录零.py）"
        entry: python scripts/governance/d1_structure/detect_orphan_py.py
        args: ["--fix"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^.*\\.py$"
        description: "项目根目录孤儿.py检测+自动清理（AGENTS.md §6.5 — .py只允许在合法三目录中）"

      # ── GATE-ZR: 零残留强制门禁（IRN-011 · ZERO-RESIDUE · §6.19）──
      # 权威依据：IRN-011（ai_behavior_iron_policy.md）9 条零残留规则（ZR-001~009）
      # 真源声明：Session 20260505 零残留原则落地
      # 检测范围：全项目（always_run=true）
      # 检测内容：ZeroResidueScanner 聚合 5 项检测（临时文件/孤儿文件/废墟引用/残留学债/代码级残留）
      # 模式：--ci 硬阻断（零残留违规 = 拒绝提交）
      - id: gate-zr-zero-residue
        name: "GATE-ZR: 零残留强制门禁（IRN-011）"
        entry: python -B -c "from zephyr.governance.rule_enforcement.invariants.zero_residue_check import ZeroResidueScanner; import sys; r=ZeroResidueScanner().scan(); sys.exit(0 if r.is_clean else 1)"
        language: system
        pass_filenames: false
        always_run: false
        files: "\\.(py|yaml|md)$"
        description: "零残留强制门禁——违规即阻断commit。对标IRN-011（ZR-001~009），任何残留物不得入库。多AI并发优化：改为按文件触发，避免always_run卡死"

      # ── GATE-SSOT: SSoT 创建门禁（方案 E：零新真源，复用 [MODULE] 头）──
      # 权威依据：方案 E 裁定（第一性原理推导）+ RULE-FOUR 创建即注册
      # 检测范围：src/zephyr/**/*.py 变更时触发
      # 检测内容：staged 新增 .py 文件的 [MODULE] 头声明的 module_path 与已有文件冲突
      # 模式：硬阻断（exit 1=BLOCK）——发现 module_path 冲突时拒绝提交
      # 双保险：GitCommitGateway.commit() 内嵌 _check_ssot_canonical 是主防线
      #         （GitCommitGateway 用 --no-verify 绕过 pre-commit）
      #         本 hook 拦截不用 GitCommitGateway 而直接 git commit 的场景
      - id: gate-ssot
        name: "GATE-SSOT: SSoT 创建门禁（module_path 冲突检测）"
        entry: python scripts/governance/check_ssot_gate.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^src/zephyr/.*\\.py$"
        stages: [commit]
        description: "SSoT 创建门禁——staged 新增 .py 声明已有 module_path 时硬阻断。真源是 [MODULE] 头，反查通过 capability_lookup 实时扫描磁盘。GitCommitGateway 内嵌门禁是主防线，本 hook 是双保险"

      # ── GATE-18: 测试收集门禁（AGENTS.md §4 源码-测试同步铁律 自动化执行层）──
      # 权威依据：AGENTS.md §4 编码安全 → 源码-测试同步铁律（Source-Test Sync Rule）
      # 真源声明：Session 20260502-006 六环根因分析 → 根源：源码重构未同步测试 → 治根措施
      # 检测范围：src/zephyr/**/*.py 或 tests/**/*.py 变更时触发
      # 检测内容：pytest --collect-only → 零收集失败 = 通过；任何 ImportError / 路径漂移 / 模块缺失 = 阻塞提交
      # 执行频率：always_run=true（源码或测试任一变更即触发）
      # 耗时：~1-2s（仅收集阶段，不执行测试体）
      - id: gate-18-test-collection
        name: "GATE-18: 测试收集门禁（源码-测试同步铁律）"
        entry: python -B -m pytest tests/ --collect-only -q --tb=line -p no:cacheprovider -m "not slow and not e2e"
        language: system
        pass_filenames: false
        always_run: false
        files: "^src/zephyr/.*\\.py$|^tests/.*\\.py$"
