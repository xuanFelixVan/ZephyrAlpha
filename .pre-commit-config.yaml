# ZephyrAlpha 2.0 — Pre-commit GATE 门禁配置
# Sprint 0 批次F (F-03): 接入5个核心架构GATE检查
#
# ============================================================================
# Warn-Only → Hard-Block 过渡计划 (Phase A → Phase B)
# ============================================================================
#
# 当前状态 (2026-05-05): 8 个 GATE 处于 warn-only 骨架阶段
# 设计原则: Phase A 骨架阶段先跑数据收集，Phase B 施工阶段转为硬阻断
#
# 过渡触发条件 (每个 GATE 独立评估):
#   a) warn-only 连续 30 天零新增违规 (稳定期)
#   b) 所有存量违规清零或归档为已知问题并记录 Owner
#   c) 对应层的 Phase B 实现代码达到 "functional" 状态
#
# 过渡时间表:
#
#   GATE-12 (蓝图真源准入)      → 目标 2026-Q3 转硬阻断
#     依赖: L02/L03 蓝图全部完成 Provenance 标注
#     当前违规数: 待扫描确认
#
#   GATE-13 (蓝图重叠检测)      → 目标 2026-Q3 转硬阻断
#     依赖: Component Registry 建成
#     当前违规数: 待扫描确认
#
#   GATE-14 (AI权限注册表)      → 目标 2026-Q2 转硬阻断
#     依赖: 权限注册表完成三轮审计
#     当前违规数: 待扫描确认
#
#   GATE-15 (Frontmatter ttl)    → ✅ 已转硬阻断（commit 阶段增量校验 + 全量审计）
#     依赖: ttl_vocabulary.yaml decision_tree 二元判定树
#     当前违规数: 0（5144 files 全量扫描通过，阶段2 回填 4815 文件后归零）
#     全量审计: python scripts/governance/d3_metadata/check_frontmatter_metadata.py --all-files
#
#   GATE-16 (架构合规)          → 目标 2026-Q3 转硬阻断
#     依赖: architecture_contract.yaml 全覆盖验证
#     当前违规数: 待扫描确认
#
#   GATE-IDX (索引-实际同步)    → 目标 2026-Q2 转硬阻断
#     依赖: 所有 index.md 完成自动生成改造
#     当前违规数: 待扫描确认
#
#   GATE-DD07 (_shared API重定义) → 目标 2026-Q2 转硬阻断
#     依赖: 所有 bypass 实例修复完成
#     当前违规数: 待扫描确认
#
#   GATE-22 (AI加载路径完整性)  → 目标 2026-Q3 转硬阻断
#     依赖: AGENTS.md §8.2 路径映射 100% 准确
#     当前违规数: 待扫描确认
#
# 执行: 转硬阻断时只需将 args 中的 --warn-only 改为 --ci
#       例如: args: ["--warn-only"] → args: ["--ci"]
#
# 负责人: Architecture Owner (需在 invariants.yaml 中指定)
# 审查周期: 每两周一次 GATE health review
# ============================================================================
#
# 使用方式:
#   cd
#   pre-commit install
#   pre-commit run --all-files
#
# GATE 脚本路径:
#   scripts/governance/d5_architecture/check_architecture_gates.py

# 安装时同时注册 post-commit / commit-msg（Handoff / Conventional Commits）
#   pre-commit install --hook-type pre-commit --hook-type post-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, post-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        name: "修剪行尾空格（manual—避免pre-commit stash冲突）"
        stages: [manual]
      - id: end-of-file-fixer
        name: "确保文件末尾换行（manual—避免pre-commit stash冲突）"
        stages: [manual]
      - id: check-yaml
        name: "YAML 语法检查"
        args: ["--unsafe"]
      - id: check-json
        name: "JSON 语法检查"
      - id: check-merge-conflict
        name: "检测未解决的合并冲突标记"
      - id: detect-private-key
        name: "检测意外提交的私钥"
        exclude: |
          (?x)^(
              src/zephyr/security/llm_defense/llm_security/patterns/secrets\.py|
              tests/test_fix_safety\.py|
              tests/fix/test_auto_fix_core\.py|
              tests/llm_security/test_secrets\.py|
              tests/test_credential_rotation_trigger\.py
          )$

  - repo: local
    hooks:
      - id: ruff
        name: "Ruff Lint"
        entry: python -m ruff check --no-cache
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: "Ruff Format Check (只检查不修复—避免pre-commit stash冲突)"
        entry: python -m ruff format --check --no-cache
        language: system
        types: [python]
        require_serial: true

  - repo: local
    hooks:
      # ── GATE-ARCH: 架构门禁合并簇（原 GATE-01/02/03/06/07 五合一）──
      # 合并说明：5 个架构子门禁共用 check_architecture_gates.py，合并为单 hook。
      #           无 --gate 参数时脚本运行全量 17 项架构检查（GATE-01~08/A/D/E/SC/SUM/BS/EXTRA-01~04），
      #           原 5 项（01/02/03/06/07）为子集，检测能力不丢失（实际增强）。
      #           stages: [manual] 保持不变——手动诊断工具，不卡常规 commit。
      - id: gate-arch
        name: "GATE-ARCH: 架构门禁（合并 01/02/03/06/07，全量架构检查）"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "架构门禁合并簇——原 GATE-01/02/03/06/07 五合一，无 --gate 参数运行全量 19 项架构检查（含可达性/契约/不变量/KB状态/事件层级），检测能力增强"

      # ── GATE-NAMING: 命名规范门禁合并簇（原 GATE-11 + GATE-11-SSOT 二合一）──
      # 合并说明：2 个门禁共用 check_naming_convention.py，但 --validate-ssot 是独立模式（提前 exit），
      #           无法在同一进程中组合。使用 run_gate_chain.py 顺序执行两个模式：
      #           ① --warn-only --scan（全库命名规范，过渡期 warn-only）
      #           ② --validate-ssot（N-16 fallback 与 YAML 一致性，硬阻断）
      # 行为变化：原 GATE-11 pass_filenames=true（增量），合并后 --scan 全量扫描。检测增强。
      - id: gate-naming
        name: "GATE-NAMING: 命名规范+SSOT一致性（合并 GATE-11/GATE-11-SSOT）"
        entry: python scripts/governance/run_gate_chain.py scripts/governance/d3_metadata/check_naming_convention.py,--warn-only,--scan scripts/governance/d3_metadata/check_naming_convention.py,--validate-ssot
        language: system
        pass_filenames: false
        always_run: false
        files: "^.*"
        description: "命名规范门禁合并簇——GATE-11（全库命名规范 --warn-only --scan）+ GATE-11-SSOT（N-16 fallback 与 YAML 一致性），run_gate_chain 顺序执行"

      # ── GATE-ID-UNIQ: pre-commit hook id 唯一性门禁 ──
      # 权威依据：commit a09e510ec 历史教训（两个 SSoT 门禁同用 id: gate-ssot，后者覆盖前者）
      # 真源声明：本任务治本——加自动化门禁，防止未来 AI 再造一对重复 id
      # 检测范围：.pre-commit-config.yaml 变更时触发（files 锚定该文件）
      # 检测内容：扫描所有 repos[].hooks[].id，同一 repo 块内重复 → hard block (exit 1)；
      #           跨 repo 块重复 → warn（pre-commit 允许跨 repo 同 id，但本项目视为覆盖风险）
      # 模式：--ci 硬阻断（same-repo 重复 exit 1 拒绝提交）
      - id: gate-id-uniq
        name: "GATE-ID-UNIQ: pre-commit hook id 唯一性"
        entry: python scripts/governance/d5_architecture/checkers/check_precommit_id_uniqueness.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^\\.pre-commit-config\\.yaml$"
        description: "检测 .pre-commit-config.yaml 内 hook id 唯一性，同一 repo 块内重复即阻断（历史教训：gate-ssot src/docs 重复导致覆盖）"

      # ── GATE-INTEGRITY: 规则文件 golden hash 完整性校验（脚本自篡改 C 层兜底）──
      # 治脚本自篡改纵深防御缺口：A 层（GitCommitGateway 内嵌 AST 锚点校验）是主防线
      # （--no-verify 绕不过），C 层（本 hook）是兜底——validate_rules_integrity.py --check
      # 校验受保护文件 golden hash，检测"保留锚点名但篡改内部逻辑"的精细攻击。
      # 覆盖场景：不走 gateway 的裸 git commit（gateway 用 --no-verify，pre-commit 不触发）。
      # 受保护文件清单：RULES_MANIFEST（validate_rules_integrity.py 内声明）
      # 合法修改流程：改受保护文件后先 --register 更新基线，再 commit。
      # 真源：scripts/governance/meta/validate_rules_integrity.py
      - id: gate-rules-integrity
        name: "GATE-INTEGRITY: 规则文件完整性 golden hash 校验（C 层兜底）"
        entry: python scripts/governance/meta/validate_rules_integrity.py
        args: ["--check"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^(AGENTS\\.md|scripts/governance/)"
        description: "C 层兜底：校验 RULES_MANIFEST 受保护文件 golden hash（A 层 gateway AST 锚点为主防线）"

      # ── GATE-DOC-REF 已合并到 GATE-FRONTMATTER（见上 gate-frontmatter）──

      # ── GATE-12: 蓝图真源准入门禁（Wave 0 终审 R73 · V-12）──
      # 权威依据：metadata_registry.md §10.3（provenance 字段格式）
      # 真源声明：rationale-log R73 兜底缺口 V-12 / Claude-Opus-4.7 终审
      # 校验范围：docs/04_construction_plans/ + 01_policies_and_standards/
      # 校验内容：frontmatter.provenance 三件套（origin_drafts + audit_chain≥3 + arbitration）+ 物理路径存在性
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-12-blueprint-provenance
        name: "GATE-12: 蓝图真源准入门禁（Wave 0 V-12 骨架）"
        entry: python scripts/governance/d3_metadata/validate_blueprint_provenance.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/(04_construction_plans|01_policies_and_standards)/.*\\.md$"
        description: "蓝图真源 Provenance 三件套校验（origin_drafts / audit_chain≥3 / arbitration），骨架阶段 warn-only"

      # ── GATE-14: AI 自治权限注册表自校验（Wave 0 终审 R74 · V-11）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md
      # （governance/ai/ 下为 deprecated 桩，勿作为校验路径）
      # 真源声明：rationale-log R74 兜底缺口 V-11 / T-V2-003
      # 校验范围：ai_autonomy_authority_registry.md（上述 catalogs 路径）中的权限标注
      # 校验内容：三层权限值合法 / 必填字段完整 / 模块无重复 / 章节覆盖率 / Immutable Core 最低数量
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-14-authority-registry
        name: "GATE-14: AI 自治权限注册表自校验（Wave 0 V-11 骨架）"
        entry: python scripts/governance/d5_architecture/validators/validate_authority_registry.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/01_policies_and_standards/_registry/catalogs/ai-autonomy-authority-registry\\.md$"
        description: "权限注册表自校验（三层权限值 / 必填字段 / 重复模块 / 章节覆盖 / Immutable Core 最低数量），骨架阶段 warn-only"

      # ── GATE-13: 蓝图重叠检测门禁（Wave 1 V-14 · T-V2-011）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md §2.11
      # 真源声明：Wave 1 V-14 兜底 / T-V2-011
      # 校验范围：docs/19_development_workspace/drafts-and-audits/ 下草稿的 components 字段
      # 校验内容：同一 component_id 出现在 2+ 草稿时 warn
      # 骨架阶段：--warn-only 模式（只警告不阻塞），experimental 转 --ci 强制
      - id: gate-13-blueprint-overlap
        name: "GATE-13: 蓝图重叠检测门禁（Wave 1 V-14 骨架）"
        entry: python scripts/governance/d11_compliance/validate_blueprint_overlap.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/19_development_workspace/drafts-and-audits/.*\\.md$"
        description: "蓝图重叠检测（同一 component_id 出现在多个草稿时 warn），骨架阶段 warn-only"

      # ── G-TRIPLE-ALIGN: 蓝图↔代码↔依赖图三方对齐门禁（防漂移强制执行层）──
      # 权威依据：RULE-TWO 反孤儿 + 防幻觉 #6 漂移检测 + 用户需求"三方必须对齐"
      # 检测范围：蓝图变更或代码变更时触发
      # 检测内容：module_id/属性(stability/safety/ai_autonomy)/文件存在/进度/依赖图条目
      # 模式：硬阻断（ERROR 时 exit(1) 拒绝提交）
      - id: gate-triple-align
        name: "GATE-TRIPLE-ALIGN: 蓝图↔代码↔依赖图三方对齐门禁"
        entry: python src/zephyr/governance/rule_enforcement/triple_alignment.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^(docs/03_modules/.*blueprint\\.md|src/zephyr/.*\\.py)$"

      # ── GATE-FRONTMATTER: 文档前置元数据合并门禁（原 GATE-15 + RULE-FM + SSOT-DOCS + DOC-REF 四合一）──
      # 合并说明：4 个文档 frontmatter/引用门禁合并为单 hook，run_gate_chain 顺序执行：
      #           ① check_frontmatter_metadata.py --ci（ttl+doc_type，无参数全量扫描 docs/+src/+scripts/+tests/）
      #           ② validate_rule_frontmatter.py（规则文件 frontmatter 7 标准字段，自扫 RULES_DIR）
      #           ③ validate_ssot.py --ci（SSoT 唯一真源 P0/P1/P2，自扫 docs/）
      #           ④ audit_broken_links.py --ci --check-new .（断链/幽灵引用，传 . 全项目扫描）
      # 行为变化：原 GATE-15 pass_filenames=true（增量 docs/*.md），合并后 pass_filenames=false 全量扫描（检测增强）。
      # GATE-C1（status 枚举）已删除——脚本 validate_ssot_status.py 已归档（scripts/_archive/），
      #           status 校验由 validate_ssot.py（VALID_DOCUMENT_STATUSES）覆盖，检测能力不丢失。
      - id: gate-frontmatter
        name: "GATE-FRONTMATTER: 文档前置元数据合并门禁（GATE-15/RULE-FM/SSOT-DOCS/DOC-REF 四合一）"
        entry: python scripts/governance/run_gate_chain.py scripts/governance/d3_metadata/check_frontmatter_metadata.py,--ci scripts/governance/d3_metadata/validate_rule_frontmatter.py scripts/governance/d5_architecture/validators/validate_ssot.py,--ci scripts/governance/d2_links/audit_broken_links.py,--ci,--check-new,.
        language: system
        pass_filenames: false
        always_run: false
        files: "^.*\\.(md|csv|yaml|yml|json)$"
        description: "文档前置元数据合并门禁——GATE-15(ttl全量) + RULE-FM(规则frontmatter) + SSOT-DOCS(SSoT) + DOC-REF(断链，传.全项目)，run_gate_chain 顺序执行。GATE-C1 已删除（脚本归档，status 由 validate_ssot.py 覆盖）"

      # ── GATE-VOCAB: 词表门禁合并簇（原 GATE-VOCAB-HARDCODE + GATE-GENERATE 二合一）──
      # 合并说明：2 个词表门禁合并为单 hook，run_gate_chain 顺序执行：
      #           ① check_vocab_hardcode.py --ci（.py 词表合法值硬编码检测）
      #           ② generate_derived_files.py --check（vocabulary YAML → 派生文件一致性）
      # 行为变化：原 GATE-VOCAB-HARDCODE files=src/scripts .py，GATE-GENERATE files=vocabularies .yaml；
      #           合并后 files 覆盖两者，pass_filenames=false，两脚本各自自扫描，检测能力不变。
      - id: gate-vocab
        name: "GATE-VOCAB: 词表门禁合并（GATE-VOCAB-HARDCODE + GATE-GENERATE）"
        entry: python scripts/governance/run_gate_chain.py scripts/governance/d3_metadata/check_vocab_hardcode.py,--ci scripts/governance/d3_metadata/generate_derived_files.py,--check
        language: system
        pass_filenames: false
        always_run: false
        files: "^(src/zephyr/.*\\.py|scripts/.*\\.py|docs/01_policies_and_standards/_registry/vocabularies/.*\\.yaml)$"
        description: "词表门禁合并——GATE-VOCAB-HARDCODE(.py 硬编码检测) + GATE-GENERATE(.yaml 派生文件一致性)，run_gate_chain 顺序执行"

      # ── GATE-16: 架构合规校验（architecture_contract.yaml machine_check 引擎）──
      # 权威依据：docs/01_policies_and_standards/_registry/contracts/architecture_contract.yaml
      # 真源声明：stable D-008/D-011 产出 / P7-FIX 重构为 machine_check 动态执行引擎
      # 校验范围：docs/01_policies_and_standards/ 下所有 .md 和 .yaml 文件
      # 校验内容：VR-008(governance policy→declarative) / VR-009(operational policy→procedural) / VR-011(procedural→verifiability≠inspection)
      #          VR 规则从 architecture_contract.yaml machine_check 字段动态读取，脚本不硬编码 VR 逻辑
      # 模式：--ci 硬阻断（违规 exit 1 拒绝提交）；--warn-only 仅警告不阻断
      - id: gate-16-architecture-compliance
        name: "GATE-16: 架构合规校验（architecture-contract machine_check 引擎）"
        entry: python scripts/governance/d3_metadata/validate_architecture.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/01_policies_and_standards/.*\\.(md|yaml|yml)$"
        description: "架构合规校验——从 architecture_contract.yaml machine_check 动态读取 VR-008/009/011 定义执行（governance policy→declarative / operational policy→procedural / procedural→verifiability≠inspection）"

      # ── GATE-17: 孤儿.py文件检测（AGENTS.md §6.5）──
      # 权威依据：AGENTS.md §6.5（脚本自创入库强制约定）
      # 真源声明：Session 20260502-005 根因审计产出
      # 检测范围：项目根目录（）一级目录下的所有 .py 文件
      # 检测内容：任何出现在根目录的 .py 文件视为违规（.py只能放在 scripts/governance/ / src/zephyr/ / tests/）
      # 模式：--fix 自动删除孤儿文件
      - id: gate-17-orphan-py
        name: "GATE-17: 孤儿.py文件检测（§6.5 根目录零.py）"
        entry: python scripts/governance/d1_structure/detect_orphan_py.py
        args: ["--fix"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^.*\\.py$"
        description: "项目根目录孤儿.py检测+自动清理（AGENTS.md §6.5 — .py只允许在合法三目录中）"

      # ── GATE-NESTED-FLAT-PREFIX: 目录平铺容量+前缀簇合规（GOV-DOC-018 ARCH-043 Risk 2-B）──
      # 权威依据：GOV-DOC-018 文件夹平铺容量阈值协议（T_hard=60/T_soft=120）
      # 真源声明：trae_028_doc_structure_naming.yaml §directory_scalability + thresholds.yaml directory_scalability 节
      # 检测范围：src/zephyr/ 下所有目录（.py 文件变更时触发，全量扫描 SCAN_ROOTS）
