      # 运行：pre-commit run handoff-log-generate --hook-stage manual
      - id: handoff-log-generate
        name: "Handoff: 生成交接日志（manual）"
        entry: python scripts/hooks/auto_handoff_log.py
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]
        description: "根据 git diff HEAD 生成交接 Markdown → docs/19_development_workspace/handoff-logs/"

      - id: handoff-log-post-commit
        name: "Handoff: 提交后交接快照（post-commit）"
        entry: python scripts/hooks/auto_handoff_log.py --last-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]
        description: "每次 git commit 成功后记录 HEAD 变更清单到 handoff-logs/"

      # ── GATE-C1 已删除（脚本 validate_ssot_status.py 已归档至 scripts/_archive/，status 校验由 validate_ssot.py 覆盖）──

      # ── GATE-C2: 契约-代码双写漂移阻断（盲点 C2 修复）──
      # 对标：盲点 C2 — AI 改 YAML 忘 codegen → 契约与代码漂移 → 硬阻断

      # ── GATE-MCP: MCP Tool Contract 一致性校验（mod_inf_013 §9 R3）──
      # 检测 tool_contracts.yaml ↔ 代码 register_tool 声明不一致
      - id: gate-mcp-contract-consistency
        name: "GATE-MCP: Tool Contract 一致性（R3）"
        entry: python scripts/governance/d3_metadata/validate_tool_contracts_consistency.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^(src/zephyr/integration/mcp/tool_contracts\\.yaml|src/zephyr/integration/mcp/.*\\.py)$"
        description: "tool_contracts.yaml ↔ 代码 register_tool 一致性校验（mod_inf_013 §9 R3 契约漂移缓解）"

      # ── GATE-C2: 契约+Schema 合并门禁（原 GATE-C2 + CONTRACT-PHYSICAL-PATH + SCHEMA-HEALTH 三合一）──
      # 合并说明：3 个契约/Schema 门禁合并为单 hook，run_gate_chain 顺序执行：
      #           ① check_contract_code_drift.py --ci（契约-代码双写漂移）
      #           ② check_contract_physical_path.py --ci（physical_path 连字符目录阻断）
      #           ③ verify_schema_health.py --ci（depgraph Schema 健康度）
      # 行为变化：原三 hook 均 pass_filenames=false 自扫描，合并后 files 覆盖三者触发范围，stages: [commit]（ARCH-017 升级，原 manual）。
      - id: gate-c2
        name: "GATE-C2: 契约+Schema 合并门禁（GATE-C2 + CONTRACT-PHYSICAL-PATH + SCHEMA-HEALTH）"
        entry: python scripts/governance/run_gate_chain.py scripts/governance/d5_architecture/checkers/check_contract_code_drift.py,--ci scripts/governance/d5_architecture/checkers/check_contract_physical_path.py,--ci scripts/governance/d11_compliance/verify_schema_health.py,--ci
        language: system
        pass_filenames: false
        always_run: false
        files: "^(architecture_model/contracts/|src/zephyr/shared/contracts/|src/zephyr/governance/depgraph_schema\\.py|scripts/governance/(d8_doc_sync/sync_yaml_to_depgraph|d11_compliance/verify_schema_health)\\.py)$"
        stages: [commit]
        description: "契约+Schema 合并门禁——GATE-C2(契约-代码双写漂移) + CONTRACT-PHYSICAL-PATH(连字符目录) + SCHEMA-HEALTH(depgraph schema)，run_gate_chain 顺序执行，commit 阶段自动触发（ARCH-017 升级）"

      # ── GATE-CONTRACT-PHYSICAL-PATH 已合并到 GATE-C2（见上 gate-c2）──

      # ── GATE-ENCODING: 编码安全+mojibake+BOM检测（合并 GATE-BOM，DM-379 强制执行层）──
      # 权威依据：encoding_safety_standard.md (GOV-DOC-005) + DM-379 根因修复
      # 检测范围：全项目（--dir . 递归扫描，覆盖原 GATE-BOM 的 yaml/md/py 范围）
      # 检测内容：UTF-8 BOM / CRLF / autoGuessEncoding / GBK-as-UTF-8 mojibake
      # 模式：BOM/autoGuessEncoding/mojibake 硬阻断；CRLF 为 WARNING 不阻断（OPS-2026062501 语义修复）
      #       CRLF 应靠 .gitattributes + git add --renormalize 在仓库层解决，不靠每次提交阻断
      # 合并说明：GATE-BOM（validate_no_utf8_bom.py）已并入本 hook——check_encoding.py 的 check_dir_encoding
      #           已含 BOM 检测（INJ-007），--dir . 覆盖全项目，检测范围超集
      - id: gate-encoding-safety
        name: "GATE-ENCODING: 编码安全+mojibake+BOM检测"
        entry: python scripts/governance/d7_code/check_encoding.py
        args: ["--dir", "."]
        language: system
        pass_filenames: false
        always_run: false
        files: "\\.(py|md|yaml|yml|json|toml)$"
        description: "编码安全门禁——BOM/autoGuessEncoding/mojibake硬阻断，CRLF为WARNING不阻断（OPS-2026062501修复）。已合并 GATE-BOM（--dir . 全项目覆盖）"

      # ── GATE-COMMIT-GW: 裸 commit 检测（OPS-2026062513 治本，RB-6 修复 2026-06-29）──
      # 权威依据：OPS-2026062513——多 AI session 共享 git index 导致幽灵提交
      # 检测范围：每次提交时触发（always_run=true）
      # 检测逻辑：hook 运行本身=裸 commit（gateway 用 --no-verify 不触发 hook）→ 阻断；合并提交放行
      # 模式：硬阻断（exit=1），强制所有 commit 走 GitCommitGateway
      # 工作原理：GitCommitGateway 用 --no-verify 绕过本门禁（gateway 路径）；
      #          裸 git commit 触发本门禁 → hook 运行=非 gateway=阻断
      # 红蓝修复：废除 env var 检查（RB-2 持久化漏洞）和 marker 检查（RB-6 伪造绕过）
      - id: gate-commit-gw
        name: "GATE-COMMIT-GW: 裸 commit 检测（OPS-2026062513）"
        entry: python scripts/governance/d11_compliance/validate_commit_gateway.py
        language: system
        pass_filenames: false
        always_run: true
        description: "裸 commit 检测——强制所有 commit 走 GitCommitGateway（串行锁+stash隔离），根治幽灵提交。经 gateway 的 commit 用 --no-verify 绕过本门禁"

      # ── GATE-DRIFT: 漂移检测 LIGHT scan（MOD-INF-023 §1.7 post-commit 自动化）──
      # 权威依据：MOD-INF-023 蓝图 §1.7 典型场景 + §10.4 自动化规格
      # 检测范围：src/zephyr/**/*.py 或 docs/03_modules/**/*.md 变更时触发
      # 检测内容：python -m zephyr.behavioral_auditor scan --level LIGHT
      # 模式：warn-only（骨架阶段，验证稳定后转硬阻断）
      - id: gate-drift-light-scan
        name: "GATE-DRIFT: 漂移检测 LIGHT scan（MOD-INF-023）"
        entry: python -m zephyr.behavioral_auditor scan --level LIGHT
        language: system
        pass_filenames: false
        always_run: false
        files: "^src/zephyr/.*\\.py$"
        description: "漂移检测 LIGHT scan——src/zephyr/ 下 .py 变更时触发，warn-only 骨架阶段"
        stages: [manual]

      - id: sync-audit-protocol-numbers
        name: "AUTO-SYNC: 审计协议数字同步"
        entry: python scripts/governance/generators/sync_audit_protocol_numbers.py
        language: system
        pass_filenames: false
        always_run: true
        files: "(script_manifest\\.yaml|gate-registry\\.yaml|registry-master-index\\.yaml|\\.pre-commit-config\\.yaml)$"
        description: "SSoT 变更时自动同步 audit_protocol.md 中的硬编码数字"
        stages: [manual]

      # ── GATE-NO-TESTS-UNIT: 禁止 tests/unit/ 旧路径重引入（ARCH-029 漂移种子防复发）──
      # 权威依据：AGENTS.md §7 tests/ 目录组织规范——tests/unit/ 已扁平化为 tests/
      # 真源声明：ARCH-029 漂移种子清理——6轮87文件修复后，添加自动化 guard 防止重引入
      # 检测范围：活跃代码和文档（.py/.md/.yaml/.yml）
      # 豁免：_archive/、session_logs/、data/、reports/、历史规则文件(trae_028/034)
      # 模式：硬阻断（检测到 tests/unit/ 即 exit 1 拒绝提交）
      - id: gate-no-tests-unit
        name: "GATE-NO-TESTS-UNIT: 禁止 tests/unit/ 旧路径重引入（ARCH-029 防漂移）"
        entry: "tests/unit/"
        language: pygrep
        files: "\\.(py|md|yaml|yml)$"
        exclude: |
          (?x)^(
              _archive/.*|
              scripts/_archive/.*|
              scripts/.*/_archive/.*|
              session_logs/.*|
              data/.*|
              reports/.*|
              docs/01_policies_and_standards/rules/trae_0(28|34)_.*|
              \.pre-commit-config\.yaml|
              AGENTS\.md
          )$
        description: "ARCH-029 漂移种子防复发——检测活跃代码/文档中 tests/unit/ 旧路径重引入，归档/历史/自动生成数据豁免"

      # ── GATE-DEDUP: 代码重复检测门禁（code_dedup 引擎 pre-commit 入口）──
      # 权威依据：ARCH-027 §3b 管线未接通→三阶段强制接入（阶段1注册 / 阶段2 CI / 阶段3 commit阻断）
      # 真源：scripts/pre_commit/verify_dedup.py → zephyr.governance.code_dedup.cli verify
      # 检测内容：AST 级函数粒度重复检测（incremental/full scan mode）
      # 退出码：0=PASS / 1=WARN / 2=ERROR（pre-commit 非零即阻断）
      # 阶段1（当前）：stages:[manual]——手动 `pre-commit run gate-dedup` 可用，不阻断常规 commit
      # 阶段2（待定）：CI 集成——`pre-commit run gate-dedup --all-files` 加入 CI pipeline
      # 阶段3（待定）：移除 stages:[manual]——commit 时自动阻断高严重度重复
      - id: gate-dedup
        name: "GATE-DEDUP: 代码重复检测（code_dedup 引擎 verify）"
        entry: python scripts/pre_commit/verify_dedup.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^src/zephyr/.*\\.py$"
        stages: [manual]
        description: "代码重复检测门禁——委托 verify_dedup.py -> cli.py verify，AST 级函数粒度重复检测。阶段1：manual 手动运行，不阻断 commit"

      # ── Commit Message 校验（Conventional Commits v1.0.0）──
  # 对标: conventionalcommits.org / Angular convention / pre-commit commit-msg stage
  # 格式: type(scope): description — type ∈ {feat,fix,docs,style,refactor,perf,test,chore,ci,build,revert}
  - repo: local
    hooks:
      - id: commit-msg-conventional
        name: "Conventional Commits"
        entry: python scripts/governance/d11_compliance/validate_commit_message.py
        language: system
        stages: [commit-msg]
        description: "Conventional Commits 格式校验（feat/fix/docs/...），conventionalcommits.org v1.0.0"
