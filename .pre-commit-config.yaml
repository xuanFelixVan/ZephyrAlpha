# ZephyrAlpha 2.0 — Pre-commit GATE 门禁配置
# Sprint 0 批次F (F-03): 接入5个核心架构GATE检查
#
# ============================================================================
# Warn-Only → Hard-Block 过渡计划 (Phase A → Phase B)
# ============================================================================
#
# 历史状态 (2026-05-05): 8 个 GATE 处于 warn-only 骨架阶段
# 设计原则: Phase A 骨架阶段先跑数据收集，Phase B 施工阶段转为硬阻断
#
# 过渡触发条件 (每个 GATE 独立评估):
#   a) warn-only 连续 30 天零新增违规 (稳定期)
#   b) 所有存量违规清零或归档为已知问题并记录 Owner
#   c) 对应层的 Phase B 实现代码达到 "functional" 状态
#
# 过渡时间表（2026-08-17 AI-01 审计对齐——以各 hook args 现状为准）:
#
#   GATE-12 (蓝图真源准入)      → ✅ 已转硬阻断（args --ci；脚本 __manifest__ warn_only:false，不解析 argv，恒硬阻断）
#   GATE-13 (蓝图重叠检测)      → ✅ 已转硬阻断（args --ci）
#   GATE-14 (AI权限注册表)      → ✅ 已转硬阻断（args --ci）
#   GATE-15 (Frontmatter ttl)   → ✅ 已转硬阻断（commit 阶段增量校验 + 全量审计）
#     依赖: ttl_vocabulary.yaml decision_tree 二元判定树
#     当前违规数: 0（5144 files 全量扫描通过，阶段2 回填 4815 文件后归零）
#     全量审计: python scripts/governance/d3_metadata/check_frontmatter_metadata.py --all-files
#   GATE-16 (架构合规)          → ✅ 已转硬阻断（args --ci）
#   GATE-IDX (索引-实际同步)    → ✅ 已合并进 gate-reg-bl（validate_index_reality.py --ci 硬阻断）
#   GATE-DD07 (_shared API重定义) → ✅ 已合并进 gate-script-q（fix_shared_bypass.py --ci 硬阻断）
#   GATE-22 (AI加载路径完整性)  → 仍 warn-only 骨架（§8.2 路径映射待补建，当前 SKIP）
#
# 当前仍 warn-only 的 hook（观察期，存量清零后转 --ci）:
#   gate-silent-degradation / gate-node-label-quality / gate-algo-quality /
#   gate-nested-flat-prefix / gate-drift-light-scan(manual) / gate-22 / gate-naming-audit(manual)
#
# 执行: 转硬阻断时只需将 args 中的 --warn-only 改为 --ci
#       例如: args: ["--warn-only"] → args: ["--ci"]
#
# 负责人: Architecture Owner (需在 invariants.yaml 中指定)
# 审查周期: 每两周一次 GATE health review
# ============================================================================
#
# 使用方式:
#   pre-commit install
#   pre-commit run --all-files
#
# GATE 脚本路径:
#   scripts/governance/d5_architecture/checkers/check_architecture_gates.py

# 安装时同时注册 post-commit / commit-msg（Handoff / Conventional Commits）
#   pre-commit install --hook-type pre-commit --hook-type post-commit --hook-type commit-msg
default_install_hook_types: [pre-commit, post-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # ── 替代 external pre-commit-hooks（裁定 #ARCH-PRECOMMIT-OFFLINE-001）──
      # 原 6 个 external hook 能力已被 local hook 等价覆盖：
      #   trailing-whitespace / end-of-file-fixer：ruff format 替代
      #   check-yaml / check-json：gate-encoding-safety + gate-frontmatter 覆盖
      #   check-merge-conflict：→ check_merge_conflict.py（local 纯 stdlib）
      #   detect-private-key：→ detect_private_key.py（local 纯 stdlib）
      - id: check-merge-conflict-marker
        name: "检测未解决的合并冲突标记（local 替代 external #ARCH-PRECOMMIT-OFFLINE-001）"
        entry: python scripts/governance/d7_code/check_merge_conflict.py
        language: system
        pass_filenames: false
        always_run: false
        description: "纯 stdlib 检测 staged 文件中 <<<<<<< / ======= / >>>>>>> 合并冲突标记，替代 external pre-commit-hooks check-merge-conflict"
      - id: detect-private-key-local
        name: "检测意外提交的私钥（local 替代 external #ARCH-PRECOMMIT-OFFLINE-001）"
        entry: python scripts/governance/d7_code/detect_private_key.py
        language: system
        pass_filenames: false
        always_run: false
        description: "纯 stdlib 检测 staged 文件中 PEM/SSH/PGP 私钥标记，替代 external pre-commit-hooks detect-private-key"
      # ── PROTECTED-PATHS: 受保护路径写入检测（#ARCH-MODEL-LIFECYCLE-001 P1 双层防护 Layer 2）──
      # 治本：check_protected_paths.py 原为手动工具，无自动触发源。100% AI 开发场景下
      # 并发会话曾副作用回退 .gitignore/.gitattributes 排除规则（27 包误忽略）。
      # 双层防护：Layer 1 (in-process gate PROTECTED-PATHS, priority=28) 走 GitCommitGateway
      # 拦截（--no-verify 绕不过）；Layer 2 (本 hook) 走 git commit 拦截（--no-verify 可绕过）。
      # 逃生通道：ZEPHYR_PROTECTED_PATHS_BYPASS=1 env（紧急，落 stderr 审计）。
      # 审批标记逃生通道 [ARCH-APPROVAL:ISSUE_ID] 在 Layer 1 (in-process gate) 实现，
      # 因为 pre-commit hook 不能访问 commit message（commit-msg hook 才可以）。
      - id: gate-protected-paths
        name: "GATE-PROTECTED-PATHS: 受保护路径写入检测（#ARCH-MODEL-LIFECYCLE-001 P1 Layer 2）"
        entry: python scripts/governance/d6_security/check_protected_paths.py --staged
        language: system
        pass_filenames: false
        always_run: false
        description: "检测 staged 文件是否含受保护路径（.gitignore/.gitattributes/AGENTS.md 等），双层防护 Layer 2（Layer 1 为 in-process gate PROTECTED-PATHS）"

      # ── d6_security 三 hook 接入（65 号 §7.13，2026-08-14 AI-GIT-001）──
      # 三层闭环：规则层 RULE-GIT-SAFE + 静态检测 pre-commit（本层）+ 运行时 wrapper。
      # 脚本早已存在但从未注册——静态检测层此前实际缺失。
      - id: gate-detect-git-dangerous
        name: "检测危险 git 命令（65 号 §7.13，ABS-26/27/28）"
        entry: python scripts/governance/d6_security/detect_git_dangerous.py
        language: system
        pass_filenames: true
        always_run: true
        description: "检测代码/文档中的危险 git 命令（clean -fd/reset --hard/checkout -- 等）"
      - id: gate-detect-shell-dangerous
        name: "检测危险 shell 命令（65 号 §7.13，ABS-38/39）"
        entry: python scripts/governance/d6_security/detect_shell_dangerous.py
        language: system
        pass_filenames: true
        always_run: true
        description: "检测代码中的危险 shell 命令（Remove-Item -Recurse -Force/rm -rf 等）"
      - id: gate-detect-permanent-deletion
        name: "检测 ttl:permanent 文件删除（65 号 §7.13，PS-STD-012 V1）"
        entry: python scripts/governance/d6_security/detect_permanent_file_deletion.py
        language: system
        pass_filenames: true
        stages: [pre-commit]
        description: "检测 ttl:permanent 元数据文件被删除"

      # ── GATE-WORKTREE-REQUIRED: 主工作区 commit 渐进式软门禁（#ARCH-GIT-SELF-HARM-GUARD L3.1，2026-08-04）──
      # 治本：AGENTS.md RULE-WORKTREE 君子协定升级为软门禁。主工作区 commit warn+计数
      # （.runtime/gate_audit/worktree_skip.jsonl），单 session 累计>=5次升级阻断。
      # worktree 内 / reconciler auto-commit / 合并提交放行。
      # 双层防护：Layer 1 = in-process gate WORKTREE-REQUIRED（priority=44，GitCommitGateway 路径）；
      #          Layer 2 = 本 hook（裸 git commit 路径）。GitCommitGateway 用 --no-verify 绕过本 hook，
      #          故 gateway 路径的 worktree 检查由 Layer 1 in-process gate 负责。
      - id: gate-worktree-required
        name: "GATE-WORKTREE-REQUIRED: 主工作区 commit 渐进式软门禁（#ARCH-GIT-SELF-HARM-GUARD L3.1）"
        entry: python scripts/governance/d11_compliance/validate_worktree_required.py
        language: system
        pass_filenames: false
        always_run: false
        description: "检测 commit 是否在 session worktree 内——主工作区 commit warn+计数，累计>=5次升级阻断（Layer 2 pre-commit；Layer 1 in-process gate WORKTREE-REQUIRED 管 gateway 路径）"

      # ── GATE-ALGO-FLOW: 算法地图 ALGO_FLOW 标记门禁（§4.16，2026-08-12 全量落地后转强制）──
      # 目的：防止运营态模块回退/新增缺失 # [ALGO_FLOW] docstring 标记——该标记是算法全景图
      # （08_algorithm_overview）推导流程图的唯一结构化真源。416/416 已补标记，转硬门禁。
      - id: gate-algo-flow-marker
        name: "GATE-ALGO-FLOW: src/zephyr 模块必须含 ALGO_FLOW docstring 标记（§4.16）"
        entry: python scripts/governance/d5_architecture/checkers/check_algo_flow.py
        language: system
        pass_filenames: true
        always_run: false
        description: "检测 staged 的 src/zephyr/**/*.py module docstring 是否含 # [ALGO_FLOW] 标记（算法全景图推导流程图真源），缺失则阻断"

      - id: ruff
        name: "Ruff Lint"
        entry: python -m ruff check --no-cache
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: "Ruff Format Check (只检查不修复—避免pre-commit stash冲突)"
        entry: python -m ruff format --check --no-cache
        language: system
        types: [python]
        require_serial: true

  - repo: local
    hooks:
      # ── GATE-ARCH: 架构门禁合并簇（原 GATE-01/02/03/06/07 五合一）──
      # 合并说明：5 个架构子门禁共用 check_architecture_gates.py，合并为单 hook。
      #           无 --gate 参数时脚本运行全量 17 项架构检查（GATE-01~08/A/D/E/SC/SUM/BS/EXTRA-01~04），
      #           原 5 项（01/02/03/06/07）为子集，检测能力不丢失（实际增强）。
      #           stages: [manual] 保持不变——手动诊断工具，不卡常规 commit。
      - id: gate-arch
        name: "GATE-ARCH: 架构门禁（合并 01/02/03/06/07，全量架构检查）"
        entry: python scripts/governance/d5_architecture/checkers/check_architecture_gates.py
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/02_enterprise_architecture/.*\\.yaml$"
        stages: [manual]
        description: "架构门禁合并簇——原 GATE-01/02/03/06/07 五合一，无 --gate 参数运行全量 19 项架构检查（含可达性/契约/不变量/KB状态/事件层级），检测能力增强"

      # ── GATE-NAMING: 命名增量守门（--check-new，只拦 staged 新增重名 #ARCH-PRECOMMIT-INCREMENTAL）──
      # 治本（2026-08-06，Task 4）：消除"全仓历史违规/未跟踪 WIP 卡死裸 commit"缺陷。
      # 原合并 hook 走 --warn-only --scan 全量扫描，会扫到 367 条历史 warn-only 违规 + 草稿区 WIP，
      # 用无关问题卡住本次 commit。拆为增量守门（本 hook）+ 全仓审计（gate-naming-audit，移 manual）。
      # 增量语义：pre-commit pass_filenames:true 自动传 staged 文件路径 → --check-new
      #   用 git ls-files 基线只检测 staged 新文件是否引入重名（不扫全仓/不扫未跟踪 WIP/不拦历史遗留）。
      # 两路径一致：GitCommitGateway 走 check_new_files_naming（--no-verify 补偿），
      #   pre-commit 走 --check-new，N-16 执行严格度统一（治执行裂缝根因）。
      - id: gate-naming
        name: "GATE-NAMING: 命名增量守门（--check-new，只拦 staged 新增重名 #ARCH-PRECOMMIT-INCREMENTAL）"
        entry: python scripts/governance/d3_metadata/check_naming_convention.py --check-new
        language: system
        pass_filenames: true
        always_run: false
        files: "^(src/.*|tests/.*|scripts/.*|docs/.*)\\.(py|yaml|yml|md|toml)$"
        description: "增量 N-16：只阻断本次 staged 文件引入的新重名（git ls-files 基线）；不扫全仓、不扫未跟踪 WIP、不拦历史遗留。历史 warn-only 违规走 gate-naming-audit（CI/manual）清零"

      # ── GATE-NAMING-AUDIT: 全仓命名审计（--warn-only --scan，不阻断 #ARCH-PRECOMMIT-INCREMENTAL）──
      # 治本（2026-08-06，Task 4）：原 gate-naming 的全仓审计部分移出 pre-commit，仅手动/CI 触发。
      # 含 --validate-ssot（N-16 fallback 与 YAML 双轨一致性，硬阻断）+ --warn-only --scan（全库命名规范）。
      # 367 条历史 warn-only 违规归档为已知技术债，走本 hook 逐步清零，不卡日常 commit。
      - id: gate-naming-audit
        name: "GATE-NAMING-AUDIT: 全仓命名审计+SSOT一致性（不阻断 #ARCH-PRECOMMIT-INCREMENTAL）"
        entry: python scripts/governance/run_gate_chain.py scripts/governance/d3_metadata/check_naming_convention.py,--warn-only,--scan scripts/governance/d3_metadata/check_naming_convention.py,--validate-ssot
        language: system
        pass_filenames: false
        always_run: false
        stages: [manual]
        files: "^.*$"
        description: "全仓命名健康审计（warn-only）+ SSoT 一致性（--validate-ssot 硬阻断）。不卡 commit，走 CI/manual。历史 warn-only 违规在此逐步清零"

      # ── GATE-DOC-NODE-ID: 文档物理ID硬编码门禁（文档引用铁律，2026-08-04）──
      # 防止 blueprint.md/文档硬编码 depgraph 物理 ID（node_id/edge_id）。
      # 物理 ID 是 PG 自增主键，删除重建即变；文档硬编码=死引用温床。
      # 文档只写稳定标识（module_id/blueprint_id/path），需要 ID 时查 depgraph。
      # 二元判定：文档出现 node_id=数字 / edge_id=数字 → 违规 hard block。
      # 背景：8个 blueprint.md 曾硬编码 node_id，DB 节点消失后成死引用（2026-08-04 审查）。
      - id: gate-doc-node-id
        name: "GATE-DOC-NODE-ID: 文档物理ID硬编码检测（文档引用铁律）"
        entry: python scripts/governance/d3_metadata/check_doc_node_id_hardcode.py --ci
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/.*\\.md$"
        description: "检测 docs/ 下 .md 文件硬编码 node_id/edge_id 物理ID（自增易变，文档禁写，查DB获取）"

      # ── GATE-ID-UNIQ: pre-commit hook id 唯一性门禁 ──
      # 权威依据：commit a09e510ec 历史教训（两个 SSoT 门禁同用 id: gate-ssot，后者覆盖前者）
      # 真源声明：本任务治本——加自动化门禁，防止未来 AI 再造一对重复 id
      # 检测范围：.pre-commit-config.yaml 变更时触发（files 锚定该文件）
      # 检测内容：扫描所有 repos[].hooks[].id，同一 repo 块内重复 → hard block (exit 1)；
      #           跨 repo 块重复 → warn（pre-commit 允许跨 repo 同 id，但本项目视为覆盖风险）
      # 模式：--ci 硬阻断（same-repo 重复 exit 1 拒绝提交）
      - id: gate-id-uniq
        name: "GATE-ID-UNIQ: pre-commit hook id 唯一性"
        entry: python scripts/governance/d5_architecture/checkers/check_precommit_id_uniqueness.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^\\.pre-commit-config\\.yaml$"
        description: "检测 .pre-commit-config.yaml 内 hook id 唯一性，同一 repo 块内重复即阻断（历史教训：gate-ssot src/docs 重复导致覆盖）"

      # ── GATE-INTEGRITY: 规则文件 golden hash 完整性校验（脚本自篡改 C 层兜底）──
      # 治脚本自篡改纵深防御缺口：A 层（GitCommitGateway 内嵌 AST 锚点校验）是主防线
      # （--no-verify 绕不过），C 层（本 hook）是兜底——validate_rules_integrity.py --check
      # 校验受保护文件 golden hash，检测"保留锚点名但篡改内部逻辑"的精细攻击。
      # 覆盖场景：不走 gateway 的裸 git commit（gateway 用 --no-verify，pre-commit 不触发）。
      # 受保护文件清单：RULES_MANIFEST（validate_rules_integrity.py 内声明）
      # 合法修改流程：改受保护文件后先 --register 更新基线，再 commit。
      # 真源：scripts/governance/meta/validate_rules_integrity.py
      - id: gate-rules-integrity
        name: "GATE-INTEGRITY: 规则文件完整性 golden hash 校验（C 层兜底）"
        entry: python scripts/governance/meta/validate_rules_integrity.py
        args: ["--check"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^(AGENTS\\.md|scripts/governance/)"
        description: "C 层兜底：校验 RULES_MANIFEST 受保护文件 golden hash（A 层 gateway AST 锚点为主防线）"

      # ── GATE-DOC-REF 已合并到 GATE-FRONTMATTER（见上 gate-frontmatter）──

      # ── GATE-12: 蓝图真源准入门禁（Wave 0 终审 R73 · V-12）──
      # 权威依据：metadata_registry.md §10.3（provenance 字段格式）+ 文档引用铁律（2026-08-04）
      # 真源声明：rationale-log R73 兜底缺口 V-12 / Claude-Opus-4.7 终审
      # 校验范围：docs/03_modules/**/blueprint.md + docs/04_construction_plans/ + 01_policies_and_standards/
      # 校验内容：① frontmatter.provenance 三件套（origin_drafts + audit_chain≥3 + arbitration）
      #           ② node_id/edge_id 硬编码 lint 已移至 GATE-DOC-NODE-ID（check_doc_node_id_hardcode.py，SSoT 治本 2026-08-04）
      # 模式：--ci 硬阻断（已于 Phase B 转正；脚本不解析 argv，__manifest__ warn_only:false 恒硬阻断）
      - id: gate-12-blueprint-provenance
        name: "GATE-12: 蓝图真源准入门禁（Wave 0 V-12）"
        entry: python scripts/governance/d3_metadata/validate_blueprint_provenance.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/(03_modules/.*blueprint\\.md|04_construction_plans/.*\\.md|01_policies_and_standards/.*\\.md)$"
        description: "蓝图真源 Provenance 三件套校验（node_id/edge_id 硬编码 lint 已移至 GATE-DOC-NODE-ID）"

      # ── GATE-14: AI 自治权限注册表自校验（Wave 0 终审 R74 · V-11）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md
      # （governance/ai/ 下为 deprecated 桩，勿作为校验路径）
      # 真源声明：rationale-log R74 兜底缺口 V-11 / T-V2-003
      # 校验范围：ai_autonomy_authority_registry.md（上述 catalogs 路径）中的权限标注
      # 校验内容：三层权限值合法 / 必填字段完整 / 模块无重复 / 章节覆盖率 / Immutable Core 最低数量
      # 模式：--ci 硬阻断（已于 Phase B 转正）
      - id: gate-14-authority-registry
        name: "GATE-14: AI 自治权限注册表自校验（Wave 0 V-11）"
        entry: python scripts/governance/d5_architecture/validators/validate_authority_registry.py
        args: ["--ci"]
        language: system
        pass_filenames: false
        always_run: false
        files: "^docs/01_policies_and_standards/_registry/catalogs/ai-autonomy-authority-registry\\.md$"
        description: "权限注册表自校验（三层权限值 / 必填字段 / 重复模块 / 章节覆盖 / Immutable Core 最低数量），骨架阶段 warn-only"

      # ── GATE-13: 蓝图重叠检测门禁（Wave 1 V-14 · T-V2-011）──
      # 权威依据：docs/01_policies_and_standards/_registry/catalogs/ai_autonomy_authority_registry.md §2.11
      # 真源声明：Wave 1 V-14 兜底 / T-V2-011
