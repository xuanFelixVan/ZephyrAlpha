# Echo Guard configuration — ZephyrAlpha CloneGuard Phase A
# See: https://github.com/echo-guard/echo-guard

# Minimum function size to consider (in lines)
# 2026-08-28 AI-WAVE0-001：3→6 校准——extract 级硬阻断被"琐碎单行访问器族"误报淹没
# （@property/decorator+def+return 3 行模板在 Type-2 重命名口径下全仓 100% 撞车，
# 实证 agent_id/initial_capital/traces/links/core_writer 五 hub 82+ 对全为假阳性），
# 3 行阈值恰等于该模板行数=放行假阳性族；6 行阈值灭族且保留真克隆检测面。
# 既有 dismissed 登记（本文件下方案例）为该族的实例级备案，两轨并行防复发。
min_function_lines: 6

# Maximum function size to consider
max_function_lines: 500

# Languages to analyze — ZephyrAlpha 是纯 Python 项目
languages:
  - python

# Directories to exclude (on top of defaults like .git, node_modules, __pycache__)
exclude_dirs:
  - metadata
  - .runtime
  - .echo-guard
  - .ailocks
  - _diag
  - docs
  - .venv
  - venv
  - site-packages
  - node_modules

# Additional file patterns to exclude
exclude_patterns:
  - "*_test.py"
  - "test_*.py"
  - "*_generated*.py"
  - "conftest.py"

# Output format: rich, json, compact
output_format: rich

# Minimum severity to fail CI: extract, review, none
# extract = 3+副本硬阻断（必须合并）
# review = 2副本警告（尽量精简）
fail_on: extract

# Enable dependency graph for smarter comparison routing
enable_dep_graph: true

# ─── L2 acknowledged 白名单（合理重复登记，severity=acknowledged/skip，不阻断 CI）───
# 格式：{id: "filepath:name:hash8||filepath:name:hash8", verdict, stable_key, note}
# dismissed=标记为非重复（stable 交集抑制整个簇）；intentional=保留两副本（hash 变动重新浮现）
acknowledged:
  # 2026-08-26 AI-CRYPTO-001：_is_merge_commit 与 8 处 "return bool(RE.match(s))" 正则小工具函数
  # AST 结构同构（type1_type2）但语义各殊（merge/todo/cjk/month/malformation/proxy/revision/symbol 等不同正则与职责），
  # 硬合并=过度抽象（项目原则：三相似行优于早抽象）；源头=ruff format 波次统一模板后浮现的存量雷同，非真重复，dismissed 登记
  - id: "scripts/governance/check_commit_message.py:_is_merge_commit:00000000||scripts/governance/d11_compliance/check_test_structure.py:_has_todo_comment:00000000"
    verdict: dismissed
    stable_key: "scripts/governance/check_commit_message.py:_is_merge_commit||scripts/governance/d11_compliance/check_test_structure.py:_has_todo_comment"
    note: "2026-08-26 AI-CRYPTO-001：正则小函数结构同构语义各殊（8 对 hub 均为 _is_merge_commit），合并=过度抽象；存量雷同非真重复"
  # 2026-08-28 AI-WAVE0-001（随 AI-CRYPTO-001 先例）：_concurrency.py agent_id 简单 @property
  # （return self._agent_id 一行）与 N 处琐碎单行属性（__bool__/event_subscribed/callbacks/base_dir/skills_dir 等）
  # extract 级 100% 碰撞——琐碎单行属性模式撞车，语义无关，合并=荒谬；dismissed 登记
  # ⚠ 教训：stable_key 必须与 finding 实际路径分隔符一致（Windows=反斜杠）且两侧按字符串排序（_ 在字母前）
  - id: "scripts\\governance\\meta\\_concurrency.py:agent_id:00000000||scripts\\governance\\meta\\_concurrency.py:__bool__:00000000"
    verdict: dismissed
    stable_key: "scripts\\governance\\meta\\_concurrency.py:__bool__||scripts\\governance\\meta\\_concurrency.py:agent_id"
    note: "2026-08-28：琐碎单行 @property 模式撞车（agent_id vs __bool__），非真重复"
