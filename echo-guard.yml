# Echo Guard configuration — ZephyrAlpha CloneGuard Phase A
# See: https://github.com/echo-guard/echo-guard

# Minimum function size to consider (in lines)
# 2026-08-28 AI-WAVE0-001：3→6 治标——extract 级硬阻断被"琐碎单行访问器族"误报淹没
# （@property+def+docstring+return 3 行模板在 Type-2 重命名口径下全仓 100% 撞车，
# 实证 agent_id/initial_capital/traces/links/core_writer 五 hub 82+ 对全为假阳性）。
# 2026-08-29 AI-GOVFIX-ECHO-001：6→3 回退——引擎级治本已落地：
# src/zephyr/clone_guard/engines/echo_guard_adapter.py 在 _parse_findings 漏斗以
# Python AST 重判"函数体剥 docstring 后 ≤1 条语句=平凡访问器"，两侧皆平凡即剔除
# （根因=echo-guard _is_trivial_function 物理行口径把 docstring 计入函数体，
# 带注释单行访问器逃逸平凡抑制）。getter/setter/多行 docstring 访问器族与阈值
# 脱钩灭族，min=6 牺牲的 3-5 行真克隆（多语句）检测面恢复。
# 回归锁定：tests/clone_guard/test_echo_guard_adapter.py TestTrivialAccessorFilter。
# 既有 dismissed 登记（本文件下方案例）保留为该族的实例级备案，双轨并行防复发。
min_function_lines: 3

# Maximum function size to consider
max_function_lines: 500

# Languages to analyze — ZephyrAlpha 是纯 Python 项目
languages:
  - python

# Directories to exclude (on top of defaults like .git, node_modules, __pycache__)
exclude_dirs:
  - metadata
  - .runtime
  - .echo-guard
  - .ailocks
  - _diag
  - docs
  - .venv
  - venv
  - site-packages
  - node_modules

# Additional file patterns to exclude
exclude_patterns:
  - "*_test.py"
  - "test_*.py"
  - "*_generated*.py"
  - "conftest.py"

# Output format: rich, json, compact
output_format: rich

# Minimum severity to fail CI: extract, review, none
# extract = 3+副本硬阻断（必须合并）
# review = 2副本警告（尽量精简）
fail_on: extract

# Enable dependency graph for smarter comparison routing
enable_dep_graph: true

# ─── L2 acknowledged 白名单（合理重复登记，severity=acknowledged/skip，不阻断 CI）───
# 格式：{id: "filepath:name:hash8||filepath:name:hash8", verdict, stable_key, note}
# dismissed=标记为非重复（stable 交集抑制整个簇）；intentional=保留两副本（hash 变动重新浮现）
acknowledged:
