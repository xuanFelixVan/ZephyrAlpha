  # AST 结构同构（type1_type2）但语义各殊（merge/todo/cjk/month/malformation/proxy/revision/symbol 等不同正则与职责），
  # 硬合并=过度抽象（项目原则：三相似行优于早抽象）；源头=ruff format 波次统一模板后浮现的存量雷同，非真重复，dismissed 登记
