# tier 职能化迁移映射表（Owner 2026-09-09 v0.4 裁定，治理脚本 migrate_tier_to_function_role.py 生成）
# 语义：位置(tier 三值)随链变、职能(function_role 八值)不随链变——9 值混载拆分。
# 幂等：仅 tier 仍为职能值时触发；迁移后位置一律归 上游（输入型环节=L1 主链模板口径），
#       位置语义错挂个案待 Owner 复核（开放问题登记）。
rules:
  "设备->生产设备":   "tier='设备' 且 description 不含 (检测|测量|量测|辅助|清洗|包装|分拣|仓储)"
  "设备->辅助设备":   "tier='设备' 且 description 含 (检测|测量|量测|辅助|清洗|包装|分拣|仓储)"
  "材料->生产原料":   "tier='材料' 且 description 不含 (助剂|添加剂|辅料|辅助)"
  "材料->辅助材料":   "tier='材料' 且 description 含 (助剂|添加剂|辅料|辅助)"
  "原材料->生产原料": "tier='原材料'（直译）"
  "辅材->辅助材料":   "tier='辅材'（直译）"
  "零部件->加工工艺": "tier='零部件' 且 description 含 (加工|组装|装配|焊接|冲压|注塑|铸造|锻造|机加)"
  "零部件->产品业务": "tier='零部件' 其余（零部件=该环节产品本身）"
  "位置归一":         "被迁移行 tier 一律置 上游（设备/材料/零部件/原材料/辅材 均为链内输入型环节）"
engine_tool_switch: "引擎 S6 与 websearch_ingest 校验同 commit 切换（tier 三值+function_role 八值），防漂移"

