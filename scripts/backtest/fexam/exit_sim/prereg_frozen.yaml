  composite: strategy_exam.composite_signal（逐列截面秩 pct，direction 全部为空=long，逐日等权均值）——函数复用禁重造
  weights: strategy_exam.monthly_topn_signals top_n=20 月频等权步进函数——函数复用禁重造
  candidate_filter: 信号日 ATR14 非 NaN 者方可入 top20 候选；不足 20 只=该月空仓（同装置 len<top_n 语义）
  execution: 调仓信号=月首交易日收盘生成；执行=T+1 开盘（execution_lag_days=1 同引擎语义）
  windows:
    run:
    - '2018-01-02'
    - '2026-09-30'
    is:
    - '2018-01-02'
    - '2025-09-30'
    oos_holdout:
    - '2025-10-09'
    - '2026-09-30'
    kline_load:
    - '2017-10-01'
    - '2026-09-30'
    kline_load_note: ATR14 暖机 3 个月；信号/仿真窗仍=RUN，暖机数据不进信号
  stop_rules:
    entry_price: 调仓 T+1 开盘价
    initial_stop: entry_price - 3×ATR14(调仓信号日收盘)
    trailing_stop: 持仓期最高收盘 - 3×ATR14(当日收盘, Chandelier 式逐日更新)
    effective_stop: max(initial_stop, trailing_stop)
    pierce_def: 当日收盘 < effective_stop（严格小于）
    exit_exec: 次日开盘离场（T+1，禁当日来回）；该票开盘缺价（停牌）顺延至下一可用开盘
    reentry: 止损离场名当日禁再买（挂单未平禁买）；再进只能等下次月频调仓
    cash_park: 离场资金现金化（0 收益）至下次月频调仓
    rebalance_reentry_reset: 月频调仓再买=新入场（entry/hi_close/atr_entry 全重置）
    deferred_sell: 调仓卖出遇停牌顺延逐日重试至成交后现金化，顺延期按收盘估值
  atr:
    definition: TR=max(H-L,|H-C_prev|,|L-C_prev|)；ATR14=Wilder 平滑：种子=前14个有效TR的SMA，此后 ATR_t=(13×ATR_{t-1}+TR_t)/14；TR
      缺失（停牌日）ATR 沿用前值
    price_basis: c1_market.kline_daily_hfq 后复权 high/low/close 自算（全程同口径），数据只读
    window: 14
  costs: 佣金双边 COMMISSION_RATE（万0.854，单一真源=matching_logic，与引擎同源）；滑点/冲击/参与率/PIT/剔ST 未建模——对照双臂同口径不受影响，与官方引擎装置差异如实随册
  primary_comparison: 同一模拟器 stop_enabled on/off 双跑（同信号同装置同成本）——判据只看此对照；官方引擎无止损跑仅作 sanity 参考
judge_frozen:
  oos_window: 2025-10-09..2026-09-30
  maxdd_improve_pp: (nostop_oos_maxdd - stop_oos_maxdd)×100（MaxDD 负数口径，改善=朝 0 靠拢）
  verdict_gain: 止损版 OOS MaxDD 改善 >= 5pp 且 (stop_oos_sharpe - nostop_oos_sharpe) >= -0.2 → 「有增益」
  verdict_else: 否则「无增益/负增益」，负结果如实入册
  metrics_tool: strategy_exam.window_metrics（sharpe 年化 244 + 最大回撤，复用禁重造）
recalibration_duty:
  per_run_seconds: time.perf_counter 包住单次完整仿真（24 列票池×RUN 全窗路径依赖日循环）；warm 1 次后实测 3 次取均值，双臂各测，随册落盘
  grid_unit: per_symbol_day_us = per_run_seconds×1e6/(持仓列数×交易日数)，供网格外推
  legacy_ban: 路径依赖日循环禁引用 0.53s/格旧口径（属 c4 GPU 网格引擎 T3a 专用，与本装置无关）
