# 审计脚本统一注册表（SSoT）
# 本文件是 run_all.py 和 status.py 的共享数据真源。
# 新增脚本只需在此注册，两个消费者自动同步。
# 对标：AGENTS.md §6.4 — 单一责任优于分散定义
#
# args 字段说明：
#   - 不再包含 --warn-only（由 run_all.py 运行时动态追加）
#   - 仅声明脚本自身的功能参数（如 --all, --fix, --compare 等）
#   --warn-only 由 run_all.py 根据 CLI 参数统一注入

scripts:
  - name: d3_metadata/validate_architecture.py
    dimensions: [D3, D4, D5]
    priority: P0
    timeout_seconds: 30
    args: []
    warn_only: false
    description: 架构合规校验（frontmatter + 目录放置 + doc_type一致性）

  - name: d3_metadata/check_frontmatter_metadata.py
    dimensions: [D3]
