# MOD-INF-005 §13.4 定期应急演练日程
# 三类演练 × 三种频率（月/季/季）

module_id: MOD-INF-005
generated_at: "2026-05-07T00:00:00Z"
source: "docs/03_modules/infrastructure/script-system/blueprint.md §13.4"
version: "1.0.0"

drills:
  script_failure_drill:
    type: "脚本故障演练"
    description: "模拟某脚本崩溃 → 验证 run_all.py 隔离运行 → 验证紧急绕过日志"
    frequency: monthly
    day_of_month: 1
    steps:
      - "注入一个语法错误的 Python 脚本到 scripts/governance/d7_code/"
      - "运行 run_all.py --warn-only"
      - "验证该脚本被隔离且不影响其他维度"
      - "检查 validate_emergency_bypass_log.py 记录"
      - "清理注入的测试脚本"
    owner: ZephyrAlpha-Owner
    related_scripts:
      - run_all.py
      - meta/validate_emergency_bypass_log.py

  emergency_bypass_drill:
    type: "紧急绕过演练"
    description: "模拟需要 git commit --no-verify 的场景 → 验证 bypass 审计"
    frequency: quarterly
    months: [1, 4, 7, 10]
    day_of_month: 15
    steps:
      - "创建一个带有已知问题的临时文件变更"
      - "执行 git commit --no-verify 绕过 pre_commit"
      - "验证 validate_emergency_bypass_log.py 检测到 bypass"
      - "验证同一原因 ≥2 次 → 产生告警 Finding"
      - "回退变更"
    owner: ZephyrAlpha-Owner
    related_scripts:
      - meta/validate_emergency_bypass_log.py

  recovery_drill:
    type: "恢复演练"
    description: "模拟 Error Budget 耗尽 → Kill Switch 触发 → 从备份恢复"
    frequency: quarterly
    months: [2, 5, 8, 11]
    day_of_month: 15
    steps:
      - "运行 backup_runtime_state.py 生成基线快照"
      - "人工耗尽 Error Budget → 验证 Kill Switch global_freeze 触发"
      - "从快照恢复 SQLite + YAML 状态"
      - "验证 error_budget 恢复到基线"
      - "验证 run_all.py 恢复正常执行"
    owner: ZephyrAlpha-Owner
    related_scripts:
      - meta/backup_runtime_state.py
      - meta/manage_error_budget.py
      - meta/manage_kill_switch.py
