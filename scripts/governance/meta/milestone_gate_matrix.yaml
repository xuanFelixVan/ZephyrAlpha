      - "compute_sla_metrics.py 可计算全部 6 项 SLA/SLO"
      - "red-team-payloads.yaml 包含 ≥ 200+ OWASP LLM01-10 载荷"
      - "dashboard/app.py 可启动 Streamlit (import pass)"
    exit_criteria:
      - "全部 6 项 SLA/SLO 从「待测量」→「已测量」"
      - "status.py --json 输出容量告警维度"
      - "risk_mitigation_matrix.yaml 中 R1-R12 全部有缓解脚本映射"
    fail_consequence: "禁止进入 TRR——扩展覆盖任一项 ❌ = 回退 phase_2_extend"

  TRR:
    name: "Test Readiness Review"
    description: "测试就绪——smoke test + e2e benchmark + 假阴性检测全部通过"
