      - "run_all.py --dry-run 可执行（无 Python 语法错误）"
      - "Finding Schema finding.py 可 import"
    exit_criteria:
      - "run_all.py --dry-run 列出 4+ 维度覆盖"
      - "每个已注册脚本 --warn-only exit 0"
    fail_consequence: "禁止进入 phase_1_core — 停留于 phase_0_setup"

  PDR:
    name: "Preliminary Design Review"
    description: "架构冻结——核心 7 层 + 17 MUST 条款的可自动化检查全部上线"
    trigger_condition: "phase_1_core §3-§7 施工完成"
    gate_level_scripts:
