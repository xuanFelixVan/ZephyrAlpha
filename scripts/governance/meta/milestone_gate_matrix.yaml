      - "d11_compliance/validate_script_quality.py"
      - "d7_code/detect_missing_encoding.py"
      - "meta/validate_script_onboarding.py"
      - "meta/create_task_from_finding.py"
    mandatory_scripts_count: 6
    entry_criteria:
      - "173+ 脚本在 manifest 中已注册"
      - "validate_script_quality.py exit 0 对所有 governance 脚本"
      - "run_all.py --dry-run 显示三条并行依赖链"
    exit_criteria:
      - "全 12 维度至少 1 个验证脚本"
      - "编码铁律违规 ≤ 5 个脚本"
      - "validate_dependency_chain.py exit 0"
    fail_consequence: "禁止进入 phase_2_extend——核心机制硬阻断"

  CDR:
    name: "Critical Design Review"
    description: "设计冻结——200+ Red Team 载荷 + 全 SLA/SLO 指标可测量"
    trigger_condition: "phase_2_extend §8-§15 施工完成"
    gate_level_scripts:
