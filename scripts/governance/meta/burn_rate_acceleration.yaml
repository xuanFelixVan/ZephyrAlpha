  #   - timestamp: "2026-05-05T12:00:00Z"
  #     burn_rate_1h_percent: 0.5
  #     burn_rate_6h_percent: 2.0

acceleration:
  # positive = 正在加速恶化
  current_1h_vs_previous_1h_pct: 0.0
  # 加速告警阈值
  accelerating_threshold: 0.3
  # 是否加速恶化
  is_accelerating: false
