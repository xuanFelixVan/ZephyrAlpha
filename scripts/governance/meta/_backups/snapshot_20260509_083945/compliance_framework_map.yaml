frameworks:
  OWASP_AGENTIC_AI_2026:
    name: "OWASP Agentic AI Top 10 (2026)"
    controls:
      AA-01:
        title: "Excessive Agency — AI权限过大"
        mapped_scripts: [validate_trust_tier.py]
        description: "Trust-Tier 模型限制AI可自主执行的操作范围"
      AA-03:
        title: "Prompt Injection — 提示注入"
        mapped_scripts: [validate_rules_file_backdoor.py, detect_hallucinated_packages.py]
        description: "规则文件不可见字符检测 + 幻觉包防御"
      AA-05:
        title: "Supply Chain — AI供应链"
        mapped_scripts: [validate_rules_integrity.py, validate_script_provenance.py]
        description: "规则文件哈希校验 + Provenance溯源链"
      AA-09:
        title: "Unbounded Consumption — 无限消耗"
        mapped_scripts: [track_script_costs.py]
        description: "AI API调用费用追踪"

  ISO_27001_2022:
    name: "ISO 27001:2022"
    controls:
      A.8.9:
        title: "配置管理"
        mapped_scripts: [validate_threshold_changes.py, validate_rules_integrity.py]
        description: "关键配置变更审计 + 文件完整性保护"
      A.8.16:
        title: "监控活动"
        mapped_scripts: [validate_script_system_health.py, manage_error_budget.py]
        description: "脚本系统健康监控 + Error Budget 实时追踪"
      A.8.25:
        title: "安全开发生命周期"
        mapped_scripts: [detect_script_rot.py, manage_script_retirement.py]
        description: "脚本生命周期管理（过时检测 + 退役流程）"

  SOC2_CC:
    name: "SOC 2 Common Criteria"
    controls:
      CC6.1:
        title: "逻辑和物理访问控制"
        mapped_scripts: [validate_rules_file_backdoor.py, validate_rules_integrity.py]
        description: "规则文件投毒检测+完整性校验"
      CC7.1:
        title: "变更管理"
        mapped_scripts: [validate_threshold_changes.py, manage_shadow_mode.py, manage_script_ab_test.py]
        description: "阈值变更审计+脚本渐进激活+A/B对照"
      CC7.2:
        title: "系统监控"
        mapped_scripts: [validate_script_system_health.py, manage_error_budget.py, detect_script_rot.py]
        description: "自我健康检查+Error Budget Bum Rate+静默失效检测"

  ITIL5:
    name: "ITIL 5 — AI-Native by Design"
    controls:
      ITIL5-AI-GOV:
        title: "AI 治理扩展模块"
        mapped_scripts: [validate_trust_tier.py, validate_cross_model_consensus.py]
        description: "Trust-Tier T1/T2/T3 分级 + 跨模型共识验证"
      ITIL5-CURATION:
        title: "信息策划 (6C模型 — Curation)"
        mapped_scripts: [manage_finding_timeseries.py, trace_finding_lifecycle.py]
        description: "Finding 时序分析 + C1→C5 全链路追踪"
      ITIL5-CHANGE:
        title: "变更管理"
        mapped_scripts: [manage_kill_switch.py, manage_shadow_mode.py, manage_script_ab_test.py]
        description: "Kill Switch 双层保护 + Shadow Mode 渐进释放"
