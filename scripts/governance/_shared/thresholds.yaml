# ═══════════════════════════════════════════════════════════════════
# 一、扫描与发现相关阈值
# ═══════════════════════════════════════════════════════════════════

module_id: MOD-INF-005
scanning:
  # 全局硬超时（秒）——L 级（10000 脚本）下全量扫描可能需要 60 分钟
  global_hard_timeout_seconds: 3600

  # 各维度类型超时
  timeout:
    file_scan:
      per_dimension_seconds: 30
      full_seconds: 120
    content_analysis:
      per_dimension_seconds: 60
      full_seconds: 240
    knowledge_ai:
      per_dimension_seconds: 120
      full_seconds: 300

  # 增量扫描触发阈值（变更文件数超过此值 → 建议全量扫描）
  incremental_threshold_files: 50

  # ScanCache LRU 缓存容量——1500 模块下文件数可能超过 50,000
  scan_cache_max_entries: 10000

  # depgraph 幽灵节点告警阈值（removed 节点数超过此值 → WARNING 级别告警）
  # 与 reconciliation_registry.py _GHOST_AUTO_CLEAN_THRESHOLD 对齐
  # 治本 M01 #5：从 generate_project_depgraph.py 硬编码外置到此（2026-07-17）
  depgraph_ghost_warning: 50

# ═══════════════════════════════════════════════════════════════════
# 二、Finding 质量相关阈值
# ═══════════════════════════════════════════════════════════════════

finding_quality:
  # 假阳性率上限（超过 → Error Budget 消耗）
  false_positive_rate_max: 0.05

  # 假阴性检测——已知坏用例的通过率要求
  false_negative_detection_rate_min: 0.90

  # Finding 置信度最低要求（低于此值的 Finding 标记为 LOW）
  min_confidence_threshold: 0.5

  # 单次扫描最大 Finding 数（超过 → 降级为 FULL → WARN-ONLY）
  # 1500 模块 × 5.25 脚本/蓝图 × 平均 0.5 Finding/脚本 ≈ 3,937 → 取 5000
  max_findings_per_scan: 5000

# ═══════════════════════════════════════════════════════════════════
# 三、Error Budget 相关阈值（对标 Google SRE）
# ═══════════════════════════════════════════════════════════════════

error_budget:
  # 系统可用性 SLO
  availability_slo: 0.99

  # Finding 准确率 SLO（1 - 假阳性率上限）
  accuracy_slo: 0.95

  # Error Budget 消耗速率告警
  burn_rate:
    # 1小时窗口内消耗 2% → 告警
    critical_1h_percent: 0.02
    # 6小时窗口内消耗 5% → 警告
    warning_6h_percent: 0.05

  # Error Budget 耗尽后的 Feature Freeze
  feature_freeze_on_exhausted: true
  freeze_auto_lift_after_hours: 72

# ═══════════════════════════════════════════════════════════════════
# 四、SLA 定时器相关阈值
# ═══════════════════════════════════════════════════════════════════

sla_timers:
  # Finding 严重度 → 最大修复时间（小时）
  fix_deadline_hours:
    CRITICAL: 24
    HIGH: 168
    MEDIUM: 720
    LOW: null
    INFO: null

  # 超时未修复 → 自动升级（小时）
  overdue_escalation:
    CRITICAL: 48
    HIGH: 336
    MEDIUM: 1440

  # PERSISTENT Finding（连续存在超过 N 天）→ 升级严重度
  persistent_upgrade_days:
    MEDIUM_to_HIGH: 30
    HIGH_to_CRITICAL: 60

# ═══════════════════════════════════════════════════════════════════
# 五、Shadow Mode 渐进激活阈值
# ═══════════════════════════════════════════════════════════════════

shadow_mode:
  # 各阶段持续天数
  phase_days:
    phase1_shadow: 7
    phase2_warn: 7
    phase3_active: 0

  # 假阳性率超过此值 → 自动回退到 Phase 1
  auto_rollback_fpr_threshold: 0.20

  # Shadow 期间最大允许误报数
  max_false_positives_before_rollback: 50

# ═══════════════════════════════════════════════════════════════════
# 六、脚本健康与安全阈值
# ═══════════════════════════════════════════════════════════════════

script_health:
  # 脚本连续失败次数 → Quarantine
  consecutive_failures_before_quarantine: 3

  # 脚本单次执行超时（秒）——超过此值即使 manifest 声明更长也 kill
  hard_kill_timeout_seconds: 900

  # 磁盘空间最低要求（MB）
  min_disk_space_mb: 100

  # 内存最低要求（MB）
  min_memory_mb: 256

# ═══════════════════════════════════════════════════════════════════
# 七、AST 相似度 / 查重阈值
# ═══════════════════════════════════════════════════════════════════

ast_similarity:
  # 新脚本与已有脚本的 AST 相似度 → 视为功能重复
  duplicate_threshold: 0.80

  # docstring 覆盖率最低要求
  docstring_coverage_min: 0.60

  # 类型注解覆盖率最低要求
  type_annotation_coverage_min: 0.50

# ═══════════════════════════════════════════════════════════════════
# 八、蓝图-代码同步阈值
# ═══════════════════════════════════════════════════════════════════

blueprint_sync:
  # 蓝图声称的文件数与磁盘实际文件数差异容忍度
  max_file_count_drift: 5

  # 蓝图 §14 路径索引与磁盘一致性检查——不一致 = 阻断
  strict_path_index_check: true

# ═══════════════════════════════════════════════════════════════════
# 九、并发与分布式执行阈值（对标 §35 分布式执行架构）
# ═══════════════════════════════════════════════════════════════════

concurrency:
  # ── 规模-架构映射（对齐蓝图 §8.4）──
  # S: ≤500 脚本 / ≤8 Worker   → 单机单进程
  # M: 500~2000 脚本 / 8~20 Worker → 单机多进程
  # L: 2000~10000 脚本 / 20~100 Worker → 分布式

  # ── Bulkhead 四池配置 ──
  pool:
    quick:
      max_workers: 12
      description: "快速文件扫描——D1/D2/D4"
    content_analysis:
      max_workers: 8
      description: "内容分析——D3/D7/D8"
    ai_generated:
      max_workers: 16
      description: "AI 生成检测——D5/D6/D9/D12"
    disruptive:
      max_workers: 4
      description: "破坏性操作——D10/D11/Meta"

  # ── 令牌桶限流 ──
  token_bucket:
    refill_rate_per_second: 100.0
    burst_size: 200

  # ── 准入控制 ──
  admission:
    p0_concurrency_limit: 50
    p1_concurrency_limit: 30
    p2_concurrency_limit: 20

  # ── 锁超时 ──
  lock:
    l0_global_timeout_seconds: 300
    l1_dimension_timeout_seconds: 60
    l2_file_timeout_seconds: 30

  # ── ShardRouter ──
  shard:
    count: 16
    description: "1500 模块 / 16 分片 ≈ 94 模块/分片"

  # ── Worker 生命周期（§35.2）──
  worker:
    heartbeat_interval_seconds: 10
    heartbeat_timeout_count: 3
    graceful_shutdown_timeout_seconds: 30
    max_concurrent_per_worker: 8

  # ── 进程压力阈值 ──
  pressure:
    process_warning_count: 150
    process_critical_count: 300
    process_emergency_count: 500

# ═══════════════════════════════════════════════════════════════════
# 十、目录容量可扩展性阈值（对标 GOV-DOC-018）
# ═══════════════════════════════════════════════════════════════════

directory_scalability:
  # 无稳定命名前缀规则：T_hard=60（AI纯记忆可靠扫描上限）
  # 有稳定命名前缀规则：T_soft=120（工具辅助定位可靠上限）
  # 对标 GOV-DOC-018 §gov_doc_018_folder_capacity_threshold
  # audit_directory_scalability.py + validate_nested_flat_dirs.py 从此节读取 warn/error 阈值
  src_py_warn: 60
  src_py_error: 120
  # docs .md 直接文件数（文档目录天然较小，阈值更严）
  docs_md_warn: 5
  docs_md_error: 20
  # 目录直接子项总数（含文件+子目录，防止单目录膨胀）
  dir_children_warn: 100
  dir_children_error: 500
