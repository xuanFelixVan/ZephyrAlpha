# summary: >
#   脚本系统所有可调节阈值的唯一真源（SSoT）。
#   任何脚本不得硬编码阈值——必须从此文件读取。
#   对标 B16（关键阈值外置+变更审计）+ Google SRE Error Budget Policy + OWASP ASVS v5 threshold management。
#   修改此文件 → 自动触发 validate_threshold_changes.py 审计日志。
