# 灾备备份系统配置 v2.0.0 (robocopy + CH incremental, 2026-07-28)
# 消费者映射：
#   code_backup.*  -> backup.ps1 robocopy 代码备份
#   db_dumps.*     -> backup.ps1 robocopy DB dumps
#   ch_backup.*    -> backup.ps1 CH 增量备份决策
#   dump_dir       -> backup.ps1 DB dump 目录
#   trigger.*      -> backup_reconciler.py trigger() + get_state_file()
#
# v2.0.0 变更（2026-07-28）：
#   - restic 替换为 robocopy /MIR（增量覆盖，不累积版本）
#   - CH 全量备份改为增量（base + inc 每日覆盖）
#   - 移除 retention（restic 专属，robocopy 无版本概念）

code_backup:
  source: "D:\\ZephyrAlpha"
  target: "F:\\code_backup"
  exclude_dirs: [".git", "node_modules", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", ".runtime", ".aidrafts", "tmp", ".venv"]
  exclude_files: ["*.pyc", "*.db-wal", "*.db-shm"]

db_dumps:
  source: "D:\\tmp_db_dumps"
  target: "F:\\db_dumps"

ch_backup:
  base_file: "market.zip"       # 全量基线（一次性创建，inc 膨胀时自动重建）
  inc_file: "inc.zip"           # 每日增量（覆盖重写，非累积）
  rebase_threshold: 0.5         # inc >= 50% × base 时自动重建基线

dump_dir: "D:\\tmp_db_dumps"

trigger:
  min_interval_seconds: 28800  # 8小时间隔保护（post-commit 触发用）
  important_prefixes:
    - "src/"
    - "config/"
    - "docs/"
    - "scripts/"
    - "tests/"
    - "architecture_model/"
    - "data/databases/"
    - "data/raw/bdpan/"
    - "data/vector_db/"
  important_files:
    - "AGENTS.md"
    - "pyproject.toml"
    - "docker-compose.yml"
  state_file: "data/databases/backup_state.json"
