# 灾备备份系统配置 v2.1.0 (versioned vault + robocopy + CH incremental, 2026-09-14)
# 消费者映射：
#   code_backup.*  -> backup.ps1 robocopy 兼容字段（source/excludes 生效；target 保留供回滚参考）
#   working_vault.* -> backup.ps1 STAGE 3 版本化代码快照（v2.1 新增）
#   db_dumps.*     -> backup.ps1 robocopy DB dumps
#   ch_backup.*    -> backup.ps1 CH 增量备份决策
#   dump_dir       -> backup.ps1 DB dump 目录
#   trigger.*      -> backup_reconciler.py trigger() + get_state_file()
#
# v2.1.0 变更（2026-09-14，#B1 删除事故防线）：
#   - 代码备份从 robocopy /MIR 单镜像改为按日期目录版本化快照
#     （/MIR 会传播删除：2026-09-14 docs/_working 误删事故实证 /MIR 摧毁最后恢复源）
#   - 硬链接去重：未变更文件与前一日快照共享磁盘块（同卷 F:），空间 ≈1×+每日变更量
#   - 当日内删除不传播进当日快照；保留 14 天自动轮转
#
# v2.0.0 变更（2026-07-28）：
#   - restic 替换为 robocopy /MIR（增量覆盖，不累积版本）
#   - CH 全量备份改为增量（base + inc 每日覆盖）
#   - 移除 retention（restic 专属，robocopy 无版本概念）

code_backup:
  source: "D:\\ZephyrAlpha"
  target: "F:\\code_backup"
  exclude_dirs: [".git", "node_modules", "__pycache__", ".pytest_cache", ".mypy_cache", ".ruff_cache", ".runtime", ".aidrafts", "tmp", ".venv"]
  exclude_files: ["*.pyc", "*.db-wal", "*.db-shm"]

# 版本化代码快照（v2.1）：base\<yyyyMMdd>\，retention 天轮转
# 空间保险（v2.1.1）：盘剩余 < free_floor_gb 时从最老快照逐出（最少保留 min_keep_days 天），
# 仍不足则 fail loud 中止代码快照——retention_days=14 是上限，实际保留随空间自适应收缩
git_bundle:
  base: "G:\\\\backup\\\\git_bundles"   # 2026-09-21 a3 阶段4.4：bundle 总仓随 G；空值回退旧 <vault>\git_bundles 派生

working_vault:
  base: "G:\\backup\\working_vault"   # a3 阶段4.2 切 G（09-21 种子对账 PASS 1,156,584 文件全等；F 旧 vault 留观 7 天）
  retention_days: 14
  free_floor_gb: 60
  min_keep_days: 3

db_dumps:
  source: "D:\\tmp_db_dumps"
  target: "G:\\backup\\db_dumps"   # a3 阶段4.3 切 G
  retention_days: 14   # 版本化滚动（裁定#380⑦/#381：可配置默认 14 天；rotation 闸=CH 备份 ok）
  versioned: true      # 2026-09-20 起 /MIR 覆盖式改日期化快照（backup.ps1 STAGE 3）
  retention_days: 14   # 版本化滚动（裁定#380⑦/#381：可配置默认 14 天；rotation 闸=CH 备份 ok）
  versioned: true      # 2026-09-20 起 /MIR 覆盖式改日期化快照（backup.ps1 STAGE 3）

ch_backup:
  base_file: "market.zip"       # 全量基线（一次性创建，inc 膨胀时自动重建）
  inc_file: "inc.zip"           # 每日增量（覆盖重写，非累积）
  rebase_threshold: 0.5         # inc >= 50% × base 时自动重建基线

dump_dir: "D:\\tmp_db_dumps"

# ---- G 盘兜底镜像（2026-09-20 裁定#380⑥/#381 S4：3-2-1 的 G 侧兜底；backup.ps1 STAGE 3d /MIR 逐条）----
# 首次全量由 st-disk-ch-20260921 通宵班完成（F→G 710G）；此后每日备份成功事件随跑增量。
# G 盘=USB 机械盘（写 70MB/s），只放镜像不放在线链路；源 immutable/版本化，/MIR 风险可控。
g_mirror:
  base: "G:\\\\zephyr_cold"
  # a3 阶段4.6 改址（2026-09-21）：总仓四类改直写 G 后，镜像仅剩冷库+ch_vm_backup（阶段5.2 前）
  targets:
    - id: zephyr_cold
      source: "F:\\\\zephyr_cold"
      target: "G:\\\\zephyr_cold\\\\60_mirror\\\\zephyr_cold_main"
    - id: ch_vm_backup
      source: "F:\\\\ch_vm_backup"
      target: "G:\\\\backup\\\\ch_vm_backup"

trigger:
  min_interval_seconds: 28800  # 8小时间隔保护（post-commit 触发用）
  important_prefixes:
    - "src/"
    - "config/"
    - "docs/"
    - "scripts/"
    - "tests/"
    - "architecture_model/"
    - "data/databases/"
    - "data/raw/bdpan/"
    - "data/vector_db/"
  important_files:
    - "AGENTS.md"
    - "pyproject.toml"
    - "docker-compose.yml"
  state_file: "data/databases/backup_state.json"

# ---- 仓外关键资产镜像备份（2026-09-08 Owner 裁定新增）----
# 消费者: backup.ps1 STAGE 3c（robocopy /MIR 逐条镜像）
# 登记真源: config/asset_inventory.yaml offrepo_assets 中 backup: mirror 的条目
# 目标: F:\offrepo_backup\<id>\ ；/XJ 防 junction 回环；Mode=ch 时跳过
offrepo_backup:
  base: "G:\\backup\\offrepo"   # a3 阶段4.5 切 G（F 旧镜像区留观 7 天）
  targets:
    - id: trae_memory
      source: "C:\\Users\\fanzi\\.trae-cn\\memory"
    - id: qmt_bridge
      source: "E:\\qmt_bridge"
    - id: stash_archive
      source: "D:\\ZephyrAlpha-stash-archive"
    - id: cold_archive
      source: "F:\\\\zephyr_cold\\\\50_archive\\\\by_project\\\\zephyralpha"   # 2026-09-20 迁 F（分包4）
  # 2026-09-14 Owner 裁定：data_download（E:\数据下载）不备份，已从目标移除——
  # 源数据当日 52.66→118.38GB 持续膨胀，/MIR 镜像同量吃掉 F 盘空间（当日 +66GB，
  # 是 F 盘告急头号推手）；F:\offrepo_backup\data_download 旧副本已删（源在 E 盘可随时重镜像）
