# Grafana Dashboard Provisioning — ZephyrAlpha
# Phase B 可观测性基础设施

apiVersion: 1

providers:
  - name: "ZephyrAlpha Dashboards"
    orgId: 1
    folder: "ZephyrAlpha"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: true
