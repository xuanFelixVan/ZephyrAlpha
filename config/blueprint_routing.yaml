# =========================================================================
# §2  关键字兜底映射（无文件模式匹配时）
# =========================================================================

# 当 path_patterns 全部不匹配时，按 task_keywords 模糊匹配
# 匹配算法：取 task_keywords 命中数最多的路由（tie-break: priority）

fallback:
  enabled: true
  strategy: "keyword_count_then_priority"
  min_keyword_hits: 1

# =========================================================================
# §3  Agent 差异化提示（Phase 3 起用）
# =========================================================================
# 根据当前 session 使用的 LLM 模型，加载不同深度的蓝图指引
# GOV-AI-002 决策树 → Agent 能力矩阵 → 本节指定每份蓝图"给 DeepSeek 读全量 / 给 GLM 读架构约束"

agent_hints:
  enabled: false
  activated_in: "Phase_3"
  description: "Phase 3 启用后，不同模型读同一蓝图的不同节选"
