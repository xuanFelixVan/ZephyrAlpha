      - "架构"
      - "跨系统"
      - "integration"
      - "architecture"
      - "overview"
      - "总览"
      - "总蓝图"
      - "master blueprint"
    scope: pre_change
    safety: "L"
    priority: 100
    description: "基础设施层12系统集成总蓝图 — 任何涉及架构/集成/跨系统的问题先查此表"

