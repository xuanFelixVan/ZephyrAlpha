# ZephyrAlpha 2.0 — 蓝图触发路由表（Blueprint Routing Table）
#
# 创建日期   : 2026-05-04
# 关联标准   : PS-STD-005 §7（AI Agent 蓝图定位规则）
# 关联蓝图   : MOD-INF-009（Task Pipeline, §触发式路由表）
# 关联决策   : R90（蓝图三级金字塔架构决策）
# 权限层级   : Human-Gated（路由映射变更 = 关键架构变更）
# 真源声明   : 本文件是蓝图路由分派的 SSoT —— AI Agent 在决定"读哪份蓝图"时 MUST 查询本表
#
# 对标       : Codified Context (arXiv 2602.20478) §3.1.1 Orchestration Protocols
#              — 论文中触发表用于路由 domain-expert agents，
#              — 本表扩展为 route domain documents (blueprints) + agents
#
# 文件模式语法
# ------------
# path_pattern:  glob 模式（相对于项目根）
#                 支持 ** 递归通配，* 单级通配
#                 示例: "src/zephyr/orchestrator/**" → 所有 orchestrator 文件
# task_keywords: Python 列表，关键字匹配（任意一个命中即触发）
#                支持中英文混合
# scope:         pre_change（修改前加载） / post_change（修改后加载） / always
# safety:        L / M / H —— 路由安全等级
# priority:      1-100 —— 并发匹配时取最高优先级（参考 COBIT APO03）

version: "1.0.0"
schema_version: "1.0.0"
doc_type: rule
title: "Blueprint Routing Table"
status: active
ttl: permanent
belongs_to: "MOD-INF-009"

# =========================================================================
# §1  路由映射表
# =========================================================================

routes:

  # ---- Level 1: 域蓝图（先于模块蓝图加载）----
  - route_id: "R001"
    blueprint_id: "MOD-MASTER-001"
    blueprint_level: domain
    path_patterns:
      - "src/zephyr/orchestrator/**"
      - "src/zephyr/tasks/**"
      - "config/trigger_router.yaml"
    task_keywords:
      - "集成"
      - "蓝图"
      - "架构"
      - "跨系统"
      - "integration"
      - "architecture"
      - "overview"
      - "总览"
      - "总蓝图"
      - "master blueprint"
    scope: pre_change
    safety: "L"
    priority: 100
    description: "基础设施层 12 系统集成总蓝图 — 任何涉及架构/集成/跨系统的问题先查此表"

  # ---- Level 2: 模块蓝图 ----

  # -- INF-001 容量保障体系 --
  - route_id: "R002"
    blueprint_id: "MOD-INF-001"
    blueprint_level: module
    path_patterns:
      - "src/zephyr/core/capacity_planner.py"
      - "src/zephyr/core/budget_allocator.py"
      - "src/zephyr/core/throttle.py"
      - "src/zephyr/core/quota_manager.py"
      - "scripts/capacity/**"
    task_keywords:
      - "容量"
      - "预算"
      - "配额"
      - "限流"
      - "capacity"
      - "budget"
      - "throttle"
      - "quota"
      - "rate limit"
      - "token budget"
      - "QPS"
    scope: pre_change
    safety: "M"
    priority: 90
    description: "容量保障体系 — 配额/限流/降级/容量规划"

  # -- INF-002 运行时集成 --
  - route_id: "R003"
    blueprint_id: "MOD-INF-002"
    blueprint_level: module
    path_patterns:
      - "src/zephyr/runtime/**"
      - "src/zephyr/integration/**"
      - "src/zephyr/hooks/**"
      - "src/zephyr/adapters/**"
