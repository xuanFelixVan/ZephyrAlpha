# =============================================================================
# 整装方案配置真源（framework plans，二期整装回测 #BT-PIPELINE-002）
# -----------------------------------------------------------------------------
# [真源] 本文件是「整装方案」配置的唯一真源（规则数据 → YAML，RULE-SSOT）。
#        组合回测器 loader: src/zephyr/pf_core/strategy_engine/framework_composer.py
#        API: GET /api/framework-plans / POST /api/framework-backtest-run
# [语义] 每套方案 = N 个已注册子策略的资金权重比例，合计 100%（容差 1e-6）。
#        整装回测 = 方案权重 α_i × 各子策略日频权重面板 → 线性合成组合面板
#        （system_charter.md §3 约束二「统一框架派：1 框架 × N 子策略 × regime 权重切换」，
#        三期 regime 动态权重联动的数据骨架）。
# [语义·三期] regime_overrides = 方案级 regime 联动覆盖表（α_i(t) 动态化的配置侧）：
#        键 = REGIME_STATES 7 态枚举（唯一真源 src/zephyr/regime/core/regime_detector.py——
#        r1 低波震荡 / r2 中波震荡 / r3 牛市趋势 / r4 熊市阴跌 / r10 CRISIS / r11 RECOVERY /
#        r12 BREAKOUT；判定真源 = MOD-REGIME-001 检测器，本文件只做查表不做判定——
#        禁自造 regime 判定逻辑，宪章 §3 约束三「regime 错=权重错」生死线）。
#        值 = 完整权重覆盖表（成员集合必须与基准 weights 一致，仅权重不同，Σ=1 容差 1e-6）。
#        未列出的 regime → 回退基准 weights；逐日查表语义见 framework_composer.py
#        compose_weight_panels(regime_by_date=...)。覆盖值 AI 代拟，Owner 审核后生效。
# [初值] AI 代拟（commit 前 Owner 审核确认——任务硬约束）。映射自框架状态页演示权重
#        FW_W（web/core/app1.js：主线龙头回踩35/行业轮动25/低估值防御25/打板10/做T5）：
#        主线龙头回踩 → topn-momentum（动量 TopN 选股，主线动量暴露）
#        行业轮动     → multifactor-sleeve（多因子截面选股，轮动暴露）
#        低估值防御   → default-equity（等权基础权益，防御底仓）
#        打板         → daban-sleeve（打板袖策略）
#        做T          → intraday-surge-fall / orderbook-imbalance / vwap-reversion（仅 tick 模式）
#        事件驱动     → eventdriven-sleeve（弹性暴露，依赖情绪事件数据）
# [注意] tick 模式专用成员（做T三策略）在向量化整装回测中被跳过并显式披露
#        （skipped 落 artifact metrics），不做静默再归一化（ablation.py 同款纪律）。
# =============================================================================
