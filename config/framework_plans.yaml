        weight: 0.20
        role: 打板（进攻增强）
      - strategy_id: multifactor-sleeve
        weight: 0.10
        role: 多因子截面
      - strategy_id: eventdriven-sleeve
        weight: 0.10
        role: 事件驱动弹性
      - strategy_id: default-equity
        weight: 0.10
        role: 底仓（压缩）
