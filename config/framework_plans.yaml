owner: ZephyrAlpha-Owner
review_status: approved  # 权重初值 AI 代拟，Owner 2026-09-09 审核确认（本会话裁定）

plans:
  - plan_id: fw-defensive
    name_zh: 防御型整装方案
    risk_profile: defensive
    description: 防御为主——等权底仓 45% 压舱，动量/多因子收缩暴露，打板与做T 低配。
    weights:
      - strategy_id: default-equity
        weight: 0.45
        role: 底仓防御（等权基础权益）
      - strategy_id: topn-momentum
        weight: 0.25
        role: 主线动量（收缩暴露）
      - strategy_id: multifactor-sleeve
        weight: 0.15
        role: 多因子截面
      - strategy_id: eventdriven-sleeve
        weight: 0.05
        role: 事件驱动弹性
      - strategy_id: daban-sleeve
        weight: 0.05
        role: 打板（低配）
      - strategy_id: intraday-surge-fall
        weight: 0.02
        role: 做T（仅 tick 模式）
      - strategy_id: orderbook-imbalance
        weight: 0.015
        role: 做T（仅 tick 模式）
      - strategy_id: vwap-reversion
        weight: 0.015
        role: 做T（仅 tick 模式）

  - plan_id: fw-balanced
    name_zh: 均衡型整装方案
