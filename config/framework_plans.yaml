        weight: 0.25
        role: 行业轮动映射（多因子截面）
      - strategy_id: default-equity
        weight: 0.25
        role: 低估值防御映射（等权底仓）
      - strategy_id: daban-sleeve
        weight: 0.10
        role: 打板
      - strategy_id: intraday-surge-fall
        weight: 0.02
        role: 做T（仅 tick 模式）
      - strategy_id: orderbook-imbalance
        weight: 0.015
        role: 做T（仅 tick 模式）
      - strategy_id: vwap-reversion
        weight: 0.015
        role: 做T（仅 tick 模式）

  - plan_id: fw-aggressive
