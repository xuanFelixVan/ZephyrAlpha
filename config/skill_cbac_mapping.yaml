# ZephyrAlpha 2.0 — Skill → CBAC 能力映射表
#
# 功能：将 Agent Spec 的 Skill 系统与 CBAC (capabilities.yaml) 的写入权限规则关联
# 目的：Skill 加载时自动校验该 Skill 的操作是否在 CBAC 允许范围内
#
# 映射逻辑
# _______---
# skill_id → required_cbac_rules: 该 Skill 执行时需要的 CBAC 规则
# skill_id → restricted_paths: 该 Skill 不得触碰的路径（即使 CBAC 允许）
# role_id → max_cbac_level: 该角色可使用的最高 CBAC 安全等级
#
# 校验流程
# _______-
# 1. PipelineSkillBridge.inject_for_task() 注入 Skill 时
# 2. 查询本映射表获取 required_cbac_rules
# 3. 调用 capability_check() 校验每条规则
# 4. 任一规则拒绝 → Skill 降级为 read-only 或拒绝注入
#
# v0.2.0: 初始版本，覆盖 12 Domain Skill + 3 Role Skill
# ________________________________---

module_id: MOD-INF-002
version: "1.0.0"
schema_version: "1.0.0"
doc_type: register
title: "Skill to CBAC Mapping"
status: active
ttl: permanent

# =========================================================================
# §1  Domain Skill → CBAC 映射
# =========================================================================

domain_skills:
  SKILL-DOM-DBS-001:
    name: database-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "数据库专家——需要 write_src 修改 db/ 层代码"

  SKILL-DOM-MCP-001:
    name: mcp-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "MCP 专家——需要 write_src 修改 mcp/ 层代码"

  SKILL-DOM-CTX-001:
    name: context-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "上下文引擎专家——需要 write_src 修改 context_engine/ 层代码"

  SKILL-DOM-FBL-001:
    name: feedback-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "反馈循环专家——需要 write_src 修改 feedback_loop/ 层代码"

  SKILL-DOM-GAT-001:
    name: gate-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "门禁专家——需要 write_src 修改 gates/ 层代码"

  SKILL-DOM-AGT-001:
    name: agent_specialist
    required_cbac_rules:
      - write_src
    restricted_paths:
      - "config/capabilities.yaml"
      - "config/trigger_router.yaml"
    description: "Agent RBAC 专家——需要 write_src，但不得修改 capabilities.yaml"

  SKILL-DOM-BLU-001:
    name: master-blueprint
    required_cbac_rules: []
    restricted_paths: []
    description: "蓝图专家——只读，不需要写入权限"

  SKILL-DOM-DRF-001:
    name: drift_detector
    required_cbac_rules:
      - write_src
      - write_config
    restricted_paths: []
    description: "漂移检测专家——需要 write_src 修复代码 + write_config 修改阈值"

  SKILL-DOM-KNW-001:
    name: knowledge-specialist
    required_cbac_rules:
      - write_src
      - write_docs
    restricted_paths: []
    description: "知识库专家——需要 write_src 修改 kb/ + write_docs 写入知识文档"

  SKILL-DOM-RBK-001:
    name: rollback-specialist
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "回滚专家——需要 write_src 执行回滚操作"

  SKILL-DOM-VMS-001:
    name: vector_memory
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "向量记忆专家——需要 write_src 修改 vector_memory/ 层代码"

  SKILL-DOM-A2A-001:
    name: a2a_protocol
    required_cbac_rules:
      - write_src
    restricted_paths: []
    description: "A2A 协议专家——需要 write_src 修改 a2a_protocol/ 层代码"

# =========================================================================
# §2  Role Skill → CBAC 约束
# =========================================================================

role_skills:
  SKILL-ROLE-ARCH-001:
    name: architect
    max_cbac_level: "read-only"
    allowed_cbac_rules: []
    description: "架构师角色——只读，不写代码；产出 KB 决策记录"
    override_on_owner_approval: true

  SKILL-ROLE-IMPL-001:
    name: implementer
    max_cbac_level: "standard"
    allowed_cbac_rules:
      - write_src
      - write_script
      - write_docs
    description: "实现者角色——可写代码/脚本/文档，但必须通过 Gate 校验"
    gate_required_before_write: true

  SKILL-ROLE-GOV-001:
    name: governor
    max_cbac_level: "audit-only"
    allowed_cbac_rules:
      - write_docs
    restricted_paths:
      - "src/zephyr/**"
    description: "治理者角色——只写文档，不可修改业务代码"
    override_on_owner_approval: false

# =========================================================================
# §3  CBAC 规则 → Skill 反向索引
# =========================================================================
# 当 CBAC 规则拒绝时，快速查找哪些 Skill 受影响

cbac_rule_to_skills:
  write_src:
    - SKILL-DOM-DBS-001
    - SKILL-DOM-MCP-001
    - SKILL-DOM-CTX-001
    - SKILL-DOM-FBL-001
    - SKILL-DOM-GAT-001
    - SKILL-DOM-AGT-001
    - SKILL-DOM-DRF-001
    - SKILL-DOM-KNW-001
    - SKILL-DOM-RBK-001
    - SKILL-DOM-VMS-001
    - SKILL-DOM-A2A-001
    - SKILL-ROLE-IMPL-001
  write_script:
    - SKILL-ROLE-IMPL-001
  write_rules: []
  write_docs:
    - SKILL-DOM-KNW-001
    - SKILL-ROLE-IMPL-001
    - SKILL-ROLE-GOV-001
  write_config:
    - SKILL-DOM-DRF-001
