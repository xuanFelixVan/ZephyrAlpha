module_id: MOD-INF-002
version: "1.0.0"
schema_version: "1.0.0"
doc_type: register
title: "Embedding Model Registry"
status: active
ttl: permanent
implementation_status: "operational — embedding_migrate.py loads model registry from this YAML via load_model_registry(). KNOWN_MODELS dict retained as fallback."

models:
  # constraint: exactly one model must have default: true (SSoT for default model selection)
  - name: all-MiniLM-L6-v2
    dimension: 384
    provider: sentence-transformers
    max_length: 256
    default: false
    version: "2.0"
    gpu_memory_mb: 90
    file_size_mb: null
    description: "MiniLM multilingual model, lightweight and fast for English-dominant text"
    runtime_plane: cold
    latency_budget_ms: 30
    tags: [english, multilingual, lightweight]

  - name: paraphrase-multilingual-MiniLM-L12-v2
    dimension: 384
    provider: sentence-transformers
    max_length: 512
    default: true
    version: "1.0"
    gpu_memory_mb: 600
    file_size_mb: 465
    description: "Multilingual 50+ language model, 384d, used for COLD collections (blueprints/session_snapshots/execution_traces)"
    runtime_plane: cold
    latency_budget_ms: 50
    local_path: "data/models/local_model/paraphrase-multilingual-MiniLM-L12-v2"
    hf_repo_id: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
    required_files: ["model.safetensors", "config.json", "tokenizer.json"]
    tags: [multilingual, retrieval, lightweight, cold-path]

  - name: bge-small-zh
    dimension: 512
    provider: BAAI
    max_length: 512
    default: false
    version: "1.5"
    gpu_memory_mb: 200
    file_size_mb: 92
    description: "BGE small Chinese model, optimized for Chinese text retrieval"
    runtime_plane: cold
    latency_budget_ms: 50
    local_path: "data/models/local_model/bge-small-zh-v1.5"
    hf_repo_id: "BAAI/bge-small-zh-v1.5"
    required_files: ["model.safetensors", "config.json", "tokenizer.json"]
    tags: [chinese, retrieval, lightweight]

  - name: bge-m3
    dimension: 1024
    provider: BAAI
    max_length: 8192
    default: false
    version: "1.0"
    gpu_memory_mb: 2400
    file_size_mb: 2182
    description: "BGE M3 multilingual model, supports dense/sparse/colbert, used for HOT collections"
    runtime_plane: cold
    latency_budget_ms: 100
    local_path: "data/models/local_model/bge-m3"
    hf_repo_id: "BAAI/bge-m3"
    required_files: ["model.safetensors", "config.json", "tokenizer.json"]
    tags: [multilingual, retrieval, dense-sparse, hot-path]

  - name: text2vec-base-chinese
    dimension: 768
    provider: shibing624
    max_length: 512
    default: false
    version: "1.0"
    gpu_memory_mb: 400
    file_size_mb: null
    description: "text2vec base Chinese model, general purpose Chinese embeddings"
    runtime_plane: cold
    latency_budget_ms: 50
    tags: [chinese, general-purpose]

selection_rules:
  - priority: 1
    condition: "collection in ['blueprints','session_snapshots','execution_traces']"
    recommended: "paraphrase-multilingual-MiniLM-L12-v2"
  - priority: 2
    condition: "collection in ['decisions','code_context','lessons','knowledge','rules']"
    recommended: "bge-m3"
  - priority: 3
    condition: "input_language == 'zh' and not multilingual_required and latency_budget_ms < 80"
    recommended: "bge-small-zh"
  - priority: 4
    condition: "dimension_budget <= 768 and general_purpose == true"
    recommended: "text2vec-base-chinese"
  - priority: 5
    condition: "input_language == 'en' and latency_budget_ms < 50"
    recommended: "all-MiniLM-L6-v2"

constraints:
  - "All models must be loaded lazily on first request"
  - "Model switching requires config reload, not hot-swap"
  - "Embedding cache TTL: 24h for cold path, 1h for warm path"
