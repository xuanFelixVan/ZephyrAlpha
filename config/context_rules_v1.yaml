# 任务编号 : T-V2-006（experimental CL-018 配套）
# 权限层级 : Human-Gated（上下文规则修改 = 关键架构变更）
# 真源声明 : ai_autonomy_authority_registry.yaml §2.9（RI-03）
# 关联蓝图 : mod_inf_008（Context Engine, §5 Core Flow + §6 DD1-DD10）
