module_id: MOD-INF-002
version: "1.0.0"
schema_version: "1.0.0"
doc_type: rule
title: "Context Management Rules"
status: active
ttl: permanent
belongs_to: mod_inf_008
description: "6 context management rules — token budget tiers, injection layers, eviction strategy, freshness decay, incremental injection, and LSG validation gate"
implementation_status: "experimental active — consumed by context_budget_tracker.py and context_injector.py at runtime"

rules:
  - id: CTX-001
    name: token_budget_tiers
    description: "Token 预算三级阈值（DD2/DD6）"
    parameters:
      default_budget: 8000
      l1_warning_ratio: 0.80
      l2_compress_ratio: 0.90
      l3_hard_cutoff_ratio: 0.95
    enforcement: "ContextBudgetTracker.check_budget()"
    rationale: "80% 预警有余量做最后 compress；90% 触发 DocCompressor；95% 硬截断"

  - id: CTX-002
    name: four_layer_injection
    description: "上下文四层注入策略（INJECT-C00）"
    parameters:
      layer1_system:
        source: "AGENTS.md core rules"
        scope: "always-on, 不受 token 预算"
      layer2_rules:
        source: "CT-* 相关合同 + blueprints"
        scope: "按 task_type 注入"
      layer3_knowledge:
        source: "KE + failure_patterns"
        scope: "priority 排序"
      layer4_examples:
        source: "类似任务成功案例"
        scope: "仅相似度 > 0.7 注入"
    enforcement: "context_injector.py"
    rationale: "分层注入允许逐层降级——高层不可省略，低层可按预算裁剪"

  - id: CTX-003
    name: eviction_three_dimension
    description: "Token 超预算时三维排序逐出策略（DD9）"
    parameters:
      dimensions:
        - priority
        - freshness
        - relevance_score
      eviction_order: "lowest priority → oldest freshness → lowest relevance"
    enforcement: "context_budget_tracker.py"
    rationale: "FIFO/LRU 语义盲——三维排序保留最高价值上下文"

  - id: CTX-004
    name: freshness_decay
    description: "KE 新鲜度衰减曲线（AP6）"
    parameters:
      default_halflife_days: 90
      decay_formula: "weight = base_weight * 2^(-age_days / halflife_days)"
    enforcement: "context_injector.py"
    rationale: "越新的知识权重越高——统一衰减曲线，beta 扩展为领域差异化（B28）"

  - id: CTX-005
    name: incremental_injection
    description: "Per-Turn 增量注入（DD10）"
    parameters:
      mode: "incremental"
      full_rebuild_trigger: "session_start or context_reset"
    enforcement: "context_injector.py"
    rationale: "每轮全量 build = n×5 token 浪费——增量注入仅补充差量"

  - id: CTX-006
    name: lsg_validation_gate
    description: "注入前 LSG 安全审查门禁（AP1/CT-CE-LSG-001）"
    parameters:
      required_stages:
        - "input_classification"
        - "schema_validation"
        - "content_audit"
      on_failure: "block_injection"
    enforcement: "llm_security_gateway.py"
    rationale: "无 LSG 审查直接注入 = 恶意 prompt 进入 LLM 上下文——不可逆"
