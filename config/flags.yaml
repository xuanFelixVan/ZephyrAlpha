version: "0.9.0"
module_id: MOD-INF-015
ttl: permanent
last_updated: "2026-05-08"

flags:
  metrics:
    enabled: true
    description: "指标采集主开关"
    subsystems:
      system: true
      pipeline: true
      db: true
      ai: true
      telemetry: true

  logs:
    enabled: true
    description: "结构化日志主开关"
    structured_logging: true
    jsonl_export: false
    trace_id_injection: true

  traces:
    enabled: true
    description: "分布式追踪 (span_stub 基础追踪可用)"
    sampling_rate: 0.10
    propagation: "w3c"
    implementation_status: "beta"

  ai_behavior:
    enabled: true
    description: "AI行为监控 (event_sink 已接通)"
    implementation_status: "beta"

  git_operations:
    enabled: true
    description: "提交链操作旗组（提交链治本夜战 st-commitspeed-tbl-20260924）"
    regen_scope: "main_only"  # [翻转 2026-09-30·Owner批] any_worktree->main_only：M2意图账+pending_rerun尾收敛已在盘(reconcile_generators.py:802消费)，worktree语境只记账不spawn——修"75%静默丢弃+负收益工"缺陷(gate_survival_adjudication.md A6)
    # S1 不可变树接线（st-commitspeed-tbl-20260924）：门禁链输入源改读 CommitTreeView
    # 两棵不可变树（HEAD^/index 树），出厂 OFF=现行为；ON=重放 verdict 全等判据达标后
    # 由 Owner 门位翻转（宪法 §5）。
    immutable_tree: true
    # regen_scope 语义（M2/T5 衍生再生出窗，B0_3 设计）：
    #   any_worktree=出厂态（现行为）：post-commit 触发照旧 spawn，但锁/账/产物根已钉主区；
    #   main_only=worktree 语境只记账不 spawn，消费归主区事件。
    # 翻转属 Owner 门位（flag 出厂翻转=high tier）。

  archive:
    enabled: false
    description: "遥测数据归档 (未实现，保留flag)"
    retention_days: 30
    compression: "gzip"
    implementation_status: "not_started"

  health:
    enabled: true
    description: "健康检查 (module_health 可用)"
    implementation_status: "beta"

  alerts:
    enabled: true
    description: "告警规则评估 (基础条件解析可用，Multi-Window 未实现)"
    auto_escalation: false

  schema_validation:
    enabled: true
    description: "Schema校验 (YAML 加载可用，runtime drift 检测未实现)"
    strict_mode: false
    dlq_enabled: false

  auto_bootstrap:
    enabled: true
    description: "自动注入遥测hooks到所有模块 (monkey-patch 已实现)"

  red_blue_validator:
    enabled: true
    description: "红白对抗验证器主开关"
    auto_game_day: true
    ai_attack_generation: true
    tier_6_advanced: true
    blind_test_mode: false
    constitution_auto_approve: false

  commit_queue_serializer:
    enabled: true
    description: "提交队列串行化改道开关（66 号 §7 / 08 号文 §4.2 步骤 5）：ON 时 reconciler auto-commit（_commit_auto）改道 commit_queue 入队，dev 单写者不变量生效；出厂默认 enabled:false=ALWAYS_OFF（安全默认）。【2026-08-22 Owner 裁定翻开，当前 ON（281b7f469），已运行 8 天】；启用后以 scripts/governance/commit_queue_landing.assert_single_writer_dev_history 机械验证 dev 单写者"
    implementation_status: "gated_mvp"

  gate_result_cache:
    enabled: true
    description: "P2⑧ 门禁结果持久缓存（2026-09-10 提交通道性能优化方案 §2.2-A3，st-perf-plan-20260910 施工）：白名单（纯 staged 内容扫描型 CONTENT_SCAN_CACHE_WHITELIST，保守准入）命中跳过现算；key=gate_id×own_scope×write-tree 树指纹×HEAD_sha×flags mtime（任一变化全失效）+TTL 10min；只缓存 passed=True（降级态/失败不缓存——fail-open 不被放大）；【2026-09-12 Owner 批准转正（原定 7 天灰度提前结项：7 笔实弹提交零异常+红蓝#2 缓存投毒/失效攻击 4/4 全防住+reconciler 永久对账兜底）；回滚通道永久有效=flag OFF+删 .runtime/gate_cache/】"
    implementation_status: "production"

  gate_preflight:
    enabled: true
    description: "P2⑦ 锁外预跑+锁内指纹采信（方案 §2.3 方案A）：commit() 拿锁前预跑白名单内容 gate 记指纹 F={write-tree,HEAD,flags mtime}，拿锁后 F′==F 才采信（锁内只跑信号型+其余 gate），F′≠F/预跑异常/预跑即失败→全量重跑（现行路径永不拆除）；drift-watch 硬阻断语义只归锁内段；【2026-09-12 Owner 批准转正（原定 7 天灰度提前结项：实弹提交指纹采信正常+红蓝#2 验证 F′≠F 回退路径+reconciler 永久对账兜底）；回滚通道永久有效=flag OFF（预跑代码保留）】"
    implementation_status: "production"

  gate_precommit_run:
    enabled: true
    description: "裁定#341 方案②（2026-09-19 Owner 批，W1-D2 st-final3-20260919 施工）：GitCommitGateway 落地前（staged 校验段后、git commit --no-verify 前）对 staged 面 run pre-commit——55 台 pre-commit 门禁在网关通道补获执行权。own-scope 机制=GIT_INDEX_FILE 临时索引（HEAD 树+仅本提交文件，防他会话 staged 连坐，宪法 §3.1）；失败归因=hook 输出引用本提交文件才阻断，存量全局债降级 warn+审计（.runtime/audit/commit_block_events.jsonl event=precommit_channel_*）；SKIP=gate-commit-gw（通道内恒真冲突）+gate-worktree-required（与网关内进程 gate 双重计数冲突）。回滚通道=flag OFF（回 #341 前现状）"
    implementation_status: "production"

  commit_queue_interactive:
    enabled: true
    description: "P2⑨ 交互式提交入队（方案 §2.4-4b）：scripts/git_commit.py --enqueue 快照入队即返回 qid（AI 会话轮询 status 而非占锁重试）；LOCK_TIMEOUT 自动改道入队（P2⑨b，#ARCH-310 P0-1，st-govreform-20260912 施工）。【2026-09-12 Owner 批准启用（AI 原生治理评审 P0-1：'现在可以全部开工'），前置六项处置：①4a 死信清零已完成（952 项闭环）②会话协议改造已落（--enqueue 快照路径+status 轮询）③CloneGuard 索引=登记已知限制（serializer worktree 内 echo_guard 恒降级 warn-only+acknowledged 豁免吸收，不阻断）④压测 P95 与⑤docs 域两周灰度压缩为实弹观察（2026-09-12 并发事故为真实负载场景，回滚通道随时可用）⑥assert_single_writer_dev_history 断言实存（commit_queue_landing/gateway）继续作为日检防线】；回滚=flag OFF（存量 drain 完毕后关闭）"
    implementation_status: "production"

  commit_queue_c1_debounce:
    enabled: true
    description: "C1 同会话短窗自动合批（提速战役 T11/C1，A4 阶梯 S7『批均规模 ≥3』前置编排档，st-commitspeed-tbl-20260924 施工）：enqueue 时同 session 已有 pending 件且创建于 <20 分钟内则自动并入前件（文件集并集、零内容改动、纯队列编排；只对同 session+同 worktree-root 生效，跨会话绝不合并；吸收痕迹记 meta.supersedes/absorbed 复用 compaction 名册）。判据口径=件数/日 158→<60、文件中位/件 1→>5。资格闸：stale/attempts>0/depends_on 任一侧/lane 混用/task_id 异/base_head 异/超 R2 大批硬顶一律不并（宁不并不错并）。运行时开关=env ZEPHYR_CQ_C1_DEBOUNCE（commit_queue.py 零 yaml 依赖，B5 同款；缺省随本键出厂 ON）。净零声明：合并『同会话多件手动并批』的人工编排约定为机械自动（替代人工拆批/等批指引），不新增门禁判据/阈值/队列状态。回滚=本键 enabled:false（改 YAML 一值；或 env ZEPHYR_CQ_C1_DEBOUNCE=0 即时生效）"
    implementation_status: "gated_mvp"

  integrity_baseline_mode:
    enabled: true
    mode: "head"  # [翻转 2026-09-30·Owner批] snapshot->head（gate_survival_adjudication.md §9.2/§6；实现+测试随 SW19 袋 228ce95188 落地，head_baseline12 19/19 绿）。省落地件同步刷新 mean 46.1s/件；回滚=本值改回 snapshot
    description: "战役 B0/M1（提交链治本夜战 分包3/P3，2026-09-24）：GATE-RULES-INTEGRITY 基线真源面。mode=snapshot=出厂现行（读 rules_integrity_db.json 滞后快照，每件须同步 --register 续命，实测尾段 mean 46.1s/med 6.2s/max 300.7s + 近 24h 10 笔 chore(integrity) 记账尾笔）；mode=head=按当前 HEAD blob 派生（一次 git cat-file --batch，实测 n=17 0.026s/n=120 0.110s），DB 退出判定链⇒同步刷新义务与记账税一并消失，工作树面继续读故 WIP 篡改检测不降级（MQ-2：解释位 CHANGING_IN_COMMIT 仅 own-scope）。判定阈值与 exit code 两态完全相同；解释位/R-2/R-5 哨兵同批有测试。翻 head 属 Owner 门位（flag 出厂态翻转=high tier）；回滚=改回 snapshot 一个 YAML 值不动码"
    implementation_status: "gated"

  duckdb_runtime_gate:
    enabled: true
    mode: "warn"
    description: "裸 duckdb.connect 运行时拦截门（M3-C1，宪法 §9.1 运行时侧补齐，挖矿册 04 T1；实现=zephyr.infrastructure.duckdb_runtime_gate，对齐 runtime_interceptor 模式：eager patch+meta_path finder；白名单豁免 DatabaseService 自身与既有直连点 zephyr.factor.offline_store；审计落 .runtime/audit/duckdb_runtime_gate.jsonl）；mode=warn 出厂态（放行+审计），翻转 mode:block 属 Owner 门位（flag 出厂翻转=high tier）；kill-switch=ZEPHYR_RUNTIME_GATE=0；回滚=flag enabled:false 或 revert"
    audit_path: ".runtime/audit/duckdb_runtime_gate.jsonl"
    implementation_status: "gated_mvp"
