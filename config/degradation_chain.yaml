# ZephyrAlpha — Graceful Degradation 降级链配置
# 真源：蓝图 MOD-INF-001 §5.1 DD-14
# 版本：v2.6.0

module_id: MOD-INF-001
config_version: "2.6.0"

auto_recover: true
recovery_cooldown_seconds: 300

chains:
  - chain_id: cost-degradation
    trigger: cost_exceeded
    trigger_threshold: 5.0
    trigger_unit: "USD"
    description: "成本超限时降级到更经济的模型"
    tiers:
      - model: deepseek-chat
        max_tokens: 2000
        cost_per_1k_usd: 0.002
      - model: qwen2.5-3b-onnx
        max_tokens: 1000
        cost_per_1k_usd: 0.0

  - chain_id: latency-degradation
    trigger: latency_exceeded
    trigger_threshold: 10000
    trigger_unit: "ms"
    description: "P99 延迟超标时降级到更快模型"
    tiers:
      - model: deepseek-chat
        max_tokens: 5000
        cost_per_1k_usd: 0.002
      - model: qwen2.5-3b-onnx
        max_tokens: 2000
        cost_per_1k_usd: 0.0

gradual_switch:
  enabled: true
  step_pct: 10
  step_interval_seconds: 30
  max_concurrent_switch: 1
