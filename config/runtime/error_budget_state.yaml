module_id: MOD-INF-002
tracking_window:
  start: ""
  end: ""
  duration_days: 30

budget:
  # Error Budget = 100% - SLO，以分钟计
  # 99% SLO = 432 分钟/月 (30天)
  total_minutes: 432.0
  consumed_minutes: 0.0
  remaining_minutes: 432.0
  remaining_percent: 100.0

  # 准确率 Error Budget
  # 95% SLO = 5% 允许误报
  accuracy_total_percent: 5.0
  accuracy_consumed_percent: 0.0
  accuracy_remaining_percent: 5.0

burn_rate:
  # 过去 1 小时的消耗速率（% / hour）
  last_1h_percent: 0.0
  # 过去 6 小时的消耗速率（% / hour）
  last_6h_percent: 0.0
  # 是否触发 Critical Alert (1h > 2%)
  critical_alert: false
  # 是否触发 Warning (6h > 5%)
  warning_alert: false

feature_freeze:
  active: false
  activated_at: ""
  reason: ""
  auto_lift_at: ""

consumption_log: []
# 条目格式:
#   - timestamp: "2026-05-05T12:00:00Z"
#     event: "false_positive_detected"
#     consumed_percent: 0.1
#     detail: "validate_frontmatter.py 误报 3 个 Finding"
#     source: "run_all.py"
