# GGUF 模型显存预算表（10号文 §3.3 时段配额表为真源，human_gated）
# ============================================================================
# 口径：
#   - 硬上限 hard_cap_gb=21.6（RTX 3090 24GB × 90%，10号文 §2.3 约束表）。
#   - 时段配额 period_quotas 照抄 10号文 §3.3「显存管理的时段维度」表
#     （推理侧显存列；盘前/盘中 8-10GB 取上限 10.0，午休/盘后/夜间取 4.0）。
#   - 风控 NN 常驻 2GB 已含在盘中 8-10GB 口径内（§3.3 注），本表不重复扣减。
#   - 本地 LLM 推理显存配额服从本表；gpu_consensus_scheduler 负责时段切换执行，
#     local_llm_pool（MOD-INT-LOCAL-LLM-POOL）经
#     gguf_model_manager.to_pool_budgets() 消费本表（单真源，禁止另造口径）。
#   - vram_gb 估算口径：2026-08-30 ModelDiscovery（Ollama /api/tags）实证
#     size_bytes × 1.1（权重 + KV cache 常驻开销估计），复跑实测后回填校准。
#   - 新模型引入纪律：ollama pull 前必须先在本表登记并通过
#     GgufModelManager.check_load() 判定；未登记模型加载一律阻断（fail-closed）。
module_id: MOD-INF-060
version: "1.0.0"
created: "2026-08-30"

hard_cap_gb: 21.6

# 时段配额（Asia/Shanghai；窗口照抄 10号文 §3.3 时段表）
period_quotas:
  premarket: # 盘前 08:30-09:00 推理模型加载
    window: ["08:30", "09:00"]
    inference_quota_gb: 10.0
    note: "推理模型加载窗口；禁止训练"
  intraday: # 盘中 09:15-15:00 推理优先（HC-01 交易时段保护，训练 0GB）
    window: ["09:15", "15:00"]
    inference_quota_gb: 10.0
    note: "8-10GB 含 Whisper+LLM-7B+风控NN 常驻 2GB"
  midday: # 午休 11:30-13:00 LLM 最小集 + 轻量训练
    window: ["11:30", "13:00"]
    inference_quota_gb: 4.0
  postmarket: # 盘后 15:00-15:30 推理→训练切换
    window: ["15:00", "15:30"]
    inference_quota_gb: 4.0
    note: "切换中，推理侧向 0 收敛"
  night: # 夜间 15:30-08:30 训练优先，LLM 最小集
    window: ["15:30", "08:30"]
    inference_quota_gb: 4.0
    note: "跨日窗口；LLM 最小集与训练互斥时分共享"

