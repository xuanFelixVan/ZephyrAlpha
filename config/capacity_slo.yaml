# mod_inf_001 M-18 — 容量 SLI/SLO 注册表（机读 SSoT）
# 对齐: docs/03_modules/_domain_infrastructure_operations/capacity_assurance/blueprint.md §13 示例
# arch_guard 脚本从此文件读取阈值，与 invariants.yaml 交叉校验见 check_capacity_slo_ssot.py
module_id: mod_inf_001
schema_version: "1.0"
doc_type: register
module_ref: mod_inf_001
last_updated: "2026-05-05"

slo_registry:
  - id: CAP-001-startup-time
    description: "模块启动时间 P99（pytest 计时）"
    target_ms: 2000
    measurement: "pytest 基准"
    golden_signal: latency
    instrumentation: { hook_point: "src/zephyr/__init__.py", sampling_sample_rate: "TBD" }

  - id: CAP-002-event-throughput
    description: "事件总线吞吐量 msg/s"
    target: 1000
    measurement: "压力测试"
    golden_signal: traffic
    instrumentation: { hook_point: "event_bus.emit", sampling_sample_rate: "TBD" }

  - id: CAP-003-error-rate
    description: "跨模块调用错误率上限"
    target: 0.001
    measurement: "circuit_breaker 统计"
    golden_signal: errors
    instrumentation: { hook_point: "zephyr.shared.resilience.circuit_breaker", sampling_sample_rate: "TBD" }

  - id: CAP-004-memory-saturation
    description: "内存饱和度"
    target: 0.8
    measurement: "psutil"
    golden_signal: saturation
    instrumentation: { hook_point: "capacity_metrics writer", sampling_sample_rate: "TBD" }

  - id: CAP-005-cpu-saturation
    description: "CPU 饱和度"
    target: 0.7
    measurement: "psutil"
    golden_signal: saturation
    instrumentation: { hook_point: "capacity_metrics writer", sampling_sample_rate: "TBD" }

  - id: CAP-006-queue-depth-saturation
    description: "事件队列深度上限"
    target: 500
    measurement: "asyncio.Queue.qsize"
    golden_signal: saturation
    instrumentation: { hook_point: "event_bus.queue", sampling_sample_rate: "TBD" }

  - id: CAP-007-type-check-time
    description: "类型检查耗时 P99"
    target_ms: 30000
    measurement: "dmypy / mypy"
    golden_signal: latency
    instrumentation: { hook_point: "ci job scripts/governance", sampling_sample_rate: "per PR" }

  - id: CAP-008-config-check-time
    description: "SSoT / 配置校验耗时 P99"
    target_ms: 10000
    measurement: "validate_ssot.py 计时"
    golden_signal: latency
    instrumentation: { hook_point: "scripts/governance/d5_architecture", sampling_sample_rate: "per PR" }

  - id: CAP-009-kill-switch-trigger-latency
    description: "Kill Switch 触发延迟（INV-001 / KBG-0009）"
    target_ms: 1
    measurement: "D_RISK stop-loss → 熔断信号（T1 实测；当前为声明 + arch_guard）"
    golden_signal: latency
    relates_invariant: INV-001
    instrumentation: { hook_point: "risk kill_switch signal", sampling_sample_rate: "T1 only" }

  - id: CAP-010-aisg-intercept-latency
    description: "AISG security_gateway 拦截路径（INV-015 Hot-adjacent）"
    target_ms: 50
    measurement: "D_GOV_ENFORCEMENT gateway latency"
    golden_signal: latency
    relates_invariant: INV-015
    instrumentation: { hook_point: "compliance security_gateway", sampling_sample_rate: "TBD" }

  - id: CAP-011-disk-io-saturation
    description: "磁盘 I/O 饱和度"
    target: 0.7
    measurement: "psutil disk_io_counters"
    golden_signal: saturation
    instrumentation: { hook_point: "capacity_metrics writer", sampling_sample_rate: "TBD" }

  - id: CAP-012-network-saturation
    description: "网络带宽饱和度"
    target: 0.6
    measurement: "psutil net_io_counters"
    golden_signal: saturation
    instrumentation: { hook_point: "capacity_metrics writer", sampling_sample_rate: "TBD" }

  - id: CAP-013-goroutine-thread-saturation
    description: "线程/协程并发饱和度"
    target: 0.8
    measurement: "threading.active_count / psutil"
    golden_signal: saturation
    instrumentation: { hook_point: "event_bus.queue", sampling_sample_rate: "TBD" }

arch_guard:
  min_slo_entries: 10
  invariant_numeric_alignment:
    INV-001:
      slo_id: CAP-009-kill-switch-trigger-latency
      max_latency_ms: 1
    INV-015:
      slo_id: CAP-010-aisg-intercept-latency
      max_latency_ms: 50
  deployment_topology:
    cold_to_hot_requires_warm_shadow: true
  hot_path_python_scan:
    roots:
      - src/zephyr/ex_core/adapters
    forbid_asyncio: true
  ai_security_gateway:
    enabled: true
