# =============================================================================
# heritage_policy.yaml — L7 传承段规则参数层（阈值/保留期=治理层资产，AI 层不持尺）
# =============================================================================
# 真源设计稿: docs/_working/ai_layer_vision/L7_heredity/DESIGN.md §2.5/§2.6(D-L7-03)/§2.8(D-L7-05)
# BLUEPRINT : MOD-INF-037 | docs/03_modules/_domain_governance/registry_governance/blueprint.md | §ai_layer_heritage
# ROOR 挂接 : 治理族（registry_of_registries.yaml 登记由主会话统一执行，README §3 批次清单行"L7 heritage_policy.yaml"）
# 净零声明  : 吸收记忆目录坑集的机读化（ai_layer_vision/README.md §3 原文）。记忆目录（Owner 人读
#             坑集）=人读副本保留不删，两轨不对称不互为真源（DESIGN §2.7 D-L7-04）。
# 初值追认  : Owner 夜批授权原值生效（README §3.5 L7-#1 已销项：按 DESIGN 提案原值预注册，
#             首轮数据后走 OBJ_R 提案修订）。
# 改动流程  : AI 提案 → 治理立案 → Owner 修订 → OBJ_R 四步流水线；禁运行时改值。
# =============================================================================

policy_id: heritage_policy_v1
ttl: permanent
design_source: docs/_working/ai_layer_vision/L7_heredity/DESIGN.md

# -----------------------------------------------------------------------------
# 登记闸（§2.5 写 H1 必须全过；非数值词表同步内联）
# -----------------------------------------------------------------------------
registration:
  min_plain_zh_chars: 10          # plain_zh 非占位下限（H1 CHECK 同值；"≥10 字且非待填/略"）
  min_narrative_chars: 30         # elite.diff_summary / criteria.why_win 下限（≥30 字防占位）
  min_recipe_delta_chars: 20      # defect.recipe 与 root_cause 复读差异校验下限（≥20 字差异）
  simhash_hamming_max: 3          # 自查重近似层：全库汉明 ≤3 命中即拒（L2 同款 k≤3）
  source_ref_prefixes:            # 来源可溯白名单（§2.5，含红蓝 B3 补的 DR-*/TP-*）
    - SW-                         # L6 切换记录
    - EX-                         # L4 实验卡
    - WO-                         # 工单
    - CASE-                       # OBJ_R casebook 个案
    - HT-                         # 传承条目自身（归并链）
    - DR-                         # OBJ_M 双跑记录（红蓝 R1-B3）
    - TP-                         # OBJ_T 配对实验记录（红蓝 R1-B3）
  defect_source_kinds:            # 无案例不入册（对齐 checklist 入册纪律）
    - work_order
    - redblue
    - casebook
    - l6_switch
  pattern_slug_re: '^[a-z][a-z0-9_]{2,63}$'   # pattern_norm 受控词表 slug 形态（开放词表，新模式先登记 L7）

# -----------------------------------------------------------------------------
# 防近亲繁殖四条配比约束（§2.6 D-L7-03：回流只调排序不缩搜索面）
# -----------------------------------------------------------------------------
anti_incest:
  prior_factor_min: 1.0           # 约束1：只加法加权，下限=无先验
  prior_factor_max: 2.0           # 约束1：富矿加权上限（永不碰配额，配额真源=L1 源注册表）
  l7_prior_daily_share_max: 0.50  # 约束2：l7_prior 触发单占比 ≤50%/日（超限=当日冻结+告警；L1 journal 侧执行）
  keyword_groups_min_keep: 1      # 约束3：排除词表只滤词不灭矿脉，每单至少保留 1 组关键词
  coverage_freeze_line_pct: 60.0  # 约束4：48 格覆盖率 <60% → 全局 prior_factor 冻结 1.0
  coverage_decline_months: 2      # 约束4：连续 2 个月下降 → 同上冻结
  total_cells: 48                 # 行为格 v0=6 域×8 机制族（含工具域，红蓝 R1-B2）
  prior_window_days: 90           # V3 近 90 天 hit 数窗口（L1 先验 rationale 组成）

# -----------------------------------------------------------------------------
# 遗忘机制（§2.8 D-L7-05：只降级压缩、永不物理删；Smyth & Keane 1995 删 auxiliary 保 pivotal）
# -----------------------------------------------------------------------------
forget:
  defect:
    compressed_zero_quarters: 4   # retired 且连续 4 个季度零新案+零 hit → compressed
  elite:
    keep_per_cell: 3              # 同格（surface×family）保 top3（对齐 L2 保优 3=格内候补）
    tombstone_windows: 2          # L6 对象进 tombstone 满 2 体检窗 → archived（L6 §②-D 同款）
    compressed_after_months: 12   # archived 满 12 个月且 diff 被后代吸收（parent 链核验）→ compressed
  criteria:
    keep_per_venue: 3             # 同 venue 保留最近 3 代全文，更早 compressed（experiment_id+hash+verdict 摘要留）

# -----------------------------------------------------------------------------
# 关单登记机检（§2.9：关单四闸之后的产出检查，非第五道放行闸）
# -----------------------------------------------------------------------------
closure:
  kinds_requiring_heritage:       # 工单 kind ∈ 此清单的关单回执必须带 heritage_ref 或 no_new_pattern
    - incident_fix
    - defect_fix
    - redblu_finding
  no_new_pattern_reasons:         # 声明理由枚举三选一（§2.9）
    - known_pattern               # 命中既有模式（格式 known_pattern: <entry_id>，occurrence_count+1）
    - mechanical_debt             # 机械债无新根因
    - dup_of                      # 个案已归并（格式 dup_of: <case_id>）
