policy_id: tool_exam_policy_v0
ttl: permanent
design_source: docs/_working/ai_layer_vision/OBJ_T_tools/DESIGN.md
status: draft                  # 【OBJ_T-#1 避让】提案稿——治理立案（OBJ_R 四步流水线）前非正式考纲
draft_reason: OBJ_T-#1 考纲正式化待 Owner 治理立案（README §3.5 真待 Owner 表）

criteria:
  tier: B                      # L4 §2.4 Tier B 有限样本档：效应量+区间+未决不硬判，禁硬套 p 值
  rationale: 工具考试 N=5-10/器官，撑不起 McNemar/Wilcoxon（DESIGN §3.1 判据轻量化裁定）
  significance:
    effect_win_pp: 10.0        # 新工具胜老工具：成功率差 ≥ +10pp（5-10 题下=至少 1 题）
    noninferior_pp: -10.0      # 非劣保留：差 ≥ −10pp 且时延/成本不劣 → 判"平"（L4 平局规则）
    min_judgeable_n: 5         # 可判题<5 → 记"未决"禁硬判（诚实条款）
    wilson_z: 1.96             # Wilson 95% 区间（organ_score 区间全宽报告）
    wilson_confidence_level: 0.95
  red_line_rule: 任一题红线违例（H8/F2/F6/E7 类）→ 该工具整体记 fail，不看总分
  score_rule: organ_score = 成功题数/题数；报告 Wilson 95% 区间全宽
  secondary_noninferior: 时延/成本不劣方可判"平"，二者任一劣化→loss

too_good_reference:
  g3_trigger_source: config/comparison_policy.yaml too_good_triggers.G3_tool
  g3_definition: 基准任务集 100% 全对且任务集含已知陷阱题
  note: 本文件零复制 G3 常量（引用不收编）；三查执行归 L4 too_good 执行器

exam_governance:
  paper_source: docs/_working/ai_layer_vision/OBJ_T_tools/tool_benchmark_suite_v0.yaml
  paper_hash_lock: criteria_sha256（canonical JSON{version,seed,tasks} sha256；改题须换版本）
  proposal_right: AI 层只有提案权+使用权（运动员不持尺）
  formalization_path: OBJ_R 四步流水线（提案→立案→Owner 修标→重考历史）
