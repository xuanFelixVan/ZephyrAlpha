# G-D.1 图形共振矩阵·预注册族（C237，2026-10-07，总包车道 L7）
# ═══════════════════════════════════════════════════════════════════════════
# 纪律首行（ext_01 G-D.1 判据栏）：图形信号只作条件轴禁作独立信号——
#   Marshall et al. (2006) 证伪基线（成熟市场 TA 形态无增量；学术案卷
#   dossier_academic_papers.md §1.1），任何格的边际有效性必须以"条件轴×其他轴"
#   交互项口径入考，禁单信号上线结论。
# 判据真源=docs/_working/total_command_closeout/10_wave_plan.md 10.G-D 行
#   （★READY_NOT_FIRED：引擎+prereg 冻结+日频小样本冒烟通过即出口；
#   不点火、结果不入账本、不作策略结论，正式跑全推迟到波 12 G-D.4 Owner 门位）。
# 引擎=scripts/backtest/grid_stats_engine.py（C238/C239 落地，四件套+SPA/StepM+分半窗）。
