    algo_note_zh: 全厂唯一判定权（运动员不兼任裁判）。IS 2020-2023 冻结窗口+冻结土规成本
      （2.5bp+10bp+5bp）→DSR 批内折减→OOS 新考卷（2024-2026 已跑）→双窗口及格线。
      护栏栈：WFO/purged CV+embargo/CPCV（测试在库）/Optuna-on-purged/PBO+DSR 签核；
      分布预测件加双标准（PIT 校准+锐度）；滚动窗口 CV 为时序模型通用要求。
      是否拆 E4a 免回测快筛（AlphaEval 式五维，省时 25%+）+E4b 全量=开放决策点 7
    compute_class: local
    data_refs: [c1_market.kline_daily_hfq, c1_market.stk_limit, c1_market.kline_index]
