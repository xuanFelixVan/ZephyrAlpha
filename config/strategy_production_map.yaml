# 策略生产全景图（strategy_production_map，昵称"策略工厂"）v0.3 血肉挂载版
# 图 9：生产级全景图第二张（图 7 交易决策全景图=消费端，本图=供给端）
# 状态：增长轨已落图（2026-09-13 九图挂轴批）——四关验收件齐备：结构校验器+对抗测试
#       （681a7fc806）+ FACTORY-MAP gate（priority=142 触发式硬阻断）+ 九图挂轴
#       （alignment_checklist §3 图 9 行 + align_all 第八节）；治理地位对齐 TDM。
#       增长轨性质不变：新节点/车道按层位规约追加，结构校验即改即拦
# 设计来源：docs/_working/2026-09-13-strategy-factory-pipeline-discussion.md（v1-v10，五轮检索+Owner 2025-09 笔记）
# 字段约定：TDM 字段集 + 工厂四件（build_status/store_refs/lane/gate_refs）+ 本次新增
#           （design_refs 设计出处/compute_class 算力档），v9.1+v0.2 定稿
# v0.3（2026-10-03 挂图升级批，vertical_map_mounting_policy §2/§4/§5 域实例化）：
#   purpose_legend=Owner 一轮终审冻结（2026-10-03，12 条全原样通过），冻结后机贴不改名
#   （加标签=廉价扩展；改名/合并=裁定级操作须全量重贴）；
#   mechanism 挂载层（一机制一节点，parent_node 挂 stage/lane 主干，骨架 16 节点不动）
#   由 F2 机生，候选真源=docs/_working/map_census/fac9_01_mount_candidates.yaml（449 行）；
#   facts 抽取源映射（F3 车道）=strategy_intake csv 行数／backtest_artifacts 台账计数／
#   translated+constructed manifest 计数／src 消费面 grep；DB 内计数列处方由总筹代跑；
#   病历册清单（15 本+建议挂载环节）=fac9_01_report.md §六；完备性=F4 覆盖账本三红校验

schema_version: '0.3'
map_id: strategy_production_map
name_zh: 策略生产全景图
nickname: 策略工厂
effective_from: '2026-09-13'
markets: [cn_a]

# 目的标签图例（SOP §2；Owner 2026-10-03 终审冻结原文；标签贴机制=它在本图的岗位意义，
# 判据2/3 伸手件按其服务的环节贴；同标签多钉=重复簇显影位，内收对审入口）
purpose_legend:
  - {tag: 重活夜里干, one_liner_zh: 交易日白天只许干轻活，重算力全排收盘后和休市日，闸门说了算}
  - {tag: 进货带出生证, one_liner_zh: 每个策略想法进来都登记从哪条车道来的、原文在哪，出事能倒查}
  - {tag: 策略不讲通不花钱, one_liner_zh: 经济学上讲不通的想法直接死在预审，一分回测算力都不给它花}
  - {tag: 外来经翻译成标准件, one_liner_zh: 别人家的策略要翻成咱们的标准件才能进厂，翻得对不对有验收集管着}
  - {tag: 策略及格说了算, one_liner_zh: 及不及格只有考试能判，做策略的永远不许给自己打分}
  - {tag: 策略加池子才准入, one_liner_zh: 单策略好看不算数，加进组合能涨分才让进}
  - {tag: 在库策略按月体检, one_liner_zh: 入库的策略持续体检，不行了就挂牌降级，结论回灌进货方向}
  - {tag: 新策略上岗先实习, one_liner_zh: 过了考试的策略先用真行情跑模拟盘，不达标退回重修}
  - {tag: 钱跟着确定性走, one_liner_zh: 资金怎么分是算出来的：风险预算、回撤限额、体制状态说了算，不许拍脑袋}
  - {tag: 赚亏拆开看, one_liner_zh: 实盘每一分赚亏都拆得开来源（择时/选股/成本），拆完的教训回灌下次判断}
  - {tag: 病历有人翻, one_liner_zh: 每本台账病历册都挂在流程上：考了几次、死过几个、怎么修好的，查得到}
  - {tag: 图有人守, one_liner_zh: 这张图自己有校验器和对抗测试守着，谁改坏了结构当场拦下}

# 全图三铁律（讨论稿 §三 定稿，全节点强制）
laws:
  - 运动员不兼任裁判：生成车道永远无权给自己打分，考试权只在 E4 咽喉
  - 量越大及格线越狠：FDR 预算随试验数动态收紧（业界参照：发表因子约 80% 为统计伪迹）
  - 事件触发禁定时器：trade_calendar 闸门+数据到达触发，禁 cron/sleep-loop

# 工厂五类产品（v9 定稿）
products: [strategy, factor, portfolio, evidence_chain, negative_archive]

# 明确不做边界（防手痒）
boundary:
  - 高频/做市（订单流微观结构、极速执行）——基础设施与速度要求超出日频工厂定位
  - 元学习跨体制适应——研究雷达观察，不施工

layers:
  - {layer_id: E0, name_zh: 算力调度, growth: 低-中}
  - {layer_id: E1, name_zh: 想法进货, growth: 极大（车道子节点无限生长）}
  - {layer_id: E2, name_zh: 假说预审, growth: 中}
  - {layer_id: E3, name_zh: 构造代码, growth: 极大}
  - {layer_id: E4, name_zh: 考试咽喉, growth: 中-高}
  - {layer_id: E5, name_zh: 协同去重, growth: 低-中}
  - {layer_id: E6, name_zh: 入库监控, growth: 中}
  - {layer_id: E7, name_zh: 模拟盘前哨, growth: 中}
  - {layer_id: E8, name_zh: 组装与资金分配, growth: 中-高}
  - {layer_id: E9, name_zh: 实盘归因, growth: 中}

nodes:
  - node_id: FAC-E0
    name_zh: 算力调度心跳
    stage: E0
    node_type: stage
    decision_question: 现在能不能跑重算力任务？该跑哪条车道的活？
    algo_note_zh: 交易日白天只许轻任务（监控巡检），重算力（挖掘训练/批测/遗传优化）全排收盘后和休市日；
      trade_calendar 当闸门；事件触发禁定时器。回测量是算力成本大头（工厂经济学），
      加速备选=vectorbt(Numba/JAX GPU)/Polars GPU 13x/DuckDB 10-20x；
      已建=MOD-BT-151 拉式闸门（重任务开工事件问闸，classify_window+gate_decision
      四枚理由码，日历缺失 fail-closed，收盘缓冲 15:30）
    compute_class: local
    data_refs: [c1_market.trade_calendar]
    module_ref: MOD-BT-151
    build_status: partial
    design_refs:
      - AWS 回测参考架构（Batch+Airflow 算力窗爆发扩缩容） aws.amazon.com/blogs/industries/how-to-build-and-backtest-systematic-trading-strategies-on-aws-with-aws-batch-and-airflow/
      - Dagster 资产传感器（事件驱动+新鲜度策略，与本项目事件触发铁律同构） docs.dagster.io/guides/automate/asset-sensors
      - Quantopian/Bloomberg Airflow 实践（外部框架不引入，模式参照）
    store_refs:
      - {artifact: 调度日志, location: .runtime/logs/, key: 时间窗, retention: 90 天}

  - node_id: FAC-E1
    name_zh: 想法进货（六车道）
    stage: E1
    node_type: stage
    decision_question: 下一批策略想法从哪条车道进来？每条车道进什么货？
    algo_note_zh: 多车道并发进货（图节点 A-E+G；F=F06 网格仅代码车道，节点补挂=2.4 跨线欠账），
      所有货统一卸到策略入库台账并带出生证（渠道+批次+原文指针）；
      已建=MOD-BT-154 进货编排（薄编排层：E1D 进货→E1B 可选→E2 幂等预审自动接续，
      E0 问闸预检接线，E3 排产清单产出；C 车道重算力闸点已声明待 E1C 施工）
    compute_class: mixed
    data_refs: [待定:c1_market.news_data]  # F-AUDIT-BLIND-04：全 CH 无 news 表，真表入库前挂待定
    module_ref: MOD-BT-154
    build_status: partial
    design_refs: []
    store_refs:
      - {artifact: 候选想法清单, location: data/strategy_intake/, key: md5_12, retention: 永久}

  - node_id: FAC-E1A
    name_zh: 车道A-社区货源
    stage: E1
    node_type: lane
    lane: A
    decision_question: 社区里有哪些新策略值得收？
    algo_note_zh: 聚宽/掘金等社区策略爬取与入库（C1 人工版已收 597 条）；扩容爬虫候选 Scrapling
    compute_class: local
    data_refs: [data/strategy_intake/raw_manifest.csv]
    module_ref: scripts/backtest/strategy_intake_inventory.py
    build_status: built
    design_refs:
      - Scrapling 自适应爬虫 github.com/D4Vinci/Scrapling（扩容候选）
    store_refs:
      - {artifact: 策略原文, location: data/strategy_intake/normalized/, key: md5_12,
         retention: 永久（盘面留存，git 不跟踪）}

  - node_id: FAC-E1B
    name_zh: 车道B-AI生成
    stage: E1
    node_type: lane
    lane: B
    decision_question: 自然语言能生成哪些新策略？
    algo_note_zh: 自然语言→策略生成，量产思路；货最便宜也最杂，靠 E2 预审把关。
      注意：业界最强模型 NL→可执行策略单轮通过率仅 70-76%（QuantCode-Bench），
      生成件必须走 E3 验收集重试环
    compute_class: api
    data_refs: []
    module_ref: MOD-BT-150
    build_status: partial
    design_refs:
      - HKUDS/Vibe-Trading（75+技能/452 因子，可作 Claude 技能包） github.com/HKUDS/Vibe-Trading
      - QuantCode-Bench github.com/LimexAILab/QuantCode-Bench
    store_refs:
      - {artifact: 生成假说清单, location: data/strategy_intake/lane_b_candidates.csv,
         key: candidate_id, retention: 永久}

  - node_id: FAC-E1C
    name_zh: 车道C-公式挖掘机
    stage: E1
    node_type: lane
    lane: C
    decision_question: 公式空间里还有哪些未挖的因子组合？
    algo_note_zh: 强化学习拼公式（AlphaGen）/遗传规划（gplearn）；受控搜索空间防乱写代码；
      组合协同思想=不追求单因子好看、追求整组合强；选型待小批量试产
      （AlphaGen vs gplearn vs 双轨）；GP 计算胃口最大，LLM 辅助生成是省算力替代；
      Owner 2026-09-14 四项裁定=双轨分期/增量IC基座 REG-IND-001/种群1000×50/白名单审定制；
      已建=MOD-BT-155 gplearn 轨 MVP（config/factor_mining_whitelist.yaml 算子约束真源，
      搜索=内置 spearman、验收=对基座残差增量 IC，E0 问闸 heavy 档；白名单已 active）
      +MOD-BT-158 智能体轨 MVP（E2 过审假说反哺种子→本地 LLM 产 DSL→DSL 校验/AST 原创/
      增量 IC 三道验收，AlphaAgent 三正则借监不引码，P2 赛马计分板 factory_intake_pipeline
      race 子命令）；P0 对照笔记=立项书附三
    compute_class: local_gpu
    data_refs: [config/factor_mining_whitelist.yaml]
    module_ref: MOD-BT-155
    build_status: partial
    design_refs:
      - AlphaGen（KDD 2023） github.com/ICT-FinD-Lab/alphagen
      - AlphaForge（挖掘+动态组合） arxiv.org/html/2406.18394
      - DolphinDB GPU 挖掘 30x 实践 medium.com/@DolphinDB_Inc/30x-faster-alpha-factor-mining
    store_refs: []

  - node_id: FAC-E1D
    name_zh: 车道D-产业链三高
    stage: E1
    node_type: lane
    lane: D
    decision_question: 产业链图谱上哪些咽喉环节符合三高特征？
    algo_note_zh: BOM 拆解找高增长/高壁垒/高利润环节；ig_fact 供应链图谱为独家数据资产；
      学术验证=图谱多跳结构比只用直接关系样本外 Sharpe 高 50%+（Capponi）。
      升级路线（v5.1）=LLM 自动抽取/增补图谱关系（年报/公告→关系抽取），
      防幻觉技巧=只抽业务描述段；A股先例=ChainKnowledgeGraph 开源+永安期货 KG 实践；
      已建=MOD-BT-090 三高筛选（belongs_to_sector 环节×财务中位数×客户集中度壁垒
      ×supplies_to 咽喉度四支柱 z 分合成，候选想法带出生证卸
      data/strategy_intake/three_high_candidates.csv；LLM 增补管线未建=partial）
    compute_class: mixed
    data_refs: [ig_fact, config/chainmap_cluster_names.yaml]  # 补真身路径（审计 B2 校验面实测）
    module_ref: MOD-BT-090
    build_status: partial
    design_refs:
      - Capponi 供应链图谱讲座（Luohan Academy） luohanacademy.com/en/webinar/1088/
      - Zero-Shot 股票关系图抽取（FinNLP 2025） aclanthology.org/2025.finnlp-2.2.pdf
      - ChainKnowledgeGraph（A股产业链开源） github.com/liuhuanyong/ChainKnowledgeGraph
    store_refs: []

  - node_id: FAC-E1E
    name_zh: 车道E-模型基线
    stage: E1
    node_type: lane
    lane: E
    decision_question: 分布预测/机器学习这条线有没有肉？
    algo_note_zh: Kronos 论文本身做了 A 股实证（多头组合 AER/IR 跑赢 25 基线，官方 Qlib
      微调管线）；深化方向=分布预测（分位数回归起步，沪深300 原型，LightGBM 分位数
      进阶）；分布预测输出登记为前瞻性因子（factor_registry 准入）反哺全厂；
      只当基线对台，不直接当交易信号；
      已建起步=MOD-BT-084 分位数回归分布预测原型（1ce3e275，tests/backtest/test_lane_e_quantile_baseline.py）；Kronos 接入/深化待建
    compute_class: local_gpu
    data_refs: []
    module_ref: MOD-BT-084
    build_status: partial
    algo_note_extra: Kronos 接入=MOD-BT-195 kronos_adapter（vendor/Kronos 官方仓+镜像权重，
      600519 walk-forward 实测：区间锐度 109 vs 随机游走 314、校准 share 0.4 vs 0.2，
      小样本首战跑赢基准；多路径采样绕官方 sample 维均值，分位数=真分布；双标准考尺
      MOD-BT-194 评分）；只当基线对台不当信号
    design_refs:
      - Kronos（AAAI 2026） arxiv.org/html/2508.02739v1
      - github.com/shiyu-coder/Kronos（含 Qlib+A 股微调管线）
    store_refs: []

  - node_id: FAC-E1G
    name_zh: 车道G-全网搜索进货
    stage: E1
    node_type: lane
    lane: G
    decision_question: 胃（搜索设备）消化出的情报里有哪些可检验策略假说值得进货？
    algo_note_zh: ⑥号车道（骨架 §4 P1"从胃点菜"）——只消化 L3 胃的收件箱摘要
      （docs/_working/automation/inbox/intel-*.md），本地 LLM（经 LSG）抽取 0-2 条/篇
      可检验 A 股假说，带出生证（url 指针进 birth_source）卸 lane_g_candidates.csv；
      url 级 seen log 防重考，LLM 失败条目不标 seen 下一班自愈；
      只搜不入册红线由胃侧守住，本车道侧=进货不打分（判定权 E2/E4）。
      已建=MOD-AUTO-E1G-001（暂编号，挂单 H-01 解冻后重编）；事件接线（收件箱落新班自动触发）未挂=partial。
      注：车道字母 F 已被 F06 网格占用（仅代码车道，图节点补挂=2.4 接线跨线欠账），本件跳号取 G。
    compute_class: local
    data_refs: [docs/_working/automation/inbox/, data/strategy_intake/lane_g_candidates.csv]
    module_ref: MOD-AUTO-E1G-001
    build_status: partial
    design_refs:
      - QuantCode-Bench（生成件必须走 E3 验收集，同车道B警示） github.com/LimexAILab/QuantCode-Bench
    store_refs:
      - {artifact: 搜索假说清单, location: data/strategy_intake/lane_g_candidates.csv,
         key: candidate_id, retention: 永久}

  - node_id: FAC-E2
    name_zh: 假说预审逻辑门
    stage: E2
    node_type: stage
    decision_question: 这个想法在经济学上讲不讲得通？
    algo_note_zh: 防噪音总闸：讲不通的想法在此死，不花回测算力。前沿互证=FaVOR 框架
      （回测前机制验证：假说拆成可观测市场条件+分布证据先验检查）；FDR 底线=
      Harvey-Liu-Zhu t≥3.0、López de Prado 80% 伪迹论；哲学溯源=Owner 2025-09
      笔记"主观经验是先验过滤器，AI 无中生有=冰淇淋销量式巧合"；本地 8B-32B 可扛
    compute_class: local
    data_refs: []
    module_ref: MOD-BT-091
    build_status: partial
    design_refs:
      - FaVOR arxiv.org/html/2608.30192
      - Can AI Do Financial Research? SSRN 6569258
      - Harvey-Liu-Zhu 因子动物园多重检验（t≥3.0）
    store_refs:
      - {artifact: 预审判定记录, location: c1_backtest.hypothesis_precheck, key: candidate_id,
         retention: 永久}

  - node_id: FAC-E3
    name_zh: 构造与翻译
    stage: E3
    node_type: stage
    decision_question: 外来策略怎么变成咱们的标准件？新想法怎么变成可执行代码？
    algo_note_zh: C3 翻译（原文→权重函数+D1-D5 差异声明+因子拆解）——模板已定型、
      35 条人工翻译=验收集；QuantCode-Bench 实证最强模型单轮通过率仅 70-76%
      （QuantCode-Eval pass@5 仅 43%），必须带验收集+编译重试环+人工抽检；
      本地 32B 初翻+API 复核两档
    compute_class: mixed
    data_refs: [data/strategy_intake/normalized/]
    module_ref: MOD-BT-041..075
    build_status: partial
    algo_note_extra: 公式轨桥=MOD-BT-159 factor_strategy_template（DSL 表达式→E4 考卷件
      机械翻译，生成件零逻辑统一承载；已通 c4_fact_e831084c 实跑验证）；
      假说轨 C3 翻译 MVP=MOD-BT-190 hypothesis_translator（E2 过审假说→本地 LLM 结构化
      翻译为因子表达式，公式化子集+阴性如实入档+表达式去重+纠错重试，translated_manifest
      台账；两段式机制门已入 C2 挖矿=MOD-BT-158 build_mechanism_prompt）；E2→E3 排产流转
      =factory_intake_pipeline construct 子命令（过审公式候选自动生成考卷件
      +constructed_manifest）；四车道 E2 预审常态化=run 已扩全台账消费；
      E4 分布预测双标准考尺=MOD-BT-194 distribution_forecast_eval（PIT+锐度+pinball，
      车道 E/Kronos 通用）；图谱增补 P0=MOD-BT-193 graph_enrich_staging（新闻→LLM 抽取
      供应链关系→暂存台账，绝不写 ig_fact 正图，入图需 Owner 审核另批）；
