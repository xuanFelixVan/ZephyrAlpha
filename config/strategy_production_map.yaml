      归因回灌 E2 假说库完成价值链闭环。因果出处=Owner 2025-09 决策树第 8 层；
      已建引擎=MOD-PF-007 绩效归因（Brinson-Fachler 三因子+因子归因+风险归因复用
      MOD-RK-16，813 行有 risk 域消费端）；IS 分解决策时间戳 FIELD-GAP 未落+
      影子组合工作流未建=partial 非 built；2026-09-27 st-chief4x-e8e9-20260927 推进：
      IS 分解决策时间戳已落字段级链（CTR-P1-007 V2 扩展 decision_timestamp+codegen+
      execution_report DDL 列+producer 写入点=Order.created_at；线上表 ALTER 待 CH 迁移
      窗=施工单登记）；影子组合对照引擎已落（pf_core/core/shadow_portfolio.py，Perold
