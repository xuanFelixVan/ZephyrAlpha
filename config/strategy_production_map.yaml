    decision_question: 资金怎么在各策略 sleeve 之间分配和轮动？
    algo_note_zh: 多策略 sleeve 装配=Owner 既定"多策略赛马"方针的赛道本体；regime 切换
      选 sleeve（Markov/跳跃模型）+风险平价/等风险贡献权重+IC_IR 加权禁朴素等权+
      资金渐进爬坡（drawdown 控制）；组合数学=低相关 sleeve 合成 Sharpe 提升
      （0.5+0.7→0.85，bfinance）；因果出处=Owner 2025-09 决策树 2.1/2.4 层；
      已建算法件族=MOD-PA-002..024（多策略资金分配 MOD-PA-003/regime 元分配 MOD-PA-007
      消费 MOD-REGIME-001/风险预算 MOD-PA-022/回撤限额 MOD-PA-013/相关性闸 MOD-PA-004/
      三维筛选 MOD-PA-014/BMA 加权 MOD-PA-015，有 pf_core/signal 域消费端）；
      sleeve 装配落库+再平衡调度+TDM 组合流对接未闭环=partial 非 built；
      2026-09-27 st-chief4x-e8e9-20260927 推进：sleeve 语义落库已闭（PP-001 plan/条目/
      相位三件套入 alloc_budget_daily.batch_plan_json.sleeve，读面=SQL_SLEEVE_DAY_SLICE）；
      再平衡调度已闭（MOD-PF-003 挂 data scheduler pf_alloc_rebalance_check 05:45 巡检槽，
      只读+Advisory 告警，执行仍归 SIM_DAILY 事件正门）；TDM-F 地图 module_ref 九件全
      实证在盘、钱包额度消费已闭（sim_paper_ledger 读 allocated_capital），组合流运行时
      消费欠账仍归 TD 组=partial 维持
    compute_class: local
    data_refs: [c1_market.account_nav_daily]
    module_ref: MOD-PA-002..024
    build_status: partial
    design_refs:
      - regime-switching 动态因子分配 arxiv.org/html/2410.14841
      - 风险平价 AQR white paper aqr.com/-/media/AQR/Documents/Insights/White-Papers/Understanding-Risk-Parity.pdf
