# risk_register.yaml — 容量保障体系风险注册表（R1~R16）
# 对标蓝图 §14 风险与缓解 + 多轮盲点审计扩展
# 版本: 2.7.0 | 模块: MOD-INF-001

version: "2.7.0"
module_id: MOD-INF-001
last_review: "2026-05-07"

risks:
  - risk_id: R1
    severity: high
    description: "SQLite 并发写入瓶颈——多 AI session 同时写入导致 BUSY/排队阻塞"
    mitigation: "WAL 模式 + WAL checkpoint + backup checkpoint + 写缓冲队列"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "enable_wal_mode + perform_wal_checkpoint + backup_checkpoint"
    last_review: "2026-05-07"

  - risk_id: R2
    severity: high
    description: "跨模块死锁——多个 AI session 对同一组文件/DB 加锁顺序不一致导致循环等待"
    mitigation: "超时机制(30s) + 重试(3次) + 指数退避(1s/2s/4s) + 有序锁获取"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "DeadlockDetector"
    last_review: "2026-05-07"

  - risk_id: R3
    severity: high
    description: "容量瓶颈告警链路阻塞上游——告警发送慢导致主业务流程被拖累"
    mitigation: "fire-and-forget 异步 + ThreadPoolExecutor(max_workers=2) + queue.Queue(maxsize=100)"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "AlertLinkIsolator"
    last_review: "2026-05-07"

  - risk_id: R4
    severity: medium
    description: "Pydantic Schema 版本漂移——契约定义与运行时校验不一致"
    mitigation: "版本锁定 + ContractBus 双向校验 + schema_version 字段"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "SchemaVersionGuard"
    last_review: "2026-05-07"

  - risk_id: R5
    severity: medium
    description: "Token 预估严重失准——Pre-flight 预估与实际消耗偏差过大导致预算溢出"
    mitigation: "多模型校准 + 滚动窗口修正 + 实际/预估比率监控"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "TokenCalibration"
    last_review: "2026-05-07"

  - risk_id: R6
    severity: medium
    description: "Kill Switch 误触发——单一条件触发导致系统不必要地停止工作"
    mitigation: "多条件 AND 判定 + 脉冲过滤(持续>30s) + 手动覆盖"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "KillSwitchSafeguard"
    last_review: "2026-05-07"

  - risk_id: R7
    severity: low
    description: "Sandbox 逃逸——沙箱进程突破资源限制访问宿主机资源"
    mitigation: "资源限制硬边界 + 超时强制 kill + 能力审计"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "SandboxHardener"
    last_review: "2026-05-07"

  - risk_id: R8
    severity: very_low
    description: "AI 审计守卫绕过——AI 通过间接路径绕过 Provenance 记录"
    mitigation: "只追加表 + hash 链 + 定期完整性校验"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "ProvenanceIntegrityChecker"
    last_review: "2026-05-07"

  - risk_id: R9
    severity: medium
    description: "hash 链校验性能退化——大文件 hash 计算随 Provenance 增长而退化（盲点 #14）"
    mitigation: "增量 hash + 分段校验 + 异步后台校验"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "incremental_hash_verify"
    last_review: "2026-05-07"

  - risk_id: R10
    severity: medium
    description: "Token 预估模型白盒包裹风险——AI 构造特殊 input 格式导致预估失败（盲点 #15）"
    mitigation: "输入模式白名单 + 异常格式拒绝 + fallback 保守预估"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "input_pattern_whitelist"
    last_review: "2026-05-07"

  - risk_id: R11
    severity: medium
    description: "Kill Switch 双通道竞态——环境变量 + 文件信号并写竞态（盲点 #16）"
    mitigation: "文件信号优先 + 环境变量降级为缓存 + 写前锁"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "kill_switch_channel_arbiter"
    last_review: "2026-05-07"

  - risk_id: R12
    severity: high
    description: "累计 Error Budget 消耗不变式破坏——Δ=累计-Σ分窗口，|Δ|>1% 未被检测（盲点 #26）"
    mitigation: "跨窗口一致性校验 + 定期 reconciliation + 异常告警"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "error_budget_reconciler"
    last_review: "2026-05-07"

  - risk_id: R13
    severity: low
    description: "SLO 配置泄露到应用日志——敏感阈值信息通过 structlog 泄露（盲点 #38）"
    mitigation: "配置字段分级 + PII/敏感字段 mask + 日志级别控制"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "slo_config_sanitizer"
    last_review: "2026-05-07"

  - risk_id: R14
    severity: high
    description: "多 Batch 迁移中 ContractBus 崩溃恢复失败——部分契约已迁移、部分未迁移的中间态（盲点 #49）"
    mitigation: "迁移原子性 + checkpoint + 幂等重放"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "migration_crash_recovery"
    last_review: "2026-05-07"

  - risk_id: R15
    severity: medium
    description: "wchar_t 路径匹配失败——Windows Unicode 路径与 ASCII 路径不一致（盲点 #65）"
    mitigation: "路径规范化 + Unicode 归一化(NFC) + 大小写不敏感比较"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "unicode_path_normalizer"
    last_review: "2026-05-07"

  - risk_id: R16
    severity: medium
    description: "ChromaDB 线程池泄漏——长期运行后线程数持续增长（盲点 #66）"
    mitigation: "线程池定期回收 + max_workers 硬上限 + 线程泄漏监控"
    status: mitigated
    owner: ZephyrAlpha-Owner
    handler: "chromadb_thread_guard"
    last_review: "2026-05-07"

  - risk_id: R17
    severity: medium
    description: "Asset Inventory 自身成为孤儿——unified_asset_index.yaml 不包含盘点系统的扫描器/分类器条目，导致后续 AI session 不知道盘点系统存在"
    mitigation: "元盘点自检：每次生成索引后验证 src/zephyr/infra_ops/asset_inventory/ 全部模块均在 active 列表中 + Phase Manager gate_asset_inventory 阻断"
    status: identified
    owner: ZephyrAlpha-Owner
    handler: "meta_inventory_self_check"
    last_review: "2026-05-07"

  - risk_id: R18
    severity: high
    description: "24 个注册表中部分损坏导致对账全量失败——一个损坏注册表使整个对账管道崩溃，孤儿/幽灵/漂移全部漏检"
    mitigation: "per-registry try/except 隔离——损坏注册表跳过并标记 skip，其余 23 个正常对账。skip 列表写入 reconciliation-report 告警区"
    status: identified
    owner: ZephyrAlpha-Owner
    handler: "reconciler_per_registry_isolation"
    last_review: "2026-05-07"

  - risk_id: R19
    severity: medium
    description: "资产膨胀到 1500+ 后全量扫描 SHA256 计算耗尽其 Token/时间预算——每次扫描 > 2 分钟导致 Pipeline 超时 + 影响并行 AI session 的 IDE 性能"
    mitigation: "增量扫描模式（只扫 mtime > last_scan） + max_workers 降为 4（低优模式） + SHA256 计算延迟到后台异步队列"
    status: identified
    owner: ZephyrAlpha-Owner
    handler: "incremental_scan_fallback"
    last_review: "2026-05-07"

  - risk_id: R20
    severity: critical
    description: "元盘点逼近极限——盘点器代码的 sha256 在 unified_asset_index.yaml 中不一致但没有第三方独立验证。如果盘点器自身被篡改，整个资产索引不可信。这是六阶递归的第六阶问题：信任锚在哪？"
    mitigation: "三重信任锚：(1) Git——盘点器源码在 Git 中不可篡改，每次运行前检查 git status 是否 clean。(2) pytest——全量测试通过 = 功能正常。(3) MOD-INF-020 审计日志——盘点器自身的状态变更链在审计日志中可追溯。三重一致 = trust anchor。"
    status: identified
    owner: ZephyrAlpha-Owner
    handler: "triple_trust_anchor_gate"
    last_review: "2026-05-07"

  - risk_id: R21
    severity: high
    description: "Schema 迁移失败导致 unified_asset_index.yaml 损坏——当一个自动迁移脚本在某版本遇到意外数据格式时崩溃，索引文件将处于不可用状态，阻断所有依赖盘点系统的检查/对账/仪表盘。最坏情况：Git 回滚后版本不匹配，再次触发同样崩溃——死循环。"
    mitigation: "(1) 迁移前自动创建 .bak 备份（snapshot dir, 30 份保留）。(2) 迁移脚本 inside try/except——任何异常 → 回滚备份，index 保持旧版本，写入告警日志。(3) AUTOMIGRATE 前 schema_version 校验——不匹配时跳过迁移而不是强制运行。(4) --from-scratch bootstrap 作为最终逃生舱——放弃迁移，从零重建。"
    status: identified
    owner: ZephyrAlpha-Owner
    handler: "schema_migration_safeguard"
    last_review: "2026-05-07"
