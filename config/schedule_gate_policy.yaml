# =============================================================================
# schedule_gate_policy.yaml — L5 排产段门闸与配额常量层（尺子=治理层资产，AI 层不持尺）
# =============================================================================
# 真源设计稿: docs/_working/ai_layer_vision/L5_schedule_gate/DESIGN.md §2.2(D-L5-03)/§2.5(D-L5-06)/§2.6(D-L5-07)/§2.7
# BLUEPRINT : MOD-INF-037 | docs/03_modules/_domain_governance/registry_governance/blueprint.md | §ai_layer_scheduling
# ROOR 挂接 : 排班族（registry_of_registries.yaml 登记由主会话统一执行，ai_layer_vision/README.md §3 批次清单行）
# 净零声明  : 吸收成熟度门闸与配额四读数阈值（ai_layer_vision/README.md §3 台账行原文；本文件是
#             唯一 OBJ_R 管辖常量件，不建第二张排班表——排班一张真源裁定 README §1.6 不变）。
# 初值追认  : Owner 夜批授权原值生效（ai_layer_vision/README.md §3.5 L5-#1 已销项：按 DESIGN 提案
#             原值预注册生效，首轮数据后走 OBJ_R 提案修订）。逐值标注"设计定值非实测标定"者
#             均在 DESIGN §5.2 反省条款在案。
# 改动流程  : AI 提案 → 治理立案 → Owner 修标 → 重考历史（OBJ_R 四步流水线）；禁运行时改值。
# =============================================================================

policy_id: schedule_gate_policy_v1
ttl: permanent
design_source: docs/_working/ai_layer_vision/L5_schedule_gate/DESIGN.md

# -----------------------------------------------------------------------------
# 区域成熟度门闸 M1-M4（§2.2 D-L5-03，T0 门闸；全部初值=设计定值，OBJ_R 盘点后修订）
# -----------------------------------------------------------------------------
maturity:
  m1_min_wins: 2                 # 区域 win 计数下限（单胜不开闸，防噪声单点）；win_starred 计入 win
  m2_min_win_rate: 0.60          # 对比胜率线 win/(win+loss)；draw 不计分母
  m2_min_samples: 3              # M2 样本下限 N_total=win+loss
  m3_freshness_max_days: 90      # 最新 experiment archived_at 距今上限；超龄区域计数清零重攒（陈旧胜利不开门）
  # ── Owner 区：首批区域白名单（M4 冷启动）──
  # L5-#2（治理立案保留项）：首批清单须 Owner 点头后登记于此；本班按避让铁律只落结构置空。
  # 区域=候选卡/实验卡既有 domain_id 词表（不新造分类学）；自治运行满一季可按 OBJ_R 提案退役。
  m4_first_batch_whitelist: [ai_eng, tooling]  # 首批=Owner 2026-09-30 夜 F 组令 F5 批（裁定#450）；保守口径=低爆炸半径且有卡证据域（ai_eng 3 卡/tooling 1 卡）；trading_algo=资金面显式排除，data_eng/cost_eng 无卡证据不入批


# -----------------------------------------------------------------------------
# 排产优先级：进化量尺两问打分法（§2.5 D-L5-06）
# score = labor_segments × advantage_bucket × demote (+ 防饥饿 bump)
# -----------------------------------------------------------------------------
priority:
  labor_segments_max: 4          # 两问①消灭人工段数上限（1-4 计数封顶）
  advantage_buckets:             # 两问②对比优势幅度分桶（L4 evidence_pack significance）
    large: 2.0
    medium: 1.5
    small: 1.0
  advantage_bucket_lines:        # 分桶线（significance≥线取高档；设计定值初值，首轮数据后 OBJ_R 修订）
    large_min: 0.20              # significance ≥ 0.20 → large 桶
    medium_min: 0.10             # 0.10 ≤ significance < 0.20 → medium 桶；<0.10 或缺失 → small（保守）
  starred_demote_factor: 0.5     # 带星胜 win*（L4 公平性）降权且排同分队尾
  starvation_age_days: 7         # 防饥饿：pending 龄超过此天数
  starvation_bump: 1.0           # 一次性 +1.0 bump

# -----------------------------------------------------------------------------
# 配额四读数与降级线（§2.6 D-L5-07；配额上限=Owner 定（主文档 §五），此处登记初值）
# -----------------------------------------------------------------------------
quota:
  q1_active_session_cap: 2       # Q1 活跃施工会话数上限=并发槽（主文档 §3.4 子代理槽 2-3 下沿；设计定值）
  q2_subagent_max: 3             # Q2 单工单 subagent 配额上限（DESIGN §2.1 budget.subagent_quota ≤3）
  q3_daily_token_budget: 3000000 # Q3 当日 token 预算线（cost_tracker usage_records 日累计；设计定值初值）
  q3_demote_tier_from: strong    # Q3 超线降档起点（仅限施工段；验收 reviewer 恒 strong 不可降）
  q3_demote_tier_to: flash       # 降档终点档
  q4_commit_queue_pending_cap: 10 # Q4 提交带宽：commit_queue pending 深度上限（超=暂停新派工）
  defer_critical_streak: 3       # 同一工单连续 defer 次数→堵点本 CRITICAL（对标 belt _ENV_ABORT_ESCALATE=3）
  dead_dispatch_fail_n: 3        # dead 进入判据：连续 N 次派工失败（N 初值 3，设计定值——进 OBJ_R 阈值盘点）
  dead_mech_check_fail_n: 3      # dead 进入判据：任务书机检连续三次不过（同上，OBJ_R 盘点）
  held_incomplete_stale_days: 7  # held_incomplete 超期→堵点本（DESIGN §2.7；设计定值初值）

# -----------------------------------------------------------------------------
# E0 算力档与排班种子词表（§2.3 D-L5-04；引用不复制——真源锚定，两处同批改口径不分叉）
# -----------------------------------------------------------------------------
compute_classes:
  e0_class_to_resource:          # E0 四值词表→registry resource_class（真源=generate_resource_profile_registry.py
                                 # E0_CLASS_TO_RESOURCE 同层映射；禁自造第五值）
    local: light                 # 施工段：AI 会话改码+本地轻量 tests（E0 永远放行 REASON_ALLOW_LIGHT）
    local_gpu: cpu_heavy         # 验收段：C4 双窗批测/DSR/门禁重放（受闸四类）
    mixed: cpu_heavy
    api: llm_api_paid            # API 评分：免 E0 但免不了配额（定调 #10）
  # 验收段语义档（GPU 推理/CH 大重放直接用 registry 既有档）：
  acceptance_extra_classes: [llm_api_local, db_heavy]
  trading_sensitive_classes: [cpu_heavy, gpu, llm_api_local, db_heavy]  # 真源=generate_resource_profile_registry.py
                                 # TRADING_SENSITIVE_CLASSES（引用不复制；trading_sensitive 推导基，禁手填）
  pool_vocabulary_lanes: [default, heavy, intraday_minute, intraday_sector, realtime]
                                 # 真源=DataScheduler executor 词表（幽灵池禁令：禁 light；禁 cpu/gpu 空间维值作泳道）
  exclusive_group_vocabulary: [ch_bulk_write, tick_drain, mine_vs_exam, repair_passport, gpu_default, llm_local, machine_blackout]
                                 # 真源=resource_profile_registry.yaml groups 段
  seg_vocabulary: [build, accept] # 工单分段：施工段 build / 验收段 accept（种子 task_id 后缀词表）

# -----------------------------------------------------------------------------
# 工单状态机与派工（§2.1/§2.7；状态枚举=C2 DDL CHECK 同表，测试护栏对齐）
# -----------------------------------------------------------------------------
dispatch:
  schema_version: '0.1'          # 任务书附录 A schema v0
  reviewer_model_tier: strong    # 验收独立复核档（不可降档；异会话异档机检）
  order_id_prefix: WO            # 工单号格式 WO-YYYYMMDD-NNN
  timebox_by_class_hours:        # budget.timebox 按对象类常数（设计定值初值）
    light: 4
    cpu_heavy: 12
    llm_api_local: 8
    llm_api_paid: 4
    db_heavy: 12
    gpu: 12                       # GPU 训练/网格批时箱（w3_w5_precheck §2.3：无 gpu 键=GPU 批排产面不可见不受管，缺口治本 2026-09-24 st-gpu-final；与 search_space_prereg budget_caps.single_job_wall_clock_cap_hours 同值）
  max_commits: 20                # budget.max_commits 上限（设计定值初值）
  bottleneck_alert_min_lines: 20     # 堵点本告警阈值（复用 belt 语义，引用不复制）
  bottleneck_alert_oldest_hours: 24  # 同上（最老条目 >24h）

# -----------------------------------------------------------------------------
# 工单状态枚举（§2.7 红蓝 R1-B10 补全；与 C2 DDL CHECK 约束同表驱动——改一处必改两处）
# -----------------------------------------------------------------------------
order_states: [pending, held_maturity, held_incomplete, dispatched, deferred, done, dead]

# -----------------------------------------------------------------------------
# Owner 点头记录位（C1 验收标准；逐项登记拍板时间与通道）
# -----------------------------------------------------------------------------
owner_signoff:
  policy_initial_values:
    status: approved_by_night_batch   # L5-#1 已销项（ai_layer_vision/README.md §3.5）：夜批授权原值生效
    decided_at: '2026-09-17'
    channel: ai_layer_vision README §3.5 已销项表
    revisit: 首轮运行数据后走 OBJ_R 提案修订
  first_batch_whitelist:
    status: approved_by_night_batch  # L5-#2 已销项：Owner 2026-09-30 夜第二夜总攻 F 组令 F5 批（登记面=裁定#450）
    decided_at: '2026-09-30'
    channel: F 组挖矿后执行令（st-nightsweep2-nf-20260930 执行）；批准链=Owner 当夜指令原文
    revisit: 自治满一季可按 OBJ_R 提案退役
