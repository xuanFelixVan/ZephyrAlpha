# =============================================================================
# 期望门控+信号告警承载册（R-M1-06 逐引擎接线收口台 / F04 清洗三引擎 P0 断链闭环段）
# 真源消费者: src/zephyr/data/cleaning_expectation_hosting.py（zephyr.data.cleaning_expectation_hosting）
#   —— 本册是 expectation_governance 期望套件与 data_anomaly_alerter 信号检出的判据/代价
#      **唯一真源**；代码侧禁写任何阈值/窗口/限额/期望参数（宪法硬规则 6 RULE-SSOT）。
#      判据值改这里即改行为，红测=tests/zephyr/data/test_cleaning_expectation_hosting.py
# =============================================================================
# 出生史与必要性：
#   expectation_governance（期望套件门控，F04 案卷第四件）与 data_anomaly_alerter（信号
#   分级+抑制+路由）自晋升批起零生产调用点（wiring_C_cleaning.md §七"未完=如实报红"；
#   cleaning_anomaly_hosting.ENGINE_SLOTS_RESERVED 在案）。本册补最后两台插座，接线点=
#   同一条 L13 data_supply_sentinel 排班腿的**托管第四段**（前例：quality_sweep 第一段/
#   cleaning_rules_hosting 第二段/cleaning_anomaly_hosting 第三段），不新建平行管线、
#   不新开排班槽位（R-021）。两台引擎统一走 cleaning_engines 门面派发（其头注声明的
#   "F04 C1 解锁后的接线方"即本腿）。
#
# 判据册语义（F04 案卷"expectation_governance 判据册 suite YAML 零在盘"缺口的落地）：
#   expectations 块=suite 语义（type/column/params/severity 四键面，引擎真源
#   zephyr.data/data_eng/expectation_governance.py；类型五样=schema/not_null/range/
#   distribution/freshness；严重级别三档=block/degrade/warn——本读侧腿三档一律只计入
#   findings 并出声，不执法）。代码侧类型/级别白名单=引擎契约面非判据值。
#
# 读侧 flag 档（出厂态，"新能力默认不改变既有产出"）：本腿只 SELECT+validate/detect 出
#   报告与告警；不写库、不剔行、不改 ch_writer 写路径、不调任何修复。关停用
#   data/runtime/cleaning_expectation.disabled 标记文件（每次触发实查，即时生效）。
#
# 引擎面台账（本批宣告，普查对账锚）：R-M1-06 四台至此全接——cleaning_rule_engine
#   （2026-09-26 第二段）/cleaning_anomaly_engine（2026-09-28 第三段）/
#   expectation_governance+data_anomaly_alerter（2026-10-01 本腿第四段）。
#   purity_adjudicator（AI 判净）不属四台台账：#423 形态锁 standing_by_no_auto_feed，
#   LLM 花钱点=Owner 门（model_routing_policy purity_adjudication 轨已备），预留≠断链。
#
# 检测路覆盖披露（诚实边界，普查对账以本宣告为准）：
#   - data_anomaly_alerter 四路中本腿喂 price_jump（常喂）+missing_rate（targets 声明
#     expected_rows>0 才喂，期望行数无真源时不硬造）；divergence 路不喂——信号 metric=
#     带符号相关系数与引擎 grade() 的 ratio=metric/threshold 判据不相容（负值信号进
#     grade 即 ZA-DATENG-0001），量能维度已由第三段 volume_spike 覆盖；cross-source 路
#     不喂——已由 cross_validation 槽（23:15）承担。
#   - 引擎 AL-P1~P4 分级→Alerter 通道级别映射真源=data_anomaly_alerter 引擎自带，
#     本册不管分级（禁双真源）；merge_window 抑制窗=引擎默认 3600s（cleaning_engines
#     门面派发口径），日批腿内同键合并在册外、跨批实例重建=引擎语义，如实披露。
#
# 键面纪律：wiring/alerter/targets 键集由 hosting 模块 dataclass 字段派生校验，
#   **未知键=配置错上抛**（拼错键=检查静默空转——同族 _reject_unknown_keys 先例）。
#   加新键必须先让代码读它。
schema_version: 1

wiring:
  # 总闸：false=本腿跳过（台账 not_run，不参与宿主结论）
  enabled: true
  # 宿主排班槽位（登记用途，供普查器对账；实调宿主不符=配置错 fail-closed）
  host_schedule: data_supply_sentinel
  # 节奏闸（天）：距上次报告不足 cadence_days 即跳过（按报告日期自愈节流）
  cadence_days: 1
  # 表级样本行数上限（读侧安全阀一，禁无界 SELECT）
  read_limit_rows: 2000
  # 单标的序列行数上限（读侧安全阀二）
  rows_per_symbol: 60
  # 单批标的数上限（读侧安全阀三；样本内 DISTINCT 符号按名序取前 N）
  watchlist_size: 10
  # 本腿自身告警级别（Alerter 口径：info/warn/error/critical）——出厂 warn=只出声不阻断。
  # 引擎信号分级路由级别（AL-P1~P4→CRITICAL/ERROR/WARN/INFO）由引擎自带，不归本册
  alert_level: warn
  report_dir: data/cleaning_expectation_gate
  disabled_flag: data/runtime/cleaning_expectation.disabled

alerter:
  # 信号检出判据值（真源=检测器参数语义，src/zephyr/data_eng/data_anomaly_alerter.py；
  # 改这里即改检出行为，代码零判据值）
  z_threshold: 4.0        # 末日对数收益相对滚动窗的 |z| 达此值判价格跳变
  window: 20              # 滚动窗口（根）；序列不足 window+2 根=short_series 跳过并披露
  missing_warn: 0.05      # 缺失率告警阈（仅 targets.expected_rows>0 的表生效）

expectations:
  # 期望套件（type/column/params/severity；引擎语义真源=expectation_governance）。
  # 病灶同源口径：daily_valuation 曾有 FINAL 259,238 行 close/amount 全 0 的 D 型错数
  # （2026-09-18 实测），not_null+正值域两期望正对该病灶。
  - type: not_null
    column: close
    severity: warn
  - type: range
    column: close
    params: {min: 0}
    severity: warn
  # 时效腿（与 supply_sentinel 表级 max(date) 停更检测同域不同尺：本尺=样本新鲜龄期
  # 小时数，那尺=业务日滞后天数；w5_1 同域不同粒度不并）。上海业务日列配引擎本地钟。
  - type: freshness
    column: trade_date
    params: {max_age_hours: 48}
    severity: warn

targets:
  - table: c1_market.daily_valuation
    date_col: trade_date
    symbol_col: symbol
    lookback_days: 30
    # frame_cols=信号腿序列列（price_jump 喂 close；volume 备未来 divergence 相容修复）
    frame_cols: [close, volume]
    # check_cols=期望腿校验列（样本进取数面；期望列不在面内=uncovered 如实披露非"干净"）
    check_cols: [close]
    # expected_rows>0 喂 missing_rate 路：单标的近窗期望行数（A 股月度交易日量级口径，
    # 缺失率=1-actual/expected；0=不喂，禁硬造期望值）
    expected_rows: 20
