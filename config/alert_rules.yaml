# config/alert_rules.yaml — System Telemetry Alert Rules
# version: 0.1.0 (scaffold)
#
# 本文件定义所有告警规则：触发条件、严重级别、通知目标、静默窗口。
# 由 TelemetryFacade.alerting 子系统在每次指标采集后评估。

version: "0.1.0"
module_id: MOD-INF-015
last_updated: "2026_05_08"

rules:
  - id: ALERT-SYS-001
    name: "high_cpu_usage"
    severity: warning
    metric: "system.cpu_percent"
    condition: "> 80"
    duration: "5m"
    description: "CPU使用率持续超过80%"
    notify: ["dashboard"]
    silence_window: "10m"

  # 供给线（治理战役 A2，2026-09-16）：zephyr.infrastructure.system_telemetry.alerts.ops_alert_feed
  # 每 30s 以项目衍生进程 RSS 生产本指标；critical 触发 → 通知板（.runtime/ops_notifications/）
  # → api_server GET /api/ops-notifications → 前端 promotion 页横幅（通知唯一出口，2026-09-15 裁定）。
  # 旧 notify 目标 "fle"（飞书）已随 2026-09-15 裁撤批从全部规则移除。
  - id: ALERT-SYS-002
    name: "oom_risk"
    severity: critical
    metric: "system.memory_rss_bytes"
    condition: "> 8589934592"
    duration: "1m"
    description: "内存即将耗尽（>8GB RSS）"
    notify: ["dashboard"]
    silence_window: "5m"

  # 全系统水位真闸（全流通战役 BRK-066，2026-09-18，生产者=
  # zephyr.infrastructure.capacity_assurance.host_resource_governor.check_system_watermark，
  # 由 process_reaper 每 10min 心跳驱动）。与 ALERT-SYS-002 的口径区别：002 是"项目自身
  # 进程树 RSS"（9-15 孤儿 llama-server 事故线），下面三条是**主机整机面**——本仓 16 路并发
  # 曾把 20 核打到 99%、RAM 可用从 32GB 掉到 17.6GB，而旧 host_resource_governor.probe()
  # 是恒返 12.5%/OK 的硬编码假通道（已治本为实探）。阈值取战役实测水位线，非拍脑袋：
  # 12GB = 各车道自守推迟重活的既有线（COORDINATION_LEDGER 资源自守协议），90% = 页面文件
  # 扩容待重启期间的保守线。
  - id: ALERT-SYS-003
    name: "commit_charge_exhaustion"
    severity: critical
    metric: "system.commit_mem_pct"
    condition: "> 90"
    duration: "5m"
    description: "Windows 提交内存(commit charge)超 90%，进程即将无法申请内存（提交流程/pytest 会静默崩）"
    notify: ["dashboard"]
    silence_window: "10m"

  - id: ALERT-SYS-004
    name: "ram_available_low"
    severity: critical
    metric: "system.mem_avail_gb"
    condition: "< 12"
    duration: "5m"
    description: "整机物理内存可用不足 12GB（车道自守线，超线应推迟并发重活）"
    notify: ["dashboard"]
    silence_window: "10m"

  - id: ALERT-SYS-005
    name: "ram_used_high"
    severity: warning
    metric: "system.mem_used_pct"
    condition: "> 85"
    duration: "5m"
    description: "整机物理内存使用率超 85%"
    notify: ["dashboard"]
    silence_window: "10m"

  - id: ALERT-DB-001
    name: "slow_queries"
    severity: warning
    metric: "db.query_latency_ms"
    condition: "> 5000"
    duration: "3m"
    description: "数据库查询延迟超过5秒"
    notify: ["dashboard"]
    silence_window: "15m"

  - id: ALERT-TELE-001
    name: "telemetry_buffer_full"
    severity: warning
    metric: "telemetry.buffer_depth_percent"
    condition: "> 80"
    duration: "30s"
    description: "遥测buffer接近满载，触发backpressure"
    notify: ["dashboard"]
    silence_window: "5m"

  - id: ALERT-TELE-002
    name: "schema_rejection_spike"
    severity: warning
    metric: "telemetry.schema_rejection_rate"
    condition: "> 0.05"
    duration: "1m"
    description: "Schema校验拒绝率超过5%，可能有未注册指标"
    notify: ["dashboard"]
    silence_window: "10m"

  - id: ALERT-MCP-001
    name: "mcp_rate_limit_rejection_spike"
    severity: warning
    metric: "mcp.rate_limit.rejected"
    condition: "> 100"
    duration: "5m"
    description: "MCP Gateway 限流拒绝计数 5 分钟内超过 100——可能存在配额耗尽或异常客户端（5.36.10）"
    notify: ["dashboard"]
    silence_window: "10m"

  # ── 90 号 Phase2 项（#16 生存线监控，2026-08-19 AI-NIGHT-001 施工）──
  # 裁定真源 90_methodology_open_questions.md §16：生存线=滚动12月超额>0 且 MaxDD<15% 且 Sharpe≥0.8；
  # 失败=连续6月亏损/回撤>25%。健康/卓越线配置占位，实盘 6-12 月校准后启用。
  # 评估模块 zephyr.risk.core.survival_line_monitor（testing 态，告警发射接线挂起待 Owner）。
  - id: ALERT-KPI-001
    name: "survival_line_breach"
    severity: critical
    metric: "kpi.survival_line.status"
    condition: "== survival_breach"
    duration: "1d"
    description: "破生存线（滚动12月超额≤0 或 MaxDD≥15% 或 Sharpe<0.8）→降仓/关停评估"
    notify: ["dashboard", "escalation"]
    silence_window: "1d"

  - id: ALERT-KPI-002
    name: "survival_line_failure"
    severity: critical
    metric: "kpi.survival_line.status"
    condition: "== failure"
    duration: "1d"
    description: "触失败指标（连续6个月亏损或回撤>25%，对齐4级Protocol Level4）→失败处置"
    notify: ["dashboard", "escalation"]
    silence_window: "1d"

  # ── 64号 Q8 项（CH parts 防爆炸，2026-08-20 AI-NIGHT-001 施工）──
  # 裁定真源 64_data_source_download_spec.md §16.2 Q8：2026-07-09 parts 爆炸致 CH merge 满载崩溃事故教训。
  # 探测函数 zephyr.data.ch_parts_monitor.check_parts_threshold（system.parts active=1 按表聚合）。
  - id: ALERT-CH-001
    name: "ch_data_parts_explosion"
    severity: critical
    metric: "clickhouse.table_active_parts"
    condition: "> 100"
    duration: "5m"
    description: "单表 active data parts 超过 100（防 2026-07-09 parts 爆炸致 CH merge 崩溃重演）"
    notify: ["dashboard", "escalation"]
    silence_window: "30m"
