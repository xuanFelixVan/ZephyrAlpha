# F15 Auto Fix Cron 配置文件
# DM-202510: cron定时启动配置

# 修复器类型
action_type: drift_fixer

# 修复目标列表(空列表表示无目标)
targets: []

# 调度配置(供crontab参考,脚本本身不解析)
# DEPRECATED (2026-07-05 审计 AI-02): 本文件的 schedule 字段违反 RULE-FIFTEEN
#   （禁止时间触发，仅用事件驱动 + CI 批量兜底）。
#   迁移方向：drift_detected 事件订阅（boot_hooks）或 CI schedule job 兜底。
schedule:
  # 每30分钟执行一次
  interval_minutes: 30
  # 每日最大执行次数(由FixBudget强制)
  max_daily_runs: 5
  status: deprecated
  migration_target: "drift_detected event subscription (boot_hooks) or CI schedule job"

# 日志配置
logging:
  level: INFO
  dir: logs/auto_fix
  retention_days: 7

# 安全配置
safety:
  # dry_run模式(仅模拟)
  dry_run: false
  # warn_only模式(仅警告不退出)
  warn_only: false
  # 单实例锁文件
  lock_file: "%TEMP%/zephyr_auto_fix_cron.lock"
