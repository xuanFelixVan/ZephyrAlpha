# ZephyrAlpha — Error Budget 五级响应 + Burn Rate 多窗口配置
# 真源：蓝图 MOD-INF-001 §5.2 DD-10
# 版本：v2.6.0

module_id: MOD-INF-001
config_version: "2.6.0"

slo_target: 0.999
error_budget_total: 0.001

multi_window_burn_rate:
  windows:
    - name: "1h"
      seconds: 3600
      thresholds:
        L1_WARNING: 1.0
        L4_EMERGENCY: 14.4
    - name: "6h"
      seconds: 21600
      thresholds:
        L1_WARNING: 1.0
        L3_CRITICAL: 5.0
    - name: "3d"
      seconds: 259200
      thresholds:
        L1_WARNING: 1.0
        L2_CAUTIOUS: 3.0
    - name: "30d"
      seconds: 2592000
      thresholds:
        L1_WARNING: 1.0
        L2_CAUTIOUS: 2.0

five_tier_response:
  L0_HEALTHY:
    description: "所有指标正常"
    action: "监控模式"
    auto: true
  L1_WARNING:
    description: "个别指标接近阈值"
    action: "通知 Owner + 记录"
    auto: true
  L2_CAUTIOUS:
    description: "Error Budget 快速消耗"
    action: "启动限流 + Token Budget 消耗加速限制"
    auto: true
  L3_CRITICAL:
    description: "多项指标超阈值"
    action: "自动降级 + 非关键模块延迟调度"
    auto: true
  L4_EMERGENCY:
    description: "系统濒临崩溃"
    action: "Kill Switch + 飞书告警"
    auto: true

recovery_cooldowns:
  L4_to_L3_seconds: 21600
  L3_to_L2_seconds: 86400

pulse_filter:
  enabled: true
  minimum_duration_seconds: 60
