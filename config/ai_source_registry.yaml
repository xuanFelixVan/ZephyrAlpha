# 治理轨三闸（DESIGN §2.1 定调 10 落点，配额真源=本文件）
quota_governance:
  total_daily_cap: 40            # ②总量闸：全注册表每日进漏斗候选 ≤40
  per_source_floor: 1            # ③贫矿降级闸底线：quota 禁清零（多样性保底）
  demotion:
    pass_rate_below: 0.05        # 入考率 <5%（消费 L2 V3 ai_intake_kpi_weekly）
    weeks_2: quota_halve         # 连续 2 周 → 配额减半
    weeks_4: quota_to_longtail   # 连续 4 周 → quota=1 移长尾（禁清零）

