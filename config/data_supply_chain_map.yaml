  INV-1：节点只存标识符与指针（task_id/槽名/MOD-*/文件路径/表名），禁复制真源条目正文。

  字段分层（六图终局卷 §1 裁定一）：L0 统一名 note_zh/doc_refs/source_anchors/data_refs/store_refs/runtime_refs/module_id/module_ref/build_status/confidence/verified_scope/decision_question/node_type/segment；L1
  纵轴层取用 slot_source/slot_refs/wiring_status/downstream_action/fallback/invalidation/gap_refs/red_reason/purpose_tag/casebooks/trigger_facts/consumers（后四者=挂图
  SOP §4 新增标准字段，schema 0.3 起入菜单；gap 节点挂四字段合法且 module_id 保持 null——gap 格常是『在等的消费方』与『缺口病历』的合法宿主）；L2 图12 专属层字段清单=task_family（任务归簇）/facets（分面腿）/gaps（叶层缺陷台账：anchor+symptom+pointer+实测时点，是
  gap_refs 的明细面）/freshness_evidence（max(date)+近窗计数+滞后交易日数+通道+verdict+FINAL 双版）。

  trigger_facts 与 freshness_evidence 的关系（同语义必同名裁定一）：trigger_facts=L1 汇总位（dict：as_of+evidence+计数域按节点自选），freshness_evidence=L2
  数据域明细（max(date)/近窗/滞后交易日）——前者汇总后者，禁在 trigger_facts 里重复 freshness 明细字段。

  blood_stage 口径：f1_pending=血肉四字段未填（validator 降 warn 不拦）；f2_done=血肉满（非 gap 节点缺 purpose_tag/四字段键缺=error；production 节点 trigger_facts
  必非空）。三个旧注解别名与 degradation/data_anchors/silent_failover/detection_only 等旧名一律废止，残留即 CV-L0 红。

  双轴口径（六图终局卷 §3）：verified_scope=production ⇔ 骨架 §1 行级 ✅（本批 10 个，多了算谎少了算欠），structure=仅结构性事实已核（含 3 个分面行与 ⬜/🔨 行）；分面行永不成 production（行级
  ✅ 仅当全腿 ✅）。

  本图与横向 dataflowgraph（血缘轴）是同资产两轴，与图13（同一批 schedule.yaml 槽的时序轴）共享真源、分界引用：判据一句话=这条边是否关于数据本身的产出/新鲜/保全/修复。'
laws:
- INV-1 引用不复制：环节节点只挂标识符与指针（task_id/槽名/表名/文件路径/MOD-*），禁抄真源条目正文
- 挂槽≠在跑：槽名存在不构成执行证据，判 wired 必同时拿到「槽有任务」或「scheduler 有分派分支」＋产出侧留痕
- 新鲜度主口径=业务表 max(date)＋近窗计数（UTC 折北京比对档期），max 只作旁证；system.parts 末写降为可选附加腿且失败必记 probe_failed
- 禁依赖 system.* 枚举面：09-25 实测一张坏表（187×0 字节部件）可打死 system.tables/parts/columns 全枚举面；探测失败必判红，禁把「查不到」写成「无问题」
- 静默失败即假绿：ch_reader/ch_writer query 失败返回空串不抛，凡空串一律复跑排除，禁把「读不到」读成「没缺口」；证据通道只认 DatabaseService 失败即抛版
- ReplacingMergeTree 判真值必带 FINAL 且双版并报；判重只走 check_tick_duplication 正门，禁聚合数判重（RULE-DATA-OPS）
- 不可逆动作三步验证（必要/真实/可逆），不可逆升 Owner 门位；冷库禁反向更新 CH（防双真源）
- 检测≠修复：downstream_action=detect_only/alert_only 的环节其结论无下游补跑通道时须登记为缺口（gaps/gap_refs）
- 环节枚举四源并存（tasks.yaml/schedule.yaml/scheduler 特殊槽/进程内在产写手），单源枚举结构性漏段；增枝须过停止判据三问+点名生产者类别+回写骨架 §1
- 行级 ✅ 仅当全腿 ✅：多腿环节以 facets 逐腿挂证据，任一整腿不 ✅ 则行级不 ✅ 且禁宣 production
