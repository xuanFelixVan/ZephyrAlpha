feedback_loops:
- from: D13-23
  to: D13-20
  note: intraday 相段序：PHASE_STAGES 实扫盘中族段序为 intraday_l1→classify→sentiment_loop→auction_hit，与本图环节编号（按墙钟时点排）逆向——段序契约边，非时点先后
- from: D13-02
  to: D13-01
  note: 断供→回补：哨兵检出档期错过后，修复腿让渡次日 05:30 档期对账（其 INVARIANTS 自陈只检测不修复）
- from: D13-38
  to: D13-35
  note: 巡检→补下载：23:00 只告警的行数缺口交给次日 17:00 行数视角补下载（三路兜底分工的第三条边）
- from: D13-44
  to: D13-01
  note: 日界交接回次日：T 日盘后状态移交 → T+1 日 05:30 重启（本图唯一的跨日闭环）
- from: D13-32
  to: D13-21
  note: 16:45 圈回头驱动盘中段（intraday 族唤醒词在自动圈内被伪造）——段界折叠，非时点先后
- from: D13-32
  to: D13-22
  note: 同上：归类段由 16:45 圈驱动，无独立盘中排班
- from: D13-32
  to: D13-23
  note: 同上：情绪环"有节拍席位无节拍"的机制来源——每交易日恰 1 拍且落在收盘后窗
- from: D13-32
  to: D13-20
  note: 同上且更硬：墙钟窗闸段在 16:45 圈恒窗外 → 自动驱动关系存在但产出恒为 skipped
- from: D13-32
  to: D13-09
  note: 盘前段盘后跑：盘前族段（含 T+1 预产腿）实跑在 16:45 圈，为次日窗先行产出（簿 07 溢出 E-3）
- from: D13-42
  to: D13-12
  note: 守护接缝：心跳陈旧则由计划任务重跑拉起腿——09:25 前必须活着是日序前置
