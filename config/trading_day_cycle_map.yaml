laws:
- 让渡一·时刻值不搬家：节点只存槽名/tn 名/entity_id/段名等稳定标识符，cron 字面量与执行器线程数零复制（骨架 §0.2 硬让渡 1）
- 让渡二·决策内容不进图：任何"怎么判"唯一出路是 tdm_refs 引 TDM 节点，本图节点禁带 judgment_basis/factor_refs/strategy_refs（骨架 §3 禁则一，违者=第二动作流程真源）
- 让渡三·管线内部结构不重画：有任务挂载的数据槽在本图只作批次节点（含有效挂载数与当日就绪判定），其源→库→衍生→冷备→对账内部结构归图 12，对账装配落点归 battle_map BM-REC-*（骨架 §0.2 硬让渡
  3）
- 槽位挂着≠真在跑：环节存在性判据=该时点的执行体是否被调用 + 该执行体产物表是否有行，禁以"槽 firing/APScheduler 记 success/表里有留痕"三点任一判绿（簿 04 §0.1、簿 06 假绿专段）
- 缺席必须记账：每环节须声明 ready_gate（本节点是否就绪门格）与 fallback（没跑谁接）；无兜底不许留空，须写 fallback="none:<理由>"；非就绪门格须写 no_ready_gate_reason_zh（骨架
  §1 门④，字段名一律取六图终局卷 §1 L1 统一名）
- 看着≠动手：每环节 downstream_action 必须区分自动补跑/仅告警/仅检测/仅编排/执行五态，检出即蒸发（无落盘无消费者）不得记为有兜底（簿 01 三哨兵总裁定、簿 09 3.3）
boundary:
- 不画下单/撤单执行流——归 TDM L4/X-S2（骨架 §1 边界）；本图只画"该时点必须发生什么"
- 不画因子与策略——归各库；本图节点无判据字段（让渡二）
- 不画数据管线内部结构（源→库→衍生→冷备→对账）——归图 12；本图批次节点只挂有效挂载计数与就绪判定
- 不画资源争抢与内存天花板——归排班三表（resource_profile_registry + schedule_overview + schedule_consistency_reconciler）；本图放弃"时刻值与资源档位"两项职责，只新增"时序与就绪"
- 不画治理夜班（C4Exam/ModelExam/GateFullTreeAudit 等 schtasks 族）——主体让渡 GOMAP，本图只留守护接缝三点（骨架 §2 D13-42）
- 不画开发时会话生命周期——归图 11；不画 24/7 三班制交接（shift_handover_checklist 面向连续市场，不覆盖 A 股日界，骨架 §2 D13-44 实证）
