  消费唯一入口=macro_regime_sensor.load_series_map；本表不含指标定义语义
  （发布纪律/市场影响等定义语义归 REG-MAC-001）。
owner: MOD-REGIME-MAC
version: 1.0.0
created: '2026-09-30'
last_updated: '2026-09-30'
unique_key: [indicator_id]
entry_count: 16

