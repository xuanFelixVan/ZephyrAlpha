# [A_config] module_id=MOD-REGIME-MAC | layer=config | stability=evolving | safety=L | ai_autonomy=ai_modifiable
# ============================================================================
# 宏观指标 ID ↔ 数据序列码映射表（R1 处方件，NB1-B5 复活车道 2026-09-30）
# 方向真源: docs/01_policies_and_standards/_registry/catalogs/macro_indicator_registry.yaml（REG-MAC-001，指标定义 SSoT）
# 消费真源: src/zephyr/regime/features/macro_regime_sensor.py（TDM-E-L1-S0 真消费模块，唯一读者）
# 数据通道: c1_market.macro_data（现值表，TableRegistry=market_macro_data）
#           c1_market.macro_data_vintage（PIT 存证，zephyr.data.macro_vintage.PIT_LATEST_SQL）
# ============================================================================
# 本表是"翻译层"铁律载体（宪法 §RULE-REGISTRY / NB1-B5 R1）：消费侧禁散落硬编码序列码，
#   一律经 macro_regime_sensor.load_series_map() 读取本表解析。
# 字段：
#   source        数据源通道（akshare/fred/eia/worldbank；=macro_data.data_source 列值域）
#   series_code   macro_data.indicator_name 精确值（采集腿产出名，改采集腿须同步本表）
#   series_role   primary=组内主序列 | aux=派生辅助序列（derive_scissors=M1-M2剪刀差）
#   unit          序列单位（与 macro_data.unit 对齐：% / 指数 / 亿元 / 人民币/美元 / 千人）
#   transform     取数后变换：level=直接用 | yoy=滚动12期和同比（流量类）| diff=一阶差分
#   direction     信号方向：positive=高分位=支撑 | inverse=高分位=压制 | neutral=背景变量不参与方向打分
#   seasonal_adjusted  上游是否季调（中国官方月度多为未季调，回测解读需自剔春节扰动）
#   status        wired=序列在库且已验证 | missing=序列缺（采集腿缺位，让路登记见 reliability_note）
#   freshness     本车道 2026-09-30 CH 实测核验快照（rows/last_obs；仅核验留痕，禁作运行时判据）
# 治理：
#   1. 新增/改映射 MUST 与采集腿产出名同批核对（macro_data.indicator_name 为唯一对齐键）。
#   2. missing 条目不删除——序列落地后改 status=wired 并回填 freshness（转正走 safe_write_text CAS）。
#   3. PIT 语义：as_of 回测取数走 vintage 通道（pub_ts<=as_of），现值读数仅限盘前 live 判定面。
# ============================================================================

ttl: permanent
schema_version: '1.0'
registry_id: MAP-MAC-SERIES-001
name: Macro Indicator Series Map
name_zh: 宏观指标序列映射表
description: >-
