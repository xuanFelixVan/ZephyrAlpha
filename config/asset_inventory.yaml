# ============================================================
# ZephyrAlpha Asset Inventory Configuration v1.0.0
# 落位: config/asset_inventory.yaml
# 蓝图: MOD-INF-026 v0.3.0 · §32 + 附录 K
# ============================================================

module_id: MOD-INF-001
version: "1.0.0"

scanner:
  directories:
    - "src/zephyr/"
    - "scripts/"
    - "docs/"
    - "config/"
    - "tests/"
    - "data/"
  root_files:
    - "pyproject.toml"
    - ".gitignore"
    - "*.bat"
    - "*.ps1"
  exclude_dirs:
    - "__pycache__"
    - ".pytest_cache"
    - ".mypy_cache"
    - "node_modules"
    - ".git"
    - ".venv"
    - "venv"
    - "env"
    - "dist"
    - "build"
    - "egg-info"
    - ".ailocks"
    - "session_logs"
    - "_backup"
    - "_archive"
  max_workers: 8
  timeout_seconds: 300
  max_file_size_mb: 50
  max_depth: 15
  glide_window_seconds: 60

classifier:
  type_mapping:
    "src/zephyr/autonomy_core/gates/": {ext: ".yaml", type: "gate"}
    "src/zephyr/": {ext: ".py", type: "module"}
    "scripts/": {ext: ".py", type: "script"}
    "docs/": {ext: ".md", type: "doc"}
    "config/": {ext: [".yaml", ".json", ".toml"], type: "config"}
    "tests/": {ext: ".py", type: "test"}
    "data/": {ext: [".db", ".jsonl", ".yaml"], type: "data"}
  registry_patterns:
    - "*_registry.yaml"
    - "*manifest.yaml"
  unknown_threshold_pct: 10.0

reconciler:
  orphan_tolerance_hours: 24
  auto_fix_enabled: true
  auto_fix_types:
    - ".py"
  ghost_max_age_days: 30
  drift_sha256_tolerance: 0

dashboard:
  health_weights:
    orphan_rate: 0.35
    ghost_rate: 0.35
    drift_rate: 0.20
    reconciliation_age: 0.10

security:
  secret_filename_patterns:
    - "*.env*"
    - "*.secrets*"
    - "*_key*"
    - "*_token*"
    - "*credentials*"
    - "*.pem"
    - "*.pkcs12"
  skip_session_logs: true
  skip_ailocks: true

retention:
  raw_scan: {max_count: 48}
  classified: {max_count: 24}
  index_snapshots: {max_count: 30}
  security_logs: {max_days: 90}
  git_metadata: {max_count: 7}

notifications:
  dashboard_alert_level: "P1"
  handoff_injection: true
  gate_blocking: true
