# sector_attribute_mapping.yaml — 板块属性标注规则库（进攻/防御/平衡 三分类静态映射真源）
#
# 用途：板块页 Top10「属性」列与下游策略语境（GAP-F-18）；由
# zephyr.signal_ashare.sector_attribute_rules 消费（load_attribute_mapping）。
#
# 与 config/sector_attribute_labels.yaml 的边界（防双轨）：
#   - sector_attribute_labels.yaml = 攻/防「两族」清单，专供 MOD-SIG-060 相对强度
#     雷达 rs_ratio = mean_ret(进攻族) − mean_ret(防御族)，族内板块须成分锚定；
#   - 本文件 = 攻/防/平衡「三分类」属性标注规则库，面向展示与语境标注，覆盖面更宽，
#     未锚定板块走名称关键词兜底（match_via=keyword 留痕）。
# 实证锚定（2026-08-22，同 sector_attribute_labels.yaml 口径，881xxx 行业板 SCD-2）：
#   银行=881386 / 保险=881395 / 公用事业(电力)=881459 / 煤炭=881002 /
#   半导体=881319 / 通信设备=881338 / 券商=881394；其余板块 code 留空=待锚定，
#   仅靠名称关键词匹配（match_via=keyword，精度低于 code 锚定，消费端可按需过滤）。
# 口径：属性为静态规则标注（行业贝塔属性常识分类，初拍待实盘标定），非动态计算；
#   同一板块只属一类（rules 自上而下首命中生效）；未命中→「未标注」（不强行归类）。

version: "0.1.0"
