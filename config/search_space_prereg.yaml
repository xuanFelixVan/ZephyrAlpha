    physical_gb: 24
    train_quota_gb: 18
    # 2026-10-11 NVML 逐进程实测（st-gpux-20261011）：六路并发 eval-on-GPU 跑批时设备
    # memory.used=12,171MiB ÷ 6 路 ≈ 2,029MiB/路（含 cupy 上下文与缓存池）；CPU 路面今晨
