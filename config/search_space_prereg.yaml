  # 缺一不可——只量显存时六路把 64GB 主机 RAM 打到零，s0/s4 两路 GPU 波 MemoryError 整波重跑）
  host_mem:
    physical_gb: 64               # GlobalMemoryStatusEx 实测 ullTotalPhys=63.9GB
    per_path_peak_mib: 4600       # 六路仪表 heartbeat.rss_mb 峰值实测 4,316–4,424MiB/路（起步载表面）
    admission_basis: "消费方=factory_grid_executor._dev_xp 主机水位闸（可用 RAM < 本值即该路不走设备面并计 host_mem_refused）；水位口=host_resource_governor.probe_system_watermark，禁另造探测"
    concurrency: 6                # 与 vram.concurrency 同值：6×4.6GB=27.6GB ≤ 空载可用；夜跑/LLM 在飞时由准入闸自限，非靠自觉
  single_job_wall_clock_cap_hours: 12   # schedule_gate_policy timebox gpu 键同值（超时=调度层中止）
