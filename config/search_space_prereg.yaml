    per_path_budget_mib: 2100           # 消费方=factory_grid_executor._dev_xp 显存准入闸（free 不足即整路降级 CPU 并计 vram_refused）
    concurrency: 6                      # 入册=已实测跑过且可复核的工作点；算术余量 18,432/2,100=8.8 未实测不上册
    # 裁定据：总统统筹 2026-10-11 05:3x 裁定③——禁"册上写 1、实际跑 6"的漂移态继续；
    # 并发不再靠自觉：显存预算由代码自限（超预算的路自己回 CPU），与本地 LLM 的互斥
    # 由 resource_profile_registry manual_factory_grid_executor.exclusive_group=[gpu_default] 承担。
    concurrency_basis: "GPU 化班 N-3 六路×25,000 格双后端配对实测（seed 20261010 与今晨 p2 逐字同参）"
