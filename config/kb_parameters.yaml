# KB 运营参数隔离配置文件
# ==========================
# 蓝图: MOD-KB-001 §7.10.4
# 任务: KB-INF-0053
#
# 所有可调参数集中于此文件——不在KE frontmatter中硬编码。
# 生产、测试、开发三个环境独立维护。

module_id: MOD-INF-002
environment: development

mvkb:
  min_ke_count: 10
  min_categories: 5
  max_ke_count_warn: 500
  max_ke_size_bytes: 65536

pipeline:
  gate_timeout_seconds: 30
  G1_format_strictness: normal           # normal | lenient | strict
  G2_dedup_threshold: 0.95              # cosine similarity for near-dupe detection
  G3_ghost_ratio_warn: 0.10             # ghost vector ratio -> WARN
  G3_ghost_ratio_freeze: 0.30           # ghost vector ratio -> SAFE MODE
  G4_vector_distance_threshold: 1.2     # max cosine distance to source
  G5_write_retry_count: 3
  max_concurrent_gates: 5               # ThreadPoolExecutor workers

freeze:
  gate_consecutive_failures: 3          # trigger safe_mode after N fails
  ghost_ratio_threshold: 0.20           # trigger safe_mode above this
  auto_thaw_after_seconds: 0            # 0 = manual unfreeze only

load_bearing:
  coverage_target: 0.70                 # target coverage ratio
  ttl_warn_days: 14                     # warn when TTL within N days
  max_dependency_depth: 3               # max KE dependency chain depth
  integrity_check_interval_hours: 24

integrity:
  manifest_file: data/snapshots/kb_integrity_manifest.json
  layers: [1, 2, 3]                     # 1=KEs, 2=sources, 3=aggregate

quiet_period:
  warn_after_days: 7                    # warn if no KE modified in N days
  alert_after_days: 14                  # alert (fail) if no KE modified in N days
  check_interval_hours: 24

tombstones:
  retention_days: 90                    # keep tombstone records for N days
  max_tombstones_warn: 1000             # warn if tombstone count exceeds this
  auto_purge_enabled: true

storage:
  chroma_collections: [ke_entries, ke_metadata, ke_tombstones, ke_versions]
  sqlite_db: data/databases/governance.db
  max_wal_size_kb: 4096                 # warn if WAL exceeds this

reranker:
  mode: hybrid                          # hybrid | bm25_only | vector_only | mock
  bm25_k1: 1.5
  bm25_b: 0.75
  rrf_k: 60
  top_k: 20

embedding:
  primary_model: BAAI/bge-small-zh-v1.5
  fallback_model: sentence-transformers/all-MiniLM-L6-v2
  batch_size: 32
  max_retries: 2

safety_brake:
  quiet_period_seconds: 30              # cooling period before destructive ops
  require_devils_advocate: true         # before marking KE as authoritative
  max_epidemic_changes: 50              # max KEs to update in one batch
  pre_flight_checks: 3                  # checks before destructive ops

verify:
  factual_threshold: 0.90               # confidence below this -> REJECT
  max_llm_fallback_attempts: 2
  source_primary: file_system           # file_system | database | api
