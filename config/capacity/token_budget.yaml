# ZephyrAlpha — Token Budget 四级体系配置
# 真源：蓝图 MOD-INF-001 §5.1 DD-11
# 版本：v2.6.0

config_version: "2.6.0"

token_budget:
  algorithm: "token_bucket_with_sliding_window"
  refill_rate_per_second: 100

levels:
  - level: 1
    name: "MCP 工具级"
    scope: "per_tool_call"
    default_limit: 2048
    source: "tool_contracts.yaml"

  - level: 2
    name: "session 级"
    scope: "per_session"
    default_limit: 200000
    source: "context_budget_tracker.py"

  - level: 3
    name: "org 级"
    scope: "per_organization"
    default_limit: 2000000
    source: "error_budget_tracker.py"

  - level: 4
    name: "global 级"
    scope: "global"
    default_limit: 10000000
    source: "future"

cost_limits:
  daily_cost_usd: 20.0
  session_cost_usd: 5.0
  single_model_cost_usd: 1.0

models:
  - name: "deepseek-chat"
    category: "budget"
    max_tokens_per_request: 2000
  - name: "deepseek-reasoner"
    category: "premium"
    max_tokens_per_request: 4000
  - name: "glm-4.5-free"
    category: "free"
    max_tokens_per_request: 1000
