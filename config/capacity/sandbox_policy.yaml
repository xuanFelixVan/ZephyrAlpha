# ZephyrAlpha — Sandbox 沙箱隔离策略配置
# 真源：蓝图 MOD-INF-001 §5.1 DD-13
# 版本：v2.6.0

config_version: "2.6.0"

resource_limits:
  cpu_max_pct: 0.25
  memory_max_mb: 128
  disk_max_mb: 50
  timeout_seconds: 30
  max_concurrent_sandboxes: 3

policies:
  - action: file_delete
    sandbox: true
    dry_run: true
    require_confirmation: true
    description: "文件删除操作：沙箱隔离 + 试运行 + 需确认"

  - action: config_modify
    sandbox: true
    dry_run: false
    require_confirmation: false
    description: "配置修改操作：沙箱隔离 + diff_before_apply"

  - action: external_api_call
    sandbox: false
    dry_run: false
    require_confirmation: false
    cost_limit_usd: 1.0
    description: "外部 API 调用：无沙箱 + 成本限制 $1"

kill_switch_drill:
  enabled: true
  schedule: "monthly"
  test_file: ".audit_cache/kill_switch_test"
  auto_recovery_seconds: 60

audit:
  log_all_sandboxed: true
  retention_days: 90
