# E4 考尺成本门预注册参数（批C 成本焊进考尺，Owner 通宵令 2026-09-23）
# 真源: max_remediation_plan.md §2-C；冻结后禁改——调整=裁定通道（§5 人机门位）。
# 消费方: scripts/backtest/f06_e4_wfa_exam.py / scripts/backtest/exam_cost_reexam.py / 批F 三路搜索轨
schema_version: 1.0.0
doc_type: exam_scale_config
title: E4 考尺成本门预注册参数
created: '2026-09-23'
session: st-ibt-remedy-cf-20260923
cost_gate:
  # 五档滑点（冻结土规口径，佣金/印花不动仅滑点覆盖；0bp=零成本对照档）
  tiers_bp: [0, 5, 10, 20, 40]
  # 全成本档存活地板（最高档 sharpe 下限）
  survival_floor: 0.0
  # 单调性容差（逐档 sharpe 非增）
  monotonic_tol: 1.0e-09
  # 证据最低样本天数（低于判不通过，fail-closed）
  min_days: 60
scale_gate:
  # 规模维（裁-4 item5 2026-09-28 chief adjudication：成本档不带规模参数=验收门恒过）。
  # 净零声明：不开新册——折入本册（exam_scale_cost_gate.yaml 即成本门唯一参数面）；
  # 复用既有 survival_floor 作规模调整判据、既有 tiers_bp 曲线作成本谱（零新成本常量）；
  # 开方律=square_root 冲击模型（cost_model_registry impact_model 枚举既有，CST-ASTOCK-002 同款），
  # 不新增模型条目。本节取代的旧假设：隐式"档位 bp 适用于任意成交规模"（旧门对规模恒盲）。
  # participation_rate 缺省 None=规模维禁用=行为零变化；40bp 锚语义不动（锚=ref 处 m=1）。
  # 消费形参: evaluate_exam_cost_gate(participation_rate=格点成交额/ADV)
  # 参与率校准锚（5% ADV 机构级分界）：档位 bp 视为在 ≤该规模处校准；锚处及以下 m=1
  participation_ref: 0.05
  # 开方律指数（Almgren-Chriss/平方根冲击经验律）
  exponent: 0.5
  # 乘数上限（40bp 锚最深 2×=80bp 有效档，防测量档外无限外推）
  multiplier_cap: 2.0
turnover_gate:
  # E7 换手上限门预注册默认档 8x/年（推导: 38.6pct/4.75年 ÷39x ≈ 0.21pct/换手·年，
  # 8x→成本拖累 ≈1.7pct/年；OOS 零成本超额 +18pct 保留一半即过 C 门线）
  cap_annual_x: 8.0
  # 年化基准交易日（与 _c4_engine 年化口径一致）
  days_basis: 244
search_objective:
  # 批F 三路搜索目标函数（批C 起生效）: 成本后 Sharpe 为主目标
  primary: cost_adjusted_sharpe
  # 毛 Sharpe 仅作观察项披露
  observed: gross_sharpe
  note: 正考 OOS sharpe 本就基于冻结土规净收益（成本后）；本键声明搜索轨目标函数同口径切换

# ---------------------------------------------------------------------------
# ⚑-2② B案声明通道追加块 v2.0.0（Owner 2026-09-30 批复"选 B"，裁定#435）。
# 声明通道=追加新版本块而非改旧值：上方 cost_gate/scale_gate/turnover_gate/search_objective
# 四块一字未动（冻结 v1，survival_floor 禁改照旧）；本块为 B 案判据冻结快照，
# 数值改动仍走裁定通道。声明全文=docs/_working/night_sweep/c_exam/flag2_declaration_b.md
# （为何换尺不降标/新旧判据对照/功效计算引用 n≈82 vs NIST 保守 97）。
# 消费面：T2 判定书/成绩单生成器按波次接线；接线前哨兵 t1_t2_handover.py 判据面仍走 v1 键。
# 重建注记：首登块遭 2026-09-30 07:4x 队列落盘崩溃回滚波及，本块为同内容重建重投。
breakeven_cost_gate:
  version: '2.0.0'
  declared: '2026-09-30'
  declaration: docs/_working/night_sweep/c_exam/flag2_declaration_b.md
  ruling: 裁定#435
  criterion_id: G-COST-BREAKEVEN-40BP
  judge_object: breakeven_cost_c_star   # 判据对象=盈亏平衡成本（Sharpe(c)=0 的单边成本，逐格确定量）
  sampling: none                        # 不抽样（c* 逐格全量可算，抽样误差整体消解）
  stratification_role: report_dimension # 分层降级为报告维度（抽样框职能废除）
  gates:
    p1_median_bp_min: 40.0              # 40bp 锚一字不动
    p2_p10_bp_min: 0.0                  # "Sharpe≥0"语义一字不动（逐格解到零点）
    p3_stratified_pass_ratio_min: 0.80  # 达标层占比（换手三分位×策略族×市场状态）
    p3_layer_min_n: 30                  # 层内 n<30 判 INSUFFICIENT-N（fail-closed 不算绿）
    p4_scale_sensitivity_max: 0.20      # 1x/5x/10x 目标仓位 c* 相对变化上限
    p5_data_version_required: [adjustment_basis, snapshot_date, snapshot_sha256, n_trials]
  bisect:
    lo_bp: 0.0
    hi_bp: 200.0
    tol_bp: 0.1
    over_hi_label: '>200'               # Sharpe(200bp)>0 单列不计入中位数
    monotonic_grid_bp: [0, 5, 10, 20, 40, 60, 80, 100, 150, 200]
    non_monotonic: NaN_separate_pool    # 非单调格=NaN 单列，疑引擎缺陷；占比>5% → INDETERM
  sharpe_annualization:                 # A 股四条强制（Lo 2002 / PSR-DSR 同口径）
    ban_sqrt_252: true
    ljung_box_q: 252
    ddof: 0
    suspended_days: exclude_both_sides  # 分子分母同剔，禁填 0；复牌首日跳空计入
    unfillable_at_limit: separate_pool  # 计数>0 的格子单列池
  dsr_gate:                             # C 并联（可并；两门都绿才放行）
    enabled: true
    dsr_min: 0.95
    n_trials: 3700                      # 禁填抽样数 50
    pbo_max: 0.20                       # PBO>0.20 且 prob_oos_loss>0.50 → FAIL；≤0.50 → INDETERM
    min_trl_check: fail_on_infinite
    cscv_precheck_ljung_box: true       # 显著自相关格占比>30% → CSCV 降 S=8 复算同报
  tri_state: [PASS, INDETERM, FAIL]     # INDETERM 必须补数据/补跑，禁默认降级 PASS
  report_required: [c_star_quantiles, survivor_k_and_total_n, non_monotonic_list, unfillable_pool]

# ---------------------------------------------------------------------------
# ⚑-2② 机器门激活指针块（W2-T2 接线 st-nightsweep2-t2-20260930，2026-09-30）。
# 授权链：裁定#435（B案声明通道落册）+裁定#446（T1 定稿追认）+Owner 2026-09-30 夜令
# "C组……把他们前置条件全部打通，然后来完成他们"；W-173 式声明通道=版本追加，上方
# v1/v2 全部既有键一字未动（追加后逐键 diff 自证于 verdict 与台账）。
# 消费面契约：load_cost_gate_params 读本块取判据面——active_version='2.0.0' 且
# breakeven_cost_gate 块在场→判据走 v2（五道门+三态）；指针缺席/非 2.x/块缺席→
# 回退 v1 cost_gate 冻结键（行为零变化，tests 钉死）。launch_gate_scope=发车哨兵
# 闸门子集（P1/P2=T1 普查证据面可承载核）；P3/P4/P5 证据面=T2 判定书/成绩单
# （declaration §7 "按波次接线"），随 verdict 全量披露不截断。
cost_gate_active:
  active_version: '2.0.0'
  fallback_version: '1'
  launch_gate_scope: [p1_median_bp_min, p2_p10_bp_min]
  wired_by: st-nightsweep2-t2-20260930
  wired: '2026-09-30'
