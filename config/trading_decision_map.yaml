  - node_id: TDM-P-P3-02
    name_zh: 金字塔加仓规则
    market: cn_a
    flow: position_flow
    layer: P3
    node_type: stage
    point: 盘中
    decision_question: 怎么加：每次加多少、隔多少空间、最多加几次
    algo_note_zh: >-
      金字塔三规则：递减（首加占剩余预算 50%，逐次减半——越加越少防重仓在顶部）、阶梯（较上次买价涨幅≥2.5-3% 才加下一笔，禁止平加）、限次（最多 3 次）。
      跌破上次加仓价=停止后续计划。
      加仓=新交易，需重新确认入场条件仍成立。
