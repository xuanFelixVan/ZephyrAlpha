# ============================================================================
# 交易决策地图真源（Trading Decision Map SSOT）— schema v1.0
# 设计真源: docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/69_trading_decision_map.md
# 蓝图: docs/03_modules/_domain_trading/decision_map/blueprint.md
# 裁定: Owner 2026-09-04 D1-D6（讨论备忘录 docs/_working/2026-09-04-trading-decision-map-discussion.md）
#
# 真源边界（INV-1 铁律）: 本文件只定义「决策链环节骨架+策略挂载+状态矩阵」，
#   策略/因子/数据/模块四层一律按稳定标识符引用既有真源，禁止复制条目内容:
#   - strategy_ref → 代码 StrategyMeta 注册表（8 实盘策略，kebab-case id，真源=pf_core/strategies/*.py）
#     或 strategy_registry.yaml（REG-STR-001，STR-* 粒度规则条目）
#   - factor_refs  → factor_registry.yaml（REG-FCT-001，FCT-*）
#   - data_refs    → data_asset_registry.yaml（REG-DATAFLOW-001，DS-*）
#   - module_ref   → depgraph（MOD-*，可空=null=缺口节点，warning 级）
# 置信度语义（D5）: verified=回测归因支撑（必带 evidence）/ proposed=主观假设待验证 / untested=未填
# 血肉填充约定: 骨架先行（本文件），格子内容以 proposed 逐步添加，禁止把 proposed 冒充 verified
# ============================================================================

schema_version: '1.1'
map_id: TDMAP-001
name_zh: 交易决策地图
markets: [cn_a, crypto]          # 同 schema 两实例（D2.5）；crypto V0 为骨架空壳

nodes:
  # ── 建仓流 entry_flow（cn_a，内嵌 Owner 主观漏斗 L1-L4）──────────────────
  # 真源对齐（v1.2.2，Owner 裁定 B 方案=第一性原理）：
  #   宏观段状态（周/日线级 1-3 月）= D_REGIME 12 态系统【已实现】——RegimeSnapshot 7 维概率分布
  #   （4 态 HMM r1-r4 + CRISIS/RECOVERY/BREAKOUT overlay），总闸消费它算谨慎度，不自算宏观态
  #   真源：10_regime_detector_spec.md（D-SIGNAL-04）+ src/zephyr/regime/core/regime_detector.py
  #   微观情绪相位（1-2 周短线）= 本矩阵列轴六段（定稿词汇，10 号 spec 五态的细分扩展：
  #   冰点→capitulation / 反核→accumulation+ignition / 主升→expansion / 疯狂→euphoria / 退潮→distribution）
  #   当日预案（今天冲高回落怎么应对）= 作战预案引擎（D_PLAN/BM-PLAN-01-C）管辖，地图只挂引用不重建
  #   正名登记（D23）：现名"作战预案引擎"→未来正名"每日作战计划引擎（Game Plan Engine）"——
  #   专业两层结构：Playbook（静态招式手册=策略库+作战手册，已有）vs Game Plan（当日动态作战计划）；
  #   "预案"为口语，专业词=Game Plan；改名执行时同步 D_PLAN 域/BM-PLAN-01-C 锚点/相关备忘录编号
  #   升级需求清单（D24）：6 项功能全要（IF-THEN 强制格式/今日不做什么负面清单/心理状态检查门/
  #     预警位联动/Skip log/盘前盘中职责分离）——需求真源=69 号备忘录 §2.13，施工归 D_PLAN 域升级批次
  - node_id: TDM-E-L1
    name_zh: 大盘总闸
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: gate
    point: 盘前
    decision_question: 今天下不下单/给多少总仓位（消费 RegimeSnapshot 概率=谨慎度，六段预算带见 C1）
    factor_refs: []
    data_refs: [DS-150]
    module_ref: src/zephyr/regime/core/regime_detector.py
    module_id: MOD-REGIME-001
    strategy_mounts: []

  # L1 四路传感器阵列（D6：指数↔情绪双向、短线情绪领先）
  # 因子层缺口说明：情绪类因子在 REG-FCT-001 仅到 family 级（family_id=sentiment），
  #   尚无 FCT-* 级条目（涨停家数/炸板率/晋级率等）——factor_refs 留空=地图缺口节点，
  #   补登因子后回填引用（缺口检测语义）
  - node_id: TDM-E-L1-S1
    name_zh: 大盘指数传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 指数趋势/位置如何（数据面）
    factor_refs: []
    cycle_refs: [CYC-STAT-001, CYC-STAT-004, CYC-STAT-013]
    data_refs: [DS-150]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S2
    name_zh: 市场内部结构传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘中
    decision_question: 涨停/跌停/炸板/连板梯队显示的参与度如何（广度面）
    factor_refs: []
    data_refs: [DS-082]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S3
    name_zh: 赚钱效应传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 昨日涨停溢价/晋级率显示的投机情绪如何（结果面，短线领先）
    factor_refs: []
    data_refs: [DS-082, DS-107]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S4
    name_zh: 波动率传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 市场波动状态是否允许正常仓位（可选通道；中国VIX表未登记=数据缺口）
    factor_refs: []
    data_refs: [DS-150]
    module_ref: null
    strategy_mounts: []

  # 日级温度计传感器（D20：四层架构第三支温度计=日级条件层，补业界 Daily Condition 缺位）
  # 11 信号全上（Owner 裁定：先大而全跑数据，后数据裁噪；A组实战 8+ B组机构 3）：
  #   A1 涨停家数环比 / A2 连板高度梯队 / A3 炸板率(>50% 追高必埋) / A4 跌停+核按钮(批量=退潮确认)
  #   A5 昨日涨停溢价(≤-5% 退潮) / A6 红盘家数(<1500 绝对回避) / A7 量能匹配(缩量冲高+放量跳水=诱多)
  #   A8 板块联动(一天换主线=混沌) / B1 宽度领先原则 / B2 对坏消息的反应 / B3 市值分层宽度
  #   原始数据与 S2/S3 同源（DS-082/DS-059/DS-150），用法不同：本节点消费"当日读数+环比骤变"
  #   裁噪预留：同源指标重复计票（冗余即静默杀手）→ 灰度合成阶段用相关性去重
  # ── S0 宏观环境传感器（D25：月级温度计的市场外进水管，非第五层）──
  #   Owner 裁定：宏观完全交给系统算法（人工不消费），四组信号全上（先大而全，D21 三防弹衣适用）：
  #   A 货币政策（降准降息节奏/政策利率/央行方向，领先 0-6 月，机构 signal hierarchy 顶点）
  #   B 流动性与信用（社融/M1-M2 剪刀差/信用利差/两融 DS-098/五大央行方向，领先 3-12 月）
  #   C 海外与汇率（美债 10Y/美元/中美利差/全球 risk-off 合成/港股联动）
  #   D 增长与政策（PMI/产业政策风向/监管周期——A股范式变迁后权重上调，广发研报：
  #     传统"货币→信贷→盈利"链失效，新链=产业政策→产业预期→股市，"M1 定买卖"失效）
  #   方法论=复用周级三步法（滚动分位→加权合成→天气分 0-100），输出喂月级谨慎度修正
  #   A股范式权重修正：政策/产业因子权重↑、总量因子权重↓
  - node_id: TDM-E-L1-S0
    name_zh: 宏观环境传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 市场之外的宏观环境（货币/流动性/海外/政策）对这段行情的支撑或压制
    factor_refs: []
    macro_refs: [MAC-CN-005, MAC-CN-006, MAC-CN-007, MAC-CN-008, MAC-CN-009, MAC-CN-011, MAC-US-001, MAC-US-002]
    event_refs: [EVT-MACRO-001]
    data_refs: [DS-098]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S5
    name_zh: 日级市场条件传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘中
    decision_question: 当日盘面骤变读数（11 信号环比）显示今天该多激进
    factor_refs: []
    data_refs: [DS-082, DS-059, DS-150]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-AGG
    name_zh: 市场状态判定
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: aggregation
    point: 盘前
    # 双轴合成（v1.2.2 B 方案定稿）：①谨慎度轴=消费 D_REGIME RegimeSnapshot 7 维概率
    #   （module_ref 已挂）→ 决定预算带位置（C1）；②机会轴=情绪六段分布（灰度）→ 决定策略路由
    #   （矩阵列轴）；③仲裁三规则：多数表决+历史可靠度加权（C3 养成）+分布熵高→分裂市降档+人工接管
    # 四层架构（D20）：月级 12 态/周级六段/日级 S5 三温度计独立判定；跨层合成两规则——
    #   封顶：周级退潮→日级最高 RISK_OFF；月级危机→日级最高 RISK_OFF（封顶不覆盖，日级如实报告）
    #   对齐加成：月+周+日三层同向→预算带取上限（业界三级共振）；冲突→取下限+高层赢
    decision_question: >-
      双轴合成：RegimeSnapshot 概率（宏观）×情绪六段分布（微观）；输出预算带+策略路由+冲突仲裁（熵高分裂市→降档+Owner 接管）；日级水温受月/周档位封顶
    factor_refs: []
    data_refs: [DS-098]
    module_ref: src/zephyr/regime/core/regime_detector.py
    module_id: MOD-REGIME-001
    strategy_mounts: []

  - node_id: TDM-E-L2
    name_zh: 板块选择
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘前
    decision_question: 今天打哪个板块/赛道
    factor_refs: []
    data_refs: [DS-059, DS-170]
    module_ref: null
    strategy_mounts: []
    # ── E-L2 血肉 v1.3（D19，吸收 22 号 spec v1.9.7；算法附件=doc_ref 指向 22号 §3.1①-⑪）──
    # 双通道输出（D19）：①Top候选池+强度分→TDM-E-L3（机器）②盘后板块轮动简报→Owner 注意力（人工，
    #   锚 BM-SEL-25-C-3 跟风决策）——通道②由作战地图/预案引擎承载，地图只声明语义不建第二真源
    # 水温解挂（D20）：四层架构定稿——日级温度计（L1-S5，11 信号）独立判定 5 档，
    #   月/周层封顶约束+三层对齐加成；05-1 消费 S5 当日读数（主判）+L1-AGG 双轴（封顶）
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md"

  # ── 树枝01 板块强度综合（22号 §3.1①⑧⑨）────────────────────────
  - node_id: TDM-E-L2-01
    name_zh: 板块强度综合
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 各板块今天整体强不强、强到值得进候选池吗
    parent_node: TDM-E-L2
    factor_refs: []
    data_refs: [DS-059, DS-170]
    module_ref: null
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.2-板块强度综合"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: 任一维度缺失时按剩余维度归一化输出并标注置信衰减
    strategy_mounts: []

  - node_id: TDM-E-L2-01-1
    name_zh: 结构强度评估
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 板块情绪结构（涨停比/梯队/趋势）强不强
    parent_node: TDM-E-L2-01
    factor_refs: [FCT-MOM-011, FCT-SENT-012]
    data_refs: [DS-059]
    module_ref: src/zephyr/signal_ashare/sector_analyzer.py
    module_id: MOD-SIG-026
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1①"
    activation: postmarket
    invalidation: 板块内封板率<70%时结构分×0.8（情绪虚高），以封板率终值复核
    ai_autonomy: auto
    fallback: 涨停比字段缺失→降级用涨停绝对数并标记不可跨板块比较
    strategy_mounts:
      - {strategy_ref: STR-DABAN-003, confidence: proposed, evidence: null}

  - node_id: TDM-E-L2-01-2
    name_zh: 动量活跃度排名
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 板块资金行为活跃度在全市场排第几
    parent_node: TDM-E-L2-01
    factor_refs: []
    data_refs: [DS-059, DS-170]
    module_ref: src/zephyr/data/sector_ranking_engine.py
    module_id: MOD-L00-004
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1①"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: 基准 880001.SH 缺失→用全板块均值基准（与 RRG 同源规则）
    strategy_mounts: []

  - node_id: TDM-E-L2-01-3
    name_zh: 多周期动量加权
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 是真启动还是一日游（q20/q5/q3 谁主导）
    parent_node: TDM-E-L2-01
    factor_refs: []
    data_refs: [DS-170]
    module_ref: src/zephyr/signal_ashare/sector_momentum.py
    module_id: MOD-SIG-026
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1⑧"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: q3 数据不足 3 日→退回 q5/q20 双因子并标注
    strategy_mounts: []

  - node_id: TDM-E-L2-01-4
    name_zh: 板块资金流聚合
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 主力资金在进这个板块还是在出
    parent_node: TDM-E-L2-01
    factor_refs: [FCT-LIQ-040, FCT-MOM-021]
    data_refs: [DS-181, DS-186]
    module_ref: src/zephyr/signal_ashare/sector_breadth.py
    module_id: MOD-SIG-026
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1⑥"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: money_flow 缺失→资金维度降权（结构+动量两维归一化）
    strategy_mounts:
      - {strategy_ref: STR-DABAN-002, confidence: proposed, evidence: null}

  - node_id: TDM-E-L2-01-5
    name_zh: 市场级调节注入
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: aggregation
    point: 盘后
    decision_question: 市场级轮动状态要不要对全板块强度统一加减分
    parent_node: TDM-E-L2-01
    factor_refs: []
    data_refs: []
    module_ref: null
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1⑨"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: watch_score 缺失→按 0 处理（中性）
    strategy_mounts: []

  # ── 树枝02 轮动序列追踪（BM-SEL-08）────────────────────────
  - node_id: TDM-E-L2-02
    name_zh: 轮动序列追踪
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 资金正从哪些板块撤出、正接棒进哪些板块
    parent_node: TDM-E-L2
    factor_refs: []
    data_refs: [DS-170]
    module_ref: null
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1④"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: null
    strategy_mounts: []

  - node_id: TDM-E-L2-02-1
    name_zh: RRG 轮动序列
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 每个板块处在接棒/见顶/回避/布局哪个阶段
    parent_node: TDM-E-L2-02
    factor_refs: []
    data_refs: [DS-170]
    module_ref: null
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1④"
    activation: postmarket
    invalidation: 象限转移须连续 2-3 日确认，单日跳变不采信；transition 概率<10% 异常路径加 1 日确认
    ai_autonomy: auto
    fallback: 板块日K 不足 62 日（DualEma 最小数据量）→该板块不参与序列排名
    strategy_mounts: []

  - node_id: TDM-E-L2-02-2
    name_zh: 单板块轮动预警
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘中
    decision_question: 这个板块是不是涨到头要见顶了
    parent_node: TDM-E-L2-02
    factor_refs: []
    data_refs: [DS-059]
    module_ref: src/zephyr/signal_ashare/sector_analyzer.py
    module_id: MOD-SIG-026
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1④"
    activation: intraday
    invalidation: null
    ai_autonomy: auto
    fallback: null
    strategy_mounts: []

  # ── 树枝03 调整周期进度（BM-SEL-09）────────────────────────
  - node_id: TDM-E-L2-03
    name_zh: 调整周期进度
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
