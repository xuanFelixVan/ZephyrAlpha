    ai_autonomy: auto
    fallback: null
    strategy_mounts: []

  # ── 树枝03 调整周期进度（BM-SEL-09）────────────────────────
  - node_id: TDM-E-L2-03
    name_zh: 调整周期进度
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘后
    decision_question: 目标板块的调整走完了没有、能不能低吸
    parent_node: TDM-E-L2
    factor_refs: []
    data_refs: [DS-170]
    module_ref: null
    algo_refs: []
    doc_ref: "docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/22_sector_rotation_spec.md#§3.1③"
    activation: postmarket
    invalidation: null
    ai_autonomy: auto
    fallback: null
    strategy_mounts: []

  - node_id: TDM-E-L2-03-1
    name_zh: 扩散指标进度追踪
    market: cn_a
    flow: entry_flow
    layer: L2
