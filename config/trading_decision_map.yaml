# [A_config] module_id=MOD-TRADING-015 | layer=config | stability=evolving | safety=L | ai_autonomy=ai_modifiable
# ============================================================================
# 交易决策地图真源（Trading Decision Map SSOT）— schema v1.0
# 设计真源: docs/02_enterprise_architecture/07_trading_decision_architecture/design_memos/69_trading_decision_map.md
# 蓝图: docs/03_modules/_domain_trading/decision_map/blueprint.md
# 裁定: Owner 2026-09-04 D1-D6（讨论备忘录 docs/_working/2026-09-04-trading-decision-map-discussion.md）
#
# 真源边界（INV-1 铁律）: 本文件只定义「决策链环节骨架+策略挂载+状态矩阵」，
#   策略/因子/数据/模块四层一律按稳定标识符引用既有真源，禁止复制条目内容:
#   - strategy_ref → 代码 StrategyMeta 注册表（8 实盘策略，kebab-case id，真源=pf_core/strategies/*.py）
#     或 strategy_registry.yaml（REG-STR-001，STR-* 粒度规则条目）
#   - factor_refs  → factor_registry.yaml（REG-FCT-001，FCT-*）
#   - data_refs    → data_asset_registry.yaml（REG-DATAFLOW-001，DS-*）
#   - module_ref   → depgraph（MOD-*，可空=null=缺口节点，warning 级）
# 置信度语义（D5）: verified=回测归因支撑（必带 evidence）/ proposed=主观假设待验证 / untested=未填
# 血肉填充约定: 骨架先行（本文件），格子内容以 proposed 逐步添加，禁止把 proposed 冒充 verified
# ============================================================================

schema_version: '1.1'
map_id: TDMAP-001
name_zh: 交易决策地图
markets: [cn_a, crypto]          # 同 schema 两实例（D2.5）；crypto V0 为骨架空壳

nodes:
  # ── 建仓流 entry_flow（cn_a，内嵌 Owner 主观漏斗 L1-L4）──────────────────
  # 真源对齐（v1.2.2，Owner 裁定 B 方案=第一性原理）：
  #   宏观段状态（周/日线级 1-3 月）= D_REGIME 12 态系统【已实现】——RegimeSnapshot 7 维概率分布
  #   （4 态 HMM r1-r4 + CRISIS/RECOVERY/BREAKOUT overlay），总闸消费它算谨慎度，不自算宏观态
  #   真源：10_regime_detector_spec.md（D-SIGNAL-04）+ src/zephyr/regime/core/regime_detector.py
  #   微观情绪相位（1-2 周短线）= 本矩阵列轴六段（定稿词汇，10 号 spec 五态的细分扩展：
  #   冰点→capitulation / 反核→accumulation+ignition / 主升→expansion / 疯狂→euphoria / 退潮→distribution）
  #   当日预案（今天冲高回落怎么应对）= 作战预案引擎（D_PLAN/BM-PLAN-01-C）管辖，地图只挂引用不重建
  - node_id: TDM-E-L1
    name_zh: 大盘总闸
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: gate
    point: 盘前
    decision_question: 今天下不下单/给多少总仓位（消费 RegimeSnapshot 概率=谨慎度，六段预算带见 C1）
    factor_refs: []
    data_refs: [DS-150]
    module_ref: src/zephyr/regime/core/regime_detector.py
    strategy_mounts: []

  # L1 四路传感器阵列（D6：指数↔情绪双向、短线情绪领先）
  # 因子层缺口说明：情绪类因子在 REG-FCT-001 仅到 family 级（family_id=sentiment），
  #   尚无 FCT-* 级条目（涨停家数/炸板率/晋级率等）——factor_refs 留空=地图缺口节点，
  #   补登因子后回填引用（缺口检测语义）
  - node_id: TDM-E-L1-S1
    name_zh: 大盘指数传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 指数趋势/位置如何（数据面）
    factor_refs: []
    data_refs: [DS-150]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S2
    name_zh: 市场内部结构传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘中
    decision_question: 涨停/跌停/炸板/连板梯队显示的参与度如何（广度面）
    factor_refs: []
    data_refs: [DS-082]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S3
    name_zh: 赚钱效应传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 昨日涨停溢价/晋级率显示的投机情绪如何（结果面，短线领先）
    factor_refs: []
    data_refs: [DS-082, DS-107]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-S4
    name_zh: 波动率传感器
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: sensor
    point: 盘前
    decision_question: 市场波动状态是否允许正常仓位（可选通道；中国VIX表未登记=数据缺口）
    factor_refs: []
    data_refs: [DS-150]
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L1-AGG
    name_zh: 市场状态判定
    market: cn_a
    flow: entry_flow
    layer: L1
    node_type: aggregation
    point: 盘前
    # 双轴合成（v1.2.2 B 方案定稿）：①谨慎度轴=消费 D_REGIME RegimeSnapshot 7 维概率
    #   （module_ref 已挂）→ 决定预算带位置（C1）；②机会轴=情绪六段分布（灰度）→ 决定策略路由
    #   （矩阵列轴）；③仲裁三规则：多数表决+历史可靠度加权（C3 养成）+分布熵高→分裂市降档+人工接管
    decision_question: >-
      双轴合成：RegimeSnapshot 概率（宏观谨慎度）× 情绪六段分布（微观机会窗口）；
      输出预算带定位 + 策略路由 + 冲突仲裁（熵高分裂市→降档+Owner 接管）
    factor_refs: []
    data_refs: [DS-098]
    module_ref: src/zephyr/regime/core/regime_detector.py
    strategy_mounts: []

  - node_id: TDM-E-L2
    name_zh: 板块选择
    market: cn_a
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 盘前
    decision_question: 今天打哪个板块/赛道
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-E-L3
    name_zh: 个股选择
    market: cn_a
    flow: entry_flow
    layer: L3
    node_type: stage
    point: 盘前
    decision_question: 板块里选哪只票
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts:
      - {strategy_ref: daban-sleeve,      confidence: proposed, evidence: null}
      - {strategy_ref: multifactor-sleeve, confidence: proposed, evidence: null}
      - {strategy_ref: eventdriven-sleeve, confidence: proposed, evidence: null}
      - {strategy_ref: topn-momentum,      confidence: proposed, evidence: null}
      - {strategy_ref: default-equity,     confidence: proposed, evidence: null}

  - node_id: TDM-E-L4
    name_zh: 买卖点与执行
    market: cn_a
    flow: entry_flow
    layer: L4
    node_type: stage
    point: 盘中
    decision_question: 何时进场/怎么下单
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts:
      - {strategy_ref: daban-sleeve, confidence: proposed, evidence: null}

  # ── 持仓流 position_flow（cn_a）──────────────────────────────────────────
  - node_id: TDM-P-P1
    name_zh: 持仓体检
    market: cn_a
    flow: position_flow
    layer: P1
    node_type: stage
    point: 盘前
    decision_question: 每只持仓的现状/逻辑是否仍在
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-P-P2
    name_zh: 做T与加减仓
    market: cn_a
    flow: position_flow
    layer: P2
    node_type: stage
    point: 盘中
    decision_question: 今日持仓怎么做T/要不要加减仓
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts:
      - {strategy_ref: intraday-surge-fall, confidence: proposed, evidence: null}
      - {strategy_ref: orderbook-imbalance, confidence: proposed, evidence: null}
      - {strategy_ref: vwap-reversion,      confidence: proposed, evidence: null}

  - node_id: TDM-P-P3
    name_zh: 加仓决策
    market: cn_a
    flow: position_flow
    layer: P3
    node_type: stage
    point: 盘中
    decision_question: 浮盈仓要不要加/什么时候加
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  # ── 离场流 exit_flow（cn_a）──────────────────────────────────────────────
  - node_id: TDM-X-S1
    name_zh: 卖出信号收集评分
    market: cn_a
    flow: exit_flow
    layer: S1
    node_type: stage
    point: 持续
    decision_question: 哪些卖出信号触发了/强度如何
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-X-S2
    name_zh: 离场执行
    market: cn_a
    flow: exit_flow
    layer: S2
    node_type: stage
    point: 盘中
    decision_question: 怎么卖（一次性/分批/竞价/尾盘）
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  # ── 风控横切（非第四条流，任何环节可触发）────────────────────────────────
  - node_id: TDM-X-R1
    name_zh: 应急保命
    market: cn_a
    flow: exit_flow
    layer: X1
    node_type: cross_cutting
    point: 持续
    decision_question: 暴跌/流动性危机是否触发无条件降仓
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  # ── 组合资金流 portfolio_flow（cn_a，v1.1 新增：整装仿真系统核心骨架）────
  # 地图终极定位（Owner 2026-09-05 拍板）：整装仿真策略组合的蓝图——本流=资金切分→组合聚合→归因反馈闭环
  - node_id: TDM-F-C1
    name_zh: 预算切分
    market: cn_a
    flow: portfolio_flow
    layer: C1
    node_type: gate
    point: 盘前
    # 预算=灰度区间带（v1.2.1 Owner 裁定：仓位非定值，状态分布带内连续插值）
    # 六段预算带（机构+A股多源收敛，全 proposed）：capitulation 0-10%（只试错）/
    #   accumulation 20-30%（试错+底仓）/ ignition 30-50% / expansion 50-70%（verified 后
    #   earned-position 上探 70-80%）/ euphoria ≤30%（只卖不买）/ distribution 0%（空仓）
    # 横切：过渡带（最大隶属度<60%）预算×0.5-0.7；尾部预备金 10-15% 永不投出；
    #   小资金容量优势允许高集中度（earned 单票集中，游资路径），风险百分比制资金无关
    decision_question: >-
      总仓位怎么切给各策略 sleeve（Millennium pod 模型单体版）；
      六段预算带见上注释，带内实际仓位=状态分布加权插值（灰度非查表）；
      过渡带降仓×0.5-0.7 + 尾部预备金 10-15% 恒定预留
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-F-C2
    name_zh: 组合聚合
    market: cn_a
    flow: portfolio_flow
    layer: C2
    node_type: aggregation
    point: 持续
    decision_question: 各 sleeve 的信号/持仓怎么聚合成组合（相关性/总仓位约束/风控叠加）
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-F-C3
    name_zh: 绩效归因反馈
    market: cn_a
    flow: portfolio_flow
    layer: C3
    node_type: stage
    point: 盘后
    decision_question: 哪个 sleeve 赚/亏 → 预算倾斜与矩阵格 verified 升级（系统自我进化闭环）
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  # ── 币圈实例（骨架空壳，L2 弱化为赛道层）─────────────────────────────────
  - node_id: TDM-C-L1
    name_zh: 币圈大盘总闸
    market: crypto
    flow: entry_flow
    layer: L1
    node_type: gate
    point: 持续
    decision_question: BTC 趋势/山寨季状态允许什么仓位
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-C-L2
    name_zh: 赛道选择
    market: crypto
    flow: entry_flow
    layer: L2
    node_type: stage
    point: 持续
    decision_question: 哪条赛道在轮动（A股板块层的币圈弱化版）
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-C-L3
    name_zh: 币对选择
    market: crypto
    flow: entry_flow
    layer: L3
    node_type: stage
    point: 持续
    decision_question: 赛道里选哪个币
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

  - node_id: TDM-C-L4
    name_zh: 币圈买卖点
    market: crypto
    flow: entry_flow
    layer: L4
    node_type: stage
    point: 持续
    decision_question: 何时进出（7x24 无 T+1 约束）
    factor_refs: []
    data_refs: []
    module_ref: null
    strategy_mounts: []

edges:
  # 传感器 → 聚合（feed）
  - {from_node: TDM-E-L1-S1, to_node: TDM-E-L1-AGG, edge_type: feed}
  - {from_node: TDM-E-L1-S2, to_node: TDM-E-L1-AGG, edge_type: feed}
  - {from_node: TDM-E-L1-S3, to_node: TDM-E-L1-AGG, edge_type: feed}
  - {from_node: TDM-E-L1-S4, to_node: TDM-E-L1-AGG, edge_type: feed}
  # 指数→情绪 因果边（D6：双向互动、短线情绪领先——以 feedback 表达互动性）
  - {from_node: TDM-E-L1-S1, to_node: TDM-E-L1-S3, edge_type: feedback}
  # 漏斗主链（sequence，受上一步约束）
  - {from_node: TDM-E-L1-AGG, to_node: TDM-E-L1, edge_type: sequence}
  - {from_node: TDM-E-L1, to_node: TDM-E-L2, edge_type: sequence}
  - {from_node: TDM-E-L2, to_node: TDM-E-L3, edge_type: sequence}
  - {from_node: TDM-E-L3, to_node: TDM-E-L4, edge_type: sequence}
  # L1 广播到持仓/离场（大盘转弱→风险处置/警戒）
  - {from_node: TDM-E-L1-AGG, to_node: TDM-P-P1, edge_type: broadcast}
  - {from_node: TDM-E-L1-AGG, to_node: TDM-X-S1, edge_type: broadcast}
  # 组合资金流闭环（v1.1：预算→聚合→归因→反馈回大盘闸=系统自我进化闭环）
  - {from_node: TDM-E-L1-AGG, to_node: TDM-F-C1, edge_type: broadcast}   # L1 预算输出喂资金切分
  - {from_node: TDM-F-C1, to_node: TDM-F-C2, edge_type: sequence}
  - {from_node: TDM-F-C2, to_node: TDM-F-C3, edge_type: sequence}
  - {from_node: TDM-F-C3, to_node: TDM-E-L1-AGG, edge_type: feedback}    # 归因反馈回状态判定（闭环）
  # 持仓流
  - {from_node: TDM-P-P1, to_node: TDM-P-P2, edge_type: sequence}
  - {from_node: TDM-P-P2, to_node: TDM-P-P3, edge_type: sequence}
  # 持仓→离场（做T卖出即离场决策输入）
  - {from_node: TDM-P-P2, to_node: TDM-X-S1, edge_type: sequence}
  - {from_node: TDM-X-S1, to_node: TDM-X-S2, edge_type: sequence}
  # 应急保命横切（示意主边：触发即接管离场）
  - {from_node: TDM-X-R1, to_node: TDM-X-S2, edge_type: broadcast}
  # 币圈链
  - {from_node: TDM-C-L1, to_node: TDM-C-L2, edge_type: sequence}
  - {from_node: TDM-C-L2, to_node: TDM-C-L3, edge_type: sequence}
  - {from_node: TDM-C-L3, to_node: TDM-C-L4, edge_type: sequence}

state_matrix:
  # 列轴六段定稿（v1.2，Owner 裁定"机构命名+修复期独立成段"）
  # 命名=Wyckoff 阶段论+行为金融标准术语（机构通用），MarketTriage 六态同构验证：
  #   capitulation 恐慌投降(冰点) / accumulation 吸筹修复(修复期·震荡筹码交换) /
  #   ignition 点火启动 / expansion 发酵扩散 / euphoria 亢奋高潮 / distribution 派发退潮
  # 灰度语义：社区阈值（涨停60/120家、炸板率35%、晋级率60% 等）= 隶属度0.5锚点，
  #   非硬边界；实际判定=因子滚动分位→加权合成→状态分布（主状态+灰度），见 TDM-E-L1-AGG
  states: [capitulation, accumulation, ignition, expansion, euphoria, distribution]
  cells:
    # L1 总闸：六段各输出预算/姿态细则（格子内容待填，proposed）
    - {node_id: TDM-E-L1, state: capitulation, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L1, state: accumulation, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L1, state: ignition, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L1, state: expansion, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L1, state: euphoria, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L1, state: distribution, mounted: [], confidence: proposed}
    # L4 买卖点：打板只进点火确认后的三档（发酵=1进2主战场，高潮=警惕高开不追，退潮/冰点/修复不进）
    - {node_id: TDM-E-L4, state: ignition, mounted: [daban-sleeve], confidence: proposed}
    - {node_id: TDM-E-L4, state: expansion, mounted: [daban-sleeve], confidence: proposed}
    - {node_id: TDM-E-L4, state: euphoria, mounted: [daban-sleeve], confidence: proposed}
    - {node_id: TDM-E-L4, state: capitulation, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L4, state: accumulation, mounted: [], confidence: proposed}
    - {node_id: TDM-E-L4, state: distribution, mounted: [], confidence: proposed}
    # P2 做T：修复期（震荡筹码交换）为主战场 + 发酵期次之；高潮/退潮/冰点不做
    - {node_id: TDM-P-P2, state: accumulation, mounted: [intraday-surge-fall, orderbook-imbalance, vwap-reversion], confidence: proposed}
    - {node_id: TDM-P-P2, state: expansion, mounted: [intraday-surge-fall, orderbook-imbalance, vwap-reversion], confidence: proposed}
    - {node_id: TDM-P-P2, state: capitulation, mounted: [], confidence: proposed}
    - {node_id: TDM-P-P2, state: ignition, mounted: [], confidence: proposed}
    - {node_id: TDM-P-P2, state: euphoria, mounted: [], confidence: proposed}
    - {node_id: TDM-P-P2, state: distribution, mounted: [], confidence: proposed}
    # C1 组合预算：六段预算带（灰度区间，数值见 TDM-F-C1 节点注释），带内连续插值非查表
    - {node_id: TDM-F-C1, state: capitulation, mounted: [], confidence: proposed}
    - {node_id: TDM-F-C1, state: accumulation, mounted: [], confidence: proposed}
    - {node_id: TDM-F-C1, state: ignition, mounted: [], confidence: proposed}
    - {node_id: TDM-F-C1, state: expansion, mounted: [], confidence: proposed}
    - {node_id: TDM-F-C1, state: euphoria, mounted: [], confidence: proposed}
