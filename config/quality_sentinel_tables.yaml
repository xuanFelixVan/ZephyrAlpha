# =============================================================================
# 数据质量常驻哨兵——表清单与阈值配置（WO-④-01）
# 真源消费者: src/zephyr/data/quality_sentinel.py（zephyr.data.quality_sentinel）
# =============================================================================
# 四类变异检测（三起亿行级事故的共性根因闭环，见
# docs/_working/automation/campaign/mining/04_洗数据/工段作业簿.md §10 WO-④-01；
# 第四类"污染尺"=C-36/续工车道 st-sentpoll-20260919，2026-09-19 加）：
#   a) epoch   纪元变异：业务时间列出现 1970-01-01 附近（< epoch_cutoff）的行
#   b) tz_shift 时区偏移：DateTime64 列盘中小时分布异常（-8h 偏移把 09:30-15:00
#      挪进 01:30-07:00，suspect_hours 密度超比例即告警）
#   c) empty_segment 空段：最近 N 个交易日整表零行
#   d) non_trading_day 污染尺：业务日期落在**非交易日**上的行数 > non_trading_max_rows
#      即告警（滞后尺量"多久没写"，本尺量"写进来的是不是真值"——两把尺禁合并）
#
# 口径说明：
#   - epoch 检测恒为全史扫描（count() 单列谓词，CH 列存代价可接受；历史残留
#     如 tick_data 1970 段只有限全史才能兜住）。
#   - 计数不带 FINAL（ReplacingMergeTree 未合并重复行对变异检测无影响，
#     换取亿行表免 FINAL 全归并开销）。**例外**：non_trading_day 腿两段查询都带
#     FINAL——幽灵日计数须与 B15 案卷的 FINAL 口径逐日可比（手册硬约束）。
#   - non_trading_day 腿按表 opt-in：不写该键=不启用（全史 GROUP BY 代价高，
#     只给已证实有病灶的表配）。判据只准用库内权威日历的负向谓词
#     （NOT IN 开市日），禁 dayOfWeek 判周末（ClickHouse 实测 ISO 序，与官方文档
#     相反）、禁 is_open=0 判非交易日（该表只存开市日 ⇒ 恒空＝假绿）。
#   - DateTime64 列显式 'Asia/Shanghai' 口径（RULE-SCHEMA-TZ）。
schema_version: 1

defaults:
  # 早于该日期的业务时间 = 纪元残留（写侧哨兵约定 1970-01-01，检测放宽到 1990
  # 以兜住其他纪元换算 bug；正常业务数据最早远晚于此）
  epoch_cutoff: "1990-01-01"
  epoch_max_rows: 0                # 允许的纪元残留行数上限（0=零容忍）
  tz_suspect_hours: [0, 1, 2, 3, 4, 5, 6, 7]   # A股连续竞价 09:30-15:00，盘前 <8 点=疑似 -8h
  tz_max_suspect_ratio: 0.05       # suspect 小时行数占比上限
  tz_check_days: 7                 # tz 分布检查回看窗口（日历日，含 ref_date）
  empty_gap_trading_days: 3        # 空段检查：最近 N 个交易日整表零行即告警

tables:
  - table: c1_market.kline_daily
    date_col: trade_date           # Date 列，无 ts_col -> 不做 tz 检测
  - table: c1_market.kline_daily_hfq
    date_col: trade_date
  - table: c1_market.kline_1min
    date_col: trade_date
    ts_col: trade_time             # DateTime64(3,'Asia/Shanghai')，epoch+tz 双检
  - table: c1_market.kline_5min
    # 2026-09-18 全流通战役 st-ff-sentinel 更正：原配 date_col: trade_date，但 system.columns
    # 实测本表**无 trade_date 列**（列集=trade_time/symbol/open/high/low/close/volume/amount/
    # data_source/ingest_ts/exchange/symbol_canonical）-> 三项检查一起 degraded，恰好把
    # "kline_1min 2635 万行 1970 错位"同族的 5 分钟表放回无哨兵态（degraded 只进日志与
    # results[].degraded，不进 findings 计数 -> CLI exit 0 看起来干净）。改用业务时间列。
    date_col: trade_time
    ts_col: trade_time
  - table: c1_market.tick_data
    date_col: trade_date
    ts_col: timestamp              # DateTime64(3,'Asia/Shanghai')
  - table: c1_market.tick_depth_5
    date_col: trade_date
    ts_col: timestamp
    # tick_depth_5.market_type 含 futures：夜盘 21:00-次日 02:30 使 0-2 点合法，
    # 阈值按期货占比放宽（-8h 事故仍必然触发：A股主力时段整体挪入 suspect 窗）
    tz_max_suspect_ratio: 0.35
  - table: c1_market.stock_indicator
    date_col: trade_date
  # --- 全流通战役 st-ff-sentinel-20260918 补册（epoch 检测在本簇实测到真实残留）---
  # 议息日历：实测 435 行 decision_date < 1990-01-01（min=1970-01-01，全表 3086 行）
  # = 纪元残留坐在此表；此前该表只在 data_supply_sentinel 的"新鲜度"维度被度量，
  #   "值本身坏掉"这一维无人盯。不配 ts_col -> 只做 epoch + empty_segment。
  - table: c1_market.rate_decision_calendar
    date_col: decision_date
  # 个股估值：N-1 型（close/amount/turnover 全 0）由 data_supply_sentinel 的
  # column_fill_ratio 腿守；本册只补 epoch/空段两维，避免第二真源。
  # ★ 2026-09-19 C-36 补第四维"污染尺"（本车道，只加严不放松）：B15 实测本表
  #   77,668/259,238 FINAL 行（29.96%）落在 14 个非交易日（2026-08-01..09-13 的周六周日），
  #   而 epoch/空段/新鲜度/填充率四路全绿 ⇒ "日期根本不该有数"这一维此前无人盯。
  #   阈值取 0=零容忍（幽灵行 >0 即告警）；禁为降噪拍一个百分比容忍度（那等于给脏数据发通行证）。
  #   判据谓词与三条硬约束（负向 NOT IN 开市日 / 禁 dayOfWeek / 禁 is_open=0）见
  #   src/zephyr/data/quality_sentinel.py 模块头 + CONSTRUCTION_DISCIPLINE.md §7。
  #   活库实测口径（D-17，2026-09-19 system.columns/system.tables）：
  #     daily_valuation.trade_date = Date（业务日期列，非 ingest_ts DateTime64(3,'UTC')）；
  #     trade_calendar = ReplacingMergeTree(exchange, cal_date)，列 cal_date Date（非 calendar_date）；
  #     trade_calendar 仅 exchange='SSE' 一档，8797 行且 sum(is_open)=count(*)=8797 ⇒ 只存开市日。
  #   治的是**检测面**；那 77,668 行的清理（DB 净删=Owner 门位）与写入端日历闸是 C-35/C-34 另案。
  - table: c1_market.daily_valuation
    date_col: trade_date
    non_trading_max_rows: 0

# =============================================================================
# 排班接线（自动化四要素；2026-09-18 全流通战役 st-ff-sentinel-20260918 落地）
# =============================================================================
# 本件**不在 tasks.yaml 登记任务条目**——本仓特殊时段类槽位（integrity_check /
# catchup_guard / data_supply_sentinel / consensus_crosscheck）一律不走 tasks.yaml：
# 任务条目须绑 source/capability/provider 三件，哨兵不是数据源，硬塞=调度器空跑
# "时段 X 无任务"后静默返回成功的 R-021 型假通道（实测判据见
# src/zephyr/data/scheduler.py:204 _run_special_schedule 与 :2110 空任务分支）。
# 正门形态=由 L13 data_supply_sentinel 槽位托管（宿主 src/zephyr/data/supply_sentinel.py
# 的 _run_hosted_quality_sweep 调 run_hosted_sweep），四要素落点：
#   自动触发 schedule.yaml data_supply_sentinel（06:50 日批，APScheduler）
#   自动运行 run_hosted_sweep -> load_specs -> run_sentinel（CH 只读经 DatabaseService）
#   自动维护 sweep_cadence_days 节奏闸（全史 epoch 扫描代价高，按报告日期自愈节流；
#            报告文件名即状态真源，不另立第二 state 文件）
#   自动关闭 data/runtime/quality_sentinel.disabled 标记文件（每次触发实查，即时生效）
wiring:
  host_schedule: data_supply_sentinel
  sweep_cadence_days: 7
  disabled_flag: data/runtime/quality_sentinel.disabled
