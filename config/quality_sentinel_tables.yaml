# =============================================================================
# 数据质量常驻哨兵——表清单与阈值配置（WO-④-01）
# 真源消费者: src/zephyr/data/quality_sentinel.py（zephyr.data.quality_sentinel）
# =============================================================================
# 三类变异检测（三起亿行级事故的共性根因闭环，见
# docs/_working/automation/campaign/mining/04_洗数据/工段作业簿.md §10 WO-④-01）：
#   a) epoch   纪元变异：业务时间列出现 1970-01-01 附近（< epoch_cutoff）的行
#   b) tz_shift 时区偏移：DateTime64 列盘中小时分布异常（-8h 偏移把 09:30-15:00
#      挪进 01:30-07:00，suspect_hours 密度超比例即告警）
#   c) empty_segment 空段：最近 N 个交易日整表零行
#
# 口径说明：
#   - epoch 检测恒为全史扫描（count() 单列谓词，CH 列存代价可接受；历史残留
#     如 tick_data 1970 段只有限全史才能兜住）。
#   - 计数不带 FINAL（ReplacingMergeTree 未合并重复行对变异检测无影响，
#     换取亿行表免 FINAL 全归并开销）。
#   - DateTime64 列显式 'Asia/Shanghai' 口径（RULE-SCHEMA-TZ）。
schema_version: 1

defaults:
  # 早于该日期的业务时间 = 纪元残留（写侧哨兵约定 1970-01-01，检测放宽到 1990
  # 以兜住其他纪元换算 bug；正常业务数据最早远晚于此）
  epoch_cutoff: "1990-01-01"
  epoch_max_rows: 0                # 允许的纪元残留行数上限（0=零容忍）
  tz_suspect_hours: [0, 1, 2, 3, 4, 5, 6, 7]   # A股连续竞价 09:30-15:00，盘前 <8 点=疑似 -8h
  tz_max_suspect_ratio: 0.05       # suspect 小时行数占比上限
  tz_check_days: 7                 # tz 分布检查回看窗口（日历日，含 ref_date）
  empty_gap_trading_days: 3        # 空段检查：最近 N 个交易日整表零行即告警

tables:
  - table: c1_market.kline_daily
    date_col: trade_date           # Date 列，无 ts_col -> 不做 tz 检测
  - table: c1_market.kline_daily_hfq
    date_col: trade_date
  - table: c1_market.kline_1min
    date_col: trade_date
    ts_col: trade_time             # DateTime64(3,'Asia/Shanghai')，epoch+tz 双检
  - table: c1_market.kline_5min
    date_col: trade_date
    ts_col: trade_time
  - table: c1_market.tick_data
    date_col: trade_date
    ts_col: timestamp              # DateTime64(3,'Asia/Shanghai')
  - table: c1_market.tick_depth_5
    date_col: trade_date
    ts_col: timestamp
    # tick_depth_5.market_type 含 futures：夜盘 21:00-次日 02:30 使 0-2 点合法，
    # 阈值按期货占比放宽（-8h 事故仍必然触发：A股主力时段整体挪入 suspect 窗）
    tz_max_suspect_ratio: 0.35
  - table: c1_market.stock_indicator
    date_col: trade_date
