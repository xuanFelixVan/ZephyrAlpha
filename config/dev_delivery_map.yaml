    auto_enqueue: false
    prescription_zh: 先 claim_files（或 --claim-only）；同码第二义=--release-only 回读仍有持有
  - code: 7
    statuses: []
    auto_enqueue: false
    prescription_zh: claim-only 部分文件被他人持有（纯 claim 快速路径，不经 gateway.commit，无状态枚举）
  - code: 8
    statuses:
    - WORKTREE_VIOLATION
    auto_enqueue: false
    prescription_zh: 双义：①WORKTREE_VIOLATION→--allow-non-worktree；②P0-A 锁外预检 blocking→按清单给旗，诊断可 --skip-preflight（锁内仍全套照跑）
  - code: 9
    statuses:
    - COMMIT_SCOPE_VIOLATION
    auto_enqueue: false
    prescription_zh: --allow-multi-domain（gate+自家测试同批合法）
  - code: 10
    statuses:
    - MERGE_IN_PROGRESS
    auto_enqueue: false
    prescription_zh: --merge-finalize（预检自动跳过）；非本人 merge→等待或升级 Owner；gateway 三处判定（锁外/锁内 TOCTOU 复检/无锁降级路径）
