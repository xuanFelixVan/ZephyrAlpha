laws:
- 正门唯一：一切提交经 git_commit.py/GitCommitGateway 正门，禁裸 git commit 与 plumbing 绕过（骨架 §0 门① 三触发源终点同归正门）
- 队列是正门：全局锁争用不空转，锁超时自动改道 pending；直连与队列不混抢（骨架 §0 门② 交接面 5）
- 门禁一套不裁：队列落地仍走网关全门禁链（commit_queue_landing 头 INVARIANTS 原文声明）
- 死信不卡队：落地普通 Exception→dead/ 队列继续排空；BaseException 留 processing 等回收（§1 D11-D01）
- 跨车道交接必须有实体：三车道 10 个交接面逐一实证（§0 门②），无实证交接不许画边
boundary:
- 不画运行时治理流水线（孵化/监控/熔断/收割/自愈）——归 GOMAP；其 out_of_scope_refs 明示排除提交门禁体系（config/governance_operations_map.yaml），是本图立图正门依据
- 不画交易决策逻辑——归 TDM（config/trading_decision_map.yaml），引用不吸收
- '不画单施工任务 15 步生命周期——construction_workflow_policy Step10/Step12 自标「不重复，引用」转引本域真源（骨架 §3 撞车判定 #2）'
- 叶层清单（门禁条目正文/reconciler 条目/dead_reason 标记串）进作业簿不进图本体：本图只挂计数与指针（INV-1 铁律，TDM 同款）
