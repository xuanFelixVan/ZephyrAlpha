module_id: GOV-DOC-011
version: "1.0.1"
schema_version: "1.0.0"
doc_type: rule
title: "Compression Policy"
status: active
ttl: permanent
created: "2026-04-27"
immutable_core: true
implementation_status: "experimental active — consumed by doc_compressor.py at runtime. Immutable Core fields (min_chars/max_chars/preserve_*) enforced by CompressionInvariantError."

policy:
  # 压缩后正文最小字符数（≥ 100）
  # 200 为保守下界，确保压缩结果可读
  min_chars: 200

  # 压缩后正文最大字符数（≤ 10000）
  # 4000 字符约 = 1000 tokens（cl100k_base）
  max_chars: 4000

  # 保留所有 Markdown 章节标题（#、##、### 等）
  # 违反时 raise CompressionInvariantError(field="preserve_structure")
  preserve_structure: true

  # 保留文档 frontmatter（YAML --- 块）
  # 违反时 raise CompressionInvariantError(field="preserve_provenance")
  preserve_provenance: true

  # 须整块保留的标记字符串列表
  # 标记对：START 标记 + END 标记（名称对称替换）
  # 违反时 raise CompressionInvariantError(field="preserve_immutable_blocks")
  preserve_immutable_blocks:
    - "<!-- IMMUTABLE_START -->"
    - "<!-- AFFECTED_FILES_START -->"
    - "<!-- CIRCUIT_BREAKER_START -->"
