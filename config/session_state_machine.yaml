module_id: MOD-INF-002
version: "1.0.0"
schema_version: "1.0.0"
doc_type: rule
title: "Session State Machine"
status: active
ttl: permanent
implementation_status: "operational — consumed by src/zephyr/orchestration/runtime_core/orchestrator/session_manager.py (SessionManager v1.1 — CT-003)"

description: "Defines the lifecycle states and transitions for AI agent sessions in the ZephyrAlpha pipeline"

states:
  - name: idle
    description: "Session is initialized but no task is being processed"
    entry_action: "Reset context, clear working memory"
    exit_action: "Log session start time"

  - name: active
    description: "Session is actively processing a task"
    entry_action: "Acquire task lock, start token counter"
    exit_action: "Checkpoint progress"

  - name: paused
    description: "Session is temporarily suspended (user intervention or dependency wait)"
    entry_action: "Save context snapshot, release task lock"
    exit_action: "Reload context snapshot"

  - name: completed
    description: "Session has successfully finished all tasks"
    entry_action: "Write session log, update pipeline tracker"
    exit_action: "Archive session artifacts"

  - name: archived
    description: "Session data is archived for future reference"
    entry_action: "Compress session data, move to archive"
    exit_action: "Purge from active memory"

transitions:
  - from: idle
    to: active
    condition: "Task assigned and all preconditions met"
    action: "Load task context, begin processing"
    verifiable: true
    verification_method: "Check session log for task assignment timestamp"

  - from: idle
    to: completed
    condition: "User cancels session before any task starts"
    action: "Write session log with cancellation note, no artifacts generated"
    verifiable: true
    verification_method: "Verify session log has pre-task cancellation record"

  - from: active
    to: paused
    condition: "User pause command OR dependency unavailable OR token budget exceeded"
    action: "Save state, release resources"
    verifiable: true
    verification_method: "Check session state in state store"

  - from: active
    to: completed
    condition: "All tasks in session finished successfully"
    action: "Write session log, update tracker"
    verifiable: true
    verification_method: "Verify session log exists and tracker updated"

  - from: paused
    to: active
    condition: "User resume command AND dependencies available AND token budget remaining"
    action: "Reload context, resume processing"
    verifiable: true
    verification_method: "Check session state transition in log"

  - from: paused
    to: completed
    condition: "User cancels remaining tasks"
    action: "Write partial session log with cancellation note"
    verifiable: true
    verification_method: "Verify session log has cancellation record"

  - from: completed
    to: archived
    condition: "Archive TTL reached (24h after completion)"
    action: "Compress and move to archive storage"
    verifiable: true
    verification_method: "Check archive directory for session data"

timeout_rules:
  - state: active
    max_duration: 4
    duration_unit: hours
    on_timeout: transition_to_paused
    timeout_action: "Auto-pause session, notify user"
    verifiable: true
    verification_method: "Verify auto-pause triggered after 4h"

  - state: paused
    max_duration: 72
    duration_unit: hours
    on_timeout: transition_to_completed
    timeout_action: "Auto-complete with partial results, flag as timed_out"
    verifiable: true
    verification_method: "Verify auto-complete after 72h pause"

exception_handling:
  - exception: encoding_error
    action: "Pause session, log error, notify user"
    recovery: "User must fix encoding before resume"
    verifiable: true
    verification_method: "Check error log and session state"

  - exception: dependency_not_found
    action: "Pause session, add to deferred queue"
    recovery: "Auto-resume when dependency becomes available"
    verifiable: true
    verification_method: "Check deferred queue entry"

  - exception: token_budget_exceeded
    action: "Pause session, checkpoint progress"
    recovery: "User must approve additional token budget"
    verifiable: true
    verification_method: "Check token counter vs budget"

  - exception: unrecoverable_error
    applicable_states: [idle, active, paused]
    action: "Force complete session with error status"
    recovery: "No auto-recovery; requires manual intervention"
    verifiable: true
    verification_method: "Check session log for error status"

state_invariants:
  - "Session must have exactly one state at any time"
  - "Transition from completed to active is forbidden (start new session instead)"
  - "Transition from archived to any other state is forbidden"
  - "Each session must have a unique session_id"
  - "Session log must be written within 5 minutes of state change"
