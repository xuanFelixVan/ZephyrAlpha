# =============================================================================
# secret_registry.yaml — ZephyrAlpha 密钥声明注册表（结构化真源）
# =============================================================================
# 用途：项目所有密钥/凭证/配置变量的结构化注册表，与 .env.example 双源对齐。
#
# 裁定来源：#ARCH-SECRETS-GOV-001 裁定 S-1（Phase 1 显性化）
# 规则依据：TRAE-031 SEC-001~SEC-006
# 文档配套：SECRETS.md（密钥管理文档，含读取规范与新增流程）
#
# 字段说明：
#   key          — 环境变量名（唯一标识）
#   service      — 所属服务/模块（用于 get_service_secret(key, service) 定位）
#   env_file     — 存放文件（.env=根目录自动加载，config/.env.{service}=手动加载）
#   category     — secret(密钥) / credential(凭证) / config(非密钥配置)
#   required     — true(必需) / false(可选，按需配置)
#   description  — 用途说明
#   obtain       — 获取方式（URL 或操作指引）
#   rotation_days— 轮换周期（天），引用 TRAE-031 SEC-004；null=不强制轮换
#   since        — 登记日期（YYYY-MM-DD）
#
# 加载机制：
#   .env（根目录）       — zephyr/__init__.py 自动加载到 os.environ
#   config/.env.{service} — 需手动调用 get_secret_from_file() 或 get_service_secret()
#
# 读取规范（TRAE-031 SEC-002 + 裁定 S-2）：
#   根目录 .env 的 KEY    → get_required_secret("KEY") / get_secret_or_default("KEY")
#   config/.env.{service} → get_service_secret("KEY", "service")
#   禁止裸 os.getenv / os.environ.get / os.environ["KEY"]
# =============================================================================

module_id: MOD-INF-002
