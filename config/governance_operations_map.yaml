legend:
- tag: birth_registry
  name_zh: 谁生谁死有登记
  desc_zh: 进程出生走统一产房,退休走登记销户,不留无名进程
- tag: alive_proof
  name_zh: 你还活着吗
  desc_zh: 心跳/探针/看门狗互检:证明系统活着,死了立刻有人知道,不是等 Owner 发现
- tag: resource_alert
  name_zh: 资源见底前要喊
  desc_zh: 内存/盘/GPU/上下文预算到线前告警,不是爆了再哭
- tag: emergency_brake
  name_zh: 紧急刹车人人可拉
  desc_zh: kill_switch/熔断:出大事一刀切停,宁错停不狂奔
- tag: reaper_duty
  name_zh: 垃圾要有人收
  desc_zh: 孤儿/僵尸/临时残留定期收割,系统才不会淹死自己
- tag: self_heal
  name_zh: 坏了要自己好
  desc_zh: reconciler 事件触发对不上就修,禁定时空转
- tag: review_ledger
  name_zh: 事后要翻旧账
  desc_zh: 干过的事有账可查,犯过的病有病历可翻
- tag: no_duplicate
  name_zh: 模块不能重复建设
  desc_zh: 同标签多钉=重复簇显影位;无价值且已有重复的并/退
- tag: orphan_claim
  name_zh: 孤儿要认领或销户
  desc_zh: 没人认领也没人消费的模块,要么上户口要么退役
- tag: ledger_match
  name_zh: 账实要对得上
  desc_zh: wiring 四态:说接了线就得真有线,机扫重跑不漂移
