    casebooks:
    - 'SV#方案'
    - 'SV#裁定'
    - 'DCS#队列'
    - 'AP#域三'
  - id: GOM-L6
    name_zh: 复盘审计
    desc_zh: 审计日志/状态面板/治理复盘
    mounts:
    - zephyr.trading.status_dashboard
    - zephyr.trading.ai_audit_logger
    - scripts.ops_guard
    casebooks:
    - 'RV1#全卷'
    - 'RV2#全卷'
