#
# 路由表语义
# ----------
# triggers.<trigger_type>:
#   handler:     完全限定的处理器函数路径（"<module>.<function>"）
#   description: 触发场景的中文说明（≤ 100 字符）
#   safety:      L / M / H —— 触发器安全等级
#   enabled:     是否启用（false 时 dispatch 静默忽略）
#
# 处理器函数签名
# --------------
# def handler(payload: dict[str, Any], **context) -> Any:
#     ...
# - payload: TriggerRouter.dispatch() 透传的负载字典
# - context: 关键字参数（如 session_id / now / dry_run）
# - 返回值通过 RouterDispatchResult.handler_result 返回给调用方
#
# Phase 1d 起始集（5 种 trigger_type）
# -----------------------------------
# 1. onboarding         — 新会话/新 Agent 注册时触发上下文加载
# 2. drift_detected     — Drift Detector 报告偏移时触发恢复
# 3. compression_needed — Token 预算紧张时触发文档压缩
# 4. cleanup_due        — 周期性清理任务（定时）
# 5. blueprint_published — 新蓝图发布后触发反思 / KE 索引
#
# Phase 2 扩展须经 Owner 审批（Human-Gated）

version: "1.0.0"
schema_version: "1.0.0"
doc_type: rule
title: "Trigger Router Table"
status: active
ttl: permanent

triggers:
  onboarding:
    handler: "zephyr.orchestrator.trigger_router.handle_onboarding_stub"
    description: "新会话或 Agent 注册时加载上下文与历史"
    safety: "M"
    enabled: true

  drift_detected:
    handler: "zephyr.orchestrator.trigger_router.handle_drift_stub"
    description: "Drift Detector 报告偏移时触发恢复流程"
    safety: "H"
    enabled: true

  compression_needed:
    handler: "zephyr.context_engine.context_budget_tracker.handle_compression_needed"
    description: "Token 预算紧张时通过 DocCompressor 压缩文档"
    safety: "M"
    enabled: true

  cleanup_due:
    handler: "zephyr.orchestrator.trigger_router.handle_cleanup_stub"
    description: "周期性清理任务（孤儿快照 / 过期审计日志等）"
    safety: "L"
    enabled: true

  blueprint_published:
    handler: "zephyr.orchestrator.trigger_router.handle_blueprint_stub"
    description: "新蓝图发布后触发反思循环与 KE 索引"
    safety: "M"
    enabled: true

  blueprint_lookup:
    handler: "zephyr.orchestrator.trigger_router.handle_blueprint_lookup_stub"
    description: "AI Agent 查询'当前任务该读哪份蓝图'——路由到 config/blueprint_routing.yaml"
    safety: "L"
    enabled: true

