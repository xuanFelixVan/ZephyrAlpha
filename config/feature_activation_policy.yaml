# ZephyrAlpha 2.0 — 功能激活策略（Feature Activation Policy）
#
# 功能：追踪各子系统的使用率，确保 AI Agent 充分利用已实现的功能
# 目的：从"AI被动发现功能"变成"功能主动推给AI"
#
# 机制
# ----
# 1. 每次 session 结束时统计使用了哪些 Skill/MCP 工具/触发路由
# 2. 与本策略的目标对比
# 3. 未达标的功能在下次 session 冷启动时强制注入到热记忆
#
# v0.2.0: 初始版本
# -----------------------------------

version: "1.0.0"
schema_version: "1.0.0"
doc_type: rule
title: "Feature Activation Policy"
status: active
ttl: permanent

# =========================================================================
# §1  触发路由激活目标
# =========================================================================

trigger_router:
  activation_rate_target: 0.8
  reminder_on_idle_sessions: 3
  triggers:
    onboarding:
      target_activation_rate: 1.0
      description: "每个新 session 必须触发"
    drift_detected:
      target_activation_rate: 0.5
      description: "涉及漂移修复的任务应触发"
    compression_needed:
      target_activation_rate: 0.3
      description: "长上下文任务应触发"
    cleanup_due:
      target_activation_rate: 0.2
      description: "周期性清理"
    blueprint_published:
      target_activation_rate: 0.4
      description: "蓝图相关任务应触发"
    blueprint_lookup:
      target_activation_rate: 0.8
      description: "AI 修改代码前应查询蓝图"

# =========================================================================
# §2  MCP Server 使用目标
# =========================================================================

mcp_servers:
  usage_tracking: true
  idle_threshold_days: 7
  servers:
    task_manager:
      target_usage_per_session: 2
      description: "每个 session 至少创建/查询 2 个任务"
    knowledge_base:
      target_usage_per_session: 3
      description: "每个 session 至少查询 3 次知识库"
    gate_engine:
      target_usage_per_session: 1
      description: "修改代码前至少执行 1 次门禁检查"
    session_handoff:
      target_usage_per_session: 1
      description: "session 结束时至少保存 1 次交接包"
    intent_router:
      target_usage_per_session: 1
      description: "复杂任务至少路由 1 次"
    blueprint_search:
      target_usage_per_session: 2
      description: "修改代码前至少搜索 2 次蓝图"
    governance:
      target_usage_per_session: 1
      description: "修改文件前至少检查 1 次锁协议"
    vector_memory:
      target_usage_per_session: 2
      description: "每个 session 至少读写 2 次向量记忆"

# =========================================================================
# §3  Skill 覆盖目标
# =========================================================================

skills:
  coverage_target: 0.9
  unused_skill_alert: true
  alert_after_idle_sessions: 5
  domain_skills:
    SKILL-DOM-DBS-001:
      target_activation_rate: 0.3
    SKILL-DOM-MCP-001:
      target_activation_rate: 0.3
    SKILL-DOM-CTX-001:
      target_activation_rate: 0.2
    SKILL-DOM-FBL-001:
      target_activation_rate: 0.2
    SKILL-DOM-GAT-001:
      target_activation_rate: 0.5
    SKILL-DOM-AGT-001:
      target_activation_rate: 0.2
    SKILL-DOM-BLU-001:
      target_activation_rate: 0.6
    SKILL-DOM-DRF-001:
      target_activation_rate: 0.2
    SKILL-DOM-KNW-001:
      target_activation_rate: 0.4
    SKILL-DOM-RBK-001:
      target_activation_rate: 0.1
    SKILL-DOM-VMS-001:
      target_activation_rate: 0.3
    SKILL-DOM-A2A-001:
      target_activation_rate: 0.1
  role_skills:
    SKILL-ROLE-ARCH-001:
      target_activation_rate: 0.4
    SKILL-ROLE-IMPL-001:
      target_activation_rate: 0.8
    SKILL-ROLE-GOV-001:
      target_activation_rate: 0.3

# =========================================================================
# §4  冷启动强制注入策略
# =========================================================================

cold_start_injection:
  enabled: true
  strategy: "inject_underused_features"
  max_injection_tokens: 2000
  rules:
    - condition: "trigger_router.activation_rate < 0.5"
      inject: "trigger_router_summary"
      message: "⚠️ 触发路由使用率低于50%，请检查可用的触发器"
    - condition: "mcp_servers.idle_count > 3"
      inject: "mcp_server_catalog"
      message: "⚠️ 超过3个MCP Server处于空闲状态，请检查可用工具"
    - condition: "skills.coverage < 0.7"
      inject: "skill_catalog"
      message: "⚠️ Skill覆盖率低于70%，请检查可用的领域技能"
