[defaults]
pythonutf8 = 1

# py.ini [pytest] 段 — 交接精简跑法（handoff minimal pytest config，裁定#278 定址）
#
# 真源方向：本段是 pyproject.toml [tool.pytest.ini_options] 的**精简继承版**——markers 名集合
# 与 timeout 以 pyproject 为准，本段跟随。两者对齐由
# scripts/governance/d7_code/compare_pytest_configs.py 看守（pre-commit
# GATE-PYTEST-CONFIG-DRIFT），漂移即阻断提交。改 pyproject 的 markers/timeout 时 MUST 同步本段。
#
# 跑法：python -m pytest -c py.ini <目标>（第 1 轮精简；第 2 轮 pyproject 默认全量。
# 同一测试两配置必须同一判定，否则就是"换配置就绿/红"的 flaky 温床。）
#
# 精简 = 收窄语义而非放宽语义：省略 -v/--tb/filterwarnings，但保留 --strict-markers
# + 全量 marker 注册 + timeout 兜底 + 收集卫生镜像。
# 禁项：cache_dir 绝不可写入本段——精简跑法与 `-p no:cacheprovider` 组合必
# INTERNALERROR（pyproject P1-4 注记实证）。
#
# 定址沿革（裁定#275→#278）：曾拟独立件 pytest_min.ini 驻根，落地时 .gitignore 单点放行
# 撞 PROTECTED-PATHS（须 Owner 审批，无 CLI 逃生旗）——永久产物的生命周期里嵌一道人工闸，
# 与"管线全自动无需人工参与"的目标结构性冲突。改寄居既有纳管件 py.ini：同目录（rootdir
# 仍是仓库本体，`-c <ini>` 的 rootdir=ini 所在目录，实测）、同"非 pytest 自动发现名"性质
# （pytest.ini 才是自动发现名，本段只有显式 -c 才生效，不改默认跑法）、且 py.ini 已在
# root_directory_whitelist 且未被忽略（零 protected-path/零合同变更）。
# 为什么不能放 config/：DCR-005 规定 config/ 只收 .yaml/.yml/.json，全合同 77 个目录条目
# 无一允许 .ini，且 pytest 只认 .ini/.cfg/.toml 三种后缀，改名即失效。
# 为什么不能回 .runtime/tmp/：TTL 清扫区（GATE-ROOT-TEMP-SWEEP 白名单动态取 git ls-tree
# HEAD，未 tracked 即可能被移走，本轮实测两次被扫）+ rootdir 出仓。
# 段名铁律（实测踩坑，2026-09-16）：`.ini` 文件 pytest 只认 **[pytest]** 段——
# `[tool:pytest]` 仅对 `.cfg`（setup.cfg）生效（_pytest/config/findpaths.py
# load_config_dict_from_file 按后缀分支）。误写 `[tool:pytest]` 时 pytest 仍打印
# `configfile: py.ini` 却零配置生效：markers/--strict-markers/timeout/norecursedirs
# 全部失效 = "换配置就绿/红" 的静默放宽（探针实证：Unknown pytest.mark.slow 告警
# + 3 passed）。py.ini 不在 pytest 自动发现名清单（pytest.ini/.pytest.ini/
# pyproject.toml/tox.ini/setup.cfg），故本段只有显式 -c 才生效，不改默认跑法。
# pytest ini 语义提示（历史踩坑）：markers 是 linelist——**每行一个 marker**，单行分号写法
# 只注册第一个 marker，叠加 --strict-markers 后凡用未注册 marker 的文件收集即炸；TOML
# 数组语法（[ "..." ]）在 ini 中不支持（实测 unexpected ']'）。

[pytest]
# 精简输出（不带 -v/--tb），但 strict-markers 必须保留——否则 marker 集漂移不可见
# 甲案断源止血（统筹 2026-10-13 追加③）：下列 --deselect 六支必须与 pyproject.toml addopts
# 逐条等值（compare_pytest_configs.py 看守项 E）。理由＝`-c py.ini` 精简跑法与默认跑法都是
# 测试轮的入口，只在单侧排除＝假止血；名单真源与退役条件见 pyproject.toml 同段注记。
# 注意（configparser 语义）：注释须顶格——缩进行会被当作 addopts 值的一部分。
addopts = -q --strict-markers
    --deselect=tests/backtest/test_sim_daily_runner.py::test_plan_bridge_unclassified_is_pending
    --deselect=tests/backtest/test_sim_daily_runner.py::test_plan_bridge_defense_state_translates_flat
    --deselect=tests/backtest/test_sim_daily_runner.py::test_plan_bridge_attack_state_is_unexecutable
    --deselect=tests/backtest/test_sim_daily_runner.py::test_plan_bridge_no_plan_no_write
    --deselect=tests/backtest/test_sim_daily_runner.py::test_replay_one_entry_math_and_fresh_wallet_funding
    --deselect=tests/backtest/test_sim_daily_runner.py::test_replay_one_flat_wallet_gets_notional_not_zero
# 无参裸跑只指回 canonical 测试树，不收集仓库残留
testpaths = tests
# norecursedirs 在 -c 整体替换 pyproject 后必须自带（#ARCH-COLLECTION-HYGIENE-001：
# 该选项覆盖 pytest 默认值，故默认项须重含；禁加 data/tmp 宽泛名——tests/data 与
# tests/zephyr/data 是真实测试目录，加宽会静默漏测）
norecursedirs = *.egg .* .runtime _darcs build CVS dist node_modules venv {arch}
# B1 假挂起兜底：与 pyproject 同值（compare_pytest_configs 看守项 B）
timeout = 120
# marker 注册集：必须与 pyproject 名集合逐项相等（看守项 A）——linelist 每行一个
markers =
    slow: marks slow tests (deselect with '-m "not slow"')
    e2e: marks end-to-end tests (deselect with '-m "not e2e"')
    security: marks security-critical tests
    financial: marks financial calculation tests
    filterwarnings: marks tests that suppress specific warnings (required by --strict-markers)
    asyncio: marks asyncio async tests (requires pytest-asyncio plugin to run)
    silent_failure: marks silent-failure regression tests (Ruling:100PCT-AI-GOVERNANCE P0-P3)
    quick: marks quick-layer governance script smoke tests (D1-D4/D8, CAND-GOVTEST-001)
    critical: marks critical-layer governance script smoke tests (D5-D7, CAND-GOVTEST-001)
