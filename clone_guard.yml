# clone_guard.yml — Zephyr CloneGuard 统一配置 (Phase A MVP)
# 真源: docs/03_modules/_cross_layer/clone_guard/blueprint.md §6
# 治本: 100% AI 开发场景下的重复造轮子病根——能合并的必须合并，能精简的必须精简

version: 1
project_root: .
languages: [python]

# ─── 运行环境（L1 离线优先原则——#ARCH-FORCE-MERGE-DEDUP-001 Phase A 闭合）───
# L1 pre-commit 路径必须无网络可用：AST 哈希（Tier 1）是 L1 唯一检测手段，
# CodeSAGE 嵌入模型（200MB）只在 L2 周期审计加载。
# HF_HUB_OFFLINE=1 强制 echo-guard 跳过模型下载，使用 Tier 1 检测。
env:
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# 忽略路径（除 echo-guard.yml 自身排除规则外的补充忽略）
ignore_paths:
- "tests/"
- "docs/"
- ".runtime/"
- ".echo-guard/"
- "**/_generated/"

# ─── Layer 1: pre-commit 拦截（Phase A + Phase B 三引擎）───
# L1 引擎集：echo_guard（AST 哈希 Tier1，离线必装）+ ast_grep（结构化规则）+ redup（语义克隆 T3/T4）
- src/zephyr/gov_enforcement/commit_gates/
pre_commit:
  timeout_sec: 30
  fail_on: extract          # extract=3+副本硬阻断(必须合并), review=2副本警告(尽量精简)
  fail_closed: false        # 全引擎不可用时 warn-only 不阻断(降级兜底)
  engines:
    echo_guard:
      # R1-R4 裁定（2026-09-12，st-encfix 夜班，Owner 批准"分层归位"）：
      # L1 保留 enabled:true——卸载 onnxscript（R1 已执行）后 CLI 在 Tier2 缺依赖路径
      # 快速失败降级（实测 CAPABILITY-OVERLAP 0.76s，不再烧 30s 预算），ast_grep 完好。
      # 上游 echo-guard 0.4.1 三缺陷（Tier2 治本回位条件=R3，修复版发布后执行）：
      # ① embeddings.npy append-only 不压实（28K 函数理论 ~116MB，实测膨胀 5.2GB=48×，
      #    全量重建只增不减）；② 离线模式（HF_HUB_OFFLINE=1）下模型缺失路径仍尝试
      # HF 网络请求（10s 超时×重试=挂死主因之一）；③ Tier2 相似度批 (32,1024,1024)
      # 128MiB 分配失败后慢速降级（单次 check 400s 级，实测 475s/399s）。
      # 回位动作：pip install -U echo-guard（≥修复版）+ pip install onnxscript +
      # 联网窗口删 embeddings.npy 重建压实 + 验证 check <30s，然后 L1/L2 Tier2 复活。
      # 索引卫生仪表盘=RECONCILER-HEALTH 2.6 探针（signal 残留>7 天/npy>2GB 告警）。
      enabled: true         # Phase A——L1 离线优先 AST 哈希检测
    ast_grep:
      enabled: true         # Phase B——结构化规则检测（no-bare-except 等）
    redup:
      # B22② 治本（2026-09-05）：当时本机未安装 redup CLI，诚实化禁用，注明
      # "安装 CLI 后翻回 true"。→【2026-09-12 兑现：st-encfix 接活批】pip 安装 redup
      # 1.x 实装成功（shutil.which 命中），翻回 true 复活 T3/T4 语义克隆检测——
      # 填补 echo_guard Tier2 休眠期（R1-R4 裁定，见上方 echo_guard 段）的
      # 语义查重空缺。配套治本：redup 1.x 实测 stdout=进度 banner+JSON 混合输出，
      # 适配器裸 json.loads 恒降级——redup_adapter 已加混合输出兼容（首个 "{" 截取）。
      # 实测：changed-only 模式 307 变更文件 1.8s（30s 预算内富余）。
      enabled: true
      min_sim: 0.85         # §3.3 最小相似度阈值
      max_groups: 0         # 0=不限重复组数
      mode: changed-only    # L1 增量模式（L2 审计改 semantic）
      base_ref: HEAD        # L1 changed-only 对比基（pre-commit 钩子按合并基设置，如 origin/dev）

# ─── 严重性映射 (统一) ───
severity:
  extract: block            # 3+副本, 硬阻断
  review: warn              # 2副本, 警告
  acknowledged: skip        # 已确认的合理重复

# ─── Layer 2: 周期审计（Phase C——事件触发，非 cron）───
# audit 由 MCP 工具 clone_guard.audit_status 或 CLI 事件触发（守"禁止时间触发"约束）
audit:
  timeout_sec: 300          # L2 全量审计 5 分钟（比 L1 宽松）
  engines:
    mcrit:
      enabled: false        # 默认禁用——需先 `mcrit index` 建索引后启用
      index_path: .mcrit/index.db
      query_threshold: 0.7  # MinHash 相似度查询阈值

# ─── Layer 3: 跨边界审计（Phase C——跨仓库合规）───
compare:
  timeout_sec: 600          # L3 跨仓库 10 分钟
  vendetect_cross_repo: false    # 默认禁用——按需触发（AGPL 工具，独立目录隔离）
  vendetect_remote_url:          # 启用时填远程仓库 URL
  relate_prescreen: true         # 已开启（裁定：复活 L0 MCP search_functions 预防——AI 写前搜已有函数引导复用；flag 关闭时 search() 恒返回空。detect 预筛 redundant 但无害，不在 L1/L2 引擎集，仅 L3+MCP 按需触发）
  relate_index_path: .relate/index  # 保留（磁盘持久化预留）；MVP 进程内索引
  relate_top_k: 10               # 预筛返回 top-k
  relate_threshold: 0.7          # LSH 候选阈值（MinHash Jaccard 估计）
  relate_num_perm: 128           # MinHash 排列数（128=标准精度/性能权衡）
  relate_shingle_size: 5         # k-gram shingle 大小（token 数）

# ─── 聚合策略 (Phase B——多引擎结果合并) ───
aggregation:
  filter_minority: false     # True=过滤仅单引擎报告的 findings（consensus="single"），False=保留但标记
