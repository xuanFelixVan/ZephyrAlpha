## 盲点发现

- codegen 需要 marker 分区机制（`# ==== BEGIN CODGEN ====` / `# ==== END CODGEN ====`）保留手写代码
- bool YAML 默认值 `false` → Python `False` 的转换必须用 `isinstance(default, bool)` 检测
- `from __future__ import annotations` 必须位于 .py 文件最顶部——marker 不能在其前方有任何代码

## 关键决策

- 选择 marker 分区机制让 codegen 与手写代码共存——而非将 enum 定义迁移到独立文件
- _extract_hand_maintained() 在 codegen 中识别并保留 enum class + 函数定义
- ContractRegistry 使用单例模式（get_registry()）确保全局唯一

