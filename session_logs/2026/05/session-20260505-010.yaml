  ### Bug 1: 字段顺序 (line 315)

  ```python

  # BEFORE: 按 required 标志分组，required=True 的 Dict 字段按字母序排在必填字段之前

  fields = sorted(fields, key=lambda f: (

      0 if f.get("required", False) is True else (1 if _has_effective_default(f) else 2),

      f.get("name", "")

  ))



  # AFTER: 按是否有 default 分组——所有无 default 字段在前，有 default 在后

  fields = sorted(fields, key=lambda f: (

      0 if not _has_effective_default(f) else 1,

      f.get("name", "")

  ))

  ```

