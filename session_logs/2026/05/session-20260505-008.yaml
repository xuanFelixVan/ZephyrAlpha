  # Session Log: session-20260505-008



  ## Phase D 根因发现与修复



  ### 用户报告的问题



  每次运行 `pytest tests/integration/` 时，`test_get_stock_list` 卡住很久（拉取 AkShare 5400+ 只A股数据）。

  用户观察：每次对话都触发——怀疑有自动化流程在不必要地执行。



  ### 根因分析



  **链路：**

  ```

  保存 src/zephyr/**/*.py 文件

    → GATE-18 pre-commit hook 触发 (.pre-commit-config.yaml:272-279)

      → python -m pytest tests/ --collect-only

        → pytest 导入 test_akshare_real_data.py

          → 模块级代码立即执行 _is_network_available()

            → socket.connect(("push2his.eastmoney.com", 80))

              → 阻塞 5 秒等待超时

  ```



  **问题所在：**

  1. **GATE-18** 的 `always_run: true` + `files: "^src/zephyr/.*\\.py$"` 导致每次源码变更都触发

  2. `test_akshare_real_data.py` 在模块导入时（非测试执行时）就执行网络检测

  3. `pytest --collect-only` 虽然只收集不执行——但 `import` 本身就会触发模块顶层代码



  ### 修复



  **修复 1: test_akshare_real_data.py — 惰性网络检测**

  ```python

  # Before (模块导入时立即执行):

  NETWORK_OK = _is_network_available()        # 立即连接 eastmoney.com

  skip_if_no_network = pytest.mark.skipif(not NETWORK_OK, ...)



  # After (首次调用时才执行):

  _NETWORK_OK: bool | None = None

  def _is_network_available() -> bool:         # 带缓存

      global _NETWORK_OK

      if _NETWORK_OK is not None:

          return _NETWORK_OK

      ...

  skip_if_no_network = pytest.mark.skipif("not _is_network_available()", ...)  # 字符串条件——pytest收集时求值

  ```



  **修复 2: .pre-commit-config.yaml — GATE-18 排除 slow/e2e**

  ```yaml

  # Before:

  entry: python -m pytest tests/ --collect-only -q --tb=line



  # After:

  entry: python -m pytest tests/ --collect-only -q --tb=line -m "not slow and not e2e"

  ```



  **修复 3: 清除 stale .pyc**

  4 个 integration 测试因 module-level import 的旧 dataclass field-order 错误而无法收集。

  根因：`synthesized_signal.py` 曾被 codegen 覆盖了 field-order 修复，`.pyc` 缓存了旧版本。

  修复：清除所有 `__pycache__/`。



