  ## 关键决策



  ### DEC-001: 推翻 Wave 0 的 ADR 冻结决定（R72）

  - **决定**: ADR 不再作为独立物理目录存在，全量迁入 KB decisions namespace

  - **理由**: 1 人项目 + 100% AI 施工语境下，ADR 的状态机和 Owner 审批无实际意义

  - **否决方案**: 保留 ADR 独立体系（解冻）— 否决，因会形成"三头决策"运维负担



  ### DEC-002: ADR 作为 KB 中的 namespace 而非物理目录

  - **决定**: 33 个 ADR 写入 SQLite knowledge 表（ke_id="ADR-NNNN", category="architecture_decision"），通过 KB.search() 统一检索

  - **理由**: 单一决策入口、AI 自服务、不增加 Owner 工作量

  - **否决方案**: 完全溶解为向量 — 否决，因失去结构化检索能力；保留独立目录 — 否决，增加运维成本



  ### DEC-003: 决策获取以 AI 自动提取为主，不手动标记

  - **决定**: AI 每 session 结束时自动从对话提取 1-3 条关键决策，写入 Session Log + upsert KB

  - **理由**: 零运维成本，不要求 Owner 手动填模板/审批/维护注册表

  - **否决方案**: 手动标记 — 否决，增加 Owner 工作量；全量自动扒取 — 否决，M2 以后再考虑



