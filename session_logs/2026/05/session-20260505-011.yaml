  ## Bug 修复记录



  ### Bug #1: InputSanitizer.__init__() 缺少 `root` 参数

  - **位置**: [default_security_gateway.py](file:///d:/ZephyrAlpha/src/zephyr/l10-compliance/default_security_gateway.py#L127)

  - **现象**: `TypeError: InputSanitizer.__init__() missing 1 required positional argument: 'root'`

  - **修复**: 在 `DefaultSecurityGateway.__init__()` 增加 `project_root` 参数，传递给 `InputSanitizer(root=project_root)`



  ### Bug #2: InputSanitizer 无 `sanitize()` 方法和 `is_clean` 属性

  - **位置**: [default_security_gateway.py](file:///d:/ZephyrAlpha/src/zephyr/l10-compliance/default_security_gateway.py#L154-L165)

  - **现象**: `AttributeError: 'InputSanitizer' object has no attribute 'sanitize'`

  - **修复**: 替换为 try/except 包裹 `validate_llm_context()` 调用，手动追踪 `self._l1_clean` bool 状态



  ### Bug #3: AuditDecision 字段不匹配

  - **位置**: [default_security_gateway.py](file:///d:/ZephyrAlpha/src/zephyr/l10-compliance/default_security_gateway.py#L217-L231)

  - **现象**: `TypeError: AuditDecision.__init__() got an unexpected keyword argument 'findings'`

  - **根因**: AuditDecision 实际字段为 `decision_id, action, rule_id, reason, timestamp, metadata`——没有 `findings/content_safe/sanction_enabled`

  - **修复**: 使用正确字段构建 AuditDecision，将 findings/content_safe/sanction_enabled 放入 `metadata` dict



  ### Bug #4: AISGSandbox.scan_content() 返回 `list[str]` 而非 `list[dict]`

  - **位置**: [default_security_gateway.py](file:///d:/ZephyrAlpha/src/zephyr/l10-compliance/default_security_gateway.py#L187-L196)

  - **现象**: `AttributeError: 'str' object has no attribute 'get'`

  - **根因**: AISGSandbox.scan_content() 返回 `list[str]`（如 `["动态代码执行", "子进程调用"]`），代码按 dict 调用 `.get()`

  - **修复**: 将每个字符串作为 message 内容，使用 `AISG-DANGER-001` 作为统一 rule_id



  ### Bug #5: GateEngine 自检漏掉 invariants/ 子目录

  - **位置**: [gate_engine_selfcheck.py](file:///d:/ZephyrAlpha/scripts/governance/gate_engine_selfcheck.py#L217)

  - **现象**: S10 一致性检查报 `EN-001/002/003 的 YAML 文件缺失`（假阳性）

  - **修复**: glob 列表增加 `_GATES_DIR.glob("invariants/*.yaml")`



