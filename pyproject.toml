[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "zephyralpha"
version = "2.0.0"
description = "ZephyrAlpha 2.0 — AI-native quantitative research platform"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pandas>=2.0.0",
    "chromadb>=0.4.24",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=3.7.0",
]
demo = [
    "akshare>=1.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
markers = [
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests (deselect with '-m \"not e2e\"')",
    "security: marks security-critical tests",
    "financial: marks financial calculation tests",
    "filterwarnings: marks tests that suppress specific warnings (required by --strict-markers)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["zephyr"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (includes F811: redefinition of unused name)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.flake8-import-conventions]
extend-aliases = { "zephyr.shared.paths" = "paths", "zephyr.shared.time_utils" = "time_utils" }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
