[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "zephyralpha"
version = "2.0.0"
description = "ZephyrAlpha 2.0 — AI-native quantitative research platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# 5.31.12 修复：原 requires-python=">=3.11" 与 ruff target-version="py312" 不一致
# 统一为 >=3.12，避免 3.12 语法在 3.11 运行时 SyntaxError
authors = [
    { name = "ZephyrAlpha contributors" },
]
keywords = ["quantitative-finance", "ai-native", "trading", "research-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "pyyaml>=6.0,<7.0",
    "pandas>=2.0.0,<3.0.0",
    "psutil>=5.9.0,<7.0",
    "chromadb>=0.4.24,<1.0.0",
    "mcp>=1.0.0,<2.0.0",
    "openai>=1.0.0,<2.0.0",
    "sentence-transformers>=3.0.0,<4.0.0",
    "structlog>=24.1.0,<25.0.0",
    "pyarrow>=15.0.0,<26.0.0",  # 上界放宽 <20→<26：datasets 4.x 要求 pyarrow>=21（P1-E3 ML 训练轨）
    "psycopg2-binary>=2.9.0,<3.0.0",
    # ClickHouse native protocol 驱动：核心基础设施 database_service(MOD-INF-002) lazy-import
    # 原误判为 demo 可选——CH 是主行情库(c1_market)，pip install . 后应能直连 (#ARCH-REQ-CLASSIFY-001)
    "clickhouse-driver>=0.2.6,<1.0.0",
    # H1 Redis 业务热缓存驱动 (MOD-H1_REDIS_HOT, INFRA-DB-007)
    # Redis 7.x 连接——database_service.get_redis_conn() lazy-import；仿 clickhouse-driver 核心依赖定位
    "redis>=5.0.0,<6.0.0",
    "plotly>=6.0.0,<7.0.0",
    "streamlit>=1.50.0,<2.0.0",
    # v3.0.0 可视化技术栈切换 (#ARCH-047): Panel+HoloViz+plotly_resampler
    "panel>=1.5.0,<2.0.0",
    "holoviews>=1.19.0,<2.0.0",
    "datashader>=0.16.0,<1.0.0",
    "hvplot>=0.10.0,<1.0.0",
    "plotly_resampler>=0.9.0,<1.0.0",
    # 5.30.4 修复：python-dotenv 被 __init__.py 引用但未声明（幽灵依赖）
    "python-dotenv>=1.0.0,<2.0.0",
    # AI-R2 红队：zoneinfo.ZoneInfo("Asia/Shanghai") 被 trading_session/
    # open_order_resolver/miniqmt_provider 直接引用——Windows 无系统 IANA 库，
    # 不得依赖 pandas 传递依赖兜底（幽灵依赖同 python-dotenv 案）
    "tzdata>=2024.1",
    # MOD-L00-004 数据源集成器：APScheduler 调度器 + SQLAlchemy JobStore
    "apscheduler>=3.10.0,<4.0.0",
    "sqlalchemy>=2.0.0,<3.0.0",
    # MOD-L00-004 交易日历守卫：exchange_calendars XSHG 日历（节假日/调休精确判断）
    "exchange_calendars>=4.13,<5.0",
]

# 5.31.7 修复：原无 [project.scripts]，pip install 后无 CLI 命令
# 新增 zephyr 入口点，避免 Dockerfile 硬编码 python -m ...
# MOD-L00-004 数据源集成器 CLI 入口（蓝图 §8.4）
[project.scripts]
zephyr = "zephyr.trading.__main__:main"
integrator = "zephyr.data.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pre-commit>=4.0.0",
    # .importlinter 层依赖契约校验能力落地（AI-01 S1 治本 2026-08-01）：
    # 原仅在 capacity_assurance blueprint 标"✅ 已实现"但依赖未声明，能力不可运行。
    # import-linter 2.13（2026-07-03），Python>=3.10，BSD-2-Clause。
    "import-linter>=2.0,<3.0",
]
demo = [
    "akshare>=1.12.0",
    # Phase 4: 数据源依赖（按需安装，非核心包）。clickhouse-driver 已升级为核心依赖（见上）
    "baostock>=0.8.8,<0.9.0",          # 交易日历/沪深300成分股（baostock_provider）
]
# CloneGuard 多引擎克隆检测集成防御体系（#ARCH-FORCE-MERGE-DEDUP-001，按需安装，非核心包）
# 安装：pip install -e ".[clone-guard]"；未装时各适配器 detect() 降级返回 ([], True) 不阻断
# Vendetect 不入此 extras——AGPL-3.0 许可证，须 git clone 独立目录隔离，仅 subprocess 调 CLI
# mcrit 已移除——领域错位（二进制/恶意软件逆向工具，非源码克隆检测），见 clone-guard-engine-verification-ruling.md
# relate Path B——真实 relate 是 Zig 二进制（无预编译资产），改用 datasketch（MinHash LSH）进程内替代
clone-guard = [
    "redup>=0.4.0",        # reDUP 语义克隆 T3/T4（Apache-2.0），L1 changed-only + L2 semantic
    "datasketch>=2.0.0",   # MinHash LSH 进程内预筛（relate Path B 替代），MIT
    # OOB 治本（#ARCH-ECHO-GUARD-EMBEDDING-OOB）：EchoGuardAdapter._embedding_lock 跨进程
    # 文件锁序列化 echo-guard CLI 调用，防 EmbeddingStore 无锁并发写导致 embedding_row 越界。
    # 未装时 fail-open 无锁执行（守 _GlobalCommitLock 先例），但失去 OOB 防护。
    "filelock>=3.12.0,<4.0.0",  # 跨进程文件锁（Unlicense），EchoGuardAdapter lazy-import
]
# P1-E3 NLP 管道训练轨依赖（#ARCH-NLP-PIPELINE-001，按需安装，非核心包）
# 安装：pip install -e ".[ml-train]"；torch 须单独装 CUDA 版（cu126 wheel）
# 推理轨复用 local_model（Ollama/DeepSeek），训练轨用 peft/trl QLoRA + bitsandbytes 4bit 量化
ml-train = [
    "peft>=0.20.0",           # QLoRA adapter（Apache-2.0），LoraConfig + get_peft_model
    "trl>=1.9.0",             # SFTTrainer + PPOTrainer（Apache-2.0），RLSP 训练
    "datasets>=4.0.0,<5.0.0", # HuggingFace datasets（Apache-2.0），SFT 数据加载
    "accelerate>=1.14.0",     # 分布式训练加速（Apache-2.0），device_map 自动分配
    "bitsandbytes>=0.50.0",   # 4bit/8bit 量化（MIT），QLoRA 核心——3090 24GB 跑 7B 必需
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    # 治本 #ARCH-XDIST-WORKER-CRASH-001: Windows 并行测试时 xdist worker 崩溃
    # （文件锁定/内存压力），--max-worker-restart 允许崩溃后自动重启，
    # 确保所有测试有机会执行。100% AI 场景下不能容忍测试静默丢失。
    "--max-worker-restart=5",
]
# 注意（#ARCH-108）：--max-worker-restart 由 xdist 插件注册——用 `-p no:xdist` 禁插件跑串行
# 会报 "unrecognized arguments"(exit 4)。串行跑法用 `-n 0`（xdist 保持加载、0 worker=进程内串行）。
# 全量套件（~2500 文件）串行耗时长且在共享机上易被环境性 kill，建议 xdist 并行（-n 4）
# 或按域分批跑。
# 治本 #ARCH-ROOT-TEMP-FILE-ENFORCEMENT-001: pytest 缓存归位 .runtime/tmp/（gitignored），
# 防止 .pytest_cache/ 污染项目根目录。路径相对 rootdir 解析（pytest 文档保证）。
cache_dir = ".runtime/tmp/pytest_cache"
markers = [
    "slow: marks slow tests (deselect with '-m \"not slow\"')",
    "e2e: marks end-to-end tests (deselect with '-m \"not e2e\"')",
    "security: marks security-critical tests",
    "financial: marks financial calculation tests",
    "filterwarnings: marks tests that suppress specific warnings (required by --strict-markers)",
    "asyncio: marks asyncio async tests (requires pytest-asyncio plugin to run)",
    "silent_failure: marks silent-failure regression tests (Ruling:100PCT-AI-GOVERNANCE P0-P3)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
source = ["zephyr"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/migrations/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (includes F811: redefinition of unused name)
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "BLE",  # flake8-blind-except (Ruling:100PCT-AI-GOVERNANCE P1-4 — 防止 silent failure 的宽泛 except)
]
# 5.96 维度防御门闸（R67 引入）：
# 布尔字段冗余/参数蔓延由 scripts/governance/d7_code/scan_debt.py 自定义 AST 扫描器检测
# （不依赖 ruff 是否安装，纯 stdlib 实现，可执行自定义语义规则）。
# 未来 ruff 全量启用后再考虑加 PLR0913（too-many-args）/PLR0916（too-many-boolean-expr）。
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module level import not at top of file (项目风格：import前有docstring/注释)
    "E741",  # ambiguous variable name l (风格建议，不影响功能)
    # Ruling:100PCT-AI-GOVERNANCE P1-4 (2026-07-19): E722 (bare except) 从 ignore 移除
    # —— silent failure 治本：bare except 会吞掉所有异常包括 KeyboardInterrupt/SystemExit，
    #    100% AI 开发场景下必须显式声明捕获类型。存量已清零。
    # Ruling:100PCT-AI-GOVERNANCE P1-4 (2026-07-19): B904 (raise from err) 从 ignore 移除
    # —— silent failure 治本：except 块内 raise 新异常不链式保留原因 = traceback 丢失，
    #    AI 开发场景下必须 `from err`（保留原因）或 `from None`（显式抑制）。
    "RUF001",  # ambiguous unicode character in string (中文标点合理使用)
    "RUF002",  # ambiguous unicode character in docstring (中文标点合理使用)
    "RUF003",  # ambiguous unicode character in comment (中文标点合理使用)
    "RUF005",  # collection-literal-concatenation (风格建议，[*a, b] vs a+[b])
    "RUF009",  # function-call-in-dataclass-default-argument (风格建议)
    "RUF012",  # mutable-class-default (风格建议，项目沿用可变类属性模式)
    "RUF013",  # implicit-optional (风格建议，不影响功能)
    "RUF015",  # unnecessary-iterable-allocation-for-first-element (风格建议)
    "RUF022",  # unsorted-dunder-all (风格建议)
    "RUF034",  # useless-if-else (风格建议)
    "RUF046",  # unnecessary-cast-to-int (风格建议)
    "RUF059",  # unused-unpacked-variable (风格建议)
    "RUF100",  # unused-noqa (风格建议)
    "B007",  # unused-loop-control-variable (风格建议)
    "B023",  # function-uses-loop-variable (风格建议)
    "B027",  # empty-method-without-abstract-decorator (风格建议)
    "B028",  # no-explicit-stacklevel (风格建议)
    "B006",  # mutable-argument-default (风格建议，项目沿用模式)
    "SIM101",  # duplicate-isinstance-call (风格建议)
    "SIM102",  # nested if (风格建议)
    "SIM103",  # return condition directly (风格建议)
    "SIM105",  # contextlib.suppress (风格建议)
    "SIM108",  # if-else-block-instead-of-if-exp (风格建议)
    "SIM110",  # reimplemented-builtin (风格建议)
    "SIM113",  # enumerate-for-loop (风格建议)
    "SIM115",  # open-file-with-context-handler (风格建议)
    "SIM118",  # in-dict-keys (风格建议)
    "SIM222",  # expr-or-true (风格建议)
    "UP017",  # datetime-timezone-utc (风格建议)
    "UP031",  # printf-string-formatting (风格建议，项目沿用%格式化)
    "UP035",  # deprecated-import (风格建议)
    "UP042",  # enum.StrEnum (Python 3.11兼容，项目沿用str+Enum模式)
    "UP046",  # Generic类使用Generic子类而非类型参数 (项目沿用Generic子类模式)
    "UP047",  # Generic函数使用类型参数 (项目沿用TypeVar模式)
    "F401",  # unused-import (风格问题，__init__.py重新导出需要)
    "F403",  # undefined-local-with-import-star (项目风格，__init__.py使用import *)
    "F405",  # undefined-local-with-import-star-usage (项目风格，import *后的使用)
    "F404",  # late-future-import (风格建议)
    "F402",  # import-shadowed-by-loop-var (风格建议)
    "F601",  # multi-value-repeated-key-literal (风格问题，不影响功能)
    "F811",  # redefined-while-unused (风格问题，不影响功能)
    "F822",  # undefined-export (风格问题，__all__中的名称未定义)
    "F841",  # unused variable (风格问题，不影响功能)
]

# 治本（2026-08-02）：项目自定义规则码 + 外部工具规则码登记到 lint.external。
# Ruff 遇到 # noqa: <code> 中非 Ruff 内置的 code 时，会发出 RUF102 或 parse warning。
# 登记到 external 后 Ruff 视其为外部规则码，不再 warning/error。
# 自定义规则码来自 scripts/governance/ 下的自定义 AST 扫描器（M01-M46/N114/R144/A100/E34 等），
# 非 Ruff 内置规则；WPS 来自 wemake-python-styleguide（Ruff 不实现其规则集）。
external = [
    "WPS",  # wemake-python-styleguide（外部工具，Ruff 不实现）
    # 项目自定义规则码（scripts/governance/ AST 扫描器，# noqa: <code> 标注豁免）
    "m01-vocab-hardcode",
    "m02-manual",
    "m02-manual-trigger",
    "m03-duplicate",
    "m07-orphan",
    "m10-time-trigger",
    "m11-perm-manual-legitimate",
    "m12-broad-except-legitimate",
    "m20-snapshot-drift",
    "m46-time",
    "a100-asyncio",
    "any-abuse",
    "bare-subprocess",
    "blueprint-amodule-cross-check",
    "consumers-accuracy",
    "e34-env",
    "gate-vocab",
    "import-integrity",
    "MSG-EXPOSURE",
    "MSG-STYLE",
    "no-verify-ruling",
    "n114-final",
    "r144-open",
    "table-name-registry",
]

[tool.ruff.lint.flake8-import-conventions]
extend-aliases = { "zephyr.shared.paths" = "paths", "zephyr.shared.time_utils" = "time_utils" }

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = [
    "B017",  # pytest.raises(Exception) (测试中合理使用)
    "B015",  # pointless comparison (测试中触发比较)
    "B011",  # assert False (测试中合理使用)
    "SIM117",  # nested with (测试中可读性优先)
    "E731",  # lambda赋值 (测试中简洁性优先)
    "RUF043",  # pattern包含元字符 (测试中合理使用)
]
"scripts/**" = [
    "F823",  # 局部变量引用前赋值 (脚本中合理使用)
    "RUF034",  # 无用的if-else (风格建议)
]
# apply_depgraph.py：46 处一致的 DB 错误处理模式（except Exception: rollback+log），
# 是 DB 工具脚本的合理顶层兜底，非 silent failure。逐一加 # noqa 噪音大且易冲突，
# 用 per-file-ignores 收敛（与 tests/** 忽略 B017 同机制）。
"scripts/governance/apply_depgraph.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# 5.145 维度 P0：mypy 加严——裸 Any 滥用检测（R70 引入）
# disallow_any_generics: dict/List 等泛型必须带参数（禁止裸 dict/List）
# warn_any_explicit: 显式 Any 使用告警（配合 check_any_abuse.py AST 门禁）
disallow_any_generics = true
warn_any_explicit = true
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
files = ["src/zephyr"]
exclude = [
    "tests/",
    "docs/",
    "scripts/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = true
