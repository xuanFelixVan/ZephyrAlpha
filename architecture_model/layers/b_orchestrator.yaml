schema_version: "1.0.0"
partition:
  id: orchestrator
  name: Agent Orchestrator (Orc)
  track: b_track
  bounded_context: true
  umbrella_layer: l12
  status: implemented

modules:
  - id: orc-core
    module_id: MOD-INF-039
    name: Agent Orchestrator Core
    submodule_path: src/zephyr/orchestrator/
    status: implemented
    priority: P0
    runtime_plane: warm
    description: 任务生命周期 + Agent 调度 + 沙箱执行 + 幻觉检测。状态机 DRAFT→QUEUED→ASSIGNED→RUNNING→REVIEWING→COMPLETED
    interfaces:
      - contract_id: CT-ORC-SCRIPT-001
        role: both
        description: 任务阻塞：Finding↔任务卡（MOD-MASTER-001 §2.2）
      - contract_id: CT-ORC-CE-001
        role: consumer
        description: 上下文构建请求
      - contract_id: CT-ORC-VMS-001
        role: consumer
        description: 任务输出写入向量库
      - contract_id: CT-ORC-GATE-001
        role: consumer
        description: 任务执行前后门禁判定
      - contract_id: EXT-ORC-SANDBOX-001
        role: producer
        description: 沙箱执行边界（Windows ACL 等）；未单列入总表，扩展登记
      - contract_id: CT-ORC-DB
        role: both
        description: Orchestrator 与 DB 的交互契约（任务状态读写/事务一致性）
      - contract_id: CT-RBK-GATE-001
        role: both
        description: Rollback 与 Gate 的交互契约（回滚前门禁校验/回滚后状态同步）
    kb_ref:

summary:
  total: 1
  by_status:
    implemented: 1
