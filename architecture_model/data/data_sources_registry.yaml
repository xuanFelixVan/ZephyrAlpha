  - id: DS-RSS
    runtime_id: rss
    name: "RSS"
    name_en: "RSS"
    type: open_source
    account_type: free
    category: news
    vendor: "开源"
    interface_types: ["RSS/Atom"]
    api_count: 0
    auth_required: false
    auth_method: "无"
    rate_limit: "无"
    status: active
    coverage: "财经新闻RSS源"
    owner: ZephyrAlpha-Owner
    operation_manual: "docs/03_modules/_domain_data/data_source_operation_manual.md §7.4"
    policy:
      rpm: 0
      concurrency: 1
      max_retries: 3
      backoff: exponential
      initial_wait_sec: 5.0
      # #ARCH-RSS-INVESTING-403-001：仅重试网络错误 + 5xx 服务端错误；
      # 4xx（403 WAF 拦截）不重试——相同 UA/IP 重试仍 4xx，避免每轮浪费 ~35s。
      # status code 字符串按 retry 机制 substring 匹配 HTTPError.message（如 "503 Server Error"）
      retry_on: ["SSLError", "ConnectionError", "500", "502", "503", "504"]
      respect_robots_txt: true

