    owner: ZephyrAlpha-Owner
    operation_manual: "docs/03_modules/_domain_data/data_source_operation_manual.md §4"
    policy:
      rpm: 60
      concurrency: 4
      max_retries: 5
      backoff: jittered
      initial_wait_sec: 2.0
      retry_on: ["HTTPError", "JSONDecodeError", "ConnectionError"]
      disconnect_vpn: true
      extra:
        dongfang_caizhang_skip_after: 3

