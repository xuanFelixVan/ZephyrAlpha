# v1.0.0: 外部数据源资产清单真源,从 data_source_operation_manual.md v2.1.0 提取
# v2.0.0: #183 数据源策略单一真源化——合并 policies.yaml 调用策略到 policy 字段;
#         新增 runtime_id 映射(资产ID DS-* <-> 运行时ID);补齐 DS-TUSHARE/DS-RSS
# 同步到 DB data_source_assets 表,派生 asset_catalog.md;派生 policies.yaml(generate_policies.py)

module_id: MOD-L00-001
version: "2.1.0"
description: "外部数据源资产清单真源。从 data_source_operation_manual.md 提取结构化数据,同步到 DB 供 AI 高频查询。#183 合并调用策略到 policy 字段,policies.yaml 改为派生物。v2.1.0: 新增 account_type 顶层字段;DS-IFIND policy.extra 修正 monthly→weekly 配额+补齐 EDB 配额详情(5万条/周/试用版=正式版)。"

data_sources:
  - id: DS-IFIND
    runtime_id: ifind
    name: "同花顺iFind"
    name_en: "THS iFind"
    type: commercial
    account_type: trial
    category: market_data
    vendor: "同花顺"
    interface_types: ["THS_BD", "THS_DS", "THS_HF", "THS_RQ", "THS_WC", "THS_DateSerial"]
    api_count: 70
    auth_required: true
    auth_method: "THS_iFinDLogin(同进程内调用)"
    rate_limit: "需登录,无明确QPS限制"
    status: active
    coverage: "A股K线/Tick/板块/财务/宏观/研报"
    owner: ZephyrAlpha-Owner
    operation_manual: "docs/03_modules/_domain_data/data_source_operation_manual.md §2"
    policy:
      rpm: 0
      concurrency: 1
      max_retries: 3
      backoff: exponential
      initial_wait_sec: 2.0
      retry_on: ["-201", "TimeoutError", "ConnectionError"]
      session_ttl_sec: 86400
      relogin_on_auth_error: true
      extra:
        weekly_quota_alert: true
        quota_error_codes: ["-4318", "-4309", "-4210", "-5100", "-4216"]
        edb_quota_per_week: 50000
        quota_reset_cycle: "weekly_monday"
        quota_unit: "cell"
        trial_equals_formal_edb: true

  - id: DS-MINIQMT
    runtime_id: miniqmt
    name: "miniQMT"
    name_en: "miniQMT"
    type: commercial
    account_type: formal
    category: market_data
    vendor: "迅投"
    interface_types: ["XtQuantApi", "xtdata", "xttrader"]
    api_count: 87
    auth_required: true
    auth_method: "QMT客户端登录"
    rate_limit: "实时行情订阅,无明确QPS限制"
    status: active
    coverage: "A股实时行情/历史K线/交易接口"
    owner: ZephyrAlpha-Owner
    operation_manual: "docs/03_modules/_domain_data/data_source_operation_manual.md §3"
    policy:
      rpm: 0
      concurrency: 1
      max_retries: 3
      backoff: fixed
      initial_wait_sec: 1.0
      retry_on: ["TimeoutError", "ConnectionError"]
      session_ttl_sec: 0
      relogin_on_auth_error: true
      extra:
        requires_process: "XtMiniQmt.exe"

  - id: DS-AKSHARE
    runtime_id: akshare
    name: "AKShare"
    name_en: "AKShare"
    type: open_source
    account_type: free
    category: market_data
    vendor: "开源社区"
    interface_types: ["Python函数"]
    api_count: 0
    auth_required: false
