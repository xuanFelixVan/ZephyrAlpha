# data_source_apis_registry.yaml
# 数据源 API 结构化清单真源
#
# 真源模式：本 YAML 是 SSoT，depgraph.data_source_apis 表是只读缓存
# 派生关系：generate_asset_catalog.py 从 DB 派生 asset_catalog.md 的"数据源 API 清单"部分
#           data_source_operation_manual.md 保留参数坑/调用示例，不再手写 API 总览表格
#
# 数据来源：docs/03_modules/_domain_data/data_source_operation_manual.md §2/§3/§7/§8
# 更新协议：新增/修改 API 时先改本 YAML，再跑同步脚本入 DB，再重新生成 asset_catalog.md

apis:
  # ============================================================
  # DS-IFIND（同花顺iFind，70个API，§2.2+§2.4）
  # ============================================================
  - api_id: DS-IFIND-API-001
    source_id: DS-IFIND
    category: 历史行情
    api_name: THS_HistoryQuotes
    short_name: THS_HQ
    function_desc: 日/周/月K线（OHLCV+涨跌幅+换手率）
    params: '(stock, indicators, params, start, end)  indicators=preClose,open,high,low,close,...  params=Interval:D,CPS:1,Currency:YSHB,fill:Previous'
    returns_format: DataFrame(thscode/time/open/high/low/close/volume/amount/...)
    frequency_codes: D/W/M
    data_scope: A股
    test_status: verified
    test_result: 21行
    section_ref: §2.4.2
    notes: 'CPS:1=前复权 CPS:2=后复权 CPS:0=不复权; Currency:YSHB=人民币; fill:Previous=缺失前值填充'

  - api_id: DS-IFIND-API-002
    source_id: DS-IFIND
    category: 高频序列
    api_name: THS_HighFrequenceSequence
    short_name: THS_HF
    function_desc: 分钟K线/Tick（Interval参数控制频率）
    params: '(stock, indicators, params, start, end)  Interval控制频率'
    returns_format: DataFrame
    frequency_codes: 1m/5m/15m/30m/60m/tick
    data_scope: A股
    test_status: verified
    test_result: ''
    section_ref: §2.2
    notes: '试用账号-4309只能获取1年历史'

  - api_id: DS-IFIND-API-003
    source_id: DS-IFIND
    category: 实时行情
    api_name: THS_RealtimeQuotes
    short_name: THS_RQ
    function_desc: 实时行情快照（含盘口/资金流向）
    params: '(stock, indicators)  indicators=open;high;low;latest;changeRatio;amount;volume;bid1;ask1;...'
    returns_format: DataFrame(thscode/open/high/low/latest/changeRatio/...)
    frequency_codes: realtime
    data_scope: A股
    test_status: verified
    test_result: 实时快照
    section_ref: §2.4.6
    notes: '支持批量查询(逗号分隔多个代码); v1.9.0实测可批量补齐kline_daily(5517股)和index_kline(953指数)'

  - api_id: DS-IFIND-API-004
    source_id: DS-IFIND
    category: 基础数据
    api_name: THS_BasicData
    short_name: THS_BD
    function_desc: 估值PE/PB/PS + 股票基础信息
    params: '(stock, indicators, params)  indicators分号分隔  params="日期,类型"分号分隔  类型100=静态101=动态'
    returns_format: DataFrame(thscode/ths_pe_stock/ths_pb_stock/...)
    frequency_codes: ''
    data_scope: A股
    test_status: verified
    test_result: PE=11.45 PB=0.69
    section_ref: §2.4.3
    notes: '⚠参数格式坑：指标分号分隔，参数"日期,类型"分号分隔；不支持分号多指标(-209)；分红相关指标全失败(-209)；股权质押仅比例/总股本可用'

  - api_id: DS-IFIND-API-005
    source_id: DS-IFIND
    category: 日期序列
    api_name: THS_DateSerial
    short_name: THS_DS
    function_desc: 财务数据时间序列（ROE/净利润/资产等）
    params: '(stock, indicators, params, start, end)  params=;100;100;100 每指标对应类型'
    returns_format: DataFrame
    frequency_codes: D
    data_scope: A股
    test_status: deprecated
    test_result: '-209 params invalid'
    section_ref: §2.4.4
    notes: 'v1.9.0实测单代码-209失败，补齐日K线改用THS_RQ'

  - api_id: DS-IFIND-API-006
    source_id: DS-IFIND
    category: 数据池
    api_name: THS_DataPool
    short_name: THS_DP
    function_desc: 指数成分股/行业板块成分股
    params: '(type, date;code, fields)  type=index/block  date;code=2025-06-30;000300.SH'
    returns_format: DataFrame(date/thscode/security_name)
    frequency_codes: ''
    data_scope: A股指数/板块
    test_status: verified
    test_result: 沪深300=300行 行业=30行
    section_ref: §2.4.5
    notes: ''

