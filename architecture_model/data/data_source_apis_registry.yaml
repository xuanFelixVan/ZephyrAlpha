    section_ref: §2.4.7
    notes: '已验证16类：龙虎榜/融资融券/大宗交易/限售解禁/审计意见/涨停跌停/ST/新股/股东/机构持仓/业绩预告/回购/增减持/分红；不可查：研报评级/北向资金/美股港股期货'

