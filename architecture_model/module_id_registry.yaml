# Module ID Registry v2.0
# 权威来源：此文件是模块 ID 分配的唯一真源
# 新增模块 ID 必须先在此注册，再写入 layers/*.yaml
#
# v2.0 更新说明（2026-04-30）：
# - 新增 GOV-/DOM-/OPS-/PS- 前缀编号体系
# - 注册 experimental~3 产出的 54 个 module_id
# - 保留 MOD-{LAYER_CODE}-{SEQ} 作为代码模块编号（architecture_model 层面）
# - 文档规则模块使用 GOV-/DOM-/OPS-/PS- 前缀
#
# === ID 体系分工（v2.1.1，2026-05-03）===
# 本项目存在两套 ID 体系，分工明确：
# 1. 架构模型实体 ID（契约、事件、聚合、技术条目）→ canonical SSoT = _index.yaml → id_conventions
# 2. 文档规则模块 ID（治理/域/操作/元标准）→ canonical SSoT = 本文件（module_id_registry.yaml）
# 两套体系不重叠——本文件的 allocation_rules 仅管辖第 2 类（文档规则模块），
# 架构模型 ID（CTR-/E-/AGG-/ENT-/VO-/T-/DS/LLM/CORE-/INFRA-）由 _index.yaml id_conventions 管辖。
# 新增 ID 时先判断属于哪套体系，再到对应 canonical 源登记。
#
# === doc_type 字段已移除（v2.3.0，2026-06-30，P7-FIX-REGISTRY）===
# registered_ids 条目不再包含 doc_type 字段。
# 真源：各模块文件的 frontmatter（doc_type 字段）。
# 理由：原 doc_type 双写是漂移源——frontmatter 修改后此文件不会自动同步。
#       向内收原则：无脚本消费者（已验证），真源单一化到 frontmatter。
#       新增模块时只需注册 module_id/title/path/status，无需手动同步 doc_type。

module_id: MOD-GOVERNANCE
registry_version: "2.4.0"
last_updated: "2026-06-30"
total_registered: 73  # Phase 3 reconciler→gate 收敛（2026-07-03）：实际条目数 73（74→73 修正，原值含 1 个已删除条目未同步）。MODULE-ID-CONSISTENCY gate 现强制 count 与实际一致。

# ID 分配规则
allocation_rules:
  format: "MOD-{LAYER_CODE}-{SEQ}"
  doc_rule_format: "{DOMAIN}-{TYPE}-{NNN}"
  numbering_gaps: |
    以下编号已跳过（从未分配或已合并/废弃）：
    - PS-STD-005: 从未分配（Stage F 归一化时跳过）
    - PS-STD-007/008: 从未分配（Stage F 归一化时跳过）
    - GOV-AI-002: 从未分配（B-e 批次跳号）
    - GOV-TASK-002/003: 从未分配（B-e 批次跳号）
    如需使用这些编号，应先确认无历史冲突再分配。
  domain_prefixes:
    GOV: "治理层规则（governance/）"
    DOM: "层域规则（domains/）"
    OPS: "操作规程（operational/）"
    PS: "元标准（meta/）"
  type_codes:
    DOC: "文档治理"
    AI: "AI 治理"
    TASK: "任务治理"
    SEC: "安全"
    CMP: "合规"
    ARCH: "架构"
    DATA: "数据"
    MOD: "模块"
    STD: "元标准"
    REG: "注册表"
    VC: "Vibe Coding"
    DEV: "DevOps"
    MIG: "迁移"
    L00: "数据源层"
    L02: "因子层"
    L04: "风控层"
    L07: "盘后分析层"
  seq_format: "三位数字，从 001 开始"
  sub_blueprint_rules: |
    子蓝图（从父蓝图拆分出的独立文件）命名规则：
    1. 子蓝图使用独立编号，禁止嵌套编号（如 MOD-MASTER_BLUEPRINT-BASELINE 是违规的）
    2. 正确做法：MOD-MASTER-002（基线）、MOD-MASTER-003（容量）、MOD-MASTER_BLUEPRINT（Agent Spec）
    3. 父子关系通过 frontmatter 的 parent_module / belongs_to 字段表达，不通过编号后缀
    4. 规则来源：PS-STD-001 §5.4 铁律 #7 "禁止嵌套编号"
    5. 校验正则：module_id 不得包含父编号+后缀模式（如 XXX-001-SUFFIX）

