# ========== 6 大核心服务治理归属(源自 §6.5) ==========

core_services_governance:
  - service: LSG
    policy: "ai_security_gateway_policy.md + 四层防御规则集"
    factory: "scripts/governance/aisg/ 策略编译器"
    runtime: "Session Log security_events 表 + 红队评估季度报告"

  - service: CE
    policy: "Context 策略白名单 + 压缩质量 SLO"
    factory: "ContextEngineProtocol 抽象基类"
    runtime: "FLE llm_calls 表 + 压缩质量周报"

  - service: VMS
    policy: "Collection 元数据契约 + 级联语义表"
    factory: "VectorMemoryProtocol 抽象基类"
    runtime: "Session Log vms_operations 表 + 去重检测月报"

  - service: Orc
    policy: "任务状态机 + Agent 白名单"
    factory: "OrchestratorProtocol + Sandbox ACL 模板"
    runtime: "agent_actions + sandbox_violations 表 + 幻觉检测月报"

  - service: FLE
    policy: "异常阈值策略 + 动作分派规则"
    factory: "FeedbackLoopProtocol + EMA 参数"
    runtime: "FLE 自监控 anomaly_ledger + 阈值触发审计"

