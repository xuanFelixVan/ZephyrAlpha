external_contracts:
  - id: EXT-001
    name: "Broker API / 券商交易接口"
    interface_type: "交易委托 / 成交回报"
    direction: bidirectional
    protocol: "REST / FIX 4.2+"
    description: "发单前必须通过 pre_trade/ 风控；成交回报必须触发 Fill 契约并回调策略 (INV-007: events crossing this boundary must carry idempotency_key)"
    physical_path: src/zephyr/shared/contracts/external/ext_001.py
  - id: EXT-002
    name: "Market Data Provider / 行情数据接口"
    interface_type: "历史行情 / 实时行情"
    direction: inbound
    protocol: "REST / WebSocket"
    description: "入站数据必须经过 data/quality/ 质量门禁方可下发；缺数据时触发 DataQualityError (INV-007: events crossing this boundary must carry idempotency_key)"
    physical_path: src/zephyr/shared/contracts/external/ext_002.py
  - id: EXT-003
    name: "LLM Providers / 大模型推理接口"
    interface_type: "AI 推理"
    direction: outbound
    protocol: "REST (OpenAI-compatible)"
    description: "支持降级（LLM 不可用时跳过 AI 增强，主流程不中断）；调用必须经过 AI Agent Ops 层，Factor-Analytics 禁止直接调用 (INV-007: events crossing this boundary must carry idempotency_key)"
    physical_path: src/zephyr/shared/contracts/external/ext_003.py
  - id: EXT-004
    name: "Feishu / 飞书通知接口"
    interface_type: "通知分发"
    direction: outbound
    protocol: "REST Webhook"
    description: "非关键路径；发送失败不影响主流程；重试 3 次后记录日志 (INV-007: events crossing this boundary must carry idempotency_key)"
    physical_path: src/zephyr/shared/contracts/external/ext_004.py
