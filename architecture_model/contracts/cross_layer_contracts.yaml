# =============================================================================

ocp_extension_points:
  - id: OCP-001
    name: "FactorBase + FactorRegistry / 因子扩展点"
    domain: D_FACTOR
    registry: FactorRegistry
    autodiscover: autodiscover_factors
    physical_path: src/zephyr/factor/base.py
    registry_path: src/zephyr/factor/registry.py
    loader_path: src/zephyr/factor/loader.py
    related_kb_ref: KBG-0004
    description: "Factor 因子基类契约。所有因子必须继承 FactorBase，实现 compute()，向 FactorRegistry 注册。 (INV-007: implementors must ensure cross-layer calls carry idempotency_key)"
