# [A_config] module_id=CFG-cross-layer-contracts | layer=config | stability=stable | safety=L | ai_autonomy=human_gated
# --- 治理锚定 ---
# blueprint: MOD-GOVERNANCE | docs/03_modules/_domain-governance/blueprint.md | §
# module_id: MOD-GOVERNANCE
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: permanent
# --- 治理锚定结束 ---
module_id: MOD-GOVERNANCE
schema_version: "3.0"
srp_note: "本文件现已覆盖 6 种契约类型（P0-DATA/P0-PROTOCOL/P0-ERROR/P0-BP/P1/OCP/EXT/AI-GOV），2026-05-04 架构盲点补全批次新增 10 条 P0 契约 + 版本协商规则 + ai_prompt 字段"

partition:
  id: cross-cutting-contracts
  name: "Cross-Layer Contracts / 跨层数据契约"
  type: cross-cutting
  ownership_model: >
    Producer（契约形态与 schema 演进）：由本文件每条契约的 source_layer 所指层承担；
    实现责任以该层在 architecture_model（合并后单树，2026-06-30 治本）中的模块登记为准。
    Consumer（兼容、升级与 CTR-VER-001 通知受众）：由 contracts/consumer_registry.yaml
    中同 contract_id 的 registered_consumers 列出之分层模块承担。
    Accountable Owner（人因兜底，单人项目）：ZephyrAlpha-Owner。
  ssot_policy: >
    本 YAML 文件是所有跨层数据契约的 Single Source of Truth (SSoT)。
    各契约条目中的 physical_path 字段为 codegen 目标路径——对应的 Python
    接口文件由 codegen 工具从本 YAML 自动生成，不得手工编辑。
    任何字段变更必须先修改本文件，再重新生成 Python 文件。
  description: >
    跨层数据契约 SSoT。P0 六大数据契约（CTR-001~006）+ P0 全链路追踪契约
    （CTR-TRACE-001）+ P0 六大跨层错误契约（CTR-ERR-001~006）+ P0 三大背压
    契约（CTR-BP-001~003）+ P1 蓝图签名 15 条 + 三个 OCP 扩展点基类 +
    外部系统契约 4 条 + AI 治理三接口（已 superseded）。
    来源：interface-contracts.md v1.1.0 迁移 + 2026-05-04 架构盲点补全。
  source_views:
    - 03-application_architecture.md
    - 04-technology_architecture.md
  related_kb_refs:
    - KBG-0004
    - KBG-0009

versioning_strategy:
  approach: semantic-versioning-on-contracts
  breaking_change_policy: never-break-P0-within-5yr
  deprecation_flow: mark-deprecated-then-30d-grace
  schema_version_format: "{major}.{minor}"
  rules:
    - "已发布的 P0 接口签名字段不允许删除或修改类型，只允许追加新的可选字段"
    - "任何签名变更必须先建立 KB 决策记录，评审通过后方可执行"
    - "新版本必须能处理旧版本对象（缺省字段使用默认值）"
  cross_layer_version_negotiation:
    id: CTR-VER-001
    name: "ContractVersionNegotiation / 契约版本协商"
    priority: P0
    description: "跨层契约版本不匹配时的系统行为规范。确保升级期间消费者与生产者的兼容性。"
    rules:
      - rule_id: VER-R1
        name: "同 MAJOR 兼容性"
        text: "同 MAJOR 版本 MUST 前后兼容。生产者可以发送新字段，消费者 MUST 忽略未知可选字段。"
      - rule_id: VER-R2
        name: "MAJOR 不匹配拒绝"
        text: "MAJOR 版本不匹配时，消费者 MUST 拒绝处理并触发 ContractViolationError（CTR-ERR-006），上报至 Telemetry。"
      - rule_id: VER-R3
        name: "升级预通知"
        text: "生产者 MUST 在新 MAJOR 版本发布前提前 30 天通知所有注册消费者。通知通过 Telemetry 的 contract_version_change 事件发布。"
      - rule_id: VER-R4
        name: "双版本过渡期"
        text: "消费者在升级过渡窗口内 MUST 同时支持新旧两个 MAJOR 版本。过渡窗口 = MIN（30天，生产者指定的 migration_window_ms）。"
      - rule_id: VER-R5
        name: "契约注册表版本查询"
        text: "所有消费者必须在启动时通过 ContractRegistry 查询依赖契约的当前 active 版本，并据此选择适配器。"

# =============================================================================
# P0 六大跨层数据契约（frozen dataclass）
# =============================================================================
contracts:
  # --- CTR-001: NormalizedMarketData ---
  - id: CTR-001
    name: "NormalizedMarketData / 标准化行情数据"
    priority: P0
    frozen: true
    source_domain: D_MKT_DATA
    target_domains: [D_FACTOR, D_ASHARE_SIGNAL, D_SIMULATION, D_BACKTEST]
    flow: "Data Source → Alpha Factor"
    physical_path: src/zephyr/shared/contracts/market_data.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Data Source → Factor 核心数据契约。质量门禁通过后的标准化行情数据。"
    ai_prompt: >
      当你需要在 Factor 中使用来自 Data Source 的行情数据时，MUST 使用 NormalizedMarketData 类型。
      该类型的 symbol 字段已由 Data Source 标准化为 "600519.SH" 格式（证券代码.交易所），你不需要再做格式转换。
      所有价格字段（open/high/low/close）和成交量（volume）使用 Decimal 类型——禁止用 float 做任何算术运算。
      如果 quality_score < 0.7，该数据可能不可靠，请标记为低置信度。
      如果 is_suspended = True，不要基于该数据生成任何信号，跳过该标的。
      ingested_at 为数据入库时间，不一定等于 timestamp（数据时间戳），请使用 timestamp 做截面对齐。
    sla:
      p99_latency_ms: 10
      sla_scope: "Data Source:WS recv → Factor:on_market_data 接收（含 parse + quality_gate）"
      timeout_action: DROP_AND_ALERT
      measurement: "Data Source emit_timestamp → Factor receive_timestamp，通过 TraceContext（CTR-TRACE-001）的 span_id 关联"
    fields:
      - {name: symbol, type: str, required: true, description: "标准化证券代码（如 600519.SH）"}
      - {name: data_source, type: str, required: true, description: "数据源标识（如 akshare, wind）"}
      - {name: timestamp, type: datetime, required: true, description: "数据时间戳（UTC）"}
      - {name: open, type: Decimal, required: true, description: "开盘价"}
      - {name: high, type: Decimal, required: true, description: "最高价"}
      - {name: low, type: Decimal, required: true, description: "最低价"}
      - {name: close, type: Decimal, required: true, description: "收盘价"}
      - {name: volume, type: Decimal, required: true, description: "成交量"}
      - {name: amount, type: "Optional[Decimal]", required: false, description: "成交额（A 股必填）"}
      - {name: adj_factor, type: "Optional[Decimal]", required: false, description: "复权因子"}
      - {name: quality_score, type: float, required: false, default: 1.0, description: "质量门禁结果 0.0-1.0"}
      - {name: is_suspended, type: bool, required: false, default: false, description: "停牌标记"}
      - {name: ingested_at, type: "Optional[datetime]", required: false, description: "入库时间"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: timeout_ms, type: int, required: false, default: 5000, description: "操作超时时间（毫秒）"}
      - {name: retry_policy, type: str, required: false, default: "exponential_backoff", description: "重试策略：none | linear | exponential_backoff"}
      - {name: config_load_timeout_ms, type: int, required: false, default: 1000, description: "配置加载超时时间（毫秒）"}
      - {name: config_load_retry_policy, type: str, required: false, default: "linear", description: "重试策略：none | linear | exponential_backoff"}
      - {name: max_retries, type: int, required: false, default: 3, description: "最大重试次数"}
      - {name: exceptions, type: "List[str]", required: false, description: "预期异常类型列表"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-002: FactorSignal ---
  - id: CTR-002
    name: "FactorSignal / 因子信号"
    priority: P0
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_ASHARE_SIGNAL, D_RISK, D_PF_CORE, D_BACKTEST]
    flow: "Alpha Factor → Signal/Risk/Portfolio"
    physical_path: src/zephyr/shared/contracts/factor_signal.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Factor → Signal/Risk/Portfolio 核心数据契约。单个因子在单个时间截面对单个标的的信号值。"
    ai_prompt: >
      当你需要在 Factor 中生成因子信号时，MUST 使用 FactorSignal 类型。
      不要自行定义因子信号的数据结构。factor_id 必须对应 FactorRegistry 中已注册的因子 key。
      raw_value 是因子原始计算结果，normalized_value 是截面标准化后的 z-score，rank_pct 是 0-1 分位数排名。
      如果因子计算失败，不要产出 FactorSignal——应该抛出 FactorComputationError（CTR-ERR-002）。
      如果 confidence < 0.5，该信号可能不可靠，下游（Signal/Risk/Portfolio）可以忽略。
      is_valid = False 时下游 MUST 跳过该信号。
      extra 字段用于放非标准化的扩展数据，不要滥用——能用标准字段就用标准字段。
    sla:
      p99_latency_ms: 50
      sla_scope: "Factor 单个因子的 compute() 调用（从接收 NormalizedMarketData 到产出 FactorSignal）"
      timeout_action: SKIP_FACTOR_AND_DEGRADE
      measurement: "Factor receive_timestamp → Factor emit_timestamp，通过 TraceContext 的 span_id 关联"
    fields:
      - {name: factor_id, type: str, required: true, description: "因子唯一 ID（对应 FactorRegistry 的 key）"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: as_of_date, type: datetime, required: true, description: "信号计算截面日期"}
      - {name: raw_value, type: float, required: true, description: "原始因子值"}
      - {name: normalized_value, type: "Optional[float]", required: false, description: "截面标准化后的值（z-score）"}
      - {name: rank_pct, type: "Optional[float]", required: false, description: "分位数排名 0-1"}
      - {name: confidence, type: float, required: false, default: 1.0, description: "信号置信度 0.0-1.0"}
      - {name: is_valid, type: bool, required: false, default: true, description: "信号有效性"}
      - {name: factor_version, type: str, required: false, default: "1.0", description: "因子版本"}
      - {name: extra, type: "Dict[str, Any]", required: false, description: "扩展字段"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: timeout_ms, type: int, required: false, default: 3000, description: "因子计算超时时间（毫秒）"}
      - {name: retry_policy, type: str, required: false, default: "linear", description: "重试策略：none | linear | exponential_backoff"}
      - {name: max_retries, type: int, required: false, default: 2, description: "最大重试次数"}
      - {name: exceptions, type: "List[str]", required: false, description: "预期异常类型列表"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-003: RiskLimits ---
  - id: CTR-003
    name: "RiskLimits / 风险限额"
    priority: P0
    frozen: true
    source_domain: D_RISK
    target_domains: [D_PF_CORE]
    flow: "Risk Management → Portfolio Construction"
    physical_path: src/zephyr/shared/contracts/risk_limits.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Risk → Portfolio 核心数据契约。风险限额约束集合，由 Portfolio 组合优化器强制执行。"
    ai_prompt: >
      当你需要在 Risk 中定义风险限额或在 Portfolio 中使用风险限额时，MUST 使用 RiskLimits 类型。
      max_single_position 是单标的权重上限（如 0.10 = 10%），Portfolio 组合优化器 MUST 确保不超此值。
      max_gross_leverage 是总杠杆上限，默认为 1.0（满仓不加杠杆）。
      symbol_overrides 用于个股特殊限制，key 为 symbol，value 为 max_weight。
      如果 Portfolio 组合优化器检测到任何约束被突破，MUST 抛出 RiskLimitViolationError（CTR-ERR-004），阻止订单生成。
      max_drawdown_limit 触发时，系统应进入风控熔断状态。
    sla:
      p99_latency_ms: 5
      sla_scope: "Risk 风控检查（从接收 FactorSignal 到产出 RiskLimits）"
      timeout_action: USE_CACHED_LIMITS
      measurement: "Risk receive_timestamp → Risk emit_timestamp"
    fields:
      - {name: as_of_date, type: datetime, required: true, description: "限额生效日期"}
      - {name: max_single_position, type: float, required: false, default: 0.10, description: "单标的最大权重（如 0.10 = 10%）"}
      - {name: min_single_position, type: float, required: false, default: 0.0, description: "单标的最小权重"}
      - {name: max_gross_leverage, type: float, required: false, default: 1.0, description: "总杠杆上限"}
      - {name: max_sector_concentration, type: float, required: false, default: 0.30, description: "单行业集中度上限"}
      - {name: max_portfolio_var_1d, type: "Optional[float]", required: false, description: "日度 VaR 上限（绝对值）"}
      - {name: max_drawdown_limit, type: "Optional[float]", required: false, description: "最大回撤触发线"}
      - {name: symbol_overrides, type: "Dict[str, float]", required: false, description: "个股特殊限制 {symbol: max_weight}"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-004: Order ---
  - id: CTR-004
    name: "Order / 委托指令"
    priority: P0
    frozen: false
    source_domain: D_PF_CORE
    target_domains: [D_EX_CORE]
    flow: "Portfolio Construction → Trade Execution"
    physical_path: src/zephyr/shared/contracts/order.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Portfolio → Execution 核心数据契约。单笔委托指令（可变对象，随生命周期更新状态）。"
    ai_prompt: >
      当你需要在 Portfolio 中生成订单或在 Execution 中处理订单时，MUST 使用 Order 类型。
      Order 是可变对象（frozen=false），状态通过 OrderStatus 状态机驱动。
      状态转移路径为：PENDING → SUBMITTED → PARTIAL → FILLED / CANCELLED / REJECTED。
      不允许从 FILLED/CANCELLED/REJECTED 回到 SUBMITTED（单向不可逆）。
      quantity 和 limit_price 使用 Decimal 类型，禁止 float。
      Portfolio 生成订单时 status 默认为 PENDING，Execution 在执行过程中更新状态。
      订单被券商拒绝时，status MUST 变为 REJECTED，并抛出 ExecutionRejectionError（CTR-ERR-005）。
    sla:
      p99_latency_ms: 5
      sla_scope: "Portfolio 组合优化器生成订单列表（所有标的的 Order 生成完毕）"
      timeout_action: SKIP_REBALANCE_CYCLE
      measurement: "Portfolio receive_timestamp → Portfolio emit_timestamp"
    fields:
      - {name: order_id, type: str, required: true, description: "全局唯一 ID（UUID）"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: strategy_id, type: str, required: true, description: "来源策略 ID"}
      - {name: side, type: "OrderSide", required: true, description: "方向：BUY / SELL"}
      - {name: order_type, type: "OrderType", required: true, description: "类型：MARKET / LIMIT / STOP"}
      - {name: quantity, type: Decimal, required: true, description: "目标数量（股数）"}
      - {name: limit_price, type: "Optional[Decimal]", required: false, description: "LIMIT 单必填"}
      - {name: status, type: "OrderStatus", required: false, default: "PENDING", description: "状态机：PENDING/SUBMITTED/PARTIAL/FILLED/CANCELLED/REJECTED"}
      - {name: filled_quantity, type: Decimal, required: false, default: "0", description: "已成交数量"}
      - {name: avg_fill_price, type: "Optional[Decimal]", required: false, description: "加权平均成交价"}
      - {name: created_at, type: "Optional[datetime]", required: false, description: "创建时间"}
      - {name: updated_at, type: "Optional[datetime]", required: false, description: "更新时间"}
      - {name: broker_order_id, type: "Optional[str]", required: false, description: "券商侧委托号（回填）"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-005: Fill ---
  - id: CTR-005
    name: "Fill / 成交回报"
    priority: P0
    frozen: true
    source_domain: D_EX_CORE
    target_domains: [D_TRADING]
    flow: "Trade Execution → Post-Trade Analytics"
    physical_path: src/zephyr/shared/contracts/fill.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Execution → Analytics 核心数据契约。单次成交回报（不可变）。"
    ai_prompt: >
      当你需要在 Execution 中记录成交或在 Analytics 中分析成交时，MUST 使用 Fill 类型。
      Fill 是不可变对象（frozen=true），一旦创建不得修改。
      fill_id 是全局唯一 ID，order_id 关联 CTR-004 Order。
      fill_price 和 filled_quantity 使用 Decimal 类型，禁止 float。
      slippage 为可选项，计算方式为 (fill_price - decision_price) / decision_price，用于 TCA 分析。
      佣金 commission 从券商回报中提取，保留券商原始精度。
      每个 Order 可能对应多个 Fill（部分成交场景）。
    sla:
      p99_latency_ms: 100
      sla_scope: "Execution 券商成交推送 → Analytics 接收 Fill（含异步补传窗口）"
      timeout_action: ASYNC_RETRY
      measurement: "Execution receive_timestamp → Analytics emit_timestamp"
    fields:
      - {name: fill_id, type: str, required: true, description: "全局唯一成交 ID"}
      - {name: order_id, type: str, required: true, description: "关联委托 ID"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: strategy_id, type: str, required: true, description: "来源策略 ID"}
      - {name: filled_quantity, type: Decimal, required: true, description: "成交数量"}
      - {name: fill_price, type: Decimal, required: true, description: "成交价格"}
      - {name: fill_timestamp, type: datetime, required: true, description: "成交时间"}
      - {name: commission, type: Decimal, required: false, default: "0", description: "佣金"}
      - {name: slippage, type: "Optional[Decimal]", required: false, description: "滑点（实际 vs 预期）"}
      - {name: broker_fill_id, type: "Optional[str]", required: false, description: "券商侧成交 ID"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-006: PositionSnapshot ---
  - id: CTR-006
    name: "PositionSnapshot / 持仓快照"
    priority: P0
    frozen: true
    source_domain: D_EX_CORE
    target_domains: [D_RISK, D_TRADING, D_ML_TRAIN]
    flow: "OMS / Analytics → Risk Monitor / Strategic Decision"
    physical_path: src/zephyr/shared/contracts/position.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "持仓快照。不可变，代表某一时刻的完整持仓状态。"
    ai_prompt: >
      当你需要查询或记录当前持仓时，MUST 使用 PositionSnapshot 类型。
      PositionSnapshot 是不可变对象（frozen=true），代表某一时刻的完整持仓状态。
      holdings 是 {symbol: quantity} 的映射，quantity 使用 Decimal 类型。
      market_values 是 {symbol: market_value} 的映射，market_value 使用 Decimal 类型。
      total_market_value + cash = 组合总资产。
      gross_leverage 用于风控监控和 ML Platform 策略决策。
      快照由 OMS 或 Analytics 产生，由 Risk Monitor 和 Strategic Decision 消费。
      注意：holdings 和 market_values 虽然是 Dict，但持有的是引用——跨层传递时建议做 deep copy 防护。
    sla:
      p99_latency_ms: 50
      sla_scope: "Execution/Analytics 持仓快照生成（含券商查询 + 计算）"
      timeout_action: USE_LAST_SNAPSHOT
      measurement: "Execution/Analytics query_timestamp → emit_timestamp"
    fields:
      - {name: as_of_timestamp, type: datetime, required: true, description: "快照时间"}
      - {name: portfolio_id, type: str, required: true, description: "组合 ID"}
      - {name: holdings, type: "Dict[str, Decimal]", required: false, description: "{symbol: quantity}"}
      - {name: market_values, type: "Dict[str, Decimal]", required: false, description: "{symbol: market_value}"}
      - {name: total_market_value, type: Decimal, required: false, default: "0", description: "总市值"}
      - {name: cash, type: Decimal, required: false, default: "0", description: "现金"}
      - {name: gross_leverage, type: float, required: false, default: 1.0, description: "总杠杆"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文（CTR-TRACE-001）"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # =====================================================
  # P0 全链路追踪上下文 + 六大跨层错误契约 + 三大背压契约
  # =====================================================

  # --- CTR-TRACE-001: TraceContext ---
  - id: CTR-TRACE-001
    name: "TraceContext / 全链路追踪上下文"
    priority: P0
    frozen: true
    source_domain: D_MKT_DATA
    target_domains: [D_FACTOR, D_ASHARE_SIGNAL, D_RISK, D_PF_CORE, D_EX_CORE, D_TRADING, D_ML_TRAIN]
    flow: "Data Source → Factor → Signal → Portfolio → Execution → Analytics（贯穿全链路）"
    physical_path: src/zephyr/shared/contracts/trace_context.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "跨所有数据层的全链路追踪上下文。Data Source 在首次产生数据时生成，后续每层追加 span。支持反向追溯：'这笔订单是因为哪个因子的哪个信号在哪个时刻产生的'。"
    ai_prompt: >
      所有跨层传递的数据对象中都嵌入了一个可选的 trace_context 字段。
      如果你是 Data Source（数据入口），你 MUST 在首次产生 NormalizedMarketData 时创建新的 TraceContext，生成 UUID 作为 trace_id。
      如果你是 Factor/Signal/Portfolio/Execution/Analytics（中间层），你在处理数据时 MUST：
      1. 从上游数据中取出 trace_context；
      2. 为本层创建一个新的 span（span_id 用 UUID，记录 parent_span_id 指向上游）；
      3. 设置 root_cause_layer 为本层的标识（如 "factor"）；
      4. 将更新后的 trace_context 嵌入到本层产出的数据对象中。
      不要丢掉 trace_context——没有它，排障等于瞎猜。
    fields:
      - {name: trace_id, type: str, required: true, description: "全局唯一追踪 ID（UUID），Data Source 生成，永不改变"}
      - {name: span_id, type: str, required: true, description: "本层 span ID（UUID），每层重新生成"}
      - {name: service_name, type: str, required: true, description: "本层标识：data / factor / signal / ..."}
      - {name: created_at, type: datetime, required: true, description: "本 span 创建时间（UTC 纳秒精度）"}
      - {name: parent_span_id, type: "Optional[str]", required: false, description: "上游 span_id，NULL 表示这是链头"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

# =============================================================================
# P0 六大跨层错误契约
# =============================================================================

  # --- CTR-ERR-001: DataQualityError ---
  - id: CTR-ERR-001
    name: "DataQualityError / 行情质量门禁不通过错误"
    priority: P0
    frozen: true
    source_domain: D_MKT_DATA
    target_domains: [D_FACTOR]
    flow: "Data Source → Alpha Factor（错误路径）"
    physical_path: src/zephyr/shared/contracts/errors/data_quality_error.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Data Source 行情质量门禁不通过时抛出的错误。包含具体的质量缺陷分类和恢复建议。"
    ai_prompt: >
      当 Data Source 的质量门禁检测到行情数据异常时，MUST 抛出 DataQualityError 而非普通 Exception。
      每个 DataQualityError 携带 failure_reason（具体原因枚举）和 recovery_hint（恢复建议）。
      禁止静默丢弃——必须显式抛出，让 Factor 和 Telemetry 感知。
    fields:
      - {name: error_id, type: str, required: true, description: "错误唯一 ID（UUID）"}
      - {name: symbol, type: str, required: true, description: "出问题的标的代码"}
      - {name: failure_reason, type: str, required: true, description: "missing_tick | stale_data | outlier_price | timestamp_future | suspension_detected | volume_zero"}
      - {name: quality_score, type: float, required: true, description: "实际质量分（< 0.7）"}
      - {name: recovery_hint, type: str, required: true, description: "RETRY | SKIP_SYMBOL | SWITCH_SOURCE | HALT"}
      - {name: failed_field, type: "Optional[str]", required: false, description: "触发的具体字段名"}
      - {name: failed_value, type: "Optional[str]", required: false, description: "触发时的实际值（字符串表示）"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-ERR-002: FactorComputationError ---
  - id: CTR-ERR-002
    name: "FactorComputationError / 因子计算失败错误"
    priority: P0
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_ASHARE_SIGNAL]
    flow: "Alpha Factor → Signal Generation（错误路径）"
    physical_path: src/zephyr/shared/contracts/errors/factor_computation_error.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Factor 因子计算过程中遇到无法处理的异常时抛出的错误。"
    ai_prompt: >
      当 Factor 中的因子 compute() 方法遇到不可恢复的错误时，MUST 抛出 FactorComputationError。
      常见 failure_reason：input_missing（缺少所需行情）、division_by_zero（除零）、window_insufficient（历史窗口不足）、
      memory_exceeded（内存超限）、invalid_parameter（参数非法）。
      不要吞掉错误返回一个 is_valid=False 的 FactorSignal——后者用于逻辑判断（如低置信度），前者用于系统级故障。
    fields:
      - {name: error_id, type: str, required: true, description: "错误唯一 ID"}
      - {name: factor_id, type: str, required: true, description: "出问题的因子 ID"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: failure_reason, type: str, required: true, description: "input_missing | division_by_zero | window_insufficient | memory_exceeded | invalid_parameter | timeout"}
      - {name: recovery_hint, type: str, required: true, description: "RETRY | SKIP_FACTOR | DEGRADE_TO_DEFAULT | ESCALATE"}
      - {name: detail, type: "Optional[str]", required: false, description: "详细错误堆栈摘要"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-ERR-003: SignalDegradationWarning ---
  - id: CTR-ERR-003
    name: "SignalDegradationWarning / 信号质量下降警告"
    priority: P0
    frozen: true
    source_domain: D_SIGQC
    target_domains: [D_RISK, D_PF_CORE]
    flow: "Signal Quality → Risk/Portfolio（降级通知）"
    physical_path: src/zephyr/trading/trading_contracts/market/signal_degradation_warning.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Signal 检测到信号质量显著下降时发出的警告。非致命，但 Risk/Portfolio 应据此调低仓位或暂停交易。"
    ai_prompt: >
      当 Signal 信号合成引擎检测到以下情况时，MUST 发布 SignalDegradationWarning：
      - confidence_below_threshold：合成后的信号置信度低于阈值
      - regime_change_detected：检测到市场状态切换（如趋势→震荡）
      - factor_decay_triggered：某个依赖的因子 ICIR 大幅下降
      这不是错误——信号仍然产出，但 Risk/Portfolio 应对此做降级处理（如减半仓位）。
    fields:
      - {name: warning_id, type: str, required: true, description: "警告唯一 ID"}
      - {name: reason, type: str, required: true, description: "confidence_below_threshold | regime_change_detected | factor_decay_triggered | signal_conflict | throughput_drop"}
      - {name: affected_factor_ids, type: "List[str]", required: false, description: "受影响的因子 ID 列表"}
      - {name: degradation_level, type: str, required: true, description: "MILD | MODERATE | SEVERE"}
      - {name: suggested_action, type: str, required: true, description: "REDUCE_POSITION | PAUSE_SIGNAL | CONTINUE_WITH_FLAG"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-ERR-004: RiskLimitViolationError ---
  - id: CTR-ERR-004
    name: "RiskLimitViolationError / 风险限额突破错误"
    priority: P0
    frozen: true
    source_domain: D_RISK
    target_domains: [D_PF_CORE, D_EX_CORE]
    flow: "Risk Management → Portfolio/Execution（拒绝交易）"
    physical_path: src/zephyr/shared/contracts/errors/risk_limit_violation_error.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Risk 检测到当前或计划操作将突破风险限额时抛出的硬错误。Portfolio/Execution MUST 据此阻止订单生成和执行。"
    ai_prompt: >
      当 Risk 风控系统检测到任何风险约束被突破时，MUST 抛出 RiskLimitViolationError。
      这是一个 HALT 级别的错误——下游（Portfolio/Execution）MUST 拒绝继续处理并停止当前调仓周期。
      violated_constraint 精确指出是哪条规则被突破（position_limit / leverage_limit / var_breach / drawdown_trigger / sector_concentration）。
      不要降级为 WARNING——如果这是代码逻辑导致的，降级等于资金安全风险。
    fields:
      - {name: error_id, type: str, required: true, description: "错误唯一 ID"}
      - {name: portfolio_id, type: str, required: true, description: "组合 ID"}
      - {name: violated_constraint, type: str, required: true, description: "position_limit | leverage_limit | var_breach | drawdown_trigger | sector_concentration | concentration_limit"}
      - {name: violation_detail, type: str, required: true, description: "人类可读的违规描述（如 'BTC 仓位 12.3% 超过 10% 限额'）"}
      - {name: limit_value, type: float, required: true, description: "限额值"}
      - {name: actual_value, type: float, required: true, description: "实际值"}
      - {name: recovery_hint, type: str, required: true, description: "REDUCE_AND_RETRY | HALT_AND_ESCALATE | MANUAL_OVERRIDE_REQUIRED"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-ERR-005: ExecutionRejectionError ---
  - id: CTR-ERR-005
    name: "ExecutionRejectionError / 执行拒绝错误"
    priority: P0
    frozen: true
    source_domain: D_EX_CORE
    target_domains: [D_PF_CORE, D_TRADING]
    flow: "Trade Execution → Portfolio/Analytics（执行失败反馈）"
    physical_path: src/zephyr/shared/contracts/errors/execution_rejection_error.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "Execution 订单执行过程中被券商或市场拒绝时抛出的错误。"
    ai_prompt: >
      当 Execution 的订单被券商/交易所拒绝时，MUST 抛出 ExecutionRejectionError。
      拒绝原因通过 rejection_source（BROKER / EXCHANGE / CIRCUIT_BREAKER / INTERNAL）和 rejection_reason 字段精确标识。
      Portfolio 可以根据此错误决定是否重新生成订单（如降低数量、改用 LIMIT 单）。
      如果 rejection_reason 为 market_circuit_breaker，不要重试——等待下一周期。
    fields:
      - {name: error_id, type: str, required: true, description: "错误唯一 ID"}
      - {name: order_id, type: str, required: true, description: "被拒绝的 Order ID"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: rejection_source, type: str, required: true, description: "BROKER | EXCHANGE | CIRCUIT_BREAKER | INTERNAL"}
      - {name: rejection_reason, type: str, required: true, description: "insufficient_balance | quantity_exceeds_limit | price_out_of_range | market_closed | timeout | broker_error"}
      - {name: broker_message, type: "Optional[str]", required: false, description: "券商原始错误信息（保留原文）"}
      - {name: recovery_hint, type: str, required: true, description: "RETRY | RETRY_WITH_REDUCED_QTY | CANCEL_AND_REPORT | WAIT_NEXT_CYCLE"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-ERR-006: ContractViolationError ---
  - id: CTR-ERR-006
    name: "ContractViolationError / 契约违反错误"
    priority: P0
    frozen: true
    source_domain: D_SHARED
    target_domains: ["*"]
    flow: "shared/contracts/ → ALL LAYERS（运行时强制校验失败）"
    physical_path: src/zephyr/shared/contracts/errors/contract_violation_error.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "运行时跨层数据契约校验失败时抛出的通用错误。任何层的数据入站/出站校验均可抛出。"
    ai_prompt: >
      当 ContractEnforcer 装饰器检测到数据不符合 CRT 契约定义时，MUST 抛出 ContractViolationError。
      你的代码不需要手动抛出这个错误——ContractEnforcer 自动完成。
      如果你收到这个错误，说明上游传递的数据格式不符合 YAML 契约定义——检查数据来源，而不是修改校验逻辑。
    fields:
      - {name: error_id, type: str, required: true, description: "错误唯一 ID"}
      - {name: contract_id, type: str, required: true, description: "被违反的契约 ID（如 CTR-001）"}
      - {name: violation_type, type: str, required: true, description: "schema_mismatch | field_type_error | missing_required | version_incompatible | value_out_of_range | extra_field_forbidden"}
      - {name: field_name, type: "Optional[str]", required: false, description: "触发的具体字段名"}
      - {name: expected_type, type: "Optional[str]", required: false, description: "契约期望的类型"}
      - {name: actual_type, type: "Optional[str]", required: false, description: "实际收到的类型"}
      - {name: detail, type: str, required: true, description: "详细校验失败描述"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

# =============================================================================
# P0 三大背压控制契约
# =============================================================================

  # --- CTR-BP-001: Pause ---
  - id: CTR-BP-001
    name: "BackpressurePause / 背压暂停信号"
    priority: P0
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_MKT_DATA]
    flow: "Factor/Signal 下游 → Data Source 上游（背压逆向）"
    physical_path: src/zephyr/shared/contracts/backpressure/pause.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "下游（Factor/Signal）处理能力不足时，向上游（Data Source）发出暂停信号。Data Source 暂停该标的的数据下发。"
    ai_prompt: >
      如果下游处理速度跟不上上游产生速度，你可以通过 emit PAUSE 背压信号来告诉上游暂停。
      PAUSE 会暂停指定标的的数据下发 duration_ms 毫秒，到期后自动恢复。
      不要静默丢弃数据——上游不知道下游爆了，只会继续发，最终内存溢出。
    fields:
      - {name: signal_id, type: str, required: true, description: "信号唯一 ID"}
      - {name: symbol, type: str, required: true, description: "暂停的标的"}
      - {name: action, type: str, required: false, default: "PAUSE", description: "固定值 PAUSE"}
      - {name: duration_ms, type: int, required: true, description: "暂停时长（毫秒），到期自动恢复"}
      - {name: reason, type: str, required: true, description: "暂停原因：buffer_full | processing_overload | gc_pause | downstream_unavailable"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-BP-002: Throttle ---
  - id: CTR-BP-002
    name: "BackpressureThrottle / 背压降速信号"
    priority: P0
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_MKT_DATA]
    flow: "Factor/Signal 下游 → Data Source 上游（背压逆向）"
    physical_path: src/zephyr/shared/contracts/backpressure/throttle.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "下游处理压力较大但不至于暂停时，向上游发出降速信号。上游将下发速率降至指定值。"
    ai_prompt: >
      THROTTLE 比 PAUSE 轻：不是完全暂停，而是降到每秒 max_rate_per_sec 条。
      典型的场景是下游队列开始堆积但还没满——先降速观察，如果仍然堆积再升级为 PAUSE。
    fields:
      - {name: signal_id, type: str, required: true, description: "信号唯一 ID"}
      - {name: symbol, type: str, required: true, description: "降速的标的"}
      - {name: action, type: str, required: false, default: "THROTTLE", description: "固定值 THROTTLE"}
      - {name: max_rate_per_sec, type: int, required: true, description: "降速后的最大速率（条/秒）"}
      - {name: reason, type: str, required: true, description: "降速原因"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-BP-003: Resume ---
  - id: CTR-BP-003
    name: "BackpressureResume / 背压恢复信号"
    priority: P0
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_MKT_DATA]
    flow: "Factor/Signal 下游 → Data Source 上游（背压逆向）"
    physical_path: src/zephyr/shared/contracts/backpressure/resume.py
    stability: locked-5yr
    schema_version: "1.0"
    description: "下游处理能力恢复后，向上游发出恢复信号。上游恢复正常下发速率。"
    ai_prompt: >
      当之前的 PAUSE/THROTTLE 条件解除后（如队列清空、GC 完成），MUST 发送 RESUME 恢复信号。
      不要在 RESUME 后立即取消——先观察一个周期确认稳定。
    fields:
      - {name: signal_id, type: str, required: true, description: "信号唯一 ID"}
      - {name: symbol, type: str, required: true, description: "恢复的标的"}
      - {name: action, type: str, required: false, default: "RESUME", description: "固定值 RESUME"}
      - {name: reason, type: str, required: true, description: "恢复原因：buffer_cleared | capacity_restored | gc_complete | upstream_recovered"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- P1 蓝图跨层接口签名（15 条：CTR-P1-001~CTR-P1-015）---
  - id: CTR-P1-001
    name: "FactorMonitorReport / 因子有效性监控报告"
    priority: P1
    frozen: true
    source_domain: D_FACTOR
    target_domains: [D_TRADING]
    flow: "Alpha Factor → Post-trade Analytics"
    physical_path: src/zephyr/shared/contracts/factor_monitor_report.py
    stability: upgradable
    schema_version: "1.0"
    description: "Factor → Analytics 因子有效性监控报告。定期评估已注册因子的预测有效性。"
    source_blueprint: "factor-effectiveness-monitoring-blueprint.md"
    fields:
