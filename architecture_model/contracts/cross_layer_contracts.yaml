  - id: OCP-002
    name: "StrategyBase + StrategyRegistry / 策略扩展点"
    domain: D_PF_CORE
    registry: StrategyRegistry
    autodiscover: null
    physical_path: src/zephyr/pf_core/strategy_base.py
    registry_path: src/zephyr/pf_core/strategy_registry.py
    related_kb_ref: KBG-0004
    description: "Portfolio 策略基类契约。所有策略必须继承 StrategyBase，实现 generate_target_weights()，向 StrategyRegistry 注册。 (INV-007: implementors must ensure cross-layer calls carry idempotency_key)"
    abstract_methods:
      - {name: meta, type: property, returns: StrategyMeta, description: "返回策略元数据"}
      - {name: generate_target_weights, type: method, returns: "List[Order]", description: "生成目标权重并转换为委托指令列表"}
    optional_methods:
      - {name: on_fill, type: method, returns: None, description: "成交回调钩子"}
      - {name: on_risk_alert, type: method, returns: None, description: "风险告警回调钩子"}
    meta_fields:
      - {name: strategy_id, type: str, required: true, description: "全局唯一，命名规范：{type}_{name}_v{version}"}
      - {name: name, type: str, required: true, description: "人类可读名称"}
      - {name: strategy_type, type: str, required: true, description: "策略类型：equity_ls / stat_arb / macro / cta / custom"}
      - {name: version, type: str, required: true, description: "语义版本"}
      - {name: description, type: str, required: true, description: "策略说明"}
      - {name: factor_dependencies, type: "List[str]", required: false, description: "依赖的 factor_id 列表"}
      - {name: author, type: str, required: false, default: "agent", description: "创建者"}
      - {name: tags, type: "List[str]", required: false, description: "自由标签"}

  - id: OCP-003
    name: "BrokerInterface / 券商扩展点"
    domain: D_EX_CORE
    registry: null
    autodiscover: null
    physical_path: src/zephyr/trading/trading_contracts/broker_interface.py
    related_kb_ref: KBG-0004
    description: "Execution 券商接口契约。所有券商适配器必须实现此接口。支持同时接入多家券商，通过 SOR 路由。 (INV-007: implementors must ensure cross-layer calls carry idempotency_key)"
    abstract_methods:
      - {name: broker_id, type: property, returns: str, description: "券商唯一标识（如 ib, futu, longport, simulation）"}
      - {name: connect, type: method, returns: bool, description: "建立连接"}
      - {name: disconnect, type: method, returns: None, description: "断开连接"}
      - {name: submit_order, type: method, returns: str, description: "发送委托，返回 broker_order_id"}
      - {name: cancel_order, type: method, returns: bool, description: "撤单"}
      - {name: query_order, type: method, returns: Order, description: "查询委托状态"}
      - {name: get_positions, type: method, returns: PositionSnapshot, description: "查询当前持仓"}
    optional_methods:
      - {name: register_fill_callback, type: method, returns: None, description: "注册成交回调（支持主动推送）"}
      - {name: supports_realtime_fills, type: property, returns: bool, description: "是否支持实时成交推送（默认 False）"}
  # --- CTR-P1-013: TelemetryEmitter ---
  - id: CTR-P1-013
    name: "TelemetryEmitter / 遥测发射器"
    priority: P1
    frozen: true
    source_domain: D_OPS
    target_domains: [D_INFRA_OPS, D_RISK, D_EX_CORE, D_TRADING, D_GOV_ENFORCEMENT, D_OPS]
    flow: "Telemetry Metrics → 全系统"
    physical_path: src/zephyr/shared/contracts/telemetry_emitter.py
    stability: upgradable
    schema_version: "1.0"
    description: "Telemetry → 全系统遥测发射器契约。提供结构化指标、日志、追踪的发射接口。"
    fields:
      - {name: emitter_id, type: str, required: true, description: "发射器唯一ID"}
      - {name: emitter_type, type: str, required: true, description: "发射器类型：metrics | logs | traces"}
      - {name: metric_name, type: str, required: true, description: "指标名称"}
      - {name: metric_value, type: float, required: true, description: "指标值"}
      - {name: metric_type, type: str, required: true, description: "指标类型：counter | gauge | histogram | summary"}
      - {name: labels, type: "Dict[str, str]", required: true, description: "标签键值对"}
      - {name: timestamp, type: datetime, required: true, description: "时间戳"}
      - {name: source_module, type: str, required: true, description: "来源模块"}
      - {name: correlation_id, type: str, required: true, description: "关联ID"}
      - {name: severity, type: str, required: false, description: "严重程度：debug | info | warning | error | critical"}
      - {name: message, type: str, required: false, description: "消息内容"}
      - {name: span_id, type: str, required: false, description: "追踪Span ID"}
      - {name: trace_id, type: str, required: false, description: "追踪Trace ID"}
      - {name: parent_span_id, type: str, required: false, description: "父Span ID"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-P1-014: ExperimentResult ---
  - id: CTR-P1-014
    name: "ExperimentResult / 实验结论"
    priority: P1
    frozen: true
    source_domain: D_INTELLIGENCE
    target_domains: [D_SIMULATION, D_ML_TRAIN]
    flow: "Experimentation → Research / ML Platform"
    physical_path: src/zephyr/shared/contracts/experiment_result.py
    stability: upgradable
    schema_version: "1.0"
    description: "Experimentation → Research/ML Platform 实验结论契约。Scout Agent 完成对照实验后产出的结构化结论。"
    ai_prompt: >
      当 Experimentation 的 Scout Agent 完成一个实验周期后，MUST 产出 ExperimentResult。
      每个 ExperimentResult 代表一次完整的对照实验结论——包含实验设计、执行过程、结果指标和可操作建议。
      confidence 用于衡量结论的统计可靠性：>0.9 = 高度可信，0.7-0.9 = 中等，<0.7 = 不发布。
      Research 研究创新层读取历史实验结论指导研究方向。ML Platform 读取实验结论调整模型策略。
    fields:
      - {name: experiment_id, type: str, required: true, description: "全局唯一实验 ID（UUID）"}
      - {name: experiment_name, type: str, required: true, description: "人类可读实验名称"}
      - {name: experiment_type, type: str, required: true, description: "ab_test | factor_ablation | strategy_variant | parameter_sweep | custom"}
      - {name: hypothesis, type: str, required: true, description: "实验假设"}
      - {name: variant_a_description, type: str, required: true, description: "A 组描述（对照组）"}
      - {name: variant_b_description, type: str, required: true, description: "B 组描述（实验组）"}
      - {name: start_timestamp, type: datetime, required: true, description: "实验开始时间（UTC）"}
      - {name: end_timestamp, type: datetime, required: true, description: "实验结束时间（UTC）"}
      - {name: sample_size, type: int, required: true, description: "样本数量"}
      - {name: metrics, type: "Dict[str, float]", required: true, description: "关键指标 {metric_name: value}"}
      - {name: variant_b_improvement, type: float, required: true, description: "B 组相对 A 组的改善（%）"}
      - {name: p_value, type: float, required: true, description: "统计显著性 p-value"}
      - {name: confidence, type: float, required: true, description: "结论置信度 0.0-1.0"}
      - {name: conclusion, type: str, required: true, description: "supported | rejected | inconclusive"}
      - {name: actionable_suggestions, type: "List[str]", required: true, description: "下游可操作建议列表"}
      - {name: affected_factor_ids, type: "List[str]", required: false, description: "受影响的因子 ID"}
      - {name: affected_strategy_ids, type: "List[str]", required: false, description: "受影响的策略 ID"}
      - {name: archived_to_kms, type: bool, required: false, default: false, description: "已归档到 KMS"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-P1-015: SynthesizedSignal ---
  - id: CTR-P1-015
    name: "SynthesizedSignal / 合成交易信号"
    priority: P1
    frozen: true
    source_domain: D_ASHARE_SIGNAL
    target_domains: [D_RISK, D_PF_CORE]
    flow: "Signal Generation → Risk Management / Portfolio Construction"
    physical_path: src/zephyr/shared/contracts/synthesized_signal.py
    stability: upgradable
    schema_version: "1.0"
    description: "Signal → Risk/Portfolio 合成交易信号契约。Signal 信号合成引擎聚合多个 FactorSignal 后产出的综合交易信号。"
    ai_prompt: >
      当 Signal 信号合成引擎完成因子信号聚合后，MUST 产出 SynthesizedSignal。
      每个 SynthesizedSignal 代表一个标的在一个时间截面上的综合交易判断。
      signal_value 是标准化后的合成信号值（-3 到 3），正值为做多信号，负值为做空信号。
      contributing_factors 记录参与合成的因子 ID 及其权重——用于归因分析。
      Risk 风控层使用此信号做 pre-trade risk check。Portfolio 组合构建层使用此信号做组合优化输入。
      generation_latency_ms 记录信号合成耗时，用于 SLO 监控。
    fields:
      - {name: signal_id, type: str, required: true, description: "全局唯一信号 ID（UUID）"}
      - {name: symbol, type: str, required: true, description: "标的代码"}
      - {name: as_of_timestamp, type: datetime, required: true, description: "信号截面时间（UTC）"}
      - {name: signal_value, type: float, required: true, description: "标准化合成信号值（-3 到 3）"}
      - {name: signal_direction, type: str, required: true, description: "LONG | SHORT | NEUTRAL"}
      - {name: confidence, type: float, required: true, description: "合成置信度 0.0-1.0"}
      - {name: contributing_factors, type: "Dict[str, float]", required: true, description: "{factor_id: weight}"}
      - {name: regime, type: str, required: false, description: "市场状态：trending | mean_reverting | high_volatility | low_volatility"}
      - {name: suggested_position_pct, type: float, required: false, description: "建议仓位百分比"}
      - {name: generation_latency_ms, type: int, required: true, description: "信号合成耗时（毫秒）"}
      - {name: is_degraded, type: bool, required: false, default: false, description: "是否降级信号"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键（UUID），防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-P1-016: BacktestResult (D_BACKTEST域产出, 2026-07-02新增) ---
  - id: CTR-P1-016
    name: "BacktestResult / 回测结果"
    priority: P1
    frozen: true
    source_domain: D_BACKTEST
    target_domains: [D_PF_CORE, D_RISK, D_OPS, D_FRONTEND]
    flow: "L_BACKTEST → Portfolio Portfolio / Risk Risk / Telemetry Ops / Frontend"
    physical_path: src/zephyr/backtest/core/engine_base.py
    stability: upgradable
    schema_version: "1.0"
    description: "D_BACKTEST域产出的标准化回测结果契约。包含绩效指标、交易统计、净值曲线引用。下游Portfolio组合构建层用于策略遴选,Risk风控层用于风险预算校准,Telemetry运维层用于回测任务监控。"
    ai_prompt: >
      当回测引擎完成一次运行后,MUST 产出 BacktestResult。
      strategy_id 必须对应策略注册表中已注册的策略 key。
      所有收益率指标(total_return/annual_return/sharpe_ratio/max_drawdown)使用 float 类型——这些是聚合指标,非逐笔价格,允许 float。
      trades_count 是总交易笔数,win_rate 是胜率(0.0-1.0)。
      Portfolio 组合构建层使用此结果做策略遴选(sharpe_ratio > 阈值才纳入候选池)。
      Risk 风控层使用 max_drawdown 做风险预算校准。
      若 overfitting_flag = True,下游应降低该策略权重或拒绝采纳。
    fields:
      - {name: strategy_id, type: str, required: true, description: "策略唯一标识"}
      - {name: start_date, type: datetime, required: true, description: "回测起始日期"}
      - {name: end_date, type: datetime, required: true, description: "回测结束日期"}
      - {name: total_return, type: float, required: true, description: "总收益率(小数,0.15=15%)"}
      - {name: annual_return, type: float, required: true, description: "年化收益率(小数)"}
      - {name: sharpe_ratio, type: float, required: true, description: "夏普比率"}
      - {name: max_drawdown, type: float, required: true, description: "最大回撤(正数小数,0.2=20%)"}
      - {name: win_rate, type: float, required: true, description: "胜率(0.0-1.0)"}
      - {name: trades_count, type: int, required: true, description: "总交易笔数"}
      - {name: timestamp, type: datetime, required: true, description: "回测完成时间戳(UTC)"}
      - {name: overfitting_flag, type: bool, required: false, default: false, description: "过拟合标记(true=检测到过拟合)"}
      - {name: benchmark_symbol, type: "Optional[str]", required: false, description: "基准标的代码"}
      - {name: idempotency_key, type: str, required: true, description: "幂等键(UUID),防止重复处理"}
      - {name: trace_context, type: "Optional[TraceContext]", required: false, description: "全链路追踪上下文"}
      - {name: schema_version, type: str, required: false, default: "1.0", description: "契约版本"}

  # --- CTR-P1-017: BacktestRunArtifact (D_BACKTEST域产出, 2026-07-04新增, 与CTR-P1-016互补) ---
  - id: CTR-P1-017
    name: "BacktestRunArtifact / 回测运行产物"
    priority: P1
    frozen: true
    source_domain: D_BACKTEST
    target_domains: [D_FRONTEND]
    flow: "L_BACKTEST → Frontend Visualization"
    physical_path: src/zephyr/backtest/io/result_repository.py
    stability: upgradable
    schema_version: "1.0.0"
    status: Draft
    description: "回测运行产物契约，包含回测结果时序数据（equity curve/trade log/tick replay data），用于前端可视化消费。与 CTR-P1-016 BacktestResult（汇总指标）互补——BacktestResult 是标量汇总，BacktestRunArtifact 是时序明细。"
    ai_prompt: >
      当回测引擎完成一次运行后,MUST 产出 BacktestRunArtifact 以支撑前端可视化。
      strategy_id 必须对应策略注册表中已注册的策略 key。
      run_id 必须与 BacktestResult.idempotency_key 关联,保证汇总指标与时序明细可对齐。
      equity_curve 与 trade_log 数据 MUST 遵循 PIT 铁律(零前瞻偏差)——任何时序点不得引用其之后时刻才能获得的信息。
      tick_replay_data 为可选项,仅当回测配置启用 tick 级回放时填充。
      benchmark_curve 与 drawdown_curve 为可选,用于前端叠加渲染基准对比与回撤分析。
      Frontend 通过 result_repository.py (D_BACKTEST io/) 拉取本产物,使用 Panel+HoloViz 组件渲染可视化。
    pit_note: >
      equity_curve/trade_log 数据 MUST 遵循 PIT 铁律(零前瞻偏差)。
      任一时序点的字段值不得引用该时点之后才能观测到的信息——
      违反 PIT 铁律将导致回测结果失真,下游 Frontend 可视化亦会传递错误信号。
    fields:
      - {name: strategy_id, type: str, required: true, description: "策略唯一标识"}
      - {name: run_id, type: str, required: true, description: "回测运行 ID,与 BacktestResult.idempotency_key 关联"}
      - {name: equity_curve, type: "array[{timestamp: ISO8601, equity: float}]", required: true, description: "权益曲线时序数据"}
      - {name: trade_log, type: "array[{timestamp: ISO8601, symbol: string, side: string, price: float, quantity: int, commission: float}]", required: true, description: "交易记录"}
      - {name: tick_replay_data, type: "array[{timestamp: ISO8601, price: float, volume: int}]", required: false, description: "tick 回放数据(可选,启用 tick 级回放时填充)"}
      - {name: benchmark_curve, type: "array[{timestamp: ISO8601, value: float}]", required: false, description: "基准曲线(可选)"}
      - {name: drawdown_curve, type: "array[{timestamp: ISO8601, drawdown: float}]", required: false, description: "回撤曲线(可选)"}
      - {name: schema_version, type: str, required: true, default: "1.0.0", description: "契约版本,默认 1.0.0"}
