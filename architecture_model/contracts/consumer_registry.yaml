# consumer_registry.yaml — 跨层契约消费者注册表 (SSoT)
# 对标 CTR-VER-001（契约版本协商）的 VER-R3 要求：
# "生产者 MUST 在新 MAJOR 版本发布前提前 30 天通知所有注册消费者"
#
# 本文件是消费者注册的 canonical SSoT——所有契约变更前必须查询此表。
# 注册方式：每层首次消费某契约时，必须在此登记。
#
# 与 ContractRegistry 的关系：
#   ContractRegistry 管理契约定义——本文件管理契约消费者。
#   两者共同支撑 CTR-VER-001 的版本协商流程。

