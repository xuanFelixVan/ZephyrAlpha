  INT: D_INFRASTRUCTURE
  IT: D_INTELLIGENCE
  KB: D_INTEGRATION
  SC: D_SECURITY
  SH: D_SHARED
  TR: D_TRADING
  XC: D_EX_CORE
# ============================================================
# 段位规划
# ============================================================
segment_plan:
  0001-8999: 业务异常（按域分配，单域 9999 容量）
  9000-9999: 保留/实验段位
