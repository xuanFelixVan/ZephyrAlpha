# ============================================================================
# §3.1 STRIDE-Lite 威胁分析（详细版）
# 永恒框架（威胁类别/代表威胁/影响域/缓解措施）原 security_principles.md §3.1 已删(2026-07-30);可执行约束在本 YAML;git 历史可查
# 本节为 principles §3.1 的详细展开：新增 severity（P0/P1）+ 所在域 列
# ============================================================================

threat_model:
  description: "STRIDE-Lite + OWASP LLM Top 10 详细威胁映射（运营态，含 severity/exposure 等详细列）"
  eternal_framework_ref: "原 security_principles.md §3（永恒框架：STRIDE 6 类 + OWASP 10 条 + 防御深度原则） 已删(2026-07-30);git 历史可查"

  stride_lite_detailed:
    description: "STRIDE-Lite 威胁分析详细版——6 行，含 severity（P0/P1）+ 所在域列"
    eternal_framework_ref: "原 security_principles.md §3.1（永恒框架版，4 列：威胁类别/代表威胁/影响域/缓解措施） 已删(2026-07-30);git 历史可查"
    columns: [threat_id, category, representative_threat, impact_domain, severity, mitigation, located_domain]
    rows:
      - threat_id: T1
        category: Spoofing
        representative_threat: "LLM Provider 中间人攻击 / Broker 伪装响应"
        impact_domain: D-EXT
        severity: P0
        mitigation: "HTTPS + API Key Fingerprint 校验"
        located_domain: D-EXT
      - threat_id: T2
        category: Tampering
        representative_threat: "数据源注入错误行情污染因子"
        impact_domain: "L00→L02"
        severity: P0
        mitigation: "L00 ACL 质量门禁 + 数据签名验证"
        located_domain: "D-EXT→D-INT"
      - threat_id: T3
        category: Repudiation
        representative_threat: "AI 决策「不是我说的」/ 无法追溯改动"
        impact_domain: "L08, L10"
        severity: P1
        mitigation: "Session Log + Handoff Log（§9）"
        located_domain: D-MGMT
      - threat_id: T4
        category: Info Disclosure
        representative_threat: ".env 泄漏 / API Key 误写 git"
        impact_domain: D-SECRET
        severity: P0
        mitigation: "git-secrets + trufflehog + LSG Output Filter"
        located_domain: D-SECRET
      - threat_id: T5
        category: DoS
        representative_threat: "LLM API 限流 / 连接池耗尽"
        impact_domain: D-AI
        severity: P1
        mitigation: "限流 + 熔断 + 降级（规则基）"
        located_domain: D-AI
      - threat_id: T6
        category: Elevation
        representative_threat: "Agent 越权写系统文件 / 逃逸沙箱"
        impact_domain: D-AGT
        severity: P0
        mitigation: "Windows ACL 只读挂载 + 白名单"
        located_domain: D-AGT
    key_insight: "P0 集中在 T1/T2/T4/T6（Spoofing/Tampering/Info Disclosure/Elevation），T3/T5 为 P1"

  owasp_llm_top10_detailed:
    description: "OWASP LLM Top 10（2023/2024）详细覆盖矩阵——10 行，含本系统暴露面 + 参考列"
    eternal_framework_ref: "原 security_principles.md §3.2（永恒框架版，3 列：OWASP ID/威胁/防御原则） 已删(2026-07-30);git 历史可查"
    columns: [owasp_id, threat, system_exposure, experimental_defense, reference]
    rows:
      - owasp_id: LLM01
        threat: Prompt Injection
        system_exposure: "Cursor / Trae 对话 + 注入外部文档"
        experimental_defense: "LSG L1 输入分类器 + L2 System Prompt 隔离"
        reference: "LSG §4"
      - owasp_id: LLM02
        threat: Insecure Output Handling
        system_exposure: "AI 输出直接写文件"
        experimental_defense: "LSG L3 输出 Schema + Pydantic extra='forbid'"
        reference: "LSG §4"
      - owasp_id: LLM03
        threat: Training Data Poisoning
        system_exposure: "不训练模型（只用推理）"
        experimental_defense: N/A
        reference: "–"
      - owasp_id: LLM04
        threat: Model DoS
        system_exposure: "LLM API 被重复调用"
        experimental_defense: "Orchestrator 任务限流 + 配额"
        reference: "Orc §6"
      - owasp_id: LLM05
        threat: Supply Chain
        system_exposure: "第三方 MCP Tool 不可信"
        experimental_defense: "Agent Sandbox 白名单（§5）"
        reference: Agent Sandbox 决策（原架构决策）
      - owasp_id: LLM06
        threat: Sensitive Info Disclosure
        system_exposure: "AI 输出包含 API Key"
        experimental_defense: "LSG L3 输出 Secret Pattern 扫描"
        reference: "LSG §4"
      - owasp_id: LLM07
        threat: Insecure Plugin Design
        system_exposure: "MCP tools 接口越权"
        experimental_defense: "LSG L4 Pattern 巡检 + Sandbox"
        reference: "LSG §4"
      - owasp_id: LLM08
        threat: Excessive Agency
        system_exposure: "Agent 拥有过多权限"
        experimental_defense: "白名单命令集 + 资源配额"
        reference: Agent Sandbox 决策（原架构决策）
      - owasp_id: LLM09
        threat: Overreliance
        system_exposure: "AI 幻觉未检测"
        experimental_defense: "Orchestrator 幻觉检测 + Context Engine validate"
        reference: "Orc §5"
      - owasp_id: LLM10
        threat: Model Theft
        system_exposure: "本地 BGE-M3 / Qwen2.5-3B 是开源公开模型"
        experimental_defense: N/A
        reference: "–"
    key_insight: "本系统 AI 攻击面集中在 LLM01 / LLM02 / LLM06 / LLM08 / LLM09（P0），其他 5 条不适用（P2 级）"

