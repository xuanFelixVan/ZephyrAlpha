module_id: MOD-GOVERNANCE
schema_version: "2.0"

partition:
  id: cross-cutting-technology
  name: "Technology Landscape / 技术全景图"
  type: cross-cutting
  description: >
    技术全景图 SSoT（ThoughtWorks Technology Radar 风格）。
    43 条技术条目，Adopt/Trial/Assess/Hold/Build 五象限。
    活文档，每 3 个月刷新一次。
    来源：technology-landscape.md v1.0.0 迁移。
  source_views:
    - 04-technology_architecture.md
  related_kb_refs:
    - KBG-0009
  refresh_cadence: quarterly

quadrants:
  adopt:
    name: "Adopt / 已确定采用"
    description: "已验证可用于生产，强烈推荐使用，已有成功实践"
  trial:
    name: "Trial / 试用中"
    description: "有价值，低风险场景先引入，积累实际经验后考虑升 Adopt"
  assess:
    name: "Assess / 评估中"
    description: "有潜力，持续关注，当前不适合大规模引入"
  hold:
    name: "Hold / 暂缓"
    description: "谨慎对待，不推荐新项目引入，现有使用需评估退出路径"
  build:
    name: "Build / 自研"
    description: "无合适开源替代，自研模块"

