summary:
  total_selections: 17
  by_service:
    context_engine: 3       # TECH-01/02/03
    vector_memory: 3        # TECH-04/05/06
    agent_orchestrator: 5   # TECH-07/08/09/10/11
    agent_sandbox: 1        # TECH-12
    feedback_loop: 2        # TECH-13/14
    llm_security_gateway: 3 # TECH-15/16/17
  zero_external_dependency_count: 17   # 所有首选方案 experimental 都不需要外部服务
  upgrade_deferred_to_phase_3_plus: 8  # 8 项有 beta+ 升级路径
  upgrade_never: 3                     # TECH-03 / TECH-08 / TECH-15 永不升级

# ============================================================================
# 升级阈值总览（汇总看板）
# ============================================================================
upgrade_watchboard:
  # experimental 监控的关键阈值，任一触发即启动升级讨论
  - tech_id: TECH-01
    watch: "NetworkX 节点数"
    threshold: 50000
    upgrade_to: "Neo4j"
  - tech_id: TECH-02
    watch: "LLM 压缩延迟 P99"
    threshold: "5s 持续 7 天"
    upgrade_to: "Qwen2.5-7B 或外部 API"
  - tech_id: TECH-04
    watch: "ChromaDB 持久化大小"
    threshold: "500MB"
    upgrade_to: "Qdrant 独立服务"
  - tech_id: TECH-07
    watch: "并发 RUNNING 任务数"
    threshold: 20
    upgrade_to: "NATS JetStream"
  - tech_id: TECH-09
    watch: "幻觉漏检率"
    threshold: "10%"
    upgrade_to: "规则集 + LLM-as-Judge"
  - tech_id: TECH-12
    watch: "是否需要网络隔离/资源配额"
    threshold: "首次需求"
    upgrade_to: "Docker Desktop"
  - tech_id: TECH-13
    watch: "FLE 数据量/天"
    threshold: 1000000
    upgrade_to: "InfluxDB 2.x"
  - tech_id: TECH-16
    watch: "红队评估绕过率"
    threshold: "5%"
    upgrade_to: "Pattern + LLM-as-Judge + 专用模型"

