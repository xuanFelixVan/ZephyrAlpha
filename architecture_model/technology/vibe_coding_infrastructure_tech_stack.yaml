# ============================================================================
# 按服务分组的技术选型（17 项）
# ============================================================================

context_engine:
  # ---------------------------------------------------------------------- #1
  - id: TECH-01
    category: "Context Engine - 上下文图存储"
    purpose: "存储任务卡、知识条目、代码上下文的关联关系（NetworkX Graph）"
    primary:
      choice: "NetworkX 3.2 + JSON 持久化"
      version: "3.2.x"
      rationale:
        - "轻量级，纯 Python，零外部依赖"
        - "个人量化规模（节点 ≤ 10k），JSON 持久化足够"
        - "与 ChromaDB 元数据交叉引用便利"
      install: "pip install networkx==3.2"
    alternatives:
      - {name: "Neo4j Community", why_not: "运维成本高，beta+ 考虑"}
      - {name: "igraph", why_not: "C 扩展编译麻烦，跨平台不稳定"}
    not_recommended:
      - {name: "SQLite 邻接表自实现", reason: "重复造轮子，NetworkX 已有完整算法库"}
    upgrade_trigger:
      - "节点数 > 50k"
      - "跨进程共享图结构"
      - "复杂图算法（社区发现 / PageRank）成为热路径"
    upgrade_to: "Neo4j Community Edition（beta+）"

  # ---------------------------------------------------------------------- #2
  - id: TECH-02
    category: "Context Engine - 上下文压缩 LLM"
    purpose: "将超长上下文压缩到 token_budget 内"
    primary:
      choice: "Qwen2.5-3B-Instruct (ONNX int8)"
      version: "2.5-3B"
      rationale:
        - "3B 量级本地可跑，压缩质量显著优于规则基"
        - "ONNX int8 量化，推理延迟 < 3s（P99）"
        - "零 API 成本"
      install: "huggingface-cli download Qwen/Qwen2.5-3B-Instruct + onnxruntime"
    alternatives:
      - {name: "Llama-3.2-3B-Instruct", why_not: "中文上下文质量略逊 Qwen"}
      - {name: "Phi-3.5-mini", why_not: "中文较弱"}
    not_recommended:
      - {name: "GPT-4 API 调用", reason: "违反零外部依赖原则，且产生成本"}
      - {name: "规则基作为主路径", reason: "压缩质量不可控，仅作降级回退"}
    upgrade_trigger:
      - "压缩延迟 P99 > 5s 持续 7 天"
      - "压缩质量评分（召回率）< 0.75"
    upgrade_to: "Qwen2.5-7B（需 GPU）或外部 LLM API"

  # ---------------------------------------------------------------------- #3
  - id: TECH-03
    category: "Context Engine - 压缩降级路径"
    purpose: "LLM 压缩失败时的回退机制"
    primary:
      choice: "规则基（基于章节标题 + 代码签名提取）+ 截断（保头尾）"
      rationale:
        - "100% 可用，零延迟增量"
        - "覆盖 LLM 所有可能的失败模式（OOM / 超时 / 崩溃）"
    alternatives: []
    not_recommended:
      - {name: "直接报错阻塞主流程", reason: "违反 CE DEGRADE-002 契约"}
    upgrade_trigger: "永不升级（这是降级兜底，不是主路径）"

vector_memory:
  # ---------------------------------------------------------------------- #4
  - id: TECH-04
    category: "Vector Memory - 向量数据库"
    purpose: "5 个 Collection 的向量存储与相似度检索"
    primary:
      choice: "ChromaDB 0.6"
      version: "0.6.x"
      rationale:
        - "experimental 进程内库 + beta+ HTTP 服务同一 SDK，API 不变"
        - "持久化 SQLite 兼容，易备份"
        - "元数据过滤能力强"
      install: "pip install chromadb==0.6.*"
    alternatives:
      - {name: "Qdrant", why_not: "beta+ 升级候选，experimental 过重"}
      - {name: "Milvus Lite", why_not: "文档较新，社区较小"}
    not_recommended:
      - {name: "FAISS 裸库", reason: "缺元数据过滤、缺持久化封装"}
      - {name: "Pinecone", reason: "外部云服务，违反零依赖原则"}
    upgrade_trigger:
      - "持久化大小 > 500MB"
      - "并发写入冲突频发（filelock 争用 > 10% 请求）"
      - "需要分布式部署"
    upgrade_to: "Qdrant 独立服务（beta+）"

  # ---------------------------------------------------------------------- #5
  - id: TECH-05
    category: "Vector Memory - 嵌入模型"
    purpose: "文档 → 向量的本地嵌入"
    primary:
      choice: "BAAI/bge-m3 (ONNX)"
      version: "bge-m3"
      rationale:
        - "中英双语质量顶级（MTEB 排名前列）"
        - "1024 维 + 支持稀疏向量 + 多粒度"
        - "ONNX 推理延迟 < 50ms/句（CPU）"
      install: "huggingface-cli download BAAI/bge-m3 + onnxruntime"
    alternatives:
      - {name: "BAAI/bge-small-zh-v1.5", why_not: "仅中文，上下文窗口小"}
      - {name: "OpenAI text-embedding-3-small", why_not: "外部 API，违反零依赖"}
    not_recommended:
      - {name: "sentence-transformers 默认模型", reason: "中文质量不足"}
    upgrade_trigger:
      - "检索召回率 < 0.70 持续 7 天"
      - "新发布的模型（如 bge-m4 / GTE-Qwen2）在 MTEB 显著胜出"
    upgrade_to: "视当时 MTEB 榜单最优 ONNX 可导出模型"

  # ---------------------------------------------------------------------- #6
  - id: TECH-06
    category: "Vector Memory - 分块策略"
    purpose: "长文档 → 块的切分"
    primary:
      choice: "递归字符分块（RecursiveCharacterTextSplitter）"
      rationale:
        - "保留语义边界（章节 > 段落 > 句子 > 字符）"
        - "LangChain 标准实现，社区验证"
        - "chunk_size=512 tokens + overlap=50"
    alternatives:
      - {name: "Semantic Chunking（基于嵌入相似度）", why_not: "experimental 开销大，收益不明"}
      - {name: "Markdown-aware Chunking", why_not: "作为递归分块的特化，已在 separators 覆盖"}
    not_recommended:
      - {name: "固定字符数分块（无 separator）", reason: "语义边界断裂严重"}
    upgrade_trigger:
      - "召回率 < 0.70 且与嵌入模型无关"
      - "代码类文档检索质量差"
    upgrade_to: "Code-aware Chunking（AST-based）+ Semantic Chunking 混合"

agent_orchestrator:
  # ---------------------------------------------------------------------- #7
  - id: TECH-07
    category: "Agent Orchestrator - 任务队列"
    purpose: "任务入队、调度、状态持久化"
    primary:
      choice: "SQLite WAL 模式 + asyncio.Queue"
      rationale:
        - "零外部依赖"
        - "WAL 支持并发读写"
        - "单进程 ≤ 10 并发够用"
      install: "Python 标准库 + aiosqlite"
    alternatives:
      - {name: "Redis Streams", why_not: "需外部 Redis 进程"}
      - {name: "PostgreSQL LISTEN/NOTIFY", why_not: "PG 体积大，个人量化过重"}
    not_recommended:
      - {name: "文件系统文件锁轮询", reason: "延迟高、不支持优先级"}
    upgrade_trigger:
      - "并发 RUNNING 任务 > 20"
      - "需要跨主机任务分发"
      - "任务优先级策略复杂化"
    upgrade_to: "NATS JetStream（beta+）"

  # ---------------------------------------------------------------------- #8
  - id: TECH-08
    category: "Agent Orchestrator - 状态机实现"
    purpose: "TaskState 的转移验证与审计"
    primary:
      choice: "Python Enum + ALLOWED_TRANSITIONS 字典 + 审计日志"
      rationale:
        - "纯 Python，可测试性强"
        - "配合 Pydantic 输出 audit-trail"
      install: "Python 标准库"
    alternatives:
      - {name: "transitions 库", why_not: "额外依赖，收益不大"}
      - {name: "XState（JS）", why_not: "非 Python"}
    not_recommended:
      - {name: "无显式状态机，靠 if/else", reason: "不可审计，易漏转移"}
    upgrade_trigger: "永不升级（标准库方案已足够）"

  # ---------------------------------------------------------------------- #9
  - id: TECH-09
    category: "Agent Orchestrator - 幻觉检测"
    purpose: "识别 Agent 循环/卡死/捏造"
    primary:
      choice: "规则集（loop_same_observation / no_progress_timeout / repeated_same_file_edit / tool_repeat_without_result）"
      rationale:
        - "experimental 起步，覆盖 80% 常见幻觉"
        - "零 LLM 成本"
    alternatives:
      - {name: "LLM-as-Judge 二阶判定", why_not: "beta+ 补充，成本/延迟高"}
    not_recommended:
      - {name: "无检测依赖 Agent 自报", reason: "Agent 自我评估不可靠"}
    upgrade_trigger:
      - "幻觉漏检率 > 10%（需人工标注评估集）"
      - "误报率 > 5%"
    upgrade_to: "规则集 + LLM-as-Judge 二阶"

  # ---------------------------------------------------------------------- #10
  - id: TECH-10
    category: "Agent Orchestrator - 进程内并发原语"
    purpose: "单进程内任务锁、状态保护"
    primary:
      choice: "asyncio.Lock + asyncio.Semaphore"
      rationale:
        - "原生 async 框架"
        - "无跨进程开销"
    alternatives:
      - {name: "threading.Lock", why_not: "会阻塞事件循环"}
    not_recommended:
      - {name: "无锁乐观并发", reason: "状态机转移必须原子"}
    upgrade_trigger: "跨进程场景（beta+）"
    upgrade_to: "filelock + Redis SETNX"

  # ---------------------------------------------------------------------- #11
  - id: TECH-11
    category: "Agent Orchestrator - 跨进程锁"
    purpose: "VMS / Orc 的文件锁保护（多进程场景）"
    primary:
      choice: "filelock 库（filesystem-based）"
      version: "3.12+"
      rationale:
        - "跨平台（Windows / macOS / Linux）"
        - "零外部依赖"
      install: "pip install filelock>=3.12"
    alternatives:
      - {name: "fcntl（Unix-only）", why_not: "不支持 Windows"}
      - {name: "portalocker", why_not: "filelock 更简洁"}
    not_recommended:
      - {name: "自己实现文件存在性检查", reason: "有 race condition"}
    upgrade_trigger: "beta+ 服务化后不再需要"
    upgrade_to: "Redis SETNX"

agent_sandbox:
  # ---------------------------------------------------------------------- #12
  - id: TECH-12
    category: "Agent Sandbox - 执行隔离"
    purpose: "限制 Agent 的文件读写、命令执行范围"
    primary:
      choice: "Windows ACL + 只读挂载（2）"
      rationale:
        - "Windows 原生机制，零额外依赖"
        - "配合 allowed_commands 白名单"
        - "个人量化单机场景够用"
      implementation: "icacls + junction point + Python subprocess 白名单"
    alternatives:
      - {name: "Docker Desktop", why_not: "beta+ 升级候选，experimental 过重"}
      - {name: "WSL2 独立用户", why_not: "跨 Win/Mac 一致性差"}
    not_recommended:
      - {name: "PowerShell 全权限运行", reason: "违反最小权限"}
      - {name: "Agent 直接调 subprocess 无约束", reason: "C 类红线，必须沙箱"}
    upgrade_trigger:
      - "需要网络隔离"
      - "需要资源配额（CPU/内存/磁盘）"
      - "多租户场景"
    upgrade_to: "Docker Desktop / Podman（beta+）"

feedback_loop:
  # ---------------------------------------------------------------------- #13
  - id: TECH-13
    category: "Feedback Loop - 时间序列存储"
    purpose: "指标采样、历史追溯、趋势分析"
    primary:
      choice: "SQLite + 时间索引表"
      rationale:
        - "零依赖"
        - "2 数据量（≤ 100k 条/天）完全够用"
        - "备份/迁移简单"
    alternatives:
      - {name: "InfluxDB", why_not: "stable+ 升级候选"}
      - {name: "Prometheus + Grafana", why_not: "pull 模型不适合个人量化"}
    not_recommended:
      - {name: "CSV 文件追加", reason: "查询/聚合效率差"}
    upgrade_trigger:
      - "数据量 > 1M 条/天"
      - "需要多维度聚合查询"
    upgrade_to: "InfluxDB 2.x（stable+）"

  # ---------------------------------------------------------------------- #14
  - id: TECH-14
    category: "Feedback Loop - 异常检测"
    purpose: "识别指标异常"
    primary:
      choice: "指数移动平均（EMA）+ 阈值 + 持续时间"
      rationale:
        - "experimental 起步够用"
        - "零 LLM 成本"
        - "可解释性强（运维可直接读阈值）"
    alternatives:
      - {name: "Prophet / ARIMA", why_not: "stable 升级"}
      - {name: "Isolation Forest", why_not: "适合多维异常检测，experimental 过重"}
    not_recommended:
      - {name: "固定阈值无 EMA", reason: "对指标波动不鲁棒"}
    upgrade_trigger:
      - "误报率 > 10%"
      - "新增非线性指标"
    upgrade_to: "Prophet（时间序列预测）+ 异常检测组合"

llm_security_gateway:
  # ---------------------------------------------------------------------- #15
  - id: TECH-15
    category: "LLM Security Gateway - Schema 校验"
    purpose: "工具调用参数强约束"
    primary:
      choice: "Pydantic v2 + extra='forbid' + Literal/Enum"
      version: "2.x"
      rationale:
        - "Python 生态标准"
        - "运行时 + 类型提示双重约束"
        - "JSON Schema 导出便利（给 MCP 客户端）"
      install: "pip install pydantic>=2.5"
    alternatives:
      - {name: "jsonschema 裸库", why_not: "类型推导弱"}
      - {name: "attrs + cattrs", why_not: "Pydantic 生态更广"}
    not_recommended:
      - {name: "无 schema 校验直接传参", reason: "L3 层核心防护，不可裸奔"}
      - {name: "允许 extra='allow'", reason: "绕过核心防护，严禁"}
    upgrade_trigger: "永不升级（Pydantic v2 已是业界标准）"

  # ---------------------------------------------------------------------- #16
  - id: TECH-16
    category: "LLM Security Gateway - Prompt Injection 检测"
    purpose: "L1 输入分类（TRUSTED/UNTRUSTED/HOSTILE）"
    primary:
      choice: "正则 Pattern 库 + 规则集（2）"
      rationale:
        - "可审计、可解释"
        - "快速响应（延迟 < 50ms）"
        - "OWASP LLM Top 10 已整理主要 pattern"
    alternatives:
      - {name: "LLM-as-Judge 二阶检测", why_not: "beta+ 考虑，延迟高"}
      - {name: "prompt-guard 模型（Meta）", why_not: "英文为主，中文弱"}
    not_recommended:
      - {name: "无检测全量放行", reason: "违反 fail-closed 原则"}
    upgrade_trigger:
      - "红队评估绕过率 > 5%（≥ 150 条语料库）"
      - "新型攻击模式（如 encoding smuggle）"
    upgrade_to: "Pattern + LLM-as-Judge + 专用分类模型 三级"

  # ---------------------------------------------------------------------- #17
  - id: TECH-17
    category: "LLM Security Gateway - Secret 扫描"
    purpose: "Agent 输出中的敏感信息（API Key / Token / 身份证 / 私钥）检测"
    primary:
      choice: "git-secrets 规则集 + trufflehog 正则集"
      rationale:
        - "业界验证的 pattern 库"
        - "低误报（pre-commit 级别经验）"
    alternatives:
      - {name: "detect-secrets（Yelp）", why_not: "可叠加使用，作为补充"}
    not_recommended:
      - {name: "自己维护 regex", reason: "容易漏，维护成本高"}
    upgrade_trigger: "误报率 > 5% 或漏检案例出现"
    upgrade_to: "自建规则集 + 商用 DLP"

