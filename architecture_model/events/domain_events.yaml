# module_id: MOD-GOVERNANCE
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: permanent
# --- 治理锚定结束 ---
module_id: MOD-GOVERNANCE
schema_version: "2.0"
implementation_status: declared_only
implementation_note: >
  本文件是领域事件设计清单（declared model），描述目标事件结构。
  8/25 事件 payload_contract 为 null（设计缺口，experimental 填充时补齐）。
  当前运行时：单进程架构，事件通过进程内回调分发（非消息总线）。
  2026-07-05 审计 AI-02 标记：避免将本文件误读为已全部实现的事件清单。

partition:
  id: cross-cutting-events
  name: "Domain Events / 领域事件清单"
  type: cross-cutting
  description: >
    领域事件 SSoT（设计清单）。25 条核心事件，分 7 域（Research 3 / Backtest 3 / Signal 3 / Portfolio 2 /
    Execution 7 / Risk 4 / Ops 3）+ 2 条量化红线补充事件。
    当前运行时：单进程架构，事件通过进程内回调分发（非消息总线）。
    来源：domain-event-catalog.md v1.0.0 迁移。
  source_views:
    - 03-application_architecture.md
  related_kb_refs:
    - KBG-0009

# =============================================================================
# 命名规范与频率分档
# =============================================================================
naming_convention:
  pattern: "{Noun}{PastTenseVerb}"
  rules:
    - "过去时动词（OrderSubmitted，不是 SubmitOrder）"
    - "名词在前 + 动词在后（PositionLimitBreached，不是 BreachPositionLimit）"
    - "不含技术动词（FillReceived，不是 FillInsertedToDB）"
    - "仅登记已发生事实（OrderRejected，不是 OrderShouldBeRejected）"
  examples: [OrderSubmitted, FactorResearched, RiskLimitBreached, FillReceived]

message_bus:
  current: null
  description: "单进程架构，事件通过进程内同步/异步回调分发"
  upgrade_triggers:
    - {condition: "多个独立运行进程", solution: "beta 引入轻量 Pub/Sub（首选 Redis Streams 或 NATS）"}
    - {condition: "跨机房容灾需要事件持久化", solution: "beta 引入 Kafka（对齐 DR/BCP §8.3）"}

frequency_levels:
  L1:
    name: "低频 / Low Frequency"
    typical_rate: "每周/每月 < 10 次"
    scenario: "FactorResearched / ModelValidated / PortfolioRebalanced（战略级）"
    observability: "可人工审核"
  L2:
    name: "中频 / Medium Frequency"
    typical_rate: "每交易日 10-100 次"
    scenario: "SignalGenerated / OrderSubmitted / FillReceived（日间批/小时批）"
    observability: "需结构化日志 + dashboard"
  L3:
    name: "高频 / High Frequency"
    typical_rate: "每分钟 1-10 次"
    scenario: "SignalRevoked / OrderAccepted / PositionLimitBreached（intraday 批）"
    observability: "需 metric 采样（非全量 ingest）"
  L4:
    name: "突发 / Burst"
    typical_rate: "取决于触发条件（可能 0，可能 Burst）"
    scenario: "RiskLimitBreached / DataIngestionFailed / SystemDegraded"
    observability: "每条必 alert + 留痕"

# =============================================================================
# 22 条领域事件
# =============================================================================
events:
  # ─── Research 域（3 条）───
  - id: E-RS-01
    name: "FactorResearched / 因子研究完成"
    domain: research
    frequency: L1
    publisher: l09
    publisher_module: "sandbox.factor_runner"
    subscribers: [l02, l08, l07]
    subscriber_details:
      - {layer: l02, action: "Factor Registry 登记"}
      - {layer: l08, action: "飞书通知「新因子入库」"}
      - {layer: l07, action: "归因归档"}
    aggregate_root: AGG-005
    payload_contract: CTR-002
    description: "某个候选 Factor 完成研究流程（代码 + 文档 + 样本外验证齐全），被登记到 Factor Registry。不等同于「投产」。"
    payload_fields:
      - {name: factor_id, type: "UUID v7"}
      - {name: factor_name, type: str}
      - {name: formula_ref, type: str, ref: "entity:E08"}
      - {name: frequency, type: str}
      - {name: asof_offset, type: str}
      - {name: lineage_root, type: str}
      - {name: research_owner, type: str}
      - {name: sandbox_run_id, type: str}
      - {name: sample_outside_metrics, type: "{ic, sharpe, turnover}"}
    causal_precondition: "L09 回测成功完成 + 人工 code review 通过"
    causal_successor: "可能触发 E-RS-03 ModelValidated"
    audit_level: medium
    retention: "≥7 年"

  - id: E-RS-02
    name: "BacktestCompleted / 回测完成"
    domain: research
    frequency: L1
    publisher: l09
    publisher_module: "backtest_runner"
    subscribers: [l07, l05, l08]
    subscriber_details:
      - {layer: l07, action: "归因归档"}
      - {layer: l05, action: "候选策略池更新（若指标达标）"}
      - {layer: l08, action: "通知研究员"}
    aggregate_root: AGG-004
    payload_contract: null  # 2026-05-03 审计：原 CTR-002（FactorSignal）与 BacktestCompleted 的 payload_fields 语义不匹配，待创建专用契约 CTR-P1-014 BacktestResult
    description: "L09 沙盒完成一次回测运行，产出指标包已落盘。研究流程里程碑，不直接影响生产。"
    payload_fields:
      - {name: backtest_run_id, type: str}
      - {name: strategy_id, type: str}
      - {name: factor_set, type: "List[str]"}
      - {name: period, type: "{start, end}"}
      - {name: config_hash, type: str}
      - {name: metrics, type: "{sharpe, max_drawdown, calmar, ic_mean, ic_ir, turnover, hit_rate}"}
      - {name: equity_curve_ref, type: str}
      - {name: trades_ref, type: str}
      - {name: lineage_root, type: str}
    causal_precondition: "策略代码提交 + 参数配置锁定 + 数据集 PIT 快照就绪"
    causal_successor: "可能触发 E-PF-01（若回测结果被采纳为生产策略新版本）"
    audit_level: medium

  - id: E-BT-01
    name: "BacktestCompleted / 回测完成"
    domain: backtest
    frequency: L1
    publisher: l_backtest
    publisher_module: "backtest_runner"
    subscribers: [l05, l04, l07]
    subscriber_details:
      - {layer: l05, action: "候选策略池更新(若指标达标)"}
      - {layer: l04, action: "风险预算校准(使用max_drawdown)"}
      - {layer: l07, action: "归因归档"}
    aggregate_root: AGG-004
    payload_contract: CTR-P1-016
    description: "D_BACKTEST域完成一次回测运行,产出BacktestResult(CTR-P1-016)已落盘。替代E-RS-02的回测部分,契约已注册。"
    payload_fields:
      - {name: backtest_run_id, type: str}
      - {name: strategy_id, type: str}
      - {name: factor_set, type: "List[str]"}
      - {name: period, type: "{start, end}"}
      - {name: config_hash, type: str}
      - {name: metrics, type: "{sharpe, max_drawdown, calmar, ic_mean, ic_ir, turnover, hit_rate}"}
      - {name: equity_curve_ref, type: str}
      - {name: trades_ref, type: str}
      - {name: lineage_root, type: str}
    causal_precondition: "策略代码提交 + 参数配置锁定 + 数据集 PIT 快照就绪"
    causal_successor: "可能触发 E-BT-02 BacktestPassed(若指标达标)或 E-BT-03 OverfittingDetected(若检测到过拟合)"
    audit_level: medium
    retention: "≥7 年"

  - id: E-BT-02
    name: "BacktestPassed / 回测通过门禁"
    domain: backtest
    frequency: L1
    publisher: l_backtest
    publisher_module: "backtest_gate"
    subscribers: [l05, l08]
    subscriber_details:
      - {layer: l05, action: "策略纳入生产候选池,触发E-PF-01组合构建"}
      - {layer: l08, action: "通知团队策略通过验证"}
    aggregate_root: AGG-004
    payload_contract: CTR-P1-016
    description: "回测结果通过门禁检查(sharpe>阈值 且 max_drawdown<阈值 且 overfitting_flag=False)。触发组合构建流程。"
    payload_fields:
      - {name: backtest_run_id, type: str}
      - {name: strategy_id, type: str}
      - {name: gate_result, type: "{passed: bool, checks: List[{name, passed, value, threshold}]}"}
      - {name: metrics_summary, type: "{sharpe, max_drawdown, annual_return}"}
    causal_precondition: "E-BT-01 BacktestCompleted 已发布 + 门禁检查全部通过"
    causal_successor: "触发 E-PF-01 组合构建(若策略被采纳为生产策略新版本)"
    audit_level: high
    retention: "≥7 年"

  - id: E-BT-03
    name: "OverfittingDetected / 过拟合检测"
    domain: backtest
    frequency: L1
    publisher: l_backtest
    publisher_module: "overfitting_detector"
    subscribers: [l02, l08]
    subscriber_details:
      - {layer: l02, action: "触发因子衰减标记,降低该因子权重"}
      - {layer: l08, action: "通知研究员过拟合警告"}
    aggregate_root: AGG-004
    payload_contract: CTR-P1-016
    description: "回测过拟合检测器发现策略存在过拟合(样本内外绩效差异过大 或 White's Test未通过)。触发因子衰减机制。"
    payload_fields:
      - {name: backtest_run_id, type: str}
      - {name: strategy_id, type: str}
      - {name: detection_method, type: str, description: "in_out_gap | whites_test | walk_forward"}
      - {name: in_sample_sharpe, type: float}
      - {name: out_sample_sharpe, type: float}
      - {name: degradation_ratio, type: float, description: "in/out差异比"}
      - {name: affected_factors, type: "List[str]"}
    causal_precondition: "E-BT-01 BacktestCompleted 已发布 + 过拟合检测器运行完成"
    causal_successor: "触发 L02 因子衰减(降低affected_factors权重)"
    audit_level: high
    retention: "≥7 年"

  - id: E-RS-03
    name: "ModelValidated / 模型验证通过"
    domain: research
    frequency: L1
    publisher: l11
    publisher_module: "model_validator"
    subscribers: [l11, l05, l08, l07]
    subscriber_details:
      - {layer: l11, action: "Model Registry 登记 active"}
      - {layer: l05, action: "策略可引用"}
      - {layer: l08, action: "通知团队"}
      - {layer: l07, action: "归因档案"}
    aggregate_root: AGG-008
    payload_contract: null
    description: "某 ML 模型完成离线验证 + 人工审核，获准进入 L11 Model Registry（状态 = active）。"
    payload_fields:
      - {name: model_id, type: "UUID v7"}
      - {name: model_version, type: str}
      - {name: training_run_id, type: str}
      - {name: validation_metrics, type: "Dict"}
      - {name: baseline_comparison, type: "Dict"}
      - {name: approver_id, type: str}
      - {name: approval_ts, type: datetime}
      - {name: rollback_model_version, type: str}
    causal_precondition: "训练完成 + 离线指标达标 + 人工审批通过"
    causal_successor: "后续可能触发 E-OP-02 ModelDriftDetected"
    audit_level: high
    retention: "永久保留"

  # ─── Signal 域（3 条）───
  - id: E-SG-01
    name: "SignalGenerated / 信号生成"
    domain: signal
    frequency: L2
    publisher: l03
    publisher_module: "signal_generation"
    subscribers: [l04, l05, l12]
    subscriber_details:
      - {layer: l04, action: "风控校验"}
      - {layer: l05, action: "组合构建输入"}
      - {layer: l12, action: "审计日志落盘"}
    aggregate_root: AGG-006
    payload_contract: CTR-002
    description: "L03 某 Strategy 在某 asof_ts 基于 FactorSignal 产出一条明确的交易意图信号。下游执行链路的起点。"
    payload_fields:
      - {name: signal_id, type: "UUID v7"}
      - {name: strategy_id, type: str}
      - {name: asof_ts, type: "UTC ns (PIT)"}
      - {name: instrument_id, type: str}
      - {name: side, type: str}
      - {name: magnitude, type: "float (0-1)"}
      - {name: lineage_root, type: str}
      - {name: schema_version, type: str}
    causal_precondition: "L02 FactorValue 可用（PIT 合格）+ L04 Risk 未对策略整体熔断"
    causal_successor: "触发 E-PF-01 或 E-EX-01"
    audit_level: high
    retention: "永久保留"

  - id: E-SG-02
    name: "SignalRevoked / 信号撤销"
    domain: signal
    frequency: L3
    publisher: l03
    publisher_module: "strategy (主动撤销) / l04 risk (熔断触发)"
    subscribers: [l05, l12]
    subscriber_details:
      - {layer: l05, action: "清理 pending signal 队列"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-006
    payload_contract: null
    description: "某条已发出的 Signal 在未完成转化为订单前被策略主动撤销。已提交的订单不受影响。"
    payload_fields:
      - {name: signal_id, type: str}
      - {name: revoke_reason, type: "enum: FACTOR_FLIP / STRATEGY_STOP / RISK_OVERRIDE / MANUAL"}
      - {name: revoke_ts, type: datetime}
      - {name: original_signal_ts, type: datetime}
      - {name: operator_id, type: "Optional[str]"}
    causal_precondition: "SignalGenerated 已发出但未转化为 OrderSubmitted"
    causal_successor: "无（终止事件）"
    audit_level: medium
    retention: "≥1 年"

  - id: E-SG-03
    name: "SignalExpired / 信号过期"
    domain: signal
    frequency: L3
    publisher: l05
    publisher_module: "signal_ttl_watcher"
    subscribers: [l12, l07]
    subscriber_details:
      - {layer: l12, action: "审计日志"}
      - {layer: l07, action: "策略质量分析（过期率是策略健康度指标）"}
    aggregate_root: AGG-006
    payload_contract: null
    description: "某条 Signal 在策略定义的 TTL 内未被消费，系统自动标记过期。"
    payload_fields:
      - {name: signal_id, type: str}
      - {name: generated_ts, type: datetime}
      - {name: ttl_seconds, type: int}
      - {name: expiry_ts, type: datetime}
      - {name: reason, type: "TTL_EXPIRED"}
    causal_precondition: "Signal 存在 + TTL 配置 + 未被消费"
    causal_successor: "无"
    audit_level: medium

  # ─── Portfolio 域（2 条）───
  - id: E-PF-01
    name: "PortfolioRebalanced / 组合再平衡"
    domain: portfolio
    frequency: L1
    publisher: l05
    publisher_module: "rebalancing"
    subscribers: [l06, l07, l08, l12]
    subscriber_details:
      - {layer: l06, action: "批量下单接口"}
      - {layer: l07, action: "归因起算点更新"}
      - {layer: l08, action: "通知运营"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-003
    payload_contract: CTR-003
    description: "L05 组合构建层完成一轮再平衡决策，产出目标持仓 + 下单计划。战略级里程碑事件。"
    payload_fields:
      - {name: rebalance_id, type: "UUID v7"}
      - {name: portfolio_id, type: str}
      - {name: trigger_source, type: "enum: SCHEDULED / SIGNAL_DEVIATION / MANUAL / RISK_OVERRIDE"}
      - {name: target_positions, type: "List[{instrument_id, target_weight}]"}
      - {name: orders_planned, type: "List[order_id]"}
      - {name: decision_ts, type: datetime}
      - {name: lineage_root, type: str}
    causal_precondition: "L03 SignalGenerated 齐备 + L04 RiskLimits 就位 + L05 Optimizer 收敛"
    causal_successor: "批量触发 E-EX-01（每笔下单独立 Idempotency Key）"
    audit_level: high
    retention: "永久保留"

  - id: E-PF-02
    name: "PositionLimitBreached / 持仓超限"
    domain: portfolio
    frequency: L4
    publisher: l04
    publisher_module: "position_limit_checker"
    subscribers: [l08, l05, l12]
    subscriber_details:
      - {layer: l08, action: "紧急告警"}
      - {layer: l05, action: "下一轮再平衡时约束收紧"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-002
    payload_contract: null
    description: "某持仓超出预设上限。可能由市场价格波动导致被动超限（非下单超限）。"
    payload_fields:
      - {name: breach_id, type: "UUID v7"}
      - {name: portfolio_id, type: str}
      - {name: limit_type, type: "enum: SINGLE_INSTRUMENT / SECTOR / FACTOR_EXPOSURE / GROSS_NOTIONAL"}
      - {name: limit_value, type: float}
      - {name: actual_value, type: float}
      - {name: breach_ts, type: datetime}
      - {name: breach_pct, type: float}
      - {name: suggested_action, type: str}
    causal_precondition: "Position 变动 + Risk Policy 已配置"
    causal_successor: "可能触发 E-RK-01 或手工减仓"
    audit_level: high

  # ─── Execution 域（7 条）───
  - id: E-EX-01
    name: "OrderSubmitted / 订单提交"
    domain: execution
    frequency: L2
    publisher: l06
    publisher_module: "order_service.submit()"
    subscribers: [l06, l12, l04, l07]
    subscriber_details:
      - {layer: l06, action: "SOR 路由到 broker"}
      - {layer: l12, action: "审计日志"}
      - {layer: l04, action: "持仓预占"}
      - {layer: l07, action: "归因（开仓/平仓标记）"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    idempotency_key: "order_id + strategy_id + SHA256"
    red_line_ref: H10
    description: "L06 OMS 接收到一笔订单并通过 Idempotency Guard 去重 + Pre-Trade 风控 + 写入审计日志。先于 broker 返回 ack。"
    payload_fields:
      - {name: order_id, type: "UUID v7"}
      - {name: client_order_id, type: "IdempotencyKey 128-bit prefix"}
      - {name: strategy_id, type: str}
      - {name: signal_id, type: str}
      - {name: instrument_id, type: str}
      - {name: side, type: str}
      - {name: quantity, type: Decimal}
      - {name: order_type, type: "LIMIT/MARKET"}
      - {name: limit_price, type: "Optional[Decimal]"}
      - {name: submitted_ts, type: datetime}
      - {name: schema_version, type: str}
    causal_precondition: "SignalGenerated 或 PortfolioRebalanced + Idempotency Guard 首次通过 + Pre-Trade 通过"
    causal_successor: "E-EX-02 OrderAccepted 或 E-EX-03 OrderRejected"
    audit_level: high
    retention: "永久保留 + journal append-only"

  - id: E-EX-02
    name: "OrderAccepted / 订单接受"
    domain: execution
    frequency: L2
    publisher: l06
    publisher_module: "broker_adapter._on_broker_ack()"
    subscribers: [l06, l12]
    subscriber_details:
      - {layer: l06, action: "OMS 状态机：PENDING → NEW → ROUTED"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    description: "Broker 接受订单（返回 broker_ref_id / FIX NewOrderAck）。"
    payload_fields:
      - {name: order_id, type: str}
      - {name: client_order_id, type: str}
      - {name: broker_ref_id, type: str}
      - {name: accepted_ts, type: datetime}
      - {name: broker_id, type: str}
    causal_precondition: "OrderSubmitted 已发出 + broker API 连通"
    causal_successor: "等待 E-EX-04 / E-EX-05 / E-EX-06"
    audit_level: high

  - id: E-EX-03
    name: "OrderRejected / 订单拒绝"
    domain: execution
    frequency: L3
    publisher: l06
    publisher_module: "broker_adapter._on_broker_reject()"
    subscribers: [l06, l08, l05, l12]
    subscriber_details:
      - {layer: l06, action: "OMS 状态机：ROUTED → REJECTED"}
      - {layer: l08, action: "告警"}
      - {layer: l05, action: "策略重试决策"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    description: "Broker 拒绝订单。原因：broker 侧去重命中 / 价格超限 / 余额不足 / 标的不可交易。"
    payload_fields:
      - {name: order_id, type: str}
      - {name: client_order_id, type: str}
      - {name: reject_code, type: "enum: DUPLICATE_CLIENT_ORDER_ID / PRICE_OUT_OF_BOUND / INSUFFICIENT_BALANCE / INSTRUMENT_HALTED / UNKNOWN"}
      - {name: reject_reason_text, type: str}
      - {name: broker_id, type: str}
      - {name: rejected_ts, type: datetime}
      - {name: broker_ref_id, type: "Optional[str]"}
    causal_precondition: "OrderSubmitted 已发出"
    causal_successor: "可能触发 E-SG-02 SignalRevoked"
    audit_level: high

  - id: E-EX-04
    name: "FillReceived / 成交回报"
    domain: execution
    frequency: L2
    publisher: l06
    publisher_module: "broker_adapter._on_fill_event() → Fill Handler"
    subscribers: [l07, l04, l05, l12]
    subscriber_details:
      - {layer: l07, action: "PnL 计算"}
      - {layer: l04, action: "Risk Monitor 重算"}
      - {layer: l05, action: "Strategy.on_fill() 回调"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-001
    payload_contract: CTR-005
    description: "收到 broker 成交回报（部分成交 PARTIAL 或完全成交 FILLED）。下游 PnL / Position / Risk 更新的起点。"
    payload_fields:
      - {name: fill_id, type: str}
      - {name: order_id, type: str}
      - {name: filled_quantity, type: Decimal}
      - {name: fill_price, type: Decimal}
      - {name: fill_timestamp, type: datetime}
      - {name: commission, type: Decimal}
      - {name: slippage, type: "Optional[Decimal]"}
      - {name: broker_fill_id, type: str}
      - {name: schema_version, type: str}
    causal_precondition: "OrderAccepted 后 broker 撮合成功"
    causal_successor: "PositionSnapshot 更新 + PnL 增量计算 + 可能触发 E-PF-02"
    audit_level: high
    retention: "永久保留（合规铁律，RPO=0）"

  - id: E-EX-05
    name: "OrderCancelled / 订单取消"
    domain: execution
    frequency: L3
    publisher: l06
    publisher_module: "cancel_service / broker_adapter"
    subscribers: [l06, l04, l12]
    subscriber_details:
      - {layer: l06, action: "OMS 状态机 → CANCELLED"}
      - {layer: l04, action: "预占释放"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    description: "已提交的订单被显式取消（策略主动 / 人工 / broker 撤单）。"
    payload_fields:
      - {name: order_id, type: str}
      - {name: client_order_id, type: str}
      - {name: cancel_source, type: "enum: STRATEGY / MANUAL / BROKER_SIDE"}
      - {name: cancel_reason, type: str}
      - {name: cancel_ts, type: datetime}
      - {name: broker_ref_id, type: str}
      - {name: unfilled_quantity, type: Decimal}
    causal_precondition: "订单已提交且未完全成交"
    causal_successor: "可能触发 E-EX-01（替代单，必须用新 Idempotency Key）"
    audit_level: high

  - id: E-EX-06
    name: "OrderExpired / 订单过期"
    domain: execution
    frequency: L3
    publisher: l06
    publisher_module: "broker_adapter / OMS 定时扫描"
    subscribers: [l06, l04, l12]
    subscriber_details:
      - {layer: l06, action: "OMS 状态机 → EXPIRED"}
      - {layer: l04, action: "预占释放"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    description: "订单到期（DAY 单收盘后 / GTD 单到期日后）自动失效。"
    payload_fields:
      - {name: order_id, type: str}
      - {name: client_order_id, type: str}
      - {name: expire_ts, type: datetime}
      - {name: original_tif, type: "enum: DAY / GTD / IOC / FOK"}
      - {name: unfilled_quantity, type: Decimal}
    causal_precondition: "订单存在 + TIF 设置 + 到期时间到达"
    causal_successor: "可能触发 E-EX-01（若策略要续订）"
    audit_level: medium

  - id: E-EX-07
    name: "OrderIdempotencyBlocked / 幂等拦截"
    domain: execution
    frequency: L4
    publisher: l06
    publisher_module: "idempotency.guard"
    subscribers: [l12, l08]
    subscriber_details:
      - {layer: l12, action: "审计日志（必须留痕，对账关键）"}
      - {layer: l08, action: "metric 上报（dashboard 可见幂等生效频率）"}
    aggregate_root: AGG-001
    payload_contract: CTR-004
    red_line_ref: H10
    description: "Idempotency Guard 检测到同一 business signal 重复提交，拒绝第二次提交到 broker。H10 幂等机制正常工作的标志。"
    payload_fields:
      - {name: block_id, type: str}
      - {name: client_order_id_hash_prefix, type: "str (脱敏)"}
      - {name: duplicate_count, type: int}
      - {name: original_order_id, type: str}
      - {name: detection_source, type: "enum: REDIS_SETNX / JOURNAL_LOOKUP / BROKER_DEDUP_REJECT"}
      - {name: blocked_ts, type: datetime}
      - {name: degradation_flag, type: bool}
    causal_precondition: "同 signal 已有 Key 在 Idempotency 层 + 重复提交触发"
    causal_successor: "无（拦截即终止；metric 异常升高触发 SLO alert）"
    audit_level: high
    retention: "永久保留 + append-only"

  # ─── Risk 域（4 条）───
  - id: E-RK-01
    name: "RiskLimitBreached / 风险限额突破"
    domain: risk
    frequency: L4
    publisher: l04
    publisher_module: "risk_limit_checker"
    subscribers: [l08, l05, l06, l12]
    subscriber_details:
      - {layer: l08, action: "紧急告警"}
      - {layer: l05, action: "新单拦截（下一轮优化器强制约束）"}
      - {layer: l06, action: "Pre-Trade 升级保守档位"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-007
    payload_contract: CTR-003
    description: "组合级风险指标超过策略定义的上限。比 E-PF-02 层级更高（Portfolio 级 vs 单持仓级）。"
    payload_fields:
      - {name: breach_id, type: str}
      - {name: portfolio_id, type: str}
      - {name: metric_name, type: "enum: VAR_95 / VAR_99 / GROSS_NOTIONAL / SECTOR_EXPOSURE / FACTOR_EXPOSURE / LEVERAGE"}
      - {name: limit_value, type: float}
      - {name: actual_value, type: float}
      - {name: breach_ts, type: datetime}
      - {name: breach_severity, type: "enum: WARNING / CRITICAL / EMERGENCY"}
    causal_precondition: "Position 变动 + Risk Policy 已配置 + 监控周期触发"
    causal_successor: "可能触发 E-RK-02 或 E-RK-03"
    audit_level: high

  - id: E-RK-02
    name: "MarginCalled / 追加保证金"
    domain: risk
    frequency: L4
    publisher: l06
    publisher_module: "broker_adapter (broker 发起) / l04 risk (本地预估)"
    subscribers: [l08, l05, l12]
    subscriber_details:
      - {layer: l08, action: "紧急告警（飞书 + 短信 + 电话）"}
      - {layer: l05, action: "紧急减仓路径"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-002
    payload_contract: null
    description: "账户保证金不足，broker 发起 margin call。紧急事件——若不在指定时间内补足保证金，broker 会强制平仓。"
    payload_fields:
      - {name: margin_call_id, type: str}
      - {name: account_id, type: str}
      - {name: current_margin, type: Decimal}
      - {name: required_margin, type: Decimal}
      - {name: shortfall, type: Decimal}
      - {name: grace_period_end_ts, type: datetime}
      - {name: broker_message, type: str}
      - {name: severity, type: "EMERGENCY"}
    causal_precondition: "账户保证金 < 要求值"
    causal_successor: "强制平仓（触发 E-EX-05 OrderCancelled + E-EX-01 OrderSubmitted 紧急减仓单）"
    audit_level: high
    retention: "永久保留 + 必须有应急响应记录"

  - id: E-RK-03
    name: "DrawdownAlerted / 回撤告警"
    domain: risk
    frequency: L4
    publisher: l04
    publisher_module: "drawdown_tracker"
    subscribers: [l08, l07, l12]
    subscriber_details:
      - {layer: l08, action: "告警"}
      - {layer: l07, action: "归因深度分析"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-003
    payload_contract: null
    description: "组合（或单策略）累计回撤超过预设阈值（5% / 10% / 20% 分档告警）。触发人工复核流程。"
    payload_fields:
      - {name: drawdown_id, type: str}
      - {name: portfolio_id, type: "Optional[str]"}
      - {name: strategy_id, type: "Optional[str]"}
      - {name: current_drawdown_pct, type: float}
      - {name: threshold_pct, type: float}
      - {name: peak_equity, type: Decimal}
      - {name: current_equity, type: Decimal}
      - {name: lookback_window_days, type: int}
      - {name: severity, type: str}
    causal_precondition: "净值曲线监控到回撤 + 阈值配置"
    causal_successor: "人工复核决定是否触发 E-SG-02 + 策略停机"
    audit_level: high

  - id: E-RK-04
    name: "PreTradeRejected / 盘前风控拒单"
    domain: risk
    frequency: L4
    publisher: l06
    publisher_module: "pre_trade.runner"
    subscribers: [l06, l08, l05, l12]
    subscriber_details:
      - {layer: l06, action: "订单直接拒绝不进入提交链"}
      - {layer: l08, action: "告警（若拒绝率异常）"}
      - {layer: l05, action: "策略重试决策"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-007
    payload_contract: null
    red_line_ref: H9
    description: "Pre-Trade 风控检查器拒绝一笔待提交订单。Fail-Closed 铁律生效：检查超时/异常/规则命中均拒单，绝不默认放行。"
    payload_fields:
      - {name: rejection_id, type: str}
      - {name: candidate_order_id, type: str}
      - {name: strategy_id, type: str}
      - {name: rejection_category, type: "enum: POSITION_LIMIT / COMPLIANCE_RULE / CHECKER_TIMEOUT / CHECKER_ERROR / BLACKLIST / MARGIN_INSUFFICIENT"}
      - {name: checker_name, type: str}
      - {name: rejection_reason, type: str}
      - {name: rejected_ts, type: datetime}
    causal_precondition: "订单候选进入 Pre-Trade"
    causal_successor: "该 order 永不进入 OrderSubmitted；策略决定是否重试"
    audit_level: high
    retention: "永久保留（合规铁律）"

  # ─── Ops 域（3 条）───
  - id: E-OP-01
    name: "DataIngestionFailed / 数据接入失败"
    domain: ops
    frequency: L4
    publisher: l00
    publisher_module: "VendorRegistry.resolve() / connector facade"
    subscribers: [l08, l02, l04, l12]
    subscriber_details:
      - {layer: l08, action: "告警（按 severity 分级）"}
      - {layer: l02, action: "Factor 打 data_quality_caveat"}
      - {layer: l04, action: "Risk 保守档位"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: null
    payload_contract: null
    description: "L00 某 Vendor 的数据接入失败。不等同于数据可用性 0——fallback 未耗尽时 L02 仍有数据。"
    payload_fields:
      - {name: failure_id, type: str}
      - {name: vendor_id, type: str}
      - {name: data_source_type, type: "enum: L1_QUOTE / L2_DEPTH / FUNDAMENTAL / CORPORATE_ACTION"}
      - {name: failure_mode, type: "enum: TIMEOUT / 5XX / 4XX / SCHEMA_VIOLATION / RATE_LIMIT"}
      - {name: fallback_chain_depth, type: int}
      - {name: cache_fallback_used, type: bool}
      - {name: failed_ts, type: datetime}
      - {name: affected_instruments, type: "Optional[List[str]]"}
    causal_precondition: "connector 发起请求 + 依赖失败"
    causal_successor: "可能触发 E-OP-03 SystemDegraded（若持续不恢复）"
    audit_level: medium

  - id: E-OP-02
    name: "ModelDriftDetected / 模型漂移检出"
    domain: ops
    frequency: L4
    publisher: l11
    publisher_module: "model_monitor.drift_detector"
    subscribers: [l08, l11, l05, l12]
    subscriber_details:
      - {layer: l08, action: "通知研究团队"}
      - {layer: l11, action: "自动重训流水线（若配置）"}
      - {layer: l05, action: "策略禁用决策"}
      - {layer: l12, action: "审计日志"}
    aggregate_root: AGG-008
    payload_contract: null
    description: "L11 ML Platform 在生产运行中监控到某模型的数据分布/预测分布/反馈指标发生统计显著漂移。"
    payload_fields:
      - {name: drift_id, type: str}
      - {name: model_id, type: str}
      - {name: model_version, type: str}
      - {name: drift_type, type: "enum: FEATURE_DRIFT / LABEL_DRIFT / CONCEPT_DRIFT / PERFORMANCE_DECAY"}
      - {name: drift_metric_name, type: str}
      - {name: drift_value, type: float}
      - {name: threshold, type: float}
      - {name: detected_ts, type: datetime}
      - {name: suggested_action, type: str}
    causal_precondition: "生产推理 + 有 baseline 分布 + 监控器运行"
    causal_successor: "可能触发 E-RS-03 ModelValidated（新版本投产）或紧急策略停机"
    audit_level: high

  - id: E-OP-03
    name: "SystemDegraded / 系统降级"
    domain: ops
    frequency: L4
    publisher: l12
    publisher_module: "Prometheus / Loki SLO burn-rate alert 规则"
    subscribers: [l08, l12]
    subscriber_details:
      - {layer: l08, action: "告警（值班人）"}
      - {layer: l12, action: "审计日志 + 运维 Runbook 自动触发"}
    aggregate_root: null
    payload_contract: null
    description: "系统某关键 SLO 的 error-budget 燃烧率超过阈值。聚合级健康事件——下游运维 Runbook 触发点。"
    payload_fields:
      - {name: degradation_id, type: str}
      - {name: slo_id, type: "str (SLO-1/2/3/4/5/6/7/Audit)"}
      - {name: burn_rate, type: float}
      - {name: burn_rate_threshold, type: float}
      - {name: window_duration, type: str}
      - {name: detected_ts, type: datetime}
      - {name: suggested_runbook_ref, type: str}
    causal_precondition: "SLI 连续违约 + burn-rate 规则触发"
    causal_successor: "运维响应；若 Critical 可能升级为 DR/BCP 流程"
    audit_level: high

# =============================================================================
# 事件因果链（4 条重点场景）
# =============================================================================
event_chains:
  happy_path:
    name: "正常交易链路 / Happy Path"
    sequence: [E-SG-01, E-PF-01, E-EX-01, E-EX-02, E-EX-04]
    description: "SignalGenerated → PortfolioRebalanced → OrderSubmitted → OrderAccepted → FillReceived"

  idempotency_protection:
    name: "幂等保护链路 / Idempotency Protection"
    sequence: [E-EX-01, E-EX-07]
    description: "OMS → Idempotency Guard: SETNX=1 → OrderSubmitted; SETNX=0 → OrderIdempotencyBlocked"

  risk_circuit_breaker:
    name: "风控熔断链路 / Risk Circuit Breaker"
    sequence: [E-RK-04, E-EX-03, E-PF-02, E-RK-01, E-RK-02, E-RK-03]
    description: "Pre-Trade 拒单 / Position 超限 → 组合级风险突破 → MarginCalled / DrawdownAlerted"

  vendor_degradation:
    name: "Vendor 故障降级链路 / Vendor Degradation"
    sequence: [E-OP-01, E-OP-03]
    description: "DataIngestionFailed（fallback 链耗尽）→ SystemDegraded"

# =============================================================================
# 统计摘要
# =============================================================================
summary:
  total_events: 22
  by_domain:
    research: 3
    signal: 3
    portfolio: 2
    execution: 7
    risk: 4
    ops: 3
  by_frequency:
    L1: 5
    L2: 5
    L3: 5
    L4: 7
  by_audit_level:
    high: 16
    medium: 6
