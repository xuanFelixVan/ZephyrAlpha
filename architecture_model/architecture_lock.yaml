schema_version: "1.0.0"
created: "2026-05-09"
owner: ZephyrAlpha-Owner
description: |
  架构锁注册表——锁定已确认为"正确设计"的架构决策。
  任何 AI agent 修改以下锁定项前，MUST 先获得 Owner 明确批准。
  未经批准的修改 = 违规（RULE-TEN 强制执行）。

lock_philosophy: |
  "设计已正确 → 锁定 → 修改需审批 → 防止不知情的 AI 为完成任务而擅自改动架构"
  对标：K8s ValidatingAdmissionWebhook（准入控制）+ Terraform state lock（状态锁）
        + Vibe Coding 社区 "架构决策 immutable" 惯例
        + 专业机构 "change advisory board (CAB)" 审批流程

