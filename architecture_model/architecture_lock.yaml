modification_protocol:
  description: |
    任何 AI agent 想要修改上述锁定项时，MUST 遵循以下流程：

    1. 识别：AI 检测到自己的操作涉及 ARCH-LOCK-* 锁定项
    2. 暂停：AI 立即停止该操作
    3. 通知：AI 向用户报告：
       - 要修改哪个 ARCH-LOCK-*
       - 为什么要修改（业务需求/bug修复/优化）
       - 修改的影响范围
       - 替代方案（如果不修改的话）
    4. 等待：AI 等待用户明确回复"批准"或"拒绝"
    5. 执行/放弃：批准→执行修改+更新本注册表；拒绝→放弃修改

  emergency_override: |
    紧急情况（生产系统崩溃、数据丢失风险）下，AI 可以先修复再补审批。
    但 MUST 在修复后 5 分钟内向用户报告，并在本注册表中记录 override 原因。

  bypass_detection: |
    以下行为视为绕过架构锁（与 RULE-TEN 违规同级）：
    - 修改锁定文件但不检查 architecture_lock.yaml
    - 通过间接方式改变锁定决策（如：不改 schema 但改调用方绕过约束）
    - 删除或修改 architecture_lock.yaml 本身（仅 Owner 可修改）

industry_practices: |
  ## Vibe Coding 社区做法
  - 架构决策（Architecture Decision）作为知识条目融入 KB——可变、可推翻、可迭代（项目禁用 ADR 术语，因 ADR 暗示不可推翻，与项目持续进化理念冲突）
  - .cursorrules / CLAUDE.md / .trae/rules/ 作为 AI 行为约束文件——锁定关键设计
  - 社区共识：核心架构决策应由人类 Owner 控制，AI 只在授权范围内操作

  ## 专业机构做法
  - Change Advisory Board (CAB)：任何架构变更需委员会审批
  - K8s ValidatingAdmissionWebhook：准入控制器拦截不合规的变更请求
  - Terraform State Lock：DynamoDB/S3 锁防止并发修改基础设施状态
  - Git branch protection：main 分支保护 + required review + status checks
  - SOC 2 Change Management：CC8.1 要求所有变更经授权审批

  ## 本项目的做法
  - architecture_lock.yaml = 轻量级 CAB（1人版）
  - RULE-TEN = AI 行为层面的准入控制器
  - project_rules.md = AI 行为的宪法级约束
  - 与现有 RULE-ZERO（文件锁）互补：RULE-ZERO 防并发，RULE-TEN 防越权

