        domain: D_GOV_ENFORCEMENT
        submodule: ai_security/security_gateway
        note: AISG security_gateway，< 50ms 目标（Hot-adjacent）
      - id: shared-runtime-plane-tag
        domain: D_SHARED
        submodule: src/zephyr/shared/contracts/core/runtime_plane_tag.py
        note: 枚举定义，所有平面共用契约
    t3_additional_modules:
      - l00-connectors-hot
      - l03-signals-hot
      - l11-serving-hot
      - l12-metrics-hot
    sla:
      latency_p50_ms: 1
      latency_p99_ms: 10
      throughput_min: "100k msg/s"
      availability_percent: 99.99
      failure_impact: 资金直接损失（订单错过 / 风控失守）
    tech_stack:
      languages: [C++20, Rust, C]
      runtime: 裸金属 / 物理机
      ipc: [Aeron, LMAX Disruptor, ZeroMQ, RDMA]
      storage: Shared Memory Ring Buffer / mmap files
      concurrency: lock-free ring buffers / SPSC queue
      gc: 禁止（预分配 / arena allocator）
      scheduling: CPU亲和 / NUMA感知 / 大页内存

