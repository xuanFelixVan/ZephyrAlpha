cross_plane_rules:
  - rule: HOT_WARM_IPC_ONLY
    statement: Hot ⇄ Warm 必须过 src/zephyr/shared/contracts/core/runtime_plane_tag.py 定义的 IPC 协议（默认 Aeron / LMAX Disruptor），禁止直接函数调用
  - rule: WARM_COLD_ASYNC_ONLY
    statement: Warm → Cold 通过 Parquet / Redis Streams 异步推送，永远非阻塞
  - rule: COLD_TO_WARM_SHADOW_REQUIRED
    statement: Cold → Warm 模型/参数更新必须过影子验证（Champion-Challenger，D_SIMULATION 子模块负责）
  - rule: NO_COLD_TO_HOT_DIRECT
    statement: 禁止 Cold → Hot 直接通信。所有 Cold 输出必须先落 Warm 再经 Warm 验证后进 Hot
  - rule: NO_HOT_SYNC_PYTHON
    statement: Hot 禁止同步调用 Warm Python（Python GIL + asyncio 延迟不可预测）
  - rule: NO_SHARED_MUTABLE_STATE
    statement: 禁止跨平面共享可变全局状态

