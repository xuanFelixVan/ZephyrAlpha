      owner: "S2"
      lead_time: "T+1"
      process_time: "10-30 min"
      c_and_a: "99%"
      main_delay_source: "日终结算数据到齐"
    - stage: "Feedback loop"
      core_artifact: "研究结论 / KB 决策记录 候选"
      owner: "S1 + S2"
      lead_time: "T+1 ~ T+5"
      process_time: "1-4 h"
      c_and_a: "85%"
