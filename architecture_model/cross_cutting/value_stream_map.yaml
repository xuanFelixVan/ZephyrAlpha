      core_artifact: "因子假设 + 特征工程"
      owner: "S2"
      lead_time: "5-20 天"
      process_time: "2-8 小时"
      c_and_a: "70%"
      main_delay_source: "想法→验证的探索回合、PIT 数据整备"
    - stage: "Factor Library"
      core_artifact: "因子入库 + 质量断言"
      owner: "S2 + S6"
      lead_time: "15-60 min"
      process_time: "10-30 min"
      c_and_a: "98%"
      main_delay_source: "PIT 三字段校验、五类质量断言"
    - stage: "Model Train/Deploy"
      core_artifact: "模型 + 部署 manifest"
      owner: "S7(未来)"
      lead_time: "2-24 小时"
      process_time: "30 min-4 h"
      c_and_a: "95%"
      main_delay_source: "GPU 排队、超参搜索"
    - stage: "Signal Generation"
      core_artifact: "信号 payload"
      owner: "S2"
      lead_time: "15-60 min"
      process_time: "5-15 min"
      c_and_a: "98%"
      main_delay_source: "因子刷新依赖、下游订阅对齐"
    - stage: "Portfolio Construction"
      core_artifact: "目标仓位"
      owner: "S2 → S9(未来)"
      lead_time: "5-15 min"
      process_time: "1-5 min"
      c_and_a: "99%"
      main_delay_source: "约束求解器收敛"
    - stage: "Pre-trade Risk"
      core_artifact: "风控审批结果"
      owner: "S4"
      lead_time: "<1 min"
      process_time: "5-30 s"
      c_and_a: "99.9%"
      main_delay_source: "限额查询、手工复核(ad-hoc)"
