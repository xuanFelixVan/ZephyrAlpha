      has_real_sla: false
      note: "未激活;S11 激活后,本表 SLO-6 / SLO-7 需转为对合伙人的 SLA"
    - counterparty: "S12 Regulators"
      has_real_sla: false
      note: "无商业 SLA(但有合规时限);监管激活后,合规报告时限(如成交回报 T+1)转为硬性 SLA"
    - counterparty: "内部"
      has_real_sla: false
      note: "单人;当前所有 SLO 都是对自己的承诺,性质接近 OKR;仍必须量化、否则无法治理"

