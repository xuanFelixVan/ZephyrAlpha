partition:
  id: cross-cutting-capability-heatmap
  name: Capability Maturity Heatmap
  data_source: depgraph_db
  description: >
    能力成熟度热力图（50域×10能力域矩阵）。
    五档成熟度：L0 Missing / L1 Designed / L2 Drafted / L3 Usable / L4 Production / L5 Leading。
    结构化数据从depgraph派生（PostgreSQL INFRA-DB-003）。
  source_view: capability_heatmap.md
  related_kb_ref:
  - KBG-0012
  baseline_date: '2026-06-23'
  review_cadence: quarterly
  overall_maturity_score: 1.12
  overall_maturity_level: L1
  score_calculation_method: >
    加权平均法：50域×10能力域（C1~C7业务域 + CC1~CC3横切域）。
    每域成熟度由depgraph派生。
  overall_assessment: >
    架构蓝图已95%锁定，代码施工刚起步。
maturity_scale:
  L0:
    name: Missing
    color: '#e5e7eb'
    symbol: ⚪
    description: 能力完全不存在
  L1:
    name: Designed
    color: '#bfdbfe'
    symbol: 🔵
    description: 有KB决策记录/有架构视图，无代码
  L2:
    name: Drafted
    color: '#fde68a'
    symbol: 🟡
    description: 有代码原型/skeleton目录
  L3:
    name: Usable
    color: '#86efac'
    symbol: 🟢
    description: 核心功能实现+测试覆盖≥60%
  L4:
    name: Production
    color: '#c4b5fd'
    symbol: 🟣
    description: 真实资金/真实流量+治理三层完整覆盖
  L5:
    name: Leading
    color: '#fca5a5'
    symbol: 🔴
    description: 对标顶级机构业界领先实现
