# v3.0.3: 治本版（b_track 从 layers/b_*.yaml 物理蓝图文件派生，消除手工模板第二真源）
# 双树合并为单树（2026-06-30 治本）：architecture_model/ 是唯一架构模型存储位置。
# c_track（14层 l00-l13）已废弃：§2.1 裁定 14 层降级为域属性，物理分类由 depgraph domains 表定义。
# 本文件由 dm200916_write_direct.py 派生，禁止手工编辑 domains 与 b_track 列表：
#   - domains 列表：depgraph (PostgreSQL) domains 表派生
#   - b_track 模块列表：layers/b_*.yaml 物理蓝图文件派生（b_ 前缀即成员资格）
module_id: MOD-GOVERNANCE
schema_version: '3.0.3'
doc_type: register
ttl: permanent
system:
  name: ZephyrAlpha
  description: 个人量化交易系统
  architecture_style: domain_driven_event_driven_polyglot

governance:
  canonical: true
  derives_from: "YAML canonical SSoT 铁律"
  conflict_rule: "YAML 为准，Markdown 视图同步更新"
  gate_alignment: "GATE-A 代码↔YAML 对齐"
  domains_source: >
    domains 列表由 dm200916_write_direct.py 从 depgraph domains 表派生，禁止手编。
    b_track 模块列表从 layers/b_*.yaml 物理文件派生，禁止手编。
    改 depgraph 或 layers/b_*.yaml 后由 GATE-ARCH-MODEL reconciler 自动重生。

# === 分区管理约定（Partition Management Convention）===
# 74域是唯一物理分类体系（depgraph domains表），4值（L0_infrastructure/L1_foundation/L2_domain/L3_application）是域的layer_id属性枚举。
# AI找模块只有一条路：按域找。
# b_track 是横切基础设施模块的施工视图（物理蓝图文件对齐），独立于域分类。

partitions:
# === 74域索引（物理分类唯一真源：depgraph domains表）===
- id: domains
  path: depgraph (PostgreSQL)
  description: >
    74域物理分类唯一真源。
    查询命令: python scripts/governance/extract_depgraph.py --summary
    4值（L0_infrastructure/L1_foundation/L2_domain/L3_application）是域的layer_id属性枚举。

# === 横切关注点分区（非业务分类）===
- id: shared
  path: layers/b_shared.yaml
  description: 跨域公共契约与基础能力
- id: frontend
  path: frontend/frontend_model.yaml
  description: 前端独立平台 FE-L1~L4
  status: planned
- id: scripts
  description: 治理/审计/部署脚本（待建 scripts_model.yaml）
  status: planned
- id: cross_cutting
  path: cross_cutting/
  description: 运行平面、不变量、能力成熟度
- id: contracts
  path: contracts/cross_layer_contracts.yaml
  description: P0/P1跨域数据契约、OCP扩展点、外部系统契约、AI治理接口签名
- id: events
  path: events/domain_events.yaml
  description: 27条领域事件（8域）、事件链、频率等级与运行时声明
- id: ddd-model
  path: domain/ddd_model.yaml
  description: DDD战术模式：8 Aggregate Root + 6 Entity + 12 Value Object + 边界铁律
- id: technology
  path: technology/
  description: 技术选型与版本治理SSoT
- id: core-services
  description: Vibe Coding 2.0 6大核心服务（待建 infra/core_services.yaml）
  status: planned
- id: shared-infra
  description: 跨域共享基础设施（待建 infra/shared_infra.yaml）
  status: planned

# === b_track 横切基础设施模块（从 layers/b_*.yaml 物理文件派生，禁止手工编辑）===
- id: b_track
  description: 横切基础设施模块施工视图（从 layers/b_*.yaml 物理文件派生，b_ 前缀即成员资格）
  modules:
  - id: context_engine
    name: Context Engine (CE)
    path: layers/b_context_engine.yaml
    status: implemented
  - id: core
    name: Core
    path: layers/b_core.yaml
    status: implemented
  - id: db
    name: Database
    path: layers/b_db.yaml
    status: implemented
  - id: execution_model
    name: Three-Layer Execution Model
    path: layers/b_execution_model.yaml
    status: implemented
  - id: feedback_loop
    name: Feedback Loop Engine
    path: layers/b_feedback_loop.yaml
    status: under_construction
    description: Vibe Coding 2.0 基础设施 L12 跨层支撑，核心服务之一。
  - id: gates
    name: Gates
    path: layers/b_gates.yaml
    status: implemented
  - id: llm_security
    name: LLM Security Gateway (LSG)
    path: layers/b_llm_security.yaml
    status: implemented
  - id: mcp
    name: MCP Servers
    path: layers/b_mcp.yaml
    status: implemented
    description: MOD-MASTER-001 §0.2：MCP 无独立CT-*；能力由各宿主系统契约暴露。传输与工具规范见 MCP blueprint 决策表。
  - id: orchestrator
    name: Agent Orchestrator (Orc)
    path: layers/b_orchestrator.yaml
    status: implemented
  - id: pipeline
    name: Pipeline
    path: layers/b_pipeline.yaml
    status: implemented
  - id: shared
    name: Shared
    path: layers/b_shared.yaml
    status: implemented
  - id: system_telemetry
    name: System Telemetry
    path: layers/b_system_telemetry.yaml
    status: implemented
    description: 全系统遥测的 metrics/logs/traces/ai_behavior 采集与归档，为 L00-L11 + L13 所有业务层提供可观测性数据底座。 归入 B 轨（横切基础设施模块），2026-06-30 治本：c_track→b_track（§2.1 裁定后 c_track 已废弃）。
  - id: vector_memory
    name: Vector Memory Service (VMS)
    path: layers/b_vector_memory.yaml
    status: implemented
    description: 蓝图 v0.7.0：18 .py 文件 + 11 子模块 + 23 单元测试 + 7 对抗测试全部通过（2026-08-17 AI-02 审计：status 由 phase_2_complete 归一到 schema 合法值 implemented）

