governance:
  canonical: true
  derives_from: "AGENTS.md §6.9 — 架构数据 Canonical SSoT 铁律"
  derived_views: "docs/02_enterprise_architecture/target_architecture/00-10*.md"
  conflict_rule: "YAML 为准，Markdown 视图同步更新"
  gate_alignment: "AGENTS.md §6.10 — 双层对齐闸门 GATE-A (代码↔YAML) + GATE-B (YAML↔MD)"
  drift_root_cause: >
    审计漂移的病根是「双轨真源 + 门禁只盯一半」：(1) 企业架构树在 docs/.../architecture_model，
    施工真源在仓库根 architecture_model/，二者 _schema 形状与枚举曾长期不一致；(2) check_architecture_gates 的
    GATE-SC 原先只扫描 docs 树，施工树处于盲区；(3) module_registry.yaml 的 dependencies[].module_id
    无词法闸门，易被粘贴为人类可读占位符并破坏 YAML 结构。修复：GATE-SC 现已并列扫描两套 layers +
    各自 _schema；抽取 enum 支持 operational_schema 嵌套分组；新增 EXTRA-05 校验 MOD-*/SYS-*；
    登记表尾部损坏与非法依赖需靠 EXTRA-05 + yaml 解析在 CI 内阻断复发。

