# 定位：07_trading_decision_architecture/ 视图的"叙事层"真源。
#       生成器 generate_trading_flow_diagram.py 读取本文件 + decisiongraph (PostgreSQL)
#       → 拼装 07_ 目录的 7 个 MD。
