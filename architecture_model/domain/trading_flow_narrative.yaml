#   - 结构化数据（节点/边/flow_stage 字段）真源 = decisiongraph (PostgreSQL) + decision_graph_model.yaml
#   - 叙事层（大白话/ASCII框图/指挥AI提示）真源 = 本文件
#   - 07_ MD = 生成器派生产物（只读视图）
