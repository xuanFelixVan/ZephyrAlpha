module_id: MOD-GOVERNANCE
schema_version: "2.1"
implementation_status: design_only
implementation_note: >
  本文件是 DDD 设计模型（design model），描述目标领域结构。
  physical_path / code_package_mapping 字段为目标 DDD 包结构，代码尚未按此组织。
  实际代码位置见各模块 blueprint.md frontmatter.file_manifest。
  2026-07-05 审计 AI-02 标记：避免将 physical_path 误读为实际代码路径。

partition:
  id: cross-cutting-ddd
  name: "DDD Domain Model / DDD 领域模型"
  type: cross-cutting
  description: >
    DDD 聚合/实体/值对象 SSoT。8 个 Aggregate Root + 6 个 Entity + 12 个 Value Object。
    严格遵守 Eric Evans DDD + Vaughn Vernon 精炼的 5 条边界铁律。
    与 05-DA §2 Entity 清单严格映射，无虚构实体。
    来源：ddd-aggregates.md v1.0.0 迁移。
  source_views:
    - 03-application_architecture.md
    - 05-data_architecture.md
  related_kb_refs:
    - KBG-0009

# =============================================================================
# Aggregate 边界划分铁律
# =============================================================================
boundary_rules:
  - id: BR-01
    rule: "一致性边界：Aggregate 内部保证强一致性，跨 Aggregate 最终一致性"
    example: "Order + Fill 内部一致；Order 与 Position 最终一致（Fill 事件触发 Position 重算）"
  - id: BR-02
    rule: "单一事务原则：一次操作只修改一个 Aggregate 实例"
    example: "Order.cancel() 只改 Order；不同时改 Portfolio"
  - id: BR-03
    rule: "ID 引用原则：跨 Aggregate 通过 ID 引用，不嵌入对象"
    example: "Portfolio 含 position_ids: List[str]，不嵌入 Position 对象本身"
  - id: BR-04
    rule: "尽可能小：Aggregate 越小越好（除非违反铁律 1）"
    example: "Position 独立，不嵌入 Portfolio（持仓海量 + 高频更新）"
  - id: BR-05
    rule: "通过 Aggregate Root 访问内部：外部不直接访问 Entity/VO"
    example: "修改 Fill 必须通过 Order.add_fill()，不允许直接 fill.quantity = ..."

# =============================================================================
# 8 个 Aggregate Root
# =============================================================================
aggregate_roots:
  - id: AGG-001
    name: "Order / 委托订单"
    layer: l06
    bounded_context: "Trade Execution 域"
    physical_path: src/zephyr/shared/contracts/order.py
    description: "订单全生命周期管理、委托路由、成交汇总。"
    contains_entities: [ENT-001]
    fields:
      - {name: order_id, type: "UUID v7", key: true, description: "Root 唯一标识"}
      - {name: client_order_id, type: IdempotencyKey, description: "= H10 Idempotency Key 128-bit prefix"}
      - {name: strategy_id, type: str, description: "来源策略 ID"}
      - {name: signal_id, type: str, description: "来源 signal ID"}
      - {name: instrument_id, type: InstrumentId, description: "标的"}
      - {name: side, type: "Side (VO)", description: "方向"}
      - {name: order_type, type: "Enum[LIMIT, MARKET, STOP, STOP_LIMIT]", description: "订单类型"}
      - {name: quantity, type: "Quantity (VO)", description: "目标数量"}
      - {name: limit_price, type: "Price (VO) | None", description: "LIMIT 单必填"}
      - {name: status, type: OrderStatus, description: "状态机：PENDING → NEW → ROUTED → PARTIAL → FILLED / CANCELLED / REJECTED / EXPIRED"}
      - {name: filled_quantity, type: Quantity, description: "所有 Fill 的累计数量（Root 维护不变量）"}
      - {name: avg_fill_price, type: "Price | None", description: "加权平均成交价"}
      - {name: created_at, type: Timestamp, description: "创建时间"}
      - {name: updated_at, type: Timestamp, description: "更新时间"}
      - {name: broker_ref_id, type: "str | None", description: "broker 侧委托号"}
      - {name: tif, type: "Enum[DAY, GTD, IOC, FOK]", description: "有效期类型"}
      - {name: fills, type: "List[Fill]", description: "Entity（内部）"}
    invariants:
      - "status == FILLED ⇒ filled_quantity == quantity"
      - "status ∈ {CANCELLED, REJECTED, EXPIRED} ⇒ 禁止新增 Fill"
      - "filled_quantity == sum(f.filled_quantity for f in fills)"
      - "avg_fill_price == Σ(f.fill_price × f.filled_quantity) / filled_quantity"
      - "client_order_id 全局唯一（跨 Aggregate 实例，由 Idempotency 层保证）"
    behaviors:
      - {name: submit, description: "通过 Idempotency + Pre-Trade → 提交到 broker", events: [E-EX-01, E-EX-07, E-RK-04]}
      - {name: accept, description: "收到 broker ack", events: [E-EX-02]}
      - {name: reject, description: "收到 broker reject", events: [E-EX-03]}
      - {name: add_fill, description: "登记成交回报（仅 Root 可调）", events: [E-EX-04]}
      - {name: cancel, description: "显式取消", events: [E-EX-05]}
      - {name: expire, description: "TIF 到期自动失效", events: [E-EX-06]}
    events_published: [E-EX-01, E-EX-02, E-EX-03, E-EX-04, E-EX-05, E-EX-06, E-EX-07]
    red_line_ref: [H9, H10]
    da_entity_mapping: "E13 Order + E14 Fill/Execution"
    contract_mapping: "CTR-004 Order + CTR-005 Fill"

  - id: AGG-002
    name: "Position / 持仓"
    layer: l06
    bounded_context: "Position Tracking 域（L06/L04 共享）"
    physical_path: src/zephyr/shared/contracts/position.py
    description: "持仓快照、盈亏计算基础、风控监控输入。"
    contains_entities: [ENT-002]
    fields:
      - {name: position_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: account_id, type: str, description: "账户 ID"}
      - {name: portfolio_id, type: str, description: "反向引用（不嵌入 Portfolio）"}
      - {name: instrument_id, type: InstrumentId, description: "标的"}
      - {name: quantity, type: Quantity, description: "持仓数量"}
      - {name: avg_cost, type: "Price (VO)", description: "平均成本"}
      - {name: unrealized_pnl, type: Money, description: "未实现盈亏"}
      - {name: realized_pnl, type: Money, description: "已实现盈亏"}
      - {name: last_update_ts, type: Timestamp, description: "最后更新时间"}
      - {name: as_of_ts, type: Timestamp, description: "bitemporal（valid_time）"}
      - {name: transaction_ts, type: Timestamp, description: "bitemporal（transaction_time）"}
      - {name: lots, type: "List[Lot]", description: "Entity（内部，可选，税务/批次视角）"}
    invariants:
      - "quantity = sum(l.quantity for l in lots if l.close_ts is None)"
      - "avg_cost = Σ(l.cost_basis × l.quantity) / quantity"
      - "as_of_ts ≤ transaction_ts（valid 时间不晚于登记时间）"
      - "同一 (account_id, instrument_id, as_of_ts) 在任一 transaction_ts 有唯一 snapshot"
    behaviors:
      - {name: apply_fill, description: "Fill 事件驱动的持仓更新", events: []}
      - {name: check_limits, description: "检查单持仓限额", events: [E-PF-02]}
      - {name: snapshot, description: "生成不可变快照", events: []}
    events_published: [E-PF-02, E-RK-02]
    da_entity_mapping: "E15 Position"
    contract_mapping: "CTR-006 PositionSnapshot"

  - id: AGG-003
    name: "Portfolio / 投资组合"
    layer: l05
    bounded_context: "Portfolio Management 域"
    physical_path: src/zephyr/pf_core/domain/portfolio.py
    description: "组合定义、目标持仓维护、再平衡触发。"
    contains_entities: []
    fields:
      - {name: portfolio_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: name, type: str, description: "组合名称"}
      - {name: base_currency, type: "str (ISO 4217)", description: "基础货币"}
      - {name: capital, type: Money, description: "资本"}
      - {name: mandate, type: str, description: "组合授权/策略范围"}
      - {name: status, type: "Enum[ACTIVE, SUSPENDED, RETIRED]", description: "状态"}
      - {name: created_at, type: Timestamp, description: "创建时间"}
      - {name: target_positions, type: "Dict[InstrumentId, Percentage]", description: "目标持仓权重（VO 字典）"}
      - {name: strategy_ids, type: "List[str]", description: "引用 Strategy Aggregate（ID 引用）"}
      - {name: position_ids, type: "List[str]", description: "引用 Position Aggregate（ID 引用，不嵌入）"}
      - {name: order_ids, type: "List[str]", description: "本 portfolio 发起的 Order（ID 引用）"}
      - {name: risk_policy_id, type: str, description: "引用 RiskPolicy Aggregate（ID 引用）"}
    invariants:
      - "sum(target_positions.values()) == 1.0（容忍 ε = 1e-6）"
      - "all(w >= 0 for w in target_positions.values())"
      - "capital.currency == base_currency"
      - "所有 position_ids 对应 Position 的 base_currency 必须与本 Portfolio 一致"
    behaviors:
      - {name: rebalance, description: "再平衡决策：根据 signals + risk 产出一批订单", events: [E-PF-01]}
      - {name: update_targets, description: "更新目标持仓", events: [E-PF-01]}
      - {name: attach_strategy, description: "绑定新策略", events: []}
    events_published: [E-PF-01, E-RK-03]
    da_entity_mapping: "E16 Portfolio"

  - id: AGG-004
    name: "Strategy / 策略"
    layer: l05
    bounded_context: "Strategy Management 域（L05 + L03 共享）"
    physical_path: src/zephyr/pf_core/domain/strategy.py
    description: "策略定义、版本管理、信号生成。"
    contains_entities: [ENT-003]
    fields:
      - {name: strategy_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: name, type: str, description: "策略名称"}
      - {name: description, type: str, description: "策略说明"}
      - {name: owner, type: str, description: "研究员 ID"}
      - {name: current_active_version_id, type: "str | None", description: "指向 StrategyVersion.id"}
      - {name: status, type: "Enum[RESEARCH, CANDIDATE, ACTIVE, DEPRECATED]", description: "状态"}
      - {name: versions, type: "List[StrategyVersion]", description: "Entity（append-only）"}
    invariants:
      - "同一 strategy_id 至多一个 current_active_version_id（唯一 active）"
      - "StrategyVersion 一旦 activated_at 不为空，其余字段不可修改"
      - "status == ACTIVE ⇒ current_active_version_id != None"
      - "current_active_version_id 指向的版本 validation_status == PASSED"
    behaviors:
      - {name: generate_signal, description: "策略产出信号", events: [E-SG-01]}
      - {name: on_fill, description: "成交回调", events: []}
      - {name: activate_version, description: "激活新版本", events: []}
      - {name: revoke_signal, description: "撤销已发出未转化的 Signal", events: [E-SG-02]}
    events_published: [E-SG-02, E-RS-02]
    da_entity_mapping: "无显式对应（DDD 建模新增）"
    contract_mapping: "OCP-002 StrategyBase"

  - id: AGG-005
    name: "Factor / 因子"
    layer: l02
    bounded_context: "Factor Engine 域"
    physical_path: src/zephyr/factor/domain/factor.py
    description: "因子定义、版本管理、计算引擎。FactorValue 通过 ID 引用，不嵌入（时序数据海量）。"
    contains_entities: [ENT-004]
    fields:
      - {name: factor_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: name, type: str, description: "因子名称"}
      - {name: description, type: str, description: "因子说明"}
      - {name: owner, type: str, description: "研究员 ID"}
      - {name: frequency, type: "Enum[DAILY, INTRADAY_1M, INTRADAY_5M, ...]", description: "计算频率"}
      - {name: asof_offset, type: Timedelta, description: "PIT 偏移"}
      - {name: current_active_version_id, type: "str | None", description: "当前活跃版本"}
      - {name: status, type: "Enum[RESEARCH, ACTIVE, DEPRECATED]", description: "状态"}
      - {name: versions, type: "List[FactorVersion]", description: "Entity（append-only）"}
    invariants:
      - "formula_hash + version_number 唯一"
      - "同一 factor_id 至多一个 active 版本"
      - "activated_at 一旦写入，formula_hash / code_ref 不可修改"
    behaviors:
      - {name: compute, description: "计算因子值（按 OCP 扩展点接口）", events: []}
      - {name: register_new_version, description: "研究员注册新版本", events: [E-RS-01]}
    events_published: [E-RS-01]
    da_entity_mapping: "E08 Factor（FactorValue = E09 独立 Entity 外置）"
    contract_mapping: "OCP-001 FactorBase"

  - id: AGG-006
    name: "Signal / 交易信号"
    layer: l03
    bounded_context: "Signal 域"
    physical_path: src/zephyr/signal/domain/signal.py
    description: "策略输出的交易意图载体。本身即单一 Entity，无内部子 Entity。"
    contains_entities: []
    fields:
      - {name: signal_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: strategy_id, type: str, description: "引用 Strategy"}
      - {name: asof_ts, type: Timestamp, description: "PIT 时间戳"}
      - {name: instrument_id, type: InstrumentId, description: "标的"}
      - {name: side, type: "Side (VO)", description: "方向"}
      - {name: magnitude, type: "Percentage (VO)", description: "[0, 1]"}
      - {name: target_qty_hint, type: "Quantity | None", description: "可选数量提示"}
      - {name: target_price_hint, type: "Price | None", description: "可选价格提示"}
      - {name: generated_ts, type: Timestamp, description: "生成时间"}
      - {name: ttl_seconds, type: int, description: "有效期"}
      - {name: status, type: "Enum[ACTIVE, CONSUMED, REVOKED, EXPIRED]", description: "状态"}
      - {name: lineage_root, type: "LineageRoot (VO)", description: "血缘追溯根"}
      - {name: consumed_by_order_id, type: "str | None", description: "被哪个 Order 消费"}
    invariants:
      - "asof_ts ≤ generated_ts（PIT 铁律）"
      - "status == CONSUMED ⇒ consumed_by_order_id != None"
      - "status == EXPIRED ⇒ generated_ts + ttl_seconds < now()"
      - "Signal 一旦 status != ACTIVE 不能再被消费"
    behaviors:
      - {name: consume, description: "标记被消费", events: []}
      - {name: revoke, description: "显式撤销", events: [E-SG-02]}
      - {name: check_expiry, description: "定时检查 TTL", events: [E-SG-03]}
    events_published: [E-SG-01, E-SG-02, E-SG-03]
    da_entity_mapping: "E11 Signal"

  - id: AGG-007
    name: "RiskPolicy / 风控策略"
    layer: l04
    bounded_context: "Risk Management 域"
    physical_path: src/zephyr/risk/domain/risk_policy.py
    description: "风控规则定义、限额管理、Pre-Trade 检查。"
    contains_entities: [ENT-005]
    fields:
      - {name: policy_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: portfolio_id, type: str, description: "引用 Portfolio"}
      - {name: name, type: str, description: "策略名称"}
      - {name: version, type: "str (semver)", description: "版本"}
      - {name: status, type: "Enum[ACTIVE, DRAFT, DEPRECATED]", description: "状态"}
      - {name: activated_at, type: "Timestamp | None", description: "激活时间"}
      - {name: limits, type: "List[RiskLimit]", description: "Entity"}
    invariants:
      - "同一 portfolio_id 至多一个 ACTIVE 的 RiskPolicy"
      - "enforcement == HARD_BLOCK 的 limit 违反时必须 Fail-Closed"
      - "每条 RiskLimit 的 threshold_value > 0"
    behaviors:
      - {name: evaluate_pre_trade, description: "Pre-Trade 检查（Fail-Closed 铁律）", events: [E-RK-04]}
      - {name: evaluate_portfolio, description: "组合级实时监控（发布 RiskThresholdBreached）", events: [E-RK-01]}
      - {name: evaluate_position, description: "单持仓监控", events: [E-PF-02]}
    events_published: [E-RK-01, E-RK-04]
    da_entity_mapping: "E17 RiskMetric（RiskMetric 是测量结果，RiskPolicy 是测量规则）"

  - id: AGG-008
    name: "Model / ML 模型"
    layer: l11
    bounded_context: "ML Platform 域"
    physical_path: src/zephyr/ml_train/domain/model.py
    description: "ML 模型定义、版本管理、验证与漂移监控。TrainingRun 通过 ID 引用（训练产物海量）。"
    contains_entities: [ENT-006]
    fields:
      - {name: model_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: name, type: str, description: "模型名称"}
      - {name: model_type, type: "Enum[CLASSIFIER, REGRESSOR, FORECASTER, EMBEDDING, REINFORCEMENT]", description: "模型类型"}
      - {name: owner, type: str, description: "研究员 ID"}
      - {name: current_active_version_id, type: "str | None", description: "当前活跃版本"}
      - {name: status, type: "Enum[DEVELOPMENT, VALIDATED, ACTIVE, DEPRECATED]", description: "状态"}
      - {name: versions, type: "List[ModelVersion]", description: "Entity"}
    invariants:
      - "同一 model_id 至多一个 active 版本"
      - "status == ACTIVE ⇒ current_active_version_id != None ⇒ 对应版本 approval_ts != None"
      - "ModelVersion 一旦 activated，training_run_id / validation_metrics 不可修改"
    behaviors:
      - {name: validate_version, description: "离线验证 + 审批", events: [E-RS-03]}
      - {name: activate_version, description: "推送到生产", events: []}
      - {name: report_drift, description: "监控器上报漂移", events: [E-OP-02]}
      - {name: rollback_to, description: "紧急回滚", events: []}
    events_published: [E-RS-03, E-OP-02]
    da_entity_mapping: "无显式对应（DDD 建模新增）"

# =============================================================================
# 6 个 Entity（附属于 Aggregate Root）
# =============================================================================
entities:
  - id: ENT-001
    name: "Fill / 成交"
    parent_aggregate: AGG-001
    description: "append-only，Root 通过 add_fill() 添加"
    fields:
      - {name: fill_id, type: "UUID v7", key: true, description: "只在 Order 内唯一"}
      - {name: order_id, type: str, description: "反向引用 Root"}
      - {name: filled_quantity, type: Quantity, description: "成交数量"}
      - {name: fill_price, type: Price, description: "成交价格"}
      - {name: fill_timestamp, type: Timestamp, description: "成交时间"}
      - {name: commission, type: Money, description: "佣金"}
      - {name: broker_fill_id, type: "str | None", description: "券商侧成交 ID"}

  - id: ENT-002
    name: "Lot / 批次"
    parent_aggregate: AGG-002
    description: "可选（税务/批次视角）；若不启用则 Position 只用 avg_cost"
    fields:
      - {name: lot_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: position_id, type: str, description: "反向引用"}
      - {name: quantity, type: Quantity, description: "批次数量"}
      - {name: cost_basis, type: Price, description: "成本基础"}
      - {name: open_ts, type: Timestamp, description: "开仓时间"}
      - {name: close_ts, type: "Timestamp | None", description: "平仓时间"}
      - {name: lot_source_fill_id, type: str, description: "来源成交 ID"}

  - id: ENT-003
    name: "StrategyVersion / 策略版本"
    parent_aggregate: AGG-004
    description: "append-only"
    fields:
      - {name: version_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: strategy_id, type: str, description: "反向引用"}
      - {name: version_number, type: "str (semver)", description: "版本号"}
      - {name: code_commit_hash, type: str, description: "代码 commit hash"}
      - {name: parameters, type: "Dict[str, Any]", description: "参数配置"}
      - {name: required_factor_ids, type: "List[str]", description: "引用 Factor Aggregate"}
      - {name: backtest_run_ids, type: "List[str]", description: "引用 Backtest 结果"}
      - {name: activated_at, type: "Timestamp | None", description: "激活时间"}
      - {name: deprecated_at, type: "Timestamp | None", description: "废弃时间"}
      - {name: validation_status, type: "Enum[PENDING, PASSED, FAILED]", description: "验证状态"}

  - id: ENT-004
    name: "FactorVersion / 因子版本"
    parent_aggregate: AGG-005
    description: "append-only"
    fields:
      - {name: version_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: factor_id, type: str, description: "反向引用"}
      - {name: formula_hash, type: str, description: "公式的 hash（验证不可变）"}
      - {name: version_number, type: "str (semver)", description: "版本号"}
      - {name: code_ref, type: str, description: "src/zephyr/l02_.../factors/xxx.py commit hash"}
      - {name: activated_at, type: "Timestamp | None", description: "激活时间"}
      - {name: deprecated_at, type: "Timestamp | None", description: "废弃时间"}

  - id: ENT-005
    name: "RiskLimit / 风控限额"
    parent_aggregate: AGG-007
    description: "可增删改（政策调整）"
    fields:
      - {name: limit_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: policy_id, type: str, description: "反向引用"}
      - {name: limit_type, type: "Enum[SINGLE_INSTRUMENT_NOTIONAL, SECTOR_EXPOSURE, GROSS_NOTIONAL, NET_NOTIONAL, VAR_95, VAR_99, MAX_DRAWDOWN, LEVERAGE, FACTOR_EXPOSURE]", description: "限额类型"}
      - {name: scope, type: str, description: "具体作用域（instrument_id / sector / etc）"}
      - {name: threshold_value, type: Decimal, description: "阈值"}
      - {name: severity, type: "Enum[WARNING, CRITICAL, EMERGENCY]", description: "严重性"}
      - {name: enforcement, type: "Enum[HARD_BLOCK, SOFT_WARN, POST_TRADE_ONLY]", description: "执行方式"}

  - id: ENT-006
    name: "ModelVersion / 模型版本"
    parent_aggregate: AGG-008
    description: "append-only"
    fields:
      - {name: version_id, type: "UUID v7", key: true, description: "唯一标识"}
      - {name: model_id, type: str, description: "反向引用"}
      - {name: version_number, type: "str (semver)", description: "版本号"}
      - {name: training_run_id, type: str, description: "引用外部 TrainingRun（不嵌入）"}
      - {name: validation_metrics, type: "Dict[str, float]", description: "验证指标"}
      - {name: baseline_comparison, type: "Dict[str, Any]", description: "基线对比"}
      - {name: approver_id, type: "str | None", description: "审批人"}
      - {name: approval_ts, type: "Timestamp | None", description: "审批时间"}
      - {name: activated_at, type: "Timestamp | None", description: "激活时间"}
      - {name: rollback_target_version_id, type: "str | None", description: "回滚目标版本"}

# =============================================================================
# 12 个 Value Object
# =============================================================================
value_objects:
  - id: VO-001
    name: "Money / 金额"
    immutable: true
    equality: value-based
    fields:
      - {name: amount, type: Decimal, description: "金额"}
      - {name: currency, type: "str (ISO 4217)", description: "货币"}
    invariants: ["amount 非负（或允许负，表示欠款）；currency 固定后不可变"]

  - id: VO-002
    name: "Price / 价格"
    immutable: true
    equality: value-based
    fields:
      - {name: value, type: Decimal, description: "价格值"}
      - {name: tick_size, type: Decimal, description: "最小变动单位"}
      - {name: currency, type: str, description: "货币"}
    invariants: ["value 必须是 tick_size 的整数倍；value > 0"]

  - id: VO-003
    name: "Quantity / 数量"
    immutable: true
    equality: value-based
    fields:
      - {name: value, type: Decimal, description: "数量值"}
      - {name: lot_size, type: Decimal, description: "最小交易单位"}
    invariants: ["value 必须是 lot_size 的整数倍；非负"]

  - id: VO-004
    name: "InstrumentId / 证券标识"
    immutable: true
    equality: value-based
    fields:
      - {name: exchange, type: str, description: "交易所代码"}
      - {name: code, type: str, description: "证券代码"}
    invariants: ["exchange 在固定枚举内；code 非空"]

  - id: VO-005
    name: "ISIN / 国际证券识别码"
    immutable: true
    equality: value-based
    fields:
      - {name: value, type: "str (12-char)", description: "ISIN 码"}
    invariants: ["Luhn 校验通过；12 字符定长"]

  - id: VO-006
    name: "Exchange / 交易所"
    immutable: true
    equality: value-based
    fields:
      - {name: code, type: "str (MIC)", description: "MIC 代码"}
      - {name: name, type: str, description: "交易所名称"}
      - {name: timezone, type: str, description: "时区"}
      - {name: trading_sessions, type: "List[SessionRange]", description: "交易时段"}
    invariants: ["MIC 合法（ISO 10383）"]

  - id: VO-007
    name: "Timestamp / 时间戳"
    immutable: true
    equality: value-based
    fields:
      - {name: ts_utc_ns, type: "int (UTC 纳秒)", description: "UTC 纳秒时间戳"}
    invariants: ["非负；UTC 时区；不可变"]

  - id: VO-008
    name: "DateRange / 日期范围"
    immutable: true
    equality: value-based
    fields:
      - {name: start, type: Date, description: "开始日期"}
      - {name: end, type: Date, description: "结束日期"}
    invariants: ["start ≤ end"]

  - id: VO-009
    name: "Percentage / 百分比"
    immutable: true
    equality: value-based
    fields:
      - {name: value, type: Decimal, description: "百分比值"}
    invariants: ["通常在 [0, 1]（或按场景在 [-1, +inf]）"]

  - id: VO-010
    name: "IdempotencyKey / 幂等键"
    immutable: true
    equality: value-based
    fields:
      - {name: sha256_hex_prefix, type: "str (32-char)", description: "SHA-256 计算的 128-bit 前缀"}
    invariants: ["SHA-256 计算确定；32 hex 字符定长"]

  - id: VO-011
    name: "LineageRoot / 血缘追溯根"
    immutable: true
    equality: value-based
    fields:
      - {name: root_id, type: "str (UUID v7)", description: "根节点 ID"}
      - {name: parents, type: "List[str]", description: "父节点列表"}
    invariants: ["DAG（不能成环）"]

  - id: VO-012
    name: "Side / 交易方向"
    immutable: true
    equality: value-based
    fields:
      - {name: value, type: "Enum[BUY, SELL, SHORT, COVER]", description: "方向枚举"}
    invariants: ["固定枚举"]

