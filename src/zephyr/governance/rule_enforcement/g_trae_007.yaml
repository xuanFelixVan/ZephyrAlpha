module_id: MOD-GATE_ENGINE
schema_version: '1.0'
doc_type: gate
gate_id: G_TRAE_007
gate_name: g_trae_007
title: G_TRAE_007 Gate — 防幻觉-行为约束层
description: 自动化门禁：强制执行 TRAE-007（防幻觉-行为约束层）规则。将规则从文档约束升级为phase_gate自动阻断。
rule_ids:
- TRAE-007
status: active
ttl: permanent
scope: global
category: compliance
owner: MOD-GATE_ENGINE
consumer: gate_engine
ai_autonomy: autonomous
token_budget: 200
latency_budget_ms: 500
execution_plane: warm
trigger:
  event: phase_transition
  precondition: task.status == 'IN_PROGRESS' or task.status == 'COMPLETED'
  frequency: per_task
depends_on_gates:
- G0
blocked_by_gates: []
parallel_allowed_with: []
entry_conditions:
- id: G_TRAE_007-C00
  name: anti_hall_07_check
  type: classification
  description: '任务状态机——status枚举合法性 (rule: TRAE-007)'
  check: rule_yaml_valid and conditions_met["anti_hall_07"]
  severity: error
  on_failure: reject
  verifiable: true
  verification_method: python tests/test_g_trae_007.py
  rule_ids:
  - TRAE-007
  anti_pattern:
    description: 存在TODO/.../pass/NotImplementedError
    example: AI ignores TRAE-007 anti_hall_07 requirement
  params:
    field: status
    allowed_values:
    - PENDING
    - IN_PROGRESS
    - BLOCKED
    - COMPLETED
    - CANCELLED
    require_present: true
mutating_rules: []
severity_levels:
  error: 硬阻断——任务不得推进，raise GateViolationError
  warning: 软警告——passed=True，写入events警告流
  info: 仅记录——不告警不阻塞
failure_actions:
  reject: 拒绝——返回错误，对象停留在当前状态
  flag: 标记——通过但附加warning flag
simulation:
  supported: true
  mock_input: tests/fixtures/g_trae_007_mock.yaml
  expected_output: passed=True when rule conditions met
  rollback_on_failure: true
upgrade_triggers:
- condition: Rule TRAE-007 YAML updated with new sections
  action: version bump + update entry_conditions
  approval: MOD-GATE_ENGINE owner
change_log:
- version: 0.1.0
  date: '2026-06-22'
  author: session-20260622-gate-batch
  change: 初始创建 — 自动生成自 TRAE-007 规则YAML
phase: PHASE_0_SKELETON
auto: true
on_failure: reject
on_pass: pass
