module_id: MOD-GATE_ENGINE
schema_version: '1.0'
doc_type: gate
gate_id: G_TRAE_059
gate_name: g_trae_059
title: G_TRAE_059 Gate — _schema_version 写入保护 + 版本一致性
description: >
  自动化门禁：强制执行 TRAE-059（_schema_version 写入保护规范）。
  两层检查：(1) AST 扫描检测非 depgraph_schema.py 对 _schema_version 的写入操作；
  (2) DB 状态校验 _schema_version.MAX(version) == _MIGRATIONS 最大版本号。
  根因：DM-202947 止血修复发现 path_tree/dm106 脚本非法覆写 _schema_version，根因是缺少门禁。
rule_ids:
- TRAE-059
- TRAE-054
status: active
ttl: permanent
scope: global
category: compliance
owner: MOD-GATE_ENGINE
consumer: gate_engine
ai_autonomy: autonomous
token_budget: 200
latency_budget_ms: 1000
execution_plane: warm
trigger:
  event: phase_transition
  precondition: task.status == 'IN_PROGRESS' or task.status == 'COMPLETED'
  frequency: per_task
depends_on_gates:
- G0
blocked_by_gates: []
parallel_allowed_with: []
entry_conditions:
- id: G_TRAE_059-C00
  name: schema_version_ast_scan
  type: ast_scan
  description: >
    AST 扫描：检测非 depgraph_schema.py 文件中对 _schema_version 表的
    INSERT/UPDATE/REPLACE 操作。扫描范围 src/zephyr/、scripts/、tests/。
    白名单：src/zephyr/governance/depgraph_schema.py（唯一合法写入入口）。
  check: ast_scan_no_violations
  severity: error
  on_failure: reject
  verifiable: true
  verification_method: python scripts/governance/check_schema_version_writes.py
  rule_ids:
  - TRAE-059
  anti_pattern:
    description: 非 depgraph_schema.py 脚本执行 INSERT/UPDATE/REPLACE INTO _schema_version
    example: generate_project_path_tree.py 中 INSERT OR REPLACE INTO _schema_version VALUES(4,...)
  params:
    scan_targets:
    - src/zephyr/
    - scripts/
    - tests/
    scan_pattern: '_schema_version.*INSERT|INSERT.*_schema_version|UPDATE.*_schema_version|REPLACE.*_schema_version'
    whitelist:
    - src/zephyr/governance/depgraph_schema.py
- id: G_TRAE_059-C01
  name: schema_version_db_consistency
  type: db_state_check
  description: >
    DB 状态校验：depgraph 的 _schema_version.MAX(version) 必须等于
    depgraph_schema.py 的 _MIGRATIONS 列表最大版本号。不一致表示迁移未完成或被手动篡改。
  check: db_schema_version_matches_migrations
  severity: error
  on_failure: reject
  verifiable: true
  verification_method: python scripts/governance/check_schema_version_writes.py --db-check
  rule_ids:
  - TRAE-059
  anti_pattern:
    description: _schema_version 表中 MAX(version) 与 _MIGRATIONS 最大版本号不一致
    example: DB 中 MAX(version)=7 但 _MIGRATIONS 定义到 v8（迁移未完成或被手动篡改）
  params:
    db_path: postgresql://localhost:5432/depgraph
    migrations_module: zephyr.governance.depgraph_schema._MIGRATIONS
mutating_rules: []
severity_levels:
  error: 硬阻断——任务不得推进，raise GateViolationError
  warning: 软警告——passed=True，写入events警告流
  info: 仅记录——不告警不阻塞
failure_actions:
  reject: 拒绝——返回错误，对象停留在当前状态
  flag: 标记——通过但附加warning flag
simulation:
  supported: true
  mock_input: tests/fixtures/g_trae_059_mock.yaml
  expected_output: passed=True when no violations found and DB version matches
  rollback_on_failure: true
upgrade_triggers:
- condition: Rule TRAE-059 YAML updated with new sections
  action: version bump + update entry_conditions
  approval: MOD-GATE_ENGINE owner
change_log:
- version: 0.1.0
  date: '2026-06-24'
  author: DM-202949
  change: 初始创建 — _schema_version 写入保护 + 版本一致性 gate
phase: PHASE_0_SKELETON
auto: true
on_failure: reject
on_pass: pass
