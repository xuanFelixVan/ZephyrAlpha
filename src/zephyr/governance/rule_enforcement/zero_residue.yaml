module_id: MOD-GATE_ENGINE
gate_id: "ZERO-RESIDUE"
name: "ZERO-RESIDUE Zero Residue Scanner"
description: >
  零残留原则自动化执行层——每次 GateEngine.evaluate("ZERO-RESIDUE") 触发时，
  自动运行全量残留扫描（ZeroResidueScanner），聚合 5 个已有检测脚本。
  对标 IRN-011（ai-behavior-iron-policy.md）9 条零残留规则（ZR-001~009）。
phase: "治理"
auto: true
on_failure: "reject"
on_pass: "pass"
rule_ids:
  - TRAE-005

checks:
  - id: "ZR-CHK-FULL"
    name: "Zero Residue Full Scan (ZR-001~009)"
    type: "zero_residue_check"
    severity: "error"
    rule_ids:
      - TRAE-005
    description: >
      全量零残留扫描——聚合 detect_temp_files.py / detect_residual_files.py /
      detect_orphan_py.py / detect_orphan_documents.py / detect_ruins_references.py
      五项检测，零残留违规即阻断。
