module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
title: "G4 Activate Gate"
status: active
ttl: permanent

gate_id: G4
gate_name: activate
description: "Activate stage admission gate - ensures dependencies are ready and no conflicts exist before knowledge entry is activated"
rule_ids:
  - TRAE-002

entry_conditions:
  - id: G4-C01
    name: dependencies_ready
    description: "All referenced dependencies (other KEs, modules, configs) must exist and be active"
    check: "all dep.status == 'active' for dep in doc.dependencies"
    severity: error
    on_failure: defer
    defer_action: "Add to deferred_queue with missing dependency list"
    verifiable: true
    verification_method: "Unit test with missing dependency"
    rule_ids:
      - TRAE-002

  - id: G4-C02
    name: no_conflict_with_existing
    description: "New knowledge entry must not conflict with existing active entries"
    check: "no contradiction detected between new KE and existing active KEs"
    severity: error
    on_failure: flag
    conflict_resolution: "Manual review required; flag for Owner decision"
    verifiable: true
    verification_method: "Unit test with contradictory KE"
    rule_ids:
      - TRAE-002

  - id: G4-C03
    name: target_path_compliant
    description: "Knowledge entry target path must follow the KMS directory structure"
    check: "doc.target_path matches docs/08_knowledge/{subdir}/ke-*.md pattern"
    severity: error
    on_failure: reject
    verifiable: true
    verification_method: "Unit test with non-compliant target path"
    rule_ids:
      - TRAE-002

  - id: G4-C04
    name: frontmatter_schema_valid
    description: "Knowledge entry frontmatter must conform to the KE schema"
    check: "doc.frontmatter matches kms-entry-schema.md"
    severity: error
    on_failure: reject
    verifiable: true
    verification_method: "Unit test with invalid KE frontmatter"
    rule_ids:
      - TRAE-002

  - id: G4-C05
    name: module_id_registered
    description: "Knowledge entry module_id must be registered in the module ID registry"
    check: "doc.module_id in MODULE_ID_REGISTRY"
    severity: warning
    on_failure: auto_register
    auto_register_rule: "Register new module_id if it follows naming convention"
    verifiable: true
    verification_method: "Unit test with unregistered module_id"
    rule_ids:
      - TRAE-002

  - id: G4-C06
    name: no_orphan_references
    description: "Knowledge entry must not reference non-existent files or modules"
    check: "all ref exists for ref in doc.references"
    severity: warning
    on_failure: flag
    verifiable: true
    verification_method: "Unit test with broken reference"
    rule_ids:
      - TRAE-002

deferred_queue:
  description: "Documents waiting for dependencies to become ready"
  max_wait_time: 72h
  retry_interval: 1h
  on_timeout: "Flag for manual review"
