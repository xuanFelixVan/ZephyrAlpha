# --- 治理锚定 ---
# blueprint: MOD-GATE_ENGINE | docs/03_modules/_cross_layer/gates/blueprint.md | §
# module_id: MOD-GATE_ENGINE
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: task_bound
# --- 治理锚定结束 ---
# _template.yaml — ZephyrAlpha Gate Template v1.0.0
# 门禁标准模板——AI agent 复制此文件创建新门禁
# 对标: K8s Admission Controller + OPA Rego Policy + Cursor Rules + Windsurf Rules
# 真源: GOV-ARCH-006 gate-strategy-standard.md §七 + MOD-GATE_ENGINE blueprint

# ═══════════════════════════════════════════════════════════
# 1. 门禁身份（必填）
# ═══════════════════════════════════════════════════════════
module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
gate_id: "<G{N}|MAD-{NNN}|LC-{NNN}>"
gate_name: "<kebab-case-slug>"
title: "<Human Readable Title>"
description: "<一句话职责描述，≤200字>"
status: draft
ttl: permanent

# ═══════════════════════════════════════════════════════════
# 2. 门禁归属与所有权（必填）
# ═══════════════════════════════════════════════════════════
scope: "<global|layer:<LXX>|module:<MOD-XXX>>"
category: "<kms|task|admission|lifecycle|compliance|module>"
owner: "<谁创建并维护此门禁>"
consumer: gate_engine
ai_autonomy: "<autonomous|human_gated>"

# ═══════════════════════════════════════════════════════════
# 3. 性能与资源预算（必填）
# ═══════════════════════════════════════════════════════════
token_budget: <N>
latency_budget_ms: <N>
execution_plane: "<hot|warm|cold>"

# ═══════════════════════════════════════════════════════════
# 4. 触发条件（必填）
# ═══════════════════════════════════════════════════════════
trigger:
  event: "<状态机事件或显式调用>"
  precondition: "<前置条件——可执行的布尔表达式>"
  frequency: "<per_request|per_task|per_phase|per_day>"

# ═══════════════════════════════════════════════════════════
# 5. 依赖关系（必填）
# ═══════════════════════════════════════════════════════════
depends_on_gates: []
blocked_by_gates: []
parallel_allowed_with: []

# ═══════════════════════════════════════════════════════════
# 6. 检查项（必填——至少1条）
# ═══════════════════════════════════════════════════════════
entry_conditions:
  - id: "<GATE_ID>-C00"
    name: "<snake_case_slug>"
    type: "<check_type>"
    description: "<检查内容——≤300字>"
    check: "<确定性校验逻辑——禁止问句，AI可直接转代码>"
    severity: "<error|warning|info>"
    on_failure: "<reject|auto_fix|flag|defer|auto_assign>"
    verifiable: true
    verification_method: "<单元测试方法>"
    fix_hint: "<on_failure=auto_fix时必填——自动修正步骤>"
    anti_pattern:
      description: "<违反本规则会导致什么后果>"
      example: "<AI agent最容易犯的具体错误示例>"

# ═══════════════════════════════════════════════════════════
# 7. Mutating规则（可选——自动修正）
# ═══════════════════════════════════════════════════════════
mutating_rules: []

# ═══════════════════════════════════════════════════════════
# 8. 严重级别与失败动作说明（必填——仅文档，非机读）
# ═══════════════════════════════════════════════════════════
severity_levels:
  error: "硬阻断——任务不得推进，raise GateViolationError"
  warning: "软警告——passed=True，写入events警告流"
  info: "仅记录——不告警不阻塞"

failure_actions:
  reject: "拒绝——返回错误，对象停留在当前状态"
  auto_fix: "自动修正——执行fix_hint后重新验证"
  flag: "标记——通过但附加warning flag"
  defer: "延迟——进入deferred_queue等待依赖就绪"
  auto_assign: "自动分配——引擎自动填充缺失字段"

# ═══════════════════════════════════════════════════════════
# 9. 模拟与测试（必填）
# ═══════════════════════════════════════════════════════════
simulation:
  supported: true
  mock_input: "<模拟输入数据路径>"
  expected_output: "<期望判定结果>"
  rollback_on_failure: true

# ═══════════════════════════════════════════════════════════
# 10. 升级触发条件（必填）
# ═══════════════════════════════════════════════════════════
upgrade_triggers:
  - condition: "<什么情况下必须升级本门禁>"
    action: "<version bump + change_log>"
    approval: "<谁批准>"

# ═══════════════════════════════════════════════════════════
# 11. 变更记录（必填）
# ═══════════════════════════════════════════════════════════
change_log:
  - version: "0.1.0"
    date: "<YYYY-MM-DD>"
    author: "<creator>"
    change: "初始创建"
