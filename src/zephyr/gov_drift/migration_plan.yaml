# ZephyrAlpha — Drift Detector 供应商迁移计划（§6.19）
# module_id: MOD-INF-023
# 声明式时间表 + 影响模块列表

module_id: MOD-INF-011
migration_plan:
  plan_id: "MOD-INF-023-migration-2026"

  phases:
    - phase: "Phase 1: SQLite -> PostgreSQL"
      target: "2026-Q3"
      status: "planned"
      affected_modules:
        - "drift_engine.db"
        - "gate_persistence.db"
        - "baseline_manager.db"
      adapters:
        - sqlite3
        - psycopg2
      strategy: "sqlalchemy dialect swap"
      risk: "MEDIUM"
      rollback: "restore_sqlite_backup"
      validation: "db_schema_drift detector + alembic stamp"

    - phase: "Phase 2: PostgreSQL -> DuckDB (analytics)"
      target: "2026-Q4"
      status: "planned"
      affected_modules:
        - "trend_analyzer"
        - "correlation_engine"
        - "dashboard"
      adapters:
        - duckdb
        - psycopg2
      strategy: "dual-write transitional period"
      risk: "LOW"
      rollback: "switch back to PostgreSQL analytics"
      validation: "trend_analyzer self-test + dashboard smoke test"

    - phase: "Phase 3: Notification migration plan"
      target: "2026-Q3"
      status: "planned"
      services:
        - name: "Feishu"
          type: "webhook"
          priority: "P0"
          fallback: "CLI alert to terminal"
        - name: "Slack"
          type: "webhook"
          priority: "P1"
          fallback: "Feishu"
        - name: "Email"
          type: "SMTP"
          priority: "P2"
          fallback: "Slack"
      affected_modules:
        - "alert_router"
        - "drift_engine"
        - "handoff_manager"
      validation: "alert_router self-test + notification delivery check"

  vendor_lock_risk_assessment:
    - vendor: "SQLite"
      lock_degree: "HIGH"
      migration_difficulty: "MEDIUM"
      mitigation: "ORM abstraction layer (sqlalchemy)"
      drift_detection: "db_schema_drift across sqlite_master vs ORM"

    - vendor: "PyYAML"
      lock_degree: "LOW"
      migration_difficulty: "LOW"
      mitigation: "ruamel.yaml as drop-in replacement"
      drift_detection: "yaml load/dump roundtrip integrity check"

    - vendor: "Feishu"
      lock_degree: "MEDIUM"
      migration_difficulty: "LOW"
      mitigation: "alert_router abstraction: send(provider, message)"
      drift_detection: "notification delivery check across providers"
