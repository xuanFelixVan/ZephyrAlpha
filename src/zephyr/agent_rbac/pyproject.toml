[tool.poetry]
name = "zephyr-agent-rbac"
version = "0.14.0"
description = "ZephyrAlpha Agent 身份与权限系统 — 七层纵深防御 + 六横切面 Runtime RBAC 11.3"
authors = ["ZephyrAlpha Team"]
license = "Proprietary"
readme = "README.md"
packages = [{include = "agent_rbac", from = "src/zephyr"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = ">=2.0"
pyyaml = "^6.0"
cryptography = ">=41.0"
opentelemetry-api = ">=1.20"
ed25519 = ">=1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.23"
pytest-cov = "^4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests/agent_rbac"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
