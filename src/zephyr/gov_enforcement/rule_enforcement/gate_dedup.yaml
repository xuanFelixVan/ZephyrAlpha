module_id: MOD-GATE_ENGINE
gate_id: "GATE-DEDUP"
name: "GATE-DEDUP Code Deduplication Gate"
description: >
  代码去重门禁——每次 GateEngine.evaluate("GATE-DEDUP") 触发时，
  调用 code_dedup_engine Scanner 执行增量扫描，根据退出码判定 PASS/WARN/BLOCK/SKIP/DEGRADED。
  对标 MOD-INF-017 蓝图 §12 集成目标。
phase: "基础设施"
auto: true
on_failure: "reject"
on_pass: "pass"
rule_ids:
  - TRAE-002

checks:
  - id: "DD-CHK-INCREMENTAL"
    name: "Incremental Dedup Scan"
    type: "deduplication"
    severity: "error"
    rule_ids:
      - TRAE-002
    params:
      scan_mode: "incremental"
      fail_on_severity: "high"
    description: >
      增量去重扫描——仅扫描 git diff 变更文件。
      exit 0=PASS, exit 1=WARN(低/中重复), exit 2=BLOCK(high/critical重复),
      exit 3=SKIP(引擎故障), exit 4=DEGRADED(降级运行)
