module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
title: "SYS-MASTER-001 Compliance Gate"
status: active
ttl: permanent

gate_id: SYS-MASTER-CMP
gate_name: sys_master_compliance
description: "系统总蓝图合规门禁——验证 SYS-MASTER-001（三级金字塔顶点）与 MOD-MASTER-001 的集成链路完整性、冷启动序列引用、construction_progress 一致性及 76 条 ai_role_instruction 规则无回归。"
rule_ids:
  - TRAE-013
  - TRAE-014

entry_conditions:
  - id: SYS-C00
    name: blueprint_existence
    type: file_existence
    description: "验证 SYS-MASTER-001 和 MOD-MASTER-001 蓝图文件均存在且可读"
    check: "docs/03_modules/_system_master/blueprint.md exists AND docs/03_modules/_master-blueprint/blueprint.md exists"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C01
    name: cold_start_integration
    type: content_reference
    description: "验证 project_rules.md 冷启动序列直接引用 SYS-MASTER-001"
    check: ".trae/rules/project_rules.md contains SYS-MASTER-001 or _system_master reference in cold start sequence"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C02
    name: depends_on_integrity
    type: cross_reference
    description: "验证 SYS-MASTER-001 depends_on 正确引用 MOD-MASTER-001"
    check: "SYS-MASTER-001 frontmatter depends_on contains MOD-MASTER-001"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C03
    name: construction_progress_consistency
    type: registry_consistency
    description: "验证 SYS-MASTER-001 construction_progress 在 frontmatter/blueprint-registry/module-registry 三者一致"
    check: "all three sources agree on construction_progress value"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C04
    name: ai_rules_count
    type: content_count
    description: "验证 SYS-MASTER-001 包含 76 条 ai_role_instruction 规则（无回归）"
    check: "count of numbered rules in ai_role_instruction >= 76"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C05
    name: gate_registry_entry
    type: registry_reference
    description: "验证 SYS-MASTER-CMP 已在 _registry.yaml 登记"
    check: "src/zephyr/autonomy_core/gates/_registry.yaml contains gate_id: SYS-MASTER-CMP"
    severity: warning
    on_failure: warn
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: SYS-C06
    name: crosscheck_script_pass
    type: script_health
    description: "验证 crosscheck_sys_master_deps.py 执行 exit 0"
    check: "python scripts/governance/crosscheck_sys_master_deps.py exit code = 0"
    severity: error
    on_failure: reject
    verifiable: true
    rule_ids:
      - TRAE-013
      - TRAE-014

severity_levels:
  error: "Hard block——任务被拒绝，必须先修复 SYS-MASTER-001 合规性"
  warning: "Soft warning——记录 Finding，不阻止施工"

failure_actions:
  reject: "返回 GateViolationError 并列出失败的具体检查项"
  hint: "AI agent：运行 python scripts/governance/crosscheck_sys_master_deps.py 诊断具体问题"

