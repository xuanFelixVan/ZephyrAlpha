module_id: MOD-GATE_ENGINE
schema_version: '1.0'
doc_type: gate
gate_id: G_TRAE_035
gate_name: g_trae_035
title: G_TRAE_035 Gate — 任务系统-施工与验证
description: 自动化门禁：强制执行 TRAE-035（任务系统-施工与验证）规则。将规则从文档约束升级为phase_gate自动阻断。
rule_ids:
- TRAE-035
status: active
ttl: permanent
scope: global
category: compliance
owner: MOD-GATE_ENGINE
consumer: gate_engine
ai_autonomy: autonomous
token_budget: 200
latency_budget_ms: 500
execution_plane: warm
trigger:
  event: phase_transition
  precondition: task.status == 'IN_PROGRESS' or task.status == 'COMPLETED'
  frequency: per_task
depends_on_gates:
- G0
blocked_by_gates: []
parallel_allowed_with: []
entry_conditions:
- id: G_TRAE_035-C00
  name: task_002_construction_check
  type: field_presence
  description: '施工验证——acceptance非空 (rule: TRAE-035)'
  check: rule_yaml_valid and conditions_met["task_002_construction"]
  severity: error
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_035.py
  rule_ids:
  - TRAE-035
  anti_pattern:
    description: prohibition violated
    example: AI ignores TRAE-035 task_002_construction requirement
  params: &id001
    required_fields:
    - task_id
    - title
    - description
    - acceptance
- id: G_TRAE_035-C01
  name: task_002_plan_audit_gate_check
  type: field_presence
  description: '施工验证——acceptance非空 (rule: TRAE-035)'
  check: rule_yaml_valid and conditions_met["task_002_plan_audit_gate"]
  severity: error
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_035.py
  rule_ids:
  - TRAE-035
  anti_pattern:
    description: 跳过审查直接执行导致计划数据失真
    example: AI ignores TRAE-035 task_002_plan_audit_gate requirement
  params: *id001
- id: G_TRAE_035-C02
  name: task_002疏通_check
  type: field_presence
  description: '施工验证——acceptance非空 (rule: TRAE-035)'
  check: rule_yaml_valid and conditions_met["task_002疏通"]
  severity: error
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_035.py
  rule_ids:
  - TRAE-035
  anti_pattern:
    description: 继续施工
    example: AI ignores TRAE-035 task_002疏通 requirement
  params: *id001
- id: G_TRAE_035-C03
  name: task_003_panorama_alignment_check
  type: field_presence
  description: '施工验证——acceptance非空 (rule: TRAE-035)'
  check: rule_yaml_valid and conditions_met["task_003_panorama_alignment"]
  severity: error
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_035.py
  rule_ids:
  - TRAE-035
  anti_pattern:
    description: 可豁免(但仍需循环验收)
    example: AI ignores TRAE-035 task_003_panorama_alignment requirement
  params: *id001
mutating_rules: []
severity_levels:
  error: 硬阻断——任务不得推进，raise GateViolationError
  warning: 软警告——passed=True，写入events警告流
  info: 仅记录——不告警不阻塞
failure_actions:
  reject: 拒绝——返回错误，对象停留在当前状态
  flag: 标记——通过但附加warning flag
simulation:
  supported: true
  mock_input: tests/fixtures/g_trae_035_mock.yaml
  expected_output: passed=True when rule conditions met
  rollback_on_failure: true
upgrade_triggers:
- condition: Rule TRAE-035 YAML updated with new sections
  action: version bump + update entry_conditions
  approval: MOD-GATE_ENGINE owner
change_log:
- version: 0.1.0
  date: '2026-06-22'
  author: session-20260622-gate-batch
  change: 初始创建 — 自动生成自 TRAE-035 规则YAML
phase: PHASE_0_SKELETON
auto: true
on_failure: reject
on_pass: pass
