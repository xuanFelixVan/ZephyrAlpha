module_id: MOD-GATE_ENGINE
schema_version: '1.0'
doc_type: gate
gate_id: G_TRAE_004
gate_name: g_trae_004
title: G_TRAE_004 Gate — 并行执行与原子事务协议
description: 自动化门禁：强制执行 TRAE-004（并行执行与原子事务协议）规则。将规则从文档约束升级为phase_gate自动阻断。
rule_ids:
- TRAE-004
status: active
ttl: permanent
scope: global
category: compliance
owner: MOD-GATE_ENGINE
consumer: gate_engine
ai_autonomy: autonomous
token_budget: 200
latency_budget_ms: 500
execution_plane: warm
trigger:
  event: phase_transition
  precondition: task.status == 'IN_PROGRESS' or task.status == 'COMPLETED'
  frequency: per_task
depends_on_gates:
- G0
blocked_by_gates: []
parallel_allowed_with: []
entry_conditions:
- id: G_TRAE_004-C00
  name: parallel_execution_check
  type: field_presence
  description: '任务卡创建协议——核心字段非空 (rule: TRAE-004)'
  check: rule_yaml_valid and conditions_met["parallel_execution"]
  severity: error
  on_failure: reject
  verifiable: true
  verification_method: python tests/test_g_trae_004.py
  rule_ids:
  - TRAE-004
  anti_pattern:
    description: 全NO->可串行
    example: AI ignores TRAE-004 parallel_execution requirement
  params: &id001
    required_fields:
    - task_id
    - title
    - description
    - status
- id: G_TRAE_004-C01
  name: atomic_transaction_check
  type: field_presence
  description: '任务卡创建协议——核心字段非空 (rule: TRAE-004)'
  check: rule_yaml_valid and conditions_met["atomic_transaction"]
  severity: error
  on_failure: reject
  verifiable: true
  verification_method: python tests/test_g_trae_004.py
  rule_ids:
  - TRAE-004
  anti_pattern:
    description: 分批=事务断裂
    example: AI ignores TRAE-004 atomic_transaction requirement
  params: *id001
mutating_rules: []
severity_levels:
  error: 硬阻断——任务不得推进，raise GateViolationError
  warning: 软警告——passed=True，写入events警告流
  info: 仅记录——不告警不阻塞
failure_actions:
  reject: 拒绝——返回错误，对象停留在当前状态
  flag: 标记——通过但附加warning flag
simulation:
  supported: true
  mock_input: tests/fixtures/g_trae_004_mock.yaml
  expected_output: passed=True when rule conditions met
  rollback_on_failure: true
upgrade_triggers:
- condition: Rule TRAE-004 YAML updated with new sections
  action: version bump + update entry_conditions
  approval: MOD-GATE_ENGINE owner
change_log:
- version: 0.1.0
  date: '2026-06-22'
