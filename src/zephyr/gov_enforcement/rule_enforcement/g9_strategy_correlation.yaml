# blueprint: MOD-GATE_ENGINE | docs/03_modules/_cross_layer/gates/blueprint.md | §
# module_id: MOD-GATE_ENGINE
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: task_bound
# --- 治理锚定结束 ---
module_id: MOD-GATE_ENGINE
gate_id: "G12"
name: "策略相关性门禁 (Strategy Correlation Gate)"
phase: "validate"
category: "trading"
auto: true
scope: "trading"
description: >
  当 AI 生成新策略或修改现有策略时，检查新策略与已有策略的相关性。
  防止 AI 产生"策略集群"——5 个本质上相同的策略分散部署，
  在一个因子失效时同时失效（灾难性共振）。

on_failure: "reject"
on_pass: "pass"
activation_stage: "active"
rule_ids:
  - TRAE-019

checks:
  - id: "G9-C01"
    name: "strategy_correlation_threshold"
    description: >
      新策略与任意已有策略的持仓/回报相关性超过阈值（默认 0.85）时拒绝。
      阈值对标：PIMCO / BlackRock 多策略团队使用 0.70-0.80。
      之所以选 0.85 —— 对 AI 生成策略的宽容度（0.70 对 AI 过于严格）。
    type: "strategy_correlation"
    severity: "error"
    failure_policy: "Ignore"
    on_failure: "reject"
    rule_ids:
      - TRAE-019
    fix_hint: >
      {correlated_strategy} 与已有策略 {existing_strategy_name}
      的相关性为 {correlation_score:.2f}，超过阈值 {threshold}。
      可能的修复方向：
      1. 更换因子集合（添加不同风格的因子）
      2. 修改选股/择时逻辑（引入差异化信号）
      3. 改为子策略模式（作为现有策略的变体，共享风控）
    anti_pattern: >
      1. 复制策略 A，改变参数 n=14->n=20 -> 声称是"新策略"
      2. 修改策略名称但核心逻辑不变
      3. 对同一因子做不同时间窗口的平滑 -> 产生 3 个 "不同" 策略
    verifiable: true
    params:
      correlation_threshold: 0.85
      correlation_method: "pearson_returns"
      lookback_days: 252
      min_overlapping_days: 60

  - id: "G9-C02"
    name: "factor_overlap_ratio"
    description: >
      新策略使用的因子集合与已有策略的重叠率 > 60% 时警告。
      这比相关性更敏感 —— 能捕捉到因子几乎一致、
      但由于时间窗口/信号处理不同而产生不同输出的策略。
    type: "strategy_correlation"
    severity: "warning"
    failure_policy: "Ignore"
    on_failure: "flag"
    rule_ids:
      - TRAE-019
    fix_hint: >
      因子重叠率过高 ({overlap_ratio:.0%})。
      虽然当前相关性可能在阈值以下，但共享的因子集合
      使得两个策略在极端市场环境中容易同时失效。
      建议：至少在 1/3 的因子上使用不同的数据源或构建方法。
    params:
      max_factor_overlap: 0.60
      compare_factor_sets: true

  - id: "G9-C03"
    name: "universe_concentration_warning"
    description: >
      新策略的股票池与已有策略的股票池重叠率 > 70%，
      且行业集中度 > 50% 时警告。即使策略逻辑不同，
      在相同股票上操作意味着遭遇相似的流动性约束。
    type: "strategy_correlation"
    severity: "warning"
    failure_policy: "Ignore"
    on_failure: "flag"
    rule_ids:
      - TRAE-019
    params:
      max_universe_overlap: 0.70
      max_sector_concentration: 0.50
