- id: G_TRAE_055-C03
  name: arch_cap_002_domain_capacity_limit_check
  type: field_presence
  description: '同步标准——post_sync_standard非空 (rule: TRAE-055)'
  check: rule_yaml_valid and conditions_met["arch_cap_002_domain_capacity_limit"]
  severity: error
  on_failure: reject
