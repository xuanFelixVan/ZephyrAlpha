    example: AI ignores TRAE-055 arch_cap_001_module_definition requirement
  params: &id001
    required_fields:
    - task_id
    - title
    - description
    - post_sync_standard
- id: G_TRAE_055-C01
  name: arch_cap_001_module_definition_check
  type: field_presence
  description: '同步标准——post_sync_standard非空 (rule: TRAE-055)'
  check: rule_yaml_valid and conditions_met["arch_cap_001_module_definition"]
