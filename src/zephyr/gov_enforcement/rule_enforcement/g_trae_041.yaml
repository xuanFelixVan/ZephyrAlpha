    description: 跳过验证级别
    example: AI ignores TRAE-041 ps_std_012_v1_v4 requirement
  params: *id001
mutating_rules: []
severity_levels:
  error: 硬阻断——任务不得推进，raise GateViolationError
  warning: 软警告——passed=True，写入events警告流
  info: 仅记录——不告警不阻塞
failure_actions:
  reject: 拒绝——返回错误，对象停留在当前状态
  flag: 标记——通过但附加warning flag
simulation:
  supported: true
  mock_input: tests/fixtures/g_trae_041_mock.yaml
