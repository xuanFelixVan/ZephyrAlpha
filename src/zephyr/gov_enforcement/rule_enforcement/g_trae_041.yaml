depends_on_gates:
- G0
blocked_by_gates: []
parallel_allowed_with: []
entry_conditions:
- id: G_TRAE_041-C00
  name: ps_std_004_new_domain_check
  type: field_presence
  description: '模块生命周期——任务元数据完整 (rule: TRAE-041)'
  check: rule_yaml_valid and conditions_met["ps_std_004_new_domain"]
  severity: warning
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_041.py
  rule_ids:
  - TRAE-041
  anti_pattern:
    description: 未经批准新增领域
    example: AI ignores TRAE-041 ps_std_004_new_domain requirement
  params: &id001
    required_fields:
    - task_id
    - title
    - description
- id: G_TRAE_041-C01
  name: ps_std_012_v1_v4_check
  type: field_presence
  description: '模块生命周期——任务元数据完整 (rule: TRAE-041)'
  check: rule_yaml_valid and conditions_met["ps_std_012_v1_v4"]
  severity: warning
  on_failure: flag
  verifiable: true
  verification_method: python tests/test_g_trae_041.py
  rule_ids:
  - TRAE-041
