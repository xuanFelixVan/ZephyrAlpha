module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
title: "G5 Extract Gate"
status: active
ttl: permanent

gate_id: G5
gate_name: extract
description: "Extract stage admission gate - ensures extraction templates are ready and target paths are compliant before knowledge extraction begins"
rule_ids:
  - TRAE-002

entry_conditions:
  - id: G5-C01
    name: extraction_template_ready
    description: "An appropriate extraction template must exist for the document type"
    check: "doc.doc_type in EXTRACTION_TEMPLATES"
    severity: error
    on_failure: reject
    verifiable: true
    verification_method: "Unit test with doc_type lacking template"
    rule_ids:
      - TRAE-002

  - id: G5-C02
    name: target_path_available
    description: "Target path for extracted knowledge must be available (no overwrite without approval)"
    check: "not os.path.exists(target_path) or overwrite_approved"
    severity: error
    on_failure: flag
    verifiable: true
    verification_method: "Unit test with existing target path"
    rule_ids:
      - TRAE-002

  - id: G5-C03
    name: target_path_compliant
    description: "Target path must follow the knowledge base directory structure"
    check: "target_path matches docs/08_knowledge/{category}/ke-{NNN}-{name}.md"
    severity: error
    on_failure: reject
    verifiable: true
    verification_method: "Unit test with non-compliant target path"
    rule_ids:
      - TRAE-002

  - id: G5-C04
    name: ke_number_assigned
    description: "Knowledge entry number must be assigned and unique"
    check: "KE number > current_max_KE and not already used"
    severity: error
    on_failure: auto_assign
    auto_assign_rule: "Increment from current max KE number"
    verifiable: true
    verification_method: "Unit test with duplicate KE number"
    rule_ids:
      - TRAE-002

  - id: G5-C05
    name: source_document_complete
    description: "Source document must be fully processed (no pending ingest/triage issues)"
    check: "doc.gate_status in ['passed_g4', 'active']"
    severity: error
    on_failure: reject
    verifiable: true
    verification_method: "Unit test with document in earlier gate stage"
    rule_ids:
      - TRAE-002

  - id: G5-C06
    name: extraction_scope_defined
    description: "Extraction scope must be clearly defined (which sections to extract)"
    check: "doc.extraction_scope is not empty"
    severity: warning
    on_failure: auto_scope
    auto_scope_rule: "Extract all sections matching knowledge patterns"
    verifiable: true
    verification_method: "Unit test with undefined extraction scope"
    rule_ids:
      - TRAE-002

extraction_templates:
  blueprint:
    template: "templates/extract_blueprint.py"
    fields: [design_decisions, interfaces, constraints, dependencies]
  strategy:
    template: "templates/extract_strategy.py"
    fields: [strategy_logic, parameters, risk_rules, backtest_results]
  factor:
    template: "templates/extract_factor.py"
    fields: [factor_formula, computation_logic, pit_rules, performance_metrics]
  best_practice:
    template: "templates/extract_best_practice.py"
    fields: [practice_description, rationale, applicability, anti_patterns]
  lesson_learned:
    template: "templates/extract_lesson.py"
    fields: [incident_description, root_cause, fix_action, prevention]

post_extraction_checks:
  - "Extracted content is non-empty"
  - "Extracted frontmatter is valid per KE schema"
  - "No data loss compared to source (spot check)"
  - "Cross-references in extracted content are valid"
