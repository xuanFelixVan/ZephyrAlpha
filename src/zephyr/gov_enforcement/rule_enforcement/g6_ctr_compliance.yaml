module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
title: "G6 CTR Contract Compliance Gate"
status: active
ttl: permanent

gate_id: G6
gate_name: ctr_compliance
description: "CTR contract compliance gate - ensures all data through reporting domain modules use standardized cross-layer data contracts from shared/contracts/ instead of defining their own data types"
rule_ids:
  - TRAE-013
  - TRAE-014

entry_conditions:
  - id: G6-C01
    name: no_self_defined_market_data
    description: "Data domain modules must not define their own MarketData/Tick types; must import NormalizedMarketData from shared/contracts/market_data.py"
    check: "for files under data_eng/ and market_data/, no class named MarketData/Tick/Bar/TradeData/Candle exists; NormalizedMarketData is imported from zephyr.shared.contracts.market_data"
    severity: error
    on_failure: reject
    applies_to: [data_eng, market_data]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C02
    name: no_self_defined_factor_signal
    description: "Factor domain modules must not define their own FactorSignal/Factor/value types; must import FactorSignal from shared/contracts/factor_signal.py"
    check: "for files under factor/, no class named FactorSignal/Factor/FactorValue/AlphaSignal exists; FactorSignal is imported from zephyr.shared.contracts.factor_signal"
    severity: error
    on_failure: reject
    applies_to: [factor]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C03
    name: no_self_defined_risk_limits
    description: "Risk domain modules must not define their own RiskLimits/Limit types; must import RiskLimits from shared/contracts/risk_limits.py"
    check: "for files under risk/, no class named RiskLimits/Limit/Constraint exists; RiskLimits is imported from zephyr.shared.contracts.risk_limits"
    severity: error
    on_failure: reject
    applies_to: [risk]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C04
    name: no_self_defined_order
    description: "Portfolio/Execution domain modules must not define their own Order/OrderRequest types; must import Order from shared/contracts/order.py"
    check: "for files under pf_core/ and ex_core/, no class named Order/OrderRequest/OrderCmd exists; Order is imported from zephyr.shared.contracts.order"
    severity: error
    on_failure: reject
    applies_to: [pf_core, pf_alloc, ex_core]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C05
    name: no_self_defined_fill
    description: "Execution domain modules must not define their own Fill/Execution types; must import Fill from shared/contracts/fill.py"
    check: "for files under ex_core/, no class named Fill/FillReport/Execution exists; Fill is imported from zephyr.shared.contracts.fill"
    severity: error
    on_failure: reject
    applies_to: [ex_core]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C06
    name: no_self_defined_position
    description: "Execution/Reporting domain modules must not define their own Position/PositionSnapshot types; must import PositionSnapshot from shared/contracts/position.py"
    check: "for files under ex_core/ and reporting/, no class named Position/PositionSnapshot/Holding exists; PositionSnapshot is imported from zephyr.shared.contracts.position"
    severity: error
    on_failure: reject
    applies_to: [ex_core, reporting]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C07
    name: no_float_in_money_fields
    description: "All data through reporting domain code must not use float for monetary values (price, amount, quantity, commission); must use Decimal"
    check: "for files under L2_domain modules, no field typed as float with names containing price/amount/cost/fee/commission/quantity/volume/value"
    severity: error
    on_failure: reject
    applies_to: [L2_domain]
    verifiable: true
    verification_method: "AST scan for float annotations on money-related fields"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G6-C08
    name: cross_layer_import_valid
    description: "Cross-layer data imports must come from shared/contracts/ or shared/__init__.py, not from other layer directories"
    check: "for files under any L2_domain directory, imports of data types used across layers come from zephyr.shared.contracts or zephyr.shared"
    severity: warning
    on_failure: flag
    applies_to: [L2_domain]
    verifiable: true
    verification_method: "AST scan for cross-layer imports from non-shared paths"
    rule_ids:
      - TRAE-013
      - TRAE-014

contract_registry:
  CTR-001:
    file: "src/zephyr/shared/contracts/market_data.py"
    type: "NormalizedMarketData"
    producer: "data"
    consumer: "factor"
  CTR-002:
    file: "src/zephyr/shared/contracts/factor_signal.py"
    type: "FactorSignal"
    producer: "factor"
    consumer: ["signal", "risk", "pf_core"]
  CTR-003:
    file: "src/zephyr/shared/contracts/risk_limits.py"
    type: "RiskLimits"
    producer: "risk"
    consumer: "pf_core"
  CTR-004:
    file: "src/zephyr/shared/contracts/order.py"
    type: "Order"
    producer: "pf_core"
    consumer: "ex_core"
  CTR-005:
    file: "src/zephyr/shared/contracts/fill.py"
    type: "Fill"
    producer: "ex_core"
    consumer: "reporting"
  CTR-006:
    file: "src/zephyr/shared/contracts/position.py"
    type: "PositionSnapshot"
    producer: ["ex_core", "reporting"]
    consumer: ["risk", "ml_train"]
