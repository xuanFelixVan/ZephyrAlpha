module_id: MOD-GATE_ENGINE
schema_version: "1.0"
doc_type: gate
title: "G8 SSoT Consistency Gate — frontmatter ↔ registry 双向一致性校验"
status: active
ttl: permanent

gate_id: G8
gate_name: ssot_consistency
description: "SSoT 一致性门禁——校验每份 blueprint.md 的 frontmatter construction_progress 与 blueprint_registry.yaml / module-registry.yaml 完全一致。不一致 = 注册表不可信 = 阻断。"
rule_ids:
  - TRAE-013
  - TRAE-014

entry_conditions:
  - id: G8-C01
    name: frontmatter_vs_blueprint_registry
    description: "对 docs/03_modules/**/blueprint.md 逐文件检查：frontmatter.construction_progress MUST == blueprint_registry.yaml 中同 module_id 的 construction_progress"
    check: |
      1. 扫描 docs/03_modules/**/blueprint.md 收集全部 module_id -> frontmatter.construction_progress
      2. 解析 blueprint_registry.yaml -> module_id -> construction_progress
      3. 逐对比较：任一不等 -> 注册为矛盾（列出 frontmatter 值 vs registry 值）
      4. 排除 blocked_by_infrastructure 状态的 C 轨模块（本身不允许施工，不参与比较）
    severity: error
    on_failure: reject
    applies_to: [docs, registries]
    verifiable: true
    verification_method: "YAML/script 双重解析 + 逐 module_id 对账"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G8-C02
    name: frontmatter_vs_module_registry
    description: "对 docs/03_modules/**/blueprint.md 逐文件检查：frontmatter.construction_progress MUST == module-registry.yaml 中同 module_id 的 construction_plan.status"
    check: |
      1. 扫描 docs/03_modules/**/blueprint.md 收集全部 module_id -> frontmatter.construction_progress
      2. 解析 module-registry.yaml -> module_id -> construction_plan.status
      3. 逐对比较：任一不等 -> 注册为矛盾
    severity: error
    on_failure: reject
    applies_to: [docs, registries]
    verifiable: true
    verification_method: "YAML/script 双重解析 + 逐 module_id 对账"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G8-C03
    name: registry_cross_consistency
    description: "blueprint_registry.yaml 的 construction_progress MUST == module-registry.yaml 同 module_id 的 construction_plan.status"
    check: |
      1. 解析两份注册表 -> module_id 为 key
      2. 逐对比较 construction_progress vs construction_plan.status
      3. 任一不等 -> 注册为矛盾
    severity: error
    on_failure: reject
    applies_to: [registries]
    verifiable: true
    verification_method: "YAML/script 双重解析 + 逐 module_id 对账"
    rule_ids:
      - TRAE-013
      - TRAE-014

  - id: G8-C04
    name: construction_progress_controlled_vocabulary
    description: "所有 construction_progress 值必须在受控词表内：[not_started, phase_1_partial, phase_1_complete, phase_2_complete, blocked_by_infrastructure, completed, phase_production_complete]"
    check: |
      1. 扫描所有 frontmatter + 两份注册表
      2. 任一 construction_progress 值不在受控词表 -> 注册为矛盾
      3. 废弃值（phase_27_planned 等非标准写法）-> 阻断
    severity: error
    on_failure: reject
    applies_to: [docs, registries]
    verifiable: true
    verification_method: "词表匹配"
    rule_ids:
      - TRAE-013
      - TRAE-014
