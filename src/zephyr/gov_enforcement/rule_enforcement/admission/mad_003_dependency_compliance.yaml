# MAD-003 Dependency Compliance Gate
# 依赖合规门禁 —— 模块依赖关系必须符合架构约束
# SSoT: src/zephyr/autonomy_core/gates/_registry.yaml -> MAD-003

module_id: MOD-GATE_ENGINE
gate_id: MAD-003
gate_name: dependency_compliance
title: "MAD-003 Dependency Compliance"
category: admission
scope: global
execution_plane: warm
status: active
version: "1.0"
created: "2026-05-04"
rule_ids:
  - TRAE-013
  - TRAE-015

description: >
  对标：Layer Isolation Principle + ArchUnit fitness functions。
  新模块的依赖关系 MUST 符合架构定义的层依赖方向：
  - 低层不导入高层
  - 跨层数据交换只走 shared/contracts/
  - 外部依赖必须声明显式版本和降级策略

rules:
  - rule_id: MAD-003-R1
    name: downward_dependency_only
    description: "模块只能导入 shared/ + contracts/ + 自身层 + 更低层（相同或更低 index）"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each import in module:
          if import.layer_index > module.layer_index and import not in SHARED_DIRS:
              REJECT

  - rule_id: MAD-003-R2
    name: cross_layer_via_contracts
    description: "跨层数据交换 MUST 通过 shared/contracts/ 的 CTR 类型"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      if module imports from another non-shared layer:
          assert imported_symbol is in CTR_REGISTRY

  - rule_id: MAD-003-R3
    name: external_dependency_versioned
    description: "所有外部依赖（pip/poetry）MUST 声明精确版本和降级策略"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each external dependency:
          assert version is pinned (== not >=)
          assert has_degradation_strategy or is_optional

  - rule_id: MAD-003-R4
    name: no_circular_imports
    description: "禁止模块间循环依赖（运行时检测 + CI 静态检查）"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: "test_no_cycles_in_layer_graph must pass"

  - rule_id: MAD-003-R5
    name: contract_version_check
    description: "如果模块消费 CTR 契约，MUST 声明兼容的 schema_version 范围"
    enforcement: WARN
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each CTR contract consumed:
          assert compatible_schema_versions is declared
