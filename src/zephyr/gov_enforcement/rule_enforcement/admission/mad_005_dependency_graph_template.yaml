# MAD-005 Dependency Graph Template Compliance Gate
# 依赖图模板合规门禁 —— 依赖图产出物必须符合 TPL-DEPGRAPH-001 模板
# SSoT: src/zephyr/autonomy_core/gates/_registry.yaml -> MAD-005

module_id: MOD-GATE_ENGINE
gate_id: MAD-005
gate_name: dependency_graph_template
title: "MAD-005 Dependency Graph Template Compliance"
category: admission
scope: global
execution_plane: warm
status: active
version: "1.0"
created: "2026-05-12"
rule_ids:
  - TRAE-013
  - TRAE-015

description: >
  对标：TPL-DEPGRAPH-001 v4.0.0 + project_rules.md 铁律 #7。
  依赖图产出物 MUST 符合 TPL-DEPGRAPH-001 模板定义的 16 大结构：
  - 必须包含元数据、节点、边、邻接表、图属性、完整性声明、约束规则
  - 节点必须有 node_id/type/layer/stability/safety_level
  - 边必须有 edge_id/from/to/dep_type/strength/direction
  - 邻接表必须双向（forward + reverse）
  - 必须声明完整性（completeness 字段）
  - 蓝图链接必须双向对齐

rules:
  - rule_id: MAD-005-R1
    name: required_sections_present
    description: "依赖图 MUST 包含 TPL-DEPGRAPH-001 定义的 7 个必填结构：元数据、节点、边、邻接表、图属性、完整性声明、约束规则"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each required_section in [metadata, nodes, edges, adjacency, properties, compositions, constraints]:
          assert section exists and non-empty

  - rule_id: MAD-005-R2
    name: node_required_fields
    description: "每个节点 MUST 包含 node_id/type/layer/stability/safety_level 字段"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each node in nodes:
          assert all(node_id, type, layer, stability, safety_level) are present

  - rule_id: MAD-004-R3
    name: edge_required_fields
    description: "每条边 MUST 包含 edge_id/from/to/dep_type/strength/direction 字段"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each edge in edges:
          assert all(edge_id, from, to, dep_type, strength, direction) are present

  - rule_id: MAD-004-R4
    name: adjacency_bidirectional
    description: "邻接表 MUST 包含 forward 和 reverse 两个方向"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      assert adjacency.forward exists
      assert adjacency.reverse exists

  - rule_id: MAD-004-R5
    name: completeness_declared
    description: "完整性声明 MUST 包含 completeness 字段，值必须为受控词表枚举值之一"
    enforcement: REJECT
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      assert compositions.completeness in [complete, incomplete, incomplete_first_party_only, incomplete_third_party_only, unknown]

  - rule_id: MAD-004-R6
    name: controlled_vocabularies
    description: "节点类型/层级/依赖类型/强度/方向 MUST 使用 TPL-DEPGRAPH-001 §3 定义的受控词表枚举值"
    enforcement: WARN
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each node: assert node.type in §3.1 enum
      for each edge: assert dep_type in §3.3 enum
      for each edge: assert strength in §3.5 enum
      for each edge: assert direction in §3.6 enum

  - rule_id: MAD-004-R7
    name: blueprint_links_alignment
    description: "如果依赖图包含 blueprint_links，MUST 双向对齐：蓝图存在且包含 [BLUEPRINT] 字段"
    enforcement: WARN
    rule_ids:
      - TRAE-013
      - TRAE-015
    check: >
      for each link in blueprint_links:
          assert blueprint_path file exists
          assert blueprint contains [BLUEPRINT] field
