module_id: MOD-GATE_ENGINE
gate_id: "G11"
name: "杠杆限制门禁 (Leverage Limit Gate)"
phase: "validate"
category: "trading"
auto: true
scope: "trading"
description: >
  检查 AI 生成的策略总杠杆（含衍生品）不超过 RiskLimits.max_gross_leverage。
  一票否决制 (one-strike rejection)：任何策略超过阈值即 REJECT。

on_failure: "reject"
on_pass: "pass"
activation_stage: "active"
rule_ids:
  - TRAE-019

checks:
  - id: "G8-L01"
    name: "max_gross_leverage"
    description: >
      策略的总杠杆（long + abs(short) / portfolio_equity）
      MUST ≤ RiskLimits.max_gross_leverage（默认 1.0 = 满仓不加杠杆）。
    type: "leverage_limit"
    severity: "error"
    failure_policy: "Ignore"
    on_failure: "reject"
    rule_ids:
      - TRAE-019
    fix_hint: >
      杠杆超标——可能原因：
      1. AI 错误地设置了杠杆参数（最常见的原因）
      2. 策略设计需要杠杆但未声明
      解决方案：降低杠杆至 max_gross_leverage 以下，
      或提交杠杆例外审批。
    anti_pattern: >
      错误地将 "long 120% + short 30%" 算作 "net 90%"
      而忽略 gross exposure = 150% 已远超限制。
    verifiable: true
    params:
      max_gross_leverage_default: 1.0
      calculation_method: "gross_exposure"
      cross_reference_contract: "CTR-003"

  - id: "G8-L02"
    name: "derivative_leverage_disclosure"
    description: >
      如果策略包含衍生品杠杆（期货保证金、期权组合），
      AI MUST 在 task 描述中明确披露等效名义本金杠杆倍数。
    type: "field_presence"
    severity: "warning"
    failure_policy: "Ignore"
    on_failure: "flag"
    rule_ids:
      - TRAE-019
    fix_hint: >
      在 task.details 中添加 'derivative_leverage_disclosure' 字段，
      明确标注等效杠杆倍数和计算依据。
    params:
      required_fields:
        - "derivative_leverage_disclosure"

  - id: "G8-L03"
    name: "intraday_leverage_cap"
    description: >
      日内交易杠杆（按日内峰值）不得超过 max_gross_leverage × 1.5。
      对标 FINRA 日内保证金规则的 4:1 -> 零售 2:1 的宽松映射。
    type: "leverage_limit"
    severity: "warning"
    failure_policy: "Ignore"
    on_failure: "flag"
    rule_ids:
      - TRAE-019
    fix_hint: >
      日内峰值杠杆超过阈值——这在算法交易中常见，
      但如果持续超标需在策略文档中说明原因。
    params:
      intraday_multiplier: 1.5
      measurement_window_minutes: 60
