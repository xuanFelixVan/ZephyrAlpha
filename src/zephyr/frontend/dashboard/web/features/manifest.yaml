    depends: [ZK.api, sqCur, STOCKQ_D]   # STOCKQ_D=演示回退（仅 3 只演示标的）
    toggle: none
    styles: self-injected
    acceptance: ACC-F-STOCKQ-KEY-DATA
    handbook: []
    status: active
  - id: sq-sector-tags
