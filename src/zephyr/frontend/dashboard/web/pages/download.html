<section class="page" id="p-download">
    <h2 class="page-title">数据下载监管 <span class="badge b-pass">真源</span></h2>
    <div class="page-sub">数据组 · <b>所有数据（非数据源）的下载实况</b>——146 张表最新数据分区一页看全（真源=CH system.parts）· 新鲜度四态灯按表名启发预期周期 · 断更表置顶 · 30s 自动刷新</div>
    <div class="row c5" id="dl-kpi"></div>
    <div class="card" style="margin-top:14px">
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
        <h3 style="margin:0">表级下载实况 <span class="dim">灯=最新数据龄 vs 表名启发预期周期（日频 3-4 天/周频 12 天/月频 45 天）</span></h3>
        <span style="margin-left:auto;display:flex;gap:6px;align-items:center">
          <span class="sel" id="dl-db-sel" style="position:relative;cursor:pointer" onclick="dlDropTgl(event)"><span id="dl-db-t">全部库</span> ▾
            <span class="acct-menu" id="dl-db-menu"></span>
          </span>
          <input id="dl-q" placeholder="搜表名…" oninput="dlRender()" style="background:var(--input);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:3px 8px;width:140px">
        </span>
      </div>
      <div id="dl-table"></div>
      <div class="note">断更判定口径：数据龄超预期周期 3 倍=红（可能断更）；1-3 倍=黄（观察）。元数据小表（无分区）灰灯不算异常。频率启发自表名，个别表预期不准属正常——以「最新数据日」列为准人工判读</div>
    </div>
  </section>
