<section class="page" id="p-chainmap">
    <div class="cm-top">

      <span class="cm-legend dim" style="font-size:11px">三层缩放：星系（族聚合）→ 产业链图谱（环节流程）→ 公司 ｜ 滚轮缩放 · 拖动平移 · 双击重置
        <i class="cm-info" title="板块页答'哪个板块强'（横向同环节并列）；本页答'强势沿产业链传导给谁'（纵向）。
真源=INDUSTRY-GRAPH-001 ig_* 七表（PostgreSQL 只读）：族=按跨链供应连接紧密度聚类（Louvain，30~48 族）；
公司名映射来自 ig_company_edge 名称列，覆盖不全为已知边界。">ⓘ</i></span>
      <span class="dim" style="margin-left:auto;font-size:11px" id="cm-meta">加载中…</span>
    </div>
    <div class="cm-body">

          <canvas class="cm-gl" id="cm-gl-galaxy"></canvas>
          <div class="cm-gl-labels" id="cm-labels-galaxy"></div>
          <span class="cm-zoom" id="cm-zoom-galaxy">100%</span>
          <div class="cm-empty" id="cm-empty-galaxy" style="display:none"></div>
        </div>
        <!-- L1 一级总图（chainmap-galaxy 模块 ifind 模式持有；Owner 2026-09-12 拍板④：星云保留，
             另做同风格 iFinD 一级总图，顶栏切换。族=分区底板蛇形排布、链=小等距块、族间流向线=边权投影） -->
        <div class="cm-canvas card" id="cm-canvas-overview" style="display:none">
          <div class="cm-legend" id="cm-legend-overview">族＝分区底板（点底板进链层）｜链块大小＝公司数｜流向线＝族间权重前 20（悬停底板高亮）｜点链块直达链视图</div>
          <div class="cm-world" id="cm-world-overview">
            <svg class="cm-wires" id="cm-wires-overview"></svg>
          </div>
          <span class="cm-zoom" id="cm-zoom-overview">100%</span>
        </div>
        <!-- B1 加载态（ACC-F-CHAINMAP-GALAXY rev3）：2026-09-12 起升为 stage 级，两 L1 画布（星云/总图）共用；
             仅 L1 可见时显示（galaxy 模块守卫），不遮 L2 链层。零假数据 -->
        <div class="cm-loading" id="cm-loading-galaxy" style="display:none">
          <div class="cm-loading-stars"><i></i><i></i><i></i><i></i><i></i></div>
          <div class="cm-loading-t" id="cm-loading-galaxy-t">星系聚类首算中…</div>
          <div class="cm-loading-s" id="cm-loading-galaxy-s">已等待 0s</div>
        </div>
        <!-- L2/L3 链层（chainmap-cluster 模块持有；2026-09-12 iFinD 等距流程图：分区块蜿蜒+锚点大块，列概念废除） -->
        <div class="cm-canvas card" id="cm-canvas-cluster" style="display:none">
          <div class="cm-legend" id="cm-legend-cluster"><i class="d d-p"></i>环节＝点开公司名单<i class="d d-g"></i>绿色＝全球环节<i class="d d-d"></i>暗虚线＝暂无落位<i class="d d-g2"></i>⚙＝股权（悬停明细）<i class="d d-o"></i>⚡＝催化命中<i class="d d-r"></i>红线＝供应流向<i class="d d-l"></i>蓝线＝构成关系｜连线＝悬停/点环节后显示其上下游</div>
          <div class="cm-world" id="cm-world-cluster">
            <svg class="cm-wires" id="cm-wires-cluster"></svg>
            <div class="cm-nodes" id="cm-nodes-cluster"></div>
          </div>
          <span class="cm-zoom" id="cm-zoom-cluster">100%</span>
          <div class="cm-empty" id="cm-empty-cluster" style="display:none"></div>
        </div>
        <!-- 环节公司面板（chainmap-cluster 模块持有） -->
        <aside class="cm-side card" id="cm-side" style="display:none"></aside>
      </div>
    </div>
</section>
<style>
  /* 满屏布局（同 tdm 页口径）：页节=视口-顶栏46-ticker32，底部贴 ticker 上缘 */

  #p-chainmap .cm-top { display:flex; align-items:center; gap:12px; padding:0 2px 8px; flex:none; }
  #p-chainmap .cm-crumb { font-size:14px; font-weight:700; color:var(--text); white-space:nowrap; }
  #p-chainmap .cm-crumb .cm-back { cursor:pointer; color:#7db4e8; }
  #p-chainmap .cm-crumb .cm-back:hover { color:#3d8bff; }

  #p-chainmap .cm-legend { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #p-chainmap .cm-info { font-style:normal; cursor:help; color:#5b8fd6; border:1px solid #263042; border-radius:99px;
    padding:0 5px; font-size:10px; margin-left:4px; }
  #p-chainmap .cm-body { flex:1; min-height:0; display:flex; gap:12px; align-items:stretch; }
  #p-chainmap .cm-nav { width:248px; flex:none; overflow:auto; padding:8px; }
  #p-chainmap .cm-stage { flex:1; min-width:0; position:relative; }
  #p-chainmap .cm-canvas { position:absolute; inset:0; overflow:hidden; cursor:grab; }
  #p-chainmap .cm-canvas.dragging { cursor:grabbing; }
  #p-chainmap .cm-world { position:absolute; left:0; top:0; transform-origin:0 0; }
  #p-chainmap .cm-wires { position:absolute; left:0; top:0; pointer-events:none; }
  #p-chainmap .cm-nodes { position:relative; }
  #p-chainmap .cm-zoom { position:absolute; top:8px; right:12px; z-index:5; background:rgba(13,17,23,.88);
    border:1px solid #263042; border-radius:99px; padding:2px 10px; font-size:11px; color:#7d8aa0; pointer-events:none; }
  #p-chainmap .cm-empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;

  #p-chainmap .cm-side { position:absolute; top:0; right:0; bottom:0; width:360px; z-index:8; overflow:auto; padding:12px;
    background:#0e1420; }   /* 实色：全局 .card 底=rgba(238,238,240,.055) 高透，Owner 2026-09-13 反馈透底花屏 */
  #p-chainmap .cm-bad { color:#e2b155 !important; }

  /* ── L1 星系（chainmap-galaxy）── B2 起 3D 星云：2D 节点/连线样式已随 DOM 退役（git 历史留存），活渲染=WebGL 画布+标签投影层 */
  #cm-canvas-galaxy .cm-gl { position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab; }
  #cm-canvas-galaxy .cm-gl.dragging { cursor:grabbing; }
  #cm-canvas-galaxy .cm-gl-labels { position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:3; }
  #cm-canvas-galaxy .cm-gl-label { position:absolute; transform:translate(-50%,-50%); font-size:11px;
    color:#9aa5b5; white-space:nowrap; text-shadow:0 1px 4px rgba(0,0,0,.8); pointer-events:none; }
  #cm-canvas-galaxy .cm-gl-label.cm-gl-major { font-size:12.5px; font-weight:700; color:#c6d2e2; }
  #cm-canvas-galaxy .cm-gl-label.cm-on { color:#e6c34c; font-weight:700; }
  #cm-canvas-galaxy .cm-gl-label.cm-dim { opacity:.18 !important; }

  /* ── B1 加载态（chainmap-galaxy，ACC rev3 item7/8）── 星云闪烁骨架+诚实计时；失败态转红停闪 */
  #cm-loading-galaxy { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; z-index:5; pointer-events:none; background:rgba(10,13,20,.55); }
  #cm-loading-galaxy .cm-loading-stars { display:flex; gap:14px; align-items:center; }
  #cm-loading-galaxy .cm-loading-stars i { width:8px; height:8px; border-radius:50%; background:#3d8bff;
    opacity:.25; animation:cmTwinkle 1.4s ease-in-out infinite; }
  #cm-loading-galaxy .cm-loading-stars i:nth-child(2) { animation-delay:.2s; width:11px; height:11px; }
  #cm-loading-galaxy .cm-loading-stars i:nth-child(3) { animation-delay:.4s; width:14px; height:14px; background:#e6c34c; }
  #cm-loading-galaxy .cm-loading-stars i:nth-child(4) { animation-delay:.6s; width:11px; height:11px; }
  #cm-loading-galaxy .cm-loading-stars i:nth-child(5) { animation-delay:.8s; }
  @keyframes cmTwinkle { 0%,100% { transform:scale(.7); opacity:.22; } 50% { transform:scale(1.15); opacity:.95; } }
  #cm-loading-galaxy .cm-loading-t { font-size:14px; font-weight:700; color:#dbe4f0; }
  #cm-loading-galaxy .cm-loading-s { font-size:11px; color:#7d8aa0; }
  #cm-loading-galaxy.cm-load-fail .cm-loading-t { color:#e07b7b; }
  #cm-loading-galaxy.cm-load-fail .cm-loading-stars i { animation-play-state:paused; opacity:.15; }

  /* ── 左侧导航树（chainmap-nav）── */

  /* ── 顶部搜索（chainmap-search）── */
  #cm-search-slot .cm-si { background:#0d1117; border:1px solid #263042; border-radius:6px; color:var(--text);
    padding:4px 10px; font-size:12px; width:220px; outline:none; }
  #cm-search-slot .cm-si:focus { border-color:#3d8bff; }

  /* ── L2/L3 链层（chainmap-cluster）── 2026-09-12 iFinD 等距流程图重构：渲染全量走
     #cm-wires-cluster SVG（分区底板/等距立方体/公司 chip/流向线），DOM 卡片层退役；

  #cm-canvas-cluster .cm-legend { position:absolute; top:8px; left:12px; z-index:6; font-size:11px; color:#8a94a6;

  #cm-canvas-cluster .cm-legend .d-r { background:#e06a6a; }

  #cm-nodes-cluster { position:absolute; left:0; top:0; }
  /* SVG 交互层：wires 从纯装饰线层升级为唯一画布（收点击/hover；拖拽靠冒泡到 cm-canvas）。

  #cm-wires-cluster text { user-select:none; }

  #cm-wires-cluster .cm-chainchip { cursor:pointer; }
  #cm-wires-cluster .cm-chainchip:hover text { fill:#e6c34c; }
  #cm-wires-cluster .cm-chipm.chipmore { cursor:pointer; }
  #cm-wires-cluster .cm-chipm.chipmore:hover rect { stroke:#8fb0ea; }
