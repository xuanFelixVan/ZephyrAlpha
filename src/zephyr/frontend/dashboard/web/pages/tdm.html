<section class="page" id="p-tdm">
    <h2 class="page-title">交易决策全景 <span class="badge b-pass">实时映射</span></h2>
    <div class="page-sub">研究组 · <b>核心：交易决策地图（<span id="tdm-count">—</span> 赚点）的原生实时视图——真源 YAML 一改这边自动变（30 秒轮询）</b>· 横向树：四层各一列，颜色=施工状态 ｜ 点节点开右侧抽屉看"怎么算的"完整机制</div>

    <div class="card" style="margin-bottom:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <span class="dim" style="font-size:12px">图例</span>
      <span style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:#0f2740;border:1.5px solid #1e5a8f;border-radius:3px;vertical-align:middle"></span> 实锚（有模块）</span>
      <span style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:#2a1c0e;border:1.5px dashed #8a4a12;border-radius:3px;vertical-align:middle"></span> 🔴 红节点（设计态）</span>
      <span style="font-size:12px"><span style="display:inline-block;width:10px;height:10px;background:#0e2612;border:1.5px solid #2e7d32;border-radius:3px;vertical-align:middle"></span> 📄paper 实盘执行</span>
      <span class="dim" style="font-size:11px">｜ 连线：<span style="color:#44546e">━</span> 主链/sequence <span style="color:#44546e">╌</span> 虚线=喂给/feedback ｜ 层级：列位+字号（L1 大 → L4 小）</span>
      <input id="tdm-srch" placeholder="搜索节点（ID / 名称）…" oninput="tdmFilter(this.value)"
             style="background:#0d1117;border:1px solid #263042;border-radius:6px;color:var(--text);padding:4px 10px;font-size:12px;width:180px">
      <span id="tdm-mode" onclick="tdmToggleMode()" title="切换 拖动画布 / 文字选择复制（快捷键 Ctrl+Shift+D）"
            style="cursor:pointer;user-select:none;background:#0d1117;border:1px solid #263042;border-radius:6px;color:var(--text);padding:3px 10px;font-size:12px">✋ 拖动模式</span>
      <span id="tdm-focus" onclick="tdmExitFocus()" title="退出聚焦，还原全景（Esc / 双击空白 同效）"
            style="display:none;cursor:pointer;user-select:none;background:#0d1117;border:1px solid #3d8bff;border-radius:6px;color:#7db4e8;padding:3px 10px;font-size:12px">🎯 聚焦 <b id="tdm-focus-name" style="color:#e2e8f2;font-weight:600">—</b> ✕</span>
      <span class="dim" style="font-size:11px">滚轮缩放 ｜ 拖动平移 ｜ 点节点=聚焦血统（上游居左·下游居右）｜ Esc/双击空白还原全景</span>
      <span style="margin-left:auto;font-size:11px" class="dim" id="tdm-meta">加载中…</span>
    </div>

    <!-- 满屏布局：页节=视口减去顶栏46+ticker32+main上下padding，树区 flex:1 吃掉全部剩余 -->
    <div class="tdm-fill">
      <div class="card tdm-canvas">
        <!-- tdm-world=缩放平移世界层：滚轮/拖动作用在它上面（transform），画布本体 overflow:hidden 不走原生滚动 -->
        <div id="tdm-world">
          <svg id="tdm-wire"></svg>
          <div id="tdm-tree"></div>
        </div>
        <span id="tdm-zoom">100% ｜ ✋ 拖动</span>
      </div>
      <div class="card" id="tdm-drawer"></div>
    </div>
</section>
<style>
  /* 满屏精确对齐：section 高度=视口-顶栏46- main顶padding8 - ticker32 → 底缘正好贴 ticker 上缘；
     :has() 豁免 .main 56px 庄部预留 padding（仅本页生效） */
  .main:has(#p-tdm.active) { padding-bottom: 0; }
  #p-tdm.active { display:flex; flex-direction:column; height:calc(100vh - 86px); }
  #p-tdm .tdm-fill { flex:1; min-height:0; display:flex; gap:12px; align-items:stretch; }
  #p-tdm .tdm-canvas { flex:1; position:relative; overflow:hidden; cursor:grab; }
  #p-tdm .tdm-canvas.dragging { cursor:grabbing; }
  #p-tdm .tdm-canvas.select-mode { cursor:text; }
  #tdm-world { position:absolute; left:0; top:0; transform-origin:0 0; }
  #tdm-zoom { position:absolute; top:8px; right:12px; z-index:5; background:rgba(13,17,23,.88); border:1px solid #263042;
    border-radius:99px; padding:2px 10px; font-size:11px; color:#7d8aa0; pointer-events:none; }
  #tdm-wire { position:absolute; left:0; top:0; pointer-events:none; }
  #tdm-tree { position:relative; padding:8px 4px; }
  #tdm-drawer { width:400px; flex:none; overflow:auto; display:none; }
  /* 卡片：颜色=施工状态三态（蓝实锚/橙虚红节点/绿paper，Owner 2026-09-08 裁定保留）；
   * 全部色类显式带 #tdm-tree 前缀——否则 ID 基础规则(1-1-0)压过 .tn.production(0-2-0)，状态色全部失效（b20260908-05 实测翻车）；
   * 层级不占颜色——由列位+tn-d1~d4 字号/padding 梯度承载（L1 最大 → L4 最小，梯度拉满） */
  #tdm-tree .tn { position:absolute; border-radius:8px; cursor:pointer; user-select:none; transition:border-color .15s; box-sizing:border-box;
    border:1.5px solid #263042; background:#0d1117; }
  #p-tdm .tdm-canvas.select-mode .tn, #p-tdm .tdm-canvas.select-mode .tg { user-select:text; cursor:text; }
  #tdm-tree .tn:hover { border-color:#3d8bff; }
  #tdm-tree .tn .tn-n { font-weight:600; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* 小字=「问」全文：一排放不下自动提行，最多两行（line-clamp 2），禁止省略号截成一行 */
  #tdm-tree .tn .tn-g { color:#8a94a6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; white-space:normal; line-height:1.5; }
  #tdm-tree .tn.production { background:#0f2740; border-color:#1e5a8f; }
  #tdm-tree .tn.design { background:#2a1c0e; border-style:dashed; border-color:#8a4a12; }
  #tdm-tree .tn.paper { background:#0e2612; border-color:#2e7d32; }
  /* 层级梯度：只管大小不管色；L1 19px 根部最大 → L4 12.5px，整体比上版大 2~4px */
  #tdm-tree .tn.tn-d1 { padding:12px 16px; }
  #tdm-tree .tn.tn-d1 .tn-n { font-size:19px; font-weight:700; }
  #tdm-tree .tn.tn-d1 .tn-g { font-size:13px; color:#b9c6da; margin-top:4px; }
  #tdm-tree .tn.tn-d2 { padding:10px 13px; }
  #tdm-tree .tn.tn-d2 .tn-n { font-size:16px; }
  #tdm-tree .tn.tn-d2 .tn-g { font-size:12px; margin-top:3px; }
  #tdm-tree .tn.tn-d3 { padding:8px 11px; }
  #tdm-tree .tn.tn-d3 .tn-n { font-size:14px; }
  #tdm-tree .tn.tn-d3 .tn-g { font-size:11px; margin-top:2px; }
  #tdm-tree .tn.tn-d4 { padding:6px 10px; }
  #tdm-tree .tn.tn-d4 .tn-n { font-size:12.5px; }
  #tdm-tree .tn.tn-d4 .tn-g { font-size:10.5px; margin-top:2px; }
  #tdm-tree .tn.hit { border-color:#e6c34c; box-shadow:0 0 0 2px rgba(230,195,76,.25); }
  #tdm-tree .tn.dimmed { opacity:.25; }
  #tdm-tree .tn.sel { outline:2px solid #3d8bff; }
  /* 聚焦模式（b20260909-fe）：血统主线外压暗——只动透明度不改三态色语义（Owner 裁定色语义不可变）；
   * 悬停提亮=压暗卡片预览（看清后点击即换焦点，探索通道） */
  #tdm-tree .tn.fdim { opacity:.12; }
  #tdm-tree .tn.fdim:hover { opacity:.5; }
  /* 验证态徽标（PB-03 P2-2）：噪音=灰化降透明 / 衰减=灰边——灰色系沿 .empty 色板，不发明新色 */
  #tdm-tree .tn.vn { border-color:#525d70; opacity:.55; }
  #tdm-tree .tn.vd { border-color:#8a94a6; }
  #tdm-tree .tn .tn-v { position:absolute; top:-7px; right:6px; font-size:9.5px; line-height:1.4;
    color:#8a94a6; border:1px solid #525d70; border-radius:99px; padding:0 6px; background:#10151d; z-index:1; }
  /* 流根标签=树的根部视觉锚点：24px > L1 卡 19px，全图最大字号，一眼锁定树根 */
  #tdm-tree .tg { position:absolute; background:#1a2436; border:1.5px solid #3d8bff; border-radius:10px;
    padding:12px 18px; font-size:24px; font-weight:700; color:var(--text); user-select:none; white-space:nowrap; z-index:2; }
  #tdm-tree .tg .cnt { color:#7d8aa0; font-weight:400; font-size:14px; margin-left:8px; }
  #tdm-wire path { fill:none; stroke:#2c3a52; stroke-width:1.4; }
  /* 边 payload 大白话不上图（b20260910 二轮反馈：线牌叠挡卡片）——改在抽屉「算法锚」下方显示 */
  /* ── 右侧详情抽屉 v2（b20260908-10 重设计：分区层次+chip 流，欧易终端密度，纯 HTML+CSS）──
   * 分区：标题徽标 → 问 → 机制 → 治理键值网格 → 模块锚 → 策略挂载 → 依据锚八轴 chip → 上/下游导航行 → 设计备注 */
  #tdm-drawer .dr-name { font-size:16px; font-weight:700; color:var(--text); line-height:1.35; }
  #tdm-drawer .dr-id { font-size:11px; color:#7d8aa0; margin-top:3px; }
  #tdm-drawer .dr-badges { display:flex; flex-wrap:wrap; gap:5px; margin:8px 0 0; }
  #tdm-drawer .bdg { font-size:10.5px; line-height:1; padding:3px 8px; border-radius:99px;
    border:1px solid #263042; color:#8a94a6; white-space:nowrap; }
  /* 徽标三态=画布卡片同语义：绿 paper / 蓝实锚 / 橙虚红节点 */
  #tdm-drawer .bdg-paper { color:#7fc98a; border-color:#2e7d32; background:#0e2612; }
  #tdm-drawer .bdg-prod { color:#7db4e8; border-color:#1e5a8f; background:#0f2740; }
  #tdm-drawer .bdg-design { color:#d29a5b; border:1px dashed #8a4a12; background:#2a1c0e; }
  /* 验证态中性徽标（PB-04）：未验证/噪音/待观察/衰减=灰系（不发明新色，沿 .empty 色板） */
  #tdm-drawer .bdg-gray { color:#8a94a6; border-color:#263042; background:#10151d; }
  #tdm-drawer .dr-par { font-size:11px; color:#7d8aa0; margin-top:7px; line-height:1.5; }
  /* 分区标题：蓝色小标题+右延发丝线，替代旧纯文字堆叠 */
  #tdm-drawer .sec { display:flex; align-items:center; gap:8px; font-size:11px; font-weight:700;
    letter-spacing:.4px; color:#3d8bff; margin:14px 0 6px; }
  #tdm-drawer .sec::after { content:''; flex:1; height:1px; background:#1c2534; }
  #tdm-drawer .sec .cnt { color:#7d8aa0; font-weight:400; }
  /* 长文（问/机制）：行高≥1.6，问提亮一档 */
  #tdm-drawer .txt { font-size:12.5px; line-height:1.7; color:#c6cdd8; word-break:break-word; }
  #tdm-drawer .txt.q { color:#e2e8f2; }
  /* 治理键值网格：禁长句拼接，空值 '—' 留位 */
  #tdm-drawer .kgrid { display:grid; grid-template-columns:44px 1fr; gap:5px 10px; font-size:12px; line-height:1.6; }
  #tdm-drawer .kgrid .k { color:#7d8aa0; }
  #tdm-drawer .kgrid .v { color:#c6cdd8; word-break:break-word; }
  #tdm-drawer .kgrid .v.na { color:#525d70; }
  /* 引用 chip：编号(蓝)+中文名，流式排布，hover 亮边+title 全称 */
  #tdm-drawer .chips { display:flex; flex-wrap:wrap; gap:5px; }
  #tdm-drawer .chip { display:inline-flex; align-items:baseline; gap:5px; max-width:100%; font-size:11px;
    line-height:1.5; background:#10151d; border:1px solid #263042; border-radius:6px; padding:2px 8px; }
  #tdm-drawer .chip i { font-style:normal; color:#5b8fd6; flex:none; }
  #tdm-drawer .chip b { font-weight:500; color:#c6cdd8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tdm-drawer .chip:hover { border-color:#3d8bff; }
  /* 依据锚八轴分组：轴名+计数一行，chip 流另起一行 */
  #tdm-drawer .axis { margin:7px 0; }
  #tdm-drawer .axis-h { font-size:11px; color:#8a94a6; margin-bottom:4px; }
  #tdm-drawer .axis-h b { color:#c6cdd8; font-weight:600; }
  #tdm-drawer .axis-h .cnt { color:#525d70; }
  /* 上/下游节点导航行：状态点+名称+边型+id，点击跳选 */
  #tdm-drawer .nl { display:flex; align-items:center; gap:7px; padding:3px 6px; margin:2px -6px;
    border-radius:6px; font-size:12px; cursor:pointer; }
  #tdm-drawer .nl:hover { background:#131a26; }
  #tdm-drawer .nl .dot { width:7px; height:7px; border-radius:2px; flex:none; }
  #tdm-drawer .dot-prod { background:#1e5a8f; }
  #tdm-drawer .dot-paper { background:#2e7d32; }
  #tdm-drawer .dot-design { background:#8a4a12; }
  #tdm-drawer .nl .nl-n { color:#c6cdd8; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #tdm-drawer .nl .nl-t { color:#525d70; font-size:10px; flex:none; }
  #tdm-drawer .nl .nl-i { margin-left:auto; color:#525d70; font-size:10.5px; flex:none; }
  /* 设计备注：卡片化引用块，行高 1.65 保长文（D109 级）可读 */
  #tdm-drawer .cm { font-size:11.5px; color:#9aa5b5; line-height:1.65; border-left:2px solid #263042;
    background:#10151d; border-radius:0 6px 6px 0; padding:5px 8px 5px 9px; margin:5px 0; word-break:break-word; }
  #tdm-drawer .empty { font-size:12px; color:#525d70; line-height:1.6; }
  /* ── 算法锚分区（b20260910，F-TDM-ALGOANCHOR）：前缀类型徽+代码锚行，色板全沿既有（不发明新色）── */
  #tdm-drawer .alg-t { font-style:normal; font-size:9.5px; line-height:1.6; color:#8a94a6;
    background:#10151d; border:1px solid #263042; border-radius:3px; padding:0 5px; flex:none; }
  #tdm-drawer .code-anchor { font-size:11px; color:#8a94a6; line-height:1.6; margin-top:6px;
    word-break:break-all; }
  #tdm-drawer .code-anchor a { color:#5b8fd6; cursor:pointer; text-decoration:none; }
  #tdm-drawer .code-anchor a:hover { text-decoration:underline; }
  #tdm-drawer .code-anchor.na { color:#525d70; }
  /* 算法锚大白话（b20260910 二轮反馈）：边 payload 从画布线牌挪到本分区——左边条引用块样式沿 .cm 色板 */
  #tdm-drawer .anchor-feed { margin-top:7px; }
  #tdm-drawer .anchor-feed .af { font-size:11px; color:#9aa5b5; line-height:1.6; word-break:break-word;
    border-left:2px solid #263042; background:#10151d; border-radius:0 6px 6px 0;
    padding:3px 8px 3px 9px; margin:4px 0; }
</style>
