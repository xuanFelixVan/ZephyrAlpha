# MOD-INF-022 Toolchain Unified Security Baseline v0.9.0
tools:
  write_file:
    escalation_level: auto_guard
    checks: [file_size_limit, path_traversal, extension_whitelist]
  execute_command:
    escalation_level: blocked
    checks: [command_whitelist, argument_sanitization, no_shell_injection]
  read_file:
    escalation_level: autonomous
    checks: [path_traversal]
