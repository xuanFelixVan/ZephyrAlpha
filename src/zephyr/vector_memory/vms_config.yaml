# VMS 配置 — MOD-INF-011
# ========================
# 用法: 加载为环境变量覆盖或 Python dict

vms:
  telemetry_enabled: false
  log_level: "INFO"

  chromadb:
    persist_directory: "data/vector_db"
    anonymized_telemetry: false

  embedding:
    bge_m3:
      model_path: "models/bge-m3"
      dimension: 1024
      batch_size: 16
      collections:
        - decisions
        - code_context
        - lessons
        - knowledge
        - rules
    bge_small_zh:
      model_path: "models/bge-small-zh-v1.5"
      dimension: 512
      batch_size: 32
      collections:
        - blueprints
        - session_snapshots
        - execution_traces

  retrieval:
    hybrid:
      enabled: true
      rrf_k: 60
      score_threshold: 0.6
      timeout_ms: 2000
    cache:
      embedding_cache_size: 1024
      query_cache_size: 1024

  ttl:
    code_context: 90
    session_snapshots: 90
    execution_traces: 30

  governance:
    provenance_required: true
    human_gated_collections:
      - rules
    ai_autonomy_levels:
      - supervised
      - autonomous
      - human-gated

  backup:
    snapshot_dir: "data/vector_db/_snapshots"
    auto_backup_enabled: false
