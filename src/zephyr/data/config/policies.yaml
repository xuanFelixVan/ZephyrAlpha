# [BLUEPRINT] MOD-L00-004 | docs/03_modules/_domain_data/data_source_integrator_blueprint.md
# [MODULE] zephyr.data.config.policies
# [DOMAIN] D_DATA
# [TTL] permanent
# 派生物（#183）：由 generate_policies.py 从 data_sources_registry.yaml 派生
# 真源：architecture_model/data/data_sources_registry.yaml v2.3.0
# 禁止手工修改此文件——改真源后由 reconciler 自动重生
# policy_registry.py 的 maybe_reload 会在 mtime 变化时热更新

miniqmt:
  rpm: 0
  concurrency: 1
  max_retries: 3
  backoff: fixed
  initial_wait_sec: 1.0
  retry_on:
  - TimeoutError
  - ConnectionError
  session_ttl_sec: 0
  relogin_on_auth_error: true
  extra:
    requires_process: XtMiniQmt.exe
akshare:
  rpm: 60
  concurrency: 4
  max_retries: 5
  backoff: jittered
  initial_wait_sec: 2.0
  retry_on:
  - JSONDecodeError
  - ConnectionError
  disconnect_vpn: true
baostock:
  rpm: 60
  concurrency: 8
  max_retries: 3
  backoff: fixed
  initial_wait_sec: 2.0
  retry_on:
  - TimeoutError
  - ConnectionError
  - BaoStockError
  session_ttl_sec: 3600
  relogin_on_auth_error: true
  extra:
    thread_local_login: true
    data_lag_days: 7
tushare:
  rpm: 200
  concurrency: 2
  max_retries: 3
  backoff: exponential
  initial_wait_sec: 1.0
  retry_on:
  - TPMaxQueryLimitError
  - ConnectionError
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    points_alert_threshold: 2000
tickflow:
  rpm: 60
  concurrency: 2
  max_retries: 3
  backoff: jittered
  initial_wait_sec: 1.0
  retry_on:
  - ConnectionError
tdx:
  rpm: 0
  concurrency: 1
  max_retries: 3
  backoff: fixed
  initial_wait_sec: 0.5
  retry_on:
  - ConnectionError
  - TimeoutError
  extra:
    bestip: true
rss:
  rpm: 0
  concurrency: 1
  max_retries: 3
  backoff: exponential
  initial_wait_sec: 5.0
  retry_on:
  - SSLError
  - ConnectionError
  - '500'
  - '502'
  - '503'
  - '504'
  respect_robots_txt: true
cls:
  rpm: 30
  concurrency: 1
  max_retries: 3
  backoff: exponential
  initial_wait_sec: 2.0
  retry_on:
  - ConnectionError
  - TimeoutError
  - '500'
  - '502'
  - '503'
  - '504'
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    requires_rsshub: true
    rsshub_route: /cls/telegraph
eastmoney_news:
  rpm: 30
  concurrency: 1
  max_retries: 3
  backoff: exponential
  initial_wait_sec: 2.0
  retry_on:
  - ConnectionError
  - TimeoutError
  - '500'
  - '502'
  - '503'
  - '504'
  session_ttl_sec: 0
  relogin_on_auth_error: false
tqcenter:
  rpm: 0
  concurrency: 1
  max_retries: 3
  backoff: fixed
  initial_wait_sec: 0.3
  retry_on:
  - TimeoutError
  - ConnectionError
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    requires_path: E:\tdx\PYPlugins\user
    requires_process: tdx client
    note: tqcenter 非 pip 安装，需 sys.path.insert 注入；由 sector_kline_downloader.py 独立脚本触发
fred:
  rpm: 60
  concurrency: 1
  max_retries: 3
  backoff: exponential
  initial_wait_sec: 3.0
  retry_on:
  - ConnectionError
  - TimeoutError
  - '500'
  - '502'
  - '503'
  - '504'
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    requires_vpn: true
    fred_api_key_optional: true
    worldbank_no_key: true
    note: 海外站点，国内访问可能需 VPN；FRED key 免费注册；与 akshare macro_data 共表 c1_market.macro_data，indicator_name
      前缀 FRED_/WB_ 区分
eia:
  rpm: 500
  concurrency: 1
  max_retries: 2
  backoff: exponential
  initial_wait_sec: 2.0
  retry_on:
  - ConnectionError
  - TimeoutError
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    eia_api_version: v2
    requires_vpn: true
    note: 海外站点，国内访问可能需 VPN；EIA key 免费注册；与 akshare/FRED macro_data 共表 c1_market.macro_data，indicator_name
      前缀 EIA_ 区分
qweather:
  rpm: 500
  concurrency: 1
  max_retries: 2
  backoff: exponential
  initial_wait_sec: 2.0
  retry_on:
  - ConnectionError
  - TimeoutError
  session_ttl_sec: 0
  relogin_on_auth_error: false
  extra:
    requires_vpn: false
    note: 国内服务不需 VPN；QWeather key 免费注册（1000次/天）；写入 c1_market.weather_data，每日积累
