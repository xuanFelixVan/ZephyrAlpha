# =====================================================================
# 历史 tick 数据下载/回补通道速查（AI 发现面，2026-09-17 登记；细节=93 号备忘 §11.5a）
#
# 【通道 A：QMT 历史数据下载（近期缺口首选）】
#   - API：xtquant/沙箱 ContextInfo.get_market_data_ex(period='tick') + download_history_data
#     （19 列含完整五档；count=-1 按时间窗分页全量抓，写 CSV 后灌 CH）
#   - 深度：终端本地缓存自动保留 ≥2 个交易日，更早需先经 SDK download_history_data
#     从券商服务器补缓存（服务器保留期约 1 个月）；实测 2026-09-17 并行会话经此
#     补回 2026-08 缺失 7 天 tick（Owner 转述实弹）
#   - 9/18 miniQMT 清退后：本 API 经大QMT 沙箱可用（ZEPHYR_HIST_PROBE 2026-08-26 实证，
#     93 §11.5a"miniQMT 清退后的已验证替代"）——前提=大QMT 终端开着
#   - 注意：QMT UI【补充数据】无 tick 下载入口（仅 K 线），SDK 路径 ≠ UI 路径
#
# 【通道 B：深史（>1 个月）】
#   - bdpan 百度网盘月度归档（分笔成交_按月归档；看门狗脚本 scripts/data/bdpan_tick_watch.py
#     在册，但其 OS 计划任务 ZephyrAlpha_BdpanTickWatch（每日 08:00）已退役——2026-09-24
#     schtasks 全量查询实证无此任务，故"每日自动巡检缺口"不再成立，见缺口须人工/另行登记触发）
#     导入器 scripts/data/import_bdpan_tick* ——2026-08-15 实证 3.19 亿行回补）
#   - 自有囤货：c1_market.tick_data 88 亿行（2025-01 起）；竞价窗口仅 2026-06 起
#     40 密集日（见 auction_window_pre_202606_gap 条目）
#
# 【新历史累积】
#   - QMT【收盘清盘】已勾选"收盘时保存今日分笔成交数据"——每交易日收盘自动落盘本地
#   - 主链：tick_subscriber（9/18 起 TICK_SOURCE=bridge 桥模式）实时落 tick_depth_5
#
# 【存储分工纪律】QMT 本地缓存=中转站（每月【清理数据】留 30 天）；ClickHouse=全量主存储
# =====================================================================

# 已知数据缺口注册表（audit 2.7/3.8 治本，#ARCH-CH-029，2026-07-23）
#
# 背景：
#   backfill_checker 默认回看 7 天（_DEFAULT_BACKFILL_DAYS=7），无法检测
#   超过 7 天的历史缺口。本注册表登记已知缺口，backfill_checker 读取后
#   对已登记缺口使用全范围回看（不受 7 天窗口限制）。
#
# 治本原理：
#   - 7 天窗口适用于"日常增量缺口检测"（最近一周的数据完整性）
#   - 已知历史缺口需要显式登记 + 全范围检测（不受窗口限制）
#   - 已登记缺口 backfill 完成后标记 status=completed，不再重复检测
#
# 缺口类型：
#   date_range  — 特定日期范围内行数低于阈值（如 tick_data 2026-06 缺口）
#   empty_table — 整表为空（如 edb_data 源退役停更）

