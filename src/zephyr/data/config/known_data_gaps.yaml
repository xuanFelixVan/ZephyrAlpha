# 已知数据缺口注册表（audit 2.7/3.8 治本，#ARCH-CH-029，2026-07-23）
#
# 背景：
#   backfill_checker 默认回看 7 天（_DEFAULT_BACKFILL_DAYS=7），无法检测
#   超过 7 天的历史缺口。本注册表登记已知缺口，backfill_checker 读取后
#   对已登记缺口使用全范围回看（不受 7 天窗口限制）。
#
# 治本原理：
#   - 7 天窗口适用于"日常增量缺口检测"（最近一周的数据完整性）
#   - 已知历史缺口需要显式登记 + 全范围检测（不受窗口限制）
#   - 已登记缺口 backfill 完成后标记 status=completed，不再重复检测
#
# 缺口类型：
#   date_range  — 特定日期范围内行数低于阈值（如 tick_data 2026-06 缺口）
#   empty_table — 整表为空（如 edb_data 源退役停更）

gaps:
  # === audit 3.8: tick_data 2026-06 缺口 ===
  - id: "tick_data_2026_06_gap"
    table: "c1_market.tick_data"
    gap_type: "date_range"
    start_date: "2026-06-01"
    end_date: "2026-06-30"
    date_column: "trade_date"
    detection_threshold: 5000000  # 日均 < 500万行 = 缺口（5月日均 2385万）
    expected_daily_avg: 23850000  # 5月基准日均
    actual_daily_avg: 2480000     # 6月实际日均（89.6% 缺失）
    status: "completed"           # 2026-08-15 百度云回补完成
    root_cause: "2026-06 录制器中断，tick 数据未采集；07-24 曾误将指数分笔包（000001=上证指数等528标的）导入本表致 5204 万坏行（ingest_ts=2026-07-24 批次）"
    resolution_plan: "通过 backfill_checker run_known_gap_backfill() 触发 QMT 历史数据下载"
    resolution_actual: "2026-08-15 改道百度云网盘回补（QMT 历史范围外空跑实证）：/apps/bdpan/量化交易数据/A股数据_分笔数据/分笔成交_按月归档_{沪深,京市}/2026-06 按日 zip（时间,成交价,手数,买卖方向 → 本表 schema，amount=价×手×100 计算列，bid/ask=NULL，data_source='bdpan'）；先 ALTER DELETE 清除 07-24 错误批次 52,048,481 行，再导入 21 天沪深+京市共 3.19 亿行（日均 1518 万，3秒快照口径低于5月逐笔基准属源口径差异）；端到端验证：坏行清零、关键行正确、direction 分布合理"
    created: "2026-07-23"
    last_updated: "2026-08-15"

