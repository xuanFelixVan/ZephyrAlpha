    root_cause: "akshare 1.18+ 已移除 stock_rights_issue_detail_sina 批量接口，
      仅剩 stock_allotment_cninfo 逐股接口，全市场 5000+ 股拉取效率过低。
      配股为低频事件，任务已 disabled。"
    resolution_plan: "待 AKShare 恢复批量接口或商业数据源/miniQMT 提供配股接口后启用。
      配股为低频事件（年均 <50 起），对实时性要求低。"
