    last_updated: "2026-07-24"

  # === 2026-07-24: l2_tick_snapshot 任务禁用（需付费 L2 权限）===
  - id: "l2_tick_permission_required"
    table: "c1_market.l2_tick"
    gap_type: "permission_required"
    start_date: "2026-01-01"
    end_date: null  # 持续中，待用户开通 L2 权限
    date_column: "trade_date"
    detection_threshold: 1
    status: "accepted"  # 已接受——#ARCH-DATA-014 裁定保留+fallback降级
    root_cause: "Level-2 逐笔行情需付费 L2 行情权限（miniQMT get_l2_quote），
      用户尚未开通。任务已 disabled，fallback_sources 降级到 get_full_tick
