# 已知数据缺口注册表（audit 2.7/3.8 治本，#ARCH-CH-029，2026-07-23）
#
# 背景：
#   backfill_checker 默认回看 7 天（_DEFAULT_BACKFILL_DAYS=7），无法检测
#   超过 7 天的历史缺口。本注册表登记已知缺口，backfill_checker 读取后
#   对已登记缺口使用全范围回看（不受 7 天窗口限制）。
#
# 治本原理：
#   - 7 天窗口适用于"日常增量缺口检测"（最近一周的数据完整性）
#   - 已知历史缺口需要显式登记 + 全范围检测（不受窗口限制）
#   - 已登记缺口 backfill 完成后标记 status=completed，不再重复检测
#
# 缺口类型：
#   date_range  — 特定日期范围内行数低于阈值（如 tick_data 2026-06 缺口）
#   empty_table — 整表为空（如 edb_data 源退役停更）

gaps:
  # === audit 3.8: tick_data 2026-06 缺口 ===
  - id: "tick_data_2026_06_gap"
    table: "c1_market.tick_data"
    gap_type: "date_range"
    start_date: "2026-06-01"
    end_date: "2026-06-30"
    date_column: "trade_date"
    detection_threshold: 5000000  # 日均 < 500万行 = 缺口（5月日均 2385万）
    expected_daily_avg: 23850000  # 5月基准日均
    actual_daily_avg: 2480000     # 6月实际日均（89.6% 缺失）
    status: "registered"          # registered -> in_progress -> completed
    root_cause: "2026-06 录制器中断，tick 数据未采集"
    resolution_plan: "通过 backfill_checker run_known_gap_backfill() 触发 QMT 历史数据下载"
    created: "2026-07-23"
    last_updated: "2026-07-23"

  # === audit 2.7: edb_data 空表（iFind EDB 配额耗尽 → 2026-08-14 源退役任务删除）===
  - id: "edb_data_ifind_quota_exhausted"
    table: "c1_market.edb_data"
    gap_type: "empty_table"
    start_date: "2026-01-01"
    end_date: null  # 永久——iFind 已退役（2026-08-14 #ARCH-DATA-IFIND-RETIRE-001）
    date_column: "report_date"
    detection_threshold: 1  # 表行数 < 1 = 空
    status: "accepted"  # 已接受——macro_data (akshare 291K rows) 作为主宏观数据源
    root_cause: "iFind EDB 月度配额耗尽(-4318)，edb_data 表至今 0 行；iFind 已于 2026-08-14 退役"
    resolution_plan: "iFind 已退役（2026-08-14）：edb 任务已删除，以 macro_data (akshare)+FRED/EIA 作为主宏观源"
    primary_alternative: "c1_market.macro_data（akshare，285K 行，主宏观数据源）"
    created: "2026-07-23"
    last_updated: "2026-07-23"

  # === 2026-07-24: share_change 数据源停止更新（akshare stock_share_change_cninfo）===
  # 治本修复（2026-07-24）：根因实为 akshare stock_share_change_cninfo 默认 end_date='20241021'，
  # provider 未传 start_date/end_date 导致只获取到 2024-10-21 数据。数据源（巨潮资讯 cninfo）
  # 从未真实停滞。已修复 provider 传入显式日期范围，gap 标记为 resolved。
  - id: "share_change_cninfo_stale"
    table: "c3_fundamental.share_change"
    gap_type: "source_stale"
    start_date: "2025-04-29"
    end_date: "2026-07-24"
    date_column: "announce_date"
    detection_threshold: 1
    status: "resolved"
    root_cause: "akshare stock_share_change_cninfo 函数默认 end_date='20241021'（硬编码），
      provider 未传 start_date/end_date 参数，导致只获取 2024-10-21 前数据。
      实测显式传入 start_date='20250101' end_date='20260724' 后，8 只样本股均返回 2025/2026 数据。
      非数据源真实停滞，非任务/调度/fetcher bug。"
    resolution_plan: "已修复 provider 传入 payload.start/end 转换为 YYYYMMDD 格式。
      需运行一次宽日期范围 backfill 补齐 2025-04-29~2026-07-24 的历史缺口。"
    created: "2026-07-24"
    last_updated: "2026-07-24"

  # === 2026-07-24: hk_connect_flow 数据源覆盖范围受限 ===
  # AKShare stock_hsgt_hist_em 返回完整历史，但港交所于 2024-08-16 停止公布
  # 沪深港通每日资金流向明细数据。任务为 incremental=false 全量刷新，
  # 每次运行获取 4052 行（2014-11-17~2024-08-16 完整历史），
  # 数据本身是最新可用，但 max(trade_date) 永远停在 2024-08-16。
  - id: "hk_connect_flow_source_discontinued"
    table: "c1_market.hk_connect_flow"
    gap_type: "source_discontinued"
    start_date: "2024-08-17"
    end_date: null  # 持续中，港交所不再公布此数据
    date_column: "trade_date"
    detection_threshold: 1
    status: "accepted"  # 已接受——数据源永久停止，无法补齐
    root_cause: "港交所于 2024-08-16 停止公布沪深港通每日资金流向明细数据，
      AKShare stock_hsgt_hist_em 仅返回 2014-11-17~2024-08-16 范围数据。
      非任务/调度/provider bug，数据源本身不再提供。"
    resolution_plan: "无可用替代数据源。如需沪深港通资金数据，
      可考虑港交所官方付费 API 或东方财富/同花顺终端手动导出。"
    created: "2026-07-24"
    last_updated: "2026-07-24"

  # === 2026-07-24: audit_opinion 任务禁用（无可用数据源接口）===
  - id: "audit_opinion_no_interface"
    table: "c3_fundamental.audit_opinion"
    gap_type: "no_data_source"
    start_date: "2026-01-01"
    end_date: null  # 持续中，待数据源补齐
    date_column: "announce_date"
    detection_threshold: 1
    status: "accepted"  # 已接受——无可用批量接口
    root_cause: "AKShare 暂无专用批量审计意见接口，仅能从财报摘要逐股获取，
      全市场 5000+ 股拉取效率过低。miniQMT 亦未提供专用接口。
      任务已 disabled，待数据源补齐后启用。"
    resolution_plan: "待商业数据源或 miniQMT 提供批量审计意见接口后启用任务。
      审计意见为低频数据（年报一次），对实时性要求低。"
    created: "2026-07-24"
    last_updated: "2026-07-24"

  # === 2026-07-24: rights_issue 任务禁用（AKShare 移除批量接口）===
  - id: "rights_issue_interface_removed"
    table: "c3_fundamental.rights_issue"
    gap_type: "no_data_source"
    start_date: "2026-01-01"
    end_date: null  # 持续中，待数据源补齐
    date_column: "announce_date"
