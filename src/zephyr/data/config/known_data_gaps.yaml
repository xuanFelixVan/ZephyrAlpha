    root_cause: "该表是行情腿+估值腿复合表，唯一在跑的写者是 akshare 百度估值链路（fallback 里的 miniqmt/local_valuation 均无实体：全仓 grep local_valuation 仅命中本 provider 文件与 DDL DEFAULT）。其 _fetch_valuation_one_symbol 对 9 个行情腿列（open/high/low/close/preclose/volume/amount/turnover/pct_change）传 None，而 DDL 这些列是非 Nullable Decimal/UInt64 → 落库成 0，即无值以合法数值形态进闭环。另两处失真：ps_ttm 列写入的是 akshare 指标市盈率(静)（该函数指标映射处自述 AKShare 无 PS，用静态PE替代）；data_source 因 DDL DEFAULT 恒为 local_valuation，而真实写者是 akshare 链路（出处标注失真）。"
    impact: "实测 FINAL 259238 行中 close!=0 / amount!=0 / turnover!=0 命中 0 行（0.00%）。消费侧已知规避（api_server.py:206 注明价格列全 0 不可用、:265 turnover 全 0 暂无真源→None），故不阻断他人；但任何新消费方直读即中招——流通市值权重 amount/turnover 已被此坑过一次（见 stock_indicator_circ_mv_outage 条目）。0 是错数不是缺数，比空表危险（R-014 同判据）。"
    resolution_plan: "本车道已落地 provider 侧止血（行情腿写前携带 + 宽窗重采幂等/断点续跑）；口径裁定三选一交总包/Owner（A1 9 列改 Nullable，推荐；A2 行情腿由 kline_daily 同步；A3 摘除 9 列=净删列 Owner 门位）——见 adjudications/req_datagap_01.md 议题 A。"
    primary_alternative: "行情/换手一律取 kline_daily 与 stock_indicator（circ_mv 已按股本反推法回填）"
    evidence: "lanes/datagap_corrupt_rows.md §0/§4（含复跑 SQL 与输出）"
    verification_20260921: "WO-1 A2 方案落地收口（st-data-fix-20260921 [亲验]）：行情腿改自
      kline_daily 回填+交易日 gate 后 FINAL=189,087 行 close>0=99.91%。三项残余如实登记：
      ①data_source 仍恒 local_valuation（真实写者 akshare，标注失真）；②ps_ttm 仍为静态 PE
