    root_cause: "erp/erp_pct 两列全表 NULL（000300 8009/8009 行、000905 4047/4047 行，2026-08-30 实测）：
      ERP=1/PE−10Y 国债收益率的计算管道（含 10Y 国债收益率取数+分位化）从未施工。
      同期 pb_mrq/pb_pct/broken_net_ratio/buffett_ratio 亦全空（schema 注释标注一期暂缺/二期预留）。
      影响：S2 valuation 路A（s2_valuation_score_fundamental）的 ERP 分位/绝对值双确认加分项
      （>5% +5 / >6% 熊末 +10）不可用；2015-09/2020-04 窗口 PE≈12 对应 ERP 估算 5.0%/5.7%，
      若有管道两事件 valuation 可再 +5~+10（仍不足以改 confirm 判定，fund=0 才是主堵点）。"
    resolution_plan: "ERP 管道已修复（index_valuation_compute 索引对齐修复+10Y 国债接入，commit 2a16988d）。
      待二期：pb_mrq/pb_pct/broken_net_ratio/buffett_ratio 回填后重跑 CAPE/ERP 分位。"
    primary_alternative: "CAPE 分位主轴单独运行（已实证 2024 事件 valuation 0→60/80 有效）"
    created: "2026-08-30"
    last_updated: "2026-08-30"

