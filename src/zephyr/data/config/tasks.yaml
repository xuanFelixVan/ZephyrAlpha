# [BLUEPRINT] MOD-L00-004 | docs/03_modules/_domain_data/data_source_integrator_blueprint.md
# [MODULE] zephyr.data.config.tasks
# [DOMAIN] D_DATA
# [TTL] permanent
# 任务清单真源（蓝图 §6.2 调度计划 + §4.4 迁移映射表）
# 首批 10 任务覆盖 3 个 Provider（QMT/AKShare/Baostock）和 2 个调度时段
# schedule 字段对应 schedule.yaml 的时段标识：daily_kline/daily_capital/daily_event/weekend_financial/monthly_static
# dependencies 是同批次内的前置任务 task_id（DAG 依赖，蓝图 §6.3）
# source 字段引用 data_sources_registry.yaml 的 runtime_id（如 miniqmt → DS-MINIQMT.runtime_id）
# 数据源调用策略不在本文件维护，真源在 data_sources_registry.yaml 的 policy 字段（派生 policies.yaml）
#
# fallback_sources 配置模板（数据韧性三层机制§1，2026-07-15）：
#   fallback_sources:
#     - source: <副数据源runtime_id>      # 引用 data_sources_registry.yaml
#       capability: <capability名>         # 副源的capability（可能与主源不同）
# 主源失败后自动按 fallback_sources 顺序尝试副源（不可恢复错误立即切，可恢复错误重试用完才切）
# 注意：某些任务天然无副源（如 tick_data 只有 miniqmt），可不配置
# 门禁提醒：DATA-TASK-COMPLETENESS gate 会在 commit 时检测新增任务是否配置 fallback_sources（warn级）

tasks:
  # ============== 盘后日K时段（16:30 周一-五）==============
- task_id: adj_factor_incremental
  table: c1_market.adj_factor
  source: miniqmt
  schedule: daily_kline
  incremental: true
  date_col: trade_date
  dependencies: []
  capability: adj_factor
  symbols:         # null=全市场
  extra:
    description: "复权因子增量（miniQMT get_divid_factors）"

  fallback_sources:
  - source: akshare
    capability: adj_factor
- task_id: kline_daily_hfq_incremental
  table: c1_market.kline_daily_hfq
  source: miniqmt
  schedule: daily_kline
  incremental: true
  date_col: trade_date
  dependencies: ["adj_factor_incremental"]    # DAG: adj_factor -> kline_daily_hfq
  capability: kline_daily_hfq
  symbols:
  extra:
    description: "后复权日K线增量（miniQMT dividend_type=back）"

  fallback_sources:
  - source: akshare
    capability: kline_daily_hfq
- task_id: kline_daily_incremental
  table: c1_market.kline_daily
  source: miniqmt
  schedule: daily_kline
  incremental: true
  date_col: trade_date
  dependencies: ["crypto_kline_daily_incremental"]    # [DAG-DERIVED] derive_task_dependencies.py 依表级血缘推导    # kline_daily 独立，不依赖 hfq
  capability: kline_daily
  symbols:
  fallback_sources:
  - source: baostock
    capability: kline_daily
  extra:
    description: "不复权日K线增量（miniQMT；baostock 作为 fallback）"

- task_id: stock_daily_basic_incremental
  table: c1_market.stock_daily_basic
  source: tushare        # 批9 治本（2026-09-21 st-data-fix WO-4）：换手率/流通盘/市值族原仅靠留盘手工脚本（backfill_stock_daily_basic.py --source tushare）供数、无日常腿；provider capability 转正门（fx_ecb 旁路升格同款先例）
  schedule: daily_kline
  incremental: true
  date_col: trade_date
  dependencies: []       # 独立原始供数腿：非交易日 pro.daily_basic 空=0 行 no-op，无需挂 K 线依赖
  capability: stock_daily_basic
  symbols:               # null=全市场快照（按 trade_date 自维护）
  fallback_sources: []   # 人工兜底=留盘脚本 backfill_stock_daily_basic.py --resume-fail
  extra:
    description: "A股 daily_basic 日频增量（换手率/流通股/流通市值/总市值；chips 族换手率地基，缺数→chips 降级 NULL）"

