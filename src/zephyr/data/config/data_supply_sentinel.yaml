# --- 治理锚定 ---
# blueprint: MOD-L00-004 | docs/03_modules/_domain_data/data_source_integrator_blueprint.md
# module_id: MOD-L00-004-SS
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: permanent
# --- 治理锚定结束 ---
# 数据断供哨兵阈值配置（唯一真源；模块=zephyr.data.supply_sentinel）
#
# 诞生背景（2026-09-18 夜班 st-datapack-20260918，altdata_line 09 清单 D1/D2 波1）：
#   股东户数表 2026-07 断供两月无人知（miniqmt 清退后任务空挂）——事件日期列表
#   （公告日/解禁日/决议日）被 L11 integrity_check 的 _BUSINESS_EVENT_DATE_COLS
#   口径强制跳过（日频必误报），成为停更检测盲区。本配置补上表侧 max(date) 停更检测。
#
# 字段：
#   table         全限定表名
#   date_col      判停更的日期列（业务事实锚，非采集时间）
#   max_lag_days  允许的最大落后天数（超限=断供嫌疑，告警）
#   past_only     true=只对 <=today 的行取 max（前瞻/预约类未来行不稀释新鲜度）
#   --- 2026-09-18 全流通战役 st-ff-sentinel 新增判据维度（详见文末同批注释块）---
#   row_filter           附加 SQL 谓词，把一条腿切到某维度/某数据源（治"表级 max 被单维掩护"）
#   lag_basis            calendar_days(默认) | trading_days（周末/长假/停牌按交易日数，不掰宽阈值）
#   cadence              incremental(默认) | static_backfill（一次性回填/全量刷新表改判行数地板）
#   min_rows_in_window   {window_days, min_rows} 行数地板；window_days=0 即全表计数
#   column_fill_ratio    {cols, min_ratio, window_days, treat_zero_as_missing} 关键列非零/非空率
#   heartbeat_leg        true=本腿是采集心跳腿（date_col 为 ingest_ts 类时必须声明）；
#                        某表**只有**心跳腿 -> 计入 blind_spots 并出 WARN（业务新鲜度无人盯）
#   leg_name             腿标签（同表多腿时告警文案区分"哪条腿红"）
#   gap_id               与 known_data_gaps 台账条目绑定的编号（allow_empty 长期静默的凭据字段）
#   allow_empty   true=空表放行 —— **永久静默开关，不是"暂时宽限"**：置了它，该表可以永远 0 行
#                 而不告警（BRK-046 实证：在册 12 张 allow_empty 表**全部当日有数**，豁免早已过期
#                 却无人撤）。收口纪律：新建表回填完成即须删除本行；确属稀疏/条件性供数才保留，
#                 且**必须同行写 rationale_zh + reviewed_at + reviewed_by**（结构性测试钉
#                 tests/zephyr/data/test_failopen_brk049.py 会拦无凭据的豁免）。
#
# 阈值定档依据（SOP §10.2：日频>3 天/月频>45 天，按数据节奏折档）：
#   3-10 天   = 逐日有增量的表
#   15-45 天  = 月度节奏/跨披露季节奏的表
#   70 天     = 不规则事件表（月度派生但个别月份可为空）

tables:
  # --- D2 股东户数（断供教训本体；公告日逐日有增量，节假日顺延留余量） ---
  - table: c3_fundamental.shareholder_count
    date_col: announce_date
    max_lag_days: 10
    past_only: true

  # --- J2 限售解禁（增量+前瞻双任务同表；解禁日逐日几乎必有，前瞻行在未来故 past_only） ---
  - table: c3_fundamental.share_unlock
    date_col: unlock_date
    max_lag_days: 5
    past_only: true

  # --- J1/B9 预约披露（披露季节性：1-4/7-8/10 月密集，5-6/9/11-12 月可为空 → 阈值放宽跨季） ---
  - table: c3_fundamental.disclosure_plan
    date_col: announce_date
    max_lag_days: 60
    past_only: true

  # --- J5 央行议息（采集心跳口径：决策日历的源端节奏不均——金十预约场次行可长期
  # 停在最后一场已排会议（2026-09 实查 max(decision_date)=2025-10-30 属源端现实），
  # 按 decision_date 判停更会把"源端没排新会"误报为断供；管线存活的正确度量=ingest_ts 新鲜度）
  # 2026-09-18 全流通战役 st-ff-sentinel 更正本段因果口径：本腿是**管线存活腿**，它绿只证明
  # "我们在写"；"数据新不新"由文末 decision_date 业务腿独立守（实测表级停更 323 天、
  # pboc 维度 2494 天；普查 BRK-038 曾把本行读成"必然天天告警的噪音"，方向相反 ---
  - table: c1_market.rate_decision_calendar
    date_col: ingest_ts
    max_lag_days: 2
    past_only: false
    heartbeat_leg: true   # 本腿只证明"采集在写"；业务新鲜度由文末 decision_date 腿守

