# --- 治理锚定 ---
# blueprint: MOD-L00-004 | docs/03_modules/_domain_data/data_source_integrator_blueprint.md
# module_id: MOD-L00-004-SS
# stability: evolving
# safety_level: L
# ai_autonomy: ai_modifiable
# ttl: permanent
# --- 治理锚定结束 ---
# 数据断供哨兵阈值配置（唯一真源；模块=zephyr.data.supply_sentinel）
#
# 诞生背景（2026-09-18 夜班 st-datapack-20260918，altdata_line 09 清单 D1/D2 波1）：
#   股东户数表 2026-07 断供两月无人知（miniqmt 清退后任务空挂）——事件日期列表
#   （公告日/解禁日/决议日）被 L11 integrity_check 的 _BUSINESS_EVENT_DATE_COLS
#   口径强制跳过（日频必误报），成为停更检测盲区。本配置补上表侧 max(date) 停更检测。
#
# 字段：
#   table         全限定表名
#   date_col      判停更的日期列（业务事实锚，非采集时间）
#   max_lag_days  允许的最大落后天数（超限=断供嫌疑，告警）
#   past_only     true=只对 <=today 的行取 max（前瞻/预约类未来行不稀释新鲜度）
#   allow_empty   true=空表放行（新建表首轮回填前宽限）
#
# 阈值定档依据（SOP §10.2：日频>3 天/月频>45 天，按数据节奏折档）：
#   3-10 天   = 逐日有增量的表
#   15-45 天  = 月度节奏/跨披露季节奏的表
#   70 天     = 不规则事件表（月度派生但个别月份可为空）

tables:
  # --- D2 股东户数（断供教训本体；公告日逐日有增量，节假日顺延留余量） ---
  - table: c3_fundamental.shareholder_count
    date_col: announce_date
    max_lag_days: 10
    past_only: true

  # --- J2 限售解禁（增量+前瞻双任务同表；解禁日逐日几乎必有，前瞻行在未来故 past_only） ---
  - table: c3_fundamental.share_unlock
    date_col: unlock_date
    max_lag_days: 5
    past_only: true

  # --- J1/B9 预约披露（披露季节性：1-4/7-8/10 月密集，5-6/9/11-12 月可为空 → 阈值放宽跨季） ---
  - table: c3_fundamental.disclosure_plan
    date_col: announce_date
    max_lag_days: 60
    past_only: true

  # --- J5 央行议息（采集心跳口径：决策日历的源端节奏不均——金十预约场次行可长期
  # 停在最后一场已排会议（2026-09 实查 max(decision_date)=2025-10-30 属源端现实），
  # 按 decision_date 判停更会把"源端没排新会"误报为断供；管线存活的正确度量=ingest_ts 新鲜度） ---
  - table: c1_market.rate_decision_calendar
    date_col: ingest_ts
    max_lag_days: 2
    past_only: false

  # --- J4 指数调仓（月度快照差分派生；中证定期调整在 6/12 月，平常月靠不规则变动，个别月可为空） ---
  - table: c1_market.index_adjustment
    date_col: effective_date
    max_lag_days: 70
    past_only: true

  # --- J9 交割/到期日历（calendar_event 派生月批；futures_delivery 等事件逐月必有，past_only 判 past 窗口） ---
  - table: c1_market.calendar_event
    date_col: event_date
    max_lag_days: 35
    past_only: true

  # --- D3 宏观高频第一梯队六表（2026-09-18 夜班 st-datapack-20260918，altdata_line D3 波1）---
  # 月频五表：report_date=统计期月末。阈值按"下次公布落表前的最大空窗"折档：
  #   PMI 月末次月初公布（空窗≤35d）/ 价格·金融·外贸 次月 10-13 日公布（≤45d）/
  #   实体活动（工增 15 日、固投/失业率最晚 20 日）取 55d。
  - table: c1_market.macro_price_gauge
    date_col: report_date
    max_lag_days: 45
    past_only: true

  - table: c1_market.macro_pmi_gauge
    date_col: report_date
    max_lag_days: 35
    past_only: true

  - table: c1_market.macro_credit_money
    date_col: report_date
    max_lag_days: 45
    past_only: true
    # 注：表内社融列（macro_china_shrzgm）源端 2026-04 起滞更，整表 max(report_date)
    # 由货币/信贷列维持——源端恢复前本阈值不承担社融列单独停更检测。

  - table: c1_market.macro_activity_gauge
    date_col: report_date
    max_lag_days: 55
    past_only: true

  - table: c1_market.macro_trade_gauge
    date_col: report_date
    max_lag_days: 45
    past_only: true

  # --- 宏观日频表：生意社三指数日更（T-1），按日频 5 天档；六大电列为历史段不参与活性 ---
  - table: c1_market.macro_daily_gauge
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # --- D4 物理另类·油价链三件+F13（2026-09-18 夜班 st-datapack-20260918，altdata_line D4 波2）---
  # E8 发改委调价：调价窗口=每 10 个工作日（跨假期最长 ~17 历日），取 25 天档
  - table: c1_market.ndrc_fuel_price
    date_col: announce_date
    max_lag_days: 25
    past_only: true

  # --- 交易所仓单（CZCE 日更维持 max(trade_date)；SHFE 近端 404 缺口由 CZCE 掩护，归档段不算活） ---
  - table: c1_market.futures_warehouse_receipt
    date_col: trade_date
    max_lag_days: 10
    past_only: true

  # --- 公路运价周指数（周频节奏；源端 2026-08-21 后周报暂停仅月报在发——实测现实，阈值放宽至月度档） ---
  - table: c1_market.road_freight_index
    date_col: trade_date
    max_lag_days: 35
    past_only: true

  # --- F13 农产品批发价格 200 指数（日更 T-1，日频 5 天档） ---
  - table: c1_market.agri_wholesale_index
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # --- D5 跨资产·Hyperliquid 四表（2026-09-18 夜班 st-datapack-20260918，altdata_line D5 波2）---
  # 行情快照：7×24 市场每日都有新快照日，2 天档（含周末不漏）；快照维度历史不可回补，断供即永久缺口
  - table: c1_market.hl_perp_snapshot_daily
    date_col: snapshot_date
    max_lag_days: 2
    past_only: true
    allow_empty: true

  # --- 持仓/OI 快照：同行情快照口径 ---
  - table: c1_market.hl_oi_snapshot_daily
    date_col: snapshot_date
    max_lag_days: 2
    past_only: true
    allow_empty: true

  # --- 资金费率：小时事件表，源端逐小时必有增量，3 天档（币圈无节假日） ---
  - table: c1_market.hl_funding_history
    date_col: funding_time
    max_lag_days: 3
    past_only: true
    allow_empty: true

  # --- 清算流：采样口径按采集心跳判（capture_mode=ws_trades_bounded 逐日 30min 窗口，
  # 个别窗口零清算属市场正常态，按 trade_date 判会把"没爆仓"误报为断供；
  # 管线存活的正确度量=ingest_ts 新鲜度，J5 央行议息心跳口径先例） ---
  - table: c1_market.hl_liquidation_raw
    date_col: ingest_ts
    max_lag_days: 2
    past_only: false
    allow_empty: true

  # --- D5 跨资产·H4 中债收益率曲线（2026-09-18 夜班 st-datapack-20260918，altdata_line D5 波2）---
  # 中债估值日频（节假日顺延），5 天档；源滚动窗口≈1年，断供即窗口外历史永久失位
  - table: c1_market.market_china_bond_yield
    date_col: trade_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # --- D6 行情补充·新建四表（2026-09-18 夜班 st-datapack-20260918，altdata_line D6）---
  # 大盘资金流：东财大盘口径日频（源滚动窗口~120交易日），日频 5 天档；断供即窗口外历史永久失位
  - table: c1_market.market_fund_flow_daily
    date_col: trade_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # ETF 份额快照：日频 5 天档；快照积累制断供即差分基线断档
  - table: c1_market.market_etf_share_snapshot
    date_col: trade_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # 中金所前20会员排名：交易日日更 5 天档；接口按日期可回查，断供可补但任务失效须告警
  - table: c1_market.market_cffex_member_ranking
    date_col: trade_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # 可转债条款快照：快照积累制 5 天档；断供即条款状态演变轨迹断档
  - table: c1_market.market_convertible_bond_clause
    date_col: snapshot_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # --- D6 行情补充·既有表验活补哨兵（2026-09-18 夜班 st-datapack-20260918）---
  # 以下表已存在且有活跃任务（本次查重核实 max(date) 新鲜），此前不在哨兵覆盖，补齐：
  # 个股资金流（tushare 主源/akshare fallback，交易日日更）
  - table: c1_market.money_flow
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # 板块资金流（THS 快照，交易日盘中累计；由采集管线日更）
  - table: c1_market.sector_fund_flow
    date_col: trade_date
    max_lag_days: 5
    past_only: true
    allow_empty: true

  # 大宗交易（每日明细+每日统计双任务，交易日日更）
  - table: c1_market.block_trade
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  - table: c1_market.block_trade_detail
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # 可转债日K线（新浪 bond_zh_hs_cov_daily，交易日日更）
  - table: c1_market.kline_cb
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # 可转债隐波（派生表 T-1 口径，5 天档）
  - table: c1_market.convertible_bond_iv
    date_col: trade_date
    max_lag_days: 5
    past_only: true

  # --- D7 文本抽取（2026-09-18 夜班 st-datapack-20260918，altdata_line D7 波3）---
  # C6 互动易问答：平台工作日问答持续产出，节假日减少——7 天档防周末误报
  - table: c3_fundamental.irm_interactive_qa
    date_col: question_date
    max_lag_days: 7
    past_only: true
  # C9 调研纪要：披露呈脉冲（财报季后密集、淡季可数周稀疏）——45 天档
  - table: c3_fundamental.ir_activity_record
    date_col: publish_date
    max_lag_days: 45
    past_only: true
