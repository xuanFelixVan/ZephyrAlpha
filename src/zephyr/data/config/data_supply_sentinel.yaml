  # +美国长周末余量 → 12 天档。⚠ 上游为金十 datacenter dc_cftc_* 族——与 2025-10 停更的
  # 议息日历族（dc_*_calendar）不是同一报表：2026-09-18 实测 max(report_date)=2026-09-08 仍周更，
  # 故本行按 report_date 业务口径判停更（非 ingest_ts 心跳口径）；一旦金十整站退役，本行会先于
