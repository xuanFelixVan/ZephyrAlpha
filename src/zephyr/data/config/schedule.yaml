# [BLUEPRINT] MOD-L00-004 | docs/03_modules/_domain_data/data_source_integrator_blueprint.md
# [MODULE] zephyr.data.config.schedule
# [DOMAIN] D_DATA
# [TTL] permanent
# 调度计划真源（蓝图 §6.2 调度计划；当前 16 个时段槽位，2026-08-17 实测）
# cron 格式: 分 时 日 月 周（APScheduler 标准）
# executor: realtime(4线程,盘中实时) / intraday_minute(4线程,盘中分钟K线) / default(8线程,可并行源) / heavy(2线程,串行源如QMT)
#
# 分层架构（L0~L11，对标专业机构实践 2026-07-12 v2 起持续扩展）：
# L1 盘中实时层 — 交易时段高频轮询，独占realtime算力，含港股K线（影响盘中决策）
# L2 盘中分钟K线层 — 交易时段分钟K线滚动更新（替代盘后一次性拉取）
# L3 事件驱动层 — 7×24 持续轮询，来了就处理（新闻/研报/EDB宏观）
# L4 盘后日K线层 — 收盘后日/周/月K线+复权+估值+指标
# L5 盘后资金面层 — 资金流向/龙虎榜/大宗/期货/股本变动/美股（盘后拉取昨日数据）
# L6 盘后事件层 — 分析师预期/财报快报/审计/分红配股/质押/披露计划
# L7 夜间财务层 — 财务报表/融资融券(T+1)/十大股东
# L8 周末校准层 — 全量校准/TDX板块/概念板块/美股全量
# L9 月初静态层 — 静态列表刷新
# L10 周末补下载层 — 检测过去7天缺失数据并精准补下载（不依赖last_key，查CH实际行数）
# L10.5 每日盘后补下载层 — 盘后检测当日缺口并自动补下载（治本#ARCH-DATA-TICK-GAP-001，当天发现当天补）
# L11 每日完整性巡检层 — 盘后全表数据达标检测（动态发现tasks.yaml全表，不达标告警）

schedules:
  # L0.5 盘前元数据层：08:30 周一至周五（JOB-077，2026-08-15）
  # 开市前刷新 universe 构造与回测撮合约束前提数据（股票基本信息/涨跌停价格/
  # 停复牌/指数成分/ST状态），供盘中策略与打板回测消费；全部 akshare 源，
  # 不依赖 QMT 服务器。配合盘后 daily_capital(18:00) 双调度点。
  pre_market:
    cron: "34 8 * * 0-4"
    executor: default
    description: "盘前元数据层——JOB-077 股票基本信息/涨跌停价格/停复牌/指数成分/ST状态（universe构造与回测撮合约束前提）"

  # L1 盘中实时层：每5分钟在交易时段轮询（9:00-15:59，周一至周五）
  intraday_realtime:
    cron: "*/5 9-15 * * 0-4"
    executor: realtime
    description: "盘中实时层——Tick/L2/Greeks/IV/期货/涨跌停/集合竞价/港股K线"

  # L2 盘中分钟K线层：每5分钟在交易时段滚动更新（9:00-15:59，周一至周五）
  intraday_minute:
    cron: "*/5 9-15 * * 0-4"
    executor: intraday_minute
    description: "盘中分钟K线层——A股/ETF/LOF分钟K线盘中滚动更新"

  # L2.5 盘中板块K线层：每5分钟在交易时段通过mootdx TCP直连获取880xxx板块分钟K线
  # 独立执行器，避免被miniqmt全市场分钟K线慢任务（~5000股）阻塞
  intraday_sector:
    cron: "*/5 9-15 * * 0-4"
    executor: intraday_sector
    description: "盘中板块K线层——880xxx板块分钟K线（mootdx TCP直连，独立于miniqmt慢任务）"

  # L3 事件驱动层：每3分钟持续轮询（7×24）
  # 盘中实时分析需要新闻尽快入库，从*/5提速到*/3（一轮~2min，3min够用留1min余量）。
  # 注：一个任务只能属于一个schedule（scheduler精确字符串匹配），无法精确做到"盘中3/盘后5"，
  # 故全局*/3；盘后多跑几次无害（新闻源盘后少更新、去重兜底、一轮仅~2min）。
  event_driven:
    cron: "*/3 * * * *"
    executor: default
    description: "事件驱动层——快新闻(含海外RSS)/EDB宏观数据，每3分钟轮询"

  # L3.5 慢新闻层：个股新闻(stock_em)/研报(research_report) 5523只串行限流~90min，
  # 独立 max_instances(APScheduler默认1) 不阻塞 event_driven 快新闻轮询。
  # stock_em 与 research_report 共享 akshare 单例的 60次/分 限流额度，并行各~180min（总时间与串行相同，限流是瓶颈）。
  news_slow:
    cron: "17,47 * * * *"    # 每30分钟触发；max_instances=1 下跑完才再跑，实际~90-180min/轮
    executor: default        # 复用8线程池（慢任务仅占2线程，快任务仍有6线程可用）
    description: "慢新闻层——个股新闻(stock_em)/研报(research_report)，独立队列不堵 event_driven 快新闻"

  # L4 盘后日K线层：16:30 周一至周五
  daily_crypto:
    cron: "41 8 * * *"
    executor: default   # 2026-09-16 治本：原 light 在 scheduler.py 执行器字典中不存在（default/heavy/realtime/intraday_minute/intraday_sector），APScheduler 注册不校验、每日 08:30 触发时 Executor lookup failed 并移除 job——该任务自上线从未自动跑成过（水位全靠手动）。改挂通用池（08:30 空闲时段无争抢）。
    description: "币圈日线层——7×24 市场 UTC 日界，北京 08:30=UTC 00:30 拉上一完整 UTC 日（每日含周末）"
  daily_kline:
    cron: "30 16 * * 0-4"
    executor: heavy
    description: "盘后日K线层——日/周/月K线+复权+估值+指标+ETF净值"

  # L5 盘后资金面层：18:00 周一至周五
  daily_capital:
    cron: "00 18 * * 0-4"
    executor: default
    description: "盘后资金面层——资金流向/龙虎榜/大宗/期货/股本变动/限售解禁/美股"

  # L6 盘后事件层：19:00 周一至周五（从daily_capital拆分，错峰执行）
  daily_event:
    cron: "00 19 * * 0-4"
    executor: default
    description: "盘后事件层——分析师预期/财报快报/审计/分红配股/质押/披露计划"

  # L6.5 研报明细层：20:30 周一至周五（全市场逐股拉取约 2h，独立时段不与 daily_event 抢池）
  research_nightly:
    cron: "30 20 * * 0-4"
    executor: default
    max_instances: 1
    description: "研报明细层——research_report_detail_incremental（东财研报中心全字段含预测期EPS/PE；历史已回补 14.7 万行，日度仅补增量窗口）"

  # L6.9 一致预期管线双向验证层：23:30 周一至周五（跑在 19:00 同花顺快照 + 20:30 研报增量 +
  # consensus_daily_build 重建全部完成后）。独立真源互查：自建聚合 vs 同花顺快照——秩相关/
  # 新鲜度/结构断言/PIT 零修正率，结果落 c1_market.cross_validation_log，异常经 Alerter 告警。
  # 2026-09-14 源污染事件治本配套（设计档案=policies/expectation_consumption_design_policy.md §9）。
  consensus_crosscheck:
    cron: "30 23 * * 0-4"
    executor: default
    max_instances: 1
    description: "一致预期管线双向验证——自建聚合 vs 同花顺快照每日对答案（独立真源互查，非数据下载层）"

  # L7 夜间财务层：22:00 周一至周五（融资融券T+1此时已发布）
  nightly_financial:
    cron: "00 22 * * 0-4"
    executor: heavy
    description: "夜间财务层——财报/财务指标/十大股东/融资融券(T+1)"

  # L8 周末后校准层：周一 03:00（周末后首个工作日，QMT服务器可用；与L10补下载02:00错峰1小时）
  # 原周六02:00已废弃：miniqmt源任务周末连不上QMT服务器(error 10061 WSAECONNREFUSED)
  weekend_calibration:
    cron: "00 3 * * 0"
    executor: heavy
    description: "周末后校准层——全量校准/TDX板块/概念板块/美股全量（周一03:00，QMT可用）"

  # L9 月初静态层：每月1日 09:00
  monthly_static:
    cron: "16 9 1 * *"
    executor: default
    description: "月初静态层——股票列表/板块分类/指数成分/交易日历"

  # L10 周末补下载层：周一 02:00（周末后首个工作日；APScheduler 0=周一，非周日）
  # 与L8校准层(03:00)错峰：先补下载缺失数据，再做全量校准
  weekend_backfill:
    cron: "00 2 * * 0"
    executor: heavy
    description: "周末补下载层——检测过去7天缺失的tick/K线数据并精准补下载"

  # L10.5 每日盘后补下载层：17:00 周一至周五（盘后日K线16:30之后，盘中数据已写入）
  # 治本（#ARCH-DATA-TICK-GAP-001, 2026-07-30）：
  #   QMT 盘中断连时 intraday_realtime 无法采集 tick_data，L10 weekend_backfill 仅周一运行要等5天。
  #   本层每日盘后检测当日全表缺口并自动补下载——当天发现当天补，不再等到周末。
  #   与 L11 integrity_check(23:00只告警) 的区别：本层检测+补下载，L11只检测+告警。
  daily_backfill:
    cron: "00 17 * * 0-4"
    executor: heavy
    description: "每日盘后补下载层——检测当日数据缺口并自动补下载（治本#ARCH-DATA-TICK-GAP-001）"

  # L11 每日完整性巡检层：23:00 周一至周五（所有盘后时段之后，确保数据已写入）
  integrity_check:
    cron: "00 23 * * 0-4"
    executor: default
    description: "每日完整性巡检层——动态发现全表检测当日数据是否达标，不达标告警"

  # L10.7 调度对账补跑层：05:30 每日（含周末；#ARCH-DATA-CATCHUP-001, 2026-09-03）
  # 治本：monthly_static(月初09:00) 等 cron 错过无补跑——9/1 调度器 10:37 才被守护拉起，
  #   整月静态表批次错过空缺 32 小时（sector_list/index_list/hk_stock_list 等 8 表）。
  # 与 L10/L10.5 分工：本层按"任务档期 vs progress_store 打卡记录"对账（月度/周度/日频
  #   overdue + 静态表空表兜底），L10/L10.5 按"表内行数缺口"检测，L11 只告警不补跑。
  # 05:30 而非 03:30：周一凌晨已堆 L10(02:00 heavy)+L8(03:00 heavy) 两件重活，
  #   03:30 正落 L8 运行窗口内（源配额竞争）；05:30 错峰，RUNNING 跳过仅作兜底。
  # 不进 TRADING_DAY_GUARDED_SCHEDULES：守卫本身须非交易日可跑；miniqmt 任务的
  #   trading_day_only 晚点在 catchup_guard 模块内逐任务处理。
  catchup_guard:
    cron: "30 5 * * *"
    executor: default
    description: "调度对账补跑层——检测错过档期的任务并自动补跑（月度/周度/日频 overdue + 空表兜底）"

  # 夜间情绪窗层：08:20 日频（窗口 [T-1 18:00, T 08:00) 08:00 闭合后 20 分钟起步，
  # 给 news_data 300s flush 缓冲留余量）。MOD-INT-NEWS-NIGHT 接线（2026-09-10，
  # 治本 known_data_gaps news_sentiment_window_no_scheduler_wiring——写入器此前零调用方，
  # 表存量全靠 ad-hoc 回填）。全周 7 天运行：窗口归属日连续覆盖含周末（degraded 行占位不留洞），
  # 近 7 日缺口自愈补跑（停机错过次日自动补齐）。
  nightly_sentiment:
    cron: "20 8 * * *"
    executor: default
    description: "夜间情绪窗层——compute_nightly_sentiment 日频接线（当日窗口+近7日缺口补跑，ReplacingMergeTree 幂等）"

  # L0 集合竞价高频层：9:15-9:25 每10秒抓取五档盘口（cron 6段：second minute hour day month day_of_week）
  # 用于主力挂撤单行为分析。间隔从3秒调整为10秒：全量~5200标的 get_full_tick 批量抓取耗时>3s，
  # 在 max_instances=1+coalesce=True 下 3秒间隔会导致后续触发全部 collapse 为1次（实测仅出1次快照）。
  # 10秒间隔确保单次抓取完成后再触发下一次，600秒窗口内可获~60次快照，满足主力行为分析需求。
  # 改用 cron 6 段（含 second）替代 interval trigger，避免 IntervalTrigger 全天每10秒唤醒刷屏日志
  auction_highfreq:
    type: cron
    cron: "*/10 15-25 9 * * 0-4"
    executor: realtime
    description: "集合竞价高频层——9:15-9:25每10秒抓取五档盘口快照，用于主力行为分析"

  # L12 另类宏观日频层：工作日 23:35（ECB 参考汇率发布≈北京 22:15-23:15 之后）
  # L1 上架流水线首个正门槽位（夜班战役台账 §1.5）；假日缺价由保守游标下一班自愈
  daily_alt_fx:
    cron: "35 23 * * 0-4"
    executor: default
    max_instances: 1
    description: "另类宏观日频层——ECB 汇率（alt_fx_ecb/frankfurter.app）盘后拉取"

  # L13.5 日终对账档期：15:40 周一至周五（收盘 15:00 + 柜台/经纪商日终批处理窗之后，
  # 且早于 L4 daily_kline 16:30，使对账结论当日可用于盘后链路）。全流通战役 R-015 排班：
  # 唯一入口=src/zephyr/trading/recon_runner.py:392 run_daily_reconciliation（日终核对批，
  # 非自愈 reconciler 环路——宪法 §9.3"reconciler 必须事件触发"约束的是自愈环，本槽位是
  # 定时事实核对，与 L11 integrity_check 同性质）；盘中持仓对账走 position 事件入口（R-015）。
  # 注：execution_report 的事件扇出（PositionReconciler.handle_execution_report）属 z-land 实现面，
  # 本车道只排班+哨兵，不碰其实现。
  eod_reconciliation:
    cron: "40 15 * * 0-4"
    executor: default
    max_instances: 1
    description: "日终对账层——recon_runner.run_daily_reconciliation 三账核对（柜台/内部/持仓），产出 execution_report 侧留痕并触发告警"

  # L13 数据断供哨兵层：每日 06:50（表侧 max(date) 停更检测，MOD-L00-004-SS）
  # 与 L10.7 catchup_guard(05:30 调度侧对账) 分工：本层=表内数据新鲜度（SOP §10.2 停更阈值）。
  # 诞生背景=股东户数断供两月无人知（事件日期表被 L11 日频口径强制跳过的盲区）。
  # 含周末运行：停更检测须在周末继续盯（周末断供周一才报=重演两月盲区）。
  # 2026-09-18 全流通战役 st-ff-sentinel 托管扩权：本槽位同时是 **quality_sentinel
  # （L11 同族变异巡检：1970 纪元/时区偏移/空段）的排班正门**——宿主
  # supply_sentinel.run_supply_sentinel -> _run_hosted_quality_sweep ->
  # quality_sentinel.run_hosted_sweep。为什么不在本文件另开 `quality_sentinel:` 槽位：
  # scheduler.py:_run_special_schedule 是硬编码白名单（scheduler.py 非本车道可写面），
  # 新开有名无实的槽位会落到 run_schedule 的"时段 X 无任务"分支后静默返回成功
  # （scheduler.py:2110）= R-021 假通道。四要素落点与 7 天节奏闸真源见
  # config/quality_sentinel_tables.yaml 的 wiring 块；停摆总闸=
  # data/runtime/quality_sentinel.disabled（每次触发实查，即时生效）。
  data_supply_sentinel:
    cron: "50 6 * * *"
    executor: default
    description: "数据断供哨兵——业务新鲜度/维度切片/行数地板/关键列填充率停更检测（配置=config/data_supply_sentinel.yaml）+ 托管 quality_sentinel 三类变异巡检（配置=config/quality_sentinel_tables.yaml，7 天节奏闸），告警经 Alerter"


  # L13.5 交易日历逐日 diff 检查器：每日 07:10（哨兵 06:50 之后）。交易日历×表内日期集合
  # 逐日差集（补 max-date 原理性失明：tick 09-17 内部洞/stock_basic 09-16 缺日型盲区，
  # MOD-L00-004-CCC）。随本槽事件触发，无自建常驻进程（宪法 §9.3）。
  calendar_coverage_check:
    cron: "10 7 * * *"
    executor: default
    description: "交易日历逐日覆盖检查——日频族表逐交易日 diff 缺日/多余日清单（zephyr.data.calendar_coverage_checker，告警经 Alerter）"

  # L14 日循环总扳手自动圈：16:45 周一至周五（日K线层 16:30 落库窗口之后、补下载层
  # 17:00 之前）。原 MANUAL-ONLY 约束经 Owner 批准解除（2026-09-21，st-dloop-20260921）：
  # 编排型调用走特殊槽（同 nightly_sentiment/consensus_crosscheck 先例），不入 tasks.yaml
  # 表构建管线。run_daily_loop(None) 无参=自动解析最新业务日；幂等=全量委托底层模块既有
  # 闸（prediction_log UNIQUE/台账查重/业务日记号），可安全重跑；零下单（裁定#305 安全态）。
  # 总闸=data/runtime/daily_loop_master.disabled（每次触发实查，即时生效）。
  # 周末已由 cron 排除；法定假日空跑由底层幂等闸+数据就绪门（fail-closed）吸收。
  dloop_post:
    cron: "45 16 * * 0-4"
    executor: default
    max_instances: 1
    description: "日循环总扳手自动圈——run_daily_loop(None) 全链排班编排（预案/盘中/收盘/结算/拍板，观察记录模式零下单），失败 ERROR 告警经 Alerter"
