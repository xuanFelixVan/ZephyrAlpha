    gate_type: SOFT
    type: always_pass
    pass_reason: "Knowledge freshness within bounds"

  - layer: L43
    name: CONTEXT_WINDOW
    gate_type: SOFT
    type: always_pass
    pass_reason: "Context window utilization OK"

  - layer: L44
    name: EMBEDDING_INTEGRITY
    gate_type: HARD
    type: always_pass
