# --- 治理锚定 ---
# blueprint: MOD-INF-010 | docs/03_modules/_cross_layer/feedback-loop/blueprint.md | §
# module_id: MOD-INF-010
# stability: evolving
# safety_level: M
# ai_autonomy: ai_modifiable
# --- 治理锚定结束 ---
# SafetyGate 参数化配置 — SRC-0058~0062
# 67 层安全门禁规则，全部配置驱动
# 规则类型：threshold / boolean / frequency / enum / observe / always_pass / custom

rules:
  # === L1-L10: 基础阈值与频率控制 ===
  - layer: L1
    name: BASIC_THRESHOLD
    gate_type: HARD
    type: always_pass
    pass_reason: "Basic threshold check passed"

  - layer: L2
    name: FREQUENCY_LIMIT
    gate_type: SOFT
    type: frequency
    key_field: action_type
    limit: 10
    reject_reason: "Frequency limit {limit}/24h exceeded for action"

  - layer: L3
    name: TRADING_SILENCE
    gate_type: WARN
    type: custom
    handler: zephyr.feedback_loop.gates.parameterized_safety_gate._l3_trading_silence

  - layer: L4
    name: DEPENDENCY_HEALTH
    gate_type: HARD
    type: custom
    handler: zephyr.feedback_loop.gates.parameterized_safety_gate._l4_dependency

  - layer: L5
    name: BUDGET_ENFORCE
    gate_type: HARD
    type: threshold
    field: cost_estimate
    op: gt
    threshold: 0
    reject_reason: "Cost {value} > budget remaining"
    # Note: actual budget check uses ctx.cost_estimate > ctx.budget_remaining

  - layer: L6
    name: ROLLBACK_INTEGRITY
    gate_type: HARD
    type: boolean
    field: has_rollback
    expected: true
    reject_on: mismatch
    reject_reason: "No rollback plan for IRREVERSIBLE action"

  - layer: L7
    name: IDEMPOTENCY
    gate_type: HARD
    type: always_pass
    pass_reason: "NON_IDEMPONTENT: single-concurrency enforced"

  - layer: L8
    name: CONFIG_AS_CODE
    gate_type: WARN
    type: always_pass
    pass_reason: "Config-as-code: WARN on manual config change"

  - layer: L9
    name: FLAG_INTERACTION
    gate_type: SOFT
    type: always_pass
    pass_reason: "Flag interaction check passed"

  - layer: L10
    name: DB_INTEGRITY
    gate_type: HARD
    type: threshold
    field: data_quality_score
    op: lt
    threshold: 50.0
    reject_reason: "Database integrity: data quality critical ({value})"

  # === L11-L20: 数据与安全 ===
  - layer: L11
    name: PROVENANCE_CHAIN
    gate_type: HARD
    type: boolean
    field: provenance_verified
    expected: true
    reject_on: mismatch
    reject_reason: "Provenance chain broken"

  - layer: L12
    name: SCHEMA_VERSIONING
    gate_type: HARD
    type: custom
    handler: zephyr.feedback_loop.gates.parameterized_safety_gate._l12_schema

  - layer: L13
    name: SESSION_AWARE
    gate_type: WARN
    type: always_pass
    pass_reason: "Session context intact"

  - layer: L14
    name: RBAC
    gate_type: HARD
    type: boolean
    field: rbac_authorized
    expected: true
    reject_on: mismatch
    reject_reason: "RBAC: unauthorized"

  - layer: L15
    name: DEPLOY_SECURITY
    gate_type: HARD
    type: boolean
    field: deploy_artifact_signed
    expected: true
    reject_on: mismatch
    reject_reason: "Deploy security: unsigned artifact"

  - layer: L16
    name: ONLINE_ADAPTATION
    gate_type: WARN
    type: threshold
    field: online_adaptation_rate
    op: gt
    threshold: 1.0
    reject_reason: "Online adaptation rate {value} exceeds max"

  - layer: L17
    name: AUTONOMY_BOUNDARY
    gate_type: HARD
    type: threshold
    field: autonomy_level
    op: gt
    threshold: 4
    reject_reason: "Autonomy level {value} > max 4"

  - layer: L18
    name: CONTINUAL_LEARNING
    gate_type: WARN
    type: threshold
    field: ewc_risk
    op: gt
    threshold: 0.8
    reject_reason: "EWC catastrophic forgetting risk: {value}"

  - layer: L19
    name: COGNITIVE_OVERLOAD
    gate_type: SOFT
    type: threshold
    field: owner_fatigue
    op: gt
    threshold: 0.7
    reject_reason: "Owner fatigue {value:.2f} > 0.7: defer non-P0"

  - layer: L20
    name: FLE_INTEGRITY
    gate_type: HARD
    type: boolean
    field: has_self_modification_audit
    expected: true
    reject_on: mismatch
    reject_reason: "Self-modification not audited"

  # === L21-L27: 供应链与合规 ===
  - layer: L21
    name: SUPPLY_CHAIN_CVE
    gate_type: HARD
    type: observe
    field: cve_alerts
    reject_reason: "CVE alerts active: {value}"

  - layer: L22
    name: DATA_FOUNDATION
    gate_type: HARD
    type: threshold
    field: data_quality_score
    op: lt
    threshold: 80.0
    reject_reason: "Data quality {value:.1f} < threshold 80"

  - layer: L23
    name: META_PERFORMANCE
    gate_type: SOFT
    type: always_pass
    pass_reason: "Self-assessment: performance nominal"

  - layer: L24
    name: AGENTIC_OPS
    gate_type: WARN
    type: always_pass
    pass_reason: "Agent lifecycle: OK"

  - layer: L25
    name: LLM_QUALITY
    gate_type: HARD
    type: boolean
    field: llm_provider_healthy
    expected: true
    reject_on: mismatch
    reject_reason: "LLM provider unhealthy"

  - layer: L26
    name: CHAOS_GOVERNANCE
    gate_type: WARN
    type: always_pass
    pass_reason: "Chaos governance: experiments isolated"

  - layer: L27
    name: COMPLIANCE
    gate_type: HARD
    type: boolean
    field: compliance_ok
    expected: true
    reject_on: mismatch
    reject_reason: "Compliance violation detected"

  # === L28-L29: DR与供应链 ===
  - layer: L28
    name: DR_READINESS
    gate_type: HARD
    type: threshold
    field: last_drill_days
    op: gt
    threshold: 90.0
    reject_reason: "DR drill {value:.0f}d overdue > 90d limit"

  - layer: L29
    name: SUPPLY_CHAIN
    gate_type: HARD
    type: custom
    handler: zephyr.feedback_loop.gates.parameterized_safety_gate._l29_supply_chain

  # === L30-L67: 扩展层 (从 safety_gate_L28_L29 ~ L66_L67 提取) ===
  - layer: L30
    name: CANARY_ROLLOUT
    gate_type: HARD
    type: threshold
    field: canary_success_rate
    op: lt
    threshold: 0.95
    reject_reason: "Canary success rate {value:.2f} < 0.95"

  - layer: L31
    name: ROLLBACK_READINESS
    gate_type: HARD
    type: threshold
    field: rollback_success_rate
    op: lt
    threshold: 0.9
    reject_reason: "Rollback success rate {value:.2f} < 0.9"

  - layer: L32
    name: DR_AUTOMATION
    gate_type: HARD
    type: always_pass
    pass_reason: "DR automation check passed"

  - layer: L33
    name: SUPPLY_CHAIN_TRUST
    gate_type: HARD
    type: threshold
    field: skill_trust
    op: lt
    threshold: 0.5
    reject_reason: "Skill trust {value:.2f} < 0.5"

  - layer: L34
    name: CVE_RESPONSE
    gate_type: HARD
    type: observe
    field: active_cves
    reject_reason: "Active CVE: {value}"

  - layer: L35
    name: DRIFT_GOVERNANCE
    gate_type: HARD
    type: threshold
    field: drift_score
    op: gt
    threshold: 0.8
    reject_reason: "Drift score {value:.2f} > 0.8 threshold"

  - layer: L36
    name: FEATURE_FLAG_SAFETY
    gate_type: SOFT
    type: boolean
    field: feature_flag_conflict
    expected: false
    reject_on: match
    reject_reason: "Feature flag conflict detected"

  - layer: L37
    name: CHAOS_ISOLATION
    gate_type: WARN
    type: boolean
    field: chaos_isolated
    expected: true
    reject_on: mismatch
    reject_reason: "Chaos experiment not properly isolated"

  - layer: L38
    name: BUDGET_FORECAST
    gate_type: HARD
    type: always_pass
    pass_reason: "Budget forecast within limits"

  - layer: L39
    name: COST_ANOMALY
    gate_type: HARD
    type: always_pass
    pass_reason: "No cost anomaly detected"

  - layer: L40
    name: MULTI_AGENT_COORD
    gate_type: HARD
    type: always_pass
    pass_reason: "Multi-agent coordination OK"

  - layer: L41
    name: AGENT_HEALTH
    gate_type: HARD
    type: always_pass
    pass_reason: "Agent health check passed"

  - layer: L42
