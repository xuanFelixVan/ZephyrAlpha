    - "OWASP LLM02: Training Data Extraction"
    - "OWASP LLM03: Model Denial of Service"
    - "OWASP LLM04: Supply Chain Attacks"
    - "OWASP LLM05: Sensitive Information Disclosure"
    - "OWASP LLM06: Extraneous Functionality"
    - "OWASP LLM07: Overreliance"
    - "OWASP LLM08: Model Theft"
    - "OWASP LLM09: Model Skewing"
    - "OWASP LLM10: AI Supply Chain"
    - "MITRE ATLAS v5.4"
