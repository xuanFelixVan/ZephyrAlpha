# ============================================================================
# ZephyrAlpha — 路由串联清单 (Route Manifest)
# ============================================================================
# 版本: 1.0.0 | 创建: 2026-05-05
# phase: C — 模型冻结与路由串联
# owner: ZephyrAlpha-Owner
#
# 用途: 定义全系统端到端数据流路由拓扑。
#       逐层声明：生产者 → 消费者 + 传递的数据合约 + 幂等键穿透链。
#
# SSoT: cross-layer-contracts.yaml v3.0 / freeze_manifest.yaml v1.0.0
# ============================================================================

route_manifest_version: "1.0.0"
created: "2026-05-05"
phase: "C"

# ── 主业务管线 (Primary Pipeline) ──
# L00 → L02 → L03 → L04 → L05 → L06 → L07 → L08
# 这是系统的黄金路径，数据从原料到最终界面的一条直线
primary_pipeline:
  route_id: "PIPE-MAIN-001"
  name: "生产主管线"
  desc: "从行情获取到 Dashboard 展现的全流程黄金路径"
  topology: L00 > L02 > L03 > L04 > L05 > L06 > L07 > L08

  segments:
    - hop: 1
      from: "L00 (Data Source)"
      to: "L02 (Alpha Factor)"
      contract: "NormalizedMarketData (CTR-001)"
      from_file: "src/zephyr/l00_data_source/provider_base.py"
      to_file: "src/zephyr/l02_alpha_factor/factor_base.py"
      direction: "push"
      latency_budget_ms: 500

    - hop: 2
      from: "L02 (Alpha Factor)"
      to: "L03 (Signal Generation)"
      contract: "FactorSignal (CTR-002)"
      from_file: "src/zephyr/l02_alpha_factor/factor_base.py"
      to_file: "src/zephyr/l03_signal_generation/aggregator_base.py"
      direction: "push"
      latency_budget_ms: 200

    - hop: 3a
      from: "L03 (Signal Generation)"
      to: "L04 (Risk Management)"
      contract: "SynthesizedSignal (CTR-P1-015)"
      from_file: "src/zephyr/l03_signal_generation/aggregator_base.py"
      to_file: "src/zephyr/l04_risk_management/stop_loss.py"
      direction: "push"
      latency_budget_ms: 100

    - hop: 3b
      from: "L03 (Signal Generation)"
      to: "L05 (Portfolio Construction)"
      contract: "CapitalAllocationResult (CTR-P1-003)"
      from_file: "src/zephyr/l03_signal_generation/aggregator_base.py"
      to_file: "src/zephyr/l05_portfolio_construction/strategy_base.py"
      direction: "push"
      latency_budget_ms: 100

    - hop: 4
      from: "L05 (Portfolio Construction)"
      to: "L06 (Trade Execution)"
      contract: "Order (CTR-004)"
      from_file: "src/zephyr/l05_portfolio_construction/strategy_base.py"
      to_file: "src/zephyr/l06_trade_execution/broker_interface.py"
      direction: "push"
      latency_budget_ms: 100

    - hop: 5a
      from: "L06 (Trade Execution)"
      to: "L07 (Post-Trade Analytics)"
      contract: "Fill (CTR-005)"
      from_file: "src/zephyr/l06_trade_execution/broker_interface.py"
      to_file: "src/zephyr/l07_post_trade_analytics/analytics_base.py"
      direction: "push"
      latency_budget_ms: 500

    - hop: 5b
      from: "L06 (Trade Execution)"
      to: "L04 (Risk Management)"
      contract: "PositionSnapshot (CTR-006)"
      from_file: "src/zephyr/l06_trade_execution/broker_interface.py"
      to_file: "src/zephyr/l04_risk_management/stop_loss.py"
      direction: "push"
      latency_budget_ms: 200

    - hop: 6
      from: "L07 (Post-Trade Analytics)"
      to: "L08 (Human-AI Interface)"
      contract: "ExecutionReport (CTR-P1-007) / PerformanceAttributionReport (CTR-P1-009)"
      from_file: "src/zephyr/l07_post_trade_analytics/analytics_base.py"
      to_file: "src/zephyr/l08_human_ai_interface/dashboard/app.py"
      direction: "push"
      latency_budget_ms: 500

# ── 研究创新管线 (Research Pipeline) ──
# L09 → L13 → (L05 / L03 反向提升)
research_pipeline:
  route_id: "PIPE-RESEARCH-001"
  name: "研究创新管线"
  desc: "策略研究 → 回测 → 实验验证 → 胜出策略提升至生产"
  topology: L00 > L09 > L13 > (L05 | L03)

  segments:
    - hop: 1
      from: "L00 (Data Source)"
      to: "L09 (Research)"
      contract: "NormalizedMarketData (CTR-001)"
      direction: "pull"
      latency_budget_ms: 1000

    - hop: 2
      from: "L09 (Research)"
      to: "L13 (Experimentation)"
      contract: "BacktestResult (L09 internal)"
      from_file: "src/zephyr/l09_research_innovation/backtest_base.py"
      to_file: "src/zephyr/l13_experimentation/pipeline_base.py"
      direction: "push"
      latency_budget_ms: 500

    - hop: 3a
      from: "L13 (Experimentation)"
      to: "L05 (Portfolio Construction)"
      contract: "ExperimentResult (CTR-P1-014)"
      from_file: "src/zephyr/l13_experimentation/pipeline_base.py"
      to_file: "src/zephyr/l05_portfolio_construction/strategy_registry.py"
      direction: "promote"
      gate: "confidence >= 0.7 AND conclusion == supported"

    - hop: 3b
      from: "L13 (Experimentation)"
      to: "L03 (Signal Generation)"
      contract: "ExperimentResult (CTR-P1-014)"
      from_file: "src/zephyr/l13_experimentation/pipeline_base.py"
      to_file: "src/zephyr/l03_signal_generation/aggregator_base.py"
      direction: "promote"
      gate: "confidence >= 0.7 AND conclusion == supported"

    - hop: 3c
      from: "L13 (Experimentation)"
      to: "L09 (Research)"
      contract: "ExperimentResult (CTR-P1-014)"
      from_file: "src/zephyr/l13_experimentation/pipeline_base.py"
      to_file: "src/zephyr/l09_research_innovation/backtest_base.py"
      direction: "feedback"
      gate: "archived_to_kms == true"

# ── ML 管线 (ML Pipeline) ──
# L11 → (L03, L05) 推理服务
ml_pipeline:
  route_id: "PIPE-ML-001"
  name: "ML Platform 管线"
  desc: "模型训练 → 注册 → 推理 → 信号/决策增强"
  topology: L00 > L11 > (L03 | L05)

  segments:
    - hop: 1
      from: "L00 (Data Source)"
      to: "L11 (ML Platform)"
      contract: "NormalizedMarketData (CTR-001)"
      direction: "pull"
      latency_budget_ms: 1000

    - hop: 2a
      from: "L11 (ML Platform)"
      to: "L03 (Signal Generation)"
      contract: "ModelServingResponse (CTR-P1-005)"
      from_file: "src/zephyr/l11_ml_platform/inference_base.py"
      to_file: "src/zephyr/l03_signal_generation/aggregator_base.py"
      direction: "push"

    - hop: 2b
      from: "L11 (ML Platform)"
      to: "L05 (Portfolio Construction)"
      contract: "ModelServingResponse (CTR-P1-005)"
      from_file: "src/zephyr/l11_ml_platform/inference_base.py"
      to_file: "src/zephyr/l05_portfolio_construction/strategy_base.py"
      direction: "push"

# ── 合规治理管线 (Compliance Pipeline) ──
# L10 — 全层横切监控
compliance_pipeline:
  route_id: "PIPE-COMPLIANCE-001"
  name: "合规治理横切管线"
  desc: "L10 全层合规扫描 → 审计决策 → 阻断/放行"
  topology: "* (all layers) > L10 > * (all layers)"

  segments:
    - hop: 1
      from: "L04 (Risk Management)"
      to: "L10 (Compliance)"
      contract: "RiskMetrics (CTR-P1-006)"
      direction: "monitoring"

    - hop: 2
      from: "L06 (Trade Execution)"
      to: "L10 (Compliance)"
      contract: "Order (CTR-004) / Fill (CTR-005)"
      direction: "monitoring"

    - hop: 3a
      from: "L10 (Compliance)"
      to: "L04 (Risk Management)"
      contract: "ComplianceRule (CTR-P1-012)"
      from_file: "src/zephyr/l10_compliance/security_gateway_base.py"
      to_file: "src/zephyr/l04_risk_management/stop_loss.py"
      direction: "enforce"
      action: "block | warn | log"

    - hop: 3b
      from: "L10 (Compliance)"
      to: "L06 (Trade Execution)"
      contract: "ComplianceRule (CTR-P1-012)"
      from_file: "src/zephyr/l10_compliance/security_gateway_base.py"
      to_file: "src/zephyr/l06_trade_execution/broker_interface.py"
      direction: "enforce"
      action: "block | warn | log"

    - hop: 4
      from: "L10 (Compliance)"
      to: "L01 (Infrastructure)"
      contract: "AuditTrail (CTR-P1-011)"
      direction: "write"

# ── 可观测性管线 (Telemetry Pipeline) ──
# L12 — 全层采集
telemetry_pipeline:
  route_id: "PIPE-TELEMETRY-001"
  name: "可观测性横切管线"
  desc: "L12 全层 Metrics / Logs / Traces 采集"
  topology: "* (all layers) > L12"

  segments:
    - hop: 1
      from: "* (all layers)"
      to: "L12 (System Telemetry)"
      contract: "TelemetryEmitter (CTR-P1-013)"
      direction: "collect"
      protocols: ["OTLP", "Prometheus scrape", "filebeat"]

# ── 向量记忆管线 (VMS Pipeline) ──
vms_pipeline:
  route_id: "PIPE-VMS-001"
  name: "向量记忆管线"
  desc: "全层知识 → 向量化 → ChromaDB 存储 → 语义检索"
  topology: "* (all layers) > VMS > KB"

  segments:
    - hop: 1
      from: "* (all layers)"
      to: "VMS (Vector Memory)"
      contract: "MemoryEntry (VMS internal)"
      from_file: "src/zephyr/vector_memory/interface.py"
      direction: "store"

    - hop: 2
      from: "VMS (Vector Memory)"
      to: "KB (Knowledge Base)"
      contract: "MemoryEntry → KMS knowledge pipeline"
      direction: "sync"

# ── 反馈环 (Feedback Loop) ──
# FLE — 自我改进闭环
feedback_loop:
  route_id: "PIPE-FLE-001"
  name: "自我改进反馈环"
  desc: "L07 绩效数据 → FLE 异常检测 → Orchestrator 动作"
  topology: L07 > FLE > Orchestrator > *

  segments:
    - hop: 1
      from: "L07 (Post-Trade)"
      to: "FLE (Feedback Loop Engine)"
      contract: "ExecutionReport (CTR-P1-007) / PerformanceAttributionReport (CTR-P1-009)"
      direction: "feed"

    - hop: 2
      from: "FLE (Feedback Loop Engine)"
      to: "Orchestrator"
      contract: "AnomalyReport (FLE internal) → trigger_router"
      direction: "trigger"

    - hop: 3
      from: "Orchestrator"
      to: "Target Layer (L02/L03/L05/L09/L11)"
      contract: "system_configuration.py → SystemConfiguration (CTR-P1-010)"
      direction: "exec"

# ── 任务双管线（MOD-INF-006 / CT-PIPE-ORC-001）──
# 与量化主链路（primary_pipeline 等）正交：描述 M1–M11 编排与入口路由，不计入上方 route_summary 的 hop 计数。
task_dual_pipeline:
  route_id: "PIPE-TASK-DUAL-001"
  name: "开发与审计双管线"
  desc: "A 区 M1–M5 生产路径；B 区 M6–M11 审计路径；入口由 TaskCard + ct_pipe_routing 解析"
  ct_contract: "CT-PIPE-ORC-001"
  ssoT_implementation:
    - "src/zephyr/pipeline/pipeline_orchestrator.py"
    - "src/zephyr/pipeline/ct_pipe_routing.py"
  blueprint_keyword_routing_data: "config/blueprint_routing.yaml"
  note: >
    blueprint_routing.yaml = MOD-INF-009 关键词/路径索引（blueprint_search、人工选读）；
    M1-M11 真源 = TaskCard + ct_pipe_routing.resolve_ct_pipe_orc001 + pipeline_orchestrator（与 pipeline 模块头注释一致）。
  zones:
    zone_A:
      modules: [M1, M2, M3, M4, M5]
      role: "production"
    zone_B:
      modules: [M6, M7, M8, M9, M10, M11]
      role: "audit"
  owner_registry: "src/zephyr/SERVICE_LAYER_OWNERS.yaml"

# ── 层间幂等键穿透链 ──
# INV-007: 所有跨层调用 MUST 携带 idempotency_key
idempotency_chain:
  invariant: "INV-007"
  rule: "每个跨层路由段必须透传幂等键"
  chain:
    - "L00 → idempotency_key(ds) → L02 → idempotency_key(ds) → L03"
    - "L03 → idempotency_key(sig) → L04 → idempotency_key(sig) → L05"
    - "L05 → idempotency_key(ord) → L06 → idempotency_key(ord) → L07"
    - "L02 → idempotency_key(fct) → L11 → idempotency_key(fct) → L03/L05"

# ── 路由配置汇总 ──
route_summary:
  total_routes: 7
  primary_hops: 7
  research_hops: 4
  ml_hops: 3
  compliance_hops: 5
  telemetry_hops: 1
  vms_hops: 2
  feedback_hops: 3
  total_hops: 25
  connected_layers: "L00, L01, L02, L03, L04, L05, L06, L07, L08, L09, L10, L11, L12, L13"

# ── 门禁融入点 ──
gate_integration_points:
  - gate: "GATE-02 (P0 契约完整性)"
    checkpoint: "每个 hop 的 contract 字段在 freeze_manifest 中存在"
  - gate: "GATE-07 (事件 publisher 层级)"
    checkpoint: "每个 hop 的 from 层与 contract producer 一致"
  - gate: "GATE-C2 (契约-代码双写漂移)"
    checkpoint: "每个 hop 的 from_file/to_file 与 cross-layer-contracts.yaml SHA256 一致"
