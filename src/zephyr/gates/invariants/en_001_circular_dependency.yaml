gate_id: "EN-001"
name: "EN-001 Circular Dependency Scanner"
description: >
  扫描 14 层 + shared/contracts 的全部 Python 导入，构建依赖 DAG，
  Kahn's algorithm 拓扑排序——若存在环则 P0 阻断。
phase: "Phase D"
auto: true
on_failure: "reject"
on_pass: "pass"

checks:
  - id: "EN-001-CHK-01"
    name: "Topological sort over layer import DAG"
    type: "circular_dependency_scan"
    severity: "error"
    description: "对所有层的 __init__.py 中的 import 语句解析后执行拓扑排序，检测环路"
    params:
      scan_targets:
        - "zephyr.l00_data_source"
        - "zephyr.l01_infrastructure"
        - "zephyr.l02_alpha_factor"
        - "zephyr.l03_signal_generation"
        - "zephyr.l04_risk_management"
        - "zephyr.l05_portfolio_construction"
        - "zephyr.l06_trade_execution"
        - "zephyr.l07_post_trade_analytics"
        - "zephyr.l08_human_ai_interface"
        - "zephyr.l09_research_innovation"
        - "zephyr.l10_compliance"
        - "zephyr.l11_ml_platform"
        - "zephyr.l12_system_telemetry"
        - "zephyr.l13_experimentation"
        - "zephyr.shared.contracts"
      max_layers: 15
