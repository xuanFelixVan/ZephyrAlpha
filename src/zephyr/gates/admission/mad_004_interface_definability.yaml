# MAD-004 Interface Definability Gate
# 接口可定义性门禁 —— 模块接口必须清晰定义
# SSoT: src/zephyr/gates/_registry.yaml → MAD-004

gate_id: MAD-004
gate_name: interface_definability
title: "MAD-004 Interface Definability"
category: admission
scope: global
execution_plane: warm
status: active
version: "1.0"
created: "2026-05-04"

description: >
  对标：Interface Segregation Principle (ISP) + Contract-First Design。
  任何新模块 MUST 在实现前明确定义其公开接口：
  - 入站接口（消费什么数据/事件）
  - 出站接口（产出什么数据/事件）
  - 异常接口（抛出什么错误）
  - 配置接口（需要什么配置参数）

rules:
  - rule_id: MAD-004-R1
    name: public_api_declared
    description: "模块 MUST 在模块蓝图中声明 __all__ 或等效公开 API"
    enforcement: REJECT
    check: >
      module blueprint must contain Public API section
      listing exported classes, functions, and exceptions

  - rule_id: MAD-004-R2
    name: input_contract_specified
    description: "入站接口 MUST 声明期望的 CTR 类型和 schema_version"
    enforcement: REJECT
    check: >
      for each inbound data flow:
          assert contract_id in CTR_REGISTRY
          assert compatible_versions is declared

  - rule_id: MAD-004-R3
    name: output_contract_specified
    description: "出站接口 MUST 声明产出的 CTR 类型和 schema_version"
    enforcement: REJECT
    check: >
      for each outbound data flow:
          assert contract_id in CTR_REGISTRY
          assert output_type is dataclass with frozen=True (for P0)

  - rule_id: MAD-004-R4
    name: error_contracts_declared
    description: "模块 MUST 声明可能抛出的异常类型及其恢复策略"
    enforcement: WARN
    check: >
      declared_exceptions must reference CTR-ERR-* contracts
      or custom exceptions with documented recovery hints

  - rule_id: MAD-004-R5
    name: config_interface_declared
    description: "模块 MUST 声明所需配置项的 key、类型和默认值"
    enforcement: WARN
    check: >
      config requirements must be documented:
      {key: {type: ..., default: ..., required: bool}}

  - rule_id: MAD-004-R6
    name: extension_points_documented
    description: "如果模块提供 OCP 扩展点，MUST 声明基类/注册表和扩展方式"
    enforcement: REJECT (if claims OCP)
    check: >
      if module.is_extension_point:
          assert abstract_base_class is defined
          assert registry is defined
          assert extension_guide is documented
