schema_version: "1.0"
doc_type: gate
title: "G6 CTR Contract Compliance Gate"
status: active
ttl: permanent

gate_id: G6
gate_name: ctr_compliance
description: "CTR contract compliance gate - ensures all l00-l07 layer modules use standardized cross-layer data contracts from shared/contracts/ instead of defining their own data types"

entry_conditions:
  - id: G6-C01
    name: no_self_defined_market_data
    description: "L00 modules must not define their own MarketData/Tick types; must import NormalizedMarketData from shared/contracts/market_data.py"
    check: "for files under l00_data_source/, no class named MarketData/Tick/Bar/TradeData/Candle exists; NormalizedMarketData is imported from zephyr.shared.contracts.market_data"
    severity: error
    on_failure: reject
    applies_to: [l00_data_source]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C02
    name: no_self_defined_factor_signal
    description: "L02 modules must not define their own FactorSignal/Factor/value types; must import FactorSignal from shared/contracts/factor_signal.py"
    check: "for files under l02_alpha_factor/, no class named FactorSignal/Factor/FactorValue/AlphaSignal exists; FactorSignal is imported from zephyr.shared.contracts.factor_signal"
    severity: error
    on_failure: reject
    applies_to: [l02_alpha_factor]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C03
    name: no_self_defined_risk_limits
    description: "L04 modules must not define their own RiskLimits/Limit types; must import RiskLimits from shared/contracts/risk_limits.py"
    check: "for files under l04_risk_management/, no class named RiskLimits/Limit/Constraint exists; RiskLimits is imported from zephyr.shared.contracts.risk_limits"
    severity: error
    on_failure: reject
    applies_to: [l04_risk_management]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C04
    name: no_self_defined_order
    description: "L05/L06 modules must not define their own Order/OrderRequest types; must import Order from shared/contracts/order.py"
    check: "for files under l05_portfolio_construction/ and l06_trade_execution/, no class named Order/OrderRequest/OrderCmd exists; Order is imported from zephyr.shared.contracts.order"
    severity: error
    on_failure: reject
    applies_to: [l05_portfolio_construction, l06_trade_execution]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C05
    name: no_self_defined_fill
    description: "L06 modules must not define their own Fill/Execution types; must import Fill from shared/contracts/fill.py"
    check: "for files under l06_trade_execution/, no class named Fill/FillReport/Execution exists; Fill is imported from zephyr.shared.contracts.fill"
    severity: error
    on_failure: reject
    applies_to: [l06_trade_execution]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C06
    name: no_self_defined_position
    description: "L06/L07 modules must not define their own Position/PositionSnapshot types; must import PositionSnapshot from shared/contracts/position.py"
    check: "for files under l06_trade_execution/ and l07_post_trade_analytics/, no class named Position/PositionSnapshot/Holding exists; PositionSnapshot is imported from zephyr.shared.contracts.position"
    severity: error
    on_failure: reject
    applies_to: [l06_trade_execution, l07_post_trade_analytics]
    verifiable: true
    verification_method: "AST scan for class definitions matching data contract names"

  - id: G6-C07
    name: no_float_in_money_fields
    description: "All l00-l07 module code must not use float for monetary values (price, amount, quantity, commission); must use Decimal"
    check: "for files under l00-l07, no field typed as float with names containing price/amount/cost/fee/commission/quantity/volume/value"
    severity: error
    on_failure: reject
    applies_to: [l00_data_source, l01_infrastructure, l02_alpha_factor, l03_signal_generation, l04_risk_management, l05_portfolio_construction, l06_trade_execution, l07_post_trade_analytics]
    verifiable: true
    verification_method: "AST scan for float annotations on money-related fields"

  - id: G6-C08
    name: cross_layer_import_valid
    description: "Cross-layer data imports must come from shared/contracts/ or shared/__init__.py, not from other layer directories"
    check: "for files under any lXX_*/ directory, imports of data types used across layers come from zephyr.shared.contracts or zephyr.shared"
    severity: warning
    on_failure: flag
    applies_to: [l00_data_source, l02_alpha_factor, l03_signal_generation, l04_risk_management, l05_portfolio_construction, l06_trade_execution, l07_post_trade_analytics]
    verifiable: true
    verification_method: "AST scan for cross-layer imports from non-shared paths"

contract_registry:
  CTR-001:
    file: "src/zephyr/shared/contracts/market_data.py"
    type: "NormalizedMarketData"
    producer: "l00_data_source"
    consumer: "l02_alpha_factor"
  CTR-002:
    file: "src/zephyr/shared/contracts/factor_signal.py"
    type: "FactorSignal"
    producer: "l02_alpha_factor"
    consumer: ["l03_signal_generation", "l04_risk_management", "l05_portfolio_construction"]
  CTR-003:
    file: "src/zephyr/shared/contracts/risk_limits.py"
    type: "RiskLimits"
    producer: "l04_risk_management"
    consumer: "l05_portfolio_construction"
  CTR-004:
    file: "src/zephyr/shared/contracts/order.py"
    type: "Order"
    producer: "l05_portfolio_construction"
    consumer: "l06_trade_execution"
  CTR-005:
    file: "src/zephyr/shared/contracts/fill.py"
    type: "Fill"
    producer: "l06_trade_execution"
    consumer: "l07_post_trade_analytics"
  CTR-006:
    file: "src/zephyr/shared/contracts/position.py"
    type: "PositionSnapshot"
    producer: ["l06_trade_execution", "l07_post_trade_analytics"]
    consumer: ["l04_risk_management", "l11_ml_platform"]
