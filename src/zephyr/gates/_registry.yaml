# _registry.yaml — ZephyrAlpha 全部门禁注册表 (SSoT) v1.0.0
# 本文件是门禁体系的 canonical SSoT——所有门禁必须在此登记
# AI agent 新建门禁时必须在此注册；退役门禁不删除，标记 status: deprecated
# 对标: K8s plugin registry + OPA policy index + Cursor Rules index
#
# Gate ID 约定（与 GateEngine._GATE_FILES 对齐，避免 G8/G9 与历史 G1–G7 数字混淆）：
# - 交易类 gate_id 为 G10–G12；磁盘 YAML 仍使用 g7_*/g8_*/g9_* 文件名（历史命名）。
# - 不存在 gate_id=G8/G9；扩展类见 EN-001~003、ZERO-RESIDUE、MAD-* 等。
# - 运行时加载清单以 gate_engine._GATE_FILES 为准；本 registry 为人机可读登记真源。

