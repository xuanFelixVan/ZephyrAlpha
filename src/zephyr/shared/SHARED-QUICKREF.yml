meta:
  module_id: MOD-INF-016
  version: 0.14.0
  subsystems:
    shared: 跨层共享基础设施——数据契约+Task基座+事件总线+韧性+工具层+生产基础设施
    core: 核心运行时——BlueprintDecomposer+TaskCard数据模型
    agent_rbac: 七层纵深防御权限系统——AgentIdentity+Maturity+七层PermissionGuard（施工中）
    audit_trail: 不可变审计追踪链——JSONL SSoT + 哈希链 + HMAC + Ed25519 Agent签名 + CoT推理链 + 漂移检测
      + 三角闭环（施工中）
  file_count: 74
  consumer_count: 98
foundation:
  data_contracts:
    description: 跨层数据契约 CTR-001~006——承重墙，禁止在模块内自造等价类型
    files:
    - module: shared.schemas
      path: src/zephyr/shared/schemas.py
      exports:
      - symbol: Task
        kind: '[contract]'
        usage: from zephyr.shared.schemas import Task
        note: '31字段 Pydantic V2: 28业务 + 3 DB追踪。TaskCard 基座。禁止绕过 Task 直接操作 DB。'
      - symbol: TaskStatus
        kind: '[contract]'
        usage: from zephyr.shared.schemas import TaskStatus
        note: '10状态机: PENDING/IN_PROGRESS/COMPLETED/VERIFIED/FAILED/BLOCKED/WAITING/READY/RETRY/CANCELLED'
      - symbol: TaskNamespace
        kind: '[contract]'
        note: 任务命名空间枚举
      - symbol: Priority
        kind: '[contract]'
        note: P0(紧急)/P1(高)/P2(中)/P3(低)/P4(锦上添花)
      - symbol: SafetyLevel
        kind: '[contract]'
        note: L(低)/M(中)/H(高)
      - symbol: ExecutionModel
        kind: '[contract]'
        note: 执行模型配置
      - symbol: Classification
        kind: '[contract]'
        note: 任务分类
      - symbol: ContractPhase
        kind: '[contract]'
        note: 契约阶段
      - symbol: EvolutionPolicy
        kind: '[contract]'
        note: 演化策略
      - symbol: GateLevel
        kind: '[contract]'
        note: 门禁级别
      anti_patterns:
      - 在模块内自定义 Task 等价类——必须导入 schemas.Task
      - 直接操作 SQLite 而不通过 TaskCard/BaseModel——打破抽象层
      - 修改 Task 字段而不更新 consumers + 契约测试 + 蓝图
  error_hierarchy:
    description: 统一异常层次——ZephyrBaseError + 12 子类。所有模块 catch/throw 的唯一根
    file: src/zephyr/shared/errors.py
    entry_point: from zephyr.shared.errors import ZephyrBaseError, TaskError, ...
    error_classes:
    - name: ZephyrBaseError
      parents:
      - Exception
      note: 所有业务异常的根。携带 message + details(dict)
    - name: ConfigError
      note: '配置系统: YAML解析失败/Schema校验失败'
    - name: ContractError
      note: '数据契约: 跨层不匹配/版本冲突'
    - name: SecurityError
      note: '安全: 权限拒绝/Token无效'
    - name: ValidationError
      note: '输入校验: 字段缺失/类型错误'
    - name: TaskError
      note: '任务系统: 状态机非法跳转/依赖死锁'
    - name: PipelineError
      note: '管线: 装配失败/步骤异常'
    - name: GateError
      note: '门禁: 判决异常/熔断器触发'
    - name: EscalationError
      note: '升级协议: 升级判定异常/委托死锁/循环委托/SLA超时/置信度异常 (MOD-INF-022)'
    - name: ContextError
      note: '上下文引擎: build(Hybrid Dense+Sparse+RRF)/compress(Qwen2.5-3B+Externalize+Evict+Queue)/validate(LSG+Hash+PrivacyScrub+ThreatModel)/inject(XML分层+双锚+Deterministic)/ops(lifecycle
        disaster-recovery chaos-test config-hot-reload) 全链路异常——58项盲点九轮审计全覆盖'
    - name: FeedbackError
      note: '反馈循环: 自进化异常/metrics失败'
    - name: DataError
      note: '数据层: DB连接失败/迁移失败'
    - name: IOError
      note: 'I/O: 文件读写失败/路径不存在'
    - name: UnimplementedError
      note: '施工占位: 标记已规划未实现功能'
    anti_patterns:
    - 在模块内自定义 Exception 基类——必须从 ZephyrBaseError 继承
    - catch 时从抽象到具体——应先 catch TaskError 再 catch ZephyrBaseError 反了
  type_aliases:
    description: 13 语义类型别名（NewType）——增强类型安全 + AI 消费语义
    file: src/zephyr/shared/types.py
    entry_point: from zephyr.shared.types import TaskId, ModuleId, SessionId, ...
    aliases:
    - symbol: TaskId
      base: str
    - symbol: ModuleId
      base: str
    - symbol: FilePath
      base: str
    - symbol: AbsPath
      base: str
    - symbol: SessionId
      base: str
    - symbol: AgentId
      base: str
    - symbol: ContractId
      base: str
    - symbol: FingerprintHash
      base: str
    - symbol: TokenCount
      base: int
    - symbol: BlueprintVersion
      base: str
    - symbol: DocumentId
      base: str
    - symbol: MetricName
      base: str
    - symbol: SSoT_Key
      base: str
    anti_patterns:
    - 函数签名用裸 str 而非 TaskId——丢失语义信息
  constants:
    description: 22 共享枚举集中 re-export——从 schemas/observer/contracts 聚合
    file: src/zephyr/shared/constants.py
    note: 新模块需要的枚举应先查此文件是否已有——避免重复定义
utilities:
  paths:
    description: 项目路径常量 SSoT——REPO_ROOT/DB_PATH 等的唯一真源
    file: src/zephyr/shared/paths.py
    key_exports:
    - symbol: REPO_ROOT
      type: Path
      note: 项目根目录绝对路径
    - symbol: DB_PATH
      type: Path
      note: data/zalpha_metadata.db
    - symbol: find_repo_root
      type: () -> Path
      note: 健壮的根目录定位函数
    anti_patterns:
    - 用 Path(__file__).parents[N] 自己算——必须从 paths.py 导入
  time_utils:
    file: src/zephyr/shared/time_utils.py
    entry_point: from zephyr.shared.time_utils import now_iso, utc_now
    note: 时间函数 SSoT——禁止用 datetime.utcnow()（已废弃）
  token_utils:
    file: src/zephyr/shared/token_utils.py
    entry_point: from zephyr.shared.token_utils import estimate_tokens
    note: Token 估算——上下文预算控制的基础
  frontmatter:
    file: src/zephyr/shared/frontmatter_utils.py
    entry_point: from zephyr.shared.frontmatter_utils import parse_frontmatter
  diff_utils:
    file: src/zephyr/shared/diff_utils.py
    entry_point: from zephyr.shared.diff_utils import compute_diff, apply_patch
    exports:
    - symbol: compute_diff
      note: 生成 unified diff
    - symbol: apply_patch
      note: 应用 patch
    - symbol: try_apply_patch
      note: 尝试应用，失败回滚
    - symbol: similarity_ratio
      note: 文本相似度 0-1
    - symbol: PatchConflictError
      note: patch 冲突异常
  file_utils:
    file: src/zephyr/shared/file_utils.py
    entry_point: from zephyr.shared.file_utils import atomic_write, safe_read, backup_and_rollback
    exports:
    - symbol: atomic_write
      note: POSIX 原子写——mkstemp→flush→fsync→os.replace
    - symbol: safe_read
      note: 读 + SHA-256 校验
    - symbol: backup_and_rollback
      note: '上下文管理器: 备份后修改，失败自动回滚'
    - symbol: backup_file
      note: 创建 .bak.N 轮转备份
  config_loader:
    file: src/zephyr/shared/config/loader.py
    entry_point: from zephyr.shared.config import load_yaml_config, load_yaml_config_validated
    exports:
    - symbol: load_yaml_config
      note: 加载 YAML 配置
    - symbol: load_yaml_config_validated
      note: '3阶段: parse→merge→Pydantic validate'
    - symbol: ConfigLoadError
      note: 配置加载失败异常
resilience:
  retry:
    file: src/zephyr/shared/resilience/retry.py
    entry_point: from zephyr.shared.resilience import async_retry, RetryConfig, RetryExhaustedError
    pattern: '@async_retry(max_attempts=3, backoff_base=1.0, jitter=True)'
  circuit_breaker:
    file: src/zephyr/shared/resilience/circuit_breaker.py
    entry_point: from zephyr.shared.resilience import CircuitBreaker, CircuitOpenError,
      CircuitState
    states:
    - CLOSED(正常)
    - OPEN(熔断)
    - HALF_OPEN(探测)
    anti_patterns:
    - 在 gates/ 之外使用独立的断路器——gates.circuit_breaker 是 SQLite 持久化版，shared 是内存版
  fallback:
    file: src/zephyr/shared/resilience/fallback.py
    entry_point: from zephyr.shared.resilience import FallbackChain, fallback
    pattern: '@fallback(primary_func, fallback_func)'
  lifecycle:
    file: src/zephyr/shared/lifecycle/hooks.py
    entry_point: from zephyr.shared.lifecycle import LifecycleAware, LifecycleManager,
      ModuleHealth
    protocol: '实现 LifecycleAware: on_init/on_startup/on_shutdown/health_check'
    anti_patterns:
    - 跳过生命周期注册——所有模块 MUST 注册到 LifecycleManager
  feature_flags:
    file: src/zephyr/shared/flags.py
    entry_point: from zephyr.shared.flags import global_flag_registry, FeatureFlag,
      FlagState
    states:
    - ALWAYS_ON
    - CONDITIONAL
    - ALWAYS_OFF
    anti_patterns:
    - 在模块内硬编码条件判断取代 FeatureFlag——必须用 FlagRegistry
events:
  observer:
    file: src/zephyr/shared/observer.py
    note: 事件总线——subscribe/emit 模式。EventType 枚举驱动
  event_schemas:
    file: src/zephyr/shared/events/event_schemas.py
    entry_point: from zephyr.shared.events import FileEventPayload, TimeEventPayload,
      ...
    schemas:
    - 'FileEventPayload: 文件变更事件'
    - 'TimeEventPayload: 定时触发事件'
    - 'TaskEventPayload: 任务状态变更事件'
    - 'ManualEventPayload: 人工触发事件'
    - 'MetricEventPayload: 度量事件'
    anti_patterns:
    - 裸 dict 传事件数据——必须用 Pydantic Schema
logging:
  file: src/zephyr/shared/logging.py
  entry_point: from zephyr.shared.logging import get_logger, TraceContext, configure_root_logger
  pattern: "from zephyr.shared.logging import get_logger, TraceContext\nlog = get_logger(__name__,\
    \ module_id=\"MOD-XXX-001\")\nwith TraceContext() as trace_id:\n    log.info(\"\
    operation started\", extra={\"param\": value})\n"
  anti_patterns:
  - 用 print() 或裸 logging.getLogger()——必须用 get_logger()
  - 不传 module_id——结构化日志的必填字段
core:
  models:
    file: src/zephyr/core/models.py
    entry_point: from zephyr.core.models import TaskCard, TaskStatus, GateLevel, DecompositionResult,
      GateCheckResult, TaskAuditFinding, TaskNamespace
    note: TaskCard 继承 schemas.Task（31字段全链路贯通）——所有模块的 Task 数据载体
    anti_patterns:
    - 直接操作 dict 而非 TaskCard——丢失字段校验和类型安全
  blueprint_decomposer:
    file: src/zephyr/core/blueprint_decomposer.py
    entry_point: from zephyr.core.blueprint_decomposer import BlueprintDecomposer
    note: 蓝图分解引擎——YAML blueprint.md → TaskCard[]
testing:
  file: src/zephyr/shared/testing.py
  entry_point: from zephyr.shared.testing import make_valid_task, make_p0_task, ...
  key_exports:
  - symbol: make_valid_task
    note: 构造 valid-by-construction Task（31字段全有效）
  - symbol: make_p0_task
    note: 构造 P0+H 安全等级紧急任务
  - symbol: make_completed_task
    note: 构造 COMPLETED 状态任务
  - symbol: make_valid_audit_report
    note: 构造 AuditReport + 默认 AuditFinding
  - symbol: make_valid_knowledge_entry
    note: 构造 KnowledgeEntry（KE-NNN）
  - symbol: make_valid_failure_pattern
    note: 构造 FailurePattern（F-NNN）
  - symbol: make_valid_handoff_package
    note: 构造 HandoffPackage 交接包
  anti_patterns:
  - 手写 Task(...) 40字段构造——用 make_valid_task(**overrides)
migration:
  file: src/zephyr/shared/migration.py
  entry_point: from zephyr.shared.migration import migrate_task, latest_schema_version
  key_exports:
  - symbol: migrate_task(data, version)
    note: BFS 最短路径版本化迁移
  - symbol: downgrade_task(data, version)
    note: 回滚到旧版本
  - symbol: latest_schema_version()
    note: 返回当前最新版本号
  - symbol: MIGRATIONS
    note: 迁移注册表 dict
  - symbol: MigrationError
    note: 迁移失败异常
  anti_patterns:
  - 在迁移函数中修改共享状态——迁移应是无副作用纯函数
deprecation:
  file: src/zephyr/shared/deprecation.py
  entry_point: from zephyr.shared.deprecation import deprecated, set_deprecation_mode
  key_exports:
  - symbol: '@deprecated(since=, remove_in=, replacement=)'
    note: 标记废弃函数/类/方法
  - symbol: set_deprecation_mode(mode)
    note: warn/strict/silent 全局切换
  - symbol: get_deprecation_mode()
    note: 查询当前模式
  - symbol: DeprecationMode
    note: WARN / STRICT / SILENT 三模式
  - symbol: DeprecatedAPIError
    note: strict 模式下抛出
  anti_patterns:
  - 直接删除旧API而不加 @deprecated——破坏消费者编译
dlq:
  file: src/zephyr/shared/events/dlq.py
  entry_point: from zephyr.shared.events.dlq import DeadLetterQueue, attach_dlq_to_observer
  key_exports:
  - symbol: DeadLetterQueue
    note: 死信队列——capture/pop_retryable/mark_resolved/stats/purge_expired
  - symbol: DeadLetter
    note: 死信条目 dataclass（event_type + handler_name + exception + timestamp）
  - symbol: attach_dlq_to_observer(observer)
    note: 零侵入挂载DLQ到Observer——monkey-patch emit()
  anti_patterns:
  - 在 handler 中 catch Exception 后 pass——事件丢失无痕，应用 DLQ 捕获
version: 0.22.0
health:
  file: src/zephyr/shared/health.py
  entry_point: from zephyr.shared.health import AggregateHealth, collect_health
  key_exports:
  - symbol: AggregateHealth
    note: 聚合健康检查器——check()/check_block_fast()
  - symbol: HealthSummary
    note: 健康摘要 dataclass + to_dict()→JSON
  - symbol: HealthStatus
    note: ALL_HEALTHY / DEGRADED / UNHEALTHY / UNKNOWN
  - symbol: collect_health()
    note: 一次性收集所有LifecycleAware模块健康状态
  anti_patterns:
  - 直接遍历 LifecycleManager.health_check_all()——应用 AggregateHealth 获得整体视图
serialization:
  file: src/zephyr/shared/serialization.py
  entry_point: from zephyr.shared.serialization import to_dict, from_dict, to_json,
    from_json, ENCODING_RULES
  key_exports:
  - symbol: to_dict(obj)
    note: Pydantic/dataclass → dict (Decimal→str, datetime→ISO 8601 UTC)
  - symbol: from_dict(data, cls)
    note: 逆序列化——含 auto-coerce int→str
  - symbol: to_json(obj)
    note: 对象 → JSON 字节
  - symbol: from_json(data, cls)
    note: JSON 字节 → 对象
  - symbol: ENCODING_RULES
    note: 编码规则常量 dict
  - symbol: SerializationContract
    note: Consumer <-> Producer 数据格式契约 dataclass
  anti_patterns:
  - 手动 json.dumps(model.dict())——用 to_json() 统一 Decimal/datetime 处理
api_client:
  file: src/zephyr/shared/api_client.py
  entry_point: from zephyr.shared.api_client import ApiClient, ApiResponse, ApiCallMetrics
  key_exports:
  - symbol: ApiClient
    note: 可组合 HttpClient——timeout/retry/circuit_breaker ThrottleMiddleware 可插拔
  - symbol: AioHttpProvider
    note: aiohttp 后端实现
  - symbol: ApiResponse
    note: 响应 dataclass——status + data + headers + elapsed_ms + retries
  - symbol: ApiCallMetrics
    note: 调用统计——count + total_ms + errors
  anti_patterns:
  - 裸 aiohttp.ClientSession——用 ApiClient 获得重试/熔断/超时/指标一体化
secrets:
  file: src/zephyr/shared/secrets.py
  entry_point: from zephyr.shared.secrets import get_secret, sanitize_secret
  key_exports:
  - symbol: SecretProvider
    note: 密钥提供者 Protocol——get_secret/load_all
  - symbol: EnvSecretProvider
    note: os.environ 实现
  - symbol: DotEnvSecretProvider
    note: .env 文件 + os.environ 实现
  - symbol: get_secret(key)
    note: 统一入口——获取密钥并确保非空
  - symbol: sanitize_secret(value)
    note: 日志安全脱敏(show first 4 and last 4)
  anti_patterns:
  - os.getenv() 直接读取密钥——用 get_secret() 确保非空+脱敏
cache:
  file: src/zephyr/shared/cache.py
  entry_point: from zephyr.shared.cache import MemoryCache, cache_key
  key_exports:
  - symbol: MemoryCache
    note: 内存缓存——TTL + LRU 淘汰 + max_size 限制
  - symbol: CacheProvider
    note: 缓存 Provider Protocol——get/put/invalidate/clear/ttl/age
  - symbol: cache_key(*parts)
    note: 标准化缓存键生成
  anti_patterns:
  - 全局 dict 做缓存——用 MemoryCache 获得 TTL/LRU/统计数据
limiter:
  file: src/zephyr/shared/limiter.py
  entry_point: from zephyr.shared.limiter import TokenBucketLimiter, async_limited
  key_exports:
  - symbol: TokenBucketLimiter
    note: 令牌桶——支持 warmup + burst + smooth 三种模式
  - symbol: '@async_limited'
    note: 装饰器——await 获取令牌后才执行
  anti_patterns:
  - time.sleep(1) 硬控速——用 TokenBucketLimiter 精确令牌管控
idempotency:
  file: src/zephyr/shared/idempotency.py
  entry_point: from zephyr.shared.idempotency import IdempotencyStore, idempotency_key
  key_exports:
  - symbol: IdempotencyStore
    note: 幂等性存储——start/completed/failed/succeeded + Stripe 24h TTL + 5min lock
  - symbol: IdempotencyStatus
    note: STARTED/COMPLETED/FAILED
  - symbol: idempotency_key(*parts)
    note: 基于输入参数生成确定性幂等键
  anti_patterns:
  - 无幂等保护的 API 接收重复请求——外发支付/写入必须带 idempotency_key
context:
  file: src/zephyr/shared/context.py
  entry_point: from zephyr.shared.context import RequestContext, set_request_context,
    get_request_context
  key_exports:
  - symbol: RequestContext
    note: 不可变请求上下文——trace_id/span_id/tenant_id/agent_id/priority
  - symbol: set_request_context(ctx)
    note: 设置协程级上下文——contextvars 传播
  - symbol: get_request_context()
    note: 获取当前上下文——未设置时抛 ContextNotSetError
  - symbol: ContextNotSetError
    note: 上下文未初始化异常
  anti_patterns:
  - 全局变量 ThreadLocal 传上下文——用 contextvars 保证 asyncio 正确传播
metrics:
  file: src/zephyr/shared/metrics.py
  entry_point: from zephyr.shared.metrics import MetricsRegistry, Counter, Gauge,
    Histogram
  key_exports:
  - symbol: MetricsRegistry
    note: 线程安全指标注册——get_or_create + auto_sum 计数器
  - symbol: Counter
    note: 只增计数器
  - symbol: Gauge
    note: 可升降计量器
  - symbol: Histogram
    note: 分布直方图
  - symbol: prometheus_text(registry)
    note: 导出 Prometheus text format
  - symbol: get_default_registry()
    note: 获取默认 MetricsRegistry 单例
  anti_patterns:
  - 在 handler 中 hardcode 指标名称——用 MetricsRegistry 统一管理+Prometheus 导出
pagination:
  file: src/zephyr/shared/pagination.py
  entry_point: from zephyr.shared.pagination import Page, CursorPage, paginate, paginate_cursor
  key_exports:
  - symbol: Page[T]
    note: 偏移分页——items + total + offset + limit + has_more
  - symbol: CursorPage[T]
    note: 游标分页——items + next_cursor + size + has_more
  - symbol: paginate(items, offset, limit)
    note: 列表 → Page 工具函数
  - symbol: paginate_cursor(items, cursor, size, key_fn)
    note: 列表 → CursorPage 工具函数
  anti_patterns:
  - API 直接返回 list——应用 Page/CursorPage 支持大数据分页+has_more 指示
time_utils_enhanced:
  file: src/zephyr/shared/time_utils.py
  entry_point: from zephyr.shared.time_utils import now_utc, freeze_time, now_iso,
    parse_iso, format_iso
  key_exports:
  - symbol: now_utc()
    note: UTC datetime.now(timezone.utc)——SSoT 替代 datetime.utcnow()
  - symbol: freeze_time()
    note: 上下文管理器——冻结时间便于测试
  - symbol: now_iso(with_tz=True)
    note: 当前时间 ISO 8601 UTC 字符串（Z后缀）
  - symbol: parse_iso(iso_str)
    note: ISO 8601 字符串 → datetime
  - symbol: format_iso(dt, with_tz=True)
    note: datetime → ISO 8601 字符串
  - symbol: seconds_since(dt)
    note: 自 dt 以来的秒数
  - symbol: seconds_until(dt)
    note: 距离 dt 还剩的秒数
  anti_patterns:
  - datetime.utcnow()/datetime.now() 裸用——用 now_utc() 标准UTC+可测试
env:
  file: src/zephyr/shared/env.py
  entry_point: from zephyr.shared.env import Env, current_env, is_dev, is_prod, is_test
  key_exports:
  - symbol: Env
    note: DEV/STAGING/PROD/TEST 枚举
  - symbol: current_env()
    note: ZEPHYR_ENV → Env 解析
  - symbol: is_dev()
    note: DEV 环境快捷检查
  - symbol: is_prod()
    note: PROD 环境快捷检查
  - symbol: is_test()
    note: TEST 环境快捷检查
  - symbol: is_debug()
    note: DEBUG 标志检查
  anti_patterns:
  - os.getenv('ENVIRONMENT') == 'production' 硬编码——用 current_env()/is_prod()
lock:
  file: src/zephyr/shared/lock.py
  entry_point: from zephyr.shared.lock import DistributedLock, MemoryLock, LockHandle
  key_exports:
  - symbol: DistributedLock
    note: 分布式锁 Protocol——acquire/release/extend/owned
  - symbol: MemoryLock
    note: 内存分布式锁——asyncio.Lock + owner_id + 租约过期
  - symbol: LockHandle
    note: 锁句柄 dataclass + async context manager
  anti_patterns:
  - asyncio.Lock() 裸用——用 DistributedLock 获得 owner 追踪+过期+可观测
outbox:
  file: src/zephyr/shared/outbox.py
  entry_point: from zephyr.shared.outbox import OutboxStore, MemoryOutboxStore, OutboxPublisher
  key_exports:
  - symbol: OutboxStore
    note: Outbox 存储 Protocol——enqueue/dequeue/mark_processed/mark_failed
  - symbol: MemoryOutboxStore
    note: 内存实现——asyncio.Queue 基于
  - symbol: OutboxPublisher
    note: Outbox 轮询发布器——poll_interval + batch_size + max_retries
  - symbol: OutboxStatus
    note: PENDING/PROCESSING/COMPLETED/FAILED
  anti_patterns:
  - DB 写入+事件发布分离(无事务)——用 Outbox 模式保证恰好一次语义
schema_registry:
  file: src/zephyr/shared/schema_registry.py
  entry_point: from zephyr.shared.schema_registry import SchemaRegistry, get_schema_registry
  key_exports:
  - symbol: SchemaRegistry
    note: 集中式 Schema 版本编目——register/get/latest/versions/check_register_compatible
  - symbol: get_schema_registry()
    note: 全局 SchemaRegistry 单例
  - symbol: SchemaVersion
    note: Schema 版本 dataclass
  anti_patterns:
  - Schema 版本信息散落在各模块 YAML 文件——用 SchemaRegistry 集中编目
blueprint_scorer:
  file: src/zephyr/shared/blueprint_scorer.py
  entry_point: from zephyr.shared.blueprint_scorer import score_blueprint_route, score_and_rank_routes
  key_exports:
  - symbol: score_blueprint_route(route)
    note: 单路由评分——返回 relevance + 维度分解 + 分数理由
  - symbol: score_and_rank_routes(routes, max_results)
    note: 批路由评分+排序——truncate top-N
  anti_patterns:
  - 裸路由查表不评分——用 score_and_rank_routes 避免短链路截断+最长匹配陷阱
agent_rbac:
  description: Agent 身份与权限系统——静态权限注册表升级为七层运行时强制执行器
  blueprint: docs/03_modules/l01_infrastructure/agent-rbac/blueprint.md
  code_root: src/zephyr/agent_rbac/
  status: Active (phase_2_complete — 68 files / 519 class-def / 45 decisions)
  architecture: L0 Immutable Core → L1 RBAC → L2 ABAC → L3 Input Guard → L4 Sequence
    Guard → [执行] → L5 Output Guard → L6 Observability
  layers:
    l0_immutable_core:
      file: agent_rbac/immutable_core.py
      description: 硬编码不可变保护路径 + Kill Switch 全局熔断 + Engine 降级策略（崩=blocked）
      key_exports:
      - symbol: PROTECTED_PATHS
        note: 硬编码保护路径列表——.git, agent_rbac/, AGENTS.md, .pre-commit-config.yaml
      - symbol: ALWAYS_BLOCKED
        note: 硬编码禁止操作——modify_self_permissions, delete_audit_logs, shell_true_execution
      - symbol: KillSwitch
        note: 全局熔断器——5 种自动触发器 + 手动熔断
      - symbol: EngineDegradation
        note: Engine 故障降级——崩=blocked，绝不放行
      anti_patterns:
      - AI 修改 immutable_core.py 或 rbac_roles.yaml 给自己提权——L0 必须硬阻断
    l1_rbac:
      file: agent_rbac/rbac_guard.py
      description: RBAC 角色权限——三层 always_allow 95% / auto_guard 4% / blocked 1%
      key_exports:
      - symbol: PermissionGuard.check()
        note: 七层权限检查入口——每 Tool 调用前必经
      - symbol: PermissionDecision
        note: ALLOW / AUTO_GUARD / BLOCKED / SKIPPED
      - symbol: PermissionResult
        note: 判定结果 + layered_decisions 逐层明细
      config: rbac_roles.yaml——从 GOV-AI-001 自动派生
    l2_abac:
      file: agent_rbac/abac_guard.py
      description: ABAC 属性权限——意图感知 + 时间窗口 + Agent 成熟度四级 + 资源敏感性
      key_exports:
      - symbol: AgentMaturityLevel
        note: INTERN / JUNIOR / SENIOR / PRINCIPAL 四级信任
      - symbol: AbacContext
        note: 四维属性上下文——intent + temporal + maturity + sensitivity
    l3_input_guard:
      file: agent_rbac/input_guard.py
      description: 参数护栏——schema 白名单 + 范围限制 + 危险模式检测（DROP TABLE/shell injection）
    l4_sequence_guard:
      file: agent_rbac/sequence_guard.py
      description: 序列护栏——会话级操作序列追踪 + 禁止序列阻断（read_sensitive→external_output）
      note: 最关键盲点补丁——防止多步合法操作组成攻击链
    l5_output_guard:
      file: agent_rbac/output_guard.py
      description: 输出护栏——PII 脱敏 + 凭证检测 + 大小截断
    l6_observability:
      file: agent_rbac/observability.py
      description: 可观测性——OpenTelemetry 指标 + 行为异常检测 + 权限变更审计
    l7_testing:
      file: agent_rbac/dry_run.py
      description: 测试与模拟——权限影响分析 + Dry-Run 模式 + 自动化测试框架
  identity:
    file: agent_rbac/identity.py
    key_exports:
    - symbol: AgentIdentity
      note: agent_id + agent_type + ide_source + role_bindings + maturity_level +
        session_id
    - symbol: AgentType
      note: ARCHITECT / IMPLEMENTER / REVIEWER / GOVERNOR / RESEARCHER / OPERATOR
    - symbol: IDESource
      note: TRAE / CURSOR / ROOCODE / CLI——多 IDE 统一身份
  integration_points:
  - target: gates.gate_engine
    at: G0 前置检查
    why: 每个 Tool 调用前 PermissionGuard.check()
  - target: mcp._base_server
    at: tool_call 拦截
    why: MCP Tool 执行前七层权限检查
  - target: audit_trail
    at: MOD-INF-020
    why: 权限判定 + 序列违规 + Kill Switch 事件
  - target: rollback_system
    at: MOD-INF-021
    why: auto_guard 后验失败自动回滚
  - target: circuit_breaker
    at: MOD-INF-022
    why: L0 Kill Switch 复用熔断器基础设施
  decisions:
  - id: D-018-01
    summary: 三层权限 95/4/1 分布，取消 needs_approval
  - id: D-018-02
    summary: 先干后验 + 自动护栏，非事前审批
  - id: D-018-03
    summary: GOV-AI-001 自动派生 rbac_roles.yaml
  - id: D-018-04
    summary: L0 Immutable Core——硬编码不可变保护区
  - id: D-018-05
    summary: L0 Kill Switch——全局熔断机制
  - id: D-018-06
    summary: L0 Engine 降级策略——崩=blocked
  - id: D-018-07
    summary: L2 ABAC——四维属性权限
  - id: D-018-08
    summary: L3 Input Guard——参数级护栏
  - id: D-018-09
    summary: L4 Sequence Guard——操作序列追踪与阻断（最关键）
  - id: D-018-10
    summary: L5 Output Guard——输出护栏
  - id: D-018-11
    summary: L6 Observability——可观测性
  - id: D-018-12
    summary: L7 Testing & Dry-Run——权限可测试性
