  path: tests/contract/
  suites:
  - file: test_import_chain.py
    description: 17 消费者导入链路验证——shared/ 变更第一道安全网
  - file: test_schema_stability.py
    description: Task 31字段快照 + TaskCard继承完整性 + 错误层次 + 类型别名 + AuditEntryV1 23字段快照
  - file: test_rbac_permissions.py
    description: 角色一致性 + 覆盖度 + 序列阻断 + 不可变核心 + 成熟度边界（MOD-INF-018 L7）
  - file: test_audit_integrity.py
    description: 审计哈希链连续性 + HMAC 批量验证 + Merkle 树重建（MOD-INF-020 §4）
  run: python -m pytest tests/contract/ -v
common_traps:
- trap: 在模块内自定义 Task/Order/Fill 等价类
  consequence: 跨层数据契约断裂——消费者收到的数据类型不兼容
  correct: from zephyr.shared.schemas import Task
- trap: 用 Path(__file__).parents[N] 自己算 REPO_ROOT
  consequence: 目录重组后所有消费者一起坏
  correct: from zephyr.shared.paths import REPO_ROOT
- trap: catch Exception 后不处理也不重新包装为 ZephyrBaseError
  consequence: 错误上下文丢失——module_id/session_id/trace_id 全无
  correct: 'except Exception as e: raise TaskError(''...'', details={''original'':
    str(e)})'
- trap: 修改 schemas.py Task 字段后不更新契约测试和蓝图
  consequence: 蓝图漂移 + 消费者在下次 AI session 被误导
  correct: 改 Task → 更新 tests/contract/test_schema_stability.py 快照 → 更新蓝图 §2.2/§5 →
    跑全量测试
- trap: 在 shared/ 中添加外部依赖（如 requests, httpx 等）
  consequence: shared/ 作为原子基座不应引入网络/IO/框架依赖
  correct: shared/ 仅依赖 Python 标准库 + pydantic + pyyaml
- trap: VMS Collection 写入时不带 WriteTrace provenance
  consequence: 向量不可溯源——AI 自己都不知道这条向量是谁写的、为什么写的。审计链断裂。
  correct: 每次写入调用 ProvenanceEnforcer.attach()——origin(agent_id/task_id) + audit_chain
    + arbitration(optional/bypass)
- trap: VMS 8 Collection 中混用嵌入维度——attempt to search across 1024d and 512d collections
    in same query
  consequence: 向量维度不匹配——ChromaDB 直接报错或返回全零相似度
  correct: EmbeddingRouter 按 collection_name 自动路由；CrossCollectionRetriever 分别编码后合并结果
- trap: 绕开 kb/chromadb_init.py 直接操作 ChromaDB——在 VMS 中重复初始化 ChromaDB client
  consequence: 多进程持有多 ChromaDB client → SQLite 文件锁冲突 → 写入被阻塞 → 数据不一致
  correct: 通过 BridgeLayer 共享同一 ChromaDB client 单例；InProcessVectorMemory 是唯一 ChromaDB
    入口
- trap: 修改 rbac_roles.yaml 或 immutable_core.py 给 Agent 提权
  consequence: 护栏被 AI 自己拆掉——权限系统形同虚设
  correct: L0 Immutable Core 硬编码保护——修改 agent_rbac/ 下任何文件 = BLOCKED + P0 告警
- trap: 绕过 PermissionGuard 直接操作文件/MCP Tool/DB
  consequence: 权限系统白建——操作不经过检查等于门没锁
  correct: 所有写操作必须经过 Gate Engine → PermissionGuard.check()；MCP Tool 在 _base_server
    拦截
- trap: Agent 成熟度一成不变——新 Agent 和跑100个任务的 Agent 同等信任
  consequence: 不信任梯度 = 要么全放要么全堵——安全/效率双失
  correct: Agent 自动从 L1 Intern 开始，通过任务数+后验通过率+零事故自动升级；安全事故自动降级
- trap: 绕过 AuditTrailWriter 直接 append JSONL 或 UPDATE SQLite 审计索引
  consequence: 哈希链断裂 + HMAC 签名空洞 + 审计日志不可信——篡改检测盲区
  correct: 所有审计写入必须通过 writer.py AuditTrailWriter.append()——自动生成 prev_hash + entry_hash
    + HMAC + Lamport tick
- trap: 在模块内自定义审计事件模型——绕过 AuditEntryV1
  consequence: 跨系统审计查询断裂——event_type/lamport_clock/drift_detected 等字段缺省
  correct: from zephyr.audit_trail.models import AuditEntryV1, AuditEventType
- trap: 审计查询时不记录元审计——MetaAuditLogger 被绕过
  consequence: 无人知道谁查了审计日志——内部威胁盲区（对标 GOV-CMP-002 AUD-001）
  correct: 每次 AuditQuery 调用自动触发 MetaAuditLogger.log_audit_query()
- trap: HMAC secret 硬编码或提交到 git
  consequence: 攻击者拿到 secret 后可伪造审计条目——哈希链+HMAC 双保险瓦解
  correct: HMAC secret 仅存于环境变量 ZEPHYR_AUDIT_HMAC_SECRET（256-bit），永远不进 git
audit_trail:
  description: 不可变、密码学完整性保证的审计追踪链——记录每个 AI 动作的 who/when/what/why。JSONL SSoT + 哈希链防篡改
    + HMAC 签名 + Lamport 逻辑时钟 + 异常检测 + 漂移对账 + 三角闭环反馈。
  blueprint: docs/03_modules/l01_infrastructure/audit-trail/blueprint.md
  code_root: src/zephyr/audit_trail/
  status: draft (0% 施工)
  architecture: JSONL SSoT (append-only + tamper-evident) → SQLite 派生索引 (查询加速) → 异常检测引擎
    → 漂移对账器 → 三角闭环反馈 (→ Policy PR)
  files: 12
  models:
    file: audit_trail/models.py
    description: Pydantic V2 不可变审计事件模型——frozen=True + extra='forbid'。全量 23 字段。
    key_exports:
    - symbol: AuditEntryV1
      kind: '[contract]'
      usage: from zephyr.audit_trail.models import AuditEntryV1
      note: '审计条目 v1.0.0——23字段: entry_id + schema_version + prev_entry_hash + entry_hash
        + hmac_signature + merkle_batch_id + lamport_clock + utc_timestamp + agent_id
        + ide_source + session_id + task_id + action_type + file_path + sha256_before/after
        + decision_basis + guard_checks_passed/failed + blueprint_expected_action
        + drift_detected/severity/detail + anomaly_detected/type/score + tokens_used
        + cost_estimate_usd + duration_ms + contains_pii + redaction_policy + retention_tier'
    - symbol: AuditEventType
      kind: '[contract]'
      note: '17 种事件类型: TASK_SUMMARY / FILE_DETAIL / ANOMALY_DETECTED / PERMISSION_VIOLATION
        / BULK_OPERATION / GATE_BYPASS / OFF_HOURS_ACTIVITY / DRIFT_DETECTED / INDEX_REBUILD
        / LOG_ROTATION / TIER_MIGRATION / INTEGRITY_CHECK / INTEGRITY_FAILURE / AUDIT_QUERY
        / AUDIT_SYSTEM_HEALTH / POLICY_FEEDBACK_SENT / DRY_RUN_AUDIT / COLD_START_BOOTSTRAP'
    - symbol: TaskAuditSummary
      kind: '[contract]'
      note: '任务级审计摘要——快速浏览: event_id + timestamp + agent_id + ide_source + lamport_counter
        + session_id + task_id + task_type + action_summary + files_affected + result
        + permission_level + provenance_depth + tokens_used + cost_estimate_usd +
        duration_ms'
    - symbol: FileAuditDetail
      kind: '[contract]'
      note: '文件级审计明细——问题定位: event_id + task_audit_id + timestamp + lamport_counter
        + file_path + action_type(READ/WRITE/CREATE/DELETE) + sha256_before/after
        + diff_size_bytes'
    - symbol: FileActionType
      kind: '[contract]'
      note: READ / WRITE / CREATE / DELETE
    - symbol: ProvenanceDepth
      kind: '[contract]'
      note: LIGHT(always_allow) / STANDARD(auto_guard) / FULL(blocked)
    - symbol: ProvenanceLight
      note: '轻量溯源: agent_id + timestamp + action_type + ide_source + decision_brief'
    - symbol: ProvenanceStandard
      note: '标准溯源: 完整决策依据 + guard_checks_executed/passed/failed + guard_result + confidence_level'
    - symbol: ProvenanceFull
      note: '全量溯源: blocked_reason + attempted_action + rule_violated + escalation_triggered
        + escalation_target'
    anti_patterns:
    - 在模块内自定义审计事件类而不继承 AuditEntryV1——跨系统查询不可用
    - 修改 AuditEntryV1 字段不更新 schema_version——历史记录回读失败
    - 跳过 frozen=True 可变审计条目——破坏 append-only 原则
  writer:
    file: audit_trail/writer.py
    description: 不可变审计写入器——JSONL append + 哈希链 + HMAC + Lamport tick。唯一写入入口。
    key_exports:
    - symbol: AuditTrailWriter.append()
      note: 追加 1 条审计记录——自动计算 prev_entry_hash + entry_hash + HMAC + Lamport.tick()
        → JSONL append → 异步触发 SQLite 索引重建 (5s)
    - symbol: AuditTrailWriter.append_batch()
      note: 批量追加——单次文件锁内完成 N 条写入
    - symbol: AuditTrailWriter.flush()
      note: 强制刷新——立即触发 SQLite 索引重建
    anti_patterns:
    - 直接 open(data/audit/audit-trail.jsonl, 'a')——绕过哈希链和 HMAC 生成
    - append 后不调用异步索引重建——查询延迟超过 5s
  query:
    file: audit_trail/query.py
    description: 审计查询接口——SQLite 优先 + JSONL 回退 + 查询前完整性快速校验。每次查询自动写元审计。
    key_exports:
    - symbol: AuditQuery.by_task()
      note: 按 task_id 查询任务级摘要
    - symbol: AuditQuery.by_task_details()
      note: 按 task_id 查询关联的文件级明细列表
    - symbol: AuditQuery.by_agent()
      note: 按 agent_id + time_range 查询
    - symbol: AuditQuery.by_target()
      note: 按 file_path 查询完整 lineage——谁操作过这个文件
    - symbol: AuditQuery.by_permission_level()
      note: 按 always_allow/auto_guard/blocked 过滤
    - symbol: AuditQuery.by_anomaly()
      note: 按 anomaly_type + min_score 过滤异常事件
    - symbol: AuditQuery.by_drift()
      note: 按 drift_severity 过滤蓝图漂移事件
    - symbol: AuditQuery.by_cost()
      note: 按 min_cost_usd 查询——FinOps 审计
    - symbol: AuditQuery.trail_for_ai_context()
      note: 为 AI agent 生成 Markdown 审计摘要——AI 零推理可消费
    - symbol: AuditQuery.verify_integrity()
      note: fast_mode=True 仅验 Merkle root / fast_mode=False 逐条验哈希链+HMAC
    - symbol: IntegrityReport
      note: '完整性报告: is_valid + total_entries + hash_chain_breaks[] + hmac_failures[]
        + merkle_mismatches[]'
    anti_patterns:
    - 绕过 AuditQuery 直接 SQL SELECT——缺少元审计 + 完整性校验
    - 查询异常事件不传 min_score——返回全量噪声（建议默认 0.7）
  integrity:
    file: audit_trail/integrity.py
    description: 密码学完整性验证器——哈希链连续性 / HMAC 批量验证 / Merkle 树重建校验
    key_exports:
    - symbol: verify_hash_chain()
      note: 逐条验证 prev_entry_hash → SHA-256(prev_entry) 匹配
    - symbol: verify_hmac_batch()
      note: HMAC-SHA256(canonical_json, ZEPHYR_AUDIT_HMAC_SECRET) 批量验证
    - symbol: rebuild_merkle_tree()
      note: 从 JSONL 重建 Merkle 树 → 写入 data/audit/merkle/audit-merkle-{YYYY-MM-DDTHH}.json
  lamport_clock:
    file: audit_trail/writer.py
    description: Lamport 逻辑时钟——多 IDE 并发下的因果顺序保证。不对操作系统时钟做任何假设。
    key_exports:
    - symbol: LamportClock.tick()
      note: 操作前递增 counter → 返回 (ide_source, counter)
    - symbol: LamportClock.merge(received)
      note: '接收外部事件时合并: counter = max(local, received[1]) + 1'
    - symbol: audit_entry_sort_key()
      note: '全序排序键: (counter, ide_source) 字典序——对标 Dynamo Vector Clock 简化版'
  anomaly:
    file: audit_trail/anomaly.py
    description: AI 行为异常检测引擎——7 种异常签名 + 行为基线模型 + 自动告警。Experimental 阶段落位。
    key_exports:
    - symbol: AnomalyDetector.detect()
      note: 单条目异常检测→返回 anomaly_score (0~1)
    - symbol: AnomalyDetector.detect_batch()
      note: 批量异常检测→窗口内统计
    signatures:
    - id: ANM-001
      pattern: 越权操作
      severity: P0
      logic: Agent 操作了它权限级别外的文件路径
    - id: ANM-002
      pattern: 批量删除
      severity: P0
      logic: 单次任务删除 > 5 文件
    - id: ANM-003
      pattern: 门禁跳过
      severity: P0
      logic: 文件修改但无对应 guard_checks_passed
    - id: ANM-004
      pattern: 非工作时间
      severity: P1
      logic: UTC 22:00-06:00 > 20 操作/小时
    - id: ANM-005
      pattern: 高频操作
      severity: P1
      logic: '> 100 文件操作/分钟'
    - id: ANM-006
      pattern: 跨 Agent 冲突
      severity: P1
      logic: 同一文件 5 分钟内被 3+ Agent 修改
    - id: ANM-007
      pattern: 审计日志异常
      severity: P0
      logic: 哈希链断裂 / HMAC 失败 / 外部篡改
    alert_thresholds:
      score_gt_0_7: P1 告警——写入 anomaly_detected 事件 + 通知 Owner
      score_gt_0_9: P0 阻断——触发 Gate Engine block + 通知 Owner + escalation
  drift:
    file: audit_trail/drift.py
    description: 蓝图 vs 实际操作漂移检测器——对比 AI 实际做了什么 vs 蓝图规定该做什么。Experimental 阶段落位。
    key_exports:
    - symbol: DriftDetector.compare()
      note: 单条目漂移检测→DriftResult
    - symbol: DriftDetector.batch_compare()
      note: 批量漂移检测→DriftReport
    drift_types:
    - unauthorized_op——AI 执行了蓝图未授权的操作
    - skipped_check——AI 跳过了蓝图规定的检查项
    - immutable_violation——AI 修改了不可变文件
  feedback:
    file: audit_trail/writer.py (aggregator)
    description: 审计聚合数据回写 Policy——对接 ADR-0010 §4.4 Runtime→Policy 接口。Beta 阶段落位。
    schedule: '每日 00:30 UTC 聚合: Top 10 异常 + 漂移摘要 + 权限违规趋势 + 高成本事件'
    consumer: feedback_to_policy.py → GitHub PR (Owner 审批)
  lifecycle:
    file: audit_trail/lifecycle.py
    description: 三层存储迁移 + 隐私脱敏 + 保留期自动执行。Beta 阶段落位。
    key_exports:
    - symbol: TierMigrator.migrate_hot_to_warm()
      note: 每日 00:00 UTC 扫描 hot/ → >7d 条目 gzip 迁移至 warm/
    - symbol: TierMigrator.migrate_warm_to_cold()
      note: 每周日 02:00 扫描 warm/ → >90d 条目 Parquet 归档至 cold/
    - symbol: PiiDetector.scan()
      note: '写入时自动检测 PII: .env/secrets/key/token → hash, 邮箱/手机 → mask'
    - symbol: RetentionEnforcer.dry_run()
      note: 扫描过期条目——生成报告（不删除）
    - symbol: RetentionEnforcer.enforce()
      note: 保留期清理——需 Owner 审批 token
  cold_start:
    file: audit_trail/lifecycle.py
    description: 审计系统首次启动——扫描 git log + session-logs/ → 生成历史审计基线。Beta 阶段落位。
    key_exports:
    - symbol: ColdStartBootstrapper.scan_git_log()
      note: 扫描 git log → 生成历史审计基线 (confidence=low)
    - symbol: ColdStartBootstrapper.scan_session_logs()
      note: 扫描 session-logs/ 目录 → 标准化为审计条目
    - symbol: ColdStartBootstrapper.merge_to_baseline()
      note: 合并 → bootstrap_audit_baseline.jsonl
  self_monitor:
    file: audit_trail/self_monitor.py
    description: 审计系统自监控——heartbeat + 健康指标 + 自动修复。1人+AI 维护刚需。
    key_exports:
    - symbol: SelfMonitor.heartbeat()
      note: 60s 间隔写入 healthcheck 条目 → 读回验哈希链 → 延迟 < 5ms
    - symbol: SelfMonitor.collect()
      note: '采集 6 维健康指标: write_latency_p99 / disk_usage_pct / jsonl_file_count / hash_chain_integrity
        / hmac_validity_rate / sqlite_index_health'
    - symbol: SelfMonitor.auto_heal()
      note: 索引损坏 → 自动从 JSONL 重建（零人工干预）
  cli:
    file: audit_trail/cli.py
    description: CLI 审计面板——Owner 日常交互的唯一入口
    commands:
    - zephyr audit query <task_id>——查询任务审计
    - zephyr audit trail <agent_id>——查询 Agent 操作轨迹
    - zephyr audit integrity——校验密码学完整性
    - zephyr audit health——自监控健康报告
  construction:
    scaffold:
      name: 法医账本
      deliverables: AuditEntryV1 完整模型 + JSONL append + 哈希链 + Lamport 时钟 + 基础查询 + 元审计
        + 完整性自检 + heartbeat
      status: 📋 Backlog
    experimental:
      name: 免疫系统
      deliverables: 分级 Provenance 全量 + HMAC 签名 + Merkle 树 + 6 异常签名 + 蓝图漂移 + Gate/RBAC
        全集成 + Dry-Run
      status: 📋 Backlog
    beta:
      name: 闭环进化
      deliverables: 三角闭环反馈 + 仪表盘 + Cold Start + 三层存储迁移 + 保留期自动执行 + CI 一致性 + PII 检测
      status: 📋 Backlog
  integration_points:
  - target: agent_rbac
    at: MOD-INF-018 §2.2
    why: 审计记录的 subject 是 AgentIdentity + permission_level 决定 provenance_depth
  - target: gate_engine
    at: MOD-INF-007 §2
    why: 门禁决策的审计记录 + 实时阻断联动
  - target: feedback_loop
    at: MOD-INF-010 §2
    why: 三角闭环反馈——审计聚合数据推送 feedback_to_policy.py
  - target: runtime_integration
    at: MOD-INF-002 §2
    why: RI-13 EventStore + RI-14 DryRunSimulator + RI-15 CostTracker 联动
  - target: drift_detector
    at: MOD-INF-023 §2
    why: 蓝图 vs 实际漂移检测的审计信号输入
  - target: database
    at: MOD-INF-012 §3
    why: SQLite 派生查询索引的存储
  - target: system_telemetry
    at: MOD-INF-015 §2
    why: 审计事件的遥测发射
  - target: shared_core
    at: MOD-INF-016 §2.6
    why: AuditEventType 枚举 + Task Schema + 韧性基座
  - target: escalation_protocol
    at: MOD-INF-022
    why: anomaly_score > 0.9 → 自动升级/委托 Owner
  - target: rollback_system
    at: MOD-INF-021
    why: drift_detected + severity=high → Checkpoint → Rollback
  decisions:
  - id: D-020-01
    summary: 两层审计粒度——任务级摘要 + 文件级明细
  - id: D-020-02
    summary: JSONL 为唯一真源（SSoT），SQLite 为派生查询索引
  - id: D-020-03
    summary: Provenance 按权限级别分级——Light/Standard/Full
  - id: D-020-04
    summary: 密码学完整性——SHA-256 哈希链 + HMAC-SHA256 + Merkle 树聚合
  - id: D-020-05
    summary: 元审计——审计系统自身操作留痕
  - id: D-020-06
    summary: 蓝图漂移检测——AI 实际操作 vs 蓝图规定
  - id: D-020-07
    summary: AI 行为异常签名——7 种自动检测模式
  - id: D-020-08
    summary: 三角闭环反馈——审计聚合数据回写 Policy 驱动规则演进
  - id: D-020-09
    summary: Lamport 逻辑时钟——多 IDE 时序一致性（不信任 OS 时钟）
  - id: D-020-10
    summary: 三层存储（热/温/冷）+ 自动分层迁移
  - id: D-020-11
    summary: 隐私脱敏——写入时自动检测 PII 并掩码/哈希
  - id: D-020-12
    summary: 保留期自动执行——dry-run 先行 + Owner 审批 + 元审计记录
  - id: D-020-13
    summary: Cold Start——git log + session-logs 回溯生成历史基线
consumer_count: 130
cost_budget:
  file: src/zephyr/shared/cost_budget.py
  entry_point: from zephyr.shared.cost_budget import CostBudget, CostBudgetExceededError, PricingTier
  key_exports:
  - symbol: CostBudget
    note: AI成本预算管理器——provider定价+累计消费追踪+硬性熔断阈值
  - symbol: CostBudgetExceededError
    note: 超出hard_limit时抛出的异常
  - symbol: PricingTier
    note: 单模型定价档位（USD/1K tokens）
  anti_patterns:
  - LLM API调用前不check_budget——必须预检+超出熔断
context_budget:
  file: src/zephyr/shared/context_budget.py
  entry_point: from zephyr.shared.context_budget import ContextBudget, TruncationStrategy, QuotaTracker
  key_exports:
  - symbol: ContextBudget
    note: 上下文预算管理器——配额分配+追踪+超预算截断
  - symbol: TruncationStrategy
    note: 截断策略枚举——NEWEST_FIRST/OLDEST_FIRST/SUMMARY_FIRST/RELEVANCE_FIRST
  - symbol: BudgetEntry
    note: 上下文条目追踪记录（key+content+tokens+priority）
  - symbol: QuotaTracker
    note: 配额使用追踪器——按租户/会话维度追踪budget消耗
  anti_patterns:
  - 上下文装配前不allocate配额——必须先分配再使用
  - 超预算后不截断——必须调用truncate截断到预算内
evals:
  file: src/zephyr/shared/evals.py
  entry_point: from zephyr.shared.evals import EvalRunner, EvalCase, EvalRubric, EvalResult
  key_exports:
  - symbol: EvalCase
    note: 评估用例——input+expected_output+阈值+标签
  - symbol: EvalRubric
    note: 评分标准——多维度权重+pass_threshold
  - symbol: EvalResult
    note: 单用例评估结果——passed/overall_score/dimension_scores
  - symbol: EvalSuiteResult
    note: 批量评估结果——pass_rate/mean_score
  - symbol: EvalRunner
    note: 批量评估执行器——run_all+regression检测
  - symbol: EvalDimension
    note: 评估维度枚举——RELEVANCE/ACCURACY/COMPLETENESS/SAFETY/EFFICIENCY
