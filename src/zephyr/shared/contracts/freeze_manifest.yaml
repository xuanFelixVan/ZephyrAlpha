# ── 变更控制规则 ──
change_control:
  frozen_means:
    - "接口签名不可变更（新增方法字段需 ADR）"
    - "字段类型不可变更（float 到 Decimal 除外）"
    - "冻结接口的 docstring 不可缩减"
    - "物理路径不可漂移"
  allowed_changes:
    - "Docstring 补充（非缩减）"
    - "Type hint 精度提升（Any 到具体类型）"
    - "Bug fix（如 dataclass 字段顺序修复）"
    - "新增 OCP 扩展点（不影响已有契约）"
  breaking_change_process:
    - "1. 提交 ADR（Architecture Decision Record）"
    - "2. 运行 ContractImpactAnalyzer 评估影响范围"
    - "3. 通知所有 consumer 和 owner"
    - "4. 更新 cross_layer_contracts.yaml + codegen 重新生成"
    - "5. 更新 freezemanifest.yaml"
