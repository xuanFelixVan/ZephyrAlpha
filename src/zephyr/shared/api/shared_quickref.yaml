  - file: test_rbac_permissions.py
    description: 角色一致?+ 覆盖?+ 序列阻断 + 不可变核?+ 成熟度边界（MOD-INF-018 L7
  - file: test_audit_integrity.py
    description: 审计哈希链连续?+ HMAC 批量验证 + Merkle 树重建（MOD-INF-020 §4
  run: python -m pytest tests/contract/ -v
common_traps:
- trap: 在模块内自定?Task/Order/Fill 等价
  consequence: 跨层数据契约断裂——消费者收到的数据类型不兼
  correct: from zephyr.shared.schema.schemas import Task
- trap: ?Path(__file__).parents[N] 自己?REPO_ROOT
  consequence: 目录重组后所有消费者一起坏
  correct: from zephyr.shared.io.paths import REPO_ROOT
- trap: catch Exception 后不处理也不重新包装?ZephyrBaseError
  consequence: 错误上下文丢失——module_id/session_id/trace_id 全无
  correct: 'except Exception as e: raise TaskError(''...'', details={''original'':
    str(e)})'
- trap: 修改 schemas.py Task 字段后不更新契约测试和蓝
  consequence: 蓝图漂移 + 消费者在下次 AI session 被误
  correct: ?Task ?更新 tests/contract/test_schema_stability.py 快照 ?更新蓝图 §2.2/§5
    跑全量测
- trap: ?shared/ 中添加外部依赖（?requests, httpx 等）
  consequence: shared/ 作为原子基座不应引入网络/IO/框架依赖
  correct: shared/ 仅依?Python 标准?+ pydantic + pyyaml
- trap: VMS Collection 写入时不?WriteTrace provenance
  consequence: 向量不可溯源——AI 自己都不知道这条向量是谁写的、为什么写的。审计链断裂
  correct: 每次写入调用 ProvenanceEnforcer.attach()——origin(agent_id/task_id) + audit_chain
    + arbitration(optional/bypass)
- trap: VMS 8 Collection 中混用嵌入维度——attempt to search across 1024d and 512d collections
    in same query
  consequence: 向量维度不匹配——ChromaDB 直接报错或返回全零相似度
  correct: EmbeddingRouter ?collection_name 自动路由；CrossCollectionRetriever 分别编码后合并结
- trap: 绕开 kb/chromadb_init.py 直接操作 ChromaDB——在 VMS 中重复初始化 ChromaDB client
  consequence: 多进程持有多 ChromaDB client ?SQLite 文件锁冲??写入被阻??数据不一
  correct: 通过 BridgeLayer 共享同一 ChromaDB client 单例；InProcessVectorMemory 是唯一 ChromaDB
    入口
- trap: 修改 rbac_roles.yaml ?immutable_core.py ?Agent 提权
  consequence: 护栏?AI 自己拆掉——权限系统形同虚
  correct: L0 Immutable Core 硬编码保护——修?agent_rbac/ 下任何文?= BLOCKED + P0 告警
- trap: 绕过 PermissionGuard 直接操作文件/MCP Tool/DB
  consequence: 权限系统白建——操作不经过检查等于门没锁
  correct: 所有写操作必须经过 Gate Engine ?PermissionGuard.check()；MCP Tool ?_base_server
    拦截
- trap: Agent 成熟度一成不变——新 Agent 和跑100个任务的 Agent 同等信任
  consequence: 不信任梯?= 要么全放要么全堵——安?效率双失
  correct: Agent 自动?L1 Intern 开始，通过任务?后验通过?零事故自动升级；安全事故自动降级
- trap: 绕过 AuditTrailWriter 直接 append JSONL ?UPDATE SQLite 审计索引
  consequence: 哈希链断?+ HMAC 签名空洞 + 审计日志不可信——篡改检测盲
  correct: 所有审计写入必须通过 writer.py AuditTrailWriter.append()——自动生?prev_hash + entry_hash
    + HMAC + Lamport tick
- trap: 在模块内自定义审计事件模型——绕?AuditEntryV1
  consequence: 跨系统审计查询断裂——event_type/lamport_clock/drift_detected 等字段缺
  correct: from zephyr.audit_trail.models import AuditEntryV1, AuditEventType
- trap: 审计查询时不记录元审计——MetaAuditLogger 被绕
  consequence: 无人知道谁查了审计日志——内部威胁盲区（对标 GOV-CMP-002 AUD-001
  correct: 每次 AuditQuery 调用自动触发 MetaAuditLogger.log_audit_query()
- trap: HMAC secret 硬编码或提交?git
  consequence: 攻击者拿?secret 后可伪造审计条目——哈希链+HMAC 双保险瓦
  correct: HMAC secret 仅存于环境变?ZEPHYR_AUDIT_HMAC_SECRET?56-bit），永远不进 git
audit_trail:
  description: 不可变、密码学完整性保证的审计追踪链——记录每?AI 动作?who/when/what/why。JSONL SSoT + 哈希链防篡改
    + HMAC 签名 + Lamport 逻辑时钟 + 异常检?+ 漂移对账 + 三角闭环反馈
  blueprint: docs/03_modules/_domain_governance/audit_trail/blueprint.md
  code_root: src/zephyr/audit_trail/
  status: draft (0% 施工)
  architecture: JSONL SSoT (append-only + tamper-evident) ?SQLite 派生索引 (查询加? ?异常检测引
    ?漂移对账??三角闭环反馈 (?Policy PR)
  files: 12
  models:
    file: audit_trail/models.py
    description: Pydantic V2 不可变审计事件模型——frozen=True + extra='forbid'。全?23 字段
    key_exports:
    - symbol: AuditEntryV1
      kind: '[contract]'
      usage: from zephyr.audit_trail.models import AuditEntryV1
      note: '审计条目 v1.0.0—?3字段: entry_id + schema_version + prev_entry_hash + entry_hash
        + hmac_signature + merkle_batch_id + lamport_clock + utc_timestamp + agent_id
        + ide_source + session_id + task_id + action_type + file_path + sha256_before/after
        + decision_basis + guard_checks_passed/failed + blueprint_expected_action
        + drift_detected/severity/detail + anomaly_detected/type/score + tokens_used
        + cost_estimate_usd + duration_ms + contains_pii + redaction_policy + retention_tier'
    - symbol: AuditEventType
      kind: '[contract]'
      note: '17 种事件类? TASK_SUMMARY / FILE_DETAIL / ANOMALY_DETECTED / PERMISSION_VIOLATION
        / BULK_OPERATION / GATE_BYPASS / OFF_HOURS_ACTIVITY / DRIFT_DETECTED / INDEX_REBUILD
        / LOG_ROTATION / TIER_MIGRATION / INTEGRITY_CHECK / INTEGRITY_FAILURE / AUDIT_QUERY
        / AUDIT_SYSTEM_HEALTH / POLICY_FEEDBACK_SENT / DRY_RUN_AUDIT / COLD_START_BOOTSTRAP'
    - symbol: TaskAuditSummary
      kind: '[contract]'
      note: '任务级审计摘要——快速浏? event_id + timestamp + agent_id + ide_source + lamport_counter
        + session_id + task_id + task_type + action_summary + files_affected + result
        + permission_level + provenance_depth + tokens_used + cost_estimate_usd +
        duration_ms'
    - symbol: FileAuditDetail
      kind: '[contract]'
      note: '文件级审计明细——问题定? event_id + task_audit_id + timestamp + lamport_counter
        + file_path + action_type(READ/WRITE/CREATE/DELETE) + sha256_before/after
        + diff_size_bytes'
    - symbol: FileActionType
      kind: '[contract]'
      note: READ / WRITE / CREATE / DELETE
    - symbol: ProvenanceDepth
      kind: '[contract]'
      note: LIGHT(always_allow) / STANDARD(auto_guard) / FULL(blocked)
    - symbol: ProvenanceLight
      note: '轻量溯源: agent_id + timestamp + action_type + ide_source + decision_brief'
    - symbol: ProvenanceStandard
      note: '标准溯源: 完整决策依据 + guard_checks_executed/passed/failed + guard_result + confidence_level'
    - symbol: ProvenanceFull
      note: '全量溯源: blocked_reason + attempted_action + rule_violated + escalation_triggered
        + escalation_target'
    anti_patterns:
    - 在模块内自定义审计事件类而不继承 AuditEntryV1——跨系统查询不可
    - 修改 AuditEntryV1 字段不更?schema_version——历史记录回读失
    - 跳过 frozen=True 可变审计条目——破?append-only 原则
  writer:
    file: audit_trail/writer.py
    description: 不可变审计写入器——JSONL append + 哈希?+ HMAC + Lamport tick。唯一写入入口
    key_exports:
    - symbol: AuditTrailWriter.append()
      note: 追加 1 条审计记录——自动计?prev_entry_hash + entry_hash + HMAC + Lamport.tick()
        ?JSONL append ?异步触发 SQLite 索引重建 (5s)
    - symbol: AuditTrailWriter.append_batch()
      note: 批量追加——单次文件锁内完?N 条写
    - symbol: AuditTrailWriter.flush()
      note: 强制刷新——立即触?SQLite 索引重建
    anti_patterns:
    - 直接 open(data/audit/audit-trail.jsonl, 'a')——绕过哈希链?HMAC 生成
    - append 后不调用异步索引重建——查询延迟超?5s
  query:
    file: audit_trail/query.py
    description: 审计查询接口——SQLite 优先 + JSONL 回退 + 查询前完整性快速校验。每次查询自动写元审计
    key_exports:
    - symbol: AuditQuery.by_task()
      note: ?task_id 查询任务级摘
    - symbol: AuditQuery.by_task_details()
      note: ?task_id 查询关联的文件级明细列表
    - symbol: AuditQuery.by_agent()
      note: ?agent_id + time_range 查询
    - symbol: AuditQuery.by_target()
      note: ?file_path 查询完整 lineage——谁操作过这个文
    - symbol: AuditQuery.by_permission_level()
      note: ?always_allow/auto_guard/blocked 过滤
    - symbol: AuditQuery.by_anomaly()
      note: ?anomaly_type + min_score 过滤异常事件
    - symbol: AuditQuery.by_drift()
      note: ?drift_severity 过滤蓝图漂移事件
    - symbol: AuditQuery.by_cost()
      note: ?min_cost_usd 查询——FinOps 审计
    - symbol: AuditQuery.trail_for_ai_context()
      note: ?AI agent 生成 Markdown 审计摘要——AI 零推理可消费
    - symbol: AuditQuery.verify_integrity()
      note: fast_mode=True 仅验 Merkle root / fast_mode=False 逐条验哈希链+HMAC
    - symbol: IntegrityReport
      note: '完整性报? is_valid + total_entries + hash_chain_breaks[] + hmac_failures[]
        + merkle_mismatches[]'
    anti_patterns:
    - 绕过 AuditQuery 直接 SQL SELECT——缺少元审计 + 完整性校
    - 查询异常事件不传 min_score——返回全量噪声（建议默认 0.7
  integrity:
    file: audit_trail/integrity.py
    description: 密码学完整性验证器——哈希链连续?/ HMAC 批量验证 / Merkle 树重建校
    key_exports:
    - symbol: verify_hash_chain()
      note: 逐条验证 prev_entry_hash ?SHA-256(prev_entry) 匹配
    - symbol: verify_hmac_batch()
      note: HMAC-SHA256(canonical_json, ZEPHYR_AUDIT_HMAC_SECRET) 批量验证
    - symbol: rebuild_merkle_tree()
      note: ?JSONL 重建 Merkle ??写入 data/audit/merkle/audit-merkle-{YYYY-MM-DDTHH}.json
  lamport_clock:
    file: audit_trail/writer.py
    description: Lamport 逻辑时钟——多 IDE 并发下的因果顺序保证。不对操作系统时钟做任何假设
    key_exports:
    - symbol: LamportClock.tick()
      note: 操作前递增 counter ?返回 (ide_source, counter)
    - symbol: LamportClock.merge(received)
      note: '接收外部事件时合? counter = max(local, received[1]) + 1'
    - symbol: audit_entry_sort_key()
      note: '全序排序? (counter, ide_source) 字典序——对?Dynamo Vector Clock 简化版'
  anomaly:
    file: audit_trail/anomaly.py
    description: AI 行为异常检测引擎—? 种异常签?+ 行为基线模型 + 自动告警。Experimental 阶段落位
    key_exports:
    - symbol: AnomalyDetector.detect()
      note: 单条目异常检测->返回 anomaly_score (0~1)
    - symbol: AnomalyDetector.detect_batch()
      note: 批量异常检测->窗口内统
    signatures:
    - id: ANM-001
      pattern: 越权操作
      severity: P0
      logic: Agent 操作了它权限级别外的文件路径
    - id: ANM-002
      pattern: 批量删除
      severity: P0
      logic: 单次任务删除 > 5 文件
    - id: ANM-003
      pattern: 门禁跳过
      severity: P0
      logic: 文件修改但无对应 guard_checks_passed
    - id: ANM-004
      pattern: 非工作时
      severity: P1
      logic: UTC 22:00-06:00 > 20 操作/小时
    - id: ANM-005
      pattern: 高频操作
      severity: P1
      logic: '> 100 文件操作/分钟'
    - id: ANM-006
      pattern: ?Agent 冲突
      severity: P1
      logic: 同一文件 5 分钟内被 3+ Agent 修改
    - id: ANM-007
      pattern: 审计日志异常
      severity: P0
      logic: 哈希链断?/ HMAC 失败 / 外部篡改
