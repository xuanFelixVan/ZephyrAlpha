  error_hierarchy:
    description: 统一异常层次——ZephyrBaseError + 12 子类。所有模?catch/throw 的唯一
    file: src/zephyr/shared/errors.py
    entry_point: from zephyr.shared.foundation.errors import ZephyrBaseError, TaskError, ...
    error_classes:
    - name: ZephyrBaseError
      parents:
      - Exception
      note: 所有业务异常的根。携?message + details(dict)
    - name: ConfigError
      note: '配置系统: YAML解析失败/Schema校验失败'
    - name: ContractError
      note: '数据契约: 跨层不匹?版本冲突'
    - name: SecurityError
      note: '安全: 权限拒绝/Token无效'
    - name: ValidationError
      note: '输入校验: 字段缺失/类型错误'
    - name: TaskError
      note: '任务系统: 状态机非法跳转/依赖死锁'
    - name: PipelineError
      note: '管线: 装配失败/步骤异常'
    - name: GateError
      note: '门禁: 判决异常/熔断器触'
    - name: EscalationError
      note: '升级协议: 升级判定异常/委托死锁/循环委托/SLA超时/置信度异?(MOD-INF-022)'
    - name: ContextError
      note: '上下文引? build(Hybrid Dense+Sparse+RRF)/compress(Qwen2.5-3B+Externalize+Evict+Queue)/validate(LSG+Hash+PrivacyScrub+ThreatModel)/inject(XML分层+双锚+Deterministic)/ops(lifecycle
        disaster-recovery chaos-test config-hot-reload) 全链路异常—?8项盲点九轮审计全覆盖'
    - name: FeedbackError
      note: '反馈循环: 自进化异?metrics失败'
    - name: DataError
      note: '数据? DB连接失败/迁移失败'
    - name: IOError
      note: 'I/O: 文件读写失败/路径不存'
    - name: UnimplementedError
      note: '施工占位: 标记已规划未实现功能'
